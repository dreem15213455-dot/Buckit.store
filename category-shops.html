<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Category Shops - ZyMart</title>
    <meta name="theme-color" content="#0B5A31">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root{--brand-green:#0B5A31;--brand-orange:#F59E0B;--neutral-white:#FFFFFF;--neutral-bg:#F9FAFB;--neutral-border:#E5E7EB;--neutral-gray:#6B7280;--neutral-dark:#1A1A1A;--shadow-xs:0 1px 2px rgba(0,0,0,0.04);--shadow-sm:0 1px 4px rgba(0,0,0,0.06);--radius-sm:10px;--radius-md:14px;--radius-lg:18px;--radius-full:9999px;}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',-apple-system,sans-serif;background:var(--neutral-bg);color:var(--neutral-dark);padding-bottom:85px;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;min-height:100vh;}
        @keyframes slideUp{from{transform:translateY(10px);opacity:0;}to{transform:translateY(0);opacity:1;}}
        @keyframes spin{to{transform:rotate(360deg);}}
        
        .top-bar{background:var(--brand-green);position:fixed;top:0;left:0;width:100%;z-index:1000;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 16px rgba(11,90,49,0.3);}
        .back-btn{width:40px;height:40px;min-width:40px;background:rgba(255,255,255,0.10);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:white;font-size:15px;text-decoration:none;}
        .back-btn:active{background:rgba(255,255,255,0.22);transform:scale(0.93);}
        .top-title{font-family:'Poppins',sans-serif;flex:1;font-size:16px;font-weight:700;color:white;}
        .brand-zy{color:#A3E635;}.brand-mart{color:#FDE047;}
        .main-content{padding-top:62px;max-width:600px;margin:0 auto;min-height:70vh;}
        .location-bar{display:flex;align-items:center;gap:6px;padding:8px 14px;background:#EDF7F1;border-bottom:1px solid #C8E6C9;font-size:11px;color:#0B5A31;cursor:pointer;}
        .nearby-badge{display:inline-block;background:#0B5A31;color:white;font-size:9px;padding:2px 8px;border-radius:9999px;font-weight:600;margin-left:4px;}
        .shop-card{background:var(--neutral-white);margin:7px 14px;border-radius:var(--radius-lg);padding:14px;display:flex;gap:12px;align-items:center;border:1px solid var(--neutral-border);box-shadow:var(--shadow-xs);cursor:pointer;animation:slideUp 0.3s ease forwards;}
        .shop-card:active{transform:scale(0.98);}
        .shop-card.nearby{border:2px solid #0B5A31;background:#F9FDF9;}
        .shop-img{width:56px;height:56px;min-width:56px;border-radius:var(--radius-sm);background:#EDF7F1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
        .shop-img img{width:100%;height:100%;object-fit:cover;}
        .shop-img i{font-size:24px;color:var(--brand-green);}
        .shop-info{flex:1;min-width:0;}
        .shop-name{font-size:14px;font-weight:600;margin-bottom:2px;}
        .shop-meta{display:flex;gap:10px;font-size:11px;color:var(--neutral-gray);flex-wrap:wrap;}
        .shop-distance{color:#0B5A31;font-weight:600;}
        .shop-arrow{color:#D1D5DB;font-size:13px;}
        .empty-state{text-align:center;padding:55px 20px;animation:slideUp 0.4s ease;}
        .empty-state i{font-size:48px;color:#D1D5DB;display:block;margin-bottom:12px;}
        .empty-state h3{font-family:'Poppins',sans-serif;font-size:16px;font-weight:700;}
        .empty-state p{font-size:13px;color:var(--neutral-gray);margin-bottom:14px;}
        .empty-state button{background:var(--brand-green);color:white;border:none;padding:10px 22px;border-radius:var(--radius-full);font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;margin:4px;}
        .bottom-nav{background:white;position:fixed;bottom:0;left:0;width:100%;display:flex;justify-content:space-around;padding:5px 10px 10px;box-shadow:0 -4px 16px rgba(0,0,0,0.03);z-index:1000;border-top:1px solid var(--neutral-border);}
        .nav-item{display:flex;flex-direction:column;align-items:center;font-size:9px;font-weight:500;color:var(--neutral-gray);cursor:pointer;padding:3px 10px;border-radius:var(--radius-full);border:none;background:transparent;font-family:'Inter',sans-serif;text-decoration:none;}
        .nav-item:active{background:#EDF7F1;}.nav-item.active{color:var(--brand-green);font-weight:600;}.nav-item i{font-size:18px;margin-bottom:1px;}
        .toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:var(--neutral-dark);color:white;padding:9px 18px;border-radius:var(--radius-full);font-size:11px;z-index:10050;opacity:0;visibility:hidden;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,0.08);transition:all 0.3s ease;}
        .toast.show{opacity:1;visibility:visible;}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="mainApp">
    <div class="top-bar">
        <a href="shop-categories.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <span class="top-title" id="pageTitle"><span class="brand-zy">Zy</span><span class="brand-mart">Mart</span> Shops</span>
    </div>
    <div class="main-content" id="mainContent">
        <div style="text-align:center;padding:40px;"><div style="width:34px;height:34px;border:2.5px solid #E5E7EB;border-top-color:#F59E0B;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto;"></div></div>
    </div>
</div>

<nav class="bottom-nav">
    <a class="nav-item" href="index.html"><i class="fas fa-home"></i><span>Home</span></a>
    <a class="nav-item" href="products.html"><i class="fas fa-box"></i><span>Products</span></a>
    <a class="nav-item" href="cart.html"><i class="fas fa-shopping-cart"></i><span>Cart</span></a>
    <a class="nav-item" href="profile.html"><i class="fas fa-user"></i><span>Profile</span></a>
    <a class="nav-item active"><i class="fas fa-store"></i><span>Shops</span></a>
</nav>

<div class="toast" id="toastMsg"></div>

<script>
(function(){'use strict';
var sb=supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co','sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1');
var SUPABASE_URL='https://zwajyovemwdqtkecipeb.supabase.co';
var categoryId=null,categoryName='',nearbyShopIds=[],shopDistances={},userLat=null,userLng=null;
try{var p=new URLSearchParams(window.location.search);categoryId=p.get('id');categoryName=p.get('name')||'Shops';}catch(e){}
function $(id){return document.getElementById(id);}
function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function getFullUrl(u){if(!u||typeof u!=='string')return'';if(u.indexOf('http')===0)return u;return SUPABASE_URL+'/storage/v1/object/public/'+u;}
window.fastNavigate=function(url){window.location.href=url;};

function calculateDistance(lat1,lng1,lat2,lng2){var R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180,a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}

function loadLocationAndSort(shops){
var lat=parseFloat(localStorage.getItem('user_lat')||'0')||null,lng=parseFloat(localStorage.getItem('user_lng')||'0')||null,ts=parseInt(localStorage.getItem('location_timestamp')||'0');
if(!lat||!lng||(Date.now()-ts)>86400000)return shops;
userLat=lat;userLng=lng;nearbyShopIds=[];shopDistances={};
for(var i=0;i<shops.length;i++){var shop=shops[i];if(!shop.latitude||!shop.longitude)continue;var dist=calculateDistance(userLat,userLng,shop.latitude,shop.longitude);shopDistances[shop.id]=Math.round(dist*10)/10;if(dist<=(shop.delivery_radius_km||10))nearbyShopIds.push(shop.id);}
return shops.sort(function(a,b){var aN=nearbyShopIds.indexOf(a.id)!==-1,bN=nearbyShopIds.indexOf(b.id)!==-1;if(aN&&!bN)return-1;if(!aN&&bN)return 1;return 0;});
}

async function loadShops(){
var c=$('mainContent');if(!c)return;
try{
var decodedName=decodeURIComponent(categoryName);$('pageTitle').innerHTML='<span class="brand-zy">Zy</span><span class="brand-mart">Mart</span> '+esc(decodedName);
if(!categoryId){c.innerHTML='<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>Category Not Found</h3><a href="shop-categories.html" style="background:var(--brand-green);color:white;border:none;padding:10px 22px;border-radius:var(--radius-full);font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;">All Categories</a></div>';return;}
var r=await sb.from('shops').select('*').eq('status','approved').eq('category_id',categoryId).order('rating',{ascending:false});
var shops=(r&&r.data)?r.data:[];
shops=loadLocationAndSort(shops);
if(!shops.length){c.innerHTML='<div class="empty-state"><i class="fas fa-store-slash"></i><h3>No Shops Found</h3><p>No shops in this category yet</p><a href="shop-categories.html" style="background:var(--brand-green);color:white;border:none;padding:10px 22px;border-radius:var(--radius-full);font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;">All Categories</a></div>';return;}
var locShort=localStorage.getItem('location_short')||'',h='';
if(locShort&&userLat&&userLng){h+='<div class="location-bar" onclick="window.location.href=\'location.html\'"><i class="fas fa-map-marker-alt"></i><span>📍 '+locShort;if(nearbyShopIds.length>0)h+=' <span class="nearby-badge">'+nearbyShopIds.length+' nearby</span>';h+='</span></div>';}
for(var i=0;i<shops.length;i++){var s=shops[i],imgUrl=getFullUrl(s.image_url),isNearby=nearbyShopIds.indexOf(s.id)!==-1,dist=shopDistances[s.id]||null;h+='<div class="shop-card'+(isNearby?' nearby':'')+'" onclick="fastNavigate(\'shop-details.html?id='+s.id+'\')"><div class="shop-img">'+(imgUrl?'<img src="'+imgUrl+'" loading="lazy">':'<i class="fas fa-store"></i>')+'</div><div class="shop-info"><div class="shop-name">'+esc(s.name)+'</div><div class="shop-meta"><span><i class="fas fa-star"></i> '+(s.rating||'4.0')+'</span><span><i class="fas fa-map-pin"></i> '+esc(s.city||'Location')+'</span>';if(dist!==null)h+='<span class="shop-distance">📍 '+dist+' km</span>';h+='</div></div><i class="fas fa-chevron-right shop-arrow"></i></div>';}
c.innerHTML=h;
}catch(e){c.innerHTML='<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>Failed to Load</h3><button onclick="loadShops()">🔄 Retry</button></div>';}
}
document.addEventListener('DOMContentLoaded',loadShops);
})();
</script>
</body>
</html>
