<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Category Shops - Zatpat</title>
    <meta name="theme-color" content="#16A34A">
    
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #16A34A;
            --primary-light: #22C55E;
            --primary-bg-light: #F0FDF4;
            --accent-orange: #F97316;
            --bg-white: #FFFFFF;
            --bg-light: #F9FAFB;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --border-light: #E5E7EB;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-full: 9999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
            overflow-x: hidden;
            padding-bottom: 85px;
            -webkit-font-smoothing: antialiased;
        }

        #pageProgress {
            position: fixed; top: 0; left: 0; width: 0%; height: 3px;
            background: var(--primary); z-index: 10001; transition: width 0.3s ease;
        }
        #pageProgress.loading { width: 90%; }
        #pageProgress.complete { width: 100%; opacity: 0; transition: opacity 0.3s; }

        /* Top Bar */
        .top-bar {
            background: var(--bg-white); position: sticky; top: 0; left: 0; width: 100%;
            z-index: 1000; padding: 8px 12px; box-shadow: var(--shadow-sm);
            border-bottom: 1px solid var(--border-light); display: flex; align-items: center; gap: 12px;
        }
        .back-btn {
            width: 40px; height: 40px; background: var(--bg-light); border-radius: var(--radius-full);
            display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
        }
        .back-btn i { font-size: 18px; color: var(--text-primary); }
        .top-title {
            flex: 1; font-size: 17px; font-weight: 700; color: var(--text-primary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .cart-btn {
            width: 40px; height: 40px; background: var(--bg-light); border-radius: var(--radius-full);
            display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative;
        }
        .cart-badge {
            position: absolute; top: -2px; right: -2px; background: var(--primary); color: white;
            border-radius: 50%; width: 18px; height: 18px; font-size: 9px; display: flex;
            align-items: center; justify-content: center; border: 2px solid white; font-weight: 700;
        }

        /* Category Header */
        .category-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            padding: 24px 20px; color: white;
        }
        .category-name {
            font-size: 24px; font-weight: 800; margin-bottom: 4px;
        }
        .category-count {
            font-size: 13px; opacity: 0.9;
        }

        /* Main Content */
        .main-content { padding: 16px; }

        /* Filter Bar */
        .filter-bar {
            display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
        }
        .filter-chip {
            padding: 8px 16px; background: var(--bg-white); border-radius: var(--radius-full);
            font-size: 12px; font-weight: 500; color: var(--text-secondary);
            border: 1px solid var(--border-light); cursor: pointer;
        }
        .filter-chip.active {
            background: var(--primary); color: white; border-color: var(--primary);
        }

        /* Shops List */
        .shops-list {
            display: flex; flex-direction: column; gap: 12px;
        }
        
        .shop-card {
            background: var(--bg-white); border-radius: var(--radius-lg);
            padding: 16px; display: flex; gap: 14px; cursor: pointer;
            border: 1px solid var(--border-light); box-shadow: var(--shadow-sm);
            transition: all 0.2s;
        }
        .shop-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        
        .shop-image {
            width: 70px; height: 70px; background: var(--primary-bg-light);
            border-radius: var(--radius-md); flex-shrink: 0; overflow: hidden;
        }
        .shop-image img { width: 100%; height: 100%; object-fit: cover; }
        .shop-image i { font-size: 32px; color: var(--primary); display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
        
        .shop-info { flex: 1; }
        .shop-name {
            font-size: 16px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px;
            display: flex; align-items: center; gap: 6px;
        }
        .verified-badge { color: var(--primary); font-size: 12px; }
        .shop-desc {
            font-size: 12px; color: var(--text-secondary); margin-bottom: 8px;
            display: flex; align-items: center; gap: 12px;
        }
        .shop-meta {
            display: flex; align-items: center; gap: 12px;
        }
        .shop-rating {
            display: flex; align-items: center; gap: 3px; background: var(--primary); color: white;
            padding: 2px 8px; border-radius: var(--radius-full); font-size: 11px; font-weight: 600;
        }
        .shop-distance, .shop-time {
            font-size: 11px; color: var(--text-secondary);
        }
        .shop-status {
            margin-left: auto; padding: 4px 10px; border-radius: var(--radius-full);
            font-size: 10px; font-weight: 600;
        }
        .status-open { background: #D1FAE5; color: #059669; }
        .status-closed { background: #FEE2E2; color: #DC2626; }

        /* Empty State */
        .empty-state {
            text-align: center; padding: 60px 20px;
        }
        .empty-state i { font-size: 48px; color: var(--border-light); margin-bottom: 16px; }

        /* Toast */
        .toast-notification {
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
            background: var(--text-primary); color: white; padding: 10px 20px;
            border-radius: var(--radius-full); font-size: 12px; z-index: 10050;
            display: none; white-space: nowrap;
        }
        .toast-notification.show { display: flex; }

        /* Bottom Navigation */
        .bottom-nav {
            background: white; position: fixed; bottom: 0; left: 0; width: 100%;
            display: flex; justify-content: space-around; padding: 6px 16px 8px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.06); z-index: 1000;
            border-top: 1px solid var(--border-light);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            font-size: 10px; font-weight: 500; color: var(--text-secondary); cursor: pointer; position: relative;
        }
        .nav-item i { font-size: 20px; margin-bottom: 2px; }
        .cart-count {
            position: absolute; top: -5px; right: -5px; background: var(--primary); color: white;
            border-radius: 50%; width: 16px; height: 16px; font-size: 9px; display: flex;
            align-items: center; justify-content: center; border: 2px solid white;
        }

        .loading-spinner { text-align: center; padding: 60px; }
        .spinner {
            width: 40px; height: 40px; border: 3px solid var(--border-light);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="pageProgress"></div>
<div id="toastMsg" class="toast-notification"><span id="toastText"></span></div>

<div id="mainApp">
    <div class="top-bar">
        <div class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
        <div class="top-title" id="pageTitle">Category Shops</div>
        <div class="cart-btn" onclick="fastNavigate('cart.html')">
            <i class="fas fa-shopping-bag"></i>
            <span class="cart-badge" id="cartBadge">0</span>
        </div>
    </div>

    <div id="categoryHeader" class="category-header">
        <div class="category-name" id="categoryName">Loading...</div>
        <div class="category-count" id="categoryCount"></div>
    </div>

    <div class="main-content" id="mainContent">
        <div class="loading-spinner"><div class="spinner"></div></div>
    </div>

    <nav class="bottom-nav">
        <a class="nav-item" onclick="fastNavigate('index.html')"><i class="fas fa-home"></i><span>Home</span></a>
        <a class="nav-item" onclick="fastNavigate('products.html')"><i class="fas fa-search"></i><span>Explore</span></a>
        <a class="nav-item" onclick="fastNavigate('cart.html')"><i class="fas fa-shopping-bag"></i><span>Cart</span><span class="cart-count" id="cartCount">0</span></a>
        <a class="nav-item" onclick="fastNavigate('profile.html')"><i class="fas fa-user"></i><span>Profile</span></a>
        <a class="nav-item" onclick="fastNavigate('orders.html')"><i class="fas fa-receipt"></i><span>Orders</span></a>
    </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const supabaseUrl = 'https://zwajyovemwdqtkecipeb.supabase.co';
    const supabaseKey = 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1';
    const zatpatDB = supabase.createClient(supabaseUrl, supabaseKey);

    const urlParams = new URLSearchParams(window.location.search);
    const categoryName = urlParams.get('category') || urlParams.get('name') || 'Grocery';

    let allShops = [];
    let filteredShops = [];
    let currentFilter = 'all';

    function startProgress() { const b = document.getElementById('pageProgress'); b.style.width = '0%'; b.classList.add('loading'); setTimeout(() => b.style.width = '90%', 10); }
    function completeProgress() { const b = document.getElementById('pageProgress'); b.classList.remove('loading'); b.classList.add('complete'); setTimeout(() => { b.style.width = '0%'; b.classList.remove('complete'); }, 300); }
    window.fastNavigate = function(url) { startProgress(); setTimeout(() => window.location.href = url, 50); };
    function goBack() { window.history.back(); }

    function showToast(msg) {
        const t = document.getElementById('toastMsg');
        document.getElementById('toastText').innerHTML = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    function updateCartBadge() {
        const cart = JSON.parse(localStorage.getItem('zatpat_cart')) || [];
        const count = cart.reduce((s, i) => s + (i.quantity || 1), 0);
        document.getElementById('cartBadge').innerText = count;
        document.getElementById('cartCount').innerText = count;
    }

    async function loadShops() {
        try {
            document.getElementById('categoryName').innerText = categoryName;
            document.getElementById('pageTitle').innerText = categoryName + ' Shops';

            const { data: shops } = await zatpatDB
                .from('shops')
                .select('*')
                .eq('status', 'approved')
                .eq('category', categoryName)
                .order('rating', { ascending: false });

            allShops = shops || [];
            
            // Mock data if empty
            if (allShops.length === 0) {
                allShops = [
                    { id: '1', name: categoryName + ' Mart', category: categoryName, rating: 4.5, is_open: true, distance: '0.5 km', delivery_time: '15 min', image_url: null, address: 'Main Road, Sillod' },
                    { id: '2', name: categoryName + ' Express', category: categoryName, rating: 4.2, is_open: true, distance: '1.2 km', delivery_time: '25 min', image_url: null, address: 'Market Area, Sillod' },
                    { id: '3', name: categoryName + ' Hub', category: categoryName, rating: 4.8, is_open: false, distance: '0.8 km', delivery_time: '20 min', image_url: null, address: 'Station Road, Sillod' }
                ];
            }

            filteredShops = [...allShops];
            document.getElementById('categoryCount').innerText = `${filteredShops.length} shops`;
            renderShops();
        } catch (e) {
            console.error('Load error:', e);
        }
    }

    function renderShops() {
        const container = document.getElementById('mainContent');

        if (filteredShops.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-store-slash"></i>
                    <h3>No shops found</h3>
                    <p style="color: var(--text-secondary);">Try another category</p>
                </div>
            `;
            return;
        }

        let html = `
            <div class="filter-bar">
                <div class="filter-chip ${currentFilter === 'all' ? 'active' : ''}" onclick="filterShops('all')">All (${allShops.length})</div>
                <div class="filter-chip ${currentFilter === 'open' ? 'active' : ''}" onclick="filterShops('open')">Open Now</div>
                <div class="filter-chip ${currentFilter === 'rating' ? 'active' : ''}" onclick="filterShops('rating')">4.0+ Rating</div>
            </div>
            <div class="shops-list">
        `;

        filteredShops.forEach(shop => {
            const rating = shop.rating || 4.0;
            const distance = shop.distance || `${(Math.random() * 2 + 0.5).toFixed(1)} km`;
            const deliveryTime = shop.delivery_time || `${Math.floor(Math.random() * 20 + 10)} min`;

            html += `
                <div class="shop-card" onclick="fastNavigate('shop-details.html?id=${shop.id}')">
                    <div class="shop-image">
                        ${shop.image_url ? `<img src="${shop.image_url}" loading="lazy">` : '<i class="fas fa-store"></i>'}
                    </div>
                    <div class="shop-info">
                        <div class="shop-name">
                            ${shop.name}
                            ${rating >= 4.5 ? '<span class="verified-badge"><i class="fas fa-check-circle"></i></span>' : ''}
                        </div>
                        <div class="shop-desc">
                            <span><i class="fas fa-map-pin"></i> ${shop.address || 'Sillod'}</span>
                        </div>
                        <div class="shop-meta">
                            <span class="shop-rating"><i class="fas fa-star"></i> ${rating}</span>
                            <span class="shop-distance"><i class="fas fa-location-dot"></i> ${distance}</span>
                            <span class="shop-time"><i class="fas fa-clock"></i> ${deliveryTime}</span>
                            <span class="shop-status ${shop.is_open ? 'status-open' : 'status-closed'}">
                                ${shop.is_open ? 'Open' : 'Closed'}
                            </span>
                        </div>
                    </div>
                </div>
            `;
        });

        html += '</div>';
        container.innerHTML = html;
    }

    window.filterShops = function(filter) {
        currentFilter = filter;
        
        if (filter === 'all') {
            filteredShops = [...allShops];
        } else if (filter === 'open') {
            filteredShops = allShops.filter(s => s.is_open);
        } else if (filter === 'rating') {
            filteredShops = allShops.filter(s => (s.rating || 0) >= 4.0);
        }
        
        renderShops();
    };

    document.addEventListener('DOMContentLoaded', () => {
        updateCartBadge();
        loadShops();
    });

    window.goBack = goBack;
    window.filterShops = filterShops;
</script>
</body>
</html>
