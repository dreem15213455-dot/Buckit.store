<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Category Shops - ZyMart+</title>
    <meta name="theme-color" content="#0B5A31">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root{--brand-green:#0B5A31;--brand-green-dark:#083D21;--brand-orange:#F59E0B;--brand-orange-dark:#E8890A;--neutral-white:#FFFFFF;--neutral-bg:#F8FAF9;--neutral-border:#E5E7EB;--neutral-gray:#6B7280;--neutral-dark:#1A1A1A;--danger:#EF4444;--success:#10B981;--shadow-xs:0 1px 2px rgba(0,0,0,0.04);--shadow-sm:0 2px 8px rgba(0,0,0,0.06);--shadow-md:0 4px 16px rgba(0,0,0,0.08);--shadow-lg:0 8px 30px rgba(0,0,0,0.10);--radius-sm:10px;--radius-md:14px;--radius-lg:18px;--radius-xl:22px;--radius-full:9999px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',-apple-system,sans-serif;background:var(--neutral-bg);color:var(--neutral-dark);padding-bottom:85px;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;min-height:100vh}
        @keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(11,90,49,0.4)}50%{box-shadow:0 0 0 8px rgba(11,90,49,0)}}
        
        .top-bar{background:linear-gradient(135deg,var(--brand-green),var(--brand-green-dark));position:fixed;top:0;left:0;width:100%;z-index:1000;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 20px rgba(11,90,49,0.3)}
        .back-btn{width:40px;height:40px;min-width:40px;background:rgba(255,255,255,0.12);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:white;font-size:15px;text-decoration:none;transition:all 0.15s ease}
        .back-btn:active{background:rgba(255,255,255,0.25);transform:scale(0.93)}
        .top-title{font-family:'Poppins',sans-serif;flex:1;font-size:17px;font-weight:700;color:white;display:flex;align-items:center;gap:6px}
        .brand-zy{color:#A3E635}.brand-mart{color:#FDE047}
        .top-count{font-size:11px;color:rgba(255,255,255,0.8);background:rgba(255,255,255,0.15);padding:4px 10px;border-radius:var(--radius-full)}
        
        .main-content{padding-top:62px;max-width:650px;margin:0 auto;min-height:70vh}
        
        .category-hero{background:linear-gradient(135deg,#EDF7F1,#D1FAE5);margin:12px 14px;padding:18px 20px;border-radius:var(--radius-xl);display:flex;align-items:center;gap:14px;animation:slideUp 0.3s ease;border:1px solid #A7F3D0}
        .category-icon{width:56px;height:56px;min-width:56px;background:white;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:var(--shadow-sm)}
        .category-info h2{font-family:'Poppins',sans-serif;font-size:18px;font-weight:700;color:var(--brand-green-dark)}
        .category-info p{font-size:12px;color:var(--neutral-gray);margin-top:2px}
        
        .location-bar{display:flex;align-items:center;gap:8px;margin:0 14px 8px;padding:10px 14px;background:white;border-radius:var(--radius-md);font-size:12px;color:var(--brand-green);cursor:pointer;border:1px solid var(--neutral-border);box-shadow:var(--shadow-xs);animation:slideUp 0.3s ease}
        .location-bar:active{background:#EDF7F1}
        .location-dot{width:10px;height:10px;background:var(--success);border-radius:50%;animation:pulse 2s infinite}
        .nearby-badge{background:var(--brand-green);color:white;font-size:10px;padding:3px 10px;border-radius:9999px;font-weight:600;margin-left:auto}
        
        .sort-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;font-size:11px;color:var(--neutral-gray)}
        .sort-option{cursor:pointer;padding:4px 12px;border-radius:var(--radius-full);font-weight:500;transition:all 0.15s ease}
        .sort-option.active{background:var(--brand-green);color:white;font-weight:600}
        
        .shops-list{padding:0 14px}
        .shop-card{background:var(--neutral-white);margin-bottom:10px;border-radius:var(--radius-lg);padding:16px;display:flex;gap:14px;align-items:center;border:1px solid var(--neutral-border);box-shadow:var(--shadow-xs);cursor:pointer;animation:slideUp 0.35s ease forwards;transition:all 0.15s ease;position:relative;overflow:hidden}
        .shop-card:active{transform:scale(0.98)}
        .shop-card.nearby{border:2px solid var(--brand-green);background:linear-gradient(135deg,#F9FDF9,#FFFFFF)}
        .shop-card.nearby::before{content:'📍 Nearby';position:absolute;top:8px;right:8px;background:var(--brand-green);color:white;font-size:8px;padding:3px 8px;border-radius:9999px;font-weight:600;z-index:1}
        .shop-card.featured{border-left:3px solid var(--brand-orange)}
        
        .shop-img{width:64px;height:64px;min-width:64px;border-radius:var(--radius-md);background:linear-gradient(135deg,#EDF7F1,#D1FAE5);display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid #C8E6C9}
        .shop-img img{width:100%;height:100%;object-fit:cover}
        .shop-img i{font-size:28px;color:var(--brand-green)}
        
        .shop-info{flex:1;min-width:0}
        .shop-name{font-size:15px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px}
        .shop-rating{display:inline-flex;align-items:center;gap:3px;background:#FFF8EB;color:#D97706;padding:2px 8px;border-radius:var(--radius-full);font-size:11px;font-weight:700}
        .shop-rating i{font-size:9px}
        .shop-meta{display:flex;gap:12px;font-size:11px;color:var(--neutral-gray);flex-wrap:wrap;margin-top:3px}
        .shop-meta span{display:flex;align-items:center;gap:3px}
        .shop-distance{color:var(--brand-green);font-weight:700;background:#EDF7F1;padding:2px 8px;border-radius:var(--radius-full);font-size:10px}
        .shop-arrow{color:#D1D5DB;font-size:16px;transition:transform 0.15s ease}
        .shop-card:active .shop-arrow{transform:translateX(4px)}
        
        .empty-state{text-align:center;padding:60px 20px;animation:fadeIn 0.4s ease}
        .empty-icon{width:80px;height:80px;background:#F3F5F4;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
        .empty-icon i{font-size:36px;color:#D1D5DB}
        .empty-state h3{font-family:'Poppins',sans-serif;font-size:18px;font-weight:700;margin-bottom:6px}
        .empty-state p{font-size:13px;color:var(--neutral-gray);margin-bottom:16px;line-height:1.5}
        .btn-primary{background:var(--brand-green);color:white;border:none;padding:12px 24px;border-radius:var(--radius-full);font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:all 0.15s ease}
        .btn-primary:active{background:var(--brand-green-dark);transform:scale(0.96)}
        .btn-outline{background:white;color:var(--brand-green);border:2px solid var(--brand-green);padding:10px 20px;border-radius:var(--radius-full);font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
        
        .bottom-nav{background:white;position:fixed;bottom:0;left:0;width:100%;display:flex;justify-content:space-around;padding:5px 10px 10px;box-shadow:0 -4px 20px rgba(0,0,0,0.05);z-index:1000;border-top:1px solid var(--neutral-border)}
        .nav-item{display:flex;flex-direction:column;align-items:center;font-size:9px;font-weight:500;color:var(--neutral-gray);cursor:pointer;padding:3px 10px;border-radius:var(--radius-full);border:none;background:transparent;font-family:'Inter',sans-serif;text-decoration:none;transition:all 0.15s ease}
        .nav-item:active{background:#EDF7F1}.nav-item.active{color:var(--brand-green);font-weight:700}.nav-item i{font-size:18px;margin-bottom:1px}
        
        .loading-state{text-align:center;padding:60px 20px}
        .loading-spinner{width:40px;height:40px;border:3px solid #E5E7EB;border-top-color:var(--brand-orange);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 16px}
        .loading-text{font-size:13px;color:var(--neutral-gray)}
        
        .toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:var(--neutral-dark);color:white;padding:10px 20px;border-radius:var(--radius-full);font-size:12px;z-index:10050;opacity:0;visibility:hidden;white-space:nowrap;box-shadow:var(--shadow-md);transition:all 0.3s ease}
        .toast.show{opacity:1;visibility:visible}
        .toast.error{background:var(--danger)}.toast.success{background:var(--success)}
        
        @media(max-width:380px){.shop-img{width:52px;height:52px;min-width:52px}.shop-name{font-size:14px}.shop-card{padding:12px;gap:10px}}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="mainApp">
    <div class="top-bar">
        <a href="shop-categories.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <span class="top-title"><span class="brand-zy">Zy</span><span class="brand-mart">Mart</span></span>
        <span class="top-count" id="shopCount">0 shops</span>
    </div>
    
    <div class="main-content" id="mainContent">
        <div class="loading-state"><div class="loading-spinner"></div><p class="loading-text">Finding shops near you...</p></div>
    </div>
</div>

<nav class="bottom-nav">
    <a class="nav-item" href="index.html"><i class="fas fa-home"></i><span>Home</span></a>
    <a class="nav-item" href="products.html"><i class="fas fa-box"></i><span>Browse</span></a>
    <a class="nav-item" href="cart.html"><i class="fas fa-shopping-cart"></i><span>Cart</span></a>
    <a class="nav-item" href="orders.html"><i class="fas fa-receipt"></i><span>Orders</span></a>
    <a class="nav-item active"><i class="fas fa-store"></i><span>Shops</span></a>
</nav>

<div class="toast" id="toastMsg"><span id="toastText"></span></div>

<script>
(function(){'use strict';
window.addEventListener('error',function(e){console.error('[Category]',e.message);try{showToast('Something went wrong','error');}catch(_){}});

var sb=supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co','sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1');
var SUPABASE_URL='https://zwajyovemwdqtkecipeb.supabase.co';
var categoryId=null,categoryName='',nearbyShopIds=[],shopDistances={},userLat=null,userLng=null;
var allShops=[],currentSort='nearby';

try{var p=new URLSearchParams(window.location.search);categoryId=p.get('id');categoryName=p.get('name')||'Shops';}catch(e){}

function $(id){return document.getElementById(id);}
function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function getFullUrl(u){if(!u||typeof u!=='string')return'';if(u.indexOf('http')===0||u.indexOf('data:')===0)return u;return SUPABASE_URL+'/storage/v1/object/public/'+u;}
function showToast(m,type){var t=$('toastMsg'),s=$('toastText');if(!t||!s)return;s.textContent=m;t.className='toast';if(type==='error')t.classList.add('error');else if(type==='success')t.classList.add('success');t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show','error','success');},2500);}
window.fastNavigate=function(url){window.location.href=url;};

function calculateDistance(lat1,lng1,lat2,lng2){var R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180,a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}

function loadLocationAndSort(shops){
var lat=parseFloat(localStorage.getItem('user_lat')||'0')||null,lng=parseFloat(localStorage.getItem('user_lng')||'0')||null,ts=parseInt(localStorage.getItem('location_timestamp')||'0');
if(!lat||!lng||(Date.now()-ts)>86400000)return shops;
userLat=lat;userLng=lng;nearbyShopIds=[];shopDistances={};
for(var i=0;i<shops.length;i++){var shop=shops[i];if(!shop.latitude||!shop.longitude)continue;var dist=calculateDistance(userLat,userLng,shop.latitude,shop.longitude);shopDistances[shop.id]=Math.round(dist*10)/10;if(dist<=(shop.delivery_radius_km||10))nearbyShopIds.push(shop.id);}
return shops;
}

function getSortedShops(){
if(currentSort==='rating')return allShops.slice().sort(function(a,b){return(b.rating||0)-(a.rating||0);});
return allShops.slice().sort(function(a,b){
var aN=nearbyShopIds.indexOf(a.id)!==-1,bN=nearbyShopIds.indexOf(b.id)!==-1;
if(aN&&!bN)return-1;if(!aN&&bN)return 1;
var aD=shopDistances[a.id]||999,bD=shopDistances[b.id]||999;
return aD-bD;
});
}

window.setSort=function(sort,btn){currentSort=sort;document.querySelectorAll('.sort-option').forEach(function(x){x.classList.remove('active');});btn.classList.add('active');renderShops();};

function renderShops(){
var c=$('mainContent');if(!c)return;
var decodedName=decodeURIComponent(categoryName);
var locShort=localStorage.getItem('location_short')||'';

var h='';
// Category hero
h+='<div class="category-hero"><div class="category-icon">🏪</div><div class="category-info"><h2>'+esc(decodedName)+'</h2><p>Browse shops in this category</p></div></div>';

// Location bar
if(locShort&&userLat&&userLng){
h+='<div class="location-bar" onclick="window.location.href=\'set-location.html\'"><div class="location-dot"></div><span>📍 '+esc(locShort)+'</span>'+'<span class="nearby-badge">'+nearbyShopIds.length+' nearby</span></div>';
}

// Sort bar
h+='<div class="sort-bar"><span>'+allShops.length+' shops</span><div><span class="sort-option'+(currentSort==='nearby'?' active':'')+'" onclick="setSort(\'nearby\',this)">📍 Nearby</span><span class="sort-option'+(currentSort==='rating'?' active':'')+'" onclick="setSort(\'rating\',this)">⭐ Rating</span></div></div>';

// Shops list
var sorted=getSortedShops();
h+='<div class="shops-list">';
for(var i=0;i<sorted.length;i++){
var s=sorted[i],imgUrl=getFullUrl(s.image_url||s.shop_image),isNearby=nearbyShopIds.indexOf(s.id)!==-1,dist=shopDistances[s.id]||null;
h+='<div class="shop-card'+(isNearby?' nearby':'')+'" onclick="fastNavigate(\'shop-details.html?id='+s.id+'\')" style="animation-delay:'+(i*0.05)+'s">';
h+='<div class="shop-img">'+(imgUrl?'<img src="'+imgUrl+'" loading="lazy" onerror="this.innerHTML=\'<i class=\\\'fas fa-store\\\'></i>\'">':'<i class="fas fa-store"></i>')+'</div>';
h+='<div class="shop-info"><div class="shop-name">'+esc(s.name||s.shop_name||'Shop')+'<span class="shop-rating"><i class="fas fa-star"></i> '+(s.rating||'4.0')+'</span></div>';
h+='<div class="shop-meta"><span><i class="fas fa-map-pin"></i> '+esc(s.city||'Location')+'</span>';
if(dist!==null)h+='<span class="shop-distance">📍 '+dist+' km</span>';
if(s.is_open)h+='<span style="color:#10B981;">🟢 Open</span>';
h+='</div></div><i class="fas fa-chevron-right shop-arrow"></i></div>';
}
h+='</div>';

$('shopCount').textContent=allShops.length+' shop'+(allShops.length!==1?'s':'');

if(!sorted.length){
h='<div class="empty-state"><div class="empty-icon"><i class="fas fa-store-slash"></i></div><h3>No Shops Found</h3><p>No shops available in "'+esc(decodedName)+'" yet.<br>Check back soon!</p><a href="shop-categories.html" class="btn-primary"><i class="fas fa-tags"></i> All Categories</a><br><br><button class="btn-outline" onclick="window.location.href=\'index.html\'"><i class="fas fa-home"></i> Go Home</button></div>';
}
c.innerHTML=h;
}

async function loadShops(){
var c=$('mainContent');if(!c)return;
try{
var decodedName=decodeURIComponent(categoryName);
document.title=decodedName+' Shops - ZyMart+';

if(!categoryId){
c.innerHTML='<div class="empty-state"><div class="empty-icon"><i class="fas fa-exclamation-circle"></i></div><h3>Category Not Found</h3><p>No category selected</p><a href="shop-categories.html" class="btn-primary"><i class="fas fa-tags"></i> Browse Categories</a></div>';
return;
}

var r=await sb.from('shops').select('*').eq('status','approved').eq('is_open',true);
if(r&&r.data){
// Filter by category (using category field which stores category name)
var decoded=decodeURIComponent(categoryName).toLowerCase();
allShops=r.data.filter(function(s){
var shopCat=(s.category||'').toLowerCase();
return shopCat===decoded || shopCat.includes(decoded) || decoded.includes(shopCat);
});
}

allShops=loadLocationAndSort(allShops);
renderShops();

}catch(e){
console.error('[Category] Error:',e);
c.innerHTML='<div class="empty-state"><div class="empty-icon"><i class="fas fa-exclamation-circle"></i></div><h3>Failed to Load</h3><p>Please check your connection</p><button class="btn-primary" onclick="loadShops()"><i class="fas fa-redo"></i> Retry</button></div>';
}
}

document.addEventListener('DOMContentLoaded',loadShops);
})();
</script>
</body>
</html>
