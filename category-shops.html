        .loading-text{font-size:12px;color:var(--neutral-gray)}
        
        .toast{position:fixed;bottom:calc(95px + var(--safe-bottom));left:50%;transform:translateX(-50%);background:var(--neutral-dark);color:white;padding:10px 20px;border-radius:var(--radius-full);font-size:12px;z-index:10050;opacity:0;visibility:hidden;white-space:nowrap;box-shadow:var(--shadow-md);transition:all 0.3s ease;max-width:90%;overflow:hidden;text-overflow:ellipsis}
        .toast.show{opacity:1;visibility:visible}
        .toast.error{background:var(--danger)}.toast.success{background:var(--success)}
        
        @media(max-width:380px){
            .sidebar{width:80px;min-width:80px}

            .sidebar-cat-img{width:44px;height:44px}
            .shop-img{width:50px;height:50px;min-width:50px}
            .shop-name{font-size:13px}
            .shop-card{padding:11px;gap:9px}
            .category-hero{padding:12px 14px}
        }
    </style>

<script>
(function(){'use strict';

if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').catch(function(err) {
            console.warn('[Category] SW registration failed:', err.message);
        });

}

window.addEventListener('error',function(e){console.error('[Category]',e.message);try{showToast('Something went wrong','error');}catch(_){}});
window.addEventListener('offline',function(){var b=document.getElementById('netBanner');if(b)b.style.display='block';});
window.addEventListener('online',function(){var b=document.getElementById('netBanner');if(b)b.style.display='none';});

var IMG_FALLBACK = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="#F3F4F6" width="100" height="100"/><circle cx="50" cy="42" r="13" fill="#D1D5DB"/><rect x="34" y="60" width="32" height="7" rx="3.5" fill="#D1D5DB"/></svg>');
window.addEventListener('error', function(e) {
    var el = e.target;
    if (el && el.tagName === 'IMG' && !el.dataset.fb) {
        el.dataset.fb = '1';
        el.onerror = null;
        el.src = IMG_FALLBACK;
    }
}, true);

var CONFIG = {
    SUPABASE_URL: 'https://zwajyovemwdqtkecipeb.supabase.co',
    SUPABASE_KEY: 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1',
    CLOUDINARY_CLOUD_NAME: 'b0zm0rac',
    CLOUDINARY_ENABLED: true
};

var sb=supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
var SUPABASE_URL=CONFIG.SUPABASE_URL;

var SHOP_COLS = 'id, name, image_url, city, taluka, rating, latitude, longitude, delivery_radius_km, is_open';
var CAT_COLS = 'id, name, image_url, display_order';

var categoryId=null, categoryName='', nearbyShopIds=[], shopDistances={}, userLat=null, userLng=null;
var allShops=[], currentSort='nearby';
var allCategories=[];
var currentLoadingCategory=null;

// ✅ NEW: Dynamic radius config
var RADIUS_CONFIG = { fashion: 20, grocery: 10, default: 10, max: 20 };

var isViewOnly = false;
var viewOnlyReason = '';

try{var p=new URLSearchParams(window.location.search);categoryId=p.get('id');categoryName=p.get('name')?decodeURIComponent(p.get('name')):'';}catch(e){}

function $(id){return document.getElementById(id);}
function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function attrEsc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

window.goBack = function() {
    try {
        if (document.referrer && document.referrer.indexOf(location.host) !== -1) {
            history.back();
        } else {
            window.location.href = 'browse-categories.html';
        }
    } catch(e) { window.location.href = 'browse-categories.html'; }
};

function getFullUrl(u, width, height){
    if(!u||typeof u!=='string')return '';
    var w=width||150;
    var h=height||w;
    
    if (u.indexOf('res.cloudinary.com') !== -1) {
        if (u.indexOf('/image/fetch/') > -1) {
            var parts = u.split('/image/fetch/');
            if (parts.length === 2) {
                var rest = parts[1];
                var slashIdx = rest.indexOf('/');
                if (slashIdx > 0) {
                    var originalUrl = rest.substring(slashIdx + 1);
                    return parts[0] + '/image/fetch/w_' + w + ',h_' + h + ',c_fill,g_center,q_auto:eco,f_auto,fl_progressive,dpr_auto/' + originalUrl;
                }
            }
        }
        return u;
    }
    
    var fullUrl;
    if(u.indexOf('http')===0||u.indexOf('data:')===0){
        fullUrl=u;
    }else{
        fullUrl=SUPABASE_URL+'/storage/v1/object/public/'+u;
    }
    if(!CONFIG.CLOUDINARY_ENABLED)return fullUrl;
    return 'https://res.cloudinary.com/'+CONFIG.CLOUDINARY_CLOUD_NAME+'/image/fetch/w_'+w+',h_'+h+',c_fill,g_center,q_auto:eco,f_auto,fl_progressive,dpr_auto/'+fullUrl.replace(/ /g, '%20');
}

var CACHE_TTL = 5 * 60 * 1000;
function getCache(key){
    try{var raw=sessionStorage.getItem('zymart_cc_'+key);if(!raw)return null;var parsed=JSON.parse(raw);if(Date.now()-parsed.t>CACHE_TTL){sessionStorage.removeItem('zymart_cc_'+key);return null;}return parsed.d;}catch(e){return null;}
}
function setCache(key,data){
    try{sessionStorage.setItem('zymart_cc_'+key,JSON.stringify({t:Date.now(),d:data}));}catch(e){}
}

function showToast(m,type){var t=$('toastMsg'),s=$('toastText');if(!t||!s)return;s.textContent=m;t.className='toast';if(type==='error')t.classList.add('error');else if(type==='success')t.classList.add('success');t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show','error','success');},2500);}
window.fastNavigate=function(url){window.location.href=url;};

function calculateDistance(lat1,lng1,lat2,lng2){var R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180,a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}

// ✅ NEW: Load radius config from app_settings
async function loadRadiusConfig() {
    try {
        var r = await sb.from('app_settings')
            .select('key, value')
            .in('key', ['radius_fashion_km', 'radius_grocery_km', 'radius_default_km']);
        if (r.data && r.data.length) {
            r.data.forEach(function(s) {
                var v = parseFloat(s.value);
                if (isNaN(v) || v <= 0) return;
                if (s.key === 'radius_fashion_km') RADIUS_CONFIG.fashion = v;
                else if (s.key === 'radius_grocery_km') RADIUS_CONFIG.grocery = v;
                else if (s.key === 'radius_default_km') RADIUS_CONFIG.default = v;
            });
            RADIUS_CONFIG.max = Math.max(RADIUS_CONFIG.fashion, RADIUS_CONFIG.grocery, RADIUS_CONFIG.default);
        }
    } catch(e) { console.warn('[Radius] Load error:', e); }
}

function getRatingHtml(s) {
    var r = parseFloat(s.rating) || 0;
    if (r <= 0) return '<span class="shop-rating new-shop">🆕 New</span>';
    return '<span class="shop-rating"><i class="fas fa-star"></i> ' + r.toFixed(1) + '</span>';
}

// ✅ FIXED: Strict location check + dynamic max radius
function loadLocationAndSort(shops){
    var lat=parseFloat(localStorage.getItem('user_lat')||'0')||null,lng=parseFloat(localStorage.getItem('user_lng')||'0')||null;
    if(!lat||!lng||isNaN(lat)||isNaN(lng))return shops;
    
    userLat=lat;userLng=lng;nearbyShopIds=[];shopDistances={};
    for(var i=0;i<shops.length;i++){
        var shop=shops[i];
        if(!shop.latitude||!shop.longitude)continue;
        var dist=calculateDistance(userLat,userLng,shop.latitude,shop.longitude);
        shopDistances[shop.id]=Math.round(dist*10)/10;
        
        // Use Math.min(shop radius, global max) for nearby badge
        var shopRadius = shop.delivery_radius_km || RADIUS_CONFIG.max;
        var effectiveRadius = Math.min(shopRadius, RADIUS_CONFIG.max);
        if(dist <= effectiveRadius) nearbyShopIds.push(shop.id);
    }
    return shops;
}

function getSortedShops(){
    if(currentSort==='rating')return allShops.slice().sort(function(a,b){return(b.rating||0)-(a.rating||0);});
    return allShops.slice().sort(function(a,b){
        var aN=nearbyShopIds.indexOf(a.id)!==-1,bN=nearbyShopIds.indexOf(b.id)!==-1;
        if(aN&&!bN)return-1;if(!aN&&bN)return 1;
        var aD = shopDistances[a.id] !== undefined ? shopDistances[a.id] : 999;
        var bD = shopDistances[b.id] !== undefined ? shopDistances[b.id] : 999;
        return aD-bD;
    });
}

window.setSort=function(sort,btn){currentSort=sort;document.querySelectorAll('.sort-option').forEach(function(x){x.classList.remove('active');});btn.classList.add('active');renderShops();};

function renderShops(){
    var c=$('mainContent');if(!c)return;
    var decodedName=categoryName || 'Category';
    var locShort=localStorage.getItem('location_short')||'';
    
    var h='';
    h+='<div class="category-hero"><div class="category-icon">🏪</div><div class="category-info"><h2>'+esc(decodedName)+'</h2><p>Browse partners in this category</p></div></div>';
    
    if (isViewOnly && allShops.length > 0) {
        h += '<div class="view-only-banner warn">';
        h += '<i class="fas fa-info-circle"></i>';
        h += '<div><strong>View-Only Mode</strong><br>Aapke taluka me abhi is category ka partner nahi hai. Doosre talukas ke partners dikha rahe hain — order place nahi kar sakte.';
        h += '<br><button class="notify-btn" onclick="notifyPartner()"><i class="fas fa-bell"></i> Notify Me When Available</button></div>';
        h += '</div>';
    }
    
    if(locShort&&userLat&&userLng){
        h+='<div class="location-bar" onclick="window.location.href=\'set-location.html\'"><div class="location-dot"></div><span>📍 '+esc(locShort)+'</span>'+'<span class="nearby-badge">'+nearbyShopIds.length+' nearby</span></div>';
    }
    
    h+='<div class="sort-bar"><span>'+allShops.length+' partner'+(allShops.length!==1?'s':'')+'</span><div><span class="sort-option'+(currentSort==='nearby'?' active':'')+'" onclick="setSort(\'nearby\',this)">📍 Nearby</span> <span class="sort-option'+(currentSort==='rating'?' active':'')+'" onclick="setSort(\'rating\',this)">⭐ Rating</span></div></div>';
    
    var sorted=getSortedShops();
    h+='<div class="shops-list">';
    for(var i=0;i<sorted.length;i++){
        var s=sorted[i];
        var imgUrl=getFullUrl(s.image_url, 120, 120);
        var img2x = getFullUrl(s.image_url, 240, 240);
        var isNearby=nearbyShopIds.indexOf(s.id)!==-1;
        var dist = shopDistances[s.id] !== undefined ? shopDistances[s.id] : null;
        var cardClass = 'shop-card';
        if (isNearby) cardClass += ' nearby';
        else if (isViewOnly) cardClass += ' view-only';
        
        h+='<div class="'+cardClass+'" onclick="fastNavigate(\'shop-details.html?id='+attrEsc(s.id)+'\')" style="animation-delay:'+(i*0.04)+'s">';
        h+='<div class="shop-img">';
        if(imgUrl) {
            h+='<img src="'+attrEsc(imgUrl)+'" srcset="'+attrEsc(imgUrl)+' 1x, '+attrEsc(img2x)+' 2x" width="120" height="120" loading="lazy" decoding="async" alt="'+attrEsc(s.name)+'">';
        } else {
            h+='<i class="fas fa-store"></i>';
        }
        h+='</div>';
        h+='<div class="shop-info"><div class="shop-name">'+esc(s.name||'Partner')+' '+getRatingHtml(s)+'</div>';
        h+='<div class="shop-meta"><span><i class="fas fa-map-pin"></i> '+esc(s.taluka || s.city||'Location')+'</span>';
        if(dist!==null)h+='<span class="shop-distance">📍 '+dist+' km</span>';
        if(s.is_open)h+='<span style="color:#10B981;">🟢 Open</span>';
        h+='</div></div><i class="fas fa-chevron-right shop-arrow"></i></div>';
    }
    h+='</div>';
    
    var sc = $('shopCount');
    if (sc) sc.textContent = allShops.length+' partner'+(allShops.length!==1?'s':'');
    
    if(!sorted.length){
        var emptyTitle = 'No Partners Found';
        var emptyMsg = 'No partners available in "<strong>'+esc(decodedName)+'</strong>" yet.<br>Check back soon!';
        
        if (viewOnlyReason === 'empty_category') {
            emptyTitle = 'No Local Partners';
            emptyMsg = 'Aapke taluka me "<strong>'+esc(decodedName)+'</strong>" category ka koi partner nahi hai.<br><br>Doosre categories try karein ya partners join karein.';
        }
        
        h='<div class="empty-state"><div class="empty-icon"><i class="fas fa-store-slash"></i></div><h3>'+emptyTitle+'</h3><p>'+emptyMsg+'</p><button class="btn-primary" onclick="window.location.href=\'browse-categories.html\'"><i class="fas fa-th-large"></i> Browse Categories</button><button class="btn-outline" onclick="window.location.href=\'index.html\'"><i class="fas fa-home"></i> Go Home</button></div>';
    }
    c.innerHTML=h;
}

async function loadShopsForCategory(catId, catName) {
    if (!catId) return;
    currentLoadingCategory = catId;
    isViewOnly = false;
    viewOnlyReason = '';
    
    var c = $('mainContent');
    if (!c) return;
    c.innerHTML = '<div class="loading-state"><div class="loading-spinner"></div><p class="loading-text">Loading partners...</p></div>';
    
    try {
        var userTaluka = (localStorage.getItem('user_taluka') || '').trim().toLowerCase();
        var cacheKey = 'shops_v8_' + catId + '_' + userTaluka;
        var cached = getCache(cacheKey);
        var allShopsData = null;
        var cachedViewOnly = false;
        var cachedReason = '';
        
        if (cached && Array.isArray(cached.shops)) {
            allShopsData = cached.shops;
            cachedViewOnly = cached.viewOnly === true;
            cachedReason = cached.reason || '';
        } else {
            var shops = [];
            try {
                var r = await sb.from('shops')
                    .select(SHOP_COLS)
                    .eq('status','approved')
                    .limit(200);
                shops = (r && r.data) ? r.data : [];
            } catch(e1) { console.warn('[Category] Shops fetch failed:', e1.message); }
            
            shops = shops.filter(function(s){ return s.is_open !== false; });
            
            if (shops.length === 0) {
                if (currentLoadingCategory !== catId) return;
                allShops = [];
                renderShops();
                return;
            }
            
            var shopIds = shops.map(function(s){ return s.id; });
            var categoryIds = [catId];
            
            // Get child categories
            try {
                var subRes = await sb.from('categories').select('id').eq('parent_id', catId);
                if (subRes && subRes.data) {
                    subRes.data.forEach(function(sc) {
                        if (sc.id && categoryIds.indexOf(sc.id) === -1) categoryIds.push(sc.id);
                    });
                }
            } catch(e2) { console.warn('[Category] Subcats fetch failed:', e2.message); }
            
            // ✅ FIXED: Query products to find matching shops
            var matchingShopIds = [];
            try {
                var pr = await sb.from('products')
                    .select('shop_id')
                    .in('category_id', categoryIds)
                    .in('shop_id', shopIds)
                    .eq('is_active', true)
                    .eq('is_on_hold', false)
                    .limit(500);
                
                if (pr && pr.data && pr.data.length > 0) {
                    var seen = {};
                    pr.data.forEach(function(p) {
                        if (p.shop_id && !seen[p.shop_id]) {
                            seen[p.shop_id] = true;
                            matchingShopIds.push(p.shop_id);
                        }
                    });
                }
            } catch(e3) { console.warn('[Category] Products fetch failed:', e3.message); }
            
            // Taluka rule (Option A)
            var localShopsInTaluka = shops.filter(function(s) {
                var shopTaluka = (s.taluka || s.city || '').trim().toLowerCase();
                return shopTaluka === userTaluka;
            });
            var hasLocalShops = localShopsInTaluka.length > 0;
            
            if (hasLocalShops) {
                var localWithCategory = matchingShopIds.filter(function(id) {
                    return localShopsInTaluka.some(function(s) { return s.id === id; });
                });
                
                if (localWithCategory.length > 0) {
                    allShopsData = shops.filter(function(s) { return localWithCategory.indexOf(s.id) !== -1; });
                    isViewOnly = false;
                    viewOnlyReason = '';
                } else {
                    allShopsData = [];
                    isViewOnly = false;
                    viewOnlyReason = 'empty_category';
                }
            } else {
                if (matchingShopIds.length > 0) {
                    allShopsData = shops.filter(function(s) { return matchingShopIds.indexOf(s.id) !== -1; });
                    isViewOnly = true;
                    viewOnlyReason = 'no_taluka_shops';
                } else {
                    allShopsData = [];
                    isViewOnly = false;
                }
            }
            
            if (allShopsData.length > 0) {
                setCache(cacheKey, { shops: allShopsData, viewOnly: isViewOnly, reason: viewOnlyReason });
            }
        }
        
        if (currentLoadingCategory !== catId) return;
        
        isViewOnly = cachedViewOnly;
        viewOnlyReason = cachedReason;
        
        allShops = loadLocationAndSort(allShopsData);
        renderShops();
    } catch(e) {
        console.error('[Category] FATAL load error:', e);
        if (currentLoadingCategory !== catId) return;
        c.innerHTML = '<div class="empty-state"><div class="empty-icon"><i class="fas fa-exclamation-circle"></i></div><h3>Failed to Load</h3><p>Please check your connection</p><button class="btn-primary" onclick="window.switchCategory(\''+attrEsc(catId)+'\',\''+encodeURIComponent(catName)+'\')"><i class="fas fa-redo"></i> Retry</button></div>';
    }
}

window.notifyPartner = async function() {
    try {
        var uLat = parseFloat(localStorage.getItem('user_lat') || '0');
        var uLng = parseFloat(localStorage.getItem('user_lng') || '0');
        await sb.from('demand_signals').insert({
            product_name: null,
            pincode: localStorage.getItem('user_pincode') || null,
            lat: uLat || null,
            lng: uLng || null,
            taluka: localStorage.getItem('user_taluka') || null
        });
    } catch(e) { console.warn('[Category] Notify:', e.message); }
    showToast('✅ Hum aapko batayenge jab partner available ho!', 'success');
};

async function loadSidebar() {
    var sidebar = $('sidebar');
    if (!sidebar) return;
    
    try {
        var cats = getCache('categories_list_v5');
        
        if (!cats) {
            var r = await sb.from('categories')
                .select(CAT_COLS)
                .eq('is_active', true)
                .eq('is_on_hold', false)
                .is('parent_id', null)
                .order('display_order', { ascending: true, nullsFirst: false })
                .limit(40);
            cats = (r && r.data) ? r.data : [];
            setCache('categories_list_v5', cats);
        }
        
        allCategories = cats;
        
        if (cats.length === 0) {
            sidebar.innerHTML = '<div style="padding:20px 8px;text-align:center;font-size:10px;color:#9CA3AF;">No categories</div>';
            $('mainContent').innerHTML = '<div class="empty-state"><div class="empty-icon"><i class="fas fa-store-slash"></i></div><h3>No Categories</h3><p>Categories coming soon!</p></div>';
            return;
        }
        
        if (!categoryId || !cats.find(function(c){return c.id===categoryId;})) {
            categoryId = cats[0].id;
            categoryName = cats[0].name;
        }
        
        var html = '';
        for (var i=0; i<cats.length; i++) {
            var cat = cats[i];
            var isActive = (cat.id === categoryId);
            var img = cat.image_url ? getFullUrl(cat.image_url, 100, 100) : '';
            var img2x = cat.image_url ? getFullUrl(cat.image_url, 200, 200) : '';
            
            html += '<div class="sidebar-item'+(isActive?' active':'')+'" data-cat-id="'+attrEsc(cat.id)+'" onclick="window.switchCategory(\''+attrEsc(cat.id)+'\',\''+encodeURIComponent(cat.name).replace(/'/g,"\\'")+'\')">';
            html += '<div class="sidebar-cat-img">';
            if(img) {
                html += '<img src="'+attrEsc(img)+'" srcset="'+attrEsc(img)+' 1x, '+attrEsc(img2x)+' 2x" width="100" height="100" loading="lazy" decoding="async" alt="'+attrEsc(cat.name)+'">';
            } else {
                html += '<i class="fas fa-shopping-basket"></i>';
            }
            html += '</div>';
            html += '<div class="sidebar-cat-name">'+esc(cat.name)+'</div>';
            html += '</div>';
        }
        sidebar.innerHTML = html;
        
        setTimeout(function(){
            var activeItem = sidebar.querySelector('.sidebar-item.active');
            if (activeItem) {
                var top = activeItem.offsetTop - 40;
                if (top > 0) sidebar.scrollTop = top;
            }
        }, 100);
        
        await loadShopsForCategory(categoryId, categoryName);
        
    } catch(e) {
        console.error('[Category] Sidebar error:', e);
        sidebar.innerHTML = '<div style="padding:20px 8px;text-align:center;font-size:10px;color:#EF4444;">Error</div>';
    }
}

window.switchCategory = function(catId, catNameEncoded) {
    if (!catId) return;
    var catName = decodeURIComponent(catNameEncoded);
    
    document.querySelectorAll('.sidebar-item').forEach(function(el){
        if (el.getAttribute('data-cat-id') === catId) el.classList.add('active');
        else el.classList.remove('active');
    });
    
    try {
        var newUrl = window.location.pathname + '?id=' + catId + '&name=' + catNameEncoded;
        history.replaceState({catId: catId}, '', newUrl);
    } catch(e) {}
    
    document.title = catName + ' Partners - ZyMart+';
    
    categoryId = catId;
    categoryName = catName;
    currentSort = 'nearby';
    
    loadShopsForCategory(catId, catName);
};

document.addEventListener('DOMContentLoaded', async function() {
    if (!navigator.onLine) { var nb = $('netBanner'); if (nb) nb.style.display = 'block'; }
    
    // ✅ STRICT LOCATION CHECK
    var uLat = parseFloat(localStorage.getItem('user_lat'));
    var uLng = parseFloat(localStorage.getItem('user_lng'));
    if (isNaN(uLat) || isNaN(uLng) || uLat === 0 || uLng === 0) {
        window.location.href = 'index.html';
        return;
    }
    
    await loadRadiusConfig();
    loadSidebar();
});
})();
</script>
