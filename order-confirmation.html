<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ऑर्डर सफल - Zatpat</title>
    <meta name="theme-color" content="#0F6E3B">
    <meta name="description" content="Zatpat - आपका ऑर्डर सफलतापूर्वक प्लेस हो गया">
    
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0F6E3B; --primary-light: #16A34A; --primary-dark: #0B5C30;
            --primary-bg-light: #DCFCE7; --primary-bg-dark: #BBF7D0;
            --accent-orange: #F97316; --accent-orange-dark: #EA580C;
            --accent-red: #EF4444; --accent-yellow: #FACC15; --accent-gold: #F59E0B;
            --bg-white: #FFFFFF; --bg-light: #F9FAFB; --text-primary: #111827;
            --text-secondary: #6B7280; --text-white: #FFFFFF; --border-light: #E5E7EB;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05); --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.12);
            --radius-md: 12px; --radius-lg: 20px; --radius-xl: 24px; --radius-full: 9999px;
            --transition-fast: 0.15s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', 'Noto Sans Devanagari', sans-serif;
            background: var(--bg-light); color: var(--text-primary);
            overflow-x: hidden; min-height: 100vh; width: 100%; max-width: 100%;
            -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
        }
        
        #simpleLoader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-white); z-index: 10002; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; transition: opacity 0.3s ease, visibility 0.3s ease; }
        #simpleLoader.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
        .simple-spinner { width: 36px; height: 36px; border: 3px solid var(--border-light); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.6s linear infinite; }
        .loader-logo { font-size: 22px; font-weight: 800; color: var(--primary); }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1); } }
        @keyframes checkPop { from { transform: scale(0); } to { transform: scale(1); } }
        
        #pageProgress { position: fixed; top: 0; left: 0; width: 0%; height: 3px; background: var(--primary); z-index: 10001; transition: width 0.3s ease; }
        #pageProgress.loading { width: 90%; }
        #pageProgress.complete { width: 100%; opacity: 0; transition: opacity 0.3s; }
        
        .top-bar { background: var(--primary); position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; padding: 10px 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 12px rgba(15,110,59,0.3); }
        .back-btn { width: 36px; height: 36px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 15px; outline: none; transition: all 0.15s; -webkit-tap-highlight-color: transparent; }
        .back-btn:active { background: rgba(255,255,255,0.35); transform: scale(0.92); }
        .top-title { flex: 1; font-size: 17px; font-weight: 700; color: var(--text-white); }
        
        .main-content { padding-top: 58px; max-width: 500px; margin: 0 auto; padding-bottom: 30px; animation: fadeIn 0.5s ease; }
        
        .success-animation { text-align: center; padding: 30px 0 20px; }
        .checkmark-circle { width: 100px; height: 100px; background: var(--primary-bg-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; animation: scaleIn 0.5s ease; }
        .checkmark-circle i { font-size: 50px; color: var(--primary); animation: checkPop 0.5s ease 0.2s both; }
        .success-title { font-size: 26px; font-weight: 800; color: var(--primary); margin-bottom: 8px; }
        .success-message { font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; }
        
        .order-card { background: var(--bg-white); margin: 0 14px 20px; border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-md); border: 1px solid var(--border-light); }
        .order-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border-light); }
        .order-id-label { font-size: 12px; color: var(--text-secondary); }
        .order-id-value { font-size: 16px; font-weight: 700; font-family: 'Courier New', monospace; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
        .copy-btn { background: var(--bg-light); border: none; padding: 6px 10px; border-radius: var(--radius-full); font-size: 11px; color: var(--primary); cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.15s; }
        .copy-btn:active { background: var(--primary-bg-light); }
        .order-date { font-size: 12px; color: var(--text-secondary); }
        
        .delivery-estimate { background: var(--primary-bg-light); border-radius: var(--radius-md); padding: 16px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; border: 1px solid var(--primary-bg-dark); }
        .estimate-icon { width: 50px; height: 50px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .estimate-icon i { font-size: 24px; color: var(--primary); }
        .estimate-content { flex: 1; }
        .estimate-title { font-size: 14px; font-weight: 700; color: var(--primary); margin-bottom: 2px; }
        .estimate-time { font-size: 20px; font-weight: 800; }
        .estimate-address { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
        
        .items-summary { margin-bottom: 20px; }
        .summary-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        .summary-title i { color: var(--primary); }
        .item-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border-light); }
        .item-row:last-child { border-bottom: none; }
        .item-qty { width: 24px; height: 24px; background: var(--bg-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--text-secondary); flex-shrink: 0; }
        .item-name { flex: 1; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-price { font-weight: 600; color: var(--primary); white-space: nowrap; }
        .more-items { font-size: 12px; color: var(--text-secondary); padding: 8px 0; text-align: center; }
        
        .payment-summary { background: var(--bg-light); border-radius: var(--radius-md); padding: 16px; margin-bottom: 24px; }
        .summary-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; color: var(--text-secondary); }
        .summary-row.total { font-size: 16px; font-weight: 700; color: var(--text-primary); border-top: 1px solid var(--border-light); margin-top: 8px; padding-top: 12px; }
        .total-amount { color: var(--primary); }
        .payment-method { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 12px; color: var(--text-secondary); }
        
        .action-buttons { display: flex; gap: 12px; padding: 0 14px; margin-bottom: 16px; }
        .btn { flex: 1; padding: 16px 20px; border-radius: var(--radius-full); font-size: 15px; font-weight: 600; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.15s; text-decoration: none; outline: none; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:active { background: var(--primary-dark); transform: scale(0.98); }
        .btn-secondary { background: white; color: var(--primary); border: 1px solid var(--primary); }
        .btn-secondary:active { background: var(--primary-bg-light); transform: scale(0.98); }
        .btn-outline { background: transparent; color: var(--text-secondary); border: 1px solid var(--border-light); }
        .btn-outline:active { background: var(--bg-light); }
        
        .login-prompt { text-align: center; padding: 60px 20px; animation: fadeIn 0.4s ease; }
        .login-prompt i { font-size: 56px; color: #D1D5DB; margin-bottom: 16px; display: block; }
        .login-prompt h3 { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
        .login-prompt p { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; }
        .login-prompt button { background: var(--primary); color: white; border: none; padding: 12px 28px; border-radius: var(--radius-full); font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; }
        
        .invite-banner { margin: 12px 14px; padding: 14px; background: linear-gradient(135deg, #FEF3C7, #FFFBEB); border: 1px solid #FCD34D; border-radius: var(--radius-lg); text-align: center; animation: fadeIn 0.4s ease; }
        .invite-banner .invite-title { font-size: 14px; font-weight: 800; color: #92400E; margin-bottom: 4px; }
        .invite-banner .invite-subtitle { font-size: 11px; color: #A16207; margin-bottom: 10px; }
        .invite-banner .btn-invite { background: linear-gradient(135deg, #F59E0B, #D97706); color: white; border: none; padding: 10px 20px; border-radius: var(--radius-full); font-size: 12px; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.15s; }
        .invite-banner .btn-invite:active { transform: scale(0.96); }
        
        .share-section { display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 20px; }
        .share-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        .share-icon { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .share-icon.whatsapp { background: #25D366; color: white; }
        .share-icon.copy { background: var(--bg-light); color: var(--primary); border: 1px solid var(--border-light); }
        .share-label { font-size: 11px; color: var(--text-secondary); }
        
        .toast-notification { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text-primary); color: white; padding: 12px 24px; border-radius: var(--radius-full); font-size: 13px; font-weight: 600; z-index: 10050; opacity: 0; visibility: hidden; white-space: nowrap; box-shadow: var(--shadow-lg); transition: all 0.25s; }
        .toast-notification.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(-5px); }
        
        .loading-spinner { text-align: center; padding: 60px; }
        .spinner { width: 40px; height: 40px; border: 3px solid var(--border-light); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }
        
        @media (max-width: 380px) {
            .success-title { font-size: 22px; }
            .btn { padding: 14px 16px; font-size: 13px; }
        }
    </style>
</head>
<body>

<div id="simpleLoader"><div class="simple-spinner"></div><div class="loader-logo">Zatpat</div></div>
<div id="pageProgress"></div>
<div id="toastMsg" class="toast-notification"><span id="toastText"></span></div>

<div id="mainApp" style="display:none;">
    <div class="top-bar">
        <button class="back-btn" onclick="goBack()" aria-label="वापस"><i class="fas fa-arrow-left"></i></button>
        <span class="top-title">ऑर्डर सफल 🎉</span>
    </div>
    <div class="main-content" id="mainContent">
        <div class="loading-spinner"><div class="spinner"></div></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function() {
    'use strict';
    var sb = supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co','sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1');
    var SUPABASE_URL = 'https://zwajyovemwdqtkecipeb.supabase.co';
    var orderId = null, orderData = null, orderItems = [], currentUser = null;
    var initComplete = false;

    try { var p = new URLSearchParams(window.location.search); orderId = p.get('id') || p.get('order_id'); } catch(e) {}

    function getFullUrl(url) { if(!url) return ''; if(url.indexOf('http')===0||url.indexOf('data:')===0) return url; return SUPABASE_URL+'/storage/v1/object/public/'+url; }
    function escapeHTML(str) { if(!str) return ''; return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
    function showApp() { var l=document.getElementById('simpleLoader'),a=document.getElementById('mainApp'); if(a)a.style.display=''; if(l){l.classList.add('fade-out');setTimeout(function(){if(l.parentNode)l.parentNode.removeChild(l);},300);} }

    var Cache = { set:function(k,d,t){try{localStorage.setItem('zc_'+k,JSON.stringify({d:d,e:Date.now()+(t||1800000)}));}catch(e){}}, get:function(k){try{var c=localStorage.getItem('zc_'+k);if(!c)return null;var p=JSON.parse(c);return Date.now()>p.e?(localStorage.removeItem('zc_'+k),null):p.d;}catch(e){return null;}} };

    async function safeFetch(fn,r){r=r||3;var le=null;for(var i=0;i<r;i++){try{var res=await fn();if(res.error){le=new Error(res.error.message);if(i===r-1)throw le;}else return res;}catch(e){le=e;if(i===r-1)throw le;}await new Promise(function(rs){setTimeout(rs,Math.pow(2,i)*500);});}throw le;}

    async function checkUser() {
        try { var res = await sb.auth.getSession(); if (res.data && res.data.session) { currentUser = res.data.session.user; return true; } } catch(e) {}
        currentUser = null; return false;
    }

    window.addEventListener('online',function(){showToast('✅ इंटरनेट बहाल!');});
    window.addEventListener('offline',function(){showToast('⚠️ ऑफलाइन — ऑर्डर पहले ही प्लेस हो चुका है',true);});

    var tsY=0;document.addEventListener('touchstart',function(e){tsY=e.touches[0].clientY;},{passive:true});
    document.addEventListener('touchend',function(e){if(window.scrollY===0&&e.changedTouches[0].clientY-tsY>100){showToast('🔄 रिफ्रेश हो रहा है...');loadOrder();}},{passive:true});

    function showToast(msg,isError){isError=isError||false;var t=document.getElementById('toastMsg'),s=document.getElementById('toastText');if(!t||!s)return;s.textContent=msg;t.style.background=isError?'#EF4444':'#111827';t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2200);}

    function startProgress(){var b=document.getElementById('pageProgress');if(b){b.style.width='0%';b.classList.add('loading');setTimeout(function(){b.style.width='90%';},10);}}
    function completeProgress(){var b=document.getElementById('pageProgress');if(b){b.classList.remove('loading');b.classList.add('complete');setTimeout(function(){b.style.width='0%';b.classList.remove('complete');},300);}}

    function goBack(){window.location.href='index.html';}
    window.fastNavigate=function(url){startProgress();setTimeout(function(){window.location.href=url;},80);};

    function showLoginPrompt() {
        document.getElementById('mainContent').innerHTML = 
        '<div class="login-prompt"><i class="fas fa-user-lock"></i><h3>लॉगिन आवश्यक</h3><p>ऑर्डर विवरण देखने के लिए कृपया लॉगिन करें</p><button onclick="localStorage.setItem(\'zatpat_redirect_after_login\',\'order-confirmation.html?id='+(orderId||'')+'\');fastNavigate(\'index.html\')">🔐 लॉगिन करें</button></div>';
    }

    async function loadOrder(){
        var container=document.getElementById('mainContent');
        if(!container)return;
        
        // 🔐 Auth check — MUST be logged in
        var loggedIn = await checkUser();
        if (!loggedIn || !currentUser) {
            showLoginPrompt();
            completeProgress();
            return;
        }
        
        // Try localStorage first (instant display)
        var lastOrder=localStorage.getItem('zatpat_last_order');
        if(lastOrder){try{var parsed=JSON.parse(lastOrder);orderData=parsed.order||parsed;orderItems=parsed.items||orderData.items||[];}catch(e){}}
        
        if(!orderId){
            // No order ID in URL — show last order from localStorage if belongs to user
            if(orderData&&orderData.id&&orderData.user_id===currentUser.id){
                renderConfirmation();
                completeProgress();
                return;
            }
            // No valid order — redirect to orders
            container.innerHTML='<div class="login-prompt"><i class="fas fa-receipt"></i><h3>कोई ऑर्डर नहीं</h3><p>देखने के लिए कोई हालिया ऑर्डर नहीं है</p><button onclick="fastNavigate(\'orders.html\')">📋 सभी ऑर्डर देखें</button></div>';
            completeProgress();
            return;
        }
        
        // Fetch from Supabase
        try{
            var result=await safeFetch(function(){return sb.from('orders').select('*').eq('id',orderId).single();});
            if(result.data){
                orderData=result.data;
                
                // 🔐 Verify order belongs to logged-in user
                if(orderData.user_id && orderData.user_id !== currentUser.id){
                    container.innerHTML='<div class="login-prompt"><i class="fas fa-shield-alt" style="color:#EF4444;"></i><h3>अनधिकृत पहुंच</h3><p>यह ऑर्डर आपका नहीं है</p><button onclick="fastNavigate(\'orders.html\')">📋 अपने ऑर्डर देखें</button></div>';
                    completeProgress();
                    return;
                }
                
                orderItems=orderData.items||[];
                localStorage.setItem('zatpat_last_order',JSON.stringify({order:orderData,items:orderItems}));
            }
            renderConfirmation();
            completeProgress();
        }catch(e){
            if(orderData&&orderData.id&&orderData.user_id===currentUser.id){
                renderConfirmation();
            }else{
                container.innerHTML='<div style="text-align:center;padding:60px;"><i class="fas fa-exclamation-circle" style="font-size:48px;color:#D1D5DB;"></i><h3 style="margin-top:12px;">ऑर्डर लोड विफल</h3><button onclick="fastNavigate(\'orders.html\')" style="background:var(--primary);color:white;border:none;padding:12px 24px;border-radius:var(--radius-full);margin-top:12px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;">ऑर्डर देखें</button></div>';
            }
        }
    }

    function renderConfirmation(){
        var container=document.getElementById('mainContent');
        var order=orderData;if(!order)return;
        var orderIdShort=(order.id||'').substring(0,8).toUpperCase();
        var orderDate=order.created_at?new Date(order.created_at).toLocaleDateString('hi-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'अभी-अभी';
        var itemTotal=orderItems.reduce(function(s,i){return s+((i.price||0)*(i.quantity||1));},0);
        var deliveryFee=parseFloat(order.delivery_fee)||0;if(isNaN(deliveryFee))deliveryFee=0;
        var grandTotal=parseFloat(order.total_amount)||(itemTotal+deliveryFee);if(isNaN(grandTotal))grandTotal=0;
        
        var itemsHtml='';
        for(var j=0;j<Math.min(orderItems.length,4);j++){var item=orderItems[j];itemsHtml+='<div class="item-row"><span class="item-qty">'+(item.quantity||1)+'</span><span class="item-name">'+escapeHTML(item.product_name||item.name||'आइटम')+'</span><span class="item-price">₹'+Number((item.price||0)*(item.quantity||1)).toLocaleString('en-IN')+'</span></div>';}
        if(orderItems.length>4)itemsHtml+='<div class="more-items">+'+Number(orderItems.length-4)+' और आइटम</div>';
        
        container.innerHTML=
        '<div class="success-animation"><div class="checkmark-circle"><i class="fas fa-check"></i></div><h1 class="success-title">ऑर्डर सफल! 🎉</h1><p class="success-message">आपका ऑर्डर सफलतापूर्वक प्लेस हो गया</p></div>'+
        '<div class="order-card"><div class="order-header"><div><div class="order-id-label">ऑर्डर ID</div><div class="order-id-value">#'+escapeHTML(orderIdShort)+' <button class="copy-btn" onclick="copyOrderId()"><i class="far fa-copy"></i> कॉपी</button></div></div><div class="order-date">'+escapeHTML(orderDate)+'</div></div>'+
        '<div class="delivery-estimate"><div class="estimate-icon"><i class="fas fa-truck"></i></div><div class="estimate-content"><div class="estimate-title">अनुमानित डिलीवरी</div><div class="estimate-time">10-15 मिनट</div><div class="estimate-address"><i class="fas fa-map-pin"></i> '+escapeHTML(order.customer_city||order.customer_address||'स्थान')+'</div></div></div>'+
        '<div class="items-summary"><div class="summary-title"><i class="fas fa-shopping-bag"></i> आइटम ('+orderItems.length+')</div>'+itemsHtml+'</div>'+
        '<div class="payment-summary"><div class="summary-row"><span>आइटम कुल</span><span>₹'+itemTotal.toLocaleString('en-IN')+'</span></div><div class="summary-row"><span>डिलीवरी शुल्क</span><span>'+(deliveryFee===0?'🎉 मुफ़्त':'₹'+deliveryFee.toLocaleString('en-IN'))+'</span></div><div class="summary-row total"><span>कुल राशि</span><span class="total-amount">₹'+grandTotal.toLocaleString('en-IN')+'</span></div><div class="payment-method"><i class="fas '+(order.payment_method==='cod'?'fa-money-bill-wave':'fa-qrcode')+'"></i> '+(order.payment_method==='cod'?'कैश ऑन डिलीवरी':'UPI से भुगतान')+'</div></div></div>'+
        '<div class="action-buttons"><button class="btn btn-primary" onclick="trackOrder()"><i class="fas fa-truck"></i> ट्रैक करें</button><button class="btn btn-secondary" onclick="fastNavigate(\'index.html\')"><i class="fas fa-home"></i> होम</button></div>'+
        '<button class="btn btn-outline" onclick="fastNavigate(\'orders.html\')" style="width:calc(100% - 28px);margin:0 14px 12px;"><i class="fas fa-receipt"></i> सभी ऑर्डर देखें</button>'+
        '<div class="invite-banner"><div class="invite-title">🎁 दोस्तों को इन्वाइट करें और ₹50 पाएं!</div><div class="invite-subtitle">हर दोस्त के पहले ऑर्डर पर आपको ₹50 मिलेंगे</div><button class="btn-invite" onclick="fastNavigate(\'invite-earn.html\')"><i class="fas fa-gift"></i> अभी इन्वाइट करें</button></div>'+
        '<div class="share-section"><div class="share-btn" onclick="shareViaWhatsApp()"><div class="share-icon whatsapp"><i class="fab fa-whatsapp"></i></div><span class="share-label">WhatsApp</span></div><div class="share-btn" onclick="copyOrderLink()"><div class="share-icon copy"><i class="fas fa-link"></i></div><span class="share-label">लिंक कॉपी</span></div></div>';
    }

    window.copyOrderId=function(){var oid=(orderData&&orderData.id)?orderData.id.substring(0,8).toUpperCase():'';if(!oid){showToast('कोई ऑर्डर नहीं',true);return;}if(navigator.clipboard){navigator.clipboard.writeText(oid).then(function(){showToast('📋 ऑर्डर ID कॉपी!');});}else{showToast('📋 #'+oid);}};
    window.trackOrder=function(){if(orderData&&orderData.id){fastNavigate('order-tracking.html?id='+orderData.id);}else{fastNavigate('order-tracking.html');}};
    window.shareViaWhatsApp=function(){var oid=(orderData&&orderData.id)?orderData.id.substring(0,8).toUpperCase():'';var total=orderData?orderData.total_amount||0:0;window.open('https://wa.me/?text='+encodeURIComponent('🎉 ऑर्डर सफल!\nऑर्डर ID: '+oid+'\nकुल: ₹'+total+'\n\nZatpat पर ट्रैक करें!'),'_blank');};
    window.copyOrderLink=function(){if(navigator.clipboard){navigator.clipboard.writeText(window.location.href).then(function(){showToast('🔗 लिंक कॉपी!');});}else{showToast('🔗 लिंक: '+window.location.href);}};

    window.handleBackPress=function(){goBack();return true;};

    document.addEventListener('DOMContentLoaded',function(){
        loadOrder();
        showApp();
        initComplete=true;
        if(navigator.vibrate)navigator.vibrate([50,30,50,30,50]);
    });

    window.copyOrderId=copyOrderId;window.trackOrder=trackOrder;window.shareViaWhatsApp=shareViaWhatsApp;window.copyOrderLink=copyOrderLink;window.fastNavigate=fastNavigate;window.goBack=goBack;
})();
</script>
</body>
</html>
