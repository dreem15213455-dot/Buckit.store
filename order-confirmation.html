<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Order Confirmed - Zatpat</title>
    <meta name="theme-color" content="#FFD600">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary: #FFD600;
            --primary-dark: #E5C200;
            --accent-green: #16A34A;
            --bg-light: #F5F5F5;
            --card-white: #FFFFFF;
            --text-primary: #1A1A1A;
            --text-secondary: #666666;
            --border-light: #E5E7EB;
            --danger: #EF4444;
            --success: #10B981;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-2xl: 24px;
            --radius-full: 9999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
        }
        h1, h2, h3, h4, h5, h6 { font-family: 'Poppins', sans-serif; }

        .top-bar {
            background: var(--card-white);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 12px 16px;
            box-shadow: var(--shadow-sm);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .back-btn {
            width: 40px;
            height: 40px;
            background: var(--bg-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .brand-name { font-size: 22px; font-weight: 800; }
        .brand-name .normal { color: #000000; }
        .brand-name .pat { color: var(--accent-green); }
        .page-title { flex: 1; text-align: center; font-weight: 600; font-size: 16px; }

        .main-content {
            padding-top: 80px;
            padding-bottom: 100px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Success Card */
        .success-card {
            background: white;
            margin: 16px;
            border-radius: var(--radius-2xl);
            border: 1px solid var(--border-light);
            overflow: hidden;
            text-align: center;
            padding: 40px 24px;
        }
        .success-icon {
            width: 80px;
            height: 80px;
            background: #D1FAE5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .success-icon i {
            font-size: 48px;
            color: var(--success);
        }
        .success-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .success-message {
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        /* Order Info */
        .order-info-card {
            background: white;
            margin: 16px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            overflow: hidden;
        }
        .info-title {
            padding: 16px;
            border-bottom: 1px solid var(--border-light);
            font-weight: 700;
            background: var(--bg-light);
        }
        .info-body {
            padding: 16px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .info-label {
            color: var(--text-secondary);
        }
        .info-value {
            font-weight: 600;
        }

        /* Items List */
        .items-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-light);
            font-size: 13px;
        }
        .item-name {
            flex: 1;
        }
        .item-price {
            font-weight: 600;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin: 16px;
        }
        .track-btn {
            flex: 1;
            background: var(--primary);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
        }
        .shop-btn {
            flex: 1;
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-light);
            padding: 14px;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .loading-spinner {
            text-align: center;
            padding: 60px;
            color: var(--primary);
        }

        @media (max-width: 480px) {
            .success-title { font-size: 20px; }
            .action-buttons { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="back-btn" onclick="goToHome()"><i class="fas fa-arrow-left"></i></div>
        <div class="brand-name"><span class="normal">Zat</span><span class="pat">pat</span></div>
        <div class="page-title">Order Confirmation</div>
    </div>

    <div class="main-content" id="mainContent">
        <div class="loading-spinner"><i class="fas fa-spinner fa-spin fa-2x"></i><p>Loading order details...</p></div>
    </div>

    <script>
        const supabaseUrl = 'https://zwajyovemwdqtkecipeb.supabase.co';
        const supabaseKey = 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let orderData = null;

        // Get order ID from URL
        function getOrderId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('order');
        }

        // Load order details
        async function loadOrder() {
            const orderId = getOrderId();
            if (!orderId) {
                showError('No order ID found');
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('orders')
                    .select('*')
                    .eq('order_id', orderId)
                    .single();

                if (error || !data) {
                    showError('Order not found');
                    return;
                }

                orderData = data;
                renderConfirmation();
            } catch (error) {
                console.error('Error loading order:', error);
                showError('Failed to load order details');
            }
        }

        // Render order confirmation
        function renderConfirmation() {
            if (!orderData) return;

            const items = orderData.items || [];
            const address = orderData.shipping_address || {};
            const paymentMethod = orderData.payment_method === 'upi' ? 'UPI / Google Pay' : 'Cash on Delivery';
            const paymentStatus = orderData.payment_status === 'paid' ? '✅ Paid' : '⏳ Pending';
            
            let itemsHtml = '';
            items.forEach(item => {
                itemsHtml += `
                    <div class="item-row">
                        <div class="item-name">${escapeHtml(item.name)} x ${item.quantity}</div>
                        <div class="item-price">₹${item.total}</div>
                    </div>
                `;
            });

            const container = document.getElementById('mainContent');
            container.innerHTML = `
                <div class="success-card">
                    <div class="success-icon">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div class="success-title">Order Placed Successfully!</div>
                    <div class="success-message">
                        Thank you for shopping with Zatpat. Your order has been received.
                    </div>
                    <div style="background: var(--bg-light); padding: 12px; border-radius: var(--radius-md);">
                        <strong>Order ID: ${orderData.order_id}</strong>
                    </div>
                </div>

                <div class="order-info-card">
                    <div class="info-title"><i class="fas fa-receipt"></i> Order Summary</div>
                    <div class="info-body">
                        <div class="info-row">
                            <span class="info-label">Order Date</span>
                            <span class="info-value">${new Date(orderData.created_at).toLocaleString()}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Payment Method</span>
                            <span class="info-value">${paymentMethod}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Payment Status</span>
                            <span class="info-value" style="color: var(--success);">${paymentStatus}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Order Status</span>
                            <span class="info-value">${orderData.order_status || 'Confirmed'}</span>
                        </div>
                    </div>
                </div>

                <div class="order-info-card">
                    <div class="info-title"><i class="fas fa-box"></i> Items Ordered</div>
                    <div class="info-body">
                        <div class="items-list">
                            ${itemsHtml}
                        </div>
                        <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-light);">
                            <div class="info-row">
                                <span class="info-label">Subtotal</span>
                                <span>₹${orderData.subtotal || 0}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Delivery Fee</span>
                                <span>${orderData.delivery_fee === 0 ? 'FREE' : `₹${orderData.delivery_fee}`}</span>
                            </div>
                            <div class="info-row" style="font-weight: 800; font-size: 16px;">
                                <span>Total Paid</span>
                                <span style="color: var(--accent-green);">₹${orderData.total || 0}</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="order-info-card">
                    <div class="info-title"><i class="fas fa-map-marker-alt"></i> Delivery Address</div>
                    <div class="info-body">
                        <p><strong>${escapeHtml(address.full_name || '')}</strong></p>
                        <p>${escapeHtml(address.address || '')}</p>
                        <p>${escapeHtml(address.city || '')} - ${escapeHtml(address.pincode || '')}</p>
                        <p>Phone: ${escapeHtml(address.phone || '')}</p>
                    </div>
                </div>

                <div class="action-buttons">
                    <a href="order-tracking.html?order=${orderData.order_id}" class="track-btn">
                        <i class="fas fa-map-marked-alt"></i> Track Order
                    </a>
                    <a href="index.html" class="shop-btn">
                        <i class="fas fa-shopping-bag"></i> Continue Shopping
                    </a>
                </div>
            `;
        }

        function showError(message) {
            document.getElementById('mainContent').innerHTML = `
                <div class="success-card" style="border-color: var(--danger);">
                    <div class="success-icon" style="background: #FEE2E2;">
                        <i class="fas fa-exclamation-triangle" style="color: var(--danger);"></i>
                    </div>
                    <div class="success-title">Something went wrong</div>
                    <div class="success-message">${message}</div>
                    <a href="index.html" class="track-btn" style="background: var(--primary); text-decoration: none;">Go to Home</a>
                </div>
            `;
        }

        function goToHome() {
            window.location.href = 'index.html';
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadOrder();
        });

        window.goToHome = goToHome;
    </script>
</body>
</html>
