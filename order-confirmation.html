<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Order Confirmed - Zatpat</title>
    <meta name="theme-color" content="#16A34A">
    
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #16A34A;
            --primary-light: #22C55E;
            --primary-bg-light: #F0FDF4;
            --accent-orange: #F97316;
            --bg-white: #FFFFFF;
            --bg-light: #F9FAFB;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --border-light: #E5E7EB;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-full: 9999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        #pageProgress {
            position: fixed; top: 0; left: 0; width: 0%; height: 3px;
            background: var(--primary); z-index: 10001; transition: width 0.3s ease;
        }
        #pageProgress.loading { width: 90%; }
        #pageProgress.complete { width: 100%; opacity: 0; transition: opacity 0.3s; }

        /* Main Container */
        .confirmation-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 16px 40px;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Success Animation */
        .success-animation {
            text-align: center;
            padding: 30px 0 20px;
        }

        .checkmark-circle {
            width: 100px;
            height: 100px;
            background: var(--primary-bg-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            animation: scaleIn 0.5s ease;
        }

        .checkmark-circle i {
            font-size: 50px;
            color: var(--primary);
            animation: checkPop 0.5s ease 0.2s both;
        }

        @keyframes scaleIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes checkPop {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        .success-title {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .success-message {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        /* Order Card */
        .order-card {
            background: var(--bg-white);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-light);
        }

        .order-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-light);
        }

        .order-id-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .order-id-value {
            font-size: 16px;
            font-weight: 700;
            font-family: monospace;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .copy-btn {
            background: var(--bg-light);
            border: none;
            padding: 6px 10px;
            border-radius: var(--radius-full);
            font-size: 11px;
            color: var(--primary);
            cursor: pointer;
        }

        .order-date {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Delivery Estimate */
        .delivery-estimate {
            background: var(--primary-bg-light);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--primary-light);
        }

        .estimate-icon {
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .estimate-icon i {
            font-size: 24px;
            color: var(--primary);
        }

        .estimate-content {
            flex: 1;
        }

        .estimate-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 2px;
        }

        .estimate-time {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-primary);
        }

        .estimate-address {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Items Summary */
        .items-summary {
            margin-bottom: 20px;
        }

        .summary-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .summary-title i {
            color: var(--primary);
        }

        .item-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-light);
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .item-qty {
            width: 24px;
            height: 24px;
            background: var(--bg-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .item-name {
            flex: 1;
            font-size: 13px;
        }

        .item-price {
            font-weight: 600;
            color: var(--primary);
        }

        .more-items {
            font-size: 12px;
            color: var(--text-secondary);
            padding: 8px 0;
            text-align: center;
        }

        /* Payment Summary */
        .payment-summary {
            background: var(--bg-light);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 24px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .summary-row.total {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            border-top: 1px solid var(--border-light);
            margin-top: 8px;
            padding-top: 12px;
        }

        .total-amount {
            color: var(--primary);
        }

        .payment-method {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 16px 20px;
            border-radius: var(--radius-full);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:active {
            background: var(--primary-light);
            transform: scale(0.98);
        }

        .btn-secondary {
            background: white;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .btn-secondary:active {
            background: var(--primary-bg-light);
            transform: scale(0.98);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-light);
        }

        /* Share Section */
        .share-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .share-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .share-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .share-icon.whatsapp {
            background: #25D366;
            color: white;
        }

        .share-icon.copy {
            background: var(--bg-light);
            color: var(--primary);
            border: 1px solid var(--border-light);
        }

        .share-label {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* Toast */
        .toast-notification {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--text-primary); color: white; padding: 12px 24px;
            border-radius: var(--radius-full); font-size: 13px; z-index: 10050;
            display: none; white-space: nowrap;
        }
        .toast-notification.show { display: flex; }

        /* Loading */
        .loading-spinner { text-align: center; padding: 60px; }
        .spinner {
            width: 40px; height: 40px; border: 3px solid var(--border-light);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="pageProgress"></div>
<div id="toastMsg" class="toast-notification"><span id="toastText"></span></div>

<div id="mainContent">
    <div class="loading-spinner"><div class="spinner"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const supabaseUrl = 'https://zwajyovemwdqtkecipeb.supabase.co';
    const supabaseKey = 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1';
    const zatpatDB = supabase.createClient(supabaseUrl, supabaseKey);

    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('id') || urlParams.get('order_id');

    let orderData = null;
    let orderItems = [];

    function startProgress() { const b = document.getElementById('pageProgress'); b.style.width = '0%'; b.classList.add('loading'); setTimeout(() => b.style.width = '90%', 10); }
    function completeProgress() { const b = document.getElementById('pageProgress'); b.classList.remove('loading'); b.classList.add('complete'); setTimeout(() => { b.style.width = '0%'; b.classList.remove('complete'); }, 300); }
    window.fastNavigate = function(url) { startProgress(); setTimeout(() => window.location.href = url, 50); };

    function showToast(msg) {
        const t = document.getElementById('toastMsg');
        document.getElementById('toastText').innerHTML = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    async function loadOrder() {
        const container = document.getElementById('mainContent');
        
        // If no order ID, show mock/demo
        if (!orderId) {
            // Check localStorage for last order
            const lastOrder = localStorage.getItem('zatpat_last_order');
            if (lastOrder) {
                try {
                    const parsed = JSON.parse(lastOrder);
                    orderData = parsed.order;
                    orderItems = parsed.items || [];
                } catch (e) {}
            }
            
            // Mock data if nothing found
            if (!orderData) {
                orderData = {
                    id: 'ZAT' + Math.random().toString(36).substring(2, 10).toUpperCase(),
                    total_amount: 312,
                    delivery_fee: 20,
                    payment_method: 'cod',
                    delivery_address: 'Sillod, Maharashtra - 431112',
                    created_at: new Date().toISOString(),
                    customer_name: 'Customer'
                };
                orderItems = [
                    { product_name: 'Farm Fresh Milk', quantity: 1, price: 54 },
                    { product_name: 'Organic Apples', quantity: 2, price: 99 },
                    { product_name: 'Organic Wheat Flour', quantity: 1, price: 40 }
                ];
            }
            renderConfirmation();
            return;
        }

        // Fetch real order from Supabase
        try {
            const { data: order } = await zatpatDB
                .from('orders')
                .select('*')
                .eq('id', orderId)
                .single();

            const { data: items } = await zatpatDB
                .from('order_items')
                .select('*')
                .eq('order_id', orderId);

            orderData = order;
            orderItems = items || [];
            
            // Save to localStorage for offline access
            localStorage.setItem('zatpat_last_order', JSON.stringify({ order, items }));
            
            renderConfirmation();
        } catch (e) {
            console.error('Load error:', e);
            renderConfirmation();
        }
    }

    function renderConfirmation() {
        const container = document.getElementById('mainContent');
        const order = orderData;
        
        const orderDate = order.created_at ? new Date(order.created_at).toLocaleDateString('en-IN', {
            day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
        }) : 'Just now';

        const itemTotal = orderItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        const deliveryFee = order.delivery_fee || 20;
        const grandTotal = order.total_amount || (itemTotal + deliveryFee);

        // Items HTML (show first 3)
        let itemsHtml = '';
        orderItems.slice(0, 3).forEach(item => {
            itemsHtml += `
                <div class="item-row">
                    <span class="item-qty">${item.quantity}</span>
                    <span class="item-name">${item.product_name}</span>
                    <span class="item-price">₹${item.price * item.quantity}</span>
                </div>
            `;
        });

        if (orderItems.length > 3) {
            itemsHtml += `<div class="more-items">+${orderItems.length - 3} more items</div>`;
        }

        container.innerHTML = `
            <div class="confirmation-container">
                <div class="success-animation">
                    <div class="checkmark-circle">
                        <i class="fas fa-check"></i>
                    </div>
                    <h1 class="success-title">Order Confirmed!</h1>
                    <p class="success-message">Your order has been placed successfully</p>
                </div>

                <div class="order-card">
                    <div class="order-header">
                        <div>
                            <div class="order-id-label">Order ID</div>
                            <div class="order-id-value">
                                #${order.id?.slice(0, 8).toUpperCase() || 'ZAT123456'}
                                <button class="copy-btn" onclick="copyOrderId()"><i class="far fa-copy"></i> Copy</button>
                            </div>
                        </div>
                        <div class="order-date">${orderDate}</div>
                    </div>

                    <div class="delivery-estimate">
                        <div class="estimate-icon">
                            <i class="fas fa-truck"></i>
                        </div>
                        <div class="estimate-content">
                            <div class="estimate-title">Estimated Delivery</div>
                            <div class="estimate-time">10-15 minutes</div>
                            <div class="estimate-address">
                                <i class="fas fa-map-pin"></i> ${order.delivery_address || 'Sillod, Maharashtra'}
                            </div>
                        </div>
                    </div>

                    <div class="items-summary">
                        <div class="summary-title">
                            <i class="fas fa-shopping-bag"></i> Items (${orderItems.length})
                        </div>
                        ${itemsHtml}
                    </div>

                    <div class="payment-summary">
                        <div class="summary-row"><span>Item Total</span> <span>₹${itemTotal}</span></div>
                        <div class="summary-row"><span>Delivery Fee</span> <span>₹${deliveryFee}</span></div>
                        <div class="summary-row"><span>Discount</span> <span style="color: var(--primary);">-₹0</span></div>
                        <div class="summary-row total"><span>Total Amount</span> <span class="total-amount">₹${grandTotal}</span></div>
                        <div class="payment-method">
                            <i class="fas ${order.payment_method === 'cod' ? 'fa-money-bill-wave' : 'fa-qrcode'}"></i>
                            ${order.payment_method === 'cod' ? 'Cash on Delivery' : 'Paid via UPI'}
                        </div>
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="btn btn-primary" onclick="trackOrder()">
                        <i class="fas fa-truck"></i> Track Order
                    </button>
                    <button class="btn btn-secondary" onclick="fastNavigate('index.html')">
                        <i class="fas fa-home"></i> Home
                    </button>
                </div>

                <button class="btn btn-outline" onclick="fastNavigate('orders.html')" style="width: 100%;">
                    <i class="fas fa-receipt"></i> View All Orders
                </button>

                <div class="share-section">
                    <div class="share-btn" onclick="shareViaWhatsApp()">
                        <div class="share-icon whatsapp"><i class="fab fa-whatsapp"></i></div>
                        <span class="share-label">WhatsApp</span>
                    </div>
                    <div class="share-btn" onclick="copyOrderLink()">
                        <div class="share-icon copy"><i class="fas fa-link"></i></div>
                        <span class="share-label">Copy Link</span>
                    </div>
                </div>
            </div>
        `;
    }

    window.copyOrderId = function() {
        const orderId = orderData?.id?.slice(0, 8).toUpperCase() || 'ZAT123456';
        navigator.clipboard?.writeText(orderId);
        showToast('📋 Order ID copied!');
    };

    window.trackOrder = function() {
        if (orderData?.id) {
            fastNavigate(`order-tracking.html?id=${orderData.id}`);
        } else {
            fastNavigate('order-tracking.html');
        }
    };

    window.shareViaWhatsApp = function() {
        const orderId = orderData?.id?.slice(0, 8).toUpperCase() || 'ZAT123456';
        const total = orderData?.total_amount || 312;
        const text = `🎉 Order Confirmed!%0AOrder ID: ${orderId}%0ATotal: ₹${total}%0A%0ATrack your order on Zatpat!`;
        window.open(`https://wa.me/?text=${text}`, '_blank');
    };

    window.copyOrderLink = function() {
        const url = window.location.href;
        navigator.clipboard?.writeText(url);
        showToast('🔗 Link copied to clipboard!');
    };

    // Initialize
    document.addEventListener('DOMContentLoaded', loadOrder);

    window.copyOrderId = copyOrderId;
    window.trackOrder = trackOrder;
    window.shareViaWhatsApp = shareViaWhatsApp;
    window.copyOrderLink = copyOrderLink;
</script>
</body>
</html>
