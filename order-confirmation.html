<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Order Confirmed - ZyMart+</title>
    <meta name="theme-color" content="#0B5A31">
    <meta name="description" content="ZyMart+ - Your order has been placed successfully">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root{--brand-green:#0B5A31;--brand-green-dark:#083D21;--brand-orange:#F59E0B;--brand-orange-dark:#E8890A;--neutral-white:#FFFFFF;--neutral-bg:#F9FAFB;--neutral-border:#E5E7EB;--neutral-gray:#6B7280;--neutral-dark:#1A1A1A;--success:#10B981;--shadow-xs:0 1px 2px rgba(0,0,0,0.04);--shadow-sm:0 1px 4px rgba(0,0,0,0.06);--shadow-md:0 4px 16px rgba(0,0,0,0.08);--shadow-lg:0 8px 30px rgba(0,0,0,0.12);--radius-sm:10px;--radius-md:14px;--radius-lg:18px;--radius-xl:22px;--radius-full:9999px;}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',-apple-system,sans-serif;background:var(--neutral-bg);color:var(--neutral-dark);overflow-x:hidden;min-height:100vh;width:100%;max-width:100%;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
        #simpleLoader{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--neutral-white);z-index:10002;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity 0.3s ease;}
        #simpleLoader.fade-out{opacity:0;visibility:hidden;pointer-events:none;}
        .simple-spinner{width:34px;height:34px;border:2.5px solid var(--neutral-border);border-top-color:var(--brand-orange);border-radius:50%;animation:spin 0.7s linear infinite;}
        .loader-logo{font-family:'Poppins',sans-serif;font-size:22px;font-weight:700;}
        .loader-zy{color:#A3E635;}.loader-mart{color:#FDE047;}
        @keyframes spin{to{transform:rotate(360deg);}}@keyframes fadeInUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}@keyframes scaleIn{from{transform:scale(0);opacity:0;}to{transform:scale(1);opacity:1;}}@keyframes checkPop{0%{transform:scale(0);}60%{transform:scale(1.2);}100%{transform:scale(1);}}
        .top-bar{background:var(--brand-green);position:fixed;top:0;left:0;width:100%;z-index:1000;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 16px rgba(11,90,49,0.3);}
        .back-btn{width:40px;height:40px;min-width:40px;background:rgba(255,255,255,0.10);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:white;font-size:15px;text-decoration:none;}
        .back-btn:active{background:rgba(255,255,255,0.22);transform:scale(0.93);}
        .top-title{font-family:'Poppins',sans-serif;flex:1;font-size:17px;font-weight:700;color:white;}
        .brand-zy{color:#A3E635;}.brand-mart{color:#FDE047;}
        .main-content{padding-top:62px;max-width:500px;margin:0 auto;padding-bottom:30px;animation:fadeInUp 0.5s ease;}
        .success-animation{text-align:center;padding:30px 0 20px;}
        .checkmark-circle{width:96px;height:96px;background:#D1FAE5;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;animation:scaleIn 0.5s ease;}
        .checkmark-circle i{font-size:46px;color:var(--success);animation:checkPop 0.5s ease 0.2s both;}
        .success-title{font-family:'Poppins',sans-serif;font-size:24px;font-weight:800;color:var(--brand-green);margin-bottom:6px;}
        .success-message{font-size:14px;color:var(--neutral-gray);margin-bottom:22px;line-height:1.5;}
        .order-card{background:var(--neutral-white);margin:0 14px 18px;border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-md);border:1px solid var(--neutral-border);}
        .order-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--neutral-border);}
        .order-id-label{font-size:11px;color:var(--neutral-gray);text-transform:uppercase;letter-spacing:0.5px;}
        .order-id-value{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
        .order-id-pill{background:#F3F5F4;padding:4px 10px;border-radius:6px;font-family:'JetBrains Mono','SF Mono','Courier New',monospace;font-size:13px;letter-spacing:0.3px;font-weight:600;color:var(--brand-green);border:1px solid #E5E7EB;}
        .copy-btn{background:var(--neutral-bg);border:1px solid var(--neutral-border);padding:6px 12px;border-radius:var(--radius-full);font-size:11px;color:var(--brand-green);cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;}
        .copy-btn:active{background:#EDF7F1;border-color:var(--brand-green);}
        .order-date{font-size:12px;color:var(--neutral-gray);}
        .delivery-estimate{background:#EDF7F1;border-radius:var(--radius-md);padding:14px;margin-bottom:18px;display:flex;align-items:center;gap:12px;border:1px solid #C8E6C9;}
        .estimate-icon{width:48px;height:48px;min-width:48px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;}
        .estimate-icon i{font-size:22px;color:var(--brand-green);}
        .estimate-title{font-size:13px;font-weight:600;color:var(--brand-green);margin-bottom:2px;}
        .estimate-time{font-family:'Poppins',sans-serif;font-size:18px;font-weight:800;color:var(--neutral-dark);}
        .estimate-address{font-size:11px;color:var(--neutral-gray);margin-top:3px;}
        .items-summary{margin-bottom:18px;}
        .summary-title{font-family:'Poppins',sans-serif;font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
        .item-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--neutral-border);}
        .item-row:last-child{border-bottom:none;}
        .item-qty{width:26px;height:26px;min-width:26px;background:#F3F5F4;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--neutral-gray);}
        .item-info{flex:1;min-width:0;}
        .item-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .item-variant{font-size:10px;color:var(--brand-green);font-weight:600;}
        .item-price{font-weight:700;color:var(--brand-green);white-space:nowrap;font-size:13px;}
        .more-items{font-size:12px;color:var(--neutral-gray);padding:7px 0;text-align:center;font-weight:500;}
        .payment-summary{background:#F9FAFB;border-radius:var(--radius-md);padding:14px;margin-bottom:22px;}
        .summary-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;color:var(--neutral-gray);}
        .summary-row.total{font-size:16px;font-weight:800;color:var(--neutral-dark);border-top:1px solid var(--neutral-border);margin-top:8px;padding-top:12px;}
        .total-amount{color:var(--brand-green);}
        .savings-row{font-size:10px;color:var(--success);text-align:right;font-weight:600;margin-top:2px;}
        .payment-method{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:12px;color:var(--neutral-gray);font-weight:500;}
        .action-buttons{display:flex;gap:10px;padding:0 14px;margin-bottom:14px;}
        .btn{flex:1;padding:15px 16px;border-radius:var(--radius-full);font-size:14px;font-weight:600;cursor:pointer;border:none;display:flex;align-items:center;justify-content:center;gap:7px;font-family:'Inter',sans-serif;transition:all 0.15s ease;}
        .btn:active{transform:scale(0.96);}
        .btn-primary{background:var(--brand-green);color:white;box-shadow:0 4px 14px rgba(11,90,49,0.25);}
        .btn-primary:active{background:var(--brand-green-dark);}
        .btn-secondary{background:white;color:var(--brand-green);border:1.5px solid var(--brand-green);}
        .btn-outline{background:transparent;color:var(--neutral-gray);border:1px solid var(--neutral-border);}
        .invite-banner{margin:12px 14px;padding:14px;background:#FFF8EB;border:1px solid #FDE68A;border-radius:var(--radius-md);text-align:center;}
        .invite-title{font-family:'Poppins',sans-serif;font-size:14px;font-weight:700;color:#92400E;margin-bottom:3px;}
        .invite-subtitle{font-size:11px;color:#A16207;margin-bottom:10px;}
        .btn-invite{background:var(--brand-orange);color:white;border:none;padding:10px 20px;border-radius:var(--radius-full);font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;box-shadow:0 4px 14px rgba(245,158,11,0.22);}
        .share-section{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:18px;padding-bottom:10px;}
        .share-btn-item{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;}
        .share-btn-item:active{transform:scale(0.93);}
        .share-icon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;}
        .share-icon.whatsapp{background:#25D366;color:white;}
        .share-icon.copy{background:#F3F5F4;color:var(--brand-green);border:1px solid var(--neutral-border);}
        .share-label{font-size:11px;color:var(--neutral-gray);font-weight:500;}
        .login-prompt{text-align:center;padding:55px 20px;}
        .login-prompt i{font-size:52px;color:#D1D5DB;margin-bottom:12px;display:block;}
        .login-prompt h3{font-family:'Poppins',sans-serif;font-size:17px;font-weight:700;margin-bottom:6px;}
        .login-prompt p{font-size:13px;color:var(--neutral-gray);margin-bottom:18px;}
        .btn-orange{background:var(--brand-orange);color:#1a1a1a;border:none;padding:11px 26px;border-radius:var(--radius-full);font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;display:inline-block;}
        .toast-notification{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--neutral-dark);color:white;padding:11px 22px;border-radius:var(--radius-full);font-size:12px;z-index:10050;opacity:0;visibility:hidden;white-space:nowrap;box-shadow:var(--shadow-lg);transition:all 0.3s ease;}
        .toast-notification.show{opacity:1;visibility:visible;}
        .toast-notification.success{background:var(--success);}
        .toast-notification.error{background:#EF4444;}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="simpleLoader"><div class="simple-spinner"></div><div class="loader-logo"><span class="loader-zy">Zy</span><span class="loader-mart">Mart</span></div></div>
<div id="toastMsg" class="toast-notification"><span id="toastText"></span></div>

<div id="mainApp" style="display:none;">
    <div class="top-bar">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <span class="top-title"><span class="brand-zy">Zy</span><span class="brand-mart">Mart</span> Confirmed 🎉</span>
    </div>
    <div class="main-content" id="mainContent">
        <div style="text-align:center;padding:60px;"><div style="width:36px;height:36px;border:2.5px solid #E5E7EB;border-top-color:#F59E0B;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto;"></div></div>
    </div>
</div>

<script>
(function(){'use strict';
window.addEventListener('error',function(e){console.error('[Confirm]',e.message);try{showToast('Something went wrong','error');}catch(_){}});

function getEl(id){return document.getElementById(id);}
function safeJSON(s,f){try{return s?JSON.parse(s):f;}catch(e){return f;}}
function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

var sb=supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co','sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1');
var orderId=null,orderData=null,orderItems=[],currentUser=null;
try{orderId=new URLSearchParams(window.location.search).get('id');}catch(e){}

function showApp(){var l=getEl('simpleLoader'),a=getEl('mainApp');if(a)a.style.display='';if(l){l.classList.add('fade-out');setTimeout(function(){if(l&&l.parentNode)l.parentNode.removeChild(l);},300);}}

function showToast(m,type){
    var t=getEl('toastMsg'),s=getEl('toastText');
    if(!t||!s)return;s.textContent=m;
    t.className='toast-notification';
    if(type==='error')t.classList.add('error');
    else if(type==='success')t.classList.add('success');
    t.classList.add('show');clearTimeout(t._t);
    t._t=setTimeout(function(){t.classList.remove('show','error','success');},2500);
}

function fmtWeight(w,u){
    if(!w)return'';
    if(u==='gram'||u==='g')return w>=1000?(w/1000).toFixed(1).replace(/\.0$/,'')+' kg':w+' g';
    if(u==='kg')return w+' kg';
    if(u==='liter'||u==='l')return w+' L';
    if(u==='ml')return w+' ml';
    return w+' '+(u||'');
}

async function checkUser(){
    try{var r=await sb.auth.getSession();if(r&&r.data&&r.data.session){currentUser=r.data.session.user;return true;}}catch(e){}
    try{var session=JSON.parse(localStorage.getItem('zymart_session')||'null');if(session&&session.userId){currentUser={id:session.userId,phone:session.phone};return true;}}catch(e){}
    currentUser=null;return false;
}

function goToLogin(){
    try{sessionStorage.setItem('zymart_redirect_after_login','order-confirmed.html'+(orderId?'?id='+orderId:''));}catch(e){}
    window.location.href='login.html';
}

async function loadOrder(){
    var c=getEl('mainContent');
    var loggedIn=await checkUser();
    if(!loggedIn){
        c.innerHTML='<div class="login-prompt"><i class="fas fa-user-lock"></i><h3>Login Required</h3><p>Please login to view your order</p><button class="btn-orange" onclick="goToLogin()"><i class="fas fa-sign-in-alt"></i> Login / Register</button></div>';
        showApp();return;
    }
    
    // Try to get order from URL param first
    if(orderId){
        try{
            var r=await sb.from('orders').select('*').eq('id',orderId).single();
            if(r&&r.data){orderData=r.data;orderItems=parseItems(orderData.items);}
        }catch(e){console.warn('[Confirm] Order fetch failed:',e);}
    }
    
    // Fallback to localStorage
    if(!orderData){
        try{orderData=safeJSON(localStorage.getItem('zymart_last_order'),null);}catch(e){}
        if(orderData){orderItems=parseItems(orderData.items||[]);}
    }
    
    if(orderData){renderConfirmation();}else{
        c.innerHTML='<div class="login-prompt"><i class="fas fa-receipt"></i><h3>Order Not Found</h3><p style="color:#6B7280;">Could not find your order details</p><button class="btn-orange" onclick="window.location.href=\'orders.html\'">📋 View All Orders</button></div>';
    }
    showApp();
}

function parseItems(items){
    if(!items)return[];
    if(typeof items==='string'){try{return JSON.parse(items);}catch(e){return[];}}
    if(Array.isArray(items))return items;
    return[];
}

function renderConfirmation(){
    var o=orderData;if(!o)return;
    var oid=(o.id||'').substring(0,8).toUpperCase();
    var date=o.created_at?new Date(o.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
    var itemTotal=orderItems.reduce(function(s,i){return s+((i.price||0)*(i.quantity||1));},0);
    var df=parseFloat(o.delivery_fee)||0,total=parseFloat(o.total_amount)||(itemTotal+df);
    var savings=df===0?40:0;
    
    // Items HTML with variant info
    var itemsHtml='';
    for(var j=0;j<Math.min(orderItems.length,4);j++){
        var item=orderItems[j];
        var variantLabel='';
        if(item.variant_weight)variantLabel=fmtWeight(item.variant_weight,item.variant_unit);
        else if(item.variant_key&&item.variant_key.indexOf('_')>-1){
            var parts=item.variant_key.split('_');
            if(parts.length>=3&&parts[1]!=='0')variantLabel=fmtWeight(parseFloat(parts[1]),parts[2]);
        }
        itemsHtml+='<div class="item-row"><span class="item-qty">'+(item.quantity||1)+'</span><div class="item-info"><span class="item-name">'+esc(item.product_name||item.name||'Item')+'</span>'+(variantLabel?'<span class="item-variant">⚖️ '+variantLabel+'</span>':'')+'</div><span class="item-price">₹'+Number((item.price||0)*(item.quantity||1)).toLocaleString('en-IN')+'</span></div>';
    }
    if(orderItems.length>4)itemsHtml+='<div class="more-items">+ '+(orderItems.length-4)+' more items</div>';
    
    getEl('mainContent').innerHTML=
    '<div class="success-animation"><div class="checkmark-circle"><i class="fas fa-check"></i></div><h1 class="success-title">Order Confirmed! 🎉</h1><p class="success-message">Your order has been placed successfully.<br>The shop will contact you soon.</p></div>'+
    '<div class="order-card"><div class="order-header"><div><div class="order-id-label">Order ID</div><div class="order-id-value"><span class="order-id-pill">#'+esc(oid)+'</span><button class="copy-btn" onclick="copyOrderId()"><i class="far fa-copy"></i> Copy</button></div></div><div class="order-date">📅 '+esc(date)+'</div></div>'+
    '<div class="delivery-estimate"><div class="estimate-icon"><i class="fas fa-truck"></i></div><div><div class="estimate-title">Estimated Delivery</div><div class="estimate-time">Within 30-60 mins</div><div class="estimate-address"><i class="fas fa-map-pin"></i> '+esc(o.customer_city||'Your Location')+(o.location_verified?' <span style="color:#0B5A31;font-weight:600;">📍 Verified</span>':'')+'</div></div></div>'+
    '<div class="items-summary"><div class="summary-title"><i class="fas fa-shopping-bag"></i> Order Items ('+orderItems.length+')</div>'+itemsHtml+'</div>'+
    '<div class="payment-summary"><div class="summary-row"><span>Item Total</span><span>₹'+itemTotal.toLocaleString('en-IN')+'</span></div><div class="summary-row"><span>Delivery Fee</span><span>'+(df===0?'🎉 FREE':'₹'+df.toLocaleString('en-IN'))+'</span></div>'+
    (savings>0?'<div class="savings-row">💰 You saved ₹'+savings+' on delivery!</div>':'')+
    '<div class="summary-row total"><span>Total Amount</span><span class="total-amount">₹'+total.toLocaleString('en-IN')+'</span></div><div class="payment-method"><i class="fas '+(o.payment_method==='cod'?'fa-money-bill-wave':'fa-qrcode')+'"></i> '+(o.payment_method==='cod'?'Cash on Delivery':'Online Payment')+'</div></div></div>'+
    '<div class="action-buttons"><button class="btn btn-primary" onclick="window.location.href=\'order-details.html?id='+o.id+'\'"><i class="fas fa-truck"></i> Track Order</button><button class="btn btn-secondary" onclick="window.location.href=\'index.html\'"><i class="fas fa-home"></i> Home</button></div>'+
    '<button class="btn btn-outline" onclick="window.location.href=\'orders.html\'" style="width:calc(100% - 28px);margin:0 14px 10px;">📋 View All Orders</button>'+
    '<div class="invite-banner"><div class="invite-title">🎁 Invite Friends & Earn ₹50!</div><div class="invite-subtitle">Get ₹50 for every friend\'s first order</div><button class="btn-invite" onclick="window.location.href=\'invite-earn.html\'"><i class="fas fa-gift"></i> Invite Now</button></div>'+
    '<div class="share-section"><div class="share-btn-item" onclick="shareWhatsApp()"><div class="share-icon whatsapp"><i class="fab fa-whatsapp"></i></div><span class="share-label">WhatsApp</span></div><div class="share-btn-item" onclick="copyLink()"><div class="share-icon copy"><i class="fas fa-link"></i></div><span class="share-label">Copy Link</span></div></div>';
}

window.copyOrderId=function(){
    var oid=(orderData||{}).id||'';
    if(oid){navigator.clipboard.writeText(oid.substring(0,8).toUpperCase()).then(function(){showToast('📋 Order ID copied!','success');}).catch(function(){showToast('#'+oid.substring(0,8).toUpperCase());});}
};

window.shareWhatsApp=function(){
    var text='🎉 ZyMart+ Order Confirmed!\nOrder ID: #'+((orderData||{}).id||'').substring(0,8).toUpperCase()+'\n📍 '+((orderData||{}).customer_city||'')+'\n📱 ZyMart+ - Your Local Market';
    window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
};

window.copyLink=function(){
    navigator.clipboard.writeText(window.location.href).then(function(){showToast('🔗 Link copied!','success');}).catch(function(){});
};

document.addEventListener('DOMContentLoaded',function(){
    loadOrder();
    // Vibrate on success
    if(navigator.vibrate)navigator.vibrate([50,30,50,30,50]);
});

})();
</script>
</body>
</html>
