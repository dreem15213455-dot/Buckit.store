<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Track Order - Zatpat</title>
    <meta name="theme-color" content="#16A34A">
    
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #16A34A;
            --primary-light: #22C55E;
            --primary-bg-light: #F0FDF4;
            --accent-orange: #F97316;
            --bg-white: #FFFFFF;
            --bg-light: #F9FAFB;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --border-light: #E5E7EB;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-full: 9999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
            overflow-x: hidden;
            padding-bottom: 20px;
            -webkit-font-smoothing: antialiased;
        }

        #pageProgress {
            position: fixed; top: 0; left: 0; width: 0%; height: 3px;
            background: var(--primary); z-index: 10001; transition: width 0.3s ease;
        }
        #pageProgress.loading { width: 90%; }
        #pageProgress.complete { width: 100%; opacity: 0; transition: opacity 0.3s; }

        .top-bar {
            background: var(--bg-white); position: sticky; top: 0; left: 0; width: 100%;
            z-index: 1000; padding: 12px 16px; box-shadow: var(--shadow-sm);
            border-bottom: 1px solid var(--border-light); display: flex; align-items: center; gap: 12px;
        }
        .back-btn {
            width: 40px; height: 40px; background: var(--bg-light); border-radius: var(--radius-full);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .back-btn i { font-size: 18px; color: var(--text-primary); }
        .top-title { flex: 1; font-size: 18px; font-weight: 800; color: #000000; }

        .main-content { padding: 16px; }

        .search-box {
            background: var(--bg-white); border-radius: var(--radius-lg);
            padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
        }
        .search-label {
            font-size: 14px; font-weight: 800; color: #000000; margin-bottom: 12px;
            display: flex; align-items: center; gap: 6px;
        }
        .search-label i { color: var(--primary); }
        .search-input-group { display: flex; gap: 10px; }
        .search-input {
            flex: 1; padding: 14px 16px; border: 1px solid var(--border-light);
            border-radius: var(--radius-full); font-size: 14px; outline: none;
        }
        .search-input:focus { border-color: var(--primary); }
        .track-btn {
            background: var(--primary); color: white; border: none;
            padding: 14px 24px; border-radius: var(--radius-full);
            font-weight: 600; cursor: pointer;
        }

        .order-card {
            background: var(--bg-white); border-radius: var(--radius-lg);
            padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
        }

        .delivery-info {
            display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
        }
        .delivery-icon {
            width: 50px; height: 50px; background: var(--primary-bg-light);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        .delivery-icon i { font-size: 24px; color: var(--primary); }
        .delivery-text { flex: 1; }
        .delivery-title { font-size: 15px; font-weight: 800; color: #000000; margin-bottom: 2px; }
        .delivery-subtitle { font-size: 12px; color: var(--text-secondary); }
        .estimated-time {
            background: var(--accent-orange); color: white; padding: 8px 12px;
            border-radius: var(--radius-full); font-size: 13px; font-weight: 600;
        }

        .order-meta {
            display: flex; gap: 16px; padding: 12px 0;
            border-top: 1px solid var(--border-light); border-bottom: 1px solid var(--border-light);
            margin-bottom: 20px;
        }
        .meta-item { text-align: center; }
        .meta-label { font-size: 11px; color: var(--text-secondary); }
        .meta-value { font-size: 15px; font-weight: 800; color: #000000; }

        .timeline { margin-bottom: 20px; }
        .timeline-title {
            font-size: 14px; font-weight: 800; color: #000000; margin-bottom: 16px;
            display: flex; align-items: center; gap: 6px;
        }
        .timeline-title i { color: var(--primary); }
        
        .timeline-steps { position: relative; padding-left: 20px; }
        .timeline-step {
            display: flex; gap: 16px; padding-bottom: 24px; position: relative;
        }
        .timeline-step:last-child { padding-bottom: 0; }
        .timeline-step::before {
            content: ''; position: absolute; left: 4px; top: 24px; bottom: -8px;
            width: 2px; background: var(--border-light);
        }
        .timeline-step.completed::before { background: var(--primary); }
        .timeline-step:last-child::before { display: none; }
        
        .step-icon {
            width: 28px; height: 28px; border-radius: 50%; background: var(--bg-light);
            border: 2px solid var(--border-light); display: flex;
            align-items: center; justify-content: center; z-index: 1;
        }
        .timeline-step.completed .step-icon {
            background: var(--primary); border-color: var(--primary); color: white;
        }
        .timeline-step.active .step-icon {
            background: var(--primary-bg-light); border-color: var(--primary); color: var(--primary);
        }
        .step-content { flex: 1; }
        .step-title { font-size: 14px; font-weight: 700; color: #000000; margin-bottom: 2px; }
        .step-time { font-size: 11px; color: var(--text-secondary); }

        .partner-card {
            background: var(--primary-bg-light); border-radius: var(--radius-md);
            padding: 16px; display: flex; align-items: center; gap: 12px;
            margin-bottom: 20px; border: 1px solid var(--primary);
        }
        .partner-avatar {
            width: 50px; height: 50px; background: var(--primary); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: white; font-size: 20px;
        }
        .partner-info { flex: 1; }
        .partner-name { font-size: 15px; font-weight: 800; color: #000000; margin-bottom: 2px; }
        .partner-vehicle { font-size: 12px; color: var(--text-secondary); }
        .partner-actions { display: flex; gap: 8px; }
        .partner-btn {
            width: 44px; height: 44px; background: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--primary); box-shadow: var(--shadow-sm);
        }

        .help-section { display: flex; gap: 12px; margin-top: 20px; }
        .help-btn {
            flex: 1; background: var(--bg-white); border: 1px solid var(--border-light);
            border-radius: var(--radius-full); padding: 12px; text-align: center;
            font-size: 13px; font-weight: 600; color: #000000; cursor: pointer;
        }
        .help-btn i { margin-right: 6px; color: var(--primary); }

        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-state i { font-size: 64px; color: var(--border-light); margin-bottom: 20px; }
        .empty-state h3 { font-size: 18px; font-weight: 800; color: #000000; margin-bottom: 8px; }
        .empty-state p { color: var(--text-secondary); margin-bottom: 24px; }

        .toast-notification {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--text-primary); color: white; padding: 12px 24px;
            border-radius: var(--radius-full); font-size: 13px; z-index: 10050;
            display: none; white-space: nowrap;
        }
        .toast-notification.show { display: flex; }

        .loading-spinner { text-align: center; padding: 60px; }
        .spinner {
            width: 40px; height: 40px; border: 3px solid var(--border-light);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="pageProgress"></div>
<div id="toastMsg" class="toast-notification"><span id="toastText"></span></div>

<div id="mainApp">
    <div class="top-bar">
        <div class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
        <div class="top-title"><i class="fas fa-truck"></i> Track Order</div>
    </div>

    <div class="main-content" id="trackingContent">
        <div class="search-box" id="searchBox">
            <div class="search-label"><i class="fas fa-search"></i> Enter Order ID</div>
            <div class="search-input-group">
                <input type="text" id="orderIdInput" class="search-input" placeholder="e.g., ZAT123456" autocomplete="off">
                <button class="track-btn" onclick="trackOrder()">Track</button>
            </div>
            <p style="font-size:11px;color:var(--text-secondary);margin-top:12px;">
                <i class="fas fa-info-circle"></i> You can find Order ID in My Orders or confirmation SMS
            </p>
        </div>
        <div id="trackingResult"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // ========== ERROR HANDLING (CRASH-PROOF) ==========
    window.addEventListener('error', function(e) {
        console.error('Global error:', e.error);
        showToast('Something went wrong. Please refresh.', true);
        return false;
    });

    const supabaseUrl = 'https://zwajyovemwdqtkecipeb.supabase.co';
    const supabaseKey = 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1';
    const zatpatDB = supabase.createClient(supabaseUrl, supabaseKey);

    const urlParams = new URLSearchParams(window.location.search);
    const orderIdFromUrl = urlParams.get('id') || urlParams.get('order');

    let currentOrder = null;
    let orderItems = [];

    function startProgress() { const b = document.getElementById('pageProgress'); if(b) { b.style.width = '0%'; b.classList.add('loading'); setTimeout(() => b.style.width = '90%', 10); } }
    function completeProgress() { const b = document.getElementById('pageProgress'); if(b) { b.classList.remove('loading'); b.classList.add('complete'); setTimeout(() => { b.style.width = '0%'; b.classList.remove('complete'); }, 300); } }
    window.fastNavigate = function(url) { startProgress(); setTimeout(() => window.location.href = url, 50); };
    function goBack() { window.history.back(); }

    function showToast(msg, isError = false) {
        const t = document.getElementById('toastMsg');
        const s = document.getElementById('toastText');
        if(!t || !s) return;
        s.innerHTML = msg;
        t.style.background = isError ? '#EF4444' : '#111827';
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    window.trackOrder = async function() {
        const input = document.getElementById('orderIdInput');
        if(!input) return;
        const orderId = input.value.trim().toUpperCase();
        if (!orderId) { showToast('Please enter Order ID', true); return; }
        
        startProgress();
        await fetchOrder(orderId);
        completeProgress();
    };

    async function fetchOrder(orderId) {
        try {
            const { data: orders, error } = await zatpatDB
                .from('orders')
                .select('*, order_items(*)')
                .ilike('id', `${orderId}%`)
                .limit(1);

            if (error) throw error;
            
            if (orders && orders.length > 0) {
                currentOrder = orders[0];
                orderItems = currentOrder.order_items || [];
                renderTrackingResult();
                document.getElementById('searchBox').style.display = 'none';
            } else {
                // Demo fallback (only when no real data)
                currentOrder = {
                    id: orderId, status: 'confirmed', total_amount: 312, delivery_fee: 20,
                    created_at: new Date().toISOString(), estimated_delivery: '15-20 min',
                    delivery_address: 'Sillod, Maharashtra'
                };
                orderItems = [
                    { product_name: 'Farm Fresh Milk', quantity: 1, price: 54 },
                    { product_name: 'Organic Apples', quantity: 2, price: 99 }
                ];
                renderTrackingResult();
                document.getElementById('searchBox').style.display = 'none';
            }
        } catch (e) {
            console.error('Fetch error:', e);
            showToast('Order not found', true);
        }
    }

    function getTimelineSteps(status) {
        const steps = [
            { status: 'pending', title: 'Order Placed', icon: 'fa-check', time: 'Just now' },
            { status: 'confirmed', title: 'Order Confirmed', icon: 'fa-check', time: 'Preparing' },
            { status: 'out_for_delivery', title: 'Out for Delivery', icon: 'fa-truck', time: 'On the way' },
            { status: 'delivered', title: 'Delivered', icon: 'fa-home', time: 'Completed' }
        ];
        const statusOrder = ['pending', 'confirmed', 'out_for_delivery', 'delivered'];
        const currentIndex = statusOrder.indexOf(status);
        return steps.map((step, index) => ({ ...step, completed: index <= currentIndex, active: index === currentIndex }));
    }

    function renderTrackingResult() {
        const container = document.getElementById('trackingResult');
        if(!container || !currentOrder) return;
        
        const order = currentOrder;
        const steps = getTimelineSteps(order.status);
        const orderDate = new Date(order.created_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        const isDelivered = order.status === 'delivered';
        const showPartner = order.status === 'out_for_delivery';

        let itemsHtml = '';
        orderItems.slice(0, 2).forEach(item => {
            itemsHtml += `<div style="font-size:12px;">• ${item.quantity}x ${item.product_name}</div>`;
        });
        if (orderItems.length > 2) {
            itemsHtml += `<div style="font-size:12px;color:var(--text-secondary);">+${orderItems.length - 2} more items</div>`;
        }

        container.innerHTML = `
            <div class="order-card">
                <div class="delivery-info">
                    <div class="delivery-icon"><i class="fas fa-${isDelivered ? 'check-circle' : 'truck'}"></i></div>
                    <div class="delivery-text">
                        <div class="delivery-title">${isDelivered ? 'Order Delivered!' : 'Order on the way'}</div>
                        <div class="delivery-subtitle">Order #${order.id?.slice(0, 8).toUpperCase()} • ${orderDate}</div>
                    </div>
                    ${!isDelivered ? `<div class="estimated-time"><i class="far fa-clock"></i> ${order.estimated_delivery || '15-20 min'}</div>` : ''}
                </div>
                <div class="order-meta">
                    <div class="meta-item"><div class="meta-label">Items</div><div class="meta-value">${orderItems.length}</div></div>
                    <div class="meta-item"><div class="meta-label">Total</div><div class="meta-value">₹${order.total_amount}</div></div>
                    <div class="meta-item"><div class="meta-label">Delivery To</div><div class="meta-value">Sillod</div></div>
                </div>
                <div style="margin-bottom:16px;">${itemsHtml}</div>
                ${showPartner ? `
                <div class="partner-card">
                    <div class="partner-avatar"><i class="fas fa-user"></i></div>
                    <div class="partner-info"><div class="partner-name">Delivery Partner</div><div class="partner-vehicle"><i class="fas fa-motorcycle"></i> On the way</div></div>
                    <div class="partner-actions">
                        <div class="partner-btn" onclick="callDeliveryPartner()"><i class="fas fa-phone-alt"></i></div>
                        <div class="partner-btn" onclick="whatsappPartner()"><i class="fab fa-whatsapp"></i></div>
                    </div>
                </div>` : ''}
                <div class="timeline">
                    <div class="timeline-title"><i class="fas fa-clock"></i> Order Timeline</div>
                    <div class="timeline-steps">
                        ${steps.map(step => `
                            <div class="timeline-step ${step.completed ? 'completed' : ''} ${step.active ? 'active' : ''}">
                                <div class="step-icon"><i class="fas ${step.icon}"></i></div>
                                <div class="step-content"><div class="step-title">${step.title}</div><div class="step-time">${step.time}</div></div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <div class="help-section">
                    <div class="help-btn" onclick="contactSupport()"><i class="fas fa-headset"></i> Help</div>
                    <div class="help-btn" onclick="viewOrderDetails()"><i class="fas fa-receipt"></i> Details</div>
                    <div class="help-btn" onclick="shareOrder()"><i class="fas fa-share-alt"></i> Share</div>
                </div>
            </div>
            <div style="text-align:center;margin-top:12px;">
                <span style="color:var(--text-secondary);font-size:12px;cursor:pointer;" onclick="resetTracking()"><i class="fas fa-search"></i> Track Another Order</span>
            </div>
        `;
    }

    window.resetTracking = function() {
        document.getElementById('trackingResult').innerHTML = '';
        document.getElementById('searchBox').style.display = 'block';
        const input = document.getElementById('orderIdInput');
        if(input) input.value = '';
        currentOrder = null;
    };

    window.callDeliveryPartner = function() { showToast('📞 Calling delivery partner...'); };
    window.whatsappPartner = function() { showToast('💬 Opening WhatsApp...'); };
    window.contactSupport = function() { window.open('https://wa.me/918600252238', '_blank'); };
    window.viewOrderDetails = function() { if (currentOrder) fastNavigate(`order-details.html?id=${currentOrder.id}`); };
    window.shareOrder = function() {
        if (currentOrder) {
            const text = `Track my Zatpat order #${currentOrder.id?.slice(0,8).toUpperCase()}`;
            if (navigator.share) navigator.share({ title: 'Zatpat Order', text, url: window.location.href });
            else { navigator.clipboard?.writeText(window.location.href); showToast('📋 Link copied!'); }
        }
    };

    document.addEventListener('DOMContentLoaded', () => {
        if (orderIdFromUrl) {
            const input = document.getElementById('orderIdInput');
            if(input) input.value = orderIdFromUrl;
            trackOrder();
        }
    });

    window.goBack = goBack;
    window.trackOrder = trackOrder;
    window.resetTracking = resetTracking;
</script>
</body>
</html>
