<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>दुकान रजिस्टर करें - Zatpat</title>
    <meta name="theme-color" content="#0F6E3B">
    <meta name="description" content="Zatpat पर अपनी दुकान रजिस्टर करें - सिर्फ ₹299">
    
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.min.js"></script>
    
    <style>
        :root { 
            --primary: #0F6E3B; --primary-light: #16A34A; --primary-dark: #0B5C30; 
            --primary-bg-light: #DCFCE7; --primary-bg-dark: #BBF7D0; 
            --accent-orange: #F97316; --accent-orange-dark: #EA580C; 
            --accent-red: #EF4444; --accent-yellow: #FACC15; --accent-gold: #F59E0B;
            --bg-white: #FFFFFF; --bg-light: #F9FAFB; --bg-dark: #F3F4F6; 
            --text-primary: #111827; --text-secondary: #6B7280; --text-white: #FFFFFF; 
            --border-light: #E5E7EB; --success: #10B981; --danger: #EF4444; --warning: #F59E0B;
            --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 20px; --radius-2xl: 24px; 
            --radius-full: 9999px; --shadow-sm: 0 1px 2px rgba(0,0,0,0.05); 
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1); --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1); 
            --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.1); --transition-fast: 0.15s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', 'Noto Sans Devanagari', sans-serif; 
            background: var(--bg-light); color: var(--text-primary); 
            -webkit-tap-highlight-color: transparent; min-height: 100vh; padding-bottom: 30px;
            overflow-x: hidden; width: 100%; max-width: 100%;
        }
        
        #simpleLoader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-white); z-index: 10002; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; transition: opacity 0.3s ease, visibility 0.3s ease; }
        #simpleLoader.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
        .simple-spinner { width: 36px; height: 36px; border: 3px solid var(--border-light); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.6s linear infinite; }
        .loader-logo { font-size: 22px; font-weight: 800; color: var(--primary); }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        
        .skeleton-block { background: linear-gradient(90deg, #e5e5e5 25%, #d4d4d4 50%, #e5e5e5 75%); background-size: 200% 100%; animation: skeleton-loading 1s infinite; border-radius: var(--radius-md); }
        .skeleton-hero { height: 200px; border-radius: var(--radius-2xl); margin: 12px 14px; }
        .skeleton-card { background: white; margin: 0 14px 20px; border-radius: var(--radius-2xl); padding: 22px; }
        .skeleton-line { height: 14px; margin-bottom: 14px; width: 100%; }
        .skeleton-line-sm { height: 14px; margin-bottom: 14px; width: 60%; }
        .skeleton-btn { height: 48px; border-radius: var(--radius-full); width: 100%; }
        
        .top-bar { background: var(--primary); position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; padding: 10px 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 12px rgba(15,110,59,0.3); overflow: hidden; }
        .top-bar::before { content: ''; position: absolute; top: -60%; left: -35%; width: 90%; height: 220%; background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.04) 40%, transparent 100%); transform: rotate(-12deg); pointer-events: none; z-index: 0; }
        .back-btn { width: 36px; height: 36px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 15px; outline: none; transition: all 0.15s; position: relative; z-index: 1; }
        .back-btn:active { background: rgba(255,255,255,0.35); transform: scale(0.92); }
        .brand-name { font-size: 20px; font-weight: 800; position: relative; z-index: 1; }
        .brand-name .normal { color: white; font-weight: 800; }
        .brand-name .pat { color: #86EFAC; font-weight: 900; }
        .page-title { flex: 1; text-align: center; font-weight: 600; font-size: 14px; color: white; position: relative; z-index: 1; }
        .main-content { padding-top: 56px; padding-bottom: 40px; max-width: 600px; margin: 0 auto; }
        
        /* ========== 🔥 HERO - FULL PHOTO + BOTTOM STRIP ONLY ========== */
        .hero-section { 
            background: linear-gradient(135deg, var(--primary), #059669); 
            margin: 12px 14px; padding: 0; 
            border-radius: var(--radius-2xl); 
            animation: fadeInUp 0.4s ease; overflow: hidden; position: relative;
            min-height: 200px;
            display: flex;
            flex-direction: column;
        }
        
        /* Full photo - no overlay on top portion */
        .hero-banner-img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            position: absolute; 
            top: 0; left: 0; 
            z-index: 0; 
        }
        
        /* Spacer to push strip to bottom */
        .hero-spacer {
            flex: 1;
            position: relative;
            z-index: 1;
        }
        
        /* Bottom thin strip only */
        .hero-bottom-strip {
            position: relative;
            z-index: 1;
            background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.3) 70%, transparent 100%);
            padding: 20px 18px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        
        .hero-text-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .hero-main-text {
            font-size: 15px;
            font-weight: 800;
            color: white;
            text-shadow: 0 1px 3px rgba(0,0,0,0.4);
            line-height: 1.2;
        }
        
        .hero-sub-text {
            font-size: 11px;
            color: rgba(255,255,255,0.85);
            font-weight: 500;
        }
        
        .fee-badge { 
            background: rgba(255,255,255,0.2); 
            display: inline-flex; 
            align-items: center;
            gap: 5px;
            padding: 8px 16px; 
            border-radius: var(--radius-full); 
            font-weight: 700; 
            font-size: 14px; 
            border: 1px solid rgba(255,255,255,0.3); 
            backdrop-filter: blur(4px);
            color: white;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .fee-badge i { font-size: 11px; }
        
        /* Default state (no photo) */
        .hero-section.no-photo {
            background: linear-gradient(135deg, var(--primary), #059669);
        }
        .hero-section.no-photo .hero-spacer {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            color: white;
            padding: 20px;
        }
        .hero-section.no-photo .hero-spacer .default-icon {
            font-size: 44px;
            margin-bottom: 8px;
        }
        .hero-section.no-photo .hero-spacer .default-title {
            font-size: 22px;
            font-weight: 800;
        }
        .hero-section.no-photo .hero-bottom-strip {
            background: rgba(0,0,0,0.25);
            justify-content: center;
        }
        
        .form-card { background: white; margin: 0 14px 20px; border-radius: var(--radius-2xl); box-shadow: var(--shadow-lg); overflow: hidden; animation: fadeInUp 0.4s ease; }
        .form-header { padding: 18px 22px; border-bottom: 1px solid var(--border-light); background: var(--primary-bg-light); display: flex; align-items: center; gap: 8px; }
        .form-header i { color: var(--primary); font-size: 18px; }
        .form-header h2 { font-size: 18px; font-weight: 700; color: var(--primary-dark); }
        .form-body { padding: 22px; }
        
        .form-group { margin-bottom: 14px; }
        .form-label { font-weight: 600; font-size: 12px; margin-bottom: 4px; display: block; color: var(--text-primary); }
        .form-label i { color: var(--primary); width: 16px; margin-right: 3px; }
        .form-label .required { color: var(--danger); }
        .form-control { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border-light); border-radius: var(--radius-md); font-size: 13px; font-family: 'Inter', sans-serif; outline: none; background: white; transition: all 0.15s; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15,110,59,0.08); }
        .form-control.error { border-color: var(--danger); background: #FEF2F2; }
        .form-control.valid { border-color: var(--success); }
        select.form-control { -webkit-appearance: none; padding-right: 32px; }
        textarea.form-control { resize: vertical; min-height: 60px; }
        
        .image-upload-area { border: 2px dashed var(--primary); border-radius: var(--radius-md); padding: 16px; text-align: center; cursor: pointer; background: var(--primary-bg-light); transition: all 0.15s; }
        .image-upload-area:active { background: var(--primary-bg-dark); }
        .image-upload-area i { font-size: 24px; color: var(--primary); margin-bottom: 4px; }
        .image-upload-area p { font-size: 11px; color: var(--primary); font-weight: 500; }
        .image-preview { max-width: 100%; max-height: 120px; margin-top: 8px; border-radius: var(--radius-md); display: none; }
        .compress-info { font-size: 10px; color: var(--primary); margin-top: 4px; display: none; }
        .upload-progress { width: 100%; height: 4px; background: var(--border-light); border-radius: 2px; margin-top: 8px; display: none; overflow: hidden; }
        .upload-progress-bar { height: 100%; background: var(--primary); border-radius: 2px; width: 0%; transition: width 0.3s ease; }
        
        .location-btn { width: 100%; padding: 11px; background: var(--bg-dark); border: 1.5px solid var(--border-light); border-radius: var(--radius-md); font-weight: 600; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--text-primary); transition: all 0.15s; font-family: 'Inter', sans-serif; }
        .location-btn:active { background: var(--primary-bg-light); border-color: var(--primary); }
        .location-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .location-status { font-size: 11px; padding: 8px 10px; border-radius: var(--radius-sm); background: var(--bg-light); margin-top: 8px; display: flex; align-items: center; gap: 6px; }
        .location-status.success { color: var(--success); background: #ECFDF5; }
        .location-status.error { color: var(--danger); }
        
        .auth-btn { background: var(--primary); color: white; border: none; padding: 13px; border-radius: var(--radius-full); font-weight: 700; font-size: 14px; width: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.15s; box-shadow: 0 4px 14px rgba(15,110,59,0.25); font-family: 'Inter', sans-serif; }
        .auth-btn:active { background: var(--primary-dark); transform: scale(0.98); }
        .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .text-muted { color: var(--text-secondary); font-size: 11px; text-align: center; margin-top: 10px; }
        
        .fee-summary { background: var(--bg-light); border-radius: var(--radius-lg); padding: 12px 14px; margin-bottom: 18px; border: 1px solid var(--border-light); }
        .fee-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; }
        .fee-row.total { border-top: 1px solid var(--border-light); padding-top: 8px; font-weight: 700; font-size: 14px; }
        
        .toast-notification { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--text-primary); color: white; padding: 10px 20px; border-radius: var(--radius-full); font-size: 12px; font-weight: 600; z-index: 10050; opacity: 0; visibility: hidden; white-space: nowrap; box-shadow: var(--shadow-xl); transition: all 0.25s; }
        .toast-notification.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(-5px); }
        
        .alert-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 9990; }
        .alert-modal.show { display: flex; }
        .alert-content { background: white; border-radius: var(--radius-xl); padding: 24px; max-width: 340px; width: 90%; text-align: center; animation: fadeInUp 0.3s ease; }
        .alert-content i { font-size: 40px; display: block; margin-bottom: 10px; }
        .alert-content h3 { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
        .alert-content p { font-size: 13px; color: var(--text-secondary); margin-bottom: 14px; line-height: 1.5; white-space: pre-line; }
        .alert-btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: var(--radius-full); font-weight: 700; cursor: pointer; width: 100%; font-size: 13px; font-family: 'Inter', sans-serif; }
        .alert-btn:active { background: var(--primary-dark); }
        
        @media (max-width: 380px) {
            .hero-section { min-height: 170px; }
            .hero-main-text { font-size: 13px; }
            .fee-badge { font-size: 12px; padding: 6px 12px; }
            .form-body { padding: 16px; }
        }
    </style>
</head>
<body>

<div id="simpleLoader"><div class="simple-spinner"></div><div class="loader-logo">Zatpat</div></div>

<div id="mainApp" style="display:none;">
    <div class="top-bar">
        <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
        <div class="brand-name"><span class="normal">Zat</span><span class="pat">pat</span></div>
        <div class="page-title">दुकान रजिस्टर करें</div>
    </div>

    <div class="main-content" id="mainContent">
        <div class="skeleton-hero skeleton-block"></div>
        <div class="skeleton-card">
            <div class="skeleton-block skeleton-line"></div>
            <div class="skeleton-block skeleton-line-sm"></div>
            <div class="skeleton-block skeleton-line"></div>
            <div class="skeleton-block skeleton-line"></div>
            <div class="skeleton-block skeleton-line-sm"></div>
            <div class="skeleton-block skeleton-line"></div>
            <div class="skeleton-block skeleton-btn"></div>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast-notification"><span id="toastText"></span></div>

<div id="customAlert" class="alert-modal">
    <div class="alert-content">
        <i id="alertIcon" class="fas fa-info-circle" style="color:var(--warning);"></i>
        <h3 id="alertTitle">सूचना</h3>
        <p id="alertMessage"></p>
        <button class="alert-btn" onclick="closeAlert()">ठीक है</button>
    </div>
</div>

<script>
(function() {
    'use strict';
    var sb = supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co','sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1');
    var SUPABASE_URL = 'https://zwajyovemwdqtkecipeb.supabase.co';
    var categories = [], selectedImageFile = null, selectedQrFile = null, isProcessing = false, isCapturingLocation = false, registrationFee = 299;
    var heroBannerUrl = null;

    // ========== ANDROID GPS BRIDGE ==========
    window.androidLatitude = null;
    window.androidLongitude = null;

    function setLocationFromAndroid(lat, lng) {
        if (!lat || !lng || isNaN(lat) || isNaN(lng) || lat === 0 || lng === 0 ||
            lat < -90 || lat > 90 || lng < -180 || lng > 180) return;
        
        window.androidLatitude = lat;
        window.androidLongitude = lng;
        
        var latEl = document.getElementById('shopLatitude');
        var lngEl = document.getElementById('shopLongitude');
        if (latEl) latEl.value = lat;
        if (lngEl) lngEl.value = lng;
        
        var coordsEl = document.getElementById('locationCoords');
        if (coordsEl) coordsEl.textContent = '📍 ' + Number(lat).toFixed(6) + ', ' + Number(lng).toFixed(6);
        
        var statusDiv = document.getElementById('locationStatus');
        if (statusDiv) {
            statusDiv.innerHTML = '<i class="fas fa-check-circle"></i> ✅ Android GPS स्वतः कैप्चर!';
            statusDiv.className = 'location-status success';
        }
        
        showToast('📍 Android GPS से लोकेशन ली गई!');
        saveFormData();
    }
    
    window.setLocationFromAndroid = setLocationFromAndroid;

    function getFullUrl(url) {
        if (!url) return '';
        if (url.indexOf('http') === 0 || url.indexOf('data:') === 0) return url;
        return SUPABASE_URL + '/storage/v1/object/public/' + url;
    }

    function escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    function showApp() {
        var loader = document.getElementById('simpleLoader');
        var app = document.getElementById('mainApp');
        if (app) app.style.display = '';
        if (loader) {
            loader.classList.add('fade-out');
            setTimeout(function() { if (loader.parentNode) loader.parentNode.removeChild(loader); }, 300);
        }
    }

    async function safeFetch(fetchFn, maxRetries) {
        maxRetries = maxRetries || 3;
        var lastError = null;
        for (var i = 0; i < maxRetries; i++) {
            try {
                var result = await fetchFn();
                if (result.error) { lastError = new Error(result.error.message); if (i===maxRetries-1) throw lastError; }
                else return result;
            } catch(err) { lastError = err; if (i===maxRetries-1) throw lastError; }
            await new Promise(function(r) { setTimeout(r, Math.pow(2,i)*500); });
        }
        throw lastError;
    }

    async function fetchHeroBanner() {
        try {
            var result = await safeFetch(function() {
                return sb.from('app_settings').select('value').eq('key', 'shop_register_banner').maybeSingle();
            });
            if (result.data && result.data.value) {
                heroBannerUrl = getFullUrl(result.data.value);
            }
        } catch(e) { heroBannerUrl = null; }
        return heroBannerUrl;
    }

    window.addEventListener('online', function() { showToast('✅ इंटरनेट बहाल!'); });
    window.addEventListener('offline', function() { showToast('⚠️ इंटरनेट नहीं', true); });

    function showToast(msg, isErr) {
        var t = document.getElementById('toastMsg'), s = document.getElementById('toastText');
        if(!t||!s) return;
        s.textContent = msg; t.style.background = isErr ? '#EF4444' : '#111827';
        t.classList.add('show'); clearTimeout(t._timer);
        t._timer = setTimeout(function(){ t.classList.remove('show'); }, 3000);
    }

    function showAlert(msg, title, icon) {
        title = title || 'सूचना'; icon = icon || 'warning';
        document.getElementById('alertMessage').textContent = msg;
        document.getElementById('alertTitle').textContent = title;
        var iconEl = document.getElementById('alertIcon');
        iconEl.style.color = icon === 'success' ? 'var(--success)' : icon === 'error' ? 'var(--danger)' : 'var(--warning)';
        iconEl.className = 'fas ' + (icon === 'success' ? 'fa-check-circle' : icon === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle');
        document.getElementById('customAlert').classList.add('show');
    }

    function closeAlert() { document.getElementById('customAlert').classList.remove('show'); }
    window.closeAlert = closeAlert;

    function goBack() { 
        try { if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) { window.history.back(); return; } } catch(e) {}
        window.location.href = 'index.html';
    }
    window.fastNavigate = function(url) { window.location.href = url; };

    function saveFormData() {
        var data = {};
        var fields = ['ownerName','ownerEmail','ownerPhone','ownerWhatsapp','shopName','shopCategory','shopPhone','shopAddress','shopCity','shopPincode','shopDesc','shopLatitude','shopLongitude'];
        fields.forEach(function(id) { var el = document.getElementById(id); if(el) data[id] = el.value; });
        try { localStorage.setItem('zatpat_shop_draft', JSON.stringify(data)); } catch(e) {}
    }

    function loadFormData() {
        try {
            var raw = localStorage.getItem('zatpat_shop_draft');
            if(!raw) return;
            var data = JSON.parse(raw);
            Object.keys(data).forEach(function(id) { var el = document.getElementById(id); if(el && data[id]) el.value = data[id]; });
        } catch(e) {}
    }

    function clearFormData() { try { localStorage.removeItem('zatpat_shop_draft'); } catch(e) {} }

    async function fetchRegistrationFee() {
        try {
            var result = await safeFetch(function() { return sb.from('app_settings').select('value').eq('key','registration_fee').maybeSingle(); });
            if(result.data && result.data.value) registrationFee = parseInt(result.data.value) || 299;
        } catch(e) { registrationFee = 299; }
    }

    async function compressImage(file) {
        if(!file||!file.type||file.type.indexOf('image/')!==0) return file;
        if(file.size<150*1024) return file;
        try { 
            if(window.imageCompression) { 
                var opts = {maxSizeMB:0.15,maxWidthOrHeight:800,useWebWorker:true,fileType:'image/jpeg',initialQuality:0.7}; 
                return await window.imageCompression(file,opts); 
            } 
            return file; 
        } catch(e) { return file; }
    }

    async function uploadImage(file, folder) {
        if(!file) return null;
        var compressed = await compressImage(file);
        var fn = Date.now()+'_'+Math.random().toString(36).substr(2,6)+'.jpg';
        var progBar = document.querySelector('.upload-progress-bar');
        var progWrap = document.querySelector('.upload-progress');
        if(progWrap) progWrap.style.display = 'block';
        if(progBar) progBar.style.width = '30%';
        try {
            var uploadResult = await safeFetch(function() {
                return sb.storage.from('shop-images').upload(folder+'/'+fn, compressed, { cacheControl: '3600', upsert: true });
            });
            if(uploadResult.error) {
                var errMsg = uploadResult.error.message || 'अनजान त्रुटि';
                if(errMsg.toLowerCase().indexOf('duplicate')!==-1) throw new Error('फ़ाइल पहले से मौजूद');
                if(errMsg.toLowerCase().indexOf('permission')!==-1) throw new Error('अपलोड अनुमति नहीं');
                throw new Error('अपलोड त्रुटि: ' + errMsg);
            }
            if(progBar) progBar.style.width = '100%';
            setTimeout(function() { if(progWrap) progWrap.style.display = 'none'; }, 500);
            return sb.storage.from('shop-images').getPublicUrl(folder+'/'+fn).data.publicUrl;
        } catch(e) {
            if(progWrap) progWrap.style.display = 'none';
            throw e;
        }
    }

    function captureShopLocation() {
        if (window.androidLatitude && window.androidLongitude) {
            setLocationFromAndroid(window.androidLatitude, window.androidLongitude);
            return;
        }
        if(isCapturingLocation) { showToast('⚠️ प्रतीक्षा करें...', true); return; }
        if(!navigator.geolocation) { showAlert('GPS सपोर्ट नहीं', 'त्रुटि', 'error'); return; }
        
        isCapturingLocation = true;
        var btn = document.querySelector('.location-btn');
        if(btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> खोज रहे...'; }
        
        var statusDiv = document.getElementById('locationStatus');
        if(statusDiv) { statusDiv.innerHTML = '<i class="fas fa-spinner fa-spin"></i> GPS खोज रहे...'; statusDiv.className = 'location-status'; }
        
        var retryCount = 0, maxRetries = 2;
        function attemptGPS() {
            var timeoutId = setTimeout(function() {
                isCapturingLocation = false;
                if(btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-location-dot"></i> GPS कैप्चर करें'; }
                if(statusDiv) { statusDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> टाइमआउट'; statusDiv.className = 'location-status error'; }
                showAlert('GPS नहीं मिला। खुली जगह पर जाएं।', 'टाइमआउट', 'error');
            }, 25000);
            
            navigator.geolocation.getCurrentPosition(
                async function(pos) {
                    clearTimeout(timeoutId); isCapturingLocation = false;
                    if(btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-location-dot"></i> GPS कैप्चर करें'; }
                    var lat = pos.coords.latitude, lng = pos.coords.longitude;
                    document.getElementById('shopLatitude').value = lat;
                    document.getElementById('shopLongitude').value = lng;
                    var coordsEl = document.getElementById('locationCoords');
                    if(coordsEl) coordsEl.textContent = '📍 '+lat.toFixed(6)+', '+lng.toFixed(6);
                    if(statusDiv) { statusDiv.innerHTML = '<i class="fas fa-check-circle"></i> सफल!'; statusDiv.className = 'location-status success'; }
                    try {
                        var resp = await fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lng+'&zoom=18', {headers:{'User-Agent':'ZatpatApp/5.0'}});
                        var data = await resp.json();
                        var addrEl = document.getElementById('locationAddress');
                        if(addrEl && data.display_name) { addrEl.innerHTML = '<i class="fas fa-map-pin"></i> '+data.display_name.substring(0,100); addrEl.style.display='block'; }
                        var cityInput = document.getElementById('shopCity');
                        if(cityInput && !cityInput.value) { var city = data.address?.city||data.address?.town||''; if(city) cityInput.value = city; }
                    } catch(e) {}
                    saveFormData(); showToast('📍 लोकेशन कैप्चर!');
                },
                function(err) {
                    clearTimeout(timeoutId); retryCount++;
                    if(retryCount < maxRetries) { showToast('🔄 पुनः प्रयास...', true); setTimeout(attemptGPS, 1000); }
                    else {
                        isCapturingLocation = false;
                        if(btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-location-dot"></i> GPS कैप्चर करें'; }
                        var msg = 'GPS विफल। ';
                        if(err.code===1) msg+='लोकेशन परमिशन दें।';
                        else if(err.code===2) msg+='सिग्नल नहीं।';
                        else msg+='पुनः प्रयास करें।';
                        if(statusDiv) { statusDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> '+msg; statusDiv.className = 'location-status error'; }
                        showAlert(msg, 'विफल', 'error');
                    }
                },
                {enableHighAccuracy:true,timeout:25000,maximumAge:300000}
            );
        }
        attemptGPS();
    }

    async function checkEmailExists(email) {
        try {
            var shopCheck = await safeFetch(function() { return sb.from('shops').select('id').eq('owner_email', email).maybeSingle(); });
            if(shopCheck.data) return true;
            var userCheck = await safeFetch(function() { return sb.from('users').select('id').eq('email', email).maybeSingle(); });
            if(userCheck.data) return true;
            return false;
        } catch(e) { return false; }
    }

    function setupRealTimeValidation() {
        var validators = {
            ownerEmail: { regex: /^[^\s@]+@[^\s@]+\.[^\s@]+$/, msg: 'अमान्य' },
            ownerPhone: { regex: /^\d{10}$/, msg: '10 अंक' },
            shopPhone: { regex: /^\d{10}$/, msg: '10 अंक' },
            shopPincode: { regex: /^\d{6}$/, msg: '6 अंक' },
            ownerWhatsapp: { regex: /^$|^\d{10}$/, msg: '10 अंक' }
        };
        Object.keys(validators).forEach(function(id) {
            var el = document.getElementById(id); if(!el) return;
            el.addEventListener('input', function() {
                var val = el.value.trim(); if(!val) { el.classList.remove('error','valid'); return; }
                if(validators[id].regex.test(val)) { el.classList.remove('error'); el.classList.add('valid'); }
                else { el.classList.remove('valid'); el.classList.add('error'); }
            });
            el.addEventListener('change', saveFormData);
        });
        document.querySelectorAll('input, textarea, select').forEach(function(el) { el.addEventListener('change', saveFormData); });
    }

    async function registerShop() {
        if(isProcessing) return;
        var ownerName = document.getElementById('ownerName').value.trim();
        var ownerEmail = document.getElementById('ownerEmail').value.trim();
        var ownerPhone = document.getElementById('ownerPhone').value.trim();
        var ownerWhatsapp = document.getElementById('ownerWhatsapp').value.trim();
        var shopName = document.getElementById('shopName').value.trim();
        var category = document.getElementById('shopCategory').value;
        var shopPhone = document.getElementById('shopPhone').value.trim();
        var address = document.getElementById('shopAddress').value.trim();
        var city = document.getElementById('shopCity').value.trim();
        var pincode = document.getElementById('shopPincode').value.trim();
        var desc = document.getElementById('shopDesc').value.trim();
        var lat = document.getElementById('shopLatitude').value;
        var lng = document.getElementById('shopLongitude').value;
        
        if(!ownerName||ownerName.length<2){ showAlert('पूरा नाम दर्ज करें।','नाम ज़रूरी','error'); return; }
        if(!ownerEmail||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(ownerEmail)){ showAlert('मान्य ईमेल दर्ज करें।','ईमेल ज़रूरी','error'); return; }
        if(!ownerPhone||!/^\d{10}$/.test(ownerPhone)){ showAlert('10 अंकों का मोबाइल नंबर दर्ज करें।','फ़ोन ज़रूरी','error'); return; }
        if(!shopName){ showAlert('दुकान का नाम दर्ज करें।','नाम ज़रूरी','error'); return; }
        if(!category){ showAlert('श्रेणी चुनें।','श्रेणी ज़रूरी','error'); return; }
        if(!shopPhone||!/^\d{10}$/.test(shopPhone)){ showAlert('दुकान का 10 अंकों का फ़ोन नंबर दर्ज करें।','फ़ोन ज़रूरी','error'); return; }
        if(!address){ showAlert('पूरा पता दर्ज करें।','पता ज़रूरी','error'); return; }
        if(!city){ showAlert('शहर का नाम दर्ज करें।','शहर ज़रूरी','error'); return; }
        if(!pincode||!/^\d{6}$/.test(pincode)){ showAlert('6 अंकों का पिनकोड दर्ज करें।','पिनकोड ज़रूरी','error'); return; }
        if(!lat||!lng){ showAlert('GPS लोकेशन कैप्चर करें।','लोकेशन ज़रूरी','error'); return; }
        
        isProcessing = true;
        var btn = document.getElementById('registerShopBtn');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> जांच हो रही है...';
        btn.disabled = true;
        
        try {
            var emailExists = await checkEmailExists(ownerEmail);
            if(emailExists) {
                isProcessing = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> स्वीकृति के लिए जमा करें'; btn.disabled = false;
                showAlert('यह ईमेल "'+ownerEmail+'" पहले से रजिस्टर है!','ईमेल पहले से रजिस्टर','error');
                return;
            }
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> इमेज अपलोड...';
            var shopImageUrl = null, qrImageUrl = null;
            if(selectedImageFile) { try { shopImageUrl = await uploadImage(selectedImageFile, 'shops'); } catch(e) { isProcessing = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> जमा करें'; btn.disabled = false; showAlert('इमेज अपलोड विफल:\n'+e.message,'त्रुटि','error'); return; } }
            if(selectedQrFile) { try { qrImageUrl = await uploadImage(selectedQrFile, 'qrcodes'); } catch(e) { showToast('QR अपलोड विफल', true); } }
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> जमा हो रहा...';
            var shopResult = await safeFetch(function() {
                return sb.from('shops').insert([{
                    owner_email: ownerEmail, owner_name: ownerName, owner_phone: ownerPhone,
                    owner_whatsapp: ownerWhatsapp || ownerPhone, name: shopName, category: category,
                    phone: shopPhone, whatsapp: shopPhone, address: address, city: city,
                    pincode: pincode, description: desc || null, latitude: parseFloat(lat),
                    longitude: parseFloat(lng), image_url: shopImageUrl, qr_code_url: qrImageUrl,
                    status: 'pending', is_open: false, rating: 0, created_at: new Date().toISOString()
                }]);
            });
            if(shopResult.error) throw new Error(shopResult.error.message);
            clearFormData();
            showAlert('✅ आपकी दुकान सफलतापूर्वक जमा हो गई!\n\nएडमिन 24 घंटे में समीक्षा करेगा।\nलॉगिन: ' + ownerEmail,'सफल 🎉','success');
            btn.innerHTML = '<i class="fas fa-check-circle"></i> जमा हो गया!';
            setTimeout(function(){ window.location.href = 'index.html?just_registered=1'; }, 4000);
        } catch(e) {
            isProcessing = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> जमा करें'; btn.disabled = false;
            showAlert('रजिस्ट्रेशन विफल: '+(e.message||'पुनः प्रयास करें'),'त्रुटि','error');
        }
    }

    function setupImageUpload(areaId, inputId, previewId, compressId, fileVar) {
        var area = document.getElementById(areaId), input = document.getElementById(inputId), preview = document.getElementById(previewId);
        if(!area||!input) return;
        area.onclick = function() { input.click(); };
        input.onchange = async function(e) {
            var file = e.target.files[0]; if(!file) return;
            if(file.size > 5*1024*1024) { showAlert('इमेज बहुत बड़ी! अधिकतम 5MB।','बड़ी फ़ाइल','error'); return; }
            var origSize = (file.size/1024).toFixed(0);
            var compEl = document.getElementById(compressId);
            if(compEl) { compEl.style.display = 'block'; compEl.innerHTML = '<i class="fas fa-spinner fa-spin"></i> कंप्रेस...'; }
            var compressed = await compressImage(file);
            var compSize = (compressed.size/1024).toFixed(0);
            if(fileVar === 'selectedImageFile') selectedImageFile = compressed;
            else if(fileVar === 'selectedQrFile') selectedQrFile = compressed;
            if(compEl) { compEl.innerHTML = '<i class="fas fa-check-circle"></i> '+compSize+'KB'; setTimeout(function(){ compEl.style.display = 'none'; }, 3000); }
            var reader = new FileReader();
            reader.onload = function(ev) { if(preview) { preview.src = ev.target.result; preview.style.display = 'block'; } };
            reader.readAsDataURL(compressed);
            if(origSize !== compSize) showToast('📸 '+origSize+'KB → '+compSize+'KB');
        };
    }
