    async function compressImage(file) {
        if(!file || !file.type || file.type.indexOf('image/') !== 0) return file;
        if(file.size < 80 * 1024) return file;
        return new Promise(function(resolve) {
            var reader = new FileReader(); 
            reader.readAsDataURL(file);
            reader.onload = function(e) { 
                var img = new Image(); 
                img.src = e.target.result;
                img.onload = function() { 
                    var w = img.width, h = img.height, maxDim = 800;
                    if(w > maxDim || h > maxDim) { 
                        if(w > h) { h = Math.round((h * maxDim) / w); w = maxDim; } 
                        else { w = Math.round((w * maxDim) / h); h = maxDim; } 
                    }
                    var canvas = document.createElement('canvas'); 
                    canvas.width = w; 
                    canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    canvas.toBlob(function(blob) { 
                        resolve(new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), { type: 'image/jpeg' })); 
                    }, 'image/jpeg', 0.55);
                }; 
            }; 
        }); 
    }
    
    async function uploadImage(file, folder) {
        if(!file) return null;
        var compressed = await compressImage(file);
        var fn = Date.now() + '_' + Math.random().toString(36).substr(2, 6) + '.jpg';
        var uploadResult = await sb.storage.from('shop-images').upload(folder + '/' + fn, compressed, { cacheControl: '3600', upsert: true });
        if(uploadResult.error) throw new Error('Upload failed');
        return sb.storage.from('shop-images').getPublicUrl(folder + '/' + fn).data.publicUrl; 
    }

    window.captureShopLocation = function() {
        if(isCapturingLocation) { showToast('⚠️ GPS already searching...', true); return; }
        if(window.Android && typeof window.Android.requestLocation === 'function') { 
            isCapturingLocation = true; 
            updateLocationButton('loading'); 
            window.Android.requestLocation(); 
            window._gpsShopTimeout = setTimeout(function() { if(isCapturingLocation) tryBrowserGPS(); }, 12000); 
            return; 
        }
        tryBrowserGPS(); 
    };
    
    function tryBrowserGPS() {
        if(window._gpsShopTimeout) clearTimeout(window._gpsShopTimeout);
        if(!navigator.geolocation) { 
            isCapturingLocation = false; 
            updateLocationButton('retry'); 
            showAlert('GPS is not supported on this device.', 'Error', 'error'); 
            return; 
        }
        updateLocationButton('loading');
        var attempts = 0;
        var bestPosition = null;
        var maxAttempts = 2;
        
        function getBestLocation() {
            attempts++;
            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    if(!bestPosition || pos.coords.accuracy < bestPosition.coords.accuracy) { bestPosition = pos; }
                    if(bestPosition.coords.accuracy <= 50 || attempts >= maxAttempts) {
                        if(window._gpsShopTimeout) clearTimeout(window._gpsShopTimeout); 
                        isCapturingLocation = false;
                        _waitingForGps = false;
                        setLocationData(bestPosition.coords.latitude, bestPosition.coords.longitude, null, bestPosition.coords.accuracy);
                    } else { getBestLocation(); }
                },
                function(err) {
                    if(!bestPosition) {
                        if(window._gpsShopTimeout) clearTimeout(window._gpsShopTimeout);
                        isCapturingLocation = false;
                        updateLocationButton('retry');
                        handleGpsError(err);
                    } else {
                        if(window._gpsShopTimeout) clearTimeout(window._gpsShopTimeout); 
                        isCapturingLocation = false;
                        _waitingForGps = false;
                        setLocationData(bestPosition.coords.latitude, bestPosition.coords.longitude, null, bestPosition.coords.accuracy);
                    }
                },
                { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
            );
        }
        getBestLocation();
    }
    
    function handleGpsError(err) {
        var code = err && err.code;
        if(code === 1) {
            showAlert('Location permission was denied.\n\nPlease allow location access from your browser settings and try again.', 'Permission Denied', 'error');
        } else if(code === 2) {
            if(window.Android && typeof window.Android.openLocationSettings === 'function') {
                try { window.Android.openLocationSettings(); } catch(e) {}
            }
            _waitingForGps = true;
            showAlert('GPS is turned off.\n\nPlease enable Location from your phone settings and try again.', 'GPS Off', 'error',
                [
                    { text: 'Open Settings', cls: 'orange', onClick: function() {
                        if(window.Android && typeof window.Android.openLocationSettings === 'function') {
                            try { window.Android.openLocationSettings(); } catch(e) {}
                        }
                        closeAlert();
                    }},
                    { text: 'Retry GPS', cls: 'gray', onClick: function() { closeAlert(); setTimeout(function() { captureShopLocation(); }, 300); }}
                ]
            );
        } else if(code === 3) {
            showAlert('Location request timed out.\n\nPlease move to an open area and try again.', 'Timeout', 'error',
                [{ text: 'Retry GPS', cls: 'gray', onClick: function() { closeAlert(); setTimeout(function() { captureShopLocation(); }, 300); }}]
            );
        } else {
            showAlert('Unable to get location. Please enable GPS and try again.', 'GPS Failed', 'error',
                [{ text: 'Retry GPS', cls: 'gray', onClick: function() { closeAlert(); setTimeout(function() { captureShopLocation(); }, 300); }}]
            );
        }
    }

    async function fetchAddressFromCoords(lat, lng) {
        try { 
            var c = new AbortController(); 
            var t = setTimeout(function() { c.abort(); }, 7000);
            var url = 'https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lng + '&zoom=18&addressdetails=1';
            var r = await fetch(url, { headers: { 'User-Agent': 'ZyMartApp/1.0' }, signal: c.signal });
            clearTimeout(t); 
            var d = await r.json(); 
            var addr = d.display_name || '';
            var detailedAddr = '';
            var addrObj = d.address || {};
            var parts = [];
            if(addrObj.house_number) parts.push(addrObj.house_number);
            if(addrObj.road || addrObj.street) parts.push(addrObj.road || addrObj.street);
            if(addrObj.neighbourhood || addrObj.suburb || addrObj.quarter || addrObj.hamlet) parts.push(addrObj.neighbourhood || addrObj.suburb || addrObj.quarter || addrObj.hamlet);
            if(addrObj.city || addrObj.town || addrObj.village || addrObj.municipality || addrObj.state_district) parts.push(addrObj.city || addrObj.town || addrObj.village || addrObj.municipality || addrObj.state_district);
            if(addrObj.state) parts.push(addrObj.state);
            if(addrObj.postcode) parts.push(addrObj.postcode);
            detailedAddr = parts.length > 0 ? parts.join(', ') : addr;
            var ae = $('locationAddress'); 
            if(ae && detailedAddr) { ae.innerHTML = '<i class="fas fa-map-pin"></i> ' + detailedAddr.substring(0, 180); ae.style.display = 'block'; }
            autoFillCityFromAddress(detailedAddr, addrObj); 
        } catch(e) { console.error('Reverse geocode failed:', e); } 
    }
    
    function autoFillCityFromAddress(displayName, addressObj) {
        var ci = $('shopCity'); 
        if(!ci) return;
        var city = '';
        var area = '';
        if(addressObj) { 
            city = addressObj.city || addressObj.town || addressObj.municipality || addressObj.village || addressObj.state_district || ''; 
            area = addressObj.neighbourhood || addressObj.suburb || addressObj.quarter || addressObj.hamlet || '';
        }
        if(!city && displayName) { 
            var parts = displayName.split(','); 
            for(var i = 0; i < parts.length; i++) { 
                var part = parts[i].trim(); 
                if(part && part.length > 2 && part.length < 30 && part.indexOf('Maharashtra') === -1 && part.indexOf('India') === -1) { city = part; break; } 
            } 
        }
        if(city && !ci.value) { ci.value = city; showToast('City: ' + city); saveFormData(); }
        var ad = $('shopAddress');
        if(ad && area && !ad.value) { ad.value = area; saveFormData(); }
        var pi = $('shopPincode');
        if(pi && addressObj && addressObj.postcode && !pi.value) {
            var pc = String(addressObj.postcode).replace(/\D/g, '').substring(0, 6);
            if(pc.length === 6) { pi.value = pc; saveFormData(); }
        }
    }

            var es = await sb.from('shops').select('id').eq('owner_email', email).maybeSingle();

        if(phone) {

        if(!phone || !/^[6-9]\d{9}$/.test(phone)) { showFormError('Please enter a valid 10-digit mobile number first.'); scrollToField('ownerPhone'); return; }
        
        if(otpLockedUntil > 0) { 
            var remaining = Math.ceil((otpLockedUntil - Date.now()) / 60000); 
            if(remaining > 0) { showFormError('Too many incorrect attempts. Please try again in ' + remaining + ' minute(s).'); return; } 
            else { otpLockedUntil = 0; otpAttemptCount = 0; } 
        }
        var now = Date.now(); 
        if(now - otpSendWindow > 300000) { otpSendCount = 0; otpSendWindow = now; }
        if(otpSendCount >= 3) { showFormError('Too many OTP requests. Please wait 5 minutes.'); return; }
        if(otpVerified && currentOtpPhone === phone) { showFormSuccess('Number already verified.'); return; }
        if(currentOtpPhone && currentOtpPhone !== phone) { 
            otpVerified = false; 
            $('otpVerifiedBadge').classList.remove('show'); 
            updatePayButton();
        }
        var btn = $('sendOtpBtn'); 
        if(btn) { btn.disabled = true; btn.innerHTML = '<span class="loading-spinner"></span> Sending...'; }
        try {
            var res = await fetch(SUPABASE_URL + '/functions/v1/send-otp', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json', 'apikey': CONFIG.SUPABASE_KEY, 'Authorization': 'Bearer ' + CONFIG.SUPABASE_KEY }, 
                body: JSON.stringify({ phone: phone }) 
            });
            var data = await res.json();
            if(data.Status === 'Success' || data.status === 'success' || data.success === true) { 
                otpSendCount++; 
                currentOtpPhone = phone;
                $('otpSection').classList.add('show'); 
                $('otpSection').classList.remove('verified');
                $('otpPhoneDisplay').textContent = '+91 ' + phone; 
                $('otpInput').value = '';
                showFormSuccess('OTP sent to +91 ' + phone);
                if(btn) btn.style.display = 'none'; 
                startOtpTimer(); 
            } else { 
                showFormError('Failed to send OTP. Please try again.'); 
                if(btn) { btn.disabled = false; btn.innerHTML = 'Send OTP'; } 
            }
        } catch(e) { 
            showFormError('Network error. Please try again.'); 
            if(btn) { btn.disabled = false; btn.innerHTML = 'Send OTP'; } 
        }
    };

        otpTimer = setInterval(function() {

            if(otpSeconds <= 0) { clearInterval(otpTimer); if(rb) { rb.disabled = false; rb.textContent = 'Resend OTP'; } } 
            else { if(rb) rb.textContent = 'Resend OTP (' + otpSeconds + 's)'; } 
        }, 1000);

    window.verifyOTP = async function() {
        showFormError(''); showFormSuccess('');
        if(otpLockedUntil > 0) { 
            var remaining = Math.ceil((otpLockedUntil - Date.now()) / 60000); 
            if(remaining > 0) { showFormError('Too many incorrect attempts. Please try again in ' + remaining + ' minute(s).'); return; } 
            else { otpLockedUntil = 0; otpAttemptCount = 0; } 
        }
        var otp = $('otpInput')?.value.trim();
        if(!otp || otp.length < 4) { showFormError('Please enter the complete OTP.'); return; }
        var btn = $('verifyOtpBtn'); 
        if(btn) { btn.disabled = true; btn.innerHTML = '<span class="loading-spinner"></span> Verifying...'; }
        try {
            var res = await fetch(SUPABASE_URL + '/functions/v1/verify-otp', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json', 'apikey': CONFIG.SUPABASE_KEY, 'Authorization': 'Bearer ' + CONFIG.SUPABASE_KEY }, 
                body: JSON.stringify({ phone: currentOtpPhone, otp: otp }) 
            });
            var data = await res.json();
            if(data.Status === 'Success' || data.status === 'success' || data.success === true) {
                if(data.email && data.password) {
                    btn.innerHTML = '<span class="loading-spinner"></span> Creating session...';
                    var signInRes = await sb.auth.signInWithPassword({ email: data.email, password: data.password });
                    if(signInRes.error) {
                        console.error('Auth sign-in error:', signInRes.error);
                        showFormError('Session creation failed: ' + signInRes.error.message);
                        btn.disabled = false;
                        btn.innerHTML = 'Verify OTP';
                        return;
                    }
                    if(signInRes.data && signInRes.data.session) {
                        authUserId = signInRes.data.session.user.id;
                        authEmail = data.email;
                        authPassword = data.password;
                        console.log('[Auth] Session created:', authUserId);
                    } else {
                        showFormError('Session not created. Please try again.');
                        btn.disabled = false;
                        btn.innerHTML = 'Verify OTP';
                        return;
                    }
                } else {
                    showFormError('Auth session missing from server. Please contact support.');
                    btn.disabled = false;
                    btn.innerHTML = 'Verify OTP';
                    return;
                }
                
                otpAttemptCount = 0; 
                otpLockedUntil = 0; 
                otpVerified = true;
                $('otpSection').classList.add('verified'); 
                $('otpVerifiedBadge').classList.add('show');
                var pi = $('ownerPhone'); 
                if(pi) { pi.readOnly = true; pi.classList.add('locked'); }
                $('otpSection').style.display = 'none'; 
                $('resendOtpBtn').style.display = 'none';
                if(otpTimer) clearInterval(otpTimer);
                showFormSuccess('Mobile verified successfully. Please accept the Terms & Conditions to continue.');
                updatePayButton();
            } else {
                otpAttemptCount++; 
                $('otpInput').value = '';
                if(otpAttemptCount >= 3) { 
                    otpLockedUntil = Date.now() + 600000; 
                    showFormError('3 incorrect attempts. Locked for 10 minutes.'); 
                    $('otpSection').style.display = 'none'; 
                    $('resendOtpBtn').style.display = 'none'; 
                    if(otpTimer) clearInterval(otpTimer); 
                } else { 
                    var left = 3 - otpAttemptCount; 
                    showFormError('Incorrect OTP. ' + left + ' attempt' + (left > 1 ? 's' : '') + ' remaining.'); 
                }
            }
        } catch(e) { 
            console.error('OTP verify error:', e);
            showFormError('Verification failed. Please try again.'); 
        }
        if(btn) { btn.disabled = false; btn.innerHTML = 'Verify OTP'; }
    };

    window.startRazorpayPayment = async function() {
        if(!termsAccepted) {
            showAlert('Please accept the Terms & Conditions before proceeding with payment.', 'Terms Required', 'warning');
            scrollToField('termsCompact');
            return;
        }
        if(!authUserId) {
            showAlert('Your verification session has expired. Please re-verify your mobile number.', 'Session Expired', 'error');
            scrollToField('ownerPhone');
            return;
        }
        if(!await validateFullForm()) return;
        if(paymentDone) { showToast('Payment already completed.'); return; }
        
        var on = $('ownerName')?.value.trim(), oe = $('ownerEmail')?.value.trim(), op = $('ownerPhone')?.value.trim();
        var amountInPaise = Math.round(totalFee * 100);
        
        var options = { 
            key: CONFIG.RAZORPAY_KEY_ID, 
            amount: amountInPaise, 
            currency: 'INR', 
            name: 'ZyMart+', 
            description: 'Shop Registration — Base ' + formatRupees(baseFee) + ' + GST 18% = ' + formatRupees(totalFee), 
            prefill: { name: on, email: oe, contact: op }, 
            theme: { color: '#0B5A31' }, 
            method: { upi: true, card: true, netbanking: true, wallet: true, emi: false, paylater: false }, 
            retry: { enabled: false }, 
            timeout: 300, 
            remember_customer: true,
            notes: {
                gst_applicable: 'yes',
                gst_percent: String(CONFIG.GST_PERCENT),
                base_amount: String(baseFee),
                gst_amount: String(gstAmount),
                total_amount: String(totalFee)
            },
            handler: function(r) { 
                paymentDone = true; 
                showToast('Payment successful — ' + formatRupees(totalFee)); 
                registerShopAfterPayment(r); 
            },
            modal: { ondismiss: function() { showToast('Payment cancelled.', true); }, escape: false, handleback: false } 
        };
        
        try { 
            var rzp = new Razorpay(options); 
            rzp.on('payment.failed', function(r) { 
                showAlert('Payment failed: ' + (r.error.description || 'Please try again.') + '\n\nNo amount has been deducted.', 'Payment Failed', 'error'); 
            }); 
            rzp.open(); 
        } catch(e) { 
            showAlert('Failed to open payment gateway. Please try again.', 'Error', 'error'); 
        }
    };

    async function registerShopAfterPayment(pr) {
        isProcessing = true; 
        var btn = $('payBtn'); 
        if(btn) { btn.innerHTML = '<span class="loading-spinner"></span> Registering...'; btn.disabled = true; }
        
        var on = $('ownerName')?.value.trim(), oe = $('ownerEmail')?.value.trim(), op = $('ownerPhone')?.value.trim(),
            ow = $('ownerWhatsapp')?.value.trim(), sn = $('shopName')?.value.trim(), cat = $('shopCategory')?.value || '',
            ad = $('shopAddress')?.value.trim(), ci = $('shopCity')?.value.trim(), pi = $('shopPincode')?.value.trim(),
            desc = $('shopDesc')?.value.trim(), lat = $('shopLatitude')?.value || '', lng = $('shopLongitude')?.value || '', 
            idn = $('idNumber')?.value.trim();
        
        // Final safety check
        if(!authUserId) {
            isProcessing = false;
            if(btn) { btn.innerHTML = '<i class="fas fa-lock"></i> Pay ' + formatRupees(totalFee) + ' & Register'; btn.disabled = false; }
            showAlert('Session expired during payment. Please re-verify your mobile number and try again.', 'Session Error', 'error');
            return;
        }
        
        try {
            var shopImageUrl = null, qrImageUrl = null, idImageUrl = null;
            if(selectedImageFile) { shopImageUrl = await uploadImage(selectedImageFile, 'shops'); }
            if(selectedQrFile) { qrImageUrl = await uploadImage(selectedQrFile, 'qrcodes'); }
            if(selectedIdFile) { idImageUrl = await uploadImage(selectedIdFile, 'idproofs'); }
            
            var insertData = { 
                owner_id: authUserId,
                owner_email: oe, 
                owner_name: on, 
                owner_phone: op, 
                owner_whatsapp: ow, 
                name: sn, 
                category: cat, 
                phone: op, 
                whatsapp: ow, 
                address: ad, 
                city: ci, 
                pincode: pi, 
                description: desc || null, 
                latitude: parseFloat(lat), 
                longitude: parseFloat(lng), 
                image_url: shopImageUrl, 
                qr_code_url: qrImageUrl, 
                id_number: idn || null, 
                id_image_url: idImageUrl || null, 
                status: 'pending', 
                is_open: false, 
                rating: 0, 
                location_verified: true, 
                payment_id: pr.razorpay_payment_id, 
                payment_order_id: pr.razorpay_order_id, 
                base_amount: baseFee,
                gst_percent: CONFIG.GST_PERCENT,
                gst_amount: gstAmount,
                payment_amount: totalFee, 
                payment_status: 'paid', 
                terms_accepted: true,
                terms_accepted_at: new Date().toISOString(),
                terms_version: CONFIG.TERMS_VERSION,
                created_at: new Date().toISOString() 
            };
            
            console.log('[Shop Register] Inserting:', { owner_id: authUserId, name: sn });
            
            // ✅ FIXED: Insert with .select() and error check
            var insertRes = await sb.from('shops').insert([insertData]).select();
            
            if(insertRes.error) {
                console.error('[Shop Register] Insert error:', insertRes.error);
                throw new Error('Shop save failed: ' + insertRes.error.message);
            }
            
            if(!insertRes.data || insertRes.data.length === 0) {
                console.error('[Shop Register] Insert returned no data — RLS might have silently blocked');
                throw new Error('Shop save failed — policy blocked. Please contact support with payment ID: ' + pr.razorpay_payment_id);
            }
            
            console.log('[Shop Register] Shop created:', insertRes.data[0].id);
            
            // Try to upgrade user role to shop_owner (best effort)
            try { 
                var userCheck = await sb.from('users').select('id').eq('email', oe).maybeSingle(); 
                if(userCheck && userCheck.data) { 
                    await sb.from('users').update({ role: 'shop_owner' }).eq('id', userCheck.data.id); 
                } 
            } catch(e) { console.warn('[Shop Register] Role update skipped:', e); }
            
            clearFormData();
            
            var successMsg = 'Your shop has been registered successfully.\n\n' +
                             'Base Fee: ' + formatRupees(baseFee) + '\n' +
                             'GST @ 18%: ' + formatRupees(gstAmount) + '\n' +
                             'Total Paid: ' + formatRupees(totalFee) + '\n\n' +
                             'GPS Location: Verified\n' +
                             'Admin Review: Within 24 hours\n' +
                             'Login Credentials: ' + oe + ' / ' + op + '\n\n' +
                             'Note: The registration fee is non-refundable.';
            
            showAlert(successMsg, 'Registration Successful', 'success');
            
            if(btn) btn.innerHTML = '<i class="fas fa-check-circle"></i> Submitted';
            setTimeout(function() { window.location.href = 'index.html?registered=1'; }, 5000);
            
        } catch(e) { 
            console.error('[Shop Register] FATAL:', e);
            isProcessing = false; 
            if(btn) { btn.innerHTML = '<i class="fas fa-lock"></i> Pay ' + formatRupees(totalFee) + ' & Register'; btn.disabled = false; }
            showAlert(
                'Registration failed: ' + (e.message || 'Please try again.') + 
                '\n\n⚠️ IMPORTANT: Your payment was successful.\nPayment ID: ' + pr.razorpay_payment_id + 
                '\n\nPlease contact support with this ID. We will complete your registration manually.',
                'Registration Error',
                'error'
            );
        }
    }
    
    function setupImageUpload(ai, ii, pi, fv) { 
        var a = $(ai), inp = $(ii), pre = $(pi); 
        if(!a || !inp) return; 
        a.onclick = function() { inp.click(); }; 
        inp.onchange = async function(e) { 
            var file = e.target.files[0]; 
            if(!file) return; 
            if(file.size > 5 * 1024 * 1024) { showAlert('Image is too large. Maximum size is 5MB.', 'File Too Large', 'error'); return; }
            var compressed = await compressImage(file);
            if(fv === 'selectedImageFile') selectedImageFile = compressed; 
            else if(fv === 'selectedQrFile') selectedQrFile = compressed; 
            else if(fv === 'selectedIdFile') selectedIdFile = compressed;
            var reader = new FileReader(); 
            reader.onload = function(ev) { if(pre) { pre.src = ev.target.result; pre.style.display = 'block'; } }; 
            reader.readAsDataURL(compressed); 
            showToast('Image ready'); 
        }; 
    }

    window.addEventListener('storage', function(e) {
        if(e.key === 'zymart_cart') { CartManager.updateBadge(); }
    });
    
    document.addEventListener('visibilitychange', function() {
        if(document.visibilityState === 'visible') { CartManager.updateBadge(); }
    });
    
    document.addEventListener('DOMContentLoaded', function() { 
        CartManager.updateBadge();
        renderForm(); 
        showApp(); 
    });
    
    window.startRazorpayPayment = startRazorpayPayment;
    window.captureShopLocation = captureShopLocation;
    window.sendVerificationOTP = sendVerificationOTP;
    window.verifyOTP = verifyOTP;
    window.closeAlert = closeAlert;
    window.setLocationFromAndroid = setLocationFromAndroid;
    window.onLocationError = onLocationError;
    window.saveFormData = saveFormData;
    window.toggleTerms = toggleTerms;
    window.openTermsModal = openTermsModal;
    window.closeTermsModal = closeTermsModal;
    window.acceptTermsFromModal = acceptTermsFromModal;
    window.CartManager = CartManager;
    
})();
</script>
</body>
</html>
