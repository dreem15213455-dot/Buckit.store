    <style>
        :root {
            --brand-green: #0B5A31; --brand-green-dark: #083D21; --brand-orange: #F59E0B;
            --neutral-white: #FFFFFF; --neutral-bg: #F9FAFB; --neutral-border: #E5E7EB;
            --neutral-gray: #6B7280; --neutral-dark: #1A1A1A; --danger: #EF4444;
            --success: #22C55E; --warning: #F59E0B;
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08); --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
            --radius-sm: 10px; --radius-md: 14px; --radius-lg: 18px; --radius-xl: 22px;
            --radius-2xl: 28px; --radius-full: 9999px;
            --status-bar-height: env(safe-area-inset-top, 0px);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--neutral-bg); color: var(--neutral-dark); -webkit-tap-highlight-color: transparent; min-height: 100vh; padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); overflow-x: hidden; width: 100%; max-width: 100%; -webkit-font-smoothing: antialiased; }
        #simpleLoader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--neutral-white); z-index: 10002; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; transition: opacity 0.3s ease; }
        #simpleLoader.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
        .simple-spinner { width: 34px; height: 34px; border: 2.5px solid var(--neutral-border); border-top-color: var(--brand-orange); border-radius: 50%; animation: spin 0.7s linear infinite; }
        .loader-logo { font-family: 'Poppins', sans-serif; font-size: 24px; font-weight: 700; }
        .loader-zy { color: #A3E635; } .loader-mart { color: #FDE047; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(11,90,49,0.4); } 50% { box-shadow: 0 0 0 10px rgba(11,90,49,0); } }
        .top-bar { background: var(--brand-green); position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; padding: 10px 14px; padding-top: calc(10px + var(--status-bar-height)); display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 16px rgba(11,90,49,0.3); }
        .back-btn { width: 40px; height: 40px; min-width: 40px; background: rgba(255,255,255,0.10); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 15px; text-decoration: none; }
        .back-btn:active { background: rgba(255,255,255,0.22); transform: scale(0.93); }
        .brand-name { font-family: 'Poppins', sans-serif; font-size: 20px; font-weight: 700; display: flex; align-items: baseline; }
        .brand-zy { color: #A3E635; } .brand-mart { color: #FDE047; }
        .page-title { flex: 1; text-align: center; font-weight: 600; font-size: 14px; color: white; }
        .cart-icon-btn { width: 36px; height: 36px; background: rgba(255,255,255,0.10); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 14px; position: relative; text-decoration: none; }
        .cart-badge { position: absolute; top: -5px; right: -5px; background: var(--brand-orange); color: white; border-radius: 50%; width: 17px; height: 17px; font-size: 8px; display: none; align-items: center; justify-content: center; border: 2px solid var(--brand-green); font-weight: 700; }
        .cart-badge.show { display: flex; }
        .main-content { padding-top: calc(60px + var(--status-bar-height)); padding-bottom: 40px; max-width: 600px; margin: 0 auto; }

        .form-card { background: white; margin: 0 14px 20px; border-radius: var(--radius-2xl); box-shadow: var(--shadow-md); overflow: hidden; animation: fadeInUp 0.4s ease; }

        .form-body { padding: 18px 20px; }

        .form-label i { color: var(--brand-green); width: 16px; margin-right: 3px; }

        .form-label .optional { color: var(--neutral-gray); font-weight: 400; font-size: 10px; }
        .form-control { width: 100%; padding: 12px 14px; border: 1.5px solid var(--neutral-border); border-radius: var(--radius-sm); font-size: 13px; font-family: 'Inter', sans-serif; outline: none; background: white; transition: all 0.15s ease; }
        .form-control:focus { border-color: var(--brand-orange); box-shadow: 0 0 0 3px rgba(245,158,11,0.08); }

        .location-btn { width: 100%; padding: 14px; background: #EDF7F1; border: 2px solid var(--brand-green); border-radius: var(--radius-sm); font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--brand-green); transition: all 0.2s ease; font-family: 'Inter', sans-serif; animation: pulse 2s infinite; box-shadow: 0 4px 15px rgba(11,90,49,0.2); }
        .location-btn:active { background: #C8E6C9; transform: scale(0.97); }

        .location-btn.success { background: #22C55E; color: white; border-color: #22C55E; animation: none; box-shadow: none; }
        .location-status { font-size: 11px; padding: 10px 12px; border-radius: var(--radius-sm); background: #F3F5F4; margin-top: 10px; display: flex; align-items: center; gap: 6px; }
        .location-status.success { color: #059669; background: #EDF7F1; border: 1px solid #A7F3D0; }
        .gps-coords-display { font-size: 10px; color: var(--brand-green); font-weight: 600; margin-top: 6px; font-family: monospace; display: none; }
        .gps-coords-display.show { display: block; }
        .gps-address-display { font-size: 10px; color: var(--neutral-gray); margin-top: 4px; display: none; line-height: 1.3; }
        .gps-address-display.show { display: block; }
        
        .otp-section { background: #FFF8EB; border: 2px solid #FDE68A; border-radius: var(--radius-md); padding: 14px; margin-bottom: 14px; display: none; }
        .otp-section.show { display: block; }
        .otp-section.verified { background: #D1FAE5; border: 2px solid #22C55E; }
        
        .otp-input-full {
            width: 100%;
            padding: 14px;
            border: 1.5px solid var(--neutral-border);
            border-radius: var(--radius-sm);
            font-size: 22px;
            text-align: center;
            letter-spacing: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;

            transition: all 0.15s ease;

        .otp-input-full::placeholder { font-size: 13px; letter-spacing: normal; font-weight: 500; color: #9CA3AF; }
        
        .btn { width: 100%; padding: 14px; border-radius: var(--radius-full); font-weight: 600; font-size: 14px; cursor: pointer; border: none; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.15s ease; margin-bottom: 8px; }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-green { background: var(--brand-green); color: white; }
        .btn-orange { background: var(--brand-orange); color: white; box-shadow: 0 4px 14px rgba(245,158,11,0.25); }
        .btn-outline { background: white; color: var(--brand-green); border: 1.5px solid var(--brand-green); }

        .text-muted { color: var(--neutral-gray); font-size: 10px; text-align: center; margin-top: 8px; }
        .error-msg { background: #FEF2F2; color: #DC2626; padding: 8px 12px; border-radius: 8px; font-size: 11px; margin-bottom: 10px; display: none; }
        .error-msg.show { display: block; }
        .success-msg { background: #D1FAE5; color: #059669; padding: 8px 12px; border-radius: 8px; font-size: 11px; margin-bottom: 10px; display: none; }
        .success-msg.show { display: block; }
        .verified-badge { display: none; background: #22C55E; color: white; padding: 8px 12px; border-radius: var(--radius-full); font-size: 11px; font-weight: 600; white-space: nowrap; align-items: center; }
        .verified-badge.show { display: inline-flex; }
        .verified-badge a { color: white; text-decoration: underline; margin-left: 6px; font-size: 10px; font-weight: 500; cursor: pointer; }
        .toast-notification { position: fixed; bottom: calc(30px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--neutral-dark); color: white; padding: 10px 20px; border-radius: var(--radius-full); font-size: 12px; z-index: 10050; opacity: 0; visibility: hidden; white-space: nowrap; box-shadow: var(--shadow-lg); transition: all 0.3s ease; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
        .toast-notification.show { opacity: 1; visibility: visible; }
        .alert-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(8,61,33,0.7); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; z-index: 9990; padding: 20px; }
        .alert-modal.show { display: flex; }
        .alert-content { background: white; border-radius: var(--radius-xl); padding: 24px; max-width: 380px; width: 100%; text-align: center; animation: fadeInUp 0.3s ease; max-height: 85vh; overflow-y: auto; }
        .alert-content i.alert-icon { font-size: 40px; display: block; margin-bottom: 10px; }
        .alert-content h3 { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 6px; }
        .alert-content p { font-size: 13px; color: var(--neutral-gray); margin-bottom: 14px; line-height: 1.5; white-space: pre-line; text-align: left; }
        .alert-btn { background: var(--brand-green); color: white; border: none; padding: 10px 20px; border-radius: var(--radius-full); font-weight: 600; cursor: pointer; width: 100%; font-size: 13px; font-family: 'Inter', sans-serif; margin-top: 6px; }
        .alert-btn.orange { background: var(--brand-orange); color: #1a1a1a; }
        .alert-btn.gray { background: #F3F5F4; color: #374151; }
        .loading-spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; }

        .terms-compact-row { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }

        .terms-compact-text { font-size: 12px; color: #78350F; line-height: 1.55; flex: 1; }

        var t = calcPlanTotals(selectedPlan);
        btn.innerHTML = '<i class="fas fa-lock"></i> Pay ' + formatRupees(t.total) + ' (' + PLANS[selectedPlan].label + ') & Register';
        if(otpVerified && termsAccepted && authUserId) { btn.disabled = false; btn.style.opacity = '1'; }
        else { btn.disabled = true; btn.style.opacity = '0.6'; }
    }
    
    window.sendVerificationOTP = async function() {
        showFormError(''); showFormSuccess('');
        var phone = $('ownerPhone')?.value.trim();
        if(!phone || !/^[6-9]\d{9}$/.test(phone)) { showFormError('Enter valid 10-digit mobile.'); scrollToField('ownerPhone'); return; }
        if(otpLockedUntil > 0) { var rem = Math.ceil((otpLockedUntil - Date.now()) / 60000); if(rem > 0) { showFormError('Try again in ' + rem + ' min.'); return; } else { otpLockedUntil = 0; otpAttemptCount = 0; } }
        var now = Date.now(); if(now - otpSendWindow > 300000) { otpSendCount = 0; otpSendWindow = now; }
        if(otpSendCount >= 3) { showFormError('Too many OTP requests. Wait 5 min.'); return; }
        if(otpVerified && currentOtpPhone === phone) { showFormSuccess('Already verified.'); return; }
        if(currentOtpPhone && currentOtpPhone !== phone) { otpVerified = false; authUserId = null; $('otpVerifiedBadge').classList.remove('show'); updatePayButton(); }
        var btn = $('sendOtpBtn'); if(btn) { btn.disabled = true; btn.innerHTML = '<span class="loading-spinner"></span> Sending...'; }
        try {
            var res = await fetch(SUPABASE_URL + '/functions/v1/send-otp', { method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': CONFIG.SUPABASE_KEY, 'Authorization': 'Bearer ' + CONFIG.SUPABASE_KEY }, body: JSON.stringify({ phone: phone }) });
            var data = await res.json();
            if(data.Status === 'Success' || data.status === 'success' || data.success === true) {
                otpSendCount++; currentOtpPhone = phone;
                $('otpSection').classList.add('show'); $('otpSection').classList.remove('verified');
                $('otpPhoneDisplay').textContent = '+91 ' + phone; $('otpInput').value = '';
                showFormSuccess('OTP sent to +91 ' + phone);
                if(btn) btn.style.display = 'none';
                startOtpTimer();
                var cbn = $('changeNumberBtn'); if(cbn) cbn.style.display = '';
            } else { showFormError('Failed to send OTP.'); if(btn) { btn.disabled = false; btn.innerHTML = 'Send OTP'; } }
        } catch(e) { showFormError('Network error.'); if(btn) { btn.disabled = false; btn.innerHTML = 'Send OTP'; } }
    };
    
    function startOtpTimer() {
        otpSeconds = 30; var rb = $('resendOtpBtn'); if(rb) { rb.disabled = true; rb.style.display = 'block'; rb.textContent = 'Resend OTP (30s)'; }
        if(otpTimer) clearInterval(otpTimer);
        otpTimer = setInterval(function() { otpSeconds--; if(otpSeconds <= 0) { clearInterval(otpTimer); if(rb) { rb.disabled = false; rb.textContent = 'Resend OTP'; } } else { if(rb) rb.textContent = 'Resend OTP (' + otpSeconds + 's)'; } }, 1000);
    }
    
    window.verifyOTP = async function() {
        showFormError(''); showFormSuccess('');
        if(otpLockedUntil > 0) { var rem = Math.ceil((otpLockedUntil - Date.now()) / 60000); if(rem > 0) { showFormError('Try again in ' + rem + ' min.'); return; } else { otpLockedUntil = 0; otpAttemptCount = 0; } }
        var otp = $('otpInput')?.value.trim();
        if(!otp || otp.length < 4) { showFormError('Enter complete OTP.'); return; }
        var btn = $('verifyOtpBtn'); if(btn) { btn.disabled = true; btn.innerHTML = '<span class="loading-spinner"></span> Verifying...'; }
        try {
            var res = await fetch(SUPABASE_URL + '/functions/v1/verify-otp', { method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': CONFIG.SUPABASE_KEY, 'Authorization': 'Bearer ' + CONFIG.SUPABASE_KEY }, body: JSON.stringify({ phone: currentOtpPhone, otp: otp }) });
            var data = await res.json();
            if(data.Status === 'Success' || data.status === 'success' || data.success === true) {
                if(data.email && data.password) {
                    btn.innerHTML = '<span class="loading-spinner"></span> Session...';
                    var sr = await sb.auth.signInWithPassword({ email: data.email, password: data.password });
                    if(sr.error) { showFormError('Session failed: ' + sr.error.message); btn.disabled = false; btn.innerHTML = '<i class="fas fa-check-circle"></i> Verify OTP'; return; }
                    if(sr.data && sr.data.session) { authUserId = sr.data.session.user.id; }
                    else { showFormError('Session not created.'); btn.disabled = false; btn.innerHTML = '<i class="fas fa-check-circle"></i> Verify OTP'; return; }
                } else { showFormError('Auth missing.'); btn.disabled = false; btn.innerHTML = '<i class="fas fa-check-circle"></i> Verify OTP'; return; }
                otpAttemptCount = 0; otpLockedUntil = 0; otpVerified = true;
                $('otpSection').classList.add('verified'); $('otpVerifiedBadge').classList.add('show');
                var pi = $('ownerPhone'); if(pi) { pi.readOnly = true; pi.classList.add('locked'); }
                $('otpSection').style.display = 'none'; $('resendOtpBtn').style.display = 'none';
                if(otpTimer) clearInterval(otpTimer);
                showFormSuccess('Mobile verified! Accept Terms to continue.');
                updatePayButton();
            } else {
                otpAttemptCount++; $('otpInput').value = '';
                if(otpAttemptCount >= 3) { otpLockedUntil = Date.now() + 600000; showFormError('3 wrong. Locked 10 min.'); $('otpSection').style.display = 'none'; $('resendOtpBtn').style.display = 'none'; if(otpTimer) clearInterval(otpTimer); }
                else { var l = 3 - otpAttemptCount; showFormError('Wrong OTP. ' + l + ' attempts left.'); }
            }
        } catch(e) { showFormError('Verify failed.'); }
        if(btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-check-circle"></i> Verify OTP'; }
    };
    
    window.changePhoneNumber = function() {
        if(!confirm('Change your mobile number?\n\nYour current OTP verification will be reset.\nYou will need to verify the new number.')) return;
        otpVerified = false; currentOtpPhone = null; otpAttemptCount = 0; authUserId = null;
        var os = $('otpSection'); if(os) { os.classList.remove('show', 'verified'); os.style.display = 'none'; }
        var oi = $('otpInput'); if(oi) oi.value = '';
        var od = $('otpPhoneDisplay'); if(od) od.textContent = '';
        var vb = $('otpVerifiedBadge'); if(vb) vb.classList.remove('show');
        var sbtn = $('sendOtpBtn'); if(sbtn) { sbtn.style.display = ''; sbtn.disabled = false; sbtn.innerHTML = 'Send OTP'; }
        var pi = $('ownerPhone'); if(pi) { pi.readOnly = false; pi.classList.remove('locked'); setTimeout(function() { try { pi.focus(); pi.select(); } catch(e) {} }, 100); }
        if(otpTimer) clearInterval(otpTimer);
        var rbn = $('resendOtpBtn'); if(rbn) rbn.style.display = 'none';
        var cbn = $('changeNumberBtn'); if(cbn) cbn.style.display = 'none';
        showFormSuccess('Enter your new mobile number and tap Send OTP.');
        updatePayButton();
        try { pi.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch(e) {}
    };
    
    window.startRazorpayPayment = async function() {
        if(!termsAccepted) { showAlert('Please accept Terms first.', 'Terms Required', 'warning'); scrollToField('termsCompact'); return; }
        if(!authUserId) { showAlert('Session expired. Please re-verify.', 'Session Expired', 'error'); scrollToField('ownerPhone'); return; }
        if(!await validateFullForm()) return;
        if(paymentDone) { showToast('Payment already done.'); return; }
        var t = calcPlanTotals(selectedPlan);
        var pl = PLANS[selectedPlan].label;
        var on = $('ownerName')?.value.trim(), oe = $('ownerEmail')?.value.trim(), op = $('ownerPhone')?.value.trim();
        var amt = Math.round(t.total * 100);
        var options = {
            key: CONFIG.RAZORPAY_KEY_ID, amount: amt, currency: 'INR', name: 'ZyMart+',
            description: pl + ' Plan — ₹' + t.base + ' + 18% GST = ₹' + t.total,
            prefill: { name: on, email: oe, contact: op },
            theme: { color: '#0B5A31' },
            method: { upi: true, card: true, netbanking: true, wallet: true },
            retry: { enabled: false }, timeout: 300, remember_customer: true,
            notes: { plan_type: selectedPlan, plan_months: String(PLANS[selectedPlan].months), gst_percent: String(CONFIG.GST_PERCENT), base_amount: String(t.base), gst_amount: String(t.gst), total_amount: String(t.total) },
            handler: function(r) { paymentDone = true; showToast('Payment success!'); registerShopAfterPayment(r, t); },
            modal: { ondismiss: function() { showToast('Payment cancelled.', true); }, escape: false, handleback: false }
        };
        try {
            var rzp = new Razorpay(options);
            rzp.on('payment.failed', function(r) { showAlert('Payment failed: ' + (r.error.description || 'Try again.') + '\n\nNo amount deducted.', 'Payment Failed', 'error'); });
            rzp.open();
        } catch(e) { showAlert('Failed to open payment.', 'Error', 'error'); }
    };
    
    async function registerShopAfterPayment(pr, totals) {
        isProcessing = true;
        var btn = $('payBtn'); if(btn) { btn.innerHTML = '<span class="loading-spinner"></span> Registering...'; btn.disabled = true; }
        var on = $('ownerName')?.value.trim(), oe = $('ownerEmail')?.value.trim(), op = $('ownerPhone')?.value.trim(),
            ow = $('ownerWhatsapp')?.value.trim(), sn = $('shopName')?.value.trim(), cat = $('shopCategory')?.value || '',
            ad = $('shopAddress')?.value.trim(), ci = $('shopCity')?.value.trim(), pi = $('shopPincode')?.value.trim(),
            desc = $('shopDesc')?.value.trim(), lat = $('shopLatitude')?.value || '', lng = $('shopLongitude')?.value || '',
            idn = $('idNumber')?.value.trim();
        if(!authUserId) { isProcessing = false; if(btn) { btn.innerHTML = '<i class="fas fa-lock"></i> Pay ' + formatRupees(totals.total) + ' & Register'; btn.disabled = false; } showAlert('Session expired.', 'Error', 'error'); return; }
        try {
            var siu = null, qru = null, idu = null;
            if(selectedImageFile) siu = await uploadImage(selectedImageFile, 'shops');
            if(selectedQrFile) qru = await uploadImage(selectedQrFile, 'qrcodes');
            if(selectedIdFile) idu = await uploadImage(selectedIdFile, 'idproofs');
            
            var months = PLANS[selectedPlan].months;
            var startedAt = new Date();
            var expiresAt = new Date(startedAt);
            expiresAt.setMonth(expiresAt.getMonth() + months);
            
            var data = {
                owner_id: authUserId, owner_email: oe, owner_name: on, owner_phone: op, owner_whatsapp: ow,
                name: sn, category: cat, phone: op, whatsapp: ow, address: ad, city: ci, pincode: pi,
                description: desc || null, latitude: parseFloat(lat), longitude: parseFloat(lng),
                image_url: siu, qr_code_url: qru, id_number: idn || null, id_image_url: idu || null,
                status: 'pending', is_open: false, rating: 0, location_verified: true,
                plan_type: selectedPlan,
                plan_started_at: startedAt.toISOString(),
                plan_expires_at: expiresAt.toISOString(),
                plan_base_fee: totals.base,
                plan_gst_amount: totals.gst,
                plan_total_paid: totals.total,
                is_permanent: false,
                plan_status: 'active',
                base_amount: totals.base, gst_percent: CONFIG.GST_PERCENT, gst_amount: totals.gst,
                payment_amount: totals.total, payment_status: 'paid',
                payment_id: pr.razorpay_payment_id, payment_order_id: pr.razorpay_order_id,
                terms_accepted: true, terms_accepted_at: new Date().toISOString(), terms_version: CONFIG.TERMS_VERSION,
                created_at: new Date().toISOString()
            };
            
            console.log('[Register] Insert:', { plan: selectedPlan, months: months });
            var ins = await sb.from('shops').insert([data]).select();
            if(ins.error) throw new Error('Save failed: ' + ins.error.message);
            if(!ins.data || ins.data.length === 0) throw new Error('RLS blocked. Payment ID: ' + pr.razorpay_payment_id);
            
            try { var uc = await sb.from('users').select('id').eq('email', oe).maybeSingle(); if(uc && uc.data) await sb.from('users').update({ role: 'shop_owner' }).eq('id', uc.data.id); } catch(e) {}
            clearFormData();
            
            var expStr = expiresAt.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
            showAlert(
                'Shop registered successfully!\n\n' +
                '📋 Plan: ' + PLANS[selectedPlan].label + ' (' + months + ' month' + (months > 1 ? 's' : '') + ')\n' +
                '💰 Base: ' + formatRupees(totals.base) + '\n' +
                '📊 GST 18%: ' + formatRupees(totals.gst) + '\n' +
                '✅ Total: ' + formatRupees(totals.total) + '\n\n' +
                '📅 Started: ' + startedAt.toLocaleDateString('en-IN') + '\n' +
                '⏰ Expires: ' + expStr + '\n\n' +
                'Admin review: 24 hours\n' +
                'Login: ' + oe + '\n\n' +
                'Registration fee is non-refundable.',
                'Registration Successful', 'success'
            );
            if(btn) btn.innerHTML = '<i class="fas fa-check-circle"></i> Done';
            setTimeout(function() { window.location.href = 'index.html?registered=1'; }, 6000);
        } catch(e) {
            console.error('[Register] FATAL:', e);
            isProcessing = false;
            if(btn) { btn.innerHTML = '<i class="fas fa-lock"></i> Pay ' + formatRupees(totals.total) + ' & Register'; btn.disabled = false; }
            showAlert('Registration failed: ' + (e.message || 'Try again.') + '\n\n⚠️ Payment was successful.\nPayment ID: ' + pr.razorpay_payment_id + '\n\nContact support with this ID.', 'Error', 'error');
        }
    }
    
    function setupImageUpload(ai, ii, pi, fv) {
        var a = $(ai), inp = $(ii), pre = $(pi); if(!a || !inp) return;
        a.onclick = function() { inp.click(); };
        inp.onchange = async function(e) {
            var file = e.target.files[0]; if(!file) return;
            if(file.size > 5 * 1024 * 1024) { showAlert('Max 5MB.', 'Too Large', 'error'); return; }
            var comp = await compressImage(file);
            if(fv === 'selectedImageFile') selectedImageFile = comp;
            else if(fv === 'selectedQrFile') selectedQrFile = comp;
            else if(fv === 'selectedIdFile') selectedIdFile = comp;
            var r = new FileReader();
            r.onload = function(ev) { if(pre) { pre.src = ev.target.result; pre.style.display = 'block'; } };
            r.readAsDataURL(comp);
            showToast('Image ready');
        };
    }
