    <style>
        :root {
            --primary: #16A34A;
            --primary-light: #22C55E;
            --primary-dark: #15803D;
            --primary-bg-light: #F0FDF4;
            --primary-bg-dark: #DCFCE7;

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }

            from { opacity: 0; transform: translateY(-10px); }

        /* ========== LOCATION ========== */
        .location-btn {
            width: 100%;

        /* ========== BUTTONS ========== */

        .fee-row.total {

        }
        .free-tag {
            color: var(--success); font-weight: 700; font-size: 13px;

        /* ========== TOAST ========== */
        .toast-notification {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: var(--text-primary); color: white;
            padding: 12px 24px; border-radius: var(--radius-full);
            font-size: 13px; font-weight: 600;
            z-index: 10050; opacity: 0; visibility: hidden;
            white-space: nowrap; box-shadow: var(--shadow-xl);
            transition: opacity 0.25s, visibility 0.25s, transform 0.25s;
        }
        .toast-notification.show { 
            opacity: 1; visibility: visible; 
            transform: translateX(-50%) translateY(0);
        }

        /* ========== ALERT MODAL ========== */
        .alert-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
            display: none; align-items: center; justify-content: center;

        .alert-content {

        .alert-content i.warning { color: var(--warning); }
        .alert-content i.error { color: var(--danger); }
        .alert-content i.success { color: var(--success); }

        .alert-btn {

            padding: 12px 24px; border-radius: var(--radius-full);

            font-family: 'Inter', sans-serif; font-size: 14px;
            outline: none;
        }
        .alert-btn:active { background: var(--primary-dark); }

        /* ========== LOADING ========== */
        .loading-spinner { 
            text-align: center; padding: 60px; color: var(--primary);
            display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        .loading-spinner i { font-size: 36px; }

<div class="top-bar">

    </button>
    <div class="brand-name"><span class="normal">Zat</span><span class="pat">pat</span></div>

</div>

<!-- MAIN CONTENT -->
<div class="main-content" id="mainContent">
    <div class="loading-spinner">
        <i class="fas fa-spinner fa-spin"></i>
        <p>Loading registration form...</p>
    </div>
</div>

<!-- TOAST -->
<div id="toastMsg" class="toast-notification"><span id="toastText"></span></div>

<!-- ALERT MODAL -->
<div id="customAlert" class="alert-modal">
    <div class="alert-content">
        <i id="alertIcon" class="fas fa-info-circle warning"></i>
        <h3 id="alertTitle">Notice</h3>
        <p id="alertMessage">Message here</p>
        <button class="alert-btn" onclick="closeAlert()">OK</button>
    </div>
</div>

<script>
// ==================== SUPABASE INIT ====================
const supabaseClient = supabase.createClient(
    'https://zwajyovemwdqtkecipeb.supabase.co',
    'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1'
);

// ==================== GLOBAL STATE ====================
let categories = [];
let selectedImageFile = null;
let selectedQrFile = null;
let isProcessing = false;
let registrationData = {};
let currentStep = 1;
let currentUserId = null;
let otpTimerInterval = null;

// ==================== UTILITY FUNCTIONS ====================
function showToast(message, isError = false) {
    const toast = document.getElementById('toastMsg');
    const text = document.getElementById('toastText');
    if(!toast || !text) return;
    text.innerHTML = message;
    toast.style.background = isError ? '#EF4444' : '#111827';
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
}

function showAlert(message, title = 'Notice', icon = 'warning') {
    document.getElementById('alertMessage').textContent = message;
    document.getElementById('alertTitle').textContent = title;
    const iconEl = document.getElementById('alertIcon');
    iconEl.className = `fas ${icon === 'success' ? 'fa-check-circle' : icon === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'} ${icon}`;
    document.getElementById('customAlert').style.display = 'flex';
}

function closeAlert() {
    document.getElementById('customAlert').style.display = 'none';
}

function goBack() { 
    if (window.history.length > 1) {
        window.history.back(); 
    } else {
        window.location.href = 'index.html';
    }
}

function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

// ==================== IMAGE COMPRESSION ====================
async function compressImage(file) {
    if (!file || !file.type?.startsWith('image/')) return file;
    if (file.size < 150 * 1024) return file;
    
    try {
        if (window.imageCompression) {
            const options = {
                maxSizeMB: 0.15,
                maxWidthOrHeight: 800,
                useWebWorker: true,
                fileType: 'image/jpeg',
                initialQuality: 0.7
            };
            const compressed = await window.imageCompression(file, options);
            return compressed;
        }
        return file;
    } catch(e) {
        console.error('Compression error:', e);
        return file;
    }
}

// ==================== UPLOAD IMAGE ====================
async function uploadImage(file, folder) {
    if (!file) return null;
    const compressedFile = await compressImage(file);
    const timestamp = Date.now();
    const random = Math.random().toString(36).substring(2, 8);
    const fileName = `${timestamp}_${random}.jpg`;
    const filePath = `${folder}/${fileName}`;
    
    const { error: uploadError } = await supabaseClient.storage
        .from('shop-images')
        .upload(filePath, compressedFile);
    
    if (uploadError) throw new Error(uploadError.message);
    
    const { data: urlData } = supabaseClient.storage
        .from('shop-images')
        .getPublicUrl(filePath);
    
    return urlData.publicUrl;
}

// ==================== LOAD CATEGORIES ====================
async function loadCategories() {
    try {
        const { data, error } = await supabaseClient
            .from('categories')
            .select('id, name')
            .eq('is_active', true)
            .order('name');
        
        if (error) throw error;
        categories = data || [];
        return categories;
    } catch (error) {
        console.error('Categories error:', error);
        return [];
    }
}

// ==================== LOCATION ====================
function captureShopLocation() {
    if (!navigator.geolocation) {
        showAlert('Geolocation is not supported by your browser', 'Error', 'error');
        return;
    }
    
    const statusDiv = document.getElementById('locationStatus');
    statusDiv.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Detecting location...';
    statusDiv.className = 'location-status';
    
    // Timeout after 10 seconds
    const timeoutId = setTimeout(() => {
        statusDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Location timeout. Try again or enter manually.';
        statusDiv.className = 'location-status error';
    }, 10000);
    
    navigator.geolocation.getCurrentPosition(
        async (position) => {
            clearTimeout(timeoutId);
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            
            document.getElementById('shopLatitude').value = lat;
            document.getElementById('shopLongitude').value = lng;
            document.getElementById('locationCoords').textContent = `📍 ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
            statusDiv.innerHTML = '<i class="fas fa-check-circle"></i> Location captured successfully!';
            statusDiv.className = 'location-status success';
            
            // Get address
            try {
                const response = await fetch(
                    `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18`,
                    { headers: { 'User-Agent': 'ZatpatApp/5.0' } }
                );
                const data = await response.json();
                const addrEl = document.getElementById('locationAddress');
                if (addrEl && data.display_name) {
                    addrEl.innerHTML = `<i class="fas fa-map-pin"></i> ${data.display_name.substring(0, 120)}`;
                    addrEl.style.display = 'block';
                    
                    // Auto-fill city if empty
                    const cityInput = document.getElementById('shopCity');
                    if (cityInput && !cityInput.value) {
                        const city = data.address?.city || data.address?.town || data.address?.village || '';
                        if (city) cityInput.value = city;
                    }
                }
            } catch(e) {}
            
            showToast('📍 Location captured!', false);
        },
        (error) => {
            clearTimeout(timeoutId);
            statusDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Location failed. Enable GPS and try again.';
            statusDiv.className = 'location-status error';
            
            let errorMsg = 'Failed to get location. ';
            if (error.code === 1) errorMsg += 'Please allow location permission.';
            else if (error.code === 2) errorMsg += 'GPS signal unavailable.';
            else if (error.code === 3) errorMsg += 'Location request timed out.';
            showAlert(errorMsg, 'Location Error', 'error');
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 300000 }
    );
}

// ==================== OTP FUNCTIONS ====================
async function sendRegisterOTP() {
    const name = document.getElementById('registerName').value.trim();
    const email = document.getElementById('registerEmail').value.trim();
    const phone = document.getElementById('registerPhone').value.trim();
    const whatsapp = document.getElementById('ownerWhatsapp').value.trim();
    
    // Validation
    if (!name || name.length < 2) { showAlert('Please enter your full name', 'Invalid Input', 'error'); return; }
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showAlert('Please enter a valid email address', 'Invalid Input', 'error'); return; }
    if (!phone || !/^\d{10}$/.test(phone)) { showAlert('Please enter a valid 10-digit mobile number', 'Invalid Input', 'error'); return; }
    if (!whatsapp || !/^\d{10}$/.test(whatsapp)) { showAlert('Please enter a valid WhatsApp number', 'Invalid Input', 'error'); return; }
    
    registrationData = { name, email, phone, whatsapp };
    
    const btn = document.querySelector('#registerStepEmail .auth-btn');
    if(btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...'; }
    
    const { error } = await supabaseClient.auth.signInWithOtp({
        email: email,
        options: {
            shouldCreateUser: true,
            data: { name, phone, whatsapp, role: 3 }
        }
    });
    
    if(btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send OTP'; }
    
    if (error) {
        showAlert('Failed to send OTP: ' + error.message, 'Error', 'error');
    } else {
        showToast('✅ OTP sent to ' + email);
        document.getElementById('registerStepEmail').style.display = 'none';
        document.getElementById('registerStepOTP').style.display = 'block';
        document.getElementById('otpEmailDisplay').textContent = email;
        startResendTimer();
        updateProgress(2);
    }
}

function startResendTimer() {
    let seconds = 45;
    const btn = document.getElementById('resendOtpBtn');
    if (!btn) return;
    if (otpTimerInterval) clearInterval(otpTimerInterval);
    btn.disabled = true;
    btn.style.opacity = '0.6';
    
    otpTimerInterval = setInterval(() => {
        seconds--;
        btn.textContent = `Resend OTP (${seconds}s)`;
        if (seconds <= 0) {
            clearInterval(otpTimerInterval);
            btn.disabled = false;
            btn.style.opacity = '1';
            btn.textContent = 'Resend OTP';
        }
    }, 1000);
}

async function resendOTP() {
    if (!registrationData.email) {
        document.getElementById('registerStepOTP').style.display = 'none';
        document.getElementById('registerStepEmail').style.display = 'block';
        updateProgress(1);
        return;
    }
    
    const { error } = await supabaseClient.auth.signInWithOtp({
        email: registrationData.email,
        options: { shouldCreateUser: true, data: registrationData }
    });
    
    if (error) { 
        showAlert('Error: ' + error.message, 'Error', 'error'); 
    } else { 
        startResendTimer(); 
        showToast('✅ New OTP sent!'); 
    }
}

async function verifyOTP() {
    const otp = document.getElementById('registerOtp').value.trim();
    if (!otp || otp.length < 6) {
        showAlert('Please enter the 6-digit OTP sent to your email', 'Invalid OTP', 'error');
        return;
    }
    
    const btn = document.querySelector('#registerStepOTP .auth-btn');
    if(btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...'; }
    
    try {
        const { data, error } = await supabaseClient.auth.verifyOtp({
            email: registrationData.email,
            token: otp,
            type: 'email'
        });
        
        if (error) {
            if(btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-check-circle"></i> Verify OTP'; }
            showAlert('Invalid OTP. Please check and try again.', 'Verification Failed', 'error');
            return;
        }
        
        if (data?.user) {
            currentUserId = data.user.id;
            
            // Update user profile
            await supabaseClient.from('users').upsert({
                id: data.user.id,
                role: 3,
                name: registrationData.name,
                phone: registrationData.phone,
                email: registrationData.email
            });
            
            showToast('✅ Email verified!');
            await loadCategories();
            
            document.getElementById('registerStepOTP').style.display = 'none';
            document.getElementById('shopDetailsForm').style.display = 'block';
            updateProgress(3);
            
            // Populate category dropdown
            const categorySelect = document.getElementById('shopCategory');
            if (categorySelect) {
                categorySelect.innerHTML = '<option value="">Select Category</option>' +
                    categories.map(cat => `<option value="${cat.name}">${cat.name}</option>`).join('');
            }
        }
    } catch(e) {
        if(btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-check-circle"></i> Verify OTP'; }
        showAlert('Verification failed: ' + e.message, 'Error', 'error');
    }
}

// ==================== PROGRESS STEPS ====================
function updateProgress(step) {
    currentStep = step;
    const steps = document.querySelectorAll('.progress-step');
    const lines = document.querySelectorAll('.progress-line');
    
    steps.forEach((s, i) => {
        const stepNum = i + 1;
        s.classList.remove('active', 'completed');
        if (stepNum < step) s.classList.add('completed');
        if (stepNum === step) s.classList.add('active');
    });
    
    lines.forEach((l, i) => {
        if (i < step - 1) l.classList.add('completed');
        else l.classList.remove('completed');
    });
}

// ==================== REGISTER SHOP ====================
async function registerShop() {
    if (isProcessing) return;
    
    const shopName = document.getElementById('shopName').value.trim();
    const category = document.getElementById('shopCategory').value;
    const shopPhone = document.getElementById('shopPhone').value.trim();
    const shopWhatsapp = document.getElementById('shopWhatsapp').value.trim();
    const address = document.getElementById('shopAddress').value.trim();
    const city = document.getElementById('shopCity').value.trim();
    const pincode = document.getElementById('shopPincode').value.trim();
    const description = document.getElementById('shopDesc').value.trim();
    const latitude = document.getElementById('shopLatitude').value;
    const longitude = document.getElementById('shopLongitude').value;
    
    // Validation
    if (!shopName) { showAlert('Please enter shop name', 'Shop Name Required', 'error'); return; }
    if (!category) { showAlert('Please select a category', 'Category Required', 'error'); return; }
    if (!shopPhone || !/^\d{10}$/.test(shopPhone)) { showAlert('Please enter valid 10-digit shop phone', 'Phone Required', 'error'); return; }
    if (!address) { showAlert('Please enter shop address', 'Address Required', 'error'); return; }
    if (!city) { showAlert('Please enter city name', 'City Required', 'error'); return; }
    if (!pincode || pincode.length !== 6) { showAlert('Please enter valid 6-digit pincode', 'Pincode Required', 'error'); return; }
    if (!latitude || !longitude) { showAlert('Please capture shop location first', 'Location Required', 'error'); return; }
    
    isProcessing = true;
    const btn = document.getElementById('registerShopBtn');
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Registering...';
    btn.disabled = true;
    
    try {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) throw new Error('Please verify OTP first');
        
        // Upload images
        let shopImageUrl = null, qrImageUrl = null;
        
        if (selectedImageFile) {
            showToast('Uploading shop photo...', false);
            try { shopImageUrl = await uploadImage(selectedImageFile, 'shops'); } catch(e) { console.error(e); }
        }
        
        if (selectedQrFile) {
            try { qrImageUrl = await uploadImage(selectedQrFile, 'qrcodes'); } catch(e) { console.error(e); }
        }
        
        // Save to database
        const { error: shopError } = await supabaseClient.from('shops').insert([{
            owner_id: user.id,
            name: shopName,
            category: category,
            phone: shopPhone,
            whatsapp: shopWhatsapp || registrationData.whatsapp,
            address: address,
            city: city,
            pincode: pincode,
            description: description || null,
            latitude: parseFloat(latitude),
            longitude: parseFloat(longitude),
            image_url: shopImageUrl,
            qr_code_url: qrImageUrl,
            status: 'pending',
            is_open: false,
            rating: 0,
            created_at: new Date().toISOString()
        }]);
        
        if (shopError) throw new Error(shopError.message);
        
        // Update user role
        await supabaseClient.from('users').upsert({
            id: user.id,
            role: 2
        });
        
        showAlert('Your shop has been registered! Admin will review and approve shortly.', 'Registration Successful! 🎉', 'success');
        
        // Redirect after 3 seconds
        setTimeout(() => {
            window.location.href = 'shop-dashboard.html';
        }, 3000);
        
    } catch (error) {
        showAlert('Registration failed: ' + error.message, 'Error', 'error');
        btn.innerHTML = '<i class="fas fa-store"></i> Register Shop (Free)';
        btn.disabled = false;
        isProcessing = false;
    }
}

function setupImageUpload(areaId, inputId, previewId, compressId, fileVar) {
    const area = document.getElementById(areaId);
    const input = document.getElementById(inputId);
    const preview = document.getElementById(previewId);
    
    if (!area || !input) return;
    
    area.onclick = () => input.click();
    
    input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        if (file.size > 5 * 1024 * 1024) {
            showAlert('Image too large. Please select an image under 5MB.', 'File Too Large', 'error');
            return;
        }
        
        const originalSize = (file.size / 1024).toFixed(0);
        const compressEl = document.getElementById(compressId);
        if (compressEl) {
            compressEl.style.display = 'block';
            compressEl.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Compressing...';
        }
        
        const compressed = await compressImage(file);
        const compressedSize = (compressed.size / 1024).toFixed(0);
        
        // Set the appropriate variable
        if (fileVar === 'selectedImageFile') selectedImageFile = compressed;
        else if (fileVar === 'selectedQrFile') selectedQrFile = compressed;
        
        if (compressEl) {
            compressEl.innerHTML = `<i class="fas fa-check-circle"></i> Ready: ${compressedSize}KB`;
            setTimeout(() => { if(compressEl) compressEl.style.display = 'none'; }, 3000);
        }
        
        const reader = new FileReader();
        reader.onload = (event) => {
            if(preview) { preview.src = event.target.result; preview.style.display = 'block'; }
        };
        reader.readAsDataURL(compressed);
        
        if (originalSize !== compressedSize) {
            showToast(`📸 Compressed: ${originalSize}KB → ${compressedSize}KB`);
        }
    };
}
