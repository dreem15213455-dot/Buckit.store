<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Register Your Shop - Zatpat</title>
    <meta name="theme-color" content="#FFD600">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    
    <style>
        :root {
            --primary: #FFD600;
            --primary-dark: #E5C200;
            --accent-green: #16A34A;
            --bg-light: #F5F5F5;
            --card-white: #FFFFFF;
            --text-primary: #1A1A1A;
            --text-secondary: #666666;
            --border-light: #E5E7EB;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-2xl: 24px;
            --radius-full: 9999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
            overflow-x: hidden;
        }
        h1, h2, h3, h4, h5, h6 { font-family: 'Poppins', sans-serif; }

        .top-bar {
            background: white;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 12px 16px;
            box-shadow: var(--shadow-sm);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .back-btn {
            width: 40px;
            height: 40px;
            background: var(--bg-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .brand-name { font-size: 22px; font-weight: 800; }
        .brand-name .normal { color: #000000; }
        .brand-name .pat { color: var(--accent-green); }
        .page-title { flex: 1; text-align: center; font-weight: 600; font-size: 16px; }

        .main-content {
            padding-top: 80px;
            padding-bottom: 100px;
            max-width: 600px;
            margin: 0 auto;
        }

        .hero-section {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            margin: 16px;
            padding: 32px 24px;
            border-radius: var(--radius-2xl);
            text-align: center;
            color: #000000;
        }
        .hero-icon { font-size: 48px; margin-bottom: 16px; }
        .hero-title { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
        .hero-subtitle { font-size: 14px; opacity: 0.8; }
        .fee-badge {
            background: rgba(0,0,0,0.1);
            display: inline-block;
            padding: 8px 20px;
            border-radius: var(--radius-full);
            margin-top: 16px;
            font-weight: 600;
        }

        .form-card {
            background: white;
            margin: 16px;
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }
        .form-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-light);
        }
        .form-header h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .form-header p { font-size: 13px; color: var(--text-secondary); }
        .form-body { padding: 24px; }

        .form-group { margin-bottom: 20px; }
        .form-label { font-weight: 600; font-size: 14px; margin-bottom: 8px; display: block; }
        .form-label i { color: var(--primary); width: 20px; margin-right: 6px; }
        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            font-size: 14px;
            transition: all 0.2s;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255,214,0,0.1);
        }
        textarea.form-control { resize: vertical; min-height: 80px; }

        .image-upload-area {
            border: 2px dashed var(--primary);
            border-radius: var(--radius-md);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--bg-light);
        }
        .image-upload-area:hover { background: #FFF3CD; }
        .image-upload-area .upload-icon { font-size: 32px; color: var(--primary); margin-bottom: 8px; }
        .image-upload-area p { font-size: 12px; color: var(--text-secondary); margin: 0; }
        .image-preview { max-width: 100%; max-height: 150px; margin-top: 10px; border-radius: var(--radius-md); display: none; }

        .location-btn {
            width: 100%;
            padding: 14px;
            background: var(--bg-light);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .location-btn:hover { background: var(--primary); color: #000; border-color: var(--primary); }
        .location-status {
            font-size: 12px;
            padding: 10px;
            border-radius: var(--radius-sm);
            background: var(--bg-light);
            margin-top: 10px;
        }
        .location-address {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
            padding: 8px;
            background: var(--bg-light);
            border-radius: var(--radius-sm);
        }

        .payment-section {
            background: #E8F5E9;
            border: 1px solid var(--success);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 20px;
        }
        .payment-section-title {
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--success);
        }
        .payment-note {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .fee-summary {
            background: var(--bg-light);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 24px;
        }
        .fee-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .fee-row.total {
            border-top: 1px solid var(--border-light);
            padding-top: 12px;
            font-weight: 700;
            font-size: 16px;
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #000000;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: var(--radius-full);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .error-modal, .success-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        .error-content, .success-content {
            background: white;
            border-radius: var(--radius-2xl);
            padding: 32px;
            text-align: center;
            max-width: 340px;
            width: 90%;
        }
        .error-icon { font-size: 64px; color: var(--danger); margin-bottom: 16px; }
        .success-icon { font-size: 64px; color: var(--success); margin-bottom: 16px; }
        .error-title, .success-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .error-text, .success-text { color: var(--text-secondary); margin-bottom: 24px; line-height: 1.5; font-size: 14px; }
        .error-btn, .success-btn {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
        }

        .loading-spinner { text-align: center; padding: 60px; color: var(--primary); }

        @media (max-width: 480px) {
            .hero-title { font-size: 24px; }
            .form-body { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
        <div class="brand-name"><span class="normal">Zat</span><span class="pat">pat</span></div>
        <div class="page-title">Register Shop</div>
    </div>

    <div class="main-content" id="mainContent">
        <div class="loading-spinner">
            <i class="fas fa-spinner fa-spin fa-2x"></i>
            <p>Loading registration form...</p>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://zwajyovemwdqtkecipeb.supabase.co';
        const supabaseKey = 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        const RAZORPAY_KEY = 'rzp_live_SZqH2di86Njggl';

        let categories = [];
        let registrationFee = 499;
        let shopLatitude = null;
        let shopLongitude = null;
        let selectedImageFile = null;
        let selectedQrFile = null;
        let isProcessing = false;

        async function loadSettings() {
            try {
                const { data, error } = await supabaseClient
                    .from('app_settings')
                    .select('value')
                    .eq('key', 'registration_fee')
                    .maybeSingle();
                if (!error && data) registrationFee = parseInt(data.value);
                console.log('💰 Registration fee:', registrationFee);
            } catch (error) { console.error('Settings error:', error); }
        }

        async function loadCategories() {
            try {
                const { data, error } = await supabaseClient
                    .from('categories')
                    .select('id, name')
                    .eq('is_active', true)
                    .order('name');
                if (!error && data) categories = data;
            } catch (error) { console.error('Categories error:', error); }
        }

        async function checkEmailInUsersTable(email) {
            try {
                const { data, error } = await supabaseClient
                    .from('users')
                    .select('id')
                    .eq('email', email)
                    .maybeSingle();
                return data !== null;
            } catch (error) {
                return false;
            }
        }

        async function createUserWithRollback(email, password, userData) {
            let createdAuthUser = null;
            
            try {
                const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            name: userData.name,
                            phone: userData.phone,
                            whatsapp: userData.whatsapp,
                            role: 'shop_owner'
                        }
                    }
                });
                
                if (authError) throw new Error('Account creation failed: ' + authError.message);
                if (!authData.user) throw new Error('User creation failed');
                
                createdAuthUser = authData.user;
                const userId = createdAuthUser.id;
                
                const { error: userError } = await supabaseClient.from('users').insert([{
                    id: userId,
                    name: userData.name,
                    email: email,
                    phone: userData.phone,
                    whatsapp: userData.whatsapp,
                    role: 'shop_owner',
                    is_active: true,
                    created_at: new Date().toISOString()
                }]);
                
                if (userError) {
                    console.error('User insert failed, rolling back...', userError);
                    throw new Error('Registration failed: ' + userError.message);
                }
                
                return { success: true, userId: userId, user: createdAuthUser };
                
            } catch (error) {
                if (createdAuthUser) {
                    try {
                        await supabaseClient.auth.admin.deleteUser(createdAuthUser.id);
                    } catch (e) { console.error('Cleanup failed:', e); }
                }
                return { success: false, error: error.message };
            }
        }

        async function uploadImage(file, folder = 'shops') {
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
            const filePath = `${folder}/${fileName}`;
            
            const { error: uploadError } = await supabaseClient.storage
                .from('shop-images')
                .upload(filePath, file);
            
            if (uploadError) throw uploadError;
            
            const { data: publicUrl } = supabaseClient.storage
                .from('shop-images')
                .getPublicUrl(filePath);
            
            return publicUrl.publicUrl;
        }

        async function getAddressFromCoords(lat, lng) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=en`);
                const data = await response.json();
                const address = data.display_name || `${lat}, ${lng}`;
                const addressDiv = document.getElementById('locationAddress');
                if (addressDiv) {
                    addressDiv.innerHTML = `<i class="fas fa-map-pin"></i> ${address.substring(0, 100)}...`;
                    addressDiv.style.display = 'block';
                }
            } catch (error) {
                const addressDiv = document.getElementById('locationAddress');
                if (addressDiv) {
                    addressDiv.innerHTML = `<i class="fas fa-map-pin"></i> Lat: ${lat}, Lng: ${lng}`;
                    addressDiv.style.display = 'block';
                }
            }
        }

        function captureShopLocation() {
            if (!navigator.geolocation) {
                showErrorModal('Location Error', 'Your browser does not support location services.');
                return;
            }
            
            const statusDiv = document.getElementById('locationStatus');
            statusDiv.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Detecting location...';
            
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    shopLatitude = position.coords.latitude;
                    shopLongitude = position.coords.longitude;
                    
                    document.getElementById('shopLatitude').value = shopLatitude;
                    document.getElementById('shopLongitude').value = shopLongitude;
                    statusDiv.innerHTML = '<i class="fas fa-check-circle"></i> Location captured successfully!';
                    statusDiv.style.color = 'var(--success)';
                    
                    await getAddressFromCoords(shopLatitude, shopLongitude);
                },
                (error) => {
                    let errorMsg = '';
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMsg = 'Location permission denied. Please enable location.';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMsg = 'Location unavailable. Please try again.';
                            break;
                        case error.TIMEOUT:
                            errorMsg = 'Location request timeout. Please try again.';
                            break;
                        default:
                            errorMsg = 'Location detection failed. Please try again.';
                    }
                    statusDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> ' + errorMsg;
                    statusDiv.style.color = 'var(--danger)';
                }
            );
        }

        function showErrorModal(title, message) {
            const modalHtml = `
                <div class="error-modal" id="errorModal">
                    <div class="error-content">
                        <div class="error-icon"><i class="fas fa-exclamation-circle"></i></div>
                        <div class="error-title">${title}</div>
                        <div class="error-text">${message}</div>
                        <button class="error-btn" onclick="closeErrorModal()">Try Again</button>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        function closeErrorModal() {
            const modal = document.getElementById('errorModal');
            if (modal) modal.remove();
        }

        function showSuccessModal(shopName) {
            const modalHtml = `
                <div class="success-modal" id="successModal">
                    <div class="success-content">
                        <div class="success-icon"><i class="fas fa-check-circle"></i></div>
                        <div class="success-title">Payment Successful!</div>
                        <div class="success-text">
                            <strong>${escapeHtml(shopName)}</strong> has been registered successfully.<br><br>
                            <i class="fas fa-clock"></i> Your shop is now <strong>pending admin approval</strong>.<br>
                            Admin will review and approve within 24-48 hours.<br><br>
                            <i class="fas fa-envelope"></i> Login credentials sent to your email.
                        </div>
                        <button class="success-btn" onclick="closeSuccessModal()">Go to Home</button>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        function closeSuccessModal() {
            const modal = document.getElementById('successModal');
            if (modal) modal.remove();
            window.location.href = 'index.html';
        }

        async function processPayment(orderData) {
            return new Promise((resolve, reject) => {
                const options = {
                    key: RAZORPAY_KEY,
                    amount: registrationFee * 100,
                    currency: "INR",
                    name: "Zatpat Shop Registration",
                    description: `Registration fee for ${orderData.shopName}`,
                    handler: function(response) {
                        resolve({
                            success: true,
                            paymentId: response.razorpay_payment_id,
                            orderId: response.razorpay_order_id
                        });
                    },
                    prefill: {
                        name: orderData.ownerName,
                        email: orderData.email,
                        contact: orderData.phone
                    },
                    notes: {
                        shop_name: orderData.shopName,
                        owner_name: orderData.ownerName
                    },
                    theme: { color: "#FFD600" },
                    modal: {
                        ondismiss: function() {
                            reject({ success: false, error: "Payment cancelled by user" });
                        }
                    }
                };
                
                const razorpay = new Razorpay(options);
                razorpay.open();
            });
        }

        // ========== MAIN REGISTRATION FUNCTION - FIXED ORDER ==========
        async function registerShop() {
            if (isProcessing) return;
            
            // Get all form values
            const email = document.getElementById('userEmail')?.value.trim();
            const password = document.getElementById('userPassword')?.value;
            const ownerName = document.getElementById('ownerName')?.value.trim();
            const ownerWhatsapp = document.getElementById('ownerWhatsapp')?.value.trim();
            const shopName = document.getElementById('shopName')?.value.trim();
            const categoryId = document.getElementById('shopCategory')?.value;
            const phone = document.getElementById('shopPhone')?.value.trim();
            const shopWhatsapp = document.getElementById('shopWhatsapp')?.value.trim();
            const address = document.getElementById('shopAddress')?.value.trim();
            const city = document.getElementById('shopCity')?.value.trim();
            const pincode = document.getElementById('shopPincode')?.value.trim();
            const description = document.getElementById('shopDesc')?.value.trim();
            const latitude = document.getElementById('shopLatitude')?.value;
            const longitude = document.getElementById('shopLongitude')?.value;
            const upiId = document.getElementById('shopUpiId')?.value.trim();
            const upiName = document.getElementById('shopUpiName')?.value.trim();
            
            // Validations
            if (!email) { showErrorModal('Validation Error', 'Please enter email address'); return; }
            if (!password || password.length < 6) { showErrorModal('Validation Error', 'Password must be at least 6 characters'); return; }
            if (!ownerName) { showErrorModal('Validation Error', 'Please enter owner name'); return; }
            if (!ownerWhatsapp) { showErrorModal('Validation Error', 'Please enter owner WhatsApp number'); return; }
            if (!shopName) { showErrorModal('Validation Error', 'Please enter shop name'); return; }
            if (!categoryId) { showErrorModal('Validation Error', 'Please select a category'); return; }
            if (!phone || phone.length < 10) { showErrorModal('Validation Error', 'Please enter a valid phone number'); return; }
            if (!latitude || !longitude) { showErrorModal('Validation Error', 'Please capture your shop location first'); return; }
            if (!address) { showErrorModal('Validation Error', 'Please enter shop address'); return; }
            if (!city) { showErrorModal('Validation Error', 'Please enter city'); return; }
            if (!pincode || pincode.length !== 6) { showErrorModal('Validation Error', 'Please enter a valid 6-digit pincode'); return; }
            
            // UPI validation (optional but recommended)
            if (upiId && !upiId.includes('@')) {
                showErrorModal('Validation Error', 'Please enter a valid UPI ID (format: name@bank)');
                return;
            }
            
            // ========== STEP 1: CHECK IF USER ALREADY EXISTS (BEFORE PAYMENT) ==========
            console.log('🔍 Checking if user exists...');
            const userExists = await checkEmailInUsersTable(email);
            if (userExists) {
                showErrorModal('Email Already Registered', 
                    'This email is already registered. Please login to your existing account or use a different email address.\n\nPayment was not deducted.');
                return;
            }
            
            const category = categories.find(c => c.id === categoryId);
            const categoryName = category ? category.name : '';
            
            const btn = document.querySelector('.submit-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            btn.disabled = true;
            isProcessing = true;
            
            try {
                // ========== STEP 2: PROCESS PAYMENT (ONLY IF USER DOES NOT EXIST) ==========
                console.log('💳 Processing payment...');
                const paymentResult = await processPayment({
                    email: email,
                    ownerName: ownerName,
                    shopName: shopName,
                    phone: phone
                });
                
                if (!paymentResult.success) {
                    throw new Error(paymentResult.error || 'Payment failed');
                }
                
                console.log('✅ Payment successful! Payment ID:', paymentResult.paymentId);
                
                // ========== STEP 3: CREATE USER ACCOUNT ==========
                console.log('👤 Creating user account...');
                const userResult = await createUserWithRollback(email, password, {
                    name: ownerName,
                    phone: phone,
                    whatsapp: ownerWhatsapp
                });
                
                if (!userResult.success) {
                    // Payment successful but account creation failed
                    console.error('User creation failed after payment!');
                    throw new Error(userResult.error);
                }
                
                const userId = userResult.userId;
                console.log('✅ User created! User ID:', userId);
                
                // ========== STEP 4: UPLOAD IMAGES ==========
                console.log('📷 Uploading images...');
                let shopImageUrl = null;
                if (selectedImageFile) {
                    try {
                        shopImageUrl = await uploadImage(selectedImageFile, 'shops');
                        console.log('✅ Shop image uploaded');
                    } catch (uploadError) {
                        console.error('Image upload error:', uploadError);
                    }
                }
                
                let qrImageUrl = null;
                if (selectedQrFile) {
                    try {
                        qrImageUrl = await uploadImage(selectedQrFile, 'qrcodes');
                        console.log('✅ QR code uploaded');
                    } catch (uploadError) {
                        console.error('QR upload error:', uploadError);
                    }
                }
                
                // ========== STEP 5: INSERT SHOP ==========
                console.log('🏪 Saving shop details...');
                const { error: shopError } = await supabaseClient.from('shops').insert([{
                    owner_id: userId,
                    name: shopName,
                    category: categoryName,
                    phone: phone,
                    whatsapp: shopWhatsapp || ownerWhatsapp,
                    address: address,
                    city: city,
                    pincode: pincode,
                    description: description || null,
                    latitude: parseFloat(latitude),
                    longitude: parseFloat(longitude),
                    image_url: shopImageUrl,
                    qr_code_url: qrImageUrl,
                    upi_id: upiId || null,
                    upi_name: upiName || null,
                    status: 'pending',
                    is_open: false,
                    rating: 0,
                    payment_id: paymentResult.paymentId,
                    created_at: new Date().toISOString()
                }]);
                
                if (shopError) {
                    throw new Error('Shop registration failed: ' + shopError.message);
                }
                console.log('✅ Shop saved!');
                
                // ========== STEP 6: NOTIFICATION ==========
                await supabaseClient.from('notifications').insert([{
                    title: 'New Shop Registration',
                    message: `${shopName} has registered. Payment ID: ${paymentResult.paymentId}`,
                    notification_type: 'system',
                    is_global: true,
                    created_at: new Date().toISOString()
                }]);
                
                showSuccessModal(shopName);
                
            } catch (error) {
                console.error('Registration error:', error);
                showErrorModal('Registration Failed', error.message || 'Something went wrong. Please try again.');
                btn.innerHTML = originalText;
                btn.disabled = false;
                isProcessing = false;
            }
        }

        async function renderForm() {
            await loadSettings();
            await loadCategories();
            
            const categoryOptions = categories.map(cat => 
                `<option value="${cat.id}">${escapeHtml(cat.name)}</option>`
            ).join('');
            
            const container = document.getElementById('mainContent');
            container.innerHTML = `
                <div class="hero-section">
                    <div class="hero-icon"><i class="fas fa-store"></i></div>
                    <div class="hero-title">Start Your Business</div>
                    <div class="hero-subtitle">Join Zatpat and reach thousands of customers near you</div>
                    <div class="fee-badge"><i class="fas fa-rupee-sign"></i> ₹${registrationFee} Registration Fee</div>
                </div>
                
                <div class="form-card">
                    <div class="form-header">
                        <h2>Shop Registration</h2>
                        <p>Fill in your shop details to get started</p>
                    </div>
                    <div class="form-body">
                        <!-- Account Details -->
                        <div style="background: var(--bg-light); border-radius: var(--radius-md); padding: 16px; margin-bottom: 20px;">
                            <div style="font-weight: 700; margin-bottom: 12px;"><i class="fas fa-user-circle"></i> Account Details</div>
                            <div class="form-group">
                                <label class="form-label"><i class="fas fa-envelope"></i> Email Address *</label>
                                <input type="email" id="userEmail" class="form-control" placeholder="you@example.com" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label"><i class="fas fa-lock"></i> Password *</label>
                                <input type="password" id="userPassword" class="form-control" placeholder="Create a password (min 6 characters)" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label"><i class="fas fa-user"></i> Owner Name *</label>
                                <input type="text" id="ownerName" class="form-control" placeholder="Your full name" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label"><i class="fab fa-whatsapp"></i> WhatsApp Number *</label>
                                <input type="tel" id="ownerWhatsapp" class="form-control" placeholder="WhatsApp number" required>
                            </div>
                        </div>
                        
                        <!-- Shop Details -->
                        <div style="margin-bottom: 20px;">
                            <div style="font-weight: 700; margin-bottom: 12px;"><i class="fas fa-store"></i> Shop Details</div>
                            
                            <div class="form-group">
                                <label class="form-label"><i class="fas fa-image"></i> Shop Photo</label>
                                <div class="image-upload-area" id="imageUploadArea">
                                    <div class="upload-icon"><i class="fas fa-cloud-upload-alt"></i></div>
                                    <p>Click to upload shop photo</p>
                                    <input type="file" id="shopImageInput" accept="image/*" style="display: none;">
                                    <img id="imagePreview" class="image-preview" src="">
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label"><i class="fas fa-store"></i> Shop Name *</label>
                                <input type="text" id="shopName" class="form-control" placeholder="Enter your shop name" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label"><i class="fas fa-tag"></i> Category *</label>
                                <select id="shopCategory" class="form-control" required>
                                    <option value="">Select Category</option>
                                    ${categoryOptions}
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label"><i class="fas fa-phone"></i> Phone Number *</label>
                                <input type="tel" id="shopPhone" class="form-control" placeholder="Shop contact number" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label"><i class="fab fa-whatsapp"></i> Shop WhatsApp</label>
                                <input type="tel" id="shopWhatsapp" class="form-control" placeholder="Shop WhatsApp (optional)">
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label"><i class="fas fa-map-marker-alt"></i> Shop Location *</label>
                                <button type="button" class="location-btn" onclick="captureShopLocation()">
                                    <i class="fas fa-location-crosshairs"></i> Detect My Shop Location
                                </button>
                                <div id="locationStatus" class="location-status">
                                    <i class="fas fa-info-circle"></i> Click button to capture shop location
                                </div>
                                <div id="locationAddress" class="location-address" style="display: none;"></div>
                                <input type="hidden" id="shopLatitude" value="">
                                <input type="hidden" id="shopLongitude" value="">
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label"><i class="fas fa-map-marker-alt"></i> Address *</label>
                                <textarea id="shopAddress" class="form-control" placeholder="Complete address" rows="2" required></textarea>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label"><i class="fas fa-city"></i> City *</label>
                                <input type="text" id="shopCity" class="form-control" placeholder="City" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label"><i class="fas fa-map-pin"></i> Pincode *</label>
                                <input type="text" id="shopPincode" class="form-control" placeholder="6-digit pincode" maxlength="6" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label"><i class="fas fa-info-circle"></i> Description</label>
                                <textarea id="shopDesc" class="form-control" placeholder="Tell customers about your shop" rows="3"></textarea>
                            </div>
                        </div>
                        
                        <!-- Payment Settings Section -->
                        <div class="payment-section">
                            <div class="payment-section-title"><i class="fas fa-rupee-sign"></i> Payment Settings (For Customer Payments)</div>
                            
                            <div class="form-group">
                                <label class="form-label"><i class="fab fa-google-pay"></i> UPI ID</label>
                                <input type="text" id="shopUpiId" class="form-control" placeholder="example@okhdfcbank">
                                <small class="payment-note">Customer will pay directly to this UPI ID when ordering</small>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label"><i class="fas fa-user"></i> UPI Account Holder Name</label>
                                <input type="text" id="shopUpiName" class="form-control" placeholder="Account holder name">
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label"><i class="fas fa-qrcode"></i> QR Code Image (Optional)</label>
                                <div class="image-upload-area" id="qrUploadArea">
                                    <div class="upload-icon"><i class="fas fa-cloud-upload-alt"></i></div>
                                    <p>Click to upload QR code for UPI payment</p>
                                    <input type="file" id="qrImageInput" accept="image/*" style="display: none;">
                                    <img id="qrPreview" class="image-preview" src="">
                                </div>
                            </div>
                        </div>
                        
                        <!-- Fee Summary -->
                        <div class="fee-summary">
                            <div class="fee-row"><span>Registration Fee</span><span><i class="fas fa-rupee-sign"></i> ${registrationFee}</span></div>
                            <div class="fee-row total"><span>Total Payable</span><span><i class="fas fa-rupee-sign"></i> ${registrationFee}</span></div>
                            <div class="fee-note"><i class="fas fa-lock"></i> Secure payment via Razorpay</div>
                        </div>
                        
                        <button class="submit-btn" onclick="registerShop()">
                            <i class="fas fa-credit-card"></i> Pay ₹${registrationFee} & Register
                        </button>
                    </div>
                </div>
            `;
            
            // Setup shop image upload
            const uploadArea = document.getElementById('imageUploadArea');
            const fileInput = document.getElementById('shopImageInput');
            const imagePreview = document.getElementById('imagePreview');
            
            if (uploadArea) {
                uploadArea.onclick = () => fileInput.click();
                fileInput.onchange = (e) => {
                    if (e.target.files && e.target.files[0]) {
                        selectedImageFile = e.target.files[0];
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            imagePreview.src = event.target.result;
                            imagePreview.style.display = 'block';
                            const uploadIcon = uploadArea.querySelector('.upload-icon');
                            const uploadText = uploadArea.querySelector('p');
                            if (uploadIcon) uploadIcon.style.display = 'none';
                            if (uploadText) uploadText.style.display = 'none';
                        };
                        reader.readAsDataURL(selectedImageFile);
                    }
                };
            }
            
            // Setup QR upload
            const qrUploadArea = document.getElementById('qrUploadArea');
            const qrFileInput = document.getElementById('qrImageInput');
            const qrPreview = document.getElementById('qrPreview');
            
            if (qrUploadArea) {
                qrUploadArea.onclick = () => qrFileInput.click();
                qrFileInput.onchange = (e) => {
                    if (e.target.files && e.target.files[0]) {
                        selectedQrFile = e.target.files[0];
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            qrPreview.src = event.target.result;
                            qrPreview.style.display = 'block';
                            const uploadIcon = qrUploadArea.querySelector('.upload-icon');
                            const uploadText = qrUploadArea.querySelector('p');
                            if (uploadIcon) uploadIcon.style.display = 'none';
                            if (uploadText) uploadText.style.display = 'none';
                        };
                        reader.readAsDataURL(selectedQrFile);
                    }
                };
            }
        }

        function goBack() { window.location.href = 'index.html'; }
        
        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
        }

        document.addEventListener('DOMContentLoaded', async function() {
            await renderForm();
            window.captureShopLocation = captureShopLocation;
            window.registerShop = registerShop;
            window.closeSuccessModal = closeSuccessModal;
            window.closeErrorModal = closeErrorModal;
            window.goBack = goBack;
        });
    </script>
</body>
</html>
