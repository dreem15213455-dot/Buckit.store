<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Register Shop - ZyMart+</title>
    <meta name="theme-color" content="#0B5A31">
    <meta name="description" content="Register your shop on ZyMart+">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    
    <style>
        :root {
            --brand-green: #0B5A31; 
            --brand-green-dark: #083D21; 
            --brand-orange: #F59E0B; 
            --brand-orange-dark: #E8890A; 
            --neutral-white: #FFFFFF; 
            --neutral-bg: #F9FAFB; 
            --neutral-border: #E5E7EB; 
            --neutral-gray: #6B7280; 
            --neutral-dark: #1A1A1A; 
            --danger: #EF4444; 
            --success: #22C55E; 
            --warning: #F59E0B; 
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); 
            --shadow-sm: 0 1px 4px rgba(0,0,0,0.06); 
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08); 
            --shadow-lg: 0 8px 30px rgba(0,0,0,0.12); 
            --radius-sm: 10px; 
            --radius-md: 14px; 
            --radius-lg: 18px; 
            --radius-xl: 22px; 
            --radius-2xl: 28px; 
            --radius-full: 9999px;
            --status-bar-height: env(safe-area-inset-top, 0px);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--neutral-bg); 
            color: var(--neutral-dark); 
            -webkit-tap-highlight-color: transparent; 
            min-height: 100vh; 
            padding-bottom: 100px; 
            overflow-x: hidden; 
            width: 100%; 
            max-width: 100%; 
            -webkit-font-smoothing: antialiased; 
        }
        
        #simpleLoader {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: var(--neutral-white); 
            z-index: 10002; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            gap: 14px; 
            transition: opacity 0.3s ease;
        }
        
        #simpleLoader.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
        
        .simple-spinner { 
            width: 34px; 
            height: 34px; 
            border: 2.5px solid var(--neutral-border); 
            border-top-color: var(--brand-orange); 
            border-radius: 50%; 
            animation: spin 0.7s linear infinite; 
        }
        
        .loader-logo { font-family: 'Poppins', sans-serif; font-size: 24px; font-weight: 700; }
        .loader-zy { color: #A3E635; } 
        .loader-mart { color: #FDE047; }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(11,90,49,0.4); } 50% { box-shadow: 0 0 0 10px rgba(11,90,49,0); } }
        @keyframes cartBounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
        
        .cart-badge.bounce { animation: cartBounce 0.3s ease; }
        
        .top-bar { 
            background: var(--brand-green); 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            z-index: 1000; 
            padding: 10px 14px; 
            padding-top: calc(10px + var(--status-bar-height));
            display: flex; 
            align-items: center; 
            gap: 10px; 
            box-shadow: 0 2px 16px rgba(11,90,49,0.3); 
        }
        
        .back-btn { 
            width: 40px; 
            height: 40px; 
            min-width: 40px; 
            background: rgba(255,255,255,0.10); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            border: none; 
            color: white; 
            font-size: 15px; 
            text-decoration: none; 
        }
        
        .back-btn:active { background: rgba(255,255,255,0.22); transform: scale(0.93); }
        
        .brand-name { 
            font-family: 'Poppins', sans-serif; 
            font-size: 20px; 
            font-weight: 700; 
            display: flex; 
            align-items: baseline; 
        }
        
        .brand-zy { color: #A3E635; } 
        .brand-mart { color: #FDE047; }
        
        .page-title { 
            flex: 1; 
            text-align: center; 
            font-weight: 600; 
            font-size: 14px; 
            color: white; 
        }
        
        .cart-icon-btn {
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.10);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            color: white;
            font-size: 14px;
            position: relative;
            text-decoration: none;
        }
        
        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--brand-orange);
            color: white;
            border-radius: 50%;
            width: 17px;
            height: 17px;
            font-size: 8px;
            display: none;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--brand-green);
            font-weight: 700;
        }
        
        .cart-badge.show { display: flex; }
        
        .main-content { 
            padding-top: 60px; 
            padding-bottom: 40px; 
            max-width: 600px; 
            margin: 0 auto; 
        }
        
        /* Desktop responsive */
        @media (min-width: 768px) {
            .main-content {
                max-width: 700px;
            }
            .form-body {
                padding: 24px 28px;
            }
            .hero-section {
                padding: 28px;
            }
            .hero-section h1 {
                font-size: 22px;
            }
        }
        
        .hero-section {
            background: linear-gradient(135deg, var(--brand-green), var(--brand-green-dark)); 
            margin: 12px 14px; 
            padding: 20px; 
            border-radius: var(--radius-2xl); 
            animation: fadeInUp 0.4s ease; 
            text-align: center; 
            color: white; 
        }
        
        .hero-section h1 { font-family: 'Poppins', sans-serif; font-size: 18px; font-weight: 700; }
        .hero-section p { font-size: 11px; opacity: 0.85; margin-top: 4px; }
        
        .fee-badge { 
            display: inline-block; 
            background: rgba(255,255,255,0.15); 
            padding: 8px 16px; 
            border-radius: var(--radius-full); 
            font-weight: 700; 
            font-size: 14px; 
            margin-top: 10px; 
            border: 1px solid rgba(255,255,255,0.25); 
        }
        
        .form-card { 
            background: white; 
            margin: 0 14px 20px; 
            border-radius: var(--radius-2xl); 
            box-shadow: var(--shadow-md); 
            overflow: hidden; 
            animation: fadeInUp 0.4s ease; 
        }
        
        .form-header { 
            padding: 16px 20px; 
            border-bottom: 1px solid var(--neutral-border); 
            background: #EDF7F1; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        
        .form-header i { color: var(--brand-green); font-size: 18px; }
        .form-header h2 { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 700; color: var(--brand-green-dark); }
        
        .form-body { padding: 18px 20px; }
        
        .form-group { margin-bottom: 14px; }
        
        .form-label { 
            font-weight: 600; 
            font-size: 12px; 
            margin-bottom: 4px; 
            display: block; 
            color: var(--neutral-dark); 
        }
        
        .form-label i { color: var(--brand-green); width: 16px; margin-right: 3px; }
        .form-label .required { color: var(--danger); }
        .form-label .optional { color: var(--neutral-gray); font-weight: 400; font-size: 10px; }
        
        .form-control { 
            width: 100%; 
            padding: 12px 14px; 
            border: 1.5px solid var(--neutral-border); 
            border-radius: var(--radius-sm); 
            font-size: 13px; 
            font-family: 'Inter', sans-serif; 
            outline: none; 
            background: white; 
            transition: all 0.15s ease; 
        }
        
        .form-control:focus { border-color: var(--brand-orange); box-shadow: 0 0 0 3px rgba(245,158,11,0.08); }
        .form-control.error { border-color: var(--danger); background: #FEF2F2; }
        .form-control.valid { border-color: var(--success); }
        .form-control.locked { background: #D1FAE5; border: 1.5px solid #22C55E; }
        
        select.form-control { -webkit-appearance: none; padding-right: 32px; }
        textarea.form-control { resize: vertical; min-height: 60px; }
        
        .image-upload-area { 
            border: 2px dashed var(--brand-green); 
            border-radius: var(--radius-sm); 
            padding: 16px; 
            text-align: center; 
            cursor: pointer; 
            background: #EDF7F1; 
            transition: all 0.15s ease; 
        }
        
        .image-upload-area:active { background: #C8E6C9; }
        .image-upload-area i { font-size: 24px; color: var(--brand-green); margin-bottom: 4px; }
        .image-upload-area p { font-size: 11px; color: var(--brand-green); font-weight: 500; }
        
        .image-preview { 
            max-width: 100%; 
            max-height: 120px; 
            margin-top: 8px; 
            border-radius: var(--radius-sm); 
            display: none; 
        }
        
        .location-btn { 
            width: 100%; 
            padding: 14px; 
            background: #EDF7F1; 
            border: 2px solid var(--brand-green); 
            border-radius: var(--radius-sm); 
            font-weight: 600; 
            font-size: 13px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            color: var(--brand-green); 
            transition: all 0.2s ease; 
            font-family: 'Inter', sans-serif; 
            animation: pulse 2s infinite; 
            box-shadow: 0 4px 15px rgba(11,90,49,0.2); 
        }
        
        .location-btn:active { background: #C8E6C9; transform: scale(0.97); }
        .location-btn:disabled { opacity: 0.7; cursor: not-allowed; animation: none; box-shadow: none; }
        .location-btn.success { background: #22C55E; color: white; border-color: #22C55E; animation: none; box-shadow: none; }
        
        .location-status { 
            font-size: 11px; 
            padding: 10px 12px; 
            border-radius: var(--radius-sm); 
            background: #F3F5F4; 
            margin-top: 10px; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }
        
        .location-status.success { color: #059669; background: #EDF7F1; border: 1px solid #A7F3D0; }
        
        .gps-coords-display { 
            font-size: 10px; 
            color: var(--brand-green); 
            font-weight: 600; 
            margin-top: 6px; 
            font-family: monospace; 
            display: none; 
        }
        
        .gps-coords-display.show { display: block; }
        
        .gps-address-display { 
            font-size: 10px; 
            color: var(--neutral-gray); 
            margin-top: 4px; 
            display: none; 
            line-height: 1.3; 
        }
        
        .gps-address-display.show { display: block; }
        
        .otp-section { 
            background: #FFF8EB; 
            border: 2px solid #FDE68A; 
            border-radius: var(--radius-md); 
            padding: 14px; 
            margin-bottom: 14px; 
            display: none; 
        }
        
        .otp-section.show { display: block; }
        .otp-section.verified { background: #D1FAE5; border: 2px solid #22C55E; }
        
        .otp-input-row { display: flex; gap: 8px; align-items: center; }
        
        .otp-input-row input { 
            flex: 1; 
            padding: 12px; 
            border: 1.5px solid var(--neutral-border); 
            border-radius: var(--radius-sm); 
            font-size: 18px; 
            text-align: center; 
            letter-spacing: 6px; 
            font-family: 'Inter', sans-serif; 
            font-weight: 600; 
        }
        
        .btn { 
            width: 100%; 
            padding: 14px; 
            border-radius: var(--radius-full); 
            font-weight: 600; 
            font-size: 14px; 
            cursor: pointer; 
            border: none; 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            transition: all 0.15s ease; 
            margin-bottom: 8px; 
        }
        
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .btn-green { background: var(--brand-green); color: white; }
        .btn-orange { background: var(--brand-orange); color: white; box-shadow: 0 4px 14px rgba(245,158,11,0.25); }
        .btn-outline { background: white; color: var(--brand-green); border: 1.5px solid var(--brand-green); }
        .btn-gray { background: #F3F5F4; color: #374151; }
        
        .fee-summary { 
            background: #F3F5F4; 
            border-radius: var(--radius-lg); 
            padding: 12px 14px; 
            margin-bottom: 14px; 
            border: 1px solid var(--neutral-border); 
        }
        
        .fee-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 12px; }
        .fee-row.total { border-top: 1px solid var(--neutral-border); padding-top: 8px; font-weight: 700; font-size: 15px; }
        
        .text-muted { color: var(--neutral-gray); font-size: 10px; text-align: center; margin-top: 8px; }
        
        .error-msg { 
            background: #FEF2F2; 
            color: #DC2626; 
            padding: 8px 12px; 
            border-radius: 8px; 
            font-size: 11px; 
            margin-bottom: 10px; 
            display: none; 
        }
        
        .error-msg.show { display: block; }
        
        .success-msg { 
            background: #D1FAE5; 
            color: #059669; 
            padding: 8px 12px; 
            border-radius: 8px; 
            font-size: 11px; 
            margin-bottom: 10px; 
            display: none; 
        }
        
        .success-msg.show { display: block; }
        
        .verified-badge { 
            display: none; 
            background: #22C55E; 
            color: white; 
            padding: 8px 12px; 
            border-radius: var(--radius-full); 
            font-size: 11px; 
            font-weight: 600; 
            white-space: nowrap; 
        }
        
        .verified-badge.show { display: inline-block; }
        
        .toast-notification { 
            position: fixed; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: var(--neutral-dark); 
            color: white; 
            padding: 10px 20px; 
            border-radius: var(--radius-full); 
            font-size: 12px; 
            z-index: 10050; 
            opacity: 0; 
            visibility: hidden; 
            white-space: nowrap; 
            box-shadow: var(--shadow-lg); 
            transition: all 0.3s ease; 
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .toast-notification.show { opacity: 1; visibility: visible; }
        
        .alert-modal { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(8,61,33,0.7); 
            backdrop-filter: blur(6px); 
            display: none; 
            align-items: center; 
            justify-content: center; 
            z-index: 9990; 
        }
        
        .alert-modal.show { display: flex; }
        
        .alert-content { 
            background: white; 
            border-radius: var(--radius-xl); 
            padding: 24px; 
            max-width: 340px; 
            width: 90%; 
            text-align: center; 
            animation: fadeInUp 0.3s ease; 
        }
        
        .alert-content i { font-size: 40px; display: block; margin-bottom: 10px; }
        .alert-content h3 { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 6px; }
        .alert-content p { font-size: 13px; color: var(--neutral-gray); margin-bottom: 14px; line-height: 1.5; white-space: pre-line; }
        
        .alert-btn { 
            background: var(--brand-green); 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: var(--radius-full); 
            font-weight: 600; 
            cursor: pointer; 
            width: 100%; 
            font-size: 13px; 
            font-family: 'Inter', sans-serif; 
        }
        
        .loading-spinner { 
            display: inline-block; 
            width: 18px; 
            height: 18px; 
            border: 2px solid rgba(255,255,255,0.3); 
            border-top-color: white; 
            border-radius: 50%; 
            animation: spin 0.7s linear infinite; 
        }
        
        @media(max-width: 380px) {
            .hero-section h1 { font-size: 16px; } 
            .form-body { padding: 14px; }
        }
    </style>
</head>
<body>

<div id="simpleLoader">
    <div class="simple-spinner"></div>
    <div class="loader-logo"><span class="loader-zy">Zy</span><span class="loader-mart">Mart</span></div>
</div>

<div id="mainApp" style="display:none;">
    <div class="top-bar">
        <a href="index.html" class="back-btn" aria-label="Back"><i class="fas fa-arrow-left"></i></a>
        <div class="brand-name"><span class="brand-zy">Zy</span><span class="brand-mart">Mart</span></div>
        <div class="page-title">Register Shop</div>
        <a href="cart.html" class="cart-icon-btn">
            <i class="fas fa-shopping-cart"></i>
            <span class="cart-badge" id="cartBadge">0</span>
        </a>
    </div>
    <div class="main-content" id="mainContent"></div>
</div>

<div id="toastMsg" class="toast-notification"><span id="toastText"></span></div>

<div id="customAlert" class="alert-modal">
    <div class="alert-content">
        <i id="alertIcon" class="fas fa-info-circle" style="color:var(--warning);"></i>
        <h3 id="alertTitle">Notice</h3>
        <p id="alertMessage"></p>
        <button class="alert-btn" onclick="closeAlert()">OK</button>
    </div>
</div>

<script>
(function() {
    'use strict';
    
    var CONFIG = {
        SUPABASE_URL: 'https://zwajyovemwdqtkecipeb.supabase.co',
        SUPABASE_KEY: 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1',
        // 🔥 FIXED: Razorpay key config mein
        RAZORPAY_KEY_ID: 'rzp_live_SZqH2di86Njggl',
        DEFAULT_REGISTRATION_FEE: 299
    };
    
    var sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
    var SUPABASE_URL = CONFIG.SUPABASE_URL;
    
    var categories = [];
    var selectedImageFile = null, selectedQrFile = null, selectedIdFile = null;
    var isProcessing = false;
    var isCapturingLocation = false;
    var registrationFee = CONFIG.DEFAULT_REGISTRATION_FEE;
    var paymentDone = false;
    var otpVerified = false, currentOtpPhone = null;
    var otpSendCount = 0, otpSendWindow = 0, otpAttemptCount = 0, otpLockedUntil = 0, otpTimer = null, otpSeconds = 0;
    
    function $(id) { return document.getElementById(id); }
    function esc(s) { if(!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    
    // ==================== CART MANAGER ====================
    var CartManager = {
        getCart: function() {
            try { return JSON.parse(localStorage.getItem('zymart_cart') || '[]'); } catch(e) { return []; }
        },
        
        getTotalItems: function() {
            var cart = this.getCart();
            return cart.reduce(function(sum, item) { return sum + (item.quantity || 1); }, 0);
        },
        
        updateBadge: function() {
            var totalItems = this.getTotalItems();
            var badge = $('cartBadge');
            
            if (badge) {
                badge.textContent = totalItems;
                if (totalItems > 0) {
                    badge.classList.add('show');
                } else {
                    badge.classList.remove('show');
                }
            }
        }
    };
    
    function showApp() { 
        var l = $('simpleLoader'), a = $('mainApp'); 
        if(a) a.style.display = ''; 
        if(l) { 
            l.classList.add('fade-out'); 
            setTimeout(function() { 
                if(l && l.parentNode) l.parentNode.removeChild(l); 
            }, 300); 
        } 
    }
    
    function getFullUrl(u) { 
        if(!u || typeof u !== 'string') return ''; 
        if(u.indexOf('http')===0 || u.indexOf('data:')===0) return u; 
        return SUPABASE_URL + '/storage/v1/object/public/' + u; 
    }
    
    function showToast(m, e) { 
        var t = $('toastMsg'), s = $('toastText'); 
        if(!t || !s) return; 
        s.textContent = m; 
        t.style.background = e ? '#EF4444' : '#1A1A1A'; 
        t.classList.add('show'); 
        clearTimeout(t._t); 
        t._t = setTimeout(function() { t.classList.remove('show'); }, 3000); 
    }
    
    function showAlert(msg, title, icon) { 
        title = title || 'Notice'; 
        icon = icon || 'warning'; 
        var me = $('alertMessage'), te = $('alertTitle'), ie = $('alertIcon'), mo = $('customAlert'); 
        if(me) me.textContent = msg; 
        if(te) te.textContent = title; 
        if(ie) { 
            ie.style.color = icon === 'success' ? '#22C55E' : icon === 'error' ? '#EF4444' : '#F59E0B'; 
            ie.className = 'fas ' + (icon === 'success' ? 'fa-check-circle' : icon === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'); 
        } 
        if(mo) mo.classList.add('show'); 
    }
    
    window.closeAlert = function() { 
        var m = $('customAlert'); 
        if(m) m.classList.remove('show'); 
    };
    
    function showFormError(msg) { 
        var el = $('formError'); 
        if(el) { el.innerHTML = msg; el.classList.add('show'); } 
        var sc = $('formSuccess'); 
        if(sc) sc.classList.remove('show'); 
    }
    
    function showFormSuccess(msg) { 
        var el = $('formSuccess'); 
        if(el) { el.innerHTML = msg; el.classList.add('show'); } 
        var er = $('formError'); 
        if(er) er.classList.remove('show'); 
    }
    
    // ==================== FORM DRAFT (FIXED - Auto save on input) ====================
    function saveFormData() { 
        var data = {}, fields = ['ownerName','ownerEmail','ownerPhone','ownerWhatsapp','shopName','shopCategory','shopAddress','shopCity','shopPincode','shopDesc','idNumber']; 
        for(var i = 0; i < fields.length; i++) { 
            var el = $(fields[i]); 
            if(el) data[fields[i]] = el.value; 
        } 
        try { localStorage.setItem('zm_shop_draft', JSON.stringify(data)); } catch(e) {} 
    }
    
    function loadFormData() { 
        try { 
            var raw = localStorage.getItem('zm_shop_draft'); 
            if(!raw) return; 
            var data = JSON.parse(raw); 
            for(var key in data) { 
                if(!data.hasOwnProperty(key)) continue;

    // ==================== IMAGE UPLOAD ====================
    async function compressImage(file) {
        if(!file || !file.type || file.type.indexOf('image/') !== 0) return file;
        if(file.size < 80 * 1024) return file;
        
        return new Promise(function(resolve) {
            var reader = new FileReader(); 
            reader.readAsDataURL(file);
            reader.onload = function(e) { 
                var img = new Image(); 
                img.src = e.target.result;
                img.onload = function() { 
                    var w = img.width, h = img.height, maxDim = 800;
                    if(w > maxDim || h > maxDim) { 
                        if(w > h) { h = Math.round((h * maxDim) / w); w = maxDim; } 
                        else { w = Math.round((w * maxDim) / h); h = maxDim; } 
                    }
                    var canvas = document.createElement('canvas'); 
                    canvas.width = w; 
                    canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    canvas.toBlob(function(blob) { 
                        resolve(new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), { type: 'image/jpeg' })); 
                    }, 'image/jpeg', 0.55);
                }; 
            }; 
        }); 
    }
    
    async function uploadImage(file, folder) {
        if(!file) return null;
        var compressed = await compressImage(file);
        var fn = Date.now() + '_' + Math.random().toString(36).substr(2, 6) + '.jpg';
        var uploadResult = await sb.storage.from('shop-images').upload(folder + '/' + fn, compressed, { cacheControl: '3600', upsert: true });
        if(uploadResult.error) throw new Error('Upload failed');
        return sb.storage.from('shop-images').getPublicUrl(folder + '/' + fn).data.publicUrl; 
    }
    
    // ==================== GPS LOCATION ====================
    window.captureShopLocation = function() {
        if(isCapturingLocation) { showToast('⚠️ GPS already searching...', true); return; }
        
        if(window.Android && typeof window.Android.requestLocation === 'function') { 
            isCapturingLocation = true; 
            updateLocationButton('loading'); 
            window.Android.requestLocation(); 
            window._gpsShopTimeout = setTimeout(function() { if(isCapturingLocation) tryBrowserGPS(); }, 12000); 
            return; 
        }
        tryBrowserGPS(); 
    };
    
    function tryBrowserGPS() {
        if(window._gpsShopTimeout) clearTimeout(window._gpsShopTimeout);
        if(!navigator.geolocation) { 
            isCapturingLocation = false; 
            updateLocationButton('retry'); 
            showAlert('GPS not supported', 'Error', 'error'); 
            return; 
        }
        
        updateLocationButton('loading');
        navigator.geolocation.getCurrentPosition(function(pos) {
            if(window._gpsShopTimeout) clearTimeout(window._gpsShopTimeout); 
            isCapturingLocation = false;
            setLocationData(pos.coords.latitude, pos.coords.longitude);
        }, function(err) { 
            isCapturingLocation = false; 
            updateLocationButton('retry'); 
            showAlert('GPS not found. Move to open area.', 'GPS Failed', 'error'); 
        }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }); 
    }
    
    window.setLocationFromAndroid = function(lat, lng, address) { 
        if(!lat || !lng || lat === 0 || lng === 0) return; 
        if(window._gpsShopTimeout) clearTimeout(window._gpsShopTimeout); 
        setLocationData(parseFloat(lat), parseFloat(lng), address); 
    };
    
    window.onLocationError = function(errorMsg) { 
        isCapturingLocation = false; 
        if(window._gpsShopTimeout) clearTimeout(window._gpsShopTimeout); 
        updateLocationButton('retry'); 
        showAlert('GPS is off. Enable in Settings.', 'GPS Off', 'error'); 
    };
    
    function setLocationData(lat, lng, address) {
        isCapturingLocation = false; 
        if(window._gpsShopTimeout) clearTimeout(window._gpsShopTimeout);
        
        $('shopLatitude').value = lat; 
        $('shopLongitude').value = lng;
        
        var ce = $('locationCoords'); 
        if(ce) { 
            ce.textContent = '📍 ' + Number(lat).toFixed(6) + ', ' + Number(lng).toFixed(6); 
            ce.style.display = 'block'; 
        }
        
        updateLocationButton('success');
        
        var sd = $('locationStatus'); 
        if(sd) { 
            sd.innerHTML = '<i class="fas fa-check-circle"></i> ✅ GPS Location Captured!'; 
            sd.className = 'location-status success'; 
        }
        
        if(address) { 
            var ae = $('locationAddress'); 
            if(ae) { 
                ae.innerHTML = '<i class="fas fa-map-pin"></i> ' + (address || '').substring(0, 120); 
                ae.style.display = 'block'; 
            } 
            autoFillCityFromAddress(address); 
        } else {
            fetchAddressFromCoords(lat, lng); 
        }
        
        saveFormData(); 
        showToast('📍 GPS Location Captured!'); 
    }
    
    async function fetchAddressFromCoords(lat, lng) {
        try { 
            var c = new AbortController(); 
            var t = setTimeout(function() { c.abort(); }, 5000);
            var r = await fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lng + '&zoom=18', { headers: { 'User-Agent': 'ZyMartApp' }, signal: c.signal });
            clearTimeout(t); 
            var d = await r.json(); 
            var addr = d.display_name || '';
            var ae = $('locationAddress'); 
            if(ae && addr) { 
                ae.innerHTML = '<i class="fas fa-map-pin"></i> ' + addr.substring(0, 120); 
                ae.style.display = 'block'; 
            }
            autoFillCityFromAddress(addr, d.address || null); 
        } catch(e) {} 
    }
    
    function autoFillCityFromAddress(displayName, addressObj) {
        var ci = $('shopCity'); 
        if(!ci || ci.value) return; 
        var city = '';
        
        if(addressObj) { 
            city = addressObj.city || addressObj.town || addressObj.municipality || addressObj.village || addressObj.state_district || ''; 
        }
        
        if(!city && displayName) { 
            var parts = displayName.split(','); 
            for(var i = 0; i < parts.length; i++) { 
                var part = parts[i].trim(); 
                if(part && part.length > 2 && part.length < 30 && part.indexOf('Maharashtra') === -1 && part.indexOf('India') === -1) { 
                    city = part; 
                    break; 
                } 
            } 
        }
        
        if(city && !ci.value) { 
            ci.value = city; 
            showToast('🏙️ City: ' + city); 
            saveFormData(); 
        } 
    }
    
    function updateLocationButton(state) {
        var btn = $('locationBtn'); 
        if(!btn) return;
        
        if(state === 'loading') { 
            btn.innerHTML = '<span class="loading-spinner"></span> Detecting GPS...'; 
            btn.className = 'location-btn'; 
            btn.disabled = true; 
        } else if(state === 'success') { 
            btn.innerHTML = '<i class="fas fa-check-circle"></i> ✅ Location Captured!'; 
            btn.className = 'location-btn success'; 
            btn.disabled = false; 
        } else if(state === 'retry') { 
            btn.innerHTML = '<i class="fas fa-redo"></i> Retry GPS'; 
            btn.className = 'location-btn'; 
            btn.disabled = false; 
        } else { 
            btn.innerHTML = '<i class="fas fa-location-dot"></i> 📍 Capture GPS Location'; 
            btn.className = 'location-btn'; 
            btn.disabled = false; 
        } 
    }

        if(!op || !/^[6-9]\d{9}$/.test(op)) { showFormError('❌ Enter valid 10-digit mobile number'); $('ownerPhone').focus(); return false; }

    async function checkDuplicates(email, phone, idNumber) {
        if(email) { 
            var eu = await sb.from('users').select('id').eq('email', email).maybeSingle(); 
            if(eu && eu.data) return '❌ This email is already registered as a user'; 
            var es = await sb.from('shops').select('id').eq('owner_email', email).maybeSingle(); 
            if(es && es.data) return '❌ This email is already registered with another shop'; 
        }
        if(phone) { 
            var ps = await sb.from('shops').select('id').eq('owner_phone', phone).maybeSingle(); 
            if(ps && ps.data) return '❌ This mobile number is already registered with another shop'; 
        }
        if(idNumber && idNumber.length >= 8) { 
            var ids = await sb.from('shops').select('id').eq('id_number', idNumber).maybeSingle(); 
            if(ids && ids.data) return '❌ This ID number is already used by another shop'; 
        }
        return null; 
    }

            else { otpLockedUntil = 0; otpAttemptCount = 0; } 
        }
        
        var now = Date.now(); 
        if(now - otpSendWindow > 300000) { otpSendCount = 0; otpSendWindow = now; }
        if(otpSendCount >= 3) { showFormError('⚠️ Too many OTP requests. Wait 5 minutes.'); return; }
        
        if(otpVerified && currentOtpPhone === phone) { showFormSuccess('✅ Already verified!'); return; }
        
        if(currentOtpPhone && currentOtpPhone !== phone) { 
            otpVerified = false; 
            $('otpVerifiedBadge').classList.remove('show');

        var btn = $('sendOtpBtn');

        try {
            var res = await fetch(SUPABASE_URL + '/functions/v1/send-otp', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json', 'apikey': CONFIG.SUPABASE_KEY, 'Authorization': 'Bearer ' + CONFIG.SUPABASE_KEY }, 
                body: JSON.stringify({ phone: phone }) 
            });
            var data = await res.json();
            
            if(data.Status === 'Success') { 
                otpSendCount++; 
                currentOtpPhone = phone;
                $('otpSection').classList.add('show'); 
                $('otpSection').classList.remove('verified');
                $('otpPhoneDisplay').textContent = '+91 ' + phone;

            } else { 
                showFormError('❌ Failed to send OTP. Try again.'); 
                if(btn) { btn.disabled = false; btn.innerHTML = '📱 Send OTP'; } 
            }
        } catch(e) { 
            showFormError('❌ Network error'); 
            if(btn) { btn.disabled = false; btn.innerHTML = '📱 Send OTP'; } 
        }

            } else { 
                if(rb) rb.textContent = '🔄 Resend OTP (' + otpSeconds + 's)';

    window.verifyOTP = async function() {
        showFormError(''); showFormSuccess('');
        
        if(otpLockedUntil > 0) { 
            var remaining = Math.ceil((otpLockedUntil - Date.now()) / 60000); 
            if(remaining > 0) { showFormError('🔒 Too many wrong attempts! Try again in ' + remaining + ' minutes.'); return; } 
            else { otpLockedUntil = 0; otpAttemptCount = 0; } 
        }
        
        var otp = $('otpInput')?.value.trim();
        if(!otp || otp.length < 4) { showFormError('❌ Enter complete OTP'); return; }
        
        var btn = $('verifyOtpBtn'); 
        if(btn) { btn.disabled = true; btn.innerHTML = '<span class="loading-spinner"></span> Verifying...'; }
        
        try {
            var res = await fetch(SUPABASE_URL + '/functions/v1/verify-otp', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json', 'apikey': CONFIG.SUPABASE_KEY, 'Authorization': 'Bearer ' + CONFIG.SUPABASE_KEY }, 
                body: JSON.stringify({ phone: currentOtpPhone, otp: otp }) 
            });
            var data = await res.json();
            
            if(data.Status === 'Success' || data.status === 'success' || res.status === 200) {
                otpAttemptCount = 0; 
                otpLockedUntil = 0; 
                otpVerified = true;
                $('otpSection').classList.add('verified'); 
                $('otpVerifiedBadge').classList.add('show');
                $('payBtn').disabled = false;

                var pi = $('ownerPhone'); 
                if(pi) { pi.readOnly = true; pi.classList.add('locked'); }
                
                $('otpSection').style.display = 'none'; 
                $('resendOtpBtn').style.display = 'none';
                if(otpTimer) clearInterval(otpTimer);
                showFormSuccess('✅ Mobile verified! You can now pay.');
            } else {
                otpAttemptCount++; 
                $('otpInput').value = '';
                
                if(otpAttemptCount >= 3) { 
                    otpLockedUntil = Date.now() + 600000; 
                    showFormError('🔒 3 wrong attempts! Locked for 10 minutes.'); 
                    $('otpSection').style.display = 'none'; 
                    $('resendOtpBtn').style.display = 'none'; 
                    if(otpTimer) clearInterval(otpTimer); 
                } else { 
                    var left = 3 - otpAttemptCount; 
                    showFormError('❌ Wrong OTP! ' + left + ' attempt' + (left > 1 ? 's' : '') + ' left.'); 
                }
            }
        } catch(e) { 
            showFormError('❌ Verification failed'); 
        }
        
        if(btn) { btn.disabled = false; btn.innerHTML = '✓ Verify OTP'; }
    };
