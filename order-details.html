<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Order Details - Zatpat</title>
    <meta name="theme-color" content="#16A34A">
    
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #16A34A;
            --primary-light: #22C55E;
            --primary-bg-light: #F0FDF4;
            --accent-orange: #F97316;
            --bg-white: #FFFFFF;
            --bg-light: #F9FAFB;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --border-light: #E5E7EB;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-full: 9999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
            overflow-x: hidden;
            padding-bottom: 20px;
            -webkit-font-smoothing: antialiased;
        }

        #pageProgress {
            position: fixed; top: 0; left: 0; width: 0%; height: 3px;
            background: var(--primary); z-index: 10001; transition: width 0.3s ease;
        }
        #pageProgress.loading { width: 90%; }
        #pageProgress.complete { width: 100%; opacity: 0; transition: opacity 0.3s; }

        .top-bar {
            background: var(--bg-white); position: sticky; top: 0; left: 0; width: 100%;
            z-index: 1000; padding: 12px 16px; box-shadow: var(--shadow-sm);
            border-bottom: 1px solid var(--border-light); display: flex; align-items: center; gap: 12px;
        }
        .back-btn {
            width: 40px; height: 40px; background: var(--bg-light); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .back-btn i { font-size: 18px; color: var(--text-primary); }
        .top-title { flex: 1; font-size: 18px; font-weight: 800; color: #000000; }

        .main-content { padding: 16px; }

        .status-banner {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: var(--radius-lg); padding: 20px; color: white; margin-bottom: 16px;
        }
        .status-banner.delivered { background: linear-gradient(135deg, #059669, #10B981); }
        .status-banner.cancelled { background: linear-gradient(135deg, #DC2626, #EF4444); }
        
        .status-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .status-icon {
            width: 50px; height: 50px; background: rgba(255,255,255,0.2);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        .status-icon i { font-size: 24px; }
        .status-text { font-size: 20px; font-weight: 800; }
        .status-subtext { font-size: 13px; opacity: 0.9; }
        .order-id { font-size: 14px; font-family: monospace; margin-top: 8px; }

        .timeline {
            background: var(--bg-white); border-radius: var(--radius-md);
            padding: 20px; margin-bottom: 16px; border: 1px solid var(--border-light);
        }
        .timeline-title {
            font-size: 14px; font-weight: 800; color: #000000; margin-bottom: 16px;
            display: flex; align-items: center; gap: 6px;
        }
        .timeline-title i { color: var(--primary); }
        
        .timeline-steps { display: flex; justify-content: space-between; }
        .timeline-step { flex: 1; text-align: center; position: relative; }
        .step-icon {
            width: 40px; height: 40px; border-radius: 50%; background: var(--bg-light);
            display: flex; align-items: center; justify-content: center; margin: 0 auto 8px;
            border: 2px solid var(--border-light); color: var(--text-secondary);
        }
        .timeline-step.completed .step-icon {
            background: var(--primary); border-color: var(--primary); color: white;
        }
        .timeline-step.active .step-icon {
            background: var(--primary-bg-light); border-color: var(--primary); color: var(--primary);
        }
        .step-label { font-size: 10px; font-weight: 600; color: var(--text-secondary); }
        .timeline-step.completed .step-label,
        .timeline-step.active .step-label { color: #000000; font-weight: 700; }

        .address-card {
            background: var(--bg-white); border-radius: var(--radius-md);
            padding: 16px; margin-bottom: 16px; border: 1px solid var(--border-light);
        }
        .address-title {
            font-size: 13px; font-weight: 800; color: #000000; margin-bottom: 8px;
            display: flex; align-items: center; gap: 6px;
        }
        .address-title i { color: var(--primary); }
        .address-text { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }

        .items-card {
            background: var(--bg-white); border-radius: var(--radius-md);
            padding: 16px; margin-bottom: 16px; border: 1px solid var(--border-light);
        }
        .items-title {
            font-size: 14px; font-weight: 800; color: #000000; margin-bottom: 12px;
            display: flex; align-items: center; gap: 6px;
        }
        .items-title i { color: var(--primary); }
        
        .order-item {
            display: flex; align-items: center; gap: 12px; padding: 10px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .order-item:last-child { border-bottom: none; }
        .item-image {
            width: 60px; height: 60px; border-radius: 8px;
            background: var(--bg-light); flex-shrink: 0; overflow: hidden;
        }
        .item-image img { width: 100%; height: 100%; object-fit: cover; }
        .item-details { flex: 1; }
        .item-name { font-size: 13px; font-weight: 700; color: #000000; margin-bottom: 2px; }
        .item-qty { font-size: 11px; color: var(--text-secondary); }
        .item-price { font-size: 14px; font-weight: 800; color: #000000; }

        .payment-card {
            background: var(--bg-white); border-radius: var(--radius-md);
            padding: 16px; margin-bottom: 16px; border: 1px solid var(--border-light);
        }
        .payment-title {
            font-size: 14px; font-weight: 800; color: #000000; margin-bottom: 12px;
            display: flex; align-items: center; gap: 6px;
        }
        .payment-title i { color: var(--primary); }
        .summary-row {
            display: flex; justify-content: space-between; padding: 6px 0;
            font-size: 13px; color: var(--text-secondary);
        }
        .summary-row.total {
            font-size: 16px; font-weight: 800; color: #000000;
            border-top: 1px solid var(--border-light); margin-top: 8px; padding-top: 12px;
        }
        .total-amount { color: #000000; }
        .payment-method {
            background: var(--primary-bg-light); padding: 8px 12px;
            border-radius: var(--radius-full); display: inline-block;
            font-size: 12px; margin-top: 12px; color: #000000; font-weight: 600;
        }

        .action-buttons { display: flex; gap: 12px; padding: 8px 0; }
        .action-btn {
            flex: 1; padding: 14px; border-radius: var(--radius-full);
            font-size: 14px; font-weight: 600; cursor: pointer; text-align: center;
        }
        .primary-btn { background: var(--primary); color: white; border: none; }
        .secondary-btn { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
        .danger-btn { background: transparent; color: #DC2626; border: 1px solid #DC2626; }

        .toast-notification {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--text-primary); color: white; padding: 12px 24px;
            border-radius: var(--radius-full); font-size: 13px; z-index: 10050;
            display: none; white-space: nowrap;
        }
        .toast-notification.show { display: flex; }

        .loading-spinner { text-align: center; padding: 60px; }
        .spinner {
            width: 40px; height: 40px; border: 3px solid var(--border-light);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="pageProgress"></div>
<div id="toastMsg" class="toast-notification"><span id="toastText"></span></div>

<div id="mainApp">
    <div class="top-bar">
        <div class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
        <div class="top-title">Order Details</div>
    </div>

    <div class="main-content" id="orderContent">
        <div class="loading-spinner"><div class="spinner"></div></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // ========== ERROR HANDLING (CRASH-PROOF) ==========
    window.addEventListener('error', function(e) {
        console.error('Global error:', e.error);
        showToast('Something went wrong. Please refresh.', true);
        return false;
    });

    const supabaseUrl = 'https://zwajyovemwdqtkecipeb.supabase.co';
    const supabaseKey = 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1';
    const zatpatDB = supabase.createClient(supabaseUrl, supabaseKey);

    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('id');

    let currentOrder = null;
    let orderItems = [];

    function startProgress() { const b = document.getElementById('pageProgress'); if(b) { b.style.width = '0%'; b.classList.add('loading'); setTimeout(() => b.style.width = '90%', 10); } }
    function completeProgress() { const b = document.getElementById('pageProgress'); if(b) { b.classList.remove('loading'); b.classList.add('complete'); setTimeout(() => { b.style.width = '0%'; b.classList.remove('complete'); }, 300); } }
    window.fastNavigate = function(url) { startProgress(); setTimeout(() => window.location.href = url, 50); };
    function goBack() { window.history.back(); }

    function showToast(msg, isError = false) {
        const t = document.getElementById('toastMsg');
        const s = document.getElementById('toastText');
        if(!t || !s) return;
        s.innerHTML = msg;
        t.style.background = isError ? '#EF4444' : '#111827';
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    async function loadOrder() {
        if (!orderId) { showToast('Order not found', true); setTimeout(() => goBack(), 1500); return; }

        try {
            const { data: order, error: orderError } = await zatpatDB.from('orders').select('*').eq('id', orderId).single();
            if (orderError) throw orderError;

            const { data: items, error: itemsError } = await zatpatDB.from('order_items').select('*').eq('order_id', orderId);
            if (itemsError) throw itemsError;

            currentOrder = order;
            orderItems = items || [];
            renderOrder();
        } catch (e) {
            console.error('Load error:', e);
            const container = document.getElementById('orderContent');
            if(container) {
                container.innerHTML = `
                    <div style="text-align:center;padding:60px;">
                        <i class="fas fa-exclamation-circle" style="font-size:48px;color:var(--text-secondary);"></i>
                        <h3 style="margin-top:16px;">Order not found</h3>
                        <button onclick="goBack()" style="margin-top:20px;background:var(--primary);color:white;border:none;padding:12px24px;border-radius:var(--radius-full);">Go Back</button>
                    </div>
                `;
            }
        }
    }

    function renderOrder() {
        const container = document.getElementById('orderContent');
        if(!container || !currentOrder) return;
        
        const order = currentOrder;
        const orderDate = new Date(order.created_at).toLocaleDateString('en-IN', {
            day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        const statusClass = order.status === 'delivered' ? 'delivered' : (order.status === 'cancelled' ? 'cancelled' : '');
        const statusIcon = getStatusIcon(order.status);
        const statusText = getStatusText(order.status);

        let itemTotal = 0;
        orderItems.forEach(item => itemTotal += item.total_price || (item.price * item.quantity) || 0);

        let itemsHtml = '';
        orderItems.forEach(item => {
            itemsHtml += `
                <div class="order-item">
                    <div class="item-image"><img src="https://placehold.co/60/F0FDF4/16A34A?text=📦" loading="lazy"></div>
                    <div class="item-details">
                        <div class="item-name">${item.product_name || 'Product'}</div>
                        <div class="item-qty">Qty: ${item.quantity || 1}</div>
                    </div>
                    <div class="item-price">₹${item.total_price || (item.price * item.quantity) || 0}</div>
                </div>
            `;
        });

        container.innerHTML = `
            <div class="status-banner ${statusClass}">
                <div class="status-header">
                    <div class="status-icon"><i class="fas ${statusIcon}"></i></div>
                    <div>
                        <div class="status-text">${statusText}</div>
                        <div class="status-subtext">${orderDate}</div>
                    </div>
                </div>
                <div class="order-id">Order ID: ${order.id?.slice(0, 8).toUpperCase() || 'UNKNOWN'}</div>
            </div>

            <div class="timeline">
                <div class="timeline-title"><i class="fas fa-truck"></i> Order Status</div>
                <div class="timeline-steps">
                    <div class="timeline-step ${order.status !== 'cancelled' ? 'completed' : ''}">
                        <div class="step-icon"><i class="fas fa-check"></i></div>
                        <div class="step-label">Placed</div>
                    </div>
                    <div class="timeline-step ${order.status === 'confirmed' || order.status === 'delivered' ? 'completed' : (order.status === 'pending' ? 'active' : '')}">
                        <div class="step-icon"><i class="fas fa-box"></i></div>
                        <div class="step-label">Confirmed</div>
                    </div>
                    <div class="timeline-step ${order.status === 'delivered' ? 'completed' : (order.status === 'confirmed' ? 'active' : '')}">
                        <div class="step-icon"><i class="fas fa-truck"></i></div>
                        <div class="step-label">Shipped</div>
                    </div>
                    <div class="timeline-step ${order.status === 'delivered' ? 'completed' : ''}">
                        <div class="step-icon"><i class="fas fa-home"></i></div>
                        <div class="step-label">Delivered</div>
                    </div>
                </div>
            </div>

            <div class="address-card">
                <div class="address-title"><i class="fas fa-map-pin"></i> Delivery Address</div>
                <div class="address-text">
                    <strong>${order.customer_name || 'Customer'}</strong><br>
                    ${order.delivery_address || 'Sillod, Maharashtra - 431112'}<br>
                    Phone: ${order.customer_phone || '+91 9876543210'}
                </div>
            </div>

            <div class="items-card">
                <div class="items-title"><i class="fas fa-shopping-bag"></i> Items (${orderItems.length})</div>
                ${itemsHtml}
            </div>

            <div class="payment-card">
                <div class="payment-title"><i class="fas fa-receipt"></i> Payment Summary</div>
                <div class="summary-row"><span>Item Total</span> <span>₹${itemTotal}</span></div>
                <div class="summary-row"><span>Delivery Fee</span> <span>₹${order.delivery_fee || 20}</span></div>
                <div class="summary-row"><span>Discount</span> <span style="color: var(--primary);">-₹0</span></div>
                <div class="summary-row total"><span>Total Amount</span> <span class="total-amount">₹${order.total_amount || itemTotal + (order.delivery_fee || 20)}</span></div>
                <div class="payment-method">
                    <i class="fas ${order.payment_method === 'cod' ? 'fa-money-bill-wave' : 'fa-qrcode'}"></i> 
                    ${order.payment_method === 'cod' ? 'Cash on Delivery' : 'UPI Payment'}
                </div>
            </div>

            ${order.status !== 'cancelled' && order.status !== 'delivered' ? `
            <div class="action-buttons">
                <button class="action-btn secondary-btn" onclick="trackOrder()"><i class="fas fa-truck"></i> Track Order</button>
                <button class="action-btn danger-btn" onclick="cancelOrder()"><i class="fas fa-times"></i> Cancel</button>
            </div>
            ` : ''}
            
            ${order.status === 'delivered' ? `
            <div class="action-buttons">
                <button class="action-btn primary-btn" onclick="reorder()"><i class="fas fa-redo-alt"></i> Reorder</button>
                <button class="action-btn secondary-btn" onclick="downloadInvoice()"><i class="fas fa-download"></i> Invoice</button>
            </div>
            ` : ''}
            
            <div style="text-align: center; padding: 16px;">
                <span style="color: var(--text-secondary); font-size: 12px; cursor: pointer;" onclick="showHelp()">
                    <i class="fas fa-headset"></i> Need Help?
                </span>
            </div>
        `;
    }

    function getStatusIcon(status) {
        const icons = { 'pending': 'fa-clock', 'confirmed': 'fa-check-circle', 'delivered': 'fa-check-double', 'cancelled': 'fa-times-circle' };
        return icons[status] || 'fa-clock';
    }

    function getStatusText(status) {
        const texts = { 'pending': 'Order Pending', 'confirmed': 'Order Confirmed', 'delivered': 'Delivered', 'cancelled': 'Cancelled' };
        return texts[status] || 'Processing';
    }

    window.trackOrder = function() { fastNavigate(`order-tracking.html?id=${orderId}`); };
    window.cancelOrder = async function() {
        if (confirm('Cancel this order?')) {
            try {
                await zatpatDB.from('orders').update({ status: 'cancelled' }).eq('id', orderId);
                showToast('Order cancelled');
                setTimeout(() => loadOrder(), 500);
            } catch (e) { showToast('Failed to cancel', true); }
        }
    };
    window.reorder = function() {
        let cart = JSON.parse(localStorage.getItem('zatpat_cart')) || [];
        orderItems.forEach(item => {
            const existing = cart.find(i => i.id === item.product_id);
            if (existing) existing.quantity += item.quantity || 1;
            else cart.push({ id: item.product_id, name: item.product_name, price: item.price, quantity: item.quantity || 1, image: '' });
        });
        localStorage.setItem('zatpat_cart', JSON.stringify(cart));
        showToast('🛒 Items added to cart');
        setTimeout(() => fastNavigate('cart.html'), 500);
    };
    window.downloadInvoice = function() { showToast('📄 Invoice download started'); };
    window.showHelp = function() { window.open('https://wa.me/918600252238', '_blank'); };

    document.addEventListener('DOMContentLoaded', loadOrder);
    window.goBack = goBack;
    window.trackOrder = trackOrder;
    window.cancelOrder = cancelOrder;
    window.reorder = reorder;
    window.downloadInvoice = downloadInvoice;
</script>
</body>
</html>
