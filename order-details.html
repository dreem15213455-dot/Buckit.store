<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Order Details - Zatpat</title>
    <meta name="theme-color" content="#FFD600">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #FFD600; --accent-green: #16A34A; --bg-light: #F5F5F5; --border-light: #E5E7EB; --danger: #EF4444; --radius-md: 12px; --radius-lg: 16px; --radius-full: 9999px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-light); }
        .top-bar { background: white; position: fixed; top: 0; width: 100%; padding: 12px 16px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--border-light); z-index: 1000; }
        .back-btn { width: 40px; height: 40px; background: var(--bg-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .brand-name { font-size: 22px; font-weight: 800; }
        .brand-name .normal { color: #000000; }
        .brand-name .pat { color: var(--accent-green); }
        .page-title { flex: 1; text-align: center; font-weight: 600; font-size: 16px; }
        .main-content { padding-top: 80px; padding-bottom: 100px; max-width: 600px; margin: 0 auto; }
        .section-card { background: white; margin: 16px; border-radius: var(--radius-lg); border: 1px solid var(--border-light); overflow: hidden; }
        .section-title { padding: 16px; border-bottom: 1px solid var(--border-light); font-weight: 700; background: var(--bg-light); }
        .section-body { padding: 16px; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; }
        .status { padding: 4px 12px; border-radius: var(--radius-full); font-size: 12px; font-weight: 600; display: inline-block; }
        .status-delivered { background: #D1FAE5; color: #059669; }
        .status-pending { background: #FEF3C7; color: #D97706; }
        .status-cancelled { background: #FEE2E2; color: #DC2626; }
        .item-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border-light); font-size: 13px; }
        .loading-spinner { text-align: center; padding: 60px; color: var(--primary); }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
        <div class="brand-name"><span class="normal">Zat</span><span class="pat">pat</span></div>
        <div class="page-title">Order Details</div>
    </div>
    <div class="main-content" id="mainContent"><div class="loading-spinner"><i class="fas fa-spinner fa-spin fa-2x"></i><p>Loading order...</p></div></div>
    <script>
        const supabaseUrl = 'https://zwajyovemwdqtkecipeb.supabase.co';
        const supabaseKey = 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
        async function loadOrder() {
            const params = new URLSearchParams(window.location.search);
            const orderId = params.get('id');
            if (!orderId) { showError('No order ID found'); return; }
            const { data, error } = await supabaseClient.from('orders').select('*').eq('order_id', orderId).single();
            if (error || !data) { showError('Order not found'); return; }
            renderOrder(data);
        }
        function renderOrder(order) {
            const statusClass = order.order_status === 'delivered' ? 'status-delivered' : (order.order_status === 'cancelled' ? 'status-cancelled' : 'status-pending');
            let itemsHtml = ''; (order.items || []).forEach(item => { itemsHtml += `<div class="item-row"><span>${escapeHtml(item.name)} x ${item.quantity}</span><span>₹${item.total}</span></div>`; });
            const address = order.shipping_address || {};
            document.getElementById('mainContent').innerHTML = `
                <div class="section-card"><div class="section-title">Order Information</div><div class="section-body"><div class="info-row"><span>Order ID</span><span>${order.order_id}</span></div><div class="info-row"><span>Date</span><span>${new Date(order.created_at).toLocaleString()}</span></div><div class="info-row"><span>Status</span><span class="status ${statusClass}">${order.order_status}</span></div><div class="info-row"><span>Payment Method</span><span>${order.payment_method === 'upi' ? 'UPI / Google Pay' : 'Cash on Delivery'}</span></div><div class="info-row"><span>Payment Status</span><span>${order.payment_status === 'paid' ? '✅ Paid' : '⏳ Pending'}</span></div></div></div>
                <div class="section-card"><div class="section-title">Items Ordered</div><div class="section-body">${itemsHtml}<div class="info-row" style="margin-top:12px; padding-top:12px; border-top:1px solid var(--border-light); font-weight:700;"><span>Total</span><span>₹${order.total}</span></div></div></div>
                <div class="section-card"><div class="section-title">Delivery Address</div><div class="section-body"><p><strong>${escapeHtml(address.full_name || '')}</strong></p><p>${escapeHtml(address.address || '')}</p><p>${escapeHtml(address.city || '')} - ${escapeHtml(address.pincode || '')}</p><p>Phone: ${escapeHtml(address.phone || '')}</p></div></div>
                <div class="section-card"><div class="section-title">Actions</div><div class="section-body"><button class="track-btn" onclick="window.location.href='order-tracking.html?order=${order.order_id}'" style="background:var(--primary); border:none; padding:12px; border-radius:50px; width:100%; font-weight:600;">Track Order</button><button class="support-btn" onclick="window.open('https://wa.me/918600252238?text=Order%20${order.order_id}')" style="background:#25D366; color:white; border:none; padding:12px; border-radius:50px; width:100%; margin-top:12px; font-weight:600;"><i class="fab fa-whatsapp"></i> WhatsApp Support</button></div></div>
            `;
        }
        function showError(msg) { document.getElementById('mainContent').innerHTML = `<div style="text-align:center; padding:60px;"><i class="fas fa-exclamation-triangle" style="font-size:64px; color:var(--danger);"></i><h3>${msg}</h3><button onclick="goBack()" style="margin-top:16px; background:var(--primary); border:none; padding:12px 24px; border-radius:50px;">Go Back</button></div>`; }
        function goBack() { window.location.href = 'orders.html'; }
        function escapeHtml(t) { if(!t) return ''; return t.replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }
        loadOrder(); window.goBack = goBack;
    </script>
</body>
</html>
