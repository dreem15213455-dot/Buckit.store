<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>इन्वाइट और कमाएं - Zymart</title>
    <meta name="theme-color" content="#0B5A31">
    <meta name="description" content="Zymart - दोस्तों को इन्वाइट करें और इनाम पाएं">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --brand-green: #0B5A31; --brand-green-light: #0F6E3B; --brand-green-dark: #083D21;
            --brand-orange: #F59E0B; --brand-orange-dark: #E8890A; --brand-orange-light: #FFB020;
            --brand-white: #F5F5F5;
            --neutral-white: #FFFFFF; --neutral-bg: #F9FAFB; --neutral-border: #E5E7EB;
            --neutral-gray: #6B7280; --neutral-dark: #1A1A1A;
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --radius-sm: 10px; --radius-md: 14px; --radius-lg: 18px; --radius-xl: 22px; --radius-full: 9999px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--neutral-bg); color: var(--neutral-dark);
            min-height: 100vh; -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
        
        .top-bar { background: var(--brand-green); position: fixed; top: 0; left: 0; width: 100%; z-index: 100; padding: 10px 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 16px rgba(11,90,49,0.3); }
        .back-btn { width: 40px; height: 40px; min-width: 40px; background: rgba(255,255,255,0.10); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 15px; transition: all 0.15s ease; }
        .back-btn:active { background: rgba(255,255,255,0.22); transform: scale(0.93); }
        .top-title { font-family: 'Poppins', sans-serif; flex: 1; font-size: 16px; font-weight: 700; color: var(--brand-white); }
        
        .main-content { padding-top: 62px; max-width: 600px; margin: 0 auto; padding-bottom: 30px; }
        
        .hero-card { background: #FFF8EB; margin: 12px 14px; border-radius: var(--radius-xl); padding: 24px 20px; text-align: center; border: 2px solid #FDE68A; animation: fadeInUp 0.4s ease; }
        .hero-icon { font-size: 52px; margin-bottom: 10px; animation: bounce 2s infinite; }
        .hero-title { font-family: 'Poppins', sans-serif; font-size: 21px; font-weight: 700; color: #92400E; margin-bottom: 4px; }
        .hero-subtitle { font-size: 13px; color: #A16207; margin-bottom: 16px; }
        .reward-badges { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .reward-badge { background: white; padding: 10px 16px; border-radius: var(--radius-full); font-weight: 600; font-size: 13px; box-shadow: var(--shadow-xs); border: 1.5px solid #FDE68A; display: flex; align-items: center; gap: 6px; }
        .reward-badge i { color: var(--brand-orange); }
        .reward-badge .amount { color: #92400E; font-size: 16px; font-weight: 700; }
        
        .referral-section { background: var(--neutral-white); margin: 0 14px 12px; border-radius: var(--radius-lg); padding: 18px; border: 1px solid var(--neutral-border); box-shadow: var(--shadow-xs); animation: fadeInUp 0.4s ease; text-align: center; }
        .section-title { font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .section-title i { color: var(--brand-green); }
        .referral-code-box { background: #F3F5F4; border: 2px dashed var(--brand-green); border-radius: var(--radius-md); padding: 14px; margin: 10px 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .referral-code { font-size: 18px; font-weight: 700; color: var(--brand-green); letter-spacing: 2px; font-family: 'SF Mono', 'Courier New', monospace; }
        .copy-btn { background: var(--brand-green); color: white; border: none; padding: 8px 14px; border-radius: var(--radius-full); font-size: 11px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.15s ease; display: flex; align-items: center; gap: 5px; }
        .copy-btn:active { background: var(--brand-green-dark); transform: scale(0.96); }
        .copy-btn.copied { background: #22C55E; }
        
        .share-buttons { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .share-btn { padding: 10px 16px; border-radius: var(--radius-full); font-weight: 600; font-size: 12px; cursor: pointer; border: none; font-family: 'Inter', sans-serif; transition: all 0.15s ease; display: flex; align-items: center; gap: 5px; }
        .share-btn.whatsapp { background: #25D366; color: white; }
        .share-btn.copy-link { background: #F3F5F4; color: var(--neutral-dark); border: 1.5px solid var(--neutral-border); }
        .share-btn.more { background: #F3F5F4; color: var(--neutral-dark); border: 1.5px solid var(--neutral-border); }
        .share-btn:active { transform: scale(0.96); }
        
        .how-section { background: var(--neutral-white); margin: 0 14px 12px; border-radius: var(--radius-lg); padding: 18px; border: 1px solid var(--neutral-border); box-shadow: var(--shadow-xs); animation: fadeInUp 0.4s ease; }
        .steps { display: flex; flex-direction: column; gap: 12px; }
        .step { display: flex; gap: 12px; align-items: flex-start; padding: 12px; background: #F3F5F4; border-radius: var(--radius-sm); }
        .step-number { width: 32px; height: 32px; min-width: 32px; background: var(--brand-green); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
        .step-text h4 { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
        .step-text p { font-size: 11px; color: var(--neutral-gray); }
        
        .login-prompt { text-align: center; padding: 40px 20px; animation: fadeInUp 0.4s ease; }
        .login-prompt i { font-size: 48px; color: #D1D5DB; margin-bottom: 10px; display: block; }
        .login-prompt h3 { font-family: 'Poppins', sans-serif; font-size: 17px; font-weight: 700; margin-bottom: 6px; }
        .login-prompt p { color: var(--neutral-gray); font-size: 13px; margin-bottom: 14px; }
        .login-prompt .btn-orange { background: var(--brand-orange); color: white; border: none; padding: 12px 28px; border-radius: var(--radius-full); font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; box-shadow: 0 4px 14px rgba(245,158,11,0.25); display: inline-flex; align-items: center; gap: 6px; }
        
        .terms-section { background: var(--neutral-white); margin: 0 14px 30px; border-radius: var(--radius-lg); padding: 18px; border: 1px solid var(--neutral-border); box-shadow: var(--shadow-xs); animation: fadeInUp 0.4s ease; }
        .terms-section h3 { font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
        .terms-section ul { margin-left: 16px; }
        .terms-section li { font-size: 12px; color: var(--neutral-gray); margin-bottom: 4px; line-height: 1.5; }
        
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--neutral-dark); color: white; padding: 10px 20px; border-radius: var(--radius-full); font-size: 12px; z-index: 200; opacity: 0; visibility: hidden; white-space: nowrap; box-shadow: var(--shadow-lg); transition: all 0.3s ease; }
        .toast.show { opacity: 1; visibility: visible; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="top-bar">
    <button class="back-btn" onclick="goBack()" aria-label="वापस"><i class="fas fa-arrow-left"></i></button>
    <span class="top-title">🎁 इन्वाइट और कमाएं</span>
</div>

<div class="main-content" id="mainContent"></div>

<div class="toast" id="toastMsg"></div>

<script>
(function() {
    'use strict';
    
    // ============ CRASH-PROOF ============
    window.addEventListener('error', function(e) { console.error('[Zymart]', e.message); });
    window.addEventListener('unhandledrejection', function(e) { console.error('[Zymart Promise]', e.reason); e.preventDefault(); });
    function safeGetElement(id) { return document.getElementById(id); }
    function escapeHTML(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
    
    // ============ SUPABASE WITH TIMEOUT ============
    var sb = null;
    try { sb = supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co', 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1'); }
    catch(e) { sb = null; }
    
    var currentUser = null, isLoggedIn = false, referralCode = 'ZY' + Math.random().toString(36).substring(2,6).toUpperCase();
    var rewardType = 'cash', rewardValue = 50, newUserOfferType = 'discount', newUserOfferValue = 25;
    
    // ============ FETCH WITH TIMEOUT ============
    function fetchWithTimeout(fn, timeout) {
        timeout = timeout || 3000;
        return new Promise(function(resolve) {
            var timer = setTimeout(function() {
                console.warn('[Zymart] Timeout after ' + timeout + 'ms');
                resolve(null);
            }, timeout);
            fn().then(function(r) { clearTimeout(timer); resolve(r); }).catch(function(e) { clearTimeout(timer); console.warn('[Zymart] Error:', e.message); resolve(null); });
        });
    }
    
    function showToast(m, e) { var t = safeGetElement('toastMsg'); if (!t) return; t.textContent = m; t.style.background = e ? '#EF4444' : '#1A1A1A'; t.classList.add('show'); clearTimeout(t._timer); t._timer = setTimeout(function() { t.classList.remove('show'); }, 2500); }
    function goBack() { try { if (document.referrer && document.referrer.indexOf(window.location.host) > -1) { window.history.back(); return; } } catch(e) {} window.location.href = 'index.html'; }
    window.fastNavigate = function(url) { window.location.href = url; };
    
    // ============ RENDER IMMEDIATELY ============
    function renderPage() {
        var mc = safeGetElement('mainContent');
        if (!mc) return;
        
        var rewardText = rewardType === 'cash' ? '₹' + rewardValue : rewardValue + '% छूट';
        var offerText = newUserOfferType === 'cash' ? '₹' + newUserOfferValue + ' कैशबैक' : newUserOfferValue + '% छूट';
        
        if (!isLoggedIn) {
            mc.innerHTML = 
                '<div class="login-prompt">' +
                '<i class="fas fa-gift"></i>' +
                '<h3>इन्वाइट करने के लिए लॉगिन करें</h3>' +
                '<p>दोस्तों को इन्वाइट करें और ' + rewardText + ' पाएं!</p>' +
                '<button class="btn-orange" onclick="goToLogin()"><i class="fas fa-sign-in-alt"></i> लॉगिन / रजिस्टर</button>' +
                '</div>' +
                '<div class="how-section"><div class="section-title"><i class="fas fa-question-circle"></i> ऐसे काम करता है</div>' +
                '<div class="steps">' +
                '<div class="step"><div class="step-number">1</div><div class="step-text"><h4>कोड शेयर करें</h4><p>WhatsApp, SMS से दोस्तों को कोड भेजें</p></div></div>' +
                '<div class="step"><div class="step-number">2</div><div class="step-text"><h4>दोस्त Zymart जॉइन करे</h4><p>रजिस्टर करते समय आपका कोड डाले</p></div></div>' +
                '<div class="step"><div class="step-number">3</div><div class="step-text"><h4>पहला ऑर्डर करे</h4><p>दोस्त का पहला ऑर्डर पूरा होते ही आपको ' + rewardText + ' मिलेंगे!</p></div></div>' +
                '</div></div>';
            return;
        }
        
        var html = '';
        html += '<div class="hero-card">';
        html += '<div class="hero-icon">🎁</div>';
        html += '<div class="hero-title">दोस्तों को इन्वाइट करें!</div>';
        html += '<div class="hero-subtitle">हर दोस्त के पहले ऑर्डर पर आपको ' + rewardText + ' मिलेंगे</div>';
        html += '<div class="reward-badges">';
        html += '<div class="reward-badge"><i class="fas fa-gift"></i> आपको <span class="amount">' + rewardText + '</span></div>';
        html += '<div class="reward-badge"><i class="fas fa-tag"></i> दोस्त को <span class="amount">' + offerText + '</span></div>';
        html += '</div></div>';
        
        html += '<div class="referral-section">';
        html += '<div class="section-title"><i class="fas fa-hashtag"></i> आपका रेफरल कोड</div>';
        html += '<div class="referral-code-box"><span class="referral-code">' + escapeHTML(referralCode) + '</span>';
        html += '<button class="copy-btn" id="copyBtn" onclick="copyCode()"><i class="fas fa-copy"></i> कॉपी</button></div>';
        html += '<div class="share-buttons">';
        html += '<button class="share-btn whatsapp" onclick="shareWA()"><i class="fab fa-whatsapp"></i> WhatsApp</button>';
        html += '<button class="share-btn copy-link" onclick="copyCode()"><i class="fas fa-link"></i> लिंक</button>';
        html += '<button class="share-btn more" onclick="shareMore()"><i class="fas fa-share-alt"></i> और</button>';
        html += '</div></div>';
        
        html += '<div class="how-section"><div class="section-title"><i class="fas fa-question-circle"></i> ऐसे काम करता है</div>';
        html += '<div class="steps">';
        html += '<div class="step"><div class="step-number">1</div><div class="step-text"><h4>कोड शेयर करें</h4><p>WhatsApp, SMS से दोस्तों को कोड भेजें</p></div></div>';
        html += '<div class="step"><div class="step-number">2</div><div class="step-text"><h4>दोस्त Zymart जॉइन करे</h4><p>रजिस्टर करते समय आपका कोड डाले</p></div></div>';
        html += '<div class="step"><div class="step-number">3</div><div class="step-text"><h4>पहला ऑर्डर करे</h4><p>दोस्त का पहला ऑर्डर पूरा होते ही आपको ' + rewardText + ' मिलेंगे!</p></div></div>';
        html += '</div></div>';
        
        html += '<div class="terms-section"><h3><i class="fas fa-file-contract"></i> नियम और शर्तें</h3><ul>';
        html += '<li>दोस्त के पहले ऑर्डर डिलीवर होने पर ही रिवॉर्ड मिलेगा।</li>';
        html += '<li>' + rewardText + ' रिवॉर्ड Zymart Wallet में क्रेडिट होगा।</li>';
        html += '<li>धोखाधड़ी पाए जाने पर रिवॉर्ड रद्द किया जा सकता है।</li>';
        html += '</ul></div>';
        
        mc.innerHTML = html;
    }
    
    // ============ AUTH CHECK WITH TIMEOUT ============
    async function checkAuth() {
        if (!sb) { isLoggedIn = false; return; }
        try {
            var result = await fetchWithTimeout(function() {
                return sb.auth.getSession();
            }, 2000);
            if (result && result.data && result.data.session) {
                currentUser = result.data.session.user;
                isLoggedIn = true;
                referralCode = generateCode(currentUser.email);
                // Background load settings
                loadSettings();
            } else {
                isLoggedIn = false;
            }
        } catch(e) {
            isLoggedIn = false;
        }
    }
    
    function generateCode(email) {
        var p = 'ZY';
        if (email) { var n = email.split('@')[0].replace(/[^a-zA-Z0-9]/g,'').substring(0,4).toUpperCase(); if (n) p += n; }
        return (p + Math.random().toString(36).substring(2,5).toUpperCase()).substring(0,10);
    }
    
    async function loadSettings() {
        if (!sb || !currentUser) return;
        try {
            var codeRes = await fetchWithTimeout(function() { return sb.from('referral_codes').select('code').eq('user_id', currentUser.id).maybeSingle(); }, 2000);
            if (codeRes && codeRes.data && codeRes.data.code) referralCode = codeRes.data.code;
            
            var rewardRes = await fetchWithTimeout(function() { return sb.from('app_settings').select('value').eq('key','invite_reward').maybeSingle(); }, 2000);
            if (rewardRes && rewardRes.data && rewardRes.data.value) {
                var v = rewardRes.data.value;
                if (typeof v === 'string' && v.indexOf('%') !== -1) { rewardType = 'discount'; rewardValue = parseInt(v) || 50; }
                else { rewardType = 'cash'; rewardValue = parseInt(v) || 50; }
            }
            
            var offerRes = await fetchWithTimeout(function() { return sb.from('app_settings').select('value').eq('key','invite_new_user_offer').maybeSingle(); }, 2000);
            if (offerRes && offerRes.data && offerRes.data.value) {
                var v2 = offerRes.data.value;
                if (typeof v2 === 'string' && v2.indexOf('%') !== -1) { newUserOfferType = 'discount'; newUserOfferValue = parseInt(v2) || 25; }
                else { newUserOfferType = 'cash'; newUserOfferValue = parseInt(v2) || 25; }
            }
            
            try { localStorage.setItem('zm_ref_code_' + currentUser.id, referralCode); } catch(e) {}
            renderPage();
        } catch(e) {}
    }
    
    // ============ SHARE ============
    function copyCode() {
        var t = '🎁 *Zymart* - Your Local Market!\nरेफरल कोड: *' + referralCode + '*\nजॉइन करें और ' + (newUserOfferType==='cash'?'₹'+newUserOfferValue+' कैशबैक':newUserOfferValue+'% छूट') + ' पाएं!';
        if (navigator.clipboard) { navigator.clipboard.writeText(t).then(function(){ showToast('✅ कॉपी!'); var b=safeGetElement('copyBtn'); if(b){b.classList.add('copied');b.innerHTML='<i class="fas fa-check"></i> कॉपीड';} }); }
        else { var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('✅ कॉपी!'); }
    }
    
    function shareWA() {
        var t = '🎁 *Zymart* - Your Local Market!\n\nरेफरल कोड: *' + referralCode + '*\nजॉइन करें और ' + (newUserOfferType==='cash'?'₹'+newUserOfferValue+' कैशबैक':newUserOfferValue+'% छूट') + ' पाएं!';
        window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank');
    }
    
    function shareMore() {
        var t = '🎁 Zymart - रेफरल कोड: ' + referralCode;
        if (navigator.share) { navigator.share({title:'Zymart',text:t}).catch(function(){}); } else { copyCode(); }
    }
    
    function goToLogin() {
        try { localStorage.setItem('zatpat_redirect_after_login', 'invite-earn.html'); } catch(e) {}
        window.location.href = 'index.html#login';
    }
    
    // ============ INIT - TURANT RENDER ============
    async function init() {
        renderPage(); // ← IMMEDIATE render
        await checkAuth(); // ← Background auth check
        if (isLoggedIn) renderPage(); // ← Re-render with user data
    }
    
    document.addEventListener('DOMContentLoaded', init);
    
    window.copyCode = copyCode;
    window.shareWA = shareWA;
    window.shareMore = shareMore;
    window.goToLogin = goToLogin;
    window.goBack = goBack;
})();
</script>
</body>
</html>
