    <style>

        .section { background: var(--neutral-white); margin: 10px 14px; border-radius: var(--radius-lg); padding: 16px; border: 1px solid var(--neutral-border); box-shadow: var(--shadow-xs); animation: slideUp 0.3s ease; }
        .section-title { font-family: 'Poppins',sans-serif; font-size: 14px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

        .gps-location-section { background: #EDF7F1; border: 2px solid var(--brand-green); border-radius: var(--radius-lg); padding: 16px; margin: 10px 14px; animation: slideUp 0.3s ease; }
        .gps-location-btn { width: 100%; padding: 14px; background: var(--brand-green); color: white; border: none; border-radius: var(--radius-md); font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.2s ease; font-family: 'Inter',sans-serif; animation: pulse 2s infinite; box-shadow: 0 4px 15px rgba(11,90,49,0.3); }
        .gps-location-btn:active { background: var(--brand-green-dark); transform: scale(0.97); }
        .gps-location-btn.loading { background: #9CA3AF; animation: none; box-shadow: none; pointer-events: none; }
        .gps-location-btn.success { background: var(--success); animation: none; box-shadow: none; }
        .gps-address-display { margin-top: 12px; padding: 12px; background: white; border-radius: var(--radius-md); border: 1.5px solid var(--brand-green); display: none; }
        .gps-address-display.show { display: block; animation: slideUp 0.3s ease; }
        .gps-label { font-size: 10px; font-weight: 700; color: var(--brand-green); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .gps-address-text { font-size: 13px; font-weight: 600; line-height: 1.4; word-break: break-word; }

        .gps-retry-btn.show { display: inline-block; }

        .mobile-input-group { display: flex; align-items: center; gap: 10px; background: white; border: 1.5px solid var(--neutral-border); border-radius: var(--radius-md); padding: 0 14px; }
        .mobile-input-group:focus-within { border-color: var(--brand-orange); }
        .mobile-input-group .country-code { font-weight: 700; font-size: 14px; border-right: 1px solid var(--neutral-border); padding-right: 10px; }

        .saved-address-card { background: white; border: 1.5px solid var(--neutral-border); border-radius: var(--radius-md); padding: 14px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s ease; position: relative; animation: slideUp 0.3s ease; }

        .saved-address-card.selected::after { content: '✓'; position: absolute; top: 10px; right: 14px; width: 24px; height: 24px; background: var(--brand-green); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
        .address-tag { display: inline-block; padding: 2px 10px; border-radius: var(--radius-full); font-size: 10px; font-weight: 700; margin-bottom: 6px; }
        .address-tag.home { background: #EDF7F1; color: var(--brand-green); }
        .address-tag.work { background: #FFF8EB; color: #D97706; }
        .address-tag.other { background: #F3F5F4; color: #6B7280; }
        .address-name { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
        .address-phone { font-size: 12px; color: var(--neutral-gray); margin-bottom: 4px; }
        .address-full { font-size: 12px; color: var(--neutral-gray); line-height: 1.4; }
        .address-delete-btn { position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; background: #FEF2F2; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: var(--danger); font-size: 10px; z-index: 1; }
        .saved-address-card.selected .address-delete-btn { right: 44px; }
        .add-address-btn { width: 100%; padding: 14px; border: 2px dashed var(--brand-green); border-radius: var(--radius-md); background: #EDF7F1; color: var(--brand-green); font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Inter',sans-serif; }
        
        .form-group { margin-bottom: 12px; } .form-label { font-size: 11px; font-weight: 600; color: var(--neutral-gray); margin-bottom: 4px; display: block; }
        .form-control { width: 100%; padding: 11px 14px; border: 1.5px solid var(--neutral-border); border-radius: var(--radius-md); font-size: 13px; font-family: 'Inter',sans-serif; outline: none; background: var(--neutral-bg); transition: all 0.15s ease; }
        .form-control:focus { border-color: var(--brand-orange); box-shadow: 0 0 0 3px rgba(245,158,11,0.08); background: white; }
        textarea.form-control { resize: vertical; min-height: 50px; }
        .row { display: flex; gap: 10px; } .col-half { flex: 1; }
        .tag-selector { display: flex; gap: 8px; }
        .tag-option { padding: 6px 14px; border-radius: var(--radius-full); font-size: 11px; font-weight: 600; cursor: pointer; border: 1.5px solid var(--neutral-border); background: white; color: var(--neutral-gray); font-family: 'Inter',sans-serif; }
        .tag-option.selected { border-color: var(--brand-green); background: #EDF7F1; color: var(--brand-green); }
        .save-address-btn { width: 100%; padding: 11px; background: var(--brand-green); color: white; border: none; border-radius: var(--radius-full); font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Inter',sans-serif; }
        
        .order-item { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--neutral-border); align-items: center; }
        .order-item:last-child { border-bottom: none; }
        .order-item-img { width: 44px; height: 44px; border-radius: var(--radius-sm); background: var(--neutral-bg); flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .order-item-img img { width: 100%; height: 100%; object-fit: cover; }
        .order-item-img i { font-size: 18px; color: #D1D5DB; }
        .order-item-details { flex: 1; min-width: 0; } .order-item-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .order-item-qty { font-size: 10px; color: var(--neutral-gray); } .order-item-price { font-size: 13px; font-weight: 700; text-align: right; }
        
        .total-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; color: var(--neutral-gray); }
        .total-row.grand { border-top: 2px solid var(--neutral-dark); padding-top: 10px; margin-top: 4px; font-size: 16px; font-weight: 800; }
        .free-tag { color: var(--success); font-weight: 700; }
        
        .payment-options { display: flex; flex-direction: column; gap: 8px; }
        .payment-option { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 2px solid var(--neutral-border); border-radius: var(--radius-md); cursor: pointer; transition: all 0.15s ease; font-weight: 500; }
        .payment-option.selected { border-color: var(--brand-green); background: #EDF7F1; }
        .payment-radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--neutral-border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .payment-option.selected .payment-radio { border-color: var(--brand-green); }
        .payment-radio-inner { width: 10px; height: 10px; border-radius: 50%; background: transparent; transition: background 0.15s ease; }
        .payment-option.selected .payment-radio-inner { background: var(--brand-green); }
        
        .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: white; padding: 12px 16px; box-shadow: 0 -4px 20px rgba(0,0,0,0.06); z-index: 100; border-top: 1px solid var(--neutral-border); display: flex; align-items: center; gap: 12px; }
        .total-info { flex: 1; } .total-amount { font-family: 'Poppins',sans-serif; font-size: 18px; font-weight: 700; }
        .item-count { font-size: 10px; color: var(--neutral-gray); }
        .place-order-btn { background: var(--brand-orange); color: white; border: none; padding: 14px 28px; border-radius: var(--radius-full); font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.15s ease; font-family: 'Inter',sans-serif; box-shadow: 0 4px 14px rgba(245,158,11,0.25); }
        .place-order-btn:active { background: var(--brand-orange-dark); transform: scale(0.97); }
        .place-order-btn:disabled { background: #D1D5DB; color: #9CA3AF; cursor: not-allowed; box-shadow: none; }
        
        .toast { position: fixed; bottom: 95px; left: 50%; transform: translateX(-50%); background: var(--neutral-dark); color: white; padding: 10px 20px; border-radius: var(--radius-full); font-size: 12px; z-index: 200; opacity: 0; visibility: hidden; white-space: nowrap; box-shadow: var(--shadow-lg); transition: all 0.3s ease; }
        .toast.show { opacity: 1; visibility: visible; } .toast.error { background: var(--danger); }
        
        .login-prompt { text-align: center; padding: 60px 20px; animation: slideUp 0.4s ease; }
        .login-prompt i { font-size: 52px; color: #D1D5DB; margin-bottom: 12px; display: block; }
        .login-prompt h3 { font-family: 'Poppins',sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .login-prompt p { color: var(--neutral-gray); font-size: 13px; margin-bottom: 16px; }
        .login-prompt .btn-orange { background: var(--brand-orange); color: white; border: none; padding: 12px 28px; border-radius: var(--radius-full); font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Inter',sans-serif; box-shadow: 0 4px 14px rgba(245,158,11,0.25); }
        
        .success-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(8,61,33,0.75); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .success-overlay.show { display: flex; } .success-card { background: white; border-radius: var(--radius-xl); padding: 28px 24px; text-align: center; width: 90%; max-width: 350px; animation: slideUp 0.4s ease; box-shadow: var(--shadow-lg); }
        .success-icon { font-size: 52px; color: var(--success); margin-bottom: 12px; }
        .success-card h3 { font-family: 'Poppins',sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        .success-card p { font-size: 13px; color: var(--neutral-gray); margin-bottom: 16px; }
        .success-card button { background: var(--brand-green); color: white; border: none; padding: 12px 24px; border-radius: var(--radius-full); font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; margin-bottom: 8px; font-family: 'Inter',sans-serif; }
        .success-card button.ghost { background: transparent; color: var(--brand-green); border: 1px solid var(--brand-green); }
        
        @media (max-width: 380px) { .section { margin: 8px 10px; padding: 14px; } .place-order-btn { padding: 12px 20px; font-size: 13px; } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="top-bar">
    <button class="back-btn" onclick="goBack()" aria-label="वापस"><i class="fas fa-arrow-left"></i></button>
    <span class="top-title">चेकआउट</span>
</div>

<div class="main-content" id="mainContent">
    <div style="text-align:center;padding:40px;"><div style="width:34px;height:34px;border:2.5px solid #E5E7EB;border-top-color:#F59E0B;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 8px;"></div><p style="color:#6B7280;font-size:13px;">लोड हो रहा है...</p></div>
</div>

<div class="bottom-bar" id="bottomBar" style="display:none;">
    <div class="total-info"><div class="total-amount" id="finalTotal">₹0</div><div class="item-count" id="finalCount">0 आइटम</div></div>
    <button class="place-order-btn" onclick="placeOrder()">ऑर्डर करें ✓</button>
</div>

<div class="success-overlay" id="successOverlay">
    <div class="success-card"><div class="success-icon"><i class="fas fa-check-circle"></i></div><h3>ऑर्डर सफल! 🎉</h3><p id="successMsg">आपका ऑर्डर सफलतापूर्वक प्लेस हो गया</p><button onclick="window.location.href='orders.html'">ऑर्डर देखें</button><button class="ghost" onclick="window.location.href='index.html'">खरीदारी जारी रखें</button></div>
</div>

<div class="toast" id="toastMsg"></div>

<script>
(function() {
    'use strict';
    
    // ============ CRASH PROTECTION ============
    window.addEventListener('error', function(e) { console.error('[Zymart Checkout]', e.message); });
    window.addEventListener('unhandledrejection', function(e) { console.error('[Zymart Checkout]', e.reason); e.preventDefault(); });
    
    function $(id) { return document.getElementById(id); }
    function esc(str) { if (!str) return ''; var d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
    
    // ============ SUPABASE ============
    var sb = null;
    try { sb = supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co', 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1'); }
    catch(e) { sb = { auth: { getSession: function() { return Promise.resolve({ data: { session: null } }); } } }; }
    var SUPABASE_URL = 'https://zwajyovemwdqtkecipeb.supabase.co';
    
    // ============ STATE ============
    var cart = [], currentUser = null, paymentMethod = 'cod';
    var savedAddresses = [], selectedAddressIndex = -1, addressTag = 'home', isAddingNew = false;
    var gpsLatitude = null, gpsLongitude = null, gpsAddress = null, gpsVerified = false, isFetchingLocation = false;
    var gpsTimeoutHandle = null;
    
    // ============ HELPERS ============
    function showToast(m, e) { 
        var t = $('toastMsg'); if (!t) return; 
        t.textContent = m; t.className = 'toast' + (e ? ' error' : ''); 
        t.classList.add('show'); clearTimeout(t._timer); 
        t._timer = setTimeout(function() { t.classList.remove('show'); }, 2500); 
    }
    function goBack() { 
        try { if (document.referrer && document.referrer.indexOf(window.location.host) > -1) { window.history.back(); return; } } catch(e) {} 
        window.location.href = 'cart.html'; 
    }
    
    // ============ CART ============
    function loadCart() { try { cart = JSON.parse(localStorage.getItem('zatpat_cart') || '[]'); } catch(e) { cart = []; } return cart; }
    function calculateTotals() { 
        var s = cart.reduce(function(a, i) { return a + ((i.price||0) * (i.quantity||1)); }, 0); 
        var d = s >= 299 ? 0 : 40; 
        return { subtotal: s, deliveryFee: d, total: s + d }; 
    }
    
    // ============ AUTH ============
    async function checkLoginStatus() { 
        try { 
            var res = await sb.auth.getSession(); 
            currentUser = (res && res.data && res.data.session) ? res.data.session.user : null; 
        } catch(e) { currentUser = null; } 
        return !!currentUser; 
    }
    
    // ============ GPS ============
    function loadSavedGPSData() {
        try {
            gpsLatitude = parseFloat(localStorage.getItem('user_lat') || '0') || null;
            gpsLongitude = parseFloat(localStorage.getItem('user_lng') || '0') || null;
            gpsAddress = localStorage.getItem('user_full_address') || null;
            var gt = parseInt(localStorage.getItem('location_timestamp') || '0');
            if (gpsLatitude && gpsLongitude && gt && (Date.now() - gt) < 1800000) {
                gpsVerified = true; return true;
            }
            return false;
        } catch(e) { return false; }
    }
    
    function requestGPSLocation() {
        if (isFetchingLocation) return;
        isFetchingLocation = true;
        var btn = $('gpsLocationBtn'), retry = $('gpsRetryBtn');
        if (btn) { btn.classList.add('loading'); btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> लोकेशन ले रहे...'; }
        if (retry) retry.classList.remove('show');
        
        // ✅ FALLBACK TIMEOUT — 8 seconds max
        gpsTimeoutHandle = setTimeout(function() {
            if (!gpsVerified) {
                showToast('⚠️ GPS समय समाप्त, कृपया दोबारा प्रयास करें', true);
                resetGPSButton();
            }
        }, 8000);
        
        if (window.Android && typeof window.Android.requestLocation === 'function') {
            try { window.Android.requestLocation(); } catch(e) { requestBrowserGPS(); }
        } else {
            requestBrowserGPS();
        }
    }
    
    function requestBrowserGPS() {
        if (!navigator.geolocation) { 
            showToast('GPS सपोर्ट नहीं, कृपया मैन्युअल पता भरें', true); 
            resetGPSButton(); 
            return; 
        }
        navigator.geolocation.getCurrentPosition(
            function(p) { handleGPSPosition(p.coords.latitude, p.coords.longitude); },
            function(e) { 
                showToast(e.code === 1 ? 'लोकेशन परमिशन दें' : 'लोकेशन नहीं मिली', true); 
                resetGPSButton(); 
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
        );
    }
    
    function handleGPSPosition(lat, lng) {
        if (gpsTimeoutHandle) { clearTimeout(gpsTimeoutHandle); gpsTimeoutHandle = null; }
        gpsLatitude = lat; gpsLongitude = lng;
        try { 
            localStorage.setItem('user_lat', lat.toString()); 
            localStorage.setItem('user_lng', lng.toString()); 
            localStorage.setItem('location_timestamp', Date.now().toString()); 
        } catch(e) {}
        fetchAddressFromCoords(lat, lng);
    }
    
    async function fetchAddressFromCoords(lat, lng) {
        try {
            var c = new AbortController(), t = setTimeout(function() { c.abort(); }, 5000);
            var r = await fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lng + '&zoom=18&addressdetails=1', { 
                headers: { 'Accept': 'application/json', 'User-Agent': 'ZymartApp/7.0' }, signal: c.signal 
            });
            clearTimeout(t);
            var d = await r.json();
            gpsAddress = d.display_name || 'पता उपलब्ध नहीं';
            gpsVerified = true;
            try { localStorage.setItem('user_full_address', gpsAddress); } catch(e) {}
            updateGPSDisplay();
            showToast('✅ लोकेशन मिल गई!');
            if (d.address) autoFillFromGPS(d.address);
        } catch(e) {
            gpsAddress = lat.toFixed(6) + ', ' + lng.toFixed(6);
            gpsVerified = true;
            updateGPSDisplay();
        }
    }
    
    function autoFillFromGPS(addr) {
        var cf = $('newCustCity');
        if (cf && !cf.value) { var city = addr.city || addr.town || addr.municipality || ''; if (city) cf.value = city; }
        var pf = $('newCustPincode');
        if (pf && !pf.value) { var pin = addr.postcode || ''; if (pin) pf.value = pin; }
    }
    
    function updateGPSDisplay() {
        var btn = $('gpsLocationBtn'), disp = $('gpsAddressDisplay'), at = $('gpsAddressText');
        var ct = $('gpsCoords'), retry = $('gpsRetryBtn'), hint = $('gpsHintText');
        if (btn) { btn.classList.remove('loading'); btn.classList.add('success'); btn.innerHTML = '<i class="fas fa-check-circle"></i> ✅ लोकेशन मिल गई!'; }
        if (disp) disp.classList.add('show');
        if (at && gpsAddress) at.textContent = gpsAddress;
        if (ct && gpsLatitude) ct.textContent = '📍 ' + gpsLatitude.toFixed(6) + ', ' + gpsLongitude.toFixed(6);
        if (retry) retry.classList.add('show');
        if (hint) hint.style.display = 'none';
        isFetchingLocation = false;
    }
    
    function resetGPSButton() {
        if (gpsTimeoutHandle) { clearTimeout(gpsTimeoutHandle); gpsTimeoutHandle = null; }
        var btn = $('gpsLocationBtn'), retry = $('gpsRetryBtn'), hint = $('gpsHintText');
        if (btn) { btn.classList.remove('loading', 'success'); btn.innerHTML = '<i class="fas fa-map-marker-alt"></i> 📍 अपनी लोकेशन लें'; }
        if (retry) retry.classList.add('show');
        if (hint) hint.style.display = 'flex';
        isFetchingLocation = false;
    }
    
    function retryGPSLocation() {
        gpsVerified = false; gpsLatitude = null; gpsLongitude = null; gpsAddress = null;
        var d = $('gpsAddressDisplay'); if (d) d.classList.remove('show');
        resetGPSButton(); requestGPSLocation();
    }
    
    window.setLocationFromAndroid = function(lat, lng) { handleGPSPosition(lat, lng); };
    window.onLocationError = function(msg) { resetGPSButton(); if (msg === 'GPS_DISABLED' || msg === 'LOCATION_OFF') showToast('⚠️ GPS बंद है', true); };
    
    // ============ ADDRESSES ============
    function loadSavedAddresses() { 
        try { savedAddresses = JSON.parse(localStorage.getItem('zatpat_addresses') || '[]'); } catch(e) { savedAddresses = []; } 
        if (currentUser) savedAddresses = savedAddresses.filter(function(a) { return a.userId === currentUser.id; }); 
        return savedAddresses; 
    }
    function saveAddressesToStorage() { try { localStorage.setItem('zatpat_addresses', JSON.stringify(savedAddresses)); } catch(e) {} }
    function getLastSelectedAddressId() { 
        if (!currentUser) return null; 
        try { return localStorage.getItem('zatpat_last_address_' + currentUser.id); } catch(e) { return null; } 
    }
    function setLastSelectedAddressId(id) { if (!currentUser) return; try { localStorage.setItem('zatpat_last_address_' + currentUser.id, id); } catch(e) {} }
    function selectSavedAddress(i) { selectedAddressIndex = i; isAddingNew = false; setLastSelectedAddressId(savedAddresses[i].id); renderCheckout(); }
    
    function deleteSavedAddress(i, e) { 
        e.stopPropagation(); 
        if (!confirm('यह पता हटाएं?')) return; 
        var a = savedAddresses[i]; 
        savedAddresses.splice(i, 1); 
        saveAddressesToStorage(); 
        if (selectedAddressIndex === i) selectedAddressIndex = -1; 
        else if (selectedAddressIndex > i) selectedAddressIndex--; 
        if (getLastSelectedAddressId() === a.id) try { localStorage.removeItem('zatpat_last_address_' + currentUser.id); } catch(ex) {} 
        renderCheckout(); 
        showToast('🗑️ पता हटा दिया'); 
    }
    
    function showAddAddressForm() { isAddingNew = true; selectedAddressIndex = -1; renderCheckout(); }
    function hideAddressForm() { isAddingNew = false; renderCheckout(); }
    
    function saveNewAddress() {
        var n = ($('newCustName')?.value || '').trim(), p = ($('newCustPhone')?.value || '').trim();
        var a = ($('newCustAddress')?.value || '').trim(), c = ($('newCustCity')?.value || '').trim();
        var pi = ($('newCustPincode')?.value || '').trim();
        if (!n || n.length < 2) { showToast('नाम दर्ज करें', true); return; }
        if (!p || p.length !== 10) { showToast('10 अंक फ़ोन', true); return; }
        if (!a || a.length < 5) { showToast('पता दर्ज करें', true); return; }
        if (!c) { showToast('शहर', true); return; }
        if (!pi || pi.length !== 6) { showToast('6 अंक पिनकोड', true); return; }
        var na = { id: 'addr_' + Date.now(), userId: currentUser.id, tag: addressTag, name: n, phone: p, address: a, city: c, pincode: pi };
        savedAddresses.push(na); saveAddressesToStorage(); 
        selectedAddressIndex = savedAddresses.length - 1; setLastSelectedAddressId(na.id); 
        isAddingNew = false; showToast('✅ पता सेव!'); renderCheckout(); 
    }
    
    function selectAddressTag(tag, el) { 
        addressTag = tag; 
        var opts = document.querySelectorAll('.tag-option');
        for (var i = 0; i < opts.length; i++) opts[i].classList.remove('selected');
        el.classList.add('selected'); 
    }
    
    // ============ RENDER ============
    function renderCheckout() {
        loadCart(); loadSavedAddresses(); loadSavedGPSData();
        
        // ✅ EMPTY CART
        if (cart.length === 0) {
            var mc = $('mainContent');
            if (mc) mc.innerHTML = '<div style="text-align:center;padding:60px 20px;"><i class="fas fa-shopping-cart" style="font-size:52px;color:#D1D5DB;margin-bottom:12px;display:block;"></i><h3 style="font-family:Poppins,sans-serif;">कार्ट खाली है</h3><p style="color:#6B7280;margin:8px 0 16px;">कृपया पहले कार्ट में आइटम जोड़ें</p><button onclick="window.location.href=\'products.html\'" style="background:var(--brand-green);color:white;border:none;padding:12px 24px;border-radius:var(--radius-full);font-weight:600;font-size:14px;cursor:pointer;">खरीदारी करें</button></div>';
            var bb = $('bottomBar'); if (bb) bb.style.display = 'none';
            return;
        }
        
        // ✅ Auto-select address
        if (selectedAddressIndex < 0 && savedAddresses.length > 0) {
            var lid = getLastSelectedAddressId();
            if (lid) { for (var i = 0; i < savedAddresses.length; i++) { if (savedAddresses[i].id === lid) { selectedAddressIndex = i; break; } } }
            if (selectedAddressIndex < 0) selectedAddressIndex = 0;
        }
        
        var totals = calculateTotals();
        var count = cart.reduce(function(s, i) { return s + (i.quantity || 1); }, 0);
        var ft = $('finalTotal'), fc = $('finalCount');
        if (ft) ft.textContent = '₹' + totals.total.toLocaleString('en-IN');
        if (fc) fc.textContent = count + ' आइटम';
        
        // ✅ GPS Section
        var gpsHtml = '<div class="gps-location-section"><div class="section-title"><i class="fas fa-map-marker-alt"></i> 📍 डिलीवरी लोकेशन</div>';
        if (!gpsVerified) {
            gpsHtml += '<button class="gps-location-btn" id="gpsLocationBtn" onclick="requestGPSLocation()"><i class="fas fa-map-marker-alt"></i> 📍 अपनी लोकेशन लें</button><p class="gps-hint" id="gpsHintText"><i class="fas fa-hand-pointer"></i> कृपया बटन दबाकर GPS लोकेशन कैप्चर करें</p><div class="gps-address-display" id="gpsAddressDisplay"><div class="gps-label">GPS Verified</div><div class="gps-address-text" id="gpsAddressText"></div><div class="gps-coords" id="gpsCoords"></div></div><button class="gps-retry-btn" id="gpsRetryBtn" onclick="retryGPSLocation()"><i class="fas fa-redo"></i> फिर से लें</button>';
        } else {
            gpsHtml += '<div class="gps-address-display show" id="gpsAddressDisplay"><div class="gps-label">✅ GPS Verified</div><div class="gps-address-text" id="gpsAddressText">' + (gpsAddress || '') + '</div><div class="gps-coords" id="gpsCoords">📍 ' + (gpsLatitude ? gpsLatitude.toFixed(6) : '') + ', ' + (gpsLongitude ? gpsLongitude.toFixed(6) : '') + '</div></div><button class="gps-retry-btn show" id="gpsRetryBtn" onclick="retryGPSLocation()"><i class="fas fa-redo"></i> फिर से लें</button>';
        }
        gpsHtml += '</div>';
        
        // ✅ Mobile Section
        var mobileHtml = '<div class="section"><div class="section-title"><i class="fas fa-phone"></i> 📱 मोबाइल नंबर</div><div class="mobile-input-group"><span class="country-code">+91</span><input type="tel" id="checkoutMobile" placeholder="10 अंक मोबाइल नंबर" maxlength="10" value="' + (currentUser?.phone || '') + '"></div></div>';
        
        // ✅ Order Items
        var itemsHtml = '';
        for (var j = 0; j < cart.length; j++) {
            var item = cart[j], img = item.image || '';
            itemsHtml += '<div class="order-item"><div class="order-item-img">' + (img ? '<img src="' + img + '" loading="lazy" onerror="this.style.display=\'none\';">' : '<i class="fas fa-box-open"></i>') + '</div><div class="order-item-details"><div class="order-item-name">' + esc(item.name || 'प्रोडक्ट') + '</div><div class="order-item-qty">' + (item.quantity || 1) + ' × ₹' + (item.price || 0) + '</div></div><span class="order-item-price">₹' + ((item.price || 0) * (item.quantity || 1)).toLocaleString('en-IN') + '</span></div>';
        }
        
        // ✅ Address Section
        var addrHtml = '<div class="section"><div class="section-title"><i class="fas fa-address-book"></i> डिलीवरी पता</div>';
        if (savedAddresses.length > 0 && !isAddingNew) {
            for (var k = 0; k < savedAddresses.length; k++) {
                var a = savedAddresses[k], sel = k === selectedAddressIndex;
                addrHtml += '<div class="saved-address-card' + (sel ? ' selected' : '') + '" onclick="selectSavedAddress(' + k + ')"><button class="address-delete-btn" onclick="deleteSavedAddress(' + k + ',event)"><i class="fas fa-times"></i></button><span class="address-tag ' + a.tag + '">' + (a.tag === 'home' ? '🏠 घर' : a.tag === 'work' ? '💼 ऑफिस' : '📍 अन्य') + '</span><div class="address-name">' + esc(a.name) + '</div><div class="address-phone">📞 ' + esc(a.phone) + '</div><div class="address-full">' + esc(a.address) + '</div></div>';
            }
            addrHtml += '<button class="add-address-btn" onclick="showAddAddressForm()"><i class="fas fa-plus-circle"></i> नया पता जोड़ें</button>';
        } else {
            isAddingNew = true;
        }
        addrHtml += '</div>';
        
        // ✅ New Address Form
        var formHtml = '';
        if (isAddingNew) {
            formHtml = '<div class="section address-form-section show" id="addressFormSection"><div class="section-title"><i class="fas fa-plus-circle"></i> नया पता</div><div class="form-group"><label class="form-label">टैग</label><div class="tag-selector"><button class="tag-option selected" onclick="selectAddressTag(\'home\',this)">🏠 घर</button><button class="tag-option" onclick="selectAddressTag(\'work\',this)">💼 ऑफिस</button><button class="tag-option" onclick="selectAddressTag(\'other\',this)">📍 अन्य</button></div></div><div class="form-group"><label class="form-label">नाम *</label><input type="text" id="newCustName" class="form-control" placeholder="पूरा नाम"></div><div class="form-group"><label class="form-label">फ़ोन *</label><input type="tel" id="newCustPhone" class="form-control" placeholder="10 अंक" maxlength="10"></div><div class="form-group"><label class="form-label">पता *</label><textarea id="newCustAddress" class="form-control" rows="2" placeholder="पूरा पता"></textarea></div><div class="row"><div class="col-half"><div class="form-group"><label class="form-label">शहर *</label><input type="text" id="newCustCity" class="form-control" placeholder="शहर"></div></div><div class="col-half"><div class="form-group"><label class="form-label">पिनकोड *</label><input type="text" id="newCustPincode" class="form-control" placeholder="6 अंक" maxlength="6"></div></div></div><div style="display:flex;gap:8px;"><button class="save-address-btn" style="flex:1;" onclick="saveNewAddress()">💾 सेव करें</button>' + (savedAddresses.length > 0 ? '<button class="save-address-btn" style="flex:1;background:var(--neutral-bg);color:var(--neutral-dark);border:1px solid var(--neutral-border);" onclick="hideAddressForm()">रद्द</button>' : '') + '</div></div>';
        }
        
        // ✅ Payment Section
        var paymentHtml = '<div class="section"><div class="section-title"><i class="fas fa-credit-card"></i> भुगतान</div><div class="payment-options"><div class="payment-option selected" onclick="selectPayment(\'cod\',this)"><div class="payment-radio"><div class="payment-radio-inner"></div></div><span>💵</span><div><strong>कैश ऑन डिलीवरी</strong><br><small style="color:var(--neutral-gray);">सामान मिलने पर भुगतान</small></div></div></div></div>';
        
        var html = '<div class="section" style="background:#EDF7F1;border-color:#C8E6C9;"><div class="section-title"><i class="fas fa-user-check"></i> <span>लॉगिन: <strong style="color:var(--brand-green);">' + (currentUser ? esc(currentUser.email || 'यूजर') : 'लॉगिन नहीं') + '</strong></span></div></div>' + gpsHtml + mobileHtml + addrHtml + formHtml + '<div class="section"><div class="section-title"><i class="fas fa-receipt"></i> ऑर्डर सारांश</div>' + itemsHtml + '<div class="total-row"><span>सबटोटल</span><span>₹' + totals.subtotal.toLocaleString('en-IN') + '</span></div><div class="total-row"><span>डिलीवरी</span><span class="' + (totals.deliveryFee === 0 ? 'free-tag' : '') + '">' + (totals.deliveryFee === 0 ? '🎉 मुफ़्त' : '₹' + totals.deliveryFee) + '</span></div><div class="total-row grand"><span>कुल</span><span>₹' + totals.total.toLocaleString('en-IN') + '</span></div></div>' + paymentHtml;
        
        var mc = $('mainContent'); if (mc) mc.innerHTML = html;
        var bb = $('bottomBar'); if (bb) bb.style.display = 'flex';
        if (gpsVerified) updateGPSDisplay();
    }
    
    // ============ PAYMENT ============
    function selectPayment(m, el) { 
        paymentMethod = m; 
        var opts = document.querySelectorAll('.payment-option');
        for (var i = 0; i < opts.length; i++) opts[i].classList.remove('selected');
        el.classList.add('selected'); 
    }
    
    // ============ VALIDATION ============
    function getCurrentAddress() {
        if (selectedAddressIndex >= 0 && savedAddresses[selectedAddressIndex]) {
            var a = savedAddresses[selectedAddressIndex];
            return { name: a.name, phone: a.phone, address: a.address, city: a.city, pincode: a.pincode };
        }
        // ✅ Direct DOM access for new address form
        return {
            name: ($('newCustName')?.value || '').trim(),
            phone: ($('newCustPhone')?.value || '').trim(),
            address: ($('newCustAddress')?.value || '').trim(),
            city: ($('newCustCity')?.value || '').trim(),
            pincode: ($('newCustPincode')?.value || '').trim()
        };
    }
    
    function getMobileNumber() { var m = $('checkoutMobile'); return m ? m.value.trim() : ''; }
    
    function validateForm() {
        if (!gpsVerified || !gpsLatitude) { showToast('⚠️ पहले 📍 GPS लोकेशन बटन दबाएं!', true); return false; }
        var mobile = getMobileNumber();
        if (!mobile || mobile.length !== 10 || !/^\d{10}$/.test(mobile)) { showToast('⚠️ 10 अंक मोबाइल नंबर', true); return false; }
        var addr = getCurrentAddress();
        if (!addr.name || addr.name.length < 2) { showToast('⚠️ नाम दर्ज करें', true); return false; }
        if (!addr.phone || addr.phone.length !== 10) { showToast('⚠️ 10 अंक फ़ोन', true); return false; }
        if (!addr.address || addr.address.length < 5) { showToast('⚠️ पता दर्ज करें', true); return false; }
        if (!addr.city) { showToast('⚠️ शहर', true); return false; }
        if (!addr.pincode || addr.pincode.length !== 6) { showToast('⚠️ पिनकोड', true); return false; }
        return true;
    }
    
    // ============ PLACE ORDER ============
    window.placeOrder = async function() {
        // ✅ Login check
        if (!currentUser) {
            showToast('⚠️ लॉगिन करें', true);
            try { sessionStorage.setItem('zatpat_redirect_after_login', 'checkout.html'); } catch(e) {}
            setTimeout(function() { window.location.href = 'index.html?action=login&redirect=checkout'; }, 500);
            return;
        }
        if (!validateForm()) return;
        
        var addr = getCurrentAddress(), mobile = getMobileNumber(), totals = calculateTotals();
        var btn = document.querySelector('.place-order-btn');
        if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ऑर्डर हो रहा...'; }
        
        try {
            // ✅ Save user info
            await sb.from('users').upsert({ id: currentUser.id, email: currentUser.email, name: addr.name, phone: mobile || addr.phone, role: 3 });
            
            // ✅ Build order items
            var oi = cart.map(function(item) { return { product_id: item.id, product_name: item.name, price: item.price, quantity: item.quantity || 1, image: item.image || '' }; });
            
            // ✅ Insert order
            var result = await sb.from('orders').insert([{
                user_id: currentUser.id, customer_name: addr.name, customer_phone: mobile || addr.phone,
                customer_address: addr.address, customer_city: addr.city, customer_pincode: addr.pincode,
                items: oi, subtotal: totals.subtotal, delivery_fee: totals.deliveryFee, total_amount: totals.total,
                payment_method: paymentMethod, status: 'pending',
                gps_latitude: gpsLatitude, gps_longitude: gpsLongitude, gps_address: gpsAddress, location_verified: true,
                created_at: new Date().toISOString()
            }]).select();
            
            if (!result.data || result.data.length === 0) throw new Error('ऑर्डर सेव नहीं हुआ');
            
            // ✅ Clear cart
            try { localStorage.removeItem('zatpat_cart'); } catch(e) {}
            
            // ✅ Show success
            var sm = $('successMsg');
            if (sm) sm.textContent = 'ऑर्डर #' + result.data[0].id.slice(0, 8).toUpperCase() + ' सफल!';
            var so = $('successOverlay');
            if (so) so.classList.add('show');
            if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
            
        } catch(e) {
            showToast('❌ ' + (e.message || 'ऑर्डर विफल'), true);
            if (btn) { btn.disabled = false; btn.innerHTML = 'ऑर्डर करें ✓'; }
        }
    };
    
    // ============ INIT ============
    document.addEventListener('DOMContentLoaded', async function() {
        var isLoggedIn = await checkLoginStatus();
        if (isLoggedIn) {
            loadSavedGPSData();
            renderCheckout();
        } else {
            var mc = $('mainContent');
            if (mc) mc.innerHTML = '<div class="login-prompt"><i class="fas fa-lock"></i><h3>लॉगिन आवश्यक</h3><p>चेकआउट के लिए लॉगिन करें</p><button class="btn-orange" onclick="(function(){try{sessionStorage.setItem(\'zatpat_redirect_after_login\',\'checkout.html\');}catch(e){}window.location.href=\'index.html?action=login&redirect=checkout\';})()">🔐 लॉगिन / रजिस्टर</button></div>';
            var bb = $('bottomBar'); if (bb) bb.style.display = 'none';
        }
    });
    
    // ============ AUTH LISTENER (cleanup on unload) ============
    var authListener = sb.auth.onAuthStateChange(async function(event, session) {
        if (event === 'SIGNED_IN' && session) {
            currentUser = session.user;
            loadSavedGPSData();
            renderCheckout();
        }
        if (event === 'SIGNED_OUT') {
            currentUser = null;
            var mc = $('mainContent');
            if (mc) mc.innerHTML = '<div class="login-prompt"><i class="fas fa-lock"></i><h3>लॉगिन आवश्यक</h3><p>चेकआउट के लिए लॉगिन करें</p><button class="btn-orange" onclick="(function(){try{sessionStorage.setItem(\'zatpat_redirect_after_login\',\'checkout.html\');}catch(e){}window.location.href=\'index.html?action=login&redirect=checkout\';})()">🔐 लॉगिन / रजिस्टर</button></div>';
            var bb = $('bottomBar'); if (bb) bb.style.display = 'none';
        }
    });
    
    // ✅ Cleanup listener on page unload
    window.addEventListener('beforeunload', function() {
        if (authListener && authListener.subscription && typeof authListener.subscription.unsubscribe === 'function') {
            authListener.subscription.unsubscribe();
        }
    });
    
    // ============ EXPORTS ============
    window.requestGPSLocation = requestGPSLocation; window.retryGPSLocation = retryGPSLocation;
    window.placeOrder = window.placeOrder; window.selectPayment = selectPayment; window.goBack = goBack;
    window.selectSavedAddress = selectSavedAddress; window.deleteSavedAddress = deleteSavedAddress;
    window.showAddAddressForm = showAddAddressForm; window.saveNewAddress = saveNewAddress;
    window.selectAddressTag = selectAddressTag; window.hideAddressForm = hideAddressForm;
})();
</script>
</body>
</html>
