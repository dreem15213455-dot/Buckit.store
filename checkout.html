    var SavedAddresses = {
        KEY: 'zymart_saved_addresses',

        getAll: function() { try { return JSON.parse(localStorage.getItem(this.KEY) || '[]'); } catch(e) { return []; } },
        save: function(addr) {
            if (!addr || !addr.phone || !addr.street) return null;
            var list = this.getAll();
            var exists = null;
            for (var i = 0; i < list.length; i++) {
                var a = list[i];
                if (a.phone === addr.phone && a.name === addr.name && a.street === addr.street && a.pincode === addr.pincode) { exists = a; break; }
            }
            if (exists) {
                exists.house = addr.house || exists.house;
                exists.city = addr.city || exists.city;
                exists.saved_at = new Date().toISOString();
                list = list.filter(function(x) { return x.id !== exists.id; });
                list.unshift(exists);
                try { localStorage.setItem(this.KEY, JSON.stringify(list)); } catch(e) {}
                return exists;
            }
            var newAddr = { id: 'addr_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4), name: addr.name, phone: addr.phone, house: addr.house || '', street: addr.street, city: addr.city, pincode: addr.pincode, saved_at: new Date().toISOString() };
            list.unshift(newAddr);
            if (list.length > this.MAX) list = list.slice(0, this.MAX);
            try { localStorage.setItem(this.KEY, JSON.stringify(list)); } catch(e) {}
            return newAddr;
        },
        delete: function(id) {
            var list = this.getAll().filter(function(a) { return a.id !== id; });
            try { localStorage.setItem(this.KEY, JSON.stringify(list)); } catch(e) {}
        },
        getById: function(id) {
            var list = this.getAll();
            for (var i = 0; i < list.length; i++) { if (list[i].id === id) return list[i]; }
            return null;
        }
    };
    
    var CartManager = {
        getCart: function() { try { return JSON.parse(localStorage.getItem('zymart_cart') || '[]'); } catch(e) { return []; } },
        saveCart: function(c) { try { localStorage.setItem('zymart_cart', JSON.stringify(c)); } catch(e) {} },
        getTotalItems: function() { var c = this.getCart(); return c.reduce(function(sum, item) { return sum + (item.quantity || 1); }, 0); },

            if (badge) { badge.textContent = totalItems; if (totalItems > 0) badge.classList.add('show'); else badge.classList.remove('show'); }
        }
    };

    function getVal(id) { var el = getEl(id); return el ? String(el.value || '').trim() : ''; }
    
    function getFullUrl(u, width) {
        if(!u || typeof u !== 'string') return '';
        var fullUrl;
        if(u.indexOf('http') === 0 || u.indexOf('data:') === 0) fullUrl = u;
        else fullUrl = SUPABASE_URL + '/storage/v1/object/public/' + u;
        if (fullUrl.indexOf('res.cloudinary.com') === 0) return fullUrl;
        if (!CONFIG.CLOUDINARY_ENABLED) return fullUrl;
        return 'https://res.cloudinary.com/' + CONFIG.CLOUDINARY_CLOUD_NAME + '/image/fetch/w_' + (width || 100) + ',q_auto,f_auto/' + fullUrl;
    }
    
    function showToast(m, type) {
        var t = getEl('toastMsg'), s = getEl('toastText');
        if(!t || !s) return;
        s.textContent = m;
        t.className = 'toast';
        if(type === 'error') t.classList.add('error');
        else if(type === 'success') t.classList.add('success');
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(function() { t.classList.remove('show','error','success'); }, 2500);
    }
    
    function goToLogin() {
        try { sessionStorage.setItem('zymart_redirect_after_login', 'checkout.html'); } catch(e) {}
        window.location.href = 'login.html';
    }
    
    function fmtWeight(w, u) {
        if(!w) return '';
        var nw = parseFloat(w);
        if(isNaN(nw)) return String(w);
        var unitLower = u ? u.toLowerCase() : '';
        if(unitLower === 'gram' || unitLower === 'g') return nw >= 1000 ? (nw/1000).toFixed(1).replace(/\.0$/,'') + ' kg' : nw + ' g';
        if(unitLower === 'kg') return nw + ' kg';
        if(unitLower === 'liter' || unitLower === 'l') return nw + ' L';
        if(unitLower === 'ml') return nw + ' ml';
        return nw + ' ' + (u || '');
    }
    
    function calcDist(l1, n1, l2, n2) {
        var R = 6371;
        var dLa = (l2-l1)*Math.PI/180, dLn = (n2-n1)*Math.PI/180;
        var a = Math.sin(dLa/2)*Math.sin(dLa/2) + Math.cos(l1*Math.PI/180)*Math.cos(l2*Math.PI/180)*Math.sin(dLn/2)*Math.sin(dLn/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    
    function isInServiceArea(lat, lng) {
        if(!lat || !lng) return false;
        for(var i = 0; i < CONFIG.TALUKAS.length; i++) {
            if(calcDist(lat, lng, CONFIG.TALUKAS[i].lat, CONFIG.TALUKAS[i].lng) <= CONFIG.SERVICE_RADIUS_KM) return true;
        }
        return false;
    }

    function loadShopNamesCache() {

            if (cached && cached.v && cached.t && (Date.now() - cached.t < CACHE_TTL)) {

    // ═══ EGRESS: Cart sync with shop names cache ═══
    async function syncCartWithServer() {
        if (isSyncing) return;
        isSyncing = true;
        
        var cartData = CartManager.getCart();
        if (!cartData.length) { isSyncing = false; return; }
        
        try {
            var productIds = [];
            for (var i = 0; i < cartData.length; i++) {
                if (cartData[i].id && productIds.indexOf(cartData[i].id) === -1) productIds.push(cartData[i].id);
            }
            
            var pRes = await sb.from('products')
                .select('id, name, price, offer_price, image_url, images, variants, colors, variant_type, stock, shop_id, is_active, is_on_hold, delete_requested')
                .in('id', productIds);
            var productsMap = {};
            var shopIdsSet = {};
            if (pRes.data) {
                for (var j = 0; j < pRes.data.length; j++) {
                    var prod = pRes.data[j];
                    productsMap[prod.id] = prod;
                    if (prod.shop_id) shopIdsSet[prod.shop_id] = true;
                }
            }
            
            // ═══ EGRESS: Only fetch missing shop names ═══
            loadShopNamesCache();
            var uniqueShopIds = Object.keys(shopIdsSet).filter(function(id) { return !shopNamesMap[id]; });
            if (uniqueShopIds.length > 0) {
                var sRes = await sb.from('shops').select('id, name').in('id', uniqueShopIds);
                if (sRes.data) {
                    for (var s = 0; s < sRes.data.length; s++) { shopNamesMap[sRes.data[s].id] = sRes.data[s].name; }
                    saveShopNamesCache();
                }
            }
            
            var updatedCart = [], removedItems = [], priceChanged = false;
            var oosItems = [];
            
            for (var k = 0; k < cartData.length; k++) {
                var item = cartData[k];
                var product = productsMap[item.id];
                
                if (!product || !product.is_active || product.is_on_hold || product.delete_requested) {
                    removedItems.push(item.name || 'Product');
                    continue;
                }
                
                var productType = product.variant_type || 'weight';
                var isClothing = (productType === 'color_size');
                var newPrice = parseFloat(product.price) || 0;
                var newMrp = parseFloat(product.price) || 0;
                var newImage = (product.images && product.images[0]) || product.image_url || item.image;
                var newStock = parseInt(product.stock) || 0;
                
                if (isClothing) {
                    if (item.variantColor && item.variantSize) {
                        var colors = [];
                        try { colors = typeof product.colors === 'string' ? JSON.parse(product.colors) : (product.colors || []); } catch(e) { colors = []; }
                        
                        var foundColor = null;
                        for (var c = 0; c < colors.length; c++) {
                            if (String(colors[c].name || '').toLowerCase() === String(item.variantColor).toLowerCase()) { foundColor = colors[c]; break; }
                        }
                        if (!foundColor) { removedItems.push(item.name || 'Product'); continue; }
                        
                        var foundSize = null;
                        for (var sz = 0; sz < (foundColor.sizes || []).length; sz++) {
                            if (String(foundColor.sizes[sz].size || '').toLowerCase() === String(item.variantSize).toLowerCase()) { foundSize = foundColor.sizes[sz]; break; }
                        }
                        if (!foundSize) { removedItems.push(item.name || 'Product'); continue; }
                        
                        newMrp = parseFloat(foundSize.price) || 0;
                        newPrice = parseFloat(foundSize.offer_price || foundSize.price) || 0;
                        newStock = parseInt(foundSize.stock) || 0;
                        if (foundColor.image_url) newImage = foundColor.image_url;
                        if (newStock === 0) { oosItems.push(item.name || 'Product'); continue; }
                    } else {
                        newPrice = parseFloat(product.offer_price || product.price) || item.price;
                        newMrp = parseFloat(product.price) || item.originalPrice || newPrice;
                    }
                } 
                else {
                    var variants = [];
                    try { variants = typeof product.variants === 'string' ? JSON.parse(product.variants) : (product.variants || []); } catch(e) { variants = []; }
                    var hasVariantKey = (item.variantKey || item.cartKey);
                    
                    if (hasVariantKey && variants.length > 0) {
                        var matched = false;
                        for (var v = 0; v < variants.length; v++) {
                            var variant = variants[v];
                            if (String(variant.weight || '') === String(item.variantWeight || '') && String(variant.weight_unit || variant.unit || '') === String(item.variantUnit || '')) {
                                newMrp = parseFloat(variant.price) || 0;
                                newPrice = parseFloat(variant.offer_price || variant.price) || 0;
                                newStock = parseInt(variant.stock) || 0;
                                matched = true;
                                break;
                            }
                        }
                        if (!matched) { newPrice = item.price || newPrice; newMrp = item.originalPrice || newPrice; }
                    } else {
                        newMrp = parseFloat(product.price) || 0;
                        if (product.offer_price && parseFloat(product.offer_price) < newMrp) newPrice = parseFloat(product.offer_price);
                        else newPrice = newMrp;
                    }
                }
                
                if (item.price !== newPrice) priceChanged = true;
                
                item.price = newPrice;
                item.originalPrice = newMrp > newPrice ? newMrp : (item.originalPrice || null);
                item.name = product.name || item.name;
                item.image = newImage;
                item.stock = newStock;
                item.shop_id = product.shop_id || item.shop_id;
                item.shop_name = shopNamesMap[product.shop_id] || item.shop_name || 'Shop';
                
                updatedCart.push(item);
            }
            
            CartManager.saveCart(updatedCart);
            cart = updatedCart;
            
            if (removedItems.length > 0) showToast('⚠️ ' + removedItems.length + ' product(s) removed', 'error');
            else if (oosItems.length > 0) showToast('⚠️ ' + oosItems.length + ' item(s) out of stock — removed', 'error');
            
            cartSynced = true;
        } catch(e) { console.error('[Checkout] Sync error:', e); }
        
        isSyncing = false;
    }
    
    // ═══ EGRESS: Cached delivery settings (1hr TTL) ═══
    async function loadDeliverySettings() {
        try {
            var cached = JSON.parse(localStorage.getItem(DS_CACHE_KEY) || 'null');
            if (cached && cached.v && cached.t && (Date.now() - cached.t < CACHE_TTL)) {
                deliverySettings = cached.v;
                return;
            }
        } catch(e) {}
        
        try {
            var r = await sb.from('delivery_settings').select('*').order('updated_at', { ascending: false }).limit(1).maybeSingle();
            if (r && r.data) {
                deliverySettings = r.data;
                try { localStorage.setItem(DS_CACHE_KEY, JSON.stringify({ t: Date.now(), v: r.data })); } catch(e) {}
            } else {
                deliverySettings = getDefaultSettings();
            }
        } catch(e) { 
            console.warn('[Delivery] Fetch error:', e.message); 
            deliverySettings = getDefaultSettings(); 
        }
    }
    
    function getDefaultSettings() {
        return { delivery_time_minutes: 10, opening_time: '08:00:00', closing_time: '20:00:00', is_open: true, is_holiday: false, delivery_charge: 40, free_delivery_above: 299 };
    }
    
    function calcTotals() {
        var subtotal = cart.reduce(function(a, i) { return a + ((i.price || 0) * (i.quantity || 1)); }, 0);
        var freeDeliveryAbove = deliverySettings ? parseFloat(deliverySettings.free_delivery_above) || 299 : 299;
        var deliveryCharge = deliverySettings ? parseFloat(deliverySettings.delivery_charge) || 40 : 40;
        var deliveryFee = subtotal >= freeDeliveryAbove ? 0 : deliveryCharge;
        return { subtotal: subtotal, deliveryFee: deliveryFee, total: subtotal + deliveryFee, freeDeliveryAbove: freeDeliveryAbove, deliveryCharge: deliveryCharge };
    }
    
    function getUniqueShopIds() {
        var ids = [];
        for (var i = 0; i < cart.length; i++) { if (cart[i].shop_id && ids.indexOf(cart[i].shop_id) === -1) ids.push(cart[i].shop_id); }
        return ids;
    }
    
    function groupCartByShop() {
        var groups = {};
        for (var i = 0; i < cart.length; i++) {
            var item = cart[i];
            var shopId = item.shop_id || 'unknown';
            if (!groups[shopId]) groups[shopId] = { shop_id: shopId, shop_name: item.shop_name || 'Shop', items: [] };
            groups[shopId].items.push(item);
        }
        return groups;
    }
    
    async function checkLogin() {
        try {
            var r = await sb.auth.getSession();
            if (r && r.data && r.data.session && r.data.session.user) { currentUser = r.data.session.user; return { hasSession: true, source: 'supabase' }; }
        } catch(e) {}
        try {
            var session = JSON.parse(localStorage.getItem('zymart_session') || 'null');
            if (session && session.userId) { currentUser = { id: session.userId, phone: session.phone }; return { hasSession: true, source: 'localStorage' }; }

        currentUser = null;
        return { hasSession: false };
    }
    
    function isDeliveryOpen() {
        if (!deliverySettings) return true;
        var now = new Date();
        var currentTime = now.getHours() * 60 + now.getMinutes();
        var startParts = (deliverySettings.opening_time || '08:00:00').split(':');
        var endParts = (deliverySettings.closing_time || '20:00:00').split(':');
        var startMinutes = parseInt(startParts[0]) * 60 + parseInt(startParts[1]);
        var endMinutes = parseInt(endParts[0]) * 60 + parseInt(endParts[1]);
        var isHoliday = deliverySettings.is_holiday === true;
        var holidayToday = deliverySettings.holiday_date === new Date().toISOString().split('T')[0];
        if (isHoliday && holidayToday) return false;
        if (deliverySettings.is_open === false) return false;
        if (currentTime < startMinutes || currentTime > endMinutes) return false;
        return true;
    }
    
    function getDeliveryMessage() {
        if (!deliverySettings) return '';
        var now = new Date();
        var currentTime = now.getHours() * 60 + now.getMinutes();
        var startParts = (deliverySettings.opening_time || '08:00:00').split(':');
        var endParts = (deliverySettings.closing_time || '20:00:00').split(':');
        var startMinutes = parseInt(startParts[0]) * 60 + parseInt(startParts[1]);
        var endMinutes = parseInt(endParts[0]) * 60 + parseInt(endParts[1]);
        var isHoliday = deliverySettings.is_holiday === true;
        var holidayToday = deliverySettings.holiday_date === new Date().toISOString().split('T')[0];
        function formatTime(t) { var p = t.split(':'); var h = parseInt(p[0]); var ampm = h >= 12 ? 'PM' : 'AM'; h = h % 12; if(h === 0) h = 12; return h + ':' + (p[1] || '00') + ' ' + ampm; }
        if (isHoliday && holidayToday) return '🏖️ ' + (deliverySettings.holiday_reason || 'We are closed today') + '. Orders will resume tomorrow.';
        if (deliverySettings.is_open === false) return '🔒 Shop is currently closed.';
        if (currentTime < startMinutes) return '⏰ Delivery opens at ' + formatTime(deliverySettings.opening_time);
        if (currentTime > endMinutes) return '⏰ Delivery closed. Opens tomorrow at ' + formatTime(deliverySettings.opening_time);
        return '🕐 Delivery: ' + formatTime(deliverySettings.opening_time) + ' - ' + formatTime(deliverySettings.closing_time);
    }

    function loadGPS() {
        try {
            var lat = parseFloat(localStorage.getItem('user_lat') || '0') || null;
            var lng = parseFloat(localStorage.getItem('user_lng') || '0') || null;
            var ts = parseInt(localStorage.getItem('location_timestamp') || '0');
            if (lat && lng && ts && (Date.now() - ts) < 86400000) {
                gpsLat = lat; gpsLng = lng;
                gpsPincode = localStorage.getItem('user_pincode') || null;
                gpsAddr = localStorage.getItem('user_full_address') || null;
                gpsOk = true;
                return true;
            }
        } catch(e) {}
        return false;
    }
    
    window.requestGPS = function() {
        if (gpsInProgress) return;
        gpsInProgress = true;
        var btn = getEl('gpsLocationBtn');
        if (btn) { btn.innerHTML = '<span class="gps-spinner"></span> 📍 Detecting...'; btn.disabled = true; btn.style.animation = 'none'; }
        if (window.Android && typeof window.Android.requestLocation === 'function') { window.Android.requestLocation(); return; }
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(p) {
                gpsInProgress = false;
                gpsLat = p.coords.latitude; gpsLng = p.coords.longitude;
                try { localStorage.setItem('user_lat', String(gpsLat)); localStorage.setItem('user_lng', String(gpsLng)); localStorage.setItem('location_timestamp', String(Date.now())); } catch(e) {}
                fetchAddr(gpsLat, gpsLng);
            }, function(err) {
                gpsInProgress = false;
                if (btn) { btn.textContent = '📍 Get My Location'; btn.disabled = false; btn.style.animation = 'pulse 2s infinite'; }
                if (err.code === 2) showToast('⚙️ Please enable GPS', 'error');
                else if (err.code === 1) showToast('📍 Location permission required', 'error');
                else showToast('⚠️ Could not detect location', 'error');
            }, { timeout: 30000, maximumAge: 60000, enableHighAccuracy: true });
        }
    };
    
    async function fetchAddr(lat, lng) {
        var btn = getEl('gpsLocationBtn');
        try {
            var c = new AbortController(); var t = setTimeout(function() { c.abort(); }, 8000);
            var r = await fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lng + '&zoom=18&addressdetails=1', { headers: { 'User-Agent': 'ZyMartApp/2.0' }, signal: c.signal });
            clearTimeout(t);
            var d = await r.json();
            gpsAddr = d.display_name || '';
            if (d.address) {
                var city = d.address.city || d.address.town || d.address.village || '';
                var pin = d.address.postcode || '';
                gpsPincode = pin;
                try { localStorage.setItem('user_full_address', gpsAddr); if(pin) localStorage.setItem('user_pincode', pin); if(city) localStorage.setItem('user_city', city); } catch(e) {}
                var ci = getEl('custCity'); if (ci && !ci.value) ci.value = city;
                var pi = getEl('custPincode'); if (pi && !pi.value) pi.value = pin;
            }
            gpsOk = true;
            updateGPSUI();
            if (btn) { btn.textContent = '✅ Location Verified!'; btn.classList.add('success'); btn.disabled = false; btn.style.animation = 'none'; }
        } catch(e) {
            gpsAddr = 'Lat: ' + lat.toFixed(5) + ', Lng: ' + lng.toFixed(5);
            gpsOk = true; updateGPSUI();
            if (btn) { btn.textContent = '✅ Location Captured!'; btn.classList.add('success'); btn.disabled = false; btn.style.animation = 'none'; }
        }
    }
    
    function updateGPSUI() {
        var gpsSection = document.querySelector('.gps-section');
        var verifiedBox = getEl('gpsVerifiedBox');
        if (gpsSection) gpsSection.classList.add('verified');
        if (verifiedBox) {
            verifiedBox.classList.add('show');
            verifiedBox.innerHTML = '<div class="verified-header"><i class="fas fa-check-circle"></i> GPS Location Confirmed!</div>' +
                '<div class="address-text">' + esc(gpsAddr || 'Location captured') + '</div>' +
                '<div class="coords-text">📍 ' + (gpsLat || 0).toFixed(6) + ', ' + (gpsLng || 0).toFixed(6) + '</div>';
        }
        var retryBtn = getEl('gpsRetryBtn');
        if (retryBtn) retryBtn.classList.add('show');
    }
    
    window.retryGPS = function() {
        gpsInProgress = false; gpsOk = false;
        gpsLat = null; gpsLng = null; gpsPincode = null;
        var gpsSection = document.querySelector('.gps-section'); if (gpsSection) gpsSection.classList.remove('verified');
        var vb = getEl('gpsVerifiedBox'); if (vb) { vb.classList.remove('show'); vb.innerHTML = ''; }
        var b = getEl('gpsLocationBtn'); if (b) { b.textContent = '📍 Get My Location'; b.classList.remove('success'); b.disabled = false; b.style.animation = 'pulse 2s infinite'; }
        var rb = getEl('gpsRetryBtn'); if (rb) rb.classList.remove('show');
        requestGPS();
    };
    
    window.setLocationFromAndroid = function(lat, lng) {
        gpsInProgress = false;
        gpsLat = parseFloat(lat); gpsLng = parseFloat(lng);
        try { localStorage.setItem('user_lat', String(gpsLat)); localStorage.setItem('user_lng', String(gpsLng)); localStorage.setItem('location_timestamp', String(Date.now())); } catch(e) {}

    window.onLocationError = function(msg) {
        gpsInProgress = false;
        var btn = getEl('gpsLocationBtn');
        if (btn) { btn.textContent = '📍 Get My Location'; btn.disabled = false; btn.style.animation = 'pulse 2s infinite'; }
        showToast('⚠️ ' + (msg || 'Location error'), 'error');
    };
    
    function validateGPSLocation() {
        if (!gpsOk || !gpsLat || !gpsLng) { showToast('⚠️ Please verify GPS location first!', 'error'); return false; }
        var ts = parseInt(localStorage.getItem('location_timestamp') || '0');
        if (Date.now() - ts > 86400000) { showToast('⚠️ Location expired! Please re-verify GPS.', 'error'); gpsOk = false; return false; }
        if (!isInServiceArea(gpsLat, gpsLng)) { showToast('📍 Sorry! We deliver only in Sillod (10km radius)', 'error'); return false; }
        return true;
    }

    async function validate() {
        var hasError = false;
        if (!validateGPSLocation()) return false;
        var phone = getVal('custPhone');
        if (!phone || phone.length !== 10 || !/^[6-9]\d{9}$/.test(phone)) { showToast('⚠️ Enter valid 10-digit mobile number', 'error'); highlightField('custPhone', true); hasError = true; } else highlightField('custPhone', false);
        var name = getVal('custName');
        if (!name || name.length < 2) { showToast('⚠️ Enter your full name', 'error'); highlightField('custName', true); hasError = true; } else highlightField('custName', false);
        var street = getVal('custStreet');
        if (!street || street.length < 3) { showToast('⚠️ Enter street/road name', 'error'); highlightField('custStreet', true); hasError = true; } else highlightField('custStreet', false);
        var city = getVal('custCity');
        if (!city) { showToast('⚠️ Enter city/town name', 'error'); highlightField('custCity', true); hasError = true; } else highlightField('custCity', false);
        var pin = getVal('custPincode');
        if (!pin || !/^\d{6}$/.test(pin)) { showToast('⚠️ Enter valid 6-digit pincode', 'error'); highlightField('custPincode', true); hasError = true; } else highlightField('custPincode', false);
        return !hasError;
    }
    
    window.selectSavedAddress = function(id) {
        selectedAddressId = id;
        showingNewForm = false;
        populateFormFromSaved(id);
        var wrapper = getEl('newAddrFormWrapper');
        if (wrapper) wrapper.style.display = 'none';
        var cardsContainer = getEl('savedAddrCardsContainer');
        if (cardsContainer) {
            var saved = SavedAddresses.getAll();
            var cardHtml = '';
            for (var i = 0; i < saved.length; i++) {
                var a = saved[i];
                var isSelected = (selectedAddressId === a.id);
                var isDefault = (i === 0);
                var fullAddr = [a.house, a.street].filter(Boolean).join(', ');
                cardHtml += '<div class="saved-addr-card' + (isSelected ? ' selected' : '') + '" onclick="selectSavedAddress(\'' + a.id + '\')">';
                cardHtml += '<div class="saved-addr-radio"></div>';
                cardHtml += '<div class="saved-addr-info">';
                cardHtml += '<div class="saved-addr-name"><i class="fas fa-user"></i> ' + esc(a.name) + (isDefault ? '<span class="saved-addr-default-badge">DEFAULT</span>' : '') + '</div>';
                cardHtml += '<div class="saved-addr-phone"><i class="fas fa-phone"></i> +91 ' + esc(a.phone) + '</div>';
                cardHtml += '<div class="saved-addr-text">' + esc(fullAddr) + (a.city ? ', ' + esc(a.city) : '') + (a.pincode ? ' - ' + esc(a.pincode) : '') + '</div>';
                cardHtml += '</div>';
                cardHtml += '<button class="saved-addr-delete" onclick="deleteSavedAddress(\'' + a.id + '\', event)" title="Delete"><i class="fas fa-times"></i></button>';
                cardHtml += '</div>';
            }
            cardsContainer.innerHTML = cardHtml;
        }
        var addNewBtn = getEl('addNewAddrBtn');
        if (addNewBtn) addNewBtn.style.display = '';
        var formHeader = getEl('newAddrFormHeader');
        if (formHeader) formHeader.style.display = 'none';
    };
    
    window.showNewAddressForm = function() {
        selectedAddressId = null;
        showingNewForm = true;
        var wrapper = getEl('newAddrFormWrapper');
        if (wrapper) wrapper.style.display = '';
        var formHeader = getEl('newAddrFormHeader');
        if (formHeader) formHeader.style.display = 'flex';
        var addNewBtn = getEl('addNewAddrBtn');
        if (addNewBtn) addNewBtn.style.display = 'none';
        if (getEl('custName')) getEl('custName').value = '';
        if (getEl('custPhone')) getEl('custPhone').value = localStorage.getItem('zymart_user_phone') || '';
        if (getEl('custHouse')) getEl('custHouse').value = '';
        if (getEl('custStreet')) getEl('custStreet').value = '';
        if (getEl('custCity')) getEl('custCity').value = localStorage.getItem('user_city') || '';
        if (getEl('custPincode')) getEl('custPincode').value = gpsPincode || localStorage.getItem('user_pincode') || '';
        var cards = document.querySelectorAll('.saved-addr-card');
        for (var i = 0; i < cards.length; i++) cards[i].classList.remove('selected');
        if (getEl('custName')) getEl('custName').focus();
    };
    
    window.cancelNewAddress = function() {
        showingNewForm = false;
        var saved = SavedAddresses.getAll();
        if (saved.length > 0) {
            selectedAddressId = saved[0].id;
            populateFormFromSaved(saved[0].id);
            var wrapper = getEl('newAddrFormWrapper');
            if (wrapper) wrapper.style.display = 'none';
            var addNewBtn = getEl('addNewAddrBtn');
            if (addNewBtn) addNewBtn.style.display = '';
            var formHeader = getEl('newAddrFormHeader');
            if (formHeader) formHeader.style.display = 'none';
            window.selectSavedAddress(saved[0].id);
        }
    };
    
    window.deleteSavedAddress = function(id, event) {
        if (event) event.stopPropagation();
        if (!confirm('Delete this saved address?')) return;
        SavedAddresses.delete(id);
        if (selectedAddressId === id) {
            selectedAddressId = null;
            var remaining = SavedAddresses.getAll();
            if (remaining.length > 0) {
                selectedAddressId = remaining[0].id;
                populateFormFromSaved(remaining[0].id);
            } else {
                showingNewForm = true;
            }
        }
        showToast('🗑️ Address removed');
        render();
    };
    
    function renderSavedAddressesSection() {
        var saved = SavedAddresses.getAll();
        var html = '';
        
        if (saved.length > 0 && !selectedAddressId && !showingNewForm) {
            selectedAddressId = saved[0].id;
        }
        if (saved.length === 0 && !showingNewForm) {
            showingNewForm = true;
        }
        
        html += '<div class="section"><div class="section-title"><i class="fas fa-address-book"></i> 🏠 Delivery Address</div>';
        
        if (saved.length > 0) {
            html += '<div class="saved-addresses-list" id="savedAddrCardsContainer">';
            for (var i = 0; i < saved.length; i++) {
                var a = saved[i];
                var isSelected = (selectedAddressId === a.id);
                var isDefault = (i === 0);
                var fullAddr = [a.house, a.street].filter(Boolean).join(', ');
                html += '<div class="saved-addr-card' + (isSelected ? ' selected' : '') + '" onclick="selectSavedAddress(\'' + a.id + '\')">';
                html += '<div class="saved-addr-radio"></div>';
                html += '<div class="saved-addr-info">';
                html += '<div class="saved-addr-name"><i class="fas fa-user"></i> ' + esc(a.name) + (isDefault ? '<span class="saved-addr-default-badge">DEFAULT</span>' : '') + '</div>';
                html += '<div class="saved-addr-phone"><i class="fas fa-phone"></i> +91 ' + esc(a.phone) + '</div>';
                html += '<div class="saved-addr-text">' + esc(fullAddr) + (a.city ? ', ' + esc(a.city) : '') + (a.pincode ? ' - ' + esc(a.pincode) : '') + '</div>';
                html += '</div>';
                html += '<button class="saved-addr-delete" onclick="deleteSavedAddress(\'' + a.id + '\', event)" title="Delete"><i class="fas fa-times"></i></button>';
                html += '</div>';
            }
            html += '</div>';
        }
        
        var addNewBtnStyle = (!showingNewForm && saved.length > 0) ? '' : 'display:none;';
        html += '<button class="add-new-addr-btn" id="addNewAddrBtn" style="' + addNewBtnStyle + '" onclick="showNewAddressForm()"><i class="fas fa-plus-circle"></i> Add New Address</button>';
        
        var formWrapperStyle = showingNewForm ? '' : 'display:none;';
        var formHeaderStyle = showingNewForm && saved.length > 0 ? 'display:flex;' : 'display:none;';
        
        html += '<div id="newAddrFormWrapper" style="' + formWrapperStyle + '">';
        html += '<div class="new-addr-form-header" id="newAddrFormHeader" style="' + formHeaderStyle + '"><h4><i class="fas fa-plus-circle"></i> New Address</h4><button class="cancel-new-addr-btn" onclick="cancelNewAddress()">✕ Cancel</button></div>';
        html += '<div class="form-group"><label class="form-label">Full Name *</label><input type="text" id="custName" class="form-control" placeholder="Enter your full name"></div>';
        html += '<div class="form-group"><label class="form-label">Contact Number *</label><div style="display:flex;align-items:center;gap:8px;background:white;border:1.5px solid var(--neutral-border);border-radius:var(--radius-md);padding:0 14px;"><span style="font-weight:700;">+91</span><input type="tel" id="custPhone" placeholder="10-digit mobile number" maxlength="10" inputmode="numeric" style="flex:1;border:none;outline:none;padding:12px 0;font-size:14px;font-family:Inter,sans-serif;"></div></div>';
        html += '<div class="form-group"><div class="address-field-wrapper"><i class="fas fa-home address-field-icon"></i><input type="text" id="custHouse" class="form-control" placeholder="House/Flat/Building No."></div></div>';
        html += '<div class="form-group"><div class="address-field-wrapper"><i class="fas fa-road address-field-icon"></i><input type="text" id="custStreet" class="form-control" placeholder="Street/Road/Area *"></div></div>';
        html += '<div class="row"><div class="col-half"><div class="form-group"><label class="form-label">🏙️ City/Town *</label><input type="text" id="custCity" class="form-control" placeholder="Your city"></div></div>';
        html += '<div class="col-half"><div class="form-group"><label class="form-label">📮 Pincode *</label><input type="text" id="custPincode" class="form-control" placeholder="6-digit" maxlength="6" inputmode="numeric"></div></div></div>';
        html += '</div>';
        
        html += '</div>';
        return html;
    }
    
    function render() {
        loadCart();
        loadGPS();
        CartManager.updateBadge();
        
        if (!cart.length) {
            getEl('mainContent').innerHTML = '<div style="text-align:center;padding:60px;">' +
                '<i class="fas fa-shopping-cart" style="font-size:52px;color:#D1D5DB;"></i>' +
                '<h3>Cart is Empty</h3><p style="color:#6B7280;">Add products before checkout</p>' +
                '<button onclick="window.location.href=\'products.html\'" style="background:var(--brand-green);color:white;border:none;padding:12px 24px;border-radius:var(--radius-full);font-weight:600;cursor:pointer;font-family:Inter,sans-serif;margin-top:12px;">🛍️ Browse Products</button></div>';
            getEl('bottomBar').style.display = 'none';
            return;
        }
        
        var totals = calcTotals();
        var count = cart.reduce(function(s, i) { return s + (i.quantity || 1); }, 0);
        getEl('finalTotal').textContent = '₹' + totals.total.toLocaleString('en-IN');
        getEl('finalCount').textContent = count + ' item' + (count !== 1 ? 's' : '');
        
        var deliveryOpen = isDeliveryOpen();
        var deliveryMsg = getDeliveryMessage();
        var shopIds = getUniqueShopIds();
        
        var html = '';
        if (deliveryMsg) html += '<div class="delivery-time-banner' + (deliveryOpen ? '' : ' closed') + '"><i class="fas fa-clock"></i> ' + deliveryMsg + '</div>';
        if (!deliveryOpen) { var btn = getEl('placeOrderBtn'); if (btn) { btn.disabled = true; btn.textContent = '⏰ Delivery Closed'; } }
        
        if (shopIds.length > 1) {
            html += '<div class="multi-shop-info"><i class="fas fa-info-circle"></i><div>Products from <strong>' + shopIds.length + ' shops</strong>.<br>All items will be in <strong>one order</strong>. Each shop prepares their own items.</div></div>';
        }
        
        html += '<div class="gps-section' + (gpsOk ? ' verified' : '') + '">';
        html += '<div class="section-title"><i class="fas fa-map-marker-alt"></i> 📍 GPS Location (Required)</div>';
        if (gpsOk) {
            html += '<button class="gps-btn success" id="gpsLocationBtn" disabled>✅ Location Verified!</button>';
            html += '<div class="gps-verified-box show" id="gpsVerifiedBox"><div class="verified-header"><i class="fas fa-check-circle"></i> GPS Confirmed</div><div class="address-text">' + esc(gpsAddr || 'Location captured') + '</div><div class="coords-text">📍 ' + (gpsLat || 0).toFixed(6) + ', ' + (gpsLng || 0).toFixed(6) + '</div></div>';
            html += '<button class="gps-retry-btn show" id="gpsRetryBtn" onclick="retryGPS()">🔄 Retry GPS</button>';
        } else {
            html += '<button class="gps-btn" id="gpsLocationBtn" onclick="requestGPS()"><i class="fas fa-map-marker-alt"></i> 📍 Get My Location</button>';
            html += '<p style="text-align:center;font-size:10px;color:#EF4444;margin-top:6px;font-weight:600;">⚠️ GPS required even for saved addresses</p>';
            html += '<div class="gps-verified-box" id="gpsVerifiedBox"></div>';
        }
        html += '</div>';
        
        html += renderSavedAddressesSection();
        
        html += '<div class="section"><div class="section-title"><i class="fas fa-receipt"></i> 📋 Order Summary</div>';
        var groups = groupCartByShop();
        for (var shopId in groups) {
            var g = groups[shopId];
            var shopDisplayName = g.shop_id === 'unknown' ? '⚠️ Unknown Shop' : g.shop_name;
            html += '<div style="margin:12px 0;padding:10px;background:#F9FAFB;border-radius:10px;">';
            html += '<div style="font-weight:700;font-size:12px;color:var(--brand-green);margin-bottom:8px;">🏪 ' + esc(shopDisplayName) + '</div>';
            var shopSubtotal = 0;
            for (var i = 0; i < g.items.length; i++) {
                var item = g.items[i];
                var imgUrl = getFullUrl(item.image || '', 100);
                var itemTotal = (item.price || 0) * (item.quantity || 1);
                shopSubtotal += itemTotal;
                
                var variantLabel = '';
                var variantClass = '';
                if (item.variantColor && item.variantSize) {
                    variantLabel = '🎨 ' + item.variantColor + ' · 📏 ' + item.variantSize;
                    variantClass = 'clothing';
                } else if (item.variantWeight) {
                    variantLabel = '⚖️ ' + fmtWeight(item.variantWeight, item.variantUnit);
                    variantClass = 'weight';
                }
                
                html += '<div class="order-item"><div class="order-item-img">' + (imgUrl ? '<img src="' + imgUrl + '" loading="lazy" decoding="async">' : '<i class="fas fa-box-open" style="color:#D1D5DB;"></i>') + '</div>' +
                    '<div class="order-item-info"><div class="order-item-name">' + esc(item.name) + '</div>' +
                    (variantLabel ? '<span class="order-item-variant ' + variantClass + '">' + variantLabel + '</span>' : '') +
                    '<div class="order-item-meta">' + (item.quantity || 1) + ' × ₹' + (item.price || 0) + '</div></div>' +
                    '<span class="order-item-price">₹' + itemTotal.toLocaleString('en-IN') + '</span></div>';
            }
            html += '<div style="text-align:right;font-size:12px;font-weight:700;margin-top:4px;">Subtotal: ₹' + shopSubtotal.toLocaleString('en-IN') + '</div></div>';
        }
        html += '<div class="total-row"><span>Subtotal</span><span>₹' + totals.subtotal.toLocaleString('en-IN') + '</span></div>';
        html += '<div class="total-row"><span>Delivery Fee</span><span class="' + (totals.deliveryFee === 0 ? 'free-tag' : '') + '">' + (totals.deliveryFee === 0 ? '🎉 FREE' : '₹' + totals.deliveryFee) + '</span></div>';
        html += '<div class="total-row grand"><span>Total Amount</span><span>₹' + totals.total.toLocaleString('en-IN') + '</span></div></div>';
        
        html += '<div class="section"><div class="section-title"><i class="fas fa-credit-card"></i> 💳 Payment Method</div>' +
            '<div class="payment-option"><div class="payment-radio"><div class="payment-radio-inner"></div></div>' +
            '<span>💵</span><div><strong>Cash on Delivery</strong><br><small style="color:#6B7280;">Pay when your order arrives</small></div></div></div>';
        
        getEl('mainContent').innerHTML = html;
        getEl('bottomBar').style.display = 'flex';
        
        setTimeout(function() {
            if (selectedAddressId && !showingNewForm) {
                populateFormFromSaved(selectedAddressId);
            } else if (showingNewForm && SavedAddresses.getAll().length === 0) {
                if (getEl('custPhone') && !getEl('custPhone').value) getEl('custPhone').value = localStorage.getItem('zymart_user_phone') || '';
                if (getEl('custCity') && !getEl('custCity').value) getEl('custCity').value = localStorage.getItem('user_city') || '';
                if (getEl('custPincode') && !getEl('custPincode').value) getEl('custPincode').value = gpsPincode || localStorage.getItem('user_pincode') || '';
            }
        }, 80);
    }
    
    // ═══════════════════════════════════════════════════════════
    // ═══ PLACE ORDER — redirects to order-confirmation.html ═══
    // ═══════════════════════════════════════════════════════════
    window.placeOrder = async function() {
        loadCart();
        if (!cart.length) { showToast('🛒 Cart is empty!', 'error'); return; }
        if (!isDeliveryOpen()) { showDeliveryClosedPopup(getDeliveryMessage()); return; }
        
        var loginInfo = await checkLogin();
        if (!loginInfo.hasSession) { showToast('🔐 Please login first', 'error'); goToLogin(); return; }
        
        var authSession = null;
        try { var sr = await sb.auth.getSession(); if (sr && sr.data && sr.data.session) authSession = sr.data.session; } catch(e) {}
        
        if (!authSession) {
            showToast('⚠️ Session expired. Please login again.', 'error');
            try { localStorage.removeItem('zymart_session'); localStorage.removeItem('zymart_user_role'); } catch(e) {}
            setTimeout(function() { goToLogin(); }, 1500);
            return;
        }
        
        var userId = authSession.user.id;
        if (!await validate()) return;
        
        if (!cartSynced) {
            showToast('🔄 Preparing order...', 'success');
            await syncCartWithServer();
            loadCart();
        }
        
        var btn = getEl('placeOrderBtn');
        if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...'; }
        
        try {
            var missingShopItems = [];
            for (var c = 0; c < cart.length; c++) { if (!cart[c].shop_id) missingShopItems.push(cart[c].name || 'Product'); }
            
            if (missingShopItems.length > 0) {
                showToast('⚠️ Some products have no shop linked. Please remove and re-add them.', 'error');
                if (btn) { btn.disabled = false; btn.innerHTML = 'Place Order ✓'; }
                return;
            }
            
            var phone = getVal('custPhone');
            var name = getVal('custName');
            var house = getVal('custHouse');
            var street = getVal('custStreet');
            var city = getVal('custCity');
            var pin = getVal('custPincode');
            var fullAddress = [house, street].filter(Boolean).join(', ');
            
            var totals = calcTotals();
            var allItems = [];
            var shopIdsArray = [];
            
            for (var i = 0; i < cart.length; i++) {
                var item = cart[i];
                if (item.shop_id && shopIdsArray.indexOf(item.shop_id) === -1) shopIdsArray.push(item.shop_id);
                allItems.push({
                    product_id: item.id,
                    shop_id: item.shop_id,
                    shop_name: item.shop_name || 'Shop',
                    product_name: item.name,
                    name: item.name,
                    price: item.price || 0,
                    original_price: item.originalPrice || null,
                    quantity: item.quantity || 1,
                    image: getFullUrl(item.image || '', 200),
                    variant_key: item.variantKey || item.cartKey || null,
                    variant_weight: item.variantWeight || null,
                    variant_unit: item.variantUnit || null,
                    variant_color: item.variantColor || null,
                    variant_size: item.variantSize || null
                });
            }
            
            var now = new Date().toISOString();
            var orderData = {
                user_id: userId,
                shop_id: shopIdsArray.length === 1 ? shopIdsArray[0] : null,
                shop_ids: shopIdsArray.length > 0 ? shopIdsArray : null,
                customer_name: name,
                customer_phone: phone,
                customer_address: fullAddress,
                customer_city: city,
                customer_pincode: pin,
                items: allItems,
                subtotal: totals.subtotal,
                delivery_fee: totals.deliveryFee,
                total_amount: totals.total,
                payment_method: 'cod',
                status: 'confirmed',
                confirmed_at: now,
                created_at: now,
                gps_latitude: gpsLat,
                gps_longitude: gpsLng,
                gps_address: gpsAddr,
                gps_pincode: gpsPincode,
                location_verified: true,
                location_timestamp: localStorage.getItem('location_timestamp') || null
            };
            
            console.log('[Checkout] Placing order:', { shop_ids: shopIdsArray, item_count: allItems.length });
            
            var result = await sb.from('orders').insert([orderData]).select();
            
            if (result.error) {
                console.error('[Checkout] Insert error:', result.error);
                showToast('❌ Order failed: ' + result.error.message, 'error');
                if (btn) { btn.disabled = false; btn.innerHTML = 'Place Order ✓'; }
                return;
            }
            
            var newOrder = (result.data && result.data[0]) ? result.data[0] : null;
            
            // Auto-save address
            try {
                SavedAddresses.save({ name: name, phone: phone, house: house, street: street, city: city, pincode: pin });
            } catch(e) { console.warn('[Checkout] Save address failed:', e); }
            
            // Increment order count (for Play Store prompt in confirmation page)
            try {
                var count = parseInt(localStorage.getItem('zymart_order_count') || '0') + 1;
                localStorage.setItem('zymart_order_count', count);
            } catch(e) {}
            
            // Clear cart
            try { localStorage.removeItem('zymart_cart'); CartManager.updateBadge(); cart = []; } catch(e) {}
            
            // ═══ EGRESS: Save order snapshot for confirmation page (0 DB calls there) ═══
            try {
                localStorage.setItem(LAST_ORDER_KEY, JSON.stringify({
                    id: newOrder ? newOrder.id : null,
                    created_at: now,
                    items: allItems,
                    subtotal: totals.subtotal,
                    delivery_fee: totals.deliveryFee,
                    total_amount: totals.total,
                    payment_method: 'cod',
                    customer_name: name,
                    customer_phone: phone,
                    customer_address: fullAddress,
                    customer_city: city,
                    customer_pincode: pin,
                    location_verified: true,
                    gps_address: gpsAddr,
                    status: 'confirmed',
                    confirmed_at: now
                }));
            } catch(e) { console.warn('[Checkout] localStorage snapshot failed:', e); }
            
            // ═══ REDIRECT to confirmation page ═══
            showToast('✅ Order confirmed!', 'success');
            
            if (newOrder && newOrder.id) {
                setTimeout(function() {
                    window.location.href = 'order-confirmation.html?id=' + newOrder.id;
                }, 400);
            } else {
                // Fallback: order inserted but no ID (RLS edge case)
                var shortId = '#ORDER-' + Date.now().toString().slice(-6);
                getEl('orderIdDisplay').textContent = shortId;
                getEl('successMsg').innerHTML = 'Your order has been confirmed!<br>Shops will contact you on +91 ' + phone;
                getEl('successOverlay').classList.add('show');
                setTimeout(function() {
                    window.location.href = 'orders.html';
                }, 3000);
            }
            
        } catch(e) {
            console.error('[Checkout] Error:', e);
            showToast('❌ ' + (e.message || 'Order failed'), 'error');
            if (btn) { btn.disabled = false; btn.innerHTML = 'Place Order ✓'; }
        }
    };
    
    // ═══ OFFLINE BANNER ═══
    window.addEventListener('offline', function() { var b = getEl('netBanner'); if (b) b.style.display = 'block'; });
    window.addEventListener('online', function() { var b = getEl('netBanner'); if (b) b.style.display = 'none'; });
    
    document.addEventListener('DOMContentLoaded', async function() {
        if (!navigator.onLine) { var nb = getEl('netBanner'); if (nb) nb.style.display = 'block'; }
        
        await loadDeliverySettings();
        var loginInfo = await checkLogin();
        if (loginInfo.hasSession) {
            render();
            await syncCartWithServer();
            render();
        } else {
            getEl('mainContent').innerHTML = '<div class="login-prompt"><i class="fas fa-lock"></i><h3>Login Required</h3><p>Please login to place your order</p><a class="btn-orange" href="login.html"><i class="fas fa-sign-in-alt"></i> Login / Register</a></div>';
            getEl('bottomBar').style.display = 'none';
        }
    });
    
    window.requestGPS = requestGPS;
    window.retryGPS = retryGPS;
    window.goToLogin = goToLogin;
    window.placeOrder = placeOrder;
    window.setLocationFromAndroid = setLocationFromAndroid;
    window.onLocationError = onLocationError;
    window.CartManager = CartManager;
    window.selectSavedAddress = selectSavedAddress;
    window.showNewAddressForm = showNewAddressForm;
    window.cancelNewAddress = cancelNewAddress;
    window.deleteSavedAddress = deleteSavedAddress;
    window.SavedAddresses = SavedAddresses;
    
})();
</script>
</body>
</html>
