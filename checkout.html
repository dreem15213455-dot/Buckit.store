<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Checkout - ZyMart+</title>
    <meta name="theme-color" content="#0B5A31">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root{--brand-green:#0B5A31;--brand-orange:#F59E0B;--brand-orange-dark:#E8890A;--neutral-white:#FFFFFF;--neutral-bg:#F9FAFB;--neutral-border:#E5E7EB;--neutral-gray:#6B7280;--neutral-dark:#1A1A1A;--danger:#EF4444;--success:#10B981;--shadow-sm:0 1px 4px rgba(0,0,0,0.06);--shadow-md:0 4px 16px rgba(0,0,0,0.08);--radius-sm:10px;--radius-md:14px;--radius-lg:18px;--radius-full:9999px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',-apple-system,sans-serif;background:var(--neutral-bg);color:var(--neutral-dark);padding-bottom:100px;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;min-height:100vh}
        @keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(11,90,49,0.4)}50%{box-shadow:0 0 0 10px rgba(11,90,49,0)}}
        .top-bar{background:var(--brand-green);position:fixed;top:0;left:0;width:100%;z-index:100;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 16px rgba(11,90,49,0.3)}
        .back-btn{width:40px;height:40px;min-width:40px;background:rgba(255,255,255,0.10);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:white;font-size:15px;text-decoration:none}
        .back-btn:active{background:rgba(255,255,255,0.22);transform:scale(0.93)}
        .top-title{font-family:'Poppins',sans-serif;flex:1;font-size:16px;font-weight:700;color:white}.brand-zy{color:#A3E635}.brand-mart{color:#FDE047}
        .main-content{padding-top:62px;max-width:600px;margin:0 auto}
        .section{background:var(--neutral-white);margin:10px 14px;border-radius:var(--radius-lg);padding:16px;border:1px solid var(--neutral-border);box-shadow:var(--shadow-sm);animation:slideUp 0.3s ease}
        .section-title{font-family:'Poppins',sans-serif;font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
        .section-title i{color:var(--brand-green)}
        .gps-section{background:#EDF7F1;border:2px solid var(--brand-green);border-radius:var(--radius-lg);padding:16px;margin:10px 14px;transition:all 0.3s ease}
        .gps-section.verified{background:#D1FAE5;border:2px solid #10B981}
        .gps-btn{width:100%;padding:14px;background:var(--brand-green);color:white;border:none;border-radius:var(--radius-md);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;font-family:'Inter',sans-serif;animation:pulse 2s infinite}
        .gps-btn:active{background:#083D21;transform:scale(0.97)}.gps-btn:disabled{background:#9CA3AF;animation:none;cursor:not-allowed}
        .gps-btn.success{background:var(--success);animation:none}
        .gps-verified-box{display:none;padding:12px;background:white;border-radius:var(--radius-md);border:1.5px solid #10B981;margin-top:12px}
        .gps-verified-box.show{display:block}
        .gps-verified-box .verified-header{display:flex;align-items:center;gap:8px;color:#059669;font-weight:700;font-size:14px;margin-bottom:6px}
        .gps-verified-box .verified-header i{font-size:20px}
        .gps-verified-box .address-text{font-size:12px;color:#374151;line-height:1.5}
        .gps-verified-box .coords-text{font-size:10px;color:var(--neutral-gray);margin-top:4px;font-family:monospace}
        .gps-retry-btn{margin-top:8px;padding:8px 16px;background:white;color:var(--brand-green);border:1.5px solid var(--brand-green);border-radius:var(--radius-full);font-size:11px;font-weight:600;cursor:pointer;display:none}
        .gps-retry-btn.show{display:inline-block}
        .gps-spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite}
        .form-group{margin-bottom:12px}
        .form-label{font-size:12px;font-weight:600;color:var(--neutral-gray);margin-bottom:4px;display:block}
        .form-control{width:100%;padding:11px 14px;border:1.5px solid var(--neutral-border);border-radius:var(--radius-md);font-size:13px;font-family:'Inter',sans-serif;outline:none;background:white;transition:border-color 0.2s ease}
        .form-control:focus{border-color:var(--brand-orange)}
        .form-control.error{border-color:var(--danger);background:#FEF2F2}
        .row{display:flex;gap:10px}.col-half{flex:1}
        .address-field-icon{position:absolute;left:12px;top:13px;color:var(--brand-green);font-size:13px;z-index:1}
        .address-field-wrapper{position:relative}
        .address-field-wrapper .form-control{padding-left:34px}
        .order-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--neutral-border);align-items:center}
        .order-item:last-child{border-bottom:none}
        .order-item-img{width:48px;height:48px;border-radius:var(--radius-sm);background:var(--neutral-bg);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
        .order-item-img img{width:100%;height:100%;object-fit:contain;padding:4px}
        .order-item-info{flex:1;min-width:0}
        .order-item-name{font-size:12px;font-weight:600;line-height:1.3}
        .order-item-variant{font-size:10px;color:var(--brand-green);font-weight:600;background:#EDF7F1;display:inline-block;padding:1px 6px;border-radius:9999px;margin-top:2px}
        .order-item-meta{font-size:10px;color:var(--neutral-gray);margin-top:2px}
        .order-item-price{font-size:13px;font-weight:700;text-align:right;white-space:nowrap}
        .total-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;color:var(--neutral-gray)}
        .total-row.grand{border-top:2px solid var(--neutral-dark);padding-top:12px;margin-top:4px;font-size:16px;font-weight:800;color:var(--neutral-dark)}
        .free-tag{color:var(--success);font-weight:700}
        .savings-row{font-size:10px;color:#10B981;text-align:right;font-weight:600}
        .payment-option{display:flex;align-items:center;gap:12px;padding:14px;border:2px solid var(--brand-green);border-radius:var(--radius-md);background:#EDF7F1;font-weight:500}
        .payment-radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--brand-green);display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .payment-radio-inner{width:10px;height:10px;border-radius:50%;background:var(--brand-green)}
        .bottom-bar{position:fixed;bottom:0;left:0;width:100%;background:white;padding:12px 16px;box-shadow:0 -4px 20px rgba(0,0,0,0.06);z-index:100;border-top:1px solid var(--neutral-border);display:flex;align-items:center;gap:12px}
        .total-info{flex:1}.total-amount{font-family:'Poppins',sans-serif;font-size:18px;font-weight:700}
        .item-count{font-size:10px;color:var(--neutral-gray)}
        .place-order-btn{background:var(--brand-orange);color:#1a1a1a;border:none;padding:14px 28px;border-radius:var(--radius-full);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:'Inter',sans-serif;box-shadow:0 4px 14px rgba(245,158,11,0.25);transition:all 0.15s ease}
        .place-order-btn:active{background:var(--brand-orange-dark);transform:scale(0.97)}
        .place-order-btn:disabled{background:#D1D5DB;color:#9CA3AF;cursor:not-allowed;box-shadow:none}
        .toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:var(--neutral-dark);color:white;padding:10px 20px;border-radius:var(--radius-full);font-size:12px;z-index:200;opacity:0;visibility:hidden;white-space:nowrap;box-shadow:var(--shadow-md);transition:all 0.3s ease}
        .toast.show{opacity:1;visibility:visible}.toast.error{background:var(--danger)}.toast.success{background:var(--success)}
        .login-prompt{text-align:center;padding:60px 20px}
        .login-prompt i{font-size:52px;color:#D1D5DB;margin-bottom:12px;display:block}
        .login-prompt h3{font-family:'Poppins',sans-serif;font-size:18px;font-weight:700;margin-bottom:8px}
        .login-prompt p{color:var(--neutral-gray);font-size:13px;margin-bottom:16px}
        .btn-orange{background:var(--brand-orange);color:#1a1a1a;border:none;padding:12px 28px;border-radius:var(--radius-full);font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;display:inline-block;text-decoration:none}
        .success-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(8,61,33,0.75);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:1000}
        .success-overlay.show{display:flex}
        .success-card{background:white;border-radius:22px;padding:28px 24px;text-align:center;width:90%;max-width:350px;animation:slideUp 0.4s ease}
        .success-icon{font-size:52px;color:var(--success);margin-bottom:12px}
        .success-card h3{font-family:'Poppins',sans-serif;font-size:20px;font-weight:700;margin-bottom:8px}
        .success-card p{font-size:13px;color:var(--neutral-gray);margin-bottom:16px}
        .success-card .order-id-display{font-size:14px;font-weight:700;color:var(--brand-green);background:#EDF7F1;padding:6px 12px;border-radius:var(--radius-full);display:inline-block;margin-bottom:14px}
        .success-card button{background:var(--brand-green);color:white;border:none;padding:12px 24px;border-radius:var(--radius-full);font-size:14px;font-weight:600;cursor:pointer;width:100%;margin-bottom:8px;font-family:'Inter',sans-serif}
        .success-card button:active{background:#083D21;transform:scale(0.97)}
        .success-card button.ghost{background:transparent;color:var(--brand-green);border:1px solid var(--brand-green)}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="top-bar">
    <a href="cart.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <span class="top-title"><span class="brand-zy">Zy</span><span class="brand-mart">Mart</span> Checkout</span>
</div>

<div class="main-content" id="mainContent">
    <div style="text-align:center;padding:40px;"><div style="width:34px;height:34px;border:2.5px solid #E5E7EB;border-top-color:#F59E0B;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 8px;"></div><p style="color:#6B7280;font-size:13px;">Loading checkout...</p></div>
</div>

<div class="bottom-bar" id="bottomBar" style="display:none;">
    <div class="total-info"><div class="total-amount" id="finalTotal">₹0</div><div class="item-count" id="finalCount">0 items</div></div>
    <button class="place-order-btn" id="placeOrderBtn" onclick="window.placeOrder()">Place Order ✓</button>
</div>

<div class="success-overlay" id="successOverlay">
    <div class="success-card">
        <div class="success-icon"><i class="fas fa-check-circle"></i></div>
        <h3>Order Placed! 🎉</h3>
        <div class="order-id-display" id="orderIdDisplay">#------</div>
        <p id="successMsg">Your order has been placed successfully!<br>The shop will contact you soon.</p>
        <button onclick="window.location.href='orders.html'">📋 View Orders</button>
        <button class="ghost" onclick="window.location.href='index.html'">🛍️ Continue Shopping</button>
    </div>
</div>

<div class="toast" id="toastMsg"><span id="toastText"></span></div>

<script>
(function(){'use strict';
window.addEventListener('error',function(e){console.error('[Checkout]',e.message);try{showToast('Something went wrong','error');}catch(_){}});
window.addEventListener('unhandledrejection',function(e){console.error('[Checkout]',e.reason);e.preventDefault();});
function getEl(id){return document.getElementById(id);}
function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function safeJSON(s,f){try{return s?JSON.parse(s):f;}catch(e){return f;}}
var sb=supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co','sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1');
var SUPABASE_URL='https://zwajyovemwdqtkecipeb.supabase.co';
function getFullUrl(u){if(!u||typeof u!=='string')return'';if(u.indexOf('http')===0||u.indexOf('data:')===0)return u;return SUPABASE_URL+'/storage/v1/object/public/'+u;}
var cart=[],currentUser=null,gpsLat=null,gpsLng=null,gpsAddr=null,gpsPincode=null,gpsOk=false;
var gpsInProgress=false,settingsOpened=false;
var FREE_DELIVERY_MIN=299,DELIVERY_FEE=40;
function showToast(m,type){var t=getEl('toastMsg'),s=getEl('toastText');if(!t||!s)return;s.textContent=m;t.className='toast';if(type==='error')t.classList.add('error');else if(type==='success')t.classList.add('success');t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(function(){t.classList.remove('show','error','success');},2500);}
function goToLogin(){try{sessionStorage.setItem('zymart_redirect_after_login','checkout.html');}catch(e){}window.location.href='login.html';}
function fmtWeight(w,u){if(!w)return'';if(u==='gram'||u==='g')return w>=1000?(w/1000).toFixed(1).replace(/\.0$/,'')+' kg':w+' g';if(u==='kg')return w+' kg';if(u==='liter'||u==='l')return w+' L';if(u==='ml')return w+' ml';return w+' '+(u||'');}
function loadCart(){cart=safeJSON(localStorage.getItem('zymart_cart'),[]);return cart;}
function calcTotals(){var s=cart.reduce(function(a,i){return a+((i.price||0)*(i.quantity||1));},0);var d=s>=FREE_DELIVERY_MIN?0:DELIVERY_FEE;return{subtotal:s,deliveryFee:d,total:s+d,savings:d===0?DELIVERY_FEE:0};}
function getUniqueShopIds(){var ids=[];for(var i=0;i<cart.length;i++){if(cart[i].shop_id&&ids.indexOf(cart[i].shop_id)===-1)ids.push(cart[i].shop_id);}return ids;}
async function checkLogin(){try{var r=await sb.auth.getSession();if(r&&r.data&&r.data.session){currentUser=r.data.session.user;return true;}}catch(e){}try{var session=JSON.parse(localStorage.getItem('zymart_session')||'null');if(session&&session.userId){currentUser={id:session.userId,phone:session.phone};return true;}}catch(e){}currentUser=null;return false;}
function loadGPS(){try{var lat=parseFloat(localStorage.getItem('user_lat')||'0')||null;var lng=parseFloat(localStorage.getItem('user_lng')||'0')||null;var ts=parseInt(localStorage.getItem('location_timestamp')||'0');var pin=localStorage.getItem('user_pincode')||null;var addr=localStorage.getItem('user_full_address')||null;if(lat&&lng&&ts&&(Date.now()-ts)<86400000){gpsLat=lat;gpsLng=lng;gpsPincode=pin;gpsAddr=addr;gpsOk=true;return true;}}catch(e){}return false;}
function requestGPS(){if(gpsInProgress)return;gpsInProgress=true;var btn=getEl('gpsLocationBtn');if(btn){btn.innerHTML='<span class="gps-spinner"></span> 📍 Detecting...';btn.disabled=true;btn.style.animation='none';}if(window.Android&&typeof window.Android.requestLocation==='function'){window.Android.requestLocation();return;}if(navigator.geolocation){navigator.geolocation.getCurrentPosition(function(p){gpsInProgress=false;gpsLat=p.coords.latitude;gpsLng=p.coords.longitude;try{localStorage.setItem('user_lat',String(gpsLat));localStorage.setItem('user_lng',String(gpsLng));localStorage.setItem('location_timestamp',String(Date.now()));}catch(e){}fetchAddr(gpsLat,gpsLng);},function(err){gpsInProgress=false;if(btn){btn.textContent='📍 Get My Location';btn.disabled=false;btn.style.animation='pulse 2s infinite';}if(err.code===2){settingsOpened=true;if(window.Android&&typeof window.Android.openLocationSettings==='function'){window.Android.openLocationSettings();}else{showToast('⚙️ Please enable GPS','error');}}else if(err.code===1){showToast('📍 Location permission required','error');}else{showToast('⚠️ Could not detect location','error');}},{timeout:15000,maximumAge:0,enableHighAccuracy:true});}}
async function fetchAddr(lat,lng){var btn=getEl('gpsLocationBtn');try{var c=new AbortController();var t=setTimeout(function(){c.abort();},8000);var r=await fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lng+'&zoom=18&addressdetails=1',{headers:{'User-Agent':'ZyMartApp/2.0'},signal:c.signal});clearTimeout(t);var d=await r.json();gpsAddr=d.display_name||'';if(d.address){var city=d.address.city||d.address.town||d.address.village||'';var pin=d.address.postcode||'';gpsPincode=pin;try{localStorage.setItem('user_full_address',gpsAddr);if(pin)localStorage.setItem('user_pincode',pin);if(city)localStorage.setItem('user_city',city);}catch(e){}var ci=getEl('custCity');if(ci&&!ci.value)ci.value=city;var pi=getEl('custPincode');if(pi&&!pi.value)pi.value=pin;}gpsOk=true;updateGPSUI();if(btn){btn.textContent='✅ Location Verified!';btn.classList.add('success');btn.disabled=false;btn.style.animation='none';}}catch(e){gpsAddr='Lat: '+lat.toFixed(5)+', Lng: '+lng.toFixed(5);gpsOk=true;updateGPSUI();if(btn){btn.textContent='✅ Location Captured!';btn.classList.add('success');btn.disabled=false;btn.style.animation='none';}}}
function updateGPSUI(){var gpsSection=document.querySelector('.gps-section');var verifiedBox=getEl('gpsVerifiedBox');if(gpsSection)gpsSection.classList.add('verified');if(verifiedBox){verifiedBox.classList.add('show');verifiedBox.innerHTML='<div class="verified-header"><i class="fas fa-check-circle"></i> GPS Location Confirmed!</div><div class="address-text">'+(gpsAddr||'Location captured')+'</div><div class="coords-text">📍 '+(gpsLat||0).toFixed(6)+', '+(gpsLng||0).toFixed(6)+'</div>';}var retryBtn=getEl('gpsRetryBtn');if(retryBtn)retryBtn.classList.add('show');}
window.retryGPS=function(){gpsOk=false;gpsLat=null;gpsLng=null;gpsPincode=null;var gpsSection=document.querySelector('.gps-section');if(gpsSection)gpsSection.classList.remove('verified');var vb=getEl('gpsVerifiedBox');if(vb){vb.classList.remove('show');vb.innerHTML='';}var b=getEl('gpsLocationBtn');if(b){b.textContent='📍 Get My Location';b.classList.remove('success');b.style.animation='pulse 2s infinite';}var rb=getEl('gpsRetryBtn');if(rb)rb.classList.remove('show');requestGPS();};
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&settingsOpened){settingsOpened=false;setTimeout(function(){if(!gpsOk&&!gpsInProgress)requestGPS();},1000);}});
window.setLocationFromAndroid=function(lat,lng){gpsInProgress=false;gpsLat=parseFloat(lat);gpsLng=parseFloat(lng);try{localStorage.setItem('user_lat',String(gpsLat));localStorage.setItem('user_lng',String(gpsLng));localStorage.setItem('location_timestamp',String(Date.now()));}catch(e){}fetchAddr(gpsLat,gpsLng);};
window.onLocationError=function(msg){gpsInProgress=false;var btn=getEl('gpsLocationBtn');if(btn){btn.textContent='📍 Get My Location';btn.disabled=false;btn.style.animation='pulse 2s infinite';}showToast('⚠️ '+(msg||'Location error'),'error');};
function validateGPSLocation(){if(!gpsOk||!gpsLat||!gpsLng){showToast('⚠️ Please verify GPS location first!','error');return false;}var ts=parseInt(localStorage.getItem('location_timestamp')||'0');if(Date.now()-ts>86400000){showToast('⚠️ Location expired! Please re-verify GPS.','error');gpsOk=false;return false;}return true;}
function highlightField(id,hasError){var el=getEl(id);if(el){if(hasError)el.classList.add('error');else el.classList.remove('error');}}
async function validate(){var hasError=false;if(!validateGPSLocation())return false;
var phone=(getEl('custPhone')?.value||'').trim();if(!phone||phone.length!==10||!/^[6-9]\d{9}$/.test(phone)){showToast('⚠️ Enter valid 10-digit mobile number','error');highlightField('custPhone',true);hasError=true;}else{highlightField('custPhone',false);}
var name=(getEl('custName')?.value||'').trim();if(!name||name.length<2){showToast('⚠️ Enter your full name','error');highlightField('custName',true);hasError=true;}else{highlightField('custName',false);}
var street=(getEl('custStreet')?.value||'').trim();if(!street||street.length<3){showToast('⚠️ Enter street/road name','error');highlightField('custStreet',true);hasError=true;}else{highlightField('custStreet',false);}
var city=(getEl('custCity')?.value||'').trim();if(!city){showToast('⚠️ Enter city/town name','error');highlightField('custCity',true);hasError=true;}else{highlightField('custCity',false);}
var pin=(getEl('custPincode')?.value||'').trim();if(!pin||!/^\d{6}$/.test(pin)){showToast('⚠️ Enter valid 6-digit pincode','error');highlightField('custPincode',true);hasError=true;}else{highlightField('custPincode',false);}
if(hasError)return false;return true;}

function render(){loadCart();loadGPS();
if(!cart.length){getEl('mainContent').innerHTML='<div style="text-align:center;padding:60px;"><i class="fas fa-shopping-cart" style="font-size:52px;color:#D1D5DB;"></i><h3>Cart is Empty</h3><p style="color:#6B7280;">Add products before checkout</p><button onclick="window.location.href=\'products.html\'" style="background:var(--brand-green);color:white;border:none;padding:12px 24px;border-radius:var(--radius-full);font-weight:600;cursor:pointer;font-family:Inter,sans-serif;margin-top:12px;">🛍️ Browse Products</button></div>';getEl('bottomBar').style.display='none';return;}
var totals=calcTotals();var count=cart.reduce(function(s,i){return s+(i.quantity||1);},0);
getEl('finalTotal').textContent='₹'+totals.total.toLocaleString('en-IN');getEl('finalCount').textContent=count+' item'+(count!==1?'s':'');

var gpsHtml='<div class="gps-section'+(gpsOk?' verified':'')+'"><div class="section-title"><i class="fas fa-map-marker-alt"></i> 📍 GPS Location</div>';

else{gpsHtml+='<button class="gps-btn" id="gpsLocationBtn" onclick="requestGPS()"><i class="fas fa-map-marker-alt"></i> 📍 Get My Location</button><p style="text-align:center;font-size:10px;color:#EF4444;margin-top:6px;font-weight:600;">⚠️ GPS required for delivery</p><div class="gps-verified-box" id="gpsVerifiedBox"></div><button class="gps-retry-btn" id="gpsRetryBtn" onclick="retryGPS()" style="display:none;">🔄 Retry GPS</button>';}
gpsHtml+='</div>';

// 🔥 BUILD FULL ADDRESS FROM SEPARATE FIELDS
function buildFullAddress(){
var house=(getEl('custHouse')?.value||'').trim();
var street=(getEl('custStreet')?.value||'').trim();
var landmark=(getEl('custLandmark')?.value||'').trim();
var opposite=(getEl('custOpposite')?.value||'').trim();
var parts=[];
if(house)parts.push(house);
if(street)parts.push(street);
if(landmark)parts.push('Near '+landmark);
if(opposite)parts.push('Opp '+opposite);
return parts.join(', ');
}

window.placeOrder=async function(){
loadCart();if(!cart.length){showToast('🛒 Cart is empty!','error');return;}if(!currentUser){showToast('🔐 Please login first','error');goToLogin();return;}
var userId=currentUser.id;if(!userId||userId.indexOf('user_')===0||userId.length<10){showToast('⚠️ Session expired. Please login again.','error');try{localStorage.removeItem('zymart_session');}catch(e){}setTimeout(function(){goToLogin();},500);return;}
var shopIds=getUniqueShopIds();if(shopIds.length>1){showToast('⚠️ Please order from ONE shop only!','error');return;}
if(!await validate())return;
var phone=(getEl('custPhone')?.value||'').trim();var name=(getEl('custName')?.value||'').trim();
var fullAddress=buildFullAddress();
var city=(getEl('custCity')?.value||'').trim();var pin=(getEl('custPincode')?.value||'').trim();
var totals=calcTotals();var btn=getEl('placeOrderBtn');
if(btn){btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Placing Order...';}
var primaryShopId=shopIds[0]||null;
var orderItems=cart.map(function(item){return{product_id:item.id,product_name:item.name,price:item.price||0,quantity:item.quantity||1,image:getFullUrl(item.image||''),variant_key:item.variantKey||null,variant_weight:item.variantWeight||null,variant_unit:item.variantUnit||null};});
var orderData={user_id:userId,customer_name:name,customer_phone:phone,customer_address:fullAddress,customer_city:city,customer_pincode:pin,items:orderItems,shop_id:primaryShopId,subtotal:totals.subtotal,delivery_fee:totals.deliveryFee,total_amount:totals.total,payment_method:'cod',status:'pending',gps_latitude:gpsLat,gps_longitude:gpsLng,gps_address:gpsAddr,gps_pincode:gpsPincode,location_verified:true,location_timestamp:localStorage.getItem('location_timestamp')||null,created_at:new Date().toISOString()};
try{var result=await sb.from('orders').insert([orderData]).select();if(result.error)throw new Error(result.error.message);try{localStorage.removeItem('zymart_cart');}catch(e){}var shortId=(result.data[0].id||'').slice(0,8).toUpperCase();getEl('orderIdDisplay').textContent='#'+shortId;getEl('successMsg').innerHTML='Order <strong>#'+shortId+'</strong> placed!<br>The shop will contact you soon on +91 '+phone;getEl('successOverlay').classList.add('show');showToast('✅ Order #'+shortId+' placed!','success');}catch(e){showToast('❌ '+(e.message||'Order failed'),'error');if(btn){btn.disabled=false;btn.innerHTML='Place Order ✓';}}};

document.addEventListener('DOMContentLoaded',async function(){var loggedIn=await checkLogin();if(loggedIn){render();}else{getEl('mainContent').innerHTML='<div class="login-prompt"><i class="fas fa-lock"></i><h3>Login Required</h3><p>Please login to place your order</p><a class="btn-orange" href="login.html"><i class="fas fa-sign-in-alt"></i> Login / Register</a></div>';getEl('bottomBar').style.display='none';}});
window.requestGPS=requestGPS;window.retryGPS=retryGPS;window.goToLogin=goToLogin;
})();
</script>
