<script>

// ==================== CACHE SYSTEM ====================
var Cache = { 
    set: function(k,d,t){try{localStorage.setItem('zc_'+k,JSON.stringify({d:d,e:Date.now()+(t||3600000)}));}catch(e){}}, 
    get: function(k){try{var c=localStorage.getItem('zc_'+k);if(!c)return null;var p=JSON.parse(c);return Date.now()>p.e?(localStorage.removeItem('zc_'+k),null):p.d;}catch(e){return null;}} 
};

// ==================== SAFE FETCH ====================
async function safeFetch(fetchFn, maxRetries) {
    maxRetries = maxRetries || 3;
    for (var i = 0; i < maxRetries; i++) {
        try {
            var result = await fetchFn();
            if (result.error) throw new Error(result.error.message);
            return result;
        } catch (err) {
            if (i === maxRetries - 1) throw err;
            await new Promise(function(r) { setTimeout(r, Math.pow(2, i) * 1000); });
        }
    }
}

// ==================== OFFLINE/ONLINE ====================
window.addEventListener('online', function() { showToast('✅ इंटरनेट बहाल!'); });
window.addEventListener('offline', function() { showToast('⚠️ इंटरनेट कनेक्शन नहीं है', true); });

function showToast(msg, isError) {
    isError = isError || false;
    var t = document.getElementById('toastMsg');
    if(!t) return;
    t.textContent = msg;
    t.style.background = isError ? '#EF4444' : '#111827';
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

function goBack() { 
    if (document.referrer && document.referrer.indexOf(window.location.host) > -1) {
        window.history.back(); 
    } else { 
        window.location.href = 'cart.html'; 
    }
}

function loadCart() {
    try { cart = JSON.parse(localStorage.getItem('zatpat_cart') || '[]'); } 
    catch(e) { cart = []; showToast('कार्ट डेटा लोड करने में विफल', true); }
    return cart;
}

function calculateTotals() {
    var s = cart.reduce(function(a,i){ return a + ((i.price||0)*(i.quantity||1)); }, 0);
    var d = s >= 299 ? 0 : 40;
    return { subtotal: s, deliveryFee: d, total: s + d };
}

// ==================== LOGIN CHECK ====================
async function checkLoginStatus() {
    try {
        var res = await sb.auth.getSession();
        if (res.data && res.data.session) {
            currentUser = res.data.session.user;
            isLoggedIn = true;
            return true;
        }
    } catch(e) {}
    return false;
}

async function prefillUserData() {
    if (!currentUser) return;
    try {
        var result = await safeFetch(function() {
            return sb.from('users').select('name,phone').eq('id', currentUser.id).single();
        });
        if (result.data) {
            var n = document.getElementById('custName');
            var p = document.getElementById('custPhone');
            if (n && !n.value) n.value = result.data.name || '';
            if (p && !p.value) p.value = result.data.phone || '';
        }
    } catch(e) {}
}

// ==================== SELECT PAYMENT ====================
window.selectPayment = function(method, el) {
    paymentMethod = method;
    var opts = document.querySelectorAll('.payment-option');
    for (var i = 0; i < opts.length; i++) opts[i].classList.remove('selected');
    el.classList.add('selected');
};

// ==================== VALIDATE FORM ====================
function validateForm() {
    var name = (document.getElementById('custName')?.value || '').trim();
    var phone = (document.getElementById('custPhone')?.value || '').trim();
    var address = (document.getElementById('custAddress')?.value || '').trim();
    var city = (document.getElementById('custCity')?.value || '').trim();
    var pincode = (document.getElementById('custPincode')?.value || '').trim();
    
    var isValid = true;
    
    // Clear previous errors
    document.querySelectorAll('.form-control.error').forEach(function(el) { el.classList.remove('error'); });
    
    if (!name) {
        document.getElementById('custName')?.classList.add('error');
        showToast('⚠️ कृपया अपना नाम दर्ज करें', true);
        isValid = false;
    }
    if (!phone || phone.length !== 10 || !/^\d{10}$/.test(phone)) {
        document.getElementById('custPhone')?.classList.add('error');
        showToast('⚠️ कृपया सही 10 अंकों का फ़ोन नंबर दर्ज करें', true);
        isValid = false;
    }
    if (!address || address.length < 5) {
        document.getElementById('custAddress')?.classList.add('error');
        showToast('⚠️ कृपया अपना पूरा पता दर्ज करें', true);
        isValid = false;
    }
    if (!city) {
        document.getElementById('custCity')?.classList.add('error');
        showToast('⚠️ कृपया शहर का नाम दर्ज करें', true);
        isValid = false;
    }
    if (!pincode || pincode.length !== 6 || !/^\d{6}$/.test(pincode)) {
        document.getElementById('custPincode')?.classList.add('error');
        showToast('⚠️ कृपया सही 6 अंकों का पिनकोड दर्ज करें', true);
        isValid = false;
    }
    
    return isValid;
}

// ==================== PLACE ORDER ====================
window.placeOrder = async function() {
    if (!isLoggedIn) {
        showToast('⚠️ कृपया पहले लॉगिन करें', true);
        localStorage.setItem('zatpat_redirect_after_login', 'checkout.html');
        setTimeout(function() { window.location.href = 'index.html'; }, 800);
        return;
    }
    
    if (!validateForm()) return;
    
    var name = document.getElementById('custName').value.trim();
    var phone = document.getElementById('custPhone').value.trim();
    var address = document.getElementById('custAddress').value.trim();
    var city = document.getElementById('custCity').value.trim();
    var pincode = document.getElementById('custPincode').value.trim();
    
    var totals = calculateTotals();
    var btn = document.querySelector('.place-order-btn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ऑर्डर हो रहा है...';
    
    try {
        // Ensure user exists in users table
        await safeFetch(function() {
            return sb.from('users').upsert({
                id: currentUser.id,
                email: currentUser.email,
                name: name,
                phone: phone,
                role: 3
            });
        });
        
        // Prepare order items for JSONB
        var orderItems = cart.map(function(item) {
            return {
                product_id: item.id,
                product_name: item.name,
                price: item.price,
                quantity: item.quantity || 1,
                image: item.image || ''
            };
        });
        
        var orderData = {
            user_id: currentUser.id,
            customer_name: name,
            customer_phone: phone,
            customer_address: address,
            customer_city: city,
            customer_pincode: pincode,
            items: orderItems,
            subtotal: totals.subtotal,
            delivery_fee: totals.deliveryFee,
            total_amount: totals.total,
            payment_method: paymentMethod,
            status: 'pending',
            created_at: new Date().toISOString()
        };
        
        var result = await safeFetch(function() {
            return sb.from('orders').insert([orderData]).select();
        });
        
        if (!result.data || result.data.length === 0) {
            throw new Error('ऑर्डर सेव नहीं हुआ');
        }
        
        // Clear cart
        localStorage.removeItem('zatpat_cart');
        
        var orderId = result.data[0].id || '';
        document.getElementById('successMsg').textContent = 'ऑर्डर #' + orderId.slice(0,8).toUpperCase() + ' सफलतापूर्वक प्लेस हो गया!';
        document.getElementById('successOverlay').classList.add('show');
        
        if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
        
    } catch(e) {
        showToast('❌ ऑर्डर विफल: ' + (e.message || 'कृपया दोबारा प्रयास करें'), true);
        btn.disabled = false;
        btn.innerHTML = 'ऑर्डर करें <i class="fas fa-check"></i>';
    }
};

document.addEventListener('DOMContentLoaded', async function() {
    var loggedIn = await checkLoginStatus();
    if (loggedIn) {
        renderCheckout();
    } else {
        document.getElementById('mainContent').innerHTML = 
            '<div class="login-prompt-section">' +
            '<i class="fas fa-lock"></i>' +
            '<h3>लॉगिन आवश्यक है</h3>' +

            '</div>';
        document.getElementById('bottomBar').style.display = 'none';
    }
});

// Auth state listener
sb.auth.onAuthStateChange(async function(event, session) {
    if (event === 'SIGNED_IN' && session) {
        currentUser = session.user;
        isLoggedIn = true;
        renderCheckout();
    }
    if (event === 'SIGNED_OUT') {
        currentUser = null;
        isLoggedIn = false;
        document.getElementById('mainContent').innerHTML = 
            '<div class="login-prompt-section">' +
            '<i class="fas fa-lock"></i>' +
            '<h3>लॉगिन आवश्यक है</h3>' +
            '<p>चेकआउट करने के लिए कृपया लॉगिन करें</p>' +
            '<button onclick="localStorage.setItem(\'zatpat_redirect_after_login\',\'checkout.html\');window.location.href=\'index.html\'">लॉगिन / रजिस्टर करें</button>' +
            '</div>';
        document.getElementById('bottomBar').style.display = 'none';
    }
});
