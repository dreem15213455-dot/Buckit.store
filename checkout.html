<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Checkout - Zatpat</title>
    <meta name="theme-color" content="#16A34A">
    
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #16A34A;
            --primary-light: #22C55E;
            --primary-bg-light: #F0FDF4;
            --accent-orange: #F97316;
            --bg-white: #FFFFFF;
            --bg-light: #F9FAFB;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --border-light: #E5E7EB;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-full: 9999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
            overflow-x: hidden;
            padding-bottom: 20px;
            -webkit-font-smoothing: antialiased;
        }

        #pageProgress {
            position: fixed; top: 0; left: 0; width: 0%; height: 3px;
            background: var(--primary); z-index: 10001; transition: width 0.3s ease;
        }
        #pageProgress.loading { width: 90%; }
        #pageProgress.complete { width: 100%; opacity: 0; transition: opacity 0.3s; }

        .top-bar {
            background: var(--bg-white); position: sticky; top: 0; left: 0; width: 100%;
            z-index: 1000; padding: 12px 16px; box-shadow: var(--shadow-sm);
            border-bottom: 1px solid var(--border-light); display: flex; align-items: center; gap: 12px;
        }
        .back-btn {
            width: 40px; height: 40px; background: var(--bg-light); border-radius: var(--radius-full);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .back-btn i { font-size: 18px; color: var(--text-primary); }
        .top-title { font-size: 18px; font-weight: 800; color: #000000; }

        .main-content { padding: 16px; }

        .section-title {
            font-size: 15px; font-weight: 800; color: #000000; margin-bottom: 12px;
            display: flex; align-items: center; gap: 6px;
        }
        .section-title i { color: var(--primary); }
        
        .address-card {
            background: var(--bg-white); border-radius: var(--radius-md); padding: 14px;
            border: 1px solid var(--border-light); margin-bottom: 20px;
        }
        .address-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .address-type {
            background: var(--primary-bg-light); color: var(--primary);
            padding: 2px 10px; border-radius: var(--radius-full); font-size: 11px; font-weight: 600;
        }
        .address-text { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 12px; }
        .change-link { color: var(--primary); font-size: 12px; font-weight: 600; cursor: pointer; }

        .order-summary {
            background: var(--bg-white); border-radius: var(--radius-md); padding: 14px;
            border: 1px solid var(--border-light); margin-bottom: 20px;
        }
        .order-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 0; border-bottom: 1px solid var(--border-light);
        }
        .order-item:last-child { border-bottom: none; }
        .item-info { display: flex; align-items: center; gap: 8px; }
        .item-qty { color: var(--text-secondary); font-size: 12px; }
        .item-price { font-weight: 700; color: #000000; }

        .summary-row {
            display: flex; justify-content: space-between; padding: 8px 0;
            font-size: 13px; color: var(--text-secondary);
        }
        .summary-row.total {
            font-size: 16px; font-weight: 800; color: #000000;
            border-top: 1px solid var(--border-light); margin-top: 8px; padding-top: 12px;
        }
        .total-amount { color: #000000; }

        .payment-section { margin-bottom: 20px; }
        .payment-option {
            background: var(--bg-white); border-radius: var(--radius-md); padding: 14px;
            border: 1px solid var(--border-light); display: flex; align-items: center; gap: 12px;
            margin-bottom: 10px; cursor: pointer;
        }
        .payment-option.selected { border-color: var(--primary); background: var(--primary-bg-light); }
        .payment-radio {
            width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border-light);
            display: flex; align-items: center; justify-content: center;
        }
        .payment-option.selected .payment-radio {
            border-color: var(--primary); background: var(--primary);
        }
        .payment-option.selected .payment-radio::after {
            content: ''; width: 8px; height: 8px; background: white; border-radius: 50%;
        }
        .payment-icon { font-size: 20px; color: var(--primary); }
        .payment-name { flex: 1; font-weight: 500; color: #000000; }

        .place-order-btn {
            width: 100%; background: var(--primary); color: white; border: none;
            padding: 16px; border-radius: var(--radius-full); font-size: 16px; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .place-order-btn:active { background: var(--primary-light); }
        .place-order-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .toast-notification {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--text-primary); color: white; padding: 12px 24px;
            border-radius: var(--radius-full); font-size: 13px; z-index: 10050;
            display: none; white-space: nowrap;
        }
        .toast-notification.show { display: flex; }

        .success-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 9999;
        }
        .success-modal.active { display: flex; }
        .success-content {
            background: white; border-radius: var(--radius-lg); padding: 32px 24px;
            max-width: 320px; width: 90%; text-align: center;
        }
        .success-icon {
            width: 80px; height: 80px; background: var(--primary-bg-light);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
        }
        .success-icon i { font-size: 40px; color: var(--primary); }
        .success-content h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; color: #000000; }
        .success-content p { color: var(--text-secondary); margin-bottom: 20px; font-size: 14px; }
        .success-content .order-id {
            background: var(--bg-light); padding: 8px 16px; border-radius: var(--radius-full);
            font-size: 14px; font-weight: 600; margin-bottom: 20px;
        }
        .success-btn {
            background: var(--primary); color: white; border: none;
            padding: 14px 24px; border-radius: var(--radius-full); font-size: 15px; font-weight: 600;
            width: 100%; cursor: pointer;
        }
        .success-btn.outline {
            background: transparent; color: var(--primary);
            border: 1px solid var(--primary); margin-top: 10px;
        }

        .empty-cart {
            text-align: center; padding: 60px 20px;
        }
        .empty-cart i { font-size: 64px; color: var(--border-light); margin-bottom: 20px; }
        .empty-cart h3 { font-size: 20px; font-weight: 800; color: #000000; margin-bottom: 8px; }
    </style>
</head>
<body>

<div id="pageProgress"></div>
<div id="toastMsg" class="toast-notification"><span id="toastText"></span></div>

<div id="successModal" class="success-modal">
    <div class="success-content">
        <div class="success-icon"><i class="fas fa-check-circle"></i></div>
        <h2>Order Confirmed!</h2>
        <p>Your order has been placed successfully</p>
        <div class="order-id" id="orderIdDisplay">Order #---</div>
        <button class="success-btn" onclick="fastNavigate('orders.html')"><i class="fas fa-receipt"></i> View Orders</button>
        <button class="success-btn outline" onclick="fastNavigate('index.html')"><i class="fas fa-home"></i> Continue Shopping</button>
    </div>
</div>

<div id="mainApp">
    <div class="top-bar">
        <div class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
        <div class="top-title">Checkout</div>
    </div>

    <div class="main-content" id="checkoutContent">
        <div class="empty-cart"><i class="fas fa-shopping-cart"></i><h3>Loading...</h3></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // ========== ERROR HANDLING (CRASH-PROOF) ==========
    window.addEventListener('error', function(e) {
        console.error('Global error:', e.error);
        showToast('Something went wrong. Please refresh.', true);
        return false;
    });

    const supabaseUrl = 'https://zwajyovemwdqtkecipeb.supabase.co';
    const supabaseKey = 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1';
    const zatpatDB = supabase.createClient(supabaseUrl, supabaseKey);

    let cartItems = [];
    let selectedPayment = 'cod';
    let currentUser = null;
    let itemTotal = 0;

    function startProgress() { const b = document.getElementById('pageProgress'); if(b) { b.style.width = '0%'; b.classList.add('loading'); setTimeout(() => b.style.width = '90%', 10); } }
    function completeProgress() { const b = document.getElementById('pageProgress'); if(b) { b.classList.remove('loading'); b.classList.add('complete'); setTimeout(() => { b.style.width = '0%'; b.classList.remove('complete'); }, 300); } }
    window.fastNavigate = function(url) { startProgress(); setTimeout(() => window.location.href = url, 50); };
    function goBack() { window.history.back(); }

    function showToast(msg, isError = false) {
        const t = document.getElementById('toastMsg');
        const s = document.getElementById('toastText');
        if(!t || !s) return;
        s.innerHTML = msg;
        t.style.background = isError ? '#EF4444' : '#111827';
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    async function checkUser() {
        try {
            const { data: { session } } = await zatpatDB.auth.getSession();
            currentUser = session?.user || null;
        } catch(e) { currentUser = null; }
        return currentUser;
    }

    async function loadCheckout() {
        await checkUser();
        try {
            cartItems = JSON.parse(localStorage.getItem('zatpat_cart')) || [];
        } catch(e) { cartItems = []; }
        
        if (cartItems.length === 0) {
            document.getElementById('checkoutContent').innerHTML = `
                <div class="empty-cart">
                    <i class="fas fa-shopping-cart"></i>
                    <h3>Your cart is empty</h3>
                    <p style="color: var(--text-secondary); margin: 12px 0;">Add items to place an order</p>
                    <button onclick="fastNavigate('index.html')" style="background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: var(--radius-full); font-weight: 600; cursor: pointer;">Shop Now</button>
                </div>
            `;
            return;
        }

        itemTotal = cartItems.reduce((sum, i) => sum + (i.price || 0) * (i.quantity || 1), 0);
        const deliveryFee = 20;
        const grandTotal = itemTotal + deliveryFee;

        let itemsHtml = '';
        cartItems.forEach(item => {
            itemsHtml += `
                <div class="order-item">
                    <div class="item-info"><span>${item.name || 'Product'}</span><span class="item-qty">x${item.quantity || 1}</span></div>
                    <span class="item-price">₹${(item.price || 0) * (item.quantity || 1)}</span>
                </div>
            `;
        });

        const userPhone = currentUser?.user_metadata?.phone || '';
        const userName = currentUser?.user_metadata?.name || 'Customer';

        document.getElementById('checkoutContent').innerHTML = `
            <div class="section-title"><i class="fas fa-user"></i> Customer Details</div>
            <div class="address-card">
                <div class="address-header"><span class="address-type"><i class="fas fa-user-circle"></i> ${userName}</span></div>
                <div class="address-text"><i class="fas fa-phone"></i> ${userPhone || 'Not provided'}<br><i class="fas fa-envelope"></i> ${currentUser?.email || 'Not provided'}</div>
            </div>

            <div class="section-title"><i class="fas fa-map-pin"></i> Delivery Address</div>
            <div class="address-card">
                <div class="address-header"><span class="address-type"><i class="fas fa-home"></i> Home</span></div>
                <div class="address-text">Sillod, Maharashtra - 431112</div>
                <span class="change-link" onclick="showToast('📍 Delivery to Sillod')"><i class="fas fa-pen"></i> Change</span>
            </div>

            <div class="section-title"><i class="fas fa-receipt"></i> Order Summary</div>
            <div class="order-summary">
                ${itemsHtml}
                <div class="summary-row"><span>Item Total</span> <span>₹${itemTotal}</span></div>
                <div class="summary-row"><span>Delivery Fee</span> <span>₹${deliveryFee}</span></div>
                <div class="summary-row total"><span>Total Amount</span> <span class="total-amount">₹${grandTotal}</span></div>
            </div>

            <div class="section-title"><i class="fas fa-credit-card"></i> Payment Method</div>
            <div class="payment-section">
                <div class="payment-option ${selectedPayment === 'cod' ? 'selected' : ''}" onclick="selectPayment('cod')">
                    <div class="payment-radio"></div><i class="fas fa-money-bill-wave payment-icon"></i><span class="payment-name">Cash on Delivery</span>
                </div>
                <div class="payment-option ${selectedPayment === 'upi' ? 'selected' : ''}" onclick="selectPayment('upi')">
                    <div class="payment-radio"></div><i class="fas fa-qrcode payment-icon"></i><span class="payment-name">UPI / QR</span>
                </div>
            </div>

            <button class="place-order-btn" id="placeOrderBtn" onclick="placeOrder()"><i class="fas fa-check-circle"></i> Place Order • ₹${grandTotal}</button>
            <p style="font-size: 11px; color: var(--text-secondary); text-align: center; margin-top: 12px;">By placing order, you agree to our Terms & Conditions</p>
        `;
    }

    window.selectPayment = function(method) {
        selectedPayment = method;
        loadCheckout();
    };

    window.placeOrder = async function() {
        await checkUser();
        
        if (!currentUser) {
            showToast('⚠️ Please login to place order', true);
            localStorage.setItem('redirect_after_login', 'checkout.html');
            setTimeout(() => fastNavigate('index.html'), 1500);
            return;
        }

        if (cartItems.length === 0) { showToast('Cart is empty', true); return; }

        const btn = document.getElementById('placeOrderBtn');
        if(!btn) return;
        
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
        showToast('📦 Placing your order...');

        try {
            const grandTotal = itemTotal + 20;

            let shopId = null;
            if (cartItems.length > 0) {
                try {
                    const { data: product } = await zatpatDB.from('products').select('shop_id').eq('id', cartItems[0].id).single();
                    shopId = product?.shop_id || null;
                } catch(e) {}
            }

            const orderData = {
                user_id: currentUser.id,
                total_amount: grandTotal,
                delivery_fee: 20,
                payment_method: selectedPayment,
                status: 'pending',
                delivery_address: 'Sillod, Maharashtra - 431112',
                shop_id: shopId,
                customer_name: currentUser.user_metadata?.name || 'Customer',
                customer_phone: currentUser.user_metadata?.phone || '',
                created_at: new Date().toISOString()
            };

            const { data: order, error } = await zatpatDB.from('orders').insert([orderData]).select().single();
            if (error) throw error;

            const orderItems = cartItems.map(item => ({
                order_id: order.id,
                product_id: item.id,
                product_name: item.name,
                quantity: item.quantity || 1,
                price: item.price || 0,
                total_price: (item.price || 0) * (item.quantity || 1)
            }));

            await zatpatDB.from('order_items').insert(orderItems);
            localStorage.removeItem('zatpat_cart');
            
            const orderIdEl = document.getElementById('orderIdDisplay');
            if(orderIdEl) orderIdEl.innerText = `Order #${order.id.slice(0, 8).toUpperCase()}`;
            document.getElementById('successModal').classList.add('active');

        } catch (e) {
            console.error('Order error:', e);
            showToast('❌ Failed to place order', true);
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check-circle"></i> Place Order • ₹' + (itemTotal + 20);
        }
    };

    document.addEventListener('DOMContentLoaded', loadCheckout);
    window.goBack = goBack;
    window.selectPayment = selectPayment;
    window.placeOrder = placeOrder;
</script>
</body>
</html>
