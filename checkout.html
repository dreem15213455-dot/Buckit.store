        <button onclick="window.location.href='orders.html'">ऑर्डर देखें</button>

<div class="toast" id="toastMsg"></div>

<script>
var sb = supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co','sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1');
var SUPABASE_URL = 'https://zwajyovemwdqtkecipeb.supabase.co';
var cart = [];
var paymentMethod = 'cod';
var currentUser = null, isLoggedIn = false;
var savedAddresses = [];
var selectedAddressIndex = -1;
var addressTag = 'home';
var isAddingNew = false;
var gpsLatitude = null, gpsLongitude = null, gpsAddress = null, gpsVerified = false, isFetchingLocation = false;

function showToast(msg, isError) {
    var t = document.getElementById('toastMsg'); if(!t) return;
    t.textContent = msg; t.className = 'toast'; if(isError) t.classList.add('error');
    t.classList.add('show'); clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

function goBack() { 
    if (document.referrer && document.referrer.indexOf(window.location.host) > -1) { window.history.back(); }
    else { window.location.href = 'cart.html'; }
}

function loadCart() { try { cart = JSON.parse(localStorage.getItem('zatpat_cart') || '[]'); } catch(e) { cart = []; } return cart; }

function calculateTotals() {
    var s = cart.reduce(function(a,i){ return a + ((i.price||0)*(i.quantity||1)); }, 0);
    var d = s >= 299 ? 0 : 40;
    return { subtotal: s, deliveryFee: d, total: s + d };
}

function loadSavedGPSData() {
    try {
        gpsLatitude = parseFloat(localStorage.getItem('user_lat') || '0') || null;
        gpsLongitude = parseFloat(localStorage.getItem('user_lng') || '0') || null;
        gpsAddress = localStorage.getItem('user_full_address') || null;
        var gpsTime = parseInt(localStorage.getItem('location_timestamp') || '0');
        if (gpsLatitude && gpsLongitude && gpsTime && (Date.now() - gpsTime) < 1800000) { gpsVerified = true; return true; }
        return false;
    } catch(e) { return false; }
}

// ✅ GPS - सिर्फ Button दबाने पर
function requestGPSLocation() {
    if (isFetchingLocation) return;
    isFetchingLocation = true;
    
    var btn = document.getElementById('gpsLocationBtn');
    var retryBtn = document.getElementById('gpsRetryBtn');
    
    if (btn) { btn.classList.add('loading'); btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> लोकेशन ले रहे हैं...'; }
    if (retryBtn) retryBtn.classList.remove('show');
    
    if (window.Android && typeof window.Android.requestLocation === 'function') {
        console.log('📍 Button dabaya - Requesting Android GPS...');
        window.Android.requestLocation();
        window._gpsTimeout = setTimeout(function() { if (!gpsVerified) requestBrowserGPS(); }, 5000);
    } else {
        requestBrowserGPS();
    }
}

function requestBrowserGPS() {
    if (!navigator.geolocation) { showToast('⚠️ GPS सपोर्ट नहीं', true); resetGPSButton(); return; }
    navigator.geolocation.getCurrentPosition(
        function(position) { handleGPSPosition(position.coords.latitude, position.coords.longitude); },
        function(error) {
            if (error.code === 1) showToast('⚠️ लोकेशन परमिशन दें', true);
            else showToast('⚠️ लोकेशन नहीं मिली', true);
            resetGPSButton();
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
    );
}

function handleGPSPosition(lat, lng) {
    if (window._gpsTimeout) { clearTimeout(window._gpsTimeout); }
    gpsLatitude = lat; gpsLongitude = lng;
    localStorage.setItem('user_lat', lat.toString());
    localStorage.setItem('user_lng', lng.toString());
    localStorage.setItem('location_timestamp', Date.now().toString());
    fetchAddressFromCoords(lat, lng);
}

async function fetchAddressFromCoords(lat, lng) {
    try {
        var controller = new AbortController();
        var timeout = setTimeout(function() { controller.abort(); }, 5000);
        var response = await fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lng+'&zoom=18&addressdetails=1', {
            headers: { 'Accept': 'application/json', 'User-Agent': 'ZatpatApp/5.5' }, signal: controller.signal
        });
        clearTimeout(timeout);
        var data = await response.json();
        gpsAddress = data.display_name || (data.address ? formatAddress(data.address) : 'पता उपलब्ध नहीं');
        gpsVerified = true;
        localStorage.setItem('user_full_address', gpsAddress);
        updateGPSDisplay();
        showToast('✅ लोकेशन मिल गई!');
        if (data.address) autoFillFromGPS(data.address);
    } catch(e) { gpsAddress = lat.toFixed(6) + ', ' + lng.toFixed(6); gpsVerified = true; updateGPSDisplay(); }
}

function formatAddress(addr) {
    var parts = [];
    if (addr.road) parts.push(addr.road);
    if (addr.village) parts.push(addr.village);
    if (addr.town) parts.push(addr.town);
    if (addr.city) parts.push(addr.city);
    if (addr.state_district) parts.push(addr.state_district);
    if (addr.state) parts.push(addr.state);
    if (addr.postcode) parts.push(addr.postcode);
    return parts.join(', ') || 'पता उपलब्ध नहीं';
}

function autoFillFromGPS(addr) {
    var cityField = document.getElementById('custCity') || document.getElementById('newCustCity');
    if (cityField && !cityField.value) {
        var city = addr.city || addr.town || addr.municipality || addr.village || addr.state_district || '';
        if (city) cityField.value = city;
    }
    var pinField = document.getElementById('custPincode') || document.getElementById('newCustPincode');
    if (pinField && !pinField.value) {
        var pin = addr.postcode || '';
        if (pin) pinField.value = pin;
    }
}

function updateGPSDisplay() {
    var btn = document.getElementById('gpsLocationBtn');
    var display = document.getElementById('gpsAddressDisplay');
    var addressText = document.getElementById('gpsAddressText');
    var coordsText = document.getElementById('gpsCoords');
    var retryBtn = document.getElementById('gpsRetryBtn');
    var hint = document.getElementById('gpsHintText');
    
    if (btn) { btn.classList.remove('loading'); btn.classList.add('success'); btn.innerHTML = '<i class="fas fa-check-circle"></i> ✅ लोकेशन मिल गई!'; }
    if (display) display.classList.add('show');
    if (addressText && gpsAddress) addressText.textContent = gpsAddress;
    if (coordsText && gpsLatitude && gpsLongitude) coordsText.textContent = '📍 ' + gpsLatitude.toFixed(6) + ', ' + gpsLongitude.toFixed(6);
    if (retryBtn) retryBtn.classList.add('show');
    if (hint) hint.style.display = 'none';
    isFetchingLocation = false;
}

function resetGPSButton() {
    var btn = document.getElementById('gpsLocationBtn');
    var retryBtn = document.getElementById('gpsRetryBtn');
    var hint = document.getElementById('gpsHintText');
    if (btn) { btn.classList.remove('loading','success'); btn.innerHTML = '<i class="fas fa-map-marker-alt"></i> 📍 अपनी लोकेशन लें'; }
    if (retryBtn) retryBtn.classList.add('show');
    if (hint) hint.style.display = 'flex';
    isFetchingLocation = false;
}

function retryGPSLocation() {
    gpsVerified = false; gpsLatitude = null; gpsLongitude = null; gpsAddress = null;
    var display = document.getElementById('gpsAddressDisplay');
    if (display) display.classList.remove('show');
    resetGPSButton();
    requestGPSLocation();
}
