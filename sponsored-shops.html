<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sponsored Shops - Zymart</title>
    <meta name="theme-color" content="#0B5A31">
    <meta name="description" content="Zymart - Featured & Trusted Shops in Your Area">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { 
            --brand-green: #0B5A31; --brand-orange: #F59E0B; --gold: #F59E0B;
            --neutral-white: #FFFFFF; --neutral-bg: #F9FAFB; --neutral-border: #E5E7EB;
            --neutral-gray: #6B7280; --neutral-dark: #1A1A1A;
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --radius-sm: 10px; --radius-md: 14px; --radius-lg: 18px; --radius-full: 9999px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--neutral-bg); color: var(--neutral-dark); 
            min-height: 100vh; -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased; padding-bottom: 30px;
        }
        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .top-bar { 
            background: var(--brand-green); position: sticky; top: 0; left: 0; width: 100%; 
            z-index: 100; padding: 10px 14px; display: flex; align-items: center; gap: 12px; 
            box-shadow: 0 2px 12px rgba(11,90,49,0.3); 
        }
        .back-btn { 
            width: 40px; height: 40px; background: rgba(255,255,255,0.10); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; cursor: pointer; 
            border: none; color: white; font-size: 15px; transition: all 0.15s ease; 
        }
        .back-btn:active { background: rgba(255,255,255,0.22); transform: scale(0.93); }
        .top-title { flex: 1; font-size: 17px; font-weight: 700; color: white; }
        .main-content { padding: 12px 0; max-width: 600px; margin: 0 auto; }
        
        .sponsored-banner { 
            background: linear-gradient(135deg, #FEF3C7, #FDE68A); margin: 8px 14px 12px; 
            padding: 12px 16px; border-radius: var(--radius-lg); display: flex; align-items: center; 
            gap: 10px; font-size: 12px; font-weight: 600; color: #92400E; animation: slideUp 0.3s ease; 
        }
        .sponsored-banner i { color: var(--gold); font-size: 18px; }
        
        .shop-card {
            background: var(--neutral-white); margin: 8px 14px; border-radius: var(--radius-lg); 
            padding: 14px; display: flex; gap: 12px; align-items: center; 
            border: 1px solid var(--neutral-border); box-shadow: var(--shadow-xs); 
            cursor: pointer; animation: slideUp 0.3s ease; transition: transform 0.15s; 
            position: relative;
        }
        .shop-card:active { transform: scale(0.98); }
        .crown-badge { position: absolute; top: 10px; right: 10px; color: var(--gold); font-size: 18px; }
        .shop-img { 
            width: 56px; height: 56px; border-radius: var(--radius-md); 
            background: #EDF7F1; display: flex; align-items: center; justify-content: center; 
            overflow: hidden; flex-shrink: 0; border: 2px solid #C8E6C9; 
        }
        .shop-img img { width: 100%; height: 100%; object-fit: cover; }
        .shop-img i { font-size: 24px; color: var(--brand-green); }
        .shop-info { flex: 1; min-width: 0; }
        .shop-name { font-size: 14px; font-weight: 700; margin-bottom: 2px; color: var(--neutral-dark); }
        .shop-category { font-size: 11px; color: var(--neutral-gray); }
        .shop-meta { display: flex; gap: 10px; margin-top: 4px; font-size: 10px; color: var(--neutral-gray); }
        .shop-meta span { display: flex; align-items: center; gap: 3px; }
        .shop-meta i { color: var(--brand-green); font-size: 9px; }
        
        .empty-state { text-align: center; padding: 60px 20px; animation: slideUp 0.3s ease; }
        .empty-state i { font-size: 48px; color: #D1D5DB; display: block; margin-bottom: 12px; }
        .empty-state h3 { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 6px; }
        .empty-state p { font-size: 13px; color: var(--neutral-gray); margin-bottom: 14px; }
        .empty-state button { 
            background: var(--brand-green); color: white; border: none; padding: 10px 20px; 
            border-radius: var(--radius-full); font-size: 13px; font-weight: 600; cursor: pointer; 
            font-family: 'Inter', sans-serif; 
        }
        
        .loading-state { text-align: center; padding: 40px; }
        .spinner { width: 30px; height: 30px; border: 2.5px solid var(--neutral-border); border-top-color: var(--brand-orange); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 10px; }
        .loading-state p { font-size: 12px; color: var(--neutral-gray); }
    </style>
</head>
<body>

<div class="top-bar">
    <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
    <span class="top-title"><i class="fas fa-crown" style="color:#F59E0B;"></i> Featured Shops</span>
</div>

<div class="main-content" id="mainContent">
    <div class="loading-state"><div class="spinner"></div><p>Loading featured shops...</p></div>
</div>

<script>
(function() {
    'use strict';
    
    var sb = supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co', 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1');
    var SUPABASE_URL = 'https://zwajyovemwdqtkecipeb.supabase.co';
    
    function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function getFullUrl(u) { if (!u || typeof u !== 'string') return ''; if (u.indexOf('http')===0 || u.indexOf('data:')===0) return u; return SUPABASE_URL + '/storage/v1/object/public/' + u; }
    function goBack() { try { if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) { window.history.back(); return; } } catch(e) {} window.location.href = 'index.html'; }
    window.fastNavigate = function(url) { window.location.href = url; };
    
    async function loadSponsored() {
        var c = document.getElementById('mainContent');
        try {
            // ✅ Fetch approved shops — sorted by rating (featured shops)
            var result = await sb.from('shops')
                .select('*')
                .eq('status', 'approved')
                .eq('is_open', true)
                .order('rating', { ascending: false })
                .limit(20);
            
            var shops = (result && result.data) ? result.data : [];
            
            var html = '<div class="sponsored-banner"><i class="fas fa-crown"></i> <span>These shops are featured & trusted by Zymart — fast delivery guaranteed!</span></div>';
            
            if (!shops.length) { 
                c.innerHTML = html + '<div class="empty-state"><i class="fas fa-store-slash"></i><h3>No Featured Shops Yet</h3><p>Featured shops will appear here soon. Check back later!</p><button onclick="window.location.href=\'index.html\'">🏠 Go to Home</button></div>'; 
                return; 
            }
            
            for (var i = 0; i < shops.length; i++) {
                var s = shops[i];
                var imgUrl = getFullUrl(s.image_url);
                html += '<div class="shop-card" onclick="fastNavigate(\'shop-details.html?id=' + s.id + '\')">';
                html += '<div class="crown-badge"><i class="fas fa-crown"></i></div>';
                html += '<div class="shop-img">' + (s.image_url ? '<img src="' + imgUrl + '" loading="lazy" onerror="this.style.display=\'none\';this.parentElement.innerHTML=\'<i class=\\\'fas fa-store\\\'></i>\';">' : '<i class="fas fa-store"></i>') + '</div>';
                html += '<div class="shop-info"><div class="shop-name">' + esc(s.name) + '</div>';
                html += '<div class="shop-category">' + esc(s.category || 'General Store') + '</div>';
                html += '<div class="shop-meta"><span><i class="fas fa-star" style="color:#F59E0B;"></i> ' + (s.rating || '4.0') + '</span><span><i class="fas fa-map-pin"></i> ' + esc(s.city || 'Maharashtra') + '</span><span><i class="fas fa-check-circle" style="color:#22C55E;"></i> Verified</span></div></div>';
                html += '</div>';
            }
            c.innerHTML = html;
        } catch(e) { 
            console.error('[Zymart] Sponsored load error:', e);
            c.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>Failed to Load</h3><p>Please check your connection and try again.</p><button onclick="loadSponsored()">🔄 Retry</button></div>'; 
        }
    }
    
    document.addEventListener('DOMContentLoaded', loadSponsored);
    window.loadSponsored = loadSponsored;
})();
</script>
</body>
</html>
