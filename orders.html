<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Orders - ZyMart</title>
    <meta name="theme-color" content="#0B5A31">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --brand-green: #0B5A31; --brand-orange: #F59E0B; --neutral-white: #FFFFFF; --neutral-bg: #F9FAFB; --neutral-border: #E5E7EB; --neutral-gray: #6B7280; --neutral-dark: #1A1A1A; --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); --shadow-sm: 0 1px 4px rgba(0,0,0,0.06); --shadow-md: 0 4px 16px rgba(0,0,0,0.08); --radius-sm: 10px; --radius-md: 14px; --radius-lg: 18px; --radius-full: 9999px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter',-apple-system,sans-serif; background: var(--neutral-bg); color: var(--neutral-dark); padding-bottom: 85px; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; min-height: 100vh; }
        @keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .top-bar { background: var(--brand-green); position: fixed; top: 0; left: 0; width: 100%; z-index: 100; padding: 10px 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 16px rgba(11,90,49,0.3); }
        .back-btn { width: 40px; height: 40px; background: rgba(255,255,255,0.10); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 15px; text-decoration: none; }
        .top-title { font-family: 'Poppins',sans-serif; flex: 1; font-size: 16px; font-weight: 700; color: white; }
        .brand-zy { color: #A3E635; } .brand-mart { color: #FDE047; }
        .refresh-btn { width: 40px; height: 40px; background: rgba(255,255,255,0.10); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 14px; }
        .main-content { padding-top: 62px; max-width: 600px; margin: 0 auto; }
        
        .tabs { display: flex; gap: 6px; padding: 10px 14px; background: white; position: sticky; top: 60px; z-index: 50; border-bottom: 1px solid var(--neutral-border); overflow-x: auto; }
        .tab-btn { padding: 8px 14px; border-radius: var(--radius-full); font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--neutral-border); background: white; color: var(--neutral-gray); white-space: nowrap; font-family: 'Inter',sans-serif; }
        .tab-btn.active { background: var(--brand-green); color: white; border-color: var(--brand-green); }
        
        .orders-list { padding: 10px 14px; }
        .order-card { background: white; border-radius: var(--radius-lg); padding: 15px; margin-bottom: 10px; border: 1px solid var(--neutral-border); box-shadow: var(--shadow-xs); cursor: pointer; animation: slideUp 0.3s ease; }
        .order-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .order-id { font-weight: 700; font-size: 14px; }
        .order-date { font-size: 11px; color: var(--neutral-gray); }
        .order-status { padding: 3px 10px; border-radius: var(--radius-full); font-size: 10px; font-weight: 700; }
        .status-pending { background: #FFF8EB; color: #D97706; }
        .status-confirmed { background: #EFF6FF; color: #2563EB; }
        .status-delivered { background: #EDF7F1; color: #059669; }
        .status-cancelled { background: #FEF2F2; color: #DC2626; }
        .order-address { font-size: 10px; color: var(--neutral-gray); margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
        .order-address i { color: var(--brand-green); font-size: 9px; }
        .gps-badge { display: inline-block; background: #EDF7F1; color: #0B5A31; font-size: 8px; padding: 1px 6px; border-radius: 9999px; font-weight: 600; margin-left: 4px; }
        .order-items { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
        .order-item-tag { background: #F3F5F4; padding: 3px 8px; border-radius: var(--radius-full); font-size: 10px; color: var(--neutral-gray); }
        .order-footer { display: flex; justify-content: space-between; align-items: center; }
        .order-total { font-size: 17px; font-weight: 700; }
        .reorder-btn { background: #EDF7F1; color: var(--brand-green); border: 1px solid var(--brand-green); padding: 7px 14px; border-radius: var(--radius-full); font-size: 11px; font-weight: 600; cursor: pointer; font-family: 'Inter',sans-serif; }
        .reorder-btn:active { background: var(--brand-green); color: white; }
        
        .empty-state { text-align: center; padding: 55px 20px; }
        .empty-state i { font-size: 48px; color: #D1D5DB; margin-bottom: 12px; display: block; }
        .empty-state h3 { font-family: 'Poppins',sans-serif; font-size: 17px; font-weight: 700; }
        .btn-primary { background: var(--brand-green); color: white; border: none; padding: 11px 24px; border-radius: var(--radius-full); font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Inter',sans-serif; display: inline-block; margin: 4px; text-decoration: none; }
        .btn-orange { background: var(--brand-orange); color: white; border: none; padding: 10px 20px; border-radius: var(--radius-full); font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'Inter',sans-serif; }
        
        .login-prompt { text-align: center; padding: 55px 20px; }
        .login-prompt i { font-size: 48px; color: #D1D5DB; margin-bottom: 12px; display: block; }
        .login-prompt h3 { font-family: 'Poppins',sans-serif; font-size: 17px; font-weight: 700; }
        .login-prompt p { color: var(--neutral-gray); font-size: 13px; margin-bottom: 14px; }
        
        .bottom-nav { background: white; position: fixed; bottom: 0; left: 0; width: 100%; display: flex; justify-content: space-around; padding: 5px 14px 10px; box-shadow: 0 -4px 16px rgba(0,0,0,0.03); z-index: 100; border-top: 1px solid var(--neutral-border); }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 9px; font-weight: 500; color: var(--neutral-gray); cursor: pointer; padding: 3px 10px; border-radius: var(--radius-full); border: none; background: transparent; font-family: 'Inter',sans-serif; text-decoration: none; }
        .nav-item.active { color: var(--brand-green); font-weight: 600; }
        .nav-item i { font-size: 18px; margin-bottom: 1px; }
        
        .toast { position: fixed; bottom: 95px; left: 50%; transform: translateX(-50%); background: var(--neutral-dark); color: white; padding: 9px 18px; border-radius: var(--radius-full); font-size: 11px; z-index: 200; opacity: 0; visibility: hidden; white-space: nowrap; box-shadow: var(--shadow-md); transition: all 0.3s ease; }
        .toast.show { opacity: 1; visibility: visible; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="top-bar">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <span class="top-title"><span class="brand-zy">Zy</span><span class="brand-mart">Mart</span> Orders</span>
    <button class="refresh-btn" onclick="loadOrders()"><i class="fas fa-sync-alt"></i></button>
</div>

<div class="tabs" id="tabsBar" style="display:none;">
    <button class="tab-btn active" onclick="filterOrders('all',this)">All</button>
    <button class="tab-btn" onclick="filterOrders('pending',this)">Pending</button>
    <button class="tab-btn" onclick="filterOrders('confirmed',this)">Confirmed</button>
    <button class="tab-btn" onclick="filterOrders('delivered',this)">Delivered</button>
    <button class="tab-btn" onclick="filterOrders('cancelled',this)">Cancelled</button>
</div>

<div class="main-content" id="mainContent"><div style="text-align:center;padding:50px;"><div style="width:32px;height:32px;border:2.5px solid #E5E7EB;border-top-color:#F59E0B;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto;"></div></div></div>

<nav class="bottom-nav">
    <a class="nav-item" href="index.html"><i class="fas fa-home"></i><span>Home</span></a>
    <a class="nav-item" href="more.html"><i class="fas fa-ellipsis-h"></i><span>More</span></a>
    <a class="nav-item" href="cart.html"><i class="fas fa-shopping-cart"></i><span>Cart</span></a>
    <a class="nav-item" href="profile.html"><i class="fas fa-user"></i><span>Profile</span></a>
    <a class="nav-item active" href="orders.html"><i class="fas fa-receipt"></i><span>Orders</span></a>
</nav>

<div class="toast" id="toastMsg"></div>

<script>
(function() {
    'use strict';
    window.addEventListener('error', function(e) { console.error('[Orders]', e.message); });
    
    var sb = supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co', 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1');
    var currentUser = null, allOrders = [], currentFilter = 'all';
    
    function getEl(id) { return document.getElementById(id); }
    function esc(s) { if(!s)return''; var d=document.createElement('div');d.textContent=s;return d.innerHTML; }
    function showToast(m) { var t=getEl('toastMsg'); if(!t)return; t.textContent=m; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},2500); }
    function safeJSON(s, f) { try { return s ? JSON.parse(s) : f; } catch(e) { return f; } }
    
    async function checkUser() { try { var r=await sb.auth.getSession(); currentUser=(r&&r.data&&r.data.session)?r.data.session.user:null; } catch(e) { currentUser=null; } return !!currentUser; }
    
    function goToLogin() { try { sessionStorage.setItem('zymart_redirect_after_login','orders.html'); } catch(e) {} window.location.href='login.html'; }
    
    async function loadOrders() {
        if(!currentUser){var li=await checkUser();if(!li){getEl('mainContent').innerHTML='<div class="login-prompt"><i class="fas fa-user-lock"></i><h3>Login Required</h3><p>Please login to view your orders</p><button class="btn-orange" onclick="goToLogin()">🔐 Login / Register</button></div>';return;}}
        try {
            var r = await sb.from('orders').select('*').eq('user_id',currentUser.id).order('created_at',{ascending:false}).limit(50);
            allOrders = (r&&r.data)?r.data:[];
            getEl('tabsBar').style.display = allOrders.length>0?'flex':'none';
            renderOrders();
        } catch(e) { getEl('mainContent').innerHTML='<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>Failed to Load</h3><button class="btn-primary" onclick="loadOrders()">🔄 Retry</button></div>'; }
    }
    
    function filterOrders(f,btn) { currentFilter=f; document.querySelectorAll('.tab-btn').forEach(function(el){el.classList.remove('active');}); if(btn)btn.classList.add('active'); renderOrders(); }
    
    function getStatusBadge(s) { var m={pending:'status-pending',confirmed:'status-confirmed',delivered:'status-delivered',cancelled:'status-cancelled'}; return m[s]||'status-pending'; }
    function getStatusText(s) { var m={pending:'Pending',confirmed:'Confirmed',delivered:'Delivered',cancelled:'Cancelled'}; return m[s]||s; }
    
    function renderOrders() {
        var c = getEl('mainContent');
        var filtered = currentFilter==='all'?allOrders:allOrders.filter(function(o){return o.status===currentFilter;});
        
        if(!filtered.length) {
            c.innerHTML = '<div class="empty-state"><i class="fas fa-receipt"></i><h3>'+(currentFilter==='all'?'No Orders':'No '+getStatusText(currentFilter)+' Orders')+'</h3><a href="products.html" class="btn-primary">🛍️ Start Shopping</a><button class="btn-orange" onclick="window.location.href=\'index.html\'"><i class="fas fa-home"></i> Home</button></div>';
            return;
        }
        
        var h = '<div class="orders-list">';
        for(var i=0;i<filtered.length;i++) {
            var o=filtered[i], oid='#'+(o.id||'').substring(0,8).toUpperCase(), date=o.created_at?new Date(o.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'', items=o.items||[], itemNames=items.slice(0,3).map(function(it){return it.product_name||it.name||'Item';});
            
            h += '<div class="order-card" onclick="window.location.href=\'order-details.html?id='+o.id+'\'">';
            h += '<div class="order-header"><div><div class="order-id">'+oid+'</div><div class="order-date">'+date+'</div></div><span class="order-status '+getStatusBadge(o.status)+'">'+getStatusText(o.status)+'</span></div>';
            
            if (o.customer_address) {
                h += '<div class="order-address"><i class="fas fa-map-marker-alt"></i> ' + esc(o.customer_address.substring(0, 40)) + (o.customer_address.length > 40 ? '...' : '');
                if (o.location_verified) h += '<span class="gps-badge">📍 GPS Verified</span>';
                h += '</div>';
            }
            
            h += '<div class="order-items">';
            for(var j=0;j<itemNames.length;j++) h+='<span class="order-item-tag">'+esc(itemNames[j])+'</span>';
            if(items.length>3) h+='<span class="order-item-tag">+'+(items.length-3)+' more</span>';
            h += '</div><div class="order-footer"><div class="order-total">₹'+(parseFloat(o.total_amount)||0).toLocaleString('en-IN')+'</div><button class="reorder-btn" onclick="event.stopPropagation();reorder(\''+o.id+'\')">🔄 Reorder</button></div></div>';
        }
        h += '</div>';
        c.innerHTML = h;
    }
    
    // 🔥 FIXED: Using zymart_cart
    window.reorder = function(oid) {
        var order = allOrders.find(function(o){return o.id===oid;});
        if(!order||!order.items||!order.items.length){showToast('Order not found');return;}
        var cart = safeJSON(localStorage.getItem('zymart_cart'), []);
        for(var i=0;i<order.items.length;i++){
            var item=order.items[i], iid=item.product_id||item.id;
            if(!iid)continue;
            var cartKey = item.variant_key || iid;
            var found=cart.find(function(c){return c.cartKey===cartKey || c.id===iid;});
            if(found) found.quantity+=(item.quantity||1);
            else cart.push({id:iid, cartKey:cartKey, name:item.product_name||item.name||'Product', price:item.price||0, image:item.image||'', quantity:item.quantity||1, variantKey:item.variant_key||null});
        }
        try { localStorage.setItem('zymart_cart', JSON.stringify(cart)); } catch(e) {}
        showToast('🛒 Added to cart!');
        setTimeout(function(){ window.location.href='cart.html'; }, 800);
    };
    
    document.addEventListener('DOMContentLoaded', async function(){ var li=await checkUser(); if(li){loadOrders();}else{getEl('mainContent').innerHTML='<div class="login-prompt"><i class="fas fa-user-lock"></i><h3>Login Required</h3><p>Please login to view your orders</p><button class="btn-orange" onclick="goToLogin()">🔐 Login / Register</button></div>';} });
    
    window.loadOrders = loadOrders;
    window.filterOrders = filterOrders;
})();
</script>
</body>
</html>
