<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Orders - Zatpat</title>
    <meta name="theme-color" content="#16A34A">
    
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #16A34A;
            --primary-light: #22C55E;
            --primary-bg-light: #F0FDF4;
            --accent-orange: #F97316;
            --bg-white: #FFFFFF;
            --bg-light: #F9FAFB;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --border-light: #E5E7EB;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --radius-md: 12px;
            --radius-full: 9999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
            overflow-x: hidden;
            padding-bottom: 85px;
            -webkit-font-smoothing: antialiased;
        }

        #pageProgress {
            position: fixed; top: 0; left: 0; width: 0%; height: 3px;
            background: var(--primary); z-index: 10001; transition: width 0.3s ease;
        }
        #pageProgress.loading { width: 90%; }
        #pageProgress.complete { width: 100%; opacity: 0; transition: opacity 0.3s; }

        .top-bar {
            background: var(--bg-white); position: sticky; top: 0; left: 0; width: 100%;
            z-index: 1000; padding: 12px 16px; box-shadow: var(--shadow-sm);
            border-bottom: 1px solid var(--border-light); display: flex; align-items: center; gap: 12px;
        }
        .back-btn {
            width: 40px; height: 40px; background: var(--bg-light); border-radius: var(--radius-full);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .back-btn i { font-size: 18px; color: var(--text-primary); }
        .top-title {
            font-size: 18px; font-weight: 800; color: #000000;
            display: flex; align-items: center; gap: 6px;
        }
        .top-title i { color: var(--primary); }

        .main-content { padding: 16px; }

        .order-tabs {
            display: flex; background: var(--bg-white); border-radius: var(--radius-full);
            padding: 4px; margin-bottom: 16px; border: 1px solid var(--border-light);
        }
        .tab {
            flex: 1; text-align: center; padding: 10px; font-size: 13px; font-weight: 600;
            color: var(--text-secondary); cursor: pointer; border-radius: var(--radius-full);
            transition: all 0.2s;
        }
        .tab.active { background: var(--primary); color: white; }

        .orders-list { display: flex; flex-direction: column; gap: 12px; }
        
        .order-card {
            background: var(--bg-white); border-radius: var(--radius-md); padding: 14px;
            box-shadow: var(--shadow-sm); border: 1px solid var(--border-light);
        }
        .order-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border-light);
        }
        .order-id { font-size: 13px; font-weight: 700; color: #000000; }
        .order-date { font-size: 11px; color: var(--text-secondary); }
        .order-status {
            padding: 4px 10px; border-radius: var(--radius-full); font-size: 11px; font-weight: 600;
        }
        .status-pending { background: #FEF3C7; color: #D97706; }
        .status-confirmed { background: #D1FAE5; color: #059669; }
        .status-delivered { background: #DBEAFE; color: #2563EB; }
        .status-cancelled { background: #FEE2E2; color: #DC2626; }

        .order-items { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        .order-item { display: flex; align-items: center; gap: 10px; }
        .item-image {
            width: 50px; height: 50px; border-radius: 8px;
            background: var(--bg-light); flex-shrink: 0; overflow: hidden;
        }
        .item-image img { width: 100%; height: 100%; object-fit: cover; }
        .item-details { flex: 1; }
        .item-name {
            font-size: 13px; font-weight: 700; color: #000000; margin-bottom: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .item-qty { font-size: 11px; color: var(--text-secondary); }
        .item-price { font-size: 13px; font-weight: 800; color: #000000; }

        .order-footer {
            display: flex; justify-content: space-between; align-items: center;
            padding-top: 10px; border-top: 1px solid var(--border-light);
        }
        .order-total { font-size: 14px; font-weight: 800; color: #000000; }
        .order-total span { color: #000000; }
        .track-btn {
            background: var(--primary-bg-light); color: var(--primary);
            border: 1px solid var(--primary); padding: 8px 16px;
            border-radius: var(--radius-full); font-size: 12px; font-weight: 600; cursor: pointer;
        }
        .reorder-btn {
            background: var(--primary); color: white; border: none;
            padding: 8px 16px; border-radius: var(--radius-full);
            font-size: 12px; font-weight: 600; cursor: pointer;
        }

        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-state i { font-size: 64px; color: var(--border-light); margin-bottom: 20px; }
        .empty-state h3 { font-size: 18px; font-weight: 800; color: #000000; margin-bottom: 8px; }
        .empty-state p { color: var(--text-secondary); margin-bottom: 24px; }
        .shop-now-btn {
            background: var(--primary); color: white; border: none;
            padding: 14px 32px; border-radius: var(--radius-full);
            font-size: 15px; font-weight: 600; cursor: pointer;
        }

        .loading-spinner { text-align: center; padding: 60px; }
        .spinner {
            width: 40px; height: 40px; border: 3px solid var(--border-light);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast-notification {
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
            background: var(--text-primary); color: white; padding: 10px 20px;
            border-radius: var(--radius-full); font-size: 12px; z-index: 10050;
            display: none; white-space: nowrap;
        }
        .toast-notification.show { display: flex; }

        .bottom-nav {
            background: white; position: fixed; bottom: 0; left: 0; width: 100%;
            display: flex; justify-content: space-around; padding: 6px 16px 8px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.06); z-index: 1000;
            border-top: 1px solid var(--border-light);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            font-size: 10px; font-weight: 500; color: var(--text-secondary); cursor: pointer; position: relative;
        }
        .nav-item.active { color: var(--primary); font-weight: 600; }
        .nav-item i { font-size: 20px; margin-bottom: 2px; }
        .cart-count {
            position: absolute; top: -5px; right: -5px; background: var(--primary); color: white;
            border-radius: 50%; width: 16px; height: 16px; font-size: 9px; display: flex;
            align-items: center; justify-content: center; border: 2px solid white;
        }
    </style>
</head>
<body>

<div id="pageProgress"></div>
<div id="toastMsg" class="toast-notification"><span id="toastText"></span></div>

<div id="mainApp">
    <div class="top-bar">
        <div class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
        <div class="top-title"><i class="fas fa-receipt"></i> My Orders</div>
    </div>

    <div class="main-content">
        <div class="order-tabs">
            <div class="tab active" onclick="filterOrders('all')">All</div>
            <div class="tab" onclick="filterOrders('pending')">Pending</div>
            <div class="tab" onclick="filterOrders('delivered')">Delivered</div>
        </div>
        <div id="ordersContainer"><div class="loading-spinner"><div class="spinner"></div></div></div>
    </div>

    <nav class="bottom-nav">
        <a class="nav-item" onclick="fastNavigate('index.html')"><i class="fas fa-home"></i><span>Home</span></a>
        <a class="nav-item" onclick="fastNavigate('products.html')"><i class="fas fa-search"></i><span>Explore</span></a>
        <a class="nav-item" onclick="fastNavigate('cart.html')"><i class="fas fa-shopping-bag"></i><span>Cart</span><span class="cart-count" id="cartCount">0</span></a>
        <a class="nav-item" onclick="fastNavigate('profile.html')"><i class="fas fa-user"></i><span>Profile</span></a>
        <a class="nav-item active" onclick="fastNavigate('orders.html')"><i class="fas fa-receipt"></i><span>Orders</span></a>
    </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // ========== ERROR HANDLING (CRASH-PROOF) ==========
    window.addEventListener('error', function(e) {
        console.error('Global error:', e.error);
        showToast('Something went wrong. Please refresh.', true);
        return false;
    });

    const supabaseUrl = 'https://zwajyovemwdqtkecipeb.supabase.co';
    const supabaseKey = 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1';
    const zatpatDB = supabase.createClient(supabaseUrl, supabaseKey);

    let allOrders = [];
    let currentFilter = 'all';
    let currentUser = null;

    function startProgress() { const b = document.getElementById('pageProgress'); if(b) { b.style.width = '0%'; b.classList.add('loading'); setTimeout(() => b.style.width = '90%', 10); } }
    function completeProgress() { const b = document.getElementById('pageProgress'); if(b) { b.classList.remove('loading'); b.classList.add('complete'); setTimeout(() => { b.style.width = '0%'; b.classList.remove('complete'); }, 300); } }
    window.fastNavigate = function(url) { startProgress(); setTimeout(() => window.location.href = url, 50); };
    function goBack() { window.history.back(); }

    function showToast(msg, isError = false) {
        const t = document.getElementById('toastMsg');
        const s = document.getElementById('toastText');
        if(!t || !s) return;
        s.innerHTML = msg;
        t.style.background = isError ? '#EF4444' : '#111827';
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    function updateCartBadge() {
        try {
            const cart = JSON.parse(localStorage.getItem('zatpat_cart')) || [];
            const badge = document.getElementById('cartCount');
            if(badge) badge.innerText = cart.reduce((s, i) => s + (i.quantity || 1), 0);
        } catch(e) {}
    }

    async function checkUser() {
        try {
            const { data: { session } } = await zatpatDB.auth.getSession();
            currentUser = session?.user || null;
        } catch(e) { currentUser = null; }
        return currentUser;
    }

    async function loadOrders() {
        await checkUser();
        const container = document.getElementById('ordersContainer');
        if(!container) return;
        
        if (!currentUser) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-user-circle"></i>
                    <h3>Please Login</h3>
                    <p>Login to view your orders</p>
                    <button class="shop-now-btn" onclick="fastNavigate('index.html')">Go to Login</button>
                </div>
            `;
            return;
        }

        try {
            const { data: orders, error } = await zatpatDB
                .from('orders')
                .select('*, order_items(*)')
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: false });

            if (error) throw error;
            allOrders = orders || [];
            renderOrders();
        } catch (e) {
            console.error('Load error:', e);
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-circle"></i>
                    <h3>Failed to load orders</h3>
                    <p>Please try again later</p>
                </div>
            `;
        }
    }

    function renderOrders() {
        const container = document.getElementById('ordersContainer');
        if(!container) return;
        
        let filteredOrders = allOrders;
        if (currentFilter === 'pending') {
            filteredOrders = allOrders.filter(o => o.status === 'pending' || o.status === 'confirmed');
        } else if (currentFilter === 'delivered') {
            filteredOrders = allOrders.filter(o => o.status === 'delivered');
        }

        if (filteredOrders.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-receipt"></i>
                    <h3>No orders found</h3>
                    <p>${currentFilter === 'all' ? 'Start shopping to place your first order!' : `No ${currentFilter} orders`}</p>
                    ${currentFilter === 'all' ? '<button class="shop-now-btn" onclick="fastNavigate(\'index.html\')">Shop Now</button>' : ''}
                </div>
            `;
            return;
        }

        let html = '<div class="orders-list">';
        filteredOrders.forEach(order => {
            const orderDate = new Date(order.created_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
            const statusClass = `status-${order.status || 'pending'}`;
            const items = order.order_items || [];
            
            let itemsHtml = '';
            items.slice(0, 3).forEach(item => {
                itemsHtml += `
                    <div class="order-item">
                        <div class="item-image"><img src="https://placehold.co/50/F0FDF4/16A34A?text=📦" loading="lazy"></div>
                        <div class="item-details">
                            <div class="item-name">${item.product_name || 'Product'}</div>
                            <div class="item-qty">Qty: ${item.quantity || 1}</div>
                        </div>
                        <div class="item-price">₹${item.total_price || (item.price * item.quantity) || 0}</div>
                    </div>
                `;
            });
            
            if (items.length > 3) {
                itemsHtml += `<div class="order-item" style="justify-content:center;color:var(--text-secondary);font-size:12px;">+${items.length - 3} more items</div>`;
            }

            html += `
                <div class="order-card">
                    <div class="order-header">
                        <div>
                            <div class="order-id">Order #${order.id?.slice(0, 8).toUpperCase() || 'UNKNOWN'}</div>
                            <div class="order-date">${orderDate}</div>
                        </div>
                        <span class="order-status ${statusClass}">${order.status || 'pending'}</span>
                    </div>
                    <div class="order-items">${itemsHtml}</div>
                    <div class="order-footer">
                        <div class="order-total">Total: <span>₹${order.total_amount || 0}</span></div>
                        <div>
                            ${order.status === 'delivered' ? 
                                `<button class="reorder-btn" onclick="reorder('${order.id}')"><i class="fas fa-redo-alt"></i> Reorder</button>` :
                                `<button class="track-btn" onclick="trackOrder('${order.id}')"><i class="fas fa-truck"></i> Track</button>`
                            }
                        </div>
                    </div>
                </div>
            `;
        });
        html += '</div>';
        container.innerHTML = html;
    }

    window.filterOrders = function(filter) {
        currentFilter = filter;
        document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
        event.target.classList.add('active');
        renderOrders();
    };

    window.trackOrder = function(orderId) {
        showToast('📍 Tracking info coming soon!');
        fastNavigate(`order-tracking.html?id=${orderId}`);
    };

    window.reorder = async function(orderId) {
        const order = allOrders.find(o => o.id === orderId);
        if (!order) return;
        
        const items = order.order_items || [];
        let cart = JSON.parse(localStorage.getItem('zatpat_cart')) || [];
        
        items.forEach(item => {
            const existing = cart.find(i => i.id === item.product_id);
            if (existing) {
                existing.quantity += item.quantity || 1;
            } else {
                cart.push({
                    id: item.product_id,
                    name: item.product_name,
                    price: item.price,
                    quantity: item.quantity || 1,
                    image: ''
                });
            }
        });
        
        localStorage.setItem('zatpat_cart', JSON.stringify(cart));
        updateCartBadge();
        showToast('🛒 Items added to cart');
        setTimeout(() => fastNavigate('cart.html'), 500);
    };

    document.addEventListener('DOMContentLoaded', () => {
        updateCartBadge();
        loadOrders();
    });

    window.goBack = goBack;
    window.filterOrders = filterOrders;
    window.trackOrder = trackOrder;
    window.reorder = reorder;
</script>
</body>
</html>
