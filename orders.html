<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My Orders - Zatpat</title>
    <meta name="theme-color" content="#FFD600">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        :root {
            --primary: #FFD600;
            --primary-dark: #E5C200;
            --accent-green: #16A34A;
            --bg-light: #F5F5F5;
            --card-white: #FFFFFF;
            --text-primary: #1A1A1A;
            --text-secondary: #666666;
            --border-light: #E5E7EB;
            --danger: #EF4444;
            --success: #10B981;
            --warning: #F59E0B;
            --info: #3B82F6;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-2xl: 24px;
            --radius-full: 9999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
        }
        h1, h2, h3, h4, h5, h6 { font-family: 'Poppins', sans-serif; }

        .top-bar {
            background: var(--card-white);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 12px 16px;
            box-shadow: var(--shadow-sm);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .back-btn {
            width: 40px;
            height: 40px;
            background: var(--bg-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .brand-name { font-size: 22px; font-weight: 800; }
        .brand-name .normal { color: #000000; }
        .brand-name .pat { color: var(--accent-green); }
        .page-title { flex: 1; text-align: center; font-weight: 600; font-size: 16px; }

        .main-content {
            padding-top: 80px;
            padding-bottom: 100px;
            max-width: 600px;
            margin: 0 auto;
        }

        .tabs {
            display: flex;
            background: white;
            margin: 16px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            overflow: hidden;
            flex-wrap: wrap;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
        }
        .tab.active {
            background: var(--primary);
            color: #000000;
        }

        .order-card {
            background: white;
            margin: 16px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            overflow: hidden;
            transition: all 0.2s;
        }
        .order-card:hover {
            box-shadow: var(--shadow-md);
        }
        .order-header {
            padding: 16px;
            background: var(--bg-light);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .order-id {
            font-weight: 700;
            font-size: 14px;
        }
        .order-date {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .order-status {
            padding: 4px 12px;
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 600;
        }
        .status-pending { background: #FEF3C7; color: #D97706; }
        .status-confirmed { background: #DBEAFE; color: #2563EB; }
        .status-preparing { background: #FEF3C7; color: #D97706; }
        .status-out_for_delivery { background: #E0E7FF; color: #4F46E5; }
        .status-delivered { background: #D1FAE5; color: #059669; }
        .status-cancelled { background: #FEE2E2; color: #DC2626; }

        .order-items {
            padding: 12px 16px;
            max-height: 200px;
            overflow-y: auto;
        }
        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-light);
            font-size: 13px;
        }
        .order-item:last-child {
            border-bottom: none;
        }

        .order-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            background: var(--card-white);
        }
        .order-total {
            font-weight: 800;
            font-size: 16px;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .track-btn, .download-btn, .cancel-btn, .reorder-btn {
            padding: 6px 14px;
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            border: none;
        }
        .track-btn {
            background: var(--primary);
            color: #000;
        }
        .download-btn {
            background: var(--info);
            color: white;
        }
        .cancel-btn {
            background: rgba(239,68,68,0.1);
            color: var(--danger);
        }
        .reorder-btn {
            background: var(--bg-light);
            border: 1px solid var(--border-light);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            margin: 16px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
        }
        .empty-icon {
            font-size: 80px;
            color: var(--text-secondary);
            opacity: 0.5;
            margin-bottom: 20px;
        }
        .shop-now-btn {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 12px 32px;
            border-radius: var(--radius-full);
            font-weight: 600;
            margin-top: 20px;
            cursor: pointer;
        }

        .loading-spinner {
            text-align: center;
            padding: 60px;
            color: var(--primary);
        }
        .toast-notification {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #1F2937;
            color: white;
            padding: 10px 20px;
            border-radius: var(--radius-full);
            font-size: 13px;
            z-index: 10050;
            display: none;
        }
        .toast-notification.show {
            display: flex;
            animation: fadeUp 0.3s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        @media (max-width: 480px) {
            .order-header { flex-direction: column; align-items: flex-start; }
            .order-footer { flex-direction: column; }
            .btn-group { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
        <div class="brand-name"><span class="normal">Zat</span><span class="pat">pat</span></div>
        <div class="page-title">My Orders</div>
    </div>

    <div class="main-content" id="mainContent">
        <div class="loading-spinner"><i class="fas fa-spinner fa-spin fa-2x"></i><p>Loading orders...</p></div>
    </div>

    <div id="toastMsg" class="toast-notification">
        <i class="fas fa-check-circle"></i> <span id="toastText"></span>
    </div>

    <script>
        const supabaseUrl = 'https://zwajyovemwdqtkecipeb.supabase.co';
        const supabaseKey = 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let currentUser = null;
        let allOrders = [];
        let currentFilter = 'all';

        function showToast(message, isError = false) {
            const toast = document.getElementById('toastMsg');
            const toastText = document.getElementById('toastText');
            toastText.innerHTML = message;
            toast.style.background = isError ? '#EF4444' : '#1F2937';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        async function checkUser() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) {
                showLoginPrompt();
                return false;
            }
            currentUser = user;
            await loadOrders();
            return true;
        }

        async function loadOrders() {
            try {
                const { data, error } = await supabaseClient
                    .from('orders')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .order('created_at', { ascending: false });

                if (error) throw error;
                
                allOrders = data || [];
                renderOrders();
            } catch (error) {
                console.error('Error loading orders:', error);
                showError('Failed to load orders');
            }
        }

        function getStatusInfo(status) {
            const statusMap = {
                'pending': { text: 'Pending', class: 'status-pending', cancellable: true },
                'confirmed': { text: 'Confirmed', class: 'status-confirmed', cancellable: true },
                'preparing': { text: 'Preparing', class: 'status-preparing', cancellable: false },
                'out_for_delivery': { text: 'Out for Delivery', class: 'status-out_for_delivery', cancellable: false },
                'delivered': { text: 'Delivered', class: 'status-delivered', cancellable: false },
                'cancelled': { text: 'Cancelled', class: 'status-cancelled', cancellable: false }
            };
            return statusMap[status] || { text: status, class: 'status-pending', cancellable: true };
        }

        // Download Invoice PDF
        async function downloadInvoice(orderId) {
            const { data: order } = await supabaseClient
                .from('orders')
                .select('*')
                .eq('order_id', orderId)
                .single();
            
            if (!order) { showToast('Order not found', true); return; }
            
            const doc = new jspdf.jsPDF();
            const pageWidth = doc.internal.pageSize.getWidth();
            
            // Header
            doc.setFillColor(255, 214, 0);
            doc.rect(0, 0, pageWidth, 40, 'F');
            doc.setTextColor(0, 0, 0);
            doc.setFontSize(24);
            doc.setFont('helvetica', 'bold');
            doc.text('ZATPAT', 20, 28);
            doc.setFontSize(10);
            doc.text('Your Local Shopping Partner', pageWidth - 40, 28, { align: 'right' });
            
            // Invoice Title
            doc.setFontSize(18);
            doc.setTextColor(0, 0, 0);
            doc.text('TAX INVOICE', pageWidth / 2, 60, { align: 'center' });
            
            // Order Details
            doc.setFontSize(10);
            doc.setFont('helvetica', 'normal');
            doc.text(`Order ID: ${order.order_id}`, 20, 80);
            doc.text(`Date: ${new Date(order.created_at).toLocaleString()}`, 20, 90);
            doc.text(`Payment Method: ${order.payment_method}`, 20, 100);
            doc.text(`Payment Status: ${order.payment_status}`, 20, 110);
            
            // Items Table Header
            let y = 130;
            doc.setFillColor(240, 240, 240);
            doc.rect(20, y, 170, 10, 'F');
            doc.text('Item', 25, y + 7);
            doc.text('Qty', 130, y + 7);
            doc.text('Price', 150, y + 7);
            doc.text('Total', 170, y + 7);
            
            y += 12;
            const items = order.items || [];
            items.forEach(item => {
                doc.text(item.name.substring(0, 30), 25, y);
                doc.text(item.quantity.toString(), 130, y);
                doc.text(`₹${item.price}`, 150, y);
                doc.text(`₹${item.total}`, 170, y);
                y += 8;
                if (y > 270) { doc.addPage(); y = 20; }
            });
            
            y += 10;
            doc.text(`Subtotal: ₹${order.subtotal}`, 140, y);
            y += 7;
            doc.text(`Delivery Fee: ${order.delivery_fee === 0 ? 'FREE' : `₹${order.delivery_fee}`}`, 140, y);
            y += 10;
            doc.setFont('helvetica', 'bold');
            doc.text(`Total: ₹${order.total}`, 140, y);
            
            // Footer
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(8);
            doc.setTextColor(100, 100, 100);
            doc.text('Thank you for shopping with Zatpat!', pageWidth / 2, 280, { align: 'center' });
            
            doc.save(`Zatpat_Invoice_${order.order_id}.pdf`);
            showToast('Invoice downloaded!');
        }

        // Cancel Order
        async function cancelOrder(orderId) {
            if (!confirm('Are you sure you want to cancel this order?')) return;
            
            const { error } = await supabaseClient
                .from('orders')
                .update({ 
                    order_status: 'cancelled', 
                    cancelled_at: new Date().toISOString(),
                    cancelled_by: 'user'
                })
                .eq('order_id', orderId);
            
            if (error) {
                showToast('Error: ' + error.message, true);
            } else {
                showToast('✅ Order cancelled successfully!');
                await loadOrders();
            }
        }

        // Reorder items
        async function reorderItems(order) {
            if (!order || !order.items) return;
            
            let cart = JSON.parse(localStorage.getItem('zatpat_cart')) || [];
            
            for (let item of order.items) {
                const existing = cart.find(c => c.id === item.id);
                if (existing) {
                    existing.quantity = (existing.quantity || 1) + (item.quantity || 1);
                } else {
                    cart.push({
                        id: item.id,
                        name: item.name,
                        price: item.price,
                        quantity: item.quantity || 1
                    });
                }
            }
            
            localStorage.setItem('zatpat_cart', JSON.stringify(cart));
            showToast('Items added to cart!');
            window.location.href = 'cart.html';
        }

        function filterOrders() {
            if (currentFilter === 'all') return allOrders;
            return allOrders.filter(order => order.order_status === currentFilter);
        }

        function renderOrders() {
            const filteredOrders = filterOrders();
            
            if (filteredOrders.length === 0) {
                const emptyMessage = currentFilter === 'all' 
                    ? 'You haven\'t placed any orders yet' 
                    : `No ${currentFilter} orders found`;
                
                document.getElementById('mainContent').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon"><i class="fas fa-shopping-bag"></i></div>
                        <h3>${emptyMessage}</h3>
                        <p>Start shopping to see your orders here</p>
                        <button class="shop-now-btn" onclick="goToShop()">🛍️ Shop Now</button>
                    </div>
                `;
                return;
            }

            let ordersHtml = '';
            
            filteredOrders.forEach(order => {
                const statusInfo = getStatusInfo(order.order_status);
                const orderDate = new Date(order.created_at).toLocaleDateString('en-IN', {
                    day: 'numeric',
                    month: 'short',
                    year: 'numeric'
                });
                
                let itemsHtml = '';
                const items = order.items || [];
                const displayItems = items.slice(0, 3);
                const remainingCount = items.length - 3;
                
                displayItems.forEach(item => {
                    itemsHtml += `
                        <div class="order-item">
                            <span>${escapeHtml(item.name)} x ${item.quantity}</span>
                            <span>₹${item.total}</span>
                        </div>
                    `;
                });
                
                if (remainingCount > 0) {
                    itemsHtml += `
                        <div class="order-item" style="color: var(--text-secondary); justify-content: center;">
                            + ${remainingCount} more item(s)
                        </div>
                    `;
                }
                
                ordersHtml += `
                    <div class="order-card">
                        <div class="order-header">
                            <div>
                                <div class="order-id">${order.order_id}</div>
                                <div class="order-date">${orderDate}</div>
                            </div>
                            <span class="order-status ${statusInfo.class}">${statusInfo.text}</span>
                        </div>
                        <div class="order-items">
                            ${itemsHtml}
                        </div>
                        <div class="order-footer">
                            <div class="order-total">Total: ₹${order.total || 0}</div>
                            <div class="btn-group">
                                <a href="order-tracking.html?order=${order.order_id}" class="track-btn">
                                    <i class="fas fa-map-marked-alt"></i> Track
                                </a>
                                <button class="download-btn" onclick="downloadInvoice('${order.order_id}')">
                                    <i class="fas fa-download"></i> Invoice
                                </button>
                                ${statusInfo.cancellable ? 
                                    `<button class="cancel-btn" onclick="cancelOrder('${order.order_id}')">
                                        <i class="fas fa-times-circle"></i> Cancel
                                    </button>` : ''
                                }
                                <button class="reorder-btn" onclick="reorderItems(${JSON.stringify(order).replace(/"/g, '&quot;')})">
                                    <i class="fas fa-redo-alt"></i> Reorder
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });

            const counts = {
                all: allOrders.length,
                pending: allOrders.filter(o => o.order_status === 'pending').length,
                confirmed: allOrders.filter(o => o.order_status === 'confirmed').length,
                preparing: allOrders.filter(o => o.order_status === 'preparing').length,
                out_for_delivery: allOrders.filter(o => o.order_status === 'out_for_delivery').length,
                delivered: allOrders.filter(o => o.order_status === 'delivered').length,
                cancelled: allOrders.filter(o => o.order_status === 'cancelled').length
            };

            document.getElementById('mainContent').innerHTML = `
                <div class="tabs">
                    <div class="tab ${currentFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">All (${counts.all})</div>
                    <div class="tab ${currentFilter === 'pending' ? 'active' : ''}" onclick="setFilter('pending')">Pending (${counts.pending})</div>
                    <div class="tab ${currentFilter === 'confirmed' ? 'active' : ''}" onclick="setFilter('confirmed')">Confirmed (${counts.confirmed})</div>
                    <div class="tab ${currentFilter === 'preparing' ? 'active' : ''}" onclick="setFilter('preparing')">Preparing (${counts.preparing})</div>
                    <div class="tab ${currentFilter === 'out_for_delivery' ? 'active' : ''}" onclick="setFilter('out_for_delivery')">Shipping (${counts.out_for_delivery})</div>
                    <div class="tab ${currentFilter === 'delivered' ? 'active' : ''}" onclick="setFilter('delivered')">Delivered (${counts.delivered})</div>
                    <div class="tab ${currentFilter === 'cancelled' ? 'active' : ''}" onclick="setFilter('cancelled')">Cancelled (${counts.cancelled})</div>
                </div>
                ${ordersHtml}
            `;
        }

        function setFilter(filter) {
            currentFilter = filter;
            renderOrders();
        }

        function showLoginPrompt() {
            document.getElementById('mainContent').innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon"><i class="fas fa-lock"></i></div>
                    <h3>Please Login</h3>
                    <p>Login to view your orders</p>
                    <button class="shop-now-btn" onclick="goToLogin()">Login Now</button>
                </div>
            `;
        }

        function showError(message) {
            document.getElementById('mainContent').innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon"><i class="fas fa-exclamation-triangle"></i></div>
                    <h3>Error</h3>
                    <p>${message}</p>
                    <button class="shop-now-btn" onclick="location.reload()">Try Again</button>
                </div>
            `;
        }

        function goBack() { window.location.href = 'index.html'; }
        function goToShop() { window.location.href = 'index.html'; }
        function goToLogin() { window.location.href = 'index.html'; }
        function escapeHtml(text) { if(!text) return ''; return String(text).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }

        document.addEventListener('DOMContentLoaded', () => {
            checkUser();
        });

        window.setFilter = setFilter;
        window.reorderItems = reorderItems;
        window.cancelOrder = cancelOrder;
        window.downloadInvoice = downloadInvoice;
        window.goBack = goBack;
        window.goToShop = goToShop;
        window.goToLogin = goToLogin;
    </script>
</body>
</html>
