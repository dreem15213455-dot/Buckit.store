<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Orders - ZyMart+</title>
    <meta name="theme-color" content="#0B5A31">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { 
            --brand-green: #0B5A31; 
            --brand-green-dark: #083D21; 
            --brand-orange: #F59E0B; 
            --neutral-white: #FFFFFF; 
            --neutral-bg: #F9FAFB; 
            --neutral-border: #E5E7EB; 
            --neutral-gray: #6B7280; 
            --neutral-dark: #1A1A1A; 
            --danger: #EF4444; 
            --success: #10B981; 
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); 
            --shadow-sm: 0 1px 4px rgba(0,0,0,0.06); 
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08); 
            --radius-sm: 10px; 
            --radius-md: 14px; 
            --radius-lg: 18px; 
            --radius-full: 9999px; 
            --status-bar-height: env(safe-area-inset-top, 0px);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--neutral-bg); 
            color: var(--neutral-dark); 
            padding-bottom: 85px; 
            -webkit-tap-highlight-color: transparent; 
            -webkit-font-smoothing: antialiased; 
            min-height: 100vh; 
        }
        
        @keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes cartBounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
        
        .cart-badge.bounce { animation: cartBounce 0.3s ease; }
        
        .top-bar { 
            background: var(--brand-green); 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            z-index: 100; 
            padding: 10px 14px; 
            padding-top: calc(10px + var(--status-bar-height));
            display: flex; 
            align-items: center; 
            gap: 10px; 
            box-shadow: 0 2px 16px rgba(11,90,49,0.3); 
        }
        
        .back-btn { 
            width: 40px; 
            height: 40px; 
            min-width: 40px; 
            background: rgba(255,255,255,0.10); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            border: none; 
            color: white; 
            font-size: 15px; 
            text-decoration: none; 
        }
        
        .back-btn:active { background: rgba(255,255,255,0.22); transform: scale(0.93); }
        
        .top-title { 
            font-family: 'Poppins', sans-serif; 
            flex: 1; 
            font-size: 16px; 
            font-weight: 700; 
            color: white; 
        }
        
        .brand-zy { color: #A3E635; } 
        .brand-mart { color: #FDE047; }
        
        .cart-icon-btn {
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.10);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            color: white;
            font-size: 14px;
            position: relative;
            text-decoration: none;
        }
        
        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--brand-orange);
            color: white;
            border-radius: 50%;
            width: 17px;
            height: 17px;
            font-size: 8px;
            display: none;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--brand-green);
            font-weight: 700;
        }
        
        .cart-badge.show { display: flex; }
        
        .refresh-btn { 
            width: 40px; 
            height: 40px; 
            min-width: 40px; 
            background: rgba(255,255,255,0.10); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            border: none; 
            color: white; 
            font-size: 14px; 
        }
        
        .refresh-btn:active { background: rgba(255,255,255,0.22); }
        .refresh-btn.spinning i { animation: spin 0.7s linear infinite; }
        
        .main-content { 
            padding-top: 62px; 
            max-width: 600px; 
            margin: 0 auto; 
        }
        
        .tabs { 
            display: flex; 
            gap: 6px; 
            padding: 10px 14px; 
            background: white; 
            position: sticky; 
            top: 56px; 
            z-index: 50; 
            border-bottom: 1px solid var(--neutral-border); 
            overflow-x: auto; 
            scrollbar-width: none; 
        }
        
        .tabs::-webkit-scrollbar { display: none; }
        
        .tab-btn { 
            padding: 8px 14px; 
            border-radius: var(--radius-full); 
            font-size: 11px; 
            font-weight: 600; 
            cursor: pointer; 
            border: 1px solid var(--neutral-border); 
            background: white; 
            color: var(--neutral-gray); 
            white-space: nowrap; 
            font-family: 'Inter', sans-serif; 
            transition: all 0.15s ease; 
        }
        
        .tab-btn.active { 
            background: var(--brand-green); 
            color: white; 
            border-color: var(--brand-green); 
        }
        
        .tab-btn .count { 
            background: rgba(0,0,0,0.1); 
            padding: 1px 6px; 
            border-radius: 9999px; 
            font-size: 9px; 
            margin-left: 4px; 
        }
        
        .tab-btn.active .count { background: rgba(255,255,255,0.2); }
        
        .orders-list { padding: 10px 14px; }
        
        .order-card { 
            background: white; 
            border-radius: var(--radius-lg); 
            padding: 15px; 
            margin-bottom: 10px; 
            border: 1px solid var(--neutral-border); 
            box-shadow: var(--shadow-xs); 
            cursor: pointer; 
            animation: slideUp 0.3s ease; 
            transition: all 0.15s ease; 
        }
        
        .order-card:active { transform: scale(0.98); }
        
        .order-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            margin-bottom: 8px; 
        }
        
        .order-id { font-weight: 700; font-size: 14px; }
        .order-date { font-size: 11px; color: var(--neutral-gray); }
        
        .order-status { 
            padding: 4px 10px; 
            border-radius: var(--radius-full); 
            font-size: 10px; 
            font-weight: 700; 
            white-space: nowrap; 
        }
        
        .status-pending { background: #FFF8EB; color: #D97706; }
        .status-confirmed { background: #EFF6FF; color: #2563EB; }
        .status-delivered { background: #EDF7F1; color: #059669; }
        .status-cancelled { background: #FEF2F2; color: #DC2626; }
        
        .order-address { 
            font-size: 10px; 
            color: var(--neutral-gray); 
            margin-bottom: 6px; 
            display: flex; 
            align-items: center; 
            gap: 4px; 
            flex-wrap: wrap;
        }
        
        .order-address i { color: var(--brand-green); font-size: 9px; }
        
        .gps-badge { 
            display: inline-block; 
            background: #EDF7F1; 
            color: #0B5A31; 
            font-size: 8px; 
            padding: 2px 6px; 
            border-radius: 9999px; 
            font-weight: 600; 
            margin-left: 4px; 
        }
        
        .order-items { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 5px; 
            margin-bottom: 10px; 
        }
        
        .order-item-tag { 
            background: #F3F5F4; 
            padding: 4px 9px; 
            border-radius: var(--radius-full); 
            font-size: 10px; 
            color: var(--neutral-dark); 
            display: flex; 
            align-items: center; 
            gap: 4px; 
        }
        
        .order-item-variant { 
            color: var(--brand-green); 
            font-weight: 600; 
            font-size: 9px; 
        }
        
        .order-footer { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-top: 1px solid var(--neutral-border); 
            padding-top: 10px; 
        }
        
        .order-total { font-size: 17px; font-weight: 700; }
        .order-payment { font-size: 10px; color: var(--neutral-gray); }
        
        .reorder-btn { 
            background: #EDF7F1; 
            color: var(--brand-green); 
            border: 1px solid var(--brand-green); 
            padding: 8px 16px; 
            border-radius: var(--radius-full); 
            font-size: 11px; 
            font-weight: 600; 
            cursor: pointer; 
            font-family: 'Inter', sans-serif; 
            transition: all 0.15s ease; 
        }
        
        .reorder-btn:active { background: var(--brand-green); color: white; transform: scale(0.95); }
        
        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-state i { font-size: 56px; color: #D1D5DB; margin-bottom: 14px; display: block; }
        .empty-state h3 { font-family: 'Poppins', sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 6px; }
        .empty-state p { font-size: 12px; color: var(--neutral-gray); margin-bottom: 14px; }
        
        .btn-primary { 
            background: var(--brand-green); 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            border-radius: var(--radius-full); 
            font-size: 13px; 
            font-weight: 600; 
            cursor: pointer; 
            font-family: 'Inter', sans-serif; 
            display: inline-block; 
            margin: 4px; 
            text-decoration: none; 
        }
        
        .btn-primary:active { background: var(--brand-green-dark); transform: scale(0.96); }
        
        .btn-orange { 
            background: var(--brand-orange); 
            color: #1a1a1a; 
            border: none; 
            padding: 12px 24px; 
            border-radius: var(--radius-full); 
            font-size: 13px; 
            font-weight: 600; 
            cursor: pointer; 
            font-family: 'Inter', sans-serif; 
        }
        
        .btn-outline { 
            background: white; 
            color: var(--brand-green); 
            border: 2px solid var(--brand-green); 
            padding: 10px 20px; 
            border-radius: var(--radius-full); 
            font-size: 12px; 
            font-weight: 600; 
            cursor: pointer; 
            font-family: 'Inter', sans-serif; 
        }
        
        .login-prompt { text-align: center; padding: 60px 20px; }
        .login-prompt i { font-size: 56px; color: #D1D5DB; margin-bottom: 14px; display: block; }
        .login-prompt h3 { font-family: 'Poppins', sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 6px; }
        .login-prompt p { color: var(--neutral-gray); font-size: 13px; margin-bottom: 16px; }
        
        .bottom-nav { 
            background: white; 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            display: flex; 
            justify-content: space-around; 
            align-items: center;
            padding: 5px 14px 10px; 
            box-shadow: 0 -4px 16px rgba(0,0,0,0.03); 
            z-index: 100; 
            border-top: 1px solid var(--neutral-border); 
        }
        
        .nav-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            font-size: 9px; 
            font-weight: 500; 
            color: var(--neutral-gray); 
            cursor: pointer; 
            padding: 3px 10px; 
            border-radius: var(--radius-full); 
            border: none; 
            background: transparent; 
            font-family: 'Inter', sans-serif; 
            text-decoration: none; 
            position: relative;
        }
        
        .nav-item:active { background: #EDF7F1; }
        .nav-item.active { color: var(--brand-green); font-weight: 600; }
        .nav-item i { font-size: 18px; margin-bottom: 1px; }
        
        .nav-cart-count { 
            position: absolute; 
            top: -2px; 
            right: 2px; 
            background: var(--brand-orange); 
            color: white; 
            border-radius: 50%; 
            width: 16px; 
            height: 16px; 
            font-size: 8px; 
            display: none; 
            align-items: center; 
            justify-content: center; 
            border: 2px solid white; 
            font-weight: 700; 
        }
        
        .nav-cart-count.show { display: flex; }
        
        .toast { 
            position: fixed; 
            bottom: 95px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: var(--neutral-dark); 
            color: white; 
            padding: 10px 20px; 
            border-radius: var(--radius-full); 
            font-size: 12px; 
            z-index: 200; 
            opacity: 0; 
            visibility: hidden; 
            white-space: nowrap; 
            box-shadow: var(--shadow-md); 
            transition: all 0.3s ease; 
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .toast.show { opacity: 1; visibility: visible; }
        .toast.error { background: var(--danger); }
        .toast.success { background: var(--success); }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <span class="top-title"><span class="brand-zy">Zy</span><span class="brand-mart">Mart</span> Orders</span>
    <a href="cart.html" class="cart-icon-btn">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-badge" id="cartBadge">0</span>
    </a>
    <button class="refresh-btn" id="refreshBtn" onclick="loadOrders()"><i class="fas fa-sync-alt"></i></button>
</div>

<div class="tabs" id="tabsBar">
    <button class="tab-btn active" onclick="filterOrders('all',this)">All</button>
    <button class="tab-btn" onclick="filterOrders('pending',this)">⏳ Pending</button>
    <button class="tab-btn" onclick="filterOrders('confirmed',this)">✅ Confirmed</button>
    <button class="tab-btn" onclick="filterOrders('delivered',this)">📦 Delivered</button>
    <button class="tab-btn" onclick="filterOrders('cancelled',this)">❌ Cancelled</button>
</div>

<div class="main-content" id="mainContent">
    <div style="text-align:center;padding:50px;">
        <div style="width:32px;height:32px;border:2.5px solid #E5E7EB;border-top-color:#F59E0B;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto;"></div>
    </div>
</div>

<nav class="bottom-nav">
    <a class="nav-item" href="index.html"><i class="fas fa-home"></i><span>Home</span></a>
    <a class="nav-item" href="cart.html">
        <i class="fas fa-shopping-cart"></i>
        <span>Cart</span>
        <span class="nav-cart-count" id="navCartCount">0</span>
    </a>
    <a class="nav-item active" href="orders.html"><i class="fas fa-receipt"></i><span>Orders</span></a>
    <a class="nav-item" href="profile.html"><i class="fas fa-user"></i><span>Profile</span></a>
    <a class="nav-item" href="more.html"><i class="fas fa-ellipsis-h"></i><span>More</span></a>
</nav>

<div class="toast" id="toastMsg"><span id="toastText"></span></div>

<script>
(function() {
    'use strict';
    
    var CONFIG = {
        SUPABASE_URL: 'https://zwajyovemwdqtkecipeb.supabase.co',
        SUPABASE_KEY: 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1'
    };
    
    var sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
    var currentUser = null, allOrders = [], currentFilter = 'all';
    
    function getEl(id) { return document.getElementById(id); }
    function esc(s) { if(!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function safeJSON(s, f) { try { return s ? JSON.parse(s) : f; } catch(e) { return f; } }
    
    function showToast(m, type) { 
        var t = getEl('toastMsg'), s = getEl('toastText'); 
        if (!t || !s) return; 
        s.textContent = m; 
        t.className = 'toast';
        if (type === 'error') t.classList.add('error');
        else if (type === 'success') t.classList.add('success');
        t.classList.add('show'); 
        clearTimeout(t._timer); 
        t._timer = setTimeout(function() { 
            t.classList.remove('show','error','success'); 
        }, 2500); 
    }
    
    // ==================== CART MANAGER ====================
    var CartManager = {
        getCart: function() {
            return safeJSON(localStorage.getItem('zymart_cart'), []);
        },
        
        saveCart: function(cart) {
            try { localStorage.setItem('zymart_cart', JSON.stringify(cart)); } catch(e) {}
            this.updateBadges();
        },
        
        getTotalItems: function() {
            var cart = this.getCart();
            return cart.reduce(function(sum, item) { return sum + (item.quantity || 1); }, 0);
        },
        
        updateBadges: function() {
            var totalItems = this.getTotalItems();
            
            // Top bar badge
            var topBadge = getEl('cartBadge');
            if (topBadge) {
                topBadge.textContent = totalItems;
                if (totalItems > 0) {
                    topBadge.classList.add('show');
                } else {
                    topBadge.classList.remove('show');
                }
            }
            
            // Bottom nav badge
            var navBadge = getEl('navCartCount');
            if (navBadge) {
                navBadge.textContent = totalItems;
                if (totalItems > 0) {
                    navBadge.classList.add('show');
                } else {
                    navBadge.classList.remove('show');
                }
            }
        }
    };
    
    function fmtWeight(w, u) {
        if (!w) return '';
        var nw = parseFloat(w);
        if (isNaN(nw)) return String(w);
        var unitLower = u ? u.toLowerCase() : '';
        if (unitLower === 'gram' || unitLower === 'g') return nw >= 1000 ? (nw/1000).toFixed(1).replace(/\.0$/,'') + ' kg' : nw + ' g';
        if (unitLower === 'kg') return nw + ' kg';
        if (unitLower === 'liter' || unitLower === 'l') return nw + ' L';
        if (unitLower === 'ml') return nw + ' ml';
        return nw + ' ' + (u || '');
    }
    
    async function checkUser() { 
        try { 
            var r = await sb.auth.getSession(); 
            if (r && r.data && r.data.session) { 
                currentUser = r.data.session.user; 
                return true; 
            }
        } catch(e) {}
        
        try {
            var session = JSON.parse(localStorage.getItem('zymart_session') || 'null');
            if (session && session.userId) { 
                currentUser = { id: session.userId, phone: session.phone }; 
                return true; 
            }
        } catch(e) {}
        
        currentUser = null; 
        return false;
    }
    
    function goToLogin() { 
        try { sessionStorage.setItem('zymart_redirect_after_login', 'orders.html'); } catch(e) {}
        window.location.href = 'login.html'; 
    }
    
    async function loadOrders() {
        var btn = getEl('refreshBtn');
        if (btn) btn.classList.add('spinning');
        
        if (!currentUser) { 
            var li = await checkUser(); 
            if (!li) { 
                getEl('mainContent').innerHTML = '<div class="login-prompt"><i class="fas fa-user-lock"></i><h3>Login Required</h3><p>Please login to view your orders</p><button class="btn-orange" onclick="goToLogin()"><i class="fas fa-sign-in-alt"></i> Login / Register</button></div>'; 
                getEl('tabsBar').style.display = 'none';
                if (btn) btn.classList.remove('spinning');
                return; 
            } 
        }
        
        try {
            var r = await sb.from('orders')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: false })
                .limit(50);
                
            allOrders = (r && r.data) ? r.data : [];
            
            updateTabCounts();
            getEl('tabsBar').style.display = 'flex';
            renderOrders();
            
        } catch(e) { 
            console.error('[Orders]', e);
            getEl('mainContent').innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>Failed to Load Orders</h3><p>Please check your connection</p><button class="btn-primary" onclick="loadOrders()">🔄 Retry</button></div>'; 
        }
        
        if (btn) btn.classList.remove('spinning');
    }
    
    // ==================== TAB COUNTS (FIXED) ====================
    function updateTabCounts() {
        var counts = { all: allOrders.length, pending: 0, confirmed: 0, delivered: 0, cancelled: 0 };
        
        for (var i = 0; i < allOrders.length; i++) {
            var s = allOrders[i].status;
            if (counts[s] !== undefined) counts[s]++;
        }
        
        var tabs = document.querySelectorAll('.tab-btn');
        var keys = ['all', 'pending', 'confirmed', 'delivered', 'cancelled'];
        
        for (var j = 0; j < tabs.length; j++) {
            var key = keys[j];
            var count = counts[key] || 0;
            
            // Remove existing count span
            var existingCount = tabs[j].querySelector('.count');
            if (existingCount) existingCount.remove();
            
            // Add count if > 0
            if (count > 0) {
                var countSpan = document.createElement('span');
                countSpan.className = 'count';
                countSpan.textContent = count;
                tabs[j].appendChild(countSpan);
            }
        }
    }
    
    window.filterOrders = function(f, btn) { 
        currentFilter = f; 
        document.querySelectorAll('.tab-btn').forEach(function(el) { 
            el.classList.remove('active'); 
        }); 
        if (btn) btn.classList.add('active'); 
        renderOrders(); 
    };
    
    function getStatusBadge(s) { 
        var m = { 
            pending: 'status-pending', 
            confirmed: 'status-confirmed', 
            delivered: 'status-delivered', 
            cancelled: 'status-cancelled' 
        }; 
        return m[s] || 'status-pending'; 
    }
    
    function getStatusIcon(s) {
        var m = { pending: '⏳', confirmed: '✅', delivered: '📦', cancelled: '❌' };
        return m[s] || '⏳';
    }
    
    function getStatusText(s) { 
        var m = { pending: 'Pending', confirmed: 'Confirmed', delivered: 'Delivered', cancelled: 'Cancelled' }; 
        return m[s] || s; 
    }
    
    function renderOrders() {
        var c = getEl('mainContent');
        var filtered = currentFilter === 'all' ? allOrders : allOrders.filter(function(o) { 
            return o.status === currentFilter; 
        });
        
        if (!filtered.length) {
            c.innerHTML = '<div class="empty-state">' +
                '<i class="fas fa-receipt"></i>' +
                '<h3>' + getStatusIcon(currentFilter) + ' No ' + (currentFilter === 'all' ? '' : getStatusText(currentFilter) + ' ') + 'Orders</h3>' +
                '<p>' + (currentFilter === 'all' ? 'Place your first order now!' : 'No orders in this category') + '</p>' +
                '<a href="products.html" class="btn-primary"><i class="fas fa-shopping-bag"></i> Browse Products</a><br>' +
                '<button class="btn-outline" onclick="window.location.href=\'index.html\'"><i class="fas fa-home"></i> Go Home</button>' +
                '</div>';
            return;
        }
        
        var h = '<div class="orders-list">';
        
        for (var i = 0; i < filtered.length; i++) {
            var o = filtered[i];
            var oid = '#' + (o.id || '').substring(0, 8).toUpperCase();
            var date = o.created_at ? new Date(o.created_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
            var time = o.created_at ? new Date(o.created_at).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) : '';
            var items = [];
            
            try { 
                items = typeof o.items === 'string' ? JSON.parse(o.items) : (o.items || []); 
            } catch(e) { 
                items = []; 
            }
            
            h += '<div class="order-card" onclick="window.location.href=\'order-details.html?id=' + o.id + '\'">';
            h += '<div class="order-header">';
            h += '<div><div class="order-id">' + oid + '</div><div class="order-date">📅 ' + date + ' · ' + time + '</div></div>';
            h += '<span class="order-status ' + getStatusBadge(o.status) + '">' + getStatusIcon(o.status) + ' ' + getStatusText(o.status) + '</span>';
            h += '</div>';
            
            // Address
            if (o.customer_address) {
                h += '<div class="order-address"><i class="fas fa-map-marker-alt"></i> ' + 
                     esc((o.customer_address || '').substring(0, 45)) + 
                     (o.customer_address && o.customer_address.length > 45 ? '...' : '');
                if (o.location_verified) {
                    h += '<span class="gps-badge">📍 GPS Verified</span>';
                }
                h += '</div>';
            }
            
            // Items
            h += '<div class="order-items">';
            var maxShow = 3;
            
            for (var j = 0; j < Math.min(items.length, maxShow); j++) {
                var it = items[j];
                var itName = it.product_name || it.name || 'Item';
                var variantLabel = '';
                
                if (it.variant_weight) {
                    variantLabel = ' · ' + fmtWeight(it.variant_weight, it.variant_unit);
                }
                
                var qty = it.quantity || 1;
                h += '<span class="order-item-tag">' + esc(itName) + ' ×' + qty + 
                     '<span class="order-item-variant">' + variantLabel + '</span></span>';
            }
            
            if (items.length > maxShow) {
                h += '<span class="order-item-tag">+' + (items.length - maxShow) + ' more</span>';
            }
            h += '</div>';
            
            // Footer
            h += '<div class="order-footer">';
            h += '<div><div class="order-total">₹' + (parseFloat(o.total_amount) || 0).toLocaleString('en-IN') + '</div>';
            h += '<div class="order-payment">💵 ' + (o.payment_method === 'cod' ? 'Cash on Delivery' : (o.payment_method || 'COD')) + '</div></div>';
            h += '<button class="reorder-btn" onclick="event.stopPropagation();reorder(\'' + o.id + '\')"><i class="fas fa-redo"></i> Reorder</button>';
            h += '</div>';
            h += '</div>';
        }
        
        h += '</div>';
        c.innerHTML = h;
    }
    
    // ==================== REORDER (FIXED) ====================
    window.reorder = function(oid) {
        var order = allOrders.find(function(o) { return o.id === oid; });
        if (!order) { 
            showToast('Order not found', 'error'); 
            return; 
        }
        
        var items = [];
        try { 
            items = typeof order.items === 'string' ? JSON.parse(order.items) : order.items; 
        } catch(e) { 
            items = []; 
        }
        
        if (!items.length) {
            showToast('No items in this order', 'error');
            return;
        }
        
        var cart = CartManager.getCart();
        var addedCount = 0;
        
        for (var i = 0; i < items.length; i++) {
            var item = items[i];
            var pid = item.product_id || item.id;
            if (!pid) continue;
            
            var cartKey = item.variant_key || pid;
            var found = cart.find(function(c) { 
                return c.cartKey === cartKey || c.id === pid; 
            });
            
            if (found) {
                found.quantity += (item.quantity || 1);
            } else {
                cart.push({
                    id: pid,
                    cartKey: cartKey,
                    name: item.product_name || item.name || 'Product',
                    price: item.price || 0,
                    image: item.image || '',
                    quantity: item.quantity || 1,
                    variantKey: item.variant_key || null,
                    variantWeight: item.variant_weight || null,
                    variantUnit: item.variant_unit || null,
                    stock: 999
                });
            }
            addedCount++;
        }
        
        CartManager.saveCart(cart);
        showToast('🛒 ' + addedCount + ' item(s) added to cart!', 'success');
        
        setTimeout(function() { 
            window.location.href = 'cart.html'; 
        }, 800);
    };
    
    // ==================== EVENT LISTENERS ====================
    window.addEventListener('storage', function(e) {
        if(e.key === 'zymart_cart') {
            CartManager.updateBadges();
        }
    });
    
    document.addEventListener('visibilitychange', function() {
        if(document.visibilityState === 'visible') {
            CartManager.updateBadges();
        }
    });
    
    // ==================== INITIALIZATION ====================
    document.addEventListener('DOMContentLoaded', async function() { 
        CartManager.updateBadges();
        
        var li = await checkUser(); 
        if (li) { 
            loadOrders(); 
        } else { 
            getEl('mainContent').innerHTML = '<div class="login-prompt"><i class="fas fa-user-lock"></i><h3>Login Required</h3><p>Please login to view your orders</p><button class="btn-orange" onclick="goToLogin()"><i class="fas fa-sign-in-alt"></i> Login / Register</button></div>'; 
            getEl('tabsBar').style.display = 'none';
        } 
    });
    
    // ==================== EXPOSE GLOBAL FUNCTIONS ====================
    window.loadOrders = loadOrders;
    window.filterOrders = filterOrders;
    window.reorder = reorder;
    window.CartManager = CartManager;
    
})();
</script>
</body>
</html>
