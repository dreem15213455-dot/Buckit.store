<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Shop Dashboard - Zatpat</title>
    <meta name="theme-color" content="#16A34A">
    
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/compressorjs@1.2.1/dist/compressor.min.js"></script>
    
    <style>
        :root {
            --primary: #16A34A;
            --primary-light: #22C55E;
            --primary-bg-light: #F0FDF4;
            --accent-orange: #F97316;
            --bg-light: #F9FAFB;
            --card-white: #FFFFFF;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --border-light: #E5E7EB;
            --danger: #EF4444;
            --success: #10B981;
            --warning: #F59E0B;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-full: 9999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
            padding-bottom: 85px;
        }

        /* Top Bar */
        .top-bar {
            background: var(--card-white);
            position: fixed;
            top: 0; left: 0; width: 100%;
            z-index: 1000;
            padding: 12px 16px;
            box-shadow: var(--shadow-sm);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .back-btn {
            width: 40px; height: 40px;
            background: var(--bg-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .brand-name { font-size: 22px; font-weight: 800; }
        .brand-name .normal { color: var(--text-primary); }
        .brand-name .pat { color: var(--primary); }
        .page-title { flex: 1; font-weight: 600; font-size: 16px; text-align: center; }
        .logout-btn {
            background: rgba(239,68,68,0.1);
            color: var(--danger);
            border: none;
            padding: 8px 12px;
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Main Content */
        .main-content {
            padding-top: 80px;
            padding-bottom: 20px;
            max-width: 1200px;
            margin: 0 auto;
            padding-left: 16px;
            padding-right: 16px;
        }

        /* Shop Header */
        .shop-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            margin: 16px 0;
            padding: 24px;
            border-radius: var(--radius-xl);
            color: white;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .shop-avatar {
            width: 70px; height: 70px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            overflow: hidden;
        }
        .shop-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .shop-info h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        .shop-info p { font-size: 12px; opacity: 0.9; }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 600;
            margin-top: 8px;
            background: rgba(255,255,255,0.2);
        }

        /* Tabs */
        .tabs {
            display: flex;
            margin: 16px 0;
            background: var(--card-white);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            overflow: hidden;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 14px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 13px;
        }
        .tab i { margin-right: 6px; }
        .tab.active { background: var(--primary); color: white; }

        /* Section Header */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 16px;
        }
        .section-header h3 { font-size: 16px; font-weight: 700; margin: 0; }

        /* Buttons */
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-success { background: var(--success); color: white; border: none; padding: 8px 16px; border-radius: var(--radius-full); font-size: 12px; cursor: pointer; }
        .btn-danger { background: var(--danger); color: white; border: none; padding: 8px 16px; border-radius: var(--radius-full); font-size: 12px; cursor: pointer; }
        .btn-warning { background: var(--warning); color: white; border: none; padding: 8px 16px; border-radius: var(--radius-full); font-size: 12px; cursor: pointer; }
        .btn-sm { padding: 6px 12px; font-size: 11px; }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .product-card {
            background: var(--card-white);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border-light);
        }
        .product-img {
            width: 100%;
            aspect-ratio: 1/1;
            background: var(--bg-light);
            position: relative;
        }
        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-stock {
            position: absolute;
            top: 6px;
            right: 6px;
            background: white;
            padding: 2px 8px;
            border-radius: var(--radius-full);
            font-size: 10px;
            font-weight: 600;
        }
        .product-info { padding: 10px; }
        .product-name { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
        .product-price { color: var(--primary); font-weight: 700; font-size: 14px; }
        .product-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        /* Orders List */
        .orders-list {
            background: var(--card-white);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            overflow: hidden;
        }
        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-light);
        }
        .order-item:last-child { border-bottom: none; }
        .order-info { flex: 1; }
        .order-id { font-weight: 700; font-size: 13px; }
        .order-meta { font-size: 11px; color: var(--text-secondary); }
        .order-amount { font-weight: 700; color: var(--primary); margin: 0 12px; }
        .order-status {
            padding: 4px 10px;
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 600;
        }
        .status-pending { background: #FEF3C7; color: #D97706; }
        .status-confirmed { background: #D1FAE5; color: #059669; }
        .status-delivered { background: #DBEAFE; color: #2563EB; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        .modal-container {
            background: var(--card-white);
            border-radius: var(--radius-xl);
            width: 90%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 24px;
        }
        .modal-container h3 { font-size: 18px; font-weight: 700; margin-bottom: 20px; }

        /* Form */
        .form-group { margin-bottom: 18px; }
        .form-label { font-weight: 600; font-size: 13px; margin-bottom: 6px; display: block; }
        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            font-size: 14px;
        }
        .form-control:focus { outline: none; border-color: var(--primary); }

        /* Image Upload */
        .image-upload-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 8px;
        }
        .image-upload-box {
            aspect-ratio: 1/1;
            border: 2px dashed var(--border-light);
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: var(--bg-light);
            position: relative;
            overflow: hidden;
        }
        .image-upload-box i { font-size: 24px; color: var(--text-secondary); }
        .image-upload-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0; left: 0;
        }
        .image-upload-box .remove-btn {
            position: absolute;
            top: 2px; right: 2px;
            background: var(--danger);
            color: white;
            border-radius: 50%;
            width: 20px; height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            cursor: pointer;
            z-index: 5;
        }

        /* Attribute Row */
        .attribute-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }
        .attribute-row .form-control { flex: 1; }

        /* Toast */
        .toast-notification {
            position: fixed;
            bottom: 90px; left: 50%;
            transform: translateX(-50%);
            background: var(--text-primary);
            color: white;
            padding: 12px 24px;
            border-radius: var(--radius-full);
            font-size: 13px;
            z-index: 10050;
            display: none;
            white-space: nowrap;
        }
        .toast-notification.show { display: flex; }

        .loading-spinner { text-align: center; padding: 60px; }
        .no-data { text-align: center; padding: 40px; color: var(--text-secondary); }

        /* Prompt Cards */
        .prompt-card {
            text-align: center;
            padding: 60px 20px;
            background: var(--card-white);
            border-radius: var(--radius-xl);
            margin: 20px 0;
        }
        .prompt-card i { font-size: 64px; margin-bottom: 20px; }
        .prompt-card h3 { font-size: 20px; margin-bottom: 12px; }
        .prompt-card p { color: var(--text-secondary); margin-bottom: 24px; }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
    <div class="brand-name"><span class="normal">Zat</span><span class="pat">pat</span></div>
    <div class="page-title" id="pageTitle">Dashboard</div>
    <button class="logout-btn" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
</div>

<div class="main-content" id="mainContent">
    <div class="loading-spinner"><i class="fas fa-spinner fa-spin fa-2x" style="color:var(--primary);"></i><p>Loading...</p></div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal-container" id="modalContent"></div>
</div>

<div id="toastMsg" class="toast-notification"><span id="toastText"></span></div>

<script>
    // ========== SUPABASE ==========
    const supabaseUrl = 'https://zwajyovemwdqtkecipeb.supabase.co';
    const supabaseKey = 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    // ========== STATE ==========
    let currentUser = null;
    let shop = null;
    let allCategories = [];
    let allProducts = [];
    let allOrders = [];
    let currentTab = 'products';
    let editProductId = null;
    let productImages = [null, null, null, null];
    let productAttributes = [];

    // ========== UTILITY ==========
    function showToast(msg, isError = false) {
        const t = document.getElementById('toastMsg');
        document.getElementById('toastText').innerHTML = msg;
        t.style.background = isError ? '#EF4444' : '#111827';
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    function escapeHtml(text) {
        if (!text) return '';
        return String(text).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]);
    }

    function goBack() { window.history.back(); }

    async function handleLogout() { 
        if(confirm('Logout?')) { 
            await supabaseClient.auth.signOut(); 
            localStorage.clear(); 
            window.location.href = 'index.html'; 
        } 
    }

    async function compressImage(file) {
        return new Promise((resolve) => {
            new Compressor(file, { 
                quality: 0.7, 
                maxWidth: 800, 
                maxHeight: 800,
                convertSize: 500000,
                success: resolve, 
                error: (err) => resolve(file)
            });
        });
    }

    // ========== AUTH CHECK WITH ROLE ==========
    async function checkUser() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) { 
            showLoginPrompt(); 
            return false; 
        }
        currentUser = user;
        
        // CHECK USER ROLE - Get from users table
        const { data: profile } = await supabaseClient
            .from('users')
            .select('role, name')
            .eq('id', user.id)
            .single();
        
        // If user is ADMIN, redirect to admin panel
        if (profile?.role === 'admin') {
            showAdminRedirectPrompt();
            return false;
        }
        
        // If user is SHOP_OWNER or no role (default user with shop)
        const { data: shopData } = await supabaseClient
            .from('shops')
            .select('*')
            .eq('owner_id', user.id)
            .single();
        
        if (!shopData) { 
            showNoShopPrompt(); 
            return false; 
        }
        
        shop = shopData;
        
        if (shop.status !== 'approved') { 
            showPendingApproval(); 
            return false; 
        }
        
        return true;
    }

    function showLoginPrompt() {
        document.getElementById('mainContent').innerHTML = `
            <div class="prompt-card">
                <i class="fas fa-lock" style="color:var(--text-secondary);"></i>
                <h3>Please Login</h3>
                <p>You need to login to access shop dashboard</p>
                <button class="btn-primary" onclick="window.location.href='index.html'">
                    <i class="fas fa-sign-in-alt"></i> Go to Login
                </button>
            </div>`;
    }

    function showAdminRedirectPrompt() {
        document.getElementById('mainContent').innerHTML = `
            <div class="prompt-card">
                <i class="fas fa-crown" style="color:#F59E0B;"></i>
                <h3>Admin Account Detected</h3>
                <p>Shop dashboard is only for shop owners. Please use Admin Panel.</p>
                <button class="btn-primary" onclick="window.location.href='admin-panel.html'">
                    <i class="fas fa-tachometer-alt"></i> Go to Admin Panel
                </button>
                <button class="btn-secondary" style="margin-top:12px;background:transparent;border:1px solid var(--border-light);border-radius:var(--radius-full);padding:10px 20px;cursor:pointer;" onclick="handleLogout()">
                    <i class="fas fa-sign-out-alt"></i> Logout & Switch Account
                </button>
            </div>`;
    }

    function showNoShopPrompt() {
        document.getElementById('mainContent').innerHTML = `
            <div class="prompt-card">
                <i class="fas fa-store" style="color:var(--text-secondary);"></i>
                <h3>No Shop Found</h3>
                <p>You haven't registered a shop yet.</p>
                <button class="btn-primary" onclick="window.location.href='shop-register.html'">
                    <i class="fas fa-plus"></i> Register Your Shop
                </button>
                <button class="btn-secondary" style="margin-top:12px;background:transparent;border:1px solid var(--border-light);border-radius:var(--radius-full);padding:10px 20px;cursor:pointer;" onclick="window.location.href='index.html'">
                    <i class="fas fa-home"></i> Back to Home
                </button>
            </div>`;
    }

    function showPendingApproval() {
        document.getElementById('mainContent').innerHTML = `
            <div class="prompt-card">
                <i class="fas fa-clock" style="color:var(--warning);"></i>
                <h3>Shop Pending Approval</h3>
                <p>Your shop "${escapeHtml(shop?.name || '')}" is under review.</p>
                <p style="font-size:13px;">You'll be able to access dashboard once approved.</p>
                <button class="btn-secondary" style="margin-top:12px;background:transparent;border:1px solid var(--border-light);border-radius:var(--radius-full);padding:10px 20px;cursor:pointer;" onclick="handleLogout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>`;
    }

    // ========== LOAD DATA ==========
    async function loadData() {
        const [categories, products, orders] = await Promise.all([
            supabaseClient.from('categories').select('*').eq('is_active', true).is('parent_id', null),
            supabaseClient.from('products').select('*').eq('shop_id', shop.id).order('created_at', { ascending: false }),
            supabaseClient.from('orders').select('*').eq('shop_id', shop.id).order('created_at', { ascending: false })
        ]);
        
        allCategories = categories.data || [];
        allProducts = products.data || [];
        allOrders = orders.data || [];
    }

    // ========== RENDER DASHBOARD ==========
    async function renderDashboard() {
        await loadData();
        
        document.getElementById('mainContent').innerHTML = `
            <div class="shop-header">
                <div class="shop-avatar">
                    ${shop.image_url ? `<img src="${shop.image_url}">` : '<i class="fas fa-store"></i>'}
                </div>
                <div class="shop-info">
                    <h2>${escapeHtml(shop.name)}</h2>
                    <p>${shop.city || 'Location not set'} • ${shop.phone}</p>
                    <span class="status-badge">${shop.status}</span>
                </div>
            </div>

            <div class="tabs">
                <div class="tab ${currentTab === 'products' ? 'active' : ''}" onclick="switchTab('products')">
                    <i class="fas fa-box"></i> Products (${allProducts.length})
                </div>
                <div class="tab ${currentTab === 'orders' ? 'active' : ''}" onclick="switchTab('orders')">
                    <i class="fas fa-receipt"></i> Orders (${allOrders.length})
                </div>
            </div>

            <div id="tabContent"></div>
        `;
        
        renderTabContent();
    }

    window.switchTab = function(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.closest('.tab').classList.add('active');
        renderTabContent();
    };

    function renderTabContent() {
        const container = document.getElementById('tabContent');
        
        if (currentTab === 'products') {
            container.innerHTML = `
                <div class="section-header">
                    <h3><i class="fas fa-box"></i> My Products</h3>
                    <button class="btn-primary" onclick="showAddProductModal()">
                        <i class="fas fa-plus"></i> Add Product
                    </button>
                </div>
                ${renderProductsGrid()}
            `;
        } else {
            container.innerHTML = `
                <div class="section-header">
                    <h3><i class="fas fa-receipt"></i> Orders</h3>
                    <button class="btn-primary" onclick="location.reload()">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
                ${renderOrdersList()}
            `;
        }
    }

    function renderProductsGrid() {
        if (!allProducts.length) {
            return '<div class="no-data"><i class="fas fa-box-open"></i><p>No products yet. Click "Add Product" to start.</p></div>';
        }
        
        let html = '<div class="products-grid">';
        allProducts.forEach(p => {
            const img = p.images?.[0] || 'https://placehold.co/200/F0FDF4/16A34A?text=📦';
            html += `
                <div class="product-card">
                    <div class="product-img">
                        <img src="${img}" loading="lazy">
                        <span class="product-stock">${p.stock || 0} left</span>
                    </div>
                    <div class="product-info">
                        <div class="product-name">${escapeHtml(p.name)}</div>
                        <div class="product-price">₹${p.offer_price || p.price}</div>
                        <div class="product-actions">
                            <button class="btn-warning btn-sm" onclick="editProduct('${p.id}')"><i class="fas fa-edit"></i></button>
                            <button class="btn-danger btn-sm" onclick="deleteProduct('${p.id}')"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>
            `;
        });
        html += '</div>';
        return html;
    }

    function renderOrdersList() {
        if (!allOrders.length) {
            return '<div class="no-data"><i class="fas fa-receipt"></i><p>No orders yet.</p></div>';
        }
        
        let html = '<div class="orders-list">';
        allOrders.forEach(o => {
            html += `
                <div class="order-item">
                    <div class="order-info">
                        <div class="order-id">#${o.id?.slice(0,8).toUpperCase()}</div>
                        <div class="order-meta">${o.customer_name || 'Customer'} • ${new Date(o.created_at).toLocaleDateString()}</div>
                    </div>
                    <div class="order-amount">₹${o.total_amount || 0}</div>
                    <div>
                        <span class="order-status status-${o.status || 'pending'}">${o.status || 'pending'}</span>
                    </div>
                    <select class="form-control" style="width:120px; margin-left:10px;" onchange="updateOrderStatus('${o.id}', this.value)">
                        <option value="pending" ${o.status === 'pending' ? 'selected' : ''}>Pending</option>
                        <option value="confirmed" ${o.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
                        <option value="delivered" ${o.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                        <option value="cancelled" ${o.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                    </select>
                </div>
            `;
        });
        html += '</div>';
        return html;
    }

    window.updateOrderStatus = async function(orderId, status) {
        await supabaseClient.from('orders').update({ status }).eq('id', orderId);
        showToast('Order status updated');
        await loadData();
        renderTabContent();
    };

    // ========== PRODUCT MODAL ==========
    window.showAddProductModal = function() {
        editProductId = null;
        productImages = [null, null, null, null];
        productAttributes = [];
        showProductModal();
    };

    window.editProduct = function(id) {
        const product = allProducts.find(p => p.id === id);
        if (!product) return;
        
        editProductId = id;
        productImages = product.images || [null, null, null, null];
        while (productImages.length < 4) productImages.push(null);
        productAttributes = product.attributes || [];
        
        showProductModal(product);
    };

    function showProductModal(product = null) {
        const mainCategories = allCategories.map(c => 
            `<option value="${c.id}" ${product?.category_id === c.id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`
        ).join('');

        let attributesHtml = '';
        productAttributes.forEach((attr, i) => {
            attributesHtml += `
                <div class="attribute-row">
                    <input type="text" class="form-control" placeholder="Name (e.g., Size)" value="${escapeHtml(attr.name)}" id="attrName${i}">
                    <input type="text" class="form-control" placeholder="Value (e.g., XL, Red)" value="${escapeHtml(attr.value)}" id="attrValue${i}">
                    <button class="btn-danger btn-sm" onclick="removeAttribute(${i})"><i class="fas fa-times"></i></button>
                </div>
            `;
        });

        document.getElementById('modalContent').innerHTML = `
            <h3>${product ? 'Edit' : 'Add'} Product</h3>
            
            <div class="form-group">
                <label class="form-label">Product Name *</label>
                <input type="text" id="prodName" class="form-control" value="${escapeHtml(product?.name || '')}">
            </div>
            
            <div class="form-group">
                <label class="form-label">Category *</label>
                <select id="prodCategory" class="form-control">
                    <option value="">Select Category</option>
                    ${mainCategories}
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea id="prodDesc" class="form-control" rows="2">${escapeHtml(product?.description || '')}</textarea>
            </div>
            
            <div class="row">
                <div class="col-6">
                    <div class="form-group">
                        <label class="form-label">Price (₹) *</label>
                        <input type="number" id="prodPrice" class="form-control" value="${product?.price || ''}" step="0.01">
                    </div>
                </div>
                <div class="col-6">
                    <div class="form-group">
                        <label class="form-label">Offer Price (₹)</label>
                        <input type="number" id="prodOfferPrice" class="form-control" value="${product?.offer_price || ''}" step="0.01">
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-6">
                    <div class="form-group">
                        <label class="form-label">Stock Quantity</label>
                        <input type="number" id="prodStock" class="form-control" value="${product?.stock || 1}">
                    </div>
                </div>
                <div class="col-6">
                    <div class="form-group">
                        <label class="form-label">Unit</label>
                        <select id="prodUnit" class="form-control">
                            <option value="piece" ${product?.unit === 'piece' ? 'selected' : ''}>Piece</option>
                            <option value="kg" ${product?.unit === 'kg' ? 'selected' : ''}>Kilogram (kg)</option>
                            <option value="g" ${product?.unit === 'g' ? 'selected' : ''}>Gram (g)</option>
                            <option value="ltr" ${product?.unit === 'ltr' ? 'selected' : ''}>Liter (ltr)</option>
                            <option value="ml" ${product?.unit === 'ml' ? 'selected' : ''}>Milliliter (ml)</option>
                            <option value="dozen" ${product?.unit === 'dozen' ? 'selected' : ''}>Dozen</option>
                            <option value="packet" ${product?.unit === 'packet' ? 'selected' : ''}>Packet</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Product Attributes (Size/Color/Weight)</label>
                <div id="attributesContainer">${attributesHtml}</div>
                <button class="btn-primary btn-sm" onclick="addAttribute()" style="margin-top:8px;">
                    <i class="fas fa-plus"></i> Add Attribute
                </button>
            </div>
            
            <div class="form-group">
                <label class="form-label">Product Images (Max 4)</label>
                <div class="image-upload-grid">
                    ${[0,1,2,3].map(i => `
                        <div class="image-upload-box" onclick="document.getElementById('imgInput${i}').click()">
                            ${productImages[i] ? 
                                `<img src="${productImages[i]}"><span class="remove-btn" onclick="event.stopPropagation(); removeImage(${i})">✕</span>` : 
                                '<i class="fas fa-cloud-upload-alt"></i><span style="font-size:10px;">Upload</span>'
                            }
                            <input type="file" id="imgInput${i}" accept="image/*" style="display:none;" onchange="handleImageUpload(this, ${i})">
                        </div>
                    `).join('')}
                </div>
                <small>Images auto-compress to ~400-500KB</small>
            </div>
            
            <div style="display:flex;gap:12px;margin-top:24px;">
                <button class="btn-primary" style="flex:1;" onclick="saveProduct()">Save Product</button>
                <button class="btn-secondary" style="flex:1;background:transparent;border:1px solid var(--border-light);border-radius:var(--radius-full);" onclick="hideModal()">Cancel</button>
            </div>
        `;
        
        document.getElementById('modalOverlay').style.display = 'flex';
    }

    window.addAttribute = function() {
        productAttributes.push({ name: '', value: '' });
        const product = editProductId ? allProducts.find(p => p.id === editProductId) : null;
        showProductModal(product);
    };

    window.removeAttribute = function(index) {
        productAttributes.splice(index, 1);
        const product = editProductId ? allProducts.find(p => p.id === editProductId) : null;
        showProductModal(product);
    };

    window.handleImageUpload = async function(input, index) {
        const file = input.files[0];
        if (!file) return;
        
        showToast('Compressing image...');
        const compressed = await compressImage(file);
        
        const reader = new FileReader();
        reader.onload = (e) => {
            productImages[index] = e.target.result;
            const product = editProductId ? allProducts.find(p => p.id === editProductId) : null;
            showProductModal(product);
        };
        reader.readAsDataURL(compressed);
    };

    window.removeImage = function(index) {
        productImages[index] = null;
        const product = editProductId ? allProducts.find(p => p.id === editProductId) : null;
        showProductModal(product);
    };

    async function saveProduct() {
        const name = document.getElementById('prodName').value.trim();
        const categoryId = document.getElementById('prodCategory').value;
        const price = parseFloat(document.getElementById('prodPrice').value);
        
        if (!name || !categoryId || !price) {
            showToast('Please fill required fields', true);
            return;
        }
        
        const attributes = [];
        document.querySelectorAll('#attributesContainer .attribute-row').forEach(row => {
            const inputs = row.querySelectorAll('input');
            if (inputs[0] && inputs[1] && inputs[0].value.trim()) {
                attributes.push({
                    name: inputs[0].value.trim(),
                    value: inputs[1].value.trim()
                });
            }
        });
        
        const uploadedImages = [];
        for (const img of productImages) {
            if (img && img.startsWith('data:')) {
                const blob = await (await fetch(img)).blob();
                const fileName = `products/${shop.id}/${Date.now()}_${Math.random()}.jpg`;
                await supabaseClient.storage.from('product-images').upload(fileName, blob);
                const { data: { publicUrl } } = supabaseClient.storage.from('product-images').getPublicUrl(fileName);
                uploadedImages.push(publicUrl);
            } else if (img && img.startsWith('http')) {
                uploadedImages.push(img);
            }
        }
        
        const productData = {
            shop_id: shop.id,
            name,
            category_id: categoryId,
            description: document.getElementById('prodDesc').value,
            price,
            offer_price: parseFloat(document.getElementById('prodOfferPrice').value) || null,
            stock: parseInt(document.getElementById('prodStock').value) || 1,
            unit: document.getElementById('prodUnit').value,
            attributes,
            images: uploadedImages.filter(img => img),
            is_active: true
        };
        
        if (editProductId) {
            await supabaseClient.from('products').update(productData).eq('id', editProductId);
            showToast('Product updated!');
        } else {
            await supabaseClient.from('products').insert([productData]);
            showToast('Product added!');
        }
        
        hideModal();
        await loadData();
        renderTabContent();
    }

    window.deleteProduct = async function(id) {
        if (!confirm('Delete this product?')) return;
        await supabaseClient.from('products').delete().eq('id', id);
        showToast('Product deleted');
        await loadData();
        renderTabContent();
    };

    function hideModal() {
        document.getElementById('modalOverlay').style.display = 'none';
    }

    // ========== INIT ==========
    document.addEventListener('DOMContentLoaded', async () => {
        const isLoggedIn = await checkUser();
        if (isLoggedIn) {
            await renderDashboard();
        }
    });

    window.goBack = goBack;
    window.handleLogout = handleLogout;
    window.switchTab = switchTab;
    window.showAddProductModal = showAddProductModal;
    window.editProduct = editProduct;
    window.deleteProduct = deleteProduct;
    window.updateOrderStatus = updateOrderStatus;
    window.addAttribute = addAttribute;
    window.removeAttribute = removeAttribute;
    window.handleImageUpload = handleImageUpload;
    window.removeImage = removeImage;
    window.hideModal = hideModal;
</script>
</body>
</html>
