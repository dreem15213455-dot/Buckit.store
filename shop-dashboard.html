<script>
(function(){'use strict';
var sb=supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co','sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1');
var SUPABASE_URL='https://zwajyovemwdqtkecipeb.supabase.co';
var currentUser=null,shopData=null,allCategories=[],products=[],orders=[],currentTab='products';
var productCompressedBlobs=[],compressedShopBlob=null,currentCalc='profit',variantType='weight';
var editingProductId=null,existingImages=[],removedImages=[];

function $(id){return document.getElementById(id);}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showToast(m,type){var t=$('toastMsg');if(!t)return;t.textContent=m;t.className='toast';if(type==='error')t.classList.add('error');else if(type==='success')t.classList.add('success');t.classList.add('show');setTimeout(function(){t.classList.remove('show','error','success');},2500);}
function getImageUrl(u){if(!u)return'';if(u.indexOf('http')===0||u.indexOf('data:')===0)return u;return SUPABASE_URL+'/storage/v1/object/public/'+u;}
function getCatName(id){var c=allCategories.find(function(x){return x.id===id;});return c?c.name:(id||'Other');}
async function safeFetch(fn){try{var r=await fn();if(r&&r.error)throw new Error(r.error.message);return r;}catch(e){throw e;}}

function compressImage(file){return new Promise(function(resolve){if(!file||!file.type.match(/image\//)){resolve(file);return;}var reader=new FileReader();reader.onload=function(e){var img=new Image();img.onload=function(){var c=document.createElement('canvas');var maxDim=600,w=img.width,h=img.height;if(w>maxDim||h>maxDim){var r=Math.min(maxDim/w,maxDim/h);w=Math.round(w*r);h=Math.round(h*r);}c.width=w;c.height=h;var ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);var quality=0.5;function tryCompress(){c.toBlob(function(b){if(!b){resolve(file);return;}if(b.size>150000&&quality>0.15){quality-=0.1;tryCompress();}else{resolve(new File([b],'img.jpg',{type:'image/jpeg'}));}},'image/jpeg',quality);}tryCompress();};img.src=e.target.result;};reader.readAsDataURL(file);});}
async function uploadImage(blob,folder,name){var path=folder+'/'+name+'_'+Date.now()+'.jpg';var r=await sb.storage.from('product-images').upload(path,blob,{contentType:'image/jpeg',upsert:true});if(r.error)throw new Error(r.error.message);return SUPABASE_URL+'/storage/v1/object/public/product-images/'+path;}

window.toggleCalculator=function(){var w=$('calcWindow');w.classList.toggle('show');if(w.classList.contains('show')){renderCalc();setupDrag();}};
window.switchCalc=function(t,btn){currentCalc=t;document.querySelectorAll('.calc-tab').forEach(function(x){x.classList.remove('active');});btn.classList.add('active');renderCalc();};
function setupDrag(){var h=$('calcHeader'),w=$('calcWindow');if(!h||!w)return;var ox,oy,px,py;h.onmousedown=function(e){e.preventDefault();ox=e.clientX;oy=e.clientY;px=w.offsetLeft;py=w.offsetTop;document.onmousemove=function(e){w.style.left=(px+e.clientX-ox)+'px';w.style.top=(py+e.clientY-oy)+'px';w.style.transform='none';};document.onmouseup=function(){document.onmousemove=null;document.onmouseup=null;};};h.ontouchstart=function(e){var t=e.touches[0];ox=t.clientX;oy=t.clientY;px=w.offsetLeft;py=w.offsetTop;document.ontouchmove=function(e){var t=e.touches[0];w.style.left=(px+t.clientX-ox)+'px';w.style.top=(py+t.clientY-oy)+'px';w.style.transform='none';};document.ontouchend=function(){document.ontouchmove=null;document.ontouchend=null;};};}
function renderCalc(){var c=$('calcContent');if(currentCalc==='profit')c.innerHTML='<div class="form-row"><div class="form-half"><label class="form-label">Cost Price</label><input type="number" id="cp" class="calc-input" placeholder="CP" oninput="calcP()"></div><div class="form-half"><label class="form-label">Selling Price</label><input type="number" id="sp" class="calc-input" placeholder="SP" oninput="calcP()"></div></div><div class="calc-result" id="pr">--</div><div class="calc-actions"><button class="btn-copy" onclick="copyCalcResult()">📋 Copy</button></div>';else if(currentCalc==='discount')c.innerHTML='<div class="form-row"><div class="form-half"><label class="form-label">Price</label><input type="number" id="dp" class="calc-input" placeholder="₹" oninput="calcD()"></div><div class="form-half"><label class="form-label">Discount %</label><input type="number" id="dd" class="calc-input" placeholder="%" oninput="calcD()"></div></div><div class="calc-result" id="dr">--</div><div class="calc-actions"><button class="btn-copy" onclick="copyCalcResult()">📋 Copy</button></div>';else if(currentCalc==='bill')c.innerHTML='<div class="form-row"><div class="form-half"><label class="form-label">Price</label><input type="number" id="bp" class="calc-input" placeholder="₹" oninput="calcB()"></div><div class="form-half"><label class="form-label">Qty</label><input type="number" id="bq" class="calc-input" placeholder="1" value="1" oninput="calcB()"></div></div><div class="calc-result" id="br">--</div><div class="calc-actions"><button class="btn-copy" onclick="copyCalcResult()">📋 Copy</button></div>';else if(currentCalc==='gst')c.innerHTML='<div class="form-row"><div class="form-half"><label class="form-label">Amount</label><input type="number" id="ga" class="calc-input" placeholder="₹" oninput="calcGST()"></div><div class="form-half"><label class="form-label">GST %</label><input type="number" id="gg" class="calc-input" placeholder="18" value="18" oninput="calcGST()"></div></div><div class="calc-result" id="gr">--</div><div class="calc-actions"><button class="btn-copy" onclick="copyCalcResult()">📋 Copy</button></div>';else if(currentCalc==='margin')c.innerHTML='<div class="form-row"><div class="form-half"><label class="form-label">Cost</label><input type="number" id="mc" class="calc-input" placeholder="₹" oninput="calcM()"></div><div class="form-half"><label class="form-label">Margin %</label><input type="number" id="mm" class="calc-input" placeholder="30" oninput="calcM()"></div></div><div class="calc-result" id="mr">--</div><div class="calc-actions"><button class="btn-copy" onclick="copyCalcResult()">📋 Copy</button></div>';}
window.calcP=function(){var cp=parseFloat($('cp')?.value)||0,sp=parseFloat($('sp')?.value)||0,p=sp-cp,r=$('pr');if(r)r.innerHTML=(p>=0?'🟢 Profit: ':'🔴 Loss: ')+'₹'+Math.abs(p).toFixed(2)+(cp>0?'<br><small>('+((p/cp)*100).toFixed(1)+'%)</small>':'');};
window.calcD=function(){var p=parseFloat($('dp')?.value)||0,d=parseFloat($('dd')?.value)||0,f=p-(p*d/100),r=$('dr');if(r)r.innerHTML='🏷️ Final Price<br><b>₹'+f.toFixed(2)+'</b><br><small>Save ₹'+(p*d/100).toFixed(2)+'</small>';};
window.calcB=function(){var p=parseFloat($('bp')?.value)||0,q=parseFloat($('bq')?.value)||1,r=$('br');if(r)r.innerHTML='🧾 Total<br><b>₹'+(p*q).toFixed(2)+'</b>';};
window.calcGST=function(){var a=parseFloat($('ga')?.value)||0,g=parseFloat($('gg')?.value)||0,gst=a*g/100,total=a+gst,r=$('gr');if(r)r.innerHTML='📊 GST: ₹'+gst.toFixed(2)+'<br><b>Total: ₹'+total.toFixed(2)+'</b>';};
window.calcM=function(){var c=parseFloat($('mc')?.value)||0,m=parseFloat($('mm')?.value)||0,sp=c/(1-m/100),r=$('mr');if(r)r.innerHTML='📈 Selling Price<br><b>₹'+sp.toFixed(2)+'</b><br><small>Profit: ₹'+(sp-c).toFixed(2)+'</small>';};
window.copyCalcResult=function(){var r=document.querySelector('.calc-result');if(r){navigator.clipboard.writeText(r.innerText).then(function(){showToast('📋 Copied!','success');});}};

// 🔥 UPDATE PRODUCT
window.updateProduct=async function(){
if(!editingProductId){showToast('Error!','error');return;}
var name=($('prodName')?.value||'').trim(),catId=$('prodCat')?.value||'';
if(!name){showToast('⚠️ Please enter product name!','error');return;}
if(!catId){showToast('⚠️ Please select a category!','error');return;}
try{
var data={name:name,category_id:catId};
if(variantType==='simple'){
var price=parseFloat($('prodPrice')?.value||0),offer=parseFloat($('prodOffer')?.value||0)||null,stock=parseInt($('prodStock')?.value||0);
if(!price||price<=0){showToast('⚠️ Please enter a valid price!','error');return;}
data.price=price;data.offer_price=offer;data.stock=stock;
data.variants=[];data.has_variants=false;
}else{
var rawVariants=collectWeightVariants(),variants=[],totalStock=0,minPrice=Infinity;
for(var i=0;i<rawVariants.length;i++){
var r=rawVariants[i];
var weight=parseFloat(r.weight);var pr=parseFloat(r.price)||0;var offer=parseFloat(r.offer)||null;var st=parseInt(r.stock)||0;
if(isNaN(weight)||weight<=0){showToast('⚠️ Please enter valid weight for variant '+(i+1)+'!','error');return;}
if(pr<=0){showToast('⚠️ Please enter valid price for variant '+(i+1)+'!','error');return;}
var v={weight:weight,weight_unit:r.unit||'kg',unit:r.unit||'kg',price:pr,offer_price:offer,stock:st};
variants.push(v);totalStock+=st;if(pr<minPrice||(offer&&offer<minPrice))minPrice=offer||pr;
}
if(!variants.length){showToast('⚠️ Add at least one weight variant!','error');return;}
data.variants=variants;data.stock=totalStock;data.price=minPrice;data.has_variants=true;
}
var finalImages=existingImages.slice();
if(productCompressedBlobs.length>0){for(var j=0;j<productCompressedBlobs.length;j++){finalImages.push(await uploadImage(productCompressedBlobs[j],'products','prod_'+editingProductId+'_'+j));}}
data.images=finalImages;
await safeFetch(function(){return sb.from('products').update(data).eq('id',editingProductId);});
showToast('✅ Product updated successfully!','success');closeModal();await loadProducts();renderDashboard();switchTab('products');
}catch(e){showToast('❌ '+e.message,'error');}
};

// 🔥 COLLECT WEIGHT VARIANTS FROM DOM
function collectWeightVariants(){
var rows=document.querySelectorAll('#variantRows .variant-row'),result=[];
for(var i=0;i<rows.length;i++){
var row=rows[i],inputs=row.querySelectorAll('input'),selects=row.querySelectorAll('select');
var weight=(inputs[0]?.value||'').trim();
var unit=selects[0]?.value||'kg';
var price=(inputs[1]?.value||'').trim();
var offer=(inputs[2]?.value||'').trim();
var stock=(inputs[3]?.value||'').trim();
if(weight&&price){result.push({weight:weight,unit:unit,price:price,offer:offer,stock:stock});}
}
return result;
}

window.handleProdImages=async function(input){var files=input.files;productCompressedBlobs=[];for(var i=0;i<Math.min(files.length,4);i++){var comp=await compressImage(files[i]);productCompressedBlobs.push(comp);}var preview=$('prodImgPreview');if(preview){preview.innerHTML='';for(var j=0;j<productCompressedBlobs.length;j++){preview.innerHTML+='<img src="'+URL.createObjectURL(productCompressedBlobs[j])+'" style="width:60px;height:60px;object-fit:cover;border-radius:8px;">'}}};

// 🔥 SAVE NEW PRODUCT
window.saveProduct=async function(){
var name=($('prodName')?.value||'').trim(),catId=$('prodCat')?.value||'';
if(!name){showToast('⚠️ Please enter product name!','error');return;}
if(!catId){showToast('⚠️ Please select a category!','error');return;}
try{
var data={shop_id:shopData.id,name:name,category_id:catId,is_active:true,delete_requested:false,is_on_hold:false,created_at:new Date().toISOString()};
if(variantType==='simple'){
var price=parseFloat($('prodPrice')?.value||0),offer=parseFloat($('prodOffer')?.value||0)||null,stock=parseInt($('prodStock')?.value||0);
if(!price||price<=0){showToast('⚠️ Please enter a valid price!','error');return;}
data.price=price;data.offer_price=offer;data.stock=stock;
data.variants=[];data.has_variants=false;
}else{
var rawVariants=collectWeightVariants(),variants=[],totalStock=0,minPrice=Infinity;
for(var i=0;i<rawVariants.length;i++){
var r=rawVariants[i];
var weight=parseFloat(r.weight);var pr=parseFloat(r.price)||0;var offer=parseFloat(r.offer)||null;var st=parseInt(r.stock)||0;
if(isNaN(weight)||weight<=0){showToast('⚠️ Please enter valid weight for variant '+(i+1)+'!','error');return;}
if(pr<=0){showToast('⚠️ Please enter valid price for variant '+(i+1)+'!','error');return;}
var v={weight:weight,weight_unit:r.unit||'kg',unit:r.unit||'kg',price:pr,offer_price:offer,stock:st};
variants.push(v);totalStock+=st;if(pr<minPrice||(offer&&offer<minPrice))minPrice=offer||pr;
}
if(!variants.length){showToast('⚠️ Add at least one weight variant!','error');return;}
data.variants=variants;data.stock=totalStock;data.price=minPrice;data.has_variants=true;
}
var ir=await safeFetch(function(){return sb.from('products').insert([data]).select();});
var pid=ir.data[0].id;
if(productCompressedBlobs.length>0){var urls=[];for(var j=0;j<productCompressedBlobs.length;j++){urls.push(await uploadImage(productCompressedBlobs[j],'products','prod_'+pid+'_'+j));}await safeFetch(function(){return sb.from('products').update({images:urls}).eq('id',pid);});}
showToast('✅ Product added successfully!','success');closeModal();await loadProducts();renderDashboard();switchTab('products');
}catch(e){showToast('❌ '+e.message,'error');}
};

window.saveShopEdit=async function(){var updates={shop_name:($('editName')?.value||'').trim(),name:($('editName')?.value||'').trim(),phone:($('editPhone')?.value||'').trim(),city:($('editCity')?.value||'').trim(),address:($('editAddr')?.value||'').trim()};if(compressedShopBlob){var url=await uploadImage(compressedShopBlob,'shop-images','shop_'+shopData.id);updates.shop_image=url;updates.image_url=url;}await safeFetch(function(){return sb.from('shops').update(updates).eq('id',shopData.id);});var r=await safeFetch(function(){return sb.from('shops').select('*').eq('id',shopData.id).single();});shopData=r.data;showToast('✅ Shop updated!','success');closeModal();renderDashboard();};

async function init(){
    try {
        var sr = await sb.auth.getSession();
        if (sr && sr.data && sr.data.session) { currentUser = sr.data.session.user; }
        if (!currentUser) {
            try { var session = JSON.parse(localStorage.getItem('zymart_session') || 'null'); if (session && session.userId) { currentUser = { id: session.userId, phone: session.phone, email: session.phone + '@zymart.user' }; } } catch(e) {}
        }
        if (!currentUser) { location.href = 'login.html'; return; }
        
        var shopRes = null;
        if (currentUser.email && currentUser.email.indexOf('@zymart.user') === -1) {
            shopRes = await safeFetch(function() { return sb.from('shops').select('*').eq('owner_email', currentUser.email).maybeSingle(); });
        }
        if (!shopRes || !shopRes.data) {
            var phone = currentUser.phone || localStorage.getItem('zymart_user_phone') || '';
            if (phone) { shopRes = await safeFetch(function() { return sb.from('shops').select('*').eq('owner_phone', phone).maybeSingle(); }); }
        }
        if (!shopRes || !shopRes.data) {
            $('app').innerHTML = '<div style="text-align:center;padding:80px;"><i class="fas fa-store-slash" style="font-size:56px;color:#D1D5DB;"></i><h3>No Shop Found</h3><p style="color:#6B7280;">Register your shop to start selling</p><button class="btn-primary" style="padding:12px 24px;margin-top:16px;" onclick="location.href=\'shop-register.html\'">Register Now</button></div>';
            return;
        }
        shopData = shopRes.data;
        if (shopData.status !== 'approved') {
            $('app').innerHTML = '<div style="text-align:center;padding:80px;"><i class="fas fa-clock" style="font-size:56px;color:#F59E0B;"></i><h3>Approval Pending</h3><p style="color:#6B7280;">Admin will review your shop within 24 hours</p></div>';
            return;
        }
        var catRes = await safeFetch(function() { return sb.from('categories').select('id,name').eq('is_active',true).order('name'); });
        allCategories = catRes.data || [];
        await Promise.all([loadProducts(), loadOrders()]);
        renderDashboard();
    } catch(e) {
        $('app').innerHTML = '<div style="text-align:center;padding:80px;"><i class="fas fa-exclamation-circle" style="font-size:56px;color:#EF4444;"></i><h3>Failed to Load</h3><p style="color:#6B7280;">'+esc(e.message)+'</p><button class="btn-primary" onclick="init()">🔄 Retry</button></div>';
    }
}
document.addEventListener('DOMContentLoaded',init);
})();
</script>
