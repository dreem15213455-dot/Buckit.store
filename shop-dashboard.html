<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Shop Dashboard - ZyMart+</title>
    <meta name="theme-color" content="#0B5A31">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --brand-green: #0B5A31; 
            --brand-green-dark: #083D21; 
            --brand-orange: #F59E0B; 
            --neutral-white: #FFFFFF; 
            --neutral-bg: #F9FAFB; 
            --neutral-border: #E5E7EB; 
            --neutral-gray: #6B7280; 
            --neutral-dark: #1A1A1A; 
            --danger: #EF4444; 
            --success: #22C55E; 
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); 
            --shadow-sm: 0 1px 4px rgba(0,0,0,0.06); 
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08); 
            --radius-sm: 10px; 
            --radius-md: 14px; 
            --radius-lg: 18px; 
            --radius-xl: 22px; 
            --radius-full: 9999px;
            --status-bar-height: env(safe-area-inset-top, 0px);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--neutral-bg); 
            color: var(--neutral-dark); 
            padding-bottom: 30px; 
            -webkit-tap-highlight-color: transparent; 
            -webkit-font-smoothing: antialiased; 
            min-height: 100vh; 
            overflow-x: hidden; 
        }
        
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .top-bar { 
            background: var(--brand-green); 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            padding: 10px 14px; 
            padding-top: calc(10px + var(--status-bar-height));
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            z-index: 100; 
            box-shadow: 0 2px 16px rgba(11,90,49,0.3); 
        }
        
        .back-btn { 
            width: 40px; 
            height: 40px; 
            background: rgba(255,255,255,0.10); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            border: none; 
            color: white; 
            font-size: 15px; 
            text-decoration: none; 
        }
        
        .brand-zy { color: #A3E635; } 
        .brand-mart { color: #FDE047; }
        
        .shop-name-top { 
            font-family: 'Poppins', sans-serif; 
            font-size: 15px; 
            font-weight: 700; 
            color: white; 
        }
        
        .logout-btn { 
            background: rgba(255,255,255,0.12); 
            color: white; 
            border: 1px solid rgba(255,255,255,0.2); 
            padding: 7px 14px; 
            border-radius: var(--radius-full); 
            font-size: 11px; 
            font-weight: 600; 
            cursor: pointer; 
            font-family: 'Inter', sans-serif; 
        }
        
        .main-content { 
            padding: 70px 14px 40px; 
            max-width: 650px; 
            margin: 0 auto; 
        }
        
        .profile-card { 
            background: white; 
            border-radius: var(--radius-xl); 
            padding: 16px; 
            margin-bottom: 14px; 
            box-shadow: var(--shadow-xs); 
            border: 1px solid var(--neutral-border); 
        }
        
        .profile-header { display: flex; align-items: center; gap: 12px; }
        
        .profile-avatar { 
            width: 52px; 
            height: 52px; 
            background: #EDF7F1; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 24px; 
            color: var(--brand-green); 
            overflow: hidden; 
            border: 2px solid #C8E6C9; 
        }
        
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .badge { 
            display: inline-block; 
            padding: 3px 10px; 
            border-radius: var(--radius-full); 
            font-size: 10px; 
            font-weight: 700; 
        }
        
        .badge-success { background: #EDF7F1; color: #059669; }
        
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 8px; 
            margin-bottom: 14px; 
        }
        
        .stat-card { 
            background: white; 
            border-radius: var(--radius-lg); 
            padding: 12px 8px; 
            text-align: center; 
            border: 1px solid var(--neutral-border); 
            cursor: pointer; 
        }
        
        .stat-icon { font-size: 18px; margin-bottom: 4px; }
        .stat-number { font-size: 16px; font-weight: 700; color: var(--brand-green); }
        .stat-label { font-size: 9px; color: var(--neutral-gray); }
        .stat-card.pending { background: #FFF8EB; border-color: #FDE68A; }
        
        .tabs { 
            display: flex; 
            gap: 6px; 
            margin-bottom: 14px; 
            background: white; 
            padding: 5px; 
            border-radius: var(--radius-full); 
            border: 1px solid var(--neutral-border); 
        }
        
        .tab { 
            flex: 1; 
            text-align: center; 
            padding: 12px 10px; 
            font-size: 12px; 
            font-weight: 600; 
            border-radius: var(--radius-full); 
            cursor: pointer; 
            color: var(--neutral-gray); 
            border: none; 
            background: transparent; 
            font-family: 'Inter', sans-serif; 
        }
        
        .tab.active { background: var(--brand-green); color: white; }
        
        .add-product-btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            width: 100%; 
            padding: 16px 20px; 
            background: var(--brand-green); 
            color: white; 
            border: none; 
            border-radius: var(--radius-lg); 
            font-size: 16px; 
            font-weight: 700; 
            cursor: pointer; 
            font-family: 'Inter', sans-serif; 
            margin-bottom: 16px; 
        }
        
        .products-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 10px; 
        }
        
        .product-card { 
            background: white; 
            border-radius: var(--radius-lg); 
            overflow: hidden; 
            border: 1px solid var(--neutral-border); 
        }
        
        .product-img { 
            width: 100%; 
            aspect-ratio: 1/1; 
            background: #F9FAFB; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            overflow: hidden; 
        }
        
        .product-img img { width: 100%; height: 100%; object-fit: contain; }
        
        .product-stock { 
            position: absolute; 
            top: 6px; 
            right: 6px; 
            background: rgba(0,0,0,0.7); 
            color: white; 
            padding: 2px 7px; 
            border-radius: var(--radius-full); 
            font-size: 9px; 
        }
        
        .product-info { padding: 10px; }
        .product-name { font-weight: 600; font-size: 12px; }
        .product-category { font-size: 9px; color: var(--brand-green); }
        
        .product-price-row { 
            display: flex; 
            align-items: baseline; 
            gap: 6px; 
            flex-wrap: wrap; 
        }
        
        .product-price { 
            color: var(--brand-green); 
            font-weight: 700; 
            font-size: 14px; 
        }
        
        .product-offer-price { 
            color: var(--neutral-gray); 
            font-size: 11px; 
            text-decoration: line-through; 
        }
        
        .product-actions { 
            display: flex; 
            gap: 4px; 
            margin-top: 8px; 
            flex-wrap: wrap; 
        }
        
        .btn-edit, .btn-delete { 
            flex: 1; 
            min-width: 45px; 
            padding: 8px 5px; 
            border: none; 
            border-radius: var(--radius-full); 
            font-size: 11px; 
            font-weight: 600; 
            cursor: pointer; 
            font-family: 'Inter', sans-serif; 
        }
        
        .btn-edit { background: #F3F5F4; color: var(--neutral-dark); }
        .btn-delete { background: #FEF2F2; color: var(--danger); }
        
        .order-card { 
            background: white; 
            border-radius: var(--radius-lg); 
            padding: 16px; 
            margin-bottom: 12px; 
            border: 1px solid var(--neutral-border); 
        }
        
        .order-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            margin-bottom: 10px; 
        }
        
        .order-id { font-weight: 700; font-size: 14px; color: var(--brand-green-dark); }
        .order-date { font-size: 11px; color: var(--neutral-gray); }
        
        .order-status-badge { 
            padding: 4px 10px; 
            border-radius: var(--radius-full); 
            font-size: 10px; 
            font-weight: 700; 
        }
        
        .status-pending { background: #FFF8EB; color: #D97706; }
        .status-confirmed { background: #EFF6FF; color: #2563EB; }
        .status-delivered { background: #EDF7F1; color: #059669; }
        .status-cancelled { background: #FEF2F2; color: #DC2626; }
        
        .order-customer-row { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            font-size: 14px; 
            font-weight: 600; 
            margin-bottom: 8px; 
        }
        
        .order-address-box { 
            font-size: 14px; 
            margin-bottom: 8px; 
            line-height: 1.7; 
            padding: 12px 14px; 
            background: #FFF8EB; 
            border-radius: var(--radius-sm); 
            border: 2px solid #FDE68A; 
        }
        
        .order-items-list { 
            background: #F9FAFB; 
            border-radius: var(--radius-sm); 
            padding: 10px 12px; 
            margin-bottom: 10px; 
        }
        
        .order-item-row { 
            display: flex; 
            justify-content: space-between; 
            font-size: 12px; 
            padding: 3px 0; 
        }
        
        .order-footer { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-top: 1px solid var(--neutral-border); 
            padding-top: 10px; 
        }
        
        .order-total { font-size: 16px; font-weight: 700; color: var(--brand-green-dark); }
        
        .order-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        
        .btn-copy { 
            background: #EFF6FF; 
            color: #2563EB; 
            padding: 8px 12px; 
            border-radius: var(--radius-full); 
            font-size: 10px; 
            font-weight: 600; 
            border: 1px solid #BFDBFE; 
            cursor: pointer; 
            font-family: 'Inter', sans-serif; 
        }
        
        .btn-wa { 
            background: #25D366; 
            color: white; 
            padding: 8px 12px; 
            border-radius: var(--radius-full); 
            font-size: 10px; 
            font-weight: 600; 
            text-decoration: none; 
        }
        
        .order-status-select { 
            padding: 8px 12px; 
            border-radius: var(--radius-full); 
            border: 1px solid var(--neutral-border); 
            font-size: 11px; 
            font-weight: 600; 
            font-family: 'Inter', sans-serif; 
        }
        
        .modal-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(8,61,33,0.7); 
            backdrop-filter: blur(6px); 
            display: none; 
            align-items: center; 
            justify-content: center; 
            z-index: 1000; 
            padding: 20px;
        }
        
        .modal-overlay.show { display: flex; }
        
        .modal-container { 
            background: white; 
            border-radius: var(--radius-xl); 
            width: 100%; 
            max-width: 550px; 
            max-height: 90vh; 
            overflow-y: auto; 
            padding: 24px; 
            animation: slideUp 0.3s ease; 
        }
        
        .modal-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            padding-bottom: 12px; 
            border-bottom: 1px solid var(--neutral-border); 
        }
        
        .modal-header h3 { font-size: 18px; font-weight: 700; }
        
        .modal-close { 
            width: 40px; 
            height: 40px; 
            background: #F3F5F4; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            border: none; 
            font-size: 16px; 
        }
        
        .form-group { margin-bottom: 16px; }
        
        .form-label { 
            font-size: 14px; 
            font-weight: 600; 
            margin-bottom: 6px; 
            display: block; 
        }
        
        .form-label .required { color: var(--danger); }
        
        .form-control { 
            width: 100%; 
            padding: 14px 16px; 
            border: 2px solid var(--neutral-border); 
            border-radius: var(--radius-sm); 
            font-size: 15px; 
            font-family: 'Inter', sans-serif; 
            outline: none; 
        }
        
        .form-control:focus { border-color: var(--brand-orange); }
        
        .form-row { display: flex; gap: 12px; }
        .form-half { flex: 1; }
        
        .variant-type-selector { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 14px; 
            flex-wrap: wrap;
        }
        
        .vt-option { 
            padding: 12px 16px; 
            border: 2px solid var(--neutral-border); 
            border-radius: var(--radius-full); 
            font-size: 12px; 
            font-weight: 600; 
            cursor: pointer; 
            background: white; 
            font-family: 'Inter', sans-serif; 
        }
        
        .vt-option.active { 
            border-color: var(--brand-green); 
            background: #EDF7F1; 
            color: var(--brand-green); 
        }
        
        .variant-row, .flavour-row { 
            display: flex; 
            gap: 8px; 
            align-items: center; 
            margin-bottom: 8px; 
            flex-wrap: wrap; 
            padding: 12px; 
            background: #F9FAFB; 
            border-radius: var(--radius-sm); 
            border: 1px solid var(--neutral-border);
        }
        
        .variant-row input, .variant-row select, .flavour-row input { 
            padding: 10px 12px; 
            border: 1.5px solid var(--neutral-border); 
            border-radius: 8px; 
            font-size: 14px; 
            font-family: 'Inter', sans-serif; 
        }
        
        .flavour-photo { 
            width: 50px; 
            height: 50px; 
            border-radius: 8px; 
            background: #EDF7F1; 
            border: 2px dashed var(--brand-green); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            font-size: 18px; 
            color: var(--brand-green); 
            overflow: hidden; 
            flex-shrink: 0; 
            position: relative; 
        }
        
        .flavour-photo img { width: 100%; height: 100%; object-fit: cover; }
        .flavour-photo.uploaded { border-style: solid; border-color: #22C55E; background: #D1FAE5; }
        .flavour-photo input { display: none; }
        
        .btn-add-variant { 
            background: #EDF7F1; 
            color: var(--brand-green); 
            border: 2px dashed var(--brand-green); 
            width: 100%; 
            padding: 14px; 
            border-radius: var(--radius-sm); 
            font-size: 14px; 
            font-weight: 600; 
            cursor: pointer; 
            font-family: 'Inter', sans-serif; 
        }
        
        .btn-primary, .btn-secondary { 
            flex: 1; 
            padding: 16px; 
            border-radius: var(--radius-full); 
            font-weight: 700; 
            font-size: 16px; 
            cursor: pointer; 
            font-family: 'Inter', sans-serif; 
            border: none; 
        }
        
        .btn-primary { background: var(--brand-green); color: white; }
        .btn-secondary { background: transparent; color: var(--neutral-dark); border: 2px solid var(--neutral-border); }
        
        .empty-state { 
            text-align: center; 
            padding: 40px 20px; 
            background: white; 
            border-radius: var(--radius-lg); 
            border: 1px solid var(--neutral-border); 
        }
        
        .toast { 
            position: fixed; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: #1A1A1A; 
            color: white; 
            padding: 12px 24px; 
            border-radius: var(--radius-full); 
            font-size: 13px; 
            z-index: 2000; 
            opacity: 0; 
            visibility: hidden; 
            transition: all 0.3s ease; 
        }
        
        .toast.show { opacity: 1; visibility: visible; }
        .toast.error { background: #EF4444; }
        .toast.success { background: #059669; }
        
        @media(max-width: 380px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .products-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
        }
    </style>
</head>
<body>

<div id="app">
    <div style="text-align:center;padding:100px 20px;">
        <div style="width:34px;height:34px;border:3px solid #E5E7EB;border-top-color:#F59E0B;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 16px;"></div>
        <p>Loading...</p>
    </div>
</div>

<div id="modalOverlay" class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div id="modalContainer" class="modal-container"></div>
</div>

<div id="toastMsg" class="toast"></div>

<script>
(function() {
    'use strict';
    
    var CONFIG = {
        SUPABASE_URL: 'https://zwajyovemwdqtkecipeb.supabase.co',
        SUPABASE_KEY: 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1',
        DEFAULT_STOCK: 10
    };
    
    var sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
    var SUPABASE_URL = CONFIG.SUPABASE_URL;
    
    var currentUser = null;
    var shopData = null;
    var allCategories = [];
    var products = [];
    var orders = [];
    var currentTab = 'products';
    var editingProductId = null;
    var existingImages = [];
    var productCompressedBlobs = [];
    var variantType = 'weight';
    var flavourPhotoFiles = {};
    
    function $(id) { return document.getElementById(id); }
    function esc(s) { if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function showToast(m, type) { var t = $('toastMsg'); if(!t) return; t.textContent = m; t.className = 'toast'; if(type === 'error') t.classList.add('error'); else if(type === 'success') t.classList.add('success'); t.classList.add('show'); setTimeout(function() { t.classList.remove('show','error','success'); }, 2500); }
    function getImageUrl(u) { if(!u) return ''; if(u.indexOf('http')===0 || u.indexOf('data:')===0) return u; return SUPABASE_URL + '/storage/v1/object/public/' + u; }
    function getCatName(id) { var c = allCategories.find(function(x) { return x.id === id; }); return c ? c.name : (id || 'Other'); }
    async function safeFetch(fn) { try { var r = await fn(); if(r && r.error) throw new Error(r.error.message); return r; } catch(e) { throw e; } }
    
    function compressImage(file) {
        return new Promise(function(resolve) {
            if(!file || !file.type.match(/image\//)) { resolve(file); return; }
            var reader = new FileReader();
            reader.onload = function(e) {
                var img = new Image();
                img.onload = function() {
                    var canvas = document.createElement('canvas');
                    var maxDim = 800;
                    var w = img.width, h = img.height;
                    if(w > maxDim || h > maxDim) { var ratio = Math.min(maxDim/w, maxDim/h); w = Math.round(w*ratio); h = Math.round(h*ratio); }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    canvas.toBlob(function(blob) {
                        if(blob && blob.size > 150*1024) {
                            canvas.toBlob(function(blob2) { resolve(new File([blob2], 'img.jpg', {type:'image/jpeg'})); }, 'image/jpeg', 0.5);
                        } else {
                            resolve(new File([blob], 'img.jpg', {type:'image/jpeg'}));
                        }
                    }, 'image/jpeg', 0.7);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }
    
    async function uploadImage(blob, folder, name) {
        var path = folder + '/' + name + '_' + Date.now() + '.jpg';
        var r = await sb.storage.from('product-images').upload(path, blob, { contentType: 'image/jpeg', upsert: true });
        if(r.error) throw new Error(r.error.message);
        return SUPABASE_URL + '/storage/v1/object/public/product-images/' + path;
    }
    
    async function loadProducts() { 
        try { 
            var r = await safeFetch(function() { return sb.from('products').select('*').eq('shop_id', shopData.id).is('parent_id', null).order('created_at', { ascending: false }); }); 
            products = r.data || []; 
        } catch(e) { products = []; } 
    }
    
    async function loadOrders() { 
        try { 
            var r = await safeFetch(function() { return sb.from('orders').select('*').eq('shop_id', shopData.id).order('created_at', { ascending: false }).limit(50); }); 
            orders = r.data || []; 
        } catch(e) { orders = []; } 
    }
    
    function getCategoryOptions(selectedId) {
        var html = '<option value="">Select Category</option>';
        for(var i = 0; i < allCategories.length; i++) {
            var c = allCategories[i];
            html += '<option value="' + c.id + '"' + (selectedId === c.id ? ' selected' : '') + '>' + esc(c.name) + '</option>';
        }
        return html;
    }
    
    function renderStats() {
        var pc = orders.filter(function(o) { return o.status === 'pending'; }).length;
        var totalRev = orders.filter(function(o) { return o.status !== 'cancelled'; }).reduce(function(s, o) { return s + (parseFloat(o.total_amount) || 0); }, 0);
        return '<div class="stats-grid">' +
            '<div class="stat-card"><div class="stat-icon">📦</div><div class="stat-number">' + products.length + '</div><div class="stat-label">Products</div></div>' +
            '<div class="stat-card pending" onclick="switchTab(\'orders\')"><div class="stat-icon">🔔</div><div class="stat-number">' + pc + '</div><div class="stat-label">Pending</div></div>' +
            '<div class="stat-card"><div class="stat-icon">💰</div><div class="stat-number">₹' + totalRev.toLocaleString('en-IN') + '</div><div class="stat-label">Revenue</div></div>' +
            '<div class="stat-card"><div class="stat-icon">📊</div><div class="stat-number">' + orders.length + '</div><div class="stat-label">Orders</div></div>' +
            '</div>';
    }
    
    function renderProducts() {
        if(!products.length) {
            return '<div class="empty-state"><i class="fas fa-box-open" style="font-size:48px;color:#D1D5DB;"></i><h4 style="margin:10px 0;">No Products Yet</h4></div>';
        }
        var h = '<div class="products-grid">';
        for(var i = 0; i < products.length; i++) {
            var p = products[i];
            var img = (p.images && p.images.length) ? getImageUrl(p.images[0]) : '';
            var actualPrice = parseFloat(p.price) || 0;
            var offerPrice = parseFloat(p.offer_price) || null;
            var displayPrice = offerPrice && offerPrice < actualPrice ? offerPrice : actualPrice;
            h += '<div class="product-card">';
            h += '<div class="product-img">';
            h += img ? '<img src="' + img + '" loading="lazy">' : '<i class="fas fa-box" style="font-size:40px;color:#D1D5DB;"></i>';

            h += '<div class="product-name">' + esc(p.name) + '</div>';
            h += '<div class="product-category">📂 ' + getCatName(p.category_id) + '</div>';
            h += '<div class="product-price-row">';
            h += '<span class="product-price">₹' + displayPrice.toLocaleString('en-IN') + '</span>';
            if(offerPrice && offerPrice < actualPrice) h += '<span class="product-offer-price">₹' + actualPrice.toLocaleString('en-IN') + '</span>';
            h += '</div>';

            h += '<button class="btn-edit" onclick="showEditProduct(\'' + p.id + '\')">✏️ Edit</button>';

            h += '</div></div></div>';
        }
        return h + '</div>';
    }

    window.copyOrderDetails = function(orderId) {
        var order = orders.find(function(o) { return o.id === orderId; });
        if(!order) return;
        var items = [];
        try { items = typeof order.items === 'string' ? JSON.parse(order.items) : (order.items || []); } catch(e) {}
        var oid = '#' + (order.id || '').substring(0, 8).toUpperCase();
        var text = '🧾 ORDER: ' + oid + '\n';
        text += '👤 ' + (order.customer_name || 'Customer') + '\n';
        if(order.customer_phone) text += '📱 +91 ' + order.customer_phone + '\n';
        text += '📍 ' + [order.customer_address, order.customer_city, order.customer_pincode].filter(Boolean).join(', ') + '\n\n';
        text += 'ITEMS:\n';
        for(var i = 0; i < items.length; i++) { var it = items[i]; text += '• ' + (it.product_name || it.name || 'Item') + ' × ' + (it.quantity || 1) + '\n'; }
        text += '\n💰 TOTAL: ₹' + (parseFloat(order.total_amount) || 0).toLocaleString('en-IN');
        navigator.clipboard.writeText(text).then(function() { showToast('📋 Copied!', 'success'); }).catch(function() { showToast('Copy failed', 'error'); });

    window.handleFlavourPhoto = function(input, index) {
        var file = input.files[0];
        if(!file) return;
        flavourPhotoFiles[index] = file;
        var parent = input.parentElement;
        var reader = new FileReader();
        reader.onload = function(e) {
            parent.classList.add('uploaded');
            parent.innerHTML = '<img src="' + e.target.result + '"><input type="file" accept="image/*" onchange="handleFlavourPhoto(this,' + index + ')">';
        };
        reader.readAsDataURL(file);
    };
    
    function collectFlavours() {
        var rows = document.querySelectorAll('#flavourRows .flavour-row');
        var result = [];
        for(var i = 0; i < rows.length; i++) {
            var row = rows[i];
            var inputs = row.querySelectorAll('input');
            var name = (inputs[1]?.value || '').trim();
            var price = parseFloat(inputs[2]?.value || 0);
            var offer = inputs[3]?.value ? parseFloat(inputs[3].value) : null;
            var stock = parseInt(inputs[4]?.value || 0);
            if(!name || price <= 0) continue;
            result.push({ name: name, price: price, offer_price: offer, stock: stock, image_url: null });
        }
        return result;
    }
    
    window.handleProdImages = async function(input) {
        var files = input.files;
        productCompressedBlobs = [];
        for(var i = 0; i < Math.min(files.length, 4); i++) {
            productCompressedBlobs.push(await compressImage(files[i]));
        }
        var preview = $('prodImgPreview');

            preview.innerHTML = '';
            for(var j = 0; j < productCompressedBlobs.length; j++) {

            }
            showToast('📸 ' + productCompressedBlobs.length + ' photo(s) ready!', 'success');
        }
    };
    
    function collectWeightVariants() {
        var rows = document.querySelectorAll('#variantRows .variant-row');
        var result = [];
        for(var i = 0; i < rows.length; i++) {
            var row = rows[i];
            var inputs = row.querySelectorAll('input');
            var selects = row.querySelectorAll('select');
            var weight = (inputs[0]?.value || '').trim();
            var unit = selects[0]?.value || 'kg';
            var price = parseFloat(inputs[1]?.value || 0);
            var offer = inputs[2]?.value ? parseFloat(inputs[2].value) : null;
            var stock = parseInt(inputs[3]?.value || 0);
            if(!weight || price <= 0) continue;
            result.push({ weight: weight, unit: unit, price: price, offer: offer, stock: stock });
        }
        return result;
    }
    
    window.saveProduct = async function() {
        var name = ($('prodName')?.value || '').trim();
        var catId = $('prodCat')?.value || '';
        if(!name) { showToast('⚠️ Product name likhein!', 'error'); return; }
        if(!catId) { showToast('⚠️ Category select karein!', 'error'); return; }
        
        try {
            var data = { shop_id: shopData.id, name: name, category_id: catId, is_active: true, delete_requested: false, is_on_hold: false, created_at: new Date().toISOString() };
            
            if(variantType === 'simple') {
                var price = parseFloat($('prodPrice')?.value || 0);
                var offer = parseFloat($('prodOffer')?.value || 0) || null;
                var stock = parseInt($('prodStock')?.value || CONFIG.DEFAULT_STOCK);
                if(!price || price <= 0) { showToast('⚠️ Price enter karein!', 'error'); return; }
                data.price = price;
                data.offer_price = offer;
                data.stock = stock;
                data.variants = [];
                data.flavours = [];
                data.has_variants = false;
                data.has_flavours = false;
                var ir = await safeFetch(function() { return sb.from('products').insert([data]).select(); });
                var pid = ir.data[0].id;
                if(productCompressedBlobs.length > 0) {
                    var urls = [];
                    for(var j = 0; j < productCompressedBlobs.length; j++) { urls.push(await uploadImage(productCompressedBlobs[j], 'products', 'prod_' + pid + '_' + j)); }
                    await sb.from('products').update({ images: urls }).eq('id', pid);
                }
            } else if(variantType === 'weight') {
                var rawVariants = collectWeightVariants();
                if(rawVariants.length === 0) { showToast('⚠️ Kam se kam ek variant add karein!', 'error'); return; }
                var variants = [], totalStock = 0, minPrice = Infinity;
                data.price = rawVariants[0].price;
                data.stock = 0;
                data.variants = [];
                data.flavours = [];
                data.has_variants = true;
                data.has_flavours = false;
                var ir = await safeFetch(function() { return sb.from('products').insert([data]).select(); });
                var pid = ir.data[0].id;
                for(var i = 0; i < rawVariants.length; i++) {
                    var r = rawVariants[i];
                    variants.push({ weight: r.weight, weight_unit: r.unit, unit: r.unit, price: r.price, offer_price: r.offer, stock: r.stock, image_url: null });
                    totalStock += r.stock;
                    if(r.price < minPrice) minPrice = r.price;
                }
                await sb.from('products').update({ variants: variants, stock: totalStock, price: minPrice, has_variants: true }).eq('id', pid);
                if(productCompressedBlobs.length > 0) {
                    var urls = [];
                    for(var j = 0; j < productCompressedBlobs.length; j++) { urls.push(await uploadImage(productCompressedBlobs[j], 'products', 'prod_' + pid + '_' + j)); }
                    await sb.from('products').update({ images: urls }).eq('id', pid);
                }
            } else if(variantType === 'flavour') {
                var rawFlavours = collectFlavours();
                if(rawFlavours.length === 0) { showToast('⚠️ Kam se kam ek flavour add karein!', 'error'); return; }
                var flavours = [], totalStock = 0, minPrice = Infinity;
                data.price = rawFlavours[0].price;
                data.stock = 0;
                data.variants = [];
                data.flavours = [];
                data.has_variants = false;
                data.has_flavours = true;
                var ir = await safeFetch(function() { return sb.from('products').insert([data]).select(); });
                var pid = ir.data[0].id;
                for(var f = 0; f < rawFlavours.length; f++) {
                    var rf = rawFlavours[f];
                    var flavourImage = null;
                    if(flavourPhotoFiles[f]) {
                        flavourImage = await uploadImage(await compressImage(flavourPhotoFiles[f]), 'products', 'flavour_' + pid + '_' + f);
                    }
                    flavours.push({ name: rf.name, price: rf.price, offer_price: rf.offer_price, stock: rf.stock, image_url: flavourImage });
                    totalStock += rf.stock;
                    if(rf.price < minPrice) minPrice = rf.price;
                }
                await sb.from('products').update({ flavours: flavours, stock: totalStock, price: minPrice, has_flavours: true }).eq('id', pid);
                if(productCompressedBlobs.length > 0) {
                    var urls = [];
                    for(var j = 0; j < productCompressedBlobs.length; j++) { urls.push(await uploadImage(productCompressedBlobs[j], 'products', 'prod_' + pid + '_' + j)); }
                    await sb.from('products').update({ images: urls }).eq('id', pid);
                }
            }
            showToast('✅ Product added!', 'success');
            closeModal();
            await loadProducts();
            renderDashboard();
        } catch(e) { console.error('Save error:', e); showToast('❌ ' + e.message, 'error'); }
    };
    
    window.updateProduct = async function() {
        if(!editingProductId) return;
        var name = ($('prodName')?.value || '').trim();
        var catId = $('prodCat')?.value || '';
        if(!name || !catId) { showToast('⚠️ Sab fields bharein!', 'error'); return; }
        
        try {
            var data = { name: name, category_id: catId };
            
            if(variantType === 'simple') {
                var price = parseFloat($('prodPrice')?.value || 0);
                var offer = parseFloat($('prodOffer')?.value || 0) || null;
                var stock = parseInt($('prodStock')?.value || CONFIG.DEFAULT_STOCK);
                data.price = price;
                data.offer_price = offer;
                data.stock = stock;
                data.variants = [];
                data.flavours = [];
                data.has_variants = false;
                data.has_flavours = false;
            } else if(variantType === 'weight') {
                var rawVariants = collectWeightVariants();
                if(rawVariants.length === 0) { showToast('⚠️ Kam se kam ek variant add karein!', 'error'); return; }
                var variants = [], totalStock = 0, minPrice = Infinity;
                for(var i = 0; i < rawVariants.length; i++) {
                    var r = rawVariants[i];
                    variants.push({ weight: r.weight, weight_unit: r.unit, unit: r.unit, price: r.price, offer_price: r.offer, stock: r.stock, image_url: null });
                    totalStock += r.stock;
                    if(r.price < minPrice) minPrice = r.price;
                }
                data.variants = variants;
                data.flavours = [];
                data.stock = totalStock;
                data.price = minPrice;
                data.has_variants = true;
                data.has_flavours = false;
            } else if(variantType === 'flavour') {
                var rawFlavours = collectFlavours();
                if(rawFlavours.length === 0) { showToast('⚠️ Kam se kam ek flavour add karein!', 'error'); return; }
                var flavours = [], totalStock = 0, minPrice = Infinity;
                for(var f = 0; f < rawFlavours.length; f++) {
                    var rf = rawFlavours[f];
                    var flavourImage = null;
                    if(flavourPhotoFiles[f]) {
                        flavourImage = await uploadImage(await compressImage(flavourPhotoFiles[f]), 'products', 'flavour_' + editingProductId + '_' + f);
                    }
                    flavours.push({ name: rf.name, price: rf.price, offer_price: rf.offer_price, stock: rf.stock, image_url: flavourImage });
                    totalStock += rf.stock;
                    if(rf.price < minPrice) minPrice = rf.price;
                }
                data.flavours = flavours;
                data.variants = [];
                data.stock = totalStock;
                data.price = minPrice;
                data.has_flavours = true;
                data.has_variants = false;
            }
            
            var finalImages = existingImages.slice();
            if(productCompressedBlobs.length > 0) {
                for(var j = 0; j < productCompressedBlobs.length; j++) {
                    finalImages.push(await uploadImage(productCompressedBlobs[j], 'products', 'prod_' + editingProductId + '_' + j));
                }
            }
            data.images = finalImages;
            
            await sb.from('products').update(data).eq('id', editingProductId);
            showToast('✅ Updated!', 'success');
            closeModal();
            await loadProducts();
            renderDashboard();
        } catch(e) { console.error('Update error:', e); showToast('❌ ' + e.message, 'error'); }
    };
    
    window.requestDeleteProduct = function(id, name) {
        if(!confirm('Delete "' + name + '"?')) return;
        safeFetch(function() { return sb.from('products').update({ delete_requested: true }).eq('id', id); }).then(function() {
            showToast('📩 Delete request sent!', 'success');
            loadProducts().then(function() { renderDashboard(); });
        }).catch(function(e) { showToast('❌ ' + e.message, 'error'); });
    };
    
    window.updateStatus = async function(id, status) {
        await sb.from('orders').update({ status: status }).eq('id', id);
        showToast('✅ Updated', 'success');
        await loadOrders();
        renderDashboard();
    };
    
    window.handleLogout = async function() { 
        if(confirm('Logout?')) { 
            try { await sb.auth.signOut(); } catch(e) {}
            localStorage.removeItem('zymart_session'); 
            localStorage.removeItem('zymart_user_role');
            localStorage.removeItem('zymart_user_phone');
            localStorage.removeItem('zymart_token');
            try {
                var keys = Object.keys(localStorage);
                for (var i = 0; i < keys.length; i++) {
                    if (keys[i].indexOf('sb-') === 0) { localStorage.removeItem(keys[i]); }
                }
            } catch(e) {}
            try { sessionStorage.clear(); } catch(e) {}
            location.href = 'index.html'; 
        } 
    };
    
    // ==================== INIT (WITH BACK BUTTON FIX) ====================
    async function init() {
        try {
            var sr = await sb.auth.getSession();
            if(sr && sr.data && sr.data.session) { 
                var user = sr.data.session.user;
                var userCheck = await safeFetch(function() { return sb.from('users').select('role').eq('id', user.id).maybeSingle(); });
                var role = userCheck.data ? userCheck.data.role : null;
                if(role === '2' || role === 'shop_owner' || role === '1' || role === 'admin') {
                    currentUser = user;
                } else {
                    window.location.href = 'index.html';
                    return;
                }
            }
            if(!currentUser) {
                var session = JSON.parse(localStorage.getItem('zymart_session') || 'null');
                if(session && session.userId && session.shopId) {
                    var userRole = localStorage.getItem('zymart_user_role') || '';
                    if(userRole === '2' || userRole === 'shop_owner') {
                        currentUser = { id: session.userId, phone: session.phone || '', email: session.email || session.phone + '@zymart.user' };
                    } else {
                        window.location.href = 'index.html';
                        return;
                    }
                }
            }
            if(!currentUser) { window.location.href = 'login.html?redirect=shop-dashboard.html'; return; }
            
            var shopRes = null;
            if(currentUser.email && currentUser.email.indexOf('@zymart.user') === -1) {
                shopRes = await safeFetch(function() { return sb.from('shops').select('*').eq('owner_email', currentUser.email).maybeSingle(); });
            }
            if(!shopRes || !shopRes.data) {
                var phone = currentUser.phone || localStorage.getItem('zymart_user_phone') || '';
                if(phone) { shopRes = await safeFetch(function() { return sb.from('shops').select('*').eq('owner_phone', phone).maybeSingle(); }); }
            }
            if(!shopRes || !shopRes.data) {
                $('app').innerHTML = '<div style="text-align:center;padding:80px;"><i class="fas fa-store-slash" style="font-size:56px;color:#D1D5DB;"></i><h3>No Shop Found</h3><button style="padding:12px 24px;margin-top:16px;background:#0B5A31;color:white;border:none;border-radius:9999px;font-size:14px;font-weight:600;cursor:pointer;" onclick="location.href=\'shop-register.html\'">Register Now</button></div>';
                return;
            }
            shopData = shopRes.data;
            
            if(shopData.status !== 'approved') {
                $('app').innerHTML = '<div style="text-align:center;padding:80px;"><i class="fas fa-clock" style="font-size:56px;color:#F59E0B;"></i><h3>Approval Pending</h3><p style="color:#6B7280;">Admin will review within 24 hours</p></div>';
                return;
            }
            
            var catRes = await safeFetch(function() { return sb.from('categories').select('id, name').eq('is_active', true).order('name'); });
            allCategories = catRes.data || [];
            
            await Promise.all([loadProducts(), loadOrders()]);
            renderDashboard();
            
            // 🔥 BACK BUTTON FIX: Dashboard pe hi rehna
            history.pushState(null, null, window.location.href);
            window.addEventListener('popstate', function() {
                // Back button se index.html pe jane se roko
                history.pushState(null, null, window.location.href);
            });
            
        } catch(e) {
            console.error('Init error:', e);
            $('app').innerHTML = '<div style="text-align:center;padding:80px;"><i class="fas fa-exclamation-circle" style="font-size:56px;color:#EF4444;"></i><h3>Failed to Load</h3><button style="padding:12px 24px;margin-top:16px;background:#0B5A31;color:white;border:none;border-radius:9999px;font-size:14px;font-weight:600;cursor:pointer;" onclick="init()">🔄 Retry</button></div>';
        }
    }
    
    document.addEventListener('DOMContentLoaded', init);
    
    window.switchTab = switchTab;
    window.closeModal = closeModal;
    window.showAddProduct = showAddProduct;
    window.showEditProduct = showEditProduct;
    window.setVariantType = setVariantType;
    window.addWeightRow = addWeightRow;
    window.addFlavourRow = addFlavourRow;
    window.handleFlavourPhoto = handleFlavourPhoto;
    window.handleProdImages = handleProdImages;
    window.saveProduct = saveProduct;
    window.updateProduct = updateProduct;
    window.requestDeleteProduct = requestDeleteProduct;
    window.updateStatus = updateStatus;
    window.copyOrderDetails = copyOrderDetails;
    window.handleLogout = handleLogout;
    
})();
</script>
</body>
</html>
