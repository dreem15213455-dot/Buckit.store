<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>शॉप डैशबोर्ड - Zymart</title>
    <meta name="theme-color" content="#0B5A31">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --brand-green: #0B5A31; --brand-green-light: #0F6E3B; --brand-green-dark: #083D21;
            --brand-orange: #F59E0B; --brand-orange-dark: #E8890A; --brand-orange-light: #FFB020;
            --brand-white: #F5F5F5; --neutral-white: #FFFFFF; --neutral-bg: #F9FAFB;
            --neutral-border: #E5E7EB; --neutral-gray: #6B7280; --neutral-dark: #1A1A1A;
            --danger: #EF4444; --danger-bg: #FEF2F2; --success: #22C55E; --success-bg: #EDF7F1;
            --warning: #F59E0B; --warning-bg: #FFF8EB;
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08); --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
            --radius-sm: 10px; --radius-md: 14px; --radius-lg: 18px; --radius-xl: 22px; --radius-full: 9999px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--neutral-bg); color: var(--neutral-dark); padding-bottom: 30px; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; min-height: 100vh; }
        
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes skel { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
        @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
        
        .top-bar { background: var(--brand-green); position: fixed; top: 0; left: 0; width: 100%; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; z-index: 100; box-shadow: 0 2px 16px rgba(11,90,49,0.3); }
        .back-btn { width: 40px; height: 40px; background: rgba(255,255,255,0.10); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 15px; }
        .shop-name-top { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 700; color: white; }
        .logout-btn { background: rgba(255,255,255,0.12); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 7px 14px; border-radius: var(--radius-full); font-size: 11px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
        
        .main-content { padding: 70px 14px 80px; max-width: 650px; margin: 0 auto; }
        
        .profile-card { background: white; border-radius: var(--radius-xl); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow-xs); border: 1px solid var(--neutral-border); }
        .profile-header { display: flex; align-items: center; gap: 12px; }
        .profile-avatar { width: 52px; height: 52px; background: #EDF7F1; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--brand-green); overflow: hidden; border: 2px solid #C8E6C9; }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-info h3 { font-size: 16px; font-weight: 700; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: var(--radius-full); font-size: 10px; font-weight: 700; }
        .badge-success { background: var(--success-bg); color: #059669; }
        .badge-premium { background: #FFF8EB; color: #D97706; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
        .stat-card { background: white; border-radius: var(--radius-lg); padding: 12px 8px; text-align: center; border: 1px solid var(--neutral-border); }
        .stat-icon { font-size: 18px; margin-bottom: 4px; }
        .stat-number { font-size: 18px; font-weight: 700; color: var(--brand-green); }
        .stat-label { font-size: 9px; color: var(--neutral-gray); }
        .stat-card.pending { background: #FFF8EB; border-color: #FDE68A; animation: bounce 2s infinite; }
        
        .alert-banner { background: #F59E0B; color: white; padding: 12px 16px; border-radius: var(--radius-lg); margin-bottom: 14px; display: none; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; font-size: 13px; }
        .alert-banner.show { display: flex; }
        
        .tabs { display: flex; gap: 6px; margin-bottom: 14px; background: white; padding: 5px; border-radius: var(--radius-full); border: 1px solid var(--neutral-border); }
        .tab { flex: 1; text-align: center; padding: 10px 6px; font-size: 11px; font-weight: 600; border-radius: var(--radius-full); cursor: pointer; color: var(--neutral-gray); border: none; background: transparent; font-family: 'Inter', sans-serif; }
        .tab.active { background: var(--brand-green); color: white; }
        
        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .product-card { background: white; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--neutral-border); }
        .product-card.low-stock { border-color: #FCA5A5; }
        .product-img { width: 100%; aspect-ratio: 1/1; background: #F9FAFB; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .product-img img { width: 100%; height: 100%; object-fit: contain; }
        .product-stock { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.7); color: white; padding: 2px 7px; border-radius: var(--radius-full); font-size: 9px; }
        .low-stock-badge { position: absolute; top: 6px; left: 6px; background: #EF4444; color: white; padding: 2px 7px; border-radius: var(--radius-full); font-size: 8px; font-weight: 700; }
        .product-info { padding: 10px; }
        .product-name { font-weight: 600; font-size: 12px; }
        .product-category { font-size: 9px; color: var(--brand-green); }
        .product-price { color: var(--brand-green); font-weight: 700; font-size: 13px; }
        .original-price { font-size: 10px; color: var(--neutral-gray); text-decoration: line-through; margin-left: 4px; }
        .product-actions { display: flex; gap: 6px; margin-top: 8px; }
        .btn-edit, .btn-delete { flex: 1; padding: 6px; border: none; border-radius: var(--radius-full); font-size: 10px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
        .btn-edit { background: #F3F5F4; color: var(--neutral-dark); }
        .btn-delete { background: var(--danger-bg); color: var(--danger); }
        
        .orders-list { background: white; border-radius: var(--radius-lg); border: 1px solid var(--neutral-border); overflow: hidden; }
        .order-item { padding: 14px; border-bottom: 1px solid var(--neutral-border); }
        .order-id { font-weight: 700; font-size: 13px; }
        .order-date { font-size: 11px; color: var(--neutral-gray); }
        .order-amount { font-weight: 700; color: var(--brand-green); font-size: 14px; }
        .order-status-select { padding: 5px 10px; border-radius: var(--radius-full); border: 1px solid var(--neutral-border); font-size: 11px; font-weight: 600; font-family: 'Inter', sans-serif; }
        .btn-wa { background: #25D366; color: white; padding: 6px 10px; border-radius: var(--radius-full); font-size: 10px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(8,61,33,0.7); backdrop-filter: blur(6px); display: none; align-items: flex-end; justify-content: center; z-index: 1000; }
        .modal-overlay.show { display: flex; }
        .modal-container { background: white; border-radius: var(--radius-xl) var(--radius-xl) 0 0; width: 100%; max-width: 550px; max-height: 85vh; overflow-y: auto; padding: 20px; animation: slideUp 0.3s ease; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--neutral-border); position: sticky; top: 0; background: white; z-index: 5; }
        .modal-header h3 { font-size: 17px; font-weight: 700; }
        .modal-close { width: 36px; height: 36px; background: #F3F5F4; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; font-size: 15px; }
        
        .form-group { margin-bottom: 13px; }
        .form-label { font-size: 12px; font-weight: 600; margin-bottom: 5px; display: block; }
        .form-control { width: 100%; padding: 10px 12px; border: 1.5px solid var(--neutral-border); border-radius: var(--radius-sm); font-size: 13px; font-family: 'Inter', sans-serif; background: white; outline: none; }
        .form-control:focus { border-color: var(--brand-orange); }
        .form-row { display: flex; gap: 10px; }
        .form-half { flex: 1; }
        
        .btn-primary, .btn-secondary { flex: 1; padding: 12px; border-radius: var(--radius-full); font-weight: 600; font-size: 14px; cursor: pointer; font-family: 'Inter', sans-serif; border: none; }
        .btn-primary { background: var(--brand-green); color: white; }
        .btn-secondary { background: transparent; color: var(--neutral-dark); border: 1.5px solid var(--neutral-border); }
        .btn-sm { padding: 6px 14px; font-size: 11px; border-radius: var(--radius-full); font-weight: 600; cursor: pointer; border: none; font-family: 'Inter', sans-serif; }
        
        .empty-state { text-align: center; padding: 40px 20px; background: white; border-radius: var(--radius-lg); border: 1px solid var(--neutral-border); }
        .empty-state i { font-size: 48px; color: #D1D5DB; margin-bottom: 12px; display: block; }
        
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1A1A1A; color: white; padding: 11px 22px; border-radius: var(--radius-full); font-size: 12px; z-index: 2000; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .toast.show { opacity: 1; visibility: visible; }
        
        .fab-calc { position: fixed; bottom: 100px; right: 20px; width: 56px; height: 56px; background: var(--brand-orange); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; z-index: 99; box-shadow: 0 6px 20px rgba(245,158,11,0.4); border: none; }
        
        .calc-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .calc-modal.show { display: flex; }
        .calc-container { background: white; border-radius: var(--radius-xl); padding: 20px; width: 90%; max-width: 350px; }
        .calc-tabs { display: flex; gap: 4px; margin-bottom: 14px; background: #F3F5F4; border-radius: var(--radius-full); padding: 4px; }
        .calc-tab { flex: 1; text-align: center; padding: 8px; font-size: 11px; font-weight: 600; border-radius: var(--radius-full); cursor: pointer; border: none; background: transparent; font-family: 'Inter', sans-serif; }
        .calc-tab.active { background: white; }
        .calc-input { width: 100%; padding: 10px; border: 1.5px solid var(--neutral-border); border-radius: var(--radius-sm); font-size: 14px; margin-bottom: 8px; font-family: 'Inter', sans-serif; text-align: center; }
        .calc-result { background: #EDF7F1; padding: 14px; border-radius: var(--radius-md); text-align: center; font-size: 20px; font-weight: 700; color: var(--brand-green); margin: 12px 0; }
        
        input[type="file"] { display: none; }
        @media (max-width: 380px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="app"><div style="text-align:center;padding:100px 20px;"><div style="width:34px;height:34px;border:3px solid #E5E7EB;border-top-color:#F59E0B;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 16px;"></div><p>लोड हो रहा है...</p></div></div>
    
    <button class="fab-calc" onclick="toggleCalculator()">🧮</button>
    
    <div class="calc-modal" id="calcModal">
        <div class="calc-container">
            <div class="modal-header"><h3>🧮 Calculator</h3><button class="modal-close" onclick="toggleCalculator()">✕</button></div>
            <div class="calc-tabs">
                <button class="calc-tab active" onclick="switchCalc('profit', this)">💰 Profit</button>
                <button class="calc-tab" onclick="switchCalc('discount', this)">🏷️ Discount</button>
                <button class="calc-tab" onclick="switchCalc('bill', this)">🧾 Bill</button>
            </div>
            <div id="calcContent"></div>
        </div>
    </div>
    
    <div id="toastMsg" class="toast"></div>

<script>
(function() {
    'use strict';
    
    var sb = supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co', 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1');
    var SUPABASE_URL = 'https://zwajyovemwdqtkecipeb.supabase.co';
    var currentUser = null, shopData = null, allCategories = [], products = [], orders = [];
    var currentTab = 'products';
    var productImages = [], productCompressedBlobs = [];
    var selectedShopImage = null, compressedShopBlob = null;
    
    function $(id) { return document.getElementById(id); }
    function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function showToast(m, e) { var t = document.getElementById('toastMsg'); if (!t) return; t.textContent = m; t.style.background = e ? '#EF4444' : '#1A1A1A'; t.classList.add('show'); setTimeout(function() { t.classList.remove('show'); }, 2500); }
    function getImageUrl(u) { if (!u) return ''; if (u.indexOf('http')===0||u.indexOf('data:')===0) return u; return SUPABASE_URL + '/storage/v1/object/public/' + u; }
    function getCatName(id) { var c = allCategories.find(function(x) { return x.id === id; }); return c ? c.name : (id || 'अन्य'); }
    
    async function safeFetch(fn) { try { var r = await fn(); if (r && r.error) throw new Error(r.error.message); return r; } catch(e) { throw e; } }
    
    // 🔥 IMAGE COMPRESS
    function compressImage(file) {
        return new Promise(function(resolve) {
            if (!file || !file.type.match(/image\//)) { resolve(file); return; }
            var reader = new FileReader();
            reader.onload = function(e) {
                var img = new Image();
                img.onload = function() {
                    var c = document.createElement('canvas');
                    var max = 600, w = img.width, h = img.height;
                    if (w > max || h > max) { var r = Math.min(max/w, max/h); w = Math.round(w*r); h = Math.round(h*r); }
                    c.width = w; c.height = h;
                    c.getContext('2d').drawImage(img, 0, 0, w, h);
                    c.toBlob(function(b) { resolve(new File([b], 'img.jpg', { type: 'image/jpeg' })); }, 'image/jpeg', 0.6);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }
    
    async function uploadImage(blob, folder, name) {
        var path = folder + '/' + name + '_' + Date.now() + '.jpg';
        var r = await sb.storage.from('product-images').upload(path, blob, { contentType: 'image/jpeg', upsert: true });
        if (r.error) throw new Error(r.error.message);
        return SUPABASE_URL + '/storage/v1/object/public/product-images/' + path;
    }
    
    // 🔥 CALCULATOR
    var currentCalc = 'profit';
    window.toggleCalculator = function() { var m = $('calcModal'); m.classList.toggle('show'); if (m.classList.contains('show')) renderCalc(); };
    window.switchCalc = function(t, btn) { currentCalc = t; document.querySelectorAll('.calc-tab').forEach(function(x) { x.classList.remove('active'); }); btn.classList.add('active'); renderCalc(); };
    
    function renderCalc() {
        var c = $('calcContent');
        if (currentCalc === 'profit') c.innerHTML = '<div class="form-row"><div class="form-half"><label class="form-label">Cost Price</label><input type="number" id="cp" class="calc-input" placeholder="CP" oninput="calcP()"></div><div class="form-half"><label class="form-label">Selling Price</label><input type="number" id="sp" class="calc-input" placeholder="SP" oninput="calcP()"></div></div><div class="calc-result" id="pr">--</div>';
        else if (currentCalc === 'discount') c.innerHTML = '<div class="form-row"><div class="form-half"><label class="form-label">Price</label><input type="number" id="dp" class="calc-input" placeholder="₹" oninput="calcD()"></div><div class="form-half"><label class="form-label">Discount %</label><input type="number" id="dd" class="calc-input" placeholder="%" oninput="calcD()"></div></div><div class="calc-result" id="dr">--</div>';
        else c.innerHTML = '<div class="form-row"><div class="form-half"><label class="form-label">Price</label><input type="number" id="bp" class="calc-input" placeholder="₹" oninput="calcB()"></div><div class="form-half"><label class="form-label">Qty</label><input type="number" id="bq" class="calc-input" placeholder="1" value="1" oninput="calcB()"></div></div><div class="calc-result" id="br">--</div>';
    }
    
    window.calcP = function() { var cp=parseFloat($('cp')?.value)||0, sp=parseFloat($('sp')?.value)||0; var p=sp-cp, r=$('pr'); if(r) r.innerHTML = (p>=0?'🟢 Profit: ':'🔴 Loss: ') + '₹' + Math.abs(p).toFixed(2) + (cp>0?' ('+((p/cp)*100).toFixed(1)+'%)':''); };
    window.calcD = function() { var p=parseFloat($('dp')?.value)||0, d=parseFloat($('dd')?.value)||0; var f=p-(p*d/100), r=$('dr'); if(r) r.innerHTML = '🏷️ Final: <b>₹'+f.toFixed(2)+'</b> (Save ₹'+(p*d/100).toFixed(2)+')'; };
    window.calcB = function() { var p=parseFloat($('bp')?.value)||0, q=parseFloat($('bq')?.value)||1, r=$('br'); if(r) r.innerHTML = '🧾 Total: <b>₹'+(p*q).toFixed(2)+'</b>'; };
    
    // 🔥 LOAD DATA
    async function loadProducts() { try { var r = await safeFetch(function() { return sb.from('products').select('*').eq('shop_id', shopData.id).order('created_at', { ascending: false }); }); products = r.data || []; } catch(e) { products = []; } }
    async function loadOrders() { try { var r = await safeFetch(function() { return sb.from('orders').select('*').eq('shop_id', shopData.id).order('created_at', { ascending: false }); }); orders = r.data || []; } catch(e) { orders = []; } }
    
    // 🔥 RENDER
    function renderStats() {
        var pc = orders.filter(function(o) { return o.status === 'pending'; }).length;
        var todayRev = orders.filter(function(o) { return new Date(o.created_at).toDateString() === new Date().toDateString() && o.status !== 'cancelled'; }).reduce(function(s, o) { return s + (parseFloat(o.total_amount)||0); }, 0);
        return '<div class="stats-grid"><div class="stat-card"><div class="stat-icon">📦</div><div class="stat-number">'+products.length+'</div><div class="stat-label">Products</div></div><div class="stat-card pending" onclick="switchTab(\'orders\')"><div class="stat-icon">🔔</div><div class="stat-number">'+pc+'</div><div class="stat-label">Pending</div></div><div class="stat-card" style="background:#EDF7F1;"><div class="stat-icon">💰</div><div class="stat-number">₹'+todayRev.toLocaleString('en-IN')+'</div><div class="stat-label">Today</div></div><div class="stat-card"><div class="stat-icon">📊</div><div class="stat-number">'+orders.length+'</div><div class="stat-label">Orders</div></div></div>';
    }
    
    function renderProducts() {
        if (!products.length) return '<div class="empty-state"><i class="fas fa-box-open"></i><h4>कोई प्रोडक्ट नहीं</h4><button class="btn-primary btn-sm" onclick="showAddProduct()">+ प्रोडक्ट जोड़ें</button></div>';
        var h = '<div style="margin-bottom:12px;"><button class="btn-primary btn-sm" onclick="showAddProduct()">+ प्रोडक्ट जोड़ें</button></div><div class="products-grid">';
        for (var i = 0; i < products.length; i++) {
            var p = products[i], img = (p.images && p.images.length) ? getImageUrl(p.images[0]) : '';
            var low = (p.stock || 0) < 5;
            h += '<div class="product-card'+(low?' low-stock':'')+'"><div class="product-img">'+(img?'<img src="'+img+'" loading="lazy">':'<i class="fas fa-box" style="font-size:40px;color:#D1D5DB;"></i>')+'<span class="product-stock">'+(p.stock||0)+'</span>'+(low?'<span class="low-stock-badge">⚠️ LOW</span>':'')+'</div><div class="product-info"><div class="product-name">'+esc(p.name)+'</div><div class="product-category">📂 '+getCatName(p.category_id)+'</div><div class="product-price">₹'+(p.offer_price||p.price)+(p.offer_price?'<span class="original-price">₹'+p.price+'</span>':'')+'</div><div class="product-actions"><button class="btn-edit" onclick="showEditProduct(\''+p.id+'\')">✏️</button><button class="btn-delete" onclick="deleteProduct(\''+p.id+'\')">🗑️</button></div></div></div>';
        }
        return h + '</div>';
    }
    
    function renderOrders() {
        if (!orders.length) return '<div class="empty-state"><i class="fas fa-receipt"></i><h4>कोई ऑर्डर नहीं</h4></div>';
        var h = '<div class="orders-list">';
        for (var i = 0; i < orders.length; i++) {
            var o = orders[i], items = [];
            try { items = JSON.parse(o.items || '[]'); } catch(e) {}
            var names = items.map(function(x) { return x.name || ''; }).join(', ');
            h += '<div class="order-item"><div><span class="order-id">#'+(o.id||'').slice(0,8).toUpperCase()+'</span> · <span class="order-date">'+new Date(o.created_at).toLocaleDateString('hi-IN')+'</span></div>'+(names?'<div style="font-size:12px;color:#6B7280;margin:4px 0;">📦 '+esc(names)+'</div>':'')+'<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;"><span class="order-amount">₹'+(parseFloat(o.total_amount)||0).toLocaleString('en-IN')+'</span><div style="display:flex;gap:6px;">'+(o.customer_phone?'<a href="https://wa.me/91'+o.customer_phone+'" target="_blank" class="btn-wa"><i class="fab fa-whatsapp"></i></a>':'')+'<select class="order-status-select" onchange="updateStatus(\''+o.id+'\',this.value)"><option value="pending"'+(o.status==='pending'?' selected':'')+'>लंबित</option><option value="confirmed"'+(o.status==='confirmed'?' selected':'')+'>कन्फर्म</option><option value="delivered"'+(o.status==='delivered'?' selected':'')+'>डिलीवर</option><option value="cancelled"'+(o.status==='cancelled'?' selected':'')+'>रद्द</option></select></div></div></div>';
        }
        return h + '</div>';
    }
    
    function renderDashboard() {
        var img = getImageUrl(shopData.image_url);
        var h = '<div class="top-bar"><button class="back-btn" onclick="location.href=\'index.html\'"><i class="fas fa-home"></i></button><span class="shop-name-top">'+esc(shopData.name)+'</span><button class="logout-btn" onclick="handleLogout()">लॉगआउट</button></div>';
        h += '<div class="main-content"><div class="profile-card"><div class="profile-header"><div class="profile-avatar">'+(img?'<img src="'+img+'">':'<i class="fas fa-store"></i>')+'</div><div class="profile-info"><h3>'+esc(shopData.name)+'</h3><span class="badge badge-success">✅ Approved</span><span class="badge badge-premium">⭐ Premium</span></div></div><button class="btn-secondary" style="width:100%;margin-top:10px;" onclick="showEditShop()">✏️ दुकान एडिट करें</button></div>';
        h += renderStats();
        h += '<div class="tabs"><button class="tab'+(currentTab==='products'?' active':'')+'" onclick="switchTab(\'products\')">📦 Products</button><button class="tab'+(currentTab==='orders'?' active':'')+'" onclick="switchTab(\'orders\')">📋 Orders</button></div><div id="tabContent">'+(currentTab==='products'?renderProducts():renderOrders())+'</div></div>';
        h += '<div id="modalOverlay" class="modal-overlay" onclick="if(event.target===this)closeModal()"><div id="modalContainer" class="modal-container"></div></div>';
        $('app').innerHTML = h;
    }
    
    window.switchTab = function(t) { currentTab = t; $('tabContent').innerHTML = currentTab==='products'?renderProducts():renderOrders(); };
    window.closeModal = function() { $('modalOverlay').classList.remove('show'); };
    
    // 🔥 ADD PRODUCT (FIXED)
    window.showAddProduct = function() {
        productImages = []; productCompressedBlobs = [];
        var catOpts = '<option value="">चुनें</option>';
        for (var i = 0; i < allCategories.length; i++) { catOpts += '<option value="'+allCategories[i].id+'">'+allCategories[i].name+'</option>'; }
        
        var h = '<div class="modal-header"><h3>➕ नया प्रोडक्ट</h3><button class="modal-close" onclick="closeModal()">✕</button></div>';
        h += '<div class="form-group"><label class="form-label">प्रोडक्ट नाम *</label><input type="text" id="prodName" class="form-control" placeholder="प्रोडक्ट का नाम"></div>';
        h += '<div class="form-group"><label class="form-label">श्रेणी *</label><select id="prodCat" class="form-control">'+catOpts+'</select></div>';
        h += '<div class="form-row"><div class="form-half"><label class="form-label">वज़न/मात्रा</label><input type="text" id="prodWeight" class="form-control" placeholder="1 kg / 500g / L / pcs"></div><div class="form-half"><label class="form-label">कीमत (₹) *</label><input type="number" id="prodPrice" class="form-control" placeholder="100"></div></div>';
        h += '<div class="form-row"><div class="form-half"><label class="form-label">ऑफर कीमत</label><input type="number" id="prodOffer" class="form-control" placeholder="80"></div><div class="form-half"><label class="form-label">स्टॉक *</label><input type="number" id="prodStock" class="form-control" placeholder="50" value="10"></div></div>';
        h += '<div class="form-group"><label class="form-label">फोटो (अधिकतम 4)</label><input type="file" id="prodImages" accept="image/*" multiple onchange="handleProdImages(this)" style="display:block;"></div><div id="prodImgPreview" style="display:flex;gap:6px;flex-wrap:wrap;"></div>';
        h += '<div style="display:flex;gap:10px;margin-top:16px;"><button class="btn-primary" onclick="saveProduct()">💾 सेव करें</button><button class="btn-secondary" onclick="closeModal()">रद्द करें</button></div>';
        $('modalContainer').innerHTML = h;
        $('modalOverlay').classList.add('show');
    };
    
    window.handleProdImages = async function(input) {
        var files = input.files;
        for (var i = 0; i < Math.min(files.length, 4); i++) {
            var comp = await compressImage(files[i]);
            productImages.push(files[i]);
            productCompressedBlobs.push(comp);
        }
        var preview = $('prodImgPreview');
        if (preview) {
            preview.innerHTML = '';
            for (var j = 0; j < productCompressedBlobs.length; j++) {
                preview.innerHTML += '<img src="'+URL.createObjectURL(productCompressedBlobs[j])+'" style="width:60px;height:60px;object-fit:cover;border-radius:8px;">';
            }
        }
    };
    
    // 🔥 SAVE PRODUCT (FIXED)
    window.saveProduct = async function() {
        var name = ($('prodName')?.value||'').trim();
        var catId = $('prodCat')?.value||'';
        var weight = ($('prodWeight')?.value||'').trim();
        var price = parseFloat($('prodPrice')?.value||0);
        var offer = parseFloat($('prodOffer')?.value||0)||null;
        var stock = parseInt($('prodStock')?.value||0);
        
        if (!name) { showToast('नाम डालें!', true); return; }
        if (!catId) { showToast('श्रेणी चुनें!', true); return; }
        if (!price || price <= 0) { showToast('कीमत डालें!', true); return; }
        
        try {
            var data = { shop_id: shopData.id, name: name, category_id: catId, price: price, offer_price: offer, stock: stock, is_active: true, created_at: new Date().toISOString() };
            
            // Parse weight (e.g., "1 kg", "500g", "2 L")
            if (weight) {
                var wmatch = weight.match(/^([\d.]+)\s*(kg|g|gm|gram|ml|l|liter|pcs|piece|dozen|दर्जन|पीस|किलो|ग्राम|लीटर)?$/i);
                if (wmatch) {
                    var wval = parseFloat(wmatch[1]);
                    var wunit = (wmatch[2]||'piece').toLowerCase();
                    if (wunit === 'gm' || wunit === 'gram' || wunit === 'ग्राम') wunit = 'gram';
                    else if (wunit === 'किलो') wunit = 'kg';
                    else if (wunit === 'लीटर') wunit = 'liter';
                    else if (wunit === 'पीस') wunit = 'piece';
                    else if (wunit === 'दर्जन') wunit = 'dozen';
                    data.weight = wval;
                    data.weight_unit = wunit;
                    data.unit = wunit;
                }
            }
            
            var insertResult = await safeFetch(function() { return sb.from('products').insert([data]).select(); });
            var productId = insertResult.data[0].id;
            
            // Upload images
            if (productCompressedBlobs.length > 0) {
                showToast('📸 फोटो अपलोड...');
                var urls = [];
                for (var i = 0; i < productCompressedBlobs.length; i++) {
                    var url = await uploadImage(productCompressedBlobs[i], 'products', 'prod_'+productId+'_'+i);
                    urls.push(url);
                }
                await safeFetch(function() { return sb.from('products').update({ images: urls }).eq('id', productId); });
            }
            
            showToast('✅ प्रोडक्ट जोड़ा!');
            closeModal();
            await loadProducts();
            renderDashboard();
            window.switchTab('products');
        } catch(e) { showToast('❌ विफल: '+e.message, true); }
    };
    
    // 🔥 EDIT PRODUCT
    window.showEditProduct = function(id) {
        var p = products.find(function(x) { return x.id === id; });
        if (!p) return;
        productImages = []; productCompressedBlobs = [];
        
        var catOpts = '<option value="">चुनें</option>';
        for (var i = 0; i < allCategories.length; i++) { catOpts += '<option value="'+allCategories[i].id+'"'+(allCategories[i].id===p.category_id?' selected':'')+'>'+allCategories[i].name+'</option>'; }
        
        var h = '<div class="modal-header"><h3>✏️ प्रोडक्ट एडिट</h3><button class="modal-close" onclick="closeModal()">✕</button></div>';
        h += '<div class="form-group"><label class="form-label">नाम</label><input type="text" id="prodName" class="form-control" value="'+esc(p.name)+'"></div>';
        h += '<div class="form-group"><label class="form-label">श्रेणी</label><select id="prodCat" class="form-control">'+catOpts+'</select></div>';
        h += '<div class="form-row"><div class="form-half"><label class="form-label">वज़न/मात्रा</label><input type="text" id="prodWeight" class="form-control" value="'+(p.weight?p.weight+' '+(p.weight_unit||p.unit||''):'')+'"></div><div class="form-half"><label class="form-label">कीमत (₹)</label><input type="number" id="prodPrice" class="form-control" value="'+p.price+'"></div></div>';
        h += '<div class="form-row"><div class="form-half"><label class="form-label">ऑफर कीमत</label><input type="number" id="prodOffer" class="form-control" value="'+(p.offer_price||'')+'"></div><div class="form-half"><label class="form-label">स्टॉक</label><input type="number" id="prodStock" class="form-control" value="'+(p.stock||0)+'"></div></div>';
        h += '<div class="form-group"><label class="form-label">नई फोटो (पुरानी बदलने के लिए)</label><input type="file" id="prodImages" accept="image/*" multiple onchange="handleProdImages(this)" style="display:block;"></div><div id="prodImgPreview" style="display:flex;gap:6px;flex-wrap:wrap;">';
        if (p.images) for (var j = 0; j < p.images.length; j++) { h += '<img src="'+getImageUrl(p.images[j])+'" style="width:60px;height:60px;object-fit:cover;border-radius:8px;">'; }
        h += '</div>';
        h += '<div style="display:flex;gap:10px;margin-top:16px;"><button class="btn-primary" onclick="updateProduct(\''+id+'\')">💾 अपडेट</button><button class="btn-secondary" onclick="closeModal()">रद्द करें</button></div>';
        $('modalContainer').innerHTML = h;
        $('modalOverlay').classList.add('show');
    };
    
    window.updateProduct = async function(id) {
        var name = ($('prodName')?.value||'').trim();
        var catId = $('prodCat')?.value||'';
        var weight = ($('prodWeight')?.value||'').trim();
        var price = parseFloat($('prodPrice')?.value||0);
        var offer = parseFloat($('prodOffer')?.value||0)||null;
        var stock = parseInt($('prodStock')?.value||0);
        
        if (!name || !catId || !price) { showToast('सभी फील्ड भरें!', true); return; }
        
        try {
            var updates = { name: name, category_id: catId, price: price, offer_price: offer, stock: stock };
            if (weight) {
                var wmatch = weight.match(/^([\d.]+)\s*(kg|g|gm|gram|ml|l|liter|pcs|piece|dozen)?$/i);
                if (wmatch) { updates.weight = parseFloat(wmatch[1]); updates.weight_unit = (wmatch[2]||'piece').toLowerCase(); updates.unit = updates.weight_unit; }
            }
            
            if (productCompressedBlobs.length > 0) {
                var urls = [];
                for (var i = 0; i < productCompressedBlobs.length; i++) {
                    urls.push(await uploadImage(productCompressedBlobs[i], 'products', 'prod_'+id+'_'+i));
                }
                updates.images = urls;
            }
            
            await safeFetch(function() { return sb.from('products').update(updates).eq('id', id); });
            showToast('✅ अपडेट!'); closeModal();
            await loadProducts(); renderDashboard(); window.switchTab('products');
        } catch(e) { showToast('❌ विफल: '+e.message, true); }
    };
    
    window.deleteProduct = async function(id) {
        if (!confirm('हटाएं?')) return;
        await safeFetch(function() { return sb.from('products').delete().eq('id', id); });
        showToast('🗑️ हटाया'); await loadProducts(); renderDashboard(); window.switchTab('products');
    };
    
    window.updateStatus = async function(id, status) {
        await safeFetch(function() { return sb.from('orders').update({ status: status }).eq('id', id); });
        showToast('✅ अपडेट'); await loadOrders(); renderDashboard(); window.switchTab('orders');
    };
    
    window.handleLogout = async function() { if (confirm('लॉगआउट?')) { await sb.auth.signOut(); location.href = 'index.html'; } };
    
    // 🔥 EDIT SHOP
    window.showEditShop = function() {
        var h = '<div class="modal-header"><h3>✏️ दुकान एडिट</h3><button class="modal-close" onclick="closeModal()">✕</button></div>';
        h += '<div class="form-group"><label class="form-label">नाम</label><input type="text" id="editName" class="form-control" value="'+esc(shopData.name)+'"></div>';
        h += '<div class="form-group"><label class="form-label">फ़ोन</label><input type="text" id="editPhone" class="form-control" value="'+esc(shopData.phone||'')+'"></div>';
        h += '<div class="form-group"><label class="form-label">शहर</label><input type="text" id="editCity" class="form-control" value="'+esc(shopData.city||'')+'"></div>';
        h += '<div class="form-group"><label class="form-label">पता</label><textarea id="editAddr" class="form-control">'+esc(shopData.address||'')+'</textarea></div>';
        h += '<div class="form-group"><label class="form-label">UPI ID</label><input type="text" id="editUpi" class="form-control" value="'+esc(shopData.upi_id||'')+'"></div>';
        h += '<div class="form-group"><label class="form-label">फोटो</label><input type="file" id="shopImg" accept="image/*" onchange="handleShopImg(this)" style="display:block;"></div>';
        h += '<div style="display:flex;gap:10px;margin-top:16px;"><button class="btn-primary" onclick="saveShopEdit()">💾 सेव करें</button><button class="btn-secondary" onclick="closeModal()">रद्द करें</button></div>';
        $('modalContainer').innerHTML = h;
        $('modalOverlay').classList.add('show');
    };
    
    window.handleShopImg = async function(input) {
        if (input.files[0]) { selectedShopImage = input.files[0]; compressedShopBlob = await compressImage(input.files[0]); }
    };
    
    window.saveShopEdit = async function() {
        var updates = { name: ($('editName')?.value||'').trim(), phone: ($('editPhone')?.value||'').trim(), city: ($('editCity')?.value||'').trim(), address: ($('editAddr')?.value||'').trim(), upi_id: ($('editUpi')?.value||'').trim() || null };
        if (compressedShopBlob) {
            var url = await uploadImage(compressedShopBlob, 'shop-images', 'shop_'+shopData.id);
            updates.image_url = url;
        }
        await safeFetch(function() { return sb.from('shops').update(updates).eq('id', shopData.id); });
        var r = await safeFetch(function() { return sb.from('shops').select('*').eq('id', shopData.id).single(); });
        shopData = r.data;
        showToast('✅ अपडेट!'); closeModal(); renderDashboard();
    };
    
    // 🔥 INIT
    async function init() {
        try {
            var sr = await sb.auth.getSession();
            if (!sr.data.session) { location.href = 'index.html'; return; }
            currentUser = sr.data.session.user;
            var shopRes = await safeFetch(function() { return sb.from('shops').select('*').eq('owner_email', currentUser.email).maybeSingle(); });
            if (!shopRes.data) { $('app').innerHTML = '<div style="text-align:center;padding:80px;"><h3>कोई दुकान नहीं</h3><button class="btn-primary" style="padding:12px 24px;margin-top:16px;" onclick="location.href=\'shop-register.html\'">रजिस्टर करें</button></div>'; return; }
            shopData = shopRes.data;
            if (shopData.status !== 'approved') { $('app').innerHTML = '<div style="text-align:center;padding:80px;"><i class="fas fa-clock" style="font-size:56px;color:#F59E0B;"></i><h3>स्वीकृति लंबित</h3></div>'; return; }
            
            var catRes = await safeFetch(function() { return sb.from('categories').select('id,name').eq('is_active',true).order('name'); });
            allCategories = catRes.data || [];
            await Promise.all([loadProducts(), loadOrders()]);
            renderDashboard();
        } catch(e) { $('app').innerHTML = '<div style="text-align:center;padding:80px;"><h3>लोड विफल</h3><button class="btn-primary" style="padding:12px 24px;margin-top:16px;" onclick="init()">पुनः प्रयास</button></div>'; }
    }
    
    document.addEventListener('DOMContentLoaded', init);
    
    // Expose to global scope
    window.showAddProduct = showAddProduct;
    window.showEditProduct = showEditProduct;
    window.saveProduct = saveProduct;
    window.updateProduct = updateProduct;
    window.deleteProduct = deleteProduct;
    window.showEditShop = showEditShop;
    window.saveShopEdit = saveShopEdit;
    window.handleProdImages = handleProdImages;
    window.handleShopImg = handleShopImg;
    window.switchTab = switchTab;
    window.closeModal = closeModal;
    window.updateStatus = updateStatus;
    window.handleLogout = handleLogout;
    window.toggleCalculator = toggleCalculator;
    window.switchCalc = switchCalc;
    window.calcP = calcP;
    window.calcD = calcD;
    window.calcB = calcB;
})();
</script>
</body>
</html>
