<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Shop Dashboard - ZyMart+</title>
<meta name="theme-color" content="#0B5A31">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
<link rel="preconnect" href="https://res.cloudinary.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--brand-green:#0B5A31;--brand-green-dark:#083D21;--brand-orange:#F59E0B;--neutral-white:#FFF;--neutral-bg:#F7F9F8;--neutral-border:#E5E7EB;--neutral-gray:#6B7280;--neutral-dark:#1A1A1A;--danger:#EF4444;--success:#22C55E;--shadow-xs:0 1px 2px rgba(0,0,0,.04);--shadow-sm:0 1px 4px rgba(0,0,0,.06);--shadow-md:0 4px 16px rgba(0,0,0,.08);--shadow-lg:0 10px 32px rgba(0,0,0,.10);--shadow-green:0 6px 20px rgba(11,90,49,.22);--shadow-green-lg:0 10px 28px rgba(11,90,49,.28);--radius-sm:10px;--radius-md:14px;--radius-lg:18px;--radius-xl:22px;--radius-2xl:26px;--radius-full:9999px;--status-bar-height:env(safe-area-inset-top,0px);--nav-h:64px;--gradient-green:linear-gradient(135deg,#0B5A31 0%,#0F6E3B 55%,#0B5A31 100%);--gradient-orange:linear-gradient(135deg,#F59E0B 0%,#EA580C 100%)}
*{margin:0;padding:0;box-sizing:border-box}
/* FONT MISMATCH FIX */
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--neutral-bg);color:var(--neutral-dark);padding-bottom:calc(80px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes badgePulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.4)}50%{box-shadow:0 0 0 6px rgba(34,197,94,0)}}
@keyframes brandPulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes pulseWarning{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.4)}50%{box-shadow:0 0 0 6px rgba(245,158,11,0)}}

.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 20px;min-height:60vh;gap:20px}
.loading-logo{font-family:'Poppins',sans-serif;font-size:34px;font-weight:800;animation:brandPulse 1.8s ease-in-out infinite;letter-spacing:-1px}
.loading-zy{color:var(--brand-green)}.loading-mart{color:var(--brand-orange)}
.loading-bar{width:60px;height:3px;background:#E5E7EB;border-radius:3px;overflow:hidden}
.loading-bar::after{content:'';display:block;width:40%;height:100%;background:var(--brand-green);border-radius:3px;animation:shimmer 1.2s ease-in-out infinite}
.loading-text{font-size:11px;color:var(--neutral-gray);font-weight:500;letter-spacing:.5px;text-transform:uppercase}

.top-bar{background:var(--gradient-green);position:fixed;top:0;left:0;width:100%;padding:10px 14px;padding-top:calc(10px + var(--status-bar-height));display:flex;align-items:center;justify-content:space-between;z-index:100;box-shadow:0 4px 20px rgba(11,90,49,.35);backdrop-filter:blur(10px)}
.back-btn,.icon-btn-top{width:40px;height:40px;background:rgba(255,255,255,.14);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:white;font-size:15px;text-decoration:none;transition:all .2s;position:relative;flex-shrink:0}
.back-btn:active,.icon-btn-top:active{background:rgba(255,255,255,.25);transform:scale(.92)}
.shop-name-top{font-family:'Poppins',sans-serif;font-size:14px;font-weight:700;color:white;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px}
.brand-zy{color:#A3E635}.brand-mart{color:#FDE047}
.top-actions{display:flex;gap:6px;align-items:center}
.notif-dot{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#EF4444;color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--brand-green);box-shadow:0 0 0 2px rgba(239,68,68,.3)}
.status-dot-top{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.status-dot-top.open{background:#22C55E;box-shadow:0 0 0 2px rgba(34,197,94,.4)}
.status-dot-top.closed{background:#EF4444}

.gps-alert-banner{position:relative;margin:10px 14px 0;padding:14px 16px;background:linear-gradient(135deg,#FEF2F2,#FEE2E2);border:2px solid #FECACA;border-radius:var(--radius-lg);animation:fadeInUp .3s ease}
.gps-alert-title{font-size:13px;font-weight:800;color:#991B1B;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.gps-alert-msg{font-size:11px;color:#B91C1C;line-height:1.5;margin-bottom:10px}
.gps-alert-btn{width:100%;padding:11px;background:linear-gradient(135deg,#EF4444,#DC2626);color:#fff;border:none;border-radius:var(--radius-full);font-size:12px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 12px rgba(239,68,68,.35)}
.gps-alert-btn:active{transform:scale(.97)}

.main-content{padding:calc(70px + var(--status-bar-height)) 14px 40px;max-width:650px;margin:0 auto}
.section-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-title-txt{font-family:'Poppins',sans-serif;font-size:17px;font-weight:800;color:var(--brand-green-dark)}
.section-action-link{font-size:11px;color:var(--brand-green);font-weight:700;cursor:pointer;padding:6px 10px;background:#EDF7F1;border-radius:9999px}

.profile-card{background:linear-gradient(135deg,#FFF 0%,#F7FDF9 100%);border-radius:var(--radius-2xl);padding:16px;margin-bottom:14px;box-shadow:var(--shadow-md);border:1px solid #D7EDDF;position:relative;overflow:hidden;animation:fadeInUp .4s ease}
.profile-card::before{content:'';position:absolute;top:-40px;right:-40px;width:140px;height:140px;background:radial-gradient(circle,rgba(163,230,53,.15) 0%,transparent 70%);pointer-events:none}
.profile-header{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.profile-avatar{width:56px;height:56px;background:linear-gradient(135deg,#EDF7F1,#D7EDDF);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--brand-green);overflow:hidden;border:3px solid #FFF;box-shadow:0 4px 12px rgba(11,90,49,.15);flex-shrink:0}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-info{flex:1;min-width:0}
.profile-shop-name{font-family:'Poppins',sans-serif;font-size:16px;font-weight:700;color:var(--brand-green-dark);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:3px;padding:4px 10px;border-radius:var(--radius-full);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.badge-success{background:linear-gradient(135deg,#EDF7F1,#D1FAE5);color:#059669;border:1px solid #A7F3D0}
.badge-verified{animation:badgePulse 2.5s ease-in-out infinite}
.badge-plan{background:linear-gradient(135deg,#FFF8EB,#FEF3C7);color:#B45309;border:1px solid #FDE68A}
.badge-closed{background:#FEE2E2;color:#DC2626;border:1px solid #FECACA}

.shop-toggle-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px dashed rgba(0,0,0,.1)}
.shop-toggle-label{font-size:12px;font-weight:700;color:var(--brand-green-dark);display:flex;align-items:center;gap:6px}
.toggle-pill{width:46px;height:26px;border-radius:13px;background:#D1D5DB;position:relative;transition:.2s;cursor:pointer;flex-shrink:0;border:none}
.toggle-pill.on{background:linear-gradient(135deg,#22C55E,#16A34A);box-shadow:0 2px 8px rgba(34,197,94,.35)}
.toggle-pill::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle-pill.on::after{transform:translateX(20px)}

.plan-status-card{background:linear-gradient(135deg,#EDF7F1,#D7EDDF);border-radius:var(--radius-xl);padding:14px;margin-bottom:14px;border:2px solid #A7F3D0;position:relative;overflow:hidden;animation:fadeInUp .5s ease}
.plan-status-card.warning{background:linear-gradient(135deg,#FFF8EB,#FEF3C7);border-color:#FDE68A}
.plan-status-card.danger{background:linear-gradient(135deg,#FEF2F2,#FEE2E2);border-color:#FECACA}
.plan-status-card.expired{background:linear-gradient(135deg,#F3F4F6,#E5E7EB);border-color:#D1D5DB}
.plan-status-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#22C55E,transparent)}
.plan-status-card.warning::before{background:linear-gradient(90deg,transparent,#F59E0B,transparent)}
.plan-status-card.danger::before{background:linear-gradient(90deg,transparent,#EF4444,transparent)}
.plan-status-card.expired::before{background:linear-gradient(90deg,transparent,#6B7280,transparent)}
.plan-top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px}
.plan-info-left{flex:1;min-width:0}
.plan-badge-label{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#059669;margin-bottom:3px}
.warning .plan-badge-label{color:#D97706}.danger .plan-badge-label{color:#DC2626}.expired .plan-badge-label{color:#6B7280}
.plan-name-big{font-family:'Poppins',sans-serif;font-size:15px;font-weight:800;color:var(--brand-green-dark);line-height:1.2}
.warning .plan-name-big{color:#92400E}.danger .plan-name-big{color:#991B1B}.expired .plan-name-big{color:#374151}
.days-left-badge{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;padding:6px 10px;border-radius:var(--radius-md);background:#fff;border:2px solid #22C55E;box-shadow:0 2px 8px rgba(34,197,94,.15)}
.days-left-badge.warning{border-color:#F59E0B;animation:pulseWarning 2s infinite}
.days-left-badge.danger{border-color:#EF4444;animation:pulseWarning 1.5s infinite}
.days-left-badge.expired{border-color:#6B7280;background:#F9FAFB}
.days-left-number{font-family:'Poppins',sans-serif;font-size:20px;font-weight:800;color:#059669;line-height:1}
.warning .days-left-number{color:#D97706}.danger .days-left-number{color:#DC2626}.expired .days-left-number{color:#6B7280}
.days-left-label{font-size:7px;font-weight:700;text-transform:uppercase;color:#059669;margin-top:2px}
.warning .days-left-label{color:#D97706}.danger .days-left-label{color:#DC2626}.expired .days-left-label{color:#6B7280}
.plan-usage-section{margin-top:8px}
.usage-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-size:11px;font-weight:600;color:#374151}
.usage-value{font-family:'Poppins',sans-serif;font-weight:800;color:var(--brand-green-dark)}
.usage-value.warning{color:#D97706}.usage-value.danger,.usage-value.exceeded{color:#DC2626}
.usage-bar-track{width:100%;height:6px;background:rgba(0,0,0,.08);border-radius:9999px;overflow:hidden}
.usage-bar-fill{height:100%;background:linear-gradient(90deg,#22C55E,#16A34A);border-radius:9999px;transition:width .4s ease}
.usage-bar-fill.warning{background:linear-gradient(90deg,#F59E0B,#EA580C)}
.usage-bar-fill.danger{background:linear-gradient(90deg,#EF4444,#DC2626)}
.usage-bar-fill.exceeded{background:linear-gradient(90deg,#991B1B,#7F1D1D)}
.plan-renew-row{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(0,0,0,.1);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.plan-expiry-date{font-size:10px;color:#6B7280;font-weight:600}
.plan-expiry-date strong{color:var(--brand-green-dark)}
.plan-renew-btn{padding:6px 12px;border-radius:9999px;background:linear-gradient(135deg,#0B5A31,#0F6E3B);color:#fff;border:none;font-size:10px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;box-shadow:0 2px 8px rgba(11,90,49,.25);display:inline-flex;align-items:center;gap:4px}
.plan-renew-btn.warning{background:linear-gradient(135deg,#F59E0B,#EA580C)}
.plan-renew-btn.danger{background:linear-gradient(135deg,#EF4444,#DC2626);animation:pulseWarning 1.5s infinite}

.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px;animation:fadeInUp .5s ease}
.stat-card{border-radius:var(--radius-lg);padding:14px 10px;text-align:center;border:1px solid var(--neutral-border);cursor:pointer;position:relative;overflow:hidden;transition:all .25s;background:#fff}
.stat-card:active{transform:scale(.96)}
.stat-card.products{background:linear-gradient(135deg,#EFF6FF,#DBEAFE);border-color:#BFDBFE}
.stat-card.products.limit-reached{background:linear-gradient(135deg,#FEF2F2,#FEE2E2);border-color:#FECACA}
.stat-card.pending{background:linear-gradient(135deg,#FFFBEB,#FEF3C7);border-color:#FDE68A}
.stat-card.revenue{background:linear-gradient(135deg,#F0FDF4,#DCFCE7);border-color:#BBF7D0}
.stat-card.orders{background:linear-gradient(135deg,#F5F3FF,#EDE9FE);border-color:#DDD6FE}
.stat-card.rating{background:linear-gradient(135deg,#FFF7ED,#FFEDD5);border-color:#FED7AA}
.stat-icon{font-size:20px;margin-bottom:6px}
.stat-number{font-family:'Poppins',sans-serif;font-size:20px;font-weight:800;color:var(--brand-green-dark);line-height:1.2}
.stat-card.products .stat-number{color:#1E40AF}
.stat-card.products.limit-reached .stat-number{color:#DC2626}
.stat-card.pending .stat-number{color:#B45309}
.stat-card.revenue .stat-number{color:#047857}
.stat-card.orders .stat-number{color:#6D28D9}
.stat-card.rating .stat-number{color:#C2410C}
.stat-label{font-size:9px;font-weight:700;color:var(--neutral-gray);text-transform:uppercase;letter-spacing:.4px;margin-top:4px}

.new-orders-alert{background:linear-gradient(135deg,#FFF8EB,#FEF3C7);border:2px solid #F59E0B;border-radius:var(--radius-lg);padding:14px;margin-bottom:14px;display:flex;align-items:center;gap:12px;animation:pop .3s ease}
.new-orders-icon{width:44px;height:44px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;box-shadow:0 2px 8px rgba(245,158,11,.25)}
.new-orders-info{flex:1;min-width:0}
.new-orders-title{font-size:13px;font-weight:800;color:#92400E;margin-bottom:2px}
.new-orders-sub{font-size:11px;color:#B45309}
.new-orders-btn{padding:9px 14px;background:linear-gradient(135deg,#F59E0B,#EA580C);color:#fff;border:none;border-radius:9999px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;box-shadow:0 2px 8px rgba(245,158,11,.3);white-space:nowrap}
.new-orders-btn:active{transform:scale(.96)}

.delete-req-banner{background:linear-gradient(135deg,#FEF2F2,#FEE2E2);border:2px solid #FECACA;border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.delete-req-banner i{color:#DC2626;font-size:18px;flex-shrink:0}
.delete-req-banner .drb-txt{font-size:12px;font-weight:600;color:#991B1B;flex:1}

.service-area-card,.radius-info-card{background:#fff;border-radius:var(--radius-lg);padding:14px;margin-bottom:12px;border:1px solid var(--neutral-border);box-shadow:var(--shadow-xs)}
.sa-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sa-info{flex:1}
.sa-label{font-size:10px;font-weight:700;color:var(--neutral-gray);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.sa-value{font-family:'Poppins',sans-serif;font-size:18px;font-weight:800;color:var(--brand-green-dark)}
.sa-sub{font-size:11px;color:var(--neutral-gray);margin-top:2px}
.sa-icon{width:46px;height:46px;background:linear-gradient(135deg,#EDF7F1,#D7EDDF);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--brand-green);flex-shrink:0}
.radius-help-text{font-size:10px;color:#6B7280;margin-top:8px;padding-top:8px;border-top:1px dashed #E5E7EB;line-height:1.5}

.tabs{display:flex;gap:6px;margin-bottom:12px;background:#fff;padding:5px;border-radius:var(--radius-full);border:1px solid var(--neutral-border);box-shadow:var(--shadow-xs);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;text-align:center;padding:9px 12px;font-size:11px;font-weight:600;border-radius:var(--radius-full);cursor:pointer;color:var(--neutral-gray);border:none;background:transparent;font-family:'Inter',sans-serif;transition:all .25s;white-space:nowrap;min-width:fit-content}
.tab.active{background:var(--gradient-green);color:#fff;box-shadow:var(--shadow-green);font-weight:700}

.filter-tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filter-tabs::-webkit-scrollbar{display:none}
.filter-tab{padding:8px 13px;border-radius:9999px;background:#fff;color:#6B7280;border:1.5px solid var(--neutral-border);font-size:11px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;transition:all .2s;flex-shrink:0}
.filter-tab.active{background:var(--gradient-green);color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(11,90,49,.2)}

.add-product-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px 20px;background:var(--gradient-green);color:#fff;border:none;border-radius:var(--radius-lg);font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;margin-bottom:14px;box-shadow:var(--shadow-green);position:relative;overflow:hidden;transition:all .2s}
.add-product-btn:active{transform:scale(.98)}
.add-product-btn.limit-reached{background:linear-gradient(135deg,#9CA3AF,#6B7280)}

.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.product-card{background:#fff;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--neutral-border);position:relative;transition:transform .25s,box-shadow .25s;animation:pop .3s ease}
.product-card:active{transform:scale(.98)}
.product-badge-stack{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:3px;z-index:5}
.p-badge{padding:3px 8px;border-radius:9999px;font-size:8px;font-weight:800;letter-spacing:.3px;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.p-badge.offer{background:linear-gradient(135deg,#EF4444,#F97316)}
.p-badge.featured{background:linear-gradient(135deg,#F59E0B,#D97706)}
.p-badge.hold{background:#6B7280}
.p-badge.delete{background:#DC2626}
.p-badge.inactive{background:#9CA3AF}
.product-img{width:100%;aspect-ratio:1/1;background:linear-gradient(135deg,#F9FAFB,#F3F4F6);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.product-img img{width:100%;height:100%;object-fit:contain;transition:transform .4s}
.product-card:active .product-img img{transform:scale(1.03)}
.product-stock{position:absolute;top:6px;right:6px;background:rgba(17,24,39,.75);backdrop-filter:blur(4px);color:#fff;padding:3px 8px;border-radius:9999px;font-size:9px;font-weight:700}
.product-info{padding:10px 10px 12px}
.product-name{font-weight:700;font-size:12px;line-height:1.3;color:var(--neutral-dark);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:30px}
.product-category{display:inline-block;font-size:9px;color:var(--brand-green);background:#EDF7F1;padding:2px 8px;border-radius:9999px;font-weight:600;margin-bottom:4px}
.product-variants-info{font-size:9px;color:var(--neutral-gray);margin-top:3px;line-height:1.35}
.product-price-row{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:4px}
.product-price{color:var(--brand-green);font-family:'Poppins',sans-serif;font-weight:800;font-size:15px}
.product-mrp{font-size:10px;color:#9CA3AF;text-decoration:line-through}
.product-actions{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.pa-btn{flex:1;min-width:38px;padding:8px 4px;border:none;border-radius:9999px;font-size:10px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s}
.pa-btn:active{transform:scale(.95)}
.pa-btn.edit{background:linear-gradient(135deg,#F3F5F4,#E5E7EB);color:var(--neutral-dark)}

.order-card.status-out_for_delivery-card::before{background:linear-gradient(180deg,#F59E0B,#EA580C)}
.order-card.status-delivered-card::before{background:linear-gradient(180deg,#22C55E,#16A34A)}
.order-card.status-cancelled-card::before{background:linear-gradient(180deg,#EF4444,#DC2626)}
.order-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px}
.order-id{font-family:'Poppins',sans-serif;font-weight:800;font-size:14px;color:var(--brand-green-dark);letter-spacing:-.3px}
.order-date{font-size:11px;color:var(--neutral-gray);margin-top:2px}
.order-status-badge{padding:5px 10px;border-radius:9999px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.status-pending{background:#FFF8EB;color:#D97706;border:1px solid #FDE68A}
.status-confirmed{background:#EFF6FF;color:#2563EB;border:1px solid #BFDBFE}
.status-out_for_delivery{background:#FEF3C7;color:#D97706;border:1px solid #FDE68A}
.status-delivered{background:#EDF7F1;color:#059669;border:1px solid #A7F3D0}
.status-cancelled{background:#FEF2F2;color:#DC2626;border:1px solid #FECACA}
.order-customer-row{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;margin-bottom:8px;flex-wrap:wrap}
.order-distance{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:9999px;background:#EFF6FF;color:#2563EB;font-size:10px;font-weight:700;border:1px solid #BFDBFE}

.order-address-box{font-size:11px;margin-bottom:8px;line-height:1.5;padding:10px 12px;background:linear-gradient(135deg,#FFF8EB,#FEF3C7);border-radius:var(--radius-sm);border:1.5px solid #FDE68A;color:#78350F;display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.order-address-box .addr-txt{flex:1;min-width:0}
.map-link-btn{background:#fff;color:#2563EB;border:1px solid #BFDBFE;padding:5px 9px;border-radius:8px;font-size:10px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap;flex-shrink:0}
.gps-verified-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;background:#D1FAE5;color:#059669;border-radius:9999px;font-size:9px;font-weight:700;margin-left:4px}
.order-items-list{background:#F9FAFB;border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:10px;border:1px solid #F3F4F6}

.order-item-row span:last-child{font-weight:700;color:var(--brand-green);white-space:nowrap}
.order-timeline{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;margin-bottom:10px;position:relative}
.order-timeline::before{content:'';position:absolute;top:50%;left:14px;right:14px;height:2px;background:#E5E7EB;transform:translateY(-50%);z-index:0}
.timeline-step{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.timeline-dot{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #D1D5DB;display:flex;align-items:center;justify-content:center;font-size:7px;color:#fff}
.timeline-step.done .timeline-dot{background:var(--brand-green);border-color:var(--brand-green)}

.timeline-label{font-size:8px;color:#6B7280;font-weight:500;white-space:nowrap}
.timeline-step.done .timeline-label{color:var(--brand-green);font-weight:700}
.timeline-step.active .timeline-label{color:#D97706;font-weight:700}
.order-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--neutral-border);padding-top:10px;gap:8px;flex-wrap:wrap}
.order-total{font-family:'Poppins',sans-serif;font-size:17px;font-weight:800;color:var(--brand-green-dark)}
.payment-badge{font-size:9px;color:#6B7280;margin-top:2px}
.order-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn-order{padding:9px 13px;border-radius:9999px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;border:none;transition:all .2s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn-order:active{transform:scale(.95)}
.btn-order.accept{background:linear-gradient(135deg,#22C55E,#16A34A);color:#fff;box-shadow:0 2px 8px rgba(34,197,94,.3)}
.btn-order.reject{background:linear-gradient(135deg,#EF4444,#DC2626);color:#fff;box-shadow:0 2px 8px rgba(239,68,68,.3)}
.btn-order.dispatch{background:linear-gradient(135deg,#F59E0B,#EA580C);color:#fff;box-shadow:0 2px 8px rgba(245,158,11,.3)}
.btn-order.deliver{background:linear-gradient(135deg,#0B5A31,#0F6E3B);color:#fff;box-shadow:0 2px 8px rgba(11,90,49,.3)}
.btn-order.view{background:#F3F5F4;color:#374151}
.btn-wa-small{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;border:none;display:inline-flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;box-shadow:0 2px 6px rgba(37,211,102,.3)}

.review-card{background:#fff;border-radius:var(--radius-lg);padding:14px;box-shadow:var(--shadow-sm);margin-bottom:10px;border:1px solid var(--neutral-border)}

.review-meta{flex:1;min-width:0}
.review-user{font-weight:700;font-size:12px;color:var(--neutral-dark)}
.review-date{font-size:10px;color:var(--neutral-gray);margin-top:1px}
.review-stars{color:#F59E0B;font-size:12px;margin-bottom:6px;letter-spacing:1px}

.rating-avg-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}

.rating-bar-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:10px;color:#6B7280}
.rating-bar-label{width:20px;font-weight:700}
.rating-bar-track{flex:1;height:6px;background:#F3F4F6;border-radius:3px;overflow:hidden}
.rating-bar-fill{height:100%;background:#F59E0B;border-radius:3px}
.rating-bar-count{width:24px;text-align:right;font-weight:600}
.review-empty{text-align:center;padding:40px 20px;background:#fff;border-radius:var(--radius-lg);border:1px solid var(--neutral-border)}
.review-empty i{font-size:44px;color:#D1D5DB;margin-bottom:10px;display:block}
.review-empty h4{font-family:'Poppins',sans-serif;font-size:15px;font-weight:700;color:var(--brand-green-dark);margin-bottom:4px}
.review-empty p{font-size:11px;color:#6B7280}

.combo-card{background:#fff;border-radius:var(--radius-lg);padding:12px;box-shadow:var(--shadow-sm);margin-bottom:10px;border:1px solid var(--neutral-border);display:flex;gap:12px}

.combo-actions{display:flex;gap:6px}
.combo-action{flex:1;padding:7px;border-radius:8px;border:none;font-size:10px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif}

.settings-card{background:#fff;border-radius:var(--radius-lg);padding:14px;margin-bottom:12px;border:1px solid var(--neutral-border)}

.notif-panel{position:fixed;top:calc(60px + var(--status-bar-height));right:12px;background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:calc(100% - 24px);max-width:340px;z-index:200;max-height:70vh;overflow-y:auto;display:none;border:1px solid var(--neutral-border)}
.notif-panel.show{display:block;animation:fadeIn .2s}
.notif-header{padding:12px 14px;border-bottom:1px solid #E5E7EB;font-weight:800;font-size:13px;display:flex;justify-content:space-between;align-items:center}

.modal-overlay{position:fixed;inset:0;background:rgba(8,61,33,.72);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}

.modal-close{width:34px;height:34px;background:#F3F5F4;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;font-size:14px;color:var(--neutral-dark)}

.form-group{margin-bottom:14px}
.form-label{font-size:12px;font-weight:700;margin-bottom:5px;display:block;color:var(--neutral-dark)}
.form-label .required{color:var(--danger)}
.form-label .optional{color:#9CA3AF;font-weight:500;font-size:11px}
.form-control{width:100%;padding:11px 13px;border:2px solid var(--neutral-border);border-radius:var(--radius-sm);font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:all .2s;background:#fff;color:var(--neutral-dark)}

.switch-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.switch-label{font-size:13px;font-weight:600;color:var(--neutral-dark)}

.variant-type-selector{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.vt-option{flex:1;min-width:70px;padding:10px 8px;border:2px solid var(--neutral-border);border-radius:var(--radius-full);font-size:11px;font-weight:600;cursor:pointer;background:#fff;font-family:'Inter',sans-serif;transition:all .2s}
.vt-option.active{border-color:var(--brand-green);background:linear-gradient(135deg,#EDF7F1,#D7EDDF);color:var(--brand-green);box-shadow:0 2px 8px rgba(11,90,49,.12)}
.variant-row{display:flex;gap:5px;align-items:center;margin-bottom:6px;flex-wrap:wrap;padding:10px;background:#F9FAFB;border-radius:8px;border:1px solid var(--neutral-border)}
.variant-row input,.variant-row select{padding:7px 9px;border:1.5px solid var(--neutral-border);border-radius:6px;font-size:11px;font-family:'Inter',sans-serif;outline:none}

.flavour-group{background:#fff;border:2px solid #E5E7EB;border-radius:12px;margin-bottom:10px;overflow:hidden}

.pack-sizes-container{padding:8px}

.pack-size-row input,.pack-size-row select{padding:6px;border:1.5px solid #E5E7EB;border-radius:5px;font-size:10px;font-family:'Inter',sans-serif;outline:none}
.btn-add-size{background:linear-gradient(135deg,#EFF6FF,#DBEAFE);color:#2563EB;border:1px dashed #93C5FD;padding:8px 10px;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;width:100%}
.btn-add-variant{background:linear-gradient(135deg,#EDF7F1,#D7EDDF);color:var(--brand-green);border:2px dashed var(--brand-green);width:100%;padding:12px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;margin-top:4px}

.btn-primary,.btn-secondary{flex:1;padding:14px;border-radius:var(--radius-full);font-weight:700;font-size:14px;cursor:pointer;font-family:'Inter',sans-serif;border:none;transition:all .2s}

.btn-primary:active,.btn-secondary:active{transform:scale(.97)}
.btn-secondary{background:#fff;color:var(--neutral-dark);border:2px solid var(--neutral-border)}

.empty-state{text-align:center;padding:40px 20px;background:linear-gradient(135deg,#FFF,#F9FEFB);border-radius:var(--radius-xl);border:1px solid var(--neutral-border);box-shadow:var(--shadow-xs)}

.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);background:var(--neutral-dark);color:#fff;padding:12px 20px;border-radius:var(--radius-full);font-size:12px;font-weight:600;z-index:2000;opacity:0;visibility:hidden;transition:all .3s cubic-bezier(.34,1.56,.64,1);max-width:90%;overflow:hidden;text-overflow:ellipsis;box-shadow:var(--shadow-lg)}

.lsd-header{padding:9px 12px;font-size:10px;font-weight:800;color:#6B7280;background:linear-gradient(135deg,#F9FAFB,#F3F4F6);border-bottom:1px solid #F3F4F6;text-transform:uppercase;letter-spacing:.5px;border-radius:var(--radius-lg) var(--radius-lg) 0 0;display:flex;justify-content:space-between;align-items:center}

.lsd-info{flex:1;min-width:0}
.lsd-name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}

function calcDistance(lat1,lon1,lat2,lon2){
  var R=6371;
  var dLat=(lat2-lat1)*Math.PI/180;
  var dLon=(lon2-lon1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  var c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  return R*c;
}

function compressImage(file){return new Promise(function(resolve){if(!file||!file.type.match(/image\//)){resolve(file);return}var TARGET_MIN=CONFIG.IMG_TARGET_MIN_KB*1024,TARGET_MAX=CONFIG.IMG_TARGET_MAX_KB*1024,TARGET_IDEAL=CONFIG.IMG_TARGET_IDEAL_KB*1024;if(file.size>=TARGET_MIN&&file.size<=TARGET_MAX){resolve(file);return}var reader=new FileReader();reader.onload=function(e){var img=new Image();img.onload=function(){var maxDim=CONFIG.IMG_MAX_DIM,w=img.width,h=img.height;if(w>maxDim||h>maxDim){var ratio=Math.min(maxDim/w,maxDim/h);w=Math.round(w*ratio);h=Math.round(h*ratio)}var canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;var ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,w,h);var qualities=[0.92,0.90,0.88,0.85,0.82,0.80,0.78,0.75,0.72,0.70,0.68,0.65,0.62];var idx=0,bestBlob=null,bestDiff=Infinity;function tryNext(){if(idx>=qualities.length){if(bestBlob&&bestBlob.size>TARGET_MAX){reduceDimensionsAndExport(canvas,w,h,resolve,file);return}if(bestBlob)resolve(new File([bestBlob],'img.jpg',{type:'image/jpeg'}));else resolve(file);return}var q=qualities[idx++];canvas.toBlob(function(blob){if(!blob){tryNext();return}if(blob.size>=TARGET_MIN&&blob.size<=TARGET_MAX){resolve(new File([blob],'img.jpg',{type:'image/jpeg'}));return}var diff=Math.abs(blob.size-TARGET_IDEAL);if(diff<bestDiff){bestDiff=diff;bestBlob=blob}tryNext()},'image/jpeg',q)}tryNext()};img.onerror=function(){resolve(file)};img.src=e.target.result};reader.onerror=function(){resolve(file)};reader.readAsDataURL(file)})}
function reduceDimensionsAndExport(canvas,w,h,resolve,fallbackFile){var newW=Math.round(w*0.7),newH=Math.round(h*0.7);var nc=document.createElement('canvas');nc.width=newW;nc.height=newH;var nctx=nc.getContext('2d');nctx.imageSmoothingEnabled=true;nctx.imageSmoothingQuality='high';nctx.drawImage(canvas,0,0,newW,newH);nc.toBlob(function(blob){if(blob)resolve(new File([blob],'img.jpg',{type:'image/jpeg'}));else resolve(fallbackFile)},'image/jpeg',0.78)}

window.toggleShopOpen=async function(){
  if(!shopData)return;
  var newState=!shopData.is_open;
  try{
    var r=await sb.from('shops').update({is_open:newState}).eq('id',shopData.id);
    if(r.error)throw new Error(r.error.message);
    shopData.is_open=newState;
    showToast(newState?'🟢 Shop ab OPEN hai!':'🔴 Shop ab CLOSED hai',newState?'success':'');
    renderDashboard();
  }catch(e){showToast('❌ '+e.message,'error')}
};
window.updateGPSLocation=async function(){
  if(!navigator.geolocation){showToast('❌ Geolocation not supported','error');return}
  showToast('📍 GPS location fetch ho rahi hai...');
  navigator.geolocation.getCurrentPosition(async function(pos){
    var lat=pos.coords.latitude,lng=pos.coords.longitude;
    try{
      var r=await sb.from('shops').update({latitude:lat,longitude:lng}).eq('id',shopData.id);
      if(r.error)throw new Error(r.error.message);
      shopData.latitude=lat;shopData.longitude=lng;
      showToast('✅ Location saved! Ab aapki dukan customers ko dikhegi.','success');
      renderDashboard();
    }catch(e){showToast('❌ '+e.message,'error')}
  },function(err){showToast('❌ GPS error: '+err.message,'error')},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
};

var ALLOWED_TRANSITIONS={pending:['confirmed','cancelled'],confirmed:['out_for_delivery'],out_for_delivery:['delivered'],delivered:[],cancelled:[]};
window.updateStatus=async function(id,status){
  var order=orders.find(function(o){return o.id===id});
  if(!order){showToast('Order not found','error');return}
  var oldStatus=order.status||'pending';
  var allowed=ALLOWED_TRANSITIONS[oldStatus]||[];
  if(allowed.indexOf(status)===-1){showToast('❌ Invalid transition: '+oldStatus+' → '+status,'error');return}
  if(status==='cancelled'){if(!confirm('⚠️ Cancel this order?')){return}}
  if(status==='delivered'){if(!confirm('Mark as delivered?')){return}}
  try{
    var data={status:status},now=new Date().toISOString();
    if(status==='confirmed')data.confirmed_at=now;
    else if(status==='cancelled')data.cancelled_at=now;
    else if(status==='out_for_delivery')data.out_for_delivery_at=now;
    else if(status==='delivered')data.delivered_at=now;
    var r=await sb.from('orders').update(data).eq('id',id);
    if(r.error)throw new Error(r.error.message);
    showToast('✅ Order '+status,'success');
    await loadOrders();renderDashboard();
  }catch(e){showToast('❌ '+e.message,'error')}
};
window.acceptOrder=function(id){updateStatus(id,'confirmed')};
window.rejectOrder=function(id){if(!confirm('❌ Reject this order?'))return;updateStatus(id,'cancelled')};
window.markOutForDelivery=function(id){updateStatus(id,'out_for_delivery')};
window.markDelivered=function(id){updateStatus(id,'delivered')};

function renderPlanStatus(){
  var pl=getPlanDaysLeft();if(!pl)return '';
  var limits=getPlanLimits();var productsCount=products.length;
  var usagePct=Math.min(100,Math.round((productsCount/limits.maxProducts)*100));
  var planLabel=getPlanLabel(shopData.plan_type);
  var daysLeft=pl.daysLeft,isExpired=pl.isExpired,cls='',badgeCls='',usageCls='',fillCls='';
  if(isExpired){cls='expired';badgeCls='expired';usageCls=productsCount>=limits.maxProducts?'exceeded':'danger';fillCls=usageCls}
  else if(daysLeft<=7){cls='danger';badgeCls='danger';usageCls=productsCount>=limits.maxProducts?'exceeded':(usagePct>=90?'danger':(usagePct>=70?'warning':''));fillCls=usageCls}
  else if(daysLeft<=30){cls='warning';badgeCls='warning';usageCls=productsCount>=limits.maxProducts?'danger':(usagePct>=90?'warning':'');fillCls=usageCls}
  else{usageCls=productsCount>=limits.maxProducts?'danger':(usagePct>=90?'warning':'');fillCls=usageCls}
  var expDateStr=pl.expiryDate.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
  var h='<div class="plan-status-card '+cls+'">';
  h+='<div class="plan-top-row"><div class="plan-info-left"><div class="plan-badge-label">👑 '+(isExpired?'PLAN EXPIRED':'ACTIVE PLAN')+'</div><div class="plan-name-big">'+planLabel+' Plan</div></div><div class="days-left-badge '+badgeCls+'"><div class="days-left-number">'+(isExpired?'0':String(daysLeft))+'</div><div class="days-left-label">'+(isExpired?'EXPIRED':'DAYS LEFT')+'</div></div></div>';
  h+='<div class="plan-usage-section"><div class="usage-row"><span>📦 Products</span><span class="usage-value '+usageCls+'">'+productsCount+' / '+limits.maxProducts+'</span></div><div class="usage-bar-track"><div class="usage-bar-fill '+fillCls+'" style="width:'+usagePct+'%"></div></div></div>';
  h+='<div class="plan-renew-row"><div class="plan-expiry-date">📅 Expires: <strong>'+expDateStr+'</strong></div><button class="plan-renew-btn '+(isExpired?'danger':(daysLeft<=7?'warning':''))+'" onclick="renewPlan()"><i class="fas fa-crown"></i> '+(isExpired?'Renew Now':'Renew')+'</button></div>';
  h+='</div>';
  return h;
}

function getSynonymsForToken(token){var result=[token];var lower=token.toLowerCase();if(SEARCH_SYNONYMS[lower])SEARCH_SYNONYMS[lower].forEach(function(s){if(result.indexOf(s)===-1)result.push(s)});Object.keys(SEARCH_SYNONYMS).forEach(function(k){var syns=SEARCH_SYNONYMS[k];for(var i=0;i<syns.length;i++){if(syns[i]===lower){if(result.indexOf(k)===-1)result.push(k);syns.forEach(function(s){if(result.indexOf(s)===-1)result.push(s)});break}}});return result}
function scoreProduct(p,q){var name=(p.name||'').toLowerCase(),cat=(getCatName(p.category_id)||'').toLowerCase(),brand=(p.brand_name||'').toLowerCase(),desc=(p.description||'').toLowerCase();var tokens=q.toLowerCase().trim().split(/\s+/).filter(Boolean);if(tokens.length===0)return 0;var score=0,matched=0;if(name.indexOf(q.toLowerCase())!==-1)score+=50;for(var t=0;t<tokens.length;t++){var tk=tokens[t],tmatched=false,tscore=0;if(name.indexOf(tk)!==-1){tscore=30;tmatched=true}if(cat.indexOf(tk)!==-1){tscore=Math.max(tscore,20);tmatched=true}if(brand.indexOf(tk)!==-1){tscore=Math.max(tscore,20);tmatched=true}if(desc.indexOf(tk)!==-1){tscore=Math.max(tscore,10);tmatched=true}if(!tmatched){var syns=getSynonymsForToken(tk);for(var s=0;s<syns.length;s++){if(syns[s]===tk)continue;if(name.indexOf(syns[s])!==-1){tscore=25;tmatched=true;break}}}if(tmatched){matched++;score+=tscore}}if(matched<tokens.length)return 0;return score}
window.handleSearch=function(val){searchQuery=(val||'').toLowerCase().trim();renderDashboard();if(!searchQuery||searchQuery.length<1){hideLiveDropdown();return}if(searchTimer)clearTimeout(searchTimer);searchTimer=setTimeout(function(){performLiveSearch(searchQuery)},200)};

function performLiveSearch(q){if(currentSection!=='products')return;var matches=[];for(var i=0;i<products.length;i++){var s=scoreProduct(products[i],q);if(s>0)matches.push({product:products[i],score:s})}matches.sort(function(a,b){return b.score-a.score});renderLiveDropdown(matches.slice(0,8),q)}

  var nameEl=$('prodName'),catEl=$('prodCat');var name=nameEl?nameEl.value.trim():'';var catId=catEl?catEl.value:'';var desc=$('prodDescription')?.value.trim()||'';
  if(!name){showToast('⚠️ Product name likhein!','error');return}if(name.length<3){showToast('⚠️ Name min 3 characters','error');return}if(!catId){showToast('⚠️ Category select karein!','error');return}

  try{
    var data={name:name,description:desc||null,category_id:catId,is_offer:isOffer,offer_tag:offerTag||null,is_active:isActive,is_featured:isFeatured};
    if(variantType==='simple'){var price=parseFloat($('prodPrice')?.value||0);var offer=($('prodOffer')?.value)?parseFloat($('prodOffer').value):null;var stock=parseInt($('prodStock')?.value||CONFIG.DEFAULT_STOCK);var weight=parseFloat($('prodWeight')?.value||0);var wu=$('prodWeightUnit')?.value||'kg';if(!price||price<=0){showToast('⚠️ Price!','error');return}if(offer&&offer>=price){showToast('⚠️ Offer < price!','error');return}data.price=price;data.offer_price=offer;data.stock=stock;data.weight=weight>0?weight:1;data.weight_unit=wu;data.unit=wu;data.variants=[];data.flavours=[];data.colors=[];data.has_variants=false;data.has_flavours=false;data.has_colors=false;data.variant_type='simple';data.size_type=null;data.specifications={}}
    else if(variantType==='weight'){var rv=collectWeightVariants();if(rv.length===0){showToast('⚠️ Variants!','error');return}var variants=[],ts=0,mp=Infinity;for(var i=0;i<rv.length;i++){var r=rv[i];variants.push({weight:r.weight,weight_unit:r.unit,unit:r.unit,price:r.price,offer_price:r.offer_price,stock:r.stock,image_url:null});ts+=r.stock;if(r.price<mp)mp=r.price}data.variants=variants;data.flavours=[];data.colors=[];data.stock=ts;data.price=mp;data.has_variants=true;data.has_flavours=false;data.has_colors=false;data.variant_type='weight';data.size_type=null;data.specifications={}}
    else if(variantType==='flavour'){var rf=collectFlavourGroups();if(rf.length===0){showToast('⚠️ Flavours!','error');return}var flavours=[],ts2=0,mp2=Infinity;for(var f=0;f<rf.length;f++){var rg=rf[f];var fo={name:rg.name,image_url:null,pack_sizes:rg.pack_sizes};if(existingFlavourPhotos[f])fo.image_url=existingFlavourPhotos[f];flavours.push(fo);for(var pi=0;pi<rg.pack_sizes.length;pi++){ts2+=rg.pack_sizes[pi].stock;if(rg.pack_sizes[pi].price<mp2)mp2=rg.pack_sizes[pi].price}}for(var fi=0;fi<flavours.length;fi++){if(flavourPhotoFiles[fi]){var cp=await compressImage(flavourPhotoFiles[fi]);flavours[fi].image_url=await uploadImage(cp,'products','flavour_'+editingProductId+'_'+fi+'_'+Date.now())}}data.flavours=flavours;data.variants=[];data.colors=[];data.stock=ts2;data.price=mp2;data.has_flavours=true;data.has_variants=false;data.has_colors=false;data.variant_type='flavour';data.size_type=null;data.specifications={}}
    else if(variantType==='color_size'){var rc=collectColorGroups();if(rc.length===0){showToast('⚠️ Colors!','error');return}var colors=[],ts3=0,mp3=Infinity;for(var c=0;c<rc.length;c++){var rgc=rc[c];var co={name:rgc.name,image_url:null,sizes:rgc.sizes};if(existingColorPhotos[c])co.image_url=existingColorPhotos[c];colors.push(co);for(var si=0;si<rgc.sizes.length;si++){ts3+=rgc.sizes[si].stock;if(rgc.sizes[si].price<mp3)mp3=rgc.sizes[si].price}}for(var ci=0;ci<colors.length;ci++){if(colorPhotoFiles[ci]){var cp2=await compressImage(colorPhotoFiles[ci]);colors[ci].image_url=await uploadImage(cp2,'products','color_'+editingProductId+'_'+ci+'_'+Date.now())}}data.colors=colors;data.variants=[];data.flavours=[];data.stock=ts3;data.price=mp3;data.has_colors=true;data.has_variants=false;data.has_flavours=false;data.variant_type='color_size';data.size_type=currentSizeType;data.specifications=collectSpecs()}
    if(isOffer){if(offerPhotoFile)data.offer_image=await uploadImage(await compressImage(offerPhotoFile),'products','offer_'+editingProductId+'_'+Date.now());else data.offer_image=existingOfferPhoto}else{data.offer_image=null}
    var fi2=existingImages.slice();if(productCompressedBlobs.length>0){var ps=[];for(var j=0;j<productCompressedBlobs.length;j++)ps.push(uploadImage(productCompressedBlobs[j],'products','prod_'+editingProductId+'_'+j+'_'+Date.now()));var up=await Promise.all(ps);for(var u=0;u<up.length;u++)fi2.push(up[u])}data.images=fi2;data.image_url=fi2[0]||null;
    await sb.from('products').update(data).eq('id',editingProductId);
    showToast('✅ Updated!','success');currentSpecs={};currentSizeType='adult';closeModal();await loadProducts();renderDashboard()
  }catch(e){console.error('updateProduct error:',e);showToast('❌ '+e.message,'error')}
};

window.showShopInfoModal=function(){
  var h='<div class="modal-header"><h3>Edit Shop Info</h3><button class="modal-close" onclick="closeModal()">✕</button></div>';
  h+='<div class="form-group"><label class="form-label">Shop Name</label><input type="text" id="sName" class="form-control" value="'+attrEsc(shopData.name||'')+'"></div>';
  h+='<div class="form-group"><label class="form-label">Address</label><textarea id="sAddress" class="form-control" rows="2">'+esc(shopData.address||'')+'</textarea></div>';
  h+='<div class="form-row"><div class="form-half"><label class="form-label">Taluka / City</label><input type="text" id="sCity" class="form-control" value="'+attrEsc(shopData.city||'')+'"></div><div class="form-half"><label class="form-label">District</label><input type="text" id="sDistrict" class="form-control" value="'+attrEsc(shopData.district||'')+'"></div></div>';
  h+='<div style="display:flex;gap:10px;margin-top:16px"><button class="btn-primary" onclick="saveShopInfo()">Save</button><button class="btn-secondary" onclick="closeModal()">Cancel</button></div>';
  $('modalContainer').innerHTML=h;$('modalOverlay').classList.add('show');
};
window.saveShopInfo=async function(){
  var name=$('sName')?.value.trim()||'';var address=$('sAddress')?.value.trim()||'';var city=$('sCity')?.value.trim()||'';var district=$('sDistrict')?.value.trim()||'';
  if(!name){showToast('⚠️ Name required','error');return}
  try{var r=await sb.from('shops').update({name:name,address:address,city:city,district:district}).eq('id',shopData.id);if(r.error)throw new Error(r.error.message);shopData.name=name;shopData.address=address;shopData.city=city;shopData.district=district;showToast('✅ Saved!','success');closeModal();renderDashboard()}catch(e){showToast('❌ '+e.message,'error')}
};

window.openComboModal=function(id){
  editingComboId=id||null;
  var c=id?comboOffers.find(function(x){return x.id===id}):null;
  var h='<div class="modal-header"><h3>'+(c?'Edit Combo':'Create Combo')+'</h3><button class="modal-close" onclick="closeModal()">✕</button></div>';
  h+='<div class="form-group"><label class="form-label">Title <span class="required">*</span></label><input type="text" id="cTitle" class="form-control" value="'+attrEsc(c?.title||'')+'"></div>';
  h+='<div class="form-group"><label class="form-label">Description</label><textarea id="cDesc" class="form-control" rows="2">'+esc(c?.description||'')+'</textarea></div>';
  h+='<div class="form-row"><div class="form-half"><label class="form-label">Offer Price ₹</label><input type="number" id="cOfferPrice" class="form-control" value="'+(c?.offer_price||'')+'"></div><div class="form-half"><label class="form-label">Original Price ₹</label><input type="number" id="cOriginalPrice" class="form-control" value="'+(c?.original_price||'')+'"></div></div>';
  h+='<div class="form-group"><label class="form-label">Select Products <span class="required">*</span></label><div style="max-height:200px;overflow-y:auto;background:#F9FAFB;border-radius:8px;padding:8px">';
  var selected=(c?.product_ids||[]);
  if(products.length===0)h+='<div style="font-size:11px;color:#6B7280;text-align:center;padding:16px">Pehle products add karein</div>';
  else{for(var i=0;i<products.length;i++){var p=products[i];if(p.delete_requested)continue;h+='<label style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid #E5E7EB;cursor:pointer;font-size:12px"><input type="checkbox" class="combo-prod-check" value="'+p.id+'"'+(selected.indexOf(p.id)!==-1?' checked':'')+'><span style="flex:1">'+esc(p.name)+'</span><span style="color:#0B5A31;font-weight:700">₹'+(parseFloat(p.price)||0).toLocaleString('en-IN')+'</span></label>'}}
  h+='</div></div>';
  h+='<div style="display:flex;gap:10px;margin-top:16px"><button class="btn-primary" onclick="saveCombo()">Save</button><button class="btn-secondary" onclick="closeModal()">Cancel</button></div>';
  $('modalContainer').innerHTML=h;$('modalOverlay').classList.add('show');
};
window.saveCombo=async function(){
  var title=$('cTitle')?.value.trim()||'';var desc=$('cDesc')?.value.trim()||'';var op=parseFloat($('cOfferPrice')?.value||0);var op2=parseFloat($('cOriginalPrice')?.value||0);
  var ids=[];var chks=document.querySelectorAll('.combo-prod-check');for(var i=0;i<chks.length;i++)if(chks[i].checked)ids.push(chks[i].value);
  if(!title){showToast('⚠️ Title required','error');return}if(ids.length===0){showToast('⚠️ Select at least 1 product','error');return}
  try{
    var data={shop_id:shopData.id,title:title,description:desc||null,offer_price:op||null,original_price:op2||null,product_ids:ids,is_active:true,display_order:comboOffers.length};
    if(editingComboId){var r=await sb.from('combo_offers').update(data).eq('id',editingComboId);if(r.error)throw new Error(r.error.message)}
    else{var r2=await sb.from('combo_offers').insert([data]);if(r2.error)throw new Error(r2.error.message)}
    showToast('✅ Combo saved!','success');closeModal();await loadCombos();renderDashboard()
  }catch(e){showToast('❌ '+e.message,'error')}
};
window.toggleComboActive=async function(id){
  var c=comboOffers.find(function(x){return x.id===id});if(!c)return;
  try{var r=await sb.from('combo_offers').update({is_active:!c.is_active}).eq('id',id);if(r.error)throw new Error(r.error.message);await loadCombos();renderDashboard()}catch(e){showToast('❌ '+e.message,'error')}
};

function getCategoryOptions(sel){var h='<option value="">Select Category</option>';for(var i=0;i<allCategories.length;i++){var c=allCategories[i];h+='<option value="'+c.id+'"'+(sel===c.id?' selected':'')+'>'+esc(c.name)+'</option>'}return h}

window.handleLogout=async function(){
  if(!confirm('Logout?'))return;
  _isLoggingOut=true;if(sessionRefreshTimer)clearInterval(sessionRefreshTimer);if(_orderRefreshTimer)clearInterval(_orderRefreshTimer);
  try{await sb.auth.signOut()}catch(e){}
  ['zymart_session','zymart_user_role','zymart_user_phone','zymart_user_email','zymart_token','zymart_shop_cache','zymart_notif_seen'].forEach(function(k){localStorage.removeItem(k)});
  try{Object.keys(localStorage).forEach(function(k){if(k.indexOf('sb-')===0)localStorage.removeItem(k)})}catch(e){}
  try{sessionStorage.clear()}catch(e){}
  window.location.href='index.html';
};

async function init(){
  try{
    try{history.pushState({page:'dashboard'},'',window.location.href)}catch(e){}
    var t0=Date.now();
    var authSession=null;try{var sr=await sb.auth.getSession();if(sr&&sr.data&&sr.data.session)authSession=sr.data.session}catch(e){}
    if(!authSession){window.location.href='login.html?redirect=shop-dashboard.html';return}
    var authUser=authSession.user;var authUid=authUser.id;var authEmail=(authUser.email||'').toLowerCase().trim();var authPhone=authUser.phone||'';
    currentUser={id:authUid,phone:authPhone,email:authEmail};
    var shopRes=null;
    try{var r1=await sb.from('shops').select('*').eq('owner_id',authUid).maybeSingle();shopRes=r1.data}catch(e){}
    if(!shopRes&&authEmail){try{var r2=await sb.from('shops').select('*').eq('owner_email',authEmail).maybeSingle();shopRes=r2.data}catch(e){}}
    if(!shopRes&&authPhone){var p10=authPhone.length>10?authPhone.substring(authPhone.length-10):authPhone;try{var r3=await sb.from('shops').select('*').eq('owner_phone',p10).maybeSingle();shopRes=r3.data}catch(e){}}
    if(!shopRes){$('app').innerHTML='<div style="text-align:center;padding:80px 20px"><i class="fas fa-store-slash" style="font-size:56px;color:#D1D5DB"></i><h3 style="margin-top:12px;font-family:Poppins">No Shop Found</h3><p style="color:#6B7280;font-size:13px;margin:6px 0 16px">Aapke account se koi shop linked nahi hai</p><button style="padding:12px 24px;background:#0B5A31;color:#fff;border:none;border-radius:9999px;font-size:13px;font-weight:600;cursor:pointer" onclick="location.href=\'shop-register.html\'">Register Now</button></div>';return}
    shopData=shopRes;
    if(shopData.status==='pending'){$('app').innerHTML='<div style="text-align:center;padding:80px 20px"><i class="fas fa-clock" style="font-size:56px;color:#F59E0B"></i><h3 style="margin-top:12px;font-family:Poppins">Approval Pending</h3><p style="color:#6B7280;font-size:13px">Admin 24 hours mein review karega</p></div>';return}
    if(shopData.status==='rejected'){$('app').innerHTML='<div style="text-align:center;padding:80px 20px"><i class="fas fa-times-circle" style="font-size:56px;color:#DC2626"></i><h3 style="margin-top:12px;font-family:Poppins">Shop Rejected</h3><p style="color:#6B7280;font-size:13px;margin-bottom:16px">Support se contact karein</p><a href="https://wa.me/91'+CONFIG.ADMIN_PHONE+'" style="padding:12px 24px;background:#0B5A31;color:#fff;border-radius:9999px;font-size:13px;font-weight:600;text-decoration:none">WhatsApp Support</a></div>';return}
    if(shopData.status!=='approved'){$('app').innerHTML='<div style="text-align:center;padding:80px 20px"><i class="fas fa-exclamation-circle" style="font-size:56px;color:#F59E0B"></i><h3>Status: '+esc(shopData.status)+'</h3></div>';return}
    renderDashboard();
    try{var cr=await sb.from('categories').select('id, name').eq('is_active',true).order('name');allCategories=cr.data||[]}catch(e){allCategories=[]}
    await Promise.all([loadProducts(),loadOrders(),loadReviews(),loadCombos(),loadDeliverySettings()]);
    renderDashboard();
    setTimeout(function(){var pl=getPlanDaysLeft();if(pl&&(pl.isExpired||pl.daysLeft<=7))showExpiryPopup()},500);
    checkNewOrders();startOrderAutoRefresh();requestNotifPermission();
    console.log('[Init] '+(Date.now()-t0)+'ms');
    startSessionRefresh();
    window.addEventListener('popstate',function(){if(_isLoggingOut)return;try{history.pushState({page:'dashboard'},'',window.location.href)}catch(e){}});
  }catch(e){console.error('Init error:',e);$('app').innerHTML='<div style="text-align:center;padding:80px 20px"><i class="fas fa-exclamation-circle" style="font-size:56px;color:#EF4444"></i><h3>Failed to Load</h3><p style="color:#6B7280;font-size:12px;margin:10px 0">'+esc(e.message||'Unknown error')+'</p><button style="padding:12px 24px;margin-top:16px;background:#0B5A31;color:#fff;border:none;border-radius:9999px;font-size:13px;font-weight:600;cursor:pointer" onclick="location.reload()">🔄 Retry</button></div>'}
}

document.addEventListener('DOMContentLoaded',function(){if(!navigator.onLine){var b=document.getElementById('netBanner');if(b)b.classList.add('show')}init()});
window.init=init;
})();
