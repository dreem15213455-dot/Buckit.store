<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Shop Dashboard - Zatpat</title>
    <meta name="theme-color" content="#FFD600">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.0/dist/browser-image-compression.js"></script>
    
    <style>
        :root {
            --primary: #FFD600;
            --primary-dark: #E5C200;
            --accent-green: #16A34A;
            --bg-light: #F5F5F5;
            --card-white: #FFFFFF;
            --text-primary: #1A1A1A;
            --text-secondary: #666666;
            --border-light: #E5E7EB;
            --danger: #EF4444;
            --success: #10B981;
            --warning: #F59E0B;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-2xl: 24px;
            --radius-full: 9999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
        }
        h1, h2, h3, h4, h5, h6 { font-family: 'Poppins', sans-serif; }

        .top-bar {
            background: var(--card-white);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 12px 16px;
            box-shadow: var(--shadow-sm);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-btn {
            width: 40px;
            height: 40px;
            background: var(--bg-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .brand-name { font-size: 22px; font-weight: 800; }
        .brand-name .normal { color: #000000; }
        .brand-name .pat { color: var(--accent-green); }
        .page-title { flex: 1; text-align: center; font-weight: 600; font-size: 16px; }
        .logout-header-btn {
            background: rgba(239,68,68,0.1);
            color: var(--danger);
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius-full);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logout-header-btn:hover { background: var(--danger); color: white; }

        .main-content {
            padding-top: 80px;
            padding-bottom: 85px;
            max-width: 1200px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
        }

        .shop-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            margin: 16px 0;
            padding: 24px;
            border-radius: var(--radius-xl);
            color: #000000;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .shop-avatar {
            width: 80px;
            height: 80px;
            background: rgba(0,0,0,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }
        .shop-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-upload-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--primary);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            border: 2px solid white;
            color: #000;
        }
        .shop-info h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; color: #000; }
        .shop-info p { font-size: 12px; opacity: 0.8; margin: 2px 0; color: #000; }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 600;
            margin-top: 8px;
            background: rgba(0,0,0,0.1);
            color: #000;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 16px 0;
        }
        .stat-card {
            background: var(--card-white);
            padding: 16px;
            border-radius: var(--radius-lg);
            text-align: center;
            border: 1px solid var(--border-light);
        }
        .stat-value { font-size: 24px; font-weight: 800; color: var(--accent-green); }
        .stat-label { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }

        .tabs {
            display: flex;
            margin: 16px 0;
            background: var(--card-white);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            overflow: hidden;
            flex-wrap: wrap;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 14px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .tab.active { background: var(--primary); color: #000000; }

        .products-section, .orders-section, .settings-section { margin: 16px 0; }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .section-header h3 { font-size: 18px; font-weight: 700; margin: 0; }
        .add-btn {
            background: var(--primary);
            color: #000000;
            border: none;
            padding: 8px 20px;
            border-radius: var(--radius-full);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .product-card {
            background: var(--card-white);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            overflow: hidden;
            transition: all 0.2s;
        }
        .product-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
        .product-image { width: 100%; height: 160px; object-fit: cover; background: var(--bg-light); }
        .product-variants-info {
            padding: 8px;
            background: var(--bg-light);
            border-top: 1px solid var(--border-light);
        }
        .variant-tag {
            display: inline-block;
            background: white;
            padding: 2px 8px;
            border-radius: var(--radius-full);
            font-size: 10px;
            margin: 2px;
            border: 1px solid var(--border-light);
        }
        .product-details { padding: 12px; }
        .product-name { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
        .product-price { font-size: 13px; font-weight: 700; color: var(--accent-green); }
        .product-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .edit-btn, .delete-btn {
            flex: 1;
            padding: 6px;
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .edit-btn { background: var(--bg-light); border: 1px solid var(--border-light); }
        .delete-btn { background: rgba(239,68,68,0.1); color: var(--danger); border: none; }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        .modal-overlay.show { display: flex; }
        .modal-content {
            background: white;
            border-radius: var(--radius-2xl);
            padding: 24px;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-content h3 { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-label { font-weight: 600; font-size: 13px; margin-bottom: 6px; display: block; }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            font-size: 14px;
        }
        textarea.form-control { resize: vertical; min-height: 80px; }
        .modal-buttons { display: flex; gap: 12px; margin-top: 24px; }
        .save-btn {
            flex: 1;
            background: var(--primary);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
        }
        .cancel-btn {
            flex: 1;
            background: transparent;
            border: 1px solid var(--border-light);
            padding: 12px;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
        }

        .payment-info-card {
            background: #E8F5E9;
            border: 1px solid var(--success);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 20px;
        }
        .qr-preview {
            max-width: 150px;
            max-height: 150px;
            border-radius: var(--radius-md);
            margin-top: 10px;
        }

        .loading-spinner { text-align: center; padding: 60px; color: var(--primary); }
        .text-muted { color: var(--text-secondary); font-size: 12px; }

        @media (max-width: 768px) {
            .products-grid { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: repeat(3, 1fr); }
            .tab { padding: 10px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="d-flex align-items-center gap-3">
            <div class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
            <div class="brand-name"><span class="normal">Zat</span><span class="pat">pat</span></div>
            <div class="page-title">Shop Dashboard</div>
        </div>
        <button class="logout-header-btn" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>

    <div class="main-content" id="mainContent">
        <div class="loading-spinner"><i class="fas fa-spinner fa-spin fa-2x"></i><p>Loading dashboard...</p></div>
    </div>

    <div class="modal-overlay" id="editProductModal">
        <div class="modal-content">
            <h3><i class="fas fa-edit"></i> Edit Product</h3>
            <div class="form-group">
                <label class="form-label">Product Name *</label>
                <input type="text" id="editProdName" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">Category</label>
                <input type="text" id="editProdCategory" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">Price (₹) *</label>
                <input type="number" id="editProdPrice" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">Offer Price (₹)</label>
                <input type="number" id="editProdOfferPrice" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">Stock</label>
                <input type="number" id="editProdStock" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea id="editProdDesc" class="form-control" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label><input type="checkbox" id="editProdFeatured"> Featured Product</label>
            </div>
            <div class="modal-buttons">
                <button class="save-btn" onclick="updateProduct()">Save Changes</button>
                <button class="cancel-btn" onclick="closeEditModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://zwajyovemwdqtkecipeb.supabase.co';
        const supabaseKey = 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let currentUser = null;
        let shop = null;
        let products = [];
        let orders = [];
        let activeTab = 'products';
        let currentEditProductId = null;

        async function compressImageToTarget(file) {
            try {
                const options = { maxSizeMB: 0.45, maxWidthOrHeight: 1024, useWebWorker: true, initialQuality: 0.8 };
                let compressedFile = await imageCompression(file, options);
                if ((compressedFile.size / 1024) > 500) {
                    compressedFile = await imageCompression(file, { maxSizeMB: 0.4, maxWidthOrHeight: 800, useWebWorker: true, initialQuality: 0.6 });
                }
                return compressedFile;
            } catch (error) { return file; }
        }

        async function uploadImage(file, folder) {
            const compressedFile = await compressImageToTarget(file);
            const fileExt = compressedFile.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
            const filePath = `${folder}/${fileName}`;
            const { error } = await supabaseClient.storage.from('shop-images').upload(filePath, compressedFile);
            if (error) throw error;
            const { data: publicUrl } = supabaseClient.storage.from('shop-images').getPublicUrl(filePath);
            return publicUrl.publicUrl;
        }

        async function checkUser() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { showLoginPrompt(); return false; }
            currentUser = user;
            const { data: shopData, error } = await supabaseClient.from('shops').select('*').eq('owner_id', user.id).single();
            if (error || !shopData) { showNoShopPrompt(); return false; }
            shop = shopData;
            if (shop.status !== 'approved') { showPendingApproval(); return false; }
            await loadProducts();
            await loadOrders();
            renderDashboard();
            return true;
        }

        async function loadProducts() {
            const { data, error } = await supabaseClient
                .from('products')
                .select('*')
                .eq('shop_id', shop.id)
                .order('created_at', { ascending: false });
            if (!error && data) {
                products = data;
                for (let product of products) {
                    const { data: variants } = await supabaseClient
                        .from('product_variants')
                        .select('*')
                        .eq('product_id', product.id);
                    product.variants = variants || [];
                    const prices = product.variants.map(v => v.offer_price || v.price);
                    product.minPrice = prices.length ? Math.min(...prices) : product.price;
                    product.maxPrice = prices.length ? Math.max(...prices) : product.price;
                }
            }
        }

        async function loadOrders() {
            const { data, error } = await supabaseClient
                .from('orders')
                .select('*')
                .eq('shop_id', shop.id)
                .order('created_at', { ascending: false })
                .limit(20);
            if (!error && data) orders = data;
        }

        async function deleteProduct(productId) {
            if (!confirm('Delete this product? All variants will also be deleted.')) return;
            await supabaseClient.from('product_variants').delete().eq('product_id', productId);
            await supabaseClient.from('products').delete().eq('id', productId);
            await loadProducts();
            renderDashboard();
        }

        // ========== EDIT PRODUCT FUNCTION ==========
        function editProduct(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            
            currentEditProductId = productId;
            
            document.getElementById('editProdName').value = product.name || '';
            document.getElementById('editProdCategory').value = product.category || '';
            document.getElementById('editProdPrice').value = product.price || '';
            document.getElementById('editProdOfferPrice').value = product.offer_price || '';
            document.getElementById('editProdStock').value = product.stock || 0;
            document.getElementById('editProdDesc').value = product.description || '';
            document.getElementById('editProdFeatured').checked = product.is_featured || false;
            
            document.getElementById('editProductModal').classList.add('show');
        }

        async function updateProduct() {
            const name = document.getElementById('editProdName').value.trim();
            const price = parseFloat(document.getElementById('editProdPrice').value);
            
            if (!name) { alert('Please enter product name'); return; }
            if (!price || isNaN(price)) { alert('Please enter valid price'); return; }
            
            const updates = {
                name: name,
                category: document.getElementById('editProdCategory').value,
                price: price,
                offer_price: parseFloat(document.getElementById('editProdOfferPrice').value) || null,
                description: document.getElementById('editProdDesc').value,
                stock: parseInt(document.getElementById('editProdStock').value) || 0,
                is_featured: document.getElementById('editProdFeatured').checked
            };
            
            const { error } = await supabaseClient
                .from('products')
                .update(updates)
                .eq('id', currentEditProductId);
            
            if (error) {
                alert('Error: ' + error.message);
            } else {
                alert('✅ Product updated successfully!');
                closeEditModal();
                await loadProducts();
                renderDashboard();
            }
        }

        function closeEditModal() {
            document.getElementById('editProductModal').classList.remove('show');
            currentEditProductId = null;
        }

        async function uploadShopPhoto(file) {
            try {
                const imageUrl = await uploadImage(file, 'shops');
                await supabaseClient.from('shops').update({ image_url: imageUrl }).eq('id', shop.id);
                shop.image_url = imageUrl;
                renderDashboard();
                alert('Shop photo updated!');
            } catch (error) { alert('Upload failed'); }
        }

        async function updatePaymentSettings() {
            const upiId = document.getElementById('editUpiId')?.value.trim();
            const upiName = document.getElementById('editUpiName')?.value.trim();
            
            if (upiId && !upiId.includes('@')) {
                alert('Please enter a valid UPI ID (format: name@bank)');
                return;
            }
            
            const updates = { upi_id: upiId || null, upi_name: upiName || null };
            const { error } = await supabaseClient.from('shops').update(updates).eq('id', shop.id);
            if (error) { alert('Error: ' + error.message); }
            else {
                shop.upi_id = upiId; shop.upi_name = upiName;
                alert('✅ Payment settings saved!');
                renderDashboard();
            }
        }
        
        async function uploadQrCode(file) {
            if (!file) return;
            try {
                const imageUrl = await uploadImage(file, 'qrcodes');
                await supabaseClient.from('shops').update({ qr_code_url: imageUrl }).eq('id', shop.id);
                shop.qr_code_url = imageUrl;
                alert('✅ QR Code uploaded!');
                renderDashboard();
            } catch (error) { alert('Upload failed: ' + error.message); }
        }

        async function updateShopSettings() {
            const updates = {
                name: document.getElementById('editShopName')?.value.trim(),
                phone: document.getElementById('editShopPhone')?.value.trim(),
                city: document.getElementById('editShopCity')?.value.trim(),
                address: document.getElementById('editShopAddress')?.value.trim(),
                is_open: document.getElementById('editShopOpen')?.value === 'true'
            };
            if (!updates.name || !updates.phone) { alert('Please fill shop name and phone'); return; }
            await supabaseClient.from('shops').update(updates).eq('id', shop.id);
            shop = { ...shop, ...updates };
            renderDashboard();
            alert('Settings saved!');
        }

        function renderDashboard() {
            const totalProducts = products.length;
            const totalOrders = orders.length;
            const totalEarnings = orders.reduce((sum, order) => sum + (order.total || 0), 0);
            
            let productsHtml = '';
            products.forEach(product => {
                const primaryImage = product.images?.[0] || product.image_url || 'https://placehold.co/300x160/FFD600/000?text=Product';
                const variantCount = product.variants?.length || 0;
                
                productsHtml += `
                    <div class="product-card">
                        <img src="${primaryImage}" class="product-image" onerror="this.src='https://placehold.co/300x160/FFD600/000?text=Product'">
                        <div class="product-details">
                            <div class="product-name">${escapeHtml(product.name)}</div>
                            <div class="product-price">₹${product.minPrice} - ₹${product.maxPrice}</div>
                            <div class="product-variants-info">
                                <span class="variant-tag"><i class="fas fa-layer-group"></i> ${variantCount} variants</span>
                                ${product.is_featured ? '<span class="variant-tag" style="background: var(--primary);">⭐ Featured</span>' : ''}
                            </div>
                            <div class="product-actions">
                                <div class="edit-btn" onclick="editProduct('${product.id}')"><i class="fas fa-edit"></i> Edit</div>
                                <div class="delete-btn" onclick="deleteProduct('${product.id}')"><i class="fas fa-trash"></i> Delete</div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            let ordersHtml = '';
            orders.slice(0,10).forEach(order => {
                let statusColor = '#D1FAE5';
                let statusTextColor = '#059669';
                if (order.order_status === 'pending') { statusColor = '#FEF3C7'; statusTextColor = '#D97706'; }
                else if (order.order_status === 'delivered') { statusColor = '#D1FAE5'; statusTextColor = '#059669'; }
                else if (order.order_status === 'cancelled') { statusColor = '#FEE2E2'; statusTextColor = '#DC2626'; }
                
                ordersHtml += `<div style="display: flex; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border-light);">
                    <div>${order.order_id || order.id.slice(0,8)}</div>
                    <div style="padding: 4px 10px; border-radius: var(--radius-full); font-size: 11px; background: ${statusColor}; color: ${statusTextColor};">${order.order_status || 'pending'}</div>
                    <div>₹${Math.round(order.total || 0)}</div>
                    <div><button class="btn-primary btn-sm" onclick="alert('Order details: ${order.order_id}')">View</button></div>
                </div>`;
            });
            
            const container = document.getElementById('mainContent');
            container.innerHTML = `
                <div class="shop-header">
                    <div class="shop-avatar" onclick="document.getElementById('shopPhotoInput').click()">
                        ${shop.image_url ? `<img src="${shop.image_url}">` : `<i class="fas fa-store"></i>`}
                        <div class="avatar-upload-btn"><i class="fas fa-camera"></i></div>
                        <input type="file" id="shopPhotoInput" accept="image/*" style="display: none;">
                    </div>
                    <div class="shop-info">
                        <h2>${escapeHtml(shop.name)}</h2>
                        <p>${shop.city || 'Location not set'} • ${shop.phone} • <strong>Category: ${escapeHtml(shop.category || 'General')}</strong></p>
                        <span class="status-badge">${shop.status}</span>
                    </div>
                </div>
                
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-value">${totalProducts}</div><div class="stat-label">Products</div></div>
                    <div class="stat-card"><div class="stat-value">${totalOrders}</div><div class="stat-label">Orders</div></div>
                    <div class="stat-card"><div class="stat-value">₹${totalEarnings}</div><div class="stat-label">Earnings</div></div>
                </div>
                
                <div class="tabs">
                    <div class="tab ${activeTab === 'products' ? 'active' : ''}" onclick="setTab('products')">Products</div>
                    <div class="tab ${activeTab === 'orders' ? 'active' : ''}" onclick="setTab('orders')">Orders</div>
                    <div class="tab ${activeTab === 'payments' ? 'active' : ''}" onclick="setTab('payments')">💳 Payments</div>
                    <div class="tab ${activeTab === 'settings' ? 'active' : ''}" onclick="setTab('settings')">Settings</div>
                </div>
                <div id="tabContent"></div>
            `;
            
            document.getElementById('shopPhotoInput').onchange = (e) => { if(e.target.files[0]) uploadShopPhoto(e.target.files[0]); };
            
            const tabContent = document.getElementById('tabContent');
            if (activeTab === 'products') {
                tabContent.innerHTML = `
                    <div class="products-section">
                        <div class="section-header"><h3>My Products</h3><button class="add-btn" onclick="alert('Add product feature - coming soon')">+ Add Product</button></div>
                        <div class="products-grid">${products.length ? productsHtml : '<div style="grid-column:1/-1; text-align:center; padding:40px;">No products yet. Click "Add Product" to get started.</div>'}</div>
                    </div>
                `;
            } else if (activeTab === 'orders') {
                tabContent.innerHTML = `<div class="orders-section"><div class="section-header"><h3>Recent Orders</h3></div><div class="orders-table" style="background: white; border-radius: var(--radius-lg); border: 1px solid var(--border-light); overflow: hidden;">${orders.length ? ordersHtml : '<div style="text-align:center; padding:40px;">No orders yet.</div>'}</div></div>`;
            } else if (activeTab === 'payments') {
                tabContent.innerHTML = `
                    <div class="settings-section">
                        <div class="section-header"><h3><i class="fas fa-rupee-sign"></i> Payment Settings</h3></div>
                        <div class="payment-info-card">
                            <div class="form-group">
                                <label class="form-label">UPI ID</label>
                                <input type="text" id="editUpiId" class="form-control" placeholder="example@okhdfcbank" value="${shop.upi_id || ''}">
                                <small>Customer will pay directly to this UPI ID</small>
                            </div>
                            <div class="form-group">
                                <label class="form-label">UPI Account Holder Name</label>
                                <input type="text" id="editUpiName" class="form-control" placeholder="Account holder name" value="${escapeHtml(shop.upi_name || '')}">
                            </div>
                            <button class="add-btn" onclick="updatePaymentSettings()" style="width:100%;">💾 Save UPI Settings</button>
                        </div>
                        <div class="payment-info-card">
                            <div class="form-group">
                                <label class="form-label">QR Code for Payments</label>
                                ${shop.qr_code_url ? `<img src="${shop.qr_code_url}" class="qr-preview" onclick="window.open(this.src)"><br><small>Click to view full QR</small><br>` : '<p>No QR code uploaded yet.</p>'}
                                <div class="image-upload-area" onclick="document.getElementById('qrUploadInput').click()" style="border: 2px dashed var(--primary); padding: 20px; text-align: center; cursor: pointer;">
                                    <i class="fas fa-cloud-upload-alt"></i>
                                    <p>Click to upload/update QR Code</p>
                                    <input type="file" id="qrUploadInput" accept="image/*" style="display: none;">
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('qrUploadInput').onchange = (e) => { if(e.target.files[0]) uploadQrCode(e.target.files[0]); };
            } else if (activeTab === 'settings') {
                tabContent.innerHTML = `
                    <div class="settings-section">
                        <div class="section-header"><h3>Shop Settings</h3></div>
                        <div class="form-card" style="background: white; border-radius: var(--radius-lg); padding: 20px; border: 1px solid var(--border-light);">
                            <div class="form-group"><label class="form-label"><i class="fas fa-store"></i> Shop Name</label><input type="text" id="editShopName" class="form-control" value="${escapeHtml(shop.name)}"></div>
                            <div class="form-group"><label class="form-label"><i class="fas fa-phone"></i> Phone Number</label><input type="tel" id="editShopPhone" class="form-control" value="${shop.phone}"></div>
                            <div class="form-group"><label class="form-label"><i class="fas fa-city"></i> City</label><input type="text" id="editShopCity" class="form-control" value="${escapeHtml(shop.city || '')}"></div>
                            <div class="form-group"><label class="form-label"><i class="fas fa-map-marker-alt"></i> Address</label><textarea id="editShopAddress" class="form-control" rows="2">${escapeHtml(shop.address || '')}</textarea></div>
                            <div class="form-group"><label class="form-label"><i class="fas fa-power-off"></i> Shop Status</label><select id="editShopOpen" class="form-control"><option value="true" ${shop.is_open ? 'selected' : ''}>Open</option><option value="false" ${!shop.is_open ? 'selected' : ''}>Closed</option></select></div>
                            <button class="add-btn" onclick="updateShopSettings()" style="width:100%; margin-top: 16px;">Save Settings</button>
                        </div>
                    </div>
                `;
            }
        }

        function setTab(tab) { activeTab = tab; renderDashboard(); }
        function showLoginPrompt() { document.getElementById('mainContent').innerHTML = `<div style="text-align:center; padding:60px;"><i class="fas fa-lock" style="font-size:64px;"></i><h3>Please Login</h3><button class="add-btn" onclick="goToLogin()">Login</button></div>`; }
        function showNoShopPrompt() { document.getElementById('mainContent').innerHTML = `<div style="text-align:center; padding:60px;"><i class="fas fa-store" style="font-size:64px;"></i><h3>No Shop Found</h3><button class="add-btn" onclick="goToRegister()">Register Shop</button></div>`; }
        function showPendingApproval() { document.getElementById('mainContent').innerHTML = `<div style="text-align:center; padding:60px;"><i class="fas fa-clock" style="font-size:64px; color:var(--warning);"></i><h3>Shop Pending Approval</h3><button class="add-btn" onclick="location.reload()">Refresh</button></div>`; }

        async function handleLogout() { if(confirm('Logout?')) { await supabaseClient.auth.signOut(); localStorage.clear(); window.location.href = 'index.html'; } }
        function goBack() { window.location.href = 'index.html'; }
        function goToLogin() { window.location.href = 'index.html'; }
        function goToRegister() { window.location.href = 'shop-register.html'; }
        function escapeHtml(text) { if(!text) return ''; return text.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }

        document.addEventListener('DOMContentLoaded', async () => {
            await checkUser();
            window.setTab = setTab;
            window.editProduct = editProduct;
            window.deleteProduct = deleteProduct;
            window.updateProduct = updateProduct;
            window.closeEditModal = closeEditModal;
            window.updatePaymentSettings = updatePaymentSettings;
            window.updateShopSettings = updateShopSettings;
            window.handleLogout = handleLogout;
            window.goBack = goBack;
        });
    </script>
</body>
</html>
