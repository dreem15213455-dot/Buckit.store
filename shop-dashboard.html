<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Shop Dashboard - ZyMart+</title>
    <meta name="theme-color" content="#0B5A31">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --brand-green: #0B5A31; 
            --brand-green-dark: #083D21; 
            --brand-orange: #F59E0B; 
            --neutral-white: #FFFFFF; 
            --neutral-bg: #F9FAFB; 
            --neutral-border: #E5E7EB; 
            --neutral-gray: #6B7280; 
            --neutral-dark: #1A1A1A; 
            --danger: #EF4444; 
            --success: #22C55E; 
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); 
            --shadow-sm: 0 1px 4px rgba(0,0,0,0.06); 
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08); 
            --radius-sm: 10px; 
            --radius-md: 14px; 
            --radius-lg: 18px; 
            --radius-xl: 22px; 
            --radius-full: 9999px;
            --status-bar-height: env(safe-area-inset-top, 0px);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--neutral-bg); 
            color: var(--neutral-dark); 
            padding-bottom: 30px; 
            -webkit-tap-highlight-color: transparent; 
            -webkit-font-smoothing: antialiased; 
            min-height: 100vh; 
            overflow-x: hidden; 
        }
        
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .top-bar { 
            background: var(--brand-green); 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            padding: 10px 14px; 
            padding-top: calc(10px + var(--status-bar-height));
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            z-index: 100; 
            box-shadow: 0 2px 16px rgba(11,90,49,0.3); 
        }
        
        .back-btn { 
            width: 40px; 
            height: 40px; 
            background: rgba(255,255,255,0.10); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            border: none; 
            color: white; 
            font-size: 15px; 
            text-decoration: none; 
        }
        
        .brand-zy { color: #A3E635; } 
        .brand-mart { color: #FDE047; }
        
        .shop-name-top { 
            font-family: 'Poppins', sans-serif; 
            font-size: 15px; 
            font-weight: 700; 
            color: white; 
        }
        
        .logout-btn { 
            background: rgba(255,255,255,0.12); 
            color: white; 
            border: 1px solid rgba(255,255,255,0.2); 
            padding: 7px 14px; 
            border-radius: var(--radius-full); 
            font-size: 11px; 
            font-weight: 600; 
            cursor: pointer; 
            font-family: 'Inter', sans-serif; 
        }
        
        .main-content { 
            padding: 70px 14px 40px; 
            max-width: 650px; 
            margin: 0 auto; 
        }
        
        .profile-card { 
            background: white; 
            border-radius: var(--radius-xl); 
            padding: 16px; 
            margin-bottom: 14px; 
            box-shadow: var(--shadow-xs); 
            border: 1px solid var(--neutral-border); 
        }
        
        .profile-header { display: flex; align-items: center; gap: 12px; }
        
        .profile-avatar { 
            width: 52px; 
            height: 52px; 
            background: #EDF7F1; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 24px; 
            color: var(--brand-green); 
            overflow: hidden; 
            border: 2px solid #C8E6C9; 
        }
        
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .badge { 
            display: inline-block; 
            padding: 3px 10px; 
            border-radius: var(--radius-full); 
            font-size: 10px; 
            font-weight: 700; 
        }
        
        .badge-success { background: #EDF7F1; color: #059669; }
        
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 8px; 
            margin-bottom: 14px; 
        }
        
        .stat-card { 
            background: white; 
            border-radius: var(--radius-lg); 
            padding: 12px 8px; 
            text-align: center; 
            border: 1px solid var(--neutral-border); 
            cursor: pointer; 
        }
        
        .stat-icon { font-size: 18px; margin-bottom: 4px; }
        .stat-number { font-size: 16px; font-weight: 700; color: var(--brand-green); }
        .stat-label { font-size: 9px; color: var(--neutral-gray); }
        .stat-card.pending { background: #FFF8EB; border-color: #FDE68A; }
        
        .tabs { 
            display: flex; 
            gap: 6px; 
            margin-bottom: 14px; 
            background: white; 
            padding: 5px; 
            border-radius: var(--radius-full); 
            border: 1px solid var(--neutral-border); 
        }
        
        .tab { 
            flex: 1; 
            text-align: center; 
            padding: 12px 10px; 
            font-size: 12px; 
            font-weight: 600; 
            border-radius: var(--radius-full); 
            cursor: pointer; 
            color: var(--neutral-gray); 
            border: none; 
            background: transparent; 
            font-family: 'Inter', sans-serif; 
        }
        
        .tab.active { background: var(--brand-green); color: white; }
        
        .add-product-btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            width: 100%; 
            padding: 16px 20px; 
            background: var(--brand-green); 
            color: white; 
            border: none; 
            border-radius: var(--radius-lg); 
            font-size: 16px; 
            font-weight: 700; 
            cursor: pointer; 
            font-family: 'Inter', sans-serif; 
            margin-bottom: 16px; 
        }
        
        .products-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 10px; 
        }
        
        .product-card { 
            background: white; 
            border-radius: var(--radius-lg); 
            overflow: hidden; 
            border: 1px solid var(--neutral-border); 
            position: relative;
        }
        
        .offer-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: #EF4444;
            color: white;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 8px;
            font-weight: 700;
            z-index: 5;
        }
        
        .product-img { 
            width: 100%; 
            aspect-ratio: 1/1; 
            background: #F9FAFB; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            overflow: hidden; 
        }
        
        .product-img img { width: 100%; height: 100%; object-fit: contain; }
        
        .product-stock { 
            position: absolute; 
            top: 6px; 
            right: 6px; 
            background: rgba(0,0,0,0.7); 
            color: white; 
            padding: 2px 7px; 
            border-radius: var(--radius-full); 
            font-size: 9px; 
        }
        
        .product-info { padding: 10px; }
        .product-name { font-weight: 600; font-size: 12px; }
        .product-category { font-size: 9px; color: var(--brand-green); }
        
        .product-price-row { 
            display: flex; 
            align-items: baseline; 
            gap: 6px; 
            flex-wrap: wrap; 
        }
        
        .product-price { 
            color: var(--brand-green); 
            font-weight: 700; 
            font-size: 14px; 
        }
        
        .product-variants-info {
            font-size: 9px;
            color: var(--neutral-gray);
            margin-top: 3px;
        }
        
        .product-actions { 
            display: flex; 
            gap: 4px; 
            margin-top: 8px; 
            flex-wrap: wrap; 
        }
        
        .btn-edit, .btn-delete { 
            flex: 1; 
            min-width: 45px; 
            padding: 8px 5px; 
            border: none; 
            border-radius: var(--radius-full); 
            font-size: 11px; 
            font-weight: 600; 
            cursor: pointer; 
            font-family: 'Inter', sans-serif; 
        }
        
        .btn-edit { background: #F3F5F4; color: var(--neutral-dark); }
        .btn-delete { background: #FEF2F2; color: var(--danger); }
        
        .order-card { 
            background: white; 
            border-radius: var(--radius-lg); 
            padding: 16px; 
            margin-bottom: 12px; 
            border: 1px solid var(--neutral-border); 
        }
        
        .order-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            margin-bottom: 10px; 
        }
        
        .order-id { font-weight: 700; font-size: 14px; color: var(--brand-green-dark); }
        .order-date { font-size: 11px; color: var(--neutral-gray); }
        
        .order-status-badge { 
            padding: 4px 10px; 
            border-radius: var(--radius-full); 
            font-size: 10px; 
            font-weight: 700; 
        }
        
        .status-pending { background: #FFF8EB; color: #D97706; }
        .status-confirmed { background: #EFF6FF; color: #2563EB; }
        .status-delivered { background: #EDF7F1; color: #059669; }
        .status-cancelled { background: #FEF2F2; color: #DC2626; }
        
        .order-customer-row { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            font-size: 14px; 
            font-weight: 600; 
            margin-bottom: 8px; 
        }
        
        .order-address-box { 
            font-size: 14px; 
            margin-bottom: 8px; 
            line-height: 1.7; 
            padding: 12px 14px; 
            background: #FFF8EB; 
            border-radius: var(--radius-sm); 
            border: 2px solid #FDE68A; 
        }
        
        .order-items-list { 
            background: #F9FAFB; 
            border-radius: var(--radius-sm); 
            padding: 10px 12px; 
            margin-bottom: 10px; 
        }
        
        .order-item-row { 
            display: flex; 
            justify-content: space-between; 
            font-size: 12px; 
            padding: 3px 0; 
        }
        
        .order-footer { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-top: 1px solid var(--neutral-border); 
            padding-top: 10px; 
        }
        
        .order-total { font-size: 16px; font-weight: 700; color: var(--brand-green-dark); }
        
        .order-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        
        .btn-copy { 
            background: #EFF6FF; 
            color: #2563EB; 
            padding: 8px 12px; 
            border-radius: var(--radius-full); 
            font-size: 10px; 
            font-weight: 600; 
            border: 1px solid #BFDBFE; 
            cursor: pointer; 
            font-family: 'Inter', sans-serif; 
        }
        
        .btn-wa { 
            background: #25D366; 
            color: white; 
            padding: 8px 12px; 
            border-radius: var(--radius-full); 
            font-size: 10px; 
            font-weight: 600; 
            text-decoration: none; 
        }
        
        .order-status-select { 
            padding: 8px 12px; 
            border-radius: var(--radius-full); 
            border: 1px solid var(--neutral-border); 
            font-size: 11px; 
            font-weight: 600; 
            font-family: 'Inter', sans-serif; 
        }
        
        .modal-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(8,61,33,0.7); 
            backdrop-filter: blur(6px); 
            display: none; 
            align-items: center; 
            justify-content: center; 
            z-index: 1000; 
            padding: 20px;
        }
        
        .modal-overlay.show { display: flex; }
        
        .modal-container { 
            background: white; 
            border-radius: var(--radius-xl); 
            width: 100%; 
            max-width: 550px; 
            max-height: 90vh; 
            overflow-y: auto; 
            padding: 24px; 
            animation: slideUp 0.3s ease; 
        }
        
        .modal-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            padding-bottom: 12px; 
            border-bottom: 1px solid var(--neutral-border); 
        }
        
        .modal-header h3 { font-size: 18px; font-weight: 700; }
        
        .modal-close { 
            width: 40px; 
            height: 40px; 
            background: #F3F5F4; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            border: none; 
            font-size: 16px; 
        }
        
        .form-group { margin-bottom: 16px; }
        
        .form-label { 
            font-size: 14px; 
            font-weight: 600; 
            margin-bottom: 6px; 
            display: block; 
        }
        
        .form-label .required { color: var(--danger); }
        
        .form-control { 
            width: 100%; 
            padding: 14px 16px; 
            border: 2px solid var(--neutral-border); 
            border-radius: var(--radius-sm); 
            font-size: 15px; 
            font-family: 'Inter', sans-serif; 
            outline: none; 
        }
        
        .form-control:focus { border-color: var(--brand-orange); }
        
        .form-row { display: flex; gap: 12px; }
        .form-half { flex: 1; }
        
        .variant-type-selector { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 14px; 
            flex-wrap: wrap;
        }
        
        .vt-option { 
            padding: 12px 16px; 
            border: 2px solid var(--neutral-border); 
            border-radius: var(--radius-full); 
            font-size: 12px; 
            font-weight: 600; 
            cursor: pointer; 
            background: white; 
            font-family: 'Inter', sans-serif; 
        }
        
        .vt-option.active { 
            border-color: var(--brand-green); 
            background: #EDF7F1; 
            color: var(--brand-green); 
        }
        
        .variant-row { 
            display: flex; 
            gap: 6px; 
            align-items: center; 
            margin-bottom: 8px; 
            flex-wrap: wrap; 
            padding: 12px; 
            background: #F9FAFB; 
            border-radius: var(--radius-sm); 
            border: 1px solid var(--neutral-border);
        }
        
        .variant-row input, .variant-row select { 
            padding: 8px 10px; 
            border: 1.5px solid var(--neutral-border); 
            border-radius: 8px; 
            font-size: 12px; 
            font-family: 'Inter', sans-serif; 
        }
        
        .flavour-group { 
            background: white;
            border: 2px solid #E5E7EB;
            border-radius: 12px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        
        .flavour-group-header {
            display: flex;
            gap: 10px;
            padding: 12px;
            background: #F9FAFB;
            border-bottom: 1px solid #E5E7EB;
            align-items: center;
        }
        
        .flavour-photo { 
            width: 50px; 
            height: 50px; 
            border-radius: 10px; 
            background: #EDF7F1; 
            border: 2px dashed var(--brand-green); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            font-size: 16px; 
            color: var(--brand-green); 
            overflow: hidden; 
            flex-shrink: 0; 
            position: relative; 
        }
        
        .flavour-photo img { width: 100%; height: 100%; object-fit: cover; }
        .flavour-photo.uploaded { border-style: solid; border-color: #22C55E; background: #D1FAE5; }
        .flavour-photo input { display: none; }
        
        .pack-sizes-container {
            padding: 10px;
            background: #FAFBFC;
        }
        
        .pack-size-row {
            display: flex;
            gap: 6px;
            align-items: center;
            padding: 8px;
            background: white;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        
        .pack-size-row input, .pack-size-row select {
            padding: 8px;
            border: 1.5px solid #E5E7EB;
            border-radius: 6px;
            font-size: 11px;
            font-family: 'Inter', sans-serif;
        }
        
        .btn-add-size {
            background: #EFF6FF;
            color: #2563EB;
            border: 1px dashed #93C5FD;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            width: 100%;
        }
        
        .btn-add-variant { 
            background: #EDF7F1; 
            color: var(--brand-green); 
            border: 2px dashed var(--brand-green); 
            width: 100%; 
            padding: 14px; 
            border-radius: var(--radius-sm); 
            font-size: 14px; 
            font-weight: 600; 
            cursor: pointer; 
            font-family: 'Inter', sans-serif; 
        }
        
        .btn-primary, .btn-secondary { 
            flex: 1; 
            padding: 16px; 
            border-radius: var(--radius-full); 
            font-weight: 700; 
            font-size: 16px; 
            cursor: pointer; 
            font-family: 'Inter', sans-serif; 
            border: none; 
        }
        
        .btn-primary { background: var(--brand-green); color: white; }
        .btn-secondary { background: transparent; color: var(--neutral-dark); border: 2px solid var(--neutral-border); }
        
        .empty-state { 
            text-align: center; 
            padding: 40px 20px; 
            background: white; 
            border-radius: var(--radius-lg); 
            border: 1px solid var(--neutral-border); 
        }
        
        .toast { 
            position: fixed; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: #1A1A1A; 
            color: white; 
            padding: 12px 24px; 
            border-radius: var(--radius-full); 
            font-size: 13px; 
            z-index: 2000; 
            opacity: 0; 
            visibility: hidden; 
            transition: all 0.3s ease; 
        }
        
        .toast.show { opacity: 1; visibility: visible; }
        .toast.error { background: #EF4444; }
        .toast.success { background: #059669; }
        
        .existing-img-container {
            position: relative;
            width: 70px;
            height: 70px;
            display: inline-block;
            margin: 4px;
        }
        
        .existing-img-container img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #22C55E;
        }
        
        .existing-img-remove {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #EF4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        @media(max-width: 380px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .products-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
        }
    </style>
</head>
<body>

<div id="app">
    <div style="text-align:center;padding:100px 20px;">
        <div style="width:34px;height:34px;border:3px solid #E5E7EB;border-top-color:#F59E0B;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 16px;"></div>
        <p>Loading...</p>
    </div>
</div>

<div id="modalOverlay" class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div id="modalContainer" class="modal-container"></div>
</div>

<div id="toastMsg" class="toast"></div>

<script>
(function() {
    'use strict';
    
    var CONFIG = {
        SUPABASE_URL: 'https://zwajyovemwdqtkecipeb.supabase.co',
        SUPABASE_KEY: 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1',
        DEFAULT_STOCK: 10
    };
    
    var sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
    var SUPABASE_URL = CONFIG.SUPABASE_URL;
    
    var currentUser = null;
    var shopData = null;
    var allCategories = [];
    var products = [];
    var orders = [];
    var currentTab = 'products';
    var editingProductId = null;
    var existingImages = [];
    var productCompressedBlobs = [];
    var variantType = 'weight';
    var flavourPhotoFiles = {};
    var existingFlavourPhotos = {};
    var offerPhotoFile = null;
    var existingOfferPhoto = null;
    var sessionRefreshTimer = null;
    
    function $(id) { return document.getElementById(id); }
    function esc(s) { if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function showToast(m, type) { var t = $('toastMsg'); if(!t) return; t.textContent = m; t.className = 'toast'; if(type === 'error') t.classList.add('error'); else if(type === 'success') t.classList.add('success'); t.classList.add('show'); setTimeout(function() { t.classList.remove('show','error','success'); }, 2500); }
    function getImageUrl(u) { if(!u) return ''; if(u.indexOf('http')===0 || u.indexOf('data:')===0) return u; return SUPABASE_URL + '/storage/v1/object/public/' + u; }
    function getCatName(id) { var c = allCategories.find(function(x) { return x.id === id; }); return c ? c.name : (id || 'Other'); }
    async function safeFetch(fn) { try { var r = await fn(); if(r && r.error) throw new Error(r.error.message); return r; } catch(e) { throw e; } }
    
    // Session refresh function
    async function refreshSession() {
        try {
            var sr = await sb.auth.getSession();
            if(sr && sr.data && sr.data.session) {
                currentUser = sr.data.session.user;
                return true;
            }
        } catch(e) {}
        
        // Check localStorage session
        var session = JSON.parse(localStorage.getItem('zymart_session') || 'null');
        if(session && session.userId && session.shopId) {
            currentUser = { id: session.userId, phone: session.phone || '', email: session.email || session.phone + '@zymart.user' };
            return true;
        }
        return false;
    }
    
    // Start session refresh timer - every 5 minutes
    function startSessionRefresh() {
        if(sessionRefreshTimer) clearInterval(sessionRefreshTimer);
        sessionRefreshTimer = setInterval(async function() {
            var valid = await refreshSession();
            if(!valid) {
                showToast('Session expired. Please login again.', 'error');
                setTimeout(function() { location.href = 'login.html?redirect=shop-dashboard.html'; }, 1500);
            }
        }, 5 * 60 * 1000);
    }
    
    function compressImage(file) {
        return new Promise(function(resolve) {
            if(!file || !file.type.match(/image\//)) { resolve(file); return; }
            
            var reader = new FileReader();
            reader.onload = function(e) {
                var img = new Image();
                img.onload = function() {
                    var canvas = document.createElement('canvas');
                    var ctx = canvas.getContext('2d');
                    
                    var maxDim = 600;
                    var w = img.width, h = img.height;
                    
                    if(w > maxDim || h > maxDim) {
                        var ratio = Math.min(maxDim/w, maxDim/h);
                        w = Math.round(w * ratio);
                        h = Math.round(h * ratio);
                    }
                    
                    canvas.width = w;
                    canvas.height = h;
                    ctx.drawImage(img, 0, 0, w, h);
                    
                    function tryCompress(quality) {
                        canvas.toBlob(function(blob) {
                            if(blob && blob.size > 150 * 1024 && quality > 0.3) {
                                tryCompress(quality - 0.1);
                            } else if(blob && blob.size > 150 * 1024) {
                                var scale = Math.sqrt((150 * 1024) / blob.size);
                                var smallerCanvas = document.createElement('canvas');
                                var smallerCtx = smallerCanvas.getContext('2d');
                                smallerCanvas.width = Math.round(w * scale);
                                smallerCanvas.height = Math.round(h * scale);
                                smallerCtx.drawImage(canvas, 0, 0, smallerCanvas.width, smallerCanvas.height);
                                smallerCanvas.toBlob(function(finalBlob) {
                                    resolve(new File([finalBlob], 'img.jpg', {type:'image/jpeg'}));
                                }, 'image/jpeg', 0.5);
                            } else {
                                resolve(new File([blob], 'img.jpg', {type:'image/jpeg'}));
                            }
                        }, 'image/jpeg', quality);
                    }
                    
                    tryCompress(0.7);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    function renderProducts() {
        if(!products.length) {

        }

        for(var i = 0; i < products.length; i++) {
            var p = products[i];
            var img = (p.images && p.images.length) ? getImageUrl(p.images[0]) : '';
            var isOffer = p.is_offer === true;
            
            var variants = [];
            var flavours = [];
            try { variants = typeof p.variants === 'string' ? JSON.parse(p.variants) : (p.variants || []); } catch(e) { variants = []; }
            try { flavours = typeof p.flavours === 'string' ? JSON.parse(p.flavours) : (p.flavours || []); } catch(e) { flavours = []; }
            
            var variantInfo = '';
            if(flavours.length > 0) {
                var flavourNames = [];
                var totalSizes = 0;
                for(var fi = 0; fi < flavours.length; fi++) {
                    var f = flavours[fi];
                    if(f.name && flavourNames.indexOf(f.name) === -1) flavourNames.push(f.name);
                    if(f.pack_sizes) totalSizes += f.pack_sizes.length;
                }
                variantInfo = '<div class="product-variants-info">🏷️ ' + flavourNames.join(', ') + ' | ' + totalSizes + ' options</div>';
            } else if(variants.length > 0) {
                var vlabels = [];
                for(var vi = 0; vi < variants.length; vi++) {
                    var v = variants[vi];
                    var w = v.weight || '';
                    var u = v.unit || v.weight_unit || '';
                    if(w) vlabels.push(w + u);
                }
                if(vlabels.length > 0) {
                    variantInfo = '<div class="product-variants-info">⚖️ ' + vlabels.join(', ') + '</div>';
                }
            }
            
            var priceDisplay = '';
            if(flavours.length > 0) {
                var allPrices = [];
                for(var fi2 = 0; fi2 < flavours.length; fi2++) {
                    var f2 = flavours[fi2];
                    if(f2.pack_sizes) {
                        for(var psi = 0; psi < f2.pack_sizes.length; psi++) {
                            var pp = parseFloat(f2.pack_sizes[psi].price) || 0;
                            if(pp > 0) allPrices.push(pp);
                        }
                    } else {
                        var fp = parseFloat(f2.price) || 0;
                        if(fp > 0) allPrices.push(fp);
                    }
                }
                if(allPrices.length > 0) {
                    var fmin = Math.min.apply(null, allPrices);
                    var fmax = Math.max.apply(null, allPrices);
                    priceDisplay = '₹' + fmin.toLocaleString('en-IN') + (fmin !== fmax ? ' - ₹' + fmax.toLocaleString('en-IN') : '');
                }
            } else if(variants.length > 0) {
                var prices = [];
                for(var pi = 0; pi < variants.length; pi++) {
                    var vp = parseFloat(variants[pi].price) || 0;
                    if(vp > 0) prices.push(vp);
                }
                if(prices.length > 0) {
                    var minP = Math.min.apply(null, prices);
                    var maxP = Math.max.apply(null, prices);
                    priceDisplay = '₹' + minP.toLocaleString('en-IN') + (minP !== maxP ? ' - ₹' + maxP.toLocaleString('en-IN') : '');
                }
            } else {
                var actualPrice = parseFloat(p.price) || 0;
                var offerPrice = p.offer_price ? parseFloat(p.offer_price) : null;
                var displayPrice = offerPrice && offerPrice < actualPrice ? offerPrice : actualPrice;
                priceDisplay = '₹' + displayPrice.toLocaleString('en-IN');
            }
            
            h += '<div class="product-card">';
            if(isOffer) h += '<span class="offer-badge">🎁 OFFER</span>';
            h += '<div class="product-img">';
            h += img ? '<img src="' + img + '" loading="lazy">' : '<i class="fas fa-box" style="font-size:40px;color:#D1D5DB;"></i>';
            h += '<span class="product-stock">Stock: ' + (p.stock || 0) + '</span>';
            h += '</div>';
            h += '<div class="product-info">';
            h += '<div class="product-name">' + esc(p.name) + '</div>';
            h += '<div class="product-category">📂 ' + getCatName(p.category_id) + '</div>';
            h += variantInfo;
            h += '<div class="product-price-row">';
            h += '<span class="product-price">' + priceDisplay + '</span>';
            h += '</div>';
            h += '<div class="product-actions">';
            h += '<button class="btn-edit" onclick="showEditProduct(\'' + p.id + '\')">✏️ Edit</button>';
            h += '<button class="btn-delete" onclick="requestDeleteProduct(\'' + p.id + '\',\'' + esc(p.name) + '\')">🗑️</button>';
            h += '</div></div></div>';
        }
        return h + '</div>';
    }

    function collectWeightVariants() {
        var rows = document.querySelectorAll('#variantRows .variant-row');
        var result = [];
        for(var i = 0; i < rows.length; i++) {
            var row = rows[i];
            var weightEl = row.querySelector('.v-weight');
            var unitEl = row.querySelector('.v-unit');
            var priceEl = row.querySelector('.v-price');
            var offerEl = row.querySelector('.v-offer');
            var stockEl = row.querySelector('.v-stock');
            
            var weight = weightEl ? weightEl.value.trim() : '';
            var unit = unitEl ? unitEl.value : 'gram';
            var price = priceEl ? parseFloat(priceEl.value || 0) : 0;
            var offer = (offerEl && offerEl.value) ? parseFloat(offerEl.value) : null;
            var stock = stockEl ? parseInt(stockEl.value || 0) : 0;
            
            if(!weight) continue;
            if(price <= 0) continue;
            
            result.push({ weight: weight, unit: unit, price: price, offer_price: offer, stock: stock });
        }
        return result;
    }
    
    function collectFlavourGroups() {
        var groups = document.querySelectorAll('#flavourGroups .flavour-group');
        var result = [];
        for(var gi = 0; gi < groups.length; gi++) {
            var group = groups[gi];
            var nameEl = group.querySelector('.f-name');
            var name = nameEl ? nameEl.value.trim() : '';
            
            if(!name) continue;
            
            var packSizes = [];
            var packRows = group.querySelectorAll('.pack-size-row');
            
            for(var pi = 0; pi < packRows.length; pi++) {
                var row = packRows[pi];
                var weightEl = row.querySelector('.ps-weight');
                var weightUnitEl = row.querySelector('.ps-weight-unit');
                var pcsEl = row.querySelector('.ps-pcs');
                var pcsUnitEl = row.querySelector('.ps-pcs-unit');
                var priceEl = row.querySelector('.ps-price');
                var offerEl = row.querySelector('.ps-offer');
                var stockEl = row.querySelector('.ps-stock');
                
                var weight = weightEl ? weightEl.value.trim() : '';
                var weightUnit = weightUnitEl ? weightUnitEl.value : 'g';
                var pcs = pcsEl ? pcsEl.value.trim() : '';
                var pcsUnit = pcsUnitEl ? pcsUnitEl.value : 'pcs';
                var price = priceEl ? parseFloat(priceEl.value || 0) : 0;
                var offer = (offerEl && offerEl.value) ? parseFloat(offerEl.value) : null;
                var stock = stockEl ? parseInt(stockEl.value || 0) : 0;
                
                if(price <= 0) continue;
                
                packSizes.push({
                    weight: weight,
                    weight_unit: weightUnit,
                    pcs: pcs,
                    pcs_unit: pcsUnit,
                    price: price,
                    offer_price: offer,
                    stock: stock
                });
            }
            
            if(packSizes.length === 0) continue;
            
            result.push({
                name: name,
                image_url: null,
                pack_sizes: packSizes
            });
        }
        return result;
    }

    window.requestDeleteProduct = async function(id, name) {
        if(!confirm('Delete "' + name + '"?')) return;
        
        try {
            var product = products.find(function(p) { return p.id === id; });
            if(product && product.images && product.images.length > 0) {
                for(var i = 0; i < product.images.length; i++) {
                    try {
                        var imageUrl = product.images[i];
                        if(imageUrl && imageUrl.indexOf('product-images/') !== -1) {
                            var path = imageUrl.split('product-images/')[1];
                            await sb.storage.from('product-images').remove([path]);
                        }
                    } catch(e) {}
                }
            }
            
            await safeFetch(function() { 
                return sb.from('products').delete().eq('id', id); 
            });
            
            showToast('✅ Product deleted!', 'success');
            await loadProducts();
            renderDashboard();
        } catch(e) {
            showToast('❌ Delete failed: ' + e.message, 'error');
        }
    };
    
    window.saveProduct = async function() {
        var nameEl = $('prodName');
        var catEl = $('prodCat');
        var name = nameEl ? nameEl.value.trim() : '';
        var catId = catEl ? catEl.value : '';
        if(!name) { showToast('⚠️ Product name likhein!', 'error'); return; }
        if(!catId) { showToast('⚠️ Category select karein!', 'error'); return; }
        
        var isOfferEl = $('prodIsOffer');
        var isOffer = isOfferEl ? isOfferEl.checked : false;
        var offerTagEl = $('prodOfferTag');
        var offerTag = (isOffer && offerTagEl) ? offerTagEl.value.trim() : '';
        
        try {
            var data = { 
                shop_id: shopData.id, 
                name: name, 
                category_id: catId, 
                is_active: true, 
                delete_requested: false, 
                is_on_hold: false, 
                created_at: new Date().toISOString(),
                is_offer: isOffer,
                offer_tag: offerTag || null,
                offer_image: null
            };
            
            if(variantType === 'simple') {
                var priceEl = $('prodPrice');
                var offerEl = $('prodOffer');
                var stockEl = $('prodStock');
                var price = priceEl ? parseFloat(priceEl.value || 0) : 0;
                var offer = (offerEl && offerEl.value) ? parseFloat(offerEl.value) : null;
                var stock = stockEl ? parseInt(stockEl.value || CONFIG.DEFAULT_STOCK) : CONFIG.DEFAULT_STOCK;
                if(!price || price <= 0) { showToast('⚠️ Price enter karein!', 'error'); return; }
                data.price = price;
                data.offer_price = offer;
                data.stock = stock;
                data.variants = [];
                data.flavours = [];
                data.has_variants = false;
                data.has_flavours = false;
                var ir = await safeFetch(function() { return sb.from('products').insert([data]).select(); });
                var pid = ir.data[0].id;
                if(productCompressedBlobs.length > 0) {
                    var urls = [];
                    for(var j = 0; j < productCompressedBlobs.length; j++) { 
                        urls.push(await uploadImage(productCompressedBlobs[j], 'products', 'prod_' + pid + '_' + j)); 
                    }
                    await sb.from('products').update({ images: urls }).eq('id', pid);
                }
                if(isOffer && offerPhotoFile) {
                    var offerImg = await uploadImage(await compressImage(offerPhotoFile), 'products', 'offer_' + pid);
                    await sb.from('products').update({ offer_image: offerImg }).eq('id', pid);
                }
            } else if(variantType === 'weight') {
                var rawVariants = collectWeightVariants();
                if(rawVariants.length === 0) { showToast('⚠️ Kam se kam ek variant add karein!', 'error'); return; }
                
                var variants = [], totalStock = 0;
                var minPrice = Infinity;
                
                for(var i = 0; i < rawVariants.length; i++) {
                    var r = rawVariants[i];
                    var variantObj = { 
                        weight: r.weight, 
                        weight_unit: r.unit, 
                        unit: r.unit, 
                        price: r.price, 
                        offer_price: r.offer_price, 
                        stock: r.stock, 
                        image_url: null 
                    };
                    variants.push(variantObj);
                    totalStock += r.stock;
                    if(r.price < minPrice) minPrice = r.price;
                }
                
                data.price = minPrice;
                data.stock = totalStock;
                data.variants = variants;
                data.flavours = [];
                data.has_variants = true;
                data.has_flavours = false;
                
                var ir = await safeFetch(function() { return sb.from('products').insert([data]).select(); });
                var pid = ir.data[0].id;
                
                if(productCompressedBlobs.length > 0) {
                    var urls = [];
                    for(var j = 0; j < productCompressedBlobs.length; j++) { 
                        urls.push(await uploadImage(productCompressedBlobs[j], 'products', 'prod_' + pid + '_' + j)); 
                    }
                    await sb.from('products').update({ images: urls }).eq('id', pid);
                }
                if(isOffer && offerPhotoFile) {
                    var offerImg = await uploadImage(await compressImage(offerPhotoFile), 'products', 'offer_' + pid);
                    await sb.from('products').update({ offer_image: offerImg }).eq('id', pid);
                }
            } else if(variantType === 'flavour') {
                var rawFlavourGroups = collectFlavourGroups();
                if(rawFlavourGroups.length === 0) { showToast('⚠️ Kam se kam ek flavour group add karein!', 'error'); return; }
                
                var flavours = [], totalStock = 0;
                var minPrice = Infinity;
                
                for(var f = 0; f < rawFlavourGroups.length; f++) {
                    var rg = rawFlavourGroups[f];
                    var flavourObj = { 
                        name: rg.name,
                        image_url: null,
                        pack_sizes: rg.pack_sizes
                    };
                    flavours.push(flavourObj);
                    
                    for(var psi = 0; psi < rg.pack_sizes.length; psi++) {
                        totalStock += rg.pack_sizes[psi].stock;
                        if(rg.pack_sizes[psi].price < minPrice) minPrice = rg.pack_sizes[psi].price;
                    }
                }
                
                data.price = minPrice;
                data.stock = totalStock;
                data.variants = [];
                data.flavours = flavours;
                data.has_variants = false;
                data.has_flavours = true;
                
                var ir = await safeFetch(function() { return sb.from('products').insert([data]).select(); });
                var pid = ir.data[0].id;
                
                for(var fi = 0; fi < flavours.length; fi++) {
                    if(flavourPhotoFiles[fi]) {
                        var compressedPhoto = await compressImage(flavourPhotoFiles[fi]);
                        var flavourImage = await uploadImage(compressedPhoto, 'products', 'flavour_' + pid + '_' + fi);
                        flavours[fi].image_url = flavourImage;
                    }
                }
                await sb.from('products').update({ flavours: flavours }).eq('id', pid);
                
                if(productCompressedBlobs.length > 0) {
                    var urls = [];
                    for(var j = 0; j < productCompressedBlobs.length; j++) { 
                        urls.push(await uploadImage(productCompressedBlobs[j], 'products', 'prod_' + pid + '_' + j)); 
                    }
                    await sb.from('products').update({ images: urls }).eq('id', pid);
                }
                if(isOffer && offerPhotoFile) {
                    var offerImg = await uploadImage(await compressImage(offerPhotoFile), 'products', 'offer_' + pid);
                    await sb.from('products').update({ offer_image: offerImg }).eq('id', pid);
                }
            }
            
            showToast('✅ Product added!', 'success');
            closeModal();
            await loadProducts();
            renderDashboard();
        } catch(e) { showToast('❌ ' + e.message, 'error'); }
    };
    
    window.updateProduct = async function() {
        if(!editingProductId) return;
        var nameEl = $('prodName');
        var catEl = $('prodCat');
        var name = nameEl ? nameEl.value.trim() : '';
        var catId = catEl ? catEl.value : '';
        if(!name || !catId) { showToast('⚠️ Sab fields bharein!', 'error'); return; }
        
        var isOfferEl = $('prodIsOffer');
        var isOffer = isOfferEl ? isOfferEl.checked : false;
        var offerTagEl = $('prodOfferTag');
        var offerTag = (isOffer && offerTagEl) ? offerTagEl.value.trim() : '';
        
        try {
            var data = { 
                name: name, 
                category_id: catId,
                is_offer: isOffer,
                offer_tag: offerTag || null
            };
            
            if(variantType === 'simple') {
                var priceEl = $('prodPrice');
                var offerEl = $('prodOffer');
                var stockEl = $('prodStock');
                var price = priceEl ? parseFloat(priceEl.value || 0) : 0;
                var offer = (offerEl && offerEl.value) ? parseFloat(offerEl.value) : null;
                var stock = stockEl ? parseInt(stockEl.value || CONFIG.DEFAULT_STOCK) : CONFIG.DEFAULT_STOCK;
                data.price = price;
                data.offer_price = offer;
                data.stock = stock;
                data.variants = [];
                data.flavours = [];
                data.has_variants = false;
                data.has_flavours = false;
            } else if(variantType === 'weight') {
                var rawVariants = collectWeightVariants();
                if(rawVariants.length === 0) { showToast('⚠️ Kam se kam ek variant add karein!', 'error'); return; }
                
                var variants = [], totalStock = 0;
                var minPrice = Infinity;
                
                for(var i = 0; i < rawVariants.length; i++) {
                    var r = rawVariants[i];
                    variants.push({ 
                        weight: r.weight, 
                        weight_unit: r.unit, 
                        unit: r.unit, 
                        price: r.price, 
                        offer_price: r.offer_price, 
                        stock: r.stock, 
                        image_url: null 
                    });
                    totalStock += r.stock;
                    if(r.price < minPrice) minPrice = r.price;
                }
                
                data.variants = variants;
                data.flavours = [];
                data.stock = totalStock;
                data.price = minPrice;
                data.has_variants = true;
                data.has_flavours = false;
            } else if(variantType === 'flavour') {
                var rawFlavourGroups = collectFlavourGroups();
                if(rawFlavourGroups.length === 0) { showToast('⚠️ Kam se kam ek flavour group add karein!', 'error'); return; }
                
                var flavours = [], totalStock = 0;
                var minPrice = Infinity;
                
                for(var f = 0; f < rawFlavourGroups.length; f++) {
                    var rg = rawFlavourGroups[f];
                    var flavourObj = { 
                        name: rg.name,
                        image_url: null,
                        pack_sizes: rg.pack_sizes
                    };
                    
                    if(existingFlavourPhotos[f]) {
                        flavourObj.image_url = existingFlavourPhotos[f];
                    }
                    
                    flavours.push(flavourObj);
                    
                    for(var psi = 0; psi < rg.pack_sizes.length; psi++) {
                        totalStock += rg.pack_sizes[psi].stock;
                        if(rg.pack_sizes[psi].price < minPrice) minPrice = rg.pack_sizes[psi].price;
                    }
                }
                
                for(var fi = 0; fi < flavours.length; fi++) {
                    if(flavourPhotoFiles[fi]) {
                        var compressedPhoto = await compressImage(flavourPhotoFiles[fi]);
                        var flavourImage = await uploadImage(compressedPhoto, 'products', 'flavour_' + editingProductId + '_' + fi + '_' + Date.now());
                        flavours[fi].image_url = flavourImage;
                    }
                }
                
                data.flavours = flavours;
                data.variants = [];
                data.stock = totalStock;
                data.price = minPrice;
                data.has_flavours = true;
                data.has_variants = false;
            }
            
            // Update offer image
            if(isOffer) {
                if(offerPhotoFile) {
                    var offerImg = await uploadImage(await compressImage(offerPhotoFile), 'products', 'offer_' + editingProductId + '_' + Date.now());
                    data.offer_image = offerImg;
                } else {
                    data.offer_image = existingOfferPhoto;
                }
            } else {
                data.offer_image = null;
            }
            
            // Update images
            var finalImages = existingImages.slice();
            if(productCompressedBlobs.length > 0) {
                for(var j = 0; j < productCompressedBlobs.length; j++) {
                    finalImages.push(await uploadImage(productCompressedBlobs[j], 'products', 'prod_' + editingProductId + '_' + j));
                }
            }
            data.images = finalImages;
            
            await sb.from('products').update(data).eq('id', editingProductId);
            showToast('✅ Updated!', 'success');
            closeModal();
            await loadProducts();
            renderDashboard();
        } catch(e) { 
            showToast('❌ ' + e.message, 'error'); 
        }
    };
    
    window.updateStatus = async function(id, status) {
        await sb.from('orders').update({ status: status }).eq('id', id);
        showToast('✅ Updated', 'success');
        await loadOrders();
        renderDashboard();
    };
    
    window.handleLogout = async function() { 
        if(confirm('Logout?')) { 
            if(sessionRefreshTimer) clearInterval(sessionRefreshTimer);
            try { await sb.auth.signOut(); } catch(e) {}
            localStorage.removeItem('zymart_session'); 
            localStorage.removeItem('zymart_user_role');
            localStorage.removeItem('zymart_user_phone');
            localStorage.removeItem('zymart_token');
            try {
                var keys = Object.keys(localStorage);
                for (var i = 0; i < keys.length; i++) {
                    if (keys[i].indexOf('sb-') === 0) { localStorage.removeItem(keys[i]); }
                }
            } catch(e) {}
            try { sessionStorage.clear(); } catch(e) {}
            location.href = 'index.html'; 
        } 
    };
    
    async function init() {
        try {
            var sr = await sb.auth.getSession();
            if(sr && sr.data && sr.data.session) { 
                var user = sr.data.session.user;
                var userCheck = await safeFetch(function() { return sb.from('users').select('role').eq('id', user.id).maybeSingle(); });
                var role = userCheck.data ? userCheck.data.role : null;
                if(role === '2' || role === 'shop_owner' || role === '1' || role === 'admin') {
                    currentUser = user;
                } else {
                    window.location.href = 'index.html';
                    return;
                }
            }
            if(!currentUser) {
                var session = JSON.parse(localStorage.getItem('zymart_session') || 'null');
                if(session && session.userId && session.shopId) {
                    var userRole = localStorage.getItem('zymart_user_role') || '';
                    if(userRole === '2' || userRole === 'shop_owner') {
                        currentUser = { id: session.userId, phone: session.phone || '', email: session.email || session.phone + '@zymart.user' };
                    } else {
                        window.location.href = 'index.html';
                        return;
                    }
                }
            }
            if(!currentUser) { window.location.href = 'login.html?redirect=shop-dashboard.html'; return; }
            
            // Start session refresh
            startSessionRefresh();
            
            var shopRes = null;
            if(currentUser.email && currentUser.email.indexOf('@zymart.user') === -1) {
                shopRes = await safeFetch(function() { return sb.from('shops').select('*').eq('owner_email', currentUser.email).maybeSingle(); });
            }
            if(!shopRes || !shopRes.data) {
                var phone = currentUser.phone || localStorage.getItem('zymart_user_phone') || '';
                if(phone) { shopRes = await safeFetch(function() { return sb.from('shops').select('*').eq('owner_phone', phone).maybeSingle(); }); }
            }
            if(!shopRes || !shopRes.data) {
                $('app').innerHTML = '<div style="text-align:center;padding:80px;"><i class="fas fa-store-slash" style="font-size:56px;color:#D1D5DB;"></i><h3>No Shop Found</h3><button style="padding:12px 24px;margin-top:16px;background:#0B5A31;color:white;border:none;border-radius:9999px;font-size:14px;font-weight:600;cursor:pointer;" onclick="location.href=\'shop-register.html\'">Register Now</button></div>';
                return;
            }
            shopData = shopRes.data;
            
            if(shopData.status !== 'approved') {
                $('app').innerHTML = '<div style="text-align:center;padding:80px;"><i class="fas fa-clock" style="font-size:56px;color:#F59E0B;"></i><h3>Approval Pending</h3><p style="color:#6B7280;">Admin will review within 24 hours</p></div>';
                return;
            }
            
            var catRes = await safeFetch(function() { return sb.from('categories').select('id, name').eq('is_active', true).order('name'); });
            allCategories = catRes.data || [];
            
            await Promise.all([loadProducts(), loadOrders()]);
            renderDashboard();
            
            history.pushState(null, null, window.location.href);
            window.addEventListener('popstate', function() {
                history.pushState(null, null, window.location.href);
            });
            
        } catch(e) {
            console.error('Init error:', e);
            $('app').innerHTML = '<div style="text-align:center;padding:80px;"><i class="fas fa-exclamation-circle" style="font-size:56px;color:#EF4444;"></i><h3>Failed to Load</h3><button style="padding:12px 24px;margin-top:16px;background:#0B5A31;color:white;border:none;border-radius:9999px;font-size:14px;font-weight:600;cursor:pointer;" onclick="init()">🔄 Retry</button></div>';
        }
    }
    
    document.addEventListener('DOMContentLoaded', init);
    
    window.switchTab = switchTab;
    window.closeModal = closeModal;
    window.showAddProduct = showAddProduct;
    window.showEditProduct = showEditProduct;
    window.setVariantType = setVariantType;
    window.addWeightRow = addWeightRow;
    window.addFlavourGroup = addFlavourGroup;
    window.addPackSize = addPackSize;
    window.handleFlavourPhoto = handleFlavourPhoto;
    window.handleProdImages = handleProdImages;
    window.removeExistingImage = removeExistingImage;
    window.saveProduct = saveProduct;
    window.updateProduct = updateProduct;
    window.requestDeleteProduct = requestDeleteProduct;
    window.updateStatus = updateStatus;
    window.copyOrderDetails = copyOrderDetails;
    window.handleLogout = handleLogout;
    window.toggleOfferFields = toggleOfferFields;
    window.handleOfferPhoto = handleOfferPhoto;
    window.removeExistingOffer = removeExistingOffer;
    
})();
</script>
</body>
