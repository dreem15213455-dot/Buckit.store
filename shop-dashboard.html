<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Shop Dashboard - ZyMart+</title>
    <meta name="theme-color" content="#0B5A31">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link rel="preconnect" href="https://res.cloudinary.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --brand-green: #0B5A31; --brand-green-dark: #083D21; --brand-orange: #F59E0B;
            --neutral-white: #FFFFFF; --neutral-bg: #F7F9F8; --neutral-border: #E5E7EB;
            --neutral-gray: #6B7280; --neutral-dark: #1A1A1A; --danger: #EF4444; --success: #22C55E;
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 32px rgba(0,0,0,0.10);
            --shadow-green: 0 6px 20px rgba(11,90,49,0.22);
            --shadow-green-lg: 0 10px 28px rgba(11,90,49,0.28);
            --radius-sm: 10px; --radius-md: 14px; --radius-lg: 18px; --radius-xl: 22px; --radius-2xl: 26px; --radius-full: 9999px;
            --status-bar-height: env(safe-area-inset-top, 0px);
            --gradient-green: linear-gradient(135deg, #0B5A31 0%, #0F6E3B 55%, #0B5A31 100%);
            --gradient-orange: linear-gradient(135deg, #F59E0B 0%, #EA580C 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--neutral-bg); color: var(--neutral-dark); padding-bottom: calc(30px + env(safe-area-inset-bottom, 0px)); -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; min-height: 100vh; overflow-x: hidden; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pop { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        @keyframes badgePulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.4); } 50% { box-shadow: 0 0 0 6px rgba(34,197,94,0); } }
        @keyframes brandPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        
        /* ═══ PREMIUM LOADER ═══ */
        .loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 100px 20px; min-height: 60vh; gap: 20px; }
        .loading-logo { font-family: 'Poppins', sans-serif; font-size: 34px; font-weight: 800; animation: brandPulse 1.8s ease-in-out infinite; letter-spacing: -1px; }
        .loading-zy { color: var(--brand-green); }
        .loading-mart { color: var(--brand-orange); }
        .loading-bar { width: 60px; height: 3px; background: #E5E7EB; border-radius: 3px; overflow: hidden; }
        .loading-bar::after { content: ''; display: block; width: 40%; height: 100%; background: var(--brand-green); border-radius: 3px; animation: shimmer 1.2s ease-in-out infinite; }
        .loading-text { font-size: 11px; color: var(--neutral-gray); font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; }
        
        /* ═══ PREMIUM TOP BAR ═══ */
        .top-bar { background: var(--gradient-green); position: fixed; top: 0; left: 0; width: 100%; padding: 10px 14px; padding-top: calc(10px + var(--status-bar-height)); display: flex; align-items: center; justify-content: space-between; z-index: 100; box-shadow: 0 4px 20px rgba(11,90,49,0.35); backdrop-filter: blur(10px); }
        .back-btn { width: 40px; height: 40px; background: rgba(255,255,255,0.14); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 15px; text-decoration: none; transition: all 0.2s; }
        .back-btn:active { background: rgba(255,255,255,0.25); transform: scale(0.92); }
        .brand-zy { color: #A3E635; } .brand-mart { color: #FDE047; }
        .shop-name-top { font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 700; color: white; flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 8px; }
        .logout-btn { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.25); padding: 7px 14px; border-radius: var(--radius-full); font-size: 11px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s; }
        .logout-btn:active { background: rgba(255,255,255,0.28); transform: scale(0.96); }
        
        .main-content { padding: calc(70px + var(--status-bar-height)) 14px 40px; max-width: 650px; margin: 0 auto; }
        
        /* ═══ PREMIUM PROFILE CARD ═══ */
        .profile-card { background: linear-gradient(135deg, #FFFFFF 0%, #F7FDF9 100%); border-radius: var(--radius-2xl); padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow-md); border: 1px solid #D7EDDF; position: relative; overflow: hidden; animation: fadeInUp 0.4s ease; }
        .profile-card::before { content: ''; position: absolute; top: -40px; right: -40px; width: 140px; height: 140px; background: radial-gradient(circle, rgba(163,230,53,0.15) 0%, transparent 70%); pointer-events: none; }
        .profile-card::after { content: ''; position: absolute; bottom: -50px; left: -50px; width: 120px; height: 120px; background: radial-gradient(circle, rgba(11,90,49,0.06) 0%, transparent 70%); pointer-events: none; }
        .profile-header { display: flex; align-items: center; gap: 14px; position: relative; z-index: 1; }
        .profile-avatar { width: 60px; height: 60px; background: linear-gradient(135deg, #EDF7F1, #D7EDDF); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--brand-green); overflow: hidden; border: 3px solid #FFFFFF; box-shadow: 0 4px 12px rgba(11,90,49,0.15); flex-shrink: 0; }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-info { flex: 1; min-width: 0; }
        .profile-shop-name { font-family: 'Poppins', sans-serif; font-size: 17px; font-weight: 700; color: var(--brand-green-dark); margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .profile-badges { display: flex; gap: 6px; flex-wrap: wrap; }
        .badge { display: inline-flex; align-items: center; gap: 3px; padding: 4px 10px; border-radius: var(--radius-full); font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }
        .badge-success { background: linear-gradient(135deg, #EDF7F1, #D1FAE5); color: #059669; border: 1px solid #A7F3D0; }
        .badge-verified { animation: badgePulse 2.5s ease-in-out infinite; }
        .badge-plan { background: linear-gradient(135deg, #FFF8EB, #FEF3C7); color: #B45309; border: 1px solid #FDE68A; }
        
        /* ═══ PREMIUM STAT CARDS ═══ */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; animation: fadeInUp 0.5s ease; }
        .stat-card { border-radius: var(--radius-lg); padding: 12px 6px 10px; text-align: center; border: 1px solid var(--neutral-border); cursor: pointer; position: relative; overflow: hidden; transition: all 0.25s cubic-bezier(0.4,0,0.2,1); background: white; }
        .stat-card::before { content: ''; position: absolute; top: -30px; right: -30px; width: 70px; height: 70px; background: radial-gradient(circle, rgba(255,255,255,0.5) 0%, transparent 70%); pointer-events: none; }
        .stat-card:active { transform: scale(0.95); }
        .stat-card.products { background: linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 100%); border-color: #BFDBFE; }
        .stat-card.pending { background: linear-gradient(135deg, #FFFBEB 0%, #FEF3C7 100%); border-color: #FDE68A; }
        .stat-card.revenue { background: linear-gradient(135deg, #F0FDF4 0%, #DCFCE7 100%); border-color: #BBF7D0; }
        .stat-card.orders { background: linear-gradient(135deg, #F5F3FF 0%, #EDE9FE 100%); border-color: #DDD6FE; }
        .stat-icon { font-size: 18px; margin-bottom: 4px; position: relative; z-index: 1; }
        .stat-number { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 800; color: var(--brand-green-dark); position: relative; z-index: 1; line-height: 1.2; }
        .stat-card.products .stat-number { color: #1E40AF; }
        .stat-card.pending .stat-number { color: #B45309; }
        .stat-card.revenue .stat-number { color: #047857; }
        .stat-card.orders .stat-number { color: #6D28D9; }
        .stat-label { font-size: 8px; font-weight: 700; color: var(--neutral-gray); text-transform: uppercase; letter-spacing: 0.4px; margin-top: 2px; position: relative; z-index: 1; }
        
        /* ═══ PREMIUM TABS ═══ */
        .tabs { display: flex; gap: 6px; margin-bottom: 14px; background: white; padding: 5px; border-radius: var(--radius-full); border: 1px solid var(--neutral-border); box-shadow: var(--shadow-xs); animation: fadeInUp 0.6s ease; }
        .tab { flex: 1; text-align: center; padding: 11px 10px; font-size: 12px; font-weight: 600; border-radius: var(--radius-full); cursor: pointer; color: var(--neutral-gray); border: none; background: transparent; font-family: 'Inter', sans-serif; transition: all 0.25s ease; position: relative; }
        .tab.active { background: var(--gradient-green); color: white; box-shadow: var(--shadow-green); font-weight: 700; }
        .tab:not(.active):active { background: #F3F5F4; }
        
        /* ═══ PREMIUM ADD PRODUCT BUTTON ═══ */
        .add-product-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 17px 20px; background: var(--gradient-green); color: white; border: none; border-radius: var(--radius-lg); font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; margin-bottom: 16px; box-shadow: var(--shadow-green); position: relative; overflow: hidden; letter-spacing: 0.3px; transition: all 0.2s; }
        .add-product-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent); transition: left 0.6s; }
        .add-product-btn:active { transform: scale(0.98); box-shadow: var(--shadow-green-lg); }
        .add-product-btn:active::before { left: 100%; }
        
        /* ═══ PREMIUM PRODUCT CARDS ═══ */
        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .product-card { background: white; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--neutral-border); position: relative; transition: transform 0.25s ease, box-shadow 0.25s ease; animation: pop 0.3s ease; }
        .product-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .offer-badge { position: absolute; top: 8px; left: 8px; background: linear-gradient(135deg, #EF4444, #F97316); color: white; padding: 3px 9px; border-radius: 9999px; font-size: 8px; font-weight: 800; z-index: 5; box-shadow: 0 2px 6px rgba(239,68,68,0.3); letter-spacing: 0.3px; }
        .product-img { width: 100%; aspect-ratio: 1/1; background: linear-gradient(135deg, #F9FAFB, #F3F4F6); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .product-img img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.4s ease; }
        .product-card:hover .product-img img { transform: scale(1.05); }
        .product-stock { position: absolute; top: 6px; right: 6px; background: rgba(17,24,39,0.75); backdrop-filter: blur(4px); color: white; padding: 3px 8px; border-radius: var(--radius-full); font-size: 9px; font-weight: 700; }
        .product-info { padding: 10px 10px 12px; }
        .product-name { font-weight: 700; font-size: 12px; line-height: 1.3; color: var(--neutral-dark); margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 30px; }
        .product-category { display: inline-block; font-size: 9px; color: var(--brand-green); background: #EDF7F1; padding: 2px 8px; border-radius: 9999px; font-weight: 600; margin-bottom: 4px; }
        .product-price-row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
        .product-price { color: var(--brand-green); font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 15px; }
        .product-variants-info { font-size: 9px; color: var(--neutral-gray); margin-top: 3px; line-height: 1.35; }
        .product-actions { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
        .btn-edit, .btn-delete { flex: 1; min-width: 45px; padding: 9px 5px; border: none; border-radius: var(--radius-full); font-size: 11px; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s; }
        .btn-edit { background: linear-gradient(135deg, #F3F5F4, #E5E7EB); color: var(--neutral-dark); }
        .btn-edit:active { transform: scale(0.95); }
        .btn-delete { background: linear-gradient(135deg, #FEF2F2, #FEE2E2); color: var(--danger); }
        .btn-delete:active { transform: scale(0.95); }
        
        /* ═══ PREMIUM ORDER CARDS ═══ */
        .order-card { background: white; border-radius: var(--radius-lg); padding: 14px 14px 14px 18px; margin-bottom: 12px; border: 1px solid var(--neutral-border); position: relative; overflow: hidden; transition: all 0.2s; animation: fadeInUp 0.3s ease; }
        .order-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--brand-green); }
        .order-card.status-pending-card::before { background: linear-gradient(180deg, #F59E0B, #D97706); }
        .order-card.status-confirmed-card::before { background: linear-gradient(180deg, #3B82F6, #2563EB); }
        .order-card.status-out_for_delivery-card::before { background: linear-gradient(180deg, #F59E0B, #EA580C); }
        .order-card.status-delivered-card::before { background: linear-gradient(180deg, #22C55E, #16A34A); }
        .order-card.status-cancelled-card::before { background: linear-gradient(180deg, #EF4444, #DC2626); }
        .order-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .order-id { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 14px; color: var(--brand-green-dark); letter-spacing: -0.3px; }
        .order-date { font-size: 11px; color: var(--neutral-gray); margin-top: 2px; }
        .order-status-badge { padding: 5px 11px; border-radius: var(--radius-full); font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px; }
        .status-pending { background: #FFF8EB; color: #D97706; border: 1px solid #FDE68A; }
        .status-confirmed { background: #EFF6FF; color: #2563EB; border: 1px solid #BFDBFE; }
        .status-out_for_delivery { background: #FEF3C7; color: #D97706; border: 1px solid #FDE68A; }
        .status-delivered { background: #EDF7F1; color: #059669; border: 1px solid #A7F3D0; }
        .status-cancelled { background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA; }
        .order-customer-row { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; margin-bottom: 8px; flex-wrap: wrap; }
        .order-address-box { font-size: 12px; margin-bottom: 8px; line-height: 1.6; padding: 11px 13px; background: linear-gradient(135deg, #FFF8EB, #FEF3C7); border-radius: var(--radius-sm); border: 1.5px solid #FDE68A; color: #78350F; }
        .order-items-list { background: #F9FAFB; border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 10px; border: 1px solid #F3F4F6; }
        .order-item-row { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; color: #374151; gap: 8px; }
        .order-item-row span:first-child { flex: 1; overflow: hidden; text-overflow: ellipsis; }
        .order-item-row span:last-child { font-weight: 700; color: var(--brand-green); white-space: nowrap; }
        .order-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--neutral-border); padding-top: 10px; gap: 8px; flex-wrap: wrap; }
        .order-total { font-family: 'Poppins', sans-serif; font-size: 17px; font-weight: 800; color: var(--brand-green-dark); }
        .order-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .btn-copy { background: linear-gradient(135deg, #EFF6FF, #DBEAFE); color: #2563EB; padding: 8px 12px; border-radius: var(--radius-full); font-size: 10px; font-weight: 700; border: 1px solid #BFDBFE; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s; }
        .btn-copy:active { transform: scale(0.95); }
        .btn-wa { background: linear-gradient(135deg, #25D366, #128C7E); color: white; padding: 8px 12px; border-radius: var(--radius-full); font-size: 10px; font-weight: 700; text-decoration: none; box-shadow: 0 2px 6px rgba(37,211,102,0.3); }
        .order-status-select { padding: 8px 12px; border-radius: var(--radius-full); border: 1.5px solid var(--neutral-border); font-size: 11px; font-weight: 600; font-family: 'Inter', sans-serif; background: white; cursor: pointer; transition: all 0.2s; }
        .order-status-select:focus { outline: none; border-color: var(--brand-green); }
        
        /* ═══ PREMIUM MODAL ═══ */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(8,61,33,0.72); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-overlay.show { display: flex; animation: fadeIn 0.2s ease; }
        .modal-container { background: white; border-radius: var(--radius-2xl); width: 100%; max-width: 550px; max-height: 90vh; max-height: 90dvh; overflow-y: auto; padding: 24px 24px calc(24px + env(safe-area-inset-bottom, 0px)); animation: slideUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: var(--shadow-lg); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--neutral-border); }
        .modal-header h3 { font-family: 'Poppins', sans-serif; font-size: 18px; font-weight: 700; color: var(--brand-green-dark); }
        .modal-close { width: 38px; height: 38px; background: #F3F5F4; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; font-size: 15px; transition: all 0.2s; color: var(--neutral-dark); }
        .modal-close:active { background: #E5E7EB; transform: scale(0.92); }
        
        /* ═══ PREMIUM FORM ═══ */
        .form-group { margin-bottom: 16px; }
        .form-label { font-size: 13px; font-weight: 700; margin-bottom: 6px; display: block; color: var(--neutral-dark); }
        .form-label .required { color: var(--danger); }
        .form-control { width: 100%; padding: 13px 15px; border: 2px solid var(--neutral-border); border-radius: var(--radius-sm); font-size: 14px; font-family: 'Inter', sans-serif; outline: none; transition: all 0.2s; background: white; color: var(--neutral-dark); }
        .form-control:focus { border-color: var(--brand-green); box-shadow: 0 0 0 4px rgba(11,90,49,0.08); }
        .form-row { display: flex; gap: 10px; }
        .form-half { flex: 1; }
        
        /* ═══ VARIANT SELECTORS ═══ */
        .variant-type-selector { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
        .vt-option { padding: 12px 16px; border: 2px solid var(--neutral-border); border-radius: var(--radius-full); font-size: 12px; font-weight: 600; cursor: pointer; background: white; font-family: 'Inter', sans-serif; transition: all 0.2s; }
        .vt-option.active { border-color: var(--brand-green); background: linear-gradient(135deg, #EDF7F1, #D7EDDF); color: var(--brand-green); box-shadow: 0 2px 8px rgba(11,90,49,0.12); }
        .vt-option:active { transform: scale(0.96); }
        .variant-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; padding: 12px; background: #F9FAFB; border-radius: var(--radius-sm); border: 1px solid var(--neutral-border); }
        .variant-row input, .variant-row select { padding: 8px 10px; border: 1.5px solid var(--neutral-border); border-radius: 8px; font-size: 12px; font-family: 'Inter', sans-serif; outline: none; }
        .variant-row input:focus, .variant-row select:focus { border-color: var(--brand-green); }
        .flavour-group { background: white; border: 2px solid #E5E7EB; border-radius: 14px; margin-bottom: 12px; overflow: hidden; transition: all 0.2s; }
        .flavour-group:hover { border-color: #D1FAE5; }
        .flavour-group-header { display: flex; gap: 10px; padding: 12px; background: linear-gradient(135deg, #F9FAFB, #F3F4F6); border-bottom: 1px solid #E5E7EB; align-items: center; }
        .flavour-photo { width: 52px; height: 52px; border-radius: 12px; background: #EDF7F1; border: 2px dashed var(--brand-green); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; color: var(--brand-green); overflow: hidden; flex-shrink: 0; position: relative; transition: all 0.2s; }
        .flavour-photo:active { transform: scale(0.95); }
        .flavour-photo img { width: 100%; height: 100%; object-fit: cover; }
        .flavour-photo.uploaded { border-style: solid; border-color: #22C55E; background: #D1FAE5; }
        .flavour-photo input { display: none; }
        .pack-sizes-container { padding: 10px; background: #FAFBFC; }
        .pack-size-row { display: flex; gap: 6px; align-items: center; padding: 8px; background: white; border: 1px solid #E5E7EB; border-radius: 8px; margin-bottom: 6px; flex-wrap: wrap; }
        .pack-size-row input, .pack-size-row select { padding: 8px; border: 1.5px solid #E5E7EB; border-radius: 6px; font-size: 11px; font-family: 'Inter', sans-serif; outline: none; }
        .pack-size-row input:focus, .pack-size-row select:focus { border-color: var(--brand-green); }

    function compressImage(file) {
        return new Promise(function(resolve) {
            if(!file || !file.type.match(/image\//)) { resolve(file); return; }
            var TARGET_MIN = CONFIG.IMG_TARGET_MIN_KB * 1024;
            var TARGET_MAX = CONFIG.IMG_TARGET_MAX_KB * 1024;
            var TARGET_IDEAL = CONFIG.IMG_TARGET_IDEAL_KB * 1024;
            if (file.size >= TARGET_MIN && file.size <= TARGET_MAX) { resolve(file); return; }
            var reader = new FileReader();
            reader.onload = function(e) {
                var img = new Image();
                img.onload = function() {
                    var maxDim = CONFIG.IMG_MAX_DIM;
                    var w = img.width, h = img.height;
                    if(w > maxDim || h > maxDim) { var ratio = Math.min(maxDim/w, maxDim/h); w = Math.round(w * ratio); h = Math.round(h * ratio); }
                    var canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
                    var ctx = canvas.getContext('2d'); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(img, 0, 0, w, h);
                    var qualities = [0.92, 0.90, 0.88, 0.85, 0.82, 0.80, 0.78, 0.75, 0.72, 0.70, 0.68, 0.65, 0.62];
                    var idx = 0; var bestBlob = null; var bestDiff = Infinity;
                    function tryNext() {
                        if (idx >= qualities.length) { if (bestBlob && bestBlob.size > TARGET_MAX) { reduceDimensionsAndExport(canvas, w, h, resolve, file); return; } if (bestBlob) resolve(new File([bestBlob], 'img.jpg', { type: 'image/jpeg' })); else resolve(file); return; }
                        var q = qualities[idx++];
                        canvas.toBlob(function(blob) {
                            if (!blob) { tryNext(); return; }
                            if (blob.size >= TARGET_MIN && blob.size <= TARGET_MAX) { resolve(new File([blob], 'img.jpg', { type: 'image/jpeg' })); return; }
                            var diff = Math.abs(blob.size - TARGET_IDEAL);
                            if (diff < bestDiff) { bestDiff = diff; bestBlob = blob; }
                            tryNext();
                        }, 'image/jpeg', q);
                    }
                    tryNext();
                };
                img.onerror = function() { resolve(file); };
                img.src = e.target.result;
            };
            reader.onerror = function() { resolve(file); };
            reader.readAsDataURL(file);
        });
    }
    
    function reduceDimensionsAndExport(canvas, w, h, resolve, fallbackFile) {
        var newW = Math.round(w * 0.7); var newH = Math.round(h * 0.7);
        var newCanvas = document.createElement('canvas'); newCanvas.width = newW; newCanvas.height = newH;
        var newCtx = newCanvas.getContext('2d'); newCtx.imageSmoothingEnabled = true; newCtx.imageSmoothingQuality = 'high'; newCtx.drawImage(canvas, 0, 0, newW, newH);
        newCanvas.toBlob(function(blob) { if (blob) resolve(new File([blob], 'img.jpg', { type: 'image/jpeg' })); else resolve(fallbackFile); }, 'image/jpeg', 0.78);
    }

    function getSynonymsForToken(token) {
        var result = [token]; var lower = token.toLowerCase();
        if (SEARCH_SYNONYMS[lower]) { SEARCH_SYNONYMS[lower].forEach(function(s) { if (result.indexOf(s) === -1) result.push(s); }); }
        Object.keys(SEARCH_SYNONYMS).forEach(function(k) {
            var syns = SEARCH_SYNONYMS[k];
            for (var i = 0; i < syns.length; i++) { if (syns[i] === lower) { if (result.indexOf(k) === -1) result.push(k); syns.forEach(function(s) { if (result.indexOf(s) === -1) result.push(s); }); break; } }
        });
        Object.keys(SEARCH_SYNONYMS).forEach(function(k) {
            if ((k.indexOf(lower) === 0 || lower.indexOf(k) === 0) && k.length >= 2 && lower.length >= 2) { if (result.indexOf(k) === -1) result.push(k); SEARCH_SYNONYMS[k].forEach(function(s) { if (result.indexOf(s) === -1) result.push(s); }); }
        });
        return result;
    }
    
    function scoreProduct(product, query) {
        var name = (product.name || '').toLowerCase(); var category = (getCatName(product.category_id) || '').toLowerCase();
        var brand = (product.brand_name || '').toLowerCase(); var description = (product.description || '').toLowerCase();
        var colorNames = []; try { var colors = typeof product.colors === 'string' ? JSON.parse(product.colors) : (product.colors || []); colors.forEach(function(c) { if (c.name) colorNames.push(c.name.toLowerCase()); }); } catch(e) {}
        var colorsStr = colorNames.join(' ');
        var tokens = query.toLowerCase().trim().split(/\s+/).filter(Boolean);
        if (tokens.length === 0) return 0;
        var score = 0; var matchedTokens = 0;
        if (name.indexOf(query.toLowerCase()) !== -1) score += 50;
        for (var t = 0; t < tokens.length; t++) {
            var token = tokens[t]; var tokenMatched = false; var tokenScore = 0;
            if (name.indexOf(token) !== -1) { tokenScore = Math.max(tokenScore, 30); tokenMatched = true; }
            if (category.indexOf(token) !== -1) { tokenScore = Math.max(tokenScore, 20); tokenMatched = true; }
            if (brand.indexOf(token) !== -1) { tokenScore = Math.max(tokenScore, 20); tokenMatched = true; }
            if (colorsStr.indexOf(token) !== -1) { tokenScore = Math.max(tokenScore, 25); tokenMatched = true; }
            if (description.indexOf(token) !== -1) { tokenScore = Math.max(tokenScore, 10); tokenMatched = true; }
            if (!tokenMatched) {
                var synonyms = getSynonymsForToken(token);
                for (var s = 0; s < synonyms.length; s++) { var syn = synonyms[s]; if (syn === token) continue; if (name.indexOf(syn) !== -1) { tokenScore = Math.max(tokenScore, 25); tokenMatched = true; break; } if (colorsStr.indexOf(syn) !== -1) { tokenScore = Math.max(tokenScore, 22); tokenMatched = true; break; } if (category.indexOf(syn) !== -1) { tokenScore = Math.max(tokenScore, 18); tokenMatched = true; break; } if (brand.indexOf(syn) !== -1) { tokenScore = Math.max(tokenScore, 18); tokenMatched = true; break; } }
            }
            if (tokenMatched) { matchedTokens++; score += tokenScore; }
        }
        if (matchedTokens < tokens.length) return 0;
        return score;
    }
    
    function computeSearchMatches(query) {

        return results;
    }

            var customerPhone = o.customer_phone || '';

            for(var m = 0; m < items.length; m++) { mySubtotal += (parseFloat(items[m].price) || 0) * (items[m].quantity || 1); }
            
            h += '<div class="order-card ' + statusCardClass + '">';

                h += '<div class="order-address-box"><strong>📍 ' + esc(o.customer_address) + '</strong>';

                h += '</div>';
            }
            if(items.length > 0) {
                h += '<div class="order-items-list">';
                for(var j = 0; j < items.length; j++) {
                    var item = items[j];
                    var itemName = item.product_name || item.name || 'Item';
                    var variantLabel = '';
                    if (item.variant_color && item.variant_size) variantLabel = ' · 🎨 ' + item.variant_color + ' · 📏 ' + item.variant_size;

    window.copyOrderDetails = function(orderId) {
        var order = orders.find(function(o) { return o.id === orderId; });
        if(!order) return;
        var items = order.items || [];
        var oid = '#' + (order.id || '').substring(0, 8).toUpperCase();

        var text = '🧾 *ORDER ' + oid + '*\n📅 ' + dt.date + ' · ' + dt.time + '\n\n';
        text += '👤 ' + (order.customer_name || 'N/A') + '\n📱 +91 ' + (order.customer_phone || '') + '\n\n';
        text += '📍 ' + [order.customer_address, order.customer_city, order.customer_pincode].filter(Boolean).join(', ') + '\n\n';
        text += '📦 *Items:*\n';
        var total = 0;

    };

    function collectColorGroups() {
        var groups = document.querySelectorAll('#colorGroups .flavour-group');
        var result = [];
        for(var gi = 0; gi < groups.length; gi++) {
            var group = groups[gi];
            var name = group.querySelector('.c-name')?.value.trim() || '';
            if(!name) continue;
            var sizes = [];
            var sizeRows = group.querySelectorAll('.size-row');
            for(var si = 0; si < sizeRows.length; si++) {
                var row = sizeRows[si];
                var sizeLabel = row.querySelector('.sz-size')?.value.trim() || '';
                var price = parseFloat(row.querySelector('.sz-price')?.value || 0);
                var offer = (row.querySelector('.sz-offer')?.value) ? parseFloat(row.querySelector('.sz-offer').value) : null;
                var stock = parseInt(row.querySelector('.sz-stock')?.value || 0);
                if(!sizeLabel || price <= 0) continue;
                sizes.push({ size: sizeLabel, price: price, offer_price: offer, stock: stock });
            }
            if(sizes.length === 0) continue;
            result.push({ name: name, image_url: null, sizes: sizes });
        }
        return result;
    }

            var price = parseFloat(row.querySelector('.v-price')?.value || 0);

            var stock = parseInt(row.querySelector('.v-stock')?.value || 0);

        try {
            var updateData = { status: status }; var now = new Date().toISOString();
            if (status === 'confirmed') updateData.confirmed_at = now;
            else if (status === 'cancelled') updateData.cancelled_at = now;
            else if (status === 'out_for_delivery') updateData.out_for_delivery_at = now;
            else if (status === 'delivered') updateData.delivered_at = now;

            renderDashboard();

                else { $('app').innerHTML = '<div style="text-align:center;padding:60px 20px;"><i class="fas fa-exclamation-triangle" style="font-size:56px;color:#F59E0B;"></i><h3 style="margin-top:14px;">Ownership Mismatch</h3><button style="padding:12px 24px;background:#0B5A31;color:white;border:none;border-radius:9999px;font-size:14px;font-weight:600;cursor:pointer;margin-top:16px;" onclick="handleLogout()">Logout</button></div>'; return; }
            }
            if(shopData.status !== 'approved') { $('app').innerHTML = '<div style="text-align:center;padding:80px;"><i class="fas fa-clock" style="font-size:56px;color:#F59E0B;"></i><h3>Approval Pending</h3><p style="color:#6B7280;">Admin will review within 24 hours</p></div>'; return; }
            renderDashboard();
            var catRes = await safeFetch(function() { return sb.from('categories').select('id, name').eq('is_active', true).order('name'); });
            allCategories = catRes.data || [];
            await Promise.all([loadProducts(), loadOrders()]);
            renderDashboard();
            console.log('[Init] Total time:', Date.now() - t0, 'ms');
            startSessionRefresh();
            window.addEventListener('popstate', function() { if(_isLoggingOut) return; try { history.pushState({ page: 'dashboard' }, '', window.location.href); } catch(e) {} showExitDialog(); });
        } catch(e) {
            console.error('Init error:', e);
            $('app').innerHTML = '<div style="text-align:center;padding:80px;"><i class="fas fa-exclamation-circle" style="font-size:56px;color:#EF4444;"></i><h3>Failed to Load</h3><p style="color:#6B7280;font-size:12px;margin:10px 0;">' + (e.message || 'Unknown error') + '</p><button style="padding:12px 24px;margin-top:16px;background:#0B5A31;color:white;border:none;border-radius:9999px;font-size:14px;font-weight:600;cursor:pointer;" onclick="init()">🔄 Retry</button></div>';
        }
    }
    
    document.addEventListener('DOMContentLoaded', function() {
        if (!navigator.onLine) { var b = document.getElementById('netBanner'); if (b) b.style.display = 'block'; }
        init();
    });
    
    window.switchTab = switchTab;
    window.closeModal = closeModal;
    window.showAddProduct = showAddProduct;
    window.showEditProduct = showEditProduct;
    window.setVariantType = setVariantType;
    window.addWeightRow = addWeightRow;
    window.addFlavourGroup = addFlavourGroup;
    window.addPackSize = addPackSize;
    window.handleFlavourPhoto = handleFlavourPhoto;
    window.handleProdImages = handleProdImages;
    window.removeExistingImage = removeExistingImage;
    window.saveProduct = saveProduct;
    window.updateProduct = updateProduct;
    window.requestDeleteProduct = requestDeleteProduct;
    window.updateStatus = updateStatus;
    window.copyOrderDetails = copyOrderDetails;
    window.handleLogout = handleLogout;
    window.toggleOfferFields = toggleOfferFields;
    window.handleOfferPhoto = handleOfferPhoto;
    window.removeExistingOffer = removeExistingOffer;
    window.addColorGroup = addColorGroup;
    window.quickAddSize = quickAddSize;
    window.addSizeRow = addSizeRow;
    window.handleColorPhoto = handleColorPhoto;
    window.cancelExit = cancelExit;
    window.confirmExit = confirmExit;
    window.init = init;
    window.changeSizeType = changeSizeType;
    window.handleSearch = handleSearch;
    window.handleSearchKeyup = handleSearchKeyup;
    window.clearSearch = clearSearch;
})();
</script>
</body>
