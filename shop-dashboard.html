<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>शॉप डैशबोर्ड - Zymart</title>
    <meta name="theme-color" content="#0B5A31">
    <meta name="description" content="Zymart - अपनी दुकान का प्रबंधन करें">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --brand-green: #0B5A31; --brand-green-light: #0F6E3B; --brand-green-dark: #083D21;
            --brand-orange: #F59E0B; --brand-orange-dark: #E8890A; --brand-orange-light: #FFB020;
            --brand-white: #F5F5F5;
            --neutral-white: #FFFFFF; --neutral-bg: #F9FAFB; --neutral-border: #E5E7EB;
            --neutral-gray: #6B7280; --neutral-dark: #1A1A1A;
            --danger: #EF4444; --danger-bg: #FEF2F2; --success: #22C55E; --success-bg: #EDF7F1;
            --warning: #F59E0B; --warning-bg: #FFF8EB;
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08); --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
            --radius-sm: 10px; --radius-md: 14px; --radius-lg: 18px; --radius-xl: 22px; --radius-full: 9999px;
            --ease-fast: cubic-bezier(0.4,0,0.2,1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--neutral-bg); color: var(--neutral-dark);
            padding-bottom: 30px; -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased; min-height: 100vh;
        }
        
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes skel { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
        
        .skeleton-block { background: linear-gradient(90deg,#e5e5e5 25%,#d4d4d4 50%,#e5e5e5 75%); background-size:200% 100%; animation:skel 1.3s infinite; border-radius:var(--radius-md); }
        .skeleton-card { background: var(--neutral-white); border-radius: var(--radius-xl); padding: 20px; margin-bottom: 16px; }
        .skeleton-line { height: 14px; margin-bottom: 10px; }
        .skeleton-line-sm { width: 60%; height: 14px; }
        .skeleton-avatar { width: 56px; height: 56px; border-radius: 50%; }
        
        .top-bar { background: var(--brand-green); position: fixed; top: 0; left: 0; width: 100%; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; z-index: 100; box-shadow: 0 2px 16px rgba(11,90,49,0.3); }
        .top-bar-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { width: 40px; height: 40px; min-width: 40px; background: rgba(255,255,255,0.10); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; transition: all 0.15s ease; }
        .back-btn:active { background: rgba(255,255,255,0.22); transform: scale(0.93); }
        .back-btn i { font-size: 15px; color: white; }
        .shop-name-top { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 700; color: var(--brand-white); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .logout-btn { background: rgba(255,255,255,0.12); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 7px 14px; border-radius: var(--radius-full); font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; font-family: 'Inter', sans-serif; }
        .logout-btn:active { background: rgba(255,255,255,0.25); }
        
        .main-content { padding: 70px 14px 20px; max-width: 650px; margin: 0 auto; }
        
        .profile-card { background: var(--neutral-white); border-radius: var(--radius-xl); padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow-xs); border: 1px solid var(--neutral-border); animation: fadeInUp 0.3s ease; }
        .profile-header { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
        .profile-avatar { width: 56px; height: 56px; min-width: 56px; background: #EDF7F1; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--brand-green); overflow: hidden; border: 2px solid #C8E6C9; }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-info h3 { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 700; }
        .status-badge { display: inline-block; padding: 3px 10px; border-radius: var(--radius-full); font-size: 10px; font-weight: 700; background: var(--success-bg); color: #059669; }
        .upi-badge { display: inline-block; padding: 3px 10px; border-radius: var(--radius-full); font-size: 10px; font-weight: 600; background: #EFF6FF; color: #4338CA; margin-left: 6px; }
        .premium-badge { display: inline-block; padding: 3px 10px; border-radius: var(--radius-full); font-size: 10px; font-weight: 700; background: #FFF8EB; color: #D97706; margin-left: 6px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
        .stat-card { background: var(--neutral-white); border-radius: var(--radius-lg); padding: 14px 12px; text-align: center; border: 1px solid var(--neutral-border); box-shadow: var(--shadow-xs); cursor: pointer; transition: all 0.15s ease; }
        .stat-card:active { transform: scale(0.97); }
        .stat-number { font-family: 'Poppins', sans-serif; font-size: 22px; font-weight: 700; color: var(--brand-green); }
        .stat-label { font-size: 10px; color: var(--neutral-gray); font-weight: 500; margin-top: 2px; }
        .stat-card.revenue { background: #EDF7F1; border-color: #C8E6C9; }
        .stat-card.pending { background: #FFF8EB; border-color: #FDE68A; }
        
        .invite-card { background: #FFF8EB; border-radius: var(--radius-lg); padding: 14px; margin-bottom: 14px; border: 2px solid #FDE68A; text-align: center; animation: fadeInUp 0.3s ease; }
        .invite-card .invite-title { font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 700; color: #92400E; margin-bottom: 2px; }
        .invite-card .invite-subtitle { font-size: 11px; color: #A16207; margin-bottom: 8px; }
        .invite-card .btn-invite { background: var(--brand-orange); color: white; border: none; padding: 8px 18px; border-radius: var(--radius-full); font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; box-shadow: 0 4px 14px rgba(245,158,11,0.22); }
        
        .tabs { display: flex; gap: 6px; margin-bottom: 14px; background: var(--neutral-white); padding: 5px; border-radius: var(--radius-full); border: 1px solid var(--neutral-border); box-shadow: var(--shadow-xs); }
        .tab { flex: 1; text-align: center; padding: 10px 8px; font-size: 12px; font-weight: 600; border-radius: var(--radius-full); cursor: pointer; color: var(--neutral-gray); border: none; background: transparent; transition: all 0.15s ease; font-family: 'Inter', sans-serif; }
        .tab.active { background: var(--brand-green); color: white; }
        .tab:active { transform: scale(0.96); }
        
        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .product-card { background: var(--neutral-white); border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--neutral-border); box-shadow: var(--shadow-xs); animation: fadeInUp 0.3s ease; }
        .product-img { width: 100%; aspect-ratio: 1/1; background: var(--neutral-bg); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .product-img img { width: 100%; height: 100%; object-fit: contain; background: #FAFAFA; }
        .product-img i.fallback { font-size: 40px; color: #D1D5DB; position: absolute; }
        .product-stock { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.7); color: white; padding: 2px 7px; border-radius: var(--radius-full); font-size: 9px; font-weight: 600; }
        .product-info { padding: 10px; }
        .product-name { font-weight: 600; font-size: 12px; margin-bottom: 3px; }
        .product-price { color: var(--brand-green); font-weight: 700; font-size: 13px; }
        .original-price { font-size: 10px; color: var(--neutral-gray); text-decoration: line-through; margin-left: 4px; }
        .product-actions { display: flex; gap: 6px; margin-top: 8px; }
        .btn-edit, .btn-delete { flex: 1; padding: 6px; border: none; border-radius: var(--radius-full); font-size: 10px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.15s ease; }
        .btn-edit { background: #F3F5F4; color: var(--neutral-dark); }
        .btn-edit:active { background: #E5E7EB; }
        .btn-delete { background: var(--danger-bg); color: var(--danger); }
        .btn-delete:active { background: #FECACA; }
        
        .orders-list { background: var(--neutral-white); border-radius: var(--radius-lg); border: 1px solid var(--neutral-border); overflow: hidden; }
        .order-item { padding: 14px; border-bottom: 1px solid var(--neutral-border); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; animation: fadeInUp 0.3s ease; }
        .order-info { flex: 1; min-width: 100px; }
        .order-id { font-weight: 700; font-size: 13px; }
        .order-date { font-size: 11px; color: var(--neutral-gray); }
        .order-amount { font-weight: 700; color: var(--brand-green); font-size: 14px; }
        .order-status-select { padding: 5px 10px; border-radius: var(--radius-full); border: 1px solid var(--neutral-border); font-size: 11px; font-weight: 600; background: white; font-family: 'Inter', sans-serif; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(8,61,33,0.7); backdrop-filter: blur(6px); display: none; align-items: flex-end; justify-content: center; z-index: 1000; }
        .modal-overlay.show { display: flex; }
        .modal-container { background: white; border-radius: var(--radius-xl) var(--radius-xl) 0 0; width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; padding: 20px; animation: slideUp 0.3s ease; }
        .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--neutral-border); position: sticky; top: 0; background: white; z-index: 5; }
        .modal-header h3 { font-family: 'Poppins', sans-serif; font-size: 17px; font-weight: 700; }
        .modal-close { width: 36px; height: 36px; background: #F3F5F4; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; font-size: 15px; color: var(--neutral-gray); }
        
        .form-group { margin-bottom: 13px; }
        .form-label { font-size: 12px; font-weight: 600; margin-bottom: 5px; display: block; }
        .form-control { width: 100%; padding: 10px 12px; border: 1.5px solid var(--neutral-border); border-radius: var(--radius-sm); font-size: 13px; font-family: 'Inter', sans-serif; background: white; outline: none; transition: all 0.15s ease; }
        .form-control:focus { border-color: var(--brand-orange); box-shadow: 0 0 0 3px rgba(245,158,11,0.08); }
        
        .btn-row { display: flex; gap: 10px; margin-top: 18px; }
        .btn-primary { flex: 1; background: var(--brand-green); color: white; border: none; padding: 12px; border-radius: var(--radius-full); font-weight: 600; font-size: 14px; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.15s ease; box-shadow: 0 4px 14px rgba(11,90,49,0.22); }
        .btn-primary:active { background: var(--brand-green-dark); transform: scale(0.97); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-secondary { flex: 1; background: transparent; color: var(--neutral-dark); border: 1.5px solid var(--neutral-border); padding: 12px; border-radius: var(--radius-full); font-weight: 600; font-size: 14px; cursor: pointer; font-family: 'Inter', sans-serif; }
        .btn-secondary:active { background: #F3F5F4; }
        .btn-sm { padding: 6px 14px; font-size: 11px; border-radius: var(--radius-full); font-weight: 600; cursor: pointer; border: none; font-family: 'Inter', sans-serif; }
        
        .empty-state { text-align: center; padding: 40px 20px; background: var(--neutral-white); border-radius: var(--radius-lg); border: 1px solid var(--neutral-border); }
        .empty-state i { font-size: 48px; color: #D1D5DB; margin-bottom: 12px; display: block; }
        .empty-state h4 { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 6px; }
        .empty-state p { font-size: 12px; color: var(--neutral-gray); margin-bottom: 10px; }
        
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--neutral-dark); color: white; padding: 11px 22px; border-radius: var(--radius-full); font-size: 12px; z-index: 2000; opacity: 0; visibility: hidden; white-space: nowrap; box-shadow: var(--shadow-lg); transition: all 0.3s ease; }
        .toast.show { opacity: 1; visibility: visible; }
        .toast.error { background: #EF4444; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="app">
        <div style="padding:70px 14px 20px;max-width:650px;margin:0 auto;">
            <div class="skeleton-card" style="display:flex;align-items:center;gap:14px;">
                <div class="skeleton-block skeleton-avatar"></div>
                <div style="flex:1;"><div class="skeleton-block skeleton-line-sm"></div><div class="skeleton-block skeleton-line" style="width:40%;"></div></div>
            </div>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;">
                <div class="skeleton-block" style="height:70px;border-radius:var(--radius-lg);"></div>
                <div class="skeleton-block" style="height:70px;border-radius:var(--radius-lg);"></div>
                <div class="skeleton-block" style="height:70px;border-radius:var(--radius-lg);"></div>
            </div>
            <div class="skeleton-block" style="height:44px;border-radius:var(--radius-full);margin-bottom:16px;"></div>
        </div>
    </div>
    <div id="toastMsg" class="toast"></div>

    <script>
(function() {
    'use strict';
    
    window.addEventListener('error', function(e) { console.error('[Zymart Dashboard]', e.message); });
    window.addEventListener('unhandledrejection', function(e) { console.error('[Zymart Dashboard]', e.reason); e.preventDefault(); });
    
    function $(id) { return document.getElementById(id); }
    function esc(str) { if (!str) return ''; var d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
    
    var sb = null;
    try { sb = supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co', 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1'); }
    catch(e) { sb = { auth: { getSession: function() { return Promise.resolve({ data: { session: null } }); } } }; }
    
    var SUPABASE_URL = 'https://zwajyovemwdqtkecipeb.supabase.co';
    var currentUser = null, shopData = null, allCategories = [], products = [], orders = [];
    var currentTab = 'products';
    
    function showToast(m, e) { var t = document.getElementById('toastMsg'); if (!t) return; t.textContent = m; t.className = 'toast' + (e ? ' error' : ''); t.classList.add('show'); clearTimeout(t._timer); t._timer = setTimeout(function() { t.classList.remove('show'); }, 2500); }
    
    function getImageUrl(url) {
        if (!url) return '';
        if (url.indexOf('http')===0 || url.indexOf('data:')===0) return url;
        if (url.indexOf('/')===0) return SUPABASE_URL + '/storage/v1/object/public' + url;
        return SUPABASE_URL + '/storage/v1/object/public/product-images/' + url;
    }
    
    async function safeFetch(fn, r) { r=r||3; for(var i=0;i<r;i++){try{var res=await fn();if(res&&res.error)throw new Error(res.error.message);return res;}catch(e){if(i===r-1)throw e;await new Promise(function(x){setTimeout(x,Math.pow(2,i)*500);});}} }
    
    window.addEventListener('online', function() { showToast('✅ इंटरनेट बहाल!'); });
    window.addEventListener('offline', function() { showToast('⚠️ ऑफलाइन', true); });
    
    // ============ INIT (FIXED — owner_email se fetch) ============
    async function initDashboard() {
        try { 
            var sr = await sb.auth.getSession(); 
            if (!sr.data.session) { window.location.href = 'index.html'; return; } 
            currentUser = sr.data.session.user; 
        } catch(e) { window.location.href = 'index.html'; return; }
        
        try {
            // ✅ FIXED: owner_email se shop fetch karo (owner_id nahi)
            var shopResult = await safeFetch(function() { 
                return sb.from('shops').select('*').eq('owner_email', currentUser.email).maybeSingle(); 
            });
            if (!shopResult.data) { 
                $('app').innerHTML = '<div style="text-align:center;padding:80px;"><i class="fas fa-store" style="font-size:56px;color:#D1D5DB;"></i><h3 style="font-family:Poppins,sans-serif;">कोई दुकान नहीं</h3><p style="color:#6B7280;">पहले रजिस्टर करें (₹299/साल)</p><button class="btn-primary" style="width:auto;padding:12px 24px;margin-top:16px;" onclick="location.href=\'shop-register.html\'">दुकान रजिस्टर करें</button></div>'; 
                return; 
            }
            shopData = shopResult.data;
            if (shopData.status !== 'approved') { 
                $('app').innerHTML = '<div style="text-align:center;padding:80px;"><i class="fas fa-clock" style="font-size:56px;color:#F59E0B;"></i><h3 style="font-family:Poppins,sans-serif;">स्वीकृति लंबित</h3><p style="color:#6B7280;">Admin जल्द ही समीक्षा करेगा</p></div>'; 
                return; 
            }
            
            var catResult = await safeFetch(function() { return sb.from('categories').select('id, name').eq('is_active', true).order('name'); });
            allCategories = catResult.data || [];
            await Promise.all([loadProducts(), loadOrders()]);
            renderDashboard(true);
        } catch(e) { 
            console.error('[Zymart] Dashboard init error:', e);
            $('app').innerHTML = '<div style="text-align:center;padding:80px;"><i class="fas fa-exclamation-circle" style="font-size:56px;color:#EF4444;"></i><h3>लोड विफल</h3><p>' + (e.message||'') + '</p><button class="btn-primary" style="width:auto;padding:12px 24px;margin-top:16px;" onclick="initDashboard()">पुनः प्रयास</button></div>'; 
        }
    }
    
    async function loadProducts() { try { var r = await safeFetch(function() { return sb.from('products').select('*').eq('shop_id', shopData.id).order('created_at', { ascending: false }); }); products = r.data || []; } catch(e) { products = []; } }
    async function loadOrders() { try { var r = await safeFetch(function() { return sb.from('orders').select('*').eq('shop_id', shopData.id).order('created_at', { ascending: false }); }); orders = r.data || []; } catch(e) { orders = []; } }
    
    function renderDashboard(reloadTabs) {
        var pc = 0, revenue = 0;
        for (var i=0;i<orders.length;i++) { if (orders[i].status==='pending') pc++; if (orders[i].status!=='cancelled') revenue += parseFloat(orders[i].total_amount)||0; }
        var shopImgUrl = getImageUrl(shopData.image_url);
        
        var html = '<div class="top-bar"><div class="top-bar-left"><button class="back-btn" onclick="location.href=\'index.html\'"><i class="fas fa-home"></i></button><span class="shop-name-top">' + esc(shopData.name) + '</span></div><button class="logout-btn" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> लॉगआउट</button></div>';
        html += '<div class="main-content">';
        html += '<div class="profile-card"><div class="profile-header"><div class="profile-avatar">' + (shopImgUrl ? '<img src="'+shopImgUrl+'" onerror="this.style.display=\'none\';this.parentElement.innerHTML=\'<i class=\\\'fas fa-store\\\'></i>\';">' : '<i class="fas fa-store"></i>') + '</div><div class="profile-info"><h3>' + esc(shopData.name) + '</h3><span class="status-badge">✅ स्वीकृत</span><span class="premium-badge">⭐ प्रीमियम (₹299/साल)</span>';
        if (shopData.upi_id) html += '<span class="upi-badge">UPI: ' + esc(shopData.upi_id) + '</span>';
        html += '</div></div><div style="font-size:12px;color:#6B7280;margin-bottom:12px;">📍 ' + esc(shopData.city||'N/A') + ' | 📞 ' + esc(shopData.phone||'N/A') + '</div>';
        html += '<button class="btn-secondary" style="width:100%;" onclick="showEditShopModal()"><i class="fas fa-edit"></i> दुकान एडिट करें</button></div>';
        html += '<div class="stats-grid"><div class="stat-card"><div class="stat-number">' + products.length + '</div><div class="stat-label">प्रोडक्ट्स</div></div><div class="stat-card pending" onclick="switchTab(\'orders\')"><div class="stat-number">' + pc + '</div><div class="stat-label">पेंडिंग</div></div><div class="stat-card revenue"><div class="stat-number">₹' + revenue.toLocaleString('en-IN') + '</div><div class="stat-label">कमाई</div></div></div>';
        html += '<div class="invite-card"><div class="invite-title">🎁 दोस्त की दुकान रजिस्टर कराओ!</div><div class="invite-subtitle">हर रेफरल पर ₹100 कमीशन पाएं</div><button class="btn-invite" onclick="location.href=\'invite-earn.html\'"><i class="fas fa-gift"></i> इन्वाइट करें</button></div>';
        html += '<div class="tabs"><button class="tab'+(currentTab==='products'?' active':'')+'" onclick="switchTab(\'products\')">प्रोडक्ट्स ('+products.length+')</button><button class="tab'+(currentTab==='orders'?' active':'')+'" onclick="switchTab(\'orders\')">ऑर्डर ('+orders.length+')</button></div><div id="tabContent"></div></div>';
        html += '<div id="modalOverlay" class="modal-overlay" onclick="if(event.target===this)closeModal()"><div id="modalContainer" class="modal-container"></div></div>';
        
        $('app').innerHTML = html;
        if (reloadTabs) renderTabContent();
    }
    
    function renderTabContent() {
        var c = $('tabContent'); if (!c) return;
        if (currentTab === 'products') { c.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><h3 style="font-size:15px;">मेरे प्रोडक्ट्स</h3><button class="btn-primary btn-sm" onclick="showAddProductModal()" style="width:auto;"><i class="fas fa-plus"></i> जोड़ें</button></div>' + renderProductsList(); }
        else { c.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><h3 style="font-size:15px;">ऑर्डर</h3><button class="btn-secondary btn-sm" onclick="refreshOrders()" style="width:auto;"><i class="fas fa-sync-alt"></i> रिफ्रेश</button></div>' + renderOrdersList(); }
    }
    
    function renderProductsList() {
        if (!products.length) return '<div class="empty-state"><i class="fas fa-box-open"></i><h4>कोई प्रोडक्ट नहीं</h4><p>अपना पहला प्रोडक्ट जोड़ें</p><button class="btn-primary btn-sm" onclick="showAddProductModal()">+ जोड़ें</button></div>';
        var html = '<div class="products-grid">';
        for (var i=0;i<products.length;i++) { var p=products[i], img=(p.images&&p.images.length)?getImageUrl(p.images[0]):''; html+='<div class="product-card"><div class="product-img">'+(img?'<img src="'+img+'" loading="lazy" onerror="this.style.display=\'none\';">':'')+'<i class="fas fa-box fallback" style="'+(img?'display:none;':'')+'"></i><span class="product-stock">'+(p.stock||0)+'</span></div><div class="product-info"><div class="product-name">'+esc(p.name)+'</div><div class="product-price">₹'+(p.offer_price||p.price)+(p.offer_price?'<span class="original-price">₹'+p.price+'</span>':'')+'</div><div class="product-actions"><button class="btn-edit" onclick="editProduct(\''+p.id+'\')"><i class="fas fa-edit"></i></button><button class="btn-delete" onclick="deleteProduct(\''+p.id+'\')"><i class="fas fa-trash"></i></button></div></div></div>'; }
        return html += '</div>';
    }
    
    function renderOrdersList() {
        if (!orders.length) return '<div class="empty-state"><i class="fas fa-receipt"></i><h4>कोई ऑर्डर नहीं</h4></div>';
        var html = '<div class="orders-list">';
        for (var i=0;i<orders.length;i++) { var o=orders[i]; html+='<div class="order-item"><div class="order-info"><div class="order-id">#'+(o.id||'').slice(0,8).toUpperCase()+'</div><div class="order-date">'+new Date(o.created_at).toLocaleDateString('hi-IN')+'</div></div><div class="order-amount">₹'+(parseFloat(o.total_amount)||0).toLocaleString('en-IN')+'</div><select class="order-status-select" onchange="updateOrderStatus(\''+o.id+'\', this.value)"><option value="pending"'+(o.status==='pending'?' selected':'')+'>लंबित</option><option value="confirmed"'+(o.status==='confirmed'?' selected':'')+'>कन्फर्म</option><option value="delivered"'+(o.status==='delivered'?' selected':'')+'>डिलीवर</option><option value="cancelled"'+(o.status==='cancelled'?' selected':'')+'>रद्द</option></select></div>'; }
        return html += '</div>';
    }
    
    window.switchTab = function(t) { currentTab = t; renderDashboard(true); };
    window.closeModal = function() { $('modalOverlay').classList.remove('show'); };
    
    // ============ EDIT SHOP ============
    window.showEditShopModal = function() {
        var html = '<div class="modal-header"><h3>दुकान एडिट करें</h3><button class="modal-close" onclick="closeModal()">✕</button></div>';
        html += '<div class="form-group"><label class="form-label">दुकान का नाम</label><input type="text" id="editName" class="form-control" value="'+esc(shopData.name)+'"></div>';
        html += '<div class="form-group"><label class="form-label">फ़ोन</label><input type="tel" id="editPhone" class="form-control" value="'+esc(shopData.phone||'')+'"></div>';
        html += '<div class="form-group"><label class="form-label">WhatsApp</label><input type="tel" id="editWhatsapp" class="form-control" value="'+esc(shopData.whatsapp||'')+'"></div>';
        html += '<div class="form-group"><label class="form-label">शहर</label><input type="text" id="editCity" class="form-control" value="'+esc(shopData.city||'')+'"></div>';
        html += '<div class="form-group"><label class="form-label">पता</label><textarea id="editAddress" class="form-control" rows="2">'+esc(shopData.address||'')+'</textarea></div>';
        html += '<div style="background:#EDF7F1;border-radius:12px;padding:14px;margin:12px 0;border:1px solid #C8E6C9;"><label class="form-label" style="color:#0B5A31;">UPI ID (सीधे भुगतान के लिए)</label><input type="text" id="editUpiId" class="form-control" value="'+esc(shopData.upi_id||'')+'" placeholder="जैसे: shopname@upi"></div>';
        html += '<div class="btn-row"><button class="btn-primary" onclick="saveShopEdit()">सेव करें</button><button class="btn-secondary" onclick="closeModal()">रद्द करें</button></div>';
        $('modalContainer').innerHTML = html;
        $('modalOverlay').classList.add('show');
    };
    
    window.saveShopEdit = async function() {
        try {
            var updates = { name: $('editName').value, phone: $('editPhone').value, whatsapp: $('editWhatsapp').value, city: $('editCity').value, address: $('editAddress').value, upi_id: ($('editUpiId').value||'').trim()||null };
            await safeFetch(function() { return sb.from('shops').update(updates).eq('id', shopData.id); });
            showToast('✅ दुकान अपडेट!'); closeModal();
            var result = await safeFetch(function() { return sb.from('shops').select('*').eq('id', shopData.id).single(); });
            shopData = result.data; renderDashboard(false); renderTabContent();
        } catch(e) { showToast('❌ अपडेट विफल', true); }
    };
    
    // ============ ADD/EDIT PRODUCT ============
    window.showAddProductModal = function() {
        var catOpts = '<option value="">श्रेणी चुनें</option>';
        for (var i=0;i<allCategories.length;i++) catOpts += '<option value="'+esc(allCategories[i].name)+'">'+esc(allCategories[i].name)+'</option>';
        var html = '<div class="modal-header"><h3>नया प्रोडक्ट जोड़ें</h3><button class="modal-close" onclick="closeModal()">✕</button></div>';
        html += '<div class="form-group"><label class="form-label">प्रोडक्ट नाम *</label><input type="text" id="prodName" class="form-control" placeholder="जैसे: आम, दूध, ब्रेड..."></div>';
        html += '<div class="form-group"><label class="form-label">श्रेणी *</label><select id="prodCategory" class="form-control">'+catOpts+'</select></div>';
        html += '<div class="form-group"><label class="form-label">कीमत (₹) *</label><input type="number" id="prodPrice" class="form-control" placeholder="जैसे: 100" min="1"></div>';
        html += '<div class="form-group"><label class="form-label">ऑफर कीमत (₹)</label><input type="number" id="prodOfferPrice" class="form-control" placeholder="डिस्काउंट कीमत" min="0"></div>';
        html += '<div class="form-group"><label class="form-label">स्टॉक *</label><input type="number" id="prodStock" class="form-control" placeholder="जैसे: 50" min="0" value="10"></div>';
        html += '<div class="form-group"><label class="form-label">यूनिट</label><select id="prodUnit" class="form-control"><option value="piece">पीस</option><option value="kg">किलो</option><option value="gram">ग्राम</option><option value="liter">लीटर</option><option value="dozen">दर्जन</option></select></div>';
        html += '<div class="btn-row"><button class="btn-primary" onclick="saveProduct()">सेव करें</button><button class="btn-secondary" onclick="closeModal()">रद्द करें</button></div>';
        $('modalContainer').innerHTML = html;
        $('modalOverlay').classList.add('show');
    };
    
    window.saveProduct = async function() {
        var name = ($('prodName')?.value||'').trim();
        var category = $('prodCategory')?.value||'';
        var price = parseFloat($('prodPrice')?.value||'0');
        var offerPrice = parseFloat($('prodOfferPrice')?.value||'0')||null;
        var stock = parseInt($('prodStock')?.value||'0');
        var unit = $('prodUnit')?.value||'piece';
        if (!name) { showToast('नाम जरूरी', true); return; }
        if (!category) { showToast('श्रेणी जरूरी', true); return; }
        if (!price||price<=0) { showToast('कीमत जरूरी', true); return; }
        try {
            await safeFetch(function() { return sb.from('products').insert([{ shop_id: shopData.id, name: name, category_id: category, price: price, offer_price: offerPrice, stock: stock, unit: unit, is_active: true, created_at: new Date().toISOString() }]); });
            showToast('✅ प्रोडक्ट जोड़ा!'); closeModal();
            await loadProducts(); renderDashboard(false); renderTabContent();
        } catch(e) { showToast('❌ विफल', true); }
    };
    
    window.editProduct = async function(id) {
        var p = products.find(function(x){return x.id===id;}); if(!p) return;
        var catOpts = '<option value="">श्रेणी चुनें</option>';
        for (var i=0;i<allCategories.length;i++) catOpts += '<option value="'+esc(allCategories[i].name)+'"'+(allCategories[i].name===p.category_id?' selected':'')+'>'+esc(allCategories[i].name)+'</option>';
        var html = '<div class="modal-header"><h3>प्रोडक्ट एडिट करें</h3><button class="modal-close" onclick="closeModal()">✕</button></div>';
        html += '<div class="form-group"><label class="form-label">प्रोडक्ट नाम</label><input type="text" id="prodName" class="form-control" value="'+esc(p.name)+'"></div>';
        html += '<div class="form-group"><label class="form-label">श्रेणी</label><select id="prodCategory" class="form-control">'+catOpts+'</select></div>';
        html += '<div class="form-group"><label class="form-label">कीमत (₹)</label><input type="number" id="prodPrice" class="form-control" value="'+p.price+'"></div>';
        html += '<div class="form-group"><label class="form-label">ऑफर कीमत (₹)</label><input type="number" id="prodOfferPrice" class="form-control" value="'+(p.offer_price||'')+'"></div>';
        html += '<div class="form-group"><label class="form-label">स्टॉक</label><input type="number" id="prodStock" class="form-control" value="'+(p.stock||0)+'"></div>';
        html += '<div class="btn-row"><button class="btn-primary" onclick="updateProduct(\''+id+'\')">अपडेट करें</button><button class="btn-secondary" onclick="closeModal()">रद्द करें</button></div>';
        $('modalContainer').innerHTML = html;
        $('modalOverlay').classList.add('show');
    };
    
    window.updateProduct = async function(id) {
        var name = ($('prodName')?.value||'').trim();
        var category = $('prodCategory')?.value||'';
        var price = parseFloat($('prodPrice')?.value||'0');
        var offerPrice = parseFloat($('prodOfferPrice')?.value||'0')||null;
        var stock = parseInt($('prodStock')?.value||'0');
        if (!name||!category||!price) { showToast('सभी फील्ड भरें', true); return; }
        try {
            await safeFetch(function() { return sb.from('products').update({ name: name, category_id: category, price: price, offer_price: offerPrice, stock: stock }).eq('id', id); });
            showToast('✅ अपडेट!'); closeModal();
            await loadProducts(); renderDashboard(false); renderTabContent();
        } catch(e) { showToast('❌ विफल', true); }
    };
    
    window.updateOrderStatus = async function(id, status) {
        try { await safeFetch(function() { return sb.from('orders').update({ status: status }).eq('id', id); }); showToast('✅ स्टेटस अपडेट'); await loadOrders(); renderDashboard(false); renderTabContent(); } catch(e) { showToast('❌ विफल', true); }
    };
    
    window.refreshOrders = async function() { await loadOrders(); renderTabContent(); showToast('🔄 रिफ्रेश हो गया'); };
    window.handleLogout = async function() { if (confirm('लॉगआउट करें?')) { await sb.auth.signOut(); window.location.href = 'index.html'; } };
    window.deleteProduct = async function(id) { if (!confirm('प्रोडक्ट हटाएं?')) return; try { await safeFetch(function() { return sb.from('products').delete().eq('id', id); }); showToast('🗑️ हटा दिया'); await loadProducts(); renderDashboard(false); renderTabContent(); } catch(e) { showToast('❌ विफल', true); } };
    
    document.addEventListener('DOMContentLoaded', initDashboard);
    window.initDashboard = initDashboard;
})();
</script>
</body>
</html>
