<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Offline - Zatpat</title>
    <meta name="theme-color" content="#16A34A">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #16A34A; --bg: #F9FAFB; --text: #111827; --text-secondary: #6B7280; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        .offline-card { max-width: 360px; }
        .offline-icon { font-size: 72px; color: #D1D5DB; margin-bottom: 16px; }
        .offline-card h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
        .offline-card p { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.5; }
        .retry-btn { background: var(--primary); color: white; border: none; padding: 12px 28px; border-radius: 9999px; font-size: 14px; font-weight: 700; cursor: pointer; }
        .home-link { display: block; margin-top: 12px; color: var(--primary); text-decoration: none; font-weight: 600; font-size: 13px; }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon"><i class="fas fa-wifi"></i></div>
        <h2>You're Offline</h2>
        <p>Please check your internet connection and try again.</p>
        <button class="retry-btn" onclick="window.location.reload()"><i class="fas fa-sync-alt"></i> Try Again</button>
        <a class="home-link" href="index.html">← Back to Home</a>
    </div>
</body>
</html>
