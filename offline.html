<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ऑफलाइन - Zymart</title>
    <meta name="theme-color" content="#0B5A31">
    <meta name="description" content="Zymart - आप ऑफलाइन हैं। कृपया इंटरनेट कनेक्शन जांचें।">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --brand-green: #0B5A31; --brand-orange: #F59E0B;
            --neutral-white: #FFFFFF; --neutral-bg: #F9FAFB; 
            --neutral-gray: #6B7280; --neutral-dark: #1A1A1A;
            --radius-full: 9999px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--neutral-bg); color: var(--neutral-dark); 
            min-height: 100vh; display: flex; align-items: center; justify-content: center; 
            text-align: center; padding: 20px; -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }
        @keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }
        
        .offline-card { max-width: 380px; }
        .offline-icon { 
            font-size: 80px; color: #D1D5DB; margin-bottom: 16px; 
            animation: pulse 2s infinite;
        }
        .brand-logo { 
            font-family: 'Poppins', sans-serif; font-size: 28px; font-weight: 700; 
            margin-bottom: 20px; display: flex; align-items: baseline; justify-content: center; gap: 2px;
        }
        .brand-zy { color: var(--brand-green); }
        .brand-mart { color: var(--brand-orange); }
        
        .offline-card h2 { 
            font-family: 'Poppins', sans-serif; font-size: 22px; font-weight: 700; 
            margin-bottom: 8px; color: var(--neutral-dark);
        }
        .offline-card p { 
            font-size: 14px; color: var(--neutral-gray); margin-bottom: 24px; 
            line-height: 1.6; 
        }
        
        .retry-btn { 
            background: var(--brand-green); color: white; border: none; 
            padding: 14px 32px; border-radius: var(--radius-full); 
            font-size: 15px; font-weight: 600; cursor: pointer; 
            font-family: 'Inter', sans-serif; transition: all 0.15s ease;
            display: inline-flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 14px rgba(11,90,49,0.25);
        }
        .retry-btn:active { background: #083D21; transform: scale(0.96); }
        
        .home-link { 
            display: block; margin-top: 16px; color: var(--brand-green); 
            text-decoration: none; font-weight: 600; font-size: 14px; 
            transition: all 0.15s ease;
        }
        .home-link:active { color: var(--brand-orange); }
        .home-link i { margin-right: 4px; }
        
        .tips { 
            margin-top: 24px; font-size: 11px; color: #9CA3AF; 
            line-height: 1.8; 
        }
        .tips strong { color: var(--neutral-gray); }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="brand-logo">
            <span class="brand-zy">Zy</span><span class="brand-mart">mart</span>
        </div>
        <div class="offline-icon"><i class="fas fa-wifi"></i></div>
        <h2>आप ऑफलाइन हैं</h2>
        <p>कृपया अपना इंटरनेट कनेक्शन जांचें और पुनः प्रयास करें।</p>
        <button class="retry-btn" onclick="window.location.reload()"><i class="fas fa-sync-alt"></i> पुनः प्रयास करें</button>
        <a class="home-link" href="index.html"><i class="fas fa-arrow-left"></i> होम पेज पर वापस जाएं</a>
        
        <div class="tips">
            <strong>💡 सुझाव:</strong><br>
            • वाई-फाई या मोबाइल डेटा चालू करें<br>
            • हवाई जहाज मोड बंद करें<br>
            • राउटर को पुनः चालू करें
        </div>
    </div>
</body>
</html>
