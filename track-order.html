<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Track Order - ZyMart+</title>
    <meta name="theme-color" content="#0B5A31">
    <meta name="description" content="ZyMart+ - Track your order in real-time">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --brand-green:#0B5A31;--brand-green-dark:#083D21;--brand-orange:#F59E0B;--brand-orange-dark:#E8890A;--neutral-white:#FFFFFF;--neutral-bg:#F9FAFB;--neutral-border:#E5E7EB;--neutral-gray:#6B7280;--neutral-dark:#1A1A1A;--danger:#EF4444;--success:#10B981;--shadow-xs:0 1px 2px rgba(0,0,0,0.04);--shadow-sm:0 1px 4px rgba(0,0,0,0.06);--shadow-md:0 4px 16px rgba(0,0,0,0.08);--shadow-lg:0 8px 30px rgba(0,0,0,0.12);--radius-sm:10px;--radius-md:14px;--radius-lg:18px;--radius-xl:22px;--radius-full:9999px; }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',-apple-system,sans-serif;background:var(--neutral-bg);color:var(--neutral-dark);padding-bottom:40px;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;width:100%;max-width:100%;}
        #simpleLoader{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--neutral-white);z-index:10002;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity 0.3s ease;}
        #simpleLoader.fade-out{opacity:0;visibility:hidden;pointer-events:none;}
        .simple-spinner{width:34px;height:34px;border:2.5px solid var(--neutral-border);border-top-color:var(--brand-orange);border-radius:50%;animation:spin 0.7s linear infinite;}
        .loader-logo{font-family:'Poppins',sans-serif;font-size:22px;font-weight:700;}
        .loader-zy{color:#A3E635;}.loader-mart{color:#FDE047;}
        @keyframes spin{to{transform:rotate(360deg);}}@keyframes slideUp{from{transform:translateY(12px);opacity:0;}to{transform:translateY(0);opacity:1;}}@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(11,90,49,0.4);}50%{opacity:0.8;box-shadow:0 0 0 8px rgba(11,90,49,0);}}
        .top-bar{background:var(--brand-green);position:fixed;top:0;left:0;width:100%;z-index:1000;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 16px rgba(11,90,49,0.3);}
        .back-btn{width:40px;height:40px;min-width:40px;background:rgba(255,255,255,0.10);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:white;font-size:15px;text-decoration:none;}
        .back-btn:active{background:rgba(255,255,255,0.22);transform:scale(0.93);}
        .top-title{font-family:'Poppins',sans-serif;flex:1;font-size:16px;font-weight:700;color:white;}
        .brand-zy{color:#A3E635;}.brand-mart{color:#FDE047;}
        .main-content{padding-top:62px;max-width:600px;margin:0 auto;min-height:70vh;}
        .search-section{background:var(--neutral-white);margin:12px 14px;padding:24px 16px;border-radius:var(--radius-xl);border:1px solid var(--neutral-border);box-shadow:var(--shadow-sm);text-align:center;animation:slideUp 0.3s ease;}
        .search-section .search-icon{font-size:44px;color:var(--brand-green);margin-bottom:12px;display:block;}
        .search-section h3{font-family:'Poppins',sans-serif;font-size:17px;font-weight:700;margin-bottom:6px;}
        .search-section p{font-size:13px;color:var(--neutral-gray);margin-bottom:16px;}
        .search-input{width:100%;padding:13px 16px;border:2px solid var(--neutral-border);border-radius:var(--radius-full);font-size:14px;font-family:'Inter',sans-serif;outline:none;text-align:center;text-transform:uppercase;letter-spacing:2px;transition:all 0.2s ease;background:var(--neutral-bg);}
        .search-input:focus{border-color:var(--brand-orange);background:white;box-shadow:0 0 0 3px rgba(245,158,11,0.10);}
        .search-input::placeholder{text-transform:none;letter-spacing:normal;font-size:12px;}
        .track-btn{width:100%;padding:13px;background:var(--brand-green);color:white;border:none;border-radius:var(--radius-full);font-size:14px;font-weight:600;cursor:pointer;margin-top:12px;font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;}
        .track-btn:active{background:var(--brand-green-dark);transform:scale(0.97);}
        .track-btn:disabled{opacity:0.6;cursor:not-allowed;}
        .search-hint{font-size:11px;color:#9CA3AF;margin-top:10px;}
        .tracking-card{background:var(--neutral-white);margin:12px 14px;padding:20px 16px;border-radius:var(--radius-xl);border:1px solid var(--neutral-border);box-shadow:var(--shadow-sm);animation:slideUp 0.3s ease;}
        .order-id-display{text-align:center;font-size:14px;font-weight:700;margin-bottom:6px;padding:8px 16px;background:#EDF7F1;border-radius:var(--radius-full);display:inline-block;color:var(--brand-green-dark);font-family:'SF Mono','Courier New',monospace;letter-spacing:0.5px;}
        .order-date{text-align:center;font-size:12px;color:var(--neutral-gray);margin-bottom:22px;}
        .gps-info-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
        .gps-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:4px 10px;border-radius:9999px;font-weight:600;}
        .gps-badge.verified{background:#EDF7F1;color:#0B5A31;border:1px solid #A7F3D0;}
        .gps-badge.not-verified{background:#FEF2F2;color:#DC2626;border:1px solid #FECACA;}
        .distance-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:4px 10px;border-radius:9999px;font-weight:600;background:#EFF6FF;color:#2563EB;border:1px solid #BFDBFE;}
        .steps-container{position:relative;padding-left:4px;}
        .step{display:flex;gap:14px;padding-bottom:22px;position:relative;}
        .step:last-child{padding-bottom:0;}
        .step-line{position:absolute;left:19px;top:42px;width:2px;height:calc(100% - 20px);background:var(--neutral-border);border-radius:1px;}
        .step.completed .step-line{background:var(--brand-green);}
        .step.current .step-line{background:linear-gradient(to bottom,var(--brand-green),var(--neutral-border));}
        .step.cancelled-step .step-line{background:#FECACA;}
        .step-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;z-index:1;font-size:16px;border:3px solid var(--neutral-border);background:white;color:#D1D5DB;transition:all 0.3s ease;}
        .step.completed .step-icon{border-color:var(--brand-green);background:var(--brand-green);color:white;}
        .step.current .step-icon{border-color:var(--brand-green);background:white;color:var(--brand-green);animation:pulse 2s infinite;}
        .step.cancelled-step .step-icon{border-color:#EF4444;background:#FEE2E2;color:#EF4444;}
        .step-content{flex:1;padding-top:7px;}
        .step-title{font-size:14px;font-weight:700;transition:color 0.3s;}
        .step.completed .step-title,.step.current .step-title{color:var(--brand-green);}
        .step.pending .step-title{color:var(--neutral-gray);}
        .step.cancelled-step .step-title{color:#DC2626;}
        .step-desc{font-size:11px;color:var(--neutral-gray);margin-top:2px;}
        .step-time{font-size:10px;color:#9CA3AF;margin-top:2px;font-weight:500;}
        .summary-card{background:var(--neutral-white);margin:12px 14px;padding:16px;border-radius:var(--radius-lg);border:1px solid var(--neutral-border);box-shadow:var(--shadow-sm);animation:slideUp 0.35s ease;}
        .summary-title{font-family:'Poppins',sans-serif;font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
        .summary-title i{color:var(--brand-green);}
        .summary-row{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;color:var(--neutral-gray);border-bottom:1px solid var(--neutral-border);}
        .summary-row:last-child{border-bottom:none;}
        .summary-row.total{font-size:16px;font-weight:800;color:var(--neutral-dark);border-top:2px solid var(--neutral-dark);padding-top:12px;margin-top:6px;}
        .free-tag{color:var(--success);font-weight:700;}
        .address-row{font-size:11px;color:var(--neutral-gray);padding:6px 0;display:flex;align-items:flex-start;gap:6px;}
        .address-row i{color:var(--brand-green);margin-top:2px;flex-shrink:0;}
        .item-mini{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:11px;color:var(--neutral-gray);}
        .item-mini .variant-tag{font-size:9px;color:var(--brand-green);font-weight:600;background:#EDF7F1;padding:1px 5px;border-radius:9999px;}
        .action-buttons{display:flex;gap:10px;padding:0 14px;margin-top:14px;}
        .action-btn{flex:1;padding:12px 10px;border-radius:var(--radius-full);font-size:12px;font-weight:600;cursor:pointer;text-align:center;border:none;font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;gap:6px;}
        .btn-outline{background:var(--neutral-bg);color:var(--neutral-dark);border:1px solid var(--neutral-border);}
        .btn-primary{background:var(--brand-green);color:white;}
        .btn-whatsapp{background:#25D366;color:white;}
        .reset-link{text-align:center;padding:14px;}
        .reset-link button{background:none;border:none;color:var(--brand-green);font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
        .multiple-results{background:var(--neutral-white);margin:12px 14px;padding:16px;border-radius:var(--radius-lg);border:1px solid var(--neutral-border);box-shadow:var(--shadow-sm);animation:slideUp 0.3s ease;}
        .multiple-results h4{font-family:'Poppins',sans-serif;font-size:14px;font-weight:700;margin-bottom:10px;}
        .result-item{padding:10px 12px;border:1px solid var(--neutral-border);border-radius:var(--radius-md);margin-bottom:8px;cursor:pointer;transition:all 0.15s ease;display:flex;justify-content:space-between;align-items:center;}
        .result-item:active{background:#EDF7F1;}
        .result-id{font-size:13px;font-weight:600;font-family:'SF Mono','Courier New',monospace;}
        .result-date{font-size:11px;color:var(--neutral-gray);}
        .result-status{font-size:10px;font-weight:700;padding:3px 8px;border-radius:var(--radius-full);}
        .empty-state{text-align:center;padding:50px 20px;animation:slideUp 0.3s ease;}
        .empty-state i{font-size:48px;color:#D1D5DB;display:block;margin-bottom:12px;}
        .empty-state h3{font-family:'Poppins',sans-serif;font-size:17px;font-weight:700;margin-bottom:4px;}
        .empty-state p{font-size:13px;color:var(--neutral-gray);margin-bottom:14px;}
        .empty-state button{background:var(--brand-green);color:white;border:none;padding:10px 20px;border-radius:var(--radius-full);font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
        .invite-banner{margin:12px 14px;padding:14px;background:#FFF8EB;border:1px solid #FDE68A;border-radius:var(--radius-md);text-align:center;animation:slideUp 0.35s ease;}
        .invite-banner .invite-title{font-family:'Poppins',sans-serif;font-size:14px;font-weight:700;color:#92400E;margin-bottom:3px;}
        .invite-banner .invite-subtitle{font-size:11px;color:#A16207;margin-bottom:10px;}
        .btn-invite{background:var(--brand-orange);color:white;border:none;padding:10px 20px;border-radius:var(--radius-full);font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;box-shadow:0 4px 14px rgba(245,158,11,0.22);}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--neutral-dark);color:white;padding:10px 20px;border-radius:var(--radius-full);font-size:12px;z-index:10050;opacity:0;visibility:hidden;white-space:nowrap;box-shadow:var(--shadow-lg);transition:all 0.3s ease;}
        .toast.show{opacity:1;visibility:visible;}
        .toast.error{background:var(--danger);}
        .toast.success{background:var(--success);}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="simpleLoader"><div class="simple-spinner"></div><div class="loader-logo"><span class="loader-zy">Zy</span><span class="loader-mart">Mart</span></div></div>

<div id="mainApp" style="display:none;">
    <div class="top-bar">
        <a href="orders.html" class="back-btn" aria-label="Back"><i class="fas fa-arrow-left"></i></a>
        <span class="top-title"><span class="brand-zy">Zy</span><span class="brand-mart">Mart</span> Track</span>
    </div>
    <div class="main-content" id="mainContent">
        <div class="search-section" id="searchSection">
            <i class="fas fa-truck-fast search-icon"></i>
            <h3>Track Your Order</h3>
            <p>Enter at least 4 characters of your Order ID</p>
            <input type="text" id="orderIdInput" class="search-input" placeholder="e.g. 14BB4AFB" maxlength="50" autocomplete="off">
            <button class="track-btn" id="trackBtn" onclick="trackOrder()"><i class="fas fa-search"></i> Track Order</button>
            <p class="search-hint"><i class="fas fa-info-circle" style="color:var(--brand-orange);margin-right:4px;"></i> Order ID is in your confirmation SMS/Email</p>
        </div>
        <div id="trackingResult"></div>
    </div>
</div>

<div class="toast" id="toastMsg"><span id="toastText"></span></div>

<script>
(function(){'use strict';
window.addEventListener('error',function(e){console.error('[Track]',e.message);try{showToast('Something went wrong','error');}catch(_){}});

var sb=supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co','sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1');
var SUPABASE_URL='https://zwajyovemwdqtkecipeb.supabase.co';
var currentUser=null,isTracking=false;

function getEl(id){return document.getElementById(id);}
function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function safeJSON(s,f){try{return s?JSON.parse(s):f;}catch(e){return f;}}

function showToast(m,type){
    var t=getEl('toastMsg'),s=getEl('toastText');
    if(!t||!s)return;s.textContent=m;
    t.className='toast';
    if(type==='error')t.classList.add('error');
    else if(type==='success')t.classList.add('success');
    t.classList.add('show');clearTimeout(t._t);
    t._t=setTimeout(function(){t.classList.remove('show','error','success');},2500);
}

function fmtWeight(w,u){
    if(!w)return'';
    if(u==='gram'||u==='g')return w>=1000?(w/1000).toFixed(1).replace(/\.0$/,'')+' kg':w+' g';
    if(u==='kg')return w+' kg';
    if(u==='liter'||u==='l')return w+' L';
    if(u==='ml')return w+' ml';
    return w+' '+(u||'');
}

function showApp(){var l=getEl('simpleLoader'),a=getEl('mainApp');if(a)a.style.display='';if(l){l.classList.add('fade-out');setTimeout(function(){if(l&&l.parentNode)l.parentNode.removeChild(l);},350);}}

function getStatusBadge(s){var m={pending:'background:#FFF8EB;color:#D97706;',confirmed:'background:#EFF6FF;color:#2563EB;',delivered:'background:#EDF7F1;color:#059669;',cancelled:'background:#FEF2F2;color:#DC2626;',shipped:'background:#E0E7FF;color:#4F46E5;'};return m[s]||'background:#F3F5F4;color:#6B7280;';}
function getStatusText(s){var m={pending:'Pending',confirmed:'Confirmed',delivered:'Delivered',cancelled:'Cancelled',shipped:'Shipped'};return m[s]||s;}

var trackingSteps=[
    {key:'pending',icon:'fa-clock',title:'Order Placed',desc:'Your order has been received'},
    {key:'confirmed',icon:'fa-check-circle',title:'Order Confirmed',desc:'Shop has confirmed your order'},
    {key:'shipped',icon:'fa-truck',title:'Out for Delivery',desc:'Delivery partner is on the way'},
    {key:'delivered',icon:'fa-box-check',title:'Delivered',desc:'Successfully delivered'}
];

async function findOrder(oid){
    if(oid.length>=32){try{var ex=await sb.from('orders').select('*').eq('id',oid).single();if(ex.data)return{order:ex.data,multiple:false};}catch(e){}}
    if(oid.length>=4){
        try{
            var fr=await sb.from('orders').select('*').ilike('id',oid+'%').order('created_at',{ascending:false}).limit(10);
            if(fr.data&&fr.data.length===1)return{order:fr.data[0],multiple:false};
            if(fr.data&&fr.data.length>1)return{orders:fr.data,multiple:true};
        }catch(e){}
    }
    return null;
}

window.trackOrder=async function(){
    if(isTracking)return;
    var rawId=(getEl('orderIdInput')?.value||'').trim(),orderId=rawId.replace(/[^a-zA-Z0-9\-_]/g,'').substring(0,50);
    if(!orderId||orderId.length<4){showToast('⚠️ Enter at least 4 characters','error');return;}
    isTracking=true;
    var rc=getEl('trackingResult'),tb=getEl('trackBtn');
    if(rc)rc.innerHTML='<div style="text-align:center;padding:30px;"><div style="width:28px;height:28px;border:2.5px solid #E5E7EB;border-top-color:#F59E0B;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 10px;"></div><p style="font-size:12px;color:#6B7280;">Searching...</p></div>';
    if(tb){tb.disabled=true;tb.innerHTML='<i class="fas fa-spinner fa-spin"></i> Searching...';}
    try{
        var sr=await findOrder(orderId);
        if(!sr){if(rc)rc.innerHTML='<div class="empty-state"><i class="fas fa-search"></i><h3>Order Not Found</h3><p>No order found for "'+esc(orderId)+'"</p><button onclick="resetSearch()">🔄 Try Again</button></div>';}
        else if(sr.multiple){renderMultiple(sr.orders);}
        else{renderTracking(sr.order);}
    }catch(e){if(rc)rc.innerHTML='<div class="empty-state"><i class="fas fa-exclamation-circle" style="color:#EF4444;"></i><h3>Error</h3><p>'+esc(e.message||'Unknown')+'</p><button onclick="resetSearch()">🔄 Retry</button></div>';}
    if(tb){tb.disabled=false;tb.innerHTML='<i class="fas fa-search"></i> Track Order';}
    isTracking=false;
};

function renderMultiple(orders){
    var rc=getEl('trackingResult'),html='<div class="multiple-results"><h4>🔍 '+orders.length+' Orders Found</h4>';
    for(var i=0;i<orders.length;i++){var o=orders[i];html+='<div class="result-item" onclick="selectOrder(\''+o.id+'\')"><div><div class="result-id">#'+(o.id||'').substring(0,8).toUpperCase()+'</div><div class="result-date">'+(o.created_at?new Date(o.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short'}):'')+' • ₹'+(parseFloat(o.total_amount)||0).toLocaleString('en-IN')+'</div></div><span class="result-status" style="'+getStatusBadge(o.status)+'">'+getStatusText(o.status)+'</span></div>';}
    html+='</div><div class="reset-link"><button onclick="resetSearch()"><i class="fas fa-arrow-left"></i> Search Another Order</button></div>';
    var ss=getEl('searchSection');if(ss)ss.style.display='none';
    if(rc)rc.innerHTML=html;
}

window.selectOrder=function(fid){var inp=getEl('orderIdInput');if(inp)inp.value=fid;trackOrder();};

function renderTracking(order){
    var status=order.status||'pending',isCancelled=status==='cancelled';
    var csi=trackingSteps.findIndex(function(s){return s.key===status;});if(csi<0)csi=0;
    var oid='#'+(order.id||'').substring(0,8).toUpperCase();
    var date=order.created_at?new Date(order.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
    var items=[];try{items=typeof order.items==='string'?JSON.parse(order.items):(order.items||[]);}catch(e){}
    
    var ss=getEl('searchSection');if(ss)ss.style.display='none';
    
    var html='<div class="tracking-card"><div style="text-align:center;"><span class="order-id-display" style="'+(isCancelled?'background:#FEF2F2;color:#DC2626;':'')+'">📦 '+oid+(isCancelled?' ❌':'')+'</span></div><div class="order-date">📅 '+esc(date)+'</div>';
    
    html+='<div class="gps-info-row">';
    if(order.location_verified)html+='<span class="gps-badge verified">📍 GPS Verified</span>';
    else html+='<span class="gps-badge not-verified">📍 GPS Not Verified</span>';
    if(order.delivery_distance_km)html+='<span class="distance-badge">📏 '+order.delivery_distance_km+' km</span>';
    html+='</div>';
    
    if(isCancelled){html+='<div style="text-align:center;padding:20px;"><i class="fas fa-times-circle" style="font-size:48px;color:#EF4444;margin-bottom:10px;display:block;"></i><div style="font-weight:700;color:#DC2626;">Order Cancelled</div></div>';}
    
    html+='<div class="steps-container">';
    for(var i=0;i<trackingSteps.length;i++){
        var step=trackingSteps[i];
        var cls=i<csi?'completed':i===csi?(isCancelled?'cancelled-step':'current'):'pending';
        html+='<div class="step '+cls+'">'+(i<trackingSteps.length-1?'<div class="step-line"></div>':'')+'<div class="step-icon"><i class="fas '+(cls==='completed'?'fa-check':cls==='cancelled-step'?'fa-times':step.icon)+'"></i></div><div class="step-content"><div class="step-title">'+step.title+'</div><div class="step-desc">'+step.desc+'</div>'+(cls==='current'?'<div class="step-time" style="color:#0B5A31;font-weight:700;">⚡ In Progress...</div>':'')+(cls==='completed'?'<div class="step-time" style="color:#0B5A31;">✓ Complete</div>':'')+'</div></div>';
    }
    html+='</div></div>';
    
    var subtotal=parseFloat(order.subtotal)||0,df=parseFloat(order.delivery_fee)||0,total=parseFloat(order.total_amount)||(subtotal+df);
    
    html+='<div class="summary-card"><div class="summary-title"><i class="fas fa-receipt"></i> Order Summary</div>';
    html+='<div class="summary-row"><span>Total Items</span><span>'+items.length+'</span></div>';
    
    // Items with variant info
    for(var j=0;j<Math.min(items.length,3);j++){
        var it=items[j];
        var variantLabel='';
        if(it.variant_weight)variantLabel=fmtWeight(it.variant_weight,it.variant_unit);
        else if(it.variant_key&&it.variant_key.indexOf('_')>-1){
            var parts=it.variant_key.split('_');
            if(parts.length>=3&&parts[1]!=='0')variantLabel=fmtWeight(parseFloat(parts[1]),parts[2]);
        }
        html+='<div class="item-mini">📦 '+(it.quantity||1)+'× '+esc(it.product_name||it.name||'Item')+(variantLabel?' <span class="variant-tag">'+variantLabel+'</span>':'')+'</div>';
    }
    if(items.length>3)html+='<div class="item-mini" style="color:#9CA3AF;">... +'+(items.length-3)+' more items</div>';
    
    html+='<div class="summary-row"><span>Subtotal</span><span>₹'+subtotal.toLocaleString('en-IN')+'</span></div>';
    html+='<div class="summary-row"><span>Delivery</span><span class="'+(df===0?'free-tag':'')+'">'+(df===0?'🎉 FREE':'₹'+df.toLocaleString('en-IN'))+'</span></div>';
    html+='<div class="summary-row total"><span>Total</span><span>₹'+total.toLocaleString('en-IN')+'</span></div>';
    if(order.customer_address)html+='<div class="address-row"><i class="fas fa-map-marker-alt"></i><span>'+esc(order.customer_address)+', '+esc(order.customer_city||'')+' - '+esc(order.customer_pincode||'')+'</span></div>';
    html+='</div>';
    
    html+='<div class="action-buttons"><button class="action-btn btn-outline" onclick="window.location.href=\'order-details.html?id='+order.id+'\'"><i class="fas fa-info-circle"></i> Details</button>';
    if(!isCancelled)html+='<button class="action-btn btn-whatsapp" onclick="window.open(\'https://wa.me/918600252238?text=Order%20'+encodeURIComponent(order.id)+'\',\'_blank\')"><i class="fab fa-whatsapp"></i> Help</button>';
    html+='</div>';
    
    html+='<div class="reset-link"><button onclick="resetSearch()"><i class="fas fa-arrow-left"></i> Track Another Order</button></div>';
    
    var rc=getEl('trackingResult');if(rc)rc.innerHTML=html;
}

window.resetSearch=function(){
    var ss=getEl('searchSection'),rc=getEl('trackingResult'),inp=getEl('orderIdInput');
    if(ss)ss.style.display='block';if(rc)rc.innerHTML='';
    if(inp){inp.value='';setTimeout(function(){inp.focus();},200);}
    window.scrollTo({top:0,behavior:'smooth'});
};

async function init(){
    var inp=getEl('orderIdInput');
    if(inp)inp.addEventListener('keydown',function(e){if(e.key==='Enter')trackOrder();});
    try{
        var p=new URLSearchParams(window.location.search),aid=p.get('id')||p.get('order_id');
        if(aid){var s=aid.replace(/[^a-zA-Z0-9\-_]/g,'').substring(0,50);if(s&&inp){inp.value=s;setTimeout(function(){trackOrder();},300);}}
    }catch(e){}
    showApp();
}
document.addEventListener('DOMContentLoaded',init);
})();
</script>
</body>
</html>
