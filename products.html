        .empty-state .btn-orange { background: var(--brand-orange); color: white; border: none; padding: 9px 22px; border-radius: var(--radius-full); font-weight: 600; font-size: 12px; cursor: pointer; font-family: 'Inter', sans-serif; margin-top: 8px; display: inline-flex; align-items: center; gap: 5px; }

        .skeleton-card { background: white; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--neutral-border); }
        .skeleton-img { width: 100%; aspect-ratio: 1/1; background: linear-gradient(90deg,#f0f4f2 25%,#e4ebe7 50%,#f0f4f2 75%); background-size: 200% 100%; animation: skel 1.3s infinite; }
        .skeleton-text { height: 10px; border-radius: 4px; margin: 7px; background: linear-gradient(90deg,#f0f4f2 25%,#e4ebe7 50%,#f0f4f2 75%); background-size: 200% 100%; animation: skel 1.3s infinite; }

        @media (max-width: 380px) { .products-grid { gap: 7px; padding: 7px; } .product-info { padding: 7px; } .product-price { font-size: 13px; } }
    </style>

    try { var p=new URLSearchParams(window.location.search); searchQuery=p.get('search')||''; categoryId=p.get('category_id')||''; categoryName=p.get('category_name')||''; } catch(e) {}
    
    window.fastNavigate=function(url){startProgress();setTimeout(function(){window.location.href=url;},60);};
    function goBack(){try{if(document.referrer&&document.referrer.indexOf(window.location.host)!==-1){window.history.back();return;}}catch(e){}window.location.href='index.html';}
    function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'});}
    
    function getCart(){return safeJSONParse(localStorage.getItem('zatpat_cart'),[]);}
    function saveCart(c){try{localStorage.setItem('zatpat_cart',JSON.stringify(c));}catch(e){}}
    function updateCartBadge(){var c=getCart(),count=c.reduce(function(s,i){return s+(i.quantity||1);},0);safeSetText('cartBadge',count);safeSetText('cartCount',count);return count;}
    
    // ============ ✅ UPDATED: FULL PRODUCT DATA WISHLIST ============
    function toggleWishlist(pid, productData) {
        var wishlist = safeJSONParse(localStorage.getItem('zatpat_wishlist'), []);
        var idx = wishlist.findIndex(function(item) {
            return (typeof item === 'object' && item.id === pid) || item === pid;
        });
        
        if(idx !== -1) {
            wishlist.splice(idx, 1);
            showToast('विशलिस्ट से हटाया');
        } else {
            wishlist.push({
                id: pid,
                name: (productData && productData.name) || 'प्रोडक्ट',
                price: (productData && productData.offerPrice) || (productData && productData.price) || 0,
                originalPrice: (productData && productData.originalPrice) || (productData && productData.price) || 0,
                image: (productData && productData.image) || '',
                unit: (productData && productData.unit) || 'piece',
                rating: (productData && productData.rating) || 0,
                discountPercent: (productData && productData.discountPercent) || 0,
                added_at: new Date().toISOString()
            });
            showToast('❤️ विशलिस्ट में जोड़ा!');
        }
        
        try { localStorage.setItem('zatpat_wishlist', JSON.stringify(wishlist)); } catch(e) {}
        
        var btn = document.querySelector('.wishlist-btn[data-product-id="'+pid+'"]');
        var isNowLiked = idx === -1;
        if(btn) {
            if(isNowLiked) { btn.classList.add('liked'); btn.querySelector('i').className='fas fa-heart'; }
            else { btn.classList.remove('liked'); btn.querySelector('i').className='far fa-heart'; }
        }
    }
    
    window.addToCart=function(id,name,price,image,unit){
        if(!id)return;
        try{var cart=getCart(),ex=cart.find(function(i){return i.id===id;});
        if(ex)ex.quantity+=1;else cart.push({id:id,name:name,price:price,image:image,quantity:1,unit:unit||'piece'});
        saveCart(cart);updateCartBadge();showToast('🛒 '+(name||'आइटम')+' जोड़ा');
        if(navigator.vibrate)navigator.vibrate(8);updateProductUI(id,(ex?ex.quantity:0)+1);}
        catch(e){showToast('विफल',true);}
    };
    
    function updateCartItemQuantity(id,delta){
        var cart=getCart(),item=cart.find(function(i){return i.id===id;});
        if(item){var nq=(item.quantity||1)+delta;
        if(nq<=0){cart=cart.filter(function(i){return i.id!==id;});saveCart(cart);updateProductUI(id,0);}
        else{item.quantity=nq;saveCart(cart);updateProductUI(id,nq);}updateCartBadge();}
    }
    
    function updateProductUI(pid,qty){
        document.querySelectorAll('.qty-count[data-product-id="'+pid+'"]').forEach(function(el){el.textContent=qty;});
        document.querySelectorAll('.qty-controls[data-product-id="'+pid+'"]').forEach(function(el){el.style.display=qty>0?'flex':'none';});
        document.querySelectorAll('.add-btn[data-product-id="'+pid+'"]').forEach(function(el){el.style.display=qty>0?'none':'flex';});
    }
    
    async function loadActiveOffers(){try{var r=await safeFetch(function(){return sb.from('offers').select('*').eq('is_active',true);});allOffers=r.data||[];}catch(e){allOffers=[];}}
    
    function getBestOffer(product){
        var now=new Date();
        return (allOffers.filter(function(o){
            if(o.valid_from&&new Date(o.valid_from)>now)return false;if(o.valid_till&&new Date(o.valid_till)<now)return false;
            if(o.apply_to==='global')return true;if(o.apply_to==='category'&&o.target_id===product.category_id)return true;
            if(o.apply_to==='product'&&o.target_id===product.id)return true;if(o.apply_to==='shop'&&o.target_id===product.shop_id)return true;
            return false;
        }).sort(function(a,b){var aV=a.discount_type==='percentage'?a.discount_value:(a.discount_value/product.price)*100;var bV=b.discount_type==='percentage'?b.discount_value:(b.discount_value/product.price)*100;return bV-aV;})[0]||null);
    }
    
    function getOfferPrice(product){
        if(product.offer_price&&product.offer_price>0&&product.offer_price<product.price)return{price:product.offer_price,discountPercent:Math.round((1-product.offer_price/product.price)*100)};
        var o=getBestOffer(product);
        if(o){var d=o.discount_type==='percentage'?(product.price*o.discount_value)/100:o.discount_value;if(o.max_discount>0)d=Math.min(d,o.max_discount);var cp=Math.max(Math.round(product.price-d),0);if(cp<product.price)return{price:cp,discountPercent:Math.round((1-cp/product.price)*100)};}
        return{price:product.price,discountPercent:0};
    }
    
    window.toggleSortDropdown=function(){var d=safeGetElement('sortDropdown');if(d)d.classList.toggle('active');};
    window.setSort=function(s){currentSort=s;var d=safeGetElement('sortDropdown');if(d)d.classList.remove('active');document.querySelectorAll('.sort-option').forEach(function(o){o.classList.remove('active');});var a=document.querySelector('.sort-option[onclick*="'+s+'"]');if(a)a.classList.add('active');resetAndLoad();};
    
    function getLocation(){var c=null;try{c=localStorage.getItem('user_city');}catch(e){}if(c){userCity=c;return c;}userCity=null;return null;}
    
    async function getNearbyShopIds(){if(!userCity)return[];try{var r=await safeFetch(function(){return sb.from('shops').select('id').eq('city',userCity).eq('status','approved');});return(r.data||[]).map(function(s){return s.id;});}catch(e){return[];}}
    
    function resetAndLoad(){products=[];currentPage=0;hasMore=true;var c=safeGetElement('productsContainer');if(c)c.innerHTML='<div class="products-grid"><div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div><div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div></div>';loadProducts();}
    
    async function loadProducts(){
        if(isLoading||!hasMore)return;isLoading=true;startProgress();
        try{
            var localShopIds=userCity?await getNearbyShopIds():[];
            var query=sb.from('products').select('*',{count:'exact'}).eq('is_active',true);
            if(localShopIds.length>0&&!searchQuery&&!categoryId)query=query.in('shop_id',localShopIds);
            if(searchQuery)query=query.ilike('name','%'+searchQuery+'%');
            else if(categoryId)query=query.eq('category_id',categoryId);
            if(currentSort==='price_low')query=query.order('price',{ascending:true});
            else if(currentSort==='price_high')query=query.order('price',{ascending:false});
            else if(currentSort==='rating')query=query.order('rating',{ascending:false,nullsFirst:false});
            else query=query.order('created_at',{ascending:false});
            var from=currentPage*PAGE_SIZE,to=from+PAGE_SIZE-1;query=query.range(from,to);
            var result=await safeFetch(function(){return query;}),data=result.data,count=result.count;
            if(data&&data.length>0){
                if(currentSort==='discount')data.sort(function(a,b){var aD=(a.price-getOfferPrice(a).price)/a.price,bD=(b.price-getOfferPrice(b).price)/b.price;return bD-aD;});
                products=products.concat(data);currentPage++;hasMore=products.length<(count||0);
            }else{hasMore=false;}
            renderProducts();completeProgress();
        }catch(e){if(products.length===0){var c=safeGetElement('productsContainer');if(c)c.innerHTML='<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>लोड विफल</h3><p>कनेक्शन जांचें</p><button class="btn-primary" onclick="resetAndLoad()">पुनः प्रयास करें</button></div>';}showToast('लोड विफल',true);completeProgress();}finally{isLoading=false;}
    }
    
    function renderProducts(){
        var container=safeGetElement('productsContainer');if(!container)return;
        if(products.length===0){container.innerHTML='<div class="empty-state"><i class="fas fa-box-open"></i><h3>कोई प्रोडक्ट्स नहीं</h3><p>'+(searchQuery?'"'+escapeHTML(searchQuery)+'" के लिए कोई परिणाम नहीं':'कोई अन्य श्रेणी आज़माएं')+'</p>'+(searchQuery||categoryId?'<button class="btn-primary" onclick="resetAndLoad()">फ़िल्टर हटाएं</button>':'')+'<br><button class="btn-orange" onclick="fastNavigate(\'invite-earn.html\')"><i class="fas fa-gift"></i> दोस्तों को इन्वाइट करें</button></div>';return;}
        var cart=getCart(),wishlist=safeJSONParse(localStorage.getItem('zatpat_wishlist'),[]),city=userCity||'';
        if(city&&!searchQuery){var lt=safeGetElement('locationTag'),ln=safeGetElement('locationName');if(lt&&ln){lt.style.display='inline-flex';ln.textContent=city;}}
        var html='<div class="products-grid">';
        for(var i=0;i<products.length;i++){var p=products[i],imgUrl=getFullUrl(p.images?.[0]||p.image_url||''),od=getOfferPrice(p),op=od.price,dp=od.discountPercent,hd=dp>0,ut=p.unit==='kg'?'/kg':p.unit==='gram'?'/100g':p.unit==='liter'?'/ली':p.unit==='dozen'?'/दर्जन':'/पीस',st=p.stock||0,io=st<=0,rt=p.rating||0,ci=cart.find(function(x){return x.id===p.id;}),cq=ci?ci.quantity||1:0;
        var iw=wishlist.some(function(item){return (typeof item==='object'&&item.id===p.id)||item===p.id;});
        var pn=escapeHTML(p.name||'प्रोडक्ट');
        html+='<div class="product-card" onclick="fastNavigate(\'product-detail.html?id='+p.id+'\')">';
        html+='<div class="product-img">';
        if(hd)html+='<div class="discount-tag">'+dp+'% छूट</div>';
        html+='<button class="wishlist-btn'+(iw?' liked':'')+'" data-product-id="'+p.id+'" onclick="event.stopPropagation();toggleWishlist(\''+p.id+'\',{name:\''+pn.replace(/'/g,"\\'")+'\',offerPrice:'+op+',originalPrice:'+p.price+',image:\''+imgUrl+'\',unit:\''+(p.unit||'piece')+'\',rating:'+(p.rating||0)+',discountPercent:'+dp+'})"><i class="'+(iw?'fas':'far')+' fa-heart"></i></button>';
        html+='<div class="stock-badge">'+(io?'स्टॉक खत्म':st+' बाकी')+'</div>';
        if(io)html+='<div class="out-of-stock-overlay"><span>स्टॉक खत्म</span></div>';
        if(imgUrl)html+='<img src="'+imgUrl+'" loading="lazy" alt="'+pn+'" onerror="this.style.display=\'none\';this.nextElementSibling.classList.add(\'show\');">';
        html+='<i class="fas fa-box-open fallback-icon'+(imgUrl?'':' show')+'"></i></div>';
        html+='<div class="product-info"><div class="product-name">'+pn+'</div><div class="product-unit">'+ut+'</div>';
        html+='<div class="product-rating"><div class="stars">'+(rt>0?'<i class="fas fa-star"></i>'.repeat(Math.floor(rt))+(rt%1>=0.5?'<i class="fas fa-star-half-stroke"></i>':'')+'<i class="far fa-star empty"></i>'.repeat(5-Math.floor(rt)-(rt%1>=0.5?1:0)):'<i class="far fa-star empty"></i><i class="far fa-star empty"></i><i class="far fa-star empty"></i><i class="far fa-star empty"></i><i class="far fa-star empty"></i>')+'</div><span class="count">'+(rt>0?rt.toFixed(1):'नया')+'</span></div>';
        html+='<div class="product-price-row"><div class="price-info"><span class="product-price">₹'+op+'</span>';
        if(hd)html+='<span class="original-price">₹'+p.price+'</span>';
        html+='</div>';
        if(!io){html+='<div class="qty-controls" data-product-id="'+p.id+'" style="display:'+(cq>0?'flex':'none')+'"><button class="qty-btn" onclick="event.stopPropagation();updateCartItemQuantity(\''+p.id+'\',-1)">−</button><span class="qty-count" data-product-id="'+p.id+'">'+cq+'</span><button class="qty-btn" onclick="event.stopPropagation();updateCartItemQuantity(\''+p.id+'\',1)">+</button></div>';
        html+='<button class="add-btn" data-product-id="'+p.id+'" onclick="event.stopPropagation();addToCart(\''+p.id+'\',\''+pn.replace(/'/g,"\\'")+'\','+op+',\''+imgUrl+'\',\''+(p.unit||'piece')+'\')" style="display:'+(cq>0?'none':'flex')+'"><i class="fas fa-plus"></i></button>';}
        else{html+='<div class="add-btn disabled"><i class="fas fa-ban"></i></div>';}
        html+='</div></div></div>';}
        html+='</div>';
        if(hasMore)html+='<div class="load-more"><button class="load-more-btn" onclick="loadProducts()"><i class="fas fa-chevron-down"></i> और लोड करें</button></div>';
        container.innerHTML=html;
    }
    
    window.addEventListener('scroll',function(){var sb=safeGetElement('scrollTopBtn');if(sb)sb.classList.toggle('show',window.scrollY>400);if(window.innerHeight+window.scrollY>=document.body.offsetHeight-600&&hasMore&&!isLoading){setTimeout(function(){loadProducts();},300);}},{passive:true});
    
    async function init(){
        getLocation();updateCartBadge();await loadActiveOffers();
        var ct=safeGetElement('categoryTitle');
        if(categoryId&&categoryName){try{ct.innerHTML='<i class="fas fa-tag"></i> '+escapeHTML(decodeURIComponent(categoryName));}catch(e){}}
        if(userCity&&!searchQuery){var lt=safeGetElement('locationTag'),ln=safeGetElement('locationName');if(lt&&ln){lt.style.display='inline-flex';ln.textContent=userCity;}}
        var si=safeGetElement('searchInput');if(searchQuery&&si)si.value=searchQuery;
        var st;if(si){si.addEventListener('input',function(e){clearTimeout(st);st=setTimeout(function(){searchQuery=e.target.value.trim();resetAndLoad();},500);});si.addEventListener('keypress',function(e){if(e.key==='Enter'){clearTimeout(st);searchQuery=e.target.value.trim();resetAndLoad();si.blur();}});}
        document.addEventListener('click',function(e){if(!e.target.closest('.sort-btn')&&!e.target.closest('.sort-dropdown')){var d=safeGetElement('sortDropdown');if(d)d.classList.remove('active');}});
        loadProducts();showApp();initComplete=true;
    }
    
    document.addEventListener('DOMContentLoaded',init);
    document.addEventListener('visibilitychange',function(){if(!document.hidden&&initComplete)updateCartBadge();});
    
    window.handleBackPress=function(){goBack();return true;};
    window.goBack=goBack;window.updateCartItemQuantity=updateCartItemQuantity;
    window.toggleWishlist=toggleWishlist;window.scrollToTop=scrollToTop;window.resetAndLoad=resetAndLoad;
})();
</script>
</body>
</html>
