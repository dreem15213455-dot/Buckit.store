    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --brand-green: #0B5A31; --brand-green-dark: #083D21; --brand-orange: #F59E0B; --neutral-white: #FFFFFF; --neutral-bg: #F9FAFB; --neutral-border: #E5E7EB; --neutral-gray: #6B7280; --neutral-dark: #1A1A1A; --danger: #EF4444; --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); --shadow-sm: 0 1px 4px rgba(0,0,0,0.06); --shadow-md: 0 4px 16px rgba(0,0,0,0.08); --radius-sm: 10px; --radius-md: 14px; --radius-lg: 18px; --radius-full: 9999px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter',-apple-system,sans-serif; background: var(--neutral-bg); color: var(--neutral-dark); padding-bottom: 75px; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; min-height: 100vh; overflow-x: hidden; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }

        .back-btn { width: 38px; height: 38px; background: rgba(255,255,255,0.10); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 14px; text-decoration: none; flex-shrink: 0; transition: background 0.15s ease; }
        .back-btn:active { background: rgba(255,255,255,0.20); }
        .brand-name { font-family: 'Poppins',sans-serif; font-size: 17px; font-weight: 700; display: flex; align-items: baseline; flex-shrink: 0; }
        .brand-zy { color: #A3E635; } .brand-mart { color: #FDE047; }
        .search-box { flex: 1; background: white; border-radius: var(--radius-full); display: flex; align-items: center; padding: 0 14px; gap: 8px; min-width: 0; }
        .search-box i { color: #9CA3AF; font-size: 12px; flex-shrink: 0; }

        .search-box input::placeholder { color: #B0B8B4; }
        .cart-btn { width: 38px; height: 38px; background: rgba(255,255,255,0.10); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 14px; position: relative; text-decoration: none; flex-shrink: 0; transition: background 0.15s ease; }
        .cart-btn:active { background: rgba(255,255,255,0.20); }
        .cart-badge { position: absolute; top: -5px; right: -5px; background: var(--brand-orange); color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 9px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--brand-green); font-weight: 700; }

        .location-bar { display: flex; align-items: center; gap: 6px; padding: 7px 14px; background: #EDF7F1; border-bottom: 1px solid #C8E6C9; font-size: 11px; color: #0B5A31; cursor: pointer; }
        .nearby-badge { background: #0B5A31; color: white; font-size: 9px; padding: 2px 8px; border-radius: 9999px; font-weight: 600; margin-left: 6px; }
        
        /* 🔥 FILTER BAR */
        .filter-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: white; border-bottom: 1px solid var(--neutral-border); position: sticky; top: 56px; z-index: 99; }
        .filter-bar.with-location { top: 88px; }
        .category-title { font-family: 'Poppins',sans-serif; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .category-title i { color: var(--brand-green); font-size: 16px; }
        .result-count { font-size: 11px; color: var(--neutral-gray); margin-left: 4px; font-weight: 400; }
        .clear-search { color: var(--danger); font-size: 11px; font-weight: 600; cursor: pointer; border: none; background: #FEF2F2; padding: 5px 12px; border-radius: var(--radius-full); font-family: 'Inter',sans-serif; transition: all 0.15s ease; }
        .clear-search:active { background: #FEE2E2; transform: scale(0.96); }
        
        /* 🔥 PRODUCTS GRID */
        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 12px; }
        .product-card { background: white; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-xs); border: 1px solid var(--neutral-border); cursor: pointer; animation: fadeInUp 0.3s ease; position: relative; transition: all 0.15s ease; }
        .product-card:active { transform: scale(0.97); }
        .product-card.nearby { border: 2px solid #0B5A31; box-shadow: 0 0 0 3px rgba(11,90,49,0.08); }
        .product-img { width: 100%; aspect-ratio: 1/1; position: relative; overflow: hidden; background: #F3F4F6; display: flex; align-items: center; justify-content: center; }
        .product-img img { width: 100%; height: 100%; object-fit: contain; padding: 10px; transition: transform 0.3s ease; }
        .product-card:active .product-img img { transform: scale(1.05); }
        .discount-tag { position: absolute; top: 8px; left: 8px; background: var(--brand-orange); color: white; font-size: 9px; font-weight: 700; padding: 3px 8px; border-radius: var(--radius-full); z-index: 1; box-shadow: var(--shadow-sm); }
        .weight-tag { position: absolute; bottom: 8px; right: 8px; background: rgba(11,90,49,0.85); color: white; font-size: 8px; font-weight: 600; padding: 3px 8px; border-radius: var(--radius-full); z-index: 1; }
        .nearby-tag { position: absolute; top: 8px; right: 8px; background: #0B5A31; color: white; font-size: 8px; font-weight: 700; padding: 3px 8px; border-radius: var(--radius-full); z-index: 1; }
        .out-of-stock-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 2; }
        .out-of-stock-overlay span { background: rgba(0,0,0,0.7); color: white; padding: 6px 14px; border-radius: var(--radius-full); font-size: 11px; font-weight: 700; letter-spacing: 0.3px; }
        .product-info { padding: 10px; }
        .product-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
        .product-shop { font-size: 9px; color: var(--brand-green); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .product-price-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 6px; }
        .price-group { display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; }
        .product-price { font-size: 15px; font-weight: 700; color: var(--brand-green-dark); }
        .original-price { font-size: 10px; color: var(--neutral-gray); text-decoration: line-through; }
        .add-btn { background: #EDF7F1; color: var(--brand-green); border: 1.5px solid var(--brand-green); border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; flex-shrink: 0; transition: all 0.15s ease; }
        .add-btn:active { background: var(--brand-green); color: white; transform: scale(0.92); }
        .add-btn.disabled { background: #F3F4F6; color: #D1D5DB; border-color: var(--neutral-border); cursor: not-allowed; pointer-events: none; }
        .qty-controls { display: flex; align-items: center; gap: 6px; }
        .qty-btn { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--neutral-border); background: white; cursor: pointer; font-size: 14px; font-weight: 700; color: var(--brand-green); display: flex; align-items: center; justify-content: center; transition: all 0.15s ease; }
        .qty-btn:active { background: #EDF7F1; border-color: var(--brand-green); transform: scale(0.92); }
        .qty-count { font-size: 13px; font-weight: 700; min-width: 20px; text-align: center; color: var(--neutral-dark); }
        
        /* 🔥 LOAD MORE */
        .load-more { text-align: center; padding: 16px; }
        .load-more-btn { background: white; color: var(--brand-green); border: 2px solid var(--brand-green); padding: 10px 28px; border-radius: var(--radius-full); font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Inter',sans-serif; transition: all 0.15s ease; }
        .load-more-btn:active { background: var(--brand-green); color: white; transform: scale(0.96); }
        .load-more-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* 🔥 EMPTY STATE */
        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-state i { font-size: 56px; color: #D1D5DB; display: block; margin-bottom: 16px; }
        .empty-state h3 { font-family: 'Poppins',sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 6px; }
        .empty-state p { font-size: 12px; color: var(--neutral-gray); margin-bottom: 16px; }
        .btn-primary { background: var(--brand-green); color: white; border: none; padding: 10px 24px; border-radius: var(--radius-full); font-weight: 600; font-size: 13px; cursor: pointer; font-family: 'Inter',sans-serif; display: inline-block; text-decoration: none; transition: all 0.15s ease; }
        .btn-primary:active { background: var(--brand-green-dark); transform: scale(0.96); }
        
        /* 🔥 BOTTOM NAV */
        .bottom-nav { background: white; position: fixed; bottom: 0; left: 0; width: 100%; display: flex; justify-content: space-around; align-items: center; padding: 4px 8px 8px; box-shadow: 0 -4px 20px rgba(0,0,0,0.04); z-index: 100; border-top: 1px solid var(--neutral-border); }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 9px; font-weight: 500; color: var(--neutral-gray); cursor: pointer; padding: 4px 10px; border-radius: var(--radius-full); border: none; background: transparent; font-family: 'Inter',sans-serif; text-decoration: none; position: relative; transition: all 0.15s ease; }
        .nav-item:active { background: #EDF7F1; }
        .nav-item.active { color: var(--brand-green); font-weight: 700; }
        .nav-item i { font-size: 19px; margin-bottom: 2px; }
        .nav-item .cart-count { position: absolute; top: 0; right: 2px; background: var(--brand-orange); color: white; border-radius: 50%; width: 16px; height: 16px; font-size: 8px; display: flex; align-items: center; justify-content: center; border: 2px solid white; font-weight: 700; }
        
        /* 🔥 TOAST */
        .toast-notification { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--neutral-dark); color: white; padding: 10px 20px; border-radius: var(--radius-full); font-size: 12px; z-index: 200; opacity: 0; visibility: hidden; white-space: nowrap; box-shadow: var(--shadow-md); transition: all 0.3s ease; }
        .toast-notification.show { opacity: 1; visibility: visible; }
        .loading-spinner { display: flex; justify-content: center; padding: 30px; }
        .loading-spinner div { width: 28px; height: 28px; border: 3px solid rgba(11,90,49,0.15); border-top-color: var(--brand-green); border-radius: 50%; animation: spin 0.7s linear infinite; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<body>

<div id="mainApp">
    <!-- 🔥 TOP BAR -->
    <div class="top-bar">
        <div class="top-row">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>

        <span id="locationText">📍 Set Location</span>
    </div>
    
    <!-- 🔥 FILTER BAR -->
    <div class="filter-bar" id="filterBar">
        <div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;">

        </div>

    <!-- 🔥 PRODUCTS GRID -->
    <div class="products-grid" id="productsGrid">
        <div class="loading-spinner"><div></div></div>
    </div>
    
    <!-- 🔥 LOAD MORE -->
    <div class="load-more" id="loadMoreContainer" style="display:none;">
        <button class="load-more-btn" onclick="loadMore()">📦 Load More Products</button>

        <a class="nav-item" href="cart.html"><i class="fas fa-shopping-cart"></i><span>Cart</span><span class="cart-count" id="cartCount">0</span></a>
        <a class="nav-item" href="orders.html"><i class="fas fa-receipt"></i><span>Orders</span></a>
        <a class="nav-item" href="profile.html"><i class="fas fa-user"></i><span>Profile</span></a>
    </nav>
</div>

<!-- 🔥 TOAST -->
<div class="toast-notification" id="toastMsg"><span id="toastText"></span></div>

<script>
(function() {
    'use strict';
    window.addEventListener('error', function(e) { console.error('[Products]', e.message); });
    
    var sb = supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co', 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1');
    var SUPABASE_URL = 'https://zwajyovemwdqtkecipeb.supabase.co';
    var products = [], page = 0, hasMore = true, loading = false;
    var userLat = null, userLng = null, nearbyShopIds = [];
    var shopDistances = {};
    var locationChecked = false, initialLoadDone = false;
    var currentSearch = '', currentCategoryId = '';
    
    function getEl(id) { return document.getElementById(id); }
    function getFullUrl(u) { if(!u)return''; if(u.indexOf('http')===0)return u; return SUPABASE_URL+'/storage/v1/object/public/'+u; }
    function esc(s) { if(!s)return''; var d=document.createElement('div');d.textContent=s;return d.innerHTML; }
    function showToast(m) { var t=getEl('toastMsg'),s=getEl('toastText'); if(!t||!s)return; s.textContent=m; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},2000); }
    function getCart() { try { return JSON.parse(localStorage.getItem('zymart_cart')||'[]'); } catch(e) { return []; } }
    function saveCart(c) { try { localStorage.setItem('zymart_cart', JSON.stringify(c)); } catch(e) {} }
    function updateCartBadge() { var c=getCart(),n=c.reduce(function(a,i){return a+(i.quantity||1);},0); var b=getEl('cartBadge'),cc=getEl('cartCount'); if(b)b.textContent=n; if(cc)cc.textContent=n; return n; }
    
    function fmtWeight(w, u) { if(!w)return''; if(u==='gram'||u==='g')return w>=1000?(w/1000).toFixed(1).replace(/\.0$/,'')+' kg':w+' g'; if(u==='kg')return w+' kg'; if(u==='liter')return w+' L'; if(u==='ml')return w+' ml'; return w+' '+(u||'pcs'); }
    
    function parseVariants(product) {
        if (product.variants && Array.isArray(product.variants) && product.variants.length > 0) return product.variants;
        return [{ weight: product.weight, unit: product.weight_unit || product.unit, price: product.price, offer_price: product.offer_price, stock: product.stock || 0 }];
    }
    
    function getBestVariant(variants) {
        if (!variants || !variants.length) return null;
        var inStock = variants.filter(function(v) { return (v.stock || 0) > 0; });
        if (inStock.length) return inStock.reduce(function(a, b) { return (a.offer_price || a.price) < (b.offer_price || b.price) ? a : b; });
        return variants[0];
    }
    
    function calculateDistance(lat1, lng1, lat2, lng2) {
        var R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
        var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
        return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    }
    
    function getUrlParams() {
        var params=new URLSearchParams(window.location.search);
        currentSearch=params.get('search')||''; currentCategoryId=params.get('category_id')||'';
        var si=getEl('searchInput'); if(si&&currentSearch)si.value=currentSearch;
        var cb=getEl('clearSearch'); if(cb&&currentSearch)cb.style.display='inline-block';
        var ct=getEl('categoryTitle');
        if(ct&&currentCategoryId){var cn=params.get('category_name')||'Category';ct.innerHTML='<i class="fas fa-box"></i> '+decodeURIComponent(cn);}
    }
    
    window.clearSearch=function(){currentSearch='';var si=getEl('searchInput');if(si)si.value='';var cb=getEl('clearSearch');if(cb)cb.style.display='none';products=[];page=0;hasMore=true;getEl('productsGrid').innerHTML='<div class="loading-spinner"><div></div></div>';loadProducts();};
    
    async function initPage(){if(initialLoadDone)return;initialLoadDone=true;getUrlParams();var lat=parseFloat(localStorage.getItem('user_lat')||'0')||null,lng=parseFloat(localStorage.getItem('user_lng')||'0')||null,ts=parseInt(localStorage.getItem('location_timestamp')||'0');if(lat&&lng&&(Date.now()-ts)<1800000){userLat=lat;userLng=lng;var ls=localStorage.getItem('location_short')||'',lb=getEl('locationBar'),lt=getEl('locationText'),fb=getEl('filterBar');if(lb&&lt&&ls){lb.style.display='flex';lt.textContent='📍 '+ls;if(fb)fb.classList.add('with-location');}await findNearbyShops();}locationChecked=true;loadProducts();}
    
    async function findNearbyShops(){if(!userLat||!userLng)return;try{var r=await sb.from('shops').select('id,latitude,longitude,delivery_radius_km').eq('status','approved').eq('is_open',true);if(!r.data||!r.data.length)return;nearbyShopIds=[];shopDistances={};for(var i=0;i<r.data.length;i++){var sh=r.data[i];if(!sh.latitude||!sh.longitude)continue;var d=calculateDistance(userLat,userLng,sh.latitude,sh.longitude);if(d<=(sh.delivery_radius_km||10)){nearbyShopIds.push(sh.id);shopDistances[sh.id]=Math.round(d*10)/10;}}var lt=getEl('locationText');if(nearbyShopIds.length>0&&lt){var ls=localStorage.getItem('location_short')||'';lt.innerHTML='📍 '+ls+' <span class="nearby-badge">'+nearbyShopIds.length+' shops nearby</span>';}}catch(e){}}
    
    async function loadProducts(){if(loading||!hasMore)return;loading=true;var lmBtn=document.querySelector('.load-more-btn');if(lmBtn){lmBtn.disabled=true;lmBtn.textContent='Loading...';}getEl('loadMoreContainer').style.display='none';if(products.length===0&&page===0)getEl('productsGrid').innerHTML='<div class="loading-spinner"><div></div></div>';try{var q=sb.from('products').select('*',{count:'exact'}).eq('is_active',true).is('parent_id',null).eq('is_on_hold',false);if(currentSearch)q=q.or('name.ilike.%'+currentSearch+'%,shop_name.ilike.%'+currentSearch+'%');if(currentCategoryId)q=q.eq('category_id',currentCategoryId);if(locationChecked&&nearbyShopIds.length>0)q=q.in('shop_id',nearbyShopIds);q=q.order('created_at',{ascending:false}).range(page*12,(page+1)*12-1);var r=await q;if(r.data&&r.data.length){products=products.concat(r.data);page++;hasMore=products.length<(r.count||0);renderProducts();var rc=getEl('resultCount');if(rc)rc.textContent='('+products.length+' of '+(r.count||products.length)+')';}else{hasMore=false;if(!products.length)getEl('productsGrid').innerHTML='<div class="empty-state"><i class="fas fa-box-open"></i><h3>No Products Found</h3><p>Try a different search or category</p><a href="index.html" class="btn-primary"><i class="fas fa-home"></i> Go to Home</a></div>';}getEl('loadMoreContainer').style.display=hasMore?'block':'none';}catch(e){if(!products.length)getEl('productsGrid').innerHTML='<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>Failed to Load</h3><button class="btn-primary" onclick="location.reload()">🔄 Retry</button></div>';}loading=false;if(lmBtn){lmBtn.disabled=false;lmBtn.textContent='📦 Load More Products';}}
    
    window.addToCart = function(id, name, price, image, variantKey, stock) {
        stock = stock || 0;
        if (stock <= 0) return;
        var cart = getCart();
        var cartKey = variantKey || id;
        var ex = cart.find(function(x) { return x.cartKey === cartKey; });
        var currentQty = ex ? (ex.quantity || 1) : 0;
        if (currentQty >= stock) { showToast('⚠️ Only ' + stock + ' available!'); return; }
        if (ex) ex.quantity += 1;
        else cart.push({ id: id, cartKey: cartKey, name: name, price: price, image: image, quantity: 1, stock: stock, variantKey: variantKey });
        saveCart(cart); updateCartBadge();
        updateProductUI(cartKey, (ex ? ex.quantity : 1));
        showToast('🛒 ' + (name || 'Item') + ' added!');
    };
    
    window.updateQty = function(cartKey, delta, stock) {
        stock = stock || 0;
        var cart = getCart();
        var it = cart.find(function(x) { return x.cartKey === cartKey; });
        if (!it) return;
        var nq = (it.quantity || 1) + delta;
        if (nq <= 0) { cart = cart.filter(function(x) { return x.cartKey !== cartKey; }); saveCart(cart); updateProductUI(cartKey, 0); updateCartBadge(); return; }
        if (nq > stock) { showToast('⚠️ Only ' + stock + ' available!'); return; }
        it.quantity = nq; saveCart(cart); updateProductUI(cartKey, nq); updateCartBadge();
    };
    
    function updateProductUI(cartKey, qty) {
        var ctls = document.querySelectorAll('.qty-controls[data-key="' + cartKey + '"]');
        var adds = document.querySelectorAll('.add-btn[data-key="' + cartKey + '"]');
        var cnts = document.querySelectorAll('.qty-count[data-key="' + cartKey + '"]');
        for (var i = 0; i < ctls.length; i++) ctls[i].style.display = qty > 0 ? 'flex' : 'none';
        for (var j = 0; j < adds.length; j++) adds[j].style.display = qty > 0 ? 'none' : 'flex';
        for (var k = 0; k < cnts.length; k++) cnts[k].textContent = qty;
    }
    
    function renderProducts() {
        var cart = getCart(), h = '';
        for (var i = 0; i < products.length; i++) {
            var p = products[i],
                variants = parseVariants(p),
                bestVariant = getBestVariant(variants),
                img = getFullUrl((p.images && p.images[0]) || p.image_url || ''),
                sn = p.shops ? p.shops.name : (p.shop_name || ''),
                isNearby = nearbyShopIds.indexOf(p.shop_id) !== -1,
                shopDist = shopDistances[p.shop_id] || null;
            
            if (!bestVariant) continue;
            
            var op = bestVariant.offer_price && bestVariant.offer_price < bestVariant.price ? bestVariant.offer_price : bestVariant.price;
            var dp = bestVariant.offer_price && bestVariant.offer_price < bestVariant.price ? Math.round((1 - bestVariant.offer_price / bestVariant.price) * 100) : 0;
            var totalStock = variants.reduce(function(s, v) { return s + (v.stock || 0); }, 0);
            var isOut = totalStock <= 0;
            var pn = esc(p.name || '');
            var defVariant = variants[0];
            var cartKey = p.id + '_' + (defVariant.weight || '0') + '_' + (defVariant.unit || '');
            var ci = cart.find(function(x) { return x.cartKey === cartKey; });
            var cq = ci ? (ci.quantity || 1) : 0;
            var vStock = defVariant.stock || 0;
            var bestWeight = fmtWeight(bestVariant.weight, bestVariant.unit);
            
            h += '<div class="product-card' + (isNearby ? ' nearby' : '') + '" onclick="window.location.href=\'product-detail.html?id=' + p.id + '\'">';
            h += '<div class="product-img">';
            if (dp > 0) h += '<div class="discount-tag">' + dp + '% OFF</div>';
            if (isNearby) h += '<div class="nearby-tag">📍 Nearby</div>';
            if (bestWeight) h += '<div class="weight-tag">' + bestWeight + '</div>';
            if (isOut) h += '<div class="out-of-stock-overlay"><span>Out of Stock</span></div>';
            if (img) h += '<img src="' + img + '" loading="lazy" alt="' + pn + '" onerror="this.style.display=\'none\'">';
            else h += '<i class="fas fa-box" style="font-size:40px;color:#D1D5DB;"></i>';
            h += '</div>';
            
            h += '<div class="product-info">';
            h += '<div class="product-name" title="' + pn + '">' + pn + '</div>';
            if (sn) h += '<div class="product-shop">🏪 ' + esc(sn) + (shopDist ? ' · 📍 ' + shopDist + 'km' : '') + '</div>';
            
            h += '<div class="product-price-row">';
            h += '<div class="price-group"><span class="product-price">₹' + Number(op).toLocaleString('en-IN') + '</span>';
            if (dp > 0) h += '<span class="original-price">₹' + Number(bestVariant.price).toLocaleString('en-IN') + '</span>';
            h += '</div>';
            
            if (isOut) {
                h += '<button class="add-btn disabled"><i class="fas fa-ban"></i></button>';
            } else {
                h += '<div class="qty-controls" data-key="' + cartKey + '" style="display:' + (cq > 0 ? 'flex' : 'none') + '">';
                h += '<button class="qty-btn" onclick="event.stopPropagation();updateQty(\'' + cartKey + '\',-1,' + vStock + ')">−</button>';
                h += '<span class="qty-count" data-key="' + cartKey + '">' + cq + '</span>';
                h += '<button class="qty-btn" onclick="event.stopPropagation();updateQty(\'' + cartKey + '\',1,' + vStock + ')">+</button>';
                h += '</div>';
                h += '<button class="add-btn" data-key="' + cartKey + '" onclick="event.stopPropagation();addToCart(\'' + p.id + '\',\'' + pn.replace(/'/g, "\\'") + '\',' + op + ',\'' + img + '\',\'' + cartKey + '\',' + vStock + ')" style="display:' + (cq > 0 ? 'none' : 'flex') + '"><i class="fas fa-plus"></i></button>';
            }
            h += '</div></div></div>';
        }
        getEl('productsGrid').innerHTML = h;
    }
    
    window.loadMore = function() { loadProducts(); };
    
    document.addEventListener('DOMContentLoaded', function() {
        updateCartBadge();
        initPage();
        var si = getEl('searchInput');
        if (si) {
            var t;
            si.addEventListener('input', function() {
                clearTimeout(t);
                t = setTimeout(function() {
                    var v = si.value.trim();
                    currentSearch = v;
                    var clearBtn = getEl('clearSearch'); if (clearBtn) clearBtn.style.display = v ? 'inline-block' : 'none';
                    products = []; page = 0; hasMore = true;
                    getEl('productsGrid').innerHTML = '<div class="loading-spinner"><div></div></div>';
                    loadProducts();
                }, 400);
            });
        }
    });
})();
</script>
</body>
</html>
