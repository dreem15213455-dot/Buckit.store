<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    
    <style>
        :root { --brand-green: #0B5A31; --brand-green-dark: #083D21; --brand-orange: #F59E0B; --neutral-white: #FFFFFF; --neutral-bg: #F9FAFB; --neutral-border: #E5E7EB; --neutral-gray: #6B7280; --neutral-dark: #1A1A1A; --danger: #EF4444; --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); --shadow-sm: 0 1px 4px rgba(0,0,0,0.06); --radius-sm: 10px; --radius-md: 14px; --radius-full: 9999px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter',-apple-system,sans-serif; background: var(--neutral-bg); color: var(--neutral-dark); padding-bottom: 75px; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; min-height: 100vh; overflow-x: hidden; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .top-bar { background: var(--brand-green); position: sticky; top: 0; z-index: 100; padding: 8px 12px; box-shadow: 0 2px 16px rgba(11,90,49,0.3); }
        .top-row { display: flex; align-items: center; gap: 10px; }
        .back-btn { width: 36px; height: 36px; background: rgba(255,255,255,0.10); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 14px; text-decoration: none; flex-shrink: 0; }
        .brand-name { font-family: 'Poppins',sans-serif; font-size: 17px; font-weight: 700; flex-shrink: 0; }
        .brand-zy { color: #A3E635; } .brand-mart { color: #FDE047; }
        .search-box { flex: 1; background: white; border-radius: var(--radius-full); display: flex; align-items: center; padding: 0 12px; gap: 8px; min-width: 0; }
        .search-box i { color: #9CA3AF; font-size: 11px; }
        .search-box input { flex: 1; border: none; outline: none; padding: 9px 0; font-size: 12px; font-family: 'Inter',sans-serif; background: transparent; min-width: 0; }
        .cart-btn { width: 36px; height: 36px; background: rgba(255,255,255,0.10); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 13px; position: relative; text-decoration: none; flex-shrink: 0; }
        .cart-badge { position: absolute; top: -5px; right: -5px; background: var(--brand-orange); color: white; border-radius: 50%; width: 17px; height: 17px; font-size: 8px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--brand-green); font-weight: 700; }
        
        .holiday-strip{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 12px;background:#FEE2E2;color:#DC2626;font-size:10px;font-weight:700;border-bottom:1px solid #FECACA}
        
        .filter-sort-bar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: white; border-bottom: 1px solid var(--neutral-border); overflow-x: auto; scrollbar-width: none; position: sticky; top: 52px; z-index: 99; }
        .filter-sort-bar::-webkit-scrollbar { display: none; }
        .filter-chip { padding: 6px 12px; border-radius: var(--radius-full); font-size: 10px; font-weight: 600; cursor: pointer; border: 1.5px solid var(--neutral-border); background: white; color: var(--neutral-gray); white-space: nowrap; font-family: 'Inter',sans-serif; transition: all 0.15s ease; }
        .filter-chip.active { background: var(--brand-green); color: white; border-color: var(--brand-green); }
        
        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
        .product-card { background: white; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--neutral-border); cursor: pointer; animation: fadeInUp 0.3s ease; position: relative; display: flex; flex-direction: column; }
        .product-card:active { transform: scale(0.97); }
        .product-img { width: 100%; aspect-ratio: 1/1; position: relative; overflow: hidden; background: #F9FAFB; display: flex; align-items: center; justify-content: center; }
        .product-img img { width: 80%; height: 80%; object-fit: contain; }
        .discount-tag { position: absolute; top: 8px; left: 8px; background: var(--brand-orange); color: white; font-size: 9px; font-weight: 700; padding: 3px 7px; border-radius: var(--radius-full); z-index: 1; }
        .weight-tag { position: absolute; bottom: 8px; right: 8px; background: rgba(11,90,49,0.85); color: white; font-size: 9px; font-weight: 600; padding: 2px 7px; border-radius: var(--radius-full); z-index: 1; }
        .out-of-stock-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 2; }
        .out-of-stock-overlay span { background: rgba(0,0,0,0.7); color: white; padding: 5px 12px; border-radius: var(--radius-full); font-size: 10px; font-weight: 700; }
        
        .product-info { padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
        .product-brand { font-size: 9px; color: var(--brand-green); font-weight: 600; text-transform: uppercase; }
        .product-name { font-size: 12px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 32px; }
        .product-shop { font-size: 9px; color: var(--neutral-gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .product-price-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: auto; padding-top: 4px; }
        .price-group { display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; }
        .product-price { font-size: 15px; font-weight: 700; color: var(--brand-green-dark); }
        .original-price { font-size: 10px; color: #9CA3AF; text-decoration: line-through; }
        
        .add-btn { background: var(--brand-green); color: white; border: none; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; flex-shrink: 0; }
        .add-btn.holiday-disabled { background:#D1D5DB; cursor:not-allowed; }
        .qty-controls { display: flex; align-items: center; gap: 4px; }
        .qty-btn { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--neutral-border); background: white; cursor: pointer; font-size: 12px; font-weight: 700; color: var(--brand-green); display: flex; align-items: center; justify-content: center; }
        .qty-count { font-size: 12px; font-weight: 700; min-width: 18px; text-align: center; }
        
        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-state i { font-size: 56px; color: #D1D5DB; display: block; margin-bottom: 16px; }
        .empty-state h3 { font-family: 'Poppins',sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 6px; }
        .btn-primary { background: var(--brand-green); color: white; border: none; padding: 10px 24px; border-radius: var(--radius-full); font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: none; display: inline-block; }
        
        .bottom-nav { background: white; position: fixed; bottom: 0; left: 0; width: 100%; display: flex; justify-content: space-around; align-items: center; padding: 4px 8px 8px; box-shadow: 0 -4px 20px rgba(0,0,0,0.04); z-index: 100; border-top: 1px solid var(--neutral-border); }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 9px; font-weight: 500; color: var(--neutral-gray); cursor: pointer; padding: 4px 10px; border: none; background: transparent; text-decoration: none; }
        .nav-item.active { color: var(--brand-green); font-weight: 700; }
        .nav-item i { font-size: 19px; margin-bottom: 2px; }
        
        .toast-notification { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--neutral-dark); color: white; padding: 10px 20px; border-radius: var(--radius-full); font-size: 12px; z-index: 200; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .toast-notification.show { opacity: 1; visibility: visible; }
        .toast-notification.error { background: #EF4444; }
        .toast-notification.success { background: #059669; }
        .loading-spinner { display: flex; justify-content: center; padding: 30px; }
        .loading-spinner div { width: 28px; height: 28px; border: 3px solid rgba(11,90,49,0.15); border-top-color: var(--brand-green); border-radius: 50%; animation: spin 0.7s linear infinite; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="mainApp">
    <div class="top-bar">
        <div class="top-row">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <div class="brand-name"><span class="brand-zy">Zy</span><span class="brand-mart">Mart</span></div>
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search products..." autocomplete="off">
            </div>
            <a href="cart.html" class="cart-btn"><i class="fas fa-shopping-cart"></i><span class="cart-badge" id="cartBadge">0</span></a>
        </div>
    </div>
    
    <div class="holiday-strip" id="holidayStrip" style="display:none;"><i class="fas fa-calendar-times"></i> <span id="holidayStripText">🏖️ Closed Today</span></div>
    
    <div class="filter-sort-bar" id="filterSortBar">
        <button class="filter-chip active" onclick="setSort('popular',this)">🔥 Popular</button>
        <button class="filter-chip" onclick="setSort('price_low',this)">₹ Low to High</button>
        <button class="filter-chip" onclick="setSort('price_high',this)">₹ High to Low</button>
        <button class="filter-chip" onclick="setSort('discount',this)">% Discount</button>
    </div>
    
    <div class="products-grid" id="productsGrid">
        <div class="loading-spinner" style="grid-column:1/-1;"><div></div></div>
    </div>
    
    <nav class="bottom-nav">
        <a class="nav-item" href="index.html"><i class="fas fa-home"></i><span>Home</span></a>
        <a class="nav-item active" href="products.html"><i class="fas fa-search"></i><span>Browse</span></a>
        <a class="nav-item" href="cart.html"><i class="fas fa-shopping-cart"></i><span>Cart</span></a>
        <a class="nav-item" href="orders.html"><i class="fas fa-receipt"></i><span>Orders</span></a>
        <a class="nav-item" href="profile.html"><i class="fas fa-user"></i><span>Profile</span></a>
    </nav>
</div>

<div class="toast-notification" id="toastMsg"><span id="toastText"></span></div>

<script>
(function() {
    'use strict';
    
    var sb = supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co','sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1');
    var SUPABASE_URL = 'https://zwajyovemwdqtkecipeb.supabase.co';
    var TALUKAS = [{ name: 'Sillod', lat: 20.3030, lng: 75.6529 },{ name: 'Bhokardan', lat: 20.2691, lng: 75.7693 },{ name: 'Jamner', lat: 20.8076, lng: 75.7796 }];
    var SERVICE_RADIUS_KM = 10;
    
    var products = [], nearbyShopIds = [], shopNamesMap = {};
    var currentCategoryId = '', currentSearch = '', currentSort = 'popular';
    var userLat = null, userLng = null, searchTimer = null;
    var isHolidayToday = false;
    var holidayReason = '';
    
    function $(id){return document.getElementById(id);}
    function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
    function getFullUrl(u){if(!u)return'';if(u.indexOf('http')===0||u.indexOf('data:')===0)return u;return SUPABASE_URL+'/storage/v1/object/public/'+u;}
    function showToast(m,type){var t=$('toastMsg');if(!t)return;t.textContent=m;t.className='toast-notification';if(type==='error')t.classList.add('error');else if(type==='success')t.classList.add('success');t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show','error','success');},2500);}
    function getCart(){try{return JSON.parse(localStorage.getItem('zymart_cart')||'[]');}catch(e){return[];}}
    function saveCart(c){try{localStorage.setItem('zymart_cart',JSON.stringify(c));}catch(e){}}
    function updateCartBadge(){var c=getCart(),n=c.reduce(function(s,i){return s+(i.quantity||1);},0);var b=$('cartBadge');if(b)b.textContent=n;}
    function fmtWeight(w,u){if(!w||w===0)return'';var nw=parseFloat(w);if(isNaN(nw))return String(w);if(u==='gram'||u==='g')return nw>=1000?(nw/1000).toFixed(1).replace(/\.0$/,'')+' kg':nw+' g';if(u==='kg')return nw+' kg';if(u==='liter'||u==='l')return nw+' L';if(u==='ml')return nw+' ml';if(u==='piece'||u==='pcs')return nw+' pcs';return nw+' '+(u||'');}
    function parseVariants(p){if(p.variants&&Array.isArray(p.variants)&&p.variants.length>0)return p.variants;return[{weight:p.weight||1,unit:p.weight_unit||p.unit||'kg',price:p.price||0,offer_price:p.offer_price||null,stock:p.stock||0}];}
    function getBestVariant(variants){if(!variants||!variants.length)return null;var inStock=variants.filter(function(v){return(v.stock||0)>0;});if(inStock.length)return inStock.reduce(function(a,b){return(a.offer_price||a.price)<(b.offer_price||b.price)?a:b;});return variants[0];}
    function calcDist(l1,n1,l2,n2){var R=6371,dLa=(l2-l1)*Math.PI/180,dLn=(n2-n1)*Math.PI/180,a=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(l1*Math.PI/180)*Math.cos(l2*Math.PI/180)*Math.sin(dLn/2)*Math.sin(dLn/2);return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
    
    // 🔥 HOLIDAY CHECK
    async function checkHoliday(){
        try{
            var r = await sb.from('delivery_settings').select('is_holiday,holiday_reason,holiday_date').eq('is_active',true).single();
            if(r.data && r.data.is_holiday){
                var today = new Date().toISOString().split('T')[0];
                if(r.data.holiday_date === today){
                    isHolidayToday = true;
                    holidayReason = r.data.holiday_reason || 'Closed Today';
                    var strip = $('holidayStrip');
                    if(strip){ strip.style.display = 'flex'; $('holidayStripText').textContent = '🏖️ ' + holidayReason; }
                }
            }
        }catch(e){}
    }
    
    window.showHolidayMsg = function(){
        showToast('🏖️ ' + holidayReason, 'error');
    };
    
    window.setSort = function(sort, btn) {
        currentSort = sort;
        var chips = document.querySelectorAll('.filter-chip');
        chips.forEach(function(c){ c.classList.remove('active'); });
        if(btn) btn.classList.add('active');
        renderProducts();
    };
    
    async function loadProducts(){
        var grid = $('productsGrid');
        grid.innerHTML = '<div class="loading-spinner" style="grid-column:1/-1;"><div></div></div>';
        try{
            var q = sb.from('products').select('*').eq('is_active',true).eq('is_on_hold',false).eq('delete_requested',false).is('parent_id',null);
            if(currentCategoryId) q = q.eq('category_id', currentCategoryId);
            if(currentSearch) q = q.ilike('name', '%'+currentSearch+'%');
            if(nearbyShopIds.length) q = q.in('shop_id', nearbyShopIds);
            q = q.limit(50);
            var r = await q;
            products = r.data || [];
            var shopIds = [];
            products.forEach(function(p){ if(p.shop_id && shopIds.indexOf(p.shop_id)===-1) shopIds.push(p.shop_id); });
            if(shopIds.length){
                var sr = await sb.from('shops').select('id,shop_name').in('id',shopIds);
                (sr.data||[]).forEach(function(s){ shopNamesMap[s.id] = s.shop_name || ''; });
            }
            renderProducts();
        }catch(e){
            grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-exclamation-circle"></i><h3>Failed to Load</h3><button class="btn-primary" onclick="loadProducts()">🔄 Retry</button></div>';
        }
    }
    
    function renderProducts(){
        var grid = $('productsGrid');
        var cart = getCart();
        if(!products.length){
            grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-box-open"></i><h3>No Products Found</h3><a href="index.html" class="btn-primary">🏠 Go Home</a></div>';
            return;
        }
        var sorted = products.slice();
        if(currentSort === 'price_low'){ sorted.sort(function(a,b){ return (getBestVariant(parseVariants(a))?.price||a.price) - (getBestVariant(parseVariants(b))?.price||b.price); }); }
        else if(currentSort === 'price_high'){ sorted.sort(function(a,b){ return (getBestVariant(parseVariants(b))?.price||b.price) - (getBestVariant(parseVariants(a))?.price||a.price); }); }
        else if(currentSort === 'discount'){ sorted.sort(function(a,b){ var va=getBestVariant(parseVariants(a)),vb=getBestVariant(parseVariants(b)); var da=va&&va.offer_price&&va.price?(1-va.offer_price/va.price):0; var db=vb&&vb.offer_price&&vb.price?(1-vb.offer_price/vb.price):0; return db-da; }); }
        
        var html = '';
        sorted.forEach(function(p){
            var variants = parseVariants(p);
            var bestV = getBestVariant(variants);
            if(!bestV) return;
            var img = getFullUrl((p.images&&p.images[0])||p.image_url||'');
            var price = bestV.offer_price || bestV.price;
            var original = bestV.price;
            var dis = bestV.offer_price && bestV.price && bestV.offer_price < bestV.price ? Math.round((1-bestV.offer_price/bestV.price)*100) : 0;
            var wt = fmtWeight(bestV.weight, bestV.weight_unit || bestV.unit || p.weight_unit || p.unit);
            var sn = shopNamesMap[p.shop_id] || '';
            var isOut = (bestV.stock||0) <= 0;
            var nm = (p.name||'').replace(/'/g,"\\'");
            var cartKey = p.id;
            var ci = cart.find(function(x){return x.id===p.id;});
            var cq = ci ? (ci.quantity||1) : 0;
            
            html += '<div class="product-card" onclick="openProduct(\''+p.id+'\')">';
            html += '<div class="product-img">';
            if(dis>0) html += '<span class="discount-tag">'+dis+'% OFF</span>';
            if(wt) html += '<span class="weight-tag">'+wt+'</span>';
            if(isOut) html += '<div class="out-of-stock-overlay"><span>Out of Stock</span></div>';
            html += img ? '<img src="'+img+'" loading="lazy">' : '<i class="fas fa-box" style="font-size:36px;color:#D1D5DB;"></i>';
            html += '</div>';
            html += '<div class="product-info">';
            if(p.brand_name) html += '<div class="product-brand">'+esc(p.brand_name)+'</div>';
            html += '<div class="product-name">'+esc(p.name)+'</div>';
            if(sn) html += '<div class="product-shop">🏪 '+esc(sn)+'</div>';
            html += '<div class="product-price-row">';
            html += '<div class="price-group">';
            html += '<span class="product-price">₹'+Number(price).toLocaleString('en-IN')+'</span>';
            if(dis>0) html += '<span class="original-price">₹'+Number(original).toLocaleString('en-IN')+'</span>';
            html += '</div>';
            if(!isOut){
                if(isHolidayToday){
                    html += '<button class="add-btn holiday-disabled" onclick="event.stopPropagation();showHolidayMsg()">🔒</button>';
                } else if(cq > 0){
                    html += '<div class="qty-controls">';
                    html += '<button class="qty-btn" onclick="event.stopPropagation();updateQty(\''+p.id+'\',-1)">−</button>';
                    html += '<span class="qty-count">'+cq+'</span>';
                    html += '<button class="qty-btn" onclick="event.stopPropagation();updateQty(\''+p.id+'\',1)">+</button>';
                    html += '</div>';
                } else {
                    html += '<button class="add-btn" onclick="event.stopPropagation();addToCart(\''+p.id+'\',\''+nm+'\','+price+',\''+img+'\')">+</button>';
                }
            }
            html += '</div></div></div>';
        });
        grid.innerHTML = html;
    }
    
    window.addToCart = function(id,name,price,image){
        if(isHolidayToday){ showHolidayMsg(); return; }
        var cart = getCart();
        var ex = cart.find(function(x){return x.id===id;});
        if(ex) ex.quantity = (ex.quantity||1)+1;
        else cart.push({id:id,name:name,price:price,image:image,quantity:1});
        saveCart(cart);
        updateCartBadge();
        renderProducts();
        showToast('🛒 Added!','success');
    };
    window.updateQty = function(id,delta){
        var cart = getCart();
        var it = cart.find(function(x){return x.id===id;});
        if(!it) return;
        var nq = (it.quantity||1) + delta;
        if(nq <= 0){ cart = cart.filter(function(x){return x.id!==id;}); }
        else { it.quantity = nq; }
        saveCart(cart);
        updateCartBadge();
        renderProducts();
    };
    function openProduct(id){ if(id) window.location.href = 'product-detail.html?id='+id; }
    
    async function init(){
        await checkHoliday();
        var params = new URLSearchParams(window.location.search);
        currentCategoryId = params.get('category_id') || '';
        currentSearch = params.get('search') === '1' ? '' : (params.get('search') || '');
        var si = $('searchInput');
        if(si && currentSearch) si.value = currentSearch;
        updateCartBadge();
        var lat = parseFloat(localStorage.getItem('user_lat')||'0')||null;
        var lng = parseFloat(localStorage.getItem('user_lng')||'0')||null;
        if(lat && lng){
            userLat = lat; userLng = lng;
            try{
                var sr = await sb.from('shops').select('id,shop_name,latitude,longitude,delivery_radius_km').eq('status','approved').eq('is_open',true);
                var shops = sr.data || [];
                nearbyShopIds = [];
                shops.forEach(function(s){
                    shopNamesMap[s.id] = s.shop_name || '';
                    if(s.latitude && s.longitude){
                        var d = calcDist(userLat,userLng,s.latitude,s.longitude);
                        if(d <= (s.delivery_radius_km || SERVICE_RADIUS_KM)) nearbyShopIds.push(s.id);
                    }
                });
            }catch(e){}
        }
        loadProducts();
        si.addEventListener('input', function(){
            clearTimeout(searchTimer);
            searchTimer = setTimeout(function(){
                currentSearch = si.value.trim();
                loadProducts();
            }, 350);
        });
    }
    
    document.addEventListener('DOMContentLoaded', init);
    window.openProduct = openProduct;
    window.addToCart = addToCart;
    window.updateQty = updateQty;
    window.showHolidayMsg = showHolidayMsg;
})();
</script>
</body>
</html>
