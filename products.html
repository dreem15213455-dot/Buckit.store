            else { cart.push({ id: product.id, variantKey: product.variantKey || product.id, cartKey: product.variantKey || product.id, name: product.name, price: product.price, image: product.image, shop_id: product.shop_id || '', shop_name: product.shop_name || '', variantWeight: product.variantWeight || null, variantUnit: product.variantUnit || null, variantColor: product.variantColor || null, variantSize: product.variantSize || null, quantity: 1 }); }
            this.saveCart(cart);
            return cart;
        },
        updateQuantity: function(productId, delta, variantKey) {
            var cart = this.getCart();
            var item;
            if (variantKey) item = cart.find(function(i) { return i.id === productId && (i.variantKey === variantKey || i.cartKey === variantKey); });
            else item = cart.find(function(i) { return i.id === productId; });
            if (item) {
                item.quantity = (item.quantity || 1) + delta;
                if (item.quantity <= 0) {
                    if (variantKey) cart = cart.filter(function(i) { return !(i.id === productId && (i.variantKey === variantKey || i.cartKey === variantKey)); });
                    else cart = cart.filter(function(i) { return i.id !== productId; });
                }
            }
            this.saveCart(cart);
            return cart;
        },
        getTotalItems: function() { var cart = this.getCart(); return cart.reduce(function(sum, item) { return sum + (item.quantity || 1); }, 0); },
        updateBadge: function() {
            var totalItems = this.getTotalItems();
            var badge = $('cartBadge');
            if (badge) { badge.textContent = totalItems; if (totalItems > 0) { badge.classList.add('show'); badge.classList.add('bounce'); setTimeout(function() { badge.classList.remove('bounce'); }, 300); } else { badge.classList.remove('show'); } }
        }
    };
    
    function fmtWeight(w, u) {
        if(!w || w === 0) return '';
        var nw = parseFloat(w); if(isNaN(nw)) return String(w);
        var unitLower = u ? u.toLowerCase() : '';
        if(unitLower === 'gram' || unitLower === 'g' || unitLower === 'gm') { return nw >= 1000 ? (nw/1000).toFixed(1).replace(/\.0$/,'') + ' kg' : nw + ' g'; }
        if(unitLower === 'kg' || unitLower === 'kilogram') return nw + ' kg';
        if(unitLower === 'liter' || unitLower === 'l') return nw + ' L';
        if(unitLower === 'ml') return nw + ' ml';
        if(unitLower === 'piece' || unitLower === 'pcs') return nw + ' pcs';
        return nw + ' ' + (u || '');
    }
    
    function parseVariants(p) {
        if(p.variants && Array.isArray(p.variants) && p.variants.length > 0) return p.variants;
        return [{ weight: p.weight || 1, unit: p.weight_unit || p.unit || 'kg', price: p.price || 0, offer_price: p.offer_price || null, stock: p.stock || 0 }];
    }
    
    function getBestVariant(variants) {
        if(!variants || !variants.length) return null;
        var inStock = variants.filter(function(v) { return (v.stock || 0) > 0; });
        if(inStock.length) { return inStock.reduce(function(a, b) { return (a.offer_price || a.price) < (b.offer_price || b.price) ? a : b; }); }
        return variants[0];
    }
    
    function parseColors(p) {
        try { return typeof p.colors === 'string' ? JSON.parse(p.colors) : (p.colors || []); } catch(e) { return []; }
    }
    
    function getClothingPriceRange(colors) {
        if (!colors || !colors.length) return null;
        var prices = [];
        colors.forEach(function(c) { (c.sizes || []).forEach(function(s) { var pr = s.offer_price || s.price; if (pr > 0) prices.push(parseFloat(pr)); }); });
        if (!prices.length) return null;
        return { min: Math.min.apply(null, prices), max: Math.max.apply(null, prices) };
    }
    
    function getClothingOriginalRange(colors) {
        if (!colors || !colors.length) return null;
        var prices = [];
        colors.forEach(function(c) { (c.sizes || []).forEach(function(s) { if (s.price > 0) prices.push(parseFloat(s.price)); }); });
        if (!prices.length) return null;
        return { min: Math.min.apply(null, prices), max: Math.max.apply(null, prices) };
    }
    
    function getClothingTotalStock(colors) {
        var t = 0;
        (colors || []).forEach(function(c) { (c.sizes || []).forEach(function(s) { t += (s.stock || 0); }); });
        return t;
    }
    
    function getClothingDiscount(colors) {
        var max = 0;
        (colors || []).forEach(function(c) {
            (c.sizes || []).forEach(function(s) {
                if (s.offer_price && s.price && s.offer_price < s.price) {
                    var d = Math.round((1 - s.offer_price / s.price) * 100);
                    if (d > max) max = d;
                }
            });
        });
        return max;
    }
    
    function getSizeRangeText(colors) {
        var allSizes = {}; var orderedSizes = [];
        var sizeOrder = ['XS','S','M','L','XL','XXL','3XL','1-2Y','2-3Y','3-4Y','4-5Y','5-6Y','6-7Y','7-8Y','8-9Y','10-11Y','12-13Y','5','6','7','8','9','10','11','12','Free Size'];
        (colors || []).forEach(function(c) { (c.sizes || []).forEach(function(s) { if (s.size && !allSizes[s.size]) { allSizes[s.size] = true; orderedSizes.push(s.size); } }); });
        orderedSizes.sort(function(a, b) { var ia = sizeOrder.indexOf(a), ib = sizeOrder.indexOf(b); if (ia === -1) ia = 999; if (ib === -1) ib = 999; return ia - ib; });
        if (!orderedSizes.length) return '';
        if (orderedSizes.length === 1) return orderedSizes[0];
        return orderedSizes[0] + ' - ' + orderedSizes[orderedSizes.length - 1];
    }
    
    var COLOR_HEX_MAP = {
        'red': '#EF4444', 'blue': '#3B82F6', 'green': '#10B981', 'yellow': '#FBBF24',
        'black': '#1F2937', 'white': '#F9FAFB', 'orange': '#F97316', 'purple': '#8B5CF6',
        'pink': '#EC4899', 'brown': '#92400E', 'grey': '#9CA3AF', 'gray': '#9CA3AF',
        'navy': '#1E3A8A', 'maroon': '#7F1D1D', 'cream': '#FEF3C7', 'beige': '#F5F5DC',
        'gold': '#D4AF37', 'silver': '#C0C0C0', 'olive': '#808000', 'teal': '#14B8A6',
        'cyan': '#06B6D4', 'magenta': '#D946EF', 'violet': '#7C3AED', 'indigo': '#4338CA'
    };
    
    function getColorHex(colorName) {
        if (!colorName) return '#E5E7EB';
        var key = colorName.toLowerCase().trim();
        if (COLOR_HEX_MAP[key]) return COLOR_HEX_MAP[key];
        for (var k in COLOR_HEX_MAP) { if (key.indexOf(k) !== -1) return COLOR_HEX_MAP[k]; }
        return '#E5E7EB';
    }
    
    function getSizeTypeLabel(sizeType) {
        var map = { 'adult': '👔 Adult', 'kids': '👶 Kids', 'footwear': '👟 Footwear', 'free': '📏 Free' };
        return map[sizeType] || '';

    function calcDist(l1, n1, l2, n2) {
        var R = 6371; var dLa = (l2-l1)*Math.PI/180; var dLn = (n2-n1)*Math.PI/180;
        var a = Math.sin(dLa/2)*Math.sin(dLa/2) + Math.cos(l1*Math.PI/180)*Math.cos(l2*Math.PI/180)*Math.sin(dLn/2)*Math.sin(dLn/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    async function fetchRatingsForIds(ids) {
        if (!ids || !ids.length) return;
        var missing = ids.filter(function(id) { return productRatingsCache[id] === undefined; });
        if (!missing.length) return;
        if (missing.length > 100) missing = missing.slice(0, 100);
        try {
            var r = await sb.from('product_reviews')
                .select('product_id, rating')
                .in('product_id', missing)
                .eq('admin_hidden', false);
            for (var i = 0; i < missing.length; i++) {
                if (productRatingsCache[missing[i]] === undefined) productRatingsCache[missing[i]] = { avg: 0, count: 0 };
            }
            if (r && r.data && r.data.length > 0) {
                var temp = {};
                r.data.forEach(function(rv) {
                    if (!temp[rv.product_id]) temp[rv.product_id] = { sum: 0, count: 0 };
                    temp[rv.product_id].sum += parseInt(rv.rating) || 0;
                    temp[rv.product_id].count++;
                });
                Object.keys(temp).forEach(function(pid) {
                    productRatingsCache[pid] = { avg: temp[pid].sum / temp[pid].count, count: temp[pid].count };
                });
            }
        } catch(e) {
            for (var i = 0; i < missing.length; i++) {
                if (productRatingsCache[missing[i]] === undefined) productRatingsCache[missing[i]] = { avg: 0, count: 0 };
            }
        }
    }
    
    function getRatingHtml(productId) {
        var r = productRatingsCache[productId];
        if (!r || r.count === 0) return '';
        return '<div class="product-rating"><span class="star-icon">★</span><span class="avg-val">' + r.avg.toFixed(1) + '</span><span class="count-val">(' + r.count + ')</span></div>';
    }
    
    async function fetchProductsPage(page) {
        var from = page * CONFIG.PAGE_SIZE;
        var to = from + CONFIG.PAGE_SIZE - 1;
        
        var q = sb.from('products').select(PRODUCT_COLS)
            .eq('is_active', true).eq('is_on_hold', false).eq('delete_requested', false).is('parent_id', null);
        
        if(currentCategoryId) q = q.eq('category_id', currentCategoryId);
        if(currentSort === 'offers') q = q.eq('is_offer', true);
        if(nearbyShopIds.length) q = q.in('shop_id', nearbyShopIds);
        
        if(currentSearch) {
            var terms = currentSearch.trim().split(/\s+/);
            var filterStr = terms.map(function(t) { return 'name.ilike.%' + t + '%'; }).join(',');
            q = q.or(filterStr);
        }
        
        q = q.order('created_at', { ascending: false }).range(from, to);
        var r = await q;
        var data = r.data || [];
        
        if(page === 0 && data.length === 0 && nearbyShopIds.length > 0) {
            var q2 = sb.from('products').select(PRODUCT_COLS)
                .eq('is_active', true).eq('is_on_hold', false).eq('delete_requested', false).is('parent_id', null);
            if(currentCategoryId) q2 = q2.eq('category_id', currentCategoryId);
            if(currentSort === 'offers') q2 = q2.eq('is_offer', true);
            if(currentSearch) {
                var terms2 = currentSearch.trim().split(/\s+/);
                var filterStr2 = terms2.map(function(t) { return 'name.ilike.%' + t + '%'; }).join(',');
                q2 = q2.or(filterStr2);
            }
            q2 = q2.order('created_at', { ascending: false }).range(from, to);
            var r2 = await q2;
            data = r2.data || [];
        }
        
        return data;
    }
    
    async function loadShopNames() {
        var shopIds = [];
        products.forEach(function(p) { if(p.shop_id && shopIds.indexOf(p.shop_id) === -1) shopIds.push(p.shop_id); });
        var missing = shopIds.filter(function(id) { return !shopNamesMap[id]; });
        if(!missing.length) return;
        var cached = getCached('shop_names');
        if(cached) { shopNamesMap = Object.assign({}, cached, shopNamesMap); return; }
        try {
            var sr = await sb.from('shops').select('id, name').in('id', missing);
            (sr.data || []).forEach(function(s) { shopNamesMap[s.id] = s.name || ''; });
            setCached('shop_names', shopNamesMap);
        } catch(e) {}
    }
    
    async function loadProducts() {
        var grid = $('productsGrid');
        grid.innerHTML = '<div class="loading-spinner" style="grid-column:1/-1;"><div></div></div>';
        allProductsCurrentPage = 0;
        allProductsHasMore = true;
        allProductsIsLoading = true;
        products = [];
        productRatingsCache = {};
        var endEl = $('productsEnd'); if(endEl) endEl.style.display = 'none';
        
        try {
            var data = await fetchProductsPage(0);
            products = data;
            if(data.length < CONFIG.PAGE_SIZE) allProductsHasMore = false;
            allProductsCurrentPage = 1;
            await loadShopNames();
            var ids = data.map(function(p) { return p.id; });
            await fetchRatingsForIds(ids);
            updateSearchHeader();
            renderProducts();
            if(!allProductsHasMore) { if(endEl && products.length > 0) endEl.style.display = 'block'; }
        } catch(e) {
            console.error('Load products error:', e);
            grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-exclamation-circle"></i><h3>Failed to Load</h3><button class="btn-primary" onclick="loadProducts()">🔄 Retry</button></div>';
        }
        allProductsIsLoading = false;
    }
    
    // ═══ FIX 2: Sort order maintained after infinite scroll ═══
    async function loadMoreProducts() {
        if(allProductsIsLoading || !allProductsHasMore) return;
        allProductsIsLoading = true;
        var loader = $('productsLoader'); if(loader) loader.style.display = 'flex';
        try {
            var data = await fetchProductsPage(allProductsCurrentPage);
            if(data.length < CONFIG.PAGE_SIZE) allProductsHasMore = false;
            if(data.length > 0) {
                products = products.concat(data);
                await loadShopNames();
                var ids = data.map(function(p) { return p.id; });
                await fetchRatingsForIds(ids);
                // If user has active sort (not default), re-render all to maintain sort order
                if (currentSort === 'popular') {
                    appendProducts(data);
                } else {
                    renderProducts();
                }
            }
            allProductsCurrentPage++;
            if(!allProductsHasMore) { var endEl = $('productsEnd'); if(endEl) endEl.style.display = 'block'; }
        } catch(e) { console.error('Load more error:', e); }
        allProductsIsLoading = false;
        if(loader) loader.style.display = 'none';
    }
    
    function buildProductCardHtml(p, cart) {

    function getEffectivePrice(p) {
        if ((p.variant_type || 'weight') === 'color_size') {
            var colors = parseColors(p);
            var range = getClothingPriceRange(colors);
            return range ? range.min : 0;
        }
        var bestV = getBestVariant(parseVariants(p));
        return bestV ? (bestV.offer_price || bestV.price) : 0;
    }
    
    function getEffectiveDiscount(p) {
        if ((p.variant_type || 'weight') === 'color_size') return getClothingDiscount(parseColors(p));
        var bestV = getBestVariant(parseVariants(p));
        return bestV && bestV.offer_price && bestV.price ? (1 - bestV.offer_price / bestV.price) : 0;
    }
    
    function renderProducts() {

        if(!products.length) {
            var emptyMsg = currentSearch ? 'No products found for "' + currentSearch + '"' : (currentSort === 'offers' ? 'No offer products available' : 'No Products Found');
            grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-box-open"></i><h3>' + emptyMsg + '</h3><a href="index.html" class="btn-primary">🏠 Go Home</a></div>';
            return;
        }
        var sorted = products.slice();
        if(currentSort === 'price_low') sorted.sort(function(a, b) { return getEffectivePrice(a) - getEffectivePrice(b); });
        else if(currentSort === 'price_high') sorted.sort(function(a, b) { return getEffectivePrice(b) - getEffectivePrice(a); });
        else if(currentSort === 'discount') sorted.sort(function(a, b) { return getEffectiveDiscount(b) - getEffectiveDiscount(a); });
        
        var html = '';
        sorted.forEach(function(p) { html += buildProductCardHtml(p, cart); });
        grid.innerHTML = html;
    }
    
    function appendProducts(newOnes) {
        var grid = $('productsGrid');
        var cart = CartManager.getCart();
        var html = '';
        newOnes.forEach(function(p) { html += buildProductCardHtml(p, cart); });
        if(html) grid.insertAdjacentHTML('beforeend', html);
    }
    
    function updateProductCardQty(id, variantKey) {
        var cart = CartManager.getCart();
        var ci;
        if (variantKey) ci = cart.find(function(x) { return x.id === id && (x.variantKey === variantKey || x.cartKey === variantKey); });
        else ci = cart.find(function(x) { return x.id === id; });
        var cq = ci ? (ci.quantity || 1) : 0;
        
        var card;
        if (variantKey) card = document.querySelector('.product-card[data-pid="' + id + '"][data-vkey="' + variantKey + '"]');
        else card = document.querySelector('.product-card[data-pid="' + id + '"]');
        if (!card) return;
        
        var priceRow = card.querySelector('.product-price-row');
        if (!priceRow) return;
        
        var oldAdd = priceRow.querySelector('.add-btn');
        var oldQty = priceRow.querySelector('.qty-controls');
        if (oldAdd) oldAdd.remove();
        if (oldQty) oldQty.remove();
        
        var p = products.find(function(x) { return x.id === id; });
        if (!p) return;
        var variants = parseVariants(p);
        var bestV = getBestVariant(variants);
        if (!bestV) return;
        
        var price = bestV.offer_price || bestV.price;
        var img = getFullUrl((p.images && p.images[0]) || p.image_url || '', 500);
        var nm = (p.name || '').replace(/'/g, "\\'");
        var sn = shopNamesMap[p.shop_id] || '';
        var unit = bestV.weight_unit || bestV.unit || p.weight_unit || p.unit || '';
        var cardVarKey = variantKey || (id + '_' + (bestV.weight || '') + '_' + unit);
        
        if (isHolidayToday) {
            var btn = document.createElement('button');
            btn.className = 'add-btn holiday-disabled';
            btn.textContent = '🔒';
            btn.onclick = function(e) { e.stopPropagation(); showHolidayMsg(); };
            priceRow.appendChild(btn);
        } else if (cq > 0) {
            var div = document.createElement('div');
            div.className = 'qty-controls';
            div.innerHTML = '<button class="qty-btn" onclick="event.stopPropagation();updateQty(\'' + id + '\',-1,\'' + cardVarKey + '\')">−</button>' +
                            '<span class="qty-count">' + cq + '</span>' +
                            '<button class="qty-btn" onclick="event.stopPropagation();updateQty(\'' + id + '\',1,\'' + cardVarKey + '\')">+</button>';
            priceRow.appendChild(div);
        } else {
            var btn2 = document.createElement('button');
            btn2.className = 'add-btn';
            btn2.innerHTML = '+';
            btn2.onclick = function(e) { e.stopPropagation(); addToCart(id, nm, price, img, p.shop_id, sn, bestV.weight || '', unit); };
            priceRow.appendChild(btn2);
        }
    }
    
    window.addToCart = function(id, name, price, image, shopId, shopName, weight, unit) {
        if(isHolidayToday) { showHolidayMsg(); return; }
        var variantKey = id + '_' + weight + '_' + unit;
        CartManager.addToCart({ id: id, variantKey: variantKey, name: name, price: price, image: image, shop_id: shopId || '', shop_name: shopName || '', variantWeight: weight || null, variantUnit: unit || null });
        updateProductCardQty(id, variantKey);
        showToast('🛒 Added!', 'success');
    };
    
    window.updateQty = function(id, delta, variantKey) {
        CartManager.updateQuantity(id, delta, variantKey);
        updateProductCardQty(id, variantKey);
    };

    function expandSearchTerms(query) {
        var terms = query.toLowerCase().trim().split(/\s+/).map(sanitizeSearchTerm).filter(function(t) { return t.length >= 1; });
        var expanded = {};
        terms.forEach(function(t) {
            expanded[t] = true;
            if (SEARCH_SYNONYMS[t]) SEARCH_SYNONYMS[t].forEach(function(s) { expanded[s] = true; });
            Object.keys(SEARCH_SYNONYMS).forEach(function(k) {
                if (k.indexOf(t) === 0 || t.indexOf(k) === 0) {
                    if (k.length >= 2 && t.length >= 2) { expanded[k] = true; SEARCH_SYNONYMS[k].forEach(function(s) { expanded[s] = true; }); }
                }
            });
        });
        return Object.keys(expanded).map(sanitizeSearchTerm).filter(Boolean);
    }
    
    async function performLiveSearch(query) {
        var dd = $('searchDropdown'); if (!dd) return;
        var cleanQuery = sanitizeSearchTerm(query);
        if (!cleanQuery || cleanQuery.length < 1) { hideSearchDropdown(); return; }
        try {
            var terms = expandSearchTerms(cleanQuery);
            if (terms.length === 0) { hideSearchDropdown(); return; }
            var orFilter = terms.slice(0, 20).map(function(t) { return 'name.ilike.%' + t + '%,description.ilike.%' + t + '%'; }).join(',');
            var r = await sb.from('products').select('id, name, description, price, offer_price, image_url, images, variants, weight, unit, weight_unit, shop_id').eq('is_active', true).eq('is_on_hold', false).or(orFilter).limit(30);
            var results = r.data || [];
            var originalTerms = cleanQuery.toLowerCase().split(/\s+/).filter(Boolean);
            var fullQueryLower = cleanQuery.toLowerCase();
            
            results.forEach(function(p) {
                var nl = (p.name || '').toLowerCase();
                var dl = (p.description || '').toLowerCase();
                var sc = 0; var directMatch = false;
                if (nl.indexOf(fullQueryLower) !== -1) { sc += 50; directMatch = true; }
                originalTerms.forEach(function(t) {
                    if (nl.indexOf(t) !== -1) { sc += 30; directMatch = true; }
                    if (dl.indexOf(t) !== -1) sc += 10;
                });
                p._score = sc; p._directMatch = directMatch;
            });
            
            if (originalTerms.length > 1) {
                var allMatch = results.filter(function(p) {
                    var combined = ((p.name || '') + ' ' + (p.description || '')).toLowerCase();
                    return originalTerms.every(function(t) {
                        if (combined.indexOf(t) !== -1) return true;
                        if (SEARCH_SYNONYMS[t]) {
                            for (var i = 0; i < SEARCH_SYNONYMS[t].length; i++) {
                                if (combined.indexOf(SEARCH_SYNONYMS[t][i]) !== -1) return true;
                            }
                        }
                        return false;
                    });
                });
                if (allMatch.length > 0) results = allMatch;
            }
            
            results = results.filter(function(p) { return p._score > 0; });
            results.sort(function(a, b) { return b._score - a._score; });
            results = results.slice(0, 6);
            
            if (results.length > 0) {
                var html = '<div class="sd-header"><span>🔍 ' + results.length + ' result' + (results.length !== 1 ? 's' : '') + '</span><span class="count-tag">"' + esc(cleanQuery) + '"</span></div>';
                results.forEach(function(p) {
                    var bv = parseVariants(p)[0] || { price: p.price || 0, offer_price: p.offer_price };
                    var displayPrice = bv.offer_price && bv.offer_price < bv.price ? bv.offer_price : (bv.price || p.price || 0);
                    var img = getFullUrl((p.images && p.images[0]) || p.image_url || '', 100);
                    var matchBadge = p._directMatch ? '' : '<span class="sd-match">similar</span>';
                    var wt = fmtWeight(bv.weight, bv.unit);
                    html += '<div class="sd-item" onclick="openProduct(\'' + p.id + '\')">' +
                        '<div class="sd-img">' + (img ? '<img src="' + img + '" loading="lazy">' : '<i class="fas fa-box"></i>') + '</div>' +
                        '<div class="sd-info"><div class="sd-name">' + esc(p.name) + matchBadge + '</div>' +
                        '<div class="sd-meta">' + (wt ? '<span>' + wt + '</span>' : '') + '<span class="sd-price">₹' + Number(displayPrice).toLocaleString('en-IN') + '</span></div>' +
                        '</div></div>';
                });
                html += '<div class="sd-footer" onclick="applySearchFromDropdown(\'' + cleanQuery.replace(/'/g, "\\'") + '\')">View all results →</div>';
                dd.innerHTML = html;
                dd.classList.add('show');
            } else {
                dd.innerHTML = '<div class="sd-empty"><strong>No products found for "' + esc(cleanQuery) + '"</strong>Try: <span class="sg">aata</span>, <span class="sg">tel</span>, <span class="sg">shirt</span>, <span class="sg">black</span></div>';
                dd.classList.add('show');
            }
        } catch(e) { console.error('Search error:', e); }
    }
    
    function hideSearchDropdown() { var d = $('searchDropdown'); if (d) d.classList.remove('show'); }
    
    window.applySearchFromDropdown = function(query) {
        currentSearch = query;
        var si = $('searchInput');
        if (si) si.value = query;
        hideSearchDropdown();
        updateSearchHeader();
        loadProducts();
    };
    
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.search-box') && !e.target.closest('.search-dropdown')) hideSearchDropdown();
    });
    
    window.addEventListener('scroll', function() {
        if(allProductsIsLoading || !allProductsHasMore) return;
        var scrollBottom = window.scrollY + window.innerHeight;
        var threshold = document.body.offsetHeight - 600;
        if(scrollBottom >= threshold) loadMoreProducts();
    }, { passive: true });
    
    // ═══ OFFLINE BANNER ═══
    window.addEventListener('offline', function() { var b = $('netBanner'); if (b) b.style.display = 'block'; });
    window.addEventListener('online', function() { var b = $('netBanner'); if (b) b.style.display = 'none'; });
    
    async function init() {
        // Offline check on load
        if (!navigator.onLine) { var nb = $('netBanner'); if (nb) nb.style.display = 'block'; }
        
        await checkHoliday();
        var params = new URLSearchParams(window.location.search);
        currentCategoryId = params.get('category_id') || '';
        var searchParam = params.get('search') || '';
        var offerParam = params.get('offer') || '';
        if (searchParam && searchParam !== '1' && searchParam.trim() !== '') currentSearch = searchParam;
        else currentSearch = '';
        if(offerParam === 'true') { currentSort = 'offers'; var chips = document.querySelectorAll('.filter-chip'); chips.forEach(function(c) { c.classList.remove('active'); if(c.textContent.includes('Offers')) c.classList.add('active'); }); }
        var si = $('searchInput');
        if(si && currentSearch) si.value = currentSearch;
        CartManager.updateBadge();
        
        var lat = parseFloat(localStorage.getItem('user_lat') || '0') || null;
        var lng = parseFloat(localStorage.getItem('user_lng') || '0') || null;
        if(lat && lng) {
            userLat = lat; userLng = lng;
            var shops = getCached('shops_list');
            if(!shops) {
                try { var sr = await sb.from('shops').select('id, name, latitude, longitude, delivery_radius_km').eq('status', 'approved').eq('is_open', true); shops = sr.data || []; setCached('shops_list', shops); } catch(e) { shops = []; }
            }
            var cachedNames = getCached('shop_names');
            if(cachedNames) shopNamesMap = cachedNames;
            nearbyShopIds = [];
            shops.forEach(function(s) { shopNamesMap[s.id] = s.name || ''; if(s.latitude && s.longitude) { var d = calcDist(userLat, userLng, s.latitude, s.longitude); if(d <= (s.delivery_radius_km || CONFIG.SERVICE_RADIUS_KM)) nearbyShopIds.push(s.id); } });
            if(nearbyShopIds.length === 0 && shops.length > 0) nearbyShopIds = shops.map(function(s) { return s.id; });
        }
        
        await loadProducts();
        
        // ═══ RESTORE SCROLL POSITION ═══
        var savedScroll = parseInt(sessionStorage.getItem('zymart_products_scroll') || '0');
        if (savedScroll > 0) setTimeout(function() { window.scrollTo({ top: savedScroll, behavior: 'auto' }); }, 250);
        
        if (si) {
            si.addEventListener('input', function() {
                clearTimeout(searchTimer);
                var q = si.value.trim();
                if (q.length >= 1) {
                    searchTimer = setTimeout(function() { performLiveSearch(q); }, 250);
                } else {
                    hideSearchDropdown();
                }
            });
            si.addEventListener('keyup', function(e) {
                if (e.key === 'Enter') {
                    clearTimeout(searchTimer);
                    var q = si.value.trim();
                    currentSearch = q;
                    hideSearchDropdown();
                    updateSearchHeader();
                    loadProducts();
                }
                if (e.key === 'Escape') hideSearchDropdown();
            });
        }
    }
    
    document.addEventListener('DOMContentLoaded', init);
    window.addEventListener('storage', function(e) { if(e.key === 'zymart_cart') CartManager.updateBadge(); });
    
    window.openProduct = openProduct;
    window.loadProducts = loadProducts;
    window.CartManager = CartManager;
    
})();
