        .skeleton-card { background: white; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-light); }
        .skeleton-img { width: 100%; aspect-ratio: 1/1; background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; }

        @media (max-width: 380px) {
            .products-grid { gap: 8px; padding: 8px; }
            .product-info { padding: 8px; }

        }
    </style>
</head>

<script>
(function() {

        if (url.indexOf('http') === 0 || url.indexOf('data:') === 0) return url;
        return SUPABASE_URL + '/storage/v1/object/public/' + url;
    }

    function escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    function showApp() {
        var loader = document.getElementById('simpleLoader');
        var app = document.getElementById('mainApp');
        if (app) app.style.display = '';
        if (loader) {
            loader.classList.add('fade-out');

        if(b) { b.style.width = '0%'; b.classList.add('loading'); setTimeout(function() { b.style.width = '90%'; }, 10); } 
    }
    function completeProgress() { 
        var b = document.getElementById('pageProgress'); 
        if(b) { b.classList.remove('loading'); b.classList.add('complete'); setTimeout(function() { b.style.width = '0%'; b.classList.remove('complete'); }, 300); } 
    }

    var Cache = { 
        set: function(k,d,t){try{localStorage.setItem('zc_'+k,JSON.stringify({d:d,e:Date.now()+(t||1800000)}));}catch(e){}}, 
        get: function(k){try{var c=localStorage.getItem('zc_'+k);if(!c)return null;var p=JSON.parse(c);return Date.now()>p.e?(localStorage.removeItem('zc_'+k),null):p.d;}catch(e){return null;}} 
    };

    async function safeFetch(fetchFn, maxRetries) {
        maxRetries = maxRetries || 3;
        var lastError = null;
        for (var i = 0; i < maxRetries; i++) {
            try {
                var result = await fetchFn();
                if (result.error) { lastError = new Error(result.error.message); if (i === maxRetries-1) throw lastError; }
                else return result;
            } catch(err) { lastError = err; if (i === maxRetries-1) throw lastError; }
            await new Promise(function(r) { setTimeout(r, Math.pow(2,i)*500); });
        }
        throw lastError;
    }

    window.addEventListener('online', function() { showToast('✅ इंटरनेट बहाल!'); resetAndLoad(); });
    window.addEventListener('offline', function() { showToast('⚠️ इंटरनेट कनेक्शन नहीं है', true); });

    var touchStartY = 0;
    document.addEventListener('touchstart', function(e) { touchStartY = e.touches[0].clientY; }, {passive: true});
    document.addEventListener('touchend', function(e) {
        if (window.scrollY === 0 && e.changedTouches[0].clientY - touchStartY > 100) {
            showToast('🔄 रिफ्रेश हो रहा है...');
            resetAndLoad();
        }
    }, {passive: true});

    function showToast(msg, isError) {
        isError = isError || false;
        var t = document.getElementById('toastMsg'), s = document.getElementById('toastText');
        if(!t || !s) return;
        s.textContent = msg; 
        t.style.background = isError ? '#EF4444' : '#111827';
        t.classList.add('show'); clearTimeout(t._timer);
        t._timer = setTimeout(function() { t.classList.remove('show'); }, 2200);
    }

    try {
        var urlParams = new URLSearchParams(window.location.search);
        searchQuery = urlParams.get('search') || '';
        categoryId = urlParams.get('category_id') || '';
        categoryName = urlParams.get('category_name') || '';
    } catch(e) {}

    window.fastNavigate = function(url) { startProgress(); setTimeout(function() { window.location.href = url; }, 80); };

    function goBack() { 
        try { if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) { window.history.back(); return; } } catch(e) {}
        window.location.href = 'index.html';
    }

    function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

    function getCart() {
        try { return JSON.parse(localStorage.getItem('zatpat_cart') || '[]'); } catch(e) { return []; }
    }
    function saveCart(cart) { try { localStorage.setItem('zatpat_cart', JSON.stringify(cart)); } catch(e) {} }

    function updateCartBadge() {
        var cart = getCart();
        var count = cart.reduce(function(s,i) { return s+(i.quantity||1); }, 0);
        var badge = document.getElementById('cartBadge');
        var navCount = document.getElementById('cartCount');
        if(badge) badge.textContent = count;
        if(navCount) navCount.textContent = count;
        return count;
    }

    function getWishlist() { try { return JSON.parse(localStorage.getItem('zatpat_wishlist')||'[]'); } catch(e) { return []; } }
    function saveWishlist(l) { try { localStorage.setItem('zatpat_wishlist', JSON.stringify(l)); } catch(e) {} }

    function toggleWishlist(productId) {
        var list = getWishlist();
        var idx = list.indexOf(productId);
        if (idx !== -1) { list.splice(idx,1); saveWishlist(list); showToast('विशलिस्ट से हटाया'); }
        else { list.push(productId); saveWishlist(list); showToast('❤️ विशलिस्ट में जोड़ा'); }
        var btn = document.querySelector('.wishlist-btn[data-product-id="'+productId+'"]');
        if(btn) {
            if(idx===-1) { btn.classList.add('liked'); btn.querySelector('i').className='fas fa-heart'; }
            else { btn.classList.remove('liked'); btn.querySelector('i').className='far fa-heart'; }
        }
    }

    window.addToCart = function(id, name, price, image, unit) {
        if(!id) return;
        try {
            var cart = getCart();
            var existing = cart.find(function(i) { return i.id===id; });
            if(existing) { existing.quantity+=1; }
            else { cart.push({id:id,name:name,price:price,image:image,quantity:1,unit:unit||'piece'}); }
            saveCart(cart); updateCartBadge();
            showToast('🛒 '+(name||'आइटम')+' कार्ट में जोड़ा');
            if(navigator.vibrate) navigator.vibrate(10);
            updateProductUI(id, (existing?existing.quantity:0)+1);
        } catch(e) { showToast('कार्ट में जोड़ने में विफल', true); }
    };

    function updateCartItemQuantity(id, delta) {
        var cart = getCart();
        var item = cart.find(function(i) { return i.id===id; });
        if(item) {
            var newQty = (item.quantity||1)+delta;
            if(newQty<=0) { cart = cart.filter(function(i) { return i.id!==id; }); saveCart(cart); updateProductUI(id,0); }
            else { item.quantity=newQty; saveCart(cart); updateProductUI(id,newQty); }
            updateCartBadge();
        }
    }

    function updateProductUI(productId, quantity) {
        document.querySelectorAll('.qty-count[data-product-id="'+productId+'"]').forEach(function(el) { el.textContent=quantity; });
        document.querySelectorAll('.qty-controls[data-product-id="'+productId+'"]').forEach(function(el) { el.style.display=quantity>0?'flex':'none'; });
        document.querySelectorAll('.add-btn[data-product-id="'+productId+'"]').forEach(function(el) { el.style.display=quantity>0?'none':'flex'; });
    }

    async function loadActiveOffers() { 
        try { var r = await safeFetch(function() { return sb.from('offers').select('*').eq('is_active',true); }); allOffers=r.data||[]; } 
        catch(e) { allOffers=[]; } 
    }

    function getBestOffer(product) {
        var now = new Date();
        return (allOffers.filter(function(o) {
            if(o.valid_from && new Date(o.valid_from)>now) return false;
            if(o.valid_till && new Date(o.valid_till)<now) return false;
            if(o.apply_to==='global') return true;
            if(o.apply_to==='category' && o.target_id===product.category_id) return true;
            if(o.apply_to==='product' && o.target_id===product.id) return true;
            if(o.apply_to==='shop' && o.target_id===product.shop_id) return true;
            return false;
        }).sort(function(a,b) {
            var aV=a.discount_type==='percentage'?a.discount_value:(a.discount_value/product.price)*100;
            var bV=b.discount_type==='percentage'?b.discount_value:(b.discount_value/product.price)*100;
            return bV-aV;
        }))[0] || null;
    }

    function getOfferPrice(product) {
        if(product.offer_price && product.offer_price>0 && product.offer_price<product.price) {
            return { price:product.offer_price, discountPercent:Math.round((1-product.offer_price/product.price)*100) };
        }
        var offer = getBestOffer(product);
        if(offer) {
            var discount = offer.discount_type==='percentage' ? (product.price*offer.discount_value)/100 : offer.discount_value;
            if(offer.max_discount>0 && offer.discount_type==='percentage') discount=Math.min(discount,offer.max_discount);
            var calcPrice = Math.max(Math.round(product.price-discount),0);
            if(calcPrice<product.price) return { price:calcPrice, discountPercent:Math.round((1-calcPrice/product.price)*100) };
        }
        return { price:product.price, discountPercent:0 };
    }

    function renderStarRating(rating) {
        var full=Math.floor(rating), half=rating%1>=0.5, empty=5-full-(half?1:0);
        var h='<div class="stars">';
        for(var i=0;i<full;i++) h+='<i class="fas fa-star"></i>';
        if(half) h+='<i class="fas fa-star-half-stroke"></i>';
        for(var i=0;i<empty;i++) h+='<i class="far fa-star empty"></i>';
        h+='</div>'; return h;
    }

    window.toggleSortDropdown = function() { document.getElementById('sortDropdown').classList.toggle('active'); };
    window.setSort = function(sort) { 
        currentSort=sort; 
        document.getElementById('sortDropdown').classList.remove('active');
        document.querySelectorAll('.sort-option').forEach(function(o){o.classList.remove('active');});
        var a=document.querySelector('.sort-option[onclick*="'+sort+'"]'); if(a)a.classList.add('active');
        resetAndLoad(); 
    };

    // 🔵 LOCATION-BASED PRODUCT LOADING
    function getLocation() {
        var city = localStorage.getItem('user_city');
        if(city) { userCity = city; return city; }
        userCity = null; return null;
    }

    async function getNearbyShopIds() {
        if(!userCity) return [];
        try {
            var r = await safeFetch(function() { return sb.from('shops').select('id').eq('city',userCity).eq('status','approved'); });
            return (r.data||[]).map(function(s){return s.id;});
        } catch(e) { return []; }
    }

    function resetAndLoad() { 
        products=[]; currentPage=0; hasMore=true; 
        document.getElementById('productsContainer').innerHTML='<div class="products-grid"><div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div><div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div></div>';
        loadProducts(); 
    }

    async function loadProducts() {
        if(isLoading || !hasMore) return;
        isLoading=true; isLoadingMore=currentPage>0;
        startProgress();
        
        try {
            var localShopIds = userCity ? await getNearbyShopIds() : [];
            var query = sb.from('products').select('*',{count:'exact'}).eq('is_active',true);
            
            // Location filter: nearby shops first
            if(localShopIds.length>0 && !searchQuery && !categoryId) {
                query = query.in('shop_id', localShopIds);
            }
            
            if(searchQuery) { query = query.ilike('name','%'+searchQuery+'%'); }
            else if(categoryId) { query = query.eq('category_id', categoryId); }
            
            if(currentSort==='price_low') query=query.order('price',{ascending:true});
            else if(currentSort==='price_high') query=query.order('price',{ascending:false});
            else if(currentSort==='rating') query=query.order('rating',{ascending:false,nullsFirst:false});
            else query=query.order('created_at',{ascending:false});
            
            var from=currentPage*PAGE_SIZE, to=from+PAGE_SIZE-1;
            query=query.range(from,to);
            
            var result = await safeFetch(function(){return query;});
            var data=result.data, count=result.count;
            
            if(data && data.length>0) {
                if(currentSort==='discount') {
                    data.sort(function(a,b){
                        var aD=(a.price-getOfferPrice(a).price)/a.price;
                        var bD=(b.price-getOfferPrice(b).price)/b.price;
                        return bD-aD;
                    });
                }
                
                // If local products less than PAGE_SIZE, fill with others
                if(localShopIds.length>0 && data.length<PAGE_SIZE && !searchQuery && !categoryId) {
                    var existingIds = data.map(function(p){return p.id;});
                    var remaining = PAGE_SIZE - data.length;
                    var fillQuery = sb.from('products').select('*').eq('is_active',true).order('created_at',{ascending:false}).limit(remaining*2);
                    var fillResult = await safeFetch(function(){return fillQuery;});
                    if(fillResult.data) {
                        var fillData = fillResult.data.filter(function(p){return existingIds.indexOf(p.id)===-1;}).slice(0,remaining);
                        data = data.concat(fillData);
                    }
                }
                
                products = products.concat(data);
                currentPage++;
                hasMore = products.length < (count || 0);
            } else if(localShopIds.length>0 && !searchQuery && !categoryId) {
                // No local products, try all
                localShopIds = [];
                return loadProducts();
            } else {
                hasMore = false;
            }
            renderProducts();
            completeProgress();
        } catch(e) {
            console.error('Load error:',e);
            if(products.length===0) {
                document.getElementById('productsContainer').innerHTML='<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>प्रोडक्ट्स लोड करने में विफल</h3><p>कृपया अपना कनेक्शन जांचें</p><button class="btn-primary" onclick="resetAndLoad()">🔄 पुनः प्रयास करें</button></div>';
            }
            showToast('❌ प्रोडक्ट्स लोड करने में विफल', true);
            completeProgress();
        } finally { isLoading=false; isLoadingMore=false; }
    }

    function renderProducts() {
        var container = document.getElementById('productsContainer');
        if(!container) return;
        
        if(products.length===0) {
            var emptyHtml = '<div class="empty-state"><i class="fas fa-box-open"></i><h3>कोई प्रोडक्ट्स नहीं मिले</h3>';
            emptyHtml += '<p>'+(searchQuery?'"'+escapeHTML(searchQuery)+'" के लिए कोई परिणाम नहीं':'कोई अन्य श्रेणी आज़माएं')+'</p>';
            if(searchQuery||categoryId) emptyHtml += '<button class="btn-primary" onclick="resetAndLoad()">फ़िल्टर हटाएं</button>';
            emptyHtml += '<br><button class="btn-gold" onclick="fastNavigate(\'invite-earn.html\')"><i class="fas fa-gift"></i> दोस्तों को इन्वाइट करें</button>';
            emptyHtml += '</div>';
            container.innerHTML = emptyHtml;
            return;
        }
        
        var cart = getCart();
        var wishlist = getWishlist();
        var city = userCity || '';
        
        if(city && !searchQuery) {
            var locTag = document.getElementById('locationTag');
            var locName = document.getElementById('locationName');
            if(locTag && locName) { locTag.style.display='inline-flex'; locName.textContent=city; }
        }
        
        var html = '<div class="products-grid">';
        for(var i=0;i<products.length;i++) {
            var p=products[i];
            var img=p.images?.[0]||p.image_url||'';
            var imgUrl=getFullUrl(img);
            var offerData=getOfferPrice(p);
            var offerPrice=offerData.price;
            var discountPercent=offerData.discountPercent;
            var hasDiscount=discountPercent>0;
            var unitText=p.unit==='kg'?'/kg':p.unit==='gram'?'/100g':p.unit==='liter'?'/लीटर':p.unit==='dozen'?'/दर्जन':'/पीस';
            var stock=p.stock||0, isOut=stock<=0;
            var rating=p.rating||0;
            var cartItem=cart.find(function(ci){return ci.id===p.id;});
            var cartQty=cartItem?cartItem.quantity||1:0;
            var inWish=wishlist.indexOf(p.id)!==-1;
            var pName=escapeHTML(p.name||'प्रोडक्ट');
            
            html+='<div class="product-card" onclick="fastNavigate(\'product-detail.html?id='+p.id+'\')" style="animation-delay:'+(i*0.03)+'s;">';
            html+='<div class="product-img">';
            if(hasDiscount) html+='<div class="discount-tag">'+discountPercent+'% छूट</div>';
            html+='<button class="wishlist-btn'+(inWish?' liked':'')+'" data-product-id="'+p.id+'" onclick="event.stopPropagation();toggleWishlist(\''+p.id+'\')"><i class="'+(inWish?'fas':'far')+' fa-heart"></i></button>';
            html+='<div class="stock-badge">'+(isOut?'स्टॉक खत्म':stock+' बाकी')+'</div>';
            if(isOut) html+='<div class="out-of-stock-overlay"><span>स्टॉक खत्म</span></div>';
            if(imgUrl) html+='<img src="'+imgUrl+'" loading="lazy" alt="'+pName+'" onerror="this.style.display=\'none\';this.nextElementSibling.classList.add(\'show\');">';
            html+='<i class="fas fa-box-open fallback-icon'+(imgUrl?'':' show')+'"></i></div>';
            html+='<div class="product-info"><div class="product-name">'+pName+'</div>';
            html+='<div class="product-unit">'+unitText+'</div>';
            html+='<div class="product-rating">';
            html+=rating>0?renderStarRating(rating):'<div class="stars"><i class="far fa-star empty"></i><i class="far fa-star empty"></i><i class="far fa-star empty"></i><i class="far fa-star empty"></i><i class="far fa-star empty"></i></div>';
            html+='<span class="count">'+(rating>0?rating.toFixed(1):'नया')+'</span>';
            html+='<span class="rating-admin-badge">🔒 एडमिन</span></div>';
            html+='<div class="product-price-row"><div class="price-info"><span class="product-price">₹'+offerPrice+'</span>';
            if(hasDiscount) html+='<span class="original-price">₹'+p.price+'</span>';
            html+='</div>';
            if(!isOut) {
                html+='<div class="qty-controls" data-product-id="'+p.id+'" style="display:'+(cartQty>0?'flex':'none')+'">';
                html+='<button class="qty-btn" onclick="event.stopPropagation();updateCartItemQuantity(\''+p.id+'\',-1)">−</button>';
                html+='<span class="qty-count" data-product-id="'+p.id+'">'+cartQty+'</span>';
                html+='<button class="qty-btn" onclick="event.stopPropagation();updateCartItemQuantity(\''+p.id+'\',1)">+</button></div>';
                html+='<button class="add-btn" data-product-id="'+p.id+'" onclick="event.stopPropagation();addToCart(\''+p.id+'\',\''+pName.replace(/'/g,"\\'")+'\','+offerPrice+',\''+imgUrl+'\',\''+(p.unit||'piece')+'\')" style="display:'+(cartQty>0?'none':'flex')+'"><i class="fas fa-plus"></i></button>';
            } else { html+='<div class="add-btn disabled"><i class="fas fa-ban"></i></div>'; }
            html+='</div></div></div>';
        }
        html+='</div>';
        
        if(hasMore) {
            html+='<div class="load-more"><button class="load-more-btn" onclick="loadProducts()"><i class="fas fa-chevron-down"></i> और प्रोडक्ट्स लोड करें</button></div>';
        }
        
        container.innerHTML = html;
    }

    // Debounced scroll load-more
    window.addEventListener('scroll', function() {
        var scrollBtn = document.getElementById('scrollTopBtn');
        if(scrollBtn) scrollBtn.classList.toggle('show', window.scrollY>400);
        
        if(window.innerHeight+window.scrollY >= document.body.offsetHeight-600 && hasMore && !isLoading && !isLoadingMore) {
            if(scrollDebounce) clearTimeout(scrollDebounce);
            scrollDebounce = setTimeout(function() { loadProducts(); }, 300);
        }
    }, {passive:true});

    async function init() {
        getLocation();
        updateCartBadge();
        await loadActiveOffers();
        
        var catTitle = document.getElementById('categoryTitle');
        if(categoryId && categoryName) {
            try { catTitle.innerHTML = '<i class="fas fa-tag"></i> '+escapeHTML(decodeURIComponent(categoryName)); } catch(e) {}
        }
        if(userCity && !searchQuery) {
            var locTag = document.getElementById('locationTag');
            var locName = document.getElementById('locationName');
            if(locTag && locName) { locTag.style.display='inline-flex'; locName.textContent=userCity; }
        }
        
        var searchInput = document.getElementById('searchInput');
        if(searchQuery && searchInput) searchInput.value = searchQuery;
        
        var searchTimer;
        if(searchInput) {
            searchInput.addEventListener('input', function(e) {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(function() { searchQuery=e.target.value.trim(); resetAndLoad(); }, 500);
            });
            searchInput.addEventListener('keypress', function(e) {
                if(e.key==='Enter') { clearTimeout(searchTimer); searchQuery=e.target.value.trim(); resetAndLoad(); searchInput.blur(); }
            });
        }
        
        document.addEventListener('click', function(e) {
            if(!e.target.closest('.sort-btn') && !e.target.closest('.sort-dropdown')) {
                document.getElementById('sortDropdown').classList.remove('active');
            }
        });
        
        loadProducts();
        showApp();
        initComplete = true;
    }

    document.addEventListener('DOMContentLoaded', init);
    document.addEventListener('visibilitychange', function() {
        if(!document.hidden && initComplete) { updateCartBadge(); }
    });

    window.handleBackPress = function() { goBack(); return true; };
    window.goBack = goBack;
    window.addToCart = addToCart;
    window.updateCartItemQuantity = updateCartItemQuantity;
    window.fastNavigate = fastNavigate;
    window.toggleSortDropdown = toggleSortDropdown;
    window.setSort = setSort;
    window.toggleWishlist = toggleWishlist;
    window.scrollToTop = scrollToTop;
    window.resetAndLoad = resetAndLoad;
})();
</script>
</body>
</html>
