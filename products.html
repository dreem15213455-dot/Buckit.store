<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>All Products - Zatpat</title>
    <meta name="theme-color" content="#FFD600">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary: #FFD600;
            --primary-dark: #E5C200;
            --accent-green: #16A34A;
            --bg-light: #F5F5F5;
            --card-white: #FFFFFF;
            --text-primary: #1A1A1A;
            --text-secondary: #666666;
            --border-light: #E5E7EB;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-2xl: 24px;
            --radius-full: 9999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
        }
        h1, h2, h3, h4, h5, h6 { font-family: 'Poppins', sans-serif; }

        .top-bar {
            background: var(--card-white);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 12px 16px;
            box-shadow: var(--shadow-sm);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .back-btn {
            width: 40px;
            height: 40px;
            background: var(--bg-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .brand-name { font-size: 22px; font-weight: 800; }
        .brand-name .normal { color: #000000; }
        .brand-name .pat { color: var(--accent-green); }
        .page-title { flex: 1; text-align: center; font-weight: 600; font-size: 16px; }

        .main-content { padding-top: 80px; padding-bottom: 80px; }

        /* Search Box */
        .search-container { padding: 16px; background: white; border-bottom: 1px solid var(--border-light); }
        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-light);
            border-radius: var(--radius-full);
            padding: 10px 16px;
            gap: 10px;
        }
        .search-box i { color: var(--text-secondary); }
        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
        }

        /* Category Tabs */
        .category-tabs {
            display: flex;
            gap: 10px;
            padding: 16px;
            overflow-x: auto;
            scrollbar-width: none;
            background: white;
            border-bottom: 1px solid var(--border-light);
        }
        .category-tabs::-webkit-scrollbar { display: none; }
        .category-chip {
            background: var(--bg-light);
            border-radius: var(--radius-full);
            padding: 8px 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .category-chip.active {
            background: var(--primary);
            color: #000000;
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 16px;
        }
        .product-card {
            background: var(--card-white);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border-light);
            cursor: pointer;
            transition: all 0.3s;
        }
        .product-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
        .product-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background: var(--bg-light);
        }
        .product-info { padding: 12px; }
        .product-name {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .product-shop {
            font-size: 11px;
            color: var(--primary);
            margin-bottom: 6px;
        }
        .product-rating {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 6px;
        }
        .product-rating i { color: #FACC15; font-size: 11px; }
        .product-rating span { font-size: 11px; color: var(--text-secondary); }
        .product-price {
            font-size: 16px;
            font-weight: 800;
            color: var(--accent-green);
            margin-bottom: 8px;
        }
        .old-price {
            font-size: 12px;
            color: var(--text-secondary);
            text-decoration: line-through;
            margin-left: 6px;
            font-weight: normal;
        }
        .add-cart-btn {
            background: var(--primary);
            color: #000000;
            border: none;
            border-radius: var(--radius-full);
            padding: 8px 0;
            font-size: 12px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s;
        }
        .add-cart-btn:hover { background: var(--primary-dark); }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            grid-column: 1/-1;
        }

        .loading-spinner { text-align: center; padding: 60px; color: var(--primary); }

        /* Bottom Nav */
        .bottom-nav {
            background: var(--card-white);
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 8px 16px 16px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
            z-index: 1000;
            border-top: 1px solid var(--border-light);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            font-size: 10px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 20px; margin-bottom: 3px; }

        .toast-notification {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #1F2937;
            color: white;
            padding: 10px 20px;
            border-radius: var(--radius-full);
            font-size: 13px;
            z-index: 10050;
            display: none;
        }
        .toast-notification.show { display: flex; animation: fadeUp 0.3s ease; }
        @keyframes fadeUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

        @media (max-width: 480px) {
            .products-grid { gap: 12px; }
            .product-img { height: 120px; }
            .product-name { font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="d-flex align-items-center gap-3">
            <div class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
            <div class="brand-name"><span class="normal">Zat</span><span class="pat">pat</span></div>
            <div style="flex:1; text-align: center; font-weight: 600;">All Products</div>
        </div>
    </div>

    <div class="main-content">
        <div class="search-container">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search products...">
            </div>
        </div>

        <div class="category-tabs" id="categoryTabs">
            <div class="category-chip active" data-cat="all">All</div>
        </div>

        <div class="products-grid" id="productsContainer">
            <div class="loading-spinner"><i class="fas fa-spinner fa-spin fa-2x"></i><p>Loading products...</p></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="products.html" class="nav-item active"><i class="fas fa-box"></i><span>All Products</span></a>
        <a href="cart.html" class="nav-item"><i class="fas fa-shopping-cart"></i><span>Cart</span></a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user"></i><span>Profile</span></a>
        <a href="orders.html" class="nav-item"><i class="fas fa-receipt"></i><span>Orders</span></a>
    </nav>

    <div id="toastMsg" class="toast-notification"><i class="fas fa-check-circle"></i> <span id="toastText"></span></div>

    <script>
        const supabaseUrl = 'https://zwajyovemwdqtkecipeb.supabase.co';
        const supabaseKey = 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let allProducts = [];
        let allCategories = [];
        let currentUser = null;
        let currentCategory = 'all';
        let searchTimeout = null;

        function showToast(message, isError = false) {
            const toast = document.getElementById('toastMsg');
            const toastText = document.getElementById('toastText');
            toastText.innerHTML = message;
            toast.style.background = isError ? '#EF4444' : '#1F2937';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        async function loadCategories() {
            try {
                const { data, error } = await supabaseClient
                    .from('categories')
                    .select('name')
                    .eq('is_active', true)
                    .limit(10);
                
                if (!error && data && data.length > 0) {
                    allCategories = data.map(c => c.name);
                } else {
                    allCategories = ['Grocery', 'Hardware', 'Clothing', 'Dairy', 'Electronics', 'Fashion', 'Medical'];
                }
                
                const container = document.getElementById('categoryTabs');
                if (container) {
                    let html = '<div class="category-chip active" data-cat="all">All</div>';
                    allCategories.forEach(cat => {
                        html += `<div class="category-chip" data-cat="${cat.toLowerCase()}">${cat}</div>`;
                    });
                    container.innerHTML = html;
                    
                    document.querySelectorAll('.category-chip').forEach(chip => {
                        chip.addEventListener('click', () => {
                            document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
                            chip.classList.add('active');
                            currentCategory = chip.dataset.cat;
                            filterAndRenderProducts();
                        });
                    });
                }
            } catch(e) { console.error(e); }
        }

        async function loadProducts() {
            try {
                const { data, error } = await supabaseClient
                    .from('products')
                    .select('*, shops(name)')
                    .eq('is_active', true)
                    .order('created_at', { ascending: false });
                
                if (error) throw error;
                allProducts = data || [];
                console.log('📦 Products loaded:', allProducts.length);
                filterAndRenderProducts();
            } catch (error) {
                console.error('Error loading products:', error);
                document.getElementById('productsContainer').innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>Failed to load products</h3></div>';
            }
        }

        function filterAndRenderProducts() {
            let filtered = [...allProducts];
            
            if (currentCategory !== 'all') {
                filtered = filtered.filter(p => 
                    p.category?.toLowerCase() === currentCategory
                );
            }
            
            const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
            if (searchTerm) {
                filtered = filtered.filter(p => 
                    p.name?.toLowerCase().includes(searchTerm) ||
                    p.category?.toLowerCase().includes(searchTerm)
                );
            }
            
            renderProducts(filtered);
        }

        function renderProducts(products) {
            const container = document.getElementById('productsContainer');
            if (!container) return;
            
            if (!products || products.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-box-open"></i><h3>No products found</h3><p>Try a different category or search term</p></div>';
                return;
            }
            
            container.innerHTML = products.map(product => {
                // FIXED: Image fetch logic
                let imageUrl = 'https://placehold.co/300x150/FFD600/000?text=Product';
                if (product.images && Array.isArray(product.images) && product.images.length > 0) {
                    imageUrl = product.images[0];
                } else if (product.image_url && product.image_url.trim() !== '') {
                    imageUrl = product.image_url;
                }
                
                const discount = product.offer_price ? Math.round((1 - product.offer_price/product.price) * 100) : 0;
                const rating = product.rating || 4.0;
                
                return `
                    <div class="product-card" onclick="viewProduct('${product.id}')">
                        <img src="${imageUrl}" class="product-img" onerror="this.src='https://placehold.co/300x150/FFD600/000?text=Product'">
                        <div class="product-info">
                            <div class="product-name">${escapeHtml(product.name)}</div>
                            <div class="product-shop">${product.shops?.name || 'Local Shop'}</div>
                            <div class="product-rating"><i class="fas fa-star"></i> <span>${rating}</span></div>
                            <div class="product-price">
                                ₹${product.offer_price || product.price}
                                ${product.offer_price ? `<span class="old-price">₹${product.price}</span>` : ''}
                                ${discount > 0 ? `<span style="color: var(--primary); font-size: 11px; margin-left: 6px;">${discount}% OFF</span>` : ''}
                            </div>
                            <button class="add-cart-btn" onclick="event.stopPropagation(); addToCart('${product.id}', '${escapeHtml(product.name)}', ${product.offer_price || product.price})">
                                <i class="fas fa-cart-plus"></i> Add to Cart
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function addToCart(id, name, price) {
            let cart = JSON.parse(localStorage.getItem('zatpat_cart')) || [];
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ id, name, price, quantity: 1 });
            }
            localStorage.setItem('zatpat_cart', JSON.stringify(cart));
            showToast(`🛒 ${name} added to cart`);
        }

        function viewProduct(id) {
            window.location.href = `product-detail.html?id=${id}`;
        }

        function goBack() {
            window.location.href = 'index.html';
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        async function checkUser() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                const { data: { user } } = await supabaseClient.auth.getUser();
                currentUser = user;
            }
        }

        document.getElementById('searchInput')?.addEventListener('input', (e) => {
            if (searchTimeout) clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => filterAndRenderProducts(), 300);
        });

        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const category = params.get('category');
            const search = params.get('search');
            if (category) {
                currentCategory = category.toLowerCase();
                setTimeout(() => {
                    const chips = document.querySelectorAll('.category-chip');
                    chips.forEach(chip => {
                        chip.classList.remove('active');
                        if (chip.dataset.cat === currentCategory) chip.classList.add('active');
                    });
                    filterAndRenderProducts();
                }, 500);
            }
            if (search && document.getElementById('searchInput')) {
                document.getElementById('searchInput').value = search;
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await checkUser();
            await loadCategories();
            await loadProducts();
            getUrlParams();
        });

        window.addToCart = addToCart;
        window.viewProduct = viewProduct;
        window.goBack = goBack;
    </script>
</body>
</html>
