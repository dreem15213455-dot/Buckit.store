    <style>

        .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #EDF7F1, #F9FAFB, #FFFFFF); padding: 20px; }

        .form-control { width: 100%; padding: 10px 12px; border: 1.5px solid var(--neutral-border); border-radius: var(--radius-sm); font-size: 13px; font-family: 'Inter', sans-serif; outline: none; background: white; }

        .form-row { display: flex; gap: 10px; }

        .toggle-switch { position: relative; width: 50px; height: 26px; cursor: pointer; display: inline-block; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #D1D5DB; border-radius: 26px; transition: 0.3s; }
        .toggle-slider:before { content: ''; position: absolute; height: 20px; width: 20px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.3s; }
        .toggle-switch input:checked + .toggle-slider { background: var(--brand-green); }
        .toggle-switch input:checked + .toggle-slider:before { transform: translateX(24px); }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(8,61,33,0.7); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal-container { background: white; border-radius: var(--radius-xl); width: 92%; max-width: 550px; max-height: 85vh; overflow-y: auto; padding: 18px; animation: slideUp 0.3s ease; }

        .order-num-inline {
            display: flex; align-items: center; gap: 6px; margin: 8px 0 6px;
            background: #F0FDF4; border: 1.5px solid #86EFAC; border-radius: 8px; padding: 6px 10px;
        }

            font-size: 10px; font-weight: 700; color: #065F46; text-transform: uppercase; letter-spacing: 0.3px;
        }
        .order-num-inline input {
            flex: 1; max-width: 70px; padding: 6px 8px; border: 1.5px solid #86EFAC; border-radius: 6px;
            font-size: 14px; font-weight: 800; text-align: center; font-family: 'Inter', sans-serif;
            color: #065F46; background: white; outline: none;
        }
        .order-num-inline input:focus { border-color: var(--brand-green); box-shadow: 0 0 0 3px rgba(11,90,49,0.1); }
        
        .image-upload-box { border: 2px dashed var(--brand-green); border-radius: var(--radius-md); padding: 12px; text-align: center; cursor: pointer; background: #EDF7F1; }
        .image-upload-box.has-image { border-style: solid; border-color: #22C55E; }
        .image-preview { max-width: 130px; max-height: 80px; border-radius: 10px; margin-top: 6px; display: none; }
        .image-preview.show { display: block; }
        
        .data-table { width: 100%; border-collapse: collapse; min-width: 500px; font-size: 12px; }
        .data-table th { text-align: left; padding: 10px; background: var(--neutral-bg); font-weight: 700; font-size: 10px; text-transform: uppercase; color: var(--neutral-gray); border-bottom: 2px solid var(--neutral-border); }
        .data-table td { padding: 8px 10px; border-bottom: 1px solid var(--neutral-border); }
        
        .empty-state { text-align: center; padding: 30px; color: var(--neutral-gray); }
        .empty-state i { font-size: 40px; margin-bottom: 8px; display: block; color: #D1D5DB; }
        
        .cat-checkbox-list { max-height: 200px; overflow-y: auto; border: 1px solid var(--neutral-border); border-radius: 8px; padding: 8px; }
        .cat-checkbox-label { display: flex; align-items: center; gap: 6px; padding: 4px 6px; font-size: 12px; cursor: pointer; border-radius: 4px; }
        .cat-checkbox-label:hover { background: #F3F4F6; }
        
        .slider-preview { width: 100%; height: 60px; object-fit: cover; border-radius: 8px; }
        
        .prod-edit-img-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
        .prod-edit-img-item { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: #F9FAFB; border: 2px solid #E5E7EB; }
        .prod-edit-img-item img { width: 100%; height: 100%; object-fit: cover; }
        .prod-edit-img-item .remove-btn { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; background: rgba(239,68,68,0.95); color: white; border: none; border-radius: 50%; font-size: 11px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .prod-edit-img-empty { grid-column: 1 / -1; text-align: center; color: #9CA3AF; font-size: 11px; padding: 14px; }
        
        .plan-fee-card { background: linear-gradient(135deg, #F0FDF4, #DCFCE7); border: 2px solid #86EFAC; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
        .plan-fee-card-title { font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 700; color: #065F46; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .plan-fee-input { width: 100%; padding: 12px 14px; border: 2px solid #86EFAC; border-radius: 10px; font-size: 18px; font-weight: 700; font-family: 'Poppins', sans-serif; color: #065F46; background: white; outline: none; text-align: center; }
        .plan-fee-input:focus { border-color: var(--brand-green); }
        .plan-fee-total { font-size: 11px; color: #047857; margin-top: 6px; text-align: center; font-weight: 600; }
        
        @media(max-width: 1024px) { 
            .sidebar { transform: translateX(-100%); } 
            .sidebar.open { transform: translateX(0); } 
            .sidebar-toggle { display: flex; } 
            .main-content { margin-left: 0; padding: 12px; } 
        }
        @media(max-width: 640px) { 
            .card-grid { grid-template-columns: repeat(2, 1fr); } 
            .prod-edit-img-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

<div id="simpleLoader"><div class="simple-spinner"></div><div class="loader-logo"><span class="loader-zy">Zy</span><span class="loader-mart">Mart</span></div></div>
<div id="app"></div>
<div class="toast-container" id="toastContainer"></div>

<script>
(function() {
    'use strict';
    
    window.addEventListener('error', function(e) { console.error('[Panel]', e.message); });
    window.addEventListener('unhandledrejection', function(e) { console.error('[Panel]', e.reason); e.preventDefault(); });
    
    var CONFIG = {
        SUPABASE_URL: 'https://zwajyovemwdqtkecipeb.supabase.co',
        SUPABASE_KEY: 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1',
        CLOUDINARY_CLOUD_NAME: 'b0zm0rac',
        CLOUDINARY_ENABLED: true,
        IMG_MIN_KB: 80,
        IMG_MAX_KB: 90,
        PRODUCT_BATCH_SIZE: 500,
        PRODUCT_MAX_BATCHES: 20,
        SHOP_LIMIT: 500
    };
    
    var sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
    var SUPABASE_URL = CONFIG.SUPABASE_URL;
    
    var currentAdmin = null;
    var allShops = [], allProducts = [], allCategories = [], allNotifications = [], allSections = [], allSliders = [], allAppSettings = [];
    var currentSection = 'shops';
    var catImageFile = null, catEditId = null;
    var otpTimerInterval = null, currentOtpEmail = null;
    var deliverySettingsData = null;
    var sessionRefreshTimer = null;
    var autoRefreshTimer = null;
    
    var searchProducts = '', searchShops = '', searchCategories = '', searchSubCategories = '';
    
    var editProductExistingImages = [];
    var editProductNewBlobs = [];
    var editProductRemovedImages = [];
    
    function $(id) { return document.getElementById(id); }
    function esc(s) { if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function safeText(id, t) { var el = $(id); if(el) el.textContent = t; }
    
    function showApp() { 
        var l = $('simpleLoader'); 
        if(l) { l.classList.add('fade-out'); setTimeout(function() { if(l.parentNode) l.parentNode.removeChild(l); }, 200); } 
    }
    
    function getImageUrl(url, width) {
        if(!url || typeof url !== 'string') return '';
        var fullUrl;
        if(url.indexOf('http') === 0 || url.indexOf('data:') === 0) fullUrl = url;
        else fullUrl = SUPABASE_URL + '/storage/v1/object/public/' + url;
        if(fullUrl.indexOf('res.cloudinary.com') === 0) return fullUrl;
        if(!CONFIG.CLOUDINARY_ENABLED) return fullUrl;
        return 'https://res.cloudinary.com/' + CONFIG.CLOUDINARY_CLOUD_NAME + '/image/fetch/w_' + (width || 150) + ',q_auto,f_auto/' + fullUrl;
    }
    
    async function safeFetch(fn, r) { 
        r = r || 2; 
        for(var i = 0; i < r; i++) { 
            try { 
                var res = await fn(); 
                if(res && res.error) throw new Error(res.error.message); 
                return res || {data: null}; 
            } catch(e) { 
                if(i === r-1) throw e; 
                await new Promise(function(x) { setTimeout(x, 300*(i+1)); }); 
            } 
        } 
    }
    
    function getCatName(catId) { var c = allCategories.find(function(x) { return x.id === catId; }); return c ? c.name : (catId || ''); }
    function getShopName(shopId) { var s = allShops.find(function(x) { return x.id === shopId; }); return s ? (s.name || s.shop_name) : (shopId || ''); }
    function getAppSetting(key, defaultValue) { var setting = allAppSettings.find(function(s) { return s.key === key; }); return setting ? setting.value : defaultValue; }
    
    function fmtWeightDisplay(w, u) {
        if(!w) return '';
        var nw = parseFloat(w);
        if(isNaN(nw)) return String(w);
        var unitLower = u ? u.toLowerCase() : '';
        if(unitLower === 'gram' || unitLower === 'g' || unitLower === 'gm') return nw >= 1000 ? (nw/1000).toFixed(1).replace(/\.0$/,'') + ' kg' : nw + ' g';
        if(unitLower === 'kg') return nw + ' kg';
        if(unitLower === 'liter' || unitLower === 'l') return nw + ' L';
        if(unitLower === 'ml') return nw + ' ml';
        if(unitLower === 'piece' || unitLower === 'pcs') return nw + ' pcs';
        return nw + ' ' + (u || '');
    }
    
    // ═══ NEW: Cache bust helper for category order changes ═══
    function bustCategoryCache() {

    async function fetchAllProductsBatched() {
        var all = [];

        var PRODUCT_SELECT = 'id, name, price, offer_price, image_url, images, stock, category_id, shop_id, is_featured, is_offer, offer_tag, delete_requested, is_on_hold, weight, weight_unit, unit, created_at';

            var to = from + batchSize - 1;
            try {
                var r = await sb.from('products')
                    .select(PRODUCT_SELECT)
                    .order('created_at', { ascending: false })
                    .range(from, to);
                if (r.error) { console.warn('[Products batch ' + b + ']', r.error.message); break; }
                var batch = r.data || [];
                all = all.concat(batch);
                if (batch.length < batchSize) break;
            } catch(e) { 
                console.warn('[Products batch ' + b + '] error:', e);
                break; 
            }
        }
        console.log('[Products] Loaded', all.length, 'products in batches');
        return all;
    }

    async function compressImage(file) {
        if (!file || !file.type.match(/image\//)) return file;
        
        var TARGET_MIN = CONFIG.IMG_MIN_KB * 1024;
        var TARGET_MAX = CONFIG.IMG_MAX_KB * 1024;
        
        if (file.size >= TARGET_MIN && file.size <= TARGET_MAX) return file;
        if (file.size < TARGET_MIN) return file;
        
        return new Promise(function(resolve) {
            var reader = new FileReader();
            reader.onload = function(e) {
                var img = new Image();
                img.onload = function() {
                    var maxDim = 1600;
                    var w = img.width, h = img.height;
                    
                    if (w > maxDim || h > maxDim) {
                        var ratio = Math.min(maxDim/w, maxDim/h);
                        w = Math.round(w * ratio);
                        h = Math.round(h * ratio);
                    }
                    
                    var canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    var ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, w, h);
                    
                    var qualities = [0.92, 0.90, 0.88, 0.85, 0.82, 0.80, 0.78, 0.75, 0.72, 0.70, 0.68, 0.65, 0.62, 0.60, 0.58, 0.55, 0.52, 0.50];
                    var idx = 0;
                    var bestBlob = null;
                    
                    function tryQuality() {
                        if (idx >= qualities.length) {
                            if (w > 400 && h > 400) {
                                var newW = Math.round(w * 0.8);
                                var newH = Math.round(h * 0.8);
                                var newCanvas = document.createElement('canvas');
                                newCanvas.width = newW;
                                newCanvas.height = newH;
                                var newCtx = newCanvas.getContext('2d');
                                newCtx.imageSmoothingEnabled = true;
                                newCtx.imageSmoothingQuality = 'high';
                                newCtx.drawImage(canvas, 0, 0, newW, newH);
                                canvas = newCanvas;
                                w = newW;
                                h = newH;
                                idx = 0;
                                tryQuality();
                                return;
                            }
                            resolve(bestBlob ? new File([bestBlob], 'img.jpg', {type:'image/jpeg'}) : file);
                            return;
                        }
                        
                        var q = qualities[idx++];
                        canvas.toBlob(function(blob) {
                            if (!blob) { tryQuality(); return; }
                            if (blob.size >= TARGET_MIN && blob.size <= TARGET_MAX) {
                                resolve(new File([blob], 'img.jpg', {type:'image/jpeg'}));
                                return;
                            }
                            if (blob.size < TARGET_MIN) {
                                resolve(new File([blob], 'img.jpg', {type:'image/jpeg'}));
                                return;
                            }
                            bestBlob = blob;
                            tryQuality();
                        }, 'image/jpeg', q);
                    }
                    
                    tryQuality();
                };
                img.onerror = function() { resolve(file); };
                img.src = e.target.result;
            };
            reader.onerror = function() { resolve(file); };
            reader.readAsDataURL(file);
        });
    }
    
    async function uploadCompressedImage(file, bucket, folder) {
        if(!file) return null;
        var compressed = await compressImage(file);
        var fn = folder + '_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6) + '.jpg';
        var r = await sb.storage.from(bucket).upload(fn, compressed, {cacheControl:'3600', upsert:true, contentType:'image/jpeg'});
        if(r.error) { toast('❌ Upload failed', 'error'); return null; }
        return sb.storage.from(bucket).getPublicUrl(fn).data.publicUrl;
    }

    window.setCategoryOrder = async function(id, value, type) {
        var newOrder = parseInt(value);
        if (isNaN(newOrder) || newOrder < 1) { 
            toast('⚠️ Enter valid number (1+)', 'error'); 
            await loadData();
            if (type === 'sub') renderSubCategories($('contentArea'));
            else renderCategories($('contentArea'));
            return; 
        }
        
        try {
            var targetCat = allCategories.find(function(c) { return c.id === id; });
            if (!targetCat) { toast('❌ Not found', 'error'); return; }
            
            var sameGroupCats = type === 'sub' 
                ? allCategories.filter(function(c) { return c.parent_id && c.parent_id === targetCat.parent_id; })
                : allCategories.filter(function(c) { return !c.parent_id; });
            
            sameGroupCats.sort(function(a, b) { 
                return (a.display_order || 999) - (b.display_order || 999); 
            });
            
            var remaining = sameGroupCats.filter(function(c) { return c.id !== id; });
            var insertIdx = Math.min(newOrder - 1, remaining.length);
            if (insertIdx < 0) insertIdx = 0;
            remaining.splice(insertIdx, 0, targetCat);
            
            for (var i = 0; i < remaining.length; i++) {
                var newPos = i + 1;
                if ((remaining[i].display_order || 999) !== newPos) {
                    await sb.from('categories').update({display_order: newPos}).eq('id', remaining[i].id);
                }
            }
            
            toast('✅ Order #' + newOrder);
            bustCategoryCache();
            await loadData();
            if (type === 'sub') renderSubCategories($('contentArea'));
            else renderCategories($('contentArea'));
        } catch(e) { 
            toast('❌ ' + e.message, 'error'); 
        }
    };

    // ═══ UPDATED: Auto-assign order if empty + auto-shift on insert ═══
    window.saveCategory = async function() {
        var name = $('catName').value.trim();
        var section = $('catSection').value;
        var type = $('catType').value;
        var parentId = type === 'sub' ? ($('catParent')?.value || null) : null;
        var orderInput = parseInt($('catOrder')?.value) || 0;
        if(!name || !section) { toast('Fill fields', 'error'); return; }
        if(type === 'sub' && !parentId) { toast('Select parent', 'error'); return; }
        var imageUrl = '';
        if(catImageFile) { imageUrl = await uploadCompressedImage(catImageFile, 'category-images', 'cat_' + (catEditId || 'new')); if(!imageUrl) return; }
        
        // Build sibling list (excluding current cat if editing)
        var siblings = type === 'sub'
            ? allCategories.filter(function(c) { return c.parent_id === parentId && c.id !== catEditId; })
            : allCategories.filter(function(c) { return !c.parent_id && c.id !== catEditId; });
        siblings.sort(function(a, b) { return (a.display_order || 999) - (b.display_order || 999); });
        
        // Auto-assign order if empty/0
        if (orderInput < 1) orderInput = siblings.length + 1;
        if (orderInput > siblings.length + 1) orderInput = siblings.length + 1;
        
        var data = { name: name, section: section, parent_id: parentId, is_active: true, display_order: orderInput };
        if(imageUrl) data.image_url = imageUrl;
        
        try {
            var savedId = catEditId;
            if(catEditId) { 
                var r = await sb.from('categories').update(data).eq('id', catEditId).select();
                if(r.error) throw new Error(r.error.message);
            }
            else { 
                var r2 = await sb.from('categories').insert([data]).select();
                if(r2.error) throw new Error(r2.error.message);
                savedId = r2.data[0].id;
            }
            
            // Auto-shift: insert at target, re-sequence all siblings
            var orderedList = [];
            var inserted = false;
            for (var i = 0; i < siblings.length; i++) {
                if (!inserted && (i + 1) === orderInput) {
                    orderedList.push({ id: savedId, display_order: orderInput });
                    inserted = true;
                }
                orderedList.push(siblings[i]);
            }
            if (!inserted) orderedList.push({ id: savedId, display_order: orderInput });
            
            for (var j = 0; j < orderedList.length; j++) {
                var newPos = j + 1;
                var item = orderedList[j];
                if ((item.display_order || 0) !== newPos) {
                    await sb.from('categories').update({display_order: newPos}).eq('id', item.id);
                }
            }

    window.deleteCategory = async function(id) {

        if(!cat) { toast('Category not found', 'error'); return; }
        var subCats = allCategories.filter(function(c) { return c.parent_id === id; });

            if(currentSection === 'subcategories') renderSubCategories($('contentArea'));

    function renderProducts(c) {
        var filtered = allProducts;
        if (searchProducts) {

                var name = (p.name || '').toLowerCase();
                var shop = (getShopName(p.shop_id) || '').toLowerCase();
                var cat = (getCatName(p.category_id) || '').toLowerCase();

        }
        
        var deleteRequests = filtered.filter(function(p) { return p.delete_requested === true; });

        function productCard(p) {
            var img = getImageUrl((p.images && p.images[0]) || p.image_url, 250);

            var offerPrice = parseFloat(p.offer_price) || null;

            h += '<div class="card-item-body"><div class="card-item-title">' + esc(p.name) + '</div>';
            h += '<div class="card-item-subtitle">₹' + displayPrice.toLocaleString('en-IN');
            if(offerPrice && offerPrice < actualPrice) h += ' <s>₹' + actualPrice.toLocaleString('en-IN') + '</s>';
            h += ' | ' + esc(shopName) + '</div>';
            if(p.delete_requested) h += '<div class="delete-req-badge">⏳ Delete Requested</div>';
            if(p.is_featured) h += '<div class="featured-badge">⭐ Featured</div>';
            if(p.is_offer) h += '<div class="featured-badge" style="background:#FFF8EB;color:#D97706;">🎁 ' + esc(p.offer_tag || 'Offer') + '</div>';
            h += '<div style="display:flex;gap:4px;flex-wrap:wrap;">';
            h += '<button class="btn btn-warning btn-sm" onclick="showProductEditModal(\'' + p.id + '\')">✏️ Edit</button>';
            if(p.is_featured) h += '<button class="btn btn-outline btn-sm" onclick="toggleFeatured(\'' + p.id + '\',false)">Unfeature</button>';
            else h += '<button class="btn btn-warning btn-sm" onclick="toggleFeatured(\'' + p.id + '\',true)">⭐</button>';
            if(p.delete_requested) {
                h += '<button class="btn btn-success btn-sm" onclick="approveDeleteRequest(\'' + p.id + '\')">✅</button>';
                h += '<button class="btn btn-outline btn-sm" onclick="rejectDeleteRequest(\'' + p.id + '\')">↩️</button>';
            }
            h += '<button class="btn btn-danger btn-sm" onclick="deleteProduct(\'' + p.id + '\')">🗑️</button>';
            h += '</div></div></div>';
            return h;
        }
        
        var deleteHtml = deleteRequests.map(productCard).join('');
        var featuredHtml = featuredProducts.map(productCard).join('');
        var normalHtml = normalProducts.map(productCard).join('');
        var bulkBtn = deleteRequests.length > 1 ? '<button class="btn btn-success btn-lg" onclick="bulkApproveDeleteRequests()">✅ Approve ALL (' + deleteRequests.length + ')</button>' : '';
        
        c.innerHTML = 
        '<div style="padding:0 12px;">' + renderSearchBar('searchProductsInput', 'Search products by name, shop, category...', searchProducts, 'filterProducts') + '</div>' +
        '<div class="search-count" style="padding:0 12px;">Showing ' + filtered.length + ' of ' + allProducts.length + ' products</div>' +
        (deleteRequests.length > 0 ? 
        '<div class="content-card" style="border:2px solid #F59E0B;"><div class="card-header" style="background:#FFF8EB;"><h2>⏳ Delete Requests (' + deleteRequests.length + ')</h2>' + bulkBtn + '</div>' +
        '<div class="card-grid">' + deleteHtml + '</div></div>' : '') +
        '<div class="content-card"><div class="card-header"><h2>⭐ Featured (' + featuredProducts.length + ')</h2></div>' +
        '<div class="card-grid">' + (featuredHtml || '<div class="empty-state"><i class="fas fa-star"></i><p>No featured</p></div>') + '</div></div>' +
        '<div class="content-card"><div class="card-header"><h2>📦 All Products (' + normalProducts.length + ')</h2></div>' +
        '<div class="card-grid">' + (normalHtml || '<div class="empty-state"><i class="fas fa-box"></i><p>No products</p></div>') + '</div></div>';
    }
    
    window.showProductEditModal = async function(id) {
        var p = allProducts.find(function(x) { return x.id === id; });
        if(!p) { toast('Product not found — refresh', 'error'); return; }
        
        editProductExistingImages = [];
        editProductNewBlobs = [];
        editProductRemovedImages = [];
        
        function extractImages(rawImages, fallbackUrl) {
            var result = [];
            if (Array.isArray(rawImages) && rawImages.length > 0) {
                rawImages.forEach(function(img) {
                    if (img && typeof img === 'string' && img.length > 5) result.push(img);
                    else if (img && typeof img === 'object' && img.url) result.push(img.url);
                });
                return result;
            }
            if (typeof rawImages === 'string' && rawImages.length > 2) {
                try {
                    var parsed = JSON.parse(rawImages);
                    if (Array.isArray(parsed)) {
                        parsed.forEach(function(img) {
                            if (img && typeof img === 'string' && img.length > 5) result.push(img);
                        });
                        return result;
                    }
                } catch(e) {}
                if (rawImages.indexOf('http') === 0 || rawImages.indexOf('/') === 0 || rawImages.indexOf('product-images') !== -1) {
                    result.push(rawImages);
                }
            }
            if (result.length === 0 && fallbackUrl && typeof fallbackUrl === 'string') {
                result.push(fallbackUrl);
            }
            return result;
        }
        
        editProductExistingImages = extractImages(p.images, p.image_url);
        
        if (editProductExistingImages.length === 0) {
            try {
                var fresh = await sb.from('products').select('images, image_url').eq('id', id).maybeSingle();
                if (fresh && fresh.data) {
                    editProductExistingImages = extractImages(fresh.data.images, fresh.data.image_url);
                }
            } catch(e) {}
        }
        
        var html = '<div class="modal-header"><h3>✏️ Edit Product</h3><button class="modal-close" onclick="closeModal()">✕</button></div>';
        html += '<div class="form-group"><label class="form-label">Name</label><input type="text" id="editProdName" class="form-control" value="' + esc(p.name) + '"></div>';
        html += '<div class="form-row"><div class="form-half"><label class="form-label">Price ₹</label><input type="number" id="editProdPrice" class="form-control" value="' + (p.price || '') + '"></div>';
        html += '<div class="form-half"><label class="form-label">Offer Price</label><input type="number" id="editProdOffer" class="form-control" value="' + (p.offer_price || '') + '"></div></div>';
        html += '<div class="form-row"><div class="form-half"><label class="form-label">Stock</label><input type="number" id="editProdStock" class="form-control" value="' + (p.stock || 0) + '"></div>';
        html += '<div class="form-half"><label class="form-label">Category</label><select id="editProdCat" class="form-control">';
        allCategories.forEach(function(cat) { html += '<option value="' + cat.id + '"' + (p.category_id === cat.id ? ' selected' : '') + '>' + esc(cat.name) + '</option>'; });
        html += '</select></div></div>';
        
        html += '<div class="form-group" style="margin-top:16px;background:#F0FDF4;border:2px solid #86EFAC;border-radius:12px;padding:14px;">';
        html += '<label class="form-label" style="color:#065F46;font-size:13px;font-weight:700;">📸 Product Photos (' + editProductExistingImages.length + ')</label>';
        html += '<div class="prod-edit-img-grid" id="editProdImgGrid"></div>';
        html += '<input type="file" id="editProdNewImages" accept="image/*" multiple style="display:none" onchange="handleEditProdImages(this)">';
        html += '<button type="button" style="width:100%;padding:14px;margin-top:10px;background:var(--brand-green);color:white;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;" onclick="document.getElementById(\'editProdNewImages\').click()">📸 Upload New Photos</button>';
        html += '<div style="font-size:10px;color:#059669;text-align:center;margin-top:6px;font-weight:600;">✅ Auto-compress: 80-90 KB</div>';
        html += '<div id="editProdNewPreview" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;"></div>';
        html += '</div>';
        
        html += '<div class="form-group" style="background:#FFF8EB;padding:12px;border-radius:12px;border:2px solid #FDE68A;">';
        html += '<label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;font-weight:600;">';
        html += '<input type="checkbox" id="editProdOfferCheck" onchange="toggleEditOfferFields()" style="width:18px;height:18px;"' + (p.is_offer ? ' checked' : '') + '>';
        html += '🎁 Offer Product</label>';
        html += '<div id="editOfferFields" style="' + (p.is_offer ? 'display:block;' : 'display:none;') + 'margin-top:10px;">';
        html += '<input type="text" id="editProdOfferTag" class="form-control" value="' + esc(p.offer_tag || '') + '" placeholder="e.g. Free Bucket">';
        html += '</div></div>';
        
        html += '<div class="form-group"><label class="form-label">Featured</label><label class="toggle-switch"><input type="checkbox" id="editProdFeatured" ' + (p.is_featured ? 'checked' : '') + '><span class="toggle-slider"></span></label></div>';
        html += '<div class="form-group"><label class="form-label">On Hold</label><label class="toggle-switch"><input type="checkbox" id="editProdHold" ' + (p.is_on_hold ? 'checked' : '') + '><span class="toggle-slider"></span></label></div>';
        html += '<button class="btn btn-primary" style="width:100%;padding:14px;font-size:14px;" onclick="saveProductEdit(\'' + p.id + '\')">💾 Save Changes</button>';
        showModal(html);
        
        setTimeout(function() { renderEditProdImgGrid(); }, 100);
    };
    
    function renderEditProdImgGrid() {
        var grid = $('editProdImgGrid');
        if(!grid) return;
        var h = '';
        if(editProductExistingImages.length === 0) {
            h = '<div class="prod-edit-img-empty">No photos yet</div>';
        } else {
            for(var i = 0; i < editProductExistingImages.length; i++) {
                var url = editProductExistingImages[i];
                var displayUrl = getImageUrl(url, 200);
                h += '<div class="prod-edit-img-item">';
                h += '<img src="' + displayUrl + '" loading="lazy" decoding="async" onerror="this.style.display=\'none\'">';
                h += '<button type="button" class="remove-btn" onclick="removeEditProdImage(' + i + ')">✕</button>';
                h += '</div>';
            }
        }
        grid.innerHTML = h;
    }
    
    window.removeEditProdImage = function(index) {
        if(index < 0 || index >= editProductExistingImages.length) return;
        editProductRemovedImages.push(editProductExistingImages.splice(index, 1)[0]);
        renderEditProdImgGrid();
        toast('🗑️ Photo removed');
    };
    
    window.handleEditProdImages = async function(input) {
        var files = input.files;
        if(!files || files.length === 0) return;
        var limitedCount = Math.min(files.length, 4);
        var promises = [];
        for(var i = 0; i < limitedCount; i++) promises.push(compressImage(files[i]));
        try {
            var compressed = await Promise.all(promises);
            for(var j = 0; j < compressed.length; j++) editProductNewBlobs.push(compressed[j]);
            var preview = $('editProdNewPreview');
            if(preview) {
                preview.innerHTML = '';
                for(var k = 0; k < editProductNewBlobs.length; k++) {
                    var sizeKB = Math.round(editProductNewBlobs[k].size / 1024);
                    var color = sizeKB >= 80 && sizeKB <= 90 ? '#059669' : '#D97706';
                    preview.innerHTML += '<div style="text-align:center;"><img src="' + URL.createObjectURL(editProductNewBlobs[k]) + '" style="width:70px;height:70px;object-fit:cover;border-radius:8px;border:2px solid ' + color + ';"><div style="font-size:9px;color:' + color + ';font-weight:600;margin-top:2px;">' + sizeKB + ' KB</div></div>';
                }
            }
            toast('📸 ' + compressed.length + ' new photo(s) ready');
            input.value = '';
        } catch(e) { toast('❌ Image processing failed', 'error'); }
    };
    
    window.toggleEditOfferFields = function() {
        var checkbox = $('editProdOfferCheck');
        var fields = $('editOfferFields');
        if(checkbox && fields) fields.style.display = checkbox.checked ? 'block' : 'none';
    };
    
    window.saveProductEdit = async function(id) {
        var name = $('editProdName').value.trim();
        var price = parseFloat($('editProdPrice').value) || 0;
        var offer = parseFloat($('editProdOffer').value) || null;
        var stock = parseInt($('editProdStock').value) || 0;
        var catId = $('editProdCat').value;
        var isFeatured = $('editProdFeatured').checked;
        var isOnHold = $('editProdHold').checked;
        var isOffer = $('editProdOfferCheck') ? $('editProdOfferCheck').checked : false;
        var offerTag = isOffer && $('editProdOfferTag') ? $('editProdOfferTag').value.trim() : null;
        
        try {
            var newImageUrls = [];
            if (editProductNewBlobs.length > 0) {
                var uploadPromises = [];
                for (var i = 0; i < editProductNewBlobs.length; i++) uploadPromises.push(uploadCompressedImage(editProductNewBlobs[i], 'product-images', 'prod_' + id + '_' + i));
                var uploaded = await Promise.all(uploadPromises);
                for (var j = 0; j < uploaded.length; j++) if (uploaded[j]) newImageUrls.push(uploaded[j]);
            }
            
            var finalImages = editProductExistingImages.concat(newImageUrls);
            
            var updateData = {
                name: name, price: price, offer_price: offer, stock: stock, category_id: catId,
                is_featured: isFeatured, is_on_hold: isOnHold, is_offer: isOffer, offer_tag: offerTag,
                images: finalImages
            };
            
            var updateRes = await sb.from('products').update(updateData).eq('id', id).select();
            if (updateRes.error) throw new Error(updateRes.error.message);
            if (!updateRes.data || updateRes.data.length === 0) throw new Error('Update failed — RLS');
            
            for (var k = 0; k < editProductRemovedImages.length; k++) {
                try {
                    var url = editProductRemovedImages[k];
                    if (url && url.indexOf('product-images/') !== -1) {
                        var path = url.split('product-images/')[1];
                        await sb.storage.from('product-images').remove([path]);
                    }
                } catch(e) {}
            }
            
            toast('✅ Product updated!');
            closeModal();
            editProductExistingImages = []; editProductNewBlobs = []; editProductRemovedImages = [];
            await loadData();
            renderProducts($('contentArea'));
        } catch(e) { toast('❌ ' + e.message, 'error'); }
    };
    
    window.bulkApproveDeleteRequests = async function() {
        var ids = allProducts.filter(function(p) { return p.delete_requested === true; }).map(function(p) { return p.id; });
        if(!ids.length) return;
        if(!confirm('Approve ALL ' + ids.length + ' delete requests?')) return;
        await sb.from('products').delete().in('id', ids);
        toast('✅ Deleted!'); 
        await loadData(); 
        renderProducts($('contentArea'));
    };
    
    window.approveDeleteRequest = async function(id) { if(!confirm('Delete this product?')) return; await sb.from('products').delete().eq('id', id); toast('Deleted'); await loadData(); renderProducts($('contentArea')); };
    window.rejectDeleteRequest = async function(id) { await sb.from('products').update({delete_requested: false}).eq('id', id); toast('Rejected'); await loadData(); renderProducts($('contentArea')); };
    window.toggleFeatured = async function(id, f) { await sb.from('products').update({is_featured: f}).eq('id', id); toast('Done!'); await loadData(); renderProducts($('contentArea')); };
    window.deleteProduct = async function(id) { if(!confirm('Delete product?')) return; await sb.from('products').delete().eq('id', id); toast('Deleted'); await loadData(); renderProducts($('contentArea')); };

    window.handleSliderImage = function(input) {

    window.saveSlider = async function(id) {
        var title = $('sliderTitle').value.trim() || 'Slider';
        var link = $('sliderLink').value.trim() || '#';
        var order = parseInt($('sliderOrder').value) || 0;
        var imageUrl = '';

        var data = { title: title, link: link, display_order: order };
        if(imageUrl) data.image_url = imageUrl;
        try {
            if(id) { var r = await sb.from('sliders').update(data).eq('id', id).select(); if(r.error) throw new Error(r.error.message); toast('Updated!'); }
            else { var r2 = await sb.from('sliders').insert([data]).select(); if(r2.error) throw new Error(r2.error.message); toast('Added!'); }

            await loadData(); renderSliders($('contentArea'));
        } catch(e) { toast('❌ ' + e.message, 'error'); }

    window.deleteSlider = async function(id) { if(!confirm('Delete slider?')) return; await sb.from('sliders').delete().eq('id', id); toast('Deleted'); await loadData(); renderSliders($('contentArea')); };
    
    function renderNotifications(c) {

        html += '<div class="form-group"><label class="form-label">🔗 Link (optional)</label><input type="text" id="notifLink" class="form-control" placeholder="e.g. products.html?offer=true"></div>';
        html += '<button class="btn btn-primary" style="width:100%;padding:14px;font-size:14px;" onclick="sendNotification()">📨 Send to All Users</button>';
        html += '</div></div>';
        
        html += '<div class="content-card"><div class="card-header"><h2>📋 Recent (' + allNotifications.length + ')</h2></div><div style="padding:12px;">';
        if (allNotifications.length > 0) {
            allNotifications.slice(0, 10).forEach(function(n) {
                html += '<div style="padding:10px;border:1px solid var(--neutral-border);border-radius:10px;margin-bottom:6px;">';
                html += '<div style="font-weight:700;font-size:12px;">' + esc(n.title || 'No Title') + '</div>';
                html += '<div style="font-size:11px;color:#6B7280;margin-top:2px;">' + esc(n.message || '') + '</div>';
                html += '</div>';
            });
        } else {
            html += '<div class="empty-state"><i class="fas fa-bell-slash"></i><p>No notifications</p></div>';
        }
        html += '</div></div>';
        c.innerHTML = html;
    }
    
    window.sendNotification = async function() {
        var title = ($('notifTitle')?.value || '').trim();
        var message = ($('notifMessage')?.value || '').trim();
        var linkUrl = ($('notifLink')?.value || '').trim();
        if (!title || !message) { toast('⚠️ Fill title and message', 'error'); return; }
        var btn = document.querySelector('.btn-primary[onclick="sendNotification()"]');
        if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...'; }
        try {
            var notifData = { title: title, message: message, created_at: new Date().toISOString(), is_global: true };
            if (linkUrl) notifData.link_url = linkUrl;
            await sb.from('notifications').insert([notifData]);
            var sessionRes = await sb.auth.getSession();
            var token = (sessionRes && sessionRes.data && sessionRes.data.session && sessionRes.data.session.access_token) ? sessionRes.data.session.access_token : CONFIG.SUPABASE_KEY;
            await fetch(CONFIG.SUPABASE_URL + '/functions/v1/send-notification', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'apikey': CONFIG.SUPABASE_KEY, 'Authorization': 'Bearer ' + token},
                body: JSON.stringify({title: title, message: message, link_url: linkUrl || '', send_type: 'all', user_ids: []})
            });
            toast('✅ Sent!');
            if ($('notifTitle')) $('notifTitle').value = '';
            if ($('notifMessage')) $('notifMessage').value = '';
            if ($('notifLink')) $('notifLink').value = '';
            await loadData();
            renderNotifications($('contentArea'));
        } catch(e) { toast('❌ ' + (e.message || 'Failed'), 'error'); if (btn) { btn.disabled = false; btn.innerHTML = '📨 Send to All Users'; } }
    };
    
    function renderDeliverySettings(c) {
        var ds = deliverySettingsData || {};
        var plan1m = getAppSetting('plan_1m_fee', '499');
        var plan6m = getAppSetting('plan_6m_fee', '1999');
        var plan12m = getAppSetting('plan_12m_fee', '3500');
        
        var html = '<div class="content-card"><div class="card-header"><h2>🕐 Delivery Settings</h2></div><div style="padding:16px;">';
        html += '<div class="form-row"><div class="form-half"><label class="form-label">Start Time</label><input type="time" id="deliveryStart" class="form-control" value="' + (ds.opening_time || '08:00').substring(0,5) + '"></div>';
        html += '<div class="form-half"><label class="form-label">End Time</label><input type="time" id="deliveryEnd" class="form-control" value="' + (ds.closing_time || '20:00').substring(0,5) + '"></div></div>';
        html += '<div class="form-row"><div class="form-half"><label class="form-label">Delivery Minutes</label><input type="number" id="deliveryMinutes" class="form-control" value="' + (ds.delivery_time_minutes || 10) + '"></div>';
        html += '<div class="form-half"><label class="form-label">Delivery Fee ₹</label><input type="number" id="deliveryFee" class="form-control" value="' + (ds.delivery_charge || 40) + '"></div></div>';
        html += '<div class="form-row"><div class="form-half"><label class="form-label">Free Above ₹</label><input type="number" id="freeDeliveryAbove" class="form-control" value="' + (ds.free_delivery_above || 299) + '"></div>';
        html += '<div class="form-half"><label class="form-label">Min Order ₹</label><input type="number" id="minOrderAmount" class="form-control" value="' + (ds.min_order_amount || 0) + '"></div></div>';
        html += '<div class="form-group"><label class="form-label">🏖️ Holiday Mode</label><label class="toggle-switch"><input type="checkbox" id="isHoliday" ' + (ds.is_holiday ? 'checked' : '') + '><span class="toggle-slider"></span></label></div>';
        html += '<div class="form-group" id="holidayReasonGroup" style="display:' + (ds.is_holiday ? 'block' : 'none') + ';"><label class="form-label">Reason</label><input type="text" id="holidayReason" class="form-control" value="' + esc(ds.holiday_reason || '') + '"></div>';
        html += '<div class="form-group"><label class="form-label">🔓 Shop Open</label><label class="toggle-switch"><input type="checkbox" id="isShopOpen" ' + (ds.is_open !== false ? 'checked' : '') + '><span class="toggle-slider"></span></label></div>';
        html += '<button class="btn btn-primary" style="width:100%;padding:12px;" onclick="saveDeliverySettings()">💾 Save Delivery Settings</button></div></div>';
        
        html += '<div class="content-card"><div class="card-header"><h2>💰 Shop Registration Plans</h2></div><div style="padding:16px;">';
        html += '<p style="font-size:11px;color:#6B7280;margin-bottom:14px;">ℹ️ GST 18% upar se lagega.</p>';
        
        html += '<div class="plan-fee-card"><div class="plan-fee-card-title"><i class="fas fa-calendar-day"></i> 📅 1 Month Plan</div>';
        html += '<input type="number" id="plan1mFee" class="plan-fee-input" value="' + plan1m + '" oninput="updatePlanTotal(\'1m\',this.value)">';
        html += '<div class="plan-fee-total">Total with GST: <span id="plan1mTotal">₹' + (parseFloat(plan1m)*1.18).toFixed(2) + '</span></div></div>';
        
        html += '<div class="plan-fee-card"><div class="plan-fee-card-title"><i class="fas fa-calendar-alt"></i> 📆 6 Months Plan (Popular)</div>';
        html += '<input type="number" id="plan6mFee" class="plan-fee-input" value="' + plan6m + '" oninput="updatePlanTotal(\'6m\',this.value)">';
        html += '<div class="plan-fee-total">Total with GST: <span id="plan6mTotal">₹' + (parseFloat(plan6m)*1.18).toFixed(2) + '</span></div></div>';
        
        html += '<div class="plan-fee-card"><div class="plan-fee-card-title"><i class="fas fa-calendar-check"></i> 🗓️ 12 Months Plan (Best Value)</div>';
        html += '<input type="number" id="plan12mFee" class="plan-fee-input" value="' + plan12m + '" oninput="updatePlanTotal(\'12m\',this.value)">';
        html += '<div class="plan-fee-total">Total with GST: <span id="plan12mTotal">₹' + (parseFloat(plan12m)*1.18).toFixed(2) + '</span></div></div>';
        
        html += '<button class="btn btn-success" style="width:100%;padding:14px;font-size:14px;margin-top:12px;" onclick="savePlanFees()">💾 Save All Plan Fees</button></div></div>';
        
        c.innerHTML = html;
        var hEl = $('isHoliday');
        if (hEl) hEl.addEventListener('change', function() { var rg = $('holidayReasonGroup'); if(rg) rg.style.display = this.checked ? 'block' : 'none'; });
    }
    
    window.updatePlanTotal = function(plan, val) {
        var v = parseFloat(val) || 0;
        var totalEl = $('plan' + plan + 'Total');
        if (totalEl) totalEl.textContent = '₹' + (v * 1.18).toFixed(2);
    };
    
    window.savePlanFees = async function() {
        var fees = {
            'plan_1m_fee': parseInt($('plan1mFee').value) || 499,
            'plan_6m_fee': parseInt($('plan6mFee').value) || 1999,
            'plan_12m_fee': parseInt($('plan12mFee').value) || 3500
        };
        try {
            for (var key in fees) {
                if (!fees.hasOwnProperty(key)) continue;
                var existing = allAppSettings.find(function(s) { return s.key === key; });
                if (existing) {
                    await sb.from('app_settings').update({value: String(fees[key])}).eq('key', key);
                } else {
                    await sb.from('app_settings').insert([{key: key, value: String(fees[key])}]);
                }
            }
            toast('✅ Plan fees updated!');
            await loadData();
            renderDeliverySettings($('contentArea'));
        } catch(e) { toast('❌ ' + e.message, 'error'); }
    };
    
    window.saveDeliverySettings = async function() {
        var startTime = ($('deliveryStart').value || '08:00').substring(0, 5);
        var endTime = ($('deliveryEnd').value || '20:00').substring(0, 5);
        var data = {
            opening_time: startTime + ':00', closing_time: endTime + ':00',
            delivery_time_minutes: parseInt($('deliveryMinutes').value) || 10,
            delivery_charge: parseInt($('deliveryFee').value) || 0,
            free_delivery_above: parseInt($('freeDeliveryAbove').value) || 0,
            min_order_amount: parseInt($('minOrderAmount').value) || 0,
            is_holiday: $('isHoliday').checked,
            holiday_reason: $('isHoliday').checked ? ($('holidayReason')?.value || '').trim() : null,
            holiday_date: $('isHoliday').checked ? new Date().toISOString().split('T')[0] : null,
            is_open: $('isShopOpen').checked,
            is_active: true, updated_at: new Date().toISOString()
        };
        try {
            var insertRes = await sb.from('delivery_settings').insert([data]).select();
            if (insertRes.error) throw new Error(insertRes.error.message);
            if (insertRes.data && insertRes.data[0]) await sb.from('delivery_settings').delete().neq('id', insertRes.data[0].id);
            toast('✅ Saved!');
            await loadData();
            renderDeliverySettings($('contentArea'));
        } catch(e) { toast('❌ ' + e.message, 'error'); }
    };
    
    function showModal(html) {
        closeModal();
        var overlay = document.createElement('div');
        overlay.className = 'modal-overlay show';
        overlay.id = 'modalContainer';
        overlay.innerHTML = '<div class="modal-container">' + html + '</div>';
        overlay.addEventListener('click', function(e) { if(e.target === overlay) closeModal(); });
        document.body.appendChild(overlay);
    }
    
    window.closeModal = function() { 
        var m = $('modalContainer'); 
        if(m) m.remove(); 
        catImageFile = null; 
        window._sliderImageFile = null; 
        editProductExistingImages = [];
        editProductNewBlobs = [];
        editProductRemovedImages = [];
    };
    
    window.handleLogout = async function() { 
        if(sessionRefreshTimer) clearInterval(sessionRefreshTimer);
        if(autoRefreshTimer) clearInterval(autoRefreshTimer);
        try { await sb.auth.signOut(); } catch(e) {}
        ['zymart_session','zymart_user_role','zymart_user_phone','zymart_token'].forEach(function(k) { localStorage.removeItem(k); });
        try { var keys = Object.keys(localStorage); for (var i = 0; i < keys.length; i++) if (keys[i].indexOf('sb-') === 0) localStorage.removeItem(keys[i]); } catch(e) {}
        try { sessionStorage.clear(); } catch(e) {}
        window.location.replace('index.html'); 
    };
    
    async function checkSession() {
        try {
            var res = await sb.auth.getSession();
            if(res && res.data && res.data.session) {
                if (res.data.session.user.email === 'sk12shaikh@gmail.com') {
                    currentAdmin = res.data.session.user;
                    await loadData();
                    renderApp();
                    showApp();
                    return;
                }
                var prof = await safeFetch(function() { return sb.from('users').select('role').eq('email', res.data.session.user.email).maybeSingle(); });
                var role = prof.data ? prof.data.role : null;
                if(role === 1 || role === '1' || role === 'admin' || role === 'Admin') {
                    currentAdmin = res.data.session.user;
                    await loadData();
                    renderApp();
                    showApp();
                    return;
                }
                window.location.href = 'index.html';
                return;
            }
            try {
                var localSession = JSON.parse(localStorage.getItem('zymart_session') || 'null');
                var userRole = localStorage.getItem('zymart_user_role') || '';
                if(localSession && localSession.userId && (userRole === 'admin' || userRole === '1' || userRole === 'Admin')) {
                    currentAdmin = { id: localSession.userId, email: localSession.email || 'admin@zymart.com', phone: localSession.phone || '' };
                    await loadData();
                    renderApp();
                    showApp();
                    return;
                }
            } catch(e) {}
            showLogin();
            showApp();
        } catch(e) { showLogin(); showApp(); }
    }
    
    document.addEventListener('DOMContentLoaded', function() { checkSession(); });
