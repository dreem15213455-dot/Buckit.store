<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Zatpat - Admin Panel</title>
    <meta name="theme-color" content="#16A34A">
    
    <link rel="manifest" href="manifest.json">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/compressorjs@1.2.1/dist/compressor.min.js"></script>
    
    <style>
        :root {
            --primary: #16A34A;
            --primary-light: #22C55E;
            --primary-bg-light: #DCFCE7;
            --primary-border-dark: #15803D;
            --accent-orange: #F97316;
            --bg-light: #F9FAFB;
            --card-white: #FFFFFF;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --border-light: #E5E7EB;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-full: 9999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-light); color: var(--text-primary); }
        h1, h2, h3, h4, h5, h6 { font-weight: 800; color: #000000; }

        /* Sidebar */
        .sidebar {
            position: fixed; left: 0; top: 0; width: 280px; height: 100vh;
            background: var(--card-white); border-right: 1px solid var(--border-light);
            z-index: 1000; overflow-y: auto; box-shadow: var(--shadow-sm);
        }
        .sidebar-header {
            padding: 24px 20px; border-bottom: 1px solid var(--border-light);
            background: linear-gradient(135deg, var(--primary-bg-light), white);
        }
        .sidebar-header h2 { font-size: 28px; font-weight: 800; }
        .sidebar-header h2 .normal { color: var(--text-primary); }
        .sidebar-header h2 .pat { color: var(--primary); }
        .sidebar-header p { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
        .sidebar-menu { padding: 16px 12px; }
        .menu-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            border-radius: var(--radius-md); cursor: pointer; transition: all 0.2s;
            color: var(--text-secondary); font-weight: 500; margin-bottom: 4px;
        }
        .menu-item i { width: 22px; font-size: 18px; }
        .menu-item:hover { background: var(--primary-bg-light); color: var(--primary); }
        .menu-item.active { background: var(--primary); color: white; }
        .menu-divider { height: 1px; background: var(--border-light); margin: 16px 0; }

        /* Main Content */
        .main-content { margin-left: 280px; padding: 24px 32px; min-height: 100vh; }
        .admin-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 28px; flex-wrap: wrap; gap: 16px;
        }
        .page-title { font-size: 28px; font-weight: 800; color: #000000; }
        .admin-user {
            display: flex; align-items: center; gap: 16px; background: var(--card-white);
            padding: 8px 20px; border-radius: var(--radius-full); box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
        }
        .admin-avatar {
            width: 40px; height: 40px; background: var(--primary); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: white; font-weight: 700;
        }
        .logout-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 6px; }

        /* Stats Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 32px; }
        .stat-card {
            background: var(--card-white); border-radius: var(--radius-lg); padding: 20px;
            display: flex; align-items: center; gap: 16px; box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
        }
        .stat-icon {
            width: 56px; height: 56px; border-radius: var(--radius-md);
            display: flex; align-items: center; justify-content: center; font-size: 24px; color: white;
        }
        .stat-icon.users { background: linear-gradient(135deg, #3B82F6, #1D4ED8); }
        .stat-icon.shops { background: linear-gradient(135deg, var(--primary), var(--primary-light)); }
        .stat-icon.products { background: linear-gradient(135deg, var(--accent-orange), #EA580C); }
        .stat-icon.orders { background: linear-gradient(135deg, #8B5CF6, #6D28D9); }
        .stat-info h3 { font-size: 28px; font-weight: 800; margin: 0; color: #000000; }
        .stat-info p { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

        /* Content Cards */
        .content-card {
            background: var(--card-white); border-radius: var(--radius-lg);
            border: 1px solid var(--border-light); overflow: hidden; margin-bottom: 24px;
        }
        .card-header {
            padding: 20px 24px; border-bottom: 1px solid var(--border-light);
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-white);
        }
        .card-header h2 { font-size: 18px; font-weight: 800; margin: 0; color: #000000; }

        /* Buttons */
        .btn-primary { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: var(--radius-full); font-weight: 600; font-size: 13px; cursor: pointer; }
        .btn-success { background: var(--success); color: white; border: none; padding: 8px 16px; border-radius: var(--radius-full); font-size: 12px; font-weight: 600; cursor: pointer; }
        .btn-danger { background: var(--danger); color: white; border: none; padding: 8px 16px; border-radius: var(--radius-full); font-size: 12px; font-weight: 600; cursor: pointer; }
        .btn-warning { background: var(--warning); color: white; border: none; padding: 8px 16px; border-radius: var(--radius-full); font-size: 12px; font-weight: 600; cursor: pointer; }
        .btn-sm { padding: 6px 12px; font-size: 11px; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

        /* Tables */
        .table-wrapper { overflow-x: auto; width: 100%; }
        .data-table { width: 100%; border-collapse: collapse; min-width: 600px; }
        .data-table th {
            text-align: left; padding: 14px 16px; background: var(--primary-bg-light);
            font-weight: 700; font-size: 13px; color: #000000; border-bottom: 1px solid var(--border-light);
        }
        .data-table td { padding: 14px 16px; border-bottom: 1px solid var(--border-light); font-size: 13px; }
        .data-table tr:hover { background: var(--bg-light); }

        /* Badges */
        .badge-pending, .badge-approved, .badge-active, .badge-blocked {
            padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; display: inline-block;
        }
        .badge-pending { background: #FEF3C7; color: #D97706; }
        .badge-approved, .badge-active { background: #D1FAE5; color: #059669; }
        .badge-blocked { background: #FEE2E2; color: #DC2626; }

        /* Forms */
        .form-group { margin-bottom: 20px; }
        .form-label { font-weight: 700; font-size: 13px; margin-bottom: 6px; display: block; color: #000000; }
        .form-control {
            width: 100%; padding: 12px 14px; border: 1px solid var(--border-light);
            border-radius: var(--radius-md); font-size: 14px; background: white;
        }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(22,163,74,0.1); }

        /* Image Upload */
        .image-upload-area {
            border: 2px dashed var(--border-light); border-radius: var(--radius-md);
            padding: 20px; text-align: center; cursor: pointer; transition: all 0.2s;
        }
        .image-upload-area:hover { border-color: var(--primary); background: var(--primary-bg-light); }
        .image-preview { max-width: 100%; max-height: 150px; margin-top: 12px; border-radius: var(--radius-md); display: none; }

        /* Search & Tabs */
        .search-box { display: flex; gap: 12px; margin-bottom: 20px; padding: 0 20px; }
        .search-box input { flex: 1; padding: 10px 16px; border: 1px solid var(--border-light); border-radius: var(--radius-full); font-size: 14px; }
        .nav-tabs { display: flex; gap: 10px; padding: 0 20px; border-bottom: 1px solid var(--border-light); margin-bottom: 20px; flex-wrap: wrap; }
        .nav-tabs .btn { padding: 8px 20px; border-radius: var(--radius-full); font-size: 13px; font-weight: 500; cursor: pointer; border: none; background: var(--bg-light); color: var(--text-secondary); }
        .nav-tabs .btn.active { background: var(--primary); color: white; }

        /* Categories Grid */
        .categories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; padding: 20px; }
        .category-card {
            background: var(--bg-light); border-radius: var(--radius-md); padding: 16px;
            text-align: center; border: 1px solid var(--border-light);
        }
        .category-card img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 12px; }
        .category-card strong { color: #000000; }

        /* Offers Grid */
        .offers-cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; padding: 20px; }
        .offer-card-item {
            background: var(--card-white); border: 1px solid var(--border-light);
            border-radius: var(--radius-lg); overflow: hidden; transition: all 0.2s;
        }
        .offer-card-item:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
        .offer-card-img { width: 100%; height: 140px; object-fit: cover; background: linear-gradient(135deg, var(--primary), var(--primary-light)); }
        .offer-card-content { padding: 16px; }
        .offer-card-title { font-weight: 800; font-size: 16px; margin-bottom: 4px; color: #000000; }
        .offer-card-subtitle { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
        .offer-card-badge {
            background: var(--accent-orange); color: white; padding: 4px 10px;
            border-radius: var(--radius-full); font-size: 11px; font-weight: 600; display: inline-block;
        }
        .offer-meta { font-size: 11px; color: var(--text-secondary); margin-top: 8px; }
        .offer-meta i { margin-right: 4px; color: var(--primary); }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 10000;
        }
        .modal-container {
            background: var(--card-white); border-radius: 24px;
            width: 90%; max-width: 600px; max-height: 85vh; overflow-y: auto;
            padding: 28px;
        }
        .modal-container h3 { font-size: 20px; font-weight: 800; margin-bottom: 20px; color: #000000; }
        .modal-buttons { display: flex; gap: 12px; margin-top: 24px; }
        .modal-buttons .btn-primary { flex: 1; }
        .modal-buttons .btn-secondary {
            flex: 1; background: transparent; border: 1px solid var(--border-light);
            padding: 10px; border-radius: var(--radius-full); font-weight: 600; cursor: pointer;
        }

        /* Toast */
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 10001; }
        .toast-message {
            background: white; padding: 14px 20px; border-radius: var(--radius-md);
            margin-bottom: 10px; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 10px;
            border-left: 4px solid; animation: slideIn 0.3s ease;
        }
        .toast-message.success { border-left-color: var(--success); }
        .toast-message.error { border-left-color: var(--danger); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .shop-image { width: 50px; height: 50px; object-fit: cover; border-radius: var(--radius-md); }
        .no-data { text-align: center; padding: 40px; color: var(--text-secondary); }

        @media (max-width: 1024px) {
            .sidebar { width: 80px; }
            .sidebar-header h2, .sidebar-header p, .menu-item span { display: none; }
            .main-content { margin-left: 80px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: 1fr; }
            .main-content { padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>
    
    <div class="sidebar">
        <div class="sidebar-header">
            <h2><span class="normal">Zat</span><span class="pat">pat</span></h2>
            <p>Admin Panel v3.0</p>
        </div>
        <div class="sidebar-menu">
            <div class="menu-item active" data-section="dashboard"><i class="fas fa-chart-pie"></i><span>Dashboard</span></div>
            <div class="menu-divider"></div>
            <div class="menu-item" data-section="shops"><i class="fas fa-store"></i><span>Shops</span></div>
            <div class="menu-item" data-section="users"><i class="fas fa-users"></i><span>Users</span></div>
            <div class="menu-item" data-section="categories"><i class="fas fa-tags"></i><span>Categories</span></div>
            <div class="menu-item" data-section="products"><i class="fas fa-box"></i><span>Products</span></div>
            <div class="menu-item" data-section="hotoffers"><i class="fas fa-fire"></i><span>Hot Offers</span></div>
            <div class="menu-item" data-section="sliders"><i class="fas fa-images"></i><span>Sliders</span></div>
            <div class="menu-item" data-section="sponsored"><i class="fas fa-crown"></i><span>Sponsored</span></div>
            <div class="menu-item" data-section="orders"><i class="fas fa-receipt"></i><span>Orders</span></div>
            <div class="menu-divider"></div>
            <div class="menu-item" data-section="settings"><i class="fas fa-cog"></i><span>Settings</span></div>
            <div class="menu-item" onclick="window.location.href='index.html'"><i class="fas fa-home"></i><span>View Site</span></div>
            <div class="menu-item" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i><span>Logout</span></div>
        </div>
    </div>
    
    <div class="main-content">
        <div class="admin-header">
            <h1 class="page-title" id="pageTitle">Dashboard</h1>
            <div class="admin-user">
                <div class="admin-avatar" id="adminAvatar">A</div>
                <span id="adminEmail">admin@zatpat.com</span>
                <button class="logout-btn" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
        <div id="contentArea"><div style="text-align:center;padding:60px;"><i class="fas fa-spinner fa-spin fa-2x" style="color:var(--primary);"></i><p style="margin-top:16px;">Loading...</p></div></div>
    </div>
    
    <div class="modal-overlay" id="modalOverlay"><div class="modal-container" id="modalContent"></div></div>

    <script>
        // ========== ERROR HANDLING ==========
        window.addEventListener('error', function(e) { console.error('Global error:', e.error); return false; });

        const supabaseUrl = 'https://zwajyovemwdqtkecipeb.supabase.co';
        const supabaseKey = 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let currentAdmin = null;
        let allUsers = [], allShops = [], allProducts = [], allCategories = [], allOffers = [], allSliders = [], allFeaturedShops = [], allOrders = [];
        let appSettings = { registrationFee: 499, deliveryFee: 40, freeDeliveryThreshold: 299 };
        let currentSection = 'dashboard';
        let currentShopFilter = 'all';
        let offerImageFile = null, sliderImageFile = null, categoryImageFile = null, editItemId = null;

        const Toast = {
            show: (message, type = 'success') => {
                const container = document.getElementById('toastContainer');
                if(!container) return;
                const toast = document.createElement('div');
                toast.className = `toast-message ${type}`;
                toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i><span>${escapeHtml(message)}</span>`;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }
        };

        function escapeHtml(text) { if (!text) return ''; return String(text).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]); }

        async function checkAdmin() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) { window.location.href = 'index.html'; return; }
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (!user) { window.location.href = 'index.html'; return; }
                const { data: profile } = await supabaseClient.from('users').select('role, name').eq('id', user.id).maybeSingle();
                if (profile?.role !== 'admin') { Toast.show('Access Denied - Admin only', 'error'); setTimeout(() => window.location.href = 'index.html', 2000); return; }
                currentAdmin = { ...user, ...profile };
                document.getElementById('adminEmail').innerText = user.email || 'admin@zatpat.com';
                document.getElementById('adminAvatar').innerText = (profile?.name || 'A').charAt(0).toUpperCase();
                await loadAllData();
                loadSection('dashboard');
            } catch(e) { console.error('Auth error:', e); }
        }

        async function loadAllData() {
            try {
                const [users, shops, products, categories, offers, sliders, featured, orders] = await Promise.all([
                    supabaseClient.from('users').select('*').order('created_at', { ascending: false }),
                    supabaseClient.from('shops').select('*').order('created_at', { ascending: false }),
                    supabaseClient.from('products').select('*, shops(name)').order('created_at', { ascending: false }),
                    supabaseClient.from('categories').select('*').order('priority'),
                    supabaseClient.from('offers').select('*').order('priority'),
                    supabaseClient.from('sliders').select('*').order('display_order'),
                    supabaseClient.from('featured_shops').select('*, shops(id, name, image_url)'),
                    supabaseClient.from('orders').select('*').order('created_at', { ascending: false })
                ]);
                allUsers = users.data || []; allShops = shops.data || []; allProducts = products.data || [];
                allCategories = categories.data || []; allOffers = offers.data || []; allSliders = sliders.data || [];
                allFeaturedShops = featured.data || []; allOrders = orders.data || [];
            } catch (e) { console.error('Load error:', e); }
        }

        function loadSection(section) {
            currentSection = section;
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            document.querySelector(`[data-section="${section}"]`)?.classList.add('active');
            const titles = { dashboard: 'Dashboard', shops: 'Shop Management', users: 'User Management', categories: 'Categories', products: 'Products', hotoffers: '🔥 Hot Offers', sliders: 'Hero Sliders', sponsored: 'Sponsored Shops', orders: 'Orders', settings: 'Settings' };
            document.getElementById('pageTitle').innerText = titles[section] || section;
            const renderers = { dashboard: renderDashboard, shops: renderShops, users: renderUsers, categories: renderCategories, products: renderProducts, hotoffers: renderHotOffers, sliders: renderSliders, sponsored: renderSponsored, orders: renderOrders, settings: renderSettings };
            if (renderers[section]) renderers[section]();
        }

        function renderDashboard() {
            const pendingShops = allShops.filter(s => s.status === 'pending').length;
            const totalRevenue = allOrders.reduce((sum, o) => sum + (o.total_amount || 0), 0);
            document.getElementById('contentArea').innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-icon users"><i class="fas fa-users"></i></div><div class="stat-info"><h3>${allUsers.length}</h3><p>Total Users</p></div></div>
                    <div class="stat-card"><div class="stat-icon shops"><i class="fas fa-store"></i></div><div class="stat-info"><h3>${allShops.length}</h3><p>Total Shops</p><small>${pendingShops} pending</small></div></div>
                    <div class="stat-card"><div class="stat-icon products"><i class="fas fa-box"></i></div><div class="stat-info"><h3>${allProducts.length}</h3><p>Products</p></div></div>
                    <div class="stat-card"><div class="stat-icon orders"><i class="fas fa-rupee-sign"></i></div><div class="stat-info"><h3>₹${totalRevenue.toLocaleString()}</h3><p>Revenue</p></div></div>
                </div>
                <div class="content-card"><div class="card-header"><h2><i class="fas fa-bolt" style="color:var(--accent-orange);"></i> Quick Actions</h2></div>
                <div style="padding:20px;display:flex;gap:12px;flex-wrap:wrap;"><button class="btn-primary" onclick="loadSection('shops')"><i class="fas fa-store"></i> Manage Shops</button><button class="btn-primary" onclick="loadSection('hotoffers')"><i class="fas fa-fire"></i> Hot Offers</button><button class="btn-primary" onclick="loadSection('settings')"><i class="fas fa-cog"></i> Settings</button></div></div>`;
        }

        function renderShops() {
            document.getElementById('contentArea').innerHTML = `
                <div class="content-card"><div class="card-header"><h2><i class="fas fa-store"></i> Shop Management</h2></div>
                <div class="search-box"><input type="text" id="shopSearch" placeholder="🔍 Search shops..." onkeyup="filterShopsList()"></div>
                <div class="nav-tabs"><button class="btn ${currentShopFilter==='all'?'active':''}" onclick="filterShopStatus('all')">All (${allShops.length})</button><button class="btn ${currentShopFilter==='pending'?'active':''}" onclick="filterShopStatus('pending')">Pending (${allShops.filter(s=>s.status==='pending').length})</button><button class="btn ${currentShopFilter==='approved'?'active':''}" onclick="filterShopStatus('approved')">Approved (${allShops.filter(s=>s.status==='approved').length})</button></div>
                <div id="shopsList"></div></div>`; filterShopsList(); }
        function filterShopStatus(status) { currentShopFilter = status; filterShopsList(); }
        function filterShopsList() {
            const term = document.getElementById('shopSearch')?.value.toLowerCase() || '';
            let filtered = allShops; if (currentShopFilter !== 'all') filtered = allShops.filter(s => s.status === currentShopFilter);
            filtered = filtered.filter(s => (s.name?.toLowerCase().includes(term) || s.owner_name?.toLowerCase().includes(term)));
            const container = document.getElementById('shopsList'); if (!filtered.length) { container.innerHTML = '<div class="no-data">No shops found</div>'; return; }
            let html = '<div class="table-wrapper"><table class="data-table"><thead><tr><th>Image</th><th>Shop</th><th>Owner</th><th>Phone</th><th>Status</th><th>Actions</th></tr></thead><tbody>';

        window.toggleTargetSelector = function(){
            const applyTo = document.getElementById('offerApplyTo')?.value || 'global';

            const catDiv = document.getElementById('categoryTarget');
            const prodDiv = document.getElementById('productTarget');

            if(targetDiv) targetDiv.style.display = applyTo === 'global' ? 'none' : 'block';
            if(catDiv) catDiv.style.display = applyTo === 'category' ? 'block' : 'none';

            if(shopDiv) shopDiv.style.display = applyTo === 'shop' ? 'block' : 'none';
        };

        function handleOfferImage(input){ 
            const f = input.files[0]; 
            if(f){ 
                offerImageFile = f;

        async function saveOfferCard(){
            const title = document.getElementById('offerTitle')?.value.trim();
            const value = parseFloat(document.getElementById('offerValue')?.value);
            if(!title || isNaN(value)){ Toast.show('Title and discount value required','error'); return; }
            
            const applyTo = document.getElementById('offerApplyTo')?.value || 'global';
            let targetId = null;
            
            if(applyTo === 'category') targetId = document.getElementById('offerCategory')?.value;
            else if(applyTo === 'product') targetId = document.getElementById('offerProduct')?.value;
            else if(applyTo === 'shop') targetId = document.getElementById('offerShop')?.value;
            
            if(applyTo !== 'global' && !targetId){ Toast.show(`Please select a ${applyTo}`,'error'); return; }
            
            let imageUrl = document.getElementById('offerImagePreview')?.src;
            if(offerImageFile && !imageUrl.startsWith('data:')){ 
                const compressed = await compressImage(offerImageFile); 
                const fileName = `offers/${Date.now()}.jpg`; 
                await supabaseClient.storage.from('offer-images').upload(fileName, compressed); 
                const { data: { publicUrl } } = supabaseClient.storage.from('offer-images').getPublicUrl(fileName); 
                imageUrl = publicUrl; 
            }
            
            const data = { 
                title, 
                subtitle: document.getElementById('offerSubtitle')?.value || '',
                discount_value: value, 
                discount_type: document.getElementById('offerType')?.value || 'percentage',
                apply_to: applyTo, 
                target_id: targetId, 
                min_order_amount: parseFloat(document.getElementById('offerMinOrder')?.value) || 0, 
                max_discount: parseFloat(document.getElementById('offerMaxDiscount')?.value) || 0, 
                image_url: imageUrl, 
                link: document.getElementById('offerLink')?.value || '',
                is_active: true, 
                priority: 1 
            };
            
            if(editItemId){ 
                await supabaseClient.from('offers').update(data).eq('id', editItemId); 
                Toast.show('✅ Offer updated!'); 
            } else { 
                await supabaseClient.from('offers').insert([data]); 
                Toast.show('🎉 Offer added!'); 
            }
            hideModal(); 
            await loadAllData(); 
            renderHotOffers();
        }

        function renderSponsored() {
            const approvedShops=allShops.filter(s=>s.status==='approved'); const featuredIds=allFeaturedShops.map(f=>f.shop_id); const available=approvedShops.filter(s=>!featuredIds.includes(s.id));
            document.getElementById('contentArea').innerHTML = `<div class="content-card"><div class="card-header"><h2><i class="fas fa-crown" style="color:#F59E0B;"></i> Sponsored Shops</h2></div><div style="padding:20px;"><div class="form-group"><label class="form-label">Add Shop to Sponsored</label><select id="sponsoredShopSelect" class="form-control"><option value="">Select Shop</option>${available.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('')}</select><button class="btn-primary" style="margin-top:12px;" onclick="addSponsoredShop()"><i class="fas fa-plus"></i> Add to Sponsored</button></div><h4 style="margin-top:24px;margin-bottom:12px;">Current Sponsored (${allFeaturedShops.length})</h4>${allFeaturedShops.map(f=>`<div style="background:var(--bg-light);padding:12px;margin-top:8px;border-radius:var(--radius-md);display:flex;justify-content:space-between;align-items:center;"><span><i class="fas fa-store" style="color:var(--primary);"></i> <strong>${escapeHtml(f.shops?.name||'Unknown')}</strong></span> <button class="btn-danger btn-sm" onclick="removeSponsored('${f.id}')"><i class="fas fa-times"></i> Remove</button></div>`).join('')}</div></div>`; }
        async function addSponsoredShop(){ const shopId=document.getElementById('sponsoredShopSelect').value; if(!shopId) return; await supabaseClient.from('featured_shops').insert([{shop_id:shopId, active:true}]); Toast.show('Added to sponsored'); await loadAllData(); renderSponsored(); }
        async function removeSponsored(id){ await supabaseClient.from('featured_shops').delete().eq('id',id); Toast.show('Removed'); await loadAllData(); renderSponsored(); }

        // ========== ORDERS ==========
        function renderOrders() {
            document.getElementById('contentArea').innerHTML = `<div class="content-card"><div class="card-header"><h2><i class="fas fa-receipt"></i> All Orders</h2></div><div class="table-wrapper"><table class="data-table"><thead><tr><th>Order ID</th><th>Customer</th><th>Total</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead><tbody>${allOrders.map(o=>`<tr><td>#${o.id?.slice(0,8).toUpperCase()}</td><td>${escapeHtml(o.customer_name||'Guest')}</td><td>₹${o.total_amount||0}</td><td><span class="badge-${o.status==='delivered'?'approved':'pending'}">${o.status||'pending'}</span></td><td>${new Date(o.created_at).toLocaleDateString()}</td><td><button class="btn-danger btn-sm" onclick="deleteOrder('${o.id}')"><i class="fas fa-trash"></i></button></td></tr>`).join('')}</tbody></table></div></div>`; }
        async function deleteOrder(id){ if(!confirm('Delete order?')) return; await supabaseClient.from('orders').delete().eq('id',id); Toast.show('Order deleted'); await loadAllData(); renderOrders(); }

        // ========== SETTINGS ==========
        function renderSettings() {
            document.getElementById('contentArea').innerHTML = `<div class="content-card"><div class="card-header"><h2><i class="fas fa-cog"></i> System Settings</h2></div><div style="padding:24px;"><div class="form-group"><label class="form-label">Registration Fee (₹)</label><input type="number" id="regFee" class="form-control" value="${appSettings.registrationFee}"><button class="btn-primary" style="margin-top:12px;" onclick="updateSetting('registration_fee', document.getElementById('regFee').value)">Save</button></div><div class="form-group"><label class="form-label">Delivery Fee (₹)</label><input type="number" id="deliveryFee" class="form-control" value="${appSettings.deliveryFee}"></div><div class="form-group"><label class="form-label">Free Delivery Threshold (₹)</label><input type="number" id="freeThreshold" class="form-control" value="${appSettings.freeDeliveryThreshold}"><button class="btn-primary" style="margin-top:12px;" onclick="updateDeliverySettings()">Save Delivery Settings</button></div></div></div>`; }
        async function updateDeliverySettings(){ await updateSetting('delivery_fee',document.getElementById('deliveryFee').value); await updateSetting('free_delivery_threshold',document.getElementById('freeThreshold').value); }
        async function updateSetting(key,value){ await supabaseClient.from('app_settings').upsert([{key,value}],{onConflict:'key'}); Toast.show('Setting saved'); }

        async function compressImage(file){ return new Promise((resolve)=>{ new Compressor(file,{quality:0.7,maxWidth:800,maxHeight:800,success:resolve,error:resolve}); }); }
        function hideModal(){ document.getElementById('modalOverlay').style.display='none'; }
        async function handleLogout(){ await supabaseClient.auth.signOut(); window.location.href='index.html'; }

        document.querySelectorAll('.menu-item[data-section]').forEach(item=>{ item.addEventListener('click',()=>loadSection(item.dataset.section)); });
        document.addEventListener('DOMContentLoaded', checkAdmin);

        window.loadSection=loadSection; window.filterShopStatus=filterShopStatus; window.filterShopsList=filterShopsList; window.filterUsersList=filterUsersList; window.filterProductsList=filterProductsList;
        window.approveShop=approveShop; window.deleteShop=deleteShop; window.deleteUser=deleteUser; window.showAddCategoryModal=showAddCategoryModal; window.showEditCategoryModal=showEditCategoryModal;
        window.saveCategory=saveCategory; window.deleteCategory=deleteCategory; window.handleCategoryImage=handleCategoryImage; window.toggleFeatured=toggleFeatured; window.deleteProduct=deleteProduct;
        window.showAddOfferModal=showAddOfferModal; window.editOffer=editOffer; window.saveOfferCard=saveOfferCard; window.deleteOffer=deleteOffer; window.handleOfferImage=handleOfferImage; window.toggleTargetSelector=toggleTargetSelector;
        window.showAddSliderModal=showAddSliderModal; window.editSlider=editSlider; window.saveSlider=saveSlider; window.deleteSlider=deleteSlider; window.handleSliderImage=handleSliderImage;
        window.addSponsoredShop=addSponsoredShop; window.removeSponsored=removeSponsored; window.deleteOrder=deleteOrder; window.updateSetting=updateSetting; window.updateDeliverySettings=updateDeliverySettings;
        window.hideModal=hideModal; window.handleLogout=handleLogout;
    </script>
</body>
</html>
