<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="theme-color" content="#0B5A31">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root{--brand-green:#0B5A31;--brand-green-dark:#083D21;--brand-orange:#F59E0B;--neutral-white:#FFFFFF;--neutral-bg:#F9FAFB;--neutral-border:#E5E7EB;--neutral-gray:#6B7280;--neutral-dark:#1A1A1A;--danger:#EF4444;--success:#22C55E;--warning:#F59E0B;--shadow-xs:0 1px 2px rgba(0,0,0,0.04);--shadow-sm:0 1px 4px rgba(0,0,0,0.06);--shadow-md:0 4px 16px rgba(0,0,0,0.08);--shadow-lg:0 8px 30px rgba(0,0,0,0.12);--radius-sm:10px;--radius-md:14px;--radius-lg:18px;--radius-xl:22px;--radius-full:9999px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:var(--neutral-bg);color:var(--neutral-dark);min-height:100vh;overflow-x:hidden}
        @keyframes spin{to{transform:rotate(360deg)}}@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
        #simpleLoader{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--neutral-white);z-index:10002;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
        #simpleLoader.fade-out{opacity:0;visibility:hidden;pointer-events:none}
        .simple-spinner{width:34px;height:34px;border:2.5px solid var(--neutral-border);border-top-color:var(--brand-orange);border-radius:50%;animation:spin 0.7s linear infinite}
        .loader-logo{font-family:'Poppins',sans-serif;font-size:24px;font-weight:700}.loader-zy{color:#A3E635}.loader-mart{color:#FDE047}
        .login-container{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#EDF7F1,#F9FAFB,#FFFFFF);padding:20px}
        .login-card{background:white;border-radius:var(--radius-xl);padding:36px 28px;width:100%;max-width:400px;box-shadow:var(--shadow-lg);text-align:center;animation:slideUp 0.5s ease}
        .login-logo{font-family:'Poppins',sans-serif;font-size:32px;font-weight:700}.login-zy{color:#A3E635}.login-mart{color:#FDE047}
        .login-subtitle{color:var(--neutral-gray);font-size:13px;margin-bottom:24px}
        .login-input{width:100%;padding:12px 14px;border:1.5px solid var(--neutral-border);border-radius:var(--radius-sm);font-size:14px;margin-bottom:12px;font-family:'Inter',sans-serif;outline:none;background:var(--neutral-bg)}
        .login-input:focus{border-color:var(--brand-orange)}.login-error{background:#FEF2F2;color:#EF4444;padding:10px 14px;border-radius:var(--radius-sm);font-size:12px;margin-bottom:14px;display:none}
        .login-btn{width:100%;padding:13px;background:var(--brand-green);color:white;border:none;border-radius:var(--radius-full);font-size:15px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
        .login-btn:active{background:var(--brand-green-dark);transform:scale(0.98)}.login-btn:disabled{opacity:0.6}
        .login-back{background:none;border:none;color:var(--brand-green);cursor:pointer;margin-top:10px;font-size:13px;font-weight:600}
        .sidebar{position:fixed;left:0;top:0;width:250px;height:100vh;background:white;border-right:1px solid var(--neutral-border);z-index:100;overflow-y:auto;box-shadow:var(--shadow-sm);transition:transform 0.3s ease}
        .sidebar-header{padding:18px 14px;border-bottom:1px solid var(--neutral-border);background:linear-gradient(135deg,#EDF7F1,white)}
        .sidebar-logo{font-family:'Poppins',sans-serif;font-size:24px;font-weight:700}.sidebar-zy{color:#A3E635}.sidebar-mart{color:#FDE047}
        .sidebar-version{font-size:10px;color:var(--neutral-gray)}.sidebar-menu{padding:8px 6px}
        .menu-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:var(--radius-md);cursor:pointer;color:var(--neutral-gray);font-weight:500;font-size:12px;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;font-family:'Inter',sans-serif}
        .menu-item:hover{background:#EDF7F1}.menu-item.active{background:var(--brand-green);color:white}
        .menu-item i{width:18px;text-align:center;font-size:13px}.menu-divider{height:1px;background:var(--neutral-border);margin:6px 0}
        .menu-badge{margin-left:auto;background:var(--danger);color:white;padding:2px 7px;border-radius:var(--radius-full);font-size:9px;font-weight:700}
        .sidebar-toggle{position:fixed;top:10px;left:10px;z-index:101;width:36px;height:36px;background:var(--brand-green);color:white;border-radius:50%;display:none;align-items:center;justify-content:center;cursor:pointer;border:none;font-size:15px;box-shadow:var(--shadow-md)}
        .main-content{margin-left:250px;padding:16px 18px;min-height:100vh;transition:margin-left 0.3s ease}
        .admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
        .page-title{font-family:'Poppins',sans-serif;font-size:22px;font-weight:700}
        .admin-info{display:flex;align-items:center;gap:8px;background:white;padding:6px 12px;border-radius:var(--radius-full);border:1px solid var(--neutral-border);font-size:12px}
        .admin-avatar{width:28px;height:28px;background:linear-gradient(135deg,var(--brand-green),#22C55E);color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
        .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
        .stat-card{background:white;border-radius:var(--radius-lg);padding:14px 12px;display:flex;align-items:center;gap:10px;border:1px solid var(--neutral-border);box-shadow:var(--shadow-xs);cursor:pointer}
        .stat-icon{width:40px;height:40px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:16px;color:white}
        .stat-icon.green{background:linear-gradient(135deg,#22C55E,#16A34A)}.stat-icon.blue{background:linear-gradient(135deg,#3B82F6,#2563EB)}
        .stat-icon.orange{background:linear-gradient(135deg,#F59E0B,#EA580C)}.stat-icon.purple{background:linear-gradient(135deg,#8B5CF6,#6D28D9)}
        .stat-info h3{font-family:'Poppins',sans-serif;font-size:20px;font-weight:700}.stat-info p{font-size:10px;color:var(--neutral-gray)}
        .content-card{background:white;border-radius:var(--radius-lg);border:1px solid var(--neutral-border);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow-xs)}
        .card-header{padding:12px 14px;border-bottom:1px solid var(--neutral-border);display:flex;justify-content:space-between;align-items:center;background:#FAFAFA;flex-wrap:wrap;gap:8px}
        .card-header h2{font-family:'Poppins',sans-serif;font-size:15px;font-weight:700}
        .btn{padding:7px 13px;border-radius:var(--radius-full);font-size:10px;font-weight:600;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:4px;font-family:'Inter',sans-serif;white-space:nowrap}
        .btn:active{transform:scale(0.96)}.btn-primary{background:var(--brand-green);color:white}.btn-success{background:var(--success);color:white}
        .btn-danger{background:var(--danger);color:white}.btn-warning{background:var(--brand-orange);color:white}
        .btn-outline{background:white;color:var(--neutral-dark);border:1px solid var(--neutral-border)}
        .btn-sm{padding:5px 8px;font-size:9px}
        .badge{padding:3px 8px;border-radius:var(--radius-full);font-size:9px;font-weight:700;display:inline-block}
        .badge-success{background:#EDF7F1;color:#059669}.badge-warning{background:#FFF8EB;color:#D97706}.badge-danger{background:#FEF2F2;color:#DC2626}
        .form-group{margin-bottom:14px}.form-label{font-size:12px;font-weight:600;margin-bottom:5px;display:block;color:var(--neutral-dark)}
        .form-control{width:100%;padding:10px 12px;border:1.5px solid var(--neutral-border);border-radius:var(--radius-sm);font-size:13px;font-family:'Inter',sans-serif;outline:none;background:white}
        .form-control:focus{border-color:var(--brand-orange)}
        .toggle-switch{position:relative;width:50px;height:26px;cursor:pointer}
        .toggle-switch input{opacity:0;width:0;height:0}
        .toggle-slider{position:absolute;top:0;left:0;right:0;bottom:0;background:#D1D5DB;border-radius:26px;transition:0.3s}
        .toggle-slider:before{content:'';position:absolute;height:20px;width:20px;left:3px;bottom:3px;background:white;border-radius:50%;transition:0.3s}
        .toggle-switch input:checked + .toggle-slider{background:var(--danger)}
        .toggle-switch input:checked + .toggle-slider:before{transform:translateX(24px)}
        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(8,61,33,0.7);z-index:1000;display:none;align-items:center;justify-content:center}
        .modal-overlay.show{display:flex}
        .modal-container{background:white;border-radius:var(--radius-xl);width:92%;max-width:450px;max-height:85vh;overflow-y:auto;padding:18px;animation:slideUp 0.3s ease}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--neutral-border)}
        .modal-header h3{font-family:'Poppins',sans-serif;font-size:16px;font-weight:700}
        .modal-close{width:28px;height:28px;background:var(--neutral-bg);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;font-size:12px;color:var(--neutral-gray)}
        .toast-container{position:fixed;top:14px;right:14px;z-index:9999;display:flex;flex-direction:column;gap:6px}
        .toast{background:white;padding:10px 14px;border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);font-size:11px;font-weight:600;display:flex;align-items:center;gap:6px;border-left:4px solid var(--brand-green);animation:slideIn 0.3s ease}
        .toast.error{border-left-color:var(--danger)}.toast.success{border-left-color:var(--success)}
        .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;padding:12px}
        .card-item{background:white;border:1px solid var(--neutral-border);border-radius:var(--radius-lg);overflow:hidden;position:relative;cursor:pointer}
        .card-item-img{width:100%;height:100px;background:#F3F4F6;display:flex;align-items:center;justify-content:center;overflow:hidden}
        .card-item-img img{width:100%;height:100%;object-fit:contain;padding:6px}.card-item-img i{font-size:30px;color:var(--brand-green)}
        .card-item-body{padding:10px}.card-item-title{font-weight:700;font-size:12px;margin-bottom:3px}.card-item-subtitle{font-size:9px;color:var(--neutral-gray);margin-bottom:6px}
        .hold-badge{position:absolute;top:6px;right:6px;background:#F59E0B;color:white;padding:2px 6px;border-radius:var(--radius-full);font-size:8px;font-weight:700}
        .image-upload-box{border:2px dashed var(--brand-green);border-radius:var(--radius-md);padding:12px;text-align:center;cursor:pointer;background:#EDF7F1}
        .image-upload-box.has-image{border-style:solid;border-color:#22C55E}
        .image-preview{max-width:130px;max-height:80px;border-radius:10px;margin-top:6px;display:none}
        .image-preview.show{display:block}
        .table-wrapper{overflow-x:auto}.data-table{width:100%;border-collapse:collapse;min-width:500px;font-size:12px}
        .data-table th{text-align:left;padding:10px;background:var(--neutral-bg);font-weight:700;font-size:10px;text-transform:uppercase;color:var(--neutral-gray);border-bottom:2px solid var(--neutral-border)}
        .data-table td{padding:8px 10px;border-bottom:1px solid var(--neutral-border)}
        .empty-state{text-align:center;padding:30px;color:var(--neutral-gray)}.empty-state i{font-size:40px;margin-bottom:8px;display:block;color:#D1D5DB}
        @media(max-width:1024px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.sidebar-toggle{display:flex}.main-content{margin-left:0;padding:12px}.stats-grid{grid-template-columns:repeat(2,1fr)}}
        @media(max-width:640px){.stats-grid{grid-template-columns:1fr}.card-grid{grid-template-columns:repeat(2,1fr)}}
    </style>
</head>
<body>
<div id="simpleLoader"><div class="simple-spinner"></div><div class="loader-logo"><span class="loader-zy">Zy</span><span class="loader-mart">Mart</span></div></div>
<div id="app"></div>
<div class="toast-container" id="toastContainer"></div>

<script>
(function(){'use strict';
window.addEventListener('error',function(e){});
window.addEventListener('unhandledrejection',function(e){e.preventDefault();});

function getEl(id){return document.getElementById(id);}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function safeText(id,t){var el=getEl(id);if(el)el.textContent=t;}
function fmtDate(d){if(!d)return'-';try{return new Date(d).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return d;}}

var sb=supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co','sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1');
var SUPABASE_URL='https://zwajyovemwdqtkecipeb.supabase.co';
var currentAdmin=null,allUsers=[],allShops=[],allProducts=[],allCategories=[],allOrders=[],allNotifications=[],allSections=[];
var currentSection='dashboard',shopFilter='all';
var catImageFile=null,catEditId=null;
var otpTimerInterval=null,currentOtpEmail=null;
var deliverySettingsData=null;

function showApp(){var l=getEl('simpleLoader');if(l){l.classList.add('fade-out');setTimeout(function(){if(l.parentNode)l.parentNode.removeChild(l);},200);}}
function getImageUrl(url){if(!url)return'';if(url.indexOf('http')===0||url.indexOf('data:')===0)return url;return SUPABASE_URL+'/storage/v1/object/public/'+url;}
async function safeFetch(fn,r){r=r||2;for(var i=0;i<r;i++){try{var res=await fn();if(res&&res.error)throw new Error(res.error.message);return res||{data:null};}catch(e){if(i===r-1)throw e;await new Promise(function(x){setTimeout(x,300*(i+1));});}}}
function getCatName(catId){var c=allCategories.find(function(x){return x.id===catId;});return c?c.name:(catId||'');}
function toast(msg,type){type=type||'success';var c=getEl('toastContainer');if(!c)return;var el=document.createElement('div');el.className='toast '+type;el.innerHTML='<i class="fas fa-'+(type==='success'?'check-circle':'exclamation-circle')+'"></i> '+msg;c.appendChild(el);setTimeout(function(){el.style.opacity='0';setTimeout(function(){el.remove();},250);},2500);}
window.fastNavigate=function(url){window.location.href=url;};

async function compressImage(file){
if(!file||!file.type.match(/image\//))return file;
return new Promise(function(resolve){
var reader=new FileReader();
reader.onload=function(e){
var img=new Image();
img.onload=function(){
var canvas=document.createElement('canvas');
var maxDim=800,w=img.width,h=img.height;
if(w>maxDim||h>maxDim){var r=Math.min(maxDim/w,maxDim/h);w=Math.round(w*r);h=Math.round(h*r);}
canvas.width=w;canvas.height=h;
canvas.getContext('2d').drawImage(img,0,0,w,h);
function tryQuality(q){
canvas.toBlob(function(blob){
if(!blob){resolve(file);return;}
var sizeKB=blob.size/1024;
if(sizeKB>150&&q>0.3){tryQuality(q-0.1);}
else if(sizeKB<80&&q<0.95){tryQuality(q+0.05);}
else{resolve(new File([blob],file.name.replace(/\.[^.]+$/,'.jpg'),{type:'image/jpeg'}));}
},'image/jpeg',q);
}
tryQuality(0.7);
};
img.src=e.target.result;
};
reader.readAsDataURL(file);
});
}

async function uploadCompressedImage(file,bucket,folder){
if(!file)return null;
var compressed=await compressImage(file);
var fn=folder+'_'+Date.now()+'.jpg';
var r=await sb.storage.from(bucket).upload(fn,compressed,{cacheControl:'3600',upsert:true,contentType:'image/jpeg'});
if(r.error){toast('❌ Upload failed','error');return null;}
return sb.storage.from(bucket).getPublicUrl(fn).data.publicUrl;
}

async function loadAllData(){
try{
var results=await Promise.allSettled([
safeFetch(function(){return sb.from('users').select('id,name,phone,role,is_blocked').limit(200);}),
safeFetch(function(){return sb.from('shops').select('*').limit(100);}),
safeFetch(function(){return sb.from('products').select('id,name,price,is_featured,shop_id,delete_requested').limit(200);}),
safeFetch(function(){return sb.from('categories').select('*').order('display_order');}),
safeFetch(function(){return sb.from('orders').select('*').order('created_at',{ascending:false}).limit(50);}),
safeFetch(function(){return sb.from('notifications').select('*').limit(20);}),
safeFetch(function(){return sb.from('delivery_settings').select('*').eq('is_active',true).single();}),
safeFetch(function(){return sb.from('sections').select('*').order('display_order');})
]);
allUsers=results[0].status==='fulfilled'?(results[0].value.data||[]):[];
allShops=results[1].status==='fulfilled'?(results[1].value.data||[]):[];
allProducts=results[2].status==='fulfilled'?(results[2].value.data||[]):[];
allCategories=results[3].status==='fulfilled'?(results[3].value.data||[]):[];
allOrders=results[4].status==='fulfilled'?(results[4].value.data||[]):[];
allNotifications=results[5].status==='fulfilled'?(results[5].value.data||[]):[];
deliverySettingsData=results[6].status==='fulfilled'?results[6].value.data:null;
allSections=results[7].status==='fulfilled'?(results[7].value.data||[]):[];
}catch(e){toast('Failed to load','error');}}

function showLogin(){getEl('app').innerHTML='<div class="login-container"><div class="login-card"><div class="login-logo"><span class="login-zy">Zy</span><span class="login-mart">Mart</span></div><div class="login-subtitle">🔐 Admin Panel</div><div class="login-error" id="loginError"></div><div id="loginStepEmail"><input type="email" id="adminEmail" class="login-input" placeholder="Admin Email"><button class="login-btn" onclick="sendAdminOTP()"><i class="fas fa-paper-plane"></i> Send OTP</button></div><div id="loginStepOTP" style="display:none;"><p style="font-size:13px;margin-bottom:8px;color:var(--neutral-gray);">OTP sent to: <strong id="otpEmailDisplay"></strong></p><input type="text" id="adminOtp" class="login-input" placeholder="Enter 6-digit OTP" maxlength="6"><button class="login-btn" onclick="verifyAdminOTP()"><i class="fas fa-check-circle"></i> Verify & Login</button><button class="login-btn" id="resendAdminBtn" onclick="resendAdminOTP()" style="background:transparent;border:1.5px solid var(--neutral-border);color:var(--neutral-dark);">📩 Resend OTP</button><button class="login-back" onclick="backToAdminEmail()">← Back</button></div><button class="login-back" style="margin-top:16px;" onclick="fastNavigate(\'index.html\')">← Go to Home</button></div></div>';}
window.sendAdminOTP=async function(){var email=getEl('adminEmail').value.trim();var errEl=getEl('loginError');if(!email){errEl.style.display='block';errEl.textContent='⚠️ Enter email';return;}errEl.style.display='none';var btn=document.querySelector('#loginStepEmail .login-btn');btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Sending...';try{var res=await sb.auth.signInWithOtp({email:email,options:{shouldCreateUser:false}});if(res&&res.error){errEl.style.display='block';errEl.textContent='❌ '+res.error.message;btn.disabled=false;btn.innerHTML='<i class="fas fa-paper-plane"></i> Send OTP';return;}currentOtpEmail=email;safeText('otpEmailDisplay',email);getEl('loginStepEmail').style.display='none';getEl('loginStepOTP').style.display='block';startOtpTimer();toast('📩 OTP sent!');}catch(e){errEl.style.display='block';errEl.textContent='❌ Failed';btn.disabled=false;btn.innerHTML='<i class="fas fa-paper-plane"></i> Send OTP';}};
window.verifyAdminOTP=async function(){var otp=getEl('adminOtp').value.trim();var errEl=getEl('loginError');if(!otp||otp.length<4){errEl.style.display='block';errEl.textContent='⚠️ Enter OTP';return;}errEl.style.display='none';var btn=document.querySelector('#loginStepOTP .login-btn');btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Verifying...';try{var res=await sb.auth.verifyOtp({email:currentOtpEmail,token:otp,type:'email'});if(res&&res.error){errEl.style.display='block';errEl.textContent='❌ Invalid OTP';btn.disabled=false;btn.innerHTML='<i class="fas fa-check-circle"></i> Verify';return;}var prof=await safeFetch(function(){return sb.from('users').select('role').eq('id',res.data.user.id).single();});var role=prof.data?prof.data.role:null;if(role!=1&&role!=='1'&&role!=='admin'){await sb.auth.signOut();errEl.style.display='block';errEl.textContent='🚫 Access denied';btn.disabled=false;btn.innerHTML='<i class="fas fa-check-circle"></i> Verify';return;}currentAdmin=res.data.user;toast('✅ Login!');await loadAllData();renderApp();}catch(e){errEl.style.display='block';errEl.textContent='❌ Error';btn.disabled=false;btn.innerHTML='<i class="fas fa-check-circle"></i> Verify';}};
window.resendAdminOTP=async function(){if(!currentOtpEmail)return;try{await sb.auth.signInWithOtp({email:currentOtpEmail,options:{shouldCreateUser:false}});startOtpTimer();toast('📩 New OTP sent!');}catch(e){toast('❌ Failed','error');}};
function startOtpTimer(){var s=60,b=getEl('resendAdminBtn');if(!b)return;if(otpTimerInterval)clearInterval(otpTimerInterval);b.disabled=true;b.textContent='⏳ Resend ('+s+'s)';otpTimerInterval=setInterval(function(){s--;b.textContent='⏳ Resend ('+s+'s)';if(s<=0){clearInterval(otpTimerInterval);b.disabled=false;b.textContent='📩 Resend OTP';}},1000);}
window.backToAdminEmail=function(){if(otpTimerInterval)clearInterval(otpTimerInterval);getEl('loginStepOTP').style.display='none';getEl('loginStepEmail').style.display='block';};

function renderApp(){

var po=allOrders.filter(function(o){return o.status==='pending';}).length;

window.saveSection=async function(id){
var name=getEl('sectionName').value.trim();
var order=parseInt(getEl('sectionOrder').value)||0;
var icon=getEl('sectionIcon').value.trim()||'fa-layer-group';
if(!name){toast('⚠️ Enter section name','error');return;}
var exists=allSections.find(function(s){return s.name.toLowerCase()===name.toLowerCase()&&s.id!==id;});
if(exists){toast('⚠️ Section "'+name+'" already exists','error');return;}
try{
if(id){await sb.from('sections').update({name:name,display_order:order,icon:icon}).eq('id',id);toast('✅ Section updated!');}
else{await sb.from('sections').insert([{name:name,display_order:order,icon:icon,is_active:true}]);toast('✅ Section added!');}
closeModal();await loadAllData();renderSections(getEl('contentArea'));
}catch(e){toast('❌ Failed: '+e.message,'error');}
};

window.toggleSectionActive=async function(id,currentStatus){
var section=allSections.find(function(s){return s.id===id;});
var action=currentStatus?'disable':'enable';
if(!confirm('Are you sure you want to '+action+' "'+(section?section.name:'')+'"?'))return;
try{await sb.from('sections').update({is_active:!currentStatus}).eq('id',id);toast('✅ Section '+(currentStatus?'disabled':'enabled')+'!');await loadAllData();renderSections(getEl('contentArea'));}
catch(e){toast('❌ Failed','error');}
};

window.deleteSection=async function(id){
var section=allSections.find(function(s){return s.id===id;});
if(!section)return;

try{await sb.from('sections').delete().eq('id',id);toast('✅ Section deleted!');await loadAllData();renderSections(getEl('contentArea'));}
catch(e){toast('❌ Failed: '+e.message,'error');}
};

window.saveDeliverySettings=async function(){
var startTime=getEl('deliveryStart').value;
var endTime=getEl('deliveryEnd').value;
var isHoliday=getEl('isHoliday').checked;
var holidayReason=(getEl('holidayReason')?.value||'').trim();

if(isHoliday&&!holidayReason){toast('⚠️ Enter holiday reason','error');return;}
var data={delivery_start_time:startTime+':00',delivery_end_time:endTime+':00',is_holiday:isHoliday,holiday_reason:isHoliday?holidayReason:null,holiday_date:isHoliday?new Date().toISOString().split('T')[0]:null,is_active:true,updated_at:new Date().toISOString()};
try{
if(deliverySettingsData&&deliverySettingsData.id){await sb.from('delivery_settings').update(data).eq('id',deliverySettingsData.id);}
else{await sb.from('delivery_settings').insert([data]);}
toast(isHoliday?'🏖️ Holiday mode ON! Users will see Closed popup':'✅ Delivery settings saved!','success');
deliverySettingsData=data;renderDeliverySettings(getEl('contentArea'));
}catch(e){toast('❌ Save failed: '+e.message,'error');}

window.saveCategory=async function(){

var data={name:name,section:section,parent_id:parentId,section_priority:1,is_active:true};

else{await sb.from('categories').insert([data]);toast('Added!');}
closeModal();await loadAllData();renderCategories(getEl('contentArea'));
};

window.toggleFeatured=async function(id,f){await sb.from('products').update({is_featured:f}).eq('id',id);toast('Done!');await loadAllData();renderProducts(getEl('contentArea'));};
window.deleteProduct=async function(id){if(!confirm('Delete?'))return;await sb.from('products').delete().eq('id',id);toast('Deleted');await loadAllData();renderProducts(getEl('contentArea'));};

function renderOrders(c){var h='';for(var i=0;i<allOrders.length;i++){var o=allOrders[i];h+='<div style="background:white;border:1px solid var(--neutral-border);border-radius:12px;padding:12px;margin-bottom:8px;"><div style="display:flex;justify-content:space-between;"><strong>#'+(o.id||'').substring(0,8).toUpperCase()+'</strong><span class="badge '+(o.status==='pending'?'badge-warning':o.status==='confirmed'?'badge-success':'badge-danger')+'">'+o.status+'</span></div><div style="font-size:12px;margin-top:4px;">'+esc(o.customer_name||'N/A')+' · +91 '+esc(o.customer_phone||'')+'</div><div style="font-size:11px;color:#6B7280;margin-top:2px;">📍 '+esc(o.customer_address||'')+'</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;"><strong>₹'+(parseFloat(o.total_amount)||0).toLocaleString('en-IN')+'</strong><div style="display:flex;gap:4px;">'+(o.status==='pending'?'<button class="btn btn-success btn-sm" onclick="confirmOrder(\''+o.id+'\')">✅</button>':'')+'<button class="btn btn-danger btn-sm" onclick="deleteOrder(\''+o.id+'\')">🗑️</button></div></div></div>';}
c.innerHTML='<div class="content-card"><div class="card-header"><h2>📋 Orders ('+allOrders.length+')</h2></div><div style="padding:12px;">'+(h||'<div class="empty-state"><i class="fas fa-receipt"></i><p>No orders</p></div>')+'</div></div>';}
window.confirmOrder=async function(id){await sb.from('orders').update({status:'confirmed'}).eq('id',id);toast('Confirmed!');await loadAllData();renderOrders(getEl('contentArea'));};
window.deleteOrder=async function(id){if(!confirm('Delete?'))return;await sb.from('orders').delete().eq('id',id);toast('Deleted');await loadAllData();renderOrders(getEl('contentArea'));};

function renderNotifications(c){c.innerHTML='<div class="content-card"><div class="card-header"><h2>🔔 Send Notification</h2></div><div style="padding:12px;"><div class="form-group"><label class="form-label">Title</label><input type="text" id="notifTitle" class="form-control"></div><div class="form-group"><label class="form-label">Message</label><textarea id="notifMessage" class="form-control" rows="2"></textarea></div><button class="btn btn-primary" style="width:100%;" onclick="sendNotification()">Send</button></div></div>';}
window.sendNotification=async function(){var t=getEl('notifTitle').value.trim(),m=getEl('notifMessage').value.trim();if(!t||!m){toast('Fill fields','error');return;}await sb.from('notifications').insert([{title:t,message:m,user_id:null,is_read:false}]);toast('Sent!');};

async function checkSession(){try{var res=await sb.auth.getSession();if(res&&res.data&&res.data.session){var prof=await safeFetch(function(){return sb.from('users').select('role').eq('id',res.data.session.user.id).single();});var role=prof.data?prof.data.role:null;if(role===1||role==='1'||role==='admin'){currentAdmin=res.data.session.user;await loadAllData();renderApp();showApp();return;}window.location.href='index.html';return;}showLogin();showApp();}catch(e){showLogin();showApp();}}
window.handleLogout=async function(){try{await sb.auth.signOut();}catch(e){}window.location.replace('index.html');};
document.addEventListener('DOMContentLoaded',function(){checkSession();});

window.toggleSidebar=toggleSidebar;window.loadSection=loadSection;
window.approveShop=approveShop;window.deleteShop=deleteShop;
window.toggleBlockUser=toggleBlockUser;
window.showSectionModal=showSectionModal;window.saveSection=saveSection;window.toggleSectionActive=toggleSectionActive;window.deleteSection=deleteSection;
window.showCategoryModal=showCategoryModal;window.handleCatImage=handleCatImage;window.saveCategory=saveCategory;window.toggleCategoryHold=toggleCategoryHold;window.deleteCategory=deleteCategory;window.closeModal=closeModal;
window.toggleFeatured=toggleFeatured;window.deleteProduct=deleteProduct;
window.confirmOrder=confirmOrder;window.deleteOrder=deleteOrder;
window.sendNotification=sendNotification;
window.saveDeliverySettings=saveDeliverySettings;
window.handleLogout=handleLogout;window.fastNavigate=fastNavigate;
window.sendAdminOTP=sendAdminOTP;window.verifyAdminOTP=verifyAdminOTP;window.resendAdminOTP=resendAdminOTP;window.backToAdminEmail=backToAdminEmail;
})();
</script>
