<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Admin Panel - Zymart</title>
    <meta name="theme-color" content="#0B5A31">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --brand-green: #0B5A31; --brand-green-light: #0F6E3B; --brand-green-dark: #083D21;
            --brand-orange: #F59E0B; --brand-orange-dark: #E8890A; --brand-orange-light: #FFB020;
            --brand-white: #F5F5F5;
            --neutral-white: #FFFFFF; --neutral-bg: #F9FAFB; --neutral-border: #E5E7EB;
            --neutral-gray: #6B7280; --neutral-dark: #1A1A1A;
            --danger: #EF4444; --danger-bg: #FEF2F2; --success: #22C55E; --success-bg: #EDF7F1;
            --warning: #F59E0B; --warning-bg: #FFF8EB;
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08); --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
            --radius-sm: 10px; --radius-md: 14px; --radius-lg: 18px; --radius-xl: 22px; --radius-full: 9999px;
            --ease-fast: cubic-bezier(0.4,0,0.2,1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--neutral-bg); color: var(--neutral-dark); min-height: 100vh; overflow-x: hidden; }
        
        #simpleLoader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--neutral-white); z-index: 10002; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; transition: opacity 0.3s ease, visibility 0.3s ease; }
        #simpleLoader.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
        .simple-spinner { width: 34px; height: 34px; border: 2.5px solid var(--neutral-border); border-top-color: var(--brand-orange); border-radius: 50%; animation: spin 0.7s linear infinite; }
        .loader-logo { font-family: 'Poppins', sans-serif; font-size: 24px; font-weight: 700; }
        .loader-zy { color: var(--brand-green); }
        .loader-mart { color: var(--brand-orange); }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes skel { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
        
        .skeleton-block { background: linear-gradient(90deg,#e5e5e5 25%,#d4d4d4 50%,#e5e5e5 75%); background-size:200% 100%; animation:skel 1.3s infinite; border-radius:var(--radius-md); }
        .skeleton-card { background: white; border-radius: var(--radius-lg); padding: 20px; margin-bottom: 14px; }
        .skeleton-line { height: 14px; margin-bottom: 10px; }
        .skeleton-line-sm { width: 60%; height: 14px; }
        
        .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #EDF7F1, #F9FAFB, #FFFFFF); padding: 20px; animation: fadeIn 0.4s ease; }
        .login-card { background: white; border-radius: var(--radius-xl); padding: 36px 28px; width: 100%; max-width: 400px; box-shadow: var(--shadow-lg); text-align: center; animation: slideUp 0.5s ease; }
        .login-logo { font-family: 'Poppins', sans-serif; font-size: 32px; font-weight: 700; }
        .login-zy { color: var(--brand-green); }
        .login-mart { color: var(--brand-orange); }
        .login-subtitle { color: var(--neutral-gray); font-size: 13px; margin-bottom: 24px; }
        .login-input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--neutral-border); border-radius: var(--radius-sm); font-size: 14px; margin-bottom: 12px; font-family: 'Inter', sans-serif; outline: none; background: var(--neutral-bg); }
        .login-input:focus { border-color: var(--brand-orange); }
        .login-error { background: var(--danger-bg); color: var(--danger); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 12px; margin-bottom: 14px; display: none; }
        .login-btn { width: 100%; padding: 13px; background: var(--brand-green); color: white; border: none; border-radius: var(--radius-full); font-size: 15px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.15s ease; }
        .login-btn:active { background: var(--brand-green-dark); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .login-back { background: none; border: none; color: var(--brand-green); cursor: pointer; margin-top: 10px; font-size: 13px; font-weight: 600; font-family: 'Inter', sans-serif; }
        
        .sidebar { position: fixed; left: 0; top: 0; width: 260px; height: 100vh; background: white; border-right: 1px solid var(--neutral-border); z-index: 100; overflow-y: auto; box-shadow: var(--shadow-sm); transition: transform 0.3s ease; }
        .sidebar-header { padding: 20px 16px; border-bottom: 1px solid var(--neutral-border); background: linear-gradient(135deg, #EDF7F1, white); }
        .sidebar-logo { font-family: 'Poppins', sans-serif; font-size: 26px; font-weight: 700; }
        .sidebar-zy { color: var(--brand-green); }
        .sidebar-mart { color: var(--brand-orange); }
        .sidebar-version { font-size: 10px; color: var(--neutral-gray); }
        .sidebar-menu { padding: 10px 8px; }
        .menu-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--radius-md); cursor: pointer; color: var(--neutral-gray); font-weight: 500; font-size: 13px; margin-bottom: 2px; border: none; background: none; width: 100%; text-align: left; font-family: 'Inter', sans-serif; transition: all 0.15s ease; }
        .menu-item:hover { background: #EDF7F1; }
        .menu-item.active { background: var(--brand-green); color: white; }
        .menu-item i { width: 20px; text-align: center; }
        .menu-divider { height: 1px; background: var(--neutral-border); margin: 8px 0; }
        .menu-badge { margin-left: auto; background: var(--danger); color: white; padding: 2px 8px; border-radius: var(--radius-full); font-size: 10px; font-weight: 700; }
        .sidebar-toggle { position: fixed; top: 12px; left: 12px; z-index: 101; width: 38px; height: 38px; background: var(--brand-green); color: white; border-radius: 50%; display: none; align-items: center; justify-content: center; cursor: pointer; border: none; font-size: 16px; box-shadow: var(--shadow-md); }
        .main-content { margin-left: 260px; padding: 20px 24px; min-height: 100vh; transition: margin-left 0.3s ease; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        .page-title { font-family: 'Poppins', sans-serif; font-size: 26px; font-weight: 700; }
        .admin-info { display: flex; align-items: center; gap: 10px; background: white; padding: 6px 14px; border-radius: var(--radius-full); border: 1px solid var(--neutral-border); font-size: 13px; }
        .admin-avatar { width: 32px; height: 32px; background: var(--brand-green); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
        .stat-card { background: white; border-radius: var(--radius-lg); padding: 18px 16px; display: flex; align-items: center; gap: 14px; border: 1px solid var(--neutral-border); box-shadow: var(--shadow-xs); cursor: pointer; transition: transform 0.15s ease; }
        .stat-card:active { transform: scale(0.98); }
        .stat-icon { width: 48px; height: 48px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 20px; color: white; }
        .stat-icon.green { background: linear-gradient(135deg, var(--brand-green), #22C55E); }
        .stat-icon.blue { background: linear-gradient(135deg, #3B82F6, #2563EB); }
        .stat-icon.orange { background: linear-gradient(135deg, var(--brand-orange), #EA580C); }
        .stat-icon.purple { background: linear-gradient(135deg, #8B5CF6, #6D28D9); }
        .stat-info h3 { font-family: 'Poppins', sans-serif; font-size: 24px; font-weight: 700; }
        .stat-info p { font-size: 11px; color: var(--neutral-gray); }
        .content-card { background: white; border-radius: var(--radius-lg); border: 1px solid var(--neutral-border); overflow: hidden; margin-bottom: 20px; box-shadow: var(--shadow-xs); animation: slideUp 0.3s ease; }
        .card-header { padding: 16px 20px; border-bottom: 1px solid var(--neutral-border); display: flex; justify-content: space-between; align-items: center; background: #EDF7F1; }
        .card-header h2 { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 700; }
        .table-wrapper { overflow-x: auto; }
        .data-table { width: 100%; border-collapse: collapse; min-width: 700px; font-size: 13px; }
        .data-table th { text-align: left; padding: 12px 14px; background: var(--neutral-bg); font-weight: 700; font-size: 11px; text-transform: uppercase; color: var(--neutral-gray); border-bottom: 2px solid var(--neutral-border); }
        .data-table td { padding: 10px 14px; border-bottom: 1px solid var(--neutral-border); vertical-align: middle; }
        .badge { padding: 3px 10px; border-radius: var(--radius-full); font-size: 10px; font-weight: 700; display: inline-block; }
        .badge-success { background: var(--success-bg); color: #059669; }
        .badge-warning { background: var(--warning-bg); color: #D97706; }
        .badge-danger { background: var(--danger-bg); color: #DC2626; }
        .badge-featured { background: #FFF8EB; color: #D97706; }
        .btn { padding: 8px 16px; border-radius: var(--radius-full); font-size: 12px; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 5px; font-family: 'Inter', sans-serif; transition: all 0.15s ease; }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--brand-green); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--brand-orange); color: white; }
        .btn-outline { background: white; color: var(--neutral-dark); border: 1px solid var(--neutral-border); }
        .btn-featured { background: #FFF8EB; color: #D97706; border: 1px solid #F59E0B; }
        .btn-sm { padding: 5px 10px; font-size: 10px; }
        .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
        .search-box { padding: 12px 16px; }
        .search-box input { width: 100%; padding: 9px 14px; border: 1px solid var(--neutral-border); border-radius: var(--radius-full); font-size: 13px; font-family: 'Inter', sans-serif; outline: none; }
        .tabs { display: flex; gap: 6px; padding: 0 16px 12px; flex-wrap: wrap; border-bottom: 1px solid var(--neutral-border); margin-bottom: 12px; }
        .tab-btn { padding: 7px 16px; border-radius: var(--radius-full); font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid var(--neutral-border); background: white; color: var(--neutral-gray); font-family: 'Inter', sans-serif; transition: all 0.15s ease; }
        .tab-btn.active { background: var(--brand-green); color: white; border-color: var(--brand-green); }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; padding: 16px; }
        .card-item { background: white; border: 1px solid var(--neutral-border); border-radius: var(--radius-lg); overflow: hidden; position: relative; transition: transform 0.15s ease; }
        .card-item:active { transform: scale(0.98); }
        .card-item.featured { border-color: #F59E0B; box-shadow: 0 0 0 2px rgba(245,158,11,0.2); }
        .card-item-img { width: 100%; height: 120px; object-fit: contain; background: #F3F4F6; display: flex; align-items: center; justify-content: center; }
        .card-item-img img { width: 100%; height: 100%; object-fit: contain; }
        .card-item-img i { font-size: 40px; color: var(--brand-green); }
        .card-item-body { padding: 12px; }
        .card-item-title { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
        .featured-badge { position: absolute; top: 8px; left: 8px; background: #F59E0B; color: white; padding: 2px 8px; border-radius: var(--radius-full); font-size: 9px; font-weight: 700; z-index: 2; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(8,61,33,0.7); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-overlay.show { display: flex; }
        .modal-container { background: white; border-radius: var(--radius-xl); width: 92%; max-width: 550px; max-height: 85vh; overflow-y: auto; padding: 22px; animation: slideUp 0.3s ease; box-shadow: var(--shadow-lg); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--neutral-border); }
        .modal-header h3 { font-family: 'Poppins', sans-serif; font-size: 17px; font-weight: 700; }
        .modal-close { width: 32px; height: 32px; background: var(--neutral-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; font-size: 14px; }
        .form-group { margin-bottom: 14px; }
        .form-label { font-size: 12px; font-weight: 600; margin-bottom: 4px; display: block; }
        .form-control { width: 100%; padding: 10px 12px; border: 1.5px solid var(--neutral-border); border-radius: var(--radius-sm); font-size: 13px; font-family: 'Inter', sans-serif; outline: none; background: white; }
        select.form-control { -webkit-appearance: none; padding-right: 32px; }
        textarea.form-control { resize: vertical; min-height: 60px; }
        .image-upload-box { border: 2px dashed var(--neutral-border); border-radius: var(--radius-sm); padding: 16px; text-align: center; cursor: pointer; background: var(--neutral-bg); transition: all 0.15s ease; }
        .image-upload-box:hover { border-color: var(--brand-green); background: #EDF7F1; }
        .image-preview { max-width: 100%; max-height: 150px; margin-top: 8px; border-radius: var(--radius-sm); display: none; }
        .current-banner-preview { max-width: 100%; max-height: 120px; border-radius: var(--radius-sm); margin-top: 8px; border: 1px solid var(--neutral-border); }
        .toast-container { position: fixed; top: 16px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast { background: white; padding: 12px 18px; border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; border-left: 4px solid var(--brand-green); animation: slideIn 0.3s ease; min-width: 250px; }
        .toast.error { border-left-color: var(--danger); }
        .toast.success { border-left-color: var(--success); }
        .shop-thumb { width: 40px; height: 40px; border-radius: var(--radius-sm); background: #EDF7F1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .shop-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .shop-thumb i { font-size: 18px; color: var(--brand-green); }
        .empty-state { text-align: center; padding: 40px; color: var(--neutral-gray); }
        .empty-state i { font-size: 44px; margin-bottom: 12px; display: block; color: #D1D5DB; }
        .broadcast-preview { background: #EDF7F1; border-radius: var(--radius-sm); padding: 12px; margin-top: 10px; max-height: 200px; overflow-y: auto; font-size: 11px; }
        @media (max-width: 1024px) { .sidebar { transform: translateX(-100%); } .sidebar.open { transform: translateX(0); } .sidebar-toggle { display: flex; } .main-content { margin-left: 0; padding: 16px; } .stats-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 640px) { .stats-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div id="simpleLoader"><div class="simple-spinner"></div><div class="loader-logo"><span class="loader-zy">Zy</span><span class="loader-mart">mart</span></div></div>
    <div id="app"></div>
    <div class="toast-container" id="toastContainer"></div>
    <script>
    (function() {
        'use strict';
        window.addEventListener('error', function(e) { try { console.error('[Zymart Admin Crash]', e.message); } catch(ex) {} });
        window.addEventListener('unhandledrejection', function(e) { try { console.error('[Zymart Admin Promise Crash]', e.reason); } catch(ex) {} e.preventDefault(); });
        
        var sb = null;
        try { sb = supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co', 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1'); }
        catch(e) { sb = { from: function() { return { select: function() { return { eq: function() { return { order: function() { return Promise.resolve({ data: [] }); } }; } }; } }; } }; }
        
        var SUPABASE_URL = 'https://zwajyovemwdqtkecipeb.supabase.co';
        var currentAdmin = null, allUsers = [], allShops = [], allProducts = [], allCategories = [], allOffers = [], allSliders = [], allOrders = [];
        var currentSection = 'dashboard', shopFilter = 'all', productFilter = 'all';
        var offerImageFile = null, sliderImageFile = null, catImageFile = null, catEditId = null, otpTimerInterval = null, currentOtpEmail = null;
        var bannerImageFile = null, appSettingsData = {};
        var initComplete = false;

        function showApp() { var l = document.getElementById('simpleLoader'); if (l) { l.classList.add('fade-out'); setTimeout(function() { if (l.parentNode) l.parentNode.removeChild(l); }, 300); } }
        function escapeHTML(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
        function getImageUrl(url) { if (!url) return ''; if (typeof url !== 'string') return ''; if (url.indexOf('http')===0 || url.indexOf('data:')===0) return url; return SUPABASE_URL + '/storage/v1/object/public/' + url; }
        
        async function safeFetch(fn, r) { r=r||3; for(var i=0;i<r;i++){try{var res=await fn();if(res&&res.error)throw new Error(res.error.message);return res||{data:null};}catch(e){if(i===r-1)throw e;await new Promise(function(x){setTimeout(x,Math.pow(2,i)*500);});}} }
        
        async function compressImage(file) {
            return new Promise(function(resolve) {
                if (!file || !file.type || file.type.indexOf('image/')!==0) { resolve(file); return; }
                var reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = function(e) { var img = new Image(); img.src = e.target.result;
                    img.onload = function() { var w=img.width, h=img.height, maxDim=600;
                        if (w>maxDim||h>maxDim) { if(w>h){h=Math.round((h*maxDim)/w);w=maxDim;}else{w=Math.round((w*maxDim)/h);h=maxDim;} }
                        var canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
                        canvas.getContext('2d').drawImage(img,0,0,w,h);
                        canvas.toBlob(function(blob){resolve(new File([blob],file.name.replace(/\.[^.]+$/,'.jpg'),{type:'image/jpeg'}));},'image/jpeg',0.5);
                    };
                };
            });
        }
        
        function toast(msg, type) { type=type||'success'; var c=document.getElementById('toastContainer'); var el=document.createElement('div'); el.className='toast '+type; el.innerHTML='<i class="fas fa-'+(type==='success'?'check-circle':'exclamation-circle')+'"></i> '+msg; c.appendChild(el); setTimeout(function(){el.style.opacity='0';el.style.transform='translateX(100%)';setTimeout(function(){el.remove();},300);},4000); }
        window.fastNavigate=function(url){window.location.href=url;};
        
        async function checkSession() {
            try {
                var res=await sb.auth.getSession();
                if (res&&res.data&&res.data.session) {
                    var prof=await safeFetch(function(){return sb.from('users').select('role').eq('id',res.data.session.user.id).single();});
                    var role=prof.data?prof.data.role:null;
                    if (role===1||role==='1'||role==='admin') { currentAdmin=res.data.session.user; await loadAllData(); renderApp(); showApp(); initComplete=true; return; }
                    window.location.href='index.html'; return;
                }
                showLogin(); showApp(); initComplete=true;
            } catch(e) { showLogin(); showApp(); initComplete=true; }
        }
        
        async function loadAllData() {
            try {
                var results=await Promise.allSettled([
                    safeFetch(function(){return sb.from('users').select('*').order('created_at',{ascending:false});}),
                    safeFetch(function(){return sb.from('shops').select('*').order('created_at',{ascending:false});}),
                    safeFetch(function(){return sb.from('products').select('*, shops(name)').order('created_at',{ascending:false});}),
                    safeFetch(function(){return sb.from('categories').select('*').order('priority');}),
                    safeFetch(function(){return sb.from('offers').select('*').order('priority');}),
                    safeFetch(function(){return sb.from('sliders').select('*').order('display_order');}),
                    safeFetch(function(){return sb.from('orders').select('*').order('created_at',{ascending:false});}),
                    safeFetch(function(){return sb.from('app_settings').select('*');})
                ]);
                allUsers=results[0].status==='fulfilled'?(results[0].value.data||[]):[];
                allShops=results[1].status==='fulfilled'?(results[1].value.data||[]):[];
                allProducts=results[2].status==='fulfilled'?(results[2].value.data||[]):[];
                allCategories=results[3].status==='fulfilled'?(results[3].value.data||[]):[];
                allOffers=results[4].status==='fulfilled'?(results[4].value.data||[]):[];
                allSliders=results[5].status==='fulfilled'?(results[5].value.data||[]):[];
                allOrders=results[6].status==='fulfilled'?(results[6].value.data||[]):[];
                if (results[7].status==='fulfilled'&&results[7].value.data) { appSettingsData={}; for(var i=0;i<results[7].value.data.length;i++){appSettingsData[results[7].value.data[i].key]=results[7].value.data[i].value;} }
            } catch(e) { toast('Failed to load data: '+e.message,'error'); }
        }
        
        function showLogin() {
            document.getElementById('app').innerHTML='<div class="login-container"><div class="login-card"><div class="login-logo"><span class="login-zy">Zy</span><span class="login-mart">mart</span></div><div class="login-subtitle">Admin Panel</div><div class="login-error" id="loginError"></div><div id="loginStepEmail"><input type="email" id="adminEmail" class="login-input" placeholder="Admin Email"><button class="login-btn" onclick="sendAdminOTP()">Send OTP</button></div><div id="loginStepOTP" style="display:none;"><p style="font-size:13px;margin-bottom:8px;">OTP sent to: <strong id="otpEmailDisplay"></strong></p><input type="text" id="adminOtp" class="login-input" placeholder="Enter OTP" maxlength="6" inputmode="numeric"><button class="login-btn" onclick="verifyAdminOTP()">Verify & Login</button><button class="login-btn" id="resendAdminBtn" onclick="resendAdminOTP()" style="background:transparent;border:1px solid var(--neutral-border);color:var(--neutral-dark);">Resend OTP</button><button class="login-back" onclick="backToAdminEmail()">← Back</button></div><button class="login-back" style="margin-top:14px;" onclick="fastNavigate(\'index.html\')">← Go to Home</button></div></div>';
        }
        
        window.sendAdminOTP=async function(){var email=document.getElementById('adminEmail').value.trim();var errEl=document.getElementById('loginError');if(!email){errEl.style.display='block';errEl.textContent='Enter admin email';return;}errEl.style.display='none';var btn=document.querySelector('#loginStepEmail .login-btn');btn.disabled=true;btn.textContent='Sending...';try{var res=await sb.auth.signInWithOtp({email:email,options:{shouldCreateUser:false}});if(res&&res.error){errEl.style.display='block';errEl.textContent=res.error.message;btn.disabled=false;btn.textContent='Send OTP';return;}currentOtpEmail=email;document.getElementById('otpEmailDisplay').textContent=email;document.getElementById('loginStepEmail').style.display='none';document.getElementById('loginStepOTP').style.display='block';startOtpTimer();toast('✅ OTP sent!','success');}catch(e){errEl.style.display='block';errEl.textContent='Failed: '+e.message;btn.disabled=false;btn.textContent='Send OTP';}};
        window.verifyAdminOTP=async function(){var otp=document.getElementById('adminOtp').value.trim();var errEl=document.getElementById('loginError');if(!otp||otp.length<4){errEl.style.display='block';errEl.textContent='Enter valid OTP';return;}errEl.style.display='none';var btn=document.querySelector('#loginStepOTP .login-btn');btn.disabled=true;btn.textContent='Verifying...';try{var res=await sb.auth.verifyOtp({email:currentOtpEmail,token:otp,type:'email'});if(res&&res.error){errEl.style.display='block';errEl.textContent='Invalid: '+res.error.message;btn.disabled=false;btn.textContent='Verify & Login';return;}var prof=await safeFetch(function(){return sb.from('users').select('role').eq('id',res.data.user.id).single();});var role=prof.data?prof.data.role:null;if(role!==1&&role!=='1'&&role!=='admin'){await sb.auth.signOut();errEl.style.display='block';errEl.textContent='Access denied. Admin only.';btn.disabled=false;btn.textContent='Verify & Login';return;}currentAdmin=res.data.user;toast('✅ Login successful!','success');await loadAllData();renderApp();}catch(e){errEl.style.display='block';errEl.textContent='Error: '+e.message;btn.disabled=false;btn.textContent='Verify & Login';}};
        window.resendAdminOTP=async function(){if(!currentOtpEmail){backToAdminEmail();return;}var btn=document.getElementById('resendAdminBtn');btn.disabled=true;btn.textContent='Sending...';try{await sb.auth.signInWithOtp({email:currentOtpEmail,options:{shouldCreateUser:false}});startOtpTimer();toast('✅ New OTP sent!','success');}catch(e){toast('Failed','error');}btn.disabled=false;btn.textContent='Resend OTP';};
        function startOtpTimer(){var s=60,b=document.getElementById('resendAdminBtn');if(!b)return;if(otpTimerInterval)clearInterval(otpTimerInterval);b.disabled=true;b.style.opacity='0.6';otpTimerInterval=setInterval(function(){s--;b.textContent='Resend ('+s+'s)';if(s<=0){clearInterval(otpTimerInterval);b.disabled=false;b.style.opacity='1';b.textContent='Resend OTP';}},1000);}
        window.backToAdminEmail=function(){if(otpTimerInterval)clearInterval(otpTimerInterval);document.getElementById('loginStepOTP').style.display='none';document.getElementById('loginStepEmail').style.display='block';document.getElementById('adminOtp').value='';currentOtpEmail=null;};

        function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');}
        
        function loadSection(section) {
            currentSection=section;
            var items=document.querySelectorAll('.menu-item');for(var i=0;i<items.length;i++)items[i].classList.remove('active');
            var titles={dashboard:'Dashboard',shops:'Shop Management',users:'Users',categories:'Categories',products:'Products',offers:'Hot Offers',sliders:'Hero Sliders',orders:'Orders',settings:'Settings',broadcast:'WhatsApp Broadcast'};
            document.getElementById('pageTitle').textContent=titles[section]||section;
            document.getElementById('sidebar').classList.remove('open');
            var content=document.getElementById('contentArea');
            if(section==='dashboard')renderDashboard(content);
            else if(section==='shops')renderShops(content);
            else if(section==='users')renderUsers(content);
            else if(section==='categories')renderCategories(content);
            else if(section==='products')renderProducts(content);
            else if(section==='offers')renderOffers(content);
            else if(section==='sliders')renderSliders(content);
            else if(section==='orders')renderOrders(content);
            else if(section==='settings')renderSettings(content);
            else if(section==='broadcast')renderBroadcast(content);
        }
        
        function renderDashboard(c) {
            var pending=allShops.filter(function(s){return s.status==='pending';}).length;
            var featuredCount=allProducts.filter(function(p){return p.is_featured===true;}).length;
            var revenue=0;for(var i=0;i<allOrders.length;i++){if(allOrders[i].status!=='cancelled')revenue+=parseFloat(allOrders[i].total_amount)||0;}
            c.innerHTML=
                '<div class="stats-grid">'+
                '<div class="stat-card" onclick="loadSection(\'users\')"><div class="stat-icon blue"><i class="fas fa-users"></i></div><div class="stat-info"><h3>'+allUsers.length+'</h3><p>Total Users</p></div></div>'+
                '<div class="stat-card" onclick="loadSection(\'shops\')"><div class="stat-icon green"><i class="fas fa-store"></i></div><div class="stat-info"><h3>'+allShops.length+'</h3><p>Shops ('+pending+' pending)</p></div></div>'+
                '<div class="stat-card" onclick="loadSection(\'products\')"><div class="stat-icon orange"><i class="fas fa-box"></i></div><div class="stat-info"><h3>'+allProducts.length+'</h3><p>Products ('+featuredCount+' featured)</p></div></div>'+
                '<div class="stat-card"><div class="stat-icon purple"><i class="fas fa-rupee-sign"></i></div><div class="stat-info"><h3>₹'+revenue.toLocaleString('en-IN')+'</h3><p>Revenue</p></div></div></div>'+
                '<div class="content-card"><div class="card-header"><h2>Quick Actions</h2></div><div style="padding:16px;display:flex;gap:10px;flex-wrap:wrap;">'+
                '<button class="btn btn-primary" onclick="loadSection(\'shops\')">Manage Shops</button>'+
                '<button class="btn btn-warning" onclick="loadSection(\'offers\')">Hot Offers</button>'+
                '<button class="btn btn-primary" onclick="loadSection(\'sliders\')">Sliders</button>'+
                '<button class="btn btn-success" onclick="loadSection(\'broadcast\')"><i class="fab fa-whatsapp"></i> Broadcast</button>'+
                '<button class="btn btn-outline" onclick="loadSection(\'settings\')">Settings</button></div></div>';
        }
        
        // SHOPS
        function renderShops(c){c.innerHTML='<div class="content-card"><div class="card-header"><h2>Shop Management</h2></div><div class="search-box"><input type="text" id="shopSearch" placeholder="Search shops..." onkeyup="filterShops()"></div><div class="tabs"><button class="tab-btn active" onclick="setShopFilter(\'all\', this)">All</button><button class="tab-btn" onclick="setShopFilter(\'pending\', this)">Pending</button><button class="tab-btn" onclick="setShopFilter(\'approved\', this)">Approved</button></div><div id="shopsList"></div></div>';filterShops();}
        window.setShopFilter=function(filter,btn){shopFilter=filter;var tabs=document.querySelectorAll('#contentArea .tab-btn');for(var i=0;i<tabs.length;i++)tabs[i].classList.remove('active');btn.classList.add('active');filterShops();};
        window.filterShops=function(){var term=(document.getElementById('shopSearch')?.value||'').toLowerCase();var filtered=allShops.filter(function(s){if(shopFilter!=='all'&&s.status!==shopFilter)return false;if(term&&!(s.name||'').toLowerCase().includes(term)&&!(s.owner_name||'').toLowerCase().includes(term)&&!(s.city||'').toLowerCase().includes(term))return false;return true;});var el=document.getElementById('shopsList');if(!filtered.length){el.innerHTML='<div class="empty-state"><i class="fas fa-store-slash"></i><p>No shops found</p></div>';return;}var html='<div class="table-wrapper"><table class="data-table"><thead><tr><th>Image</th><th>Shop Name</th><th>Owner</th><th>City</th><th>Status</th><th>Actions</th></tr></thead><tbody>';for(var i=0;i<filtered.length;i++){var s=filtered[i],imgUrl=getImageUrl(s.image_url);html+='<tr><td><div class="shop-thumb">'+(imgUrl?'<img src="'+imgUrl+'" onerror="this.parentElement.innerHTML=\'<i class=\\\'fas fa-store\\\'></i>\';">':'<i class="fas fa-store"></i>')+'</div></td><td><strong>'+escapeHTML(s.name||'-')+'</strong></td><td>'+escapeHTML(s.owner_name||'-')+'</td><td>'+escapeHTML(s.city||'-')+'</td><td><span class="badge '+(s.status==='approved'?'badge-success':'badge-warning')+'">'+s.status+'</span></td><td><div class="btn-group">'+(s.status==='pending'?'<button class="btn btn-success btn-sm" onclick="approveShop(\''+s.id+'\')">Approve</button>':'')+'<button class="btn btn-danger btn-sm" onclick="deleteShop(\''+s.id+'\')">Delete</button></div></td></tr>';}html+='</tbody></table></div>';el.innerHTML=html;};
        window.approveShop=async function(id){var shop=allShops.find(function(s){return s.id===id;});if(!shop){toast('Shop not found','error');return;}if(!shop.owner_email){toast('Owner email missing!','error');return;}try{var existingUser=await safeFetch(function(){return sb.from('users').select('id').eq('email',shop.owner_email).maybeSingle();});var userId=null;if(existingUser.data){userId=existingUser.data.id;await safeFetch(function(){return sb.from('users').update({role:2,name:shop.owner_name||'',phone:shop.owner_phone||''}).eq('id',userId);});}else{var tempPassword='Zy'+Math.random().toString(36).slice(2,10)+'@1';var signUpRes=await sb.auth.signUp({email:shop.owner_email,password:tempPassword,options:{data:{name:shop.owner_name||'',phone:shop.owner_phone||'',role:2}}});if(signUpRes.error){if(signUpRes.error.message.indexOf('already')>-1){var retryUser=await safeFetch(function(){return sb.from('users').select('id').eq('email',shop.owner_email).maybeSingle();});if(retryUser.data){userId=retryUser.data.id;await safeFetch(function(){return sb.from('users').update({role:2}).eq('id',userId);});}}else{toast('Failed: '+signUpRes.error.message,'error');return;}}else{userId=signUpRes.data.user.id;await safeFetch(function(){return sb.from('users').upsert({id:userId,email:shop.owner_email,name:shop.owner_name||'',phone:shop.owner_phone||'',role:2});});}}if(!userId){toast('Could not determine user ID','error');return;}await safeFetch(function(){return sb.from('shops').update({status:'approved',owner_id:userId}).eq('id',id);});toast('✅ Shop approved!','success');}catch(e){toast('Error: '+e.message,'error');}await loadAllData();filterShops();};
        window.deleteShop=async function(id){if(!confirm('Delete this shop permanently?'))return;try{await sb.from('products').delete().eq('shop_id',id);await sb.from('shops').delete().eq('id',id);toast('✅ Shop deleted!','success');await loadAllData();filterShops();}catch(e){toast('❌ Delete failed','error');}};
        
        // USERS
        function renderUsers(c){c.innerHTML='<div class="content-card"><div class="card-header"><h2>Users</h2></div><div class="search-box"><input type="text" id="userSearch" placeholder="Search users..." onkeyup="filterUsers()"></div><div id="usersList"></div></div>';filterUsers();}
        window.filterUsers=function(){var term=(document.getElementById('userSearch')?.value||'').toLowerCase();var filtered=allUsers.filter(function(u){return !term||(u.name||'').toLowerCase().includes(term)||(u.email||'').toLowerCase().includes(term);});var el=document.getElementById('usersList');if(!filtered.length){el.innerHTML='<div class="empty-state"><p>No users</p></div>';return;}var html='<div class="table-wrapper"><table class="data-table"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Action</th></tr></thead><tbody>';for(var i=0;i<filtered.length;i++){var u=filtered[i];html+='<tr><td><strong>'+escapeHTML(u.name||'-')+'</strong></td><td>'+escapeHTML(u.email)+'</td><td>'+escapeHTML(u.phone||'-')+'</td><td><span class="badge '+(u.role==1?'badge-danger':u.role==2?'badge-success':'badge-warning')+'">'+(u.role==1?'Admin':u.role==2?'Shop Owner':'User')+'</span></td><td><button class="btn btn-danger btn-sm" onclick="deleteUser(\''+u.id+'\')">Delete</button></td></tr>';}html+='</tbody></table></div>';el.innerHTML=html;};
        window.deleteUser=async function(id){if(confirm('Delete user?')){await sb.from('users').delete().eq('id',id);toast('Deleted','success');await loadAllData();filterUsers();}};
        
        // CATEGORIES
        function renderCategories(c){c.innerHTML='<div class="content-card"><div class="card-header"><h2>Categories</h2><button class="btn btn-primary btn-sm" onclick="showCategoryModal()">+ Add</button></div><div class="card-grid" id="catGrid"></div></div>';var grid=document.getElementById('catGrid');if(!allCategories.length){grid.innerHTML='<div class="empty-state"><p>No categories</p></div>';return;}var html='';for(var i=0;i<allCategories.length;i++){var cat=allCategories[i],imgUrl=getImageUrl(cat.image_url);html+='<div class="card-item"><div class="card-item-img">'+(imgUrl?'<img src="'+imgUrl+'" onerror="this.parentElement.innerHTML=\'<i class=\\\'fas fa-folder\\\'></i>\';">':'<i class="fas fa-folder"></i>')+'</div><div class="card-item-body"><div class="card-item-title">'+escapeHTML(cat.name)+'</div><div class="btn-group"><button class="btn btn-warning btn-sm" onclick="showCategoryModal(\''+cat.id+'\')">Edit</button><button class="btn btn-danger btn-sm" onclick="deleteCategory(\''+cat.id+'\')">Delete</button></div></div></div>';}grid.innerHTML=html;}
        window.showCategoryModal=function(id){catEditId=id||null;var cat=id?allCategories.find(function(c){return c.id===id;}):null;var existingImg=cat&&cat.image_url?getImageUrl(cat.image_url):'';var html='<div class="modal-header"><h3>'+(cat?'Edit':'Add')+' Category</h3><button class="modal-close" onclick="closeModal()">✕</button></div>';html+='<div class="form-group"><label class="form-label">Name</label><input type="text" id="catName" class="form-control" value="'+escapeHTML(cat?cat.name:'')+'"></div>';html+='<div class="form-group"><label class="form-label">Image</label><div class="image-upload-box" onclick="document.getElementById(\'catImgInput\').click()"><i class="fas fa-cloud-upload-alt"></i> Click to upload<input type="file" id="catImgInput" accept="image/*" style="display:none" onchange="handleCatImage(this)"><img id="catImgPreview" class="image-preview" src="'+existingImg+'" style="'+(existingImg?'display:block;':'')+'"></div></div>';html+='<div style="display:flex;gap:10px;margin-top:16px;"><button class="btn btn-primary" style="flex:1;" onclick="saveCategory()">Save</button><button class="btn btn-outline" style="flex:1;" onclick="closeModal()">Cancel</button></div>';var modal=document.createElement('div');modal.className='modal-overlay show';modal.id='modalContainer';modal.innerHTML='<div class="modal-container">'+html+'</div>';document.body.appendChild(modal);catImageFile=null;};
        window.handleCatImage=async function(input){var f=input.files[0];if(!f)return;catImageFile=await compressImage(f);var reader=new FileReader();reader.onload=function(e){var preview=document.getElementById('catImgPreview');if(preview){preview.src=e.target.result;preview.style.display='block';}};reader.readAsDataURL(catImageFile);};
        window.saveCategory=async function(){var name=document.getElementById('catName').value.trim();if(!name){toast('Enter name','error');return;}var imageUrl='';var existingPreview=document.getElementById('catImgPreview');if(catImageFile){try{var fn='cat_'+Date.now()+'_'+Math.random().toString(36).substr(2,6)+'.jpg';var uploadResult=await sb.storage.from('category-images').upload(fn,catImageFile,{cacheControl:'3600'});if(uploadResult.error){toast('Upload failed','error');return;}var urlResult=sb.storage.from('category-images').getPublicUrl(fn);imageUrl=urlResult.data.publicUrl;}catch(e){toast('Upload error','error');return;}}else if(existingPreview&&existingPreview.src&&existingPreview.src.indexOf('http')===0&&existingPreview.src.indexOf('data:')!==0){imageUrl=existingPreview.src;}var data={name:name,image_url:imageUrl||null,is_active:true};if(catEditId){await sb.from('categories').update(data).eq('id',catEditId);toast('Updated!','success');}else{await sb.from('categories').insert([data]);toast('Added!','success');}closeModal();await loadAllData();renderCategories(document.getElementById('contentArea'));};
        window.deleteCategory=async function(id){if(!confirm('Delete?'))return;await sb.from('categories').delete().eq('id',id);toast('Deleted','success');await loadAllData();renderCategories(document.getElementById('contentArea'));};
        window.closeModal=function(){var modal=document.getElementById('modalContainer');if(modal)modal.remove();};
        
        // PRODUCTS
        function renderProducts(c){c.innerHTML='<div class="content-card"><div class="card-header"><h2>Products ('+allProducts.length+')</h2></div><div class="tabs"><button class="tab-btn active" onclick="setProductFilter(\'all\', this)">All</button><button class="tab-btn" onclick="setProductFilter(\'featured\', this)">⭐ Featured</button></div><div class="card-grid" id="prodGrid"></div></div>';filterProducts();}
        window.setProductFilter=function(filter,btn){productFilter=filter;var tabs=document.querySelectorAll('#contentArea .tab-btn');for(var i=0;i<tabs.length;i++)tabs[i].classList.remove('active');btn.classList.add('active');filterProducts();};
        window.filterProducts=function(){var filtered=allProducts.filter(function(p){if(productFilter==='featured'&&!p.is_featured)return false;return true;});var grid=document.getElementById('prodGrid');if(!filtered.length){grid.innerHTML='<div class="empty-state"><p>No products</p></div>';return;}var html='';for(var i=0;i<filtered.length;i++){var p=filtered[i],img=getImageUrl((p.images&&p.images[0])||p.image_url||'');html+='<div class="card-item'+(p.is_featured?' featured':'')+'>'+(p.is_featured?'<span class="featured-badge">⭐ Featured</span>':'')+'<div class="card-item-img">'+(img?'<img src="'+img+'" onerror="this.parentElement.innerHTML=\'<i class=\\\'fas fa-box\\\'></i>\';">':'<i class="fas fa-box"></i>')+'</div><div class="card-item-body"><div class="card-item-title">'+escapeHTML(p.name)+'</div><div>₹'+Number(p.price).toLocaleString('en-IN')+' | '+(p.shops?escapeHTML(p.shops.name):'-')+'</div><div class="btn-group" style="margin-top:8px;">'+(p.is_featured?'<button class="btn btn-outline btn-sm" onclick="toggleFeatured(\''+p.id+'\', false)" style="background:#FEF2F2;color:#DC2626;border-color:#FECACA;">Unfeature</button>':'<button class="btn btn-featured btn-sm" onclick="toggleFeatured(\''+p.id+'\', true)">⭐ Feature</button>')+'<button class="btn btn-danger btn-sm" onclick="deleteProduct(\''+p.id+'\')">Delete</button></div></div></div>';}grid.innerHTML=html;};
        window.toggleFeatured=async function(id,featured){try{await safeFetch(function(){return sb.from('products').update({is_featured:featured}).eq('id',id);});var p=allProducts.find(function(pr){return pr.id===id;});if(p)p.is_featured=featured;toast(featured?'⭐ Marked as Featured!':'Featured removed','success');filterProducts();}catch(e){toast('Failed: '+e.message,'error');}};
        window.deleteProduct=async function(id){if(!confirm('Delete?'))return;await sb.from('products').delete().eq('id',id);toast('Deleted','success');await loadAllData();filterProducts();};
        
        // OFFERS
        function renderOffers(c){c.innerHTML='<div class="content-card"><div class="card-header"><h2>Hot Offers</h2><button class="btn btn-primary btn-sm" onclick="showOfferModal()">+ Add</button></div><div class="card-grid" id="offerGrid"></div></div>';var grid=document.getElementById('offerGrid');if(!allOffers.length){grid.innerHTML='<div class="empty-state"><p>No offers</p></div>';return;}var html='';for(var i=0;i<allOffers.length;i++){var o=allOffers[i],imgUrl=o.image_url?getImageUrl(o.image_url):'';html+='<div class="card-item"><div class="card-item-img">'+(imgUrl?'<img src="'+imgUrl+'" onerror="this.parentElement.innerHTML=\'<div style=\\\'background:linear-gradient(135deg,#F59E0B,#E8890A);display:flex;align-items:center;justify-content:center;color:white;font-size:28px;\\\'>\\\''+o.discount_value+(o.discount_type==='percentage'?'%':'₹')+'\\\'</div>\';">':'<div style="background:linear-gradient(135deg,#F59E0B,#E8890A);display:flex;align-items:center;justify-content:center;color:white;font-size:28px;height:100%;">'+o.discount_value+(o.discount_type==='percentage'?'%':'₹')+'</div>')+'</div><div class="card-item-body"><div class="card-item-title">'+escapeHTML(o.title)+'</div><button class="btn btn-danger btn-sm" onclick="deleteOffer(\''+o.id+'\')" style="margin-top:8px;">Delete</button></div></div>';}grid.innerHTML=html;}
        window.showOfferModal=function(){offerImageFile=null;var html='<div class="modal-header"><h3>Add Offer</h3><button class="modal-close" onclick="closeModal()">✕</button></div>';html+='<div class="form-group"><label>Title *</label><input type="text" id="offerTitle" class="form-control"></div>';html+='<div style="display:flex;gap:10px;"><div class="form-group" style="flex:1;"><label>Type</label><select id="offerType" class="form-control"><option value="percentage">Percentage</option><option value="fixed">Fixed (₹)</option></select></div><div class="form-group" style="flex:1;"><label>Value *</label><input type="number" id="offerValue" class="form-control"></div></div>';html+='<div class="form-group"><label>Image</label><div class="image-upload-box" onclick="document.getElementById(\'offerImgInput\').click()"><i class="fas fa-cloud-upload-alt"></i> Click to upload<input type="file" id="offerImgInput" accept="image/*" style="display:none" onchange="handleOfferImage(this)"><img id="offerImgPreview" class="image-preview"></div></div>';html+='<div style="display:flex;gap:10px;margin-top:16px;"><button class="btn btn-primary" style="flex:1;" onclick="saveOffer()">Save</button><button class="btn btn-outline" style="flex:1;" onclick="closeModal()">Cancel</button></div>';var modal=document.createElement('div');modal.className='modal-overlay show';modal.id='modalContainer';modal.innerHTML='<div class="modal-container">'+html+'</div>';document.body.appendChild(modal);};
        window.handleOfferImage=async function(input){var f=input.files[0];if(!f)return;offerImageFile=await compressImage(f);var reader=new FileReader();reader.onload=function(e){var preview=document.getElementById('offerImgPreview');if(preview){preview.src=e.target.result;preview.style.display='block';}};reader.readAsDataURL(offerImageFile);};
        window.saveOffer=async function(){var title=document.getElementById('offerTitle').value.trim();var type=document.getElementById('offerType').value;var value=parseFloat(document.getElementById('offerValue').value);if(!title||!value){toast('Fill required fields','error');return;}var imageUrl='';if(offerImageFile){try{var fn='offer_'+Date.now()+'_'+Math.random().toString(36).substr(2,6)+'.jpg';var uploadResult=await sb.storage.from('offer-images').upload(fn,offerImageFile,{cacheControl:'3600'});if(uploadResult.error){toast('Upload failed','error');return;}var urlResult=sb.storage.from('offer-images').getPublicUrl(fn);imageUrl=urlResult.data.publicUrl;}catch(e){toast('Upload error','error');return;}}await sb.from('offers').insert([{title:title,discount_type:type,discount_value:value,apply_to:'global',image_url:imageUrl||null,is_active:true,priority:allOffers.length+1}]);toast('Offer created!','success');closeModal();await loadAllData();renderOffers(document.getElementById('contentArea'));};

        window.showSliderModal=function(){var html='<div class="modal-header"><h3>Add Slider</h3><button class="modal-close" onclick="closeModal()">✕</button></div>';html+='<div class="form-group"><label>Image</label><div class="image-upload-box" onclick="document.getElementById(\'sliderInput\').click()"><i class="fas fa-cloud-upload-alt"></i> Click to upload<input type="file" id="sliderInput" accept="image/*" style="display:none" onchange="handleSliderImage(this)"><img id="sliderImgPreview" class="image-preview"></div></div>';html+='<div class="form-group"><label>Title</label><input type="text" id="sliderTitle" class="form-control"></div>';html+='<div class="form-group"><label>Link</label><input type="text" id="sliderLink" class="form-control" placeholder="products.html"></div>';html+='<div style="display:flex;gap:10px;"><button class="btn btn-primary" style="flex:1;" onclick="saveSlider()">Save</button><button class="btn btn-outline" style="flex:1;" onclick="closeModal()">Cancel</button></div>';var modal=document.createElement('div');modal.className='modal-overlay show';modal.id='modalContainer';modal.innerHTML='<div class="modal-container">'+html+'</div>';document.body.appendChild(modal);sliderImageFile=null;};
        window.handleSliderImage=async function(input){var f=input.files[0];if(!f)return;sliderImageFile=await compressImage(f);var reader=new FileReader();reader.onload=function(e){var preview=document.getElementById('sliderImgPreview');if(preview){preview.src=e.target.result;preview.style.display='block';}};reader.readAsDataURL(sliderImageFile);};
        window.saveSlider=async function(){if(!sliderImageFile){toast('Select image','error');return;}try{var fn='slider_'+Date.now()+'_'+Math.random().toString(36).substr(2,6)+'.jpg';var uploadResult=await sb.storage.from('slider-images').upload(fn,sliderImageFile,{cacheControl:'3600'});if(uploadResult.error){toast('Upload failed','error');return;}var urlResult=sb.storage.from('slider-images').getPublicUrl(fn);var imageUrl=urlResult.data.publicUrl;var title=document.getElementById('sliderTitle').value.trim();var link=document.getElementById('sliderLink').value.trim();await sb.from('sliders').insert([{image_url:imageUrl,title:title,link:link,is_active:true,display_order:allSliders.length+1}]);toast('Slider added!','success');closeModal();await loadAllData();renderSliders(document.getElementById('contentArea'));}catch(e){toast('Error','error');}};

        // ORDERS
        function renderOrders(c){c.innerHTML='<div class="content-card"><div class="card-header"><h2>Orders</h2></div><div id="ordersList"></div></div>';var el=document.getElementById('ordersList');if(!allOrders.length){el.innerHTML='<div class="empty-state"><p>No orders</p></div>';return;}var html='<div class="table-wrapper"><table class="data-table"><thead><tr><th>Order ID</th><th>Customer</th><th>Amount</th><th>Status</th><th>Date</th><th>Action</th></tr></thead><tbody>';for(var i=0;i<allOrders.length;i++){var o=allOrders[i];html+='<tr><td>#'+(o.id||'').substring(0,8).toUpperCase()+'</td><td>'+escapeHTML(o.customer_name||'Guest')+'</td><td>₹'+(parseFloat(o.total_amount)||0).toLocaleString('en-IN')+'</td><td><span class="badge '+(o.status==='delivered'?'badge-success':'badge-warning')+'">'+o.status+'</span></td><td>'+(o.created_at?new Date(o.created_at).toLocaleDateString('en-IN'):'-')+'</td><td><button class="btn btn-danger btn-sm" onclick="deleteOrder(\''+o.id+'\')">Delete</button></td></tr>';}html+='</tbody></table></div>';el.innerHTML=html;}

            (currentBannerUrl?'<div style="margin-bottom:10px;"><p style="font-size:10px;color:var(--neutral-gray);margin-bottom:4px;">Current Banner:</p><img src="'+currentBannerUrl+'" class="current-banner-preview" onerror="this.style.display=\'none\';"></div>':'<div style="margin-bottom:10px;padding:12px;background:#F3F4F6;border-radius:var(--radius-sm);text-align:center;color:var(--neutral-gray);font-size:12px;"><i class="fas fa-image"></i> No banner — using default green gradient</div>')+
            '<div class="image-upload-box" onclick="document.getElementById(\'bannerImgInput\').click()" style="margin-bottom:8px;"><i class="fas fa-cloud-upload-alt"></i> Upload new banner<input type="file" id="bannerImgInput" accept="image/*" style="display:none" onchange="handleBannerImage(this)"><img id="bannerImgPreview" class="image-preview"></div>'+
            '<div style="display:flex;gap:8px;"><button class="btn btn-warning btn-sm" style="flex:1;" onclick="saveBanner()"><i class="fas fa-save"></i> Save Banner</button>'+(currentBanner?'<button class="btn btn-danger btn-sm" style="flex:1;" onclick="removeBanner()"><i class="fas fa-trash"></i> Remove</button>':'')+'</div></div>'+
            
            '<div style="display:flex;gap:12px;flex-wrap:wrap;"><div class="form-group" style="flex:1;min-width:150px;"><label class="form-label">Registration Fee (₹)</label><input type="number" id="regFee" class="form-control" value="'+regFee+'"></div><div class="form-group" style="flex:1;min-width:150px;"><label class="form-label">Delivery Fee (₹)</label><input type="number" id="delFee" class="form-control" value="'+delFee+'"></div><div class="form-group" style="flex:1;min-width:150px;"><label class="form-label">Free Delivery Above (₹)</label><input type="number" id="freeDel" class="form-control" value="'+freeDel+'"></div></div>'+
            
            '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;"><div class="form-group" style="flex:1;min-width:150px;"><label class="form-label">🎁 Invite Reward</label><input type="text" id="inviteReward" class="form-control" value="'+inviteReward+'" placeholder="50 or 10%"></div><div class="form-group" style="flex:1;min-width:150px;"><label class="form-label">🎫 New User Offer</label><input type="text" id="inviteOffer" class="form-control" value="'+inviteOffer+'" placeholder="25 or 15%"></div></div>'+
            '<p style="font-size:10px;color:var(--neutral-gray);margin-bottom:12px;">Use number for ₹ (e.g. 50) or number% for discount (e.g. 10%)</p>'+
            
            '<button class="btn btn-primary" onclick="saveSettings()">💾 Save All Settings</button>'+
            '<div style="margin-top:16px;padding:12px;background:#EDF7F1;border-radius:var(--radius-sm);font-size:12px;"><strong>📌 Current Values:</strong><br>Registration: <strong>₹'+regFee+'</strong> | Delivery: <strong>₹'+delFee+'</strong> | Free Above: <strong>₹'+freeDel+'</strong><br>Invite Reward: <strong>'+inviteReward+'</strong> | New User Offer: <strong>'+inviteOffer+'</strong></div>'+
            '</div></div>';
            bannerImageFile=null;
        }
        
        window.handleBannerImage=async function(input){var f=input.files[0];if(!f)return;bannerImageFile=await compressImage(f);var reader=new FileReader();reader.onload=function(e){var preview=document.getElementById('bannerImgPreview');if(preview){preview.src=e.target.result;preview.style.display='block';}};reader.readAsDataURL(bannerImageFile);};
        window.saveBanner=async function(){if(!bannerImageFile){toast('Select a banner image first!','error');return;}try{var fn='shop_register_banner_'+Date.now()+'.jpg';var uploadResult=await sb.storage.from('shop-images').upload('banners/'+fn,bannerImageFile,{cacheControl:'3600',upsert:true});if(uploadResult.error){toast('Upload failed: '+uploadResult.error.message,'error');return;}var urlResult=sb.storage.from('shop-images').getPublicUrl('banners/'+fn);var imageUrl=urlResult.data.publicUrl;await safeFetch(function(){return sb.from('app_settings').upsert([{key:'shop_register_banner',value:imageUrl}],{onConflict:'key'});});toast('✅ Banner saved!','success');appSettingsData['shop_register_banner']=imageUrl;bannerImageFile=null;renderSettings(document.getElementById('contentArea'));}catch(e){toast('❌ Error: '+e.message,'error');}};
        window.removeBanner=async function(){if(!confirm('Remove shop register banner?'))return;try{await safeFetch(function(){return sb.from('app_settings').upsert([{key:'shop_register_banner',value:''}],{onConflict:'key'});});toast('✅ Banner removed!','success');appSettingsData['shop_register_banner']='';bannerImageFile=null;renderSettings(document.getElementById('contentArea'));}catch(e){toast('❌ Error: '+e.message,'error');}};
        window.saveSettings=async function(){var regFee=document.getElementById('regFee').value;var delFee=document.getElementById('delFee').value;var freeDel=document.getElementById('freeDel').value;var inviteReward=document.getElementById('inviteReward').value;var inviteOffer=document.getElementById('inviteOffer').value;try{await safeFetch(function(){return sb.from('app_settings').upsert([{key:'registration_fee',value:regFee},{key:'delivery_fee',value:delFee},{key:'free_delivery_threshold',value:freeDel},{key:'invite_reward',value:inviteReward},{key:'invite_new_user_offer',value:inviteOffer}],{onConflict:'key'});});toast('✅ Settings saved!','success');appSettingsData['registration_fee']=regFee;appSettingsData['delivery_fee']=delFee;appSettingsData['free_delivery_threshold']=freeDel;appSettingsData['invite_reward']=inviteReward;appSettingsData['invite_new_user_offer']=inviteOffer;}catch(e){toast('❌ Save failed: '+e.message,'error');}};
        
        // BROADCAST
        function renderBroadcast(c){
            var usersWithPhone=allUsers.filter(function(u){return u.phone&&u.phone.length>=10;});
            var shopOwnersWithPhone=allUsers.filter(function(u){return(u.role==2||u.role==='2')&&u.phone&&u.phone.length>=10;});
            var html='<div class="content-card"><div class="card-header"><h2>📢 WhatsApp Broadcast</h2></div><div style="padding:16px;">';
            html+='<p style="font-size:13px;color:var(--neutral-gray);margin-bottom:16px;">Send WhatsApp message to users & shop owners.</p>';
            html+='<div class="form-group"><label class="form-label">Target Audience</label><select id="broadcastTarget" class="form-control" onchange="updateBroadcastPreview()"><option value="all">All Users ('+usersWithPhone.length+')</option><option value="shop_owners">Shop Owners ('+shopOwnersWithPhone.length+')</option><option value="custom">Custom Numbers</option></select></div>';
            html+='<div id="customNumbersDiv" style="display:none;"><div class="form-group"><label class="form-label">Phone Numbers (comma separated)</label><textarea id="customNumbers" class="form-control" rows="2" placeholder="+918600252238, +919XXXXXXXXX"></textarea></div></div>';
            html+='<div class="form-group"><label class="form-label">Message</label><textarea id="broadcastMessage" class="form-control" rows="3" onkeyup="updateCharCount()">Hello from Zymart! 🛍️\nCheck out our latest offers!</textarea><small id="charCount" style="color:var(--neutral-gray);">0 chars</small></div>';
            html+='<div class="broadcast-preview" id="broadcastPreview"></div>';
            html+='<div style="display:flex;gap:10px;margin-top:16px;"><button class="btn btn-success" style="flex:1;" onclick="sendBroadcast()"><i class="fab fa-whatsapp"></i> Open WhatsApp</button><button class="btn btn-outline btn-sm" onclick="copyPhoneNumbers()"><i class="fas fa-copy"></i> Copy Numbers</button></div>';
            html+='<p style="font-size:10px;color:var(--neutral-gray);margin-top:8px;">⚠️ Opens WhatsApp. Send manually after it opens.</p></div></div>';
            c.innerHTML=html;updateBroadcastPreview();updateCharCount();
        }
        window.updateBroadcastPreview=function(){var target=document.getElementById('broadcastTarget')?.value||'all';var customDiv=document.getElementById('customNumbersDiv');if(customDiv)customDiv.style.display=target==='custom'?'block':'none';var numbers=getTargetNumbers();var preview=document.getElementById('broadcastPreview');if(preview){preview.innerHTML='<strong>📋 Recipients ('+numbers.length+'):</strong><br>'+numbers.slice(0,10).join(', ')+(numbers.length>10?'... +'+(numbers.length-10)+' more':'');}};
        function getTargetNumbers(){var target=document.getElementById('broadcastTarget')?.value||'all';if(target==='custom'){var customText=document.getElementById('customNumbers')?.value||'';return customText.split(',').map(function(n){return n.trim();}).filter(function(n){return n.length>=10;});}var users=allUsers.filter(function(u){return u.phone&&u.phone.length>=10;});if(target==='shop_owners'){users=users.filter(function(u){return u.role==2||u.role==='2';});}return users.map(function(u){var phone=u.phone.replace(/[\s\-\(\)]/g,'');if(!phone.startsWith('+'))phone='+91'+phone;return phone;});}
        window.updateCharCount=function(){var msg=document.getElementById('broadcastMessage')?.value||'';var countEl=document.getElementById('charCount');if(countEl)countEl.textContent=msg.length+' chars';};
        window.sendBroadcast=function(){var numbers=getTargetNumbers();var message=document.getElementById('broadcastMessage')?.value||'';if(!numbers.length){toast('No phone numbers found!','error');return;}if(!message.trim()){toast('Enter a message!','error');return;}var encodedMsg=encodeURIComponent(message);var batch=numbers.slice(0,5);toast('Opening WhatsApp for '+batch.length+' recipients...','success');for(var i=0;i<batch.length;i++){var url='https://wa.me/'+batch[i].replace(/\+/g,'')+'?text='+encodedMsg;setTimeout(function(u){window.open(u,'_blank');},i*800,url);}if(numbers.length>5){setTimeout(function(){toast('⚠️ Only first 5 opened. Total: '+numbers.length,'error');},5000);}};
        window.copyPhoneNumbers=function(){var numbers=getTargetNumbers();if(!numbers.length){toast('No numbers to copy!','error');return;}var text=numbers.join(', ');if(navigator.clipboard){navigator.clipboard.writeText(text).then(function(){toast('📋 '+numbers.length+' numbers copied!','success');});}else{var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('📋 Numbers copied!','success');}};

        window.updateBroadcastPreview=updateBroadcastPreview;window.updateCharCount=updateCharCount;
