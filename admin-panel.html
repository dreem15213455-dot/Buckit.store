<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Admin Panel - ZyMart+</title>
    <meta name="theme-color" content="#0B5A31">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --brand-green: #0B5A31; 
            --brand-green-dark: #083D21; 
            --brand-orange: #F59E0B; 
            --neutral-white: #FFFFFF; 
            --neutral-bg: #F9FAFB; 
            --neutral-border: #E5E7EB; 
            --neutral-gray: #6B7280; 
            --neutral-dark: #1A1A1A; 
            --danger: #EF4444; 
            --success: #22C55E; 
            --warning: #F59E0B; 
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); 
            --shadow-sm: 0 1px 4px rgba(0,0,0,0.06); 
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08); 
            --shadow-lg: 0 8px 30px rgba(0,0,0,0.12); 
            --radius-sm: 10px; 
            --radius-md: 14px; 
            --radius-lg: 18px; 
            --radius-xl: 22px; 
            --radius-full: 9999px;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--neutral-bg); 
            color: var(--neutral-dark); 
            min-height: 100vh; 
            overflow-x: hidden; 
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        #simpleLoader { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--neutral-white); z-index: 10002; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; 
        }
        #simpleLoader.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
        .simple-spinner { width: 34px; height: 34px; border: 2.5px solid var(--neutral-border); border-top-color: var(--brand-orange); border-radius: 50%; animation: spin 0.7s linear infinite; }
        .loader-logo { font-family: 'Poppins', sans-serif; font-size: 24px; font-weight: 700; }
        .loader-zy { color: #A3E635; } .loader-mart { color: #FDE047; }
        
        .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #EDF7F1, #F9FAFB, #FFFFFF); padding: 20px; }
        .login-card { background: white; border-radius: var(--radius-xl); padding: 36px 28px; width: 100%; max-width: 400px; box-shadow: var(--shadow-lg); text-align: center; }
        .login-logo { font-family: 'Poppins', sans-serif; font-size: 32px; font-weight: 700; }
        .login-zy { color: #A3E635; } .login-mart { color: #FDE047; }
        .login-subtitle { color: var(--neutral-gray); font-size: 13px; margin-bottom: 24px; }
        .login-input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--neutral-border); border-radius: var(--radius-sm); font-size: 14px; margin-bottom: 12px; font-family: 'Inter', sans-serif; outline: none; background: var(--neutral-bg); }
        .login-input:focus { border-color: var(--brand-orange); }
        .login-error { background: #FEF2F2; color: #EF4444; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 12px; margin-bottom: 14px; display: none; }
        .login-btn { width: 100%; padding: 13px; background: var(--brand-green); color: white; border: none; border-radius: var(--radius-full); font-size: 15px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
        .login-btn:active { background: var(--brand-green-dark); transform: scale(0.98); }
        .login-btn:disabled { opacity: 0.6; }
        .login-back { background: none; border: none; color: var(--brand-green); cursor: pointer; margin-top: 10px; font-size: 13px; font-weight: 600; }
        
        .sidebar { position: fixed; left: 0; top: 0; width: 260px; height: 100vh; background: white; border-right: 1px solid var(--neutral-border); z-index: 100; overflow-y: auto; box-shadow: var(--shadow-sm); transition: transform 0.3s ease; }
        .sidebar-header { padding: 18px 14px; border-bottom: 1px solid var(--neutral-border); background: linear-gradient(135deg, #EDF7F1, white); }
        .sidebar-logo { font-family: 'Poppins', sans-serif; font-size: 24px; font-weight: 700; }
        .sidebar-zy { color: #A3E635; } .sidebar-mart { color: #FDE047; }
        .sidebar-version { font-size: 10px; color: var(--neutral-gray); }
        .sidebar-menu { padding: 8px 6px; }
        .menu-item { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: var(--radius-md); cursor: pointer; color: var(--neutral-gray); font-weight: 500; font-size: 12px; margin-bottom: 2px; border: none; background: none; width: 100%; text-align: left; font-family: 'Inter', sans-serif; }
        .menu-item:hover { background: #EDF7F1; }
        .menu-item.active { background: var(--brand-green); color: white; }
        .menu-item i { width: 18px; text-align: center; font-size: 13px; }
        .menu-divider { height: 1px; background: var(--neutral-border); margin: 6px 0; }
        .menu-badge { margin-left: auto; background: var(--danger); color: white; padding: 2px 7px; border-radius: var(--radius-full); font-size: 9px; font-weight: 700; }
        .sidebar-toggle { position: fixed; top: 10px; left: 10px; z-index: 101; width: 36px; height: 36px; background: var(--brand-green); color: white; border-radius: 50%; display: none; align-items: center; justify-content: center; cursor: pointer; border: none; font-size: 15px; box-shadow: var(--shadow-md); }
        
        .main-content { margin-left: 260px; padding: 16px 18px; min-height: 100vh; transition: margin-left 0.3s ease; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
        .page-title { font-family: 'Poppins', sans-serif; font-size: 22px; font-weight: 700; }
        .admin-info { display: flex; align-items: center; gap: 8px; background: white; padding: 6px 12px; border-radius: var(--radius-full); border: 1px solid var(--neutral-border); font-size: 12px; }
        .admin-avatar { width: 28px; height: 28px; background: linear-gradient(135deg, var(--brand-green), #22C55E); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
        .stat-card { background: white; border-radius: var(--radius-lg); padding: 14px 12px; display: flex; align-items: center; gap: 10px; border: 1px solid var(--neutral-border); box-shadow: var(--shadow-xs); cursor: pointer; }
        .stat-icon { width: 40px; height: 40px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 16px; color: white; }
        .stat-icon.green { background: linear-gradient(135deg, #22C55E, #16A34A); }
        .stat-icon.blue { background: linear-gradient(135deg, #3B82F6, #2563EB); }
        .stat-icon.orange { background: linear-gradient(135deg, #F59E0B, #EA580C); }
        .stat-icon.purple { background: linear-gradient(135deg, #8B5CF6, #6D28D9); }
        .stat-info h3 { font-family: 'Poppins', sans-serif; font-size: 20px; font-weight: 700; }
        .stat-info p { font-size: 10px; color: var(--neutral-gray); }
        
        .content-card { background: white; border-radius: var(--radius-lg); border: 1px solid var(--neutral-border); overflow: hidden; margin-bottom: 14px; box-shadow: var(--shadow-xs); }
        .card-header { padding: 12px 14px; border-bottom: 1px solid var(--neutral-border); display: flex; justify-content: space-between; align-items: center; background: #FAFAFA; flex-wrap: wrap; gap: 8px; }
        .card-header h2 { font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 700; }
        
        .btn { padding: 7px 13px; border-radius: var(--radius-full); font-size: 10px; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 4px; font-family: 'Inter', sans-serif; white-space: nowrap; transition: all 0.2s; }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--brand-green); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--brand-orange); color: white; }
        .btn-outline { background: white; color: var(--neutral-dark); border: 1px solid var(--neutral-border); }
        .btn-sm { padding: 5px 8px; font-size: 9px; }
        .btn-lg { padding: 10px 20px; font-size: 12px; }
        
        .badge { padding: 3px 8px; border-radius: var(--radius-full); font-size: 9px; font-weight: 700; display: inline-block; }
        .badge-success { background: #EDF7F1; color: #059669; }
        .badge-warning { background: #FFF8EB; color: #D97706; }
        .badge-danger { background: #FEF2F2; color: #DC2626; }
        .badge-info { background: #EFF6FF; color: #2563EB; }
        
        .form-group { margin-bottom: 14px; }
        .form-label { font-size: 12px; font-weight: 600; margin-bottom: 5px; display: block; color: var(--neutral-dark); }
        .form-control { width: 100%; padding: 10px 12px; border: 1.5px solid var(--neutral-border); border-radius: var(--radius-sm); font-size: 13px; font-family: 'Inter', sans-serif; outline: none; background: white; }
        .form-control:focus { border-color: var(--brand-orange); }
        .form-row { display: flex; gap: 10px; }
        .form-half { flex: 1; }
        textarea.form-control { resize: vertical; min-height: 60px; }
        select.form-control { -webkit-appearance: none; }
        
        .toggle-switch { position: relative; width: 50px; height: 26px; cursor: pointer; display: inline-block; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #D1D5DB; border-radius: 26px; transition: 0.3s; }
        .toggle-slider:before { content: ''; position: absolute; height: 20px; width: 20px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.3s; }
        .toggle-switch input:checked + .toggle-slider { background: var(--danger); }
        .toggle-switch input:checked + .toggle-slider:before { transform: translateX(24px); }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(8,61,33,0.7); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal-container { background: white; border-radius: var(--radius-xl); width: 92%; max-width: 550px; max-height: 85vh; overflow-y: auto; padding: 18px; animation: slideUp 0.3s ease; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--neutral-border); }
        .modal-header h3 { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 700; }
        .modal-close { width: 28px; height: 28px; background: var(--neutral-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; font-size: 12px; color: var(--neutral-gray); }
        
        .toast-container { position: fixed; top: 14px; right: 14px; z-index: 9999; display: flex; flex-direction: column; gap: 6px; }
        .toast { background: white; padding: 10px 14px; border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 6px; border-left: 4px solid var(--brand-green); animation: slideIn 0.3s ease; }
        .toast.error { border-left-color: var(--danger); }
        .toast.success { border-left-color: var(--success); }
        
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; padding: 12px; }
        .card-item { background: white; border: 1px solid var(--neutral-border); border-radius: var(--radius-lg); overflow: hidden; position: relative; cursor: pointer; transition: all 0.2s; }
        .card-item:hover { box-shadow: var(--shadow-md); }
        .card-item-img { width: 100%; height: 120px; background: #F3F4F6; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .card-item-img img { width: 100%; height: 100%; object-fit: contain; padding: 6px; }
        .card-item-img i { font-size: 30px; color: var(--brand-green); }
        .card-item-body { padding: 10px; }
        .card-item-title { font-weight: 700; font-size: 12px; margin-bottom: 3px; }
        .card-item-subtitle { font-size: 9px; color: var(--neutral-gray); margin-bottom: 6px; }
        .hold-badge { position: absolute; top: 6px; right: 6px; background: #F59E0B; color: white; padding: 2px 6px; border-radius: var(--radius-full); font-size: 8px; font-weight: 700; }
        .delete-req-badge { background: #FFF8EB; color: #D97706; padding: 3px 8px; border-radius: 6px; font-size: 9px; font-weight: 700; margin-bottom: 6px; display: inline-block; }
        .featured-badge { background: #EFF6FF; color: #2563EB; padding: 3px 8px; border-radius: 6px; font-size: 9px; font-weight: 700; margin-bottom: 6px; display: inline-block; }
        
        .image-upload-box { border: 2px dashed var(--brand-green); border-radius: var(--radius-md); padding: 12px; text-align: center; cursor: pointer; background: #EDF7F1; }
        .image-upload-box.has-image { border-style: solid; border-color: #22C55E; }
        .image-preview { max-width: 130px; max-height: 80px; border-radius: 10px; margin-top: 6px; display: none; }
        .image-preview.show { display: block; }
        
        .table-wrapper { overflow-x: auto; }
        .data-table { width: 100%; border-collapse: collapse; min-width: 600px; font-size: 12px; }
        .data-table th { text-align: left; padding: 10px; background: var(--neutral-bg); font-weight: 700; font-size: 10px; text-transform: uppercase; color: var(--neutral-gray); border-bottom: 2px solid var(--neutral-border); }
        .data-table td { padding: 8px 10px; border-bottom: 1px solid var(--neutral-border); }
        
        .empty-state { text-align: center; padding: 30px; color: var(--neutral-gray); }
        .empty-state i { font-size: 40px; margin-bottom: 8px; display: block; color: #D1D5DB; }
        
        .cat-checkbox-list { max-height: 200px; overflow-y: auto; border: 1px solid var(--neutral-border); border-radius: 8px; padding: 8px; }
        .cat-checkbox-label { display: flex; align-items: center; gap: 6px; padding: 4px 6px; font-size: 12px; cursor: pointer; border-radius: 4px; }
        .cat-checkbox-label:hover { background: #F3F4F6; }
        
        .slider-preview { width: 100%; height: 60px; object-fit: cover; border-radius: 8px; }
        
        @media(max-width: 1024px) { 
            .sidebar { transform: translateX(-100%); } 
            .sidebar.open { transform: translateX(0); } 
            .sidebar-toggle { display: flex; } 
            .main-content { margin-left: 0; padding: 12px; } 
            .stats-grid { grid-template-columns: repeat(2, 1fr); } 
        }
        @media(max-width: 640px) { 
            .stats-grid { grid-template-columns: 1fr; } 
            .card-grid { grid-template-columns: repeat(2, 1fr); } 
        }
    </style>
</head>
<body>

<div id="simpleLoader"><div class="simple-spinner"></div><div class="loader-logo"><span class="loader-zy">Zy</span><span class="loader-mart">Mart</span></div></div>

<div id="app"></div>

<div class="toast-container" id="toastContainer"></div>

<script>
(function() {
    'use strict';
    
    window.addEventListener('error', function(e) { console.error('[Admin]', e.message); });
    window.addEventListener('unhandledrejection', function(e) { console.error('[Admin]', e.reason); e.preventDefault(); });
    
    var CONFIG = {
        SUPABASE_URL: 'https://zwajyovemwdqtkecipeb.supabase.co',
        SUPABASE_KEY: 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1'
    };
    
    var sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
    var SUPABASE_URL = CONFIG.SUPABASE_URL;
    
    var currentAdmin = null;
    var allUsers = [], allShops = [], allProducts = [], allCategories = [], allOrders = [], allNotifications = [], allSections = [], allSliders = [], allAppSettings = [];
    var currentSection = 'dashboard';
    var catImageFile = null, catEditId = null;
    var otpTimerInterval = null, currentOtpEmail = null;
    var deliverySettingsData = null;
    var sessionRefreshTimer = null;
    
    function $(id) { return document.getElementById(id); }
    function esc(s) { if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function safeText(id, t) { var el = $(id); if(el) el.textContent = t; }
    
    function showApp() { 
        var l = $('simpleLoader'); 
        if(l) { l.classList.add('fade-out'); setTimeout(function() { if(l.parentNode) l.parentNode.removeChild(l); }, 200); } 
    }
    
    function getImageUrl(url) { 
        if(!url) return ''; 
        if(url.indexOf('http')===0 || url.indexOf('data:')===0) return url; 
        return SUPABASE_URL + '/storage/v1/object/public/' + url; 
    }
    
    async function safeFetch(fn, r) { 
        r = r || 2; 
        for(var i = 0; i < r; i++) { 
            try { 
                var res = await fn(); 
                if(res && res.error) throw new Error(res.error.message); 
                return res || {data: null}; 
            } catch(e) { 
                if(i === r-1) throw e; 
                await new Promise(function(x) { setTimeout(x, 300*(i+1)); }); 
            } 
        } 
    }
    
    function getCatName(catId) { var c = allCategories.find(function(x) { return x.id === catId; }); return c ? c.name : (catId || ''); }
    function getShopName(shopId) { var s = allShops.find(function(x) { return x.id === shopId; }); return s ? (s.name || s.shop_name) : (shopId || ''); }
    function getAppSetting(key, defaultValue) { var setting = allAppSettings.find(function(s) { return s.key === key; }); return setting ? setting.value : defaultValue; }
    
    // ✅ ADDED: Weight formatting for order items
    function fmtWeightDisplay(w, u) {
        if(!w) return '';
        var nw = parseFloat(w);
        if(isNaN(nw)) return String(w);
        var unitLower = u ? u.toLowerCase() : '';
        if(unitLower === 'gram' || unitLower === 'g' || unitLower === 'gm') {
            return nw >= 1000 ? (nw/1000).toFixed(1).replace(/\.0$/,'') + ' kg' : nw + ' g';
        }
        if(unitLower === 'kg') return nw + ' kg';
        if(unitLower === 'liter' || unitLower === 'l') return nw + ' L';
        if(unitLower === 'ml') return nw + ' ml';
        if(unitLower === 'piece' || unitLower === 'pcs') return nw + ' pcs';
        return nw + ' ' + (u || '');
    }
    
    function toast(msg, type) { 
        type = type || 'success'; 
        var c = $('toastContainer'); 
        if(!c) return; 
        var el = document.createElement('div'); 
        el.className = 'toast ' + type; 
        el.innerHTML = '<i class="fas fa-' + (type === 'success' ? 'check-circle' : 'exclamation-circle') + '"></i> ' + msg; 
        c.appendChild(el); 
        setTimeout(function() { el.style.opacity = '0'; setTimeout(function() { el.remove(); }, 250); }, 2500); 
    }
    
    window.fastNavigate = function(url) { window.location.href = url; };
    
    // ==================== SESSION REFRESH ====================
    function startSessionRefresh() {
        if(sessionRefreshTimer) clearInterval(sessionRefreshTimer);
        sessionRefreshTimer = setInterval(async function() {
            try {
                var res = await sb.auth.getSession();
                if(!res || !res.data || !res.data.session) {
                    toast('Session expired. Please login again.', 'error');
                    setTimeout(function() { window.location.href = 'index.html'; }, 1500);
                }
            } catch(e) {}
        }, 5 * 60 * 1000);
    }
    
    // ==================== IMAGE COMPRESSION ====================
    async function compressImage(file) {
        if(!file || !file.type.match(/image\//)) return file;
        return new Promise(function(resolve) {
            var reader = new FileReader();
            reader.onload = function(e) {
                var img = new Image();
                img.onload = function() {
                    var canvas = document.createElement('canvas');
                    var maxDim = 800, w = img.width, h = img.height;
                    if(w > maxDim || h > maxDim) { var r = Math.min(maxDim/w, maxDim/h); w = Math.round(w*r); h = Math.round(h*r); }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    canvas.toBlob(function(blob) {
                        if(blob && blob.size > 150*1024) {
                            canvas.toBlob(function(blob2) { resolve(new File([blob2], 'img.jpg', {type:'image/jpeg'})); }, 'image/jpeg', 0.5);
                        } else {
                            resolve(new File([blob], 'img.jpg', {type:'image/jpeg'}));
                        }
                    }, 'image/jpeg', 0.7);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }
    
    async function uploadCompressedImage(file, bucket, folder) {
        if(!file) return null;
        var compressed = await compressImage(file);
        var fn = folder + '_' + Date.now() + '.jpg';
        var r = await sb.storage.from(bucket).upload(fn, compressed, {cacheControl:'3600', upsert:true, contentType:'image/jpeg'});
        if(r.error) { toast('❌ Upload failed', 'error'); return null; }
        return sb.storage.from(bucket).getPublicUrl(fn).data.publicUrl;
    }
    
    // ==================== LOAD ALL DATA ====================
    async function loadAllData() {
        try {
            var results = await Promise.allSettled([
                safeFetch(function() { return sb.from('users').select('id, name, phone, role, is_blocked').limit(200); }),
                safeFetch(function() { return sb.from('shops').select('*').limit(100); }),
                safeFetch(function() { return sb.from('products').select('*').limit(1000); }),
                safeFetch(function() { return sb.from('categories').select('*').order('display_order'); }),
                safeFetch(function() { return sb.from('orders').select('*').order('created_at', {ascending: false}).limit(50); }),
                safeFetch(function() { return sb.from('notifications').select('*').limit(20); }),
                safeFetch(function() { return sb.from('delivery_settings').select('*').eq('is_active', true).single(); }),
                safeFetch(function() { return sb.from('sections').select('*').order('display_order'); }),
                safeFetch(function() { return sb.from('sliders').select('*').order('display_order'); }),
                safeFetch(function() { return sb.from('app_settings').select('*'); })
            ]);
            
            allUsers = results[0].status === 'fulfilled' ? (results[0].value.data || []) : [];
            allShops = results[1].status === 'fulfilled' ? (results[1].value.data || []) : [];

    window.sendAdminOTP = async function() {
        var email = $('adminEmail').value.trim();
        var errEl = $('loginError');
        if(!email) { errEl.style.display = 'block'; errEl.textContent = '⚠️ Enter email'; return; }
        errEl.style.display = 'none';
        var btn = document.querySelector('#loginStepEmail .login-btn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
        try {
            var res = await sb.auth.signInWithOtp({email: email, options: {shouldCreateUser: false}});
            if(res && res.error) { errEl.style.display = 'block'; errEl.textContent = '❌ ' + res.error.message; btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send OTP'; return; }
            currentOtpEmail = email;
            safeText('otpEmailDisplay', email);
            $('loginStepEmail').style.display = 'none';
            $('loginStepOTP').style.display = 'block';
            startOtpTimer();
            toast('📩 OTP sent!');
        } catch(e) { errEl.style.display = 'block'; errEl.textContent = '❌ Failed'; btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send OTP'; }
    };
    
    window.verifyAdminOTP = async function() {
        var otp = $('adminOtp').value.trim();
        var errEl = $('loginError');
        if(!otp || otp.length < 4) { errEl.style.display = 'block'; errEl.textContent = '⚠️ Enter OTP'; return; }
        errEl.style.display = 'none';
        var btn = document.querySelector('#loginStepOTP .login-btn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
        try {
            var res = await sb.auth.verifyOtp({email: currentOtpEmail, token: otp, type: 'email'});
            if(res && res.error) { errEl.style.display = 'block'; errEl.textContent = '❌ Invalid OTP'; btn.disabled = false; btn.innerHTML = '<i class="fas fa-check-circle"></i> Verify'; return; }
            var prof = await safeFetch(function() { return sb.from('users').select('role').eq('id', res.data.user.id).single(); });
            var role = prof.data ? prof.data.role : null;
            if(role != 1 && role !== '1' && role !== 'admin') { await sb.auth.signOut(); errEl.style.display = 'block'; errEl.textContent = '🚫 Access denied'; btn.disabled = false; btn.innerHTML = '<i class="fas fa-check-circle"></i> Verify'; return; }
            currentAdmin = res.data.user;
            toast('✅ Login!');
            await loadAllData();
            renderApp();
        } catch(e) { errEl.style.display = 'block'; errEl.textContent = '❌ Error'; btn.disabled = false; btn.innerHTML = '<i class="fas fa-check-circle"></i> Verify'; }
    };
    
    window.resendAdminOTP = async function() { if(!currentOtpEmail) return; try { await sb.auth.signInWithOtp({email: currentOtpEmail, options: {shouldCreateUser: false}}); startOtpTimer(); toast('📩 New OTP sent!'); } catch(e) { toast('❌ Failed', 'error'); } };
    
    function startOtpTimer() { var s = 60, b = $('resendAdminBtn'); if(!b) return; if(otpTimerInterval) clearInterval(otpTimerInterval); b.disabled = true; b.textContent = '⏳ Resend (' + s + 's)'; otpTimerInterval = setInterval(function() { s--; b.textContent = '⏳ Resend (' + s + 's)'; if(s <= 0) { clearInterval(otpTimerInterval); b.disabled = false; b.textContent = '📩 Resend OTP'; } }, 1000); }
    window.backToAdminEmail = function() { if(otpTimerInterval) clearInterval(otpTimerInterval); $('loginStepOTP').style.display = 'none'; $('loginStepEmail').style.display = 'block'; };

    function toggleSidebar() { $('sidebar').classList.toggle('open'); }
    
    function loadSection(section) {
        currentSection = section;
        var items = document.querySelectorAll('.menu-item');
        for(var i = 0; i < items.length; i++) items[i].classList.remove('active');
        var titles = {dashboard: '📊 Dashboard', shops: '🏪 Shops', users: '👥 Users', sections: '📑 Sections', categories: '🏷️ Categories', subcategories: '📂 Sub-Categories', products: '📦 Products', orders: '📋 Orders', sliders: '🖼️ Sliders', notifications: '🔔 Notifications', deliverySettings: '🕐 Delivery Settings'};
        safeText('pageTitle', titles[section] || section);
        $('sidebar').classList.remove('open');
        var content = $('contentArea');
        
        if(section === 'dashboard') renderDashboard(content);
        else if(section === 'shops') renderShops(content);
        else if(section === 'users') renderUsers(content);
        else if(section === 'sections') renderSections(content);
        else if(section === 'categories') renderCategories(content);
        else if(section === 'subcategories') renderSubCategories(content);
        else if(section === 'products') renderProducts(content);
        else if(section === 'orders') renderOrders(content);
        else if(section === 'sliders') renderSliders(content);
        else if(section === 'notifications') renderNotifications(content);
        else if(section === 'deliverySettings') renderDeliverySettings(content);
    }
    
    // ==================== DASHBOARD ====================
    function renderDashboard(c) {
        var pending = allShops.filter(function(s) { return s.status === 'pending'; }).length;
        var approved = allShops.filter(function(s) { return s.status === 'approved'; }).length;
        var revenue = 0;
        for(var i = 0; i < allOrders.length; i++) { if(allOrders[i].status !== 'cancelled') revenue += parseFloat(allOrders[i].total_amount) || 0; }
        var deleteReqs = allProducts.filter(function(p) { return p.delete_requested === true; }).length;
        
        c.innerHTML = '<div class="stats-grid">' +
            '<div class="stat-card" onclick="loadSection(\'users\')"><div class="stat-icon blue"><i class="fas fa-users"></i></div><div class="stat-info"><h3>' + allUsers.length + '</h3><p>Users</p></div></div>' +
            '<div class="stat-card" onclick="loadSection(\'shops\')"><div class="stat-icon green"><i class="fas fa-store"></i></div><div class="stat-info"><h3>' + approved + '</h3><p>Shops (' + pending + ' pending)</p></div></div>' +
            '<div class="stat-card" onclick="loadSection(\'products\')"><div class="stat-icon orange"><i class="fas fa-box"></i></div><div class="stat-info"><h3>' + allProducts.length + '</h3><p>Products (' + deleteReqs + ' del req)</p></div></div>' +
            '<div class="stat-card"><div class="stat-icon purple"><i class="fas fa-rupee-sign"></i></div><div class="stat-info"><h3>₹' + revenue.toLocaleString('en-IN') + '</h3><p>Revenue</p></div></div>' +
            '</div>';

    // ==================== SHOPS ====================
    function renderShops(c) {
        var html = '';
        for(var i = 0; i < allShops.length; i++) {
            var s = allShops[i];
            var statusBadge = s.status === 'approved' ? 'badge-success' : s.status === 'rejected' ? 'badge-danger' : 'badge-warning';
            var img = getImageUrl(s.image_url || s.shop_image);
            
            html += '<div class="card-item" style="cursor:default;">';

            html += '<div class="card-item-body">';
            html += '<div class="card-item-title">' + esc(s.name || s.shop_name) + '</div>';
            html += '<div class="card-item-subtitle">👤 ' + esc(s.owner_name || 'N/A') + '<br>📱 ' + esc(s.owner_phone || 'N/A') + '</div>';
            html += '<div style="margin:6px 0;"><span class="badge ' + statusBadge + '">' + s.status + '</span> ' +
                    (s.is_open ? '<span class="badge badge-success">Open</span>' : '<span class="badge badge-danger">Closed</span>') + '</div>';

            html += '<button class="btn btn-outline btn-sm" onclick="showShopDetails(\'' + s.id + '\')">👁️ Details</button>';
            if(s.status === 'pending') html += '<button class="btn btn-success btn-sm" onclick="approveShop(\'' + s.id + '\')">✅ Approve</button>';
            html += '<button class="btn btn-danger btn-sm" onclick="deleteShop(\'' + s.id + '\')">🗑️</button>';
            html += '</div></div></div>';
        }
        
        c.innerHTML = '<div class="content-card"><div class="card-header"><h2>🏪 Shops (' + allShops.length + ')</h2></div>' +
            '<div class="card-grid">' + (html || '<div class="empty-state"><i class="fas fa-store"></i><p>No shops</p></div>') + '</div></div>';
    }

        if(s.id_number) html += '<div class="form-group"><label class="form-label">🔢 ID Number</label><div style="font-size:13px;">' + esc(s.id_number) + '</div></div>';
        if(s.payment_id) html += '<div class="form-group"><label class="form-label">💳 Payment ID</label><div style="font-size:13px;">' + esc(s.payment_id) + '</div></div>';

    window.showShopEditModal = function(id) {
        var s = allShops.find(function(x) { return x.id === id; });
        if(!s) return;
        
        var html = '<div class="modal-header"><h3>✏️ Edit Shop</h3><button class="modal-close" onclick="closeModal()">✕</button></div>';
        html += '<div class="form-group"><label class="form-label">Shop Name</label><input type="text" id="editShopName" class="form-control" value="' + esc(s.name || s.shop_name) + '"></div>';
        html += '<div class="form-group"><label class="form-label">Owner Name</label><input type="text" id="editShopOwner" class="form-control" value="' + esc(s.owner_name || '') + '"></div>';
        html += '<div class="form-row"><div class="form-half"><label class="form-label">Phone</label><input type="text" id="editShopPhone" class="form-control" value="' + esc(s.owner_phone || s.phone || '') + '"></div>';
        html += '<div class="form-half"><label class="form-label">WhatsApp</label><input type="text" id="editShopWhatsapp" class="form-control" value="' + esc(s.owner_whatsapp || s.whatsapp || '') + '"></div></div>';
        html += '<div class="form-group"><label class="form-label">Address</label><textarea id="editShopAddress" class="form-control" rows="2">' + esc(s.address || '') + '</textarea></div>';
        html += '<div class="form-row"><div class="form-half"><label class="form-label">City</label><input type="text" id="editShopCity" class="form-control" value="' + esc(s.city || '') + '"></div>';
        html += '<div class="form-half"><label class="form-label">Pincode</label><input type="text" id="editShopPincode" class="form-control" value="' + esc(s.pincode || '') + '"></div></div>';
        html += '<div class="form-group"><label class="form-label">Status</label><select id="editShopStatus" class="form-control">' +

            '<option value="approved"' + (s.status === 'approved' ? ' selected' : '') + '>Approved</option>' +
            '<option value="rejected"' + (s.status === 'rejected' ? ' selected' : '') + '>Rejected</option></select></div>';
        html += '<div class="form-group"><label class="form-label">Shop Open</label><label class="toggle-switch"><input type="checkbox" id="editShopOpen" ' + (s.is_open ? 'checked' : '') + '><span class="toggle-slider"></span></label></div>';

    window.saveShopEdit = async function(id) {
        var name = $('editShopName').value.trim();
        var owner = $('editShopOwner').value.trim();
        var phone = $('editShopPhone').value.trim();
        var whatsapp = $('editShopWhatsapp').value.trim();
        var address = $('editShopAddress').value.trim();
        var city = $('editShopCity').value.trim();
        var pincode = $('editShopPincode').value.trim();
        var status = $('editShopStatus').value;
        var isOpen = $('editShopOpen').checked;
        
        try {
            await sb.from('shops').update({
                name: name, shop_name: name, owner_name: owner, 
                owner_phone: phone, phone: phone, owner_whatsapp: whatsapp, whatsapp: whatsapp,
                address: address, city: city, pincode: pincode,
                status: status, is_open: isOpen
            }).eq('id', id);
            toast('✅ Shop updated!');
            closeModal();
            await loadAllData();
            renderShops($('contentArea'));
        } catch(e) { toast('❌ Failed: ' + e.message, 'error'); }
    };
    
    window.approveShop = async function(id) {
        var shop = allShops.find(function(s) { return s.id === id; });
        if(!shop) return;
        try {
            var userId = null;
            if(shop.owner_email) { var eu = await sb.from('users').select('id').eq('email', shop.owner_email).maybeSingle(); if(eu.data) userId = eu.data.id; }
            if(!userId && shop.owner_phone) { var ep = await sb.from('users').select('id').eq('phone', shop.owner_phone).maybeSingle(); if(ep.data) userId = ep.data.id; }
            if(!userId) {
                var nu = await sb.from('users').insert([{email: shop.owner_email || (shop.owner_phone + '@zymart.user'), name: shop.owner_name || 'Shop Owner', phone: shop.owner_phone || null, role: 'shop_owner', is_active: true}]).select('id').single();
                if(nu.data) userId = nu.data.id;
            } else {
                await sb.from('users').update({role: 'shop_owner'}).eq('id', userId);
            }
            await sb.from('shops').update({status: 'approved', is_open: true, owner_id: userId || null}).eq('id', id);
            toast('✅ Approved!');
            await loadAllData();
            renderShops($('contentArea'));
        } catch(e) { toast('❌ Failed: ' + e.message, 'error'); }
    };
    
    window.deleteShop = async function(id) { if(!confirm('Delete shop?')) return; await sb.from('shops').delete().eq('id', id); toast('Deleted'); await loadAllData(); renderShops($('contentArea')); };

        (allUsers.length ? allUsers.map(function(u) {
            var roleText = u.role === '1' || u.role === 'admin' ? 'Admin' : u.role === '2' || u.role === 'shop_owner' ? 'Shop Owner' : 'Customer';
            return '<tr><td>' + esc(u.name || 'N/A') + '</td><td>' + esc(u.phone || '-') + '</td><td><span class="badge ' + (u.role === '1' || u.role === 'admin' ? 'badge-danger' : u.role === '2' || u.role === 'shop_owner' ? 'badge-warning' : 'badge-info') + '">' + roleText + '</span></td><td>' +
            (u.is_blocked ? '<button class="btn btn-success btn-sm" onclick="toggleBlockUser(\'' + u.id + '\',false)">Unblock</button>' : '<button class="btn btn-warning btn-sm" onclick="toggleBlockUser(\'' + u.id + '\',true)">Block</button>') +

        }).join('') : '<tr><td colspan="4" style="text-align:center;">No users</td></tr>') +
        '</tbody></table></div></div></div>';

    window.toggleBlockUser = async function(id, block) { await sb.from('users').update({is_blocked: block}).eq('id', id); toast('Done!'); await loadAllData(); renderUsers($('contentArea')); };
    
    // ==================== SECTIONS ====================
    function renderSections(c) {
        var html = '';
        allSections.forEach(function(section) {
            var categoryCount = allCategories.filter(function(cat) { return cat.section === section.name; }).length;
            html += '<div class="card-item"><div class="card-item-img"><i class="fas ' + (section.icon || 'fa-layer-group') + '"></i></div><div class="card-item-body">';
            html += '<div class="card-item-title">' + esc(section.name) + '</div>';
            html += '<div class="card-item-subtitle">Categories: ' + categoryCount + ' | Order: ' + section.display_order + ' | ' + (section.is_active ? '🟢 Active' : '🔴 Inactive') + '</div>';
            html += '<div style="display:flex;gap:4px;flex-wrap:wrap;">';
            html += '<button class="btn btn-warning btn-sm" onclick="showSectionModal(\'' + section.id + '\')">✏️ Edit</button>';
            html += '<button class="btn btn-outline btn-sm" onclick="toggleSectionActive(\'' + section.id + '\',' + section.is_active + ')">' + (section.is_active ? '🔴 Disable' : '🟢 Enable') + '</button>';
            html += '<button class="btn btn-danger btn-sm" onclick="deleteSection(\'' + section.id + '\')">🗑️ Delete</button>';

    window.handleCatImage = function(input) {
        var file = input.files[0];
        if(!file) return;
        if(file.size > 5 * 1024 * 1024) { toast('Max 5MB', 'error'); return; }
        compressImage(file).then(function(compressed) {
            catImageFile = compressed;
            var reader = new FileReader();
            reader.onload = function(e) { var p = $('catImgPreview'); if(p) p.innerHTML = '<img src="' + e.target.result + '" class="image-preview show" style="border:2px solid #22C55E;">'; };
            reader.readAsDataURL(compressed);
        });
    };
    
    window.saveCategory = async function() {
        var name = $('catName').value.trim();
        var section = $('catSection').value;
        var type = $('catType').value;
        var parentId = type === 'sub' ? ($('catParent')?.value || null) : null;
        if(!name || !section) { toast('Fill fields', 'error'); return; }
        if(type === 'sub' && !parentId) { toast('Select parent', 'error'); return; }
        var imageUrl = '';
        if(catImageFile) { imageUrl = await uploadCompressedImage(catImageFile, 'category-images', 'cat_' + (catEditId || 'new')); if(!imageUrl) return; }
        var data = { name: name, section: section, parent_id: parentId, is_active: true };
        if(imageUrl) data.image_url = imageUrl;
        if(catEditId) { await sb.from('categories').update(data).eq('id', catEditId); toast('Updated!'); }
        else { await sb.from('categories').insert([data]); toast('Added!'); }

    // ==================== PRODUCTS ====================
    function renderProducts(c) {
        var deleteRequests = allProducts.filter(function(p) { return p.delete_requested === true; });
        var featuredProducts = allProducts.filter(function(p) { return p.is_featured === true && !p.delete_requested; });
        var normalProducts = allProducts.filter(function(p) { return !p.delete_requested && !p.is_featured; });
        
        function productCard(p) {
            var img = getImageUrl((p.images && p.images[0]) || p.image_url);
            var shopName = getShopName(p.shop_id);
            var actualPrice = parseFloat(p.price) || 0;
            var offerPrice = parseFloat(p.offer_price) || null;
            var displayPrice = offerPrice && offerPrice < actualPrice ? offerPrice : actualPrice;
            
            var h = '<div class="card-item"' + (p.delete_requested ? ' style="border:2px solid #F59E0B;"' : '') + '>';
            h += '<div class="card-item-img">' + (img ? '<img src="' + img + '">' : '<i class="fas fa-box"></i>') + '</div>';
            h += '<div class="card-item-body">';
            h += '<div class="card-item-title">' + esc(p.name) + '</div>';
            h += '<div class="card-item-subtitle">₹' + displayPrice.toLocaleString('en-IN');
            if(offerPrice && offerPrice < actualPrice) h += ' <s>₹' + actualPrice.toLocaleString('en-IN') + '</s>';
            h += ' | ' + esc(shopName) + '</div>';
            if(p.delete_requested) h += '<div class="delete-req-badge">⏳ Delete Requested</div>';
            if(p.is_featured) h += '<div class="featured-badge">⭐ Featured</div>';

            h += '<button class="btn btn-warning btn-sm" onclick="showProductEditModal(\'' + p.id + '\')">✏️ Edit</button>';
            if(p.is_featured) h += '<button class="btn btn-outline btn-sm" onclick="toggleFeatured(\'' + p.id + '\',false)">Unfeature</button>';
            else h += '<button class="btn btn-warning btn-sm" onclick="toggleFeatured(\'' + p.id + '\',true)">⭐ Feature</button>';
            if(p.delete_requested) {
                h += '<button class="btn btn-success btn-sm" onclick="approveDeleteRequest(\'' + p.id + '\')">✅</button>';
                h += '<button class="btn btn-outline btn-sm" onclick="rejectDeleteRequest(\'' + p.id + '\')">↩️</button>';
            }
            h += '<button class="btn btn-danger btn-sm" onclick="deleteProduct(\'' + p.id + '\')">🗑️</button>';
            h += '</div></div></div>';
            return h;
        }
        
        var deleteHtml = deleteRequests.map(productCard).join('');
        var featuredHtml = featuredProducts.map(productCard).join('');
        var normalHtml = normalProducts.map(productCard).join('');

        (deleteRequests.length > 0 ? 
        '<div class="content-card" style="border:2px solid #F59E0B;"><div class="card-header" style="background:#FFF8EB;"><h2>⏳ Delete Requests (' + deleteRequests.length + ')</h2>' + bulkBtn + '</div>' +
        '<div class="card-grid">' + deleteHtml + '</div></div>' : '') +
        '<div class="content-card"><div class="card-header"><h2>⭐ Featured (' + featuredProducts.length + ')</h2></div>' +
        '<div class="card-grid">' + (featuredHtml || '<div class="empty-state"><i class="fas fa-star"></i><p>No featured</p></div>') + '</div></div>' +
        '<div class="content-card"><div class="card-header"><h2>📦 All Products (' + normalProducts.length + ')</h2></div>' +
        '<div class="card-grid">' + (normalHtml || '<div class="empty-state"><i class="fas fa-box"></i><p>No products</p></div>') + '</div></div>';

    // ==================== ORDERS (FIXED - Weight display + Copy format) ====================
    function renderOrders(c) {
        var html = '';
        for(var i = 0; i < allOrders.length; i++) {
            var o = allOrders[i];
            var items = [];
            try { items = typeof o.items === 'string' ? JSON.parse(o.items) : (o.items || []); } catch(e) { items = []; }
            var oid = '#' + (o.id || '').substring(0, 8).toUpperCase();
            var statusBadge = o.status === 'pending' ? 'badge-warning' : o.status === 'confirmed' ? 'badge-success' : o.status === 'delivered' ? 'badge-info' : 'badge-danger';
            
            html += '<div style="background:white;border:1px solid var(--neutral-border);border-radius:12px;padding:12px;margin-bottom:8px;">';
            html += '<div style="display:flex;justify-content:space-between;"><strong>' + oid + '</strong><span class="badge ' + statusBadge + '">' + (o.status || 'pending') + '</span></div>';
            html += '<div style="font-size:12px;margin-top:4px;">👤 ' + esc(o.customer_name || 'N/A') + ' · 📱 +91 ' + esc(o.customer_phone || '') + '</div>';
            html += '<div style="font-size:11px;color:#6B7280;">📍 ' + esc([o.customer_address, o.customer_city, o.customer_pincode].filter(Boolean).join(', ')) + '</div>';
            if(items.length) {
                html += '<div style="background:#F9FAFB;border-radius:8px;padding:8px;margin-top:6px;">';
                for(var j = 0; j < items.length; j++) {
                    var item = items[j];
                    // ✅ FIXED: Weight display
                    var itemName = item.product_name || item.name || 'Item';
                    var itemWeight = '';
                    if(item.variant_weight) {
                        itemWeight = fmtWeightDisplay(item.variant_weight, item.variant_unit);
                    }
                    var itemDisplay = itemName;
                    if(itemWeight) itemDisplay += ' (' + itemWeight + ')';
                    
                    html += '<div style="display:flex;justify-content:space-between;font-size:11px;">';
                    html += '<span>📦 ' + esc(itemDisplay) + ' × ' + (item.quantity || 1) + '</span>';
                    html += '<span>₹' + ((item.price || 0) * (item.quantity || 1)).toLocaleString('en-IN') + '</span></div>';
                }
                html += '</div>';
            }
            html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">';
            html += '<strong>₹' + (parseFloat(o.total_amount) || 0).toLocaleString('en-IN') + '</strong>';
            html += '<div style="display:flex;gap:4px;">';
            html += '<button class="btn btn-outline btn-sm" onclick="copyOrderDetails(\'' + o.id + '\')">📋 Copy</button>';
            if(o.status === 'pending') html += '<button class="btn btn-success btn-sm" onclick="confirmOrder(\'' + o.id + '\')">✅</button>';
            html += '<button class="btn btn-danger btn-sm" onclick="deleteOrder(\'' + o.id + '\')">🗑️</button>';
            html += '</div></div></div>';
        }
        c.innerHTML = '<div class="content-card"><div class="card-header"><h2>📋 Orders (' + allOrders.length + ')</h2></div><div style="padding:12px;">' + (html || '<div class="empty-state"><i class="fas fa-receipt"></i><p>No orders</p></div>') + '</div></div>';
    }
    
    // ✅ FIXED: Copy order details with proper WhatsApp format
    window.copyOrderDetails = function(orderId) {
        var order = allOrders.find(function(o) { return o.id === orderId; });
        if(!order) return;
        
        var items = [];
        try { items = typeof order.items === 'string' ? JSON.parse(order.items) : (order.items || []); } catch(e) { items = []; }
        
        var oid = '#' + (order.id || '').substring(0, 8).toUpperCase();
        var date = order.created_at ? new Date(order.created_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
        
        var text = '🧾 *NEW ORDER ' + oid + '*\n';
        text += '━━━━━━━━━━━━━━━━━\n';
        text += '📅 ' + date + '\n';
        text += '━━━━━━━━━━━━━━━━━\n\n';
        
        text += '👤 *Name:* ' + (order.customer_name || 'N/A') + '\n';
        text += '📱 *Phone:* +91 ' + (order.customer_phone || 'N/A') + '\n\n';
        
        text += '📍 *ADDRESS:*\n';
        var addressParts = [];
        if(order.customer_address) addressParts.push(order.customer_address);
        if(order.customer_city) addressParts.push(order.customer_city);
        if(order.customer_pincode) addressParts.push(order.customer_pincode);
        text += addressParts.join(', ') || 'N/A';
        text += '\n\n';
        
        text += '━━━━━━━━━━━━━━━━━\n';
        text += '📦 *ITEMS:*\n';
        for(var i = 0; i < items.length; i++) {
            var it = items[i];
            var itemName = it.product_name || it.name || 'Item';
            var weightStr = '';
            if(it.variant_weight) {
                weightStr = fmtWeightDisplay(it.variant_weight, it.variant_unit);
            }
            var displayName = itemName;
            if(weightStr) displayName += ' (' + weightStr + ')';
            
            text += (i+1) + '. ' + displayName + '\n';
            text += '   Qty: ' + (it.quantity || 1) + ' × ₹' + (it.price || 0) + ' = ₹' + ((it.price || 0) * (it.quantity || 1)).toLocaleString('en-IN') + '\n';
        }
        
        text += '\n━━━━━━━━━━━━━━━━━\n';
        text += '💰 *TOTAL: ₹' + (parseFloat(order.total_amount) || 0).toLocaleString('en-IN') + '*\n';
        text += '💵 *Payment:* ' + (order.payment_method === 'cod' ? 'Cash on Delivery' : (order.payment_method || 'COD')) + '\n';
        text += '━━━━━━━━━━━━━━━━━\n';
        
        if(order.location_verified) {
            text += '📍 GPS Verified ✓\n';
        }
        text += '\n_Order via ZyMart+_';
        
        navigator.clipboard.writeText(text).then(function() { 
            toast('📋 Copied! WhatsApp par paste karo'); 
        }).catch(function() { 
            toast('Copy failed', 'error'); 
        });
    };
    
    window.confirmOrder = async function(id) { await sb.from('orders').update({status: 'confirmed'}).eq('id', id); toast('Confirmed!'); await loadAllData(); renderOrders($('contentArea')); };
    window.deleteOrder = async function(id) { if(!confirm('Delete?')) return; await sb.from('orders').delete().eq('id', id); toast('Deleted'); await loadAllData(); renderOrders($('contentArea')); };
    
    // ==================== SLIDERS ====================
    function renderSliders(c) {
        var html = '';
        for(var i = 0; i < allSliders.length; i++) {
            var sl = allSliders[i];
            var img = getImageUrl(sl.image_url);
            html += '<div class="card-item"><div class="card-item-img">' + (img ? '<img src="' + img + '" class="slider-preview">' : '<i class="fas fa-image"></i>') + '</div>';
            html += '<div class="card-item-body"><div class="card-item-title">' + esc(sl.title || 'Slider') + '</div>';
            html += '<div class="card-item-subtitle">Order: ' + sl.display_order + ' | ' + (sl.is_active ? '🟢 Active' : '🔴 Inactive') + '</div>';
            html += '<div style="display:flex;gap:4px;">';
            html += '<button class="btn btn-warning btn-sm" onclick="showSliderModal(\'' + sl.id + '\')">✏️</button>';
            html += '<button class="btn btn-outline btn-sm" onclick="toggleSliderActive(\'' + sl.id + '\',' + sl.is_active + ')">' + (sl.is_active ? 'Disable' : 'Enable') + '</button>';
            html += '<button class="btn btn-danger btn-sm" onclick="deleteSlider(\'' + sl.id + '\')">🗑️</button>';
            html += '</div></div></div>';
        }
        c.innerHTML = '<div class="content-card"><div class="card-header"><h2>🖼️ Homepage Sliders (' + allSliders.length + ')</h2><button class="btn btn-primary btn-sm" onclick="showSliderModal(null)">+ Add Slider</button></div>' +
        '<div class="card-grid">' + (html || '<div class="empty-state"><i class="fas fa-image"></i><p>No sliders</p></div>') + '</div></div>';
    }
    
    window.showSliderModal = function(id) {
        var sl = id ? allSliders.find(function(s) { return s.id === id; }) : null;
        var existingImg = sl && sl.image_url ? getImageUrl(sl.image_url) : '';
        var html = '<div class="modal-header"><h3>' + (sl ? '✏️ Edit Slider' : '➕ Add Slider') + '</h3><button class="modal-close" onclick="closeModal()">✕</button></div>';
        html += '<div class="form-group"><label class="form-label">Title</label><input type="text" id="sliderTitle" class="form-control" value="' + esc(sl ? sl.title || '' : '') + '"></div>';
        html += '<div class="form-group"><label class="form-label">Link</label><input type="text" id="sliderLink" class="form-control" value="' + esc(sl ? sl.link || '' : '') + '"></div>';
        html += '<div class="form-group"><label class="form-label">Order</label><input type="number" id="sliderOrder" class="form-control" value="' + (sl ? sl.display_order : allSliders.length + 1) + '"></div>';
        html += '<div class="form-group"><label class="form-label">📸 Image</label><div class="image-upload-box' + (existingImg ? ' has-image' : '') + '" onclick="document.getElementById(\'sliderImgInput\').click()"><input type="file" id="sliderImgInput" accept="image/*" style="display:none" onchange="handleSliderImage(this)">📁 Upload<div id="sliderImgPreview">' + (existingImg ? '<img src="' + existingImg + '" class="image-preview show">' : '') + '</div></div></div>';
        html += '<button class="btn btn-primary" style="width:100%;padding:12px;" onclick="saveSlider(\'' + (sl ? sl.id : '') + '\')">💾 Save</button>';
        showModal(html);
    };
    
    window.handleSliderImage = function(input) {
        var file = input.files[0];
        if(!file) return;
        compressImage(file).then(function(compressed) {
            window._sliderImageFile = compressed;
            var reader = new FileReader();
            reader.onload = function(e) { var p = $('sliderImgPreview'); if(p) p.innerHTML = '<img src="' + e.target.result + '" class="image-preview show">'; };
            reader.readAsDataURL(compressed);
        });
    };
    
    window.saveSlider = async function(id) {
        var title = $('sliderTitle').value.trim() || 'Slider';
        var link = $('sliderLink').value.trim() || '#';
        var order = parseInt($('sliderOrder').value) || 0;
        var imageUrl = '';
        if(window._sliderImageFile) { imageUrl = await uploadCompressedImage(window._sliderImageFile, 'slider-images', 'slider'); if(!imageUrl) return; }
        var data = { title: title, link: link, display_order: order };
        if(imageUrl) data.image_url = imageUrl;
        if(id) { await sb.from('sliders').update(data).eq('id', id); toast('Updated!'); }
        else { await sb.from('sliders').insert([data]); toast('Added!'); }
        closeModal(); window._sliderImageFile = null; await loadAllData(); renderSliders($('contentArea'));
    };
    
    window.toggleSliderActive = async function(id, st) { await sb.from('sliders').update({is_active: !st}).eq('id', id); toast('Done!'); await loadAllData(); renderSliders($('contentArea')); };
    window.deleteSlider = async function(id) { if(!confirm('Delete?')) return; await sb.from('sliders').delete().eq('id', id); toast('Deleted'); await loadAllData(); renderSliders($('contentArea')); };
    
    // ==================== NOTIFICATIONS ====================
    function renderNotifications(c) {
        c.innerHTML = '<div class="content-card"><div class="card-header"><h2>🔔 Send Notification</h2></div><div style="padding:12px;">' +
        '<div class="form-group"><label class="form-label">Title</label><input type="text" id="notifTitle" class="form-control"></div>' +
        '<div class="form-group"><label class="form-label">Message</label><textarea id="notifMessage" class="form-control" rows="3"></textarea></div>' +
        '<button class="btn btn-primary" style="width:100%;" onclick="sendNotification()">📨 Send</button></div></div>';
    }
    
    window.sendNotification = async function() { var t = $('notifTitle').value.trim(), m = $('notifMessage').value.trim(); if(!t || !m) { toast('Fill fields', 'error'); return; } await sb.from('notifications').insert([{title: t, message: m}]); toast('Sent!'); };
    
    // ==================== DELIVERY SETTINGS ====================
    function renderDeliverySettings(c) {
        var ds = deliverySettingsData || {};
        var regFee = getAppSetting('registration_fee', '299');
        
        var html = '<div class="content-card"><div class="card-header"><h2>🕐 Delivery Settings</h2></div><div style="padding:16px;">';
        html += '<div class="form-row"><div class="form-half"><label class="form-label">Start Time</label><input type="time" id="deliveryStart" class="form-control" value="' + (ds.opening_time || ds.delivery_start_time || '08:00') + '"></div>';
        html += '<div class="form-half"><label class="form-label">End Time</label><input type="time" id="deliveryEnd" class="form-control" value="' + (ds.closing_time || ds.delivery_end_time || '20:00') + '"></div></div>';
        html += '<div class="form-row"><div class="form-half"><label class="form-label">Delivery Minutes</label><input type="number" id="deliveryMinutes" class="form-control" value="' + (ds.delivery_time_minutes || 10) + '"></div>';
        html += '<div class="form-half"><label class="form-label">Delivery Fee ₹</label><input type="number" id="deliveryFee" class="form-control" value="' + (ds.delivery_charge || 40) + '"></div></div>';
        html += '<div class="form-row"><div class="form-half"><label class="form-label">Free Above ₹</label><input type="number" id="freeDeliveryAbove" class="form-control" value="' + (ds.free_delivery_above || 299) + '"></div>';
        html += '<div class="form-half"><label class="form-label">Min Order ₹</label><input type="number" id="minOrderAmount" class="form-control" value="' + (ds.min_order_amount || 0) + '"></div></div>';
        html += '<div class="form-group"><label class="form-label">🏖️ Holiday Mode</label><label class="toggle-switch"><input type="checkbox" id="isHoliday" ' + (ds.is_holiday ? 'checked' : '') + '><span class="toggle-slider"></span></label></div>';
        html += '<div class="form-group" id="holidayReasonGroup" style="display:' + (ds.is_holiday ? 'block' : 'none') + ';"><label class="form-label">Reason</label><input type="text" id="holidayReason" class="form-control" value="' + esc(ds.holiday_reason || '') + '"></div>';
        html += '<div class="form-group"><label class="form-label">🔓 Shop Open</label><label class="toggle-switch"><input type="checkbox" id="isShopOpen" ' + (ds.is_open !== false ? 'checked' : '') + '><span class="toggle-slider"></span></label></div>';
        html += '<button class="btn btn-primary" style="width:100%;padding:12px;" onclick="saveDeliverySettings()">💾 Save</button></div></div>';
        
        html += '<div class="content-card"><div class="card-header"><h2>💰 Registration Fee</h2></div><div style="padding:16px;">';
        html += '<div class="form-group"><label class="form-label">Fee (₹/year)</label><input type="number" id="registrationFee" class="form-control" value="' + regFee + '"></div>';
        html += '<button class="btn btn-primary" style="width:100%;padding:12px;" onclick="saveRegistrationFee()">💾 Save Fee</button></div></div>';
        
        c.innerHTML = html;
        $('isHoliday').addEventListener('change', function() { var rg = $('holidayReasonGroup'); if(rg) rg.style.display = this.checked ? 'block' : 'none'; });
    }
    
    window.saveDeliverySettings = async function() {
        var startTime = $('deliveryStart').value;
        var endTime = $('deliveryEnd').value;
        var minutes = parseInt($('deliveryMinutes').value) || 10;
        var fee = parseInt($('deliveryFee').value) || 0;
        var freeAbove = parseInt($('freeDeliveryAbove').value) || 0;
        var minOrder = parseInt($('minOrderAmount').value) || 0;
        var isHoliday = $('isHoliday').checked;
        var holidayReason = ($('holidayReason')?.value || '').trim();
        var isOpen = $('isShopOpen').checked;
        
        var data = {
            opening_time: startTime + ':00', closing_time: endTime + ':00',
            delivery_start_time: startTime + ':00', delivery_end_time: endTime + ':00',
            delivery_time_minutes: minutes, delivery_charge: fee,
            free_delivery_above: freeAbove, min_order_amount: minOrder,
            is_holiday: isHoliday, holiday_reason: isHoliday ? holidayReason : null,
            holiday_date: isHoliday ? new Date().toISOString().split('T')[0] : null,
            is_open: isOpen, is_active: true, updated_at: new Date().toISOString()
        };
        
        try {
            if(deliverySettingsData && deliverySettingsData.id) { await sb.from('delivery_settings').update(data).eq('id', deliverySettingsData.id); }
            else { await sb.from('delivery_settings').insert([data]); }
            toast('✅ Saved!'); deliverySettingsData = data; renderDeliverySettings($('contentArea'));
        } catch(e) { toast('❌ ' + e.message, 'error'); }
    };
    
    window.saveRegistrationFee = async function() {
        var fee = parseInt($('registrationFee').value) || 0;
        try {
            var existing = allAppSettings.find(function(s) { return s.key === 'registration_fee'; });
            if(existing) { await sb.from('app_settings').update({value: String(fee)}).eq('key', 'registration_fee'); }
            else { await sb.from('app_settings').insert([{key: 'registration_fee', value: String(fee)}]); }
            toast('✅ Fee updated!'); await loadAllData();
        } catch(e) { toast('❌ ' + e.message, 'error'); }
    };
    
    // ==================== MODAL HELPER ====================
    function showModal(html) {
        closeModal();
        var overlay = document.createElement('div');
        overlay.className = 'modal-overlay show';
        overlay.id = 'modalContainer';
        overlay.innerHTML = '<div class="modal-container">' + html + '</div>';
        overlay.addEventListener('click', function(e) { if(e.target === overlay) closeModal(); });
        document.body.appendChild(overlay);
    }
    
    window.closeModal = function() { var m = $('modalContainer'); if(m) m.remove(); catImageFile = null; window._sliderImageFile = null; };
    
    // ==================== LOGOUT (FIXED) ====================
    window.handleLogout = async function() { 
        if(sessionRefreshTimer) clearInterval(sessionRefreshTimer);
        try { 
            await sb.auth.signOut();
        } catch(e) {}
        
        localStorage.removeItem('zymart_session');
        localStorage.removeItem('zymart_user_role');
        localStorage.removeItem('zymart_user_phone');
        localStorage.removeItem('zymart_token');
        
        try {
            var keys = Object.keys(localStorage);
            for (var i = 0; i < keys.length; i++) {
                if (keys[i].indexOf('sb-') === 0) {
                    localStorage.removeItem(keys[i]);
                }
            }
        } catch(e) {}
        
        try { sessionStorage.clear(); } catch(e) {}
        
        window.location.replace('index.html'); 
    };
    
    // ==================== INIT (FIXED - localStorage check) ====================
    async function checkSession() {
        try {
            var res = await sb.auth.getSession();
            if(res && res.data && res.data.session) {
                var prof = await safeFetch(function() { return sb.from('users').select('role').eq('id', res.data.session.user.id).single(); });
                var role = prof.data ? prof.data.role : null;
                if(role === 1 || role === '1' || role === 'admin') {
                    currentAdmin = res.data.session.user;
                    await loadAllData();
                    renderApp();
                    showApp();
                    return;
                }
                window.location.href = 'index.html';
                return;
            }
            
            // ✅ FIXED: localStorage session check (login.html se)
            try {
                var localSession = JSON.parse(localStorage.getItem('zymart_session') || 'null');
                var userRole = localStorage.getItem('zymart_user_role') || '';
                
                if(localSession && localSession.userId && (userRole === 'admin' || userRole === '1')) {
                    currentAdmin = { 
                        id: localSession.userId, 
                        email: localSession.email || 'admin@zymart.com',
                        phone: localSession.phone || ''
                    };
                    await loadAllData();
                    renderApp();
                    showApp();
                    return;
                }
            } catch(e) {}
            
            showLogin();
            showApp();
        } catch(e) { 
            // ✅ FIXED: Catch me bhi localStorage check karo
            try {
                var localSession = JSON.parse(localStorage.getItem('zymart_session') || 'null');
                var userRole = localStorage.getItem('zymart_user_role') || '';
                
                if(localSession && localSession.userId && (userRole === 'admin' || userRole === '1')) {
                    currentAdmin = { 
                        id: localSession.userId, 
                        email: localSession.email || 'admin@zymart.com',
                        phone: localSession.phone || ''
                    };
                    await loadAllData();
                    renderApp();
                    showApp();
                    return;
                }
            } catch(e2) {}
            
            showLogin(); 
            showApp(); 
        }
    }
    
    document.addEventListener('DOMContentLoaded', function() { checkSession(); });
