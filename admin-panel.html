<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Zatpat - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/compressorjs@1.2.1/dist/compressor.min.js"></script>
    
    <style>
        :root {
            --primary: #FFD600;
            --primary-dark: #E5C200;
            --accent-green: #16A34A;
            --bg-light: #F5F5F5;
            --card-white: #FFFFFF;
            --text-primary: #1A1A1A;
            --text-secondary: #666666;
            --border-light: #E5E7EB;
            --gray-100: #F5F5F5;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-2xl: 24px;
            --radius-full: 9999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
        }
        h1, h2, h3, h4, h5, h6 { font-family: 'Poppins', sans-serif; }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            background: var(--card-white);
            border-right: 1px solid var(--border-light);
            z-index: 1000;
            overflow-y: auto;
        }
        
        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border-light);
        }
        
        .sidebar-header h2 { font-size: 28px; font-weight: 800; }
        .sidebar-header h2 .normal { color: #000000; }
        .sidebar-header h2 .pat { color: var(--accent-green); }
        .sidebar-header p { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
        
        .sidebar-menu { padding: 16px 12px; }
        
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .menu-item i { width: 22px; font-size: 18px; }
        .menu-item:hover { background: var(--gray-100); color: var(--primary); }
        .menu-item.active { background: var(--primary); color: #000000; }
        .menu-divider { height: 1px; background: var(--border-light); margin: 12px 0; }
        
        .main-content { margin-left: 260px; padding: 24px 32px; min-height: 100vh; }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        .page-title { font-size: 28px; font-weight: 700; color: var(--text-primary); }
        
        .admin-user {
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--card-white);
            padding: 8px 20px;
            border-radius: var(--radius-full);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
        }
        
        .admin-avatar {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000000;
            font-weight: 700;
        }
        
        .logout-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }
        
        .stat-card {
            background: var(--card-white);
            border-radius: var(--radius-lg);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
        }
        
        .stat-icon {
            width: 56px;
            height: 56px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }
        
        .stat-icon.users { background: linear-gradient(135deg, #3B82F6, #1D4ED8); }
        .stat-icon.shops { background: linear-gradient(135deg, var(--primary), #E5C200); color: #000; }
        .stat-icon.products { background: linear-gradient(135deg, var(--success), #059669); }
        .stat-icon.orders { background: linear-gradient(135deg, #8B5CF6, #6D28D9); }
        
        .stat-info h3 { font-size: 28px; font-weight: 800; color: var(--text-primary); }
        .stat-info p { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
        
        .content-card {
            background: var(--card-white);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            overflow: hidden;
            margin-bottom: 24px;
        }
        
        .card-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            background: var(--card-white);
        }
        
        .card-header h2 { font-size: 20px; font-weight: 700; margin: 0; }
        
        .btn-primary {
            background: var(--primary);
            color: #000000;
            border: none;
            padding: 8px 20px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
        
        .btn-success {
            background: var(--success);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .btn-warning {
            background: var(--warning);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .btn-sm { padding: 4px 10px; font-size: 11px; }
        .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
        
        .table-wrapper { overflow-x: auto; width: 100%; }
        .data-table { width: 100%; border-collapse: collapse; min-width: 600px; }
        .data-table th { text-align: left; padding: 14px 16px; background: var(--gray-100); font-weight: 600; font-size: 13px; color: var(--text-secondary); border-bottom: 1px solid var(--border-light); white-space: nowrap; }
        .data-table td { padding: 14px 16px; border-bottom: 1px solid var(--border-light); font-size: 13px; vertical-align: middle; }
        .data-table tr:hover { background: var(--gray-100); }
        
        .badge-pending, .badge-approved, .badge-rejected, .badge-active, .badge-blocked {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }
        .badge-pending { background: #FEF3C7; color: #D97706; }
        .badge-approved { background: #D1FAE5; color: #059669; }
        .badge-rejected { background: #FEE2E2; color: #DC2626; }
        .badge-active { background: #D1FAE5; color: #059669; }
        .badge-blocked { background: #FEE2E2; color: #DC2626; }
        
        .form-group { margin-bottom: 16px; }
        .form-label { font-weight: 600; font-size: 13px; margin-bottom: 6px; display: block; }
        .form-control { width: 100%; padding: 12px 14px; border: 1px solid var(--border-light); border-radius: var(--radius-md); font-size: 14px; }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255, 214, 0, 0.1); }
        
        .image-upload-area {
            border: 2px dashed var(--border-light);
            border-radius: var(--radius-md);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .image-upload-area:hover { border-color: var(--primary); background: var(--gray-100); }
        .image-preview { max-width: 100%; max-height: 150px; margin-top: 12px; border-radius: var(--radius-md); display: none; }
        
        .search-box { display: flex; gap: 12px; margin-bottom: 20px; padding: 0 20px; }
        .search-box input { flex: 1; padding: 10px 16px; border: 1px solid var(--border-light); border-radius: var(--radius-full); font-size: 14px; }
        
        .nav-tabs { display: flex; gap: 10px; padding: 0 20px; border-bottom: 1px solid var(--border-light); margin-bottom: 16px; flex-wrap: wrap; }
        .nav-tabs .btn { padding: 8px 20px; border-radius: var(--radius-full); font-size: 13px; font-weight: 500; cursor: pointer; border: none; background: var(--gray-100); color: var(--text-secondary); }
        .nav-tabs .btn.active { background: var(--primary); color: #000000; }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        
        .modal-container {
            background: var(--card-white);
            border-radius: var(--radius-2xl);
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 28px;
        }
        
        .modal-container h3 { font-size: 22px; font-weight: 700; margin-bottom: 20px; }
        .modal-buttons { display: flex; gap: 12px; margin-top: 24px; }
        .modal-buttons button:first-child { flex: 1; background: var(--primary); color: #000; border: none; padding: 12px; border-radius: var(--radius-full); font-weight: 600; cursor: pointer; }
        .modal-buttons button:last-child { flex: 1; background: transparent; border: 1px solid var(--border-light); padding: 12px; border-radius: var(--radius-full); font-weight: 600; cursor: pointer; }
        
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            padding: 20px;
        }
        .category-card {
            background: var(--gray-100);
            border-radius: var(--radius-md);
            padding: 16px;
            text-align: center;
            border: 1px solid var(--border-light);
        }
        .category-card img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 12px;
        }
        
        .offers-cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
            padding: 20px;
        }
        .offer-card-item {
            background: var(--card-white);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: all 0.2s;
        }
        .offer-card-item:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
        .offer-card-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        }
        .offer-card-content { padding: 12px; }
        .offer-card-title { font-weight: 700; font-size: 14px; }
        .offer-card-subtitle { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
        .offer-card-badge { background: var(--primary); color: #000; padding: 2px 8px; border-radius: var(--radius-full); font-size: 10px; font-weight: 600; display: inline-block; margin-top: 8px; }
        
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 10001; }
        .toast-message { background: white; padding: 14px 20px; border-radius: var(--radius-md); margin-bottom: 10px; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 10px; border-left: 4px solid; animation: slideIn 0.3s ease; }
        .toast-message.success { border-left-color: var(--success); }
        .toast-message.error { border-left-color: var(--danger); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        .loading-spinner { text-align: center; padding: 60px; color: var(--primary); }
        .mt-4 { margin-top: 24px; }
        .shop-image { width: 50px; height: 50px; object-fit: cover; border-radius: var(--radius-md); }
        
        @media (max-width: 1024px) {
            .sidebar { width: 80px; }
            .sidebar-header h2, .sidebar-header p, .menu-item span { display: none; }
            .main-content { margin-left: 80px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: 1fr; }
            .main-content { padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>
    
    <div class="sidebar">
        <div class="sidebar-header">
            <h2><span class="normal">Zat</span><span class="pat">pat</span></h2>
            <p>Admin Panel</p>
        </div>
        <div class="sidebar-menu">
            <div class="menu-item active" data-section="dashboard"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></div>
            <div class="menu-divider"></div>
            <div class="menu-item" data-section="shops"><i class="fas fa-store"></i><span>Shop Management</span></div>
            <div class="menu-item" data-section="users"><i class="fas fa-users"></i><span>User Management</span></div>
            <div class="menu-divider"></div>
            <div class="menu-item" data-section="categories"><i class="fas fa-tags"></i><span>Categories</span></div>
            <div class="menu-item" data-section="products"><i class="fas fa-box"></i><span>Products</span></div>
            <div class="menu-item" data-section="hotoffers"><i class="fas fa-fire"></i><span>🔥 Hot Offers</span></div>
            <div class="menu-item" data-section="sliders"><i class="fas fa-images"></i><span>Sliders</span></div>
            <div class="menu-item" data-section="sponsored"><i class="fas fa-crown"></i><span>Sponsored Shops</span></div>
            <div class="menu-divider"></div>
            <div class="menu-item" data-section="orders"><i class="fas fa-receipt"></i><span>Orders</span></div>
            <div class="menu-item" data-section="settings"><i class="fas fa-cog"></i><span>Settings</span></div>
            <div class="menu-divider"></div>
            <div class="menu-item" onclick="window.location.href='index.html'"><i class="fas fa-home"></i><span>View Website</span></div>
            <div class="menu-item" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i><span>Logout</span></div>
        </div>
    </div>
    
    <div class="main-content">
        <div class="admin-header">
            <h1 class="page-title" id="pageTitle">Dashboard</h1>
            <div class="admin-user">
                <div class="admin-avatar" id="adminAvatar">A</div>
                <span id="adminEmail">admin@zatpat.com</span>
                <button class="logout-btn" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
        <div id="contentArea"><div class="loading-spinner"><i class="fas fa-spinner fa-spin fa-2x"></i><p>Loading...</p></div></div>
    </div>
    
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-container" id="modalContent"></div>
    </div>

    <script>
        const supabaseUrl = 'https://zwajyovemwdqtkecipeb.supabase.co';
        const supabaseKey = 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
        
        let currentAdmin = null;
        let allUsers = [], allShops = [], allProducts = [], allCategories = [], allOffers = [], allSliders = [], allFeaturedShops = [], allOrders = [];
        let appSettings = { registrationFee: 499, deliveryFee: 40, freeDeliveryThreshold: 299 };
        let currentSection = 'dashboard';
        let currentShopFilter = 'all';
        
        let offerImageFile = null;
        let sliderImageFile = null;
        let categoryImageFile = null;
        let editItemId = null;
        let editItemType = null;
        
        const Toast = {
            show: (message, type = 'success') => {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `toast-message ${type}`;
                toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i><span>${message}</span>`;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }
        };
        
        async function compressImage(file, maxSizeKB = 400) {
            return new Promise((resolve, reject) => {
                new Compressor(file, {
                    quality: 0.7,
                    maxWidth: 800,
                    maxHeight: 800,
                    success(result) { resolve(result); },
                    error(err) { reject(err); }
                });
            });
        }
        
        async function checkAdmin() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { window.location.href = 'index.html'; return; }
            const { data: profile } = await supabaseClient.from('users').select('role, name').eq('id', user.id).maybeSingle();
            if (profile?.role !== 'admin') {
                Toast.show('Access Denied', 'error');
                setTimeout(() => window.location.href = 'index.html', 2000);
                return;
            }
            currentAdmin = { ...user, ...profile };
            document.getElementById('adminEmail').innerText = user.email;
            document.getElementById('adminAvatar').innerText = (profile?.name || 'A').charAt(0).toUpperCase();
            await loadAllData();
            loadSection('dashboard');
        }
        
        async function loadAllData() {
            const [users, shops, products, categories, offers, sliders, featured, orders, settings] = await Promise.all([
                supabaseClient.from('users').select('*').order('created_at', { ascending: false }),
                supabaseClient.from('shops').select('*').order('created_at', { ascending: false }),
                supabaseClient.from('products').select('*, shops(name)').order('created_at', { ascending: false }),
                supabaseClient.from('categories').select('*').order('priority'),
                supabaseClient.from('offers').select('*').order('priority'),
                supabaseClient.from('sliders').select('*').order('display_order'),
                supabaseClient.from('featured_shops').select('*, shops(id, name, image_url, rating)'),
                supabaseClient.from('orders').select('*').order('created_at', { ascending: false }),
                supabaseClient.from('app_settings').select('*')
            ]);
            allUsers = users.data || [];
            allShops = shops.data || [];
            allProducts = products.data || [];
            allCategories = categories.data || [];
            allOffers = offers.data || [];
            allSliders = sliders.data || [];
            allFeaturedShops = featured.data || [];
            allOrders = orders.data || [];
            
            if (settings.data) {
                const regFee = settings.data.find(s => s.key === 'registration_fee');
                if (regFee) appSettings.registrationFee = parseFloat(regFee.value);
                const delFee = settings.data.find(s => s.key === 'delivery_fee');
                if (delFee) appSettings.deliveryFee = parseFloat(delFee.value);
                const freeThreshold = settings.data.find(s => s.key === 'free_delivery_threshold');
                if (freeThreshold) appSettings.freeDeliveryThreshold = parseFloat(freeThreshold.value);
            }
        }
        
        function loadSection(section) {
            currentSection = section;
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            const menuItem = document.querySelector(`[data-section="${section}"]`);
            if (menuItem) menuItem.classList.add('active');
            
            const titles = {
                dashboard: 'Dashboard', shops: 'Shop Management', users: 'User Management',
                categories: 'Categories', products: 'Products',
                hotoffers: '🔥 Hot Offers', sliders: 'Sliders', sponsored: 'Sponsored Shops',
                orders: 'Orders', settings: 'Settings'
            };
            document.getElementById('pageTitle').innerText = titles[section] || section;
            
            if (section === 'dashboard') renderDashboard();
            else if (section === 'shops') renderShops();
            else if (section === 'users') renderUsers();
            else if (section === 'categories') renderCategories();
            else if (section === 'products') renderProducts();
            else if (section === 'hotoffers') renderHotOffers();
            else if (section === 'sliders') renderSliders();
            else if (section === 'sponsored') renderSponsored();
            else if (section === 'orders') renderOrders();
            else if (section === 'settings') renderSettings();
        }
        
        function renderDashboard() {
            const pendingShops = allShops.filter(s => s.status === 'pending').length;
            const totalRevenue = allOrders.reduce((sum, o) => sum + (o.total || 0), 0);
            document.getElementById('contentArea').innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-icon users"><i class="fas fa-users"></i></div><div class="stat-info"><h3>${allUsers.length}</h3><p>Total Users</p></div></div>
                    <div class="stat-card"><div class="stat-icon shops"><i class="fas fa-store"></i></div><div class="stat-info"><h3>${allShops.length}</h3><p>Total Shops</p><small class="text-muted">${pendingShops} pending</small></div></div>
                    <div class="stat-card"><div class="stat-icon products"><i class="fas fa-box"></i></div><div class="stat-info"><h3>${allProducts.length}</h3><p>Total Products</p></div></div>
                    <div class="stat-card"><div class="stat-icon orders"><i class="fas fa-rupee-sign"></i></div><div class="stat-info"><h3>₹${totalRevenue.toLocaleString()}</h3><p>Total Revenue</p></div></div>
                </div>
                <div class="content-card"><div class="card-header"><h2>Quick Actions</h2></div><div style="padding: 20px; display: flex; gap: 12px; flex-wrap: wrap;"><button class="btn-primary" onclick="loadSection('shops')">Manage Shops</button><button class="btn-primary" onclick="loadSection('hotoffers')">Hot Offers</button><button class="btn-primary" onclick="loadSection('products')">Add Product</button><button class="btn-primary" onclick="loadSection('settings')">Settings</button></div></div>
            `;
        }
        
        // ========== SHOPS (With Edit, Block, Delete, Images) ==========
        function renderShops() {
            document.getElementById('contentArea').innerHTML = `
                <div class="content-card"><div class="card-header"><h2>Shop Management</h2></div>
                <div class="search-box"><input type="text" id="shopSearch" placeholder="🔍 Search shops..." onkeyup="filterShopsList()"></div>
                <div class="nav-tabs">

        async function saveCategory() {
            const name = document.getElementById('catName').value;

            let imageUrl = document.getElementById('catImagePreview')?.src;
            
            // If new image uploaded
            if(categoryImageFile) {
                const compressed = await compressImage(categoryImageFile);
                const fileName = `categories/${Date.now()}.jpg`;
                const { error: uploadError } = await supabaseClient.storage.from('category-images').upload(fileName, compressed);

                    Toast.show('Image upload failed', 'error');

                const { data: { publicUrl } } = supabaseClient.storage.from('category-images').getPublicUrl(fileName);
                imageUrl = publicUrl;
            }
            
            const categoryData = { name, image_url: imageUrl, priority: 5, is_active: true };
            
            if (editItemId) {
                await supabaseClient.from('categories').update(categoryData).eq('id', editItemId);
                Toast.show('Category updated');
            } else {
                await supabaseClient.from('categories').insert([categoryData]);

            hideModal(); 
            categoryImageFile = null;
            await loadAllData(); 
            renderCategories();

                            <button class="btn-primary" style="margin-top: 12px;" onclick="updateSetting('registration_fee', document.getElementById('regFee').value)">Save Registration Fee</button>
                        </div>
                        <div class="form-group mt-4">
                            <label class="form-label"><i class="fas fa-truck"></i> Delivery Fee (₹)</label>
                            <input type="number" id="deliveryFee" class="form-control" value="${appSettings.deliveryFee}">
                        </div>
                        <div class="form-group">
                            <label class="form-label"><i class="fas fa-gift"></i> Free Delivery Threshold (₹)</label>
                            <input type="number" id="freeThreshold" class="form-control" value="${appSettings.freeDeliveryThreshold}">
                            <button class="btn-primary" style="margin-top: 12px;" onclick="updateDeliverySettings()">Save Delivery Settings</button>
                        </div>
                    </div>
                </div>
            `;
        }
        
        async function updateDeliverySettings() {
            await updateSetting('delivery_fee', document.getElementById('deliveryFee').value);
            await updateSetting('free_delivery_threshold', document.getElementById('freeThreshold').value);
        }
        
        async function updateSetting(key, value) { 
            await supabaseClient.from('app_settings').upsert([{ key, value }], { onConflict: 'key' }); 
            Toast.show('Setting saved'); 
            await loadAllData(); 
            renderSettings();
        }
        
        // ========== UTILITY ==========
        function showModal(html) { document.getElementById('modalContent').innerHTML = html; document.getElementById('modalOverlay').style.display = 'flex'; }
        function hideModal() { document.getElementById('modalOverlay').style.display = 'none'; }
        async function handleLogout() { await supabaseClient.auth.signOut(); window.location.href = 'index.html'; }
        
        document.querySelectorAll('.menu-item[data-section]').forEach(item => {
            item.addEventListener('click', () => loadSection(item.dataset.section));
        });
        
        document.addEventListener('DOMContentLoaded', checkAdmin);
        
        // Export functions
        window.approveShop = approveShop; window.blockShop = blockShop; window.deleteShop = deleteShop; window.editShop = editShop;
        window.toggleUserStatus = toggleUserStatus; window.deleteUser = deleteUser;
        window.deleteCategory = deleteCategory; window.showAddCategoryModal = showAddCategoryModal; window.showEditCategoryModal = showEditCategoryModal; window.saveCategory = saveCategory;
        window.deleteProduct = deleteProduct; window.toggleFeatured = toggleFeatured; window.showAddProductModal = showAddProductModal; window.editProduct = editProduct;
        window.deleteSlider = deleteSlider; window.showAddSliderModal = showAddSliderModal; window.editSlider = editSlider; window.saveSlider = saveSlider;
        window.addSponsoredShop = addSponsoredShop; window.removeSponsored = removeSponsored;
        window.deleteOrder = deleteOrder; window.updateSetting = updateSetting; window.updateDeliverySettings = updateDeliverySettings;
        window.showAddOfferModal = showAddOfferModal; window.editOffer = editOffer; window.saveOfferCard = saveOfferCard; window.deleteOffer = deleteOffer;
        window.hideModal = hideModal; window.handleLogout = handleLogout;
        window.handleOfferImage = handleOfferImage; window.handleSliderImage = handleSliderImage; window.handleCategoryImage = handleCategoryImage;
        window.filterShopStatus = filterShopStatus; window.filterShopsList = filterShopsList;
        window.filterUsersList = filterUsersList; window.filterProductsList = filterProductsList;
    </script>
</body>
</html>
