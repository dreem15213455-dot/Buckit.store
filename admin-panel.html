    <script>
    (function() {

        var SUPABASE_URL = 'https://zwajyovemwdqtkecipeb.supabase.co';

        var currentSection = 'dashboard', shopFilter = 'all', productFilter = 'all';

        }

        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
        }

        function getImageUrl(url) {
            if (!url) return '';
            if (url.indexOf('http') === 0 || url.indexOf('data:') === 0) return url;
            return SUPABASE_URL + '/storage/v1/object/public/' + url;
        }

        async function safeFetch(fetchFn, maxRetries) {
            maxRetries = maxRetries || 3;
            var lastError = null;
            for (var i = 0; i < maxRetries; i++) {
                try { var result = await fetchFn(); if (result.error) { lastError = new Error(result.error.message); if (i===maxRetries-1) throw lastError; } else return result; }
                catch(err) { lastError = err; if (i===maxRetries-1) throw lastError; }
                await new Promise(function(r) { setTimeout(r, Math.pow(2,i)*500); });
            }
            throw lastError;
        }

        async function compressImage(file) {
            return new Promise(function(resolve) {
                if (!file || !file.type || file.type.indexOf('image/') !== 0) { resolve(file); return; }
                var reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = function(e) { var img = new Image(); img.src = e.target.result;
                    img.onload = function() { var w = img.width, h = img.height, maxDim = 600;
                        if (w > maxDim || h > maxDim) { if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; } else { w = Math.round((w * maxDim) / h); h = maxDim; } }
                        var canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        canvas.toBlob(function(blob) { resolve(new File([blob], file.name.replace(/\.[^.]+$/,'.jpg'), { type: 'image/jpeg' })); }, 'image/jpeg', 0.5);
                    };
                };
            });
        }

        function toast(msg, type) { type = type || 'success'; var container = document.getElementById('toastContainer'); var el = document.createElement('div'); el.className = 'toast ' + type; el.innerHTML = '<i class="fas fa-' + (type === 'success' ? 'check-circle' : 'exclamation-circle') + '"></i> ' + msg; container.appendChild(el); setTimeout(function(){ el.style.opacity = '0'; el.style.transform = 'translateX(100%)'; setTimeout(function(){ el.remove(); }, 300); }, 4000); }

        window.fastNavigate = function(url) { window.location.href = url; };

        async function checkSession() {
            try {
                var res = await sb.auth.getSession();
                if (res.data.session) {
                    var prof = await safeFetch(function() { return sb.from('users').select('role').eq('id', res.data.session.user.id).single(); });
                    var role = prof.data ? prof.data.role : null;
                    if (role === 1 || role === '1' || role === 'admin') { currentAdmin = res.data.session.user; await loadAllData(); renderApp(); showApp(); initComplete = true; return; }
                    window.location.href = 'index.html'; return;
                }
                showLogin(); showApp(); initComplete = true;
            } catch(e) { showLogin(); showApp(); initComplete = true; }
        }

        async function loadAllData() {
            try {
                var results = await Promise.allSettled([
                    safeFetch(function() { return sb.from('users').select('*').order('created_at', { ascending: false }); }),
                    safeFetch(function() { return sb.from('shops').select('*').order('created_at', { ascending: false }); }),

                    safeFetch(function() { return sb.from('categories').select('*').order('priority'); }),
                    safeFetch(function() { return sb.from('offers').select('*').order('priority'); }),

                    safeFetch(function() { return sb.from('featured_shops').select('*, shops(id, name)'); }),
                    safeFetch(function() { return sb.from('orders').select('*').order('created_at', { ascending: false }); })
                ]);
                allUsers = results[0].status === 'fulfilled' ? (results[0].value.data || []) : [];
                allShops = results[1].status === 'fulfilled' ? (results[1].value.data || []) : [];
                allProducts = results[2].status === 'fulfilled' ? (results[2].value.data || []) : [];
                allCategories = results[3].status === 'fulfilled' ? (results[3].value.data || []) : [];
                allOffers = results[4].status === 'fulfilled' ? (results[4].value.data || []) : [];
                allSliders = results[5].status === 'fulfilled' ? (results[5].value.data || []) : [];
                allFeatured = results[6].status === 'fulfilled' ? (results[6].value.data || []) : [];
                allOrders = results[7].status === 'fulfilled' ? (results[7].value.data || []) : [];
            } catch(e) { toast('Failed to load data: ' + e.message, 'error'); }
        }

        function showLogin() {
            document.getElementById('app').innerHTML = '<div class="login-container"><div class="login-card"><div class="login-logo">Zat<span style="color:var(--primary);">pat</span></div><div class="login-subtitle">Admin Panel</div><div class="login-error" id="loginError"></div><div id="loginStepEmail"><input type="email" id="adminEmail" class="login-input" placeholder="Admin Email"><button class="login-btn" onclick="sendAdminOTP()">Send OTP</button></div><div id="loginStepOTP" style="display:none;"><p style="font-size:13px;margin-bottom:8px;">OTP sent to: <strong id="otpEmailDisplay"></strong></p><input type="text" id="adminOtp" class="login-input" placeholder="Enter OTP" maxlength="6" inputmode="numeric"><button class="login-btn" onclick="verifyAdminOTP()">Verify & Login</button><button class="login-btn" id="resendAdminBtn" onclick="resendAdminOTP()" style="background:transparent;border:1px solid var(--border);color:var(--text);">Resend OTP</button><button class="login-back" onclick="backToAdminEmail()">← Back</button></div><button class="login-back" style="margin-top:14px;" onclick="fastNavigate(\'index.html\')">← Go to Home Page</button></div></div>';
        }

        // ==================== LOGIN FUNCTIONS ====================
        window.sendAdminOTP = async function() { var email = document.getElementById('adminEmail').value.trim(); var errEl = document.getElementById('loginError'); if (!email) { errEl.style.display = 'block'; errEl.textContent = 'Enter admin email'; return; } errEl.style.display = 'none'; var btn = document.querySelector('#loginStepEmail .login-btn'); btn.disabled = true; btn.textContent = 'Sending OTP...'; try { var res = await sb.auth.signInWithOtp({ email: email, options: { shouldCreateUser: false } }); if (res.error) { errEl.style.display = 'block'; errEl.textContent = res.error.message; btn.disabled = false; btn.textContent = 'Send OTP'; return; } currentOtpEmail = email; document.getElementById('otpEmailDisplay').textContent = email; document.getElementById('loginStepEmail').style.display = 'none'; document.getElementById('loginStepOTP').style.display = 'block'; startOtpTimer(); toast('✅ OTP sent to ' + email, 'success'); } catch(e) { errEl.style.display = 'block'; errEl.textContent = 'Failed: ' + e.message; btn.disabled = false; btn.textContent = 'Send OTP'; } };

        window.setShopFilter = function(filter, btn) { shopFilter = filter; var tabs = document.querySelectorAll('.tab-btn'); for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active'); btn.classList.add('active'); filterShops(); };
        window.filterShops = function() { var term = (document.getElementById('shopSearch')?.value || '').toLowerCase(); var filtered = allShops.filter(function(s) { if (shopFilter !== 'all' && s.status !== shopFilter) return false; if (term && !(s.name||'').toLowerCase().includes(term) && !(s.owner_name||'').toLowerCase().includes(term) && !(s.city||'').toLowerCase().includes(term)) return false; return true; }); var el = document.getElementById('shopsList'); if (!filtered.length) { el.innerHTML = '<div class="empty-state"><i class="fas fa-store-slash"></i>No shops found</div>'; return; } var html = '<div class="table-wrapper"><table class="data-table"><thead><tr><th>Image</th><th>Shop Name</th><th>Owner</th><th>City</th><th>Phone</th><th>Status</th><th>Actions</th></tr></thead><tbody>'; for (var i = 0; i < filtered.length; i++) { var s = filtered[i]; var imgUrl = getImageUrl(s.image_url); html += '<tr>'; if (imgUrl) { html += '<td><div class="shop-thumb"><img src="' + imgUrl + '" onerror="this.onerror=null;this.parentElement.innerHTML=\'<i class=\\\'fas fa-store\\\'></i>\';" alt="Shop"></div></td>'; } else { html += '<td><div class="shop-thumb"><i class="fas fa-store"></i></div></td>'; } html += '<td><strong>' + escapeHTML(s.name || '-') + '</strong></td><td>' + escapeHTML(s.owner_name || '-') + '</td><td>' + escapeHTML(s.city || '-') + '</td><td>' + escapeHTML(s.phone || '-') + '</td><td><span class="badge ' + (s.status === 'approved' ? 'badge-success' : 'badge-warning') + '">' + s.status + '</span></td><td><div class="btn-group">'; if (s.status === 'pending') html += '<button class="btn btn-success btn-sm" onclick="approveShop(\'' + s.id + '\')">Approve</button>'; html += '<button class="btn btn-danger btn-sm" onclick="deleteShop(\'' + s.id + '\')">Delete</button></div></td></tr>'; } html += '</tbody></table></div>'; el.innerHTML = html; };
        window.approveShop = async function(id) { var shop = allShops.find(function(s) { return s.id === id; }); if (!shop) { toast('Shop not found', 'error'); return; } if (!shop.owner_email) { toast('Owner email missing!', 'error'); return; } var btn = event.target; if (btn) { btn.disabled = true; btn.textContent = 'Approving...'; } try { var existingUser = await safeFetch(function() { return sb.from('users').select('id').eq('email', shop.owner_email).maybeSingle(); }); var userId = null; if (existingUser.data) { userId = existingUser.data.id; await safeFetch(function() { return sb.from('users').update({ role: 2, name: shop.owner_name || '', phone: shop.owner_phone || '' }).eq('id', userId); }); toast('User exists — role updated to Shop Owner', 'success'); } else { var tempPassword = 'Zp' + Math.random().toString(36).slice(2, 10) + '@1'; var signUpRes = await sb.auth.signUp({ email: shop.owner_email, password: tempPassword, options: { data: { name: shop.owner_name || '', phone: shop.owner_phone || '', role: 2 } } }); if (signUpRes.error) { if (signUpRes.error.message.indexOf('already registered') > -1 || signUpRes.error.message.indexOf('already exists') > -1) { var retryUser = await safeFetch(function() { return sb.from('users').select('id').eq('email', shop.owner_email).maybeSingle(); }); if (retryUser.data) { userId = retryUser.data.id; await safeFetch(function() { return sb.from('users').update({ role: 2 }).eq('id', userId); }); toast('User exists — role updated', 'success'); } else { toast('Unexpected error', 'error'); if(btn){btn.disabled=false;btn.textContent='Approve';} return; } } else { toast('Failed: ' + signUpRes.error.message, 'error'); if(btn){btn.disabled=false;btn.textContent='Approve';} return; } } else { userId = signUpRes.data.user.id; await safeFetch(function() { return sb.from('users').upsert({ id: userId, email: shop.owner_email, name: shop.owner_name || '', phone: shop.owner_phone || '', role: 2 }); }); toast('✅ New user account created!', 'success'); } } if (!userId) { if(btn){btn.disabled=false;btn.textContent='Approve';} toast('Could not determine user ID', 'error'); return; } await safeFetch(function() { return sb.from('shops').update({ status: 'approved', owner_id: userId }).eq('id', id); }); toast('✅ Shop approved!', 'success'); } catch(e) { if(btn){btn.disabled=false;btn.textContent='Approve';} toast('Error: ' + e.message, 'error'); } await loadAllData(); filterShops(); };
        window.deleteShop = async function(id) { if (!confirm('Delete this shop permanently?')) return; try { var shop = allShops.find(function(s) { return s.id === id; }); await sb.from('products').delete().eq('shop_id', id); await sb.from('shops').delete().eq('id', id); if (shop && shop.owner_id) { await sb.from('users').delete().eq('id', shop.owner_id); } toast('✅ Shop deleted!', 'success'); await loadAllData(); filterShops(); } catch(e) { toast('❌ Delete failed: ' + e.message, 'error'); } };

        function renderCategories(c) { c.innerHTML = '<div class="content-card"><div class="card-header"><h2>Categories</h2><button class="btn btn-primary btn-sm" onclick="showCategoryModal()">+ Add</button></div><div class="card-grid" id="catGrid"></div></div>'; var grid = document.getElementById('catGrid'); if (!allCategories.length) { grid.innerHTML = '<div class="empty-state">No categories</div>'; return; } var html = ''; for (var i = 0; i < allCategories.length; i++) { var cat = allCategories[i]; var imgUrl = getImageUrl(cat.image_url); if (imgUrl) { html += '<div class="card-item"><div class="card-item-img"><img src="' + imgUrl + '" onerror="this.onerror=null;this.parentElement.innerHTML=\'<i class=\\\'fas fa-folder\\\'></i>\';" alt="' + escapeHTML(cat.name) + '"></div><div class="card-item-body"><div class="card-item-title">' + escapeHTML(cat.name) + '</div><div class="btn-group"><button class="btn btn-warning btn-sm" onclick="showCategoryModal(\'' + cat.id + '\')">Edit</button><button class="btn btn-danger btn-sm" onclick="deleteCategory(\'' + cat.id + '\')">Delete</button></div></div></div>'; } else { html += '<div class="card-item"><div class="card-item-img"><i class="fas fa-folder"></i></div><div class="card-item-body"><div class="card-item-title">' + escapeHTML(cat.name) + '</div><div class="btn-group"><button class="btn btn-warning btn-sm" onclick="showCategoryModal(\'' + cat.id + '\')">Edit</button><button class="btn btn-danger btn-sm" onclick="deleteCategory(\'' + cat.id + '\')">Delete</button></div></div></div>'; } } grid.innerHTML = html; }
        window.showCategoryModal = function(id) { catEditId = id || null; var cat = id ? allCategories.find(function(c){ return c.id === id; }) : null; var existingImg = cat && cat.image_url ? getImageUrl(cat.image_url) : ''; var html = '<div class="modal-header"><h3>' + (cat ? 'Edit' : 'Add') + ' Category</h3><button class="modal-close" onclick="closeModal()">✕</button></div>'; html += '<div class="form-group"><label class="form-label">Name</label><input type="text" id="catName" class="form-control" value="' + escapeHTML(cat ? cat.name : '') + '"></div>'; html += '<div class="form-group"><label class="form-label">Image <small>(Auto-compress)</small></label><div class="image-upload-box" onclick="document.getElementById(\'catImgInput\').click()"><i class="fas fa-cloud-upload-alt"></i> Click to upload<input type="file" id="catImgInput" accept="image/*" style="display:none" onchange="handleCatImage(this)"><img id="catImgPreview" class="image-preview" src="' + existingImg + '" style="' + (existingImg ? 'display:block;' : '') + '"><div id="catCompressInfo" class="compress-info"></div></div></div>'; html += '<div style="display:flex;gap:10px;margin-top:16px;"><button class="btn btn-primary" style="flex:1;" onclick="saveCategory()">Save</button><button class="btn btn-outline" style="flex:1;" onclick="closeModal()">Cancel</button></div>'; var modal = document.createElement('div'); modal.className = 'modal-overlay show'; modal.id = 'modalContainer'; modal.innerHTML = '<div class="modal-container">' + html + '</div>'; document.body.appendChild(modal); catImageFile = null; };
        window.handleCatImage = async function(input) { var f = input.files[0]; if (!f) return; var infoEl = document.getElementById('catCompressInfo'); if (infoEl) { infoEl.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Compressing...'; infoEl.style.display = 'block'; } catImageFile = await compressImage(f); var compSize = (catImageFile.size / 1024).toFixed(0); if (infoEl) { infoEl.innerHTML = '✓ Ready: ' + compSize + 'KB'; } var reader = new FileReader(); reader.onload = function(e) { var preview = document.getElementById('catImgPreview'); if (preview) { preview.src = e.target.result; preview.style.display = 'block'; } }; reader.readAsDataURL(catImageFile); };
        window.saveCategory = async function() { var name = document.getElementById('catName').value.trim(); if (!name) { toast('Enter name', 'error'); return; } var imageUrl = ''; var existingPreview = document.getElementById('catImgPreview'); if (catImageFile) { try { var fn = 'cat_' + Date.now() + '_' + Math.random().toString(36).substr(2,6) + '.jpg'; var uploadResult = await sb.storage.from('category-images').upload(fn, catImageFile, { cacheControl: '3600' }); if (uploadResult.error) { toast('Upload failed', 'error'); return; } var urlResult = sb.storage.from('category-images').getPublicUrl(fn); imageUrl = urlResult.data.publicUrl; } catch(e) { toast('Upload error', 'error'); return; } } else if (existingPreview && existingPreview.src && existingPreview.src.indexOf('http') === 0 && existingPreview.src.indexOf('data:') !== 0) { imageUrl = existingPreview.src; } var data = { name: name, image_url: imageUrl || null, is_active: true }; if (catEditId) { await sb.from('categories').update(data).eq('id', catEditId); toast('Updated!', 'success'); } else { await sb.from('categories').insert([data]); toast('Added!', 'success'); } closeModal(); await loadAllData(); renderCategories(document.getElementById('contentArea')); };

            '</div></div>';
            
            bannerImageFile = null;
        }
        
        // 🔥 HANDLE BANNER IMAGE
        window.handleBannerImage = async function(input) { 
            var f = input.files[0]; if (!f) return; 
            var infoEl = document.getElementById('bannerCompressInfo'); 
            if (infoEl) { infoEl.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Compressing...'; infoEl.style.display = 'block'; }

            reader.onload = function(e) { 
                var preview = document.getElementById('bannerImgPreview'); 
                if (preview) { preview.src = e.target.result; preview.style.display = 'block'; } 
            }; 
            reader.readAsDataURL(bannerImageFile); 
        };

        // ==================== WHATSAPP BROADCAST ====================
        function renderBroadcast(c) {
            var usersWithPhone = allUsers.filter(function(u) { return u.phone && u.phone.length >= 10; });
            var shopOwnersWithPhone = allUsers.filter(function(u) { return (u.role == 2 || u.role === '2') && u.phone && u.phone.length >= 10; });
            var html = '<div class="content-card"><div class="card-header"><h2>📢 WhatsApp Broadcast</h2></div><div style="padding:16px;">';
            html += '<p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">Send WhatsApp message to users & shop owners without API.</p>';
            html += '<div class="form-group"><label class="form-label">Target Audience</label><select id="broadcastTarget" class="form-control" onchange="updateBroadcastPreview()">';
            html += '<option value="all">All Users (' + usersWithPhone.length + ')</option>';
            html += '<option value="shop_owners">Shop Owners Only (' + shopOwnersWithPhone.length + ')</option>';
            html += '<option value="custom">Custom Numbers</option></select></div>';
            html += '<div id="customNumbersDiv" style="display:none;"><div class="form-group"><label class="form-label">Phone Numbers (comma separated)</label><textarea id="customNumbers" class="form-control" rows="2" placeholder="+918600252238, +919XXXXXXXXX"></textarea></div></div>';
            html += '<div class="form-group"><label class="form-label">Message</label><textarea id="broadcastMessage" class="form-control" rows="3" placeholder="Enter your message here..." onkeyup="updateCharCount()">Hello from Zatpat! 🛍️\nCheck out our latest offers: https://zatpat.in</textarea><small id="charCount" style="color:var(--text-secondary);">0 characters</small></div>';
            html += '<div class="broadcast-preview" id="broadcastPreview"></div>';
            html += '<div style="display:flex;gap:10px;margin-top:16px;"><button class="btn btn-success" style="flex:1;" onclick="sendBroadcast()"><i class="fab fa-whatsapp"></i> Open WhatsApp</button><button class="btn btn-outline btn-sm" onclick="copyPhoneNumbers()"><i class="fas fa-copy"></i> Copy Numbers</button></div>';
            html += '<p style="font-size:10px;color:var(--text-secondary);margin-top:8px;">⚠️ Opens WhatsApp Web/App. Send manually after WhatsApp opens.</p></div></div>';
            c.innerHTML = html; updateBroadcastPreview(); updateCharCount();
        }
        window.updateBroadcastPreview = function() { var target = document.getElementById('broadcastTarget')?.value || 'all'; var customDiv = document.getElementById('customNumbersDiv'); if (customDiv) customDiv.style.display = target === 'custom' ? 'block' : 'none'; var numbers = getTargetNumbers(); var preview = document.getElementById('broadcastPreview'); if (preview) { preview.innerHTML = '<strong>📋 Recipients (' + numbers.length + '):</strong><br>' + numbers.slice(0, 10).join(', ') + (numbers.length > 10 ? '... +' + (numbers.length - 10) + ' more' : ''); } };
        function getTargetNumbers() { var target = document.getElementById('broadcastTarget')?.value || 'all'; if (target === 'custom') { var customText = document.getElementById('customNumbers')?.value || ''; return customText.split(',').map(function(n) { return n.trim(); }).filter(function(n) { return n.length >= 10; }); } var users = allUsers.filter(function(u) { return u.phone && u.phone.length >= 10; }); if (target === 'shop_owners') { users = users.filter(function(u) { return u.role == 2 || u.role === '2'; }); } return users.map(function(u) { var phone = u.phone.replace(/[\s\-\(\)]/g, ''); if (!phone.startsWith('+')) phone = '+91' + phone; return phone; }); }
        window.updateCharCount = function() { var msg = document.getElementById('broadcastMessage')?.value || ''; var countEl = document.getElementById('charCount'); if (countEl) countEl.textContent = msg.length + ' characters'; };
        window.sendBroadcast = function() { var numbers = getTargetNumbers(); var message = document.getElementById('broadcastMessage')?.value || ''; if (!numbers.length) { toast('No phone numbers found!', 'error'); return; } if (!message.trim()) { toast('Enter a message!', 'error'); return; } var encodedMsg = encodeURIComponent(message); var batch = numbers.slice(0, 5); toast('Opening WhatsApp for ' + batch.length + ' recipients...', 'success'); for (var i = 0; i < batch.length; i++) { var url = 'https://wa.me/' + batch[i].replace(/\+/g, '') + '?text=' + encodedMsg; setTimeout(function(u) { window.open(u, '_blank'); }, i * 800, url); } if (numbers.length > 5) { setTimeout(function() { toast('⚠️ Only first 5 opened. Total: ' + numbers.length + ' recipients.', 'error'); }, 5000); } };
        window.copyPhoneNumbers = function() { var numbers = getTargetNumbers(); if (!numbers.length) { toast('No numbers to copy!', 'error'); return; } var text = numbers.join(', '); if (navigator.clipboard) { navigator.clipboard.writeText(text).then(function() { toast('📋 ' + numbers.length + ' numbers copied!', 'success'); }); } else { var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); toast('📋 Numbers copied!', 'success'); } };
