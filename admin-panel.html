                return res || {data: null};

    function expandSearchTerms(query) {
        var terms = query.toLowerCase().trim().split(/\s+/).filter(Boolean);
        var expanded = {};
        terms.forEach(function(t) {
            expanded[t] = true;
            if (SEARCH_SYNONYMS[t]) SEARCH_SYNONYMS[t].forEach(function(s) { expanded[s] = true; });
            Object.keys(SEARCH_SYNONYMS).forEach(function(k) {
                if (SEARCH_SYNONYMS[k].indexOf(t) !== -1) {
                    expanded[k] = true;
                    SEARCH_SYNONYMS[k].forEach(function(s) { expanded[s] = true; });
                }
            });
        });
        return Object.keys(expanded);
    }
    
    function fuzzyFilterProducts(query) {
        if (!query || !query.trim()) return allProducts;
        var expanded = expandSearchTerms(query);
        var originalTerms = query.toLowerCase().trim().split(/\s+/).filter(Boolean);
        
        var scored = allProducts.map(function(p) {
            var name = (p.name || '').toLowerCase();
            var shop = (getShopName(p.shop_id) || '').toLowerCase();
            var cat = (getCatName(p.category_id) || '').toLowerCase();
            var combined = name + ' ' + shop + ' ' + cat;
            
            var score = 0;
            originalTerms.forEach(function(t) {
                if (name.indexOf(t) !== -1) { score += 40; }
                else if (combined.indexOf(t) !== -1) { score += 15; }
            });
            expanded.forEach(function(t) {
                if (originalTerms.indexOf(t) !== -1) return;
                if (name.indexOf(t) === 0) score += 20;
                else if (name.indexOf(t) !== -1) score += 10;
                else if (combined.indexOf(t) !== -1) score += 4;
            });
            return { product: p, score: score };
        });
        
        return scored.filter(function(s) { return s.score > 0; })
                     .sort(function(a, b) { return b.score - a.score; })
                     .map(function(s) { return s.product; });
    }

    async function compressImage(file) {
        if (!file || !file.type.match(/image\//)) return file;
        var TARGET_MIN = CONFIG.IMG_MIN_KB * 1024;
        var TARGET_MAX = CONFIG.IMG_MAX_KB * 1024;
        if (file.size >= TARGET_MIN && file.size <= TARGET_MAX) return file;
        if (file.size < TARGET_MIN) return file;
        
        return new Promise(function(resolve) {
            var reader = new FileReader();
            reader.onload = function(e) {
                var img = new Image();
                img.onload = function() {
                    var maxDim = 1600;
                    var w = img.width, h = img.height;
                    if (w > maxDim || h > maxDim) {
                        var ratio = Math.min(maxDim/w, maxDim/h);
                        w = Math.round(w * ratio); h = Math.round(h * ratio);
                    }
                    var canvas = document.createElement('canvas');
                    canvas.width = w; canvas.height = h;
                    var ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, w, h);
                    var qualities = [0.92, 0.90, 0.88, 0.85, 0.82, 0.80, 0.78, 0.75, 0.72, 0.70, 0.68, 0.65, 0.62, 0.60, 0.58, 0.55, 0.52, 0.50];
                    var idx = 0; var bestBlob = null;
                    function tryQuality() {
                        if (idx >= qualities.length) {
                            if (w > 400 && h > 400) {
                                var newW = Math.round(w * 0.8); var newH = Math.round(h * 0.8);
                                var nc = document.createElement('canvas'); nc.width = newW; nc.height = newH;
                                var nctx = nc.getContext('2d'); nctx.imageSmoothingEnabled = true; nctx.imageSmoothingQuality = 'high';
                                nctx.drawImage(canvas, 0, 0, newW, newH);
                                canvas = nc; w = newW; h = newH; idx = 0; tryQuality(); return;
                            }
                            resolve(bestBlob ? new File([bestBlob], 'img.jpg', {type:'image/jpeg'}) : file);
                            return;
                        }
                        var q = qualities[idx++];
                        canvas.toBlob(function(blob) {
                            if (!blob) { tryQuality(); return; }
                            if (blob.size >= TARGET_MIN && blob.size <= TARGET_MAX) { resolve(new File([blob], 'img.jpg', {type:'image/jpeg'})); return; }
                            if (blob.size < TARGET_MIN) { resolve(new File([blob], 'img.jpg', {type:'image/jpeg'})); return; }
                            bestBlob = blob; tryQuality();
                        }, 'image/jpeg', q);
                    }
                    tryQuality();
                };
                img.onerror = function() { resolve(file); };
                img.src = e.target.result;
            };
            reader.onerror = function() { resolve(file); };
            reader.readAsDataURL(file);
        });
    }
    
    async function uploadCompressedImage(file, bucket, folder) {
        if(!file) return null;
        var compressed = await compressImage(file);
        var fn = folder + '_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6) + '.jpg';
        var r = await sb.storage.from(bucket).upload(fn, compressed, {cacheControl:'3600', upsert:true, contentType:'image/jpeg'});
        if(r.error) { toast('❌ Upload failed', 'error'); return null; }
        return sb.storage.from(bucket).getPublicUrl(fn).data.publicUrl;
    }

    window.approveShop = async function(id) {
        var shop = allShops.find(function(s) { return s.id === id; });
        if(!shop) { toast('❌ Shop not found', 'error'); return; }
        try {
            var userId = null;
            if (shop.owner_email) {
                var eu = await sb.from('users').select('id').eq('email', shop.owner_email).maybeSingle();
                if (eu.data) userId = eu.data.id;
            }
            if (!userId && shop.owner_phone) {
                var ep = await sb.from('users').select('id').eq('phone', shop.owner_phone).maybeSingle();
                if (ep.data) userId = ep.data.id;
            }
            if (!userId && (shop.owner_email || shop.owner_phone)) {
                try {
                    var nu = await sb.from('users').insert([{email: shop.owner_email || (shop.owner_phone + '@zymart.user'), name: shop.owner_name || 'Shop Owner', phone: shop.owner_phone || null, role: 'shop_owner', is_active: true}]).select('id').single();
                    if (nu.data) userId = nu.data.id;
                } catch(e) { console.warn('[Approve] User create:', e.message); }
            } else if (userId) {
                try { await sb.from('users').update({role: 'shop_owner'}).eq('id', userId); } catch(e) {}
            }
            
            var updateData = { status: 'approved', is_open: true };
            if (userId) updateData.owner_id = userId;
            
            var r = await sb.from('shops').update(updateData).eq('id', id).select();
            if (r.error) throw new Error('Update error: ' + r.error.message);
            if (!r.data || r.data.length === 0) throw new Error('RLS blocked update. Check shops table policy.');
            
            bustGlobalCache(); // ✅ Cache clear
            
            toast('✅ Shop approved!');
            await loadData();
            renderShops($('contentArea'));
        } catch(e) {
            console.error('[Approve]', e);
            toast('❌ ' + e.message, 'error');
        }
    };

    window.setCategoryOrder = async function(id, value, type) {
        var newOrder = parseInt(value);
        if (isNaN(newOrder) || newOrder < 1) {
            toast('⚠️ Enter valid number (1+)', 'error');
            await loadData();
            if (type === 'sub') renderSubCategories($('contentArea'));
            else renderCategories($('contentArea'));
            return;
        }
        try {
            var targetCat = allCategories.find(function(c) { return c.id === id; });
            if (!targetCat) { toast('❌ Not found', 'error'); return; }
            
            var sameGroupCats = type === 'sub'
                ? allCategories.filter(function(c) { return c.parent_id && c.parent_id === targetCat.parent_id; })
                : allCategories.filter(function(c) { return !c.parent_id; });
            
            sameGroupCats.sort(function(a, b) { return (a.display_order || 999) - (b.display_order || 999); });
            
            var remaining = sameGroupCats.filter(function(c) { return c.id !== id; });
            var insertIdx = Math.min(newOrder - 1, remaining.length);
            if (insertIdx < 0) insertIdx = 0;
            remaining.splice(insertIdx, 0, targetCat);
            
            var updates = [];
            for (var i = 0; i < remaining.length; i++) {
                var newPos = i + 1;
                if ((remaining[i].display_order || 0) !== newPos) {
                    updates.push(sb.from('categories').update({display_order: newPos}).eq('id', remaining[i].id).select());
                }
            }
            
            if (updates.length === 0) { toast('✅ Already at #' + newOrder); return; }
            
            var results = await Promise.all(updates);
            var failed = results.filter(function(r) { return r.error || !r.data || r.data.length === 0; }).length;
            
            if (failed > 0) toast('⚠️ ' + failed + '/' + updates.length + ' failed. Check RLS.', 'error');
            else toast('✅ Order #' + newOrder + ' saved');
            
            bustGlobalCache();
            await loadData();
            if (type === 'sub') renderSubCategories($('contentArea'));
            else renderCategories($('contentArea'));
        } catch(e) { toast('❌ ' + e.message, 'error'); }
    };
    
    window.moveCategory = async function(id, direction, type) {
        var targetCat = allCategories.find(function(c) { return c.id === id; });
        if (!targetCat) return;
        
        var group = type === 'sub'
            ? allCategories.filter(function(c) { return c.parent_id && c.parent_id === targetCat.parent_id; })
            : allCategories.filter(function(c) { return !c.parent_id; });
        
        group.sort(function(a, b) { return (a.display_order || 999) - (b.display_order || 999); });
        
        var curIdx = -1;
        for (var i = 0; i < group.length; i++) { if (group[i].id === id) { curIdx = i; break; } }
        if (curIdx === -1) return;
        
        var newIdx = curIdx + (direction === 'up' ? -1 : 1);
        if (newIdx < 0 || newIdx >= group.length) return;
        
        var swapWith = group[newIdx];
        
        try {
            var results = await Promise.all([
                sb.from('categories').update({ display_order: newIdx + 1 }).eq('id', id).select(),
                sb.from('categories').update({ display_order: curIdx + 1 }).eq('id', swapWith.id).select()
            ]);
            var failed = results.some(function(r) { return r.error || !r.data || r.data.length === 0; });
            if (failed) throw new Error('Update failed — RLS');
            
            toast('✅ Moved ' + direction);
            bustGlobalCache();
            await loadData();
            if (type === 'sub') renderSubCategories($('contentArea'));
            else renderCategories($('contentArea'));
        } catch(e) { toast('❌ ' + e.message, 'error'); }
    };
    
    window.renumberAllCategories = async function(type) {
        var cats = type === 'sub' 
            ? allCategories.filter(function(c) { return c.parent_id; })
            : allCategories.filter(function(c) { return !c.parent_id; });
        cats.sort(function(a, b) { return (a.display_order || 999) - (b.display_order || 999); });
        
        if (!confirm('Renumber all ' + cats.length + ' ' + (type === 'sub' ? 'sub-categories' : 'categories') + ' 1,2,3...?')) return;
        
        try {
            var updates = [];
            for (var i = 0; i < cats.length; i++) {
                updates.push(sb.from('categories').update({display_order: i + 1}).eq('id', cats[i].id));
            }
            await Promise.all(updates);
            toast('✅ Renumbered ' + cats.length);
            bustGlobalCache();
            await loadData();
            if (type === 'sub') renderSubCategories($('contentArea'));

    };

    window.handleCatImage = function(input) {
        var file = input.files[0];
        if(!file) return;
        if(file.size > 5 * 1024 * 1024) { toast('Max 5MB', 'error'); input.value = ''; return; }
        
        var p = $('catImgPreview');
        var box = $('catImgBox');
        if(p) p.innerHTML = '<div style="padding:10px;font-size:12px;color:#0B5A31;"><i class="fas fa-spinner fa-spin"></i> Compressing...</div>';
        
        compressImage(file).then(function(compressed) {
            catImageFile = compressed;
            catImageRemoved = false;
            var reader = new FileReader();
            reader.onload = function(e) { 
                if(p) p.innerHTML = '<img src="' + e.target.result + '" class="image-preview show" style="border:2px solid #22C55E; position:relative; z-index:1;">' + 
                '<button type="button" onclick="event.stopPropagation(); removeCatImage()" style="position:absolute; top:5px; right:5px; background:#EF4444; color:white; border:2px solid white; border-radius:50%; width:28px; height:28px; font-weight:bold; cursor:pointer; z-index:10; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 5px rgba(0,0,0,0.3);">✕</button>';
                if(box) box.classList.add('has-image');
            };
            reader.readAsDataURL(compressed);
            toast('✅ New photo selected');
        }).catch(function(err) {
            if(p) p.innerHTML = '';
            toast('❌ Image processing failed', 'error');
        });
        
        input.value = ''; 
    };
    
    window.removeCatImage = function() {
        catImageFile = null;
        catImageRemoved = true;
        var p = $('catImgPreview');
        if(p) p.innerHTML = '';
        var box = $('catImgBox');
        if(box) box.classList.remove('has-image');
        toast('🗑️ Photo removed. Click Save to apply.');
    };
    
    window.saveCategory = async function() {
        var btn = document.querySelector('.modal-container button[onclick="saveCategory()"]');
        if(btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...'; }

        var name = $('catName').value.trim();
        var section = $('catSection').value;
        var type = $('catTypeSelect').value;
        var parentId = type === 'sub' ? ($('catParent')?.value || null) : null;
        var orderInput = parseInt($('catOrder')?.value) || 0;
        
        if(!name || !section) { toast('Fill fields', 'error'); if(btn){btn.disabled=false;btn.innerHTML='💾 Save';} return; }
        if(type === 'sub' && !parentId) { toast('Select parent', 'error'); if(btn){btn.disabled=false;btn.innerHTML='💾 Save';} return; }
        
        var data = { name: name, section: section, parent_id: parentId, is_active: true, display_order: orderInput };
        
        if(catImageFile) {
            var imageUrl = await uploadCompressedImage(catImageFile, 'category-images', 'cat_' + (catEditId || 'new'));
            if(!imageUrl) { if(btn){btn.disabled=false;btn.innerHTML='💾 Save';} return; }
            data.image_url = imageUrl;
        } else if (catImageRemoved) {
            data.image_url = null; 
        }
        
        var siblings = type === 'sub'
            ? allCategories.filter(function(c) { return c.parent_id === parentId && c.id !== catEditId; })
            : allCategories.filter(function(c) { return !c.parent_id && c.id !== catEditId; });
        siblings.sort(function(a, b) { return (a.display_order || 999) - (b.display_order || 999); });
        
        if (orderInput < 1) orderInput = siblings.length + 1;
        if (orderInput > siblings.length + 1) orderInput = siblings.length + 1;
        data.display_order = orderInput;
        
        try {
            var savedId = catEditId;
            if(catEditId) { 
                var r = await sb.from('categories').update(data).eq('id', catEditId).select();
                if(r.error) throw new Error(r.error.message);
            }
            else { 
                var r2 = await sb.from('categories').insert([data]).select();
                if(r2.error) throw new Error(r2.error.message);
                savedId = r2.data[0].id;
            }
            
            var orderedList = [];
            var inserted = false;
            for (var i = 0; i < siblings.length; i++) {
                if (!inserted && (i + 1) === orderInput) {
                    orderedList.push({ id: savedId, display_order: orderInput });
                    inserted = true;
                }
                orderedList.push(siblings[i]);
            }
            if (!inserted) orderedList.push({ id: savedId, display_order: orderInput });
            
            var batchUpdates = [];
            for (var j = 0; j < orderedList.length; j++) {
                var newPos = j + 1;
                var item = orderedList[j];
                if ((item.display_order || 0) !== newPos) {
                    batchUpdates.push(sb.from('categories').update({display_order: newPos}).eq('id', item.id).select());
                }
            }
            if (batchUpdates.length > 0) {
                var results = await Promise.all(batchUpdates);
                var failed = results.filter(function(r) { return r.error || !r.data || r.data.length === 0; }).length;
                if (failed > 0) toast('⚠️ ' + failed + ' order updates failed', 'error');
            }
            
            bustGlobalCache();
            
            // ✅ FIX: Clear Feedback for Type Change
            var oldCat = catEditId ? allCategories.find(function(x){return x.id === catEditId}) : null;
            if(catEditId) {
                if(oldCat && oldCat.parent_id && !parentId) toast('✅ Moved to Main Category!');
                else if(oldCat && !oldCat.parent_id && parentId) toast('✅ Moved to Sub-Category!');
                else toast('✅ Category Updated!');
            } else {
                toast('✅ Category Added!');
            }
            
            closeModal(); 
            await loadData();
            if(type === 'sub') renderSubCategories($('contentArea'));
            else renderCategories($('contentArea'));
        } catch(e) { 
            toast('❌ ' + e.message, 'error'); 
            if(btn){btn.disabled=false;btn.innerHTML='💾 Save';}
        }
    };

    // ✅ FIX: Force Delete Category with moving products to null
    window.deleteCategory = async function(id) { 
        var cat = allCategories.find(function(c) { return c.id === id; });
        if(!cat) { toast('Category not found', 'error'); return; }
        
        var subCats = allCategories.filter(function(c) { return c.parent_id === id; });
        var catIdsToDelete = [id];
        subCats.forEach(function(sc) { catIdsToDelete.push(sc.id); });
        
        var prodsInCat = allProducts.filter(function(p) { return catIdsToDelete.indexOf(p.category_id) !== -1; });
        var shopsInCat = allShops.filter(function(s) { return catIdsToDelete.indexOf(s.category_id) !== -1; });
        
        var msg = 'Delete category "' + cat.name + '"?';
        if(subCats.length > 0) msg += '\n\n⚠️ It has ' + subCats.length + ' sub-categories.';
        if(prodsInCat.length > 0) msg += '\n\n⚠️ It has ' + prodsInCat.length + ' products. They will be moved to Uncategorized.';
        if(shopsInCat.length > 0) msg += '\n\n⚠️ It has ' + shopsInCat.length + ' shops. They will be moved to Uncategorized.';
        
        if(!confirm(msg)) return;
        
        try {
            // 1. Move products to null
            if(prodsInCat.length > 0) {
                await sb.from('products').update({ category_id: null }).in('category_id', catIdsToDelete);
            }
            // 2. Move shops to null
            if(shopsInCat.length > 0) {
                await sb.from('shops').update({ category_id: null }).in('category_id', catIdsToDelete);
            }
            // 3. Delete sub-categories
            if(subCats.length > 0) { 
                for(var i = 0; i < subCats.length; i++) {
                    await sb.from('categories').delete().eq('id', subCats[i].id); 
                }
            }
            // 4. Delete main category
            var delRes = await sb.from('categories').delete().eq('id', id).select();
            if(delRes.error) throw new Error(delRes.error.message);
            
            toast('✅ Category Deleted & Products Uncategorized');
            bustGlobalCache();
            await loadData();
            if(currentSection === 'subcategories') renderSubCategories($('contentArea'));
            else renderCategories($('contentArea'));
        } catch(e) { 
            toast('❌ ' + e.message, 'error'); 
        }
    };

    window.showProductEditModal = async function(id) {
        var p = allProducts.find(function(x) { return x.id === id; });
        if(!p) { toast('Product not found — refresh', 'error'); return; }
        
        editProductExistingImages = [];
        editProductNewBlobs = [];
        editProductRemovedImages = [];
        
        function extractImages(prod) {
            var result = [];
            var rawImages = prod.images;
            if (Array.isArray(rawImages) && rawImages.length > 0) {
                rawImages.forEach(function(img) {
                    if (img && typeof img === 'string' && img.length > 5) result.push(img);
                    else if (img && typeof img === 'object' && img.url) result.push(img.url);
                });
            } else if (typeof rawImages === 'string' && rawImages.length > 2) {
                try {
                    var parsed = JSON.parse(rawImages);
                    if (Array.isArray(parsed)) {
                        parsed.forEach(function(img) {
                            if (img && typeof img === 'string' && img.length > 5) result.push(img);
                            else if (img && typeof img === 'object' && img.url) result.push(img.url);
                        });
                    }
                } catch(e) {
                    if (rawImages.indexOf('http') === 0 || rawImages.indexOf('/') === 0 || rawImages.indexOf('product-images') !== -1) result.push(rawImages);
                }
            }
            if (result.length === 0 && prod.image_url && typeof prod.image_url === 'string' && prod.image_url.length > 5) {
                result.push(prod.image_url);
            }
            if (Array.isArray(prod.variants)) {
                prod.variants.forEach(function(v) {
                    if (v && v.image_url && typeof v.image_url === 'string' && result.indexOf(v.image_url) === -1) result.push(v.image_url);
                });
            }
            if (Array.isArray(prod.colors)) {
                prod.colors.forEach(function(c) {
                    if (c && c.image_url && typeof c.image_url === 'string' && result.indexOf(c.image_url) === -1) result.push(c.image_url);
                });
            }
            return result.filter(function(v, i, arr) { return arr.indexOf(v) === i; });
        }
        
        editProductExistingImages = extractImages(p);
        
        if (editProductExistingImages.length === 0) {
            try {
                var fresh = await sb.from('products').select('images, image_url, variants, colors').eq('id', id).maybeSingle();
                if (fresh && fresh.data) editProductExistingImages = extractImages(fresh.data);
            } catch(e) {}

        html += '<div class="form-row"><div class="form-half"><label class="form-label">Stock</label><input type="number" id="editProdStock" class="form-control" value="' + (p.stock || 0) + '"></div>';
        html += '<div class="form-half"><label class="form-label">Category</label><select id="editProdCat" class="form-control">';
        allCategories.forEach(function(cat) { html += '<option value="' + cat.id + '"' + (p.category_id === cat.id ? ' selected' : '') + '>' + esc(cat.name) + '</option>'; });
        html += '</select></div></div>';
        
        html += '<div class="form-group" style="margin-top:16px;background:#F0FDF4;border:2px solid #86EFAC;border-radius:12px;padding:14px;">';
        html += '<label class="form-label" style="color:#065F46;font-size:13px;font-weight:700;">📸 Product Photos (<span id="editProdImgCount">' + editProductExistingImages.length + '</span>)</label>';
        html += '<div class="prod-edit-img-grid" id="editProdImgGrid"></div>';
        html += '<input type="file" id="editProdNewImages" accept="image/*" multiple style="display:none" onchange="handleEditProdImages(this)">';
        html += '<button type="button" style="width:100%;padding:14px;margin-top:10px;background:var(--brand-green);color:white;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;" onclick="document.getElementById(\'editProdNewImages\').click()">📸 Upload New Photos</button>';

    window.removeEditProdImage = function(index) {

    window.handleEditProdImages = async function(input) {
        var files = input.files;
        if(!files || files.length === 0) return;
        var limitedCount = Math.min(files.length, 4);
        var promises = [];
        for(var i = 0; i < limitedCount; i++) promises.push(compressImage(files[i]));
        try {
            var compressed = await Promise.all(promises);
            for(var j = 0; j < compressed.length; j++) editProductNewBlobs.push(compressed[j]);
            var preview = $('editProdNewPreview');
            if(preview) {
                preview.innerHTML = '';
                for(var k = 0; k < editProductNewBlobs.length; k++) {
                    var sizeKB = Math.round(editProductNewBlobs[k].size / 1024);
                    var color = sizeKB >= 80 && sizeKB <= 90 ? '#059669' : '#D97706';
                    preview.innerHTML += '<div style="text-align:center;"><img src="' + URL.createObjectURL(editProductNewBlobs[k]) + '" style="width:70px;height:70px;object-fit:cover;border-radius:8px;border:2px solid ' + color + ';"><div style="font-size:9px;color:' + color + ';font-weight:600;margin-top:2px;">' + sizeKB + ' KB</div></div>';
                }
            }
            toast('📸 ' + compressed.length + ' new photo(s) ready');
            input.value = '';
        } catch(e) { toast('❌ Image processing failed', 'error'); }
    };
    
    window.toggleEditOfferFields = function() {

    window.saveProductEdit = async function(id) {
        var btn = document.querySelector('.modal-container button[onclick^="saveProductEdit"]');
        if(btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...'; }

        var name = $('editProdName').value.trim();
        var price = parseFloat($('editProdPrice').value) || 0;
        var offer = parseFloat($('editProdOffer').value) || null;
        var stock = parseInt($('editProdStock').value) || 0;
        var catId = $('editProdCat').value;
        var isFeatured = $('editProdFeatured').checked;
        var isOnHold = $('editProdHold').checked;
        var isOffer = $('editProdOfferCheck') ? $('editProdOfferCheck').checked : false;
        var offerTag = isOffer && $('editProdOfferTag') ? $('editProdOfferTag').value.trim() : null;
        
        try {
            var newImageUrls = [];
            if (editProductNewBlobs.length > 0) {
                var uploadPromises = [];
                for (var i = 0; i < editProductNewBlobs.length; i++) uploadPromises.push(uploadCompressedImage(editProductNewBlobs[i], 'product-images', 'prod_' + id + '_' + i + '_' + Date.now()));
                var uploaded = await Promise.all(uploadPromises);
                for (var j = 0; j < uploaded.length; j++) if (uploaded[j]) newImageUrls.push(uploaded[j]);
            }
            
            var finalImages = editProductExistingImages.concat(newImageUrls);
            
            var updateData = {
                name: name, price: price, offer_price: offer, stock: stock, category_id: catId,
                is_featured: isFeatured, is_on_hold: isOnHold, is_offer: isOffer, offer_tag: offerTag,
                images: finalImages,
                image_url: finalImages[0] || null
            };
            
            var updateRes = await sb.from('products').update(updateData).eq('id', id).select();
            if (updateRes.error) throw new Error(updateRes.error.message);
            if (!updateRes.data || updateRes.data.length === 0) throw new Error('Update failed — RLS');
            
            for (var k = 0; k < editProductRemovedImages.length; k++) {
                try {
                    var url = editProductRemovedImages[k];
                    if (url && url.indexOf('product-images/') !== -1) {
                        var path = url.split('product-images/')[1];
                        await sb.storage.from('product-images').remove([path]);
                    }
                } catch(e) {}
            }
            
            bustGlobalCache(); // ✅ FIX: Cache clear for product changes
            
            toast('✅ Product updated!');
            closeModal();
            editProductExistingImages = []; editProductNewBlobs = []; editProductRemovedImages = [];
            await loadData();
            renderProducts($('contentArea'));
        } catch(e) { 
            toast('❌ ' + e.message, 'error'); 
            if(btn){btn.disabled=false;btn.innerHTML='💾 Save Changes';}
        }
    };

    window.saveComboOffer = async function(id) {

        if(btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...'; }

        var title = ($('comboTitle')?.value || '').trim();
        var desc = ($('comboDesc')?.value || '').trim();
        var price = parseFloat($('comboPrice')?.value) || 0;
        var originalPrice = parseFloat($('comboOriginalPrice')?.value) || null;
        var order = parseInt($('comboOrder')?.value) || 0;
        var isActive = $('comboActive')?.checked || false;
        
        if (!title || price < 1) { toast('⚠️ Fill title and price', 'error'); if(btn){btn.disabled=false;btn.innerHTML='💾 Save Combo Offer';} return; }
        
        var selectedProducts = [];
        document.querySelectorAll('.comboProdCheck:checked').forEach(function(cb) { selectedProducts.push(cb.value); });
        if (selectedProducts.length === 0) { toast('⚠️ Select at least 1 product', 'error'); if(btn){btn.disabled=false;btn.innerHTML='💾 Save Combo Offer';} return; }
        
        var imageUrl = '';
        if (window._comboImageFile) {
            imageUrl = await uploadCompressedImage(window._comboImageFile, 'product-images', 'combo_' + (id || 'new'));
            if (!imageUrl) { if(btn){btn.disabled=false;btn.innerHTML='💾 Save Combo Offer';} return; }
        }
        
        var data = {
            title: title,
            description: desc || null,
            offer_price: price,
            original_price: originalPrice,
            product_ids: selectedProducts,
            display_order: order,
            is_active: isActive
        };
        if (imageUrl) data.image_url = imageUrl;
        
        try {
            if (id) {
                var r = await sb.from('combo_offers').update(data).eq('id', id).select();
                if (r.error) throw new Error(r.error.message);
                toast('✅ Combo updated!');
            } else {
                var r2 = await sb.from('combo_offers').insert([data]).select();
                if (r2.error) throw new Error(r2.error.message);
                toast('✅ Combo created!');
            }
            bustGlobalCache();
            closeModal();
            window._comboImageFile = null;
            await renderComboOffers($('contentArea'));

            toast('❌ ' + e.message, 'error'); 
            if(btn){btn.disabled=false;btn.innerHTML='💾 Save Combo Offer';}
        }
    };

    window.sendNotification = async function() {
        var title = ($('notifTitle')?.value || '').trim();
        var message = ($('notifMessage')?.value || '').trim();
        var linkUrl = ($('notifLink')?.value || '').trim();
        if (!title || !message) { toast('⚠️ Fill title and message', 'error'); return; }
        var btn = document.querySelector('.btn-primary[onclick="sendNotification()"]');
        if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...'; }
        try {
            var notifData = { title: title, message: message, created_at: new Date().toISOString(), is_global: true };
            if (linkUrl) notifData.link_url = linkUrl;
            await sb.from('notifications').insert([notifData]);
            var sessionRes = await sb.auth.getSession();
            var token = (sessionRes && sessionRes.data && sessionRes.data.session && sessionRes.data.session.access_token) ? sessionRes.data.session.access_token : CONFIG.SUPABASE_KEY;
            await fetch(CONFIG.SUPABASE_URL + '/functions/v1/send-notification', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'apikey': CONFIG.SUPABASE_KEY, 'Authorization': 'Bearer ' + token},
                body: JSON.stringify({title: title, message: message, link_url: linkUrl || '', send_type: 'all', user_ids: []})
            });
            toast('✅ Sent!');
            if ($('notifTitle')) $('notifTitle').value = '';
            if ($('notifMessage')) $('notifMessage').value = '';
            if ($('notifLink')) $('notifLink').value = '';
            await loadData();
            renderNotifications($('contentArea'));
        } catch(e) { toast('❌ ' + (e.message || 'Failed'), 'error'); if (btn) { btn.disabled = false; btn.innerHTML = '📨 Send to All Users'; } }
    };

                showLogin();
                showApp();
                return;

            if (res.data.session.user.email === 'sk12shaikh@gmail.com') {
                currentAdmin = res.data.session.user;
                await loadData();

                showApp();
                return;
            }
            
            var prof = await safeFetch(function() { return sb.from('users').select('role').eq('email', res.data.session.user.email).maybeSingle(); });
