<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Set Location - ZyMart+</title>
    <meta name="theme-color" content="#0B5A31">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --green: #0B5A31; --orange: #F59E0B; --danger: #EF4444; --success: #10B981;
            --status-bar-height: env(safe-area-inset-top, 0px);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0B5A31; min-height: 100vh; color: white; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .container { display: flex; flex-direction: column; min-height: 100vh; }
        .top-bar { padding: 12px 16px; padding-top: calc(12px + var(--status-bar-height)); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
        .back-btn { width: 36px; height: 36px; background: rgba(255,255,255,0.12); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 14px; text-decoration: none; }
        .back-btn:active { background: rgba(255,255,255,0.25); transform: scale(0.93); }
        .top-title { flex: 1; font-size: 14px; font-weight: 600; opacity: 0.9; }
        .cart-icon-btn { width: 36px; height: 36px; background: rgba(255,255,255,0.12); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 14px; position: relative; text-decoration: none; }
        .cart-badge { position: absolute; top: -5px; right: -5px; background: var(--orange); color: white; border-radius: 50%; width: 17px; height: 17px; font-size: 8px; display: none; align-items: center; justify-content: center; border: 2px solid var(--green); font-weight: 700; }
        .cart-badge.show { display: flex; }
        .top-section { padding: 20px 24px 16px; text-align: center; flex-shrink: 0; }
        .logo { font-family: 'Poppins', sans-serif; font-size: 36px; font-weight: 700; }
        .logo-zy { color: #A3E635; } .logo-mart { color: #FDE047; }
        .title { font-size: 20px; font-weight: 700; margin-top: 12px; }
        .subtitle { font-size: 12px; opacity: 0.85; margin-top: 4px; line-height: 1.5; }
        .map-section { flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 10px 0 16px; }
        .map-container { position: relative; width: 110px; height: 110px; }
        .pin { position: absolute; top: 50%; left: 50%; width: 36px; height: 36px; background: #F59E0B; border-radius: 50% 50% 50% 0; transform: translate(-50%, -50%) rotate(-45deg); animation: bounce 2s infinite; z-index: 3; }
        .pin::after { content: ''; position: absolute; top: 50%; left: 50%; width: 12px; height: 12px; background: white; border-radius: 50%; transform: translate(-50%, -50%) rotate(45deg); }
        .pulse { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 50%; border: 2px solid rgba(245,158,11,0.3); animation: pulseAnim 2s ease-out infinite; }
        .pulse:nth-child(2) { width: 55px; height: 55px; }
        .pulse:nth-child(3) { width: 90px; height: 90px; animation-delay: 0.6s; }
        @keyframes bounce { 0%,100% { transform: translate(-50%,-50%) rotate(-45deg) translateY(0); } 50% { transform: translate(-50%,-50%) rotate(-45deg) translateY(-8px); } }
        @keyframes pulseAnim { 0% { transform: translate(-50%,-50%) scale(0.4); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.3); opacity: 0; } }
        .bottom-card { background: white; border-radius: 24px 24px 0 0; padding: 20px 20px calc(30px + env(safe-area-inset-bottom, 0px)); color: #1A1A1A; flex-shrink: 0; box-shadow: 0 -5px 30px rgba(0,0,0,0.1); }
        .option-card { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; cursor: pointer; margin-bottom: 10px; border: 1.5px solid #E5E7EB; background: #F9FAFB; transition: all 0.15s ease; }
        .option-card:active { background: #EDF7F1; border-color: #0B5A31; transform: scale(0.98); }
        .option-card.gps { background: #EDF7F1; border-color: #0B5A31; }
        .option-icon { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .option-icon.green { background: #EDF7F1; color: #0B5A31; }
        .option-icon.amber { background: #FFF8EB; color: #F59E0B; }
        .option-info { flex: 1; }
        .option-title { font-size: 13px; font-weight: 600; }
        .option-desc { font-size: 10px; color: #6B7280; margin-top: 1px; }
        .option-arrow { color: #9CA3AF; font-size: 12px; }
        .status-box { display: none; align-items: center; gap: 10px; padding: 12px 14px; background: #F9FAFB; border-radius: 12px; margin-bottom: 12px; }
        .status-box.show { display: flex; }
        .status-box.success { background: #D1FAE5; border: 1.5px solid #10B981; }
        .status-box.error { background: #FEF2F2; border: 1.5px solid #EF4444; }
        .status-box.warning { background: #FFF8EB; border: 1.5px solid #F59E0B; }
        .status-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
        .status-icon.detecting { background: #FFF8EB; color: #F59E0B; }
        .status-icon.success { background: #D1FAE5; color: #10B981; }
        .status-icon.error { background: #FEF2F2; color: #EF4444; }
        .status-title { font-size: 12px; font-weight: 600; }
        .status-detail { font-size: 10px; color: #6B7280; }
        .btn { width: 100%; padding: 14px; border-radius: 14px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; font-family: 'Inter', sans-serif; margin-bottom: 8px; display: none; align-items: center; justify-content: center; gap: 8px; }
        .btn:active { transform: scale(0.97); }
        .btn-settings { background: #F59E0B; color: #1A1A1A; }
        .btn-retry { background: #0B5A31; color: white; }
        .pincode-section { display: none; margin-top: 4px; }
        .pincode-section.show { display: block; }
        .pincode-input-group { display: flex; gap: 8px; margin-bottom: 8px; }
        .pincode-input { flex: 1; padding: 12px 14px; border: 1.5px solid #E5E7EB; border-radius: 12px; font-size: 14px; font-family: 'Inter', sans-serif; outline: none; }
        .pincode-input:focus { border-color: #0B5A31; }
        .pincode-submit { background: #0B5A31; color: white; border: none; padding: 12px 18px; border-radius: 12px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px; white-space: nowrap; }
        .service-info { font-size: 10px; color: #9CA3AF; text-align: center; margin-top: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="netBanner" style="display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);background:#DC2626;color:white;text-align:center;padding:6px 16px;border-radius:20px;font-size:11px;font-weight:700;z-index:99999;box-shadow:0 4px 12px rgba(220,38,38,0.4);white-space:nowrap;pointer-events:none;">📴 No Internet</div>

<div class="container">
    <div class="top-bar">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <span class="top-title">Set Location</span>
        <a href="cart.html" class="cart-icon-btn">
            <i class="fas fa-shopping-cart"></i>
            <span class="cart-badge" id="cartBadge">0</span>
        </a>
    </div>
    
    <div class="top-section">
        <div class="logo"><span class="logo-zy">Zy</span><span class="logo-mart">Mart</span></div>
        <div class="title">📍 Set Your Location</div>
        <div class="subtitle">Location is required to show products available in your area.</div>
    </div>
    
    <div class="map-section">
        <div class="map-container">
            <div class="pulse"></div>
            <div class="pulse"></div>
            <div class="pin"></div>
        </div>
    </div>
    
    <div class="bottom-card">
        <div class="status-box" id="statusBox">
            <div class="status-icon" id="statusIcon">📍</div>
            <div>
                <div class="status-title" id="statusTitle"></div>
                <div class="status-detail" id="statusDetail"></div>
            </div>
        </div>
        
        <div class="option-card gps" id="gpsOption" onclick="startGPSDetection()">
            <div class="option-icon green"><i class="fas fa-map-marker-alt"></i></div>
            <div class="option-info">
                <div class="option-title">📍 Use Current Location</div>
                <div class="option-desc">Auto-detect via GPS (Recommended)</div>
            </div>
            <div class="option-arrow"><i class="fas fa-chevron-right"></i></div>
        </div>
        
        <div class="option-card" id="pincodeOption" onclick="showPincodeInput()">
            <div class="option-icon amber"><i class="fas fa-hashtag"></i></div>
            <div class="option-info">
                <div class="option-title">📝 Enter Pincode</div>
                <div class="option-desc">Manually enter your area pincode</div>
            </div>
            <div class="option-arrow"><i class="fas fa-chevron-right"></i></div>
        </div>
        
        <div class="pincode-section" id="pincodeSection">
            <div class="pincode-input-group">
                <input type="text" class="pincode-input" id="pincodeInput" placeholder="Enter 6-digit pincode" maxlength="6" inputmode="numeric">
                <button class="pincode-submit" onclick="submitPincode()">Find →</button>
            </div>
        </div>
        
        <button class="btn btn-settings" id="settingsBtn" onclick="openSettings()">⚙️ Open GPS Settings</button>
        <button class="btn btn-retry" id="retryBtn" onclick="startGPSDetection()">🔄 Try Again</button>
        
        <p class="service-info">💡 Location is required to see products near you</p>
    </div>
</div>

<script>
(function() {
    'use strict';
    
    var gpsInProgress = false;
    var gpsTimeoutId = null;
    var warningTimeoutId = null;
    var LOCATION_FRESH_MS = 7 * 24 * 60 * 60 * 1000;
    
    function $(id) { return document.getElementById(id); }
    function isAndroidApp() { return !!(window.Android && typeof window.Android.requestLocation === 'function'); }
    
    window.addEventListener('offline', function() { var b = $('netBanner'); if (b) b.style.display = 'block'; });
    window.addEventListener('online', function() { var b = $('netBanner'); if (b) b.style.display = 'none'; });
    
    function updateCartBadge() {
        try {
            var cart = JSON.parse(localStorage.getItem('zymart_cart') || '[]');
            var totalItems = cart.reduce(function(sum, item) { return sum + (item.quantity || 1); }, 0);
            var badge = $('cartBadge');
            if (badge) { badge.textContent = totalItems; if (totalItems > 0) badge.classList.add('show'); else badge.classList.remove('show'); }
        } catch(e) {}
    }
    
    function updateStatus(type, title, detail) {
        var box = $('statusBox'), icon = $('statusIcon');
        box.className = 'status-box show';
        icon.className = 'status-icon';
        if (type === 'detecting') { icon.classList.add('detecting'); icon.innerHTML = '<i class="fas fa-satellite"></i>'; }
        else if (type === 'success') { box.classList.add('success'); icon.classList.add('success'); icon.innerHTML = '<i class="fas fa-check"></i>'; }
        else if (type === 'error') { box.classList.add('error'); icon.classList.add('error'); icon.innerHTML = '<i class="fas fa-times"></i>'; }
        else if (type === 'warning') { box.classList.add('warning'); icon.classList.add('detecting'); icon.innerHTML = '<i class="fas fa-exclamation"></i>'; }
        $('statusTitle').textContent = title;
        $('statusDetail').textContent = detail || '';
    }
    
    function hideOptions() { document.querySelectorAll('.option-card').forEach(function(c) { c.style.display = 'none'; }); }
    function showOptions() { document.querySelectorAll('.option-card').forEach(function(c) { c.style.display = 'flex'; }); }
    function hideButtons() { $('settingsBtn').style.display = 'none'; $('retryBtn').style.display = 'none'; }
    function clearTimeouts() {
        if (gpsTimeoutId) { clearTimeout(gpsTimeoutId); gpsTimeoutId = null; }
        if (warningTimeoutId) { clearTimeout(warningTimeoutId); warningTimeoutId = null; }
    }
    
    window.startGPSDetection = function() {
        if (gpsInProgress) return;
        gpsInProgress = true;
        updateStatus('detecting', 'Detecting your location...', 'Please wait');
        hideOptions();
        hideButtons();
        clearTimeouts();
        
        warningTimeoutId = setTimeout(function() {
            if (gpsInProgress) updateStatus('warning', 'Taking longer than usual...', 'GPS signal weak. Please wait');
        }, 10000);
        
        gpsTimeoutId = setTimeout(function() {
            if (gpsInProgress) {
                gpsInProgress = false;
                showOptions();
                updateStatus('error', 'GPS timeout', 'Taking too long. Try again or use pincode');
                $('retryBtn').style.display = 'flex';
                $('settingsBtn').style.display = 'flex';
            }
        }, 20000);
        
        // ✅ ANDROID APP FLOW
        if (isAndroidApp()) {
            try {
                window.Android.requestLocation();
            } catch(e) {
                clearTimeouts();
                gpsInProgress = false;
                showOptions();
                updateStatus('error', 'GPS bridge error', 'Please try pincode option');
                $('retryBtn').style.display = 'flex';
            }
            return;
        }
        
        // ✅ WEB BROWSER FLOW
        if (!navigator.geolocation) {
            clearTimeouts();
            gpsInProgress = false;
            showOptions();
            updateStatus('error', 'GPS not supported', 'Please use pincode option');
            return;
        }
        
        navigator.geolocation.getCurrentPosition(
            function(pos) {
                clearTimeouts();
                gpsInProgress = false;
                handleSuccess(pos.coords.latitude, pos.coords.longitude);
            },
            function(err) {
                clearTimeouts();
                gpsInProgress = false;
                showOptions();
                if (err.code === 1) {
                    updateStatus('error', 'Location permission denied', 'Please allow location access in browser settings');
                    $('retryBtn').style.display = 'flex';
                } else if (err.code === 2) {
                    updateStatus('error', 'GPS is off', 'Please enable GPS');
                    $('settingsBtn').style.display = 'flex';
                    $('retryBtn').style.display = 'flex';
                } else {
                    updateStatus('error', 'Could not get location', 'Try again or use pincode');
                    $('retryBtn').style.display = 'flex';
                }
            },
            { timeout: 15000, maximumAge: 0, enableHighAccuracy: false }
        );
    };
    
    window.setLocationFromAndroid = function(lat, lng) {
        clearTimeouts();
        gpsInProgress = false;
        handleSuccess(parseFloat(lat), parseFloat(lng));
    };
    
    window.onLocationError = function(msg) {
        clearTimeouts();
        gpsInProgress = false;
        showOptions();
        if (msg === 'GPS_DISABLED' || msg === 'LOCATION_OFF') {
            updateStatus('error', 'GPS is off', 'Please enable GPS in phone settings');
            $('settingsBtn').style.display = 'flex';
            $('retryBtn').style.display = 'flex';
        } else if (msg === 'PERMISSION_DENIED' || msg === 'DENIED') {
            updateStatus('error', 'Permission denied', 'Allow from app settings or use pincode');
            $('retryBtn').style.display = 'flex';
        } else {
            updateStatus('error', 'Could not detect location', 'Try again or use pincode');
            $('retryBtn').style.display = 'flex';
        }
    };
    
    async function handleSuccess(lat, lng) {
        updateStatus('detecting', 'Location found!', 'Saving...');
        
        try {
            localStorage.setItem('user_lat', String(lat));
            localStorage.setItem('user_lng', String(lng));
            localStorage.setItem('location_timestamp', String(Date.now()));
        } catch(e) {}
        
        var geo = await reverseGeocode(lat, lng);
        
        if (geo) {
            if (geo.pincode) try { localStorage.setItem('user_pincode', geo.pincode); } catch(e) {}
            if (geo.city) {
                try {
                    localStorage.setItem('location_short', geo.city);
                    localStorage.setItem('user_city', geo.city);
                } catch(e) {}
            }
        }
        
        var locationName = (geo && geo.city) ? geo.city : 'Your Location';
        updateStatus('success', '✅ ' + locationName, 'Redirecting...');
        setTimeout(goHome, 800);
    }
    
    async function reverseGeocode(lat, lng) {
        var cacheKey = 'zm_rev_' + lat.toFixed(2) + '_' + lng.toFixed(2);
        try {
            var cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
            if (cached && (Date.now() - cached.ts) < LOCATION_FRESH_MS) return cached.data;
        } catch(e) {}
        
        try {
            var c = new AbortController();
            var t = setTimeout(function() { c.abort(); }, 6000);
            var r = await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + lat + '&longitude=' + lng + '&localityLanguage=en', { signal: c.signal });
            clearTimeout(t);
            var d = await r.json();
            var result = { city: d.city || d.locality || '', pincode: d.postcode || '' };
            try { localStorage.setItem(cacheKey, JSON.stringify({ data: result, ts: Date.now() })); } catch(e) {}
            return result;
        } catch(e) { return null; }
    }
    
    window.showPincodeInput = function() {
        var s = $('pincodeSection');
        if (s.classList.contains('show')) s.classList.remove('show');
        else {
            s.classList.add('show');
            setTimeout(function() { var inp = $('pincodeInput'); if (inp) inp.focus(); }, 200);
        }
    };
    
    window.submitPincode = async function() {
        var pc = ($('pincodeInput').value || '').trim();
        if (!pc || pc.length !== 6 || !/^\d{6}$/.test(pc)) {
            updateStatus('error', 'Invalid pincode', 'Please enter 6 digits');
            return;
        }
        updateStatus('detecting', 'Looking up pincode...', 'Please wait');
        
        var coords = await geocodePincode(pc);
        if (!coords) {
            updateStatus('error', 'Pincode not found', 'Try GPS or check pincode');
            return;
        }
        
        try {
            localStorage.setItem('user_lat', String(coords.lat));
            localStorage.setItem('user_lng', String(coords.lng));
            localStorage.setItem('user_pincode', pc);
            localStorage.setItem('location_timestamp', String(Date.now()));
        } catch(e) {}
        
        var geo = await reverseGeocode(coords.lat, coords.lng);
        if (geo && geo.city) {
            try { localStorage.setItem('location_short', geo.city); } catch(e) {}
        }
        
        updateStatus('success', '✅ Pincode ' + pc, 'Redirecting...');
        hideOptions();
        $('pincodeSection').classList.remove('show');
        setTimeout(goHome, 800);
    };
    
    async function geocodePincode(pincode) {
        var cacheKey = 'zm_pc_' + pincode;
        try {
            var cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
            if (cached && (Date.now() - cached.ts) < LOCATION_FRESH_MS) return { lat: cached.lat, lng: cached.lng };
        } catch(e) {}
        
        try {
            var c = new AbortController();
            var t = setTimeout(function() { c.abort(); }, 8000);
            var r = await fetch('https://nominatim.openstreetmap.org/search?postalcode=' + encodeURIComponent(pincode) + '&country=India&format=json&limit=1', {
                headers: { 'User-Agent': 'ZyMartApp/2.0' }, signal: c.signal
            });
            clearTimeout(t);
            var d = await r.json();
            if (d && d.length > 0) {
                var result = { lat: parseFloat(d[0].lat), lng: parseFloat(d[0].lon) };
                try { localStorage.setItem(cacheKey, JSON.stringify({ lat: result.lat, lng: result.lng, ts: Date.now() })); } catch(e) {}
                return result;
            }
        } catch(e) { console.warn('[Geocode] Error:', e); }
        return null;
    }
    
    window.openSettings = function() {
        if (isAndroidApp() && typeof window.Android.openLocationSettings === 'function') {
            try { window.Android.openLocationSettings(); } catch(e) {}
        } else {
            updateStatus('warning', 'Enable GPS', 'Settings → Location → Turn ON');
        }
    };
    
    function goHome() { window.location.href = 'index.html'; }
    
    document.addEventListener('DOMContentLoaded', function() {
        if (!navigator.onLine) { var nb = $('netBanner'); if (nb) nb.style.display = 'block'; }
        updateCartBadge();
        
        // Auto-start GPS on load (Blinkit-style)
        setTimeout(startGPSDetection, 500);
    });
    
    window.addEventListener('storage', function(e) {
        if (e.key === 'zymart_cart') updateCartBadge();
    });
})();
</script>
</body>
</html>
