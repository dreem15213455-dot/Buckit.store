<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Wishlist - ZyMart</title>
    <meta name="theme-color" content="#0B5A31">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --brand-green: #0B5A31; --brand-orange: #F59E0B; --neutral-white: #FFFFFF; --neutral-bg: #F9FAFB; --neutral-border: #E5E7EB; --neutral-gray: #6B7280; --neutral-dark: #1A1A1A; --danger: #EF4444; --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); --shadow-sm: 0 1px 4px rgba(0,0,0,0.06); --shadow-md: 0 4px 16px rgba(0,0,0,0.08); --radius-sm: 10px; --radius-md: 14px; --radius-lg: 18px; --radius-full: 9999px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter',-apple-system,sans-serif; background: var(--neutral-bg); color: var(--neutral-dark); padding-bottom: 90px; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; min-height: 100vh; }
        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(50px); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .top-bar { background: var(--brand-green); position: fixed; top: 0; left: 0; width: 100%; z-index: 100; padding: 10px 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 16px rgba(11,90,49,0.3); }
        .back-btn { width: 40px; height: 40px; background: rgba(255,255,255,0.10); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 15px; text-decoration: none; }
        .top-title { font-family: 'Poppins',sans-serif; flex: 1; font-size: 16px; font-weight: 700; color: white; }
        .brand-zy { color: #A3E635; } .brand-mart { color: #FDE047; }
        .top-count { font-size: 11px; color: white; background: rgba(255,255,255,0.12); padding: 5px 12px; border-radius: var(--radius-full); }
        .main-content { padding-top: 62px; max-width: 600px; margin: 0 auto; }
        
        .wishlist-items { padding: 12px 14px; }
        .wishlist-item { background: white; border-radius: var(--radius-lg); padding: 14px; margin-bottom: 9px; display: flex; gap: 12px; align-items: center; border: 1px solid var(--neutral-border); box-shadow: var(--shadow-xs); animation: slideUp 0.3s ease forwards; position: relative; }
        .wishlist-item.removing { animation: fadeOut 0.25s ease forwards; }
        .item-image { width: 72px; height: 72px; border-radius: var(--radius-sm); background: var(--neutral-bg); display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; flex-shrink: 0; }
        .item-image img { width: 100%; height: 100%; object-fit: cover; }
        .item-details { flex: 1; min-width: 0; cursor: pointer; }
        .item-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-price { font-size: 17px; font-weight: 700; }
        .item-price-cut { font-size: 12px; color: var(--neutral-gray); text-decoration: line-through; margin-left: 4px; }
        .item-discount-badge { font-size: 9px; font-weight: 700; color: white; background: var(--brand-orange); padding: 2px 7px; border-radius: var(--radius-full); margin-left: 4px; }
        
        .move-cart-btn { background: var(--brand-green); color: white; border: none; padding: 10px 18px; border-radius: var(--radius-full); font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'Inter',sans-serif; flex-shrink: 0; }
        .move-cart-btn:active { background: #083D21; }
        .remove-btn { position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; background: #FEF2F2; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: #EF4444; font-size: 10px; }
        .remove-btn:active { background: #FEE2E2; }
        
        .empty-state { text-align: center; padding: 70px 30px; }
        .empty-icon { width: 80px; height: 80px; background: #F3F5F4; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
        .empty-icon i { font-size: 34px; color: #D1D5DB; }
        .empty-state h3 { font-family: 'Poppins',sans-serif; font-size: 17px; font-weight: 700; }
        .empty-state p { font-size: 13px; color: var(--neutral-gray); margin-bottom: 16px; }
        .browse-btn { background: var(--brand-green); color: white; border: none; padding: 12px 26px; border-radius: var(--radius-full); font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Inter',sans-serif; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; }
        
        .bottom-nav { background: white; position: fixed; bottom: 0; left: 0; width: 100%; display: flex; justify-content: space-around; padding: 5px 12px 10px; box-shadow: 0 -4px 16px rgba(0,0,0,0.03); z-index: 100; border-top: 1px solid var(--neutral-border); }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 9px; font-weight: 500; color: var(--neutral-gray); cursor: pointer; padding: 3px 10px; border-radius: var(--radius-full); border: none; background: transparent; font-family: 'Inter',sans-serif; text-decoration: none; }
        .nav-item.active { color: var(--brand-green); font-weight: 600; }
        .nav-item i { font-size: 18px; margin-bottom: 1px; }
        
        .toast { position: fixed; bottom: 95px; left: 50%; transform: translateX(-50%); background: var(--neutral-dark); color: white; padding: 10px 20px; border-radius: var(--radius-full); font-size: 11px; z-index: 200; opacity: 0; visibility: hidden; white-space: nowrap; box-shadow: var(--shadow-md); transition: all 0.3s ease; }
        .toast.show { opacity: 1; visibility: visible; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="top-bar">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <span class="top-title"><span class="brand-zy">Zy</span><span class="brand-mart">Mart</span> Wishlist</span>
    <span class="top-count" id="wishlistCount">0 items</span>
</div>

<div class="main-content" id="mainContent"><div style="text-align:center;padding:60px;"><div style="width:34px;height:34px;border:2.5px solid #E5E7EB;border-top-color:#F59E0B;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 12px;"></div></div></div>

<nav class="bottom-nav">
    <a class="nav-item" href="index.html"><i class="fas fa-home"></i><span>Home</span></a>
    <a class="nav-item" href="more.html"><i class="fas fa-ellipsis-h"></i><span>More</span></a>
    <a class="nav-item" href="cart.html"><i class="fas fa-shopping-cart"></i><span>Cart</span></a>
    <a class="nav-item" href="orders.html"><i class="fas fa-receipt"></i><span>Orders</span></a>
    <a class="nav-item active" href="wishlist.html"><i class="fas fa-heart"></i><span>Wishlist</span></a>
</nav>

<div class="toast" id="toastMsg"></div>

<script>
(function() {
    'use strict';
    window.addEventListener('error', function(e) { console.error('[Wishlist]', e.message); });
    
    var wishlist = [];
    
    function getEl(id) { return document.getElementById(id); }
    function safeJSON(s,f) { try { return s?JSON.parse(s):f; } catch(e) { return f; } }
    function esc(s) { if(!s)return''; var d=document.createElement('div');d.textContent=s;return d.innerHTML; }
    function showToast(m) { var t=getEl('toastMsg'); if(!t)return; t.textContent=m; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},2500); }
    
    // 🔥 FIXED: zymart_wishlist
    function loadWishlist() { 
        wishlist = safeJSON(localStorage.getItem('zymart_wishlist'), []); 
        wishlist = wishlist.map(function(item){
            return typeof item === 'string' ? { id: item, name: 'Product', price: 0, image: '', added_at: new Date().toISOString() } : item;
        }).filter(function(item){ return item && item.id; }); 
        return wishlist; 
    }
    function saveWishlist() { try { localStorage.setItem('zymart_wishlist', JSON.stringify(wishlist)); } catch(e) {} }
    function updateCount() { var el = getEl('wishlistCount'); if (el) el.textContent = wishlist.length + ' items'; }
    
    window.moveToCart = function(i) { 
        if (i < 0 || i >= wishlist.length) return; 
        var item = wishlist[i]; 
        var cart = safeJSON(localStorage.getItem('zymart_cart'), []); 
        var found = cart.find(function(c) { return c.id === item.id; }); 
        if (found) found.quantity += 1; 
        else cart.push({ id: item.id, name: item.name, price: item.price || 0, image: item.image || '', quantity: 1, unit: item.unit || 'piece' }); 
        try { localStorage.setItem('zymart_cart', JSON.stringify(cart)); } catch(e) {} 
        showToast('🛒 Added to cart!'); 
    };
    
    window.removeItem = function(i) { 
        if (i < 0 || i >= wishlist.length) return; 
        var el = document.querySelector('#wishlistItem' + i); 
        if (el) { 
            el.classList.add('removing'); 
            setTimeout(function() { wishlist.splice(i,1); saveWishlist(); renderWishlist(); showToast('❤️ Removed'); }, 250); 
        } else { wishlist.splice(i,1); saveWishlist(); renderWishlist(); } 
    };
    
    function renderWishlist() { 
        loadWishlist(); 
        var c = getEl('mainContent'); 
        if (!wishlist.length) { 
            c.innerHTML = '<div class="empty-state"><div class="empty-icon"><i class="far fa-heart"></i></div><h3>Wishlist is Empty</h3><p>Save your favorite items here</p><a href="products.html" class="browse-btn"><i class="fas fa-shopping-bag"></i> Browse Products</a></div>'; 
            updateCount(); 
            return; 
        } 
        var h = '<div class="wishlist-items">'; 
        for (var i = 0; i < wishlist.length; i++) { 
            var item = wishlist[i], img = item.image || '', name = esc(item.name || 'Product'), price = Number(item.price || 0), op = Number(item.originalPrice || item.price || 0), dp = op > price ? Math.round((1 - price / op) * 100) : 0; 
            h += '<div class="wishlist-item" id="wishlistItem' + i + '"><button class="remove-btn" onclick="removeItem(' + i + ')">✕</button><div class="item-image" onclick="window.location.href=\'product-detail.html?id=' + item.id + '\'">' + (img ? '<img src="' + img + '" loading="lazy">' : '<i class="fas fa-box-open"></i>') + '</div><div class="item-details" onclick="window.location.href=\'product-detail.html?id=' + item.id + '\'"><div class="item-name">' + name + '</div><div><span class="item-price">₹' + price.toLocaleString('en-IN') + '</span>' + (dp > 0 ? '<span class="item-price-cut">₹' + op.toLocaleString('en-IN') + '</span><span class="item-discount-badge">' + dp + '% OFF</span>' : '') + '</div></div><button class="move-cart-btn" onclick="event.stopPropagation();moveToCart(' + i + ')">Add to Cart</button></div>'; 
        } 
        h += '</div>'; 
        c.innerHTML = h; 
        updateCount(); 
    }
    
    // 🔥 Wishlist works WITHOUT login — localStorage based
    document.addEventListener('DOMContentLoaded', function() { renderWishlist(); });
})();
</script>
</body>
</html>
