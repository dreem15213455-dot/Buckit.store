<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Wishlist - ZyMart+</title>
    <meta name="theme-color" content="#0B5A31">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { 
            --brand-green: #0B5A31; 
            --brand-green-dark: #083D21; 
            --brand-orange: #F59E0B; 
            --neutral-white: #FFFFFF; 
            --neutral-bg: #F9FAFB; 
            --neutral-border: #E5E7EB; 
            --neutral-gray: #6B7280; 
            --neutral-dark: #1A1A1A; 
            --danger: #EF4444; 
            --success: #10B981; 
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); 
            --shadow-sm: 0 1px 4px rgba(0,0,0,0.06); 
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08); 
            --radius-sm: 10px; 
            --radius-md: 14px; 
            --radius-lg: 18px; 
            --radius-full: 9999px; 
            --status-bar-height: env(safe-area-inset-top, 0px);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--neutral-bg); 
            color: var(--neutral-dark); 
            padding-bottom: 90px; 
            -webkit-tap-highlight-color: transparent; 
            -webkit-font-smoothing: antialiased; 
            min-height: 100vh; 
        }
        
        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(80px); } }
        @keyframes heartBeat { 0%{transform:scale(1)} 25%{transform:scale(1.2)} 50%{transform:scale(1)} 75%{transform:scale(1.2)} 100%{transform:scale(1)} }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes cartBounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
        
        .cart-badge.bounce { animation: cartBounce 0.3s ease; }
        
        .top-bar { 
            background: var(--brand-green); 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            z-index: 100; 
            padding: 10px 14px; 
            padding-top: calc(10px + var(--status-bar-height));
            display: flex; 
            align-items: center; 
            gap: 10px; 
            box-shadow: 0 2px 16px rgba(11,90,49,0.3); 
        }
        
        .back-btn { 
            width: 40px; 
            height: 40px; 
            min-width: 40px; 
            background: rgba(255,255,255,0.10); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            border: none; 
            color: white; 
            font-size: 15px; 
            text-decoration: none; 
        }
        
        .back-btn:active { background: rgba(255,255,255,0.22); transform: scale(0.93); }
        
        .top-title { 
            font-family: 'Poppins', sans-serif; 
            flex: 1; 
            font-size: 16px; 
            font-weight: 700; 
            color: white; 
        }
        
        .brand-zy { color: #A3E635; } 
        .brand-mart { color: #FDE047; }
        
        .top-count { 
            font-size: 11px; 
            color: white; 
            background: rgba(255,255,255,0.12); 
            padding: 5px 12px; 
            border-radius: var(--radius-full); 
        }
        
        .cart-icon-btn {
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.10);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            color: white;
            font-size: 14px;
            position: relative;
            text-decoration: none;
        }
        
        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--brand-orange);
            color: white;
            border-radius: 50%;
            width: 17px;
            height: 17px;
            font-size: 8px;
            display: none;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--brand-green);
            font-weight: 700;
        }
        
        .cart-badge.show { display: flex; }
        
        .main-content { 
            padding-top: 62px; 
            max-width: 600px; 
            margin: 0 auto; 
        }
        
        .holiday-strip {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 12px;
            background: #FEE2E2;
            color: #DC2626;
            font-size: 11px;
            font-weight: 600;
            margin: 10px 14px;
            border-radius: var(--radius-md);
            border: 1px solid #FECACA;
        }
        
        .holiday-strip.show { display: flex; }
        
        .wishlist-items { padding: 12px 14px; }
        
        .wishlist-item { 
            background: white; 
            border-radius: var(--radius-lg); 
            padding: 14px; 
            margin-bottom: 10px; 
            display: flex; 
            gap: 12px; 
            align-items: center; 
            border: 1px solid var(--neutral-border); 
            box-shadow: var(--shadow-xs); 
            animation: slideUp 0.3s ease forwards; 
            position: relative; 
            transition: all 0.15s ease; 
        }
        
        .wishlist-item:active { transform: scale(0.98); }
        .wishlist-item.removing { animation: fadeOut 0.25s ease forwards; }
        
        .item-image { 
            width: 72px; 
            height: 72px; 
            min-width: 72px; 
            border-radius: var(--radius-sm); 
            background: var(--neutral-bg); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            cursor: pointer; 
            flex-shrink: 0; 
        }
        
        .item-image img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
        
        .item-details { flex: 1; min-width: 0; cursor: pointer; }
        
        .item-name { 
            font-size: 13px; 
            font-weight: 600; 
            line-height: 1.3; 
            display: -webkit-box; 
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical; 
            overflow: hidden; 
        }
        
        .item-variant { 
            font-size: 10px; 
            color: var(--brand-green); 
            font-weight: 600; 
            background: #EDF7F1; 
            display: inline-block; 
            padding: 1px 6px; 
            border-radius: 9999px; 
            margin-top: 3px; 
        }
        
        .item-price-row { 
            display: flex; 
            align-items: baseline; 
            gap: 6px; 
            margin-top: 4px; 
            flex-wrap: wrap; 
        }
        
        .item-price { font-size: 16px; font-weight: 700; color: var(--brand-green-dark); }
        .item-price-cut { font-size: 11px; color: var(--neutral-gray); text-decoration: line-through; }
        
        .item-discount-badge { 
            font-size: 9px; 
            font-weight: 700; 
            color: white; 
            background: var(--brand-orange); 
            padding: 2px 7px; 
            border-radius: var(--radius-full); 
        }
        
        .item-date { font-size: 9px; color: #9CA3AF; margin-top: 2px; }
        
        .item-actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
        
        .move-cart-btn { 
            background: var(--brand-green); 
            color: white; 
            border: none; 
            padding: 10px 16px; 
            border-radius: var(--radius-full); 
            font-size: 11px; 
            font-weight: 600; 
            cursor: pointer; 
            font-family: 'Inter', sans-serif; 
            white-space: nowrap; 
            display: flex; 
            align-items: center; 
            gap: 4px; 
            transition: all 0.15s ease; 
        }
        
        .move-cart-btn:active { background: var(--brand-green-dark); transform: scale(0.95); }
        .move-cart-btn.in-cart { background: #EDF7F1; color: var(--brand-green); border: 1px solid var(--brand-green); }
        .move-cart-btn.disabled { background: #D1D5DB; color: #9CA3AF; cursor: not-allowed; }
        
        .remove-btn { 
            position: absolute; 
            top: 8px; 
            right: 8px; 
            width: 26px; 
            height: 26px; 
            background: #FEF2F2; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            border: none; 
            color: #EF4444; 
            font-size: 9px; 
            z-index: 1; 
        }
        
        .remove-btn:active { background: #FEE2E2; transform: scale(0.9); }
        
        .empty-state { text-align: center; padding: 70px 30px; }
        
        .empty-icon { 
            width: 80px; 
            height: 80px; 
            background: #F3F5F4; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0 auto 16px; 
        }
        
        .empty-icon i { font-size: 34px; color: #D1D5DB; }
        .empty-icon.has-items i { color: #EF4444; animation: heartBeat 0.6s ease; }
        
        .empty-state h3 { font-family: 'Poppins', sans-serif; font-size: 17px; font-weight: 700; margin-bottom: 6px; }
        .empty-state p { font-size: 13px; color: var(--neutral-gray); margin-bottom: 16px; }
        
        .browse-btn { 
            background: var(--brand-green); 
            color: white; 
            border: none; 
            padding: 12px 26px; 
            border-radius: var(--radius-full); 
            font-size: 13px; 
            font-weight: 600; 
            cursor: pointer; 
            font-family: 'Inter', sans-serif; 
            display: inline-flex; 
            align-items: center; 
            gap: 7px; 
            text-decoration: none; 
        }
        
        .browse-btn:active { background: var(--brand-green-dark); transform: scale(0.96); }
        
        .clear-all-btn { text-align: center; padding: 10px; }
        
        .clear-all-btn button { 
            background: transparent; 
            color: var(--danger); 
            border: 1px solid #FECACA; 
            padding: 8px 20px; 
            border-radius: var(--radius-full); 
            font-size: 11px; 
            font-weight: 600; 
            cursor: pointer; 
            font-family: 'Inter', sans-serif; 
        }
        
        .clear-all-btn button:active { background: #FEF2F2; }
        
        .bottom-nav { 
            background: white; 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            display: flex; 
            justify-content: space-around; 
            align-items: center;
            padding: 5px 12px 10px; 
            box-shadow: 0 -4px 16px rgba(0,0,0,0.03); 
            z-index: 100; 
            border-top: 1px solid var(--neutral-border); 
        }
        
        .nav-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            font-size: 9px; 
            font-weight: 500; 
            color: var(--neutral-gray); 
            cursor: pointer; 
            padding: 3px 10px; 
            border-radius: var(--radius-full); 
            border: none; 
            background: transparent; 
            font-family: 'Inter', sans-serif; 
            text-decoration: none; 
            position: relative;
        }
        
        .nav-item:active { background: #EDF7F1; }
        .nav-item.active { color: var(--brand-green); font-weight: 600; }
        .nav-item i { font-size: 18px; margin-bottom: 1px; }
        
        .nav-cart-count { 
            position: absolute; 
            top: -2px; 
            right: 2px; 
            background: var(--brand-orange); 
            color: white; 
            border-radius: 50%; 
            width: 16px; 
            height: 16px; 
            font-size: 8px; 
            display: none; 
            align-items: center; 
            justify-content: center; 
            border: 2px solid white; 
            font-weight: 700; 
        }
        
        .nav-cart-count.show { display: flex; }
        
        .toast { 
            position: fixed; 
            bottom: 95px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: var(--neutral-dark); 
            color: white; 
            padding: 10px 20px; 
            border-radius: var(--radius-full); 
            font-size: 12px; 
            z-index: 200; 
            opacity: 0; 
            visibility: hidden; 
            white-space: nowrap; 
            box-shadow: var(--shadow-md); 
            transition: all 0.3s ease; 
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .toast.show { opacity: 1; visibility: visible; }
        .toast.error { background: var(--danger); }
        .toast.success { background: var(--success); }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <span class="top-title"><span class="brand-zy">Zy</span><span class="brand-mart">Mart</span> Wishlist</span>
    <span class="top-count" id="wishlistCount">0 items</span>
    <a href="cart.html" class="cart-icon-btn">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-badge" id="cartBadge">0</span>
    </a>
</div>

<div class="holiday-strip" id="holidayStrip">
    <i class="fas fa-calendar-times"></i> 
    <span id="holidayStripText">🏖️ आज डिलीवरी बंद है</span>
</div>

<div class="main-content" id="mainContent">
    <div style="text-align:center;padding:60px;">
        <div style="width:34px;height:34px;border:2.5px solid #E5E7EB;border-top-color:#F59E0B;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 12px;"></div>
    </div>
</div>

<nav class="bottom-nav">
    <a class="nav-item" href="index.html"><i class="fas fa-home"></i><span>Home</span></a>
    <a class="nav-item" href="cart.html">
        <i class="fas fa-shopping-cart"></i>
        <span>Cart</span>
        <span class="nav-cart-count" id="navCartCount">0</span>
    </a>
    <a class="nav-item" href="orders.html"><i class="fas fa-receipt"></i><span>Orders</span></a>
    <a class="nav-item" href="profile.html"><i class="fas fa-user"></i><span>Profile</span></a>
    <a class="nav-item active" href="wishlist.html"><i class="fas fa-heart"></i><span>Wishlist</span></a>
</nav>

<div class="toast" id="toastMsg"><span id="toastText"></span></div>

<script>
(function() {
    'use strict';
    
    var CONFIG = {
        SUPABASE_URL: 'https://zwajyovemwdqtkecipeb.supabase.co',
        SUPABASE_KEY: 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1'
    };
    
    var sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
    var wishlist = [];
    var isHolidayToday = false;
    var holidayReason = '';
    
    function getEl(id) { return document.getElementById(id); }
    function safeJSON(s, f) { try { return s ? JSON.parse(s) : f; } catch(e) { return f; } }
    function esc(s) { if(!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    
    function showToast(m, type) { 
        var t = getEl('toastMsg'), s = getEl('toastText'); 
        if (!t || !s) return; 
        s.textContent = m; 
        t.className = 'toast';
        if (type === 'error') t.classList.add('error');
        else if (type === 'success') t.classList.add('success');
        t.classList.add('show'); 
        clearTimeout(t._timer); 
        t._timer = setTimeout(function() { 
            t.classList.remove('show','error','success'); 
        }, 2500); 
    }
    
    // ==================== CART MANAGER ====================
    var CartManager = {
        getCart: function() {
            return safeJSON(localStorage.getItem('zymart_cart'), []);
        },
        
        saveCart: function(cart) {
            try { localStorage.setItem('zymart_cart', JSON.stringify(cart)); } catch(e) {}
            this.updateBadges();
        },
        
        getTotalItems: function() {
            var cart = this.getCart();
            return cart.reduce(function(sum, item) { return sum + (item.quantity || 1); }, 0);
        },
        
        updateBadges: function() {
            var totalItems = this.getTotalItems();
            
            var topBadge = getEl('cartBadge');
            if (topBadge) {
                topBadge.textContent = totalItems;
                if (totalItems > 0) {
                    topBadge.classList.add('show');
                } else {
                    topBadge.classList.remove('show');
                }
            }
            
            var navBadge = getEl('navCartCount');
            if (navBadge) {
                navBadge.textContent = totalItems;
                if (totalItems > 0) {
                    navBadge.classList.add('show');
                } else {
                    navBadge.classList.remove('show');
                }
            }
        }
    };
    
    // ==================== HOLIDAY CHECK ====================
    async function checkHoliday() {
        try {
            var r = await sb.from('delivery_settings')
                .select('is_holiday, holiday_reason, holiday_date, is_open')
                .eq('is_active', true)
                .single();
                
            if(r.data) {
                if(r.data.is_holiday) {
                    var today = new Date().toISOString().split('T')[0];
                    if(r.data.holiday_date === today) {
                        isHolidayToday = true;
                        holidayReason = r.data.holiday_reason || 'आज डिलीवरी बंद है';
                    }
                }
                
                if(r.data.is_open === false) {
                    isHolidayToday = true;
                    if(!holidayReason) {
                        holidayReason = 'दुकान अभी बंद है';
                    }
                }
                
                if(isHolidayToday) {
                    var strip = getEl('holidayStrip');
                    if(strip) {
                        strip.classList.add('show');
                        getEl('holidayStripText').textContent = '🏖️ ' + holidayReason;
                    }
                }
            }
        } catch(e) {
            console.error('Holiday check error:', e);
        }
    }
    
    function fmtWeight(w, u) {
        if (!w) return '';
        var nw = parseFloat(w);
        if(isNaN(nw)) return String(w);
        var unitLower = u ? u.toLowerCase() : '';
        if (unitLower === 'gram' || unitLower === 'g') return nw >= 1000 ? (nw/1000).toFixed(1).replace(/\.0$/,'') + ' kg' : nw + ' g';
        if (unitLower === 'kg') return nw + ' kg';
        if (unitLower === 'liter' || unitLower === 'l') return nw + ' L';
        if (unitLower === 'ml') return nw + ' ml';
        return nw + ' ' + (u || '');
    }
    
    function loadWishlist() { 
        wishlist = safeJSON(localStorage.getItem('zymart_wishlist'), []); 
        wishlist = wishlist.map(function(item) {
            if (typeof item === 'string') return { id: item, name: 'Product', price: 0, image: '', added_at: new Date().toISOString() };
            return item;
        }).filter(function(item) { return item && item.id; }); 
        return wishlist; 
    }
    
    function saveWishlist() { 
        try { localStorage.setItem('zymart_wishlist', JSON.stringify(wishlist)); } catch(e) {} 
    }
    
    function updateCount() { 
        var el = getEl('wishlistCount'); 
        if (el) el.textContent = wishlist.length + ' item' + (wishlist.length !== 1 ? 's' : ''); 
    }
    
    function isInCart(itemId) {
        var cart = CartManager.getCart();
        return cart.some(function(c) { return c.id === itemId; });
    }
    
    // FIXED: moveToCart - shop_id aur shop_name add karo
    window.moveToCart = function(i) { 
        if (i < 0 || i >= wishlist.length) return; 
        
        if(isHolidayToday) {
            showToast('🏖️ ' + holidayReason, 'error');
            return;
        }
        
        var item = wishlist[i]; 
        var cart = CartManager.getCart(); 
        var found = cart.find(function(c) { return c.id === item.id; }); 
        
        if (found) {
            found.quantity += 1;
            showToast('🛒 Quantity increased in cart!', 'success');
        } else {
            cart.push({ 
                id: item.id, 
                name: item.name, 
                price: item.price || 0, 
                image: item.image || '', 
                quantity: 1,
                variantWeight: item.variantWeight || null,
                variantUnit: item.variantUnit || null,
                variantKey: item.variantKey || null,
                shop_id: item.shop_id || null,
                shop_name: item.shopName || item.shop_name || null
            }); 
            showToast('🛒 Added to cart!', 'success');
        }
        
        CartManager.saveCart(cart);
        renderWishlist();
    };
    
    window.removeItem = function(i) { 
        if (i < 0 || i >= wishlist.length) return; 
        var itemName = wishlist[i].name || 'Item';
        var el = document.querySelector('#wishlistItem' + i); 
        
        if (el) { 
            el.classList.add('removing'); 
            setTimeout(function() { 
                wishlist.splice(i, 1); 
                saveWishlist(); 
                renderWishlist(); 
                showToast('💔 ' + itemName + ' removed from wishlist');
            }, 250); 
        } else { 
            wishlist.splice(i, 1); 
            saveWishlist(); 
            renderWishlist(); 
        } 
    };
    
    window.clearAll = function() {
        if (!wishlist.length) return;
        if (!confirm('Remove all ' + wishlist.length + ' items from wishlist?')) return;
        wishlist = [];
        saveWishlist();
        renderWishlist();
        showToast('🗑️ Wishlist cleared');
    };
    
    function renderWishlist() { 
        loadWishlist(); 
        var c = getEl('mainContent'); 
        
        if (!wishlist.length) { 
            c.innerHTML = '<div class="empty-state"><div class="empty-icon"><i class="far fa-heart"></i></div><h3>Your Wishlist is Empty</h3><p>Tap the heart icon on any product to save it here</p><a href="products.html" class="browse-btn"><i class="fas fa-shopping-bag"></i> Browse Products</a><br><br><a href="index.html" style="color:var(--brand-green);font-size:13px;font-weight:600;text-decoration:none;"><i class="fas fa-home"></i> Go to Home</a></div>'; 
            updateCount(); 
            return; 
        } 
        
        var h = '<div class="wishlist-items">'; 
        
        for (var i = 0; i < wishlist.length; i++) { 
            var item = wishlist[i];
            var img = item.image || '';
            var name = esc(item.name || 'Product');
            var price = Number(item.price || 0);
            var op = Number(item.originalPrice || item.price || 0);
            var dp = op > price ? Math.round((1 - price / op) * 100) : 0;
            var inCart = isInCart(item.id);
            var addedDate = item.added_at ? new Date(item.added_at).toLocaleDateString('en-IN', {day:'numeric', month:'short'}) : '';
            
            var variantLabel = '';
            if (item.variantWeight) {
                variantLabel = '⚖️ ' + fmtWeight(item.variantWeight, item.variantUnit);
            }
            
            h += '<div class="wishlist-item" id="wishlistItem' + i + '">';
            h += '<button class="remove-btn" onclick="event.stopPropagation();removeItem(' + i + ')" title="Remove"><i class="fas fa-times"></i></button>';
            h += '<div class="item-image" onclick="window.location.href=\'product-detail.html?id=' + item.id + '\'">';
            
            if(img) {
                h += '<img src="' + img + '" loading="lazy" alt="" onerror="this.parentElement.innerHTML=\'<i class=&#34;fas fa-box-open&#34; style=&#34;font-size:24px;color:#D1D5DB;&#34;></i>\'">';
            } else {
                h += '<i class="fas fa-box-open" style="font-size:24px;color:#D1D5DB;"></i>';
            }
            
            h += '</div>';
            h += '<div class="item-details" onclick="window.location.href=\'product-detail.html?id=' + item.id + '\'">';
            h += '<div class="item-name">' + name + '</div>';
            if (variantLabel) h += '<span class="item-variant">' + variantLabel + '</span>';
            h += '<div class="item-price-row"><span class="item-price">₹' + price.toLocaleString('en-IN') + '</span>';
            if (dp > 0) {
                h += '<span class="item-price-cut">₹' + op.toLocaleString('en-IN') + '</span>';
                h += '<span class="item-discount-badge">' + dp + '% OFF</span>';
            }
            h += '</div>';
            if (addedDate) h += '<div class="item-date">📅 Added ' + addedDate + '</div>';
            h += '</div>';
            h += '<div class="item-actions">';
            
            if(isHolidayToday) {
                h += '<button class="move-cart-btn disabled" disabled>🔒 Closed</button>';
            } else {
                h += '<button class="move-cart-btn' + (inCart ? ' in-cart' : '') + '" onclick="event.stopPropagation();moveToCart(' + i + ')">' + (inCart ? '✓ In Cart' : 'Add to Cart') + '</button>';
            }
            
            h += '</div>';
            h += '</div>'; 
        } 
        h += '</div>';
        
        if (wishlist.length > 1) {
            h += '<div class="clear-all-btn"><button onclick="clearAll()"><i class="fas fa-trash-alt"></i> Clear All</button></div>';
        }
        
        c.innerHTML = h; 
        updateCount(); 
    }
    
    // ==================== EVENT LISTENERS ====================
    window.addEventListener('storage', function(e) {
        if (e.key === 'zymart_wishlist' || e.key === 'zymart_cart') { 
            renderWishlist(); 
            CartManager.updateBadges();
        }
    });
    
    document.addEventListener('visibilitychange', function() {
        if(document.visibilityState === 'visible') {
            CartManager.updateBadges();
        }
    });
    
    // ==================== INITIALIZATION ====================
    document.addEventListener('DOMContentLoaded', async function() { 
        await checkHoliday();
        CartManager.updateBadges();
        renderWishlist(); 
    });
    
    // ==================== EXPOSE GLOBAL FUNCTIONS ====================
    window.moveToCart = moveToCart;
    window.removeItem = removeItem;
    window.clearAll = clearAll;
    window.CartManager = CartManager;
    
})();
</script>
</body>
</html>
