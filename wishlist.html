<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist - Zatpat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #FFD600; --accent-green: #16A34A; --bg-light: #F5F5F5; --border-light: #E5E7EB; --danger: #EF4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-light); }
        .top-bar { background: white; position: fixed; top: 0; width: 100%; padding: 12px 16px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--border-light); z-index: 1000; }
        .back-btn { width: 40px; height: 40px; background: var(--bg-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .brand-name { font-size: 22px; font-weight: 800; }
        .brand-name .normal { color: #000000; }
        .brand-name .pat { color: var(--accent-green); }
        .main-content { padding-top: 80px; padding-bottom: 100px; max-width: 600px; margin: 0 auto; }
        .wishlist-item { background: white; border-radius: 16px; margin: 16px; padding: 12px; display: flex; gap: 12px; border: 1px solid var(--border-light); }
        .wishlist-img { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; }
        .wishlist-info { flex: 1; }
        .wishlist-name { font-weight: 700; margin-bottom: 4px; }
        .wishlist-price { color: var(--accent-green); font-weight: 700; }
        .remove-wishlist { color: var(--danger); cursor: pointer; background: none; border: none; }
        .add-to-cart-btn { background: var(--primary); border: none; padding: 6px 12px; border-radius: 50px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        .empty-wishlist { text-align: center; padding: 60px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="back-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i></div>
        <div class="brand-name"><span class="normal">Zat</span><span class="pat">pat</span></div>
        <div style="flex:1; text-align:center; font-weight:600;">My Wishlist</div>
    </div>
    <div class="main-content" id="wishlistContainer"></div>
    <script>
        const supabaseUrl = 'https://zwajyovemwdqtkecipeb.supabase.co';
        const supabaseKey = 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
        
        async function loadWishlist() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { document.getElementById('wishlistContainer').innerHTML = '<div class="empty-wishlist"><i class="fas fa-heart" style="font-size:64px;"></i><h3>Please login</h3><button onclick="window.location.href=\'index.html\'" style="background:var(--primary); border:none; padding:12px 24px; border-radius:50px; margin-top:16px;">Login</button></div>'; return; }
            
            const { data } = await supabaseClient.from('wishlist').select('*, products(*)').eq('user_id', user.id);
            const container = document.getElementById('wishlistContainer');
            if (!data || data.length === 0) { container.innerHTML = '<div class="empty-wishlist"><i class="far fa-heart" style="font-size:64px;"></i><h3>Wishlist is empty</h3><p>Save your favorite items here</p><button onclick="window.location.href=\'products.html\'" style="background:var(--primary); border:none; padding:12px 24px; border-radius:50px; margin-top:16px;">Start Shopping</button></div>'; return; }
            
            let html = '';
            data.forEach(item => {
                const p = item.products;
                html += `<div class="wishlist-item"><img src="${p.image_url || 'https://placehold.co/80x80/FFD600/000?text=P'}" class="wishlist-img"><div class="wishlist-info"><div class="wishlist-name">${p.name}</div><div class="wishlist-price">₹${p.offer_price || p.price}</div><button class="add-to-cart-btn" onclick="addToCartAndRemove('${p.id}', '${p.name}', ${p.offer_price || p.price})">Add to Cart</button></div><button class="remove-wishlist" onclick="removeFromWishlist('${p.id}')"><i class="fas fa-trash"></i></button></div>`;
            });
            container.innerHTML = html;
        }
        
        async function addToCartAndRemove(productId, name, price) {
            let cart = JSON.parse(localStorage.getItem('zatpat_cart')) || [];
            const existing = cart.find(item => item.id === productId);
            if (existing) existing.quantity += 1;
            else cart.push({ id: productId, name, price, quantity: 1 });
            localStorage.setItem('zatpat_cart', JSON.stringify(cart));
            await supabaseClient.from('wishlist').delete().eq('product_id', productId);
            loadWishlist();
            alert('Added to cart and removed from wishlist!');
        }
        
        async function removeFromWishlist(productId) {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user) await supabaseClient.from('wishlist').delete().eq('user_id', user.id).eq('product_id', productId);
            loadWishlist();
        }
        
        loadWishlist();
        window.addToCartAndRemove = addToCartAndRemove;
        window.removeFromWishlist = removeFromWishlist;
    </script>
</body>
</html>
