<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Wishlist - Zatpat</title>
    <meta name="theme-color" content="#16A34A">
    
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #16A34A;
            --primary-light: #22C55E;
            --primary-bg-light: #F0FDF4;
            --accent-orange: #F97316;
            --bg-white: #FFFFFF;
            --bg-light: #F9FAFB;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --border-light: #E5E7EB;
            --error: #EF4444;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --radius-md: 12px;
            --radius-full: 9999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
            overflow-x: hidden;
            padding-bottom: 85px;
            -webkit-font-smoothing: antialiased;
        }

        #pageProgress {
            position: fixed; top: 0; left: 0; width: 0%; height: 3px;
            background: var(--primary); z-index: 10001; transition: width 0.3s ease;
        }
        #pageProgress.loading { width: 90%; }
        #pageProgress.complete { width: 100%; opacity: 0; transition: opacity 0.3s; }

        /* Top Bar */
        .top-bar {
            background: var(--bg-white); position: sticky; top: 0; left: 0; width: 100%;
            z-index: 1000; padding: 12px 16px; box-shadow: var(--shadow-sm);
            border-bottom: 1px solid var(--border-light); display: flex; align-items: center; gap: 12px;
        }
        .back-btn {
            width: 40px; height: 40px; background: var(--bg-light); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .back-btn i { font-size: 18px; color: var(--text-primary); }
        .top-title {
            flex: 1; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 6px;
        }
        .top-title i { color: var(--error); }
        .wishlist-count {
            background: var(--error); color: white; font-size: 12px; padding: 2px 8px;
            border-radius: var(--radius-full); margin-left: 6px;
        }
        .cart-btn {
            width: 40px; height: 40px; background: var(--bg-light); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative;
        }
        .cart-badge {
            position: absolute; top: -2px; right: -2px; background: var(--primary); color: white;
            border-radius: 50%; width: 18px; height: 18px; font-size: 9px; display: flex;
            align-items: center; justify-content: center; border: 2px solid white; font-weight: 700;
        }

        /* Main Content */
        .main-content { padding: 16px; }

        /* Action Bar */
        .action-bar {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 16px;
        }
        .select-all {
            display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary);
        }
        .clear-all {
            color: var(--error); font-size: 13px; font-weight: 500; cursor: pointer;
        }

        /* Products Grid */
        .products-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
        }
        
        .product-card {
            background: var(--bg-white); border-radius: var(--radius-md);
            overflow: hidden; box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light); cursor: pointer; position: relative;
        }
        .product-img {
            width: 100%; aspect-ratio: 1 / 1; position: relative;
            overflow: hidden; background: var(--bg-light);
        }
        .product-img img { width: 100%; height: 100%; object-fit: cover; }
        .discount-tag {
            position: absolute; bottom: 6px; left: 6px; background: var(--accent-orange);
            color: white; font-size: 9px; font-weight: 700; padding: 2px 6px;
            border-radius: var(--radius-full); z-index: 1;
        }
        .remove-btn {
            position: absolute; top: 6px; right: 6px; background: white;
            width: 28px; height: 28px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; cursor: pointer;
            box-shadow: var(--shadow-sm); z-index: 1; color: var(--error);
        }
        .remove-btn i { font-size: 12px; }
        .product-info { padding: 8px; }
        .product-name {
            font-size: 12px; font-weight: 600; color: var(--text-primary);
            margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .product-rating { display: flex; align-items: center; gap: 3px; margin-bottom: 4px; }
        .product-rating i { color: #FACC15; font-size: 9px; }
        .product-rating span { font-size: 10px; color: var(--text-secondary); }
        .product-price-row {
            display: flex; align-items: center; justify-content: space-between;
        }
        .price-info { display: flex; align-items: baseline; gap: 4px; }
        .product-price { font-size: 14px; font-weight: 700; color: var(--primary); }
        .original-price { font-size: 10px; color: var(--text-secondary); text-decoration: line-through; }
        .add-btn {
            background: var(--primary-bg-light); color: var(--primary);
            border: 1px solid var(--primary); border-radius: 50%;
            width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 12px;
        }
        .add-btn:active { background: var(--primary); color: white; }

        /* Move to Cart Button */
        .move-all-btn {
            width: 100%; background: var(--primary); color: white; border: none;
            padding: 16px; border-radius: var(--radius-full); font-size: 16px; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-top: 20px;
        }
        .move-all-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Empty State */
        .empty-state {
            text-align: center; padding: 60px 20px;
        }
        .empty-state i { font-size: 64px; color: var(--border-light); margin-bottom: 20px; }
        .empty-state h3 { font-size: 18px; margin-bottom: 8px; }
        .empty-state p { color: var(--text-secondary); margin-bottom: 24px; }
        .shop-now-btn {
            background: var(--primary); color: white; border: none;
            padding: 14px 32px; border-radius: var(--radius-full);
            font-size: 15px; font-weight: 600; cursor: pointer;
        }

        /* Toast */
        .toast-notification {
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
            background: var(--text-primary); color: white; padding: 10px 20px;
            border-radius: var(--radius-full); font-size: 12px; z-index: 10050;
            display: none; white-space: nowrap;
        }
        .toast-notification.show { display: flex; }

        /* Bottom Navigation */
        .bottom-nav {
            background: white; position: fixed; bottom: 0; left: 0; width: 100%;
            display: flex; justify-content: space-around; padding: 6px 16px 8px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.06); z-index: 1000;
            border-top: 1px solid var(--border-light);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            font-size: 10px; font-weight: 500; color: var(--text-secondary); cursor: pointer; position: relative;
        }
        .nav-item.active { color: var(--primary); font-weight: 600; }
        .nav-item i { font-size: 20px; margin-bottom: 2px; }
        .cart-count {
            position: absolute; top: -5px; right: -5px; background: var(--primary); color: white;
            border-radius: 50%; width: 16px; height: 16px; font-size: 9px; display: flex;
            align-items: center; justify-content: center; border: 2px solid white;
        }

        .loading-spinner { text-align: center; padding: 60px; }
        .spinner {
            width: 40px; height: 40px; border: 3px solid var(--border-light);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="pageProgress"></div>
<div id="toastMsg" class="toast-notification"><span id="toastText"></span></div>

<div id="mainApp">
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
        <div class="top-title">
            <i class="fas fa-heart"></i> My Wishlist
            <span class="wishlist-count" id="wishlistCount">0</span>
        </div>
        <div class="cart-btn" onclick="fastNavigate('cart.html')">
            <i class="fas fa-shopping-bag"></i>
            <span class="cart-badge" id="cartBadge">0</span>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="wishlistContent">
        <div class="loading-spinner"><div class="spinner"></div></div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a class="nav-item" onclick="fastNavigate('index.html')"><i class="fas fa-home"></i><span>Home</span></a>
        <a class="nav-item" onclick="fastNavigate('products.html')"><i class="fas fa-search"></i><span>Explore</span></a>
        <a class="nav-item" onclick="fastNavigate('cart.html')"><i class="fas fa-shopping-bag"></i><span>Cart</span><span class="cart-count" id="cartCount">0</span></a>
        <a class="nav-item" onclick="fastNavigate('profile.html')"><i class="fas fa-user"></i><span>Profile</span></a>
        <a class="nav-item" onclick="fastNavigate('orders.html')"><i class="fas fa-receipt"></i><span>Orders</span></a>
    </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const supabaseUrl = 'https://zwajyovemwdqtkecipeb.supabase.co';
    const supabaseKey = 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1';
    const zatpatDB = supabase.createClient(supabaseUrl, supabaseKey);

    let wishlistItems = [];
    let wishlistProducts = [];

    function startProgress() { const b = document.getElementById('pageProgress'); b.style.width = '0%'; b.classList.add('loading'); setTimeout(() => b.style.width = '90%', 10); }
    function completeProgress() { const b = document.getElementById('pageProgress'); b.classList.remove('loading'); b.classList.add('complete'); setTimeout(() => { b.style.width = '0%'; b.classList.remove('complete'); }, 300); }
    window.fastNavigate = function(url) { startProgress(); setTimeout(() => window.location.href = url, 50); };
    function goBack() { window.history.back(); }

    function showToast(msg) {
        const t = document.getElementById('toastMsg');
        document.getElementById('toastText').innerHTML = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    function updateCartBadge() {
        const cart = JSON.parse(localStorage.getItem('zatpat_cart')) || [];
        document.getElementById('cartBadge').innerText = cart.reduce((s, i) => s + (i.quantity || 1), 0);
        document.getElementById('cartCount').innerText = cart.reduce((s, i) => s + (i.quantity || 1), 0);
    }

    async function loadWishlist() {
        try {
            // Get wishlist IDs from localStorage
            wishlistItems = JSON.parse(localStorage.getItem('zatpat_wishlist')) || [];
            
            const container = document.getElementById('wishlistContent');
            document.getElementById('wishlistCount').innerText = wishlistItems.length;

            if (wishlistItems.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="far fa-heart"></i>
                        <h3>Your wishlist is empty</h3>
                        <p>Save your favorite items here</p>
                        <button class="shop-now-btn" onclick="fastNavigate('products.html')">Explore Products</button>
                    </div>
                `;
                return;
            }

            // Fetch product details from Supabase
            const { data: products, error } = await zatpatDB
                .from('products')
                .select('*')
                .in('id', wishlistItems)
                .eq('is_active', true);

            if (error) throw error;

            wishlistProducts = products || [];
            
            // Add mock products if not found
            if (wishlistProducts.length === 0) {
                wishlistProducts = wishlistItems.map((id, index) => ({
                    id: id,
                    name: ['Farm Fresh Milk', 'Organic Apples', 'Brown Bread', 'Amul Butter'][index] || 'Product',
                    price: [54, 99, 35, 260][index] || 100,
                    offer_price: [54, 99, 35, 240][index] || 90,
                    rating: [4.5, 4.2, 4.0, 4.8][index] || 4.0,
                    image_url: null
                }));
            }

            renderWishlist();

        } catch (e) {
            console.error('Load error:', e);
        }
    }

    function renderWishlist() {
        const container = document.getElementById('wishlistContent');
        
        let html = `
            <div class="action-bar">
                <div class="clear-all" onclick="clearAllWishlist()">
                    <i class="far fa-trash-alt"></i> Clear All
                </div>
            </div>
            <div class="products-grid">
        `;
        
        wishlistProducts.forEach(product => {
            const img = product.image_url || 'https://placehold.co/200/F0FDF4/16A34A?text=❤️';
            const discount = product.offer_price ? Math.round((1 - product.offer_price / product.price) * 100) : 0;
            
            html += `
                <div class="product-card" onclick="fastNavigate('product-detail.html?id=${product.id}')">
                    <div class="product-img">
                        ${discount > 0 ? `<div class="discount-tag">${discount}% OFF</div>` : ''}
                        <img src="${img}" loading="lazy" onerror="this.src='https://placehold.co/200/F0FDF4/16A34A?text=❤️'">
                        <div class="remove-btn" onclick="event.stopPropagation(); removeFromWishlist('${product.id}')">
                            <i class="fas fa-times"></i>
                        </div>
                    </div>
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        <div class="product-rating"><i class="fas fa-star"></i> <span>${product.rating || 4.0}</span></div>
                        <div class="product-price-row">
                            <div class="price-info">
                                <span class="product-price">₹${product.offer_price || product.price}</span>
                                ${product.offer_price ? `<span class="original-price">₹${product.price}</span>` : ''}
                            </div>
                            <div class="add-btn" onclick="event.stopPropagation(); moveToCart('${product.id}', '${product.name}', ${product.offer_price || product.price}, '${img}')">
                                <i class="fas fa-shopping-cart"></i>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
        
        html += `
            </div>
            <button class="move-all-btn" onclick="moveAllToCart()">
                <i class="fas fa-shopping-cart"></i> Move All to Cart (${wishlistProducts.length})
            </button>
        `;
        
        container.innerHTML = html;
    }

    window.removeFromWishlist = function(productId) {
        wishlistItems = wishlistItems.filter(id => id !== productId);
        localStorage.setItem('zatpat_wishlist', JSON.stringify(wishlistItems));
        showToast('🗑️ Removed from wishlist');
        
        // Refresh
        wishlistProducts = wishlistProducts.filter(p => p.id !== productId);
        document.getElementById('wishlistCount').innerText = wishlistItems.length;
        
        if (wishlistItems.length === 0) {
            document.getElementById('wishlistContent').innerHTML = `
                <div class="empty-state">
                    <i class="far fa-heart"></i>
                    <h3>Your wishlist is empty</h3>
                    <p>Save your favorite items here</p>
                    <button class="shop-now-btn" onclick="fastNavigate('products.html')">Explore Products</button>
                </div>
            `;
        } else {
            renderWishlist();
        }
        
        if (navigator.vibrate) navigator.vibrate(10);
    };

    window.clearAllWishlist = function() {
        if (wishlistItems.length === 0) return;
        
        if (confirm('Remove all items from wishlist?')) {
            localStorage.removeItem('zatpat_wishlist');
            wishlistItems = [];
            document.getElementById('wishlistCount').innerText = '0';
            document.getElementById('wishlistContent').innerHTML = `
                <div class="empty-state">
                    <i class="far fa-heart"></i>
                    <h3>Your wishlist is empty</h3>
                    <p>Save your favorite items here</p>
                    <button class="shop-now-btn" onclick="fastNavigate('products.html')">Explore Products</button>
                </div>
            `;
            showToast('🗑️ Wishlist cleared');
        }
    };

    window.moveToCart = function(id, name, price, image) {
        let cart = JSON.parse(localStorage.getItem('zatpat_cart')) || [];
        const existing = cart.find(i => i.id === id);
        
        if (existing) {
            existing.quantity += 1;
        } else {
            cart.push({ id, name, price, image, quantity: 1 });
        }
        
        localStorage.setItem('zatpat_cart', JSON.stringify(cart));
        updateCartBadge();
        
        // Remove from wishlist
        removeFromWishlist(id);
        
        showToast('🛒 ' + name + ' added to cart');
        if (navigator.vibrate) navigator.vibrate(10);
    };

    window.moveAllToCart = function() {
        if (wishlistProducts.length === 0) return;
        
        let cart = JSON.parse(localStorage.getItem('zatpat_cart')) || [];
        
        wishlistProducts.forEach(product => {
            const existing = cart.find(i => i.id === product.id);
            if (existing) {
                existing.quantity += 1;
            } else {
                const img = product.image_url || 'https://placehold.co/200/F0FDF4/16A34A?text=❤️';
                cart.push({
                    id: product.id,
                    name: product.name,
                    price: product.offer_price || product.price,
                    image: img,
                    quantity: 1
                });
            }
        });
        
        localStorage.setItem('zatpat_cart', JSON.stringify(cart));
        localStorage.removeItem('zatpat_wishlist');
        updateCartBadge();
        
        showToast(`🛒 ${wishlistProducts.length} items moved to cart`);
        setTimeout(() => fastNavigate('cart.html'), 500);
    };

    document.addEventListener('DOMContentLoaded', () => {
        updateCartBadge();
        loadWishlist();
    });

    window.goBack = goBack;
    window.removeFromWishlist = removeFromWishlist;
    window.clearAllWishlist = clearAllWishlist;
    window.moveToCart = moveToCart;
    window.moveAllToCart = moveAllToCart;
</script>
</body>
</html>
