<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>मेरी विशलिस्ट - Zymart</title>
    <meta name="theme-color" content="#0B5A31">
    <meta name="description" content="Zymart - अपनी विशलिस्ट देखें">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --brand-green: #0B5A31; --brand-green-light: #0F6E3B; --brand-green-dark: #083D21;
            --brand-orange: #F59E0B; --brand-orange-dark: #E8890A; --brand-orange-light: #FFB020;
            --brand-white: #F5F5F5;
            --neutral-white: #FFFFFF; --neutral-bg: #F9FAFB; --neutral-border: #E5E7EB;
            --neutral-gray: #6B7280; --neutral-dark: #1A1A1A;
            --danger: #EF4444; --danger-bg: #FEF2F2;
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --radius-sm: 10px; --radius-md: 14px; --radius-lg: 18px; --radius-full: 9999px;
            --ease-fast: cubic-bezier(0.4,0,0.2,1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--neutral-bg); color: var(--neutral-dark);
            padding-bottom: 90px; -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased; min-height: 100vh;
        }
        
        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(50px); } }
        @keyframes heartPop { 0%{transform:scale(1)} 30%{transform:scale(1.3)} 60%{transform:scale(0.9)} 100%{transform:scale(1)} }
        
        .top-bar { background: var(--brand-green); position: fixed; top: 0; left: 0; width: 100%; z-index: 100; padding: 10px 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 16px rgba(11,90,49,0.3); }
        .back-btn { width: 40px; height: 40px; min-width: 40px; background: rgba(255,255,255,0.10); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 15px; transition: all 0.15s ease; }
        .back-btn:active { background: rgba(255,255,255,0.22); transform: scale(0.93); }
        .top-title { font-family: 'Poppins', sans-serif; flex: 1; font-size: 16px; font-weight: 700; color: var(--brand-white); }
        .top-count { font-size: 11px; color: rgba(255,255,255,0.85); font-weight: 600; background: rgba(255,255,255,0.12); padding: 5px 12px; border-radius: var(--radius-full); }
        
        .main-content { padding-top: 62px; max-width: 600px; margin: 0 auto; }
        
        /* WISHLIST ITEMS */
        .wishlist-items { padding: 12px 14px; }
        .wishlist-item { background: var(--neutral-white); border-radius: var(--radius-lg); padding: 14px; margin-bottom: 9px; display: flex; gap: 12px; align-items: center; border: 1px solid var(--neutral-border); box-shadow: var(--shadow-xs); animation: slideUp 0.3s ease forwards; position: relative; transition: all 0.15s ease; }
        .wishlist-item:active { box-shadow: var(--shadow-sm); }
        .wishlist-item.removing { animation: fadeOut 0.25s ease forwards; }
        
        .item-image { width: 72px; height: 72px; min-width: 72px; border-radius: var(--radius-sm); background: var(--neutral-bg); flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid var(--neutral-border); cursor: pointer; }
        .item-image img { width: 100%; height: 100%; object-fit: cover; }
        .item-image i { font-size: 28px; color: #D1D5DB; }
        
        .item-details { flex: 1; min-width: 0; cursor: pointer; }
        .item-name { font-size: 14px; font-weight: 600; color: var(--neutral-dark); margin-bottom: 3px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-price-row { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
        .item-price { font-size: 17px; font-weight: 700; }
        .item-price-cut { font-size: 12px; color: var(--neutral-gray); text-decoration: line-through; }
        .item-unit { font-size: 11px; color: var(--neutral-gray); margin-top: 2px; }
        .item-discount-badge { font-size: 9px; font-weight: 700; color: white; background: var(--brand-orange); padding: 2px 7px; border-radius: var(--radius-full); margin-left: 4px; }
        .item-rating { display: flex; align-items: center; gap: 3px; margin-top: 3px; }
        .item-rating i { color: #FACC15; font-size: 10px; }
        .item-rating span { font-size: 10px; color: var(--neutral-gray); }
        
        .move-cart-btn { background: var(--brand-green); color: white; border: none; padding: 10px 18px; border-radius: var(--radius-full); font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.15s ease; font-family: 'Inter', sans-serif; }
        .move-cart-btn:active { background: var(--brand-green-dark); transform: scale(0.96); }
        .move-cart-btn.done { background: var(--brand-orange); }
        
        .remove-btn { position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; min-width: 28px; background: var(--danger-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: var(--danger); font-size: 10px; transition: all 0.15s ease; z-index: 1; }
        .remove-btn:active { background: #FECACA; transform: scale(0.9); }
        .remove-btn i.animating { animation: heartPop 0.4s ease; }
        
        /* EMPTY STATE */
        .empty-state { text-align: center; padding: 70px 30px; animation: slideUp 0.4s ease; }
        .empty-icon { width: 80px; height: 80px; background: #F3F5F4; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
        .empty-icon i { font-size: 34px; color: #D1D5DB; }
        .empty-state h3 { font-family: 'Poppins', sans-serif; font-size: 17px; font-weight: 700; margin-bottom: 6px; }
        .empty-state p { font-size: 13px; color: var(--neutral-gray); margin-bottom: 18px; }
        .browse-btn { background: var(--brand-green); color: white; border: none; padding: 12px 26px; border-radius: var(--radius-full); font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; font-family: 'Inter', sans-serif; transition: all 0.15s ease; }
        .browse-btn:active { background: var(--brand-green-dark); transform: scale(0.96); }
        
        /* LOGIN REQUIRED */
        .login-required { text-align: center; padding: 75px 30px; animation: slideUp 0.4s ease; }
        .login-required .lock-icon { width: 80px; height: 80px; background: #F3F5F4; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
        .login-required .lock-icon i { font-size: 32px; color: #9CA3AF; }
        .login-required h3 { font-family: 'Poppins', sans-serif; font-size: 17px; font-weight: 700; margin-bottom: 6px; }
        .login-required p { font-size: 13px; color: var(--neutral-gray); margin-bottom: 18px; }
        .login-btn { background: var(--brand-orange); color: white; border: none; padding: 12px 26px; border-radius: var(--radius-full); font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; font-family: 'Inter', sans-serif; box-shadow: 0 4px 14px rgba(245,158,11,0.25); }
        .login-btn:active { background: var(--brand-orange-dark); transform: scale(0.96); }
        
        /* BOTTOM NAV */
        .bottom-nav { background: white; position: fixed; bottom: 0; left: 0; width: 100%; display: flex; justify-content: space-around; padding: 5px 12px 10px; box-shadow: 0 -4px 16px rgba(0,0,0,0.03); z-index: 100; border-top: 1px solid var(--neutral-border); }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 9px; font-weight: 500; color: var(--neutral-gray); cursor: pointer; padding: 3px 10px; border-radius: var(--radius-full); border: none; background: transparent; transition: all 0.15s ease; font-family: 'Inter', sans-serif; }
        .nav-item:active { background: #EDF7F1; }
        .nav-item.active { color: var(--brand-green); font-weight: 600; }
        .nav-item i { font-size: 18px; margin-bottom: 1px; }
        
        .toast { position: fixed; bottom: 95px; left: 50%; transform: translateX(-50%); background: var(--neutral-dark); color: white; padding: 10px 20px; border-radius: var(--radius-full); font-size: 11px; z-index: 200; opacity: 0; visibility: hidden; white-space: nowrap; box-shadow: var(--shadow-md); transition: all 0.3s ease; }
        .toast.show { opacity: 1; visibility: visible; }
        .toast.error { background: #EF4444; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="top-bar">
    <button class="back-btn" onclick="goBack()" aria-label="वापस"><i class="fas fa-arrow-left"></i></button>
    <span class="top-title">❤️ मेरी विशलिस्ट</span>
    <span class="top-count" id="wishlistCount">0 आइटम</span>
</div>

<div class="main-content" id="mainContent"></div>

<nav class="bottom-nav">
    <button class="nav-item" onclick="fastNavigate('index.html')"><i class="fas fa-home"></i><span>होम</span></button>
    <button class="nav-item" onclick="fastNavigate('products.html')"><i class="fas fa-box"></i><span>खोजें</span></button>
    <button class="nav-item" onclick="fastNavigate('cart.html')"><i class="fas fa-shopping-cart"></i><span>कार्ट</span></button>
    <button class="nav-item" onclick="fastNavigate('orders.html')"><i class="fas fa-receipt"></i><span>ऑर्डर</span></button>
    <button class="nav-item active"><i class="fas fa-heart"></i><span>विशलिस्ट</span></button>
</nav>

<div class="toast" id="toastMsg"></div>

<script>
(function() {
    'use strict';
    
    window.addEventListener('error', function(e) { try { console.error('[Zymart Crash]', e.message); } catch(ex) {} });
    window.addEventListener('unhandledrejection', function(e) { try { console.error('[Zymart Promise Crash]', e.reason); } catch(ex) {} e.preventDefault(); });
    function safeJSONParse(s, f) { try { return s ? JSON.parse(s) : f; } catch(e) { return f; } }
    function safeGetElement(id) { try { return document.getElementById(id); } catch(e) { return null; } }
    function escapeHTML(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
    
    var sb = null;
    try { sb = supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co', 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1'); }
    catch(e) { sb = { auth: { getSession: function() { return Promise.resolve({ data: { session: null } }); } } }; }
    
    var wishlist = [], isLoggedIn = false, currentUser = null;
    
    function showToast(m, e) { try { var t = safeGetElement('toastMsg'); if (!t) return; t.textContent = m; t.className = 'toast'; if (e) t.classList.add('error'); t.classList.add('show'); clearTimeout(t._timer); t._timer = setTimeout(function() { t.classList.remove('show'); }, 2500); } catch(ex) {} }
    function goBack() { try { if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) { window.history.back(); return; } } catch(e) {} window.location.href = 'index.html'; }
    window.fastNavigate = function(url) { window.location.href = url; };
    
    async function checkUser() { try { var res = await sb.auth.getSession(); if (res && res.data && res.data.session) { currentUser = res.data.session.user; isLoggedIn = true; return true; } } catch(e) {} return false; }
    
    function loadWishlist() {
        wishlist = safeJSONParse(localStorage.getItem('zatpat_wishlist'), []);
        // ✅ Filter out old string-only IDs (backward compatibility)
        wishlist = wishlist.filter(function(item) { return typeof item === 'object' && item.id; });
        return wishlist;
    }
    
    function saveWishlist() { try { localStorage.setItem('zatpat_wishlist', JSON.stringify(wishlist)); } catch(e) { showToast('स्टोरेज फुल!', true); } }
    
    function updateCount() { var c = wishlist.length; var el = safeGetElement('wishlistCount'); if (el) el.textContent = c + ' आइटम'; return c; }
    
    function moveToCart(index) {
        if (index < 0 || index >= wishlist.length) return;
        var item = wishlist[index];
        try {
            var cart = safeJSONParse(localStorage.getItem('zatpat_cart'), []);
            var found = cart.find(function(c) { return c.id === item.id; });
            if (found) { found.quantity = (found.quantity || 1) + 1; }
            else { cart.push({ id: item.id, name: item.name, price: item.price, image: item.image || '', quantity: 1, unit: item.unit || 'piece' }); }
            try { localStorage.setItem('zatpat_cart', JSON.stringify(cart)); } catch(e) {}
            var btn = document.querySelector('#wishlistItem' + index + ' .move-cart-btn');
            if (btn) { btn.textContent = '✓ जुड़ गया'; btn.classList.add('done'); setTimeout(function() { btn.textContent = 'कार्ट में डालें'; btn.classList.remove('done'); }, 1500); }
            showToast('🛒 ' + (item.name || 'आइटम') + ' कार्ट में!');
            if (navigator.vibrate) navigator.vibrate(10);
        } catch(e) { showToast('कुछ गलत हुआ', true); }
    }
    
    function removeItem(index) {
        if (index < 0 || index >= wishlist.length) return;
        var item = wishlist[index], el = document.querySelector('#wishlistItem' + index);
        if (el) {
            el.classList.add('removing');
            var removeIcon = el.querySelector('.remove-btn i');
            if (removeIcon) { removeIcon.classList.add('animating'); }
            setTimeout(function() { wishlist.splice(index, 1); saveWishlist(); renderWishlist(); showToast('❤️ विशलिस्ट से हटाया'); }, 250);
        } else { wishlist.splice(index, 1); saveWishlist(); renderWishlist(); showToast('❤️ विशलिस्ट से हटाया'); }
    }
    
    function renderWishlist() {
        loadWishlist();
        var container = safeGetElement('mainContent');
        if (!container) return;
        
        if (wishlist.length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="empty-icon"><i class="far fa-heart"></i></div><h3>आपकी विशलिस्ट खाली है</h3><p>अपने पसंदीदा आइटम यहाँ सेव करें</p><button class="browse-btn" onclick="fastNavigate(\'products.html\')"><i class="fas fa-shopping-bag"></i> प्रोडक्ट्स देखें</button></div>';
            updateCount(); return;
        }
        
        var html = '<div class="wishlist-items">';
        for (var i = 0; i < wishlist.length; i++) {
            var item = wishlist[i];
            var img = item.image || '';
            var name = escapeHTML(item.name || 'प्रोडक्ट');
            var price = Number(item.price || 0);
            var originalPrice = Number(item.originalPrice || 0);
            var hasDiscount = item.discountPercent > 0 || (originalPrice > price);
            var discount = hasDiscount ? Math.round((1 - price / originalPrice) * 100) : item.discountPercent || 0;
            var rating = Number(item.rating || 0);
            
            html += '<div class="wishlist-item" id="wishlistItem' + i + '" style="animation-delay:' + (i * 0.04) + 's;">';
            
            // Remove button
            html += '<button class="remove-btn" onclick="removeItem(' + i + ')" title="हटाएं"><i class="fas fa-times"></i></button>';
            
            // ✅ Clickable image → product detail
            html += '<div class="item-image" onclick="fastNavigate(\'product-detail.html?id=' + item.id + '\')">';
            if (img) {
                html += '<img src="' + img + '" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';" alt="' + name + '">';
                html += '<i class="fas fa-box-open" style="display:none;"></i>';
            } else {
                html += '<i class="fas fa-box-open"></i>';
            }
            html += '</div>';
            
            // ✅ Clickable details → product detail
            html += '<div class="item-details" onclick="fastNavigate(\'product-detail.html?id=' + item.id + '\')">';
            html += '<div class="item-name">' + name + '</div>';
            html += '<div class="item-price-row"><span class="item-price">₹' + price.toLocaleString('en-IN') + '</span>';
            if (hasDiscount && originalPrice > price) {
                html += '<span class="item-price-cut">₹' + originalPrice.toLocaleString('en-IN') + '</span>';
                html += '<span class="item-discount-badge">' + discount + '% OFF</span>';
            }
            html += '</div>';
            if (item.unit) { html += '<div class="item-unit">' + escapeHTML(item.unit) + '</div>'; }
            if (rating > 0) {
                html += '<div class="item-rating"><i class="fas fa-star"></i><span>' + rating.toFixed(1) + '</span></div>';
            }
            html += '</div>';
            
            // Add to cart button
            html += '<button class="move-cart-btn" onclick="event.stopPropagation();moveToCart(' + i + ')">कार्ट में डालें</button>';
            
            html += '</div>';
        }
        html += '</div>';
        container.innerHTML = html;
        updateCount();
    }
    
    document.addEventListener('DOMContentLoaded', async function() {
        await checkUser();
        if (!isLoggedIn) {
            var mc = safeGetElement('mainContent');
            if (mc) mc.innerHTML = '<div class="login-required"><div class="lock-icon"><i class="fas fa-lock"></i></div><h3>लॉगिन आवश्यक</h3><p>विशलिस्ट देखने के लिए लॉगिन करें</p><button class="login-btn" onclick="(function(){try{localStorage.setItem(\'zatpat_redirect_after_login\',\'wishlist.html\');}catch(e){}window.location.href=\'index.html#login\';})()"><i class="fas fa-sign-in-alt"></i> लॉगिन / रजिस्टर</button></div>';
            var el = safeGetElement('wishlistCount'); if (el) el.textContent = '0 आइटम';
            return;
        }
        renderWishlist();
    });
    
    window.goBack = goBack; window.moveToCart = moveToCart; window.removeItem = removeItem;
})();
</script>
</body>
</html>
