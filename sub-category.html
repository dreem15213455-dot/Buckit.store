        .search-input:focus { border-color: var(--brand-orange); background: white; }

        .weight-tag { position: absolute; bottom: 5px; right: 5px; background: rgba(11,90,49,0.85); color: white; font-size: 8px; font-weight: 600; padding: 2px 6px; border-radius: var(--radius-full); z-index: 1; }
        .shop-tag { position: absolute; bottom: 5px; left: 5px; background: rgba(11,90,49,0.9); color: white; font-size: 8px; font-weight: 600; padding: 2px 6px; border-radius: var(--radius-full); z-index: 1; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .wishlist-btn { position: absolute; top: 5px; right: 5px; width: 24px; height: 24px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 10px; color: #9CA3AF; z-index: 1; border: none; box-shadow: var(--shadow-sm); }

        .out-of-stock-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 2; }
        .out-of-stock-overlay span { background: rgba(0,0,0,0.75); color: white; padding: 4px 10px; border-radius: 9999px; font-size: 9px; font-weight: 700; }
        .color-swatches-row { display: flex; align-items: center; gap: 3px; margin-top: 2px; }
        .color-dot { width: 11px; height: 11px; border-radius: 50%; border: 1px solid #E5E7EB; display: inline-block; }
        .color-more { font-size: 8px; color: #6B7280; font-weight: 600; margin-left: 2px; }
        .product-info { padding: 8px 10px; }
        .product-name { font-size: 11px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 28px; color: var(--neutral-dark); }
        .product-brand { font-size: 8px; color: var(--brand-green); font-weight: 600; margin-top: 1px; }

        .toast-notification { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: #1A1A1A; color: white; padding: 10px 18px; border-radius: var(--radius-full); font-size: 11px; z-index: 10050; opacity: 0; visibility: hidden; transition: all 0.3s ease; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }

        .bottom-sheet-overlay.show { display: flex; }
        .bottom-sheet { background: white; width: 100%; max-width: 500px; border-radius: 24px 24px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px)); animation: slideUp 0.3s ease; max-height: 70vh; overflow-y: auto; }
        .sheet-handle { width: 40px; height: 4px; background: var(--neutral-border); border-radius: 2px; margin: 0 auto 16px; }
        .sheet-title { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 14px; }
        .sheet-option { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--neutral-border); cursor: pointer; }

        .sheet-option:active { background: #F9FAFB; }
        .sheet-option-text { font-size: 13px; font-weight: 500; }
        .sheet-option i { color: var(--brand-green); font-size: 16px; }
        .sheet-clear-btn { width: 100%; padding: 12px; border-radius: var(--radius-full); font-size: 14px; font-weight: 700; cursor: pointer; border: 1px solid #EF4444; background: white; color: #EF4444; margin-top: 16px; transition: all 0.2s; }
    </style>
</head>
<body>

<div id="netBanner" style="display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);background:#DC2626;color:white;text-align:center;padding:6px 16px;border-radius:20px;font-size:11px;font-weight:700;z-index:99999;box-shadow:0 4px 12px rgba(220,38,38,0.4);white-space:nowrap;pointer-events:none;">📴 No Internet</div>

    <span class="top-title" id="pageTitle">Products</span>
    <button class="search-btn" onclick="toggleSearch()"><i class="fas fa-search"></i></button>
    <a href="cart.html" class="cart-icon-btn">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-badge" id="cartBadge">0</span>
    </a>
</div>

<div class="search-bar" id="searchBar">
    <input type="text" class="search-input" id="searchInput" placeholder="Search in this category..." onkeyup="handleSearch(this.value)">
</div>

<div class="filter-bar" id="filterBar">
    <button class="filter-btn" id="btnCategory" onclick="showFilterSheet('category')"><i class="fas fa-list"></i> Category <i class="fas fa-chevron-down" style="font-size:9px;margin-left:2px;"></i></button>
    <button class="filter-btn" id="btnGender" onclick="showFilterSheet('gender')"><i class="fas fa-venus-mars"></i> Gender <i class="fas fa-chevron-down" style="font-size:9px;margin-left:2px;"></i></button>
    <button class="filter-btn active" id="btnSort" onclick="showFilterSheet('sort')"><i class="fas fa-sort"></i> Popular <i class="fas fa-chevron-down" style="font-size:9px;margin-left:2px;"></i></button>
    <button class="filter-btn" id="btnFilter" onclick="showFilterSheet('filter')"><i class="fas fa-sliders-h"></i> Filter</button>
</div>

<div class="body-container">
    <div class="left-sidebar" id="leftSidebar">
        <div style="text-align:center;padding:20px;font-size:11px;color:#9CA3AF;">Loading...</div>
    </div>
    <div class="right-products" id="rightProducts">
        <div id="viewOnlyContainer"></div>
        <div class="products-grid" id="productsGrid">
            <div class="loading-state"><div class="spinner"></div><p>Loading...</p></div>
        </div>
    </div>
</div>

<div id="filterSheet" class="bottom-sheet-overlay" onclick="closeFilterSheet(event)">
    <div class="bottom-sheet" onclick="event.stopPropagation()">
        <div class="sheet-handle"></div>
        <h3 class="sheet-title" id="sheetTitle">Options</h3>
        <div id="sheetContent"></div>
        <button class="sheet-clear-btn" onclick="clearFilters()">Clear All Filters</button>
    </div>
</div>

<div class="toast-notification" id="toastMsg"><span id="toastText"></span></div>
<script>

        var w = width || 160;

    async function fetchRatingsForIds(ids) {
        if (!ids || !ids.length) return;
        // Load persisted ratings cache from sessionStorage once
        if (Object.keys(productRatingsCache).length === 0) {
            var cachedRatings = getCache('ratings_map_v1');
            if (cachedRatings) productRatingsCache = cachedRatings;
        }
        var missing = ids.filter(function(id) { return productRatingsCache[id] === undefined; });
        if (!missing.length) return;
        try {
            var r = await zymartDB.from('product_reviews').select('product_id, rating').in('product_id', missing).eq('admin_hidden', false);
            for (var i = 0; i < missing.length; i++) {
                if (productRatingsCache[missing[i]] === undefined) productRatingsCache[missing[i]] = { avg: 0, count: 0 };
            }
            if (r && r.data && r.data.length > 0) {
                var temp = {};
                r.data.forEach(function(rv) {
                    if (!temp[rv.product_id]) temp[rv.product_id] = { sum: 0, count: 0 };
                    temp[rv.product_id].sum += parseInt(rv.rating) || 0;
                    temp[rv.product_id].count++;
                });
                Object.keys(temp).forEach(function(pid) {
                    productRatingsCache[pid] = { avg: temp[pid].sum / temp[pid].count, count: temp[pid].count };
                });
            }
            setCache('ratings_map_v1', productRatingsCache);
        } catch(e) {
            for (var j = 0; j < missing.length; j++) {
                if (productRatingsCache[missing[j]] === undefined) productRatingsCache[missing[j]] = { avg: 0, count: 0 };
            }
        }
    }

        return '<div class="product-rating"><span class="star-icon">★</span><span class="avg-val">' + r.avg.toFixed(1) + '</span><span class="count-val">(' + r.count + ')</span></div>';
    }

    var CartManager = {
        getCart: function() { return safeGet('zymart_cart', []); },

        addToCart: function(product) {
            var cart = this.getCart();
            var existing = cart.find(function(item) { return item.id === product.id && item.variantKey === product.variantKey; });
            if (existing) existing.quantity = (existing.quantity || 1) + 1;
            else cart.push({ id: product.id, variantKey: product.variantKey || product.id, name: product.name, price: product.price, image: product.image, variantWeight: product.variantWeight || null, variantUnit: product.variantUnit || null, shop_id: product.shop_id || null, shop_name: product.shop_name || null, quantity: 1 });
            this.saveCart(cart);
            return cart;
        },
        updateQuantity: function(productId, delta) {
            var cart = this.getCart();
            var item = cart.find(function(i) { return i.id === productId; });
            if (item) {
                item.quantity = (item.quantity || 1) + delta;
                if (item.quantity <= 0) cart = cart.filter(function(i) { return i.id !== productId; });
            }
            this.saveCart(cart);
            return cart;
        },
        getTotalItems: function() { var cart = this.getCart(); return cart.reduce(function(sum, item) { return sum + (item.quantity || 1); }, 0); },
        updateBadge: function() {
            var totalItems = this.getTotalItems();

        }
    };
    
    function fmtWeight(w, u) {
        if(!w || w===0) return '';
        var nw = parseFloat(w);
        if(isNaN(nw)) return String(w);
        var unitLower = u ? u.toLowerCase() : '';
        if(unitLower === 'gram' || unitLower === 'g' || unitLower === 'gm' || unitLower === 'grams') { if(nw >= 1000) return (nw/1000).toFixed(1).replace(/\.0$/,'') + ' kg'; return nw + ' g'; }
        if(unitLower === 'kg' || unitLower === 'kilogram') return nw + ' kg';
        if(unitLower === 'liter' || unitLower === 'l' || unitLower === 'litre') return nw + ' L';
        if(unitLower === 'ml' || unitLower === 'milliliter') return nw + ' ml';
        if(unitLower === 'piece' || unitLower === 'pcs' || unitLower === 'pc') return nw + ' pcs';
        return nw + ' ' + (u || '');
    }

    function getColorHex(n) { if (!n) return '#E5E7EB'; var k = n.toLowerCase().trim(); if (COLOR_HEX_MAP[k]) return COLOR_HEX_MAP[k]; for (var x in COLOR_HEX_MAP) if (k.indexOf(x) !== -1) return COLOR_HEX_MAP[x]; return '#E5E7EB'; }

    function getClothingPriceRange(colors) {
        if (!colors || !colors.length) return null;
        var prices = [];
        colors.forEach(function(c) { (c.sizes || []).forEach(function(s) { var pr = s.offer_price || s.price; if (pr > 0) prices.push(parseFloat(pr)); }); });
        if (!prices.length) return null;

    }
    function getClothingTotalStock(colors) { var t = 0; (colors || []).forEach(function(c) { (c.sizes || []).forEach(function(s) { t += (s.stock || 0); }); }); return t; }
    function getClothingDiscount(colors) { var mx = 0; (colors || []).forEach(function(c) { (c.sizes || []).forEach(function(s) { if (s.offer_price && s.price && s.offer_price < s.price) { var d = Math.round((1 - s.offer_price / s.price) * 100); if (d > mx) mx = d; } }); }); return mx; }
    function getSizeRangeText(colors) {
        var allSizes = {}, ordered = [];
        var order = ['XS','S','M','L','XL','XXL','3XL','1-2Y','2-3Y','3-4Y','4-5Y','5-6Y','6-7Y','7-8Y','8-9Y','10-11Y','12-13Y','5','6','7','8','9','10','11','12','Free Size'];
        (colors || []).forEach(function(c) { (c.sizes || []).forEach(function(s) { if (s.size && !allSizes[s.size]) { allSizes[s.size] = true; ordered.push(s.size); } }); });
        ordered.sort(function(a, b) { var ia = order.indexOf(a), ib = order.indexOf(b); if (ia === -1) ia = 999; if (ib === -1) ib = 999; return ia - ib; });
        if (!ordered.length) return '';
        if (ordered.length === 1) return ordered[0];
        return ordered[0] + ' - ' + ordered[ordered.length - 1];
    }

    async function loadSubCategories() {
        var sidebar = $('leftSidebar'); if(!sidebar) return;
        try {
            var cacheKey = 'subcats_v2_' + (currentCategoryId || currentSubId || 'all');
            var cached = getCache(cacheKey);
            if(cached) {
                subCategories = cached.list || [];
                if (cached.parentId) resolvedParentId = cached.parentId;
                if (cached.parentName && !currentCategoryName) currentCategoryName = cached.parentName;
            } else {
                var q = zymartDB.from('categories')
                    .select('id, name, image_url, display_order, parent_id')
                    .eq('is_active', true)
                    .eq('is_on_hold', false);
                if(currentCategoryId) {
                    resolvedParentId = currentCategoryId;
                    q = q.eq('parent_id', currentCategoryId);
                } else if(currentSubId) {
                    var parentRes = await zymartDB.from('categories').select('parent_id').eq('id', currentSubId).maybeSingle();
                    if(parentRes.data && parentRes.data.parent_id) {
                        resolvedParentId = parentRes.data.parent_id;
                        q = q.eq('parent_id', resolvedParentId);
                        var pNameRes = await zymartDB.from('categories').select('name').eq('id', resolvedParentId).maybeSingle();
                        if (pNameRes.data && pNameRes.data.name && !currentCategoryName) {
                            currentCategoryName = pNameRes.data.name;
                        }
                    } else {
                        resolvedParentId = currentSubId;
                        q = q.eq('parent_id', currentSubId);
                    }
                } else {
                    q = q.not('parent_id', 'is', null);
                }
                q = q.order('display_order', { ascending: true, nullsFirst: false });
                var r = await q;
                subCategories = r.data || [];
                if(subCategories.length === 0 && (currentCategoryId || resolvedParentId)) {
                    var targetId = currentCategoryId || resolvedParentId;
                    var pRes = await zymartDB.from('categories').select('id, name, image_url').eq('id', targetId).maybeSingle();
                    if(pRes.data) subCategories = [pRes.data];
                }
                setCache(cacheKey, { list: subCategories, parentId: resolvedParentId, parentName: currentCategoryName });
            }
            
            var html = '';
            html += '<div class="sidebar-item sidebar-item-all active" onclick="selectAllProducts()"><div class="sidebar-item-img"><i class="fas fa-th-large"></i></div><span>All Products</span></div>';
            subCategories.forEach(function(sc) {
                var scImg = getFullUrl(sc.image_url, 80, 80);
                var safeName = jsStr(sc.name);
                html += '<div class="sidebar-item" onclick="selectSubCategory(\'' + sc.id + '\',\'' + safeName + '\')"><div class="sidebar-item-img">';
                if(scImg) html += '<img src="' + attrEsc(scImg) + '" loading="lazy" decoding="async" alt="' + attrEsc(sc.name) + '" width="44" height="44" onerror="this.style.display=\'none\';this.parentElement.innerHTML=\'<i class=&quot;fas fa-shopping-basket&quot;></i>\'">';
                else html += '<i class="fas fa-shopping-basket"></i>';
                html += '</div><span>' + esc(sc.name) + '</span></div>';
            });
            sidebar.innerHTML = html;

            // Check if user returned back from product detail
            var savedState = loadSavedPageState();
            if (savedState) {
                currentSort = savedState.currentSort || 'popular';
                currentGenderFilter = savedState.currentGenderFilter || null;
                searchTerm = savedState.searchTerm || '';
                pendingRestoreScroll = {
                    scrollTop: savedState.scrollTop || 0,
                    sidebarScrollTop: savedState.sidebarScrollTop || 0
                };
                if (ls && savedState.sidebarScrollTop) {
                    var ls = $('leftSidebar');
                    if (ls) ls.scrollTop = savedState.sidebarScrollTop;
                }
                if (searchTerm && $('searchInput') && $('searchBar')) {
                    $('searchBar').classList.add('show');
                    $('searchInput').value = searchTerm;
                }
                if (currentSort !== 'popular') {
                    $('btnSort').innerHTML = '<i class="fas fa-sort"></i> ' + (currentSort === 'price_low' ? 'Price ↑' : currentSort === 'price_high' ? 'Price ↓' : 'Discount') + ' <i class="fas fa-chevron-down" style="font-size:9px;margin-left:2px;"></i>';
                }
                if (currentGenderFilter) {
                    $('btnGender').innerHTML = '<i class="fas fa-venus-mars"></i> ' + (currentGenderFilter.charAt(0).toUpperCase() + currentGenderFilter.slice(1)) + ' <i class="fas fa-chevron-down" style="font-size:9px;margin-left:2px;"></i>';
                    $('btnGender').classList.add('active');
                }
                if (!savedState.isAllProducts && savedState.currentSubId) {
                    isAllProducts = false;
                    currentSubId = savedState.currentSubId;
                    currentSubName = savedState.currentSubName || '';
                    if (currentSubName) $('pageTitle').textContent = currentSubName;
                    syncActiveStates(currentSubId);
                    loadProducts(currentSubId);
                    return;
                } else {
                    isAllProducts = true;
                    currentSubId = '';
                    currentSubName = '';
                    $('pageTitle').textContent = currentCategoryName || 'All Products';
                    syncActiveStates('__all__');
                    loadAllProducts();
                    return;
                }
            }
            
            if (currentSubId && !isAllProducts) {
                syncActiveStates(currentSubId);
                loadProducts(currentSubId);
            } else {
                isAllProducts = true;
                syncActiveStates('__all__');
                loadAllProducts();
            }
        } catch(e) { 
            console.error('Error loading sub-categories:', e); 
            sidebar.innerHTML = '<div style="text-align:center;padding:20px;font-size:11px;color:#EF4444;">Failed to load</div>'; 
        }
    }

    // Build all category + subcategory IDs so "All Products" never returns empty
    function buildCategoryIds() {
        var ids = [];
        var seen = {};
        function addId(id) {
            if (id && !seen[id]) { seen[id] = true; ids.push(id); }
        }
        addId(currentCategoryId);
        addId(resolvedParentId);
        subCategories.forEach(function(sc) { addId(sc.id); });
        if (ids.length === 0 && currentSubId) addId(currentSubId);
        return ids.length > 0 ? ids : null;
    }
    
    async function loadAllProducts() {
        var grid = $('productsGrid'); if(!grid) return;
        extraProducts = [];
        var uLat = parseFloat(localStorage.getItem('user_lat'));
        var uLng = parseFloat(localStorage.getItem('user_lng'));
        var userTaluka = localStorage.getItem('user_taluka') || '';
        
        if (isNaN(uLat) || isNaN(uLng) || uLat === 0 || uLng === 0) {
            grid.innerHTML = '<div class="empty-state"><i class="fas fa-map-marker-slash"></i><h3>Location Required</h3><p>Please enable location to view products.</p></div>';
            return;
        }

        var categoryIds = buildCategoryIds();
        var catKey = categoryIds ? categoryIds.join(',') : 'global_all';
        var cacheKey = 'all_v2_' + catKey + '_' + uLat.toFixed(3) + '_' + uLng.toFixed(3);
        var cached = getCache(cacheKey);
        if(cached) { products = cached; await afterProductsLoad(); return; }

        grid.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Loading products...</p></div>';
        try {
            var r = await zymartDB.rpc('get_smart_products', {
                p_user_lat: uLat,
                p_user_lng: uLng,
                p_user_taluka: userTaluka,
                p_category_ids: categoryIds,
                p_limit: PRIMARY_LIMIT,
                p_offset: 0
            });
            
            if (r.error) { console.error('[RPC ERROR]', r.error); }
            products = r.data || [];

            // Fallback: if category-filtered All Products is still empty, fetch general products so All is never blank
            if (products.length === 0 && categoryIds !== null) {
                var fallbackRes = await zymartDB.rpc('get_smart_products', {
                    p_user_lat: uLat,
                    p_user_lng: uLng,
                    p_user_taluka: userTaluka,
                    p_category_ids: null,
                    p_limit: PRIMARY_LIMIT,
                    p_offset: 0
                });
                if (!fallbackRes.error && fallbackRes.data) {
                    products = fallbackRes.data;
                }
            }

            if(products.length > 0) setCache(cacheKey, products);
            await afterProductsLoad();
        } catch(e) {
            console.error('Error loading products:', e);
            grid.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>Failed to Load</h3><p>' + esc(e.message) + '</p></div>';
        }
    }
    
    async function afterProductsLoad() {
        var allIds = products.map(function(p) { return p.id; });
        extraProducts.forEach(function(p) { if (allIds.indexOf(p.id) === -1) allIds.push(p.id); });
        await fetchRatingsForIds(allIds);
        checkViewOnlyMode();
        renderProducts();
        if (pendingRestoreScroll !== null) {
            var rp = $('rightProducts');
            var ls = $('leftSidebar');
            if (rp) rp.scrollTop = pendingRestoreScroll.scrollTop || 0;
            if (ls && pendingRestoreScroll.sidebarScrollTop) ls.scrollTop = pendingRestoreScroll.sidebarScrollTop;
            pendingRestoreScroll = null;
        }
    }
    
    function checkViewOnlyMode() {
        var combined = products.concat(extraProducts);
        if (combined.length === 0) {
            isViewOnlyMode = false;
            var c0 = $('viewOnlyContainer');
            if (c0) c0.innerHTML = '';
            return;
        }
        var orderableCount = combined.filter(function(p) { return p.is_orderable !== false; }).length;
        isViewOnlyMode = (orderableCount === 0);
        
        var container = $('viewOnlyContainer');
        if (container) {
            if (isViewOnlyMode) {
                container.innerHTML = '<div class="view-only-banner"><i class="fas fa-info-circle"></i><div><strong>View-Only Mode:</strong> Yeh products aapke area me deliver nahi hote. Aap inhe dekh sakte hain par order nahi kar sakte.</div></div>';
            } else {
                container.innerHTML = '';
            }
        }
    }

    async function loadProducts(scid) {
        var grid = $('productsGrid'); if(!grid) return;
        extraProducts = [];
        var uLat = parseFloat(localStorage.getItem('user_lat'));
        var uLng = parseFloat(localStorage.getItem('user_lng'));
        var userTaluka = localStorage.getItem('user_taluka') || '';
        
        if (isNaN(uLat) || isNaN(uLng) || uLat === 0 || uLng === 0) {
            grid.innerHTML = '<div class="empty-state"><i class="fas fa-map-marker-slash"></i><h3>Location Required</h3><p>Please enable location to view products.</p></div>';
            return;
        }

        var cacheKey = 'sub_v2_' + scid + '_' + uLat.toFixed(3) + '_' + uLng.toFixed(3);
        var cached = getCache(cacheKey);
        if(cached) {
            products = cached.primary || [];
            extraProducts = cached.extra || [];
            await afterProductsLoad();
            return;
        }

        grid.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Loading products...</p></div>';
        try {
            var r = await zymartDB.rpc('get_smart_products', {
                p_user_lat: uLat,
                p_user_lng: uLng,
                p_user_taluka: userTaluka,
                p_category_ids: scid ? [scid] : null,
                p_limit: PRIMARY_LIMIT,
                p_offset: 0
            });
            if (r.error) { console.error('[RPC ERROR]', r.error); }
            products = r.data || [];

            // Requirement 2: When subcategory has few products, also fetch other products to show below
            if (products.length < MIN_SUB_PRODUCTS) {
                var existingIds = {};
                products.forEach(function(p) { existingIds[p.id] = true; });

                // First try sibling subcategories under the same parent category
                var siblingIds = buildCategoryIds();
                var fetchedExtras = [];

                if (siblingIds && siblingIds.length > 1) {
                    var sibRes = await zymartDB.rpc('get_smart_products', {
                        p_user_lat: uLat,
                        p_user_lng: uLng,
                        p_user_taluka: userTaluka,
                        p_category_ids: siblingIds,
                        p_limit: EXTRA_LIMIT,
                        p_offset: 0
                    });
                    if (!sibRes.error && sibRes.data) {
                        sibRes.data.forEach(function(item) {
                            if (!existingIds[item.id]) {
                                existingIds[item.id] = true;
                                fetchedExtras.push(item);
                            }
                        });
                    }
                }

                // If still fewer than MIN_SUB_PRODUCTS total, fetch general products
                if ((products.length + fetchedExtras.length) < MIN_SUB_PRODUCTS) {
                    var genRes = await zymartDB.rpc('get_smart_products', {
                        p_user_lat: uLat,
                        p_user_lng: uLng,
                        p_user_taluka: userTaluka,
                        p_category_ids: null,
                        p_limit: EXTRA_LIMIT,
                        p_offset: 0
                    });
                    if (!genRes.error && genRes.data) {
                        genRes.data.forEach(function(item) {
                            if (!existingIds[item.id]) {
                                existingIds[item.id] = true;
                                fetchedExtras.push(item);
                            }
                        });
                    }
                }

                extraProducts = fetchedExtras;
            }

            if (products.length > 0 || extraProducts.length > 0) {
                setCache(cacheKey, { primary: products, extra: extraProducts });
            }
            await afterProductsLoad();
        } catch(e) {
            console.error('Error loading products:', e);
            grid.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>Failed to Load</h3><p>' + esc(e.message) + '</p></div>';
        }
    }

    function applyFiltersAndSort(list) {
        var sorted = list.slice();

        if (currentGenderFilter) {
            sorted = sorted.filter(function(p) {
                var combined = ((p.name || '') + ' ' + (p.brand_name || '')).toLowerCase();
                if (currentGenderFilter === 'men') {
                    return (combined.indexOf('men') !== -1 || combined.indexOf('boy') !== -1) && combined.indexOf('women') === -1;
                } else if (currentGenderFilter === 'women') {
                    return combined.indexOf('women') !== -1 || combined.indexOf('girl') !== -1 || combined.indexOf('ladies') !== -1;
                } else if (currentGenderFilter === 'kids') {
                    return combined.indexOf('kid') !== -1 || combined.indexOf('child') !== -1 || combined.indexOf('baby') !== -1;
                } else {
                    return combined.indexOf(currentGenderFilter) !== -1;
                }
            });
        }

        if (searchTerm) {
            var term = searchTerm.toLowerCase();
            sorted = sorted.filter(function(p) { return (p.name || '').toLowerCase().indexOf(term) !== -1; });
        }

        if(currentSort === 'price_low') sorted.sort(function(a,b) { return getPrice(a) - getPrice(b); });
        else if(currentSort === 'price_high') sorted.sort(function(a,b) { return getPrice(b) - getPrice(a); });
        else if(currentSort === 'discount') sorted.sort(function(a,b) { return getDiscount(b) - getDiscount(a); });
        else if(currentSort === 'popular') {
            sorted.sort(function(a, b) {
                var ra = productRatingsCache[a.id] ? productRatingsCache[a.id].avg : 0;
                var rb = productRatingsCache[b.id] ? productRatingsCache[b.id].avg : 0;
                return rb - ra;
            });
        }
        return sorted;
    }

    function buildProductCardHtml(p, cart) {
        var isClothing = (p.variant_type === 'color_size');
        var colors = isClothing ? parseColors(p) : [];
        var variants = (p.variants && Array.isArray(p.variants)) ? p.variants : [];
        var bestV = variants.length > 0 ? (variants.find(function(v) { return (v.stock||0) > 0; }) || variants[0]) : null;
        var rawImg = (p.images && p.images[0]) || p.image_url || (isClothing && colors[0] && colors[0].image_url) || '';
        var img = getFullUrl(rawImg, 160, 160);
        var img2x = getFullUrl(rawImg, 320, 320);
        var nm = jsStr(p.name);
        var shopName = shopNamesMap[p.shop_id] || 'Partner';
        var shopNameEsc = jsStr(shopName);
        var isOffer = p.is_offer === true;
        var isWishlisted = isInWishlist(p.id);
        var ratingHtml = getRatingHtml(p.id);
        var isShopNearby = (p.is_orderable !== false);

        var price = 0, original = 0, dis = 0, wt = '', isOut = false, sizeRange = '', sizeTypeLabel = '';
        var cartWeight = '', cartUnit = '';
        if (isClothing) {
            var range = getClothingPriceRange(colors);
            var origRange = null;
            try {
                var prices = [];
                colors.forEach(function(c) { (c.sizes || []).forEach(function(s) { if (s.price > 0) prices.push(parseFloat(s.price)); }); });
                if (prices.length) origRange = { min: Math.min.apply(null, prices) };
            } catch(e) {}
            price = range ? range.min : 0;
            original = origRange ? origRange.min : price;
            dis = getClothingDiscount(colors);
            sizeRange = getSizeRangeText(colors);
            sizeTypeLabel = getSizeTypeLabel(p.size_type || 'adult');
            isOut = getClothingTotalStock(colors) <= 0;
        } else {
            price = bestV ? (bestV.offer_price || bestV.price) : (p.offer_price || p.price);
            original = bestV ? bestV.price : p.price;
            dis = price && original && price < original ? Math.round((1 - price/original) * 100) : 0;
            wt = bestV ? fmtWeight(bestV.weight, bestV.weight_unit || bestV.unit || p.weight_unit || p.unit) : fmtWeight(p.weight, p.weight_unit || p.unit);
            cartWeight = bestV ? (bestV.weight || p.weight || '') : (p.weight || '');
            cartUnit = bestV ? (bestV.weight_unit || bestV.unit || p.weight_unit || p.unit || '') : (p.weight_unit || p.unit || '');
            var effectiveStock = bestV ? (bestV.stock || 0) : (p.stock || 0);
            isOut = effectiveStock <= 0;
        }
        var ci = cart.find(function(x) { return x.id === p.id; });
        var cq = ci ? (ci.quantity || 1) : 0;
        var priceDisplay = '₹' + Number(price).toLocaleString('en-IN');
        if (isClothing && range && range.min !== range.max) priceDisplay = '₹' + Number(range.min).toLocaleString('en-IN') + '-₹' + Number(range.max).toLocaleString('en-IN');
        
        var html = '<div class="product-card" onclick="openProduct(\'' + p.id + '\')">';
        html += '<div class="product-img">';
        if(dis > 0) html += '<span class="discount-tag">' + dis + '% OFF</span>';
        if(isOffer && !isClothing) html += '<span class="offer-tag">🎁</span>';
        if(isClothing && sizeTypeLabel) html += '<span class="size-type-badge">' + sizeTypeLabel + '</span>';
        if(wt) html += '<span class="weight-tag">' + wt + '</span>';
        if(shopName) html += '<span class="shop-tag">🏪 ' + esc(shopName) + '</span>';
        html += '<button class="wishlist-btn' + (isWishlisted ? ' wishlisted' : '') + '" onclick="event.stopPropagation();toggleWishlist(\'' + p.id + '\')"><i class="' + (isWishlisted ? 'fas' : 'far') + ' fa-heart"></i></button>';
        if(isOut) html += '<div class="out-of-stock-overlay"><span>Out of Stock</span></div>';
        
        if(img) {
            html += '<img src="' + attrEsc(img) + '" srcset="' + attrEsc(img) + ' 1x, ' + attrEsc(img2x) + ' 2x" width="160" height="160" loading="lazy" decoding="async" alt="' + attrEsc(p.name) + '">';
        } else {
            html += '<i class="fas fa-box" style="font-size:30px;color:#D1D5DB;"></i>';
        }
        html += '</div>';
        html += '<div class="product-info">';
        html += '<div class="product-name">' + esc(p.name) + '</div>';
        if(p.brand_name) html += '<div class="product-brand">' + esc(p.brand_name) + '</div>';
        html += ratingHtml;
        if (isClothing) {
            if (colors.length > 0) {
                html += '<div class="color-swatches-row">';
                colors.slice(0, 4).forEach(function(c) { html += '<span class="color-dot" style="background:' + getColorHex(c.name) + '" title="' + attrEsc(c.name) + '"></span>'; });
                if (colors.length > 4) html += '<span class="color-more">+' + (colors.length - 4) + '</span>';
                html += '</div>';
            }
            if (sizeRange) html += '<div class="size-range-text">📏 ' + esc(sizeRange) + '</div>';
        } else if(wt) {
            html += '<div class="product-weight">' + wt + '</div>';
        }
        html += '<div class="product-price-row">';
        html += '<div class="price-group"><span class="product-price">' + priceDisplay + '</span>';
        if(dis > 0 && !isClothing) html += '<span class="original-price">₹' + Number(original).toLocaleString('en-IN') + '</span>';
        html += '</div>';
        
        if(isOut) {
            html += '<button class="add-btn disabled" disabled>Out</button>';
        } else if (!isShopNearby) {
            html += '<button class="add-btn disabled" style="background:#FEF2F2;color:#EF4444;border-color:#FECACA;" onclick="event.stopPropagation();showServiceAreaMsg()">📍</button>';
        } else if (isClothing) {
            html += '<button class="select-btn" onclick="event.stopPropagation();openProduct(\'' + p.id + '\')">Select ›</button>';
        } else if(cq > 0) {
            html += '<div class="qty-controls"><button class="qty-btn" onclick="event.stopPropagation();updateQty(\'' + p.id + '\',-1)">−</button><span class="qty-count">' + cq + '</span><button class="qty-btn" onclick="event.stopPropagation();updateQty(\'' + p.id + '\',1)">+</button></div>';
        } else {
            html += '<button class="add-btn" onclick="event.stopPropagation();addToCart(\'' + p.id + '\',\'' + nm + '\',' + price + ',\'' + img + '\',\'' + cartWeight + '\',\'' + cartUnit + '\',\'' + (p.shop_id || '') + '\',\'' + shopNameEsc + '\')">ADD</button>';
        }
        html += '</div></div></div>';
        return html;
    }
    
    function renderProducts() {
        var grid = $('productsGrid'); if(!grid) return;
        if(!products.length && !extraProducts.length) {
            var emptyName = searchTerm ? '"' + esc(searchTerm) + '"' : (currentSubName || currentCategoryName || '');
            grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-box-open" style="font-size:40px;color:#D1D5DB;display:block;margin-bottom:10px;"></i><h3>No Products Found</h3><p>' + (emptyName ? emptyName + ' mein koi product nahi' : 'Try a different category') + '</p></div>';
            return;
        }
        
        var sortedPrimary = applyFiltersAndSort(products);
        var sortedExtra = (!isAllProducts && extraProducts.length > 0) ? applyFiltersAndSort(extraProducts) : [];

        if (sortedPrimary.length === 0 && sortedExtra.length === 0) {
            grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-filter" style="font-size:40px;color:#D1D5DB;display:block;margin-bottom:10px;"></i><h3>No Matching Products</h3><p>Try changing filters or search term</p></div>';
            return;
        }

        var cart = CartManager.getCart();
        var html = '';

        sortedPrimary.forEach(function(p) {
            html += buildProductCardHtml(p, cart);
        });

        if (sortedExtra.length > 0) {
            html += '<div class="section-divider"><span>✨ More Products You May Like</span></div>';
            sortedExtra.forEach(function(p) {
                html += buildProductCardHtml(p, cart);
            });
        }

        grid.innerHTML = html;
    }
    
    window.showServiceAreaMsg = function() { showToast('📍 Aapke area mein delivery available nahi hai.'); };

    function getPrice(p) {
        if (p.variant_type === 'color_size') { var r = getClothingPriceRange(parseColors(p)); return r ? r.min : 0; }
        var variants = (p.variants && Array.isArray(p.variants)) ? p.variants : [];
        var bestV = variants.length > 0 ? (variants.find(function(v) { return (v.stock||0) > 0; }) || variants[0]) : null;
        return bestV ? (bestV.offer_price || bestV.price) : (p.offer_price || p.price);
    }
    function getDiscount(p) {
        if (p.variant_type === 'color_size') return getClothingDiscount(parseColors(p));
        var variants = (p.variants && Array.isArray(p.variants)) ? p.variants : [];
        var bestV = variants.length > 0 ? (variants.find(function(v) { return (v.stock||0) > 0; }) || variants[0]) : null;
        var price = bestV ? (bestV.offer_price || bestV.price) : (p.offer_price || p.price);
        var original = bestV ? bestV.price : p.price;
        return price && original && price < original ? Math.round((1 - price/original) * 100) : 0;
    }
    
    window.addToCart = function(id, name, price, img, weight, unit, shopId, shopName) {
        CartManager.addToCart({ id: id, variantKey: id + '_' + weight + '_' + unit, name: name, price: price, image: img, variantWeight: weight || null, variantUnit: unit || null, shop_id: shopId || null, shop_name: shopName || null });
        renderProducts();
        showToast('🛒 Added to cart!');
    };
    
    window.updateQty = function(id, delta) { CartManager.updateQuantity(id, delta); renderProducts(); };
    
    window.showFilterSheet = function(type) {
        var sheet = $('filterSheet'), title = $('sheetTitle'), content = $('sheetContent');
        var html = '';
        if (type === 'sort') {
            title.textContent = 'Sort By';
            var sorts = [
                { id: 'popular', name: 'Popular', icon: 'fa-fire' },
                { id: 'price_low', name: 'Price: Low to High', icon: 'fa-arrow-up' },
                { id: 'price_high', name: 'Price: High to Low', icon: 'fa-arrow-down' },
                { id: 'discount', name: 'Discount', icon: 'fa-percent' }
            ];
            sorts.forEach(function(s) {
                html += '<div class="sheet-option" onclick="setSort(\'' + s.id + '\')"><span class="sheet-option-text"><i class="fas ' + s.icon + '" style="margin-right:8px;color:#9CA3AF;"></i>' + s.name + '</span>' + (currentSort === s.id ? '<i class="fas fa-check-circle"></i>' : '') + '</div>';
            });
        } else if (type === 'category') {
            title.textContent = 'Select Sub-Category';
            html += '<div class="sheet-option" onclick="selectAllProducts();closeFilterSheet();"><span class="sheet-option-text">All Products</span>' + (isAllProducts ? '<i class="fas fa-check-circle"></i>' : '') + '</div>';
            subCategories.forEach(function(sc) {
                html += '<div class="sheet-option" onclick="selectSubCategory(\'' + sc.id + '\',\'' + jsStr(sc.name) + '\');closeFilterSheet();"><span class="sheet-option-text">' + esc(sc.name) + '</span>' + (!isAllProducts && currentSubId === sc.id ? '<i class="fas fa-check-circle"></i>' : '') + '</div>';
            });
        } else if (type === 'gender') {
            title.textContent = 'Select Gender';
            var genders = ['Men', 'Women', 'Kids', 'Unisex'];
            html += '<div class="sheet-option" onclick="setGender(null)"><span class="sheet-option-text">All Genders</span>' + (!currentGenderFilter ? '<i class="fas fa-check-circle"></i>' : '') + '</div>';
            genders.forEach(function(g) {
                var val = g.toLowerCase();
                html += '<div class="sheet-option" onclick="setGender(\'' + val + '\')"><span class="sheet-option-text">' + g + '</span>' + (currentGenderFilter === val ? '<i class="fas fa-check-circle"></i>' : '') + '</div>';
            });
        } else if (type === 'filter') {
            title.textContent = 'Filter';
            html += '<div class="sheet-option"><span class="sheet-option-text">More filters coming soon...</span></div>';
        }
        content.innerHTML = html;
        sheet.classList.add('show');
    };
    
    window.closeFilterSheet = function(event) {
        if (event && event.target !== $('filterSheet')) return;
        $('filterSheet').classList.remove('show');
    };
    
    window.setSort = function(sort) {
        currentSort = sort;
        $('btnSort').innerHTML = '<i class="fas fa-sort"></i> ' + (sort === 'popular' ? 'Popular' : sort === 'price_low' ? 'Price ↑' : sort === 'price_high' ? 'Price ↓' : 'Discount') + ' <i class="fas fa-chevron-down" style="font-size:9px;margin-left:2px;"></i>';
        $('btnSort').classList.add('active');
        closeFilterSheet();
        savePageState();
        renderProducts();
    };

    window.setGender = function(gender) {
        currentGenderFilter = gender;
        if (gender) {
            $('btnGender').innerHTML = '<i class="fas fa-venus-mars"></i> ' + (gender.charAt(0).toUpperCase() + gender.slice(1)) + ' <i class="fas fa-chevron-down" style="font-size:9px;margin-left:2px;"></i>';
            $('btnGender').classList.add('active');
        } else {
            $('btnGender').innerHTML = '<i class="fas fa-venus-mars"></i> Gender <i class="fas fa-chevron-down" style="font-size:9px;margin-left:2px;"></i>';
            $('btnGender').classList.remove('active');
        }
        closeFilterSheet();
        savePageState();
        renderProducts();
    };
    
    window.clearFilters = function() {
        setSort('popular');
        currentGenderFilter = null;
        $('btnGender').innerHTML = '<i class="fas fa-venus-mars"></i> Gender <i class="fas fa-chevron-down" style="font-size:9px;margin-left:2px;"></i>';
        $('btnGender').classList.remove('active');
        selectAllProducts();
        closeFilterSheet();
    };
    
    function toggleSearch() { var sb = $('searchBar'); if(sb) sb.classList.toggle('show'); if(sb.classList.contains('show')) $('searchInput').focus(); }
    function handleSearch(val) { searchTerm = val.trim(); savePageState(); renderProducts(); }
    
    function openProduct(id) {
        if (!id) return;
        savePageState();
        window.location.href = 'product-detail.html?id=' + id;
    }
    
    window.toggleWishlist = function(id) {
        var wishlist = safeGet('zymart_wishlist', []);
        var idx = wishlist.indexOf(id);
        if(idx === -1) wishlist.push(id);
        else wishlist.splice(idx, 1);
        safeSet('zymart_wishlist', wishlist);
        wishlistIds = wishlist;
        renderProducts();
        showToast(idx === -1 ? '❤️ Added to wishlist' : '💔 Removed from wishlist');
    };
    
    async function init() {
        if (!navigator.onLine) { var nb = $('netBanner'); if (nb) nb.style.display = 'block'; }
        
        var uLat = parseFloat(localStorage.getItem('user_lat'));
        var uLng = parseFloat(localStorage.getItem('user_lng'));
        if (isNaN(uLat) || isNaN(uLng) || uLat === 0 || uLng === 0) {
            window.location.href = 'index.html';
            return;
        }

        CartManager.updateBadge();
        loadWishlistState();
        getUrlParams();
        await Promise.all([loadShopNamesMap(), loadSubCategories()]);
    }
    
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();

    // Save scroll position smoothly when scrolling products or navigating away
    var scrollSaveTimer = null;
    window.addEventListener('pagehide', savePageState);
    document.addEventListener('DOMContentLoaded', function() {
        var rp = $('rightProducts');
        if (rp) {
            rp.addEventListener('scroll', function() {
                clearTimeout(scrollSaveTimer);
                scrollSaveTimer = setTimeout(savePageState, 150);
            }, { passive: true });
        }
    });
    
    window.addEventListener('storage', function(e) {
        if(e.key === 'zymart_cart') CartManager.updateBadge();
        if(e.key === 'zymart_wishlist') { loadWishlistState(); renderProducts(); }
    });
    
    window.toggleSearch = toggleSearch;
    window.handleSearch = handleSearch;
    window.selectSubCategory = selectSubCategory;
    window.selectAllProducts = selectAllProducts;
    window.openProduct = openProduct;
    window.addToCart = addToCart;
    window.updateQty = updateQty;
    window.setSort = setSort;
    window.setGender = setGender;
    window.toggleWishlist = toggleWishlist;
    window.showFilterSheet = showFilterSheet;
    window.closeFilterSheet = closeFilterSheet;
    window.clearFilters = clearFilters;
    window.CartManager = CartManager;
})();
</script>
</body>
</html>
