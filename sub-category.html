    function calcDist(l1, n1, l2, n2) {
        var R = 6371; var dLa = (l2-l1)*Math.PI/180; var dLn = (n2-n1)*Math.PI/180;
        var a = Math.sin(dLa/2)*Math.sin(dLa/2) + Math.cos(l1*Math.PI/180)*Math.cos(l2*Math.PI/180)*Math.sin(dLn/2)*Math.sin(dLn/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            var userLat = latRaw ? parseFloat(latRaw) : null, userLng = lngRaw ? parseFloat(lngRaw) : null;

    async function fetchRatingsForIds(ids) {
        if (!ids || !ids.length) return;
        var missing = ids.filter(function(id) { return productRatingsCache[id] === undefined; });
        if (!missing.length) return;
        try {
            var r = await zymartDB.from('product_reviews').select('product_id, rating').in('product_id', missing).eq('admin_hidden', false);
            for (var i = 0; i < missing.length; i++) { if (productRatingsCache[missing[i]] === undefined) productRatingsCache[missing[i]] = { avg: 0, count: 0 }; }
            if (r && r.data && r.data.length > 0) {
                var temp = {};
                r.data.forEach(function(rv) { if (!temp[rv.product_id]) temp[rv.product_id] = { sum: 0, count: 0 }; temp[rv.product_id].sum += parseInt(rv.rating) || 0; temp[rv.product_id].count++; });
                Object.keys(temp).forEach(function(pid) { productRatingsCache[pid] = { avg: temp[pid].sum / temp[pid].count, count: temp[pid].count }; });
            }
        } catch(e) {
            for (var i = 0; i < missing.length; i++) { if (productRatingsCache[missing[i]] === undefined) productRatingsCache[missing[i]] = { avg: 0, count: 0 }; }
        }
    }

    async function loadAllProducts() {
        var grid = $('productsGrid'); if(!grid) return;
        hideSimilarSection();
        var cacheKey = 'all_' + (currentCategoryId || 'none') + '_' + (nearbyShopIds.join(',') || 'all');
        var cached = getCache(cacheKey);
        if(cached && !searchTerm) { products = cached; await afterProductsLoad(); return; }
        grid.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Loading products...</p></div>';
        try {
            var q = zymartDB.from('products').select(PRODUCT_COLS).eq('is_active', true).eq('is_on_hold', false).eq('delete_requested', false).is('parent_id', null);
            if (nearbyShopIds.length > 0) q = q.in('shop_id', nearbyShopIds);
            if(currentCategoryId && subCategories.length > 0) { var subIds = subCategories.map(function(sc) { return sc.id; }); q = q.in('category_id', subIds); }
            else if(currentCategoryId) q = q.eq('category_id', currentCategoryId);
            else if(currentSubId) q = q.eq('category_id', currentSubId);

            if(products.length === 0 && nearbyShopIds.length > 0) {
                var fq = zymartDB.from('products').select(PRODUCT_COLS).eq('is_active', true).eq('is_on_hold', false).eq('delete_requested', false).is('parent_id', null);

                else if(currentSubId) fq = fq.eq('category_id', currentSubId);
                fq = fq.limit(100);
                var fr = await fq;
                products = fr.data || [];

            await afterProductsLoad();
        } catch(e) { console.error('Error loading products:', e); grid.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>Failed to Load</h3><p>Check your connection</p></div>'; }

        var variants = (p.variants && Array.isArray(p.variants)) ? p.variants : [];
        var bestV = variants.length > 0 ? (variants.find(function(v) { return (v.stock||0) > 0; }) || variants[0]) : null;
        var img = getFullUrl((p.images && p.images[0]) || p.image_url || (isClothing && colors[0] && colors[0].image_url) || '', 250);
        var price = 0, original = 0, dis = 0, isOut = false;
        if (isClothing) {
            var range = getClothingPriceRange(colors);
            price = range ? range.min : 0;
            original = price;
            dis = getClothingDiscount(colors);
            isOut = getClothingTotalStock(colors) <= 0;
        } else {
            price = bestV ? (bestV.offer_price || bestV.price) : (p.offer_price || p.price);
            original = bestV ? bestV.price : p.price;
            dis = price && original && price < original ? Math.round((1 - price/original) * 100) : 0;
            isOut = (bestV ? (bestV.stock || 0) : (p.stock || 0)) <= 0;
        }
        var ratingHtml = getRatingHtml(p.id);
        var priceDisplay = '₹' + Number(price).toLocaleString('en-IN');
        if (isClothing && range && range.min !== range.max) priceDisplay = '₹' + Number(range.min).toLocaleString('en-IN') + '-₹' + Number(range.max).toLocaleString('en-IN');
        var html = '<div class="product-card" onclick="openProduct(\'' + p.id + '\')">';
        html += '<div class="product-img">';
        if (dis > 0) html += '<span class="discount-tag">' + dis + '% OFF</span>';
        if (isOut) html += '<div class="out-of-stock-overlay"><span>Out of Stock</span></div>';
        html += img ? '<img src="' + img + '" loading="lazy" decoding="async" alt="' + esc(p.name) + '">' : '<i class="fas fa-box" style="font-size:30px;color:#D1D5DB;"></i>';
        html += '</div>';
        html += '<div class="product-info">';
        html += '<div class="product-name">' + esc(p.name) + '</div>';
        html += ratingHtml;
        html += '<div class="product-price-row"><span class="product-price">' + priceDisplay + '</span></div>';
        html += '</div></div>';
        return html;
    }
    
    function renderEmptyWithSimilarCategories() {
        var grid = $('productsGrid');
        var section = $('similarSection');
        grid.innerHTML = '<div class="empty-suggestions" style="grid-column:1/-1;"><i class="fas fa-box-open" style="font-size:40px;color:#D1D5DB;display:block;margin-bottom:10px;"></i><h3>No Products Here</h3><p>' + esc(currentSubName || 'This category') + ' mein abhi products nahi hain</p></div>';
        if (!section || !subCategories.length) return;
        var siblingSubs = subCategories.filter(function(s) { return s.id !== currentSubId; }).slice(0, 6);
        if (!siblingSubs.length) { hideSimilarSection(); return; }
        var html = '<div class="similar-section">';
        html += '<div class="similar-header"><h3>🎯 Explore Similar Categories</h3></div>';
        html += '<div class="similar-cat-grid">';
        siblingSubs.forEach(function(sc) {
            var scImg = getFullUrl(sc.image_url, 100);
            var safeName = jsStr(sc.name);
            html += '<div class="similar-cat-card" onclick="selectSubCategory(\'' + sc.id + '\',\'' + safeName + '\')">';
            html += '<div class="similar-cat-img">';
            if (scImg) html += '<img src="' + scImg + '" loading="lazy" decoding="async">';
            else html += '<i class="fas fa-shopping-basket"></i>';
            html += '</div>';
            html += '<div class="similar-cat-name">' + esc(sc.name) + '</div>';
            html += '</div>';
        });
        html += '</div></div>';
        section.innerHTML = html;
        section.style.display = 'block';
    }
    
    function renderProducts() {
        var grid = $('productsGrid'); if(!grid) return;
        if(!products.length) {
            var emptyName = searchTerm ? '"' + esc(searchTerm) + '"' : (currentSubName || currentCategoryName || '');
            grid.innerHTML = '<div class="empty-suggestions" style="grid-column:1/-1;"><i class="fas fa-box-open" style="font-size:40px;color:#D1D5DB;display:block;margin-bottom:10px;"></i><h3>No Products Found</h3><p>' + (emptyName ? emptyName + ' mein koi product nahi' : 'Try a different category') + '</p></div>';
            return;
        }
        var sorted = products.slice();
        if(currentSort === 'price_low') sorted.sort(function(a,b) { return getPrice(a) - getPrice(b); });
        else if(currentSort === 'price_high') sorted.sort(function(a,b) { return getPrice(b) - getPrice(a); });
        else if(currentSort === 'discount') sorted.sort(function(a,b) { return getDiscount(b) - getDiscount(a); });
        else if(currentSort === 'popular') {
            sorted.sort(function(a, b) {
                var ra = productRatingsCache[a.id] ? productRatingsCache[a.id].avg : 0;
                var rb = productRatingsCache[b.id] ? productRatingsCache[b.id].avg : 0;
                return rb - ra;
            });
        }
        var cart = CartManager.getCart();
        var html = '';
        sorted.forEach(function(p) {
            var isClothing = (p.variant_type === 'color_size');
            var colors = isClothing ? parseColors(p) : [];
            var variants = (p.variants && Array.isArray(p.variants)) ? p.variants : [];
            var bestV = variants.length > 0 ? (variants.find(function(v) { return (v.stock||0) > 0; }) || variants[0]) : null;
            var img = getFullUrl((p.images && p.images[0]) || p.image_url || (isClothing && colors[0] && colors[0].image_url) || '', 250);
            var nm = jsStr(p.name);
            var shopName = shopNamesMap[p.shop_id] || 'Shop';
            var shopNameEsc = jsStr(shopName);
            var isOffer = p.is_offer === true;
            var isWishlisted = isInWishlist(p.id);
            var ratingHtml = getRatingHtml(p.id);
            var price = 0, original = 0, dis = 0, wt = '', isOut = false, sizeRange = '', sizeTypeLabel = '';
            var cartWeight = '', cartUnit = '';
            if (isClothing) {
                var range = getClothingPriceRange(colors);
                var origRange = null;
                try {
                    var prices = [];
                    colors.forEach(function(c) { (c.sizes || []).forEach(function(s) { if (s.price > 0) prices.push(parseFloat(s.price)); }); });
                    if (prices.length) origRange = { min: Math.min.apply(null, prices) };
                } catch(e) {}
                price = range ? range.min : 0;
                original = origRange ? origRange.min : price;
                dis = getClothingDiscount(colors);
                sizeRange = getSizeRangeText(colors);
                sizeTypeLabel = getSizeTypeLabel(p.size_type || 'adult');
                isOut = getClothingTotalStock(colors) <= 0;
            } else {
                price = bestV ? (bestV.offer_price || bestV.price) : (p.offer_price || p.price);
                original = bestV ? bestV.price : p.price;
                dis = price && original && price < original ? Math.round((1 - price/original) * 100) : 0;
                wt = bestV ? fmtWeight(bestV.weight, bestV.weight_unit || bestV.unit || p.weight_unit || p.unit) : fmtWeight(p.weight, p.weight_unit || p.unit);
                cartWeight = bestV ? (bestV.weight || p.weight || '') : (p.weight || '');
                cartUnit = bestV ? (bestV.weight_unit || bestV.unit || p.weight_unit || p.unit || '') : (p.weight_unit || p.unit || '');
                isOut = (bestV ? (bestV.stock || 0) : (p.stock || 0)) <= 0;
            }
            var ci = cart.find(function(x) { return x.id === p.id; });
            var cq = ci ? (ci.quantity || 1) : 0;
            var priceDisplay = '₹' + Number(price).toLocaleString('en-IN');
            if (isClothing && range && range.min !== range.max) priceDisplay = '₹' + Number(range.min).toLocaleString('en-IN') + '-₹' + Number(range.max).toLocaleString('en-IN');
            html += '<div class="product-card" onclick="openProduct(\'' + p.id + '\')">';
            html += '<div class="product-img">';
            if(dis > 0) html += '<span class="discount-tag">' + dis + '% OFF</span>';
            if(isOffer && !isClothing) html += '<span class="offer-tag">🎁</span>';
            if(isClothing && sizeTypeLabel) html += '<span class="size-type-badge">' + sizeTypeLabel + '</span>';
            if(wt) html += '<span class="weight-tag">' + wt + '</span>';
            if(shopName) html += '<span class="shop-tag">🏪 ' + esc(shopName) + '</span>';
            html += '<button class="wishlist-btn' + (isWishlisted ? ' wishlisted' : '') + '" onclick="event.stopPropagation();toggleWishlist(\'' + p.id + '\')"><i class="' + (isWishlisted ? 'fas' : 'far') + ' fa-heart"></i></button>';
            if(isOut) html += '<div class="out-of-stock-overlay"><span>Out of Stock</span></div>';
            html += img ? '<img src="' + img + '" loading="lazy" decoding="async" alt="' + esc(p.name) + '">' : '<i class="fas fa-box" style="font-size:30px;color:#D1D5DB;"></i>';
            html += '</div>';
            html += '<div class="product-info">';
            html += '<div class="product-name">' + esc(p.name) + '</div>';
            if(p.brand_name) html += '<div class="product-brand">' + esc(p.brand_name) + '</div>';
            html += ratingHtml;
            if (isClothing) {
                if (colors.length > 0) {
                    html += '<div class="color-swatches-row">';
                    colors.slice(0, 4).forEach(function(c) { html += '<span class="color-dot" style="background:' + getColorHex(c.name) + '" title="' + esc(c.name) + '"></span>'; });
                    if (colors.length > 4) html += '<span class="color-more">+' + (colors.length - 4) + '</span>';
                    html += '</div>';
                }
                if (sizeRange) html += '<div class="size-range-text">📏 ' + esc(sizeRange) + '</div>';
            } else if(wt) {
                html += '<div class="product-weight">' + wt + '</div>';
            }
            html += '<div class="product-price-row">';
            html += '<div class="price-group"><span class="product-price">' + priceDisplay + '</span>';
            if(dis > 0 && !isClothing) html += '<span class="original-price">₹' + Number(original).toLocaleString('en-IN') + '</span>';
            html += '</div>';
            if(isOut) {
                html += '<button class="add-btn disabled" disabled>Out</button>';
            } else if (isClothing) {
                html += '<button class="select-btn" onclick="event.stopPropagation();openProduct(\'' + p.id + '\')">Select ›</button>';
            } else if(cq > 0) {
                html += '<div class="qty-controls"><button class="qty-btn" onclick="event.stopPropagation();updateQty(\'' + p.id + '\',-1)">−</button><span class="qty-count">' + cq + '</span><button class="qty-btn" onclick="event.stopPropagation();updateQty(\'' + p.id + '\',1)">+</button></div>';
            } else {
                html += '<button class="add-btn" onclick="event.stopPropagation();addToCart(\'' + p.id + '\',\'' + nm + '\',' + price + ',\'' + img + '\',\'' + cartWeight + '\',\'' + cartUnit + '\',\'' + (p.shop_id || '') + '\',\'' + shopNameEsc + '\')">ADD</button>';
            }
            html += '</div></div></div>';
        });
        grid.innerHTML = html;
    }
    
    function getPrice(p) {
        if (p.variant_type === 'color_size') { var r = getClothingPriceRange(parseColors(p)); return r ? r.min : 0; }
        var variants = (p.variants && Array.isArray(p.variants)) ? p.variants : [];
        var bestV = variants.length > 0 ? (variants.find(function(v) { return (v.stock||0) > 0; }) || variants[0]) : null;
        return bestV ? (bestV.offer_price || bestV.price) : (p.offer_price || p.price);
    }
    function getDiscount(p) {
        if (p.variant_type === 'color_size') return getClothingDiscount(parseColors(p));
        var variants = (p.variants && Array.isArray(p.variants)) ? p.variants : [];
        var bestV = variants.length > 0 ? (variants.find(function(v) { return (v.stock||0) > 0; }) || variants[0]) : null;
        var price = bestV ? (bestV.offer_price || bestV.price) : (p.offer_price || p.price);
        var original = bestV ? bestV.price : p.price;
        return price && original && price < original ? Math.round((1 - price/original) * 100) : 0;
    }
    
    window.addToCart = function(id, name, price, img, weight, unit, shopId, shopName) {
        CartManager.addToCart({ id: id, variantKey: id + '_' + weight + '_' + unit, name: name, price: price, image: img, variantWeight: weight || null, variantUnit: unit || null, shop_id: shopId || null, shop_name: shopName || null });
        renderProducts();
        showToast('🛒 Added to cart!');
    };
    
    window.updateQty = function(id, delta) { CartManager.updateQuantity(id, delta); renderProducts(); };
    window.setSort = function(sort, btn) { currentSort = sort; var chips = document.querySelectorAll('.filter-chip'); chips.forEach(function(c) { c.classList.remove('active'); }); if(btn) btn.classList.add('active'); renderProducts(); };
    
    function toggleSearch() { var sb = $('searchBar'); if(sb) sb.classList.toggle('show'); if(sb.classList.contains('show')) $('searchInput').focus(); }
    function handleSearch(val) { searchTerm = val.trim(); if(isAllProducts) loadAllProducts(); else if(currentSubId) loadProducts(currentSubId); else loadAllProducts(); }
    function openProduct(id) { if(id) window.location.href = 'product-detail.html?id=' + id; }
    
    window.toggleWishlist = function(id) {
        var wishlist = safeGet('zymart_wishlist', []);
        var idx = wishlist.indexOf(id);
        if(idx === -1) wishlist.push(id);
        else wishlist.splice(idx, 1);
        safeSet('zymart_wishlist', wishlist);
        wishlistIds = wishlist;
        renderProducts();
        showToast(idx === -1 ? '❤️ Added to wishlist' : '💔 Removed from wishlist');
    };
    
    async function init() {
        CartManager.updateBadge();
        loadWishlistState();
        getUrlParams();
        await findNearbyShops();
        await loadSubCategories();
    }
    
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
    
    window.addEventListener('storage', function(e) {
        if(e.key === 'zymart_cart') CartManager.updateBadge();
        if(e.key === 'zymart_wishlist') { loadWishlistState(); renderProducts(); }
    });
    
    window.toggleSearch = toggleSearch;
    window.handleSearch = handleSearch;
    window.selectSubCategory = selectSubCategory;
    window.selectAllProducts = selectAllProducts;
    window.openProduct = openProduct;
    window.addToCart = addToCart;
    window.updateQty = updateQty;
    window.setSort = setSort;
    window.toggleWishlist = toggleWishlist;
    window.closeServicePopup = closeServicePopup;
    window.CartManager = CartManager;
})();
</script>
</body>
</html>
