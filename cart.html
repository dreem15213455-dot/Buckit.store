<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Cart - ZyMart+</title>
    <meta name="theme-color" content="#0B5A31">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --brand-green: #0B5A31; --brand-green-dark: #083D21; --brand-orange: #F59E0B; --neutral-white: #FFFFFF; --neutral-bg: #F9FAFB; --neutral-border: #E5E7EB; --neutral-gray: #6B7280; --neutral-dark: #1A1A1A; --danger: #EF4444; --success: #10B981; --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); --shadow-sm: 0 1px 4px rgba(0,0,0,0.06); --shadow-md: 0 4px 16px rgba(0,0,0,0.08); --radius-sm: 10px; --radius-md: 14px; --radius-lg: 18px; --radius-full: 9999px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter',-apple-system,sans-serif; background: var(--neutral-bg); color: var(--neutral-dark); padding-bottom: 100px; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; min-height: 100vh; }
        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100px); opacity: 0; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .top-bar { background: var(--brand-green); position: fixed; top: 0; left: 0; width: 100%; z-index: 100; padding: 10px 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 16px rgba(11,90,49,0.3); }
        .back-btn { width: 36px; height: 36px; background: rgba(255,255,255,0.10); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 14px; text-decoration: none; }
        .back-btn:active { background: rgba(255,255,255,0.20); transform: scale(0.93); }
        .top-title { font-family: 'Poppins',sans-serif; flex: 1; font-size: 16px; font-weight: 700; color: white; }
        .top-count { font-size: 11px; color: rgba(255,255,255,0.75); background: rgba(255,255,255,0.12); padding: 4px 10px; border-radius: var(--radius-full); }
        .main-content { padding-top: 58px; }
        
        .shop-group { margin-bottom: 8px; }
        .shop-group-header { padding: 8px 14px; font-size: 12px; font-weight: 600; color: var(--brand-green); background: #EDF7F1; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid #C8E6C9; }
        .shop-group-header .nearby-tag { background: #0B5A31; color: white; font-size: 8px; padding: 2px 6px; border-radius: 9999px; margin-left: 4px; }
        
        .multi-shop-warning { margin: 10px 14px; padding: 10px 14px; background: #FFF8EB; border: 1px solid #FDE68A; border-radius: var(--radius-md); font-size: 11px; color: #92400E; display: flex; align-items: center; gap: 8px; }
        .multi-shop-warning i { font-size: 16px; flex-shrink: 0; }
        
        .cart-items { padding: 0 14px; }
        .cart-item { background: white; border-radius: var(--radius-md); padding: 12px; margin-bottom: 8px; display: flex; gap: 10px; align-items: center; border: 1px solid var(--neutral-border); box-shadow: var(--shadow-xs); animation: slideUp 0.3s ease; position: relative; }
        .cart-item.removing { animation: slideOut 0.25s ease forwards; }
        .cart-item .item-image { width: 70px; height: 70px; border-radius: var(--radius-sm); background: var(--neutral-bg); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
        .cart-item .item-image img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
        .item-details { flex: 1; min-width: 0; }
        .item-name { font-size: 13px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .item-variant { font-size: 10px; color: var(--brand-green); font-weight: 600; background: #EDF7F1; display: inline-block; padding: 2px 7px; border-radius: 9999px; margin-top: 3px; }
        .item-shop { font-size: 9px; color: var(--neutral-gray); font-weight: 500; margin-top: 2px; }
        .item-price-row { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
        .item-price { font-size: 15px; font-weight: 700; color: var(--brand-green-dark); }
        .item-total { font-size: 11px; color: var(--neutral-gray); }
        .item-stock-warn { font-size: 9px; color: #EF4444; font-weight: 600; margin-top: 2px; }
        .qty-control { display: flex; align-items: center; gap: 6px; background: var(--neutral-bg); border-radius: var(--radius-full); padding: 3px; flex-shrink: 0; }
        .qty-btn { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--neutral-border); background: white; cursor: pointer; font-size: 14px; font-weight: 700; color: var(--brand-green); display: flex; align-items: center; justify-content: center; transition: all 0.15s ease; }
        .qty-btn:active { background: #EDF7F1; border-color: var(--brand-green); }
        .qty-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .qty-value { font-size: 14px; font-weight: 700; min-width: 20px; text-align: center; }
        .remove-btn { position: absolute; top: 6px; right: 6px; background: #FEF2F2; border: none; color: #EF4444; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; font-size: 9px; display: flex; align-items: center; justify-content: center; }
        .remove-btn:active { background: #FEE2E2; transform: scale(0.9); }
        
        .bill-section { background: white; margin: 14px; border-radius: var(--radius-md); padding: 14px; border: 1px solid var(--neutral-border); box-shadow: var(--shadow-xs); }
        .bill-title { font-family: 'Poppins',sans-serif; font-size: 14px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        .bill-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; color: var(--neutral-gray); }
        .bill-row.total { border-top: 2px solid var(--neutral-dark); padding-top: 12px; margin-top: 10px; font-size: 16px; font-weight: 800; color: var(--neutral-dark); }
        .free-tag { color: #10B981; font-weight: 700; }
        .savings-tag { font-size: 10px; color: #10B981; font-weight: 600; }
        
        .coupon-box { background: white; margin: 0 14px 10px; border-radius: var(--radius-md); padding: 12px 14px; border: 1.5px dashed var(--neutral-border); display: flex; gap: 8px; align-items: center; cursor: pointer; transition: all 0.2s ease; }
        .coupon-box:active { background: #F9FAFB; }
        .coupon-box.applied { border-color: #10B981; background: #F0FDF4; }
        .coupon-box i { color: var(--brand-orange); font-size: 16px; }
        .coupon-box span { font-size: 12px; font-weight: 500; flex: 1; }
        .coupon-box .coupon-badge { background: #10B981; color: white; font-size: 10px; padding: 3px 8px; border-radius: 9999px; font-weight: 700; }
        
        .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: white; padding: 10px 14px; box-shadow: 0 -4px 20px rgba(0,0,0,0.06); z-index: 100; border-top: 1px solid var(--neutral-border); display: flex; align-items: center; gap: 10px; }
        .total-info { flex: 1; }
        .total-label { font-size: 9px; color: var(--neutral-gray); }
        .total-amount { font-family: 'Poppins',sans-serif; font-size: 18px; font-weight: 700; }
        .checkout-btn { background: var(--brand-orange); color: #1a1a1a; border: none; padding: 13px 24px; border-radius: var(--radius-full); font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'Inter',sans-serif; white-space: nowrap; transition: all 0.15s ease; }
        .checkout-btn:active { background: #E8890A; transform: scale(0.96); }
        .checkout-btn:disabled { background: #D1D5DB; color: #9CA3AF; cursor: not-allowed; }
        
        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-state i { font-size: 64px; color: #D1D5DB; margin-bottom: 16px; display: block; }
        .empty-state h3 { font-family: 'Poppins',sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .empty-state p { font-size: 12px; color: var(--neutral-gray); margin-bottom: 16px; }
        .btn-primary { background: var(--brand-green); color: white; border: none; padding: 12px 24px; border-radius: var(--radius-full); font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Inter',sans-serif; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
        .btn-primary:active { background: var(--brand-green-dark); transform: scale(0.96); }
        .btn-outline { background: white; color: var(--brand-green); border: 2px solid var(--brand-green); padding: 10px 22px; border-radius: var(--radius-full); font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'Inter',sans-serif; }
        
        .toast { position: fixed; bottom: 95px; left: 50%; transform: translateX(-50%); background: var(--neutral-dark); color: white; padding: 10px 20px; border-radius: var(--radius-full); font-size: 12px; z-index: 200; opacity: 0; visibility: hidden; white-space: nowrap; box-shadow: var(--shadow-md); transition: all 0.3s ease; }
        .toast.show { opacity: 1; visibility: visible; }
        .toast.error { background: #EF4444; }
        .toast.success { background: #10B981; }
        .toast.warning { background: #F59E0B; color: #1a1a1a; }
        
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 300; display: none; align-items: center; justify-content: center; }
        .loading-overlay.show { display: flex; }
        .loading-spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="top-bar">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <span class="top-title">🛒 My Cart</span>
    <span class="top-count" id="itemCount">0 items</span>
</div>

<div class="main-content" id="mainContent"></div>

<div class="bottom-bar" id="bottomBar" style="display:none;">
    <div class="total-info">
        <div class="total-label">Total Amount</div>
        <div class="total-amount" id="totalAmount">₹0</div>
    </div>
    <button class="checkout-btn" id="checkoutBtn" onclick="goToCheckout()">
        Checkout →
    </button>
</div>

<div class="toast" id="toastMsg"><span id="toastText"></span></div>
<div class="loading-overlay" id="loadingOverlay"><div class="loading-spinner"></div></div>

<script>
(function() {
    'use strict';
    window.addEventListener('error', function(e) { console.error('[Cart]', e.message); try { showToast('Something went wrong', 'error'); } catch(_) {} });
    
    var sb = supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co', 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1');
    var cart = [], currentUser = null, couponDiscount = 0;
    var FREE_DELIVERY_MIN = 299;
    var DELIVERY_FEE = 40;
    
    function getEl(id) { return document.getElementById(id); }
    function safeJSON(s,f) { try { return s?JSON.parse(s):f; } catch(e) { return f; } }
    function esc(s) { if(!s)return''; var d=document.createElement('div');d.textContent=s;return d.innerHTML; }
    
    function showToast(m, type) { 
        var t = getEl('toastMsg'), s = getEl('toastText'); 
        if (!t || !s) return; 
        s.textContent = m; 
        t.className = 'toast';
        if (type === 'error') t.classList.add('error');
        else if (type === 'success') t.classList.add('success');
        else if (type === 'warning') t.classList.add('warning');
        t.classList.add('show'); 
        clearTimeout(t._timer); 
        t._timer = setTimeout(function(){ t.classList.remove('show','error','success','warning'); }, 2500); 
    }
    
    function showLoading() { var el = getEl('loadingOverlay'); if (el) el.classList.add('show'); }
    function hideLoading() { var el = getEl('loadingOverlay'); if (el) el.classList.remove('show'); }
    
    function loadCart() { cart = safeJSON(localStorage.getItem('zymart_cart'), []); return cart; }
    function saveCart() { try { localStorage.setItem('zymart_cart', JSON.stringify(cart)); } catch(e) {} }
    
    function fmtWeight(w, u) {
        if (!w) return '';
        if (u === 'gram' || u === 'g') return w >= 1000 ? (w/1000).toFixed(1).replace(/\.0$/, '') + ' kg' : w + ' g';
        if (u === 'kg') return w + ' kg';
        if (u === 'liter' || u === 'l') return w + ' L';
        if (u === 'ml') return w + ' ml';
        if (u === 'piece' || u === 'pcs') return w + ' pcs';
        return w + ' ' + (u || '');
    }
    
    function getUniqueShopIds() {
        var ids = [];
        for (var i = 0; i < cart.length; i++) {
            if (cart[i].shop_id && ids.indexOf(cart[i].shop_id) === -1) ids.push(cart[i].shop_id);
        }
        return ids;
    }
    
    function groupCartByShop() {
        var groups = {};
        for (var i = 0; i < cart.length; i++) {
            var item = cart[i];
            var shopId = item.shop_id || 'unknown';
            if (!groups[shopId]) groups[shopId] = { shop_id: shopId, shop_name: item.shop_name || 'Unknown Shop', items: [] };
            groups[shopId].items.push({ index: i, item: item });
        }
        return groups;
    }
    
    function calcTotals() { 
        var subtotal = cart.reduce(function(a,i){ return a + ((i.price||0) * (i.quantity||1)); }, 0); 
        var discount = couponDiscount > 0 ? Math.round(subtotal * couponDiscount / 100) : 0; 
        var deliveryFee = (subtotal - discount) >= FREE_DELIVERY_MIN ? 0 : DELIVERY_FEE; 
        var total = subtotal - discount + deliveryFee;
        return { subtotal: subtotal, discount: discount, deliveryFee: deliveryFee, total: total, savings: discount + (deliveryFee === 0 ? DELIVERY_FEE : 0) };
    }
    
    function renderCart() {
        loadCart(); 
        var mc = getEl('mainContent'), bar = getEl('bottomBar'), count = getEl('itemCount');
        var totalItems = cart.reduce(function(s,i){ return s + (i.quantity||1); }, 0);
        count.textContent = totalItems + ' item' + (totalItems !== 1 ? 's' : '');
        
        if (!cart.length) {
            mc.innerHTML = '<div class="empty-state"><i class="fas fa-shopping-cart"></i><h3>Your Cart is Empty</h3><p>Looks like you haven\'t added anything yet.<br>Browse products from nearby shops!</p><a href="products.html" class="btn-primary"><i class="fas fa-shopping-bag"></i> Browse Products</a><br><br><button class="btn-outline" onclick="window.location.href=\'index.html\'"><i class="fas fa-home"></i> Go Home</button></div>';
            bar.style.display = 'none'; 
            return;
        }
        
        bar.style.display = 'flex';
        var totals = calcTotals();
        var groups = groupCartByShop();
        var shopIds = Object.keys(groups);
        var h = '';
        
        // Multi-shop warning
        if (shopIds.length > 1) {
            h += '<div class="multi-shop-warning"><i class="fas fa-exclamation-triangle"></i><div>Your cart has products from <strong>' + shopIds.length + ' different shops</strong>.<br>You can only order from <strong>one shop at a time</strong>.</div></div>';
        }
        
        // Render by shop groups
        for (var s = 0; s < shopIds.length; s++) {
            var group = groups[shopIds[s]];
            
            if (shopIds.length > 1) {
                h += '<div class="shop-group"><div class="shop-group-header">🏪 ' + esc(group.shop_name) + ' <span class="nearby-tag">' + group.items.length + ' items</span></div>';
            }
            
            h += '<div class="cart-items">';
            for (var i = 0; i < group.items.length; i++) {
                var item = group.items[i].item;
                var idx = group.items[i].index;
                var qty = item.quantity || 1;
                var price = item.price || 0;
                var itemTotal = price * qty;
                var stock = item.stock || 0;
                var isLowStock = stock > 0 && stock <= 5;
                var variantLabel = '';
                
                // Build variant label
                if (item.variantWeight) {
                    variantLabel = fmtWeight(item.variantWeight, item.variantUnit);
                } else if (item.variantKey && item.variantKey.indexOf('_') > -1) {
                    var parts = item.variantKey.split('_');
                    if (parts.length >= 3 && parts[1] !== '0') {
                        variantLabel = fmtWeight(parseFloat(parts[1]), parts[2]);
                    }
                }
                
                h += '<div class="cart-item" id="cartItem' + idx + '">';
                h += '<div class="item-image">' + (item.image ? '<img src="' + item.image + '" loading="lazy" onerror="this.parentElement.innerHTML=\'<i class=\\\'fas fa-box-open\\\' style=\\\'font-size:26px;color:#D1D5DB;\\\'></i>\'">' : '<i class="fas fa-box-open" style="font-size:26px;color:#D1D5DB;"></i>') + '</div>';
                h += '<div class="item-details">';
                h += '<div class="item-name">' + esc(item.name || 'Product') + '</div>';
                if (variantLabel) h += '<span class="item-variant">⚖️ ' + variantLabel + '</span>';
                if (item.shop_name && shopIds.length === 1) h += '<div class="item-shop">🏪 ' + esc(item.shop_name) + '</div>';
                h += '<div class="item-price-row">';
                h += '<span class="item-price">₹' + price.toLocaleString('en-IN') + '</span>';
                h += '<span class="item-total">× ' + qty + ' = ₹' + itemTotal.toLocaleString('en-IN') + '</span>';
                h += '</div>';
                if (isLowStock) h += '<div class="item-stock-warn">⚠️ Only ' + stock + ' left!</div>';
                h += '</div>';
                h += '<div class="qty-control">';
                h += '<button class="qty-btn" onclick="changeQty(' + idx + ',-1)"' + (qty <= 1 ? ' disabled' : '') + '>−</button>';
                h += '<span class="qty-value">' + qty + '</span>';
                h += '<button class="qty-btn" onclick="changeQty(' + idx + ',1)"' + (stock > 0 && qty >= stock ? ' disabled' : '') + '>+</button>';
                h += '</div>';
                h += '<button class="remove-btn" onclick="removeItem(' + idx + ')" title="Remove">✕</button>';
                h += '</div>';
            }
            h += '</div>';
            
            if (shopIds.length > 1) h += '</div>';
        }
        
        // Coupon
        h += '<div class="coupon-box' + (couponDiscount > 0 ? ' applied' : '') + '" id="couponBox" onclick="toggleCoupon()">';
        h += '<i class="fas fa-ticket-alt"></i>';
        h += '<span id="couponText">' + (couponDiscount > 0 ? '🎫 10% Discount Applied!' : 'Have a coupon? Tap to apply') + '</span>';
        if (couponDiscount > 0) h += '<span class="coupon-badge">-₹' + totals.discount + '</span>';
        h += '</div>';
        
        // Bill
        h += '<div class="bill-section">';
        h += '<div class="bill-title"><i class="fas fa-receipt"></i> Bill Details</div>';
        h += '<div class="bill-row"><span>Item Total (' + totalItems + ' items)</span><span>₹' + totals.subtotal.toLocaleString('en-IN') + '</span></div>';
        if (totals.discount > 0) h += '<div class="bill-row"><span>Coupon Discount (10%)</span><span style="color:#10B981;">− ₹' + totals.discount.toLocaleString('en-IN') + '</span></div>';
        h += '<div class="bill-row"><span>Delivery Fee</span><span class="' + (totals.deliveryFee === 0 ? 'free-tag' : '') + '">' + (totals.deliveryFee === 0 ? '🎉 FREE' : '₹' + totals.deliveryFee) + '</span></div>';
        if (totals.deliveryFee > 0) h += '<div class="bill-row"><span></span><span style="font-size:10px;color:#6B7280;">Free delivery above ₹' + FREE_DELIVERY_MIN + '</span></div>';
        h += '<div class="bill-row total"><span>Total Amount</span><span>₹' + totals.total.toLocaleString('en-IN') + '</span></div>';
        if (totals.savings > 0) h += '<div class="savings-tag" style="text-align:right;">🎉 You save ₹' + totals.savings + ' on this order!</div>';
        h += '</div>';
        
        mc.innerHTML = h;
        getEl('totalAmount').textContent = '₹' + totals.total.toLocaleString('en-IN');
    }
    
    // 🔥 Quantity change with stock check
    window.changeQty = function(i, d) { 
        var item = cart[i];
        if (!item) return;
        var nq = (item.quantity || 1) + d; 
        var maxStock = item.stock || 0;
        
        if (maxStock > 0 && nq > maxStock) { 
            showToast('⚠️ Only ' + maxStock + ' available in stock!', 'warning'); 
            return; 
        }
        
        if (nq <= 0) { 
            // Remove with animation
            var el = getEl('cartItem' + i);
            if (el) {
                el.classList.add('removing');
                setTimeout(function() {
                    cart.splice(i,1); 
                    saveCart(); 
                    renderCart(); 
                }, 200);
            } else {
                cart.splice(i,1); 
                saveCart(); 
                renderCart(); 
            }
            showToast('🗑️ Item removed', 'warning');
        } else { 
            cart[i].quantity = nq; 
            saveCart(); 
            renderCart(); 
        }
    };
    
    window.removeItem = function(i) { 
        var el = getEl('cartItem' + i);
        if (el) {
            el.classList.add('removing');
            setTimeout(function() {
                cart.splice(i,1); 
                saveCart(); 
                renderCart(); 
            }, 200);
        } else {
            cart.splice(i,1); 
            saveCart(); 
            renderCart(); 
        }
        showToast('🗑️ Item removed from cart', 'success'); 
    };
    
    window.toggleCoupon = function() { 
        couponDiscount = couponDiscount > 0 ? 0 : 10;
        if (couponDiscount > 0) showToast('🎫 10% discount applied!', 'success');
        else showToast('Coupon removed', 'warning');
        renderCart(); 
    };
    
    async function checkUser() { 
        try { 
            var r = await sb.auth.getSession(); 
            if (r && r.data && r.data.session) { currentUser = r.data.session.user; return; }
        } catch(e) {}
        try {
            var session = JSON.parse(localStorage.getItem('zymart_session') || 'null');
            if (session && session.userId) { currentUser = { id: session.userId, phone: session.phone }; return; }
        } catch(e) {}
        currentUser = null;
    }
    
    window.goToCheckout = async function() {
        loadCart();
        if (!cart.length) { showToast('🛒 Your cart is empty!', 'error'); return; }
        
        var shopIds = getUniqueShopIds();
        if (shopIds.length > 1) {
            showToast('⚠️ Please keep products from only ONE shop!', 'error');
            return;
        }
        
        await checkUser();
        if (!currentUser) {
            showToast('🔐 Please login to continue', 'warning'); 
            try { sessionStorage.setItem('zymart_redirect_after_login', 'checkout.html'); } catch(e) {}
            setTimeout(function(){ window.location.href = 'login.html'; }, 600); 
            return; 
        }
        
        // Verify stock before checkout
        showLoading();
        try {
            var allInStock = true;
            for (var i = 0; i < cart.length; i++) {
                var item = cart[i];
                if (item.id) {
                    var res = await sb.from('products').select('stock,is_active,is_on_hold').eq('id', item.id).single();
                    if (res.data) {
                        if (!res.data.is_active || res.data.is_on_hold) {
                            showToast('⚠️ ' + item.name + ' is no longer available', 'error');
                            cart.splice(i, 1); i--;
                            allInStock = false;
                        } else if (res.data.stock < (item.quantity || 1)) {
                            showToast('⚠️ Only ' + res.data.stock + ' of ' + item.name + ' available', 'error');
                            allInStock = false;
                        }
                    }
                }
            }
            if (!allInStock) { saveCart(); renderCart(); hideLoading(); return; }
        } catch(e) { /* Continue even if stock check fails */ }
        hideLoading();
        
        window.location.href = 'checkout.html';
    };
    
    // Listen for cart updates from other tabs
    window.addEventListener('storage', function(e) {
        if (e.key === 'zymart_cart') { loadCart(); renderCart(); }
    });
    
    document.addEventListener('DOMContentLoaded', async function(){ 
        await checkUser(); 
        renderCart(); 
    });
    
})();
</script>
</body>
</html>
