<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Cart - Zatpat</title>
    <meta name="theme-color" content="#16A34A">
    
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #16A34A;
            --primary-light: #22C55E;
            --primary-bg-light: #F0FDF4;
            --accent-orange: #F97316;
            --bg-white: #FFFFFF;
            --bg-light: #F9FAFB;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --border-light: #E5E7EB;
            --error: #EF4444;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --radius-md: 12px;
            --radius-full: 9999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
            overflow-x: hidden;
            padding-bottom: 85px;
            -webkit-font-smoothing: antialiased;
        }

        #pageProgress {
            position: fixed; top: 0; left: 0; width: 0%; height: 3px;
            background: var(--primary); z-index: 10001; transition: width 0.3s ease;
        }
        #pageProgress.loading { width: 90%; }
        #pageProgress.complete { width: 100%; opacity: 0; transition: opacity 0.3s; }

        .top-bar {
            background: var(--bg-white); position: sticky; top: 0; left: 0; width: 100%;
            z-index: 1000; padding: 12px 16px; box-shadow: var(--shadow-sm);
            border-bottom: 1px solid var(--border-light); display: flex; align-items: center; gap: 12px;
        }
        .back-btn {
            width: 40px; height: 40px; background: var(--bg-light); border-radius: var(--radius-full);
            display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
        }
        .back-btn i { font-size: 18px; color: var(--text-primary); }
        .top-title {
            flex: 1; font-size: 18px; font-weight: 800; color: #000000;
            display: flex; align-items: center; gap: 6px;
        }
        .top-title i { color: var(--primary); }
        .cart-count-badge {
            background: var(--primary); color: white; font-size: 12px; padding: 2px 8px;
            border-radius: var(--radius-full); margin-left: 6px; font-weight: 600;
        }

        .main-content { padding: 12px 16px; }

        .empty-cart {
            text-align: center; padding: 60px 20px;
        }
        .empty-cart i { font-size: 64px; color: var(--border-light); margin-bottom: 20px; }
        .empty-cart h3 { font-size: 20px; font-weight: 800; color: #000000; margin-bottom: 8px; }
        .empty-cart p { font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; }
        .shop-now-btn {
            background: var(--primary); color: white; border: none; padding: 14px 32px;
            border-radius: var(--radius-full); font-size: 16px; font-weight: 700; cursor: pointer;
        }

        .cart-items { display: flex; flex-direction: column; gap: 10px; }
        
        .cart-item {
            background: var(--bg-white); border-radius: var(--radius-md); padding: 10px;
            box-shadow: var(--shadow-sm); border: 1px solid var(--border-light);
            display: flex; align-items: center; gap: 10px;
        }
        .cart-item-image {
            width: 60px; height: 60px; border-radius: 8px;
            background: var(--primary-bg-light); flex-shrink: 0; overflow: hidden;
            cursor: pointer; border: 1px solid var(--border-light);
            display: flex; align-items: center; justify-content: center;
        }
        .cart-item-image img { width: 100%; height: 100%; object-fit: cover; }
        .cart-item-image .fallback-icon { font-size: 30px; }
        .cart-item-details { flex: 1; min-width: 0; }
        .cart-item-name {
            font-size: 13px; font-weight: 700; color: #000000; 
            margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            cursor: pointer;
        }
        .cart-item-price-row {
            display: flex; align-items: center; justify-content: space-between;
        }
        .cart-item-price {
            font-size: 15px; font-weight: 800; color: #000000;
        }
        .cart-item-actions { display: flex; align-items: center; gap: 6px; }
        .quantity-control {
            display: flex; align-items: center; gap: 6px; 
            background: var(--bg-light); border-radius: var(--radius-full); 
            padding: 2px 4px; border: 1px solid var(--border-light);
        }
        .quantity-btn {
            width: 28px; height: 28px; border-radius: 50%; background: white;
            border: none; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; font-size: 16px; font-weight: 600; color: var(--primary);
        }
        .quantity-value { font-size: 13px; font-weight: 700; min-width: 18px; text-align: center; color: #000000; }
        .remove-btn { color: var(--text-secondary); cursor: pointer; padding: 6px; }
        .remove-btn i { font-size: 14px; }

        .price-summary {
            background: var(--bg-white); border-radius: var(--radius-md); 
            padding: 14px; margin-top: 16px; border: 1px solid var(--border-light);
        }
        .summary-row {
            display: flex; justify-content: space-between; margin-bottom: 10px;
            font-size: 13px; color: var(--text-secondary);
        }
        .summary-row.total {
            font-size: 16px; font-weight: 800; color: #000000;
            border-top: 1px solid var(--border-light); padding-top: 10px; 
            margin-top: 6px; margin-bottom: 0;
        }
        .total-amount { color: #000000; }

        .delivery-info {
            background: var(--primary-bg-light); border-radius: var(--radius-md); 
            padding: 10px 14px; margin: 12px 0; display: flex; align-items: center; gap: 8px;
            border: 1px solid rgba(22,163,74,0.2);
        }
        .delivery-info i { color: var(--primary); font-size: 14px; }
        .delivery-info span { font-size: 12px; color: var(--text-primary); font-weight: 500; }

        .checkout-btn {
            width: 100%; background: var(--primary); color: white; border: none;
            padding: 14px; border-radius: var(--radius-full); font-size: 15px; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
        }

        .toast-notification {
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
            background: var(--text-primary); color: white; padding: 10px 20px;
            border-radius: var(--radius-full); font-size: 12px; font-weight: 500;
            z-index: 10050; display: none; white-space: nowrap;
        }
        .toast-notification.show { display: flex; }

        .bottom-nav {
            background: white; position: fixed; bottom: 0; left: 0; width: 100%;
            display: flex; justify-content: space-around; padding: 6px 16px 8px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.06); z-index: 1000; border-top: 1px solid var(--border-light);
        }
        .nav-item { 
            display: flex; flex-direction: column; align-items: center; 
            font-size: 10px; font-weight: 500; color: var(--text-secondary); cursor: pointer; position: relative;
        }
        .nav-item.active { color: var(--primary); font-weight: 600; }
        .nav-item i { font-size: 20px; margin-bottom: 2px; }
        .cart-count { 
            position: absolute; top: -5px; right: -5px; background: var(--primary); color: white; 
            border-radius: 50%; width: 16px; height: 16px; font-size: 9px; display: flex; 
            align-items: center; justify-content: center; border: 2px solid white; 
        }
    </style>
</head>
<body>

<div id="pageProgress"></div>
<div id="toastMsg" class="toast-notification"><span id="toastText"></span></div>

<div id="mainApp">
    <div class="top-bar">
        <div class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
        <div class="top-title">
            <i class="fas fa-shopping-bag"></i> My Cart
            <span class="cart-count-badge" id="cartItemCount">0 items</span>
        </div>
    </div>

    <div class="main-content" id="cartContent">
        <div class="empty-cart">
            <i class="fas fa-shopping-cart"></i>
            <h3>Your cart is empty</h3>
            <p>Add items to get started</p>
            <button class="shop-now-btn" onclick="fastNavigate('index.html')">Shop Now</button>
        </div>
    </div>

    <div id="priceSummary" style="display: none; padding: 0 16px;">
        <div class="price-summary">
            <div class="summary-row"><span>Item Total</span> <span id="itemTotal">₹0</span></div>
            <div class="summary-row"><span>Delivery Fee</span> <span id="deliveryFee">₹20</span></div>
            <div class="summary-row"><span>Discount</span> <span style="color: var(--primary);" id="discountAmount">-₹0</span></div>
            <div class="summary-row total"><span>Total Amount</span> <span class="total-amount" id="grandTotal">₹0</span></div>
        </div>

        <div class="delivery-info">
            <i class="fas fa-truck"></i>
            <span>🚀 Delivery in 10 minutes • Sillod</span>
        </div>

        <button class="checkout-btn" onclick="proceedToCheckout()">
            Proceed to Checkout <i class="fas fa-arrow-right"></i>
        </button>
    </div>

    <nav class="bottom-nav">
        <a class="nav-item" onclick="fastNavigate('index.html')"><i class="fas fa-home"></i><span>Home</span></a>
        <a class="nav-item" onclick="fastNavigate('products.html')"><i class="fas fa-search"></i><span>Explore</span></a>
        <a class="nav-item active" onclick="fastNavigate('cart.html')"><i class="fas fa-shopping-bag"></i><span>Cart</span><span class="cart-count" id="cartCount">0</span></a>
        <a class="nav-item" onclick="fastNavigate('profile.html')"><i class="fas fa-user"></i><span>Profile</span></a>
        <a class="nav-item" onclick="fastNavigate('orders.html')"><i class="fas fa-receipt"></i><span>Orders</span></a>
    </nav>
</div>

<script>
    // ========== ERROR HANDLING (CRASH-PROOF) ==========
    window.addEventListener('error', function(e) {
        console.error('Global error:', e.error);
        showToast('Something went wrong. Please refresh.', true);
        return false;
    });

    let cartItems = [];

    function startProgress() { 
        const b = document.getElementById('pageProgress'); 
        if(b) { b.style.width = '0%'; b.classList.add('loading'); setTimeout(() => b.style.width = '90%', 10); }
    }
    function completeProgress() { 
        const b = document.getElementById('pageProgress'); 
        if(b) { b.classList.remove('loading'); b.classList.add('complete'); setTimeout(() => { b.style.width = '0%'; b.classList.remove('complete'); }, 300); }
    }
    window.fastNavigate = function(url) { 
        startProgress(); 
        setTimeout(() => window.location.href = url, 50); 
    };
    function goBack() { window.history.back(); }

    function showToast(msg, isError = false) {
        const t = document.getElementById('toastMsg');
        const s = document.getElementById('toastText');
        if(!t || !s) return;
        s.innerHTML = msg;
        t.style.background = isError ? '#EF4444' : '#111827';
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    function updateCartCounts() {
        const totalItems = cartItems.length;
        const totalQty = cartItems.reduce((s, i) => s + (i.quantity || 1), 0);
        const cartCount = document.getElementById('cartCount');
        const cartItemCount = document.getElementById('cartItemCount');
        if(cartCount) cartCount.innerText = totalQty;
        if(cartItemCount) cartItemCount.innerText = totalItems + (totalItems === 1 ? ' item' : ' items');
    }

    function loadCart() {
        try { 
            cartItems = JSON.parse(localStorage.getItem('zatpat_cart')) || []; 
        } catch(e) { 
            cartItems = []; 
        }
        updateCartCounts();
        renderCart();
    }

    function renderCart() {
        const container = document.getElementById('cartContent');
        const summary = document.getElementById('priceSummary');
        if(!container || !summary) return;

        if (!cartItems.length) {
            container.innerHTML = `<div class="empty-cart"><i class="fas fa-shopping-cart"></i><h3>Your cart is empty</h3><p>Add items to get started</p><button class="shop-now-btn" onclick="fastNavigate('index.html')">Shop Now</button></div>`;
            summary.style.display = 'none';
            return;
        }

        let html = '<div class="cart-items">';
        cartItems.forEach((item, index) => {
            let img = item.image;
            let hasImage = img && img !== 'null' && img !== 'undefined' && img !== '';
            
            if (hasImage) {
                html += `
                    <div class="cart-item">
                        <div class="cart-item-image" onclick="fastNavigate('product-detail.html?id=${item.id}')">
                            <img src="${img}" loading="lazy" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\\'fallback-icon\\'>📦</div>';">
                        </div>
                        <div class="cart-item-details">
                            <div class="cart-item-name" onclick="fastNavigate('product-detail.html?id=${item.id}')">${item.name || 'Product'}</div>
                            <div class="cart-item-price-row">
                                <span class="cart-item-price">₹${(item.price || 0) * (item.quantity || 1)}</span>
                                <div class="cart-item-actions">
                                    <div class="quantity-control">
                                        <button class="quantity-btn" onclick="updateQuantity(${index}, -1)">−</button>
                                        <span class="quantity-value">${item.quantity || 1}</span>
                                        <button class="quantity-btn" onclick="updateQuantity(${index}, 1)">+</button>
                                    </div>
                                    <div class="remove-btn" onclick="removeItem(${index})">
                                        <i class="far fa-trash-alt"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                html += `
                    <div class="cart-item">
                        <div class="cart-item-image" onclick="fastNavigate('product-detail.html?id=${item.id}')">
                            <div class="fallback-icon">📦</div>
                        </div>
                        <div class="cart-item-details">
                            <div class="cart-item-name" onclick="fastNavigate('product-detail.html?id=${item.id}')">${item.name || 'Product'}</div>
                            <div class="cart-item-price-row">
                                <span class="cart-item-price">₹${(item.price || 0) * (item.quantity || 1)}</span>
                                <div class="cart-item-actions">
                                    <div class="quantity-control">
                                        <button class="quantity-btn" onclick="updateQuantity(${index}, -1)">−</button>
                                        <span class="quantity-value">${item.quantity || 1}</span>
                                        <button class="quantity-btn" onclick="updateQuantity(${index}, 1)">+</button>
                                    </div>
                                    <div class="remove-btn" onclick="removeItem(${index})">
                                        <i class="far fa-trash-alt"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
        });
        html += '</div>';
        container.innerHTML = html;
        summary.style.display = 'block';
        calculateTotal();
    }

    function calculateTotal() {
        let itemTotal = 0;
        cartItems.forEach(item => { itemTotal += (item.price || 0) * (item.quantity || 1); });

        const deliveryFee = itemTotal > 0 ? 20 : 0;
        const grandTotal = itemTotal + deliveryFee;

        const itemTotalEl = document.getElementById('itemTotal');
        const deliveryFeeEl = document.getElementById('deliveryFee');
        const discountAmountEl = document.getElementById('discountAmount');
        const grandTotalEl = document.getElementById('grandTotal');
        
        if(itemTotalEl) itemTotalEl.innerText = '₹' + itemTotal;
        if(deliveryFeeEl) deliveryFeeEl.innerText = '₹' + deliveryFee;
        if(discountAmountEl) discountAmountEl.innerText = '-₹0';
        if(grandTotalEl) grandTotalEl.innerText = '₹' + grandTotal;
    }

    window.updateQuantity = function(index, delta) {
        const newQty = (cartItems[index].quantity || 1) + delta;
        if (newQty >= 1 && newQty <= 10) {
            cartItems[index].quantity = newQty;
            try {
                localStorage.setItem('zatpat_cart', JSON.stringify(cartItems));
            } catch(e) {}
            updateCartCounts();
            renderCart();
            showToast('✏️ Quantity updated');
            if (navigator.vibrate) navigator.vibrate(10);
        }
    };

    window.removeItem = function(index) {
        cartItems.splice(index, 1);
        try {
            localStorage.setItem('zatpat_cart', JSON.stringify(cartItems));
        } catch(e) {}
        updateCartCounts();
        renderCart();
        showToast('🗑️ Item removed');
        if (navigator.vibrate) navigator.vibrate(10);
    };

    window.proceedToCheckout = function() {
        if (cartItems.length === 0) { showToast('Your cart is empty', true); return; }
        fastNavigate('checkout.html');
    };

    document.addEventListener('DOMContentLoaded', loadCart);
    window.goBack = goBack;
    window.updateQuantity = updateQuantity;
    window.removeItem = removeItem;
    window.proceedToCheckout = proceedToCheckout;
</script>
</body>
</html>
