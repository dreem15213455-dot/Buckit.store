<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Cart - ZyMart+</title>
    <meta name="theme-color" content="#0B5A31">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { 
            --brand-green: #0B5A31; 
            --brand-green-dark: #083D21; 
            --brand-orange: #F59E0B; 
            --neutral-white: #FFFFFF; 
            --neutral-bg: #F9FAFB; 
            --neutral-border: #E5E7EB; 
            --neutral-gray: #6B7280; 
            --neutral-dark: #1A1A1A; 
            --danger: #EF4444; 
            --success: #10B981; 
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); 
            --shadow-sm: 0 1px 4px rgba(0,0,0,0.06); 
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08); 
            --radius-sm: 10px; 
            --radius-md: 14px; 
            --radius-lg: 18px; 
            --radius-full: 9999px; 
            --status-bar-height: env(safe-area-inset-top, 0px);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter',-apple-system,sans-serif; 
            background: var(--neutral-bg); 
            color: var(--neutral-dark); 
            padding-bottom: 100px; 
            -webkit-tap-highlight-color: transparent; 
            -webkit-font-smoothing: antialiased; 
            min-height: 100vh; 
        }
        
        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100px); opacity: 0; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes cartBounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
        @keyframes shimmer { 0% { background-position: -468px 0; } 100% { background-position: 468px 0; } }
        
        .cart-badge.bounce { animation: cartBounce 0.3s ease; }
        
        .top-bar { 
            background: var(--brand-green); 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            z-index: 100; 
            padding: 10px 14px; 
            padding-top: calc(10px + var(--status-bar-height));
            display: flex; 
            align-items: center; 
            gap: 10px; 
            box-shadow: 0 2px 16px rgba(11,90,49,0.3); 
        }
        
        .back-btn { 
            width: 36px; 
            height: 36px; 
            background: rgba(255,255,255,0.10); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            border: none; 
            color: white; 
            font-size: 14px; 
            text-decoration: none; 
        }
        
        .back-btn:active { background: rgba(255,255,255,0.20); transform: scale(0.93); }
        .top-title { font-family: 'Poppins',sans-serif; flex: 1; font-size: 16px; font-weight: 700; color: white; }
        
        .top-count { 
            font-size: 11px; 
            color: rgba(255,255,255,0.75); 
            background: rgba(255,255,255,0.12); 
            padding: 4px 10px; 
            border-radius: var(--radius-full); 
        }
        
        .main-content { padding-top: 58px; }
        
        .shop-group { margin-bottom: 8px; }
        
        .shop-group-header { 
            padding: 8px 14px; 
            font-size: 12px; 
            font-weight: 600; 
            color: var(--brand-green); 
            background: #EDF7F1; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            border-bottom: 1px solid #C8E6C9; 
        }
        
        .shop-group-header .nearby-tag { 
            background: #0B5A31; 
            color: white; 
            font-size: 8px; 
            padding: 2px 6px; 
            border-radius: 9999px; 
            margin-left: 4px; 
        }
        
        .multi-shop-info { 
            margin: 10px 14px; 
            padding: 10px 14px; 
            background: #EDF7F1; 
            border: 1px solid #C8E6C9; 
            border-radius: var(--radius-md); 
            font-size: 11px; 
            color: #0B5A31; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        
        .multi-shop-info i { font-size: 16px; flex-shrink: 0; }
        
        .cart-items { padding: 0 14px; }
        
        .cart-item { 
            background: white; 
            border-radius: var(--radius-md); 
            padding: 12px; 
            margin-bottom: 8px; 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            border: 1px solid var(--neutral-border); 
            box-shadow: var(--shadow-xs); 
            animation: slideUp 0.3s ease; 
            position: relative; 
        }
        
        .cart-item.removing { animation: slideOut 0.25s ease forwards; }
        
        .cart-item .item-image { 
            width: 70px; 
            height: 70px; 
            border-radius: var(--radius-sm); 
            background: var(--neutral-bg); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            flex-shrink: 0; 
        }
        
        .cart-item .item-image img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            padding: 4px; 
        }
        
        .item-details { flex: 1; min-width: 0; }
        
        .item-name { 
            font-size: 13px; 
            font-weight: 600; 
            line-height: 1.3; 
            display: -webkit-box; 
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical; 
            overflow: hidden; 
        }
        
        .item-variant { 
            font-size: 10px; 
            color: var(--brand-green); 
            font-weight: 600; 
            background: #EDF7F1; 
            display: inline-block; 
            padding: 2px 7px; 
            border-radius: 9999px; 
            margin-top: 3px; 
        }
        
        .item-shop { font-size: 9px; color: var(--neutral-gray); font-weight: 500; margin-top: 2px; }
        
        .item-price-row { 
            display: flex; 
            align-items: baseline; 
            gap: 8px; 
            margin-top: 4px; 
            flex-wrap: wrap; 
        }
        
        .item-price { font-size: 15px; font-weight: 700; color: var(--brand-green-dark); }
        .item-total { font-size: 11px; color: var(--neutral-gray); }
        .item-stock-warn { font-size: 9px; color: #EF4444; font-weight: 600; margin-top: 2px; }
        
        .qty-control { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            background: var(--neutral-bg); 
            border-radius: var(--radius-full); 
            padding: 3px; 
            flex-shrink: 0; 
        }
        
        .qty-btn { 
            width: 30px; 
            height: 30px; 
            border-radius: 50%; 
            border: 1.5px solid var(--neutral-border); 
            background: white; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: 700; 
            color: var(--brand-green); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: all 0.15s ease; 
        }
        
        .qty-btn:active { background: #EDF7F1; border-color: var(--brand-green); }
        .qty-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .qty-value { font-size: 14px; font-weight: 700; min-width: 20px; text-align: center; }
        
        .remove-btn { 
            position: absolute; 
            top: 6px; 
            right: 6px; 
            background: #FEF2F2; 
            border: none; 
            color: #EF4444; 
            width: 24px; 
            height: 24px; 
            border-radius: 50%; 
            cursor: pointer; 
            font-size: 9px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        
        .remove-btn:active { background: #FEE2E2; transform: scale(0.9); }
        
        .bill-section { 
            background: white; 
            margin: 14px; 
            border-radius: var(--radius-md); 
            padding: 14px; 
            border: 1px solid var(--neutral-border); 
            box-shadow: var(--shadow-xs); 
        }
        
        .bill-title { 
            font-family: 'Poppins',sans-serif; 
            font-size: 14px; 
            font-weight: 700; 
            margin-bottom: 12px; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }
        
        .bill-row { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 8px; 
            font-size: 12px; 
            color: var(--neutral-gray); 
        }
        
        .bill-row.total { 
            border-top: 2px solid var(--neutral-dark); 
            padding-top: 12px; 
            margin-top: 10px; 
            font-size: 16px; 
            font-weight: 800; 
            color: var(--neutral-dark); 
        }
        
        .free-tag { color: #10B981; font-weight: 700; }
        .savings-tag { font-size: 10px; color: #10B981; font-weight: 600; }
        
        .bottom-bar { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            background: white; 
            padding: 10px 14px; 
            box-shadow: 0 -4px 20px rgba(0,0,0,0.06); 
            z-index: 100; 
            border-top: 1px solid var(--neutral-border); 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        
        .total-info { flex: 1; }
        .total-label { font-size: 9px; color: var(--neutral-gray); }
        .total-amount { font-family: 'Poppins',sans-serif; font-size: 18px; font-weight: 700; }
        
        .checkout-btn { 
            background: var(--brand-orange); 
            color: #1a1a1a; 
            border: none; 
            padding: 13px 24px; 
            border-radius: var(--radius-full); 
            font-size: 14px; 
            font-weight: 700; 
            cursor: pointer; 
            font-family: 'Inter',sans-serif; 
            white-space: nowrap; 
            transition: all 0.15s ease; 
        }
        
        .checkout-btn:active { background: #E8890A; transform: scale(0.96); }
        .checkout-btn:disabled { background: #D1D5DB; color: #9CA3AF; cursor: not-allowed; }
        
        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-state i { font-size: 64px; color: #D1D5DB; margin-bottom: 16px; display: block; }
        .empty-state h3 { font-family: 'Poppins',sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .empty-state p { font-size: 12px; color: var(--neutral-gray); margin-bottom: 16px; }
        
        .btn-primary { 
            background: var(--brand-green); 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            border-radius: var(--radius-full); 
            font-size: 13px; 
            font-weight: 600; 
            cursor: pointer; 
            font-family: 'Inter',sans-serif; 
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
            text-decoration: none; 
        }
        
        .btn-primary:active { background: var(--brand-green-dark); transform: scale(0.96); }
        
        .btn-outline { 
            background: white; 
            color: var(--brand-green); 
            border: 2px solid var(--brand-green); 
            padding: 10px 22px; 
            border-radius: var(--radius-full); 
            font-size: 12px; 
            font-weight: 600; 
            cursor: pointer; 
            font-family: 'Inter',sans-serif; 
        }
        
        .toast { 
            position: fixed; 
            bottom: 95px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: var(--neutral-dark); 
            color: white; 
            padding: 10px 20px; 
            border-radius: var(--radius-full); 
            font-size: 12px; 
            z-index: 200; 
            opacity: 0; 
            visibility: hidden; 
            white-space: nowrap; 
            box-shadow: var(--shadow-md); 
            transition: all 0.3s ease; 
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .toast.show { opacity: 1; visibility: visible; }
        .toast.error { background: #EF4444; }
        .toast.success { background: #10B981; }
        .toast.warning { background: #F59E0B; color: #1a1a1a; }
        
        .loading-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.4); 
            z-index: 300; 
            display: none; 
            align-items: center; 
            justify-content: center; 
        }
        
        .loading-overlay.show { display: flex; }
        
        .loading-spinner { 
            width: 40px; 
            height: 40px; 
            border: 3px solid rgba(255,255,255,0.3); 
            border-top-color: white; 
            border-radius: 50%; 
            animation: spin 0.7s linear infinite; 
        }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <span class="top-title">🛒 My Cart</span>
    <span class="top-count" id="itemCount">0 items</span>
</div>

<div class="main-content" id="mainContent"></div>

<div class="bottom-bar" id="bottomBar" style="display:none;">
    <div class="total-info">
        <div class="total-label">Total Amount</div>
        <div class="total-amount" id="totalAmount">₹0</div>
    </div>
    <button class="checkout-btn" id="checkoutBtn" onclick="goToCheckout()">
        Checkout →
    </button>
</div>

<div class="toast" id="toastMsg"><span id="toastText"></span></div>
<div class="loading-overlay" id="loadingOverlay"><div class="loading-spinner"></div></div>

<script>
(function() {
    'use strict';
    
    // ==================== CONFIGURATION ====================
    var CONFIG = {
        SUPABASE_URL: 'https://zwajyovemwdqtkecipeb.supabase.co',
        SUPABASE_KEY: 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1'
    };
    
    var sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
    
    // ==================== GLOBAL VARIABLES ====================
    var cart = [];
    var currentUser = null;
    var couponDiscount = 0;
    var deliverySettings = null;
    var isRefreshingCart = false;
    
    // ==================== CART MANAGER ====================
    var CartManager = {
        getCart: function() {
            try { return JSON.parse(localStorage.getItem('zymart_cart') || '[]'); } 
            catch(e) { return []; }
        },
        
        saveCart: function(c) {
            try { localStorage.setItem('zymart_cart', JSON.stringify(c)); } 
            catch(e) {}
        },
        
        getTotalItems: function() {
            var c = this.getCart();
            return c.reduce(function(sum, item) { return sum + (item.quantity || 1); }, 0);
        },
        
        getTotalPrice: function() {
            var c = this.getCart();
            return c.reduce(function(sum, item) { return sum + (item.price * (item.quantity || 1)); }, 0);
        }
    };
    
    // ==================== HELPER FUNCTIONS ====================
    function getEl(id) { return document.getElementById(id); }
    
    function safeJSON(s, f) { 
        try { return s ? JSON.parse(s) : f; } 
        catch(e) { return f; } 
    }
    
    function esc(s) { 
        if(!s) return ''; 
        var d = document.createElement('div'); 
        d.textContent = s; 
        return d.innerHTML; 
    }
    
    function showToast(m, type) { 
        var t = getEl('toastMsg'), s = getEl('toastText'); 
        if (!t || !s) return; 
        s.textContent = m; 
        t.className = 'toast';
        if (type === 'error') t.classList.add('error');
        else if (type === 'success') t.classList.add('success');
        else if (type === 'warning') t.classList.add('warning');
        t.classList.add('show'); 
        clearTimeout(t._timer); 
        t._timer = setTimeout(function() { 
            t.classList.remove('show','error','success','warning'); 
        }, 2500); 
    }
    
    function showLoading() { var el = getEl('loadingOverlay'); if (el) el.classList.add('show'); }
    function hideLoading() { var el = getEl('loadingOverlay'); if (el) el.classList.remove('show'); }
    
    function fmtWeight(w, u) {
        if (!w) return '';
        var nw = parseFloat(w);
        if (isNaN(nw)) return String(w);
        
        var unitLower = u ? u.toLowerCase() : '';
        
        if (unitLower === 'gram' || unitLower === 'g' || unitLower === 'gm') {
            return nw >= 1000 ? (nw/1000).toFixed(1).replace(/\.0$/,'') + ' kg' : nw + ' g';
        }
        if (unitLower === 'kg' || unitLower === 'kilogram') return nw + ' kg';
        if (unitLower === 'liter' || unitLower === 'l') return nw + ' L';
        if (unitLower === 'ml') return nw + ' ml';
        if (unitLower === 'piece' || unitLower === 'pcs') return nw + ' pcs';
        
        return nw + ' ' + (u || '');
    }
    
    // ==================== DELIVERY SETTINGS ====================
    async function loadDeliverySettings() {
        try {
            var r = await sb.from('delivery_settings')
                .select('delivery_charge, free_delivery_above, min_order_amount, is_holiday, holiday_reason, holiday_date, is_open')
                .eq('is_active', true)
                .single();
                
            if(r.data) {
                deliverySettings = r.data;
            } else {
                deliverySettings = {
                    delivery_charge: 40,
                    free_delivery_above: 299,
                    min_order_amount: 0,
                    is_holiday: false,
                    is_open: true
                };
            }
        } catch(e) {
            deliverySettings = {
                delivery_charge: 40,
                free_delivery_above: 299,
                min_order_amount: 0,
                is_holiday: false,
                is_open: true
            };
        }
    }
    
    // ==================== ✅ FIXED: REFRESH CART PRICES ====================
    async function refreshCartPrices() {
        if (isRefreshingCart) return;
        isRefreshingCart = true;
        
        var cartData = CartManager.getCart();
        if (!cartData.length) {
            isRefreshingCart = false;
            return;
        }
        
        var updatedCart = [];
        var removedItems = [];
        var priceChangedItems = [];
        
        for (var i = 0; i < cartData.length; i++) {
            var item = cartData[i];
            
            try {
                var res = await sb.from('products')
                    .select('*')
                    .eq('id', item.id)
                    .single();
                
                if (!res.data) {
                    removedItems.push(item.name || 'Product');
                    continue;
                }
                
                var product = res.data;
                
                // Product valid check
                if (!product.is_active || product.is_on_hold || product.delete_requested) {
                    removedItems.push(item.name || 'Product');
                    continue;
                }
                
                // Variants parse
                var variants = [];
                try { 
                    variants = typeof product.variants === 'string' 
                        ? JSON.parse(product.variants) 
                        : (product.variants || []); 
                } catch(e) { variants = []; }
                
                var newPrice = parseFloat(product.price) || 0;
                var newOfferPrice = product.offer_price ? parseFloat(product.offer_price) : null;
                var newImage = (product.images && product.images[0]) || product.image_url || item.image;
                var newStock = parseInt(product.stock) || 0;
                
                // Agar variant hai to variant ka price lo
                if (item.variantKey && variants.length > 0) {
                    var matchingVariant = null;
                    
                    // Sabse pehle variant weight aur unit se match karo
                    for (var v = 0; v < variants.length; v++) {
                        var variant = variants[v];
                        var variantWeight = String(variant.weight || '');
                        var variantUnit = String(variant.weight_unit || variant.unit || '');
                        var itemWeight = String(item.variantWeight || '');
                        var itemUnit = String(item.variantUnit || '');
                        
                        if (variantWeight === itemWeight && variantUnit === itemUnit) {
                            matchingVariant = variant;
                            break;
                        }
                    }
                    
                    // Agar exact match nahi mila to variant_key se match karo
                    if (!matchingVariant && item.variantKey) {
                        for (var v2 = 0; v2 < variants.length; v2++) {
                            var variant2 = variants[v2];
                            var expectedKey = product.id + '_' + (variant2.weight || '') + '_' + (variant2.weight_unit || variant2.unit || '');
                            if (expectedKey === item.variantKey) {
                                matchingVariant = variant2;
                                break;
                            }
                        }
                    }
                    
                    if (matchingVariant) {
                        newPrice = parseFloat(matchingVariant.offer_price || matchingVariant.price) || 0;
                        newStock = parseInt(matchingVariant.stock) || 0;
                    }
                } else if (newOfferPrice && newOfferPrice < newPrice) {
                    newPrice = newOfferPrice;
                }
                
                // Price check
                if (parseFloat(item.price) !== newPrice) {
                    priceChangedItems.push({
                        name: item.name,
                        oldPrice: parseFloat(item.price),
                        newPrice: newPrice
                    });
                }
                
                // Item update karo
                item.price = newPrice;
                item.name = product.name || item.name;
                item.image = newImage;
                item.stock = newStock;
                
                updatedCart.push(item);
                
            } catch(e) {
                // Product fetch error - item ko skip karo
                removedItems.push(item.name || 'Product');
            }
        }
        
        // Cart save karo
        CartManager.saveCart(updatedCart);
        cart = updatedCart;
        
        // Toast messages
        if (removedItems.length > 0) {
            showToast('⚠️ ' + removedItems.length + ' product(s) removed - no longer available', 'warning');
        }
        
        if (priceChangedItems.length > 0) {
            var totalChanged = priceChangedItems.length;
            showToast('💰 Price updated for ' + totalChanged + ' product(s)', 'success');
        }
        
        isRefreshingCart = false;
        
        // Render updated cart
        renderCart();
    }
    
    // ==================== CART OPERATIONS ====================
    function loadCart() { 
        cart = CartManager.getCart(); 
        return cart; 
    }
    
    function saveCart() { 
        CartManager.saveCart(cart); 
    }
    
    function getUniqueShopIds() {
        var ids = [];
        for (var i = 0; i < cart.length; i++) {
            if (cart[i].shop_id && ids.indexOf(cart[i].shop_id) === -1) ids.push(cart[i].shop_id);
        }
        return ids;
    }
    
    function groupCartByShop() {
        var groups = {};
        for (var i = 0; i < cart.length; i++) {
            var item = cart[i];
            var shopId = item.shop_id || 'unknown';
            if (!groups[shopId]) {
                groups[shopId] = { 
                    shop_id: shopId, 
                    shop_name: item.shop_name || item.shopName || 'Shop', 
                    items: [] 
                };
            }
            groups[shopId].items.push({ index: i, item: item });
        }
        return groups;
    }
    
    function calcTotals() { 
        var subtotal = cart.reduce(function(a, i) { 
            return a + ((i.price || 0) * (i.quantity || 1)); 
        }, 0); 
        
        var discount = couponDiscount > 0 ? Math.round(subtotal * couponDiscount / 100) : 0; 
        
        var freeDeliveryAbove = deliverySettings ? deliverySettings.free_delivery_above : 299;
        var deliveryCharge = deliverySettings ? deliverySettings.delivery_charge : 40;
        
        var deliveryFee = (subtotal - discount) >= freeDeliveryAbove ? 0 : deliveryCharge; 
        var total = subtotal - discount + deliveryFee;
        
        return { 
            subtotal: subtotal, 
            discount: discount, 
            deliveryFee: deliveryFee, 
            total: total, 
            savings: discount + (deliveryFee === 0 ? deliveryCharge : 0),
            freeDeliveryAbove: freeDeliveryAbove
        };
    }
    
    // ==================== RENDER CART ====================
    function renderCart() {
        loadCart(); 
        var mc = getEl('mainContent');
        var bar = getEl('bottomBar');
        var count = getEl('itemCount');
        
        var totalItems = cart.reduce(function(s, i) { return s + (i.quantity || 1); }, 0);
        count.textContent = totalItems + ' item' + (totalItems !== 1 ? 's' : '');
        
        if (!cart.length) {
            mc.innerHTML = '<div class="empty-state">' +
                '<i class="fas fa-shopping-cart"></i>' +
                '<h3>Your Cart is Empty</h3>' +
                '<p>Looks like you haven\'t added anything yet.<br>Browse products from nearby shops!</p>' +
                '<a href="products.html" class="btn-primary"><i class="fas fa-shopping-bag"></i> Browse Products</a><br><br>' +
                '<button class="btn-outline" onclick="window.location.href=\'index.html\'"><i class="fas fa-home"></i> Go Home</button>' +
                '</div>';
            bar.style.display = 'none'; 
            return;
        }
        
        bar.style.display = 'flex';
        var totals = calcTotals();
        var groups = groupCartByShop();
        var shopIds = Object.keys(groups);
        
        var checkoutBtn = getEl('checkoutBtn');
        if (checkoutBtn) {
            checkoutBtn.disabled = false;
            if (shopIds.length > 1) {
                checkoutBtn.textContent = 'Checkout (' + shopIds.length + ' orders) →';
            } else {
                checkoutBtn.textContent = 'Checkout →';
            }
        }
        
        var h = '';
        
        if (shopIds.length > 1) {
            h += '<div class="multi-shop-info"><i class="fas fa-info-circle"></i><div>Your cart has products from <strong>' + shopIds.length + ' shops</strong>.<br>Separate orders will be created for each shop.</div></div>';
        }
        
        for (var s = 0; s < shopIds.length; s++) {
            var group = groups[shopIds[s]];
            
            h += '<div class="shop-group"><div class="shop-group-header">🏪 ' + esc(group.shop_name) + ' <span class="nearby-tag">' + group.items.length + ' items</span></div>';
            
            h += '<div class="cart-items">';
            
            for (var i = 0; i < group.items.length; i++) {
                var item = group.items[i].item;
                var idx = group.items[i].index;
                var qty = item.quantity || 1;
                var price = item.price || 0;
                var itemTotal = price * qty;
                var stock = item.stock || 0;
                var isLowStock = stock > 0 && stock <= 5;
                var variantLabel = '';
                
                if (item.variantWeight) {
                    variantLabel = fmtWeight(item.variantWeight, item.variantUnit);
                }
                
                h += '<div class="cart-item" id="cartItem' + idx + '">';
                h += '<div class="item-image">';
                if(item.image) {
                    h += '<img src="' + item.image + '" loading="lazy" alt="' + esc(item.name || 'Product') + '" onerror="this.parentElement.innerHTML=\'<i class=&#34;fas fa-box-open&#34; style=&#34;font-size:26px;color:#D1D5DB;&#34;></i>\'">';
                } else {
                    h += '<i class="fas fa-box-open" style="font-size:26px;color:#D1D5DB;"></i>';
                }
                h += '</div>';
                
                h += '<div class="item-details">';
                h += '<div class="item-name">' + esc(item.name || 'Product') + '</div>';
                if (variantLabel) h += '<span class="item-variant">⚖️ ' + variantLabel + '</span>';
                h += '<div class="item-shop">🏪 ' + esc(group.shop_name) + '</div>';
                h += '<div class="item-price-row">';
                h += '<span class="item-price">₹' + price.toLocaleString('en-IN') + '</span>';
                h += '<span class="item-total">× ' + qty + ' = ₹' + itemTotal.toLocaleString('en-IN') + '</span>';
                h += '</div>';
                if (isLowStock) h += '<div class="item-stock-warn">⚠️ Only ' + stock + ' left!</div>';
                h += '</div>';
                
                h += '<div class="qty-control">';
                h += '<button class="qty-btn" onclick="changeQty(' + idx + ',-1)"' + (qty <= 1 ? ' disabled' : '') + '>−</button>';
                h += '<span class="qty-value">' + qty + '</span>';
                h += '<button class="qty-btn" onclick="changeQty(' + idx + ',1)"' + (stock > 0 && qty >= stock ? ' disabled' : '') + '>+</button>';
                h += '</div>';
                h += '<button class="remove-btn" onclick="removeItem(' + idx + ')" title="Remove">✕</button>';
                h += '</div>';
            }
            
            h += '</div></div>';
        }
        
        // Bill section
        h += '<div class="bill-section">';
        h += '<div class="bill-title"><i class="fas fa-receipt"></i> Bill Details</div>';
        h += '<div class="bill-row"><span>Item Total (' + totalItems + ' items)</span><span>₹' + totals.subtotal.toLocaleString('en-IN') + '</span></div>';
        
        if (totals.discount > 0) {
            h += '<div class="bill-row"><span>Coupon Discount (' + couponDiscount + '%)</span><span style="color:#10B981;">− ₹' + totals.discount.toLocaleString('en-IN') + '</span></div>';
        }
        
        h += '<div class="bill-row"><span>Delivery Fee</span>';
        h += '<span class="' + (totals.deliveryFee === 0 ? 'free-tag' : '') + '">' + (totals.deliveryFee === 0 ? '🎉 FREE' : '₹' + totals.deliveryFee) + '</span></div>';
        
        h += '<div class="bill-row total"><span>Total Amount</span><span>₹' + totals.total.toLocaleString('en-IN') + '</span></div>';
        
        h += '</div>';
        
        mc.innerHTML = h;
        getEl('totalAmount').textContent = '₹' + totals.total.toLocaleString('en-IN');
    }
    
    // ==================== CART ACTIONS ====================
    window.changeQty = function(i, d) { 
        var item = cart[i];
        if (!item) return;
        
        var nq = (item.quantity || 1) + d; 
        var maxStock = item.stock || 0;
        
        if (maxStock > 0 && nq > maxStock) { 
            showToast('⚠️ Only ' + maxStock + ' available in stock!', 'warning'); 
            return; 
        }
        
        if (nq <= 0) { 
            var el = getEl('cartItem' + i);
            if (el) {
                el.classList.add('removing');
                setTimeout(function() {
                    cart.splice(i, 1); 
                    saveCart(); 
                    renderCart(); 
                }, 200);
            } else {
                cart.splice(i, 1); 
                saveCart(); 
                renderCart(); 
            }
            showToast('🗑️ Item removed', 'warning');
        } else { 
            cart[i].quantity = nq; 
            saveCart(); 
            renderCart(); 
        }
    };
    
    window.removeItem = function(i) { 
        var el = getEl('cartItem' + i);
        if (el) {
            el.classList.add('removing');
            setTimeout(function() {
                cart.splice(i, 1); 
                saveCart(); 
                renderCart(); 
            }, 200);
        } else {
            cart.splice(i, 1); 
            saveCart(); 
            renderCart(); 
        }
        showToast('🗑️ Item removed from cart', 'success'); 
    };
    
    // ==================== AUTH ====================
    async function checkUser() { 
        try { 
            var r = await sb.auth.getSession(); 
            if (r && r.data && r.data.session) { 
                currentUser = r.data.session.user; 
                return; 
            }
        } catch(e) {}
        
        try {
            var session = JSON.parse(localStorage.getItem('zymart_session') || 'null');
            if (session && session.userId) { 
                currentUser = { id: session.userId, phone: session.phone }; 
                return; 
            }
        } catch(e) {}
        
        currentUser = null;
    }
    
    // ==================== CHECKOUT (MULTI-SHOP SUPPORT) ====================
    window.goToCheckout = async function() {
        loadCart();
        
        if (!cart.length) { 
            showToast('🛒 Your cart is empty!', 'error'); 
            return; 
        }
        
        await checkUser();
        
        if (!currentUser) {
            showToast('🔐 Please login to continue', 'warning'); 
            try { sessionStorage.setItem('zymart_redirect_after_login', 'checkout.html'); } catch(e) {}
            setTimeout(function() { window.location.href = 'login.html'; }, 600); 
            return; 
        }
        
        // Holiday check
        if (deliverySettings && deliverySettings.is_holiday) {
            var today = new Date().toISOString().split('T')[0];
            if (deliverySettings.holiday_date === today) {
                showToast('🏖️ ' + (deliverySettings.holiday_reason || 'Closed Today'), 'error');
                return;
            }
        }
        
        if (deliverySettings && deliverySettings.is_open === false) {
            showToast('🔒 Shop is currently closed', 'error');
            return;
        }
        
        window.location.href = 'checkout.html';
    };
    
    // ==================== EVENT LISTENERS ====================
    window.addEventListener('storage', function(e) {
        if (e.key === 'zymart_cart') { 
            loadCart(); 
            renderCart(); 
        }
    });
    
    document.addEventListener('DOMContentLoaded', async function() { 
        showLoading();
        await loadDeliverySettings();
        await checkUser();
        
        // ✅ FIXED: Cart prices refresh karo (invalid products hatao, prices update karo)
        await refreshCartPrices();
        
        hideLoading();
        renderCart(); 
    });
    
    window.addEventListener('error', function(e) { 
        console.error('[Cart]', e.message); 
    });
    
})();
</script>
</body>
</html>
