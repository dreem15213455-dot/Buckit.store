<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Cart - ZyMart+</title>
    <meta name="theme-color" content="#0B5A31">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { 
            --brand-green: #0B5A31; --brand-green-dark: #083D21; --brand-orange: #F59E0B;
            --neutral-white: #FFFFFF; --neutral-bg: #F9FAFB; --neutral-border: #E5E7EB;
            --neutral-gray: #6B7280; --neutral-dark: #1A1A1A; --danger: #EF4444;
            --success: #10B981;
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --radius-sm: 10px; --radius-md: 14px; --radius-lg: 18px; --radius-full: 9999px;
            --status-bar-height: env(safe-area-inset-top, 0px);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter',-apple-system,sans-serif; background: var(--neutral-bg); color: var(--neutral-dark); padding-bottom: 100px; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; min-height: 100vh; }
        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100px); opacity: 0; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes popupIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .top-bar { background: var(--brand-green); position: fixed; top: 0; left: 0; width: 100%; z-index: 100; padding: 10px 14px; padding-top: calc(10px + var(--status-bar-height)); display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 16px rgba(11,90,49,0.3); }
        .back-btn { width: 36px; height: 36px; background: rgba(255,255,255,0.10); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 14px; text-decoration: none; }
        .back-btn:active { background: rgba(255,255,255,0.20); transform: scale(0.93); }
        .top-title { font-family: 'Poppins',sans-serif; flex: 1; font-size: 16px; font-weight: 700; color: white; }
        .top-count { font-size: 11px; color: rgba(255,255,255,0.75); background: rgba(255,255,255,0.12); padding: 4px 10px; border-radius: var(--radius-full); }
        .main-content { padding-top: 58px; }
        .shop-group { margin-bottom: 8px; }
        .shop-group-header { padding: 8px 14px; font-size: 12px; font-weight: 600; color: var(--brand-green); background: #EDF7F1; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid #C8E6C9; }
        .shop-group-header .nearby-tag { background: #0B5A31; color: white; font-size: 8px; padding: 2px 6px; border-radius: 9999px; margin-left: 4px; }
        .multi-shop-info { margin: 10px 14px; padding: 10px 14px; background: #EDF7F1; border: 1px solid #C8E6C9; border-radius: var(--radius-md); font-size: 11px; color: #0B5A31; display: flex; align-items: center; gap: 8px; }
        .multi-shop-info i { font-size: 16px; flex-shrink: 0; }
        .cart-items { padding: 0 14px; }
        .cart-item { background: white; border-radius: var(--radius-md); padding: 12px; margin-bottom: 8px; display: flex; gap: 10px; align-items: center; border: 1px solid var(--neutral-border); box-shadow: var(--shadow-xs); animation: slideUp 0.3s ease; position: relative; }
        .cart-item.removing { animation: slideOut 0.25s ease forwards; }
        .cart-item .item-image { width: 70px; height: 70px; border-radius: var(--radius-sm); background: var(--neutral-bg); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
        .cart-item .item-image img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
        .item-details { flex: 1; min-width: 0; }
        .item-name { font-size: 13px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .item-variant { font-size: 10px; color: var(--brand-green); font-weight: 600; background: #EDF7F1; display: inline-block; padding: 2px 7px; border-radius: 9999px; margin-top: 3px; }
        .item-shop { font-size: 9px; color: var(--neutral-gray); font-weight: 500; margin-top: 2px; }
        .item-price-row { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
        .item-price { font-size: 15px; font-weight: 700; color: var(--brand-green-dark); }
        .item-total { font-size: 11px; color: var(--neutral-gray); }
        .item-stock-warn { font-size: 9px; color: #EF4444; font-weight: 600; margin-top: 2px; }
        .qty-control { display: flex; align-items: center; gap: 6px; background: var(--neutral-bg); border-radius: var(--radius-full); padding: 3px; flex-shrink: 0; }
        .qty-btn { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--neutral-border); background: white; cursor: pointer; font-size: 14px; font-weight: 700; color: var(--brand-green); display: flex; align-items: center; justify-content: center; transition: all 0.15s ease; }
        .qty-btn:active { background: #EDF7F1; border-color: var(--brand-green); }
        .qty-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .qty-value { font-size: 14px; font-weight: 700; min-width: 20px; text-align: center; }
        .remove-btn { position: absolute; top: 6px; right: 6px; background: #FEF2F2; border: none; color: #EF4444; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; font-size: 9px; display: flex; align-items: center; justify-content: center; }
        .remove-btn:active { background: #FEE2E2; transform: scale(0.9); }
        .bill-section { background: white; margin: 14px; border-radius: var(--radius-md); padding: 14px; border: 1px solid var(--neutral-border); box-shadow: var(--shadow-xs); }
        .bill-title { font-family: 'Poppins',sans-serif; font-size: 14px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        .bill-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; color: var(--neutral-gray); }
        .bill-row.total { border-top: 2px solid var(--neutral-dark); padding-top: 12px; margin-top: 10px; font-size: 16px; font-weight: 800; color: var(--neutral-dark); }
        .free-tag { color: #10B981; font-weight: 700; }
        .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: white; padding: 10px 14px; box-shadow: 0 -4px 20px rgba(0,0,0,0.06); z-index: 100; border-top: 1px solid var(--neutral-border); display: flex; align-items: center; gap: 10px; }
        .total-info { flex: 1; }
        .total-label { font-size: 9px; color: var(--neutral-gray); }
        .total-amount { font-family: 'Poppins',sans-serif; font-size: 18px; font-weight: 700; }
        .checkout-btn { background: var(--brand-orange); color: #1a1a1a; border: none; padding: 13px 24px; border-radius: var(--radius-full); font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'Inter',sans-serif; white-space: nowrap; transition: all 0.15s ease; }
        .checkout-btn:active { background: #E8890A; transform: scale(0.96); }
        .checkout-btn:disabled { background: #D1D5DB; color: #9CA3AF; cursor: not-allowed; }
        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-state i { font-size: 64px; color: #D1D5DB; margin-bottom: 16px; display: block; }
        .empty-state h3 { font-family: 'Poppins',sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .empty-state p { font-size: 12px; color: var(--neutral-gray); margin-bottom: 16px; }
        .btn-primary { background: var(--brand-green); color: white; border: none; padding: 12px 24px; border-radius: var(--radius-full); font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Inter',sans-serif; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
        .btn-outline { background: white; color: var(--brand-green); border: 2px solid var(--brand-green); padding: 10px 22px; border-radius: var(--radius-full); font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'Inter',sans-serif; }
        .toast { position: fixed; bottom: 95px; left: 50%; transform: translateX(-50%); background: var(--neutral-dark); color: white; padding: 10px 20px; border-radius: var(--radius-full); font-size: 12px; z-index: 200; opacity: 0; visibility: hidden; white-space: nowrap; box-shadow: var(--shadow-md); transition: all 0.3s ease; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
        .toast.show { opacity: 1; visibility: visible; }
        .toast.error { background: #EF4444; }
        .toast.success { background: #10B981; }
        .toast.warning { background: #F59E0B; color: #1a1a1a; }
        .min-order-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px); z-index: 500; display: none; align-items: center; justify-content: center; padding: 20px; }
        .min-order-overlay.show { display: flex; }
        .min-order-box { background: white; border-radius: 24px; padding: 28px 22px; text-align: center; width: 100%; max-width: 360px; animation: popupIn 0.35s ease; }
        .min-order-icon { width: 70px; height: 70px; border-radius: 50%; background: #FFF8EB; color: #F59E0B; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 32px; }
        .min-order-title { font-family: 'Poppins', sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 8px; color: #1A1A1A; }
        .min-order-msg { font-size: 13px; color: #6B7280; margin-bottom: 18px; line-height: 1.7; }
        .min-order-msg strong { color: #0B5A31; }
        .min-order-btn { width: 100%; padding: 13px; border-radius: 9999px; font-size: 14px; font-weight: 700; cursor: pointer; border: none; margin-bottom: 8px; transition: all 0.2s; font-family: 'Inter', sans-serif; }
        .min-order-btn:active { transform: scale(0.95); }
        .min-order-btn.primary { background: var(--brand-green); color: white; }
        .min-order-btn.orange { background: var(--brand-orange); color: #1a1a1a; }
        .min-order-btn.ghost { background: #F3F4F6; color: #6B7280; }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <span class="top-title">🛒 My Cart</span>
    <span class="top-count" id="itemCount">0 items</span>
</div>

<div class="main-content" id="mainContent"></div>

<div class="bottom-bar" id="bottomBar" style="display:none;">
    <div class="total-info">
        <div class="total-label">Total Amount</div>
        <div class="total-amount" id="totalAmount">₹0</div>
    </div>
    <button class="checkout-btn" id="checkoutBtn" onclick="goToCheckout()">Checkout →</button>
</div>

<div class="min-order-overlay" id="minOrderPopup">
    <div class="min-order-box">
        <div class="min-order-icon" id="popupIcon"><i class="fas fa-shopping-basket"></i></div>
        <h3 class="min-order-title" id="minOrderTitle">🛒 ZyMart+</h3>
        <p class="min-order-msg" id="minOrderMsg"></p>
        <button class="min-order-btn orange" id="popupBtn1" onclick="continueShopping()">🛍️ Aur Shopping Karein</button>
        <button class="min-order-btn primary" id="popupBtn2" style="display:none;" onclick="continueWithCharge()">✅ Order Continue Karein</button>
        <button class="min-order-btn ghost" onclick="closeMinOrderPopup()">Cancel</button>
    </div>
</div>

<div class="toast" id="toastMsg"><span id="toastText"></span></div>

<script>
(function() {
    'use strict';
    
    var CONFIG = {
        SUPABASE_URL: 'https://zwajyovemwdqtkecipeb.supabase.co',
        SUPABASE_KEY: 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1'
    };
    
    var sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
    
    var cart = [];
    var currentUser = null;
    var couponDiscount = 0;
    var deliverySettings = null;
    var isRefreshingCart = false;
    
    var CartManager = {
        getCart: function() {
            try { return JSON.parse(localStorage.getItem('zymart_cart') || '[]'); } 
            catch(e) { return []; }
        },
        saveCart: function(c) {
            try { localStorage.setItem('zymart_cart', JSON.stringify(c)); } 
            catch(e) {}
        },
        getTotalItems: function() {
            var c = this.getCart();
            return c.reduce(function(sum, item) { return sum + (item.quantity || 1); }, 0);
        },
        getTotalPrice: function() {
            var c = this.getCart();
            return c.reduce(function(sum, item) { return sum + (item.price * (item.quantity || 1)); }, 0);
        }
    };
    
    function getEl(id) { return document.getElementById(id); }
    
    function esc(s) { 
        if(!s) return ''; 
        var d = document.createElement('div'); 
        d.textContent = s; 
        return d.innerHTML; 
    }
    
    function showToast(m, type) { 
        var t = getEl('toastMsg'), s = getEl('toastText'); 
        if (!t || !s) return; 
        s.textContent = m; 
        t.className = 'toast';
        if (type === 'error') t.classList.add('error');
        else if (type === 'success') t.classList.add('success');
        else if (type === 'warning') t.classList.add('warning');
        t.classList.add('show'); 
        clearTimeout(t._timer); 
        t._timer = setTimeout(function() { 
            t.classList.remove('show','error','success','warning'); 
        }, 2500); 
    }
    
    function fmtWeight(w, u) {
        if (!w || w === 'null' || w === 'undefined') return '';
        var nw = parseFloat(w);
        if (isNaN(nw) || nw <= 0) return '';
        var unitLower = u ? u.toLowerCase() : '';
        if (unitLower === 'gm' || unitLower === 'gram' || unitLower === 'g' || unitLower === 'grams') {
            if (nw >= 1000) return (nw/1000).toFixed(1).replace(/\.0$/,'') + ' kg';
            return nw + ' gram';
        }
        if (unitLower === 'kg' || unitLower === 'kilogram') return nw + ' kg';
        if (unitLower === 'ml' || unitLower === 'milliliter') return nw + ' ml';
        if (unitLower === 'l' || unitLower === 'liter' || unitLower === 'litre') return nw + ' L';
        if (unitLower === 'pcs' || unitLower === 'piece') return nw + ' pcs';
        return nw + (u ? ' ' + u : '');
    }
    
    // ✅ FIXED: Cache-first loading (fast!)
    function loadDeliverySettingsFromCache() {
        try {
            var cached = localStorage.getItem('zymart_delivery_settings');
            if(cached) {
                var parsed = JSON.parse(cached);
                var age = Date.now() - (parsed._cachedAt || 0);
                // 5 min tak valid
                if(age < 300000) {
                    deliverySettings = parsed;
                    return true;
                }
            }
        } catch(e) {}
        return false;
    }
    
    async function loadDeliverySettings() {
        try {
            var r = await sb.from('delivery_settings')
                .select('*')
                .order('updated_at', { ascending: false })
                .limit(1)
                .single();
                
            if(r.data) {
                deliverySettings = r.data;
                try {
                    r.data._cachedAt = Date.now();
                    localStorage.setItem('zymart_delivery_settings', JSON.stringify(r.data));
                } catch(e) {}
            } else {
                deliverySettings = getDefaultSettings();
            }
        } catch(e) {
            deliverySettings = getDefaultSettings();
        }
    }
    
    function getDefaultSettings() {
        return {
            delivery_charge: 40,
            free_delivery_above: 299,
            min_order_amount: 0,
            is_holiday: false,
            is_open: true,
            opening_time: '08:00:00',
            closing_time: '20:00:00'
        };
    }
    
    function isCurrentlyOpen() {
        if (!deliverySettings) return true;
        if (deliverySettings.is_holiday === true) return false;
        if (deliverySettings.is_open === false) return false;
        
        var now = new Date();
        var currentMinutes = now.getHours() * 60 + now.getMinutes();
        var startParts = (deliverySettings.opening_time || '08:00:00').substring(0, 5).split(':');
        var endParts = (deliverySettings.closing_time || '20:00:00').substring(0, 5).split(':');
        var startMinutes = parseInt(startParts[0]) * 60 + parseInt(startParts[1]);
        var endMinutes = parseInt(endParts[0]) * 60 + parseInt(endParts[1]);
        
        return currentMinutes >= startMinutes && currentMinutes <= endMinutes;
    }
    
    function getClosedMessage() {
        if (!deliverySettings) return 'Dukan band hai.';
        if (deliverySettings.is_holiday === true) {
            return deliverySettings.holiday_reason || 'Aaj dukan band hai. Kal phir aayenge!';
        }
        var openTime = formatTime(deliverySettings.opening_time || '08:00:00');
        var closeTime = formatTime(deliverySettings.closing_time || '20:00:00');
        return 'Hamara samay: ' + openTime + ' - ' + closeTime + '. Abhi order nahi ho sakta.';
    }
    
    function formatTime(timeStr) {
        if (!timeStr) return '8AM';
        var parts = timeStr.substring(0, 5).split(':');
        var hours = parseInt(parts[0]) || 8;
        var ampm = hours >= 12 ? 'PM' : 'AM';
        var displayHours = hours % 12 || 12;
        return displayHours + ampm;
    }
    
    async function saveOrderAttempt(reason) {
        try {
            var mobile = localStorage.getItem('zymart_user_phone') || '';
            var total = CartManager.getTotalPrice();
            await sb.from('order_attempts').insert([{
                mobile_number: mobile || null,
                cart_items: cart,
                total_amount: total,
                attempt_reason: reason,
                created_at: new Date().toISOString()
            }]);
        } catch(e) { console.error('Save attempt error:', e); }
    }
    
    // ✅ FIXED: Batch fetch (ek query mein saare products) — 10x faster!
    async function refreshCartPrices() {
        if (isRefreshingCart) return;
        isRefreshingCart = true;
        
        var cartData = CartManager.getCart();
        if (!cartData.length) {
            isRefreshingCart = false;
            return;
        }
        
        try {
            // ✅ Ek hi query mein saare products
            var productIds = [];
            for(var i = 0; i < cartData.length; i++) {
                if(cartData[i].id && productIds.indexOf(cartData[i].id) === -1) {
                    productIds.push(cartData[i].id);
                }
            }
            
            var res = await sb.from('products').select('*').in('id', productIds);
            var productsMap = {};
            if(res.data) {
                for(var j = 0; j < res.data.length; j++) {
                    productsMap[res.data[j].id] = res.data[j];
                }
            }
            
            var updatedCart = [];
            var removedItems = [];
            var priceChanged = false;
            
            for (var k = 0; k < cartData.length; k++) {
                var item = cartData[k];
                var product = productsMap[item.id];
                
                if (!product || !product.is_active || product.is_on_hold || product.delete_requested) {
                    removedItems.push(item.name || 'Product');
                    continue;
                }
                
                var variants = [];
                try { 
                    variants = typeof product.variants === 'string' ? JSON.parse(product.variants) : (product.variants || []); 
                } catch(e) { variants = []; }
                
                var newPrice = parseFloat(product.price) || 0;
                var newImage = (product.images && product.images[0]) || product.image_url || item.image;
                var newStock = parseInt(product.stock) || 0;
                
                if (item.variantKey && variants.length > 0) {
                    for (var v = 0; v < variants.length; v++) {
                        var variant = variants[v];
                        var vW = String(variant.weight || '');
                        var vU = String(variant.weight_unit || variant.unit || '');
                        if (vW === String(item.variantWeight || '') && vU === String(item.variantUnit || '')) {
                            newPrice = parseFloat(variant.offer_price || variant.price) || 0;
                            newStock = parseInt(variant.stock) || 0;
                            break;
                        }
                    }
                } else if (product.offer_price && parseFloat(product.offer_price) < newPrice) {
                    newPrice = parseFloat(product.offer_price);
                }
                
                if(item.price !== newPrice) priceChanged = true;
                
                item.price = newPrice;
                item.name = product.name || item.name;
                item.image = newImage;
                item.stock = newStock;
                
                updatedCart.push(item);
            }
            
            CartManager.saveCart(updatedCart);
            cart = updatedCart;
            
            if (removedItems.length > 0) {
                showToast('⚠️ ' + removedItems.length + ' product(s) removed', 'warning');
            }
            
            if(removedItems.length > 0 || priceChanged) {
                renderCart();
            }
        } catch(e) {
            console.error('[Cart] Refresh error:', e);
        }
        
        isRefreshingCart = false;
    }
    
    function loadCart() { cart = CartManager.getCart(); return cart; }
    function saveCart() { CartManager.saveCart(cart); }
    
    function groupCartByShop() {
        var groups = {};
        for (var i = 0; i < cart.length; i++) {
            var item = cart[i];
            var shopId = item.shop_id || 'unknown';
            if (!groups[shopId]) {
                groups[shopId] = { 
                    shop_id: shopId, 
                    shop_name: item.shop_name || item.shopName || 'Shop', 
                    items: [] 
                };
            }
            groups[shopId].items.push({ index: i, item: item });
        }
        return groups;
    }
    
    function calcTotals() { 
        var subtotal = cart.reduce(function(a, i) { 
            return a + ((i.price || 0) * (i.quantity || 1)); 
        }, 0); 
        
        var discount = couponDiscount > 0 ? Math.round(subtotal * couponDiscount / 100) : 0; 
        
        var freeDeliveryAbove = deliverySettings ? parseFloat(deliverySettings.free_delivery_above) : 299;
        var deliveryCharge = deliverySettings ? parseFloat(deliverySettings.delivery_charge) : 40;
        
        var deliveryFee = (subtotal - discount) >= freeDeliveryAbove ? 0 : deliveryCharge; 
        var total = subtotal - discount + deliveryFee;
        
        return { subtotal: subtotal, discount: discount, deliveryFee: deliveryFee, total: total, freeDeliveryAbove: freeDeliveryAbove, deliveryCharge: deliveryCharge };
    }
    
    function renderCart() {
        loadCart(); 
        var mc = getEl('mainContent');
        var bar = getEl('bottomBar');
        var count = getEl('itemCount');
        
        var totalItems = cart.reduce(function(s, i) { return s + (i.quantity || 1); }, 0);
        count.textContent = totalItems + ' item' + (totalItems !== 1 ? 's' : '');
        
        if (!cart.length) {
            mc.innerHTML = '<div class="empty-state">' +
                '<i class="fas fa-shopping-cart"></i>' +
                '<h3>Your Cart is Empty</h3>' +
                '<p>Looks like you haven\'t added anything yet.<br>Browse products from nearby shops!</p>' +
                '<a href="products.html" class="btn-primary"><i class="fas fa-shopping-bag"></i> Browse Products</a><br><br>' +
                '<button class="btn-outline" onclick="window.location.href=\'index.html\'"><i class="fas fa-home"></i> Go Home</button>' +
                '</div>';
            bar.style.display = 'none'; 
            return;
        }
        
        bar.style.display = 'flex';
        var totals = calcTotals();
        var groups = groupCartByShop();
        var shopIds = Object.keys(groups);
        
        // ✅ FIXED: Simple checkout text
        var checkoutBtn = getEl('checkoutBtn');
        if (checkoutBtn) {
            checkoutBtn.disabled = false;
            checkoutBtn.textContent = 'Checkout →';
        }
        
        var h = '';
        
        // ✅ FIXED: Multi-shop message (one order)
        if (shopIds.length > 1) {
            h += '<div class="multi-shop-info"><i class="fas fa-info-circle"></i><div>Your cart has products from <strong>' + shopIds.length + ' shops</strong>.<br>All items will be in <strong>one order</strong>. Each shop handles their own items.</div></div>';
        }
        
        for (var s = 0; s < shopIds.length; s++) {
            var group = groups[shopIds[s]];
            h += '<div class="shop-group"><div class="shop-group-header">🏪 ' + esc(group.shop_name) + ' <span class="nearby-tag">' + group.items.length + ' items</span></div>';
            h += '<div class="cart-items">';
            
            for (var i = 0; i < group.items.length; i++) {
                var item = group.items[i].item;
                var idx = group.items[i].index;
                var qty = item.quantity || 1;
                var price = item.price || 0;
                var itemTotal = price * qty;
                var stock = item.stock || 0;
                var isLowStock = stock > 0 && stock <= 5;
                var variantLabel = '';
                
                if (item.variantWeight) variantLabel = fmtWeight(item.variantWeight, item.variantUnit);
                
                h += '<div class="cart-item" id="cartItem' + idx + '">';
                h += '<div class="item-image">';
                if(item.image) {
                    h += '<img src="' + item.image + '" loading="lazy" alt="' + esc(item.name || 'Product') + '" onerror="this.parentElement.innerHTML=\'<i class=&#34;fas fa-box-open&#34; style=&#34;font-size:26px;color:#D1D5DB;&#34;></i>\'">';
                } else {
                    h += '<i class="fas fa-box-open" style="font-size:26px;color:#D1D5DB;"></i>';
                }
                h += '</div>';
                h += '<div class="item-details">';
                h += '<div class="item-name">' + esc(item.name || 'Product') + '</div>';
                if (variantLabel) h += '<span class="item-variant">⚖️ ' + variantLabel + '</span>';
                h += '<div class="item-shop">🏪 ' + esc(group.shop_name) + '</div>';
                h += '<div class="item-price-row">';
                h += '<span class="item-price">₹' + price.toLocaleString('en-IN') + '</span>';
                h += '<span class="item-total">× ' + qty + ' = ₹' + itemTotal.toLocaleString('en-IN') + '</span>';
                h += '</div>';
                if (isLowStock) h += '<div class="item-stock-warn">⚠️ Only ' + stock + ' left!</div>';
                h += '</div>';
                h += '<div class="qty-control">';
                h += '<button class="qty-btn" onclick="changeQty(' + idx + ',-1)"' + (qty <= 1 ? ' disabled' : '') + '>−</button>';
                h += '<span class="qty-value">' + qty + '</span>';
                h += '<button class="qty-btn" onclick="changeQty(' + idx + ',1)"' + (stock > 0 && qty >= stock ? ' disabled' : '') + '>+</button>';
                h += '</div>';
                h += '<button class="remove-btn" onclick="removeItem(' + idx + ')" title="Remove">✕</button>';
                h += '</div>';
            }
            h += '</div></div>';
        }
        
        h += '<div class="bill-section">';
        h += '<div class="bill-title"><i class="fas fa-receipt"></i> Bill Details</div>';
        h += '<div class="bill-row"><span>Item Total (' + totalItems + ' items)</span><span>₹' + totals.subtotal.toLocaleString('en-IN') + '</span></div>';
        h += '<div class="bill-row"><span>Delivery Fee</span>';
        h += '<span class="' + (totals.deliveryFee === 0 ? 'free-tag' : '') + '">' + (totals.deliveryFee === 0 ? '🎉 FREE' : '₹' + totals.deliveryFee) + '</span></div>';
        h += '<div class="bill-row total"><span>Total Amount</span><span>₹' + totals.total.toLocaleString('en-IN') + '</span></div>';
        h += '</div>';
        
        mc.innerHTML = h;
        getEl('totalAmount').textContent = '₹' + totals.total.toLocaleString('en-IN');
    }
    
    window.changeQty = function(i, d) { 
        var item = cart[i];
        if (!item) return;
        var nq = (item.quantity || 1) + d; 
        var maxStock = item.stock || 0;
        
        if (maxStock > 0 && nq > maxStock) { 
            showToast('⚠️ Only ' + maxStock + ' available in stock!', 'warning'); 
            return; 
        }
        
        if (nq <= 0) { 
            var el = getEl('cartItem' + i);
            if (el) {
                el.classList.add('removing');
                setTimeout(function() { cart.splice(i, 1); saveCart(); renderCart(); }, 200);
            } else {
                cart.splice(i, 1); saveCart(); renderCart(); 
            }
            showToast('🗑️ Item removed', 'warning');
        } else { 
            cart[i].quantity = nq; saveCart(); renderCart(); 
        }
    };
    
    window.removeItem = function(i) { 
        var el = getEl('cartItem' + i);
        if (el) {
            el.classList.add('removing');
            setTimeout(function() { cart.splice(i, 1); saveCart(); renderCart(); }, 200);
        } else {
            cart.splice(i, 1); saveCart(); renderCart(); 
        }
        showToast('🗑️ Item removed from cart', 'success'); 
    };
    
    async function checkUser() { 
        try { 
            var r = await sb.auth.getSession(); 
            if (r && r.data && r.data.session) { 
                currentUser = r.data.session.user; 
                return; 
            }
        } catch(e) {}
        
        try {
            var session = JSON.parse(localStorage.getItem('zymart_session') || 'null');
            if (session && session.userId) { 
                currentUser = { id: session.userId, phone: session.phone }; 
                return; 
            }
        } catch(e) {}
        currentUser = null;
    }
    
    function showMinOrderPopup(subtotal, freeDeliveryAbove, deliveryCharge) {
        var popup = getEl('minOrderPopup');
        var msg = getEl('minOrderMsg');
        var icon = getEl('popupIcon');
        var title = getEl('minOrderTitle');
        var btn1 = getEl('popupBtn1');
        var btn2 = getEl('popupBtn2');
        
        var remaining = freeDeliveryAbove - subtotal;
        
        icon.style.background = '#FFF8EB';
        icon.style.color = '#F59E0B';
        icon.innerHTML = '<i class="fas fa-shopping-basket"></i>';
        title.textContent = '🛒 ZyMart+';
        msg.innerHTML = 'Aapka order <strong>₹' + subtotal.toLocaleString('en-IN') + '</strong> ka hai.<br><br>' +
            '₹' + freeDeliveryAbove.toLocaleString('en-IN') + ' se kam order par<br>' +
            '<strong>₹' + deliveryCharge.toLocaleString('en-IN') + '</strong> delivery charge lagega.<br><br>' +
            '₹' + freeDeliveryAbove.toLocaleString('en-IN') + ' ya usse upar order karne par<br>' +
            '<strong>Delivery FREE</strong> hai!<br><br>' +
            'Abhi sirf <strong>₹' + remaining.toLocaleString('en-IN') + '</strong> aur add karein!';
        
        btn1.textContent = '🛍️ Aur Shopping Karein';
        btn1.className = 'min-order-btn orange';
        btn1.onclick = continueShopping;
        
        btn2.textContent = '✅ Order Continue Karein';
        btn2.style.display = 'block';
        btn2.className = 'min-order-btn primary';
        btn2.onclick = continueWithCharge;
        
        popup.classList.add('show');
    }
    
    function showClosedPopup() {
        var popup = getEl('minOrderPopup');
        var msg = getEl('minOrderMsg');
        var icon = getEl('popupIcon');
        var title = getEl('minOrderTitle');
        var btn1 = getEl('popupBtn1');
        var btn2 = getEl('popupBtn2');
        
        icon.innerHTML = '<i class="fas fa-clock"></i>';
        icon.style.background = '#FEF2F2';
        icon.style.color = '#EF4444';
        title.textContent = '🏪 Dukan Band Hai!';
        msg.innerHTML = getClosedMessage() + '<br><br>Kal phir aayenge!';
        
        btn1.textContent = '🛍️ Shopping Karein';
        btn1.className = 'min-order-btn orange';
        btn1.onclick = continueShopping;
        btn2.style.display = 'none';
        
        popup.classList.add('show');
    }
    
    window.closeMinOrderPopup = function() { getEl('minOrderPopup').classList.remove('show'); };
    window.continueShopping = function() { getEl('minOrderPopup').classList.remove('show'); window.location.href = 'products.html'; };
    window.continueWithCharge = function() { getEl('minOrderPopup').classList.remove('show'); window.location.href = 'checkout.html'; };
    
    window.goToCheckout = async function() {
        loadCart();
        if (!cart.length) { showToast('🛒 Your cart is empty!', 'error'); return; }
        
        await checkUser();
        if (!currentUser) {
            showToast('🔐 Please login to continue', 'warning'); 
            try { sessionStorage.setItem('zymart_redirect_after_login', 'checkout.html'); } catch(e) {}
            setTimeout(function() { window.location.href = 'login.html'; }, 600); 
            return; 
        }
        
        if (!isCurrentlyOpen()) {
            await saveOrderAttempt('closed');
            showClosedPopup();
            return;
        }
        
        var totals = calcTotals();
        var freeDeliveryAbove = deliverySettings ? parseFloat(deliverySettings.free_delivery_above) : 299;
        var deliveryCharge = deliverySettings ? parseFloat(deliverySettings.delivery_charge) : 40;
        
        if (totals.subtotal < freeDeliveryAbove && deliveryCharge > 0) {
            showMinOrderPopup(totals.subtotal, freeDeliveryAbove, deliveryCharge);
            return;
        }
        
        window.location.href = 'checkout.html';
    };
    
    window.addEventListener('storage', function(e) {
        if (e.key === 'zymart_cart') { loadCart(); renderCart(); }
    });
    
    // ✅ FIXED: Instant render, background refresh
    document.addEventListener('DOMContentLoaded', async function() { 
        // Step 1: Load cached settings (instant)
        loadDeliverySettingsFromCache();
        
        // Step 2: Load cart and render immediately (instant)
        loadCart();
        renderCart();
        
        // Step 3: Load user (fast, localStorage)
        await checkUser();
        
        // Step 4: Background refresh — no loading overlay!
        Promise.all([
            loadDeliverySettings(),
            refreshCartPrices()
        ]).then(function() {
            // Re-render when fresh data comes
            renderCart();
        }).catch(function(e) {
            console.error('[Cart] Background error:', e);
        });
    });
    
    window.addEventListener('error', function(e) { console.error('[Cart]', e.message); });
    
    window.changeQty = changeQty;
    window.removeItem = removeItem;
    window.goToCheckout = goToCheckout;
    window.closeMinOrderPopup = closeMinOrderPopup;
    window.continueShopping = continueShopping;
    window.continueWithCharge = continueWithCharge;
    
})();
</script>
</body>
</html>
