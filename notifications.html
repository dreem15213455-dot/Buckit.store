<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Notifications - ZyMart+</title>
    <meta name="theme-color" content="#0B5A31">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --brand-green: #0B5A31;
            --brand-orange: #F59E0B;
            --neutral-bg: #F8FAF9;
            --neutral-border: #E8ECEA;
            --neutral-gray: #6B7280;
            --neutral-dark: #1A1A1A;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
            --radius-md: 14px;
            --radius-full: 9999px;
            --status-bar-height: env(safe-area-inset-top, 0px);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--neutral-bg);
            color: var(--neutral-dark);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }
        
        @keyframes slideUp { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .top-bar {
            background: var(--brand-green);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            padding: 10px 14px;
            padding-top: calc(10px + var(--status-bar-height));
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 16px rgba(11,90,49,0.3);
        }
        
        .back-btn {
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.10);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            color: white;
            font-size: 14px;
            text-decoration: none;
        }
        
        .back-btn:active { background: rgba(255,255,255,0.20); transform: scale(0.93); }
        
        .top-title {
            font-family: 'Poppins', sans-serif;
            flex: 1;
            font-size: 16px;
            font-weight: 700;
            color: white;
        }
        
        .main-content {
            padding-top: 62px;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
        }
        
        .notification-item {
            background: white;
            margin: 10px 14px;
            border-radius: var(--radius-md);
            padding: 14px;
            border: 1px solid var(--neutral-border);
            box-shadow: var(--shadow-sm);
            animation: slideUp 0.3s ease;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        
        .notification-item:active { transform: scale(0.98); }
        
        .notification-item.unread {
            border-left: 4px solid var(--brand-orange);
            background: #FFFDF5;
        }
        
        .notification-item.read {
            border-left: 4px solid #D1D5DB;
            opacity: 0.8;
        }
        
        .notification-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            margin-right: 10px;
        }
        
        .notification-icon.offer { background: #FEF3C7; color: #D97706; }
        .notification-icon.general { background: #EDF7F1; color: #0B5A31; }
        .notification-icon.alert { background: #FEF2F2; color: #EF4444; }
        
        .notification-content { flex: 1; }
        
        .notification-title {
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 3px;
        }
        
        .notification-message {
            font-size: 12px;
            color: var(--neutral-gray);
            line-height: 1.5;
        }
        
        .notification-time {
            font-size: 9px;
            color: #9CA3AF;
            margin-top: 6px;
        }
        
        .unread-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--brand-orange);
            color: white;
            font-size: 8px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: var(--radius-full);
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            animation: fadeIn 0.5s ease;
        }
        
        .empty-state i {
            font-size: 60px;
            color: #D1D5DB;
            margin-bottom: 16px;
            display: block;
        }
        
        .empty-state h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .empty-state p {
            font-size: 12px;
            color: var(--neutral-gray);
            margin-bottom: 16px;
        }
        
        .btn-primary {
            background: var(--brand-green);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: var(--radius-full);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }
        
        .loading-state {
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            width: 30px;
            height: 30px;
            border: 2.5px solid #E5E7EB;
            border-top-color: var(--brand-orange);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 10px;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--neutral-dark);
            color: white;
            padding: 10px 18px;
            border-radius: var(--radius-full);
            font-size: 11px;
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            white-space: nowrap;
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .toast.show { opacity: 1; visibility: visible; }
        .toast.success { background: #10B981; }
        .toast.error { background: #EF4444; }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <span class="top-title">🔔 Notifications</span>
    <button class="back-btn" onclick="markAllRead()" style="font-size:11px;width:auto;padding:0 12px;border-radius:9999px;">Mark all read</button>
</div>

<div class="main-content" id="mainContent">
    <div class="loading-state">
        <div class="spinner"></div>
        <p style="color:#6B7280;font-size:13px;">Loading notifications...</p>
    </div>
</div>

<div class="toast" id="toastMsg"><span id="toastText"></span></div>

<script>
(function() {
    'use strict';
    
    var CONFIG = {
        SUPABASE_URL: 'https://zwajyovemwdqtkecipeb.supabase.co',
        SUPABASE_KEY: 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1'
    };
    
    var sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
    
    function getEl(id) { return document.getElementById(id); }
    
    function esc(s) { 
        if(!s) return ''; 
        var d = document.createElement('div'); 
        d.textContent = s; 
        return d.innerHTML; 
    }
    
    function showToast(m, type) {
        var t = getEl('toastMsg'), s = getEl('toastText');
        if(!t || !s) return;
        s.textContent = m;
        t.className = 'toast';
        if(type === 'success') t.classList.add('success');
        else if(type === 'error') t.classList.add('error');
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(function() { t.classList.remove('show','success','error'); }, 2500);
    }
    
    function formatTime(createdAt) {
        if(!createdAt) return '';
        try {
            var date = new Date(createdAt);
            var now = new Date();
            var diffMs = now - date;
            var diffMin = Math.floor(diffMs / 60000);
            var diffHr = Math.floor(diffMs / 3600000);
            var diffDay = Math.floor(diffMs / 86400000);
            
            if(diffMin < 1) return 'अभी';
            if(diffMin < 60) return diffMin + ' मिनट पहले';
            if(diffHr < 24) return diffHr + ' घंटे पहले';
            if(diffDay < 7) return diffDay + ' दिन पहले';
            
            return date.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        } catch(e) { return ''; }
    }
    
    function getNotificationIcon(type) {
        if(type === 'offer' || type === 'promotion') return 'offer';
        if(type === 'alert' || type === 'urgent') return 'alert';
        return 'general';
    }
    
    function getNotificationIconHTML(type) {
        var iconType = getNotificationIcon(type);
        if(iconType === 'offer') return '<i class="fas fa-gift"></i>';
        if(iconType === 'alert') return '<i class="fas fa-exclamation-circle"></i>';
        return '<i class="fas fa-bell"></i>';
    }
    
    async function loadNotifications() {
        var container = getEl('mainContent');
        
        try {
            var res = await sb.from('notifications')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(50);
            
            var notifications = res.data || [];
            
            // LocalStorage se read status check karo
            var readIds = [];
            try { readIds = JSON.parse(localStorage.getItem('read_notifications') || '[]'); } catch(e) { readIds = []; }
            
            if(notifications.length === 0) {
                container.innerHTML = '<div class="empty-state">' +
                    '<i class="fas fa-bell-slash"></i>' +
                    '<h3>कोई Notification नहीं</h3>' +
                    '<p>अभी कोई नई notification नहीं है।<br>नए offers और updates के लिए जुड़े रहें!</p>' +
                    '<a href="index.html" class="btn-primary"><i class="fas fa-home"></i> होम पेज पर जाएं</a>' +
                    '</div>';
                return;
            }
            
            var html = '';
            
            notifications.forEach(function(n) {
                var isRead = readIds.indexOf(n.id) > -1;
                var iconType = getNotificationIcon(n.type || n.notification_type);
                var iconHTML = getNotificationIconHTML(n.type || n.notification_type);
                var time = formatTime(n.created_at);
                
                html += '<div class="notification-item ' + (isRead ? 'read' : 'unread') + '" onclick="markAsRead(\'' + n.id + '\')">';
                html += '<div style="display:flex;align-items:flex-start;">';
                html += '<div class="notification-icon ' + iconType + '">' + iconHTML + '</div>';
                html += '<div class="notification-content">';
                html += '<div class="notification-title">' + esc(n.title || 'Notification') + '</div>';
                html += '<div class="notification-message">' + esc(n.message || n.body || '') + '</div>';
                if(time) html += '<div class="notification-time"><i class="far fa-clock"></i> ' + time + '</div>';
                html += '</div></div>';
                if(!isRead) html += '<span class="unread-badge">NEW</span>';
                html += '</div>';
            });
            
            container.innerHTML = html;
            
            // Sabse pehle wali notification ko read mark karo (jo abhi dikhi)
            if(notifications.length > 0) {
                var firstId = notifications[0].id;
                if(readIds.indexOf(firstId) === -1) {
                    readIds.push(firstId);
                    try { localStorage.setItem('read_notifications', JSON.stringify(readIds)); } catch(e) {}
                }
            }
            
        } catch(e) {
            console.error('Notifications error:', e);
            container.innerHTML = '<div class="empty-state">' +
                '<i class="fas fa-exclamation-circle"></i>' +
                '<h3>Error</h3>' +
                '<p>Notifications load नहीं हो पाई</p>' +
                '<button class="btn-primary" onclick="window.location.reload()"><i class="fas fa-refresh"></i> Retry</button>' +
                '</div>';
        }
    }
    
    window.markAsRead = function(id) {
        var readIds = [];
        try { readIds = JSON.parse(localStorage.getItem('read_notifications') || '[]'); } catch(e) { readIds = []; }
        
        if(readIds.indexOf(id) === -1) {
            readIds.push(id);
            try { localStorage.setItem('read_notifications', JSON.stringify(readIds)); } catch(e) {}
        }
        
        // UI update
        loadNotifications();
    };
    
    window.markAllRead = function() {
        try {
            var res = sb.from('notifications').select('id').limit(100);
            res.then(function(result) {
                var ids = (result.data || []).map(function(n) { return n.id; });
                try { localStorage.setItem('read_notifications', JSON.stringify(ids)); } catch(e) {}
                loadNotifications();
                showToast('✅ सभी notifications read हो गईं', 'success');
            });
        } catch(e) {
            showToast('❌ Error', 'error');
        }
    };
    
    document.addEventListener('DOMContentLoaded', function() {
        loadNotifications();
    });
    
    window.loadNotifications = loadNotifications;
    window.markAsRead = markAsRead;
    window.markAllRead = markAllRead;
    
})();
</script>
</body>
</html>
