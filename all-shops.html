<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>All Shops - Zatpat</title>
    <meta name="theme-color" content="#16A34A">
    
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #16A34A;
            --primary-light: #22C55E;
            --primary-bg-light: #F0FDF4;
            --accent-orange: #F97316;
            --bg-white: #FFFFFF;
            --bg-light: #F9FAFB;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --border-light: #E5E7EB;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --radius-md: 12px;
            --radius-full: 9999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
            overflow-x: hidden;
            padding-bottom: 85px;
            -webkit-font-smoothing: antialiased;
        }

        #pageProgress {
            position: fixed; top: 0; left: 0; width: 0%; height: 3px;
            background: var(--primary); z-index: 10001; transition: width 0.3s ease;
        }
        #pageProgress.loading { width: 90%; }
        #pageProgress.complete { width: 100%; opacity: 0; transition: opacity 0.3s; }

        /* Top Bar */
        .top-bar {
            background: var(--bg-white); position: sticky; top: 0; left: 0; width: 100%;
            z-index: 1000; padding: 8px 12px; box-shadow: var(--shadow-sm);
            border-bottom: 1px solid var(--border-light);
        }
        .top-row {
            display: flex; align-items: center; gap: 10px;
        }
        .back-btn {
            width: 40px; height: 40px; background: var(--bg-light); border-radius: var(--radius-full);
            display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
        }
        .back-btn i { font-size: 18px; color: var(--text-primary); }
        .search-box {
            flex: 1; background: var(--bg-light); border-radius: var(--radius-full);
            display: flex; align-items: center; padding: 0 14px; gap: 8px;
            border: 1px solid var(--border-light);
        }
        .search-box i { color: var(--text-secondary); font-size: 13px; }
        .search-box input {
            flex: 1; border: none; outline: none; padding: 10px 0;
            background: transparent; font-size: 13px;
        }
        .cart-btn {
            width: 40px; height: 40px; background: var(--bg-light); border-radius: var(--radius-full);
            display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative;
        }
        .cart-badge {
            position: absolute; top: -2px; right: -2px; background: var(--primary); color: white;
            border-radius: 50%; width: 18px; height: 18px; font-size: 9px; display: flex;
            align-items: center; justify-content: center; border: 2px solid white; font-weight: 700;
        }

        /* Filter Bar */
        .filter-bar {
            display: flex; align-items: center; gap: 8px; padding: 8px 12px;
            background: var(--bg-white); border-bottom: 1px solid var(--border-light);
            overflow-x: auto; white-space: nowrap; scrollbar-width: none;
        }
        .filter-bar::-webkit-scrollbar { display: none; }
        .filter-chip {
            padding: 6px 14px; background: var(--bg-light); border-radius: var(--radius-full);
            font-size: 12px; font-weight: 500; color: var(--text-secondary);
            border: 1px solid var(--border-light); cursor: pointer;
        }
        .filter-chip.active {
            background: var(--primary); color: white; border-color: var(--primary);
        }
        .filter-chip i { margin-right: 4px; }

        /* Shops Count */
        .shops-count {
            padding: 8px 16px; font-size: 12px; color: var(--text-secondary);
            background: var(--bg-light);
        }

        /* Shops Grid */
        .shops-grid {
            display: flex; flex-direction: column; gap: 12px; padding: 12px 16px;
        }
        
        .shop-card {
            background: var(--bg-white); border-radius: var(--radius-md);
            overflow: hidden; box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light); cursor: pointer;
            display: flex; gap: 12px; padding: 12px;
        }
        .shop-image {
            width: 80px; height: 80px; border-radius: var(--radius-md);
            background: var(--primary-bg-light); flex-shrink: 0; overflow: hidden;
        }
        .shop-image img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .shop-image i {
            font-size: 40px; color: var(--primary);
            display: flex; align-items: center; justify-content: center;
            width: 100%; height: 100%;
        }
        .shop-info { flex: 1; }
        .shop-name {
            font-size: 15px; font-weight: 700; color: var(--text-primary);
            margin-bottom: 4px; display: flex; align-items: center; gap: 6px;
        }
        .verified-badge {
            color: var(--primary); font-size: 12px;
        }
        .shop-category {
            font-size: 11px; color: var(--primary); font-weight: 500;
            margin-bottom: 6px;
        }
        .shop-meta {
            display: flex; align-items: center; gap: 12px; margin-bottom: 6px;
        }
        .shop-rating {
            display: flex; align-items: center; gap: 3px;
            background: var(--primary); color: white; padding: 2px 6px;
            border-radius: var(--radius-full); font-size: 10px; font-weight: 600;
        }
        .shop-rating i { font-size: 8px; }
        .shop-distance, .shop-time {
            font-size: 10px; color: var(--text-secondary);
        }
        .shop-distance i, .shop-time i { margin-right: 2px; }
        .shop-status {
            display: inline-block; padding: 2px 8px; border-radius: var(--radius-full);
            font-size: 9px; font-weight: 600;
        }
        .status-open { background: #D1FAE5; color: #059669; }
        .status-closed { background: #FEE2E2; color: #DC2626; }

        /* Empty State */
        .empty-state {
            text-align: center; padding: 60px 20px;
        }
        .empty-state i { font-size: 64px; color: var(--border-light); margin-bottom: 20px; }
        .empty-state h3 { font-size: 18px; margin-bottom: 8px; }
        .empty-state p { color: var(--text-secondary); }

        /* Loading */
        .loading-spinner {
            text-align: center; padding: 60px;
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid var(--border-light);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Toast */
        .toast-notification {
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
            background: var(--text-primary); color: white; padding: 10px 20px;
            border-radius: var(--radius-full); font-size: 12px; z-index: 10050;
            display: none; white-space: nowrap;
        }
        .toast-notification.show { display: flex; }

        /* Bottom Navigation */
        .bottom-nav {
            background: white; position: fixed; bottom: 0; left: 0; width: 100%;
            display: flex; justify-content: space-around; padding: 6px 16px 8px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.06); z-index: 1000;
            border-top: 1px solid var(--border-light);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            font-size: 10px; font-weight: 500; color: var(--text-secondary); cursor: pointer; position: relative;
        }
        .nav-item.active { color: var(--primary); font-weight: 600; }
        .nav-item i { font-size: 20px; margin-bottom: 2px; }
        .cart-count {
            position: absolute; top: -5px; right: -5px; background: var(--primary); color: white;
            border-radius: 50%; width: 16px; height: 16px; font-size: 9px; display: flex;
            align-items: center; justify-content: center; border: 2px solid white;
        }
    </style>
</head>
<body>

<div id="pageProgress"></div>
<div id="toastMsg" class="toast-notification"><span id="toastText"></span></div>

<div id="mainApp">
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-row">
            <div class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search shops..." autocomplete="off">
            </div>
            <div class="cart-btn" onclick="fastNavigate('cart.html')">
                <i class="fas fa-shopping-bag"></i>
                <span class="cart-badge" id="cartBadge">0</span>
            </div>
        </div>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
        <div class="filter-chip active" onclick="filterShops('all')">
            <i class="fas fa-store"></i> All
        </div>
        <div class="filter-chip" onclick="filterShops('open')">
            <i class="fas fa-circle"></i> Open Now
        </div>
        <div class="filter-chip" onclick="filterShops('rating')">
            <i class="fas fa-star"></i> 4.0+
        </div>
        <div class="filter-chip" onclick="filterShops('grocery')">
            <i class="fas fa-apple-alt"></i> Grocery
        </div>
        <div class="filter-chip" onclick="filterShops('food')">
            <i class="fas fa-hamburger"></i> Food
        </div>
        <div class="filter-chip" onclick="filterShops('pharmacy')">
            <i class="fas fa-prescription-bottle"></i> Pharmacy
        </div>
    </div>

    <!-- Shops Count -->
    <div class="shops-count" id="shopsCount">
        <i class="fas fa-store"></i> <span id="countText">0</span> shops found
    </div>

    <!-- Shops Container -->
    <div id="shopsContainer">
        <div class="loading-spinner"><div class="spinner"></div></div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a class="nav-item" onclick="fastNavigate('index.html')"><i class="fas fa-home"></i><span>Home</span></a>
        <a class="nav-item" onclick="fastNavigate('products.html')"><i class="fas fa-search"></i><span>Explore</span></a>
        <a class="nav-item" onclick="fastNavigate('cart.html')"><i class="fas fa-shopping-bag"></i><span>Cart</span><span class="cart-count" id="cartCount">0</span></a>
        <a class="nav-item" onclick="fastNavigate('profile.html')"><i class="fas fa-user"></i><span>Profile</span></a>
        <a class="nav-item" onclick="fastNavigate('orders.html')"><i class="fas fa-receipt"></i><span>Orders</span></a>
    </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const supabaseUrl = 'https://zwajyovemwdqtkecipeb.supabase.co';
    const supabaseKey = 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1';
    const zatpatDB = supabase.createClient(supabaseUrl, supabaseKey);

    let allShops = [];
    let filteredShops = [];
    let currentFilter = 'all';
    let searchQuery = '';

    function startProgress() { const b = document.getElementById('pageProgress'); b.style.width = '0%'; b.classList.add('loading'); setTimeout(() => b.style.width = '90%', 10); }
    function completeProgress() { const b = document.getElementById('pageProgress'); b.classList.remove('loading'); b.classList.add('complete'); setTimeout(() => { b.style.width = '0%'; b.classList.remove('complete'); }, 300); }
    window.fastNavigate = function(url) { startProgress(); setTimeout(() => window.location.href = url, 50); };
    function goBack() { window.history.back(); }

    function showToast(msg) {
        const t = document.getElementById('toastMsg');
        document.getElementById('toastText').innerHTML = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    function updateCartBadge() {
        const cart = JSON.parse(localStorage.getItem('zatpat_cart')) || [];
        document.getElementById('cartBadge').innerText = cart.reduce((s, i) => s + (i.quantity || 1), 0);
        document.getElementById('cartCount').innerText = cart.reduce((s, i) => s + (i.quantity || 1), 0);
    }

    async function loadShops() {
        try {
            const { data: shops, error } = await zatpatDB
                .from('shops')
                .select('*')
                .eq('status', 'approved')
                .order('rating', { ascending: false });

            if (error) throw error;

            allShops = shops || [];
            
            // Add mock data if empty
            if (allShops.length === 0) {
                allShops = [
                    { id: '1', name: 'Fresh Mart', category: 'Grocery', rating: 4.5, is_open: true, distance: '0.5 km', delivery_time: '15 min', image_url: null },
                    { id: '2', name: 'Spice Garden', category: 'Food', rating: 4.2, is_open: true, distance: '1.2 km', delivery_time: '25 min', image_url: null },
                    { id: '3', name: 'Health Plus', category: 'Pharmacy', rating: 4.8, is_open: false, distance: '0.8 km', delivery_time: '20 min', image_url: null },
                    { id: '4', name: 'Daily Needs', category: 'Grocery', rating: 3.9, is_open: true, distance: '0.3 km', delivery_time: '10 min', image_url: null }
                ];
            }

            applyFilters();

        } catch (e) {
            console.error('Load error:', e);
            document.getElementById('shopsContainer').innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-store-slash"></i>
                    <h3>Failed to load shops</h3>
                    <p>Please try again later</p>
                </div>
            `;
        }
    }

    function applyFilters() {
        filteredShops = [...allShops];

        // Apply search
        if (searchQuery) {
            filteredShops = filteredShops.filter(s => 
                s.name?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                s.category?.toLowerCase().includes(searchQuery.toLowerCase())
            );
        }

        // Apply filter
        if (currentFilter === 'open') {
            filteredShops = filteredShops.filter(s => s.is_open === true);
        } else if (currentFilter === 'rating') {
            filteredShops = filteredShops.filter(s => (s.rating || 0) >= 4.0);
        } else if (currentFilter === 'grocery') {
            filteredShops = filteredShops.filter(s => s.category?.toLowerCase() === 'grocery');
        } else if (currentFilter === 'food') {
            filteredShops = filteredShops.filter(s => s.category?.toLowerCase() === 'food');
        } else if (currentFilter === 'pharmacy') {
            filteredShops = filteredShops.filter(s => s.category?.toLowerCase() === 'pharmacy');
        }

        renderShops();
    }

    function renderShops() {
        const container = document.getElementById('shopsContainer');
        document.getElementById('countText').innerText = filteredShops.length;

        if (filteredShops.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-store"></i>
                    <h3>No shops found</h3>
                    <p>Try a different search or filter</p>
                </div>
            `;
            return;
        }

        let html = '<div class="shops-grid">';
        
        filteredShops.forEach(shop => {
            const rating = shop.rating || 4.0;
            const distance = shop.distance || `${(Math.random() * 2 + 0.5).toFixed(1)} km`;
            const deliveryTime = shop.delivery_time || `${Math.floor(Math.random() * 20 + 10)} min`;
            
            html += `
                <div class="shop-card" onclick="fastNavigate('shop-details.html?id=${shop.id}')">
                    <div class="shop-image">
                        ${shop.image_url ? 
                            `<img src="${shop.image_url}" loading="lazy" onerror="this.innerHTML='<i class=\'fas fa-store\'></i>'">` : 
                            '<i class="fas fa-store"></i>'
                        }
                    </div>
                    <div class="shop-info">
                        <div class="shop-name">
                            ${shop.name}
                            ${rating >= 4.5 ? '<span class="verified-badge"><i class="fas fa-check-circle"></i></span>' : ''}
                        </div>
                        <div class="shop-category">${shop.category || 'Store'}</div>
                        <div class="shop-meta">
                            <span class="shop-rating"><i class="fas fa-star"></i> ${rating}</span>
                            <span class="shop-distance"><i class="fas fa-map-pin"></i> ${distance}</span>
                            <span class="shop-time"><i class="fas fa-clock"></i> ${deliveryTime}</span>
                        </div>
                        <span class="shop-status ${shop.is_open ? 'status-open' : 'status-closed'}">
                            <i class="fas fa-circle"></i> ${shop.is_open ? 'Open Now' : 'Closed'}
                        </span>
                    </div>
                </div>
            `;
        });
        
        html += '</div>';
        container.innerHTML = html;
    }

    window.filterShops = function(filter) {
        currentFilter = filter;
        
        // Update active state
        document.querySelectorAll('.filter-chip').forEach(chip => chip.classList.remove('active'));
        event.target.closest('.filter-chip').classList.add('active');
        
        applyFilters();
    };

    // Search
    let searchTimer;
    document.addEventListener('DOMContentLoaded', () => {
        updateCartBadge();
        loadShops();
        
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                searchQuery = e.target.value.trim();
                applyFilters();
            }, 300);
        });
    });

    window.goBack = goBack;
    window.filterShops = filterShops;
</script>
</body>
</html>
