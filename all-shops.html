<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>सभी दुकानें - Zymart</title>
    <meta name="theme-color" content="#0B5A31">
    <meta name="description" content="Zymart - अपने आस-पास की सभी दुकानें देखें">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --brand-green: #0B5A31; --brand-orange: #F59E0B;
            --neutral-white: #FFFFFF; --neutral-bg: #F9FAFB; --neutral-border: #E5E7EB;
            --neutral-gray: #6B7280; --neutral-dark: #1A1A1A;
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --radius-sm: 10px; --radius-md: 14px; --radius-lg: 18px; --radius-full: 9999px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--neutral-bg); color: var(--neutral-dark);
            padding-bottom: 85px; -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased; min-height: 100vh;
        }
        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes skel { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
        
        .top-bar { background: var(--brand-green); position: fixed; top: 0; left: 0; width: 100%; z-index: 100; padding: 10px 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 16px rgba(11,90,49,0.3); }
        .back-btn { width: 40px; height: 40px; min-width: 40px; background: rgba(255,255,255,0.10); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 15px; transition: all 0.15s ease; }
        .back-btn:active { background: rgba(255,255,255,0.22); transform: scale(0.93); }
        .top-title { font-family: 'Poppins', sans-serif; flex: 1; font-size: 16px; font-weight: 700; color: white; }
        .main-content { padding-top: 62px; max-width: 600px; margin: 0 auto; }
        
        .search-box { padding: 10px 14px; }
        .search-box input { width: 100%; padding: 11px 16px; border: 1.5px solid var(--neutral-border); border-radius: var(--radius-full); font-size: 13px; font-family: 'Inter', sans-serif; outline: none; background: white; transition: all 0.2s ease; }
        .search-box input:focus { border-color: var(--brand-orange); box-shadow: 0 0 0 3px rgba(245,158,11,0.08); }
        .location-filter { padding: 0 14px 6px; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--brand-green); font-weight: 600; }
        
        .shop-card { background: var(--neutral-white); margin: 7px 14px; border-radius: var(--radius-lg); padding: 14px; display: flex; gap: 12px; align-items: center; border: 1px solid var(--neutral-border); box-shadow: var(--shadow-xs); cursor: pointer; animation: slideUp 0.3s ease forwards; transition: transform 0.15s ease; }
        .shop-card:active { transform: scale(0.98); }
        .shop-img { width: 56px; height: 56px; min-width: 56px; border-radius: var(--radius-sm); background: #EDF7F1; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid #C8E6C9; }
        .shop-img img { width: 100%; height: 100%; object-fit: cover; }
        .shop-img i { font-size: 24px; color: var(--brand-green); }
        .shop-info { flex: 1; min-width: 0; }
        .shop-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .shop-category { font-size: 11px; color: var(--neutral-gray); }
        .shop-meta { display: flex; gap: 10px; margin-top: 4px; font-size: 11px; color: var(--neutral-gray); }
        .shop-meta span { display: flex; align-items: center; gap: 4px; }
        .shop-meta i { color: var(--brand-green); font-size: 10px; }
        .shop-arrow { color: #D1D5DB; font-size: 13px; }
        
        .skeleton-card { background: var(--neutral-white); margin: 7px 14px; border-radius: var(--radius-lg); padding: 14px; display: flex; gap: 12px; align-items: center; border: 1px solid var(--neutral-border); }
        .skeleton-img { width: 56px; height: 56px; border-radius: var(--radius-sm); background: linear-gradient(90deg,#f0f4f2 25%,#e4ebe7 50%,#f0f4f2 75%); background-size: 200% 100%; animation: skel 1.3s infinite; }
        .skeleton-text { height: 11px; border-radius: 4px; background: linear-gradient(90deg,#f0f4f2 25%,#e4ebe7 50%,#f0f4f2 75%); background-size: 200% 100%; animation: skel 1.3s infinite; }
        .skeleton-text-sm { width: 55%; height: 9px; margin-top: 5px; }
        
        .empty-state { text-align: center; padding: 55px 20px; animation: slideUp 0.4s ease; }
        .empty-state i { font-size: 48px; color: #D1D5DB; display: block; margin-bottom: 12px; }
        .empty-state h3 { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .empty-state p { font-size: 13px; color: var(--neutral-gray); margin-bottom: 14px; }
        .empty-state button { background: var(--brand-green); color: white; border: none; padding: 10px 22px; border-radius: var(--radius-full); font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
        
        .loading-state { text-align: center; padding: 50px; }
        .spinner { width: 32px; height: 32px; border: 2.5px solid var(--neutral-border); border-top-color: var(--brand-orange); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto; }
        
        .bottom-nav { background: white; position: fixed; bottom: 0; left: 0; width: 100%; display: flex; justify-content: space-around; padding: 5px 10px 10px; box-shadow: 0 -4px 16px rgba(0,0,0,0.03); z-index: 100; border-top: 1px solid var(--neutral-border); }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 9px; font-weight: 500; color: var(--neutral-gray); cursor: pointer; padding: 3px 10px; border-radius: var(--radius-full); border: none; background: transparent; transition: all 0.15s ease; font-family: 'Inter', sans-serif; }
        .nav-item:active { background: #EDF7F1; } .nav-item.active { color: var(--brand-green); font-weight: 600; } .nav-item i { font-size: 18px; margin-bottom: 1px; }
        
        .toast { position: fixed; bottom: 95px; left: 50%; transform: translateX(-50%); background: var(--neutral-dark); color: white; padding: 9px 18px; border-radius: var(--radius-full); font-size: 11px; z-index: 200; opacity: 0; visibility: hidden; white-space: nowrap; box-shadow: var(--shadow-md); transition: all 0.3s ease; }
        .toast.show { opacity: 1; visibility: visible; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="top-bar">
    <button class="back-btn" onclick="goBack()" aria-label="वापस"><i class="fas fa-arrow-left"></i></button>
    <span class="top-title">सभी दुकानें</span>
</div>

<div class="main-content" id="mainContent">
    <div class="loading-state"><div class="spinner"></div></div>
</div>

<nav class="bottom-nav">
    <button class="nav-item" onclick="fastNavigate('index.html')"><i class="fas fa-home"></i><span>होम</span></button>
    <button class="nav-item" onclick="fastNavigate('products.html')"><i class="fas fa-box"></i><span>खोजें</span></button>
    <button class="nav-item" onclick="fastNavigate('cart.html')"><i class="fas fa-shopping-cart"></i><span>कार्ट</span></button>
    <button class="nav-item" onclick="fastNavigate('profile.html')"><i class="fas fa-user"></i><span>प्रोफाइल</span></button>
    <button class="nav-item active"><i class="fas fa-store"></i><span>दुकानें</span></button>
</nav>

<div class="toast" id="toastMsg"></div>

<script>
(function() {
    'use strict';
    
    window.addEventListener('error', function(e) { console.error('[Zymart All Shops]', e.message); });
    window.addEventListener('unhandledrejection', function(e) { console.error('[Zymart All Shops]', e.reason); e.preventDefault(); });
    
    function $(id) { return document.getElementById(id); }
    function esc(str) { if (!str) return ''; var d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
    
    var sb = null;
    try { sb = supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co', 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1'); }
    catch(e) { sb = { from: function() { return { select: function() { return { eq: function() { return { order: function() { return Promise.resolve({ data: [] }); } }; }, order: function() { return Promise.resolve({ data: [] }); } }; } }; } }; }
    var SUPABASE_URL = 'https://zwajyovemwdqtkecipeb.supabase.co';
    
    var allShops = [], userCity = null;
    
    function getFullUrl(u) { if (!u || typeof u !== 'string') return ''; if (u.indexOf('http')===0 || u.indexOf('data:')===0) return u; return SUPABASE_URL + '/storage/v1/object/public/' + u; }
    function showToast(m, e) { var t = $('toastMsg'); if (!t) return; t.textContent = m; t.style.background = e ? '#EF4444' : '#1A1A1A'; t.classList.add('show'); clearTimeout(t._timer); t._timer = setTimeout(function() { t.classList.remove('show'); }, 2500); }
    function goBack() { try { if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) { window.history.back(); return; } } catch(e) {} window.location.href = 'index.html'; }
    window.fastNavigate = function(url) { window.location.href = url; };
    
    async function loadShops() {
        var c = $('mainContent'); if (!c) return;
        try { userCity = localStorage.getItem('user_city') || null; } catch(e) { userCity = null; }
        
        // Show skeleton with search
        var skelHtml = '<div class="search-box"><input type="text" id="shopSearch" placeholder="🔍 दुकानें खोजें..." disabled></div>';
        for (var i = 0; i < 4; i++) { skelHtml += '<div class="skeleton-card"><div class="skeleton-img"></div><div style="flex:1;"><div class="skeleton-text"></div><div class="skeleton-text skeleton-text-sm"></div></div></div>'; }
        c.innerHTML = skelHtml;
        
        try {
            var result;
            if (userCity) { result = await sb.from('shops').select('*').eq('status', 'approved').eq('city', userCity).order('rating', { ascending: false }); }
            else { result = await sb.from('shops').select('*').eq('status', 'approved').order('rating', { ascending: false }); }
            allShops = (result && result.data) ? result.data : [];
            renderShops(allShops);
        } catch(e) { c.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>लोड विफल</h3><p>कनेक्शन जांचें और पुनः प्रयास करें</p><button onclick="loadShops()">🔄 पुनः प्रयास</button></div>'; showToast('❌ दुकानें लोड नहीं हुईं', true); }
    }
    
    function renderShops(shops) {
        var c = $('mainContent'); if (!c) return;
        var html = '<div class="search-box"><input type="text" id="shopSearch" placeholder="🔍 दुकानें खोजें..."></div>';
        if (userCity) { html += '<div class="location-filter"><i class="fas fa-map-marker-alt"></i> ' + esc(userCity) + ' की दुकानें</div>'; }
        
        if (!shops || shops.length === 0) {
            var msg = userCity ? (esc(userCity) + ' में कोई दुकान नहीं') : 'अभी कोई दुकान उपलब्ध नहीं';
            c.innerHTML = html + '<div class="empty-state"><i class="fas fa-store-slash"></i><h3>कोई दुकान नहीं मिली</h3><p>' + msg + '</p><button onclick="fastNavigate(\'index.html\')">🏠 होम पेज पर जाएं</button></div>';
            return;
        }
        
        for (var i = 0; i < shops.length; i++) {
            var s = shops[i], imgUrl = getFullUrl(s.image_url);
            html += '<div class="shop-card" style="animation-delay:' + (i * 0.04) + 's;" onclick="fastNavigate(\'shop-details.html?id=' + s.id + '\')">';
            html += '<div class="shop-img">' + (imgUrl ? '<img src="' + imgUrl + '" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">' : '') + '<i class="fas fa-store"' + (imgUrl ? ' style="display:none;"' : '') + '></i></div>';
            html += '<div class="shop-info"><div class="shop-name">' + esc(s.name) + '</div><div class="shop-category">' + esc(s.category || 'जनरल स्टोर') + '</div>';
            html += '<div class="shop-meta"><span><i class="fas fa-star"></i> ' + (s.rating || '4.0') + '</span><span><i class="fas fa-map-pin"></i> ' + esc(s.city || 'स्थान') + '</span></div></div>';
            html += '<i class="fas fa-chevron-right shop-arrow"></i></div>';
        }
        c.innerHTML = html;
        
        // ✅ Attach search listener
        var searchInput = $('shopSearch');
        if (searchInput) {
            searchInput.addEventListener('input', function() {
                var term = this.value.trim().toLowerCase();
                var filtered = term ? allShops.filter(function(s) {
                    return (s.name||'').toLowerCase().indexOf(term) !== -1 || (s.category||'').toLowerCase().indexOf(term) !== -1 || (s.city||'').toLowerCase().indexOf(term) !== -1;
                }) : allShops;
                // ✅ Update location filter text during search
                var locEl = document.querySelector('.location-filter');
                if (locEl) {
                    if (term) locEl.innerHTML = '<i class="fas fa-search"></i> "' + esc(term) + '" के परिणाम (' + filtered.length + ')';
                    else if (userCity) locEl.innerHTML = '<i class="fas fa-map-marker-alt"></i> ' + esc(userCity) + ' की दुकानें';
                }
                renderShopsDOM(filtered);
            });
        }
    }
    
    // ✅ Separate render for search (doesn't re-create search input)
    function renderShopsDOM(shops) {
        var c = $('mainContent'); if (!c) return;
        var searchBox = document.querySelector('.search-box');
        var locationFilter = document.querySelector('.location-filter');
        
        var html = '';
        if (searchBox) html += searchBox.outerHTML;
        if (locationFilter && locationFilter.textContent.trim()) html += locationFilter.outerHTML;
        
        if (!shops || shops.length === 0) {
            html += '<div class="empty-state"><i class="fas fa-search"></i><h3>कोई दुकान नहीं मिली</h3><p>अलग नाम से खोजें</p></div>';
        } else {
            for (var i = 0; i < shops.length; i++) {
                var s = shops[i], imgUrl = getFullUrl(s.image_url);
                html += '<div class="shop-card" onclick="fastNavigate(\'shop-details.html?id=' + s.id + '\')">';
                html += '<div class="shop-img">' + (imgUrl ? '<img src="' + imgUrl + '" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">' : '') + '<i class="fas fa-store"' + (imgUrl ? ' style="display:none;"' : '') + '></i></div>';
                html += '<div class="shop-info"><div class="shop-name">' + esc(s.name) + '</div><div class="shop-category">' + esc(s.category || 'जनरल स्टोर') + '</div>';
                html += '<div class="shop-meta"><span><i class="fas fa-star"></i> ' + (s.rating || '4.0') + '</span><span><i class="fas fa-map-pin"></i> ' + esc(s.city || 'स्थान') + '</span></div></div>';
                html += '<i class="fas fa-chevron-right shop-arrow"></i></div>';
            }
        }
        c.innerHTML = html;
        
        // Re-attach search listener
        var newSearch = $('shopSearch');
        if (newSearch) {
            newSearch.focus();
            newSearch.setSelectionRange(newSearch.value.length, newSearch.value.length);
            newSearch.addEventListener('input', function() {
                var term = this.value.trim().toLowerCase();
                var filtered = term ? allShops.filter(function(s) {
                    return (s.name||'').toLowerCase().indexOf(term) !== -1 || (s.category||'').toLowerCase().indexOf(term) !== -1 || (s.city||'').toLowerCase().indexOf(term) !== -1;
                }) : allShops;
                var locEl = document.querySelector('.location-filter');
                if (locEl) {
                    if (term) locEl.innerHTML = '<i class="fas fa-search"></i> "' + esc(term) + '" के परिणाम (' + filtered.length + ')';
                    else if (userCity) locEl.innerHTML = '<i class="fas fa-map-marker-alt"></i> ' + esc(userCity) + ' की दुकानें';
                }
                renderShopsDOM(filtered);
            });
        }
    }
    
    document.addEventListener('DOMContentLoaded', loadShops);
    window.goBack = goBack;
})();
</script>
</body>
</html>
