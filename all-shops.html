<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>All Shops - ZyMart+</title>
    <meta name="theme-color" content="#0B5A31">
    <meta name="description" content="ZyMart+ - Browse all shops">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link rel="preconnect" href="https://res.cloudinary.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root{--brand-green:#0B5A31;--brand-orange:#F59E0B;--neutral-white:#FFFFFF;--neutral-bg:#F9FAFB;--neutral-border:#E5E7EB;--neutral-gray:#6B7280;--neutral-dark:#1A1A1A;--shadow-xs:0 1px 2px rgba(0,0,0,0.04);--shadow-sm:0 1px 4px rgba(0,0,0,0.06);--radius-sm:10px;--radius-md:14px;--radius-lg:18px;--radius-full:9999px;--status-bar-height:env(safe-area-inset-top, 0px);}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',-apple-system,sans-serif;background:var(--neutral-bg);color:var(--neutral-dark);padding-bottom:calc(85px + env(safe-area-inset-bottom, 0px));-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;min-height:100vh;}
        @keyframes slideUp{from{transform:translateY(10px);opacity:0;}to{transform:translateY(0);opacity:1;}}
        @keyframes spin{to{transform:rotate(360deg);}}
        
        /* FIX: Safe-area top */
        .top-bar{background:var(--brand-green);position:fixed;top:0;left:0;width:100%;z-index:100;padding:10px 14px;padding-top:calc(10px + var(--status-bar-height));display:flex;align-items:center;gap:10px;box-shadow:0 2px 16px rgba(11,90,49,0.3);}
        .back-btn{width:40px;height:40px;min-width:40px;background:rgba(255,255,255,0.10);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:white;font-size:15px;text-decoration:none;}
        .back-btn:active{background:rgba(255,255,255,0.22);transform:scale(0.93);}
        .top-title{font-family:'Poppins',sans-serif;flex:1;font-size:16px;font-weight:700;color:white;}
        .brand-zy{color:#A3E635;}.brand-mart{color:#FDE047;}
        
        /* FIX: Safe-area top content */
        .main-content{padding-top:calc(62px + var(--status-bar-height));max-width:600px;margin:0 auto;}
        
        .location-bar{display:flex;align-items:center;gap:6px;padding:8px 14px;background:#EDF7F1;border-bottom:1px solid #C8E6C9;font-size:11px;color:#0B5A31;cursor:pointer;}
        .location-bar span{font-weight:600;}
        .nearby-badge{display:inline-block;background:#0B5A31;color:white;font-size:9px;padding:2px 8px;border-radius:9999px;font-weight:600;margin-left:4px;}
        
        /* FIX: Search with clear button */
        .search-box{padding:10px 14px;position:relative;}
        .search-box input{width:100%;padding:11px 40px 11px 16px;border:1.5px solid var(--neutral-border);border-radius:var(--radius-full);font-size:13px;font-family:'Inter',sans-serif;outline:none;background:white;}
        .search-box input:focus{border-color:var(--brand-orange);box-shadow:0 0 0 3px rgba(245,158,11,0.08);}
        .search-clear{position:absolute;right:24px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:#E5E7EB;border:none;color:#6B7280;font-size:11px;cursor:pointer;display:none;align-items:center;justify-content:center;font-weight:700;z-index:2;}
        .search-clear.show{display:flex;}
        .search-clear:active{background:#D1D5DB;}
        
        .shop-count{padding:0 14px 6px;font-size:11px;color:var(--neutral-gray);font-weight:500;}
        .shop-card{background:var(--neutral-white);margin:7px 14px;border-radius:var(--radius-lg);padding:14px;display:flex;gap:12px;align-items:center;border:1px solid var(--neutral-border);box-shadow:var(--shadow-xs);cursor:pointer;animation:slideUp 0.3s ease forwards;}
        .shop-card:active{transform:scale(0.98);}
        .shop-card.nearby{border:2px solid #0B5A31;background:#F9FDF9;}
        .shop-img{width:56px;height:56px;min-width:56px;border-radius:var(--radius-sm);background:#EDF7F1;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid #C8E6C9;}
        .shop-img img{width:100%;height:100%;object-fit:cover;}
        .shop-img i{font-size:24px;color:var(--brand-green);}
        .shop-info{flex:1;min-width:0;}
        .shop-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .shop-category{font-size:11px;color:var(--neutral-gray);}
        .shop-meta{display:flex;gap:10px;margin-top:4px;font-size:11px;color:var(--neutral-gray);flex-wrap:wrap;}
        .shop-meta span{display:flex;align-items:center;gap:4px;}
        .shop-meta i{color:var(--brand-green);font-size:10px;}
        .shop-distance{color:#0B5A31;font-weight:600;}
        .rating-new{color:#9CA3AF;font-size:10px;font-weight:600;background:#F3F4F6;padding:1px 6px;border-radius:4px;}
        .shop-arrow{color:#D1D5DB;font-size:13px;flex-shrink:0;}
        .empty-state{text-align:center;padding:55px 20px;animation:slideUp 0.4s ease;}
        .empty-state i{font-size:48px;color:#D1D5DB;display:block;margin-bottom:12px;}
        .empty-state h3{font-family:'Poppins',sans-serif;font-size:16px;font-weight:700;}
        .empty-state p{font-size:13px;color:var(--neutral-gray);margin-bottom:14px;}
        .empty-state button,.empty-state a{background:var(--brand-green);color:white;border:none;padding:10px 22px;border-radius:var(--radius-full);font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;text-decoration:none;display:inline-block;}
        .loading-state{text-align:center;padding:50px;}
        .spinner{width:32px;height:32px;border:2.5px solid var(--neutral-border);border-top-color:var(--brand-orange);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto;}
        
        /* FIX: Safe-area bottom nav */
        .bottom-nav{background:white;position:fixed;bottom:0;left:0;width:100%;display:flex;justify-content:space-around;padding:5px 10px calc(10px + env(safe-area-inset-bottom, 0px));box-shadow:0 -4px 16px rgba(0,0,0,0.03);z-index:100;border-top:1px solid var(--neutral-border);}
        .nav-item{display:flex;flex-direction:column;align-items:center;font-size:9px;font-weight:500;color:var(--neutral-gray);cursor:pointer;padding:3px 10px;border-radius:var(--radius-full);border:none;background:transparent;font-family:'Inter',sans-serif;text-decoration:none;}
        .nav-item:active{background:#EDF7F1;}.nav-item.active{color:var(--brand-green);font-weight:600;}.nav-item i{font-size:18px;margin-bottom:1px;}
        
        /* FIX: Safe-area toast */
        .toast{position:fixed;bottom:calc(95px + env(safe-area-inset-bottom, 0px));left:50%;transform:translateX(-50%);background:var(--neutral-dark);color:white;padding:9px 18px;border-radius:var(--radius-full);font-size:11px;z-index:200;opacity:0;visibility:hidden;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,0.08);transition:all 0.3s ease;max-width:90%;overflow:hidden;text-overflow:ellipsis;}
        .toast.show{opacity:1;visibility:visible;}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- FIX: Offline banner -->
<div id="netBanner" style="display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);background:#DC2626;color:white;text-align:center;padding:6px 16px;border-radius:20px;font-size:11px;font-weight:700;z-index:99999;box-shadow:0 4px 12px rgba(220,38,38,0.4);white-space:nowrap;pointer-events:none;">📴 No Internet</div>

<div class="top-bar">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <span class="top-title"><span class="brand-zy">Zy</span><span class="brand-mart">Mart</span> Shops</span>
</div>

<div class="main-content" id="mainContent">
    <div class="loading-state"><div class="spinner"></div></div>
</div>

<nav class="bottom-nav">
    <a class="nav-item" href="index.html"><i class="fas fa-home"></i><span>Home</span></a>
    <a class="nav-item" href="products.html"><i class="fas fa-box"></i><span>Products</span></a>
    <a class="nav-item" href="cart.html"><i class="fas fa-shopping-cart"></i><span>Cart</span></a>
    <a class="nav-item" href="profile.html"><i class="fas fa-user"></i><span>Profile</span></a>
    <a class="nav-item active"><i class="fas fa-store"></i><span>Shops</span></a>
</nav>

<div class="toast" id="toastMsg"></div>

<script>
(function(){'use strict';
window.addEventListener('error',function(e){console.error('[All Shops]',e.message);});

// FIX: Offline banner
window.addEventListener('offline',function(){var b=document.getElementById('netBanner');if(b)b.style.display='block';});
window.addEventListener('online',function(){var b=document.getElementById('netBanner');if(b)b.style.display='none';});

// FIX: Image fallback
var IMG_FALLBACK = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="#F3F4F6" width="100" height="100"/><circle cx="50" cy="42" r="13" fill="#D1D5DB"/><rect x="34" y="60" width="32" height="7" rx="3.5" fill="#D1D5DB"/></svg>');
window.addEventListener('error', function(e) {
    var el = e.target;
    if (el && el.tagName === 'IMG' && !el.dataset.fb) {
        el.dataset.fb = '1';
        el.onerror = null;
        el.src = IMG_FALLBACK;
    }
}, true);

var CONFIG = {
    SUPABASE_URL: 'https://zwajyovemwdqtkecipeb.supabase.co',
    SUPABASE_KEY: 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1',
    CLOUDINARY_CLOUD_NAME: 'b0zm0rac',
    CLOUDINARY_ENABLED: true
};

var sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
var SUPABASE_URL = CONFIG.SUPABASE_URL;

var allShops=[],nearbyShopIds=[],shopDistances={},userLat=null,userLng=null;
var searchDebounceTimer = null;
var currentSearchTerm = '';
var initialized = false;

function getEl(id){return document.getElementById(id);}
function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function attrEsc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function getFullUrl(u, width){
    if(!u || typeof u !== 'string') return '';
    var fullUrl;
    if(u.indexOf('http')===0 || u.indexOf('data:')===0){
        fullUrl = u;
    } else {
        fullUrl = SUPABASE_URL + '/storage/v1/object/public/' + u;
    }
    if(fullUrl.indexOf('res.cloudinary.com')===0) return fullUrl;
    if(!CONFIG.CLOUDINARY_ENABLED) return fullUrl;
    var w = width || 150;
    return 'https://res.cloudinary.com/' + CONFIG.CLOUDINARY_CLOUD_NAME + '/image/fetch/w_' + w + ',q_auto,f_auto/' + fullUrl;
}

function showToast(m){var t=getEl('toastMsg');if(!t)return;t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2200);}

function calculateDistance(lat1,lng1,lat2,lng2){var R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180,a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}

// ═══ FIX: Proper rating display — no fake 4.0 ═══
function getRatingDisplay(rating) {
    var r = parseFloat(rating) || 0;
    if (r <= 0) {
        return '<span class="rating-new">🆕 New</span>';
    }
    return '<i class="fas fa-star" style="color:#F59E0B;"></i> ' + r.toFixed(1);
}

function loadLocationAndSort(){
    var lat=parseFloat(localStorage.getItem('user_lat')||'0')||null;
    var lng=parseFloat(localStorage.getItem('user_lng')||'0')||null;
    var ts=parseInt(localStorage.getItem('location_timestamp')||'0');
    if(!lat||!lng||(Date.now()-ts)>86400000)return;
    userLat=lat;userLng=lng;nearbyShopIds=[];shopDistances={};
    for(var i=0;i<allShops.length;i++){
        var shop=allShops[i];
        if(!shop.latitude||!shop.longitude)continue;
        var dist=calculateDistance(userLat,userLng,shop.latitude,shop.longitude);
        shopDistances[shop.id]=Math.round(dist*10)/10;
        if(dist<=(shop.delivery_radius_km||10))nearbyShopIds.push(shop.id);
    }
    allShops.sort(function(a,b){
        var aN=nearbyShopIds.indexOf(a.id)!==-1,bN=nearbyShopIds.indexOf(b.id)!==-1;
        if(aN&&!bN)return-1;if(!aN&&bN)return 1;
        var aD=shopDistances[a.id]!==undefined?shopDistances[a.id]:9999;
        var bD=shopDistances[b.id]!==undefined?shopDistances[b.id]:9999;
        return aD-bD;
    });
}

function buildShopCard(s){
    var imgUrl=getFullUrl(s.image_url, 150);
    var isNearby=nearbyShopIds.indexOf(s.id)!==-1;
    var dist = shopDistances[s.id] !== undefined ? shopDistances[s.id] : null;
    var h='<div class="shop-card'+(isNearby?' nearby':'')+'" onclick="window.location.href=\'shop-details.html?id='+esc(s.id)+'\'">';
    h+='<div class="shop-img">';
    if(imgUrl){
        h+='<img src="'+attrEsc(imgUrl)+'" loading="lazy" decoding="async" alt="'+attrEsc(s.name)+'">';
    } else {
        h+='<i class="fas fa-store"></i>';
    }
    h+='</div>';
    h+='<div class="shop-info"><div class="shop-name">'+esc(s.name)+'</div><div class="shop-category">'+esc(s.category||'General Store')+'</div>';
    h+='<div class="shop-meta"><span>'+getRatingDisplay(s.rating)+'</span><span><i class="fas fa-map-pin"></i> '+esc(s.city||'')+'</span>';
    if(dist!==null)h+='<span class="shop-distance">📍 '+dist+' km</span>';
    h+='</div></div><i class="fas fa-chevron-right shop-arrow"></i></div>';
    return h;
}

function renderShopList(shops, term){
    var c=getEl('mainContent');
    if(!c)return;
    var locShort=localStorage.getItem('location_short')||'';
    var html='';
    
    if(locShort&&userLat&&userLng){
        html+='<div class="location-bar" onclick="window.location.href=\'set-location.html\'"><i class="fas fa-map-marker-alt"></i><span>📍 '+esc(locShort);
        if(nearbyShopIds.length>0)html+=' <span class="nearby-badge">'+nearbyShopIds.length+' nearby</span>';
        html+='</span></div>';
    }
    
    // FIX: search with clear button
    html+='<div class="search-box">';
    html+='<input type="text" id="shopSearch" placeholder="🔍 Search shops..." value="'+attrEsc(term||'')+'" autocomplete="off">';
    html+='<button class="search-clear'+(term?' show':'')+'" id="searchClearBtn" onclick="clearSearch()" aria-label="Clear">✕</button>';
    html+='</div>';
    
    html+='<div class="shop-count" id="shopCountEl">'+(term?'🔍 Results for "'+esc(term)+'": ':'Total ')+shops.length+' shops</div>';
    
    html+='<div id="shopCardsContainer">';
    if(!shops.length){
        html+='<div class="empty-state"><i class="fas fa-search"></i><h3>No Shops Found</h3>'+(term?'<p>Try different search term</p>':'')+'</div>';
    } else {
        for(var i=0;i<shops.length;i++){html+=buildShopCard(shops[i]);}
    }
    html+='</div>';
    
    c.innerHTML=html;
    currentSearchTerm = term || '';
    
    attachSearchListener();
}

function attachSearchListener(){
    var si=getEl('shopSearch');
    if(!si) return;
    if(si.dataset.listener === '1') return; // prevent duplicate
    si.dataset.listener = '1';
    si.addEventListener('input', function(){
        var val = this.value;
        // FIX: toggle clear button on every keystroke
        var clrBtn = getEl('searchClearBtn');
        if(clrBtn) {
            if(val.length > 0) clrBtn.classList.add('show');
            else clrBtn.classList.remove('show');
        }
        if(searchDebounceTimer) clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(function(){
            doSearch(val.trim());
        }, 300);
    });
}

function doSearch(term){
    var filtered;
    if(!term){
        filtered = allShops.slice();
    } else {
        var t = term.toLowerCase();
        filtered = allShops.filter(function(s){
            return (s.name||'').toLowerCase().indexOf(t)!==-1
                || (s.category||'').toLowerCase().indexOf(t)!==-1
                || (s.city||'').toLowerCase().indexOf(t)!==-1;
        });
    }
    updateShopListOnly(filtered, term);
}

// FIX: Only update cards + count, NOT the search input (preserves focus + cursor)
function updateShopListOnly(shops, term){
    var countEl = getEl('shopCountEl');
    var cardsEl = getEl('shopCardsContainer');
    
    if(countEl) {
        countEl.innerHTML = (term?'🔍 Results for "'+esc(term)+'": ':'Total ')+shops.length+' shops';
    }
    
    if(cardsEl) {
        var newHtml = '';
        if(!shops.length){
            newHtml = '<div class="empty-state"><i class="fas fa-search"></i><h3>No Shops Found</h3>'+(term?'<p>Try different search term</p>':'')+'</div>';
        } else {
            for(var i=0;i<shops.length;i++){newHtml += buildShopCard(shops[i]);}
        }
        cardsEl.innerHTML = newHtml;
    }
    
    currentSearchTerm = term || '';
}

window.clearSearch = function(){
    var si = getEl('shopSearch');
    if(si) {
        si.value = '';
        si.focus();
    }
    var clrBtn = getEl('searchClearBtn');
    if(clrBtn) clrBtn.classList.remove('show');
    doSearch('');
};

async function loadShops(){
    var c=getEl('mainContent');if(!c)return;
    try{
        // FIX: is_open NULL handling — show shops where is_open IS NOT FALSE
        // (new shops with NULL is_open should still be visible)
        var result = await sb.from('shops')
            .select('id, name, image_url, category, city, rating, latitude, longitude, delivery_radius_km, is_open')
            .eq('status','approved')
            .neq('is_open', false)
            .order('rating',{ascending:false})
            .limit(200);
        allShops=(result&&result.data)?result.data:[];
        loadLocationAndSort();
        renderShopList(allShops,'');
    } catch(e){
        console.error('[All Shops] Load error:', e);
        c.innerHTML='<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>Failed to Load</h3><p style="color:#6B7280;">Please check your connection</p><button onclick="window.loadShops()">🔄 Retry</button></div>';
    }
}

document.addEventListener('DOMContentLoaded', function(){
    if(!navigator.onLine) { var nb = document.getElementById('netBanner'); if(nb) nb.style.display = 'block'; }
    loadShops();
});

window.loadShops = loadShops;
})();
</script>
</body>
</html>
