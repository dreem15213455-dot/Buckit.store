<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>सभी दुकानें - Zymart</title>
    <meta name="theme-color" content="#0B5A31">
    <meta name="description" content="Zymart - सभी दुकानें देखें">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --brand-green: #0B5A31; --brand-orange: #F59E0B;
            --neutral-white: #FFFFFF; --neutral-bg: #F9FAFB; --neutral-border: #E5E7EB;
            --neutral-gray: #6B7280; --neutral-dark: #1A1A1A;
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --radius-sm: 10px; --radius-md: 14px; --radius-lg: 18px; --radius-full: 9999px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--neutral-bg); color: var(--neutral-dark); padding-bottom: 85px; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; min-height: 100vh; }
        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .top-bar { background: var(--brand-green); position: fixed; top: 0; left: 0; width: 100%; z-index: 100; padding: 10px 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 16px rgba(11,90,49,0.3); }
        .back-btn { width: 40px; height: 40px; min-width: 40px; background: rgba(255,255,255,0.10); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 15px; }
        .back-btn:active { background: rgba(255,255,255,0.22); transform: scale(0.93); }
        .top-title { font-family: 'Poppins', sans-serif; flex: 1; font-size: 16px; font-weight: 700; color: white; }
        .main-content { padding-top: 62px; max-width: 600px; margin: 0 auto; }
        
        .location-bar { display: flex; align-items: center; gap: 6px; padding: 8px 14px; background: #EDF7F1; border-bottom: 1px solid #C8E6C9; font-size: 11px; color: #0B5A31; cursor: pointer; }
        .location-bar span { font-weight: 600; }
        .nearby-badge { display: inline-block; background: #0B5A31; color: white; font-size: 9px; padding: 2px 8px; border-radius: 9999px; font-weight: 600; }
        
        .search-box { padding: 10px 14px; }
        .search-box input { width: 100%; padding: 11px 16px; border: 1.5px solid var(--neutral-border); border-radius: var(--radius-full); font-size: 13px; font-family: 'Inter', sans-serif; outline: none; background: white; }
        .search-box input:focus { border-color: var(--brand-orange); box-shadow: 0 0 0 3px rgba(245,158,11,0.08); }
        .shop-count { padding: 0 14px 6px; font-size: 11px; color: var(--neutral-gray); font-weight: 500; }
        
        .shop-card { background: var(--neutral-white); margin: 7px 14px; border-radius: var(--radius-lg); padding: 14px; display: flex; gap: 12px; align-items: center; border: 1px solid var(--neutral-border); box-shadow: var(--shadow-xs); cursor: pointer; animation: slideUp 0.3s ease forwards; }
        .shop-card:active { transform: scale(0.98); }
        .shop-card.nearby { border: 2px solid #0B5A31; background: #F9FDF9; }
        .shop-img { width: 56px; height: 56px; min-width: 56px; border-radius: var(--radius-sm); background: #EDF7F1; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid #C8E6C9; }
        .shop-img img { width: 100%; height: 100%; object-fit: cover; }
        .shop-img i { font-size: 24px; color: var(--brand-green); }
        .shop-info { flex: 1; min-width: 0; }
        .shop-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .shop-category { font-size: 11px; color: var(--neutral-gray); }
        .shop-meta { display: flex; gap: 10px; margin-top: 4px; font-size: 11px; color: var(--neutral-gray); flex-wrap: wrap; }
        .shop-meta span { display: flex; align-items: center; gap: 4px; }
        .shop-meta i { color: var(--brand-green); font-size: 10px; }
        .shop-distance { color: #0B5A31; font-weight: 600; }
        .shop-arrow { color: #D1D5DB; font-size: 13px; flex-shrink: 0; }
        
        .empty-state { text-align: center; padding: 55px 20px; animation: slideUp 0.4s ease; }
        .empty-state i { font-size: 48px; color: #D1D5DB; display: block; margin-bottom: 12px; }
        .empty-state h3 { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 700; }
        .empty-state p { font-size: 13px; color: var(--neutral-gray); margin-bottom: 14px; }
        .empty-state button { background: var(--brand-green); color: white; border: none; padding: 10px 22px; border-radius: var(--radius-full); font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
        
        .loading-state { text-align: center; padding: 50px; }
        .spinner { width: 32px; height: 32px; border: 2.5px solid var(--neutral-border); border-top-color: var(--brand-orange); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto; }
        
        .bottom-nav { background: white; position: fixed; bottom: 0; left: 0; width: 100%; display: flex; justify-content: space-around; padding: 5px 10px 10px; box-shadow: 0 -4px 16px rgba(0,0,0,0.03); z-index: 100; border-top: 1px solid var(--neutral-border); }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 9px; font-weight: 500; color: var(--neutral-gray); cursor: pointer; padding: 3px 10px; border-radius: var(--radius-full); border: none; background: transparent; font-family: 'Inter', sans-serif; }
        .nav-item:active { background: #EDF7F1; } .nav-item.active { color: var(--brand-green); font-weight: 600; } .nav-item i { font-size: 18px; margin-bottom: 1px; }
        
        .toast { position: fixed; bottom: 95px; left: 50%; transform: translateX(-50%); background: var(--neutral-dark); color: white; padding: 9px 18px; border-radius: var(--radius-full); font-size: 11px; z-index: 200; opacity: 0; visibility: hidden; white-space: nowrap; box-shadow: var(--shadow-md); transition: all 0.3s ease; }
        .toast.show { opacity: 1; visibility: visible; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="top-bar">
    <button class="back-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i></button>
    <span class="top-title">सभी दुकानें</span>
</div>

<div class="main-content" id="mainContent">
    <div class="loading-state"><div class="spinner"></div></div>
</div>

<nav class="bottom-nav">
    <button class="nav-item" onclick="window.location.href='index.html'"><i class="fas fa-home"></i><span>होम</span></button>
    <button class="nav-item" onclick="window.location.href='products.html'"><i class="fas fa-box"></i><span>खोजें</span></button>
    <button class="nav-item" onclick="window.location.href='cart.html'"><i class="fas fa-shopping-cart"></i><span>कार्ट</span></button>
    <button class="nav-item" onclick="window.location.href='profile.html'"><i class="fas fa-user"></i><span>प्रोफाइल</span></button>
    <button class="nav-item active"><i class="fas fa-store"></i><span>दुकानें</span></button>
</nav>

<div class="toast" id="toastMsg"></div>

<script>
(function() {
    'use strict';
    
    window.addEventListener('error', function(e) { console.error('[All Shops]', e.message); });
    window.addEventListener('unhandledrejection', function(e) { console.error('[All Shops]', e.reason); e.preventDefault(); });
    
    function getEl(id) { return document.getElementById(id); }
    function esc(str) { if (!str) return ''; var d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
    
    var sb = supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co', 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1');
    var SUPABASE_URL = 'https://zwajyovemwdqtkecipeb.supabase.co';
    
    var allShops = [];
    var nearbyShopIds = [];
    var shopDistances = {};
    var userLat = null, userLng = null;
    
    function getFullUrl(u) { 
        if (!u || typeof u !== 'string') return ''; 
        if (u.indexOf('http')===0 || u.indexOf('data:')===0) return u; 
        return SUPABASE_URL + '/storage/v1/object/public/' + u; 
    }
    function showToast(m) { var t = getEl('toastMsg'); if (!t) return; t.textContent = m; t.classList.add('show'); clearTimeout(t._timer); t._timer = setTimeout(function(){t.classList.remove('show');},2200); }
    
    function calculateDistance(lat1, lng1, lat2, lng2) {
        var R = 6371;
        var dLat = (lat2 - lat1) * Math.PI / 180;
        var dLng = (lng2 - lng1) * Math.PI / 180;
        var a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLng/2) * Math.sin(dLng/2);
        var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }
    
    function loadLocationAndSort() {
        var lat = parseFloat(localStorage.getItem('user_lat') || '0') || null;
        var lng = parseFloat(localStorage.getItem('user_lng') || '0') || null;
        var ts = parseInt(localStorage.getItem('location_timestamp') || '0');
        
        // 🔥 FIX 2: 24 hours expiry (86400000ms)
        if (!lat || !lng || (Date.now() - ts) > 86400000) return;
        
        userLat = lat;
        userLng = lng;
        
        nearbyShopIds = [];
        shopDistances = {};
        
        for (var i = 0; i < allShops.length; i++) {
            var shop = allShops[i];
            if (!shop.latitude || !shop.longitude) continue;
            var dist = calculateDistance(userLat, userLng, shop.latitude, shop.longitude);
            var radius = shop.delivery_radius_km || 10;
            shopDistances[shop.id] = Math.round(dist * 10) / 10;
            if (dist <= radius) nearbyShopIds.push(shop.id);
        }
        
        allShops.sort(function(a, b) {
            var aNearby = nearbyShopIds.indexOf(a.id) !== -1;
            var bNearby = nearbyShopIds.indexOf(b.id) !== -1;
            if (aNearby && !bNearby) return -1;
            if (!aNearby && bNearby) return 1;
            var aDist = shopDistances[a.id] || 9999;
            var bDist = shopDistances[b.id] || 9999;
            return aDist - bDist;
        });
    }
    
    async function loadShops() {
        var c = getEl('mainContent'); if (!c) return;
        
        try {
            var result = await sb.from('shops').select('*').eq('status', 'approved').eq('is_open', true).order('rating', { ascending: false });
            allShops = (result && result.data) ? result.data : [];
            console.log('[All Shops] Loaded:', allShops.length, 'shops');
            
            loadLocationAndSort();
            
            renderShops(allShops);
        } catch(e) { 
            c.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>लोड विफल</h3><button onclick="loadShops()">🔄 पुनः प्रयास</button></div>'; 
        }
    }
    
    function renderShops(shops) {
        var c = getEl('mainContent'); if (!c) return;
        
        var locShort = localStorage.getItem('location_short') || '';
        
        var html = '';
        
        if (locShort && userLat && userLng) {
            html += '<div class="location-bar" onclick="window.location.href=\'location.html\'"><i class="fas fa-map-marker-alt"></i><span>📍 ' + locShort;
            if (nearbyShopIds.length > 0) html += ' <span class="nearby-badge">' + nearbyShopIds.length + ' nearby</span>';
            html += '</span></div>';
        }
        
        html += '<div class="search-box"><input type="text" id="shopSearch" placeholder="🔍 दुकानें खोजें..."></div>';
        html += '<div class="shop-count">कुल ' + allShops.length + ' दुकानें</div>';
        
        if (!shops || shops.length === 0) {
            c.innerHTML = html + '<div class="empty-state"><i class="fas fa-store-slash"></i><h3>कोई दुकान नहीं</h3><button onclick="window.location.href=\'index.html\'">🏠 होम पेज पर जाएं</button></div>';
            return;
        }
        
        for (var i = 0; i < shops.length; i++) {
            var s = shops[i], imgUrl = getFullUrl(s.image_url);
            var isNearby = nearbyShopIds.indexOf(s.id) !== -1;
            var dist = shopDistances[s.id] || null;
            
            html += '<div class="shop-card' + (isNearby ? ' nearby' : '') + '" onclick="window.location.href=\'shop-details.html?id=' + s.id + '\'">';
            html += '<div class="shop-img">' + (imgUrl ? '<img src="' + imgUrl + '" loading="lazy" onerror="this.parentElement.innerHTML=\'<i class=\\\'fas fa-store\\\'></i>\';">' : '<i class="fas fa-store"></i>') + '</div>';
            html += '<div class="shop-info"><div class="shop-name">' + esc(s.name) + '</div><div class="shop-category">' + esc(s.category || 'जनरल स्टोर') + '</div>';
            html += '<div class="shop-meta"><span><i class="fas fa-star"></i> ' + (s.rating || '4.0') + '</span><span><i class="fas fa-map-pin"></i> ' + esc(s.city || '') + '</span>';
            // 🔥 FIX 1a: dist !== null - shows 0 km also
            if (dist !== null) html += '<span class="shop-distance">📍 ' + dist + ' km</span>';
            html += '</div></div>';
            html += '<i class="fas fa-chevron-right shop-arrow"></i></div>';
        }
        c.innerHTML = html;
        
        var si = getEl('shopSearch');
        if (si) {
            si.addEventListener('input', function() {
                var term = this.value.trim().toLowerCase();
                var filtered = term ? allShops.filter(function(s) {
                    return (s.name||'').toLowerCase().indexOf(term) !== -1 || (s.category||'').toLowerCase().indexOf(term) !== -1 || (s.city||'').toLowerCase().indexOf(term) !== -1;
                }) : allShops;
                updateShopList(filtered, term);
            });
        }
    }
    
    function updateShopList(shops, term) {
        var c = getEl('mainContent'); if (!c) return;
        var locShort = localStorage.getItem('location_short') || '';
        
        var html = '';
        if (locShort && userLat && userLng) {
            html += '<div class="location-bar" onclick="window.location.href=\'location.html\'"><i class="fas fa-map-marker-alt"></i><span>📍 ' + locShort + '</span></div>';
        }
        
        html += '<div class="search-box"><input type="text" id="shopSearch" placeholder="🔍 दुकानें खोजें..." value="' + esc(term || '') + '"></div>';
        html += '<div class="shop-count">' + (term ? '🔍 "' + esc(term) + '" के परिणाम: ' : 'कुल ') + shops.length + ' दुकानें</div>';
        
        if (!shops.length) { html += '<div class="empty-state"><i class="fas fa-search"></i><h3>कोई दुकान नहीं</h3></div>'; }
        else {
            for (var i = 0; i < shops.length; i++) {
                var s = shops[i], imgUrl = getFullUrl(s.image_url);
                var isNearby = nearbyShopIds.indexOf(s.id) !== -1;
                var dist = shopDistances[s.id] || null;
                
                html += '<div class="shop-card' + (isNearby ? ' nearby' : '') + '" onclick="window.location.href=\'shop-details.html?id=' + s.id + '\'">';
                html += '<div class="shop-img">' + (imgUrl ? '<img src="' + imgUrl + '" loading="lazy" onerror="this.parentElement.innerHTML=\'<i class=\\\'fas fa-store\\\'></i>\';">' : '<i class="fas fa-store"></i>') + '</div>';
                html += '<div class="shop-info"><div class="shop-name">' + esc(s.name) + '</div><div class="shop-category">' + esc(s.category || 'जनरल स्टोर') + '</div>';
                html += '<div class="shop-meta"><span><i class="fas fa-star"></i> ' + (s.rating || '4.0') + '</span><span><i class="fas fa-map-pin"></i> ' + esc(s.city || '') + '</span>';
                // 🔥 FIX 1b: dist !== null - shows 0 km also
                if (dist !== null) html += '<span class="shop-distance">📍 ' + dist + ' km</span>';
                html += '</div></div>';
                html += '<i class="fas fa-chevron-right shop-arrow"></i></div>';
            }
        }
        c.innerHTML = html;
        
        var si = getEl('shopSearch'); if (si) { si.focus(); si.setSelectionRange(si.value.length, si.value.length); si.addEventListener('input', function() { var t = this.value.trim().toLowerCase(); updateShopList(t ? allShops.filter(function(s){return (s.name||'').toLowerCase().indexOf(t)!==-1||(s.category||'').toLowerCase().indexOf(t)!==-1||(s.city||'').toLowerCase().indexOf(t)!==-1;}) : allShops, t); }); }
    }
    
    document.addEventListener('DOMContentLoaded', loadShops);
})();
</script>
</body>
</html>
