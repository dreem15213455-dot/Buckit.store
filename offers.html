<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>All Offers - Zatpat</title>
    <meta name="theme-color" content="#16A34A">
    
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #16A34A;
            --primary-light: #22C55E;
            --primary-bg-light: #F0FDF4;
            --accent-orange: #F97316;
            --bg-white: #FFFFFF;
            --bg-light: #F9FAFB;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --border-light: #E5E7EB;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --radius-md: 12px;
            --radius-full: 9999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
            overflow-x: hidden;
            padding-bottom: 85px;
            -webkit-font-smoothing: antialiased;
        }

        #pageProgress {
            position: fixed; top: 0; left: 0; width: 0%; height: 3px;
            background: var(--primary); z-index: 10001; transition: width 0.3s ease;
        }
        #pageProgress.loading { width: 90%; }
        #pageProgress.complete { width: 100%; opacity: 0; transition: opacity 0.3s; }

        .top-bar {
            background: var(--bg-white); position: sticky; top: 0; left: 0; width: 100%;
            z-index: 1000; padding: 12px 16px; box-shadow: var(--shadow-sm);
            border-bottom: 1px solid var(--border-light); display: flex; align-items: center; gap: 12px;
        }
        .back-btn {
            width: 40px; height: 40px; background: var(--bg-light); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .top-title {
            font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 6px;
        }
        .top-title i { color: var(--accent-orange); }

        .main-content { padding: 16px; }

        .offers-grid {
            display: flex; flex-direction: column; gap: 12px;
        }

        .offer-card {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: var(--radius-md); padding: 20px; color: white;
            cursor: pointer; position: relative; overflow: hidden;
        }
        .offer-card::before {
            content: ''; position: absolute; top: -50%; right: -20%;
            width: 150px; height: 150px; background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }
        .offer-tag {
            position: absolute; top: 12px; right: 12px; background: var(--accent-orange);
            padding: 4px 12px; border-radius: var(--radius-full); font-size: 12px; font-weight: 700;
        }
        .offer-title {
            font-size: 22px; font-weight: 800; margin-bottom: 4px;
        }
        .offer-subtitle {
            font-size: 13px; opacity: 0.9; margin-bottom: 16px;
        }
        .offer-discount {
            font-size: 32px; font-weight: 900; color: var(--accent-orange);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        .offer-code {
            background: rgba(255,255,255,0.2); padding: 6px 12px; border-radius: var(--radius-full);
            display: inline-block; font-family: monospace; font-size: 14px; margin-top: 12px;
        }
        .offer-footer {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 16px; font-size: 12px;
        }

        .empty-state {
            text-align: center; padding: 60px 20px;
        }
        .empty-state i { font-size: 64px; color: var(--border-light); margin-bottom: 20px; }

        .toast-notification {
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
            background: var(--text-primary); color: white; padding: 10px 20px;
            border-radius: var(--radius-full); font-size: 12px; z-index: 10050;
            display: none; white-space: nowrap;
        }
        .toast-notification.show { display: flex; }

        .bottom-nav {
            background: white; position: fixed; bottom: 0; left: 0; width: 100%;
            display: flex; justify-content: space-around; padding: 6px 16px 8px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.06); z-index: 1000;
            border-top: 1px solid var(--border-light);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            font-size: 10px; font-weight: 500; color: var(--text-secondary); cursor: pointer; position: relative;
        }
        .nav-item.active { color: var(--primary); font-weight: 600; }
        .nav-item i { font-size: 20px; margin-bottom: 2px; }
        .cart-count {
            position: absolute; top: -5px; right: -5px; background: var(--primary); color: white;
            border-radius: 50%; width: 16px; height: 16px; font-size: 9px; display: flex;
            align-items: center; justify-content: center; border: 2px solid white;
        }

        .loading-spinner { text-align: center; padding: 60px; }
        .spinner {
            width: 40px; height: 40px; border: 3px solid var(--border-light);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="pageProgress"></div>
<div id="toastMsg" class="toast-notification"><span id="toastText"></span></div>

<div id="mainApp">
    <div class="top-bar">
        <div class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
        <div class="top-title"><i class="fas fa-tags"></i> All Offers</div>
    </div>

    <div class="main-content" id="offersContainer">
        <div class="loading-spinner"><div class="spinner"></div></div>
    </div>

    <nav class="bottom-nav">
        <a class="nav-item" onclick="fastNavigate('index.html')"><i class="fas fa-home"></i><span>Home</span></a>
        <a class="nav-item" onclick="fastNavigate('products.html')"><i class="fas fa-search"></i><span>Explore</span></a>
        <a class="nav-item" onclick="fastNavigate('cart.html')"><i class="fas fa-shopping-bag"></i><span>Cart</span><span class="cart-count" id="cartCount">0</span></a>
        <a class="nav-item" onclick="fastNavigate('profile.html')"><i class="fas fa-user"></i><span>Profile</span></a>
        <a class="nav-item" onclick="fastNavigate('orders.html')"><i class="fas fa-receipt"></i><span>Orders</span></a>
    </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const supabaseUrl = 'https://zwajyovemwdqtkecipeb.supabase.co';
    const supabaseKey = 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1';
    const zatpatDB = supabase.createClient(supabaseUrl, supabaseKey);

    function startProgress() { const b = document.getElementById('pageProgress'); b.style.width = '0%'; b.classList.add('loading'); setTimeout(() => b.style.width = '90%', 10); }
    function completeProgress() { const b = document.getElementById('pageProgress'); b.classList.remove('loading'); b.classList.add('complete'); setTimeout(() => { b.style.width = '0%'; b.classList.remove('complete'); }, 300); }
    window.fastNavigate = function(url) { startProgress(); setTimeout(() => window.location.href = url, 50); };
    function goBack() { window.history.back(); }

    function showToast(msg) {
        const t = document.getElementById('toastMsg');
        document.getElementById('toastText').innerHTML = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    function updateCartBadge() {
        const cart = JSON.parse(localStorage.getItem('zatpat_cart')) || [];
        document.getElementById('cartCount').innerText = cart.reduce((s, i) => s + (i.quantity || 1), 0);
    }

    async function loadOffers() {
        try {
            const { data: offers, error } = await zatpatDB
                .from('offers')
                .select('*')
                .eq('is_active', true)
                .order('priority', { ascending: true });

            if (error) throw error;

            const container = document.getElementById('offersContainer');
            
            if (offers && offers.length > 0) {
                let html = '<div class="offers-grid">';
                offers.forEach(offer => {
                    const discountText = offer.discount_type === 'percentage' 
                        ? `${offer.discount_value}% OFF` 
                        : `₹${offer.discount_value} OFF`;
                    
                    html += `
                        <div class="offer-card" onclick="fastNavigate('offer-detail.html?id=${offer.id}')">
                            <span class="offer-tag"><i class="fas fa-tag"></i> Offer</span>
                            <div class="offer-title">${offer.title}</div>
                            <div class="offer-subtitle">${offer.subtitle || ''}</div>
                            <div class="offer-discount">${discountText}</div>
                            ${offer.coupon_code ? `<div class="offer-code">${offer.coupon_code}</div>` : ''}
                            <div class="offer-footer">
                                <span><i class="far fa-clock"></i> Limited time</span>
                                <span><i class="fas fa-arrow-right"></i> View Details</span>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
            } else {
                // Mock offers
                const mockOffers = [
                    { id: 'first_order', title: 'FLAT 50% OFF', subtitle: 'On your first order', discount_value: '50', discount_type: 'percentage', coupon_code: 'FIRST50' },
                    { id: 'flash_sale', title: 'FLASH SALE', subtitle: '30% off on snacks', discount_value: '30', discount_type: 'percentage', coupon_code: 'FLASH30' },
                    { id: 'grocery', title: 'Grocery Special', subtitle: 'Extra 10% off', discount_value: '10', discount_type: 'percentage', coupon_code: 'GROCERY10' }
                ];
                
                let html = '<div class="offers-grid">';
                mockOffers.forEach(offer => {
                    const discountText = `${offer.discount_value}% OFF`;
                    html += `
                        <div class="offer-card" onclick="fastNavigate('offer-detail.html?id=${offer.id}')">
                            <span class="offer-tag"><i class="fas fa-tag"></i> Offer</span>
                            <div class="offer-title">${offer.title}</div>
                            <div class="offer-subtitle">${offer.subtitle}</div>
                            <div class="offer-discount">${discountText}</div>
                            <div class="offer-code">${offer.coupon_code}</div>
                            <div class="offer-footer">
                                <span><i class="far fa-clock"></i> Limited time</span>
                                <span><i class="fas fa-arrow-right"></i> View Details</span>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
            }
        } catch (e) {
            console.error('Load error:', e);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        updateCartBadge();
        loadOffers();
    });

    window.goBack = goBack;
</script>
</body>
</html>
