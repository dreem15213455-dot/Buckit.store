<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Set Location - ZyMart</title>
    <meta name="theme-color" content="#0B5A31">
    <style>
        :root { --green: #0B5A31; --orange: #F59E0B; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #0B5A31; min-height: 100vh; color: white; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .container { display: flex; flex-direction: column; min-height: 100vh; }
        
        .top-bar { padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
        .back-btn { width: 36px; height: 36px; background: rgba(255,255,255,0.12); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 14px; }
        .back-btn:active { background: rgba(255,255,255,0.25); transform: scale(0.93); }
        
        .top-section { padding: 20px 24px 16px; text-align: center; flex-shrink: 0; }
        .logo { font-family: 'Poppins', sans-serif; font-size: 36px; font-weight: 700; }
        .logo-zy { color: #A3E635; } .logo-mart { color: #FDE047; }
        .title { font-size: 20px; font-weight: 700; margin-top: 12px; }
        .subtitle { font-size: 12px; opacity: 0.85; margin-top: 4px; line-height: 1.5; }
        
        .map-section { flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 10px 0 16px; }
        .map-container { position: relative; width: 110px; height: 110px; }
        .pin { position: absolute; top: 50%; left: 50%; width: 36px; height: 36px; background: #F59E0B; border-radius: 50% 50% 50% 0; transform: translate(-50%, -50%) rotate(-45deg); animation: bounce 2s infinite; z-index: 3; }
        .pin::after { content: ''; position: absolute; top: 50%; left: 50%; width: 12px; height: 12px; background: white; border-radius: 50%; transform: translate(-50%, -50%) rotate(45deg); }
        .pulse { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 50%; border: 2px solid rgba(245,158,11,0.3); animation: pulseAnim 2s ease-out infinite; }
        .pulse:nth-child(2) { width: 55px; height: 55px; } .pulse:nth-child(3) { width: 90px; height: 90px; animation-delay: 0.6s; }
        @keyframes bounce { 0%,100%{transform:translate(-50%,-50%) rotate(-45deg) translateY(0);} 50%{transform:translate(-50%,-50%) rotate(-45deg) translateY(-8px);} }
        @keyframes pulseAnim { 0%{transform:translate(-50%,-50%) scale(0.4);opacity:1;} 100%{transform:translate(-50%,-50%) scale(1.3);opacity:0;} }
        
        .bottom-card { background: white; border-radius: 24px 24px 0 0; padding: 20px 20px 30px; color: #1A1A1A; flex-shrink: 0; box-shadow: 0 -5px 30px rgba(0,0,0,0.1); }
        
        .option-card { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; cursor: pointer; margin-bottom: 10px; border: 1.5px solid #E5E7EB; background: #F9FAFB; transition: all 0.15s ease; }
        .option-card:active { background: #EDF7F1; border-color: #0B5A31; transform: scale(0.98); }
        .option-card.gps { background: #EDF7F1; border-color: #0B5A31; }
        .option-icon { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .option-icon.green { background: #EDF7F1; color: #0B5A31; }
        .option-icon.amber { background: #FFF8EB; color: #F59E0B; }
        .option-icon.blue { background: #EFF6FF; color: #3B82F6; }
        .option-info { flex: 1; }
        .option-title { font-size: 13px; font-weight: 600; }
        .option-desc { font-size: 10px; color: #6B7280; margin-top: 1px; }
        .option-arrow { color: #9CA3AF; font-size: 12px; }
        
        .status-box { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #F9FAFB; border-radius: 12px; margin-bottom: 12px; display: none; }
        .status-box.show { display: flex; }
        .status-box.success { background: #EDF7F1; border: 1.5px solid #0B5A31; }
        .status-box.error { background: #FEF2F2; border: 1.5px solid #EF4444; }
        .status-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
        .status-icon.detecting { background: #FFF8EB; color: #F59E0B; }
        .status-icon.success { background: #EDF7F1; color: #0B5A31; }
        .status-icon.error { background: #FEF2F2; color: #EF4444; }
        .status-title { font-size: 12px; font-weight: 600; }
        .status-detail { font-size: 10px; color: #6B7280; }
        
        .btn { width: 100%; padding: 14px; border-radius: 14px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; font-family: 'Inter', sans-serif; margin-bottom: 8px; display: none; align-items: center; justify-content: center; gap: 8px; }
        .btn:active { transform: scale(0.97); }
        .btn-settings { background: #F59E0B; color: #1A1A1A; }
        .btn-retry { background: #0B5A31; color: white; }
        
        .pincode-section { display: none; margin-top: 4px; }
        .pincode-section.show { display: block; }
        .pincode-input-group { display: flex; gap: 8px; margin-bottom: 8px; }
        .pincode-input { flex: 1; padding: 12px 14px; border: 1.5px solid #E5E7EB; border-radius: 12px; font-size: 14px; font-family: 'Inter', sans-serif; outline: none; }
        .pincode-input:focus { border-color: #0B5A31; }
        .pincode-submit { background: #0B5A31; color: white; border: none; padding: 12px 18px; border-radius: 12px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px; white-space: nowrap; }
        
        .skip-section { text-align: center; margin-top: 14px; padding-top: 10px; border-top: 1px solid #F3F5F4; }
        .skip-btn { background: transparent; color: #0B5A31; border: 1.5px solid #0B5A31; padding: 12px 24px; border-radius: 25px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; width: 100%; }
        .skip-btn:active { background: #EDF7F1; }
        .skip-hint { font-size: 10px; color: #9CA3AF; margin-top: 6px; }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader { display: inline-block; width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="container">
    <div class="top-bar">
        <button class="back-btn" onclick="goHome()"><i class="fas fa-arrow-left"></i></button>
    </div>
    
    <div class="top-section">
        <div class="logo"><span class="logo-zy">Zy</span><span class="logo-mart">Mart</span></div>
        <div class="title">📍 Discover Nearby Shops</div>
        <div class="subtitle">Set your location to find shops and products near you. This is optional.</div>
    </div>
    
    <div class="map-section"><div class="map-container"><div class="pulse"></div><div class="pulse"></div><div class="pin"></div></div></div>
    
    <div class="bottom-card">
        <div class="status-box" id="statusBox">
            <div class="status-icon" id="statusIcon">📍</div>
            <div><div class="status-title" id="statusTitle"></div><div class="status-detail" id="statusDetail"></div></div>
        </div>
        
        <div class="option-card gps" id="gpsOption" onclick="startGPSDetection()">
            <div class="option-icon green"><i class="fas fa-map-marker-alt"></i></div>
            <div class="option-info">
                <div class="option-title">📍 Use Current Location</div>
                <div class="option-desc">Auto-detect your location via GPS</div>
            </div>
            <div class="option-arrow"><i class="fas fa-chevron-right"></i></div>
        </div>
        
        <div class="option-card" id="pincodeOption" onclick="showPincodeInput()">
            <div class="option-icon amber"><i class="fas fa-hashtag"></i></div>
            <div class="option-info">
                <div class="option-title">📝 Enter Pincode</div>
                <div class="option-desc">Manually enter your area pincode</div>
            </div>
            <div class="option-arrow"><i class="fas fa-chevron-right"></i></div>
        </div>
        
        <div class="pincode-section" id="pincodeSection">
            <div class="pincode-input-group">
                <input type="text" class="pincode-input" id="pincodeInput" placeholder="Enter 6-digit pincode" maxlength="6" inputmode="numeric">
                <button class="pincode-submit" onclick="submitPincode()">Find →</button>
            </div>
        </div>
        
        <button class="btn btn-settings" id="settingsBtn" onclick="openSettings()">⚙️ Open GPS Settings</button>
        <button class="btn btn-retry" id="retryBtn" onclick="startGPSDetection()">🔄 Try Again</button>
        
        <div class="skip-section">
            <button class="skip-btn" onclick="goHome()">Skip & Browse All Products →</button>
            <p class="skip-hint">You can browse all products without location</p>
        </div>
    </div>
</div>

<script>
    var detected = false;
    function $(id) { return document.getElementById(id); }
    
    function updateStatus(t, title, detail) {
        var box=$('statusBox'),icon=$('statusIcon');
        box.className='status-box show';icon.className='status-icon';
        if(t==='detecting'){icon.classList.add('detecting');icon.textContent='📍';}
        else if(t==='success'){box.classList.add('success');icon.classList.add('success');icon.textContent='✅';}
        else if(t==='error'){box.classList.add('error');icon.classList.add('error');icon.textContent='❌';}
        $('statusTitle').textContent=title;$('statusDetail').textContent=detail;
    }
    
    function hideOptionCards() { var cards=document.querySelectorAll('.option-card'); for(var i=0;i<cards.length;i++){cards[i].style.display='none';} }
    function hideActionBtns() { $('settingsBtn').style.display='none'; $('retryBtn').style.display='none'; }
    
    function startGPSDetection() {
        if(detected) return;
        updateStatus('detecting','Detecting your location...','Please wait');
        hideOptionCards(); hideActionBtns();
        if(window.Android&&typeof window.Android.requestLocation==='function'){ window.Android.requestLocation(); return; }
        if(navigator.geolocation){
            navigator.geolocation.getCurrentPosition(
                function(p){ handleSuccess(p.coords.latitude, p.coords.longitude); },
                function(e){
                    if(e.code===1){ updateStatus('error','Permission denied','You can use pincode instead'); $('retryBtn').style.display='flex'; }
                    else if(e.code===2){ updateStatus('error','GPS is off','Turn on location services'); $('settingsBtn').style.display='flex'; $('retryBtn').style.display='flex'; }
                    else{ updateStatus('error','Could not detect','Please try again'); $('retryBtn').style.display='flex'; }
                },
                { timeout:10000, maximumAge:0, enableHighAccuracy:true }
            );
        } else { updateStatus('error','GPS not supported','Use pincode option'); }
    }
    
    window.setLocationFromAndroid=function(lat,lng){ handleSuccess(parseFloat(lat),parseFloat(lng)); };
    window.onLocationError=function(msg){
        if(msg==='GPS_DISABLED'||msg==='LOCATION_OFF'){ updateStatus('error','GPS is off','Enable GPS in settings'); $('settingsBtn').style.display='flex'; $('retryBtn').style.display='flex'; }
        else{ updateStatus('error','Could not detect','Try pincode option'); $('retryBtn').style.display='flex'; }
    };
    
    function handleSuccess(lat,lng){
        detected=true;
        localStorage.setItem('user_lat',lat.toString()); localStorage.setItem('user_lng',lng.toString()); localStorage.setItem('location_timestamp',Date.now().toString());
        sessionStorage.setItem('location_set_done','true');
        updateStatus('success','Location found! 🎉','Saving your location...');
        var geocodeTimeout=setTimeout(function(){ localStorage.setItem('location_short','Your Area'); updateStatus('success','Location saved! 🎉','Taking you back...'); setTimeout(function(){goHome();},800); },4000);
        fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lng+'&zoom=18&addressdetails=1')
        .then(function(r){return r.json();})
        .then(function(d){ clearTimeout(geocodeTimeout); var a=d.address||{}; var city=a.city||a.town||''; var pincode=a.postcode||''; if(pincode)localStorage.setItem('user_pincode',pincode); if(city)localStorage.setItem('user_city',city); localStorage.setItem('location_short',city||a.road||'Your Area'); updateStatus('success','Location saved! 🎉','Taking you back...'); setTimeout(function(){goHome();},800); })
        .catch(function(){ clearTimeout(geocodeTimeout); localStorage.setItem('location_short','Your Area'); updateStatus('success','Location saved! 🎉','Taking you back...'); setTimeout(function(){goHome();},800); });
    }
    
    function openSettings(){ if(window.Android&&typeof window.Android.openLocationSettings==='function'){window.Android.openLocationSettings();}else{alert('Please open Settings → Location → Turn ON GPS');} }
    function showPincodeInput(){ var s=$('pincodeSection'); if(s.classList.contains('show')){s.classList.remove('show');}else{s.classList.add('show');setTimeout(function(){var inp=$('pincodeInput');if(inp)inp.focus();},200);} }
    function submitPincode(){ var pc=($('pincodeInput').value||'').trim(); if(!pc||pc.length!==6||!/^\d{6}$/.test(pc)){alert('Please enter a valid 6-digit pincode');return;} detected=true; localStorage.setItem('user_pincode',pc); localStorage.setItem('location_short','Pincode: '+pc); sessionStorage.setItem('location_set_done','true'); updateStatus('success','Pincode saved!','Pincode: '+pc); hideOptionCards(); hideActionBtns(); $('pincodeSection').classList.remove('show'); setTimeout(function(){goHome();},1000); }
    function goHome(){ window.location.href='index.html'; }
</script>
</body>
</html>
