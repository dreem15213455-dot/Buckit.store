<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZyMart - Redirecting...</title>
    <meta name="theme-color" content="#0B5A31">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',-apple-system,sans-serif;background:#0B5A31;color:white;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center}
        .loader{text-align:center}
        .spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,0.2);border-top-color:#FDE047;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
        @keyframes spin{to{transform:rotate(360deg)}}
        .logo{font-family:'Poppins',sans-serif;font-size:28px;font-weight:700;margin-bottom:8px}
        .logo-zy{color:#A3E635}.logo-mart{color:#FDE047}
        p{font-size:14px;opacity:0.9}
    </style>
</head>
<body>
    <div class="loader">
        <div class="logo"><span class="logo-zy">Zy</span><span class="logo-mart">Mart</span></div>
        <div class="spinner"></div>
        <p>Logging you in...</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (async function() {
            var sb = supabase.createClient(
                'https://zwajyovemwdqtkecipeb.supabase.co',
                'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1'
            );
            
            try {
                // Wait for session
                var result = await sb.auth.getSession();
                
                if (result && result.data && result.data.session) {
                    var user = result.data.session.user;
                    
                    // Check role from users table
                    var role = null;
                    try {
                        var userData = await sb.from('users').select('role').eq('id', user.id).maybeSingle();
                        if (userData && userData.data && userData.data.role) {
                            role = String(userData.data.role);
                        }
                    } catch(e) {}
                    
                    // Fallback to metadata
                    if (!role) {
                        role = (user.user_metadata && user.user_metadata.role) || null;
                        if (role) role = String(role);
                    }
                    
                    // If no role found, insert as customer
                    if (!role) {
                        try {
                            await sb.from('users').upsert({
                                id: user.id,
                                email: user.email,
                                name: user.user_metadata?.full_name || user.user_metadata?.name || '',
                                role: '3',
                                created_at: new Date().toISOString()
                            });
                            role = '3';
                        } catch(e) {}
                    }
                    
                    // Clear pending redirect
                    try { localStorage.removeItem('auth_redirect_pending'); } catch(e) {}
                    
                    // Redirect based on role
                    if (role === '1' || role === 'admin') {
                        window.location.href = 'admin-panel.html';
                    } else if (role === '2' || role === 'shop_owner') {
                        window.location.href = 'shop-dashboard.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                } else {
                    window.location.href = 'login.html';
                }
            } catch(e) {
                window.location.href = 'index.html';
            }
        })();
    </script>
</body>
</html>
