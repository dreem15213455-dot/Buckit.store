    var productSwiper = null;
    var fullscreenSwiper = null;
    var isInWishlist = false;
    var productImages = [];
    var allOffers = [];
    var currentOffer = null;
    var offerPrice = 0;
    var maxStock = 0;
    var discountPercent = 0;
    var currentUser = null;
    var initComplete = false;
    var productId = null;

    function getFullUrl(url) {
        if (!url) return '';
        if (url.indexOf('http') === 0 || url.indexOf('data:') === 0) return url;
        return SUPABASE_URL + '/storage/v1/object/public/' + url;
    }

    function escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    function showApp() {
        var loader = document.getElementById('simpleLoader');
        var app = document.getElementById('mainApp');
        if (app) app.style.display = '';
        if (loader) {
            loader.classList.add('fade-out');
            setTimeout(function() { if (loader.parentNode) loader.parentNode.removeChild(loader); }, 300);
        }
    }

    try { productId = new URLSearchParams(window.location.search).get('id'); } catch(e) { productId = null; }

    function startProgress() { var b = document.getElementById('pageProgress'); if(b) { b.style.width='0%'; b.classList.add('loading'); setTimeout(function(){b.style.width='90%';},10); } }
    function completeProgress() { var b = document.getElementById('pageProgress'); if(b) { b.classList.remove('loading'); b.classList.add('complete'); setTimeout(function(){b.style.width='0%';b.classList.remove('complete');},300); } }

    var Cache = { set:function(k,d,t){try{localStorage.setItem('zc_'+k,JSON.stringify({d:d,e:Date.now()+(t||1800000)}));}catch(e){}}, get:function(k){try{var c=localStorage.getItem('zc_'+k);if(!c)return null;var p=JSON.parse(c);return Date.now()>p.e?(localStorage.removeItem('zc_'+k),null):p.d;}catch(e){return null;}} };

    async function safeFetch(fetchFn, maxRetries) {
        maxRetries = maxRetries || 3;
        var lastError = null;
        for (var i = 0; i < maxRetries; i++) {
            try { var result = await fetchFn(); if (result.error) { lastError = new Error(result.error.message); if (i===maxRetries-1) throw lastError; } else return result; }
            catch(err) { lastError = err; if (i===maxRetries-1) throw lastError; }
            await new Promise(function(r) { setTimeout(r, Math.pow(2,i)*500); });
        }
        throw lastError;
    }

    window.addEventListener('online', function() { showToast('✅ इंटरनेट बहाल!'); if(initComplete) loadProduct(); });
    window.addEventListener('offline', function() { showToast('⚠️ इंटरनेट कनेक्शन नहीं है', true); });

    var touchStartY = 0;
    document.addEventListener('touchstart', function(e) { touchStartY = e.touches[0].clientY; }, {passive: true});
    document.addEventListener('touchend', function(e) {
        if (window.scrollY === 0 && e.changedTouches[0].clientY - touchStartY > 100) { showToast('🔄 रिफ्रेश हो रहा है...'); loadProduct(); }
    }, {passive: true});

    function showToast(msg, isError) {
        isError = isError || false;
        var t = document.getElementById('toastMsg'), s = document.getElementById('toastText');
        if(!t || !s) return;
        s.textContent = msg; t.style.background = isError ? '#EF4444' : '#111827';
        t.classList.add('show'); clearTimeout(t._timer);
        t._timer = setTimeout(function() { t.classList.remove('show'); }, 2200);
    }

    window.fastNavigate = function(url) { startProgress(); setTimeout(function() { window.location.href = url; }, 80); };

    function goBack() { try { if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) { window.history.back(); return; } } catch(e) {} window.location.href = 'index.html'; }

    async function checkUser() {
        try { var res = await sb.auth.getSession(); if (res.data && res.data.session) { currentUser = res.data.session.user; return true; } } catch(e) {}
        currentUser = null; return false;
    }

    function getCart() { try { return JSON.parse(localStorage.getItem('zatpat_cart')||'[]'); } catch(e) { return []; } }
    function saveCart(c) { try { localStorage.setItem('zatpat_cart', JSON.stringify(c)); } catch(e) {} }
    function updateCartBadge() { var cart = getCart(); var count = cart.reduce(function(s,i){return s+(i.quantity||1);},0); var badge = document.getElementById('cartBadge'); if(badge) badge.textContent = count; return count; }

    function shareProduct() {
        if(!currentProduct) return;
        if(navigator.share) { navigator.share({title:currentProduct.name,text:'Zatpat पर '+currentProduct.name+' देखें!',url:window.location.href}).catch(function(){}); }
        else { navigator.clipboard.writeText(window.location.href).then(function(){showToast('📋 लिंक कॉपी किया!');}); }
    }

    async function loadActiveOffers() { try { var r = await safeFetch(function(){return sb.from('offers').select('*').eq('is_active',true);}); allOffers=r.data||[]; } catch(e) { allOffers=[]; } }

    function calculateOfferPrice(product) {
        if(product.offer_price && product.offer_price>0 && product.offer_price<product.price) {
            return { price:product.offer_price, discountPercent:Math.round((1-product.offer_price/product.price)*100), source:'product' };
        }
        var now = new Date();
        var applicable = allOffers.filter(function(o) {
            if(o.valid_from && new Date(o.valid_from)>now) return false;
            if(o.valid_till && new Date(o.valid_till)<now) return false;
            if(o.apply_to==='global') return true;
            if(o.apply_to==='category' && o.target_id===product.category_id) return true;
            if(o.apply_to==='product' && o.target_id===product.id) return true;
            if(o.apply_to==='shop' && o.target_id===product.shop_id) return true;
            return false;
        });
        if(applicable.length>0) {
            var best = applicable.sort(function(a,b){var aV=a.discount_type==='percentage'?a.discount_value:(a.discount_value/product.price)*100;var bV=b.discount_type==='percentage'?b.discount_value:(b.discount_value/product.price)*100;return bV-aV;})[0];
            var discount = best.discount_type==='percentage'?(product.price*best.discount_value)/100:best.discount_value;
            if(best.max_discount>0 && best.discount_type==='percentage') discount=Math.min(discount,best.max_discount);
            var calcPrice = Math.max(Math.round(product.price-discount),0);
            if(calcPrice<product.price) return { price:calcPrice, discountPercent:Math.round((1-calcPrice/product.price)*100), source:'offer', offer:best };
        }
        return { price:product.price, discountPercent:0, source:'none' };
    }

    function openFullscreen() {
        var modal = document.getElementById('fullscreenModal'), wrapper = document.getElementById('fullscreenWrapper');
        if(!modal || !wrapper || !productImages.length) return;
        wrapper.innerHTML = productImages.map(function(img){return '<div class="swiper-slide"><img src="'+img+'" loading="lazy" alt="प्रोडक्ट इमेज"></div>';}).join('');
        modal.classList.add('active'); document.body.style.overflow = 'hidden';
        setTimeout(function() {
            if(fullscreenSwiper) { try { fullscreenSwiper.destroy(); } catch(e) {} }
            fullscreenSwiper = new Swiper('#fullscreenSwiper', { loop:productImages.length>1, pagination:{el:'.fullscreen-pagination .swiper-pagination',clickable:true}, keyboard:{enabled:true} });
        }, 150);
    }

    window.closeFullscreen = function() {
        document.getElementById('fullscreenModal').classList.remove('active'); document.body.style.overflow = '';
        if(fullscreenSwiper) { try { fullscreenSwiper.destroy(); } catch(e) {} fullscreenSwiper = null; }
    };

    async function loadProduct() {
        if(!productId) { document.getElementById('mainContent').innerHTML='<div class="error-container"><i class="fas fa-box-open"></i><h3>प्रोडक्ट नहीं मिला</h3><p>कोई प्रोडक्ट ID प्रदान नहीं की गई</p><button onclick="goBack()">वापस जाएं</button></div>'; return; }
        try {
            await loadActiveOffers();
            var cached = Cache.get('product_detail_'+productId);
            var product = cached;
            if(!product) {
                var result = await safeFetch(function(){return sb.from('products').select('*, shops(*)').eq('id',productId).single();});
                product = result.data;
                if(product) Cache.set('product_detail_'+productId, product, 600000);
            }
            if(!product) { showToast('प्रोडक्ट नहीं मिला',true); setTimeout(function(){goBack();},1500); return; }
            
            currentProduct = product; currentShop = product.shops;
            productImages = (product.images && product.images.length) ? product.images.map(function(img){return getFullUrl(img);}) : product.image_url ? [getFullUrl(product.image_url)] : [];
            if(!productImages.length) productImages = ['data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect fill="#F0FDF4" width="400" height="400"/><text x="200" y="210" text-anchor="middle" font-size="60" fill="#0F6E3B">📦</text></svg>')];
            
            maxStock = product.stock || 0;
            var offerResult = calculateOfferPrice(product);
            offerPrice = offerResult.price; discountPercent = offerResult.discountPercent;
            currentOffer = offerResult.source==='offer' ? offerResult.offer : null;
            
            var wishlist = JSON.parse(localStorage.getItem('zatpat_wishlist')||'[]');
            isInWishlist = wishlist.indexOf(productId) !== -1; updateWishlistUI();
            
            document.title = (product.name||'प्रोडक्ट') + ' - Zatpat';
            var ogTitle = document.querySelector('meta[property="og:title"]');
            if(ogTitle) ogTitle.setAttribute('content', product.name);
            
            // Set cart quantity from existing cart
            var cart = getCart();
            var cartItem = cart.find(function(i){return i.id===product.id;});
            if(cartItem) quantity = cartItem.quantity || 1;
            else quantity = 1;
            
            renderProduct(); loadRelatedProducts(); completeProgress();
        } catch(e) {
            console.error('Load error:',e);
            document.getElementById('mainContent').innerHTML='<div class="error-container"><i class="fas fa-exclamation-circle"></i><h3>प्रोडक्ट लोड करने में विफल</h3><p>कृपया अपना कनेक्शन जांचें</p><button onclick="loadProduct()">🔄 पुनः प्रयास करें</button></div>';
            showToast('❌ प्रोडक्ट लोड करने में विफल', true);
        }
    }

    function renderProduct() {
        var p = currentProduct; if(!p) return;
        document.getElementById('productTitle').textContent = p.name || 'प्रोडक्ट';
        var unitMap = { kg:'प्रति kg', gram:'प्रति 100g', liter:'प्रति लीटर', dozen:'प्रति दर्जन', piece:'प्रति पीस' };
        var unitText = unitMap[p.unit] || 'प्रति यूनिट';
        var isOut = maxStock <= 0;
        var savedAmount = p.price - offerPrice;
        var stockPercent = Math.min((maxStock/Math.max(p.max_stock||maxStock||100,maxStock))*100,100);
        
        var html = '<div class="product-slider"><div class="swiper product-swiper" id="productSwiper"><div class="swiper-wrapper">';
        html += productImages.map(function(img){return '<div class="swiper-slide" onclick="openFullscreen()"><img src="'+img+'" loading="eager" alt="'+escapeHTML(p.name)+'" onerror="this.style.display=\'none\'"></div>';}).join('');
        html += '</div></div>';
        if(productImages.length>1) html += '<div class="image-counter"><span id="currentSlide">1</span>/'+productImages.length+'</div>';
        html += '<div class="slider-pagination"><div class="swiper-pagination"></div></div></div>';
        
        html += '<div class="product-info-section"><h1 class="product-name">'+escapeHTML(p.name)+'</h1>';
        html += '<div class="product-meta"><div class="rating-badge">'+(p.rating||4.0)+' <i class="fas fa-star"></i></div>';
        html += '<span class="rating-admin-tag">🔒 एडमिन</span><span class="rating-count">'+(p.rating_count||0)+' रेटिंग</span>';
        html += '<span class="divider-dot"></span><span class="sold-count">'+(p.total_sold||0)+'+ बिक्री</span></div>';
        html += '<div class="unit-pill"><i class="fas fa-weight-hanging"></i> '+unitText+'</div>';
        html += '<div class="product-price-section"><span class="current-price">₹'+offerPrice.toLocaleString('en-IN')+'</span>';
        if(discountPercent>0) html += '<span class="original-price">₹'+p.price.toLocaleString('en-IN')+'</span><span class="discount-percent">'+discountPercent+'% छूट</span>';
        html += '</div>';
        if(savedAmount>0) html += '<span class="saved-text">आप बचा रहे हैं ₹'+savedAmount+'!</span>';
        html += '<div class="tax-info">सभी कर शामिल</div>';
        
        if(currentOffer) {
            html += '<div class="offer-banner"><i class="fas fa-tag"></i> '+escapeHTML(currentOffer.title||'ऑफर');
            if(currentOffer.coupon_code) html += '<span class="offer-code" onclick="copyCode(\''+escapeHTML(currentOffer.coupon_code)+'\')">'+escapeHTML(currentOffer.coupon_code)+' 📋</span>';
            html += '</div>';
        }
        
        if(!isOut) {
            html += '<div class="quantity-section"><span class="quantity-label">मात्रा <small>('+maxStock+' उपलब्ध)</small></span>';
            html += '<div class="quantity-control"><button class="quantity-btn'+(quantity<=1?' disabled':'')+'" onclick="changeQuantity(-1)">−</button>';
            html += '<span class="quantity-value" id="quantityDisplay">'+quantity+'</span>';
            html += '<button class="quantity-btn'+(quantity>=maxStock?' disabled':'')+'" onclick="changeQuantity(1)">+</button></div></div>';
            html += '<div class="stock-info'+(maxStock<10?' low-stock':'')+'">'+(maxStock<10?'<i class="fas fa-exclamation-triangle"></i>':'<i class="fas fa-check-circle" style="color:#0F6E3B;"></i>')+' '+(maxStock<10?'सिर्फ '+maxStock+' स्टॉक में बाकी!':'स्टॉक में उपलब्ध')+'<div class="stock-bar"><div class="stock-bar-fill'+(maxStock<10?' low':'')+'" style="width:'+stockPercent+'%"></div></div></div>';
        } else {
            html += '<div style="padding:16px 0;text-align:center;color:#EF4444;font-weight:700;font-size:15px;"><i class="fas fa-ban"></i> अभी स्टॉक खत्म</div>';
        }
        html += '</div>';
        
        if(currentShop) {
            html += '<div class="shop-info-section"><div class="shop-header"><div class="shop-img">';
            html += currentShop.image_url ? '<img src="'+getFullUrl(currentShop.image_url)+'" loading="lazy" alt="'+escapeHTML(currentShop.name)+'">' : '<i class="fas fa-store"></i>';
            html += '</div><div class="shop-details"><div class="shop-name">'+escapeHTML(currentShop.name)+'</div><div class="shop-meta">';
            html += '<span><i class="fas fa-star"></i> '+(currentShop.rating||'4.0')+'</span><span><i class="fas fa-map-pin"></i> '+escapeHTML(currentShop.area||currentShop.city||'Sillod')+'</span>';
            html += '<span class="shop-verified"><i class="fas fa-check-circle"></i> सत्यापित</span></div></div>';
            html += '<button class="view-shop-btn" onclick="fastNavigate(\'shop-details.html?id='+currentShop.id+'\')">दुकान देखें</button></div></div>';
        }
        
        html += '<div class="description-section"><h3 class="section-title"><i class="fas fa-align-left"></i> विवरण</h3><div class="description-text">'+escapeHTML(p.description||'इस प्रोडक्ट के लिए कोई विवरण उपलब्ध नहीं है।')+'</div></div>';
        
        if(p.brand || p.manufacturer || p.country_of_origin) {
            html += '<div class="additional-info"><h3 class="section-title"><i class="fas fa-info-circle"></i> अतिरिक्त जानकारी</h3>';
            if(p.brand) html += '<div class="info-row"><span class="info-label">ब्रांड</span><span class="info-value">'+escapeHTML(p.brand)+'</span></div>';
            if(p.manufacturer) html += '<div class="info-row"><span class="info-label">निर्माता</span><span class="info-value">'+escapeHTML(p.manufacturer)+'</span></div>';
            if(p.country_of_origin) html += '<div class="info-row"><span class="info-label">मूल देश</span><span class="info-value">'+escapeHTML(p.country_of_origin)+'</span></div>';
            html += '</div>';
        }
        
        html += '<div class="related-section"><div class="related-header"><h3><i class="fas fa-link"></i> आपको ये भी पसंद आएंगे</h3><button class="view-all" onclick="fastNavigate(\'products.html\')">सभी देखें →</button></div><div id="relatedContainer" class="products-grid"></div></div>';
        
        // 🎁 Invite & Earn
        html += '<div class="invite-banner"><div class="invite-title">🎁 दोस्तों को इन्वाइट करें और ₹50 पाएं!</div><div class="invite-subtitle">हर दोस्त के पहले ऑर्डर पर आपको ₹50 मिलेंगे</div><button class="btn-invite" onclick="fastNavigate(\'invite-earn.html\')"><i class="fas fa-gift"></i> अभी इन्वाइट करें</button></div>';
        
        document.getElementById('mainContent').innerHTML = html;
        document.getElementById('bottomBar').style.display = 'flex';
        
        if(isOut) {
            var addBtn = document.getElementById('addToCartBtn'), buyBtn = document.getElementById('buyNowBtn');
            if(addBtn) { addBtn.classList.add('disabled'); addBtn.innerHTML = '<i class="fas fa-ban"></i> स्टॉक खत्म'; }
            if(buyBtn) { buyBtn.classList.add('disabled'); buyBtn.innerHTML = '<i class="fas fa-ban"></i> स्टॉक खत्म'; }
        }
        updateAddToCartButtonText();
        
        setTimeout(function() {
            if(productSwiper) { try { productSwiper.destroy(true,true); } catch(e) {} }
            productSwiper = new Swiper('#productSwiper', {
                loop: productImages.length>1,
                pagination: { el: '.slider-pagination .swiper-pagination', clickable: true },
                on: { slideChange: function() { if(productImages.length>1) { var el=document.getElementById('currentSlide'); if(el) el.textContent=this.realIndex+1; } } }
            });
        }, 150);
    }

    function updateAddToCartButtonText() {
        if(!currentProduct) return;
        var cart = getCart();
        var cartItem = cart.find(function(i){return i.id===currentProduct.id;});
        var addBtn = document.getElementById('addToCartBtn'), addText = document.getElementById('addToCartText');
        if(cartItem && addBtn && addText) {
            addText.textContent = 'कार्ट में जाएं ('+(cartItem.quantity||1)+')';
            addBtn.classList.add('go-to-cart');
            addBtn.setAttribute('onclick',"fastNavigate('cart.html')");
        }
    }

    async function loadRelatedProducts() {
        var container = document.getElementById('relatedContainer'); if(!container) return;
        try {
            var result = await safeFetch(function(){return sb.from('products').select('*').eq('is_active',true).neq('id',productId).limit(6);});
            var data = result.data;
            if(data && data.length) {
                container.innerHTML = data.map(function(p){
                    var img = p.images?.[0]||p.image_url||'';
                    var imgUrl = getFullUrl(img);
                    var relOffer = calculateOfferPrice(p);
                    return '<div class="mini-product-card" onclick="fastNavigate(\'product-detail.html?id='+p.id+'\')"><div class="mini-product-img">'+(imgUrl?'<img src="'+imgUrl+'" loading="lazy" alt="'+escapeHTML(p.name)+'">':'<i class="fas fa-box-open"></i>')+'</div><div class="mini-product-info"><div class="mini-product-rating"><i class="fas fa-star"></i> '+(p.rating||'4.0')+'</div><div class="mini-product-name">'+escapeHTML(p.name)+'</div><div class="mini-product-price">₹'+relOffer.price+'</div></div></div>';
                }).join('');
            } else { container.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:20px;color:var(--text-secondary);font-size:13px;">कोई संबंधित प्रोडक्ट नहीं</p>'; }
        } catch(e) { container.innerHTML = ''; }
    }

    window.changeQuantity = function(delta) {
        var newQty = quantity + delta;
        if(newQty >= 1 && newQty <= maxStock) {
            quantity = newQty;
            var qtyDisplay = document.getElementById('quantityDisplay');
            if(qtyDisplay) qtyDisplay.textContent = quantity;
            var btns = document.querySelectorAll('.quantity-btn');
            if(btns[0]) btns[0].classList.toggle('disabled', quantity<=1);
            if(btns[1]) btns[1].classList.toggle('disabled', quantity>=maxStock);
        }
    };

    window.addToCart = function() {
        if(!currentProduct) return;
        if(maxStock <= 0) { showToast('प्रोडक्ट स्टॉक में नहीं है', true); return; }
        if(quantity > maxStock) { showToast('सिर्फ '+maxStock+' आइटम उपलब्ध हैं', true); return; }
        try {
            var cart = getCart();
            var existing = cart.find(function(i){return i.id===currentProduct.id;});
            var img = productImages[0] || '';
            if(existing) { existing.quantity += quantity; }
            else { cart.push({id:currentProduct.id,name:currentProduct.name,price:offerPrice,originalPrice:currentProduct.price,image:img,quantity:quantity,unit:currentProduct.unit||'piece'}); }
            saveCart(cart); updateCartBadge(); updateAddToCartButtonText();
            showToast('🛒 '+quantity+' × '+currentProduct.name+' कार्ट में जोड़ा!');
            if(navigator.vibrate) navigator.vibrate(15);
            // Quantity stays as is (don't reset to 1)
        } catch(e) { showToast('कार्ट में जोड़ने में विफल', true); }
    };

    window.buyNow = function() {
        if(maxStock <= 0) { showToast('प्रोडक्ट स्टॉक में नहीं है', true); return; }
        if(!currentUser) { checkUser().then(function(loggedIn){ if(!loggedIn) { showToast('कृपया पहले लॉगिन करें',true); localStorage.setItem('zatpat_redirect_after_login','checkout.html'); setTimeout(function(){window.location.href='index.html';},800); return; } addToCart(); fastNavigate('checkout.html'); }); return; }
        addToCart(); fastNavigate('checkout.html');
    };

    function toggleWishlist() {
        if(!currentProduct) return;
        var wishlist = JSON.parse(localStorage.getItem('zatpat_wishlist')||'[]');
        if(isInWishlist) { wishlist = wishlist.filter(function(id){return id!==productId;}); }
        else { wishlist.push(productId); }
        localStorage.setItem('zatpat_wishlist', JSON.stringify(wishlist));
        isInWishlist = !isInWishlist; updateWishlistUI();
        showToast(isInWishlist?'❤️ विशलिस्ट में जोड़ा!':'विशलिस्ट से हटाया');
        if(navigator.vibrate) navigator.vibrate(10);
    }

    function updateWishlistUI() {
        var btn = document.getElementById('wishlistBtn'), icon = btn && btn.querySelector('i');
        if(icon) { icon.className = isInWishlist ? 'fas fa-heart' : 'far fa-heart'; if(isInWishlist) btn.classList.add('liked'); else btn.classList.remove('liked'); }
    }

    function copyCode(code) { navigator.clipboard.writeText(code).then(function(){showToast('📋 कूपन कोड कॉपी किया!');}); }

    window.addEventListener('scroll', function() { var topBar=document.getElementById('topBar'); if(topBar) topBar.classList.toggle('scrolled', window.scrollY>10); }, {passive:true});
    document.addEventListener('keydown', function(e) { if(e.key==='Escape') closeFullscreen(); });

    document.addEventListener('DOMContentLoaded', async function() {
        await checkUser(); updateCartBadge();
        if(productId) { loadProduct(); } else {
            document.getElementById('mainContent').innerHTML='<div class="error-container"><i class="fas fa-box-open"></i><h3>प्रोडक्ट नहीं मिला</h3><p>कृपया कोई प्रोडक्ट चुनें</p><button onclick="goBack()">वापस जाएं</button></div>';
        }
        showApp(); initComplete = true;
    });

    document.addEventListener('visibilitychange', function() { if(!document.hidden && initComplete) { updateCartBadge(); } });

    window.handleBackPress = function() { goBack(); return true; };
    window.goBack = goBack;
    window.addToCart = addToCart;
    window.buyNow = buyNow;
    window.toggleWishlist = toggleWishlist;
    window.openFullscreen = openFullscreen;
    window.closeFullscreen = closeFullscreen;
    window.changeQuantity = changeQuantity;
    window.fastNavigate = fastNavigate;
    window.shareProduct = shareProduct;
    window.copyCode = copyCode;
})();
</script>
</body>
</html>
