        var l = $('simpleLoader'), a = $('mainApp');
        var alreadyLoaded = null;
        try { alreadyLoaded = sessionStorage.getItem('product_detail_loaded'); } catch(e) {}
        
        if (alreadyLoaded) {
            if (l && l.parentNode) l.parentNode.removeChild(l);
            if (a) { a.style.display = ''; a.style.opacity = '1'; }
        } else {
            try { sessionStorage.setItem('product_detail_loaded', 'true'); } catch(e) {}
            if (a) a.style.display = '';
            if (l) { l.classList.add('fade-out'); setTimeout(function() { if (l && l.parentNode) l.parentNode.removeChild(l); }, 300); }
        }
    }
    
    function startProgress() { var b = $('pageProgress'); if (b) { b.style.width='0%'; b.classList.add('loading'); requestAnimationFrame(function(){b.style.width='90%';}); } }
    function completeProgress() { var b = $('pageProgress'); if (b) { b.classList.remove('loading'); b.classList.add('complete'); setTimeout(function(){b.style.width='0%';b.classList.remove('complete');},350); } }
    function showToast(m, e) { var t = $('toastMsg'), s = $('toastText'); if (!t||!s) return; s.textContent = m; t.style.background = e ? '#EF4444' : '#1A1A1A'; t.classList.add('show'); clearTimeout(t._timer); t._timer = setTimeout(function(){t.classList.remove('show');},2500); }
    function goBack() { try { if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) { window.history.back(); return; } } catch(e) {} window.location.href = 'index.html'; }
    window.fastNavigate = function(url) { startProgress(); setTimeout(function() { window.location.href = url; }, 60); };
    
    // ============ AUTH ============
    async function checkUser() { try { var res = await sb.auth.getSession(); currentUser = (res && res.data && res.data.session) ? res.data.session.user : null; } catch(e) { currentUser = null; } return !!currentUser; }
    
    // ============ CART ============
    function getCart() { return safeJSON(localStorage.getItem('zatpat_cart'), []); }
    function saveCart(c) { try { localStorage.setItem('zatpat_cart', JSON.stringify(c)); } catch(e) {} }
    function updateCartBadge() { var cart = getCart(), count = cart.reduce(function(s,i){return s+(i.quantity||1);},0); var badge = $('cartBadge'); if (badge) badge.textContent = count; return count; }
    
    // ============ SHARE ============
    function shareProduct() { 
        if(!currentProduct) return; 
        if(navigator.share) { navigator.share({title:'Zymart - '+currentProduct.name,text:currentProduct.name+' देखें!',url:window.location.href}).catch(function(){}); } 
        else { try { navigator.clipboard.writeText(window.location.href); showToast('📋 लिंक कॉपी!'); } catch(e) { showToast('शेयर नहीं हुआ', true); } } 
    }
    
    // ============ OFFERS ============
    async function loadActiveOffers() { try { var r = await sb.from('offers').select('*').eq('is_active',true); allOffers = (r && r.data) ? r.data : []; } catch(e) { allOffers = []; } }
    
    function calculateOfferPrice(product) {
        if (!product || !product.price) return { price: 0, discountPercent: 0, source: 'none' };
        if (product.offer_price && product.offer_price>0 && product.offer_price<product.price) 
            return { price: product.offer_price, discountPercent: Math.round((1-product.offer_price/product.price)*100), source: 'product' };
        var now = new Date();
        var applicable = allOffers.filter(function(o) {
            if (o.valid_from && new Date(o.valid_from)>now) return false; 
            if (o.valid_till && new Date(o.valid_till)<now) return false;
            if (o.apply_to==='global') return true; 
            if (o.apply_to==='category' && o.target_id===product.category_id) return true;
            if (o.apply_to==='product' && o.target_id===product.id) return true; 
            if (o.apply_to==='shop' && o.target_id===product.shop_id) return true;
            return false;
        });
        if (applicable.length>0) {
            var best = applicable.sort(function(a,b){
                var aV=a.discount_type==='percentage'?a.discount_value:(a.discount_value/product.price)*100,
                    bV=b.discount_type==='percentage'?b.discount_value:(b.discount_value/product.price)*100;
                return bV-aV;
            })[0];
            var discount = best.discount_type==='percentage'?(product.price*best.discount_value)/100:best.discount_value;
            if (best.max_discount>0 && best.discount_type==='percentage') discount=Math.min(discount,best.max_discount);
            var calcPrice = Math.max(Math.round(product.price-discount),0);
            if (calcPrice<product.price) return { price:calcPrice, discountPercent:Math.round((1-calcPrice/product.price)*100), source:'offer', offer:best };
        }
        return { price: product.price, discountPercent: 0, source: 'none' };
    }
    
    // ============ FULLSCREEN ============
    function openFullscreen() {
        var modal = $('fullscreenModal'), wrapper = $('fullscreenWrapper');
        if (!modal || !wrapper || !productImages.length) return;
        wrapper.innerHTML = productImages.map(function(img){return'<div class="swiper-slide"><img src="'+img+'" loading="lazy" alt="प्रोडक्ट"></div>';}).join('');
        modal.classList.add('active'); document.body.style.overflow = 'hidden';
        setTimeout(function() { if(fullscreenSwiper){try{fullscreenSwiper.destroy();}catch(e){}} fullscreenSwiper = new Swiper('#fullscreenSwiper',{loop:productImages.length>1,keyboard:{enabled:true}}); }, 150);
    }
    window.closeFullscreen = function() { var m = $('fullscreenModal'); if (m) m.classList.remove('active'); document.body.style.overflow = ''; if(fullscreenSwiper){try{fullscreenSwiper.destroy();}catch(e){}fullscreenSwiper=null;} };
    document.addEventListener('keydown',function(e){if(e.key==='Escape')window.closeFullscreen();});
    
    // ============ LOAD PRODUCT ============
    async function loadProduct() {
        var mc = $('mainContent');
        if (!productId) { if (mc) mc.innerHTML='<div class="error-container"><i class="fas fa-box-open"></i><h3>प्रोडक्ट नहीं मिला</h3><p>कोई ID नहीं</p><button onclick="goBack()">वापस जाएं</button></div>'; return; }
        try {
            await loadActiveOffers();
            var result = await sb.from('products').select('*, shops(*)').eq('id',productId).single();
            var product = (result && result.data) ? result.data : null;
            if (!product) { showToast('प्रोडक्ट नहीं मिला', true); setTimeout(function(){goBack();},1500); return; }
            
            currentProduct = product; 
            currentShop = product.shops;
            productImages = (product.images && product.images.length) ? product.images.map(function(img){return getFullUrl(img);}) : product.image_url ? [getFullUrl(product.image_url)] : [];
            if (!productImages.length) productImages = ['data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect fill="#EDF7F1" width="400" height="400"/><text x="200" y="210" text-anchor="middle" font-size="60">📦</text></svg>')];
            
            maxStock = product.stock || 0;
            var offerResult = calculateOfferPrice(product);
            offerPrice = offerResult.price; 
            discountPercent = offerResult.discountPercent;
            currentOffer = offerResult.source==='offer' ? offerResult.offer : null;
            
            var wishlist = safeJSON(localStorage.getItem('zatpat_wishlist'), []);
            isInWishlist = wishlist.some(function(item) { return (typeof item === 'object' && item.id === productId) || item === productId; });
            updateWishlistUI();
            
            document.title = (product.name||'प्रोडक्ट') + ' - Zymart';
            
            var cart = getCart(), cartItem = cart.find(function(i){return i.id===product.id;});
            quantity = cartItem ? (cartItem.quantity||1) : 1;
            
            renderProduct(); 
            loadRelatedProducts(); 
            completeProgress();
        } catch(e) { 
            if (mc) mc.innerHTML='<div class="error-container"><i class="fas fa-exclamation-circle"></i><h3>लोड विफल</h3><p>कनेक्शन जांचें और पुनः प्रयास करें</p><button onclick="loadProduct()">🔄 पुनः प्रयास</button></div>'; 
            showToast('❌ प्रोडक्ट लोड नहीं हो पाया', true); 
        }
    }
    
    // ============ RENDER ============
    function renderProduct() {
        var p = currentProduct; if (!p) return;
        var titleEl = $('productTitle'); if (titleEl) titleEl.textContent = p.name || 'प्रोडक्ट';
        var unitMap = { kg:'प्रति kg', gram:'प्रति 100g', liter:'प्रति लीटर', dozen:'प्रति दर्जन', piece:'प्रति पीस' };
        var unitText = unitMap[p.unit] || 'प्रति यूनिट', isOut = maxStock <= 0, savedAmount = p.price - offerPrice;
        var stockPercent = Math.min((maxStock/Math.max(p.max_stock||maxStock||100,maxStock))*100,100);
        
        var html = '<div class="product-slider"><div class="swiper product-swiper" id="productSwiper"><div class="swiper-wrapper">';
        html += productImages.map(function(img){return'<div class="swiper-slide" onclick="openFullscreen()"><img src="'+img+'" loading="eager" alt="'+esc(p.name)+'" onerror="this.style.display=\'none\'"></div>';}).join('');
        html += '</div></div>';
        if (productImages.length>1) html += '<div class="image-counter"><span id="currentSlide">1</span>/'+productImages.length+'</div>';
        html += '<div class="slider-pagination"><div class="swiper-pagination"></div></div></div>';
        
        html += '<div class="product-info-section"><h1 class="product-name">'+esc(p.name)+'</h1>';
        html += '<div class="product-meta"><div class="rating-badge">'+(p.rating||4.0)+' <i class="fas fa-star"></i></div>';
        html += '<span class="rating-count">'+(p.rating_count||0)+' रेटिंग</span>';
        html += '<span class="sold-count">'+(p.total_sold||0)+'+ बिक्री</span></div>';
        html += '<div class="unit-pill"><i class="fas fa-weight-hanging"></i> '+unitText+'</div>';
        html += '<div class="product-price-section"><span class="current-price">₹'+offerPrice.toLocaleString('en-IN')+'</span>';
        if (discountPercent>0) html += '<span class="original-price">₹'+(p.price||0).toLocaleString('en-IN')+'</span><span class="discount-percent">'+discountPercent+'% छूट</span>';
        html += '</div>';
        if (savedAmount>0) html += '<span class="saved-text">आप बचा रहे हैं ₹'+savedAmount.toLocaleString('en-IN')+'!</span>';
        html += '<div class="tax-info">सभी कर शामिल</div>';
        
        if (currentOffer) { html += '<div class="offer-banner"><i class="fas fa-tag"></i> '+esc(currentOffer.title||'ऑफर'); if (currentOffer.coupon_code) html += '<span class="offer-code" onclick="copyCode(\''+esc(currentOffer.coupon_code)+'\')">'+esc(currentOffer.coupon_code)+' 📋</span>'; html += '</div>'; }
        
        if (!isOut) {
            html += '<div class="quantity-section"><span class="quantity-label">मात्रा <small>('+maxStock+' उपलब्ध)</small></span><div class="quantity-control"><button class="quantity-btn'+(quantity<=1?' disabled':'')+'" onclick="changeQuantity(-1)">−</button><span class="quantity-value" id="quantityDisplay">'+quantity+'</span><button class="quantity-btn'+(quantity>=maxStock?' disabled':'')+'" onclick="changeQuantity(1)">+</button></div></div>';
            html += '<div class="stock-info'+(maxStock<10?' low-stock':'')+'">'+(maxStock<10?'<i class="fas fa-exclamation-triangle"></i>':'<i class="fas fa-check-circle" style="color:#0B5A31;"></i>')+' '+(maxStock<10?'सिर्फ '+maxStock+' बाकी!':'स्टॉक में उपलब्ध')+'<div class="stock-bar"><div class="stock-bar-fill'+(maxStock<10?' low':'')+'" style="width:'+stockPercent+'%"></div></div></div>';
        } else { html += '<div style="padding:16px 0;text-align:center;color:#EF4444;font-weight:700;font-size:15px;"><i class="fas fa-ban"></i> अभी स्टॉक खत्म</div>'; }
        html += '</div>';
        
        if (currentShop) {
            html += '<div class="shop-info-section"><div class="shop-header"><div class="shop-img">'+(currentShop.image_url?'<img src="'+getFullUrl(currentShop.image_url)+'" loading="lazy" alt="">':'<i class="fas fa-store"></i>')+'</div><div class="shop-details"><div class="shop-name">'+esc(currentShop.name)+'</div><div class="shop-meta"><span><i class="fas fa-star"></i> '+(currentShop.rating||'4.0')+'</span><span><i class="fas fa-map-pin"></i> '+esc(currentShop.area||currentShop.city||'')+'</span><span class="shop-verified"><i class="fas fa-check-circle"></i> सत्यापित</span></div></div><button class="view-shop-btn" onclick="fastNavigate(\'shop-details.html?id='+currentShop.id+'\')">दुकान देखें</button></div></div>';
        }
        
        html += '<div class="description-section"><h3 class="section-title"><i class="fas fa-align-left"></i> विवरण</h3><div class="description-text">'+esc(p.description||'इस प्रोडक्ट के लिए कोई विवरण उपलब्ध नहीं है।')+'</div></div>';
        html += '<div class="related-section"><div class="related-header"><h3><i class="fas fa-link"></i> आपको ये भी पसंद आएंगे</h3><button class="view-all" onclick="fastNavigate(\'products.html\')">सभी देखें →</button></div><div id="relatedContainer" class="products-grid"></div></div>';
        html += '<div class="invite-banner"><div class="invite-title">🎁 दोस्तों को इन्वाइट करें</div><div class="invite-subtitle">हर दोस्त के पहले ऑर्डर पर ₹50 पाएं</div><button class="btn-invite" onclick="fastNavigate(\'invite-earn.html\')"><i class="fas fa-gift"></i> अभी इन्वाइट करें</button></div>';
        
        var mc = $('mainContent'); if (mc) mc.innerHTML = html;
        var bb = $('bottomBar'); if (bb) bb.style.display = 'flex';
        
        if (isOut) { 
            var ab = $('addToCartBtn'), bn = $('buyNowBtn'); 
            if (ab) { ab.classList.add('disabled'); ab.innerHTML = '<i class="fas fa-ban"></i> स्टॉक खत्म'; } 
            if (bn) { bn.classList.add('disabled'); bn.innerHTML = '<i class="fas fa-ban"></i> स्टॉक खत्म'; } 
        }
        updateAddToCartButtonText();
        
        setTimeout(function() { 
            if (productSwiper) { try { productSwiper.destroy(true,true); } catch(e) {} } 
            productSwiper = new Swiper('#productSwiper', { 
                loop:productImages.length>1, 
                pagination:{el:'.slider-pagination .swiper-pagination',clickable:true}, 
                on:{slideChange:function(){if(productImages.length>1){var el=$('currentSlide');if(el)el.textContent=this.realIndex+1;}}} 
            }); 
        }, 150);
    }
    
    function updateAddToCartButtonText() { 
        if(!currentProduct) return; 
        var cart = getCart(), ci = cart.find(function(i){return i.id===currentProduct.id;}), 
            ab = $('addToCartBtn'), at = $('addToCartText'); 
        if (ci && ab && at) { 
            at.textContent = 'कार्ट में जाएं ('+(ci.quantity||1)+')'; 
            ab.classList.add('go-to-cart'); 
            ab.setAttribute('onclick',"fastNavigate('cart.html')"); 
        } else if (ab && at) {
            at.textContent = 'कार्ट में जोड़ें';
            ab.classList.remove('go-to-cart');
            ab.setAttribute('onclick',"addToCart()");
        }
    }
    
    // ============ RELATED PRODUCTS ============
    async function loadRelatedProducts() { 
        var c = $('relatedContainer'); if (!c) return; 
        try { 
            var r = await sb.from('products').select('*').eq('is_active',true).neq('id',productId).limit(6); 
            if (r.data && r.data.length) { 
                c.innerHTML = r.data.map(function(p){
                    var img=getFullUrl(p.images?.[0]||p.image_url||''),ro=calculateOfferPrice(p);
                    return'<div class="mini-product-card" onclick="fastNavigate(\'product-detail.html?id='+p.id+'\')"><div class="mini-product-img">'+(img?'<img src="'+img+'" loading="lazy">':'<i class="fas fa-box-open"></i>')+'</div><div class="mini-product-info"><div class="mini-product-name">'+esc(p.name)+'</div><div class="mini-product-price">₹'+ro.price.toLocaleString('en-IN')+'</div></div></div>';
                }).join(''); 
            } 
        } catch(e) {} 
    }
    
    // ============ QUANTITY ============
    window.changeQuantity = function(d) { 
        var nq = quantity+d; 
        if (nq>=1 && nq<=maxStock) { 
            quantity=nq; 
            var qd=$('quantityDisplay'); if(qd)qd.textContent=quantity; 
            var btns=document.querySelectorAll('.quantity-btn'); 
            if(btns[0])btns[0].classList.toggle('disabled',quantity<=1); 
            if(btns[1])btns[1].classList.toggle('disabled',quantity>=maxStock); 
            updateAddToCartButtonText();
        } 
    };
    
    // ============ ADD TO CART ============
    window.addToCart = function() { 
        if(!currentProduct||maxStock<=0||quantity>maxStock) return; 
        try {
            var cart=getCart(),ex=cart.find(function(i){return i.id===currentProduct.id;}),
                img=productImages[0]||''; 
            if(ex)ex.quantity+=quantity;
            else cart.push({id:currentProduct.id,name:currentProduct.name,price:offerPrice,originalPrice:currentProduct.price,image:img,quantity:quantity,unit:currentProduct.unit||'piece'}); 
            saveCart(cart);updateCartBadge();updateAddToCartButtonText();
            showToast('🛒 '+quantity+'× '+(currentProduct.name||'आइटम')+' जोड़ा!');
            if(navigator.vibrate)navigator.vibrate(12);
        }catch(e){showToast('कार्ट में नहीं जोड़ पाए',true);} 
    };
    
    // ============ BUY NOW ============
    window.buyNow = async function() { 
        if(maxStock<=0) return; 
        if (!currentUser) {
            var loggedIn = await checkUser();
            if (!loggedIn) {
                showToast('🔐 कृपया पहले लॉगिन करें', true);
                try { sessionStorage.setItem('zatpat_redirect_after_login', 'checkout.html'); } catch(e) {}
                setTimeout(function(){ window.location.href = 'index.html?action=login&redirect=checkout'; }, 600);
                return;
            }
        }
        window.addToCart();
        setTimeout(function() { window.fastNavigate('checkout.html'); }, 300);
    };
    
    // ============ WISHLIST ============
    function toggleWishlist() {
        if(!currentProduct) return;
        var wishlist = safeJSON(localStorage.getItem('zatpat_wishlist'), []);
        var idx = wishlist.findIndex(function(item) { return (typeof item === 'object' && item.id === productId) || item === productId; });
        if(idx !== -1) { wishlist.splice(idx, 1); isInWishlist = false; showToast('विशलिस्ट से हटाया'); }
        else {
            wishlist.push({ id: currentProduct.id, name: currentProduct.name, price: offerPrice, originalPrice: currentProduct.price, image: productImages[0] || '', unit: currentProduct.unit || 'piece', rating: currentProduct.rating || 0, discountPercent: discountPercent, added_at: new Date().toISOString() });
            isInWishlist = true; showToast('❤️ विशलिस्ट में जोड़ा!');
        }
        try { localStorage.setItem('zatpat_wishlist', JSON.stringify(wishlist)); } catch(e) {}
        updateWishlistUI();
        if(navigator.vibrate) navigator.vibrate(8);
    }
    
    function updateWishlistUI() {
        var btn=$('wishlistBtn'),icon=btn&&btn.querySelector('i');
        if(icon){icon.className=isInWishlist?'fas fa-heart':'far fa-heart';if(isInWishlist)btn.classList.add('liked');else btn.classList.remove('liked');}
    }
    
    function copyCode(code) { try { navigator.clipboard.writeText(code); showToast('📋 कूपन कॉपी!'); } catch(e) { showToast('कॉपी नहीं हुआ',true); } }
    
    // ============ INIT ============
    document.addEventListener('DOMContentLoaded', async function() {
        await checkUser(); 
        updateCartBadge(); 
        if (productId) { loadProduct(); } 
        else { var mc=$('mainContent'); if(mc)mc.innerHTML='<div class="error-container"><i class="fas fa-box-open"></i><h3>प्रोडक्ट नहीं</h3><p>कोई प्रोडक्ट चुनें</p><button onclick="goBack()">वापस</button></div>'; } 
        showApp(); 
        initComplete=true;
    });
    
    document.addEventListener('visibilitychange', function() { if(!document.hidden&&initComplete) updateCartBadge(); });
    
    // ============ EXPORTS ============
    window.handleBackPress = function() { goBack(); return true; };
    window.goBack = goBack; 
    window.toggleWishlist = toggleWishlist; 
    window.openFullscreen = openFullscreen;
    window.shareProduct = shareProduct; 
    window.copyCode = copyCode;
})();
</script>
</body>
</html>
