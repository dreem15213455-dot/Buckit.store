<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">

    <style>
        :root {
            --brand-green: #0B5A31;
            --brand-green-dark: #083D21;
            --brand-orange: #F59E0B;
            --neutral-white: #FFFFFF;
            --neutral-bg: #F9FAFB;
            --neutral-border: #E5E7EB;
            --neutral-gray: #6B7280;
            --neutral-dark: #1A1A1A;
            --danger: #EF4444;
            --radius-sm: 10px;
            --radius-md: 14px;

        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--neutral-bg); color: var(--neutral-dark); overflow-x: hidden; padding-bottom: 95px; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; min-height: 100vh; }

        .top-bar { background: var(--brand-green); position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; padding: 8px 12px; padding-top: calc(8px + var(--status-bar-height)); display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 16px rgba(11,90,49,0.3); }
        .back-btn { width: 40px; height: 40px; min-width: 40px; background: rgba(255,255,255,0.10); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 15px; }
        .top-title { flex: 1; font-size: 14px; font-weight: 600; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .top-actions { display: flex; align-items: center; gap: 6px; }
        .icon-btn { width: 38px; height: 38px; min-width: 38px; background: rgba(255,255,255,0.10); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 14px; position: relative; text-decoration: none; }
        .cart-badge { position: absolute; top: -4px; right: -4px; background: var(--brand-orange); color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 9px; display: none; align-items: center; justify-content: center; border: 2px solid var(--brand-green); font-weight: 700; }
        .cart-badge.show { display: flex; }
        .main-content { padding-top: 56px; }
        .product-slider { position: relative; background: var(--neutral-white); width: 100%; }
        .swiper.product-swiper { width: 100%; height: 300px; }
        .product-swiper .swiper-slide { display: flex; align-items: center; justify-content: center; background: var(--neutral-white); }
        .product-swiper .swiper-slide img { width: 100%; height: 100%; object-fit: contain; }
        
        .offer-banner { background: linear-gradient(135deg, #FFF8EB, #FEF3C7); padding: 10px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid #FDE68A; }

        .offer-banner-title { font-size: 14px; font-weight: 700; color: #92400E; }
        .offer-banner-sub { font-size: 11px; color: #B45309; }
        
        .product-info-section { background: var(--neutral-white); padding: 14px; border-bottom: 8px solid var(--neutral-bg); }
        .product-brand { font-size: 11px; color: var(--brand-green); font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
        .product-name { font-family: 'Poppins', sans-serif; font-size: 19px; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
        .product-weight { font-size: 12px; color: var(--neutral-gray); margin-bottom: 8px; }
        .product-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .rating-badge { display: flex; align-items: center; gap: 4px; background: var(--brand-green); color: white; padding: 4px 8px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 700; }
        .variant-section { margin: 10px 0; background: #F9FAFB; border-radius: var(--radius-md); padding: 10px; border: 1px solid var(--neutral-border); }
        .variant-label { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
        .variant-pills { display: flex; gap: 8px; flex-wrap: wrap; }
        .variant-pill { padding: 8px 10px; border-radius: var(--radius-md); border: 2px solid var(--neutral-border); background: white; cursor: pointer; font-size: 11px; font-weight: 600; text-align: center; min-width: 70px; transition: all 0.2s; }
        .variant-pill.active { border-color: var(--brand-green); background: #EDF7F1; color: var(--brand-green); font-weight: 700; }
        .variant-pill.oos { opacity: 0.45; pointer-events: none; }
        .product-price-section { display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
        .current-price { font-family: 'Poppins', sans-serif; font-size: 28px; font-weight: 700; color: var(--brand-green-dark); }
        .original-price { font-size: 14px; color: var(--neutral-gray); text-decoration: line-through; }
        .discount-percent { background: var(--brand-orange); color: white; padding: 2px 7px; border-radius: var(--radius-sm); font-size: 10px; font-weight: 700; }
        .unit-price { font-size: 11px; color: var(--neutral-gray); margin-bottom: 4px; }
        .saved-text { font-size: 11px; color: #059669; font-weight: 600; margin-bottom: 3px; }
        .quantity-section { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--neutral-border); border-bottom: 1px solid var(--neutral-border); margin-bottom: 6px; }
        .quantity-control { display: flex; align-items: center; gap: 12px; background: #F3F5F4; border-radius: var(--radius-full); padding: 3px 5px; }
        .quantity-btn { width: 30px; height: 30px; border-radius: 50%; background: white; border: 1.5px solid var(--neutral-border); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; font-weight: 700; color: var(--brand-green); }
        .quantity-btn:active { transform: scale(0.9); }
        .quantity-value { font-size: 16px; font-weight: 700; min-width: 24px; text-align: center; }
        .shop-info-section { background: var(--neutral-white); padding: 12px 14px; border-bottom: 8px solid var(--neutral-bg); }
        .shop-header { display: flex; align-items: center; gap: 10px; }
        .shop-img { width: 44px; height: 44px; border-radius: var(--radius-sm); background: #EDF7F1; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 2px solid #C8E6C9; }
        .shop-img img { width: 100%; height: 100%; object-fit: cover; }
        .description-section { background: var(--neutral-white); padding: 12px 14px; border-bottom: 8px solid var(--neutral-bg); }
        .section-title { font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
        .attributes-section { background: var(--neutral-white); padding: 12px 14px; border-bottom: 8px solid var(--neutral-bg); }
        .attribute-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .attribute-card { background: #F9FAFB; border-radius: var(--radius-sm); padding: 10px; border: 1px solid var(--neutral-border); }
        .related-section { background: var(--neutral-white); padding: 12px 0; }
        .related-header { padding: 0 14px 10px; display: flex; justify-content: space-between; align-items: center; }
        .products-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 10px; }
        .mini-product-card { background: white; border-radius: var(--radius-sm); overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid var(--neutral-border); cursor: pointer; transition: transform 0.2s; }
        .mini-product-card:active { transform: scale(0.95); }
        .mini-product-img { width: 100%; aspect-ratio: 1/1; background: #F9FAFB; display: flex; align-items: center; justify-content: center; }
        .mini-product-img img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
        .mini-product-info { padding: 6px; }
        .mini-product-name { font-size: 10px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-product-price { font-size: 12px; font-weight: 700; color: var(--brand-green-dark); }
        .bottom-action-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: white; padding: 8px 12px; box-shadow: 0 -4px 20px rgba(0,0,0,0.08); z-index: 1000; display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--neutral-border); }
        .price-display { flex-shrink: 0; }
        .price-display .current { font-size: 18px; font-weight: 800; color: var(--brand-green-dark); }
        .price-display .original { font-size: 11px; color: #9CA3AF; text-decoration: line-through; }
        .add-to-cart-btn { flex: 1; background: var(--brand-green); color: white; border: none; padding: 12px; border-radius: var(--radius-full); font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s; }
        .add-to-cart-btn:active { transform: scale(0.97); }
        .add-to-cart-btn.disabled { background: #D1D5DB; color: #9CA3AF; pointer-events: none; }
        .buy-now-btn { flex: 1; background: var(--brand-orange); color: white; border: none; padding: 12px; border-radius: var(--radius-full); font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s; }
        .buy-now-btn:active { transform: scale(0.97); }
        .buy-now-btn.disabled { background: #D1D5DB; color: #9CA3AF; pointer-events: none; }
        .toast-notification { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--neutral-dark); color: white; padding: 10px 18px; border-radius: var(--radius-full); font-size: 11px; z-index: 10050; opacity: 0; visibility: hidden; transition: all 0.3s ease; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
        .toast-notification.show { opacity: 1; visibility: visible; }
        .toast-notification.error { background: #EF4444; }
        .toast-notification.success { background: #059669; }
        .error-container { text-align: center; padding: 50px 20px; }
        .error-container i { font-size: 48px; color: #D1D5DB; margin-bottom: 10px; display: block; }
        .error-container button { background: var(--brand-green); color: white; border: none; padding: 10px 20px; border-radius: var(--radius-full); font-weight: 600; cursor: pointer; }
        #simpleLoader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: var(--neutral-bg); z-index: 9999; }
        @media(max-width: 380px) { .product-swiper { height: 250px; } .current-price { font-size: 24px; } }
        
        .flavour-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: var(--radius-md);
            border: 2px solid var(--neutral-border);
            background: white;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .flavour-pill.active { border-color: var(--brand-green); background: #EDF7F1; }
        .flavour-pill-img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; }
        .flavour-pill.oos { opacity: 0.45; pointer-events: none; }
    </style>
</head>
<body>

<div id="simpleLoader">
    <div style="width:34px;height:34px;border:2.5px solid #E5E7EB;border-top-color:#F59E0B;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto;"></div>
</div>

<div id="toastMsg" class="toast-notification"><span id="toastText"></span></div>

<div id="mainApp" style="display:none;">
    <div class="top-bar">
        <button class="back-btn" onclick="history.back()"><i class="fas fa-arrow-left"></i></button>
        <div class="top-title" id="productTitle">Product Details</div>
        <div class="top-actions">
            <button class="icon-btn" id="wishlistBtn" onclick="toggleWishlist()"><i class="far fa-heart"></i></button>
            <button class="icon-btn" onclick="shareProduct()"><i class="fas fa-share-alt"></i></button>
            <a href="cart.html" class="icon-btn"><i class="fas fa-shopping-bag"></i><span class="cart-badge" id="cartBadge">0</span></a>
        </div>
    </div>
    <div class="main-content" id="mainContent"></div>
    <div class="bottom-action-bar" id="bottomBar" style="display:none;">
        <div class="price-display" id="bottomPrice"></div>
        <button class="add-to-cart-btn" id="addToCartBtn" onclick="addToCart()"><i class="fas fa-shopping-bag"></i> <span id="addToCartText">Add to Cart</span></button>
        <button class="buy-now-btn" id="buyNowBtn" onclick="buyNow()"><i class="fas fa-bolt"></i> Buy Now</button>
    </div>
</div>

<script>
(function() {
    'use strict';
    
    var CONFIG = {
        SUPABASE_URL: 'https://zwajyovemwdqtkecipeb.supabase.co',
        SUPABASE_KEY: 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1'
    };
    
    var sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
    
    var currentProduct = null;
    var currentShop = null;
    var quantity = 1;
    var productSwiper = null;
    var isInWishlist = false;
    var productImages = [];
    var currentUser = null;
    var productId = null;
    var variants = [];
    var selectedVariantIndex = 0;
    var isHolidayToday = false;
    var holidayReason = '';
    var isShopOpen = true;
    
    try { productId = new URLSearchParams(window.location.search).get('id'); } catch(e) { productId = null; }
    
    function getEl(id) { return document.getElementById(id); }
    function safeJSON(s, f) { try { return s ? JSON.parse(s) : f; } catch(e) { return f; } }
    function esc(s) { if(!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function getFullUrl(u) { if(!u) return ''; if(u.indexOf('http')===0 || u.indexOf('data:')===0) return u; return CONFIG.SUPABASE_URL + '/storage/v1/object/public/' + u; }
    function showApp() { var l = getEl('simpleLoader'); var a = getEl('mainApp'); if(a) a.style.display = ''; if(l) { l.style.opacity = '0'; setTimeout(function() { if(l.parentNode) l.parentNode.removeChild(l); }, 300); } }
    function showToast(m, type) { var t = getEl('toastMsg'); if(!t) return; t.textContent = m; t.className = 'toast-notification'; if(type === 'error') t.classList.add('error'); else if(type === 'success') t.classList.add('success'); t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(function() { t.classList.remove('show','error','success'); }, 2500); }
    
    var CartManager = {
        getCart: function() { return safeJSON(localStorage.getItem('zymart_cart'), []); },
        saveCart: function(cart) { try { localStorage.setItem('zymart_cart', JSON.stringify(cart)); } catch(e) {} this.updateBadge(); },
        addToCart: function(product) { var cart = this.getCart(); var existing = cart.find(function(item) { return item.cartKey === product.cartKey; }); if (existing) { existing.quantity += product.quantity; } else { cart.push(product); } this.saveCart(cart); return cart; },
        getTotalItems: function() { var cart = this.getCart(); return cart.reduce(function(sum, item) { return sum + (item.quantity || 1); }, 0); },
        updateBadge: function() { var totalItems = this.getTotalItems(); var badge = getEl('cartBadge'); if (badge) { badge.textContent = totalItems; if (totalItems > 0) { badge.classList.add('show'); badge.classList.add('bounce'); setTimeout(function() { badge.classList.remove('bounce'); }, 300); } else { badge.classList.remove('show'); } } }
    };
    
    function fmtWeight(w, u) {
        if(!w) return '';
        var nw = parseFloat(w);
        if(isNaN(nw)) return String(w);
        var unitLower = u ? u.toLowerCase() : '';
        if(unitLower === 'gram' || unitLower === 'g' || unitLower === 'gm' || unitLower === 'grams') { return nw >= 1000 ? (nw/1000).toFixed(1).replace(/\.0$/,'') + ' kg' : nw + ' g'; }
        if(unitLower === 'kg' || unitLower === 'kilogram') return nw + ' kg';
        if(unitLower === 'liter' || unitLower === 'l' || unitLower === 'litre') return nw + ' L';
        if(unitLower === 'ml' || unitLower === 'milliliter') return nw + ' ml';
        if(unitLower === 'piece' || unitLower === 'pcs' || unitLower === 'pc') return nw + ' pcs';
        if(unitLower === 'pack') return nw + ' pack';
        if(unitLower === 'box') return nw + ' box';
        return nw + ' ' + (u || '');
    }
    
    function parseVariants(p) {
        var result = [];
        
        if(p.flavours && Array.isArray(p.flavours) && p.flavours.length > 0) {
            return p.flavours.map(function(f) {
                return {
                    type: 'flavour',
                    name: f.name || 'Flavour',
                    weight: f.qty || 1,
                    unit: f.qty_unit || 'pcs',
                    price: f.price || 0,
                    offer_price: f.offer_price || null,
                    stock: f.stock || 0,
                    image_url: f.image_url || null
                };
            });
        }
        
        if(p.variants && Array.isArray(p.variants) && p.variants.length > 0) {
            return p.variants.map(function(v) {
                return {
                    type: 'weight',
                    weight: v.weight || p.weight || 1,
                    unit: v.weight_unit || v.unit || p.weight_unit || p.unit || 'kg',
                    price: v.price || p.price || 0,
                    offer_price: v.offer_price || null,
                    stock: v.stock || 0,
                    image_url: v.image_url || null
                };
            });
        }
        
        return [{
            type: 'simple',
            weight: p.weight || 1,
            unit: p.weight_unit || p.unit || 'kg',
            price: p.price || 0,
            offer_price: p.offer_price || null,
            stock: p.stock || 0,
            image_url: null
        }];
    }
    
    function getSelectedVariant() { return variants[selectedVariantIndex] || variants[0] || null; }
    
    function getVariantPrice(v) {
        if(!v) return { price: 0, discountPercent: 0, savedAmount: 0, unitPrice: '' };
        var p = v.price || 0;
        var op = v.offer_price;
        var finalP = p;
        var d = 0;
        if(op && op > 0 && op < p) { finalP = op; d = Math.round((1 - op/p) * 100); }
        var up = '';
        var wt = parseFloat(v.weight);
        if(wt > 0 && v.type !== 'flavour') { up = '₹' + (finalP/wt).toFixed(2) + '/' + (v.unit || 'kg'); }
        return { price: finalP, discountPercent: d, savedAmount: p - finalP, unitPrice: up };
    }
    
    async function checkHoliday() {
        try {
            var r = await sb.from('delivery_settings').select('is_holiday, holiday_reason, holiday_date, is_open').eq('is_active', true).single();
            if(r.data) {
                if(r.data.is_holiday) { var today = new Date().toISOString().split('T')[0]; if(r.data.holiday_date === today) { isHolidayToday = true; holidayReason = r.data.holiday_reason || 'Closed Today'; } }
                if(r.data.is_open === false) { isShopOpen = false; if(!isHolidayToday) { isHolidayToday = true; holidayReason = 'Shop is currently closed'; } }
            }
        } catch(e) {}
    }
    
    window.showHolidayMsg = function() { showToast('🏖️ ' + holidayReason, 'error'); };
    
    async function checkUser() { try { var r = await sb.auth.getSession(); currentUser = (r && r.data && r.data.session) ? r.data.session.user : null; } catch(e) { currentUser = null; } return !!currentUser; }
    function goToLogin() { window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search); }
    
    function shareProduct() {
        if(!currentProduct) return;
        if(navigator.share) { navigator.share({title: currentProduct.name, text: 'Check out ' + currentProduct.name + '!', url: window.location.href}).catch(function() {}); }
        else { navigator.clipboard.writeText(window.location.href).then(function() { showToast('📋 Link copied!', 'success'); }); }
    }
    
    window.selectVariant = function(i) {
        if(i >= variants.length) return;
        var v = variants[i];
        if((v.stock || 0) <= 0) { showToast('⚠️ Out of stock', 'error'); return; }
        selectedVariantIndex = i;
        quantity = 1;
        updateVariantUI();
        updateBottomBar();
    };
    
    function updateVariantUI() {
        var pills = document.querySelectorAll('.variant-pill, .flavour-pill');
        for(var i = 0; i < pills.length; i++) { pills[i].classList.toggle('active', i === selectedVariantIndex); }
        var v = getSelectedVariant();
        if(!v) return;
        var pi = getVariantPrice(v);
        var stock = v.stock || 0;
        var isOut = stock <= 0;
        var ps = document.querySelector('.product-price-section');
        if(ps) {
            var h = '<span class="current-price">₹' + Number(pi.price).toLocaleString('en-IN') + '</span>';
            if(pi.discountPercent > 0) { h += '<span class="original-price">₹' + Number(v.price).toLocaleString('en-IN') + '</span>'; h += '<span class="discount-percent">' + pi.discountPercent + '% OFF</span>'; }
            ps.innerHTML = h;
        }
        var up = document.querySelector('.unit-price');
        if(up) up.textContent = pi.unitPrice;
        var sv = document.querySelector('.saved-text');
        if(sv) { sv.textContent = pi.savedAmount > 0 ? '💰 Save ₹' + Number(pi.savedAmount).toLocaleString('en-IN') + '!' : ''; }
        var qd = getEl('quantityDisplay');
        if(qd) qd.textContent = quantity;
        updateBottomBar();
        var ab = getEl('addToCartBtn');
        var bn = getEl('buyNowBtn');
        if(isHolidayToday || !isShopOpen) { if(ab) { ab.classList.add('disabled'); ab.innerHTML = '🔒 Closed'; } if(bn) { bn.classList.add('disabled'); bn.innerHTML = '🔒 Closed'; } }
        else if(isOut) { if(ab) { ab.classList.add('disabled'); ab.innerHTML = 'Out of Stock'; } if(bn) { bn.classList.add('disabled'); bn.innerHTML = 'Out of Stock'; } }
        else { if(ab) { ab.classList.remove('disabled'); ab.innerHTML = '<i class="fas fa-shopping-bag"></i> Add to Cart'; } if(bn) { bn.classList.remove('disabled'); bn.innerHTML = '<i class="fas fa-bolt"></i> Buy Now'; } }
    }
    
    function updateBottomBar() {
        var v = getSelectedVariant();
        if(!v) return;
        var pi = getVariantPrice(v);
        var bp = getEl('bottomPrice');
        if(bp) { var h = '<div class="current">₹' + Number(pi.price).toLocaleString('en-IN') + '</div>'; if(pi.discountPercent > 0) { h += '<div class="original">₹' + Number(v.price).toLocaleString('en-IN') + '</div>'; } bp.innerHTML = h; }
    }
    
    async function loadProduct() {
        var mc = getEl('mainContent');
        if(!productId) { mc.innerHTML = '<div class="error-container"><i class="fas fa-box-open"></i><h3>Not Found</h3><button onclick="window.location.href=\'products.html\'">Browse</button></div>'; showApp(); return; }
        try {
            var result = await sb.from('products').select('*').eq('id', productId).single();
            var p = result.data;
            if(!p) { mc.innerHTML = '<div class="error-container"><i class="fas fa-box-open"></i><h3>Not Found</h3></div>'; showApp(); return; }
            currentProduct = p;
            if(p.shop_id) { try { var sr = await sb.from('shops').select('*').eq('id', p.shop_id).single(); if(sr.data) currentShop = sr.data; } catch(e) {} }
            variants = parseVariants(p);
            selectedVariantIndex = 0;
            for(var i = 0; i < variants.length; i++) { if((variants[i].stock || 0) > 0) { selectedVariantIndex = i; break; } }
            productImages = [];
            if(p.images && Array.isArray(p.images) && p.images.length) { productImages = p.images.map(function(x) { return getFullUrl(x); }); }
            else if(p.image_url) { productImages = [getFullUrl(p.image_url)]; }
            var sv2 = getSelectedVariant();
            if(sv2 && sv2.image_url) { var vi = getFullUrl(sv2.image_url); if(vi && productImages.indexOf(vi) === -1) { productImages.unshift(vi); } }
            var wl = safeJSON(localStorage.getItem('zymart_wishlist'), []);
            isInWishlist = wl.some(function(x) { return x === productId || (typeof x === 'object' && x.id === productId); });
            updateWishlistUI();
            document.title = (p.name || 'Product') + ' - ZyMart+';
            renderProduct();
            loadRelated();
            showApp();
        } catch(e) { mc.innerHTML = '<div class="error-container"><i class="fas fa-exclamation-circle"></i><h3>Failed</h3><button onclick="loadProduct()">Retry</button></div>'; showApp(); }
    }
    
    function renderProduct() {
        var p = currentProduct;
        if(!p) return;
        getEl('productTitle').textContent = p.name || 'Product';
        var v = getSelectedVariant();
        var pi = getVariantPrice(v);
        var stock = v ? v.stock || 0 : 0;
        var isOut = stock <= 0;
        var h = '';
        
        // Image slider
        if(productImages.length > 0) {
            h += '<div class="product-slider"><div class="swiper product-swiper" id="productSwiper"><div class="swiper-wrapper">';
            h += productImages.map(function(img) { return '<div class="swiper-slide"><img src="' + img + '" alt="' + esc(p.name) + '"></div>'; }).join('');
            h += '</div></div></div>';
        }
        
        // 🔥 Offer Banner
        if(p.is_offer === true) {
            h += '<div class="offer-banner">';
            h += '<div class="offer-banner-icon">🎁</div>';
            h += '<div class="offer-banner-text">';
            h += '<div class="offer-banner-title">Special Offer!</div>';
            h += '<div class="offer-banner-sub">' + esc(p.offer_tag || 'Free gift with this product') + '</div>';
            h += '</div></div>';
        }
        
        // Product info
        h += '<div class="product-info-section">';
        if(p.brand_name) h += '<div class="product-brand">' + esc(p.brand_name) + '</div>';
        h += '<h1 class="product-name">' + esc(p.name) + '</h1>';
        if(v && v.type !== 'flavour') { h += '<div class="product-weight">' + fmtWeight(v.weight, v.unit) + '</div>'; }
        h += '<div class="product-meta"><div class="rating-badge">⭐ ' + (p.rating || '4.0') + '</div><span style="font-size:11px;color:#6B7280;">' + (p.rating_count || 0) + ' ratings</span></div>';
        
        // Flavours display
        if(variants.length > 1 && variants[0].type === 'flavour') {
            h += '<div class="variant-section"><div class="variant-label">Select Flavour:</div><div class="variant-pills">';
            for(var w = 0; w < variants.length; w++) {
                var fr = variants[w];
                var io = (fr.stock || 0) <= 0;
                var ia = w === selectedVariantIndex;
                var frImg = fr.image_url ? getFullUrl(fr.image_url) : '';
                var frName = fr.name || 'Flavour';
                var frQty = fr.weight ? fr.weight + ' ' + (fr.unit || 'pcs') : '';
                var frPrice = getVariantPrice(fr).price;
                var frDiscount = getVariantPrice(fr).discountPercent;
                
                h += '<div class="flavour-pill' + (ia ? ' active' : '') + (io ? ' oos' : '') + '" onclick="selectVariant(' + w + ')">';
                if(frImg) h += '<img src="' + frImg + '" class="flavour-pill-img" alt="">';
                h += '<div><div style="font-size:12px;font-weight:700;">' + esc(frName) + '</div>';
                if(frQty) h += '<div style="font-size:9px;color:#6B7280;">' + frQty + '</div>';
                h += '<div style="font-size:10px;color:#0B5A31;font-weight:700;">₹' + Number(frPrice).toLocaleString('en-IN') + '</div>';
                if(frDiscount > 0) h += '<div style="font-size:8px;color:#EF4444;">' + frDiscount + '% OFF</div>';
                h += '</div></div>';
            }
            h += '</div></div>';
        }
        // Weight variants display
        else if(variants.length > 1) {
            h += '<div class="variant-section"><div class="variant-label">Select Variant:</div><div class="variant-pills">';
            for(var w2 = 0; w2 < variants.length; w2++) {
                var vr = variants[w2];
                var vw2 = fmtWeight(vr.weight, vr.unit);
                var vp2 = getVariantPrice(vr).price;
                var vdp2 = getVariantPrice(vr).discountPercent;
                var io2 = (vr.stock || 0) <= 0;
                var ia2 = w2 === selectedVariantIndex;
                h += '<div class="variant-pill' + (ia2 ? ' active' : '') + (io2 ? ' oos' : '') + '" onclick="selectVariant(' + w2 + ')">';
                h += '<span style="font-size:12px;font-weight:700;">' + vw2 + '</span><br>';
                h += '<span style="font-size:10px;">₹' + Number(vp2).toLocaleString('en-IN') + '</span>';
                if(vdp2 > 0) h += '<br><span style="font-size:8px;color:#059669;">' + vdp2 + '% OFF</span>';
                h += '</div>';
            }
            h += '</div></div>';
        }
        
        // Price
        h += '<div class="product-price-section"><span class="current-price">₹' + Number(pi.price).toLocaleString('en-IN') + '</span>';
        if(pi.discountPercent > 0) { h += '<span class="original-price">₹' + Number(v.price).toLocaleString('en-IN') + '</span><span class="discount-percent">' + pi.discountPercent + '% OFF</span>'; }
        h += '</div>';
        if(pi.unitPrice) h += '<div class="unit-price">' + pi.unitPrice + '</div>';
        if(pi.savedAmount > 0) h += '<div class="saved-text">💰 Save ₹' + Number(pi.savedAmount).toLocaleString('en-IN') + '!</div>';
        
        // Quantity
        if(!isOut && !isHolidayToday && isShopOpen) {
            h += '<div class="quantity-section"><span style="font-size:13px;font-weight:700;">Quantity</span><div class="quantity-control"><button class="quantity-btn" onclick="changeQuantity(-1)">−</button><span class="quantity-value" id="quantityDisplay">' + quantity + '</span><button class="quantity-btn" onclick="changeQuantity(1)">+</button></div></div>';
        } else if(isHolidayToday || !isShopOpen) {
            h += '<div style="padding:14px;text-align:center;background:#FEE2E2;border-radius:10px;color:#DC2626;font-weight:700;">🏖️ ' + holidayReason + '</div>';
        } else {
            h += '<div style="padding:14px;text-align:center;color:#EF4444;font-weight:700;">Out of Stock</div>';
        }
        h += '</div>';
        
        // Shop info
        if(currentShop) {
            h += '<div class="shop-info-section"><div class="shop-header"><div class="shop-img">';
            if(currentShop.shop_image) { h += '<img src="' + getFullUrl(currentShop.shop_image) + '" alt="Shop">'; }
            else { h += '<i class="fas fa-store" style="color:var(--brand-green);"></i>'; }
            h += '</div><div style="flex:1;"><div style="font-size:14px;font-weight:700;">' + esc(currentShop.shop_name || currentShop.name || 'Shop') + '</div><div style="font-size:10px;color:#6B7280;">📍 ' + esc(currentShop.city || '') + '</div></div></div></div>';
        }
        
        // Description
        h += '<div class="description-section"><div class="section-title">📝 Description</div><p style="font-size:13px;color:#6B7280;">' + esc(p.description || 'No description') + '</p></div>';
        
        // Attributes
        h += '<div class="attributes-section"><div class="section-title">📋 Details</div><div class="attribute-cards">';
        h += '<div class="attribute-card"><div style="font-size:10px;color:#6B7280;">Brand</div><div style="font-size:13px;font-weight:600;">' + esc(p.brand_name || 'N/A') + '</div></div>';
        if(v && v.type === 'flavour') {
            h += '<div class="attribute-card"><div style="font-size:10px;color:#6B7280;">Flavours</div><div style="font-size:13px;font-weight:600;">' + variants.length + ' available</div></div>';
        } else {
            h += '<div class="attribute-card"><div style="font-size:10px;color:#6B7280;">Weight</div><div style="font-size:13px;font-weight:600;">' + fmtWeight(v ? v.weight : 0, v ? v.unit : '') + '</div></div>';
        }
        if(p.is_offer === true) {
            h += '<div class="attribute-card"><div style="font-size:10px;color:#6B7280;">Offer</div><div style="font-size:13px;font-weight:600;color:#EF4444;">🎁 ' + esc(p.offer_tag || 'Yes') + '</div></div>';
        }
        h += '<div class="attribute-card"><div style="font-size:10px;color:#6B7280;">Stock</div><div style="font-size:13px;font-weight:600;">' + (stock > 0 ? stock + ' units' : 'Out') + '</div></div>';
        h += '</div></div>';
        
        // Related
        h += '<div class="related-section"><div class="related-header"><div class="section-title">🛍️ Related</div></div><div id="relatedContainer" class="products-grid"></div></div>';
        
        getEl('mainContent').innerHTML = h;
        getEl('bottomBar').style.display = 'flex';
        updateBottomBar();
        
        var ab = getEl('addToCartBtn');
        var bn = getEl('buyNowBtn');
        if(isHolidayToday || !isShopOpen) { ab.classList.add('disabled'); ab.innerHTML = '🔒 Closed'; bn.classList.add('disabled'); bn.innerHTML = '🔒 Closed'; }
        else if(isOut) { ab.classList.add('disabled'); ab.innerHTML = 'Out of Stock'; bn.classList.add('disabled'); bn.innerHTML = 'Out of Stock'; }
        
        setTimeout(function() { if(productSwiper) { try { productSwiper.destroy(); } catch(e) {} } if(productImages.length > 0) { productSwiper = new Swiper('#productSwiper', { loop: productImages.length > 1 }); } }, 200);
    }
    
    async function loadRelated() {
        var c = getEl('relatedContainer');
        if(!c || !currentProduct) return;
        try {
            var r = await sb.from('products').select('*').eq('is_active', true).eq('is_on_hold', false).neq('id', productId).limit(6);
            if(r.data && r.data.length) {
                c.innerHTML = r.data.map(function(p) {
                    var img = getFullUrl((p.images && p.images[0]) || p.image_url || '');
                    var bv = parseVariants(p)[0];
                    var pi = getVariantPrice(bv);
                    return '<div class="mini-product-card" onclick="window.location.href=\'product-detail.html?id=' + p.id + '\'"><div class="mini-product-img">' + (img ? '<img src="' + img + '" loading="lazy">' : '<i class="fas fa-box" style="color:#D1D5DB;"></i>') + '</div><div class="mini-product-info"><div class="mini-product-name">' + esc(p.name) + '</div><div class="mini-product-price">₹' + Number(pi.price).toLocaleString('en-IN') + '</div></div></div>';
                }).join('');
            } else { c.innerHTML = '<div style="grid-column:1/-1;text-align:center;font-size:11px;color:#6B7280;padding:10px;">No related products</div>'; }
        } catch(e) {}
    }
    
    window.changeQuantity = function(d) {
        var v = getSelectedVariant();
        if(!v) return;
        var s = v.stock || 0;
        var nq = quantity + d;
        if(nq >= 1 && nq <= s) { quantity = nq; var qd = getEl('quantityDisplay'); if(qd) qd.textContent = quantity; }
        else if(nq > s) { showToast('⚠️ Only ' + s + ' available', 'error'); }
    };
    
    window.addToCart = function() {
        if(isHolidayToday || !isShopOpen) { showHolidayMsg(); return; }
        if(!currentProduct) return;
        var v = getSelectedVariant();
        if(!v) return;
        var s = v.stock || 0;
        if(s <= 0) { showToast('⚠️ Out of stock', 'error'); return; }
        var cartKey = currentProduct.id + '_' + (v.name || v.weight || 0) + '_' + (v.unit || '');
        var img = (v.image_url ? getFullUrl(v.image_url) : '') || productImages[0] || '';
        var pi = getVariantPrice(v);
        var displayName = currentProduct.name;
        if(v.type === 'flavour' && v.name) { displayName += ' - ' + v.name; }
        else if(variants.length > 1) { displayName += ' - ' + fmtWeight(v.weight, v.unit); }
        CartManager.addToCart({ id: currentProduct.id, cartKey: cartKey, name: displayName, price: pi.price, image: img, quantity: quantity, stock: s, variantWeight: v.weight, variantUnit: v.unit, shop_id: currentProduct.shop_id, brand_name: currentProduct.brand_name || '' });
        showToast('🛒 ' + displayName + ' added!', 'success');
    };
    
    window.buyNow = async function() {
        if(isHolidayToday || !isShopOpen) { showHolidayMsg(); return; }
        window.addToCart();
        await checkUser();
        if(!currentUser) { showToast('🔐 Please login', 'error'); goToLogin(); return; }
        window.location.href = 'checkout.html';
    };
    
    function toggleWishlist() {
        if(!currentProduct) return;
        var wl = safeJSON(localStorage.getItem('zymart_wishlist'), []);
        var idx = wl.findIndex(function(x) { return x === productId || (typeof x === 'object' && x.id === productId); });
        if(idx !== -1) { wl.splice(idx, 1); isInWishlist = false; showToast('💔 Removed from wishlist'); }
        else { wl.push({id: currentProduct.id, name: currentProduct.name, price: getVariantPrice(getSelectedVariant()).price, image: productImages[0] || ''}); isInWishlist = true; showToast('❤️ Added to wishlist!', 'success'); }
        try { localStorage.setItem('zymart_wishlist', JSON.stringify(wl)); } catch(e) {}
        updateWishlistUI();
    }
    
    function updateWishlistUI() { var b = getEl('wishlistBtn'); var i = b ? b.querySelector('i') : null; if(i) { i.className = isInWishlist ? 'fas fa-heart' : 'far fa-heart'; } }
    
    document.addEventListener('DOMContentLoaded', async function() {
        await checkHoliday();
        await checkUser();
        CartManager.updateBadge();
        if(productId) { loadProduct(); } else { getEl('mainContent').innerHTML = '<div class="error-container"><i class="fas fa-box-open"></i><h3>Not Found</h3><button onclick="window.location.href=\'products.html\'">Browse</button></div>'; showApp(); }
    });
    
    window.addEventListener('storage', function(e) { if(e.key === 'zymart_cart') { CartManager.updateBadge(); } });
    
    window.selectVariant = selectVariant;
    window.changeQuantity = changeQuantity;
    window.addToCart = addToCart;
    window.buyNow = buyNow;
    window.toggleWishlist = toggleWishlist;
    window.showHolidayMsg = showHolidayMsg;
    window.shareProduct = shareProduct;
    window.CartManager = CartManager;
    
})();
</script>
</body>
</html>
