<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Product Details - Zatpat</title>
    <meta name="theme-color" content="#16A34A">
    
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css">
    
    <style>
        :root {
            --primary: #16A34A;
            --primary-light: #22C55E;
            --primary-bg-light: #DCFCE7;
            --primary-border-dark: #15803D;
            --accent-orange: #F97316;
            --bg-white: #FFFFFF;
            --bg-light: #F9FAFB;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --border-light: #E5E7EB;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-full: 9999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
            overflow-x: hidden;
            padding-bottom: 90px;
            -webkit-font-smoothing: antialiased;
        }

        #pageProgress {
            position: fixed; top: 0; left: 0; width: 0%; height: 3px;
            background: var(--primary); z-index: 10001; transition: width 0.3s ease;
        }
        #pageProgress.loading { width: 90%; }
        #pageProgress.complete { width: 100%; opacity: 0; transition: opacity 0.3s; }

        .top-bar {
            background: var(--bg-white); position: fixed; top: 0; left: 0; width: 100%;
            z-index: 1000; padding: 8px 12px; box-shadow: var(--shadow-sm);
            border-bottom: 1px solid var(--border-light); display: flex; align-items: center; gap: 12px;
        }
        .back-btn {
            width: 40px; height: 40px; background: var(--bg-light); border-radius: var(--radius-full);
            display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
        }
        .back-btn i { font-size: 18px; color: var(--text-primary); }
        .top-title {
            flex: 1; font-size: 17px; font-weight: 800; color: #000000;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .top-actions { display: flex; align-items: center; gap: 8px; }
        .icon-btn {
            width: 40px; height: 40px; background: var(--bg-light); border-radius: var(--radius-full);
            display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative;
        }
        .icon-btn i { font-size: 18px; color: var(--text-secondary); }
        .cart-badge {
            position: absolute; top: -2px; right: -2px; background: var(--primary); color: white;
            border-radius: 50%; width: 18px; height: 18px; font-size: 9px; display: flex;
            align-items: center; justify-content: center; border: 2px solid white; font-weight: 700;
        }

        .main-content { padding-top: 56px; }

        .product-slider { position: relative; background: var(--bg-light); width: 100%; }
        .swiper.product-swiper { width: 100%; height: 320px; }
        .product-swiper .swiper-slide { display: flex; align-items: center; justify-content: center; background: var(--bg-light); }
        .product-swiper .swiper-slide img { width: 100%; height: 100%; object-fit: contain; background: var(--bg-light); }
        
        .fullscreen-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 9999; display: none;
        }
        .fullscreen-modal.active { display: block; }
        .fullscreen-swiper { width: 100%; height: 100%; }
        .fullscreen-swiper .swiper-slide { display: flex; align-items: center; justify-content: center; background: black; }
        .fullscreen-swiper .swiper-slide img { width: 100%; height: 100%; object-fit: contain; }
        .close-fullscreen {
            position: fixed; top: 16px; right: 16px; z-index: 10000;
            width: 44px; height: 44px; background: rgba(0,0,0,0.6); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            color: white; font-size: 24px; backdrop-filter: blur(4px);
        }
        .fullscreen-pagination {
            position: fixed; bottom: 20px; left: 0; right: 0; z-index: 10000;
            display: flex; justify-content: center; gap: 6px;
        }
        .fullscreen-pagination .swiper-pagination-bullet {
            width: 8px; height: 8px; background: rgba(255,255,255,0.5); opacity: 1;
        }
        .fullscreen-pagination .swiper-pagination-bullet-active {
            background: var(--primary); width: 24px; border-radius: 4px;
        }
        
        .slider-pagination {
            position: absolute; bottom: 12px; left: 0; right: 0; display: flex;
            justify-content: center; gap: 6px; z-index: 10;
        }
        .slider-pagination .swiper-pagination-bullet {
            width: 6px; height: 6px; background: rgba(0,0,0,0.3); opacity: 1;
        }
        .slider-pagination .swiper-pagination-bullet-active {
            background: var(--primary); width: 20px; border-radius: 4px;
        }

        .product-info-section {
            background: var(--bg-white); padding: 16px; border-bottom: 8px solid var(--bg-light);
        }
        .product-name { font-size: 20px; font-weight: 800; color: #000000; margin-bottom: 8px; line-height: 1.3; }
        .product-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .product-rating {
            display: flex; align-items: center; gap: 4px; background: var(--primary); color: white;
            padding: 4px 8px; border-radius: var(--radius-full); font-size: 12px; font-weight: 600;
        }
        .product-rating i { font-size: 10px; }
        .product-sold { font-size: 12px; color: var(--text-secondary); }
        
        .product-price-section { display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .current-price { font-size: 28px; font-weight: 800; color: #000000; }
        .original-price { font-size: 16px; color: var(--text-secondary); text-decoration: line-through; }
        .discount-badge {
            background: var(--accent-orange); color: white; padding: 4px 10px;
            border-radius: var(--radius-full); font-size: 12px; font-weight: 700; margin-left: auto;
        }
        .offer-info {
            background: var(--primary-bg-light); padding: 8px 12px; border-radius: var(--radius-full);
            font-size: 12px; color: var(--primary); display: inline-flex; align-items: center; gap: 6px;
            border: 1px solid var(--primary-border-dark);
        }
        .offer-info i { color: var(--primary); }

        .quantity-section {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 0; border-top: 1px solid var(--border-light);
            border-bottom: 1px solid var(--border-light); margin-bottom: 16px;
        }
        .quantity-label { font-size: 15px; font-weight: 700; color: #000000; }
        .quantity-control {
            display: flex; align-items: center; gap: 16px; background: var(--bg-light);
            border-radius: var(--radius-full); padding: 4px;
        }
        .quantity-btn {
            width: 36px; height: 36px; border-radius: 50%; background: white;
            border: 1px solid var(--border-light); display: flex; align-items: center;
            justify-content: center; cursor: pointer; font-size: 18px; font-weight: 600;
            color: var(--primary); transition: all 0.2s;
        }
        .quantity-btn:active { background: var(--primary-bg-light); }
        .quantity-btn.disabled { opacity: 0.4; cursor: not-allowed; }
        .quantity-value { font-size: 18px; font-weight: 700; min-width: 30px; text-align: center; color: #000000; }

        .shop-info-section {
            background: var(--bg-white); padding: 16px; border-bottom: 8px solid var(--bg-light);
        }
        .shop-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .shop-img {
            width: 50px; height: 50px; border-radius: var(--radius-md); background: var(--primary-bg-light);
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .shop-img img { width: 100%; height: 100%; object-fit: cover; }
        .shop-img i { font-size: 24px; color: var(--primary); }
        .shop-details { flex: 1; }
        .shop-name { font-size: 16px; font-weight: 700; color: #000000; margin-bottom: 4px; }
        .shop-meta { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--text-secondary); }
        .shop-meta i { color: var(--primary); margin-right: 3px; }
        .view-shop-btn {
            background: var(--primary-bg-light); color: var(--primary); border: 1px solid var(--primary);
            border-radius: var(--radius-full); padding: 8px 16px; font-size: 12px; font-weight: 600; cursor: pointer;
        }

        .description-section {
            background: var(--bg-white); padding: 16px; border-bottom: 8px solid var(--bg-light);
        }
        .section-title {
            font-size: 16px; font-weight: 800; color: #000000; margin-bottom: 12px;
            display: flex; align-items: center; gap: 6px;
        }
        .section-title i { color: var(--primary); }
        .description-text { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }

        .related-section { background: var(--bg-white); padding: 16px 0; }
        .related-header {
            padding: 0 16px 12px 16px; display: flex; justify-content: space-between; align-items: center;
        }
        .related-header h3 { font-size: 16px; font-weight: 800; color: #000000; display: flex; align-items: center; gap: 6px; }
        .related-header h3 i { color: var(--primary); }
        .view-all { color: var(--primary); font-size: 12px; font-weight: 700; cursor: pointer; }
        
        .products-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 12px;
        }
        .product-card {
            display: flex; flex-direction: column; width: 100%; background: white;
            border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light); cursor: pointer;
        }
        .product-card .product-img { width: 100%; aspect-ratio: 1/1; position: relative; overflow: hidden; background: var(--bg-light); }
        .product-card .product-img img { width: 100%; height: 100%; object-fit: cover; }
        .product-card .product-info { padding: 8px; }
        .product-card .product-name {
            font-size: 11px; font-weight: 700; color: #000000; margin-bottom: 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .product-card .product-price { font-size: 13px; font-weight: 800; color: #000000; }

        .bottom-action-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; background: white;
            padding: 12px 16px; box-shadow: 0 -4px 20px rgba(0,0,0,0.08); z-index: 1000;
            display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--border-light);
        }
        .add-to-cart-btn {
            flex: 1; background: var(--primary); color: white; border: none; padding: 14px;
            border-radius: var(--radius-full); font-size: 16px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .add-to-cart-btn:active { background: var(--primary-light); }
        .buy-now-btn {
            flex: 1; background: var(--accent-orange); color: white; border: none; padding: 14px;
            border-radius: var(--radius-full); font-size: 16px; font-weight: 700; cursor: pointer;
        }
        .buy-now-btn:active { background: #EA580C; }

        .toast-notification {
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
            background: var(--text-primary); color: white; padding: 12px 24px;
            border-radius: var(--radius-full); font-size: 13px; font-weight: 500;
            z-index: 10050; display: none; white-space: nowrap; box-shadow: var(--shadow-md);
        }
        .toast-notification.show { display: flex; }

        .loading-container { display: flex; align-items: center; justify-content: center; padding: 60px; }
        .loading-spinner {
            width: 40px; height: 40px; border: 3px solid var(--border-light);
            border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="pageProgress"></div>
<div id="toastMsg" class="toast-notification"><span id="toastText"></span></div>

<div id="fullscreenModal" class="fullscreen-modal">
    <div class="close-fullscreen" onclick="closeFullscreen()"><i class="fas fa-times"></i></div>
    <div class="swiper fullscreen-swiper" id="fullscreenSwiper"><div class="swiper-wrapper" id="fullscreenWrapper"></div></div>
    <div class="fullscreen-pagination"><div class="swiper-pagination"></div></div>
</div>

<div id="mainApp">
    <div class="top-bar">
        <div class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
        <div class="top-title" id="productTitle">Loading...</div>
        <div class="top-actions">
            <div class="icon-btn" onclick="toggleWishlist()" id="wishlistBtn"><i class="far fa-heart"></i></div>
            <div class="icon-btn" onclick="fastNavigate('cart.html')"><i class="fas fa-shopping-bag"></i><span class="cart-badge" id="cartBadge">0</span></div>
        </div>
    </div>

    <div class="main-content" id="mainContent"><div class="loading-container"><div class="loading-spinner"></div></div></div>

    <div class="bottom-action-bar" id="bottomBar" style="display: none;">
        <button class="add-to-cart-btn" id="addToCartBtn" onclick="addToCart()"><i class="fas fa-shopping-bag"></i> Add to Cart</button>
        <button class="buy-now-btn" onclick="buyNow()">Buy Now</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>

<script>
    window.addEventListener('error', function(e) { console.error('Global error:', e.error); return false; });

    const supabaseUrl = 'https://zwajyovemwdqtkecipeb.supabase.co';
    const supabaseKey = 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1';
    const zatpatDB = supabase.createClient(supabaseUrl, supabaseKey);

    let currentProduct = null, currentShop = null, quantity = 1, productSwiper = null, fullscreenSwiper = null;
    let isInWishlist = false, productImages = [], allOffers = [], currentOffer = null, offerPrice = 0;

    const urlParams = new URLSearchParams(window.location.search), productId = urlParams.get('id');

    function startProgress() { const b = document.getElementById('pageProgress'); if(b) { b.style.width = '0%'; b.classList.add('loading'); setTimeout(() => b.style.width = '90%', 10); } }
    function completeProgress() { const b = document.getElementById('pageProgress'); if(b) { b.classList.remove('loading'); b.classList.add('complete'); setTimeout(() => { b.style.width = '0%'; b.classList.remove('complete'); }, 300); } }
    window.fastNavigate = function(url) { startProgress(); setTimeout(() => window.location.href = url, 50); };
    function goBack() { window.history.back(); }

    function showToast(msg, isError = false) {
        const t = document.getElementById('toastMsg'), s = document.getElementById('toastText');
        if(!t || !s) return; s.innerHTML = msg; t.style.background = isError ? '#EF4444' : '#111827';
        t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000);
    }

    function updateCartBadge() {
        try { const cart = JSON.parse(localStorage.getItem('zatpat_cart')) || []; document.getElementById('cartBadge').innerText = cart.reduce((s, i) => s + (i.quantity || 1), 0); } catch(e) {}
    }

    // ========== OFFER SYSTEM ==========
    async function loadActiveOffers() {
        try { const { data } = await zatpatDB.from('offers').select('*').eq('is_active', true); allOffers = data || []; } catch(e) { allOffers = []; }
    }

    function getBestOffer(product) {
        const now = new Date();
        const applicable = allOffers.filter(o => {
            if (o.valid_from && new Date(o.valid_from) > now) return false;
            if (o.valid_till && new Date(o.valid_till) < now) return false;
            if (o.apply_to === 'global') return true;
            if (o.apply_to === 'category' && o.target_id === product.category_id) return true;
            if (o.apply_to === 'product' && o.target_id === product.id) return true;
            if (o.apply_to === 'shop' && o.target_id === product.shop_id) return true;
            return false;
        });
        if (!applicable.length) return null;
        return applicable.sort((a, b) => { const aVal = a.discount_type === 'percentage' ? a.discount_value : (a.discount_value / product.price) * 100; const bVal = b.discount_type === 'percentage' ? b.discount_value : (b.discount_value / product.price) * 100; return bVal - aVal; })[0];
    }

    function calculateOfferPrice(product, offer) {
        if (!offer) return product.price;
        let discount = offer.discount_type === 'percentage' ? (product.price * offer.discount_value) / 100 : offer.discount_value;
        if (offer.max_discount > 0 && offer.discount_type === 'percentage') discount = Math.min(discount, offer.max_discount);
        return Math.max(product.price - discount, 0);
    }

    // ========== FULLSCREEN ==========
    function openFullscreen() {
        const modal = document.getElementById('fullscreenModal'), wrapper = document.getElementById('fullscreenWrapper');
        if(!modal || !wrapper) return;
        wrapper.innerHTML = productImages.map(img => '<div class="swiper-slide"><img src="' + img + '" loading="lazy"></div>').join('');
        modal.classList.add('active'); document.body.style.overflow = 'hidden';
        setTimeout(() => { if (fullscreenSwiper) fullscreenSwiper.destroy(); fullscreenSwiper = new Swiper('#fullscreenSwiper', { loop: productImages.length > 1, pagination: { el: '.fullscreen-pagination .swiper-pagination', clickable: true } }); }, 100);
    }
    window.closeFullscreen = function() { document.getElementById('fullscreenModal').classList.remove('active'); document.body.style.overflow = ''; };

    // ========== LOAD PRODUCT ==========
    async function loadProduct() {
        if (!productId) { showToast('Product not found', true); setTimeout(() => goBack(), 1500); return; }
        try {
            await loadActiveOffers();
            const { data: product, error } = await zatpatDB.from('products').select('*, shops(*)').eq('id', productId).single();
            if (error) throw error; if (!product) { showToast('Product not found', true); setTimeout(() => goBack(), 1500); return; }
            currentProduct = product; currentShop = product.shops;
            productImages = product.images?.length ? product.images : product.image_url ? [product.image_url] : ['https://placehold.co/400/F0FDF4/16A34A?text=Product'];
            currentOffer = getBestOffer(product); offerPrice = calculateOfferPrice(product, currentOffer);
            
            const wishlist = JSON.parse(localStorage.getItem('zatpat_wishlist')) || []; isInWishlist = wishlist.includes(productId); updateWishlistIcon();
            renderProduct(); loadRelatedProducts();
        } catch (e) { console.error('Load error:', e); showToast('Failed to load product', true); }
    }

    function renderProduct() {
        const p = currentProduct; if(!p) return;
        const discount = offerPrice < p.price ? Math.round((1 - offerPrice / p.price) * 100) : 0;
        document.getElementById('productTitle').innerText = p.name || 'Product';

        const html = `
            <div class="product-slider"><div class="swiper product-swiper" id="productSwiper"><div class="swiper-wrapper">${productImages.map(img => '<div class="swiper-slide" onclick="openFullscreen()"><img src="' + img + '" loading="lazy"></div>').join('')}</div></div><div class="slider-pagination"><div class="swiper-pagination"></div></div></div>
            <div class="product-info-section">
                <h1 class="product-name">${p.name}</h1>
                <div class="product-meta"><div class="product-rating"><i class="fas fa-star"></i> ${p.rating || 4.0}</div><span class="product-sold">${p.total_sold || 0}+ sold</span></div>
                <div class="product-price-section">
                    <span class="current-price">₹${offerPrice}</span>
                    ${discount > 0 ? '<span class="original-price">₹' + p.price + '</span>' : ''}
                    ${discount > 0 ? '<span class="discount-badge">' + discount + '% OFF</span>' : ''}
                </div>
                ${currentOffer ? '<div class="offer-info"><i class="fas fa-tag"></i> ' + currentOffer.title + ' Applied!</div>' : ''}
                <div class="quantity-section">
                    <span class="quantity-label">Quantity</span>
                    <div class="quantity-control">
                        <button class="quantity-btn ${quantity <= 1 ? 'disabled' : ''}" onclick="changeQuantity(-1)">−</button>
                        <span class="quantity-value" id="quantityDisplay">${quantity}</span>
                        <button class="quantity-btn" onclick="changeQuantity(1)">+</button>
                    </div>
                </div>
            </div>
            ${currentShop ? '<div class="shop-info-section"><div class="shop-header"><div class="shop-img">' + (currentShop.image_url ? '<img src="' + currentShop.image_url + '">' : '<i class="fas fa-store"></i>') + '</div><div class="shop-details"><div class="shop-name">' + currentShop.name + '</div><div class="shop-meta"><span><i class="fas fa-star"></i> ' + (currentShop.rating || 4.0) + '</span><span><i class="fas fa-map-pin"></i> ' + (currentShop.area || 'Sillod') + '</span></div></div><button class="view-shop-btn" onclick="fastNavigate(\'shop-details.html?id=' + currentShop.id + '\')">View Shop</button></div></div>' : ''}
            <div class="description-section"><h3 class="section-title"><i class="fas fa-align-left"></i> Product Description</h3><div class="description-text">${p.description || 'No description available.'}</div></div>
            <div class="related-section"><div class="related-header"><h3><i class="fas fa-link"></i> You May Also Like</h3><span class="view-all" onclick="fastNavigate('products.html')">View All →</span></div><div id="relatedContainer" class="products-grid"></div></div>
        `;
        document.getElementById('mainContent').innerHTML = html;
        document.getElementById('bottomBar').style.display = 'flex';
        setTimeout(() => { if (productSwiper) productSwiper.destroy(); productSwiper = new Swiper('#productSwiper', { loop: productImages.length > 1, pagination: { el: '.slider-pagination .swiper-pagination', clickable: true } }); }, 100);
    }

    async function loadRelatedProducts() {
        const container = document.getElementById('relatedContainer'); if(!container) return;
        try {
            const { data } = await zatpatDB.from('products').select('*').eq('is_active', true).neq('id', productId).limit(6);
            if (data?.length) {
                container.innerHTML = data.map(p => {
                    const img = p.images?.[0] || p.image_url || 'https://placehold.co/200/F0FDF4/16A34A?text=Product';
                    const offer = getBestOffer(p); const oPrice = calculateOfferPrice(p, offer);
                    return '<div class="product-card" onclick="fastNavigate(\'product-detail.html?id=' + p.id + '\')"><div class="product-img"><img src="' + img + '" loading="lazy"></div><div class="product-info"><div class="product-name">' + p.name + '</div><div class="product-price">₹' + oPrice + '</div></div></div>';
                }).join('');
            } else { container.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:20px;">No related products</p>'; }
        } catch (e) {}
    }

    window.changeQuantity = function(delta) {
        const newQty = quantity + delta; if (newQty >= 1 && newQty <= 10) { quantity = newQty; document.getElementById('quantityDisplay').innerText = quantity; document.querySelectorAll('.quantity-btn')[0]?.classList.toggle('disabled', quantity <= 1); }
    };

    window.addToCart = function() {
        if (!currentProduct) return;
        try {
            let cart = JSON.parse(localStorage.getItem('zatpat_cart')) || [];
            const existing = cart.find(i => i.id === currentProduct.id);
            const img = productImages[0] || 'https://placehold.co/200/F0FDF4/16A34A?text=Product';
            if (existing) existing.quantity += quantity;
            else cart.push({ id: currentProduct.id, name: currentProduct.name, price: offerPrice, originalPrice: currentProduct.price, image: img, quantity });
            localStorage.setItem('zatpat_cart', JSON.stringify(cart)); updateCartBadge();
            showToast('🛒 ' + quantity + ' ' + currentProduct.name + ' added'); if (navigator.vibrate) navigator.vibrate(10);
        } catch(e) { showToast('Failed to add', true); }
    };

    window.buyNow = function() { addToCart(); fastNavigate('checkout.html'); };

    function toggleWishlist() {
        if (!currentProduct) return;
        let wishlist = JSON.parse(localStorage.getItem('zatpat_wishlist')) || [];
        isInWishlist ? wishlist = wishlist.filter(id => id !== productId) : wishlist.push(productId);
        localStorage.setItem('zatpat_wishlist', JSON.stringify(wishlist)); isInWishlist = !isInWishlist; updateWishlistIcon();
        showToast(isInWishlist ? '❤️ Added to wishlist' : 'Removed from wishlist'); if (navigator.vibrate) navigator.vibrate(10);
    }

    function updateWishlistIcon() { const icon = document.querySelector('#wishlistBtn i'); if (icon) { icon.className = isInWishlist ? 'fas fa-heart' : 'far fa-heart'; icon.style.color = isInWishlist ? '#EF4444' : 'var(--text-secondary)'; } }

    window.toggleWishlist = toggleWishlist; window.openFullscreen = openFullscreen;

    document.addEventListener('DOMContentLoaded', () => { updateCartBadge(); productId ? loadProduct() : document.getElementById('mainContent').innerHTML = '<div style="text-align:center;padding:60px;"><i class="fas fa-box-open"></i><h3>Product Not Found</h3></div>'; });
    window.goBack = goBack; window.addToCart = addToCart; window.buyNow = buyNow;
</script>
</body>
</html>
