    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">

    <style>
        :root{--brand-green:#0B5A31;--brand-green-dark:#083D21;--brand-orange:#F59E0B;--neutral-white:#FFFFFF;--neutral-bg:#F9FAFB;--neutral-border:#E5E7EB;--neutral-gray:#6B7280;--neutral-dark:#1A1A1A;--danger:#EF4444;--radius-sm:10px;--radius-md:14px;--radius-full:9999px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',-apple-system,sans-serif;background:var(--neutral-bg);color:var(--neutral-dark);overflow-x:hidden;padding-bottom:95px;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;min-height:100vh}
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
        
        .top-bar{background:var(--brand-green);position:fixed;top:0;left:0;width:100%;z-index:1000;padding:8px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 16px rgba(11,90,49,0.3)}
        .back-btn{width:40px;height:40px;min-width:40px;background:rgba(255,255,255,0.10);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:white;font-size:15px}
        .top-title{flex:1;font-size:14px;font-weight:600;color:white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .top-actions{display:flex;align-items:center;gap:6px}
        .icon-btn{width:38px;height:38px;min-width:38px;background:rgba(255,255,255,0.10);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:white;font-size:14px;position:relative}
        .cart-badge{position:absolute;top:-4px;right:-4px;background:var(--brand-orange);color:white;border-radius:50%;width:18px;height:18px;font-size:9px;display:flex;align-items:center;justify-content:center;border:2px solid var(--brand-green);font-weight:700}
        
        .main-content{padding-top:56px}
        .product-slider{position:relative;background:var(--neutral-white);width:100%}
        .swiper.product-swiper{width:100%;height:300px}
        .product-swiper .swiper-slide{display:flex;align-items:center;justify-content:center;background:var(--neutral-white)}
        .product-swiper .swiper-slide img{width:100%;height:100%;object-fit:contain}
        
        .product-info-section{background:var(--neutral-white);padding:14px;border-bottom:8px solid var(--neutral-bg)}
        .product-brand{font-size:11px;color:var(--brand-green);font-weight:700;text-transform:uppercase;margin-bottom:4px}
        .product-name{font-family:'Poppins',sans-serif;font-size:19px;font-weight:700;margin-bottom:4px;line-height:1.3}
        .product-weight{font-size:12px;color:var(--neutral-gray);margin-bottom:8px}
        .product-meta{display:flex;align-items:center;gap:10px;margin-bottom:10px}
        .rating-badge{display:flex;align-items:center;gap:4px;background:var(--brand-green);color:white;padding:4px 8px;border-radius:var(--radius-sm);font-size:12px;font-weight:700}
        
        .variant-section{margin:10px 0;background:#F9FAFB;border-radius:var(--radius-md);padding:10px;border:1px solid var(--neutral-border)}
        .variant-label{font-size:13px;font-weight:700;margin-bottom:8px}
        .variant-pills{display:flex;gap:8px;flex-wrap:wrap}
        .variant-pill{padding:8px 10px;border-radius:var(--radius-md);border:2px solid var(--neutral-border);background:white;cursor:pointer;font-size:11px;font-weight:600;text-align:center;min-width:70px}
        .variant-pill.active{border-color:var(--brand-green);background:#EDF7F1;color:var(--brand-green);font-weight:700}
        .variant-pill.oos{opacity:0.45;pointer-events:none}
        
        .product-price-section{display:flex;align-items:baseline;gap:6px;margin-bottom:4px;flex-wrap:wrap}
        .current-price{font-family:'Poppins',sans-serif;font-size:28px;font-weight:700;color:var(--brand-green-dark)}
        .original-price{font-size:14px;color:var(--neutral-gray);text-decoration:line-through}
        .discount-percent{background:var(--brand-orange);color:white;padding:2px 7px;border-radius:var(--radius-sm);font-size:10px;font-weight:700}
        .unit-price{font-size:11px;color:var(--neutral-gray);margin-bottom:4px}
        .saved-text{font-size:11px;color:#059669;font-weight:600;margin-bottom:3px}
        
        .quantity-section{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--neutral-border);border-bottom:1px solid var(--neutral-border);margin-bottom:6px}
        .quantity-control{display:flex;align-items:center;gap:12px;background:#F3F5F4;border-radius:var(--radius-full);padding:3px 5px}
        .quantity-btn{width:30px;height:30px;border-radius:50%;background:white;border:1.5px solid var(--neutral-border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;font-weight:700;color:var(--brand-green)}
        .quantity-value{font-size:16px;font-weight:700;min-width:24px;text-align:center}
        
        .brand-section{background:var(--neutral-white);padding:12px 14px;border-bottom:8px solid var(--neutral-bg);display:flex;align-items:center;justify-content:space-between;cursor:pointer}
        .brand-logo{width:40px;height:40px;border-radius:50%;background:#EDF7F1;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:var(--brand-green)}
        .shop-info-section{background:var(--neutral-white);padding:12px 14px;border-bottom:8px solid var(--neutral-bg)}
        .shop-header{display:flex;align-items:center;gap:10px}
        .shop-img{width:44px;height:44px;border-radius:var(--radius-sm);background:#EDF7F1;display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid #C8E6C9}
        .shop-img img{width:100%;height:100%;object-fit:cover}
        .description-section{background:var(--neutral-white);padding:12px 14px;border-bottom:8px solid var(--neutral-bg)}
        .section-title{font-family:'Poppins',sans-serif;font-size:14px;font-weight:700;margin-bottom:8px}
        .attributes-section{background:var(--neutral-white);padding:12px 14px;border-bottom:8px solid var(--neutral-bg)}
        .attribute-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
        .attribute-card{background:#F9FAFB;border-radius:var(--radius-sm);padding:10px;border:1px solid var(--neutral-border)}
        .related-section{background:var(--neutral-white);padding:12px 0}
        .related-header{padding:0 14px 10px;display:flex;justify-content:space-between;align-items:center}
        .products-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 10px}
        .mini-product-card{background:white;border-radius:var(--radius-sm);overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.06);border:1px solid var(--neutral-border);cursor:pointer}
        .mini-product-img{width:100%;aspect-ratio:1/1;background:#F9FAFB;display:flex;align-items:center;justify-content:center}
        .mini-product-img img{width:100%;height:100%;object-fit:contain;padding:4px}
        .mini-product-info{padding:6px}
        .mini-product-name{font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .mini-product-price{font-size:12px;font-weight:700;color:var(--brand-green-dark)}
        
        .bottom-action-bar{position:fixed;bottom:0;left:0;width:100%;background:white;padding:8px 12px;box-shadow:0 -4px 20px rgba(0,0,0,0.08);z-index:1000;display:flex;align-items:center;gap:8px;border-top:1px solid var(--neutral-border)}
        .price-display{flex-shrink:0}
        .price-display .current{font-size:18px;font-weight:800;color:var(--brand-green-dark)}
        .price-display .original{font-size:11px;color:#9CA3AF;text-decoration:line-through}
        .add-to-cart-btn{flex:1;background:var(--brand-green);color:white;border:none;padding:12px;border-radius:var(--radius-full);font-size:13px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif}
        .add-to-cart-btn.disabled{background:#D1D5DB;color:#9CA3AF;pointer-events:none}
        .buy-now-btn{flex:1;background:var(--brand-orange);color:white;border:none;padding:12px;border-radius:var(--radius-full);font-size:13px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif}
        .buy-now-btn.disabled{background:#D1D5DB;color:#9CA3AF;pointer-events:none}
        
        .toast-notification{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--neutral-dark);color:white;padding:10px 18px;border-radius:var(--radius-full);font-size:11px;z-index:10050;opacity:0;visibility:hidden;transition:all 0.3s ease}
        .toast-notification.show{opacity:1;visibility:visible}
        .toast-notification.error{background:#EF4444}.toast-notification.success{background:#059669}
        .error-container{text-align:center;padding:50px 20px}
        .error-container i{font-size:48px;color:#D1D5DB;margin-bottom:10px;display:block}
        .error-container button{background:var(--brand-green);color:white;border:none;padding:10px 20px;border-radius:var(--radius-full);font-weight:600;cursor:pointer}
        @media(max-width:380px){.product-swiper{height:250px}.current-price{font-size:24px}}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>
<body>

<div id="simpleLoader"><div style="width:34px;height:34px;border:2.5px solid #E5E7EB;border-top-color:#F59E0B;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto;"></div></div>
<div id="toastMsg" class="toast-notification"><span id="toastText"></span></div>

<div id="mainApp" style="display:none;">
    <div class="top-bar">
        <button class="back-btn" onclick="history.back()"><i class="fas fa-arrow-left"></i></button>
        <div class="top-title" id="productTitle">Product Details</div>
        <div class="top-actions">
            <button class="icon-btn" id="wishlistBtn" onclick="toggleWishlist()"><i class="far fa-heart"></i></button>
            <button class="icon-btn" onclick="shareProduct()"><i class="fas fa-share-alt"></i></button>

        <button class="add-to-cart-btn" id="addToCartBtn" onclick="addToCart()"><i class="fas fa-shopping-bag"></i> <span id="addToCartText">Add to Cart</span></button>
        <button class="buy-now-btn" id="buyNowBtn" onclick="buyNow()"><i class="fas fa-bolt"></i> Buy Now</button>
    </div>

<script>
(function(){'use strict';
var sb=supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co','sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1');
var SUPABASE_URL='https://zwajyovemwdqtkecipeb.supabase.co';
var currentProduct=null,currentShop=null,quantity=1,productSwiper=null,isInWishlist=false,productImages=[],currentUser=null,productId=null,variants=[],selectedVariantIndex=0;
var isHolidayToday=false,holidayReason='';

try{productId=new URLSearchParams(window.location.search).get('id');}catch(e){productId=null;}

function getEl(id){return document.getElementById(id);}
function safeJSON(s,f){try{return s?JSON.parse(s):f;}catch(e){return f;}}
function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function getFullUrl(u){if(!u)return'';if(u.indexOf('http')===0||u.indexOf('data:')===0)return u;return SUPABASE_URL+'/storage/v1/object/public/'+u;}
function showApp(){var l=getEl('simpleLoader'),a=getEl('mainApp');if(a)a.style.display='';if(l){l.style.opacity='0';setTimeout(function(){if(l.parentNode)l.parentNode.removeChild(l);},300);}}
function showToast(m,type){var t=getEl('toastMsg');if(!t)return;t.textContent=m;t.className='toast-notification';if(type==='error')t.classList.add('error');else if(type==='success')t.classList.add('success');t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show','error','success');},2500);}
async function checkUser(){try{var r=await sb.auth.getSession();currentUser=(r&&r.data&&r.data.session)?r.data.session.user:null;}catch(e){}return!!currentUser;}
function goToLogin(){window.location.href='login.html';}
function getCart(){return safeJSON(localStorage.getItem('zymart_cart'),[]);}
function saveCart(c){try{localStorage.setItem('zymart_cart',JSON.stringify(c));}catch(e){}}
function updateCartBadge(){var c=getCart(),n=c.reduce(function(s,i){return s+(i.quantity||1);},0);var b=getEl('cartBadge');if(b)b.textContent=n;}
function fmtWeight(w,u){if(!w)return'';var nw=parseFloat(w);if(isNaN(nw))return String(w);if(u==='gram'||u==='g')return nw>=1000?(nw/1000).toFixed(1).replace(/\.0$/,'')+' kg':nw+' g';if(u==='kg')return nw+' kg';if(u==='liter'||u==='l')return nw+' L';if(u==='ml')return nw+' ml';if(u==='piece'||u==='pcs')return nw+' pcs';return nw+' '+(u||'');}
function parseVariants(p){if(p.variants&&Array.isArray(p.variants)&&p.variants.length>0){return p.variants.map(function(v){return{weight:v.weight||p.weight||1,unit:v.weight_unit||v.unit||p.weight_unit||p.unit||'kg',price:v.price||p.price||0,offer_price:v.offer_price||null,stock:v.stock||0,image_url:v.image_url||null};});}return[{weight:p.weight||1,unit:p.weight_unit||p.unit||'kg',price:p.price||0,offer_price:p.offer_price||null,stock:p.stock||0,image_url:null}];}
function getSelectedVariant(){return variants[selectedVariantIndex]||variants[0]||null;}
function getVariantPrice(v){if(!v)return{price:0,discountPercent:0,savedAmount:0,unitPrice:''};var p=v.price||0,op=v.offer_price,finalP=p,d=0;if(op&&op>0&&op<p){finalP=op;d=Math.round((1-op/p)*100);}var up='';var wt=parseFloat(v.weight);if(wt>0)up='₹'+(finalP/wt).toFixed(2)+'/'+(v.unit||'kg');return{price:finalP,discountPercent:d,savedAmount:p-finalP,unitPrice:up};}
function shareProduct(){if(!currentProduct)return;if(navigator.share){navigator.share({title:currentProduct.name,text:'Check out '+currentProduct.name+'!',url:window.location.href}).catch(function(){});}else{navigator.clipboard.writeText(window.location.href).then(function(){showToast('📋 Link copied!','success');});}}

// 🔥 HOLIDAY CHECK
async function checkHoliday(){
    try{
        var r=await sb.from('delivery_settings').select('is_holiday,holiday_reason,holiday_date').eq('is_active',true).single();
        if(r.data&&r.data.is_holiday){
            var today=new Date().toISOString().split('T')[0];
            if(r.data.holiday_date===today){isHolidayToday=true;holidayReason=r.data.holiday_reason||'Closed Today';}
        }
    }catch(e){}
}

window.showHolidayMsg=function(){showToast('🏖️ '+holidayReason,'error');};

window.selectVariant=function(i){if(i>=variants.length)return;var v=variants[i];if((v.stock||0)<=0){showToast('⚠️ Out of stock','warning');return;}selectedVariantIndex=i;quantity=1;updateVariantUI();updateBottomBar();};
function updateVariantUI(){
var pills=document.querySelectorAll('.variant-pill');for(var i=0;i<pills.length;i++)pills[i].classList.toggle('active',i===selectedVariantIndex);
var v=getSelectedVariant();if(!v)return;
var pi=getVariantPrice(v),stock=v.stock||0,isOut=stock<=0;
var ps=document.querySelector('.product-price-section');if(ps){var h='<span class="current-price">₹'+Number(pi.price).toLocaleString('en-IN')+'</span>';if(pi.discountPercent>0)h+='<span class="original-price">₹'+Number(v.price).toLocaleString('en-IN')+'</span><span class="discount-percent">'+pi.discountPercent+'% OFF</span>';ps.innerHTML=h;}
var up=document.querySelector('.unit-price');if(up)up.textContent=pi.unitPrice;
var sv=document.querySelector('.saved-text');if(sv)sv.textContent=pi.savedAmount>0?'💰 Save ₹'+Number(pi.savedAmount).toLocaleString('en-IN')+'!':'';
var qd=getEl('quantityDisplay');if(qd)qd.textContent=quantity;
updateBottomBar();
var ab=getEl('addToCartBtn'),bn=getEl('buyNowBtn');
if(isHolidayToday){if(ab){ab.classList.add('disabled');ab.innerHTML='🔒 Closed';}if(bn){bn.classList.add('disabled');bn.innerHTML='🔒 Closed';}}
else if(isOut){if(ab){ab.classList.add('disabled');ab.innerHTML='Out of Stock';}if(bn){bn.classList.add('disabled');bn.innerHTML='Out of Stock';}}
else{if(ab){ab.classList.remove('disabled');ab.innerHTML='<i class="fas fa-shopping-bag"></i> Add to Cart';}if(bn){bn.classList.remove('disabled');bn.innerHTML='<i class="fas fa-bolt"></i> Buy Now';}}
}

function updateBottomBar(){var v=getSelectedVariant();if(!v)return;var pi=getVariantPrice(v);var bp=getEl('bottomPrice');if(bp){var h='<div class="current">₹'+Number(pi.price).toLocaleString('en-IN')+'</div>';if(pi.discountPercent>0)h+='<div class="original">₹'+Number(v.price).toLocaleString('en-IN')+'</div>';bp.innerHTML=h;}}

async function loadProduct(){
var mc=getEl('mainContent');
if(!productId){mc.innerHTML='<div class="error-container"><i class="fas fa-box-open"></i><h3>Not Found</h3><button onclick="window.location.href=\'products.html\'">Browse</button></div>';showApp();return;}
try{
var result=await sb.from('products').select('*').eq('id',productId).single();
var p=result.data;if(!p){mc.innerHTML='<div class="error-container"><i class="fas fa-box-open"></i><h3>Not Found</h3></div>';showApp();return;}
currentProduct=p;
if(p.shop_id){try{var sr=await sb.from('shops').select('*').eq('id',p.shop_id).single();if(sr.data)currentShop=sr.data;}catch(e){}}
variants=parseVariants(p);selectedVariantIndex=0;for(var i=0;i<variants.length;i++){if((variants[i].stock||0)>0){selectedVariantIndex=i;break;}}
productImages=[];if(p.images&&Array.isArray(p.images)&&p.images.length){productImages=p.images.map(function(x){return getFullUrl(x);});}else if(p.image_url){productImages=[getFullUrl(p.image_url)];}
var sv2=getSelectedVariant();if(sv2&&sv2.image_url){var vi=getFullUrl(sv2.image_url);if(vi&&productImages.indexOf(vi)===-1)productImages.unshift(vi);}
var wl=safeJSON(localStorage.getItem('zymart_wishlist'),[]);isInWishlist=wl.some(function(x){return x===productId||(typeof x==='object'&&x.id===productId);});updateWishlistUI();
document.title=(p.name||'Product')+' - ZyMart+';
renderProduct();loadRelated();showApp();
}catch(e){mc.innerHTML='<div class="error-container"><i class="fas fa-exclamation-circle"></i><h3>Failed</h3><button onclick="loadProduct()">Retry</button></div>';showApp();}
}

function renderProduct(){
var p=currentProduct;if(!p)return;
getEl('productTitle').textContent=p.name||'Product';
var v=getSelectedVariant(),pi=getVariantPrice(v),stock=v?v.stock||0:0,isOut=stock<=0;
var h='';
if(productImages.length>0){h+='<div class="product-slider"><div class="swiper product-swiper" id="productSwiper"><div class="swiper-wrapper">';h+=productImages.map(function(img){return'<div class="swiper-slide"><img src="'+img+'" alt="'+esc(p.name)+'"></div>';}).join('');h+='</div></div></div>';}
h+='<div class="product-info-section">';
if(p.brand_name)h+='<div class="product-brand">'+esc(p.brand_name)+'</div>';
h+='<h1 class="product-name">'+esc(p.name)+'</h1>';
h+='<div class="product-weight">'+fmtWeight(v.weight,v.unit)+'</div>';
h+='<div class="product-meta"><div class="rating-badge">⭐ '+(p.rating||'4.0')+'</div><span style="font-size:11px;color:#6B7280;">'+(p.rating_count||0)+' ratings</span></div>';
if(variants.length>1){h+='<div class="variant-section"><div class="variant-label">Select Variant:</div><div class="variant-pills">';for(var w=0;w<variants.length;w++){var vr=variants[w],vw=fmtWeight(vr.weight,vr.unit),vp=getVariantPrice(vr).price,vdp=getVariantPrice(vr).discountPercent,io=(vr.stock||0)<=0,ia=w===selectedVariantIndex;h+='<div class="variant-pill'+(ia?' active':'')+(io?' oos':'')+'" onclick="selectVariant('+w+')"><span style="font-size:12px;font-weight:700;">'+vw+'</span><br><span style="font-size:10px;">₹'+Number(vp).toLocaleString('en-IN')+'</span>'+(vdp>0?'<br><span style="font-size:8px;color:#059669;">'+vdp+'% OFF</span>':'')+'</div>';}h+='</div></div>';}
h+='<div class="product-price-section"><span class="current-price">₹'+Number(pi.price).toLocaleString('en-IN')+'</span>';if(pi.discountPercent>0)h+='<span class="original-price">₹'+Number(v.price).toLocaleString('en-IN')+'</span><span class="discount-percent">'+pi.discountPercent+'% OFF</span>';h+='</div>';
if(pi.unitPrice)h+='<div class="unit-price">'+pi.unitPrice+'</div>';
if(pi.savedAmount>0)h+='<div class="saved-text">💰 Save ₹'+Number(pi.savedAmount).toLocaleString('en-IN')+'!</div>';
if(!isOut&&!isHolidayToday){h+='<div class="quantity-section"><span style="font-size:13px;font-weight:700;">Quantity</span><div class="quantity-control"><button class="quantity-btn" onclick="changeQuantity(-1)">−</button><span class="quantity-value" id="quantityDisplay">'+quantity+'</span><button class="quantity-btn" onclick="changeQuantity(1)">+</button></div></div>';}
else if(isHolidayToday){h+='<div style="padding:14px;text-align:center;background:#FEE2E2;border-radius:10px;color:#DC2626;font-weight:700;">🏖️ Delivery Closed Today</div>';}
else{h+='<div style="padding:14px;text-align:center;color:#EF4444;font-weight:700;">Out of Stock</div>';}
h+='</div>';
if(currentShop){h+='<div class="shop-info-section"><div class="shop-header"><div class="shop-img">'+(currentShop.shop_image?'<img src="'+getFullUrl(currentShop.shop_image)+'">':'<i class="fas fa-store" style="color:var(--brand-green);"></i>')+'</div><div style="flex:1;"><div style="font-size:14px;font-weight:700;">'+esc(currentShop.shop_name||currentShop.name||'Shop')+'</div><div style="font-size:10px;color:#6B7280;">📍 '+esc(currentShop.city||'')+'</div></div></div></div>';}
h+='<div class="description-section"><div class="section-title">📝 Description</div><p style="font-size:13px;color:#6B7280;">'+esc(p.description||'No description')+'</p></div>';
h+='<div class="attributes-section"><div class="section-title">📋 Details</div><div class="attribute-cards"><div class="attribute-card"><div style="font-size:10px;color:#6B7280;">Brand</div><div style="font-size:13px;font-weight:600;">'+esc(p.brand_name||'N/A')+'</div></div><div class="attribute-card"><div style="font-size:10px;color:#6B7280;">Weight</div><div style="font-size:13px;font-weight:600;">'+fmtWeight(v.weight,v.unit)+'</div></div><div class="attribute-card"><div style="font-size:10px;color:#6B7280;">Stock</div><div style="font-size:13px;font-weight:600;">'+(stock>0?stock+' units':'Out')+'</div></div></div></div>';
h+='<div class="related-section"><div class="related-header"><div class="section-title">🛍️ Related</div></div><div id="relatedContainer" class="products-grid"></div></div>';
getEl('mainContent').innerHTML=h;getEl('bottomBar').style.display='flex';
updateBottomBar();
var ab=getEl('addToCartBtn'),bn=getEl('buyNowBtn');
if(isHolidayToday){ab.classList.add('disabled');ab.innerHTML='🔒 Closed';bn.classList.add('disabled');bn.innerHTML='🔒 Closed';}
else if(isOut){ab.classList.add('disabled');ab.innerHTML='Out of Stock';bn.classList.add('disabled');bn.innerHTML='Out of Stock';}
setTimeout(function(){if(productSwiper){try{productSwiper.destroy();}catch(e){}}if(productImages.length>0){productSwiper=new Swiper('#productSwiper',{loop:productImages.length>1});}},200);
}

async function loadRelated(){var c=getEl('relatedContainer');if(!c||!currentProduct)return;try{var r=await sb.from('products').select('*').eq('is_active',true).eq('is_on_hold',false).neq('id',productId).limit(6);if(r.data&&r.data.length){c.innerHTML=r.data.map(function(p){var img=getFullUrl((p.images&&p.images[0])||p.image_url||'');var bv=parseVariants(p)[0],pi=getVariantPrice(bv);return'<div class="mini-product-card" onclick="window.location.href=\'product-detail.html?id='+p.id+'\'"><div class="mini-product-img">'+(img?'<img src="'+img+'">':'<i class="fas fa-box" style="color:#D1D5DB;"></i>')+'</div><div class="mini-product-info"><div class="mini-product-name">'+esc(p.name)+'</div><div class="mini-product-price">₹'+Number(pi.price).toLocaleString('en-IN')+'</div></div></div>';}).join('');}else{c.innerHTML='<div style="grid-column:1/-1;text-align:center;font-size:11px;color:#6B7280;padding:10px;">No related</div>';}}catch(e){}}

window.changeQuantity=function(d){var v=getSelectedVariant();if(!v)return;var s=v.stock||0,nq=quantity+d;if(nq>=1&&nq<=s){quantity=nq;var qd=getEl('quantityDisplay');if(qd)qd.textContent=quantity;}else if(nq>s){showToast('⚠️ Only '+s+' available','warning');}};
window.addToCart=function(){
if(isHolidayToday){showHolidayMsg();return;}
if(!currentProduct)return;var v=getSelectedVariant();if(!v)return;var s=v.stock||0;
if(s<=0){showToast('⚠️ Out of stock','error');return;}
var cart=getCart(),ck=currentProduct.id+'_'+(v.weight||0)+'_'+(v.unit||''),ex=cart.find(function(x){return x.cartKey===ck;});
var img=(v.image_url?getFullUrl(v.image_url):'')||productImages[0]||'',pi=getVariantPrice(v),dn=currentProduct.name+(variants.length>1?' - '+fmtWeight(v.weight,v.unit):'');
if(ex)ex.quantity+=quantity;else cart.push({id:currentProduct.id,cartKey:ck,name:dn,price:pi.price,image:img,quantity:quantity,stock:s,variantWeight:v.weight,variantUnit:v.unit,shop_id:currentProduct.shop_id,brand_name:currentProduct.brand_name||''});
saveCart(cart);updateCartBadge();showToast('🛒 '+dn+' added!','success');
};
window.buyNow=async function(){
if(isHolidayToday){showHolidayMsg();return;}
window.addToCart();await checkUser();if(!currentUser){showToast('🔐 Login','warning');goToLogin();return;}window.location.href='checkout.html';
};
function toggleWishlist(){if(!currentProduct)return;var wl=safeJSON(localStorage.getItem('zymart_wishlist'),[]);var idx=wl.findIndex(function(x){return x===productId||(typeof x==='object'&&x.id===productId);});if(idx!==-1){wl.splice(idx,1);isInWishlist=false;showToast('💔 Removed');}else{wl.push({id:currentProduct.id,name:currentProduct.name,price:getVariantPrice(getSelectedVariant()).price,image:productImages[0]||''});isInWishlist=true;showToast('❤️ Added!','success');}try{localStorage.setItem('zymart_wishlist',JSON.stringify(wl));}catch(e){}updateWishlistUI();}
function updateWishlistUI(){var b=getEl('wishlistBtn'),i=b?b.querySelector('i'):null;if(i){i.className=isInWishlist?'fas fa-heart':'far fa-heart';}}

document.addEventListener('DOMContentLoaded',async function(){
await checkHoliday();
await checkUser();
updateCartBadge();
if(productId){loadProduct();}else{getEl('mainContent').innerHTML='<div class="error-container"><i class="fas fa-box-open"></i><h3>Not Found</h3><button onclick="window.location.href=\'products.html\'">Browse</button></div>';showApp();}
});
window.selectVariant=selectVariant;window.changeQuantity=changeQuantity;window.addToCart=addToCart;window.buyNow=buyNow;window.toggleWishlist=toggleWishlist;window.showHolidayMsg=showHolidayMsg;
})();
</script>
</body>
</html>
