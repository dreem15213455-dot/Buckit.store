<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Product Details - Zatpat</title>
    <meta name="theme-color" content="#16A34A">
    <meta name="description" content="View product details on Zatpat">
    
    <!-- Open Graph for sharing -->
    <meta property="og:title" content="Product - Zatpat">
    <meta property="og:description" content="Check out this product on Zatpat">
    <meta property="og:type" content="product">
    
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css">
    
    <style>
        :root {
            --primary: #16A34A;
            --primary-light: #22C55E;
            --primary-dark: #15803D;
            --primary-bg-light: #DCFCE7;
            --primary-bg-dark: #BBF7D0;
            --primary-border-dark: #15803D;
            --accent-orange: #F97316;
            --accent-orange-dark: #EA580C;
            --accent-red: #EF4444;
            --accent-yellow: #FACC15;
            --bg-white: #FFFFFF;
            --bg-light: #F9FAFB;
            --bg-dark: #F3F4F6;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --text-white: #FFFFFF;
            --border-light: #E5E7EB;
            --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-full: 9999px;
            --transition-fast: 0.15s ease;
            --transition-normal: 0.25s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
            overflow-x: hidden;
            padding-bottom: 90px;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes badgePop {
            0% { transform: scale(0); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        /* ========== PAGE PROGRESS ========== */
        #pageProgress {
            position: fixed; top: 0; left: 0; width: 0%; height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            z-index: 10001; transition: width 0.3s ease;
            border-radius: 0 2px 2px 0;
        }
        #pageProgress.loading { width: 90%; }
        #pageProgress.complete { width: 100%; opacity: 0; transition: opacity 0.3s; }

        /* ========== TOP BAR - GREEN ========== */
        .top-bar {
            background: var(--primary);
            position: fixed; top: 0; left: 0; width: 100%;
            z-index: 1000; padding: 8px 12px;
            display: flex; align-items: center; gap: 12px;
            box-shadow: 0 2px 12px rgba(22,163,74,0.3);
            transition: box-shadow var(--transition-normal);
        }
        .top-bar.scrolled { box-shadow: 0 4px 20px rgba(22,163,74,0.4); }
        
        .back-btn {
            width: 38px; height: 38px; 
            background: rgba(255,255,255,0.2); 
            border-radius: var(--radius-full);
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; flex-shrink: 0;
            border: none; outline: none;
            transition: background var(--transition-fast);
            -webkit-tap-highlight-color: transparent;
        }
        .back-btn:active { background: rgba(255,255,255,0.35); }
        .back-btn i { font-size: 16px; color: white; }
        
        .top-title {
            flex: 1; font-size: 16px; font-weight: 700; color: white;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            letter-spacing: -0.3px;
        }
        
        .top-actions { display: flex; align-items: center; gap: 8px; }
        
        .icon-btn {
            width: 38px; height: 38px; 
            background: rgba(255,255,255,0.2); 
            border-radius: var(--radius-full);
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; position: relative;
            border: none; outline: none;
            transition: background var(--transition-fast);
            -webkit-tap-highlight-color: transparent;
        }
        .icon-btn:active { background: rgba(255,255,255,0.35); }
        .icon-btn i { font-size: 16px; color: white; transition: transform var(--transition-fast); }
        .icon-btn:active i { transform: scale(1.1); }
        
        .wishlist-icon.liked i { color: #EF4444 !important; }
        
        .cart-badge {
            position: absolute; top: -3px; right: -3px; 
            background: var(--accent-orange); color: white;
            border-radius: 50%; width: 18px; height: 18px; font-size: 9px; 
            display: flex; align-items: center; justify-content: center; 
            border: 2px solid var(--primary); font-weight: 700;
            animation: badgePop 0.3s ease;
        }
        
        .share-btn { background: rgba(255,255,255,0.2) !important; }

        /* ========== MAIN CONTENT ========== */
        .main-content { padding-top: 54px; animation: fadeInUp 0.4s ease; }

        /* ========== PRODUCT IMAGE SLIDER ========== */
        .product-slider { 
            position: relative; background: var(--bg-white); width: 100%; 
        }
        .swiper.product-swiper { width: 100%; height: 340px; }
        .product-swiper .swiper-slide { 
            display: flex; align-items: center; justify-content: center; 
            background: var(--bg-white); cursor: zoom-in;
        }
        .product-swiper .swiper-slide img { 
            width: 100%; height: 100%; object-fit: contain; 
            background: var(--bg-white);
        }
        .image-counter {
            position: absolute; bottom: 8px; right: 16px; z-index: 10;
            background: rgba(0,0,0,0.65); color: white; 
            padding: 4px 10px; border-radius: var(--radius-full);
            font-size: 11px; font-weight: 600;
            backdrop-filter: blur(4px);
        }
        .slider-pagination {
            position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
            display: flex; justify-content: center; gap: 6px; z-index: 10;
        }
        .slider-pagination .swiper-pagination-bullet {
            width: 6px; height: 6px; 
            background: rgba(0,0,0,0.3); opacity: 1;
            transition: all 0.3s;
        }
        .slider-pagination .swiper-pagination-bullet-active {
            background: var(--primary); width: 20px; border-radius: 4px;
        }

        /* ========== FULLSCREEN MODAL ========== */
        .fullscreen-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 9999; display: none;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .fullscreen-modal.active { display: block; opacity: 1; }
        .fullscreen-swiper { width: 100%; height: 100%; }
        .fullscreen-swiper .swiper-slide { display: flex; align-items: center; justify-content: center; background: black; }
        .fullscreen-swiper .swiper-slide img { width: 100%; height: 100%; object-fit: contain; }
        .close-fullscreen {
            position: fixed; top: 16px; right: 16px; z-index: 10000;
            width: 44px; height: 44px; background: rgba(255,255,255,0.15); 
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            color: white; font-size: 22px; backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2);
            transition: all var(--transition-fast);
        }
        .close-fullscreen:active { background: rgba(255,255,255,0.3); transform: scale(0.93); }
        .fullscreen-pagination {
            position: fixed; bottom: 30px; left: 0; right: 0; z-index: 10000;
            display: flex; justify-content: center; gap: 6px;
        }
        .fullscreen-pagination .swiper-pagination-bullet {
            width: 6px; height: 6px; background: rgba(255,255,255,0.5); opacity: 1;
            transition: all 0.3s;
        }
        .fullscreen-pagination .swiper-pagination-bullet-active {
            background: var(--primary); width: 22px; border-radius: 4px;
        }

        /* ========== PRODUCT INFO SECTION ========== */
        .product-info-section {
            background: var(--bg-white); padding: 16px; 
            border-bottom: 8px solid var(--bg-light);
            animation: fadeInUp 0.4s ease;
        }
        .product-name { 
            font-size: 20px; font-weight: 800; color: #000000; 
            margin-bottom: 10px; line-height: 1.3; letter-spacing: -0.3px;
        }
        
        /* Rating with badge */
        .product-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
        .rating-badge {
            display: flex; align-items: center; gap: 4px; 
            background: #1A8A3F; color: white;
            padding: 5px 10px; border-radius: var(--radius-sm); 
            font-size: 13px; font-weight: 700;
        }
        .rating-badge i { font-size: 11px; color: var(--accent-yellow); }
        .rating-count { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
        .divider-dot { width: 3px; height: 3px; background: #D1D5DB; border-radius: 50%; }
        .sold-count { font-size: 12px; color: var(--text-secondary); }
        
        /* Unit pill */
        .unit-pill {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 13px; color: var(--text-secondary); 
            margin-bottom: 14px;
            padding: 6px 12px; background: var(--bg-dark); 
            border-radius: var(--radius-full);
            font-weight: 500;
        }
        .unit-pill i { color: var(--primary); font-size: 12px; }
        
        /* Price section */
        .product-price-section { 
            display: flex; align-items: baseline; gap: 8px; 
            margin-bottom: 10px; flex-wrap: wrap; 
        }
        .current-price { font-size: 30px; font-weight: 800; color: #000000; letter-spacing: -1px; }
        .original-price { 
            font-size: 16px; color: var(--text-secondary); 
            text-decoration: line-through; font-weight: 400; 
        }
        .discount-percent {
            background: var(--accent-orange); color: white; 
            padding: 3px 8px; border-radius: var(--radius-sm); 
            font-size: 11px; font-weight: 700; margin-left: 4px;
        }
        .saved-text { 
            font-size: 12px; color: var(--primary); font-weight: 600; 
            display: block; margin-bottom: 4px;
        }
        
        /* Tax info */
        .tax-info {
            font-size: 10px; color: var(--text-secondary); margin-bottom: 8px;
        }
        
        /* Offer banner */
        .offer-banner {
            background: linear-gradient(135deg, #FEF3C7, #FDE68A);
            padding: 10px 14px; border-radius: var(--radius-md);
            font-size: 13px; font-weight: 600; color: #92400E;
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 14px;
            border: 1px solid #FCD34D;
        }
        .offer-banner i { color: var(--accent-orange); font-size: 16px; }
        .offer-code {
            background: white; padding: 3px 8px; border-radius: var(--radius-full);
            font-weight: 700; font-size: 11px; border: 1px dashed #FCD34D;
            margin-left: auto; cursor: pointer;
        }
        
        /* Quantity selector */
        .quantity-section {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 0; 
            border-top: 1px solid var(--border-light);
            border-bottom: 1px solid var(--border-light); 
            margin-bottom: 8px;
        }
        .quantity-label { 
            font-size: 15px; font-weight: 700; color: #000000; 
            display: flex; align-items: center; gap: 6px;
        }
        .quantity-label small {
            font-weight: 400; color: var(--text-secondary); font-size: 12px;
        }
        .quantity-control {
            display: flex; align-items: center; gap: 14px; 
            background: var(--bg-dark);
            border-radius: var(--radius-full); padding: 4px 6px;
        }
        .quantity-btn {
            width: 34px; height: 34px; border-radius: 50%; 
            background: white;
            border: 1.5px solid var(--border-light); 
            display: flex; align-items: center;
            justify-content: center; cursor: pointer; 
            font-size: 16px; font-weight: 700;
            color: var(--primary); transition: all var(--transition-fast);
            box-shadow: var(--shadow-sm);
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .quantity-btn:active { 
            background: var(--primary-bg-light); 
            border-color: var(--primary);
            transform: scale(0.93);
        }
        .quantity-btn.disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
        .quantity-value { 
            font-size: 18px; font-weight: 700; 
            min-width: 28px; text-align: center; color: #000000; 
        }
        .stock-info { 
            font-size: 11px; color: var(--text-secondary); 
            margin-top: 10px; display: flex; align-items: center; gap: 6px; 
        }
        .stock-info.low-stock { color: #EF4444; font-weight: 600; }
        .stock-info.low-stock i { animation: pulse 1s infinite; }
        .stock-bar {
            flex: 1; height: 3px; background: var(--border-light); 
            border-radius: 2px; overflow: hidden; max-width: 80px;
        }
        .stock-bar-fill {
            height: 100%; background: var(--primary); border-radius: 2px;
            transition: width 0.5s ease;
        }
        .stock-bar-fill.low { background: #EF4444; }

        /* ========== SHOP INFO ========== */
        .shop-info-section {
            background: var(--bg-white); padding: 16px; 
            border-bottom: 8px solid var(--bg-light);
        }
        .shop-header { 
            display: flex; align-items: center; gap: 12px; 
        }
        .shop-img {
            width: 52px; height: 52px; 
            border-radius: var(--radius-md); 
            background: var(--primary-bg-light);
            display: flex; align-items: center; justify-content: center; 
            overflow: hidden; flex-shrink: 0;
            border: 2px solid var(--primary-bg-dark);
        }
        .shop-img img { width: 100%; height: 100%; object-fit: cover; }
        .shop-img i { font-size: 26px; color: var(--primary); }
        .shop-details { flex: 1; min-width: 0; }
        .shop-name { 
            font-size: 16px; font-weight: 700; color: #000000; margin-bottom: 4px; 
        }
        .shop-meta { 
            display: flex; align-items: center; gap: 12px; 
            font-size: 11px; color: var(--text-secondary); flex-wrap: wrap;
        }
        .shop-meta span { display: flex; align-items: center; gap: 4px; }
        .shop-meta i { color: var(--primary); font-size: 10px; }
        .shop-verified {
            color: var(--primary); font-weight: 600; font-size: 10px;
            display: flex; align-items: center; gap: 3px;
        }
        .view-shop-btn {
            background: var(--primary-bg-light); color: var(--primary); 
            border: 1.5px solid var(--primary);
            border-radius: var(--radius-full); padding: 8px 16px; 
            font-size: 12px; font-weight: 700; cursor: pointer;
            white-space: nowrap;
            transition: all var(--transition-fast);
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .view-shop-btn:active { 
            background: var(--primary); color: white; 
        }

        /* ========== DESCRIPTION ========== */
        .description-section {
            background: var(--bg-white); padding: 16px; 
            border-bottom: 8px solid var(--bg-light);
        }
        .section-title {
            font-size: 16px; font-weight: 800; color: #000000; margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }
        .section-title i { color: var(--primary); font-size: 16px; }
        .description-text { 
            font-size: 14px; color: var(--text-secondary); line-height: 1.7; 
        }
        
        /* ========== ADDITIONAL INFO ========== */
        .additional-info {
            background: var(--bg-white); padding: 16px;
            border-bottom: 8px solid var(--bg-light);
        }
        .info-row {
            display: flex; justify-content: space-between; padding: 10px 0;
            border-bottom: 1px solid var(--border-light); font-size: 13px;
        }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: var(--text-secondary); }
        .info-value { font-weight: 600; color: var(--text-primary); }

        /* ========== RELATED PRODUCTS ========== */
        .related-section { background: var(--bg-white); padding: 16px 0; }
        .related-header {
            padding: 0 16px 14px; 
            display: flex; justify-content: space-between; align-items: center;
        }
        .related-header h3 { 
            font-size: 16px; font-weight: 800; color: #000000; 
            display: flex; align-items: center; gap: 6px; 
        }
        .related-header h3 i { color: var(--primary); }
        .view-all { 
            color: var(--primary); font-size: 12px; font-weight: 700; 
            cursor: pointer; padding: 6px 12px; border-radius: var(--radius-full);
            transition: background var(--transition-fast);
            border: none; background: transparent; outline: none;
        }
        .view-all:active { background: var(--primary-bg-light); }
        
        .products-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 12px;
        }
        .mini-product-card {
            background: white; border-radius: var(--radius-md); overflow: hidden; 
            box-shadow: var(--shadow-sm); border: 1px solid var(--border-light); 
            cursor: pointer; transition: transform var(--transition-fast);
        }
        .mini-product-card:active { transform: scale(0.96); }
        .mini-product-img { width: 100%; aspect-ratio: 1/1; overflow: hidden; background: var(--bg-light); }
        .mini-product-img img { width: 100%; height: 100%; object-fit: cover; }
        .mini-product-info { padding: 8px; }
        .mini-product-name {
            font-size: 11px; font-weight: 700; color: #000000; margin-bottom: 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .mini-product-price { font-size: 13px; font-weight: 800; color: #000000; }
        .mini-product-rating { 
            display: flex; align-items: center; gap: 2px; 
            font-size: 9px; color: var(--text-secondary); margin-bottom: 3px;
        }
        .mini-product-rating i { color: var(--accent-yellow); }

        /* ========== BOTTOM ACTION BAR ========== */
        .bottom-action-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; background: white;
            padding: 10px 16px; 
            box-shadow: 0 -4px 20px rgba(0,0,0,0.08); z-index: 1000;
            display: flex; align-items: center; gap: 10px; 
            border-top: 1px solid var(--border-light);
            animation: slideUp 0.3s ease;
        }
        .add-to-cart-btn {
            flex: 1; background: var(--primary); color: white; border: none; 
            padding: 13px; border-radius: var(--radius-full); 
            font-size: 15px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all var(--transition-fast);
            letter-spacing: -0.2px;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .add-to-cart-btn:active { background: var(--primary-dark); transform: scale(0.98); }
        .add-to-cart-btn.disabled { 
            background: #D1D5DB; cursor: not-allowed; color: #9CA3AF;
        }
        .add-to-cart-btn.go-to-cart {
            background: var(--primary-dark);
        }
        .buy-now-btn {
            flex: 1; background: var(--accent-orange); color: white; border: none; 
            padding: 13px; border-radius: var(--radius-full); 
            font-size: 15px; font-weight: 700; cursor: pointer;
            transition: all var(--transition-fast);
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .buy-now-btn:active { background: var(--accent-orange-dark); transform: scale(0.98); }
        .buy-now-btn.disabled { 
            background: #D1D5DB; cursor: not-allowed; color: #9CA3AF;
        }

        /* ========== TOAST ========== */
        .toast-notification {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(10px);
            background: var(--text-primary); color: white; padding: 12px 24px;
            border-radius: var(--radius-full); font-size: 13px; font-weight: 600;
            z-index: 10050; opacity: 0; visibility: hidden;
            white-space: nowrap; box-shadow: var(--shadow-lg);
            transition: opacity 0.25s, visibility 0.25s, transform 0.25s;
        }
        .toast-notification.show { 
            opacity: 1; visibility: visible; 
            transform: translateX(-50%) translateY(0);
        }

        /* ========== LOADING ========== */
        .loading-container { 
            display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            padding: 80px 20px; gap: 16px;
        }
        .loading-spinner {
            width: 44px; height: 44px; border: 3px solid var(--border-light);
            border-top-color: var(--primary); border-radius: 50%; 
            animation: spin 0.7s linear infinite;
        }
        .loading-text { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
        
        .error-container {
            text-align: center; padding: 60px 20px;
        }
        .error-container i { font-size: 56px; color: #D1D5DB; margin-bottom: 16px; }
        .error-container h3 { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
        .error-container button {
            background: var(--primary); color: white; border: none;
            padding: 10px 24px; border-radius: var(--radius-full);
            font-weight: 600; cursor: pointer; margin-top: 12px;
        }
    </style>
</head>
<body>

<!-- PAGE PROGRESS -->
<div id="pageProgress"></div>

<!-- TOAST -->
<div id="toastMsg" class="toast-notification"><span id="toastText"></span></div>

<!-- FULLSCREEN MODAL -->
<div id="fullscreenModal" class="fullscreen-modal">
    <button class="close-fullscreen" onclick="closeFullscreen()" aria-label="Close fullscreen">
        <i class="fas fa-times"></i>
    </button>
    <div class="swiper fullscreen-swiper" id="fullscreenSwiper">
        <div class="swiper-wrapper" id="fullscreenWrapper"></div>
    </div>
    <div class="fullscreen-pagination">
        <div class="swiper-pagination"></div>
    </div>
</div>

<!-- MAIN APP -->
<div id="mainApp">
    <!-- 🔥 GREEN TOP BAR -->
    <div class="top-bar" id="topBar">

<script>

const zatpatDB = supabase.createClient(

// ==================== GLOBAL STATE ====================
let currentProduct = null;

// ==================== PROGRESS & NAVIGATION ====================
function startProgress() { 
    const b = document.getElementById('pageProgress'); 
    if(b) { b.style.width = '0%'; b.classList.add('loading'); setTimeout(() => b.style.width = '90%', 10); } 
}
function completeProgress() { 
    const b = document.getElementById('pageProgress'); 
    if(b) { 
        b.classList.remove('loading'); b.classList.add('complete'); 
        setTimeout(() => { b.style.width = '0%'; b.classList.remove('complete'); }, 300);

}
window.fastNavigate = function(url) {

function goBack() {

// ==================== TOAST ====================
function showToast(msg, isError = false) {
    const t = document.getElementById('toastMsg'), s = document.getElementById('toastText');
    if(!t || !s) return;
    s.innerHTML = msg; 
    t.style.background = isError ? '#EF4444' : '#111827';
    t.classList.add('show'); 
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ==================== CART ====================
function getCart() {
    try { return JSON.parse(localStorage.getItem('zatpat_cart') || '[]'); } 
    catch(e) { return []; }
}
function saveCart(cart) {
    try { localStorage.setItem('zatpat_cart', JSON.stringify(cart)); } 
    catch(e) { showToast('Cart storage full', true); }
}
function updateCartBadge() {
    try { 
        const cart = getCart();

// ==================== SHARE ====================
function shareProduct() {
    if (!currentProduct) return;
    const shareData = {

        url: window.location.href

    if (navigator.share) {
        navigator.share(shareData).catch(() => {});
    } else {

            showToast('📋 Link copied!');
        });

}

// ==================== OFFERS ====================
async function loadActiveOffers() { 
    try { 
        const { data } = await zatpatDB.from('offers').select('*').eq('is_active', true); 
        allOffers = data || []; 
    } catch(e) { allOffers = []; } 
}

function calculateOfferPrice(product) {
    // Priority 1: Product's own offer_price
    if (product.offer_price && product.offer_price > 0 && product.offer_price < product.price) {
        return {
            price: product.offer_price,
            discountPercent: Math.round((1 - product.offer_price / product.price) * 100),
            source: 'product'
        };
    }
    
    // Priority 2: Offers table
    const now = new Date();
    const applicable = allOffers.filter(o => {
        if (o.valid_from && new Date(o.valid_from) > now) return false;
        if (o.valid_till && new Date(o.valid_till) < now) return false;
        if (o.apply_to === 'global') return true;
        if (o.apply_to === 'category' && o.target_id === product.category_id) return true;
        if (o.apply_to === 'product' && o.target_id === product.id) return true;
        if (o.apply_to === 'shop' && o.target_id === product.shop_id) return true;
        return false;
    });
    
    if (applicable.length > 0) {
        const best = applicable.sort((a, b) => {
            const aVal = a.discount_type === 'percentage' ? a.discount_value : (a.discount_value / product.price) * 100;
            const bVal = b.discount_type === 'percentage' ? b.discount_value : (b.discount_value / product.price) * 100;
            return bVal - aVal;
        })[0];
        
        let discount = best.discount_type === 'percentage' ? 
            (product.price * best.discount_value) / 100 : best.discount_value;
        if (best.max_discount > 0 && best.discount_type === 'percentage') {
            discount = Math.min(discount, best.max_discount);
        }
        const calcPrice = Math.max(Math.round(product.price - discount), 0);
        
        if (calcPrice < product.price) {
            return {
                price: calcPrice,
                discountPercent: Math.round((1 - calcPrice / product.price) * 100),
                source: 'offer',
                offer: best
            };
        }
    }
    
    return { price: product.price, discountPercent: 0, source: 'none' };
}

// ==================== FULLSCREEN ====================
function openFullscreen() {
    const modal = document.getElementById('fullscreenModal'), wrapper = document.getElementById('fullscreenWrapper');
    if(!modal || !wrapper || !productImages.length) return;
    
    wrapper.innerHTML = productImages.map(img =>

    ).join('');
    
    modal.classList.add('active'); 
    document.body.style.overflow = 'hidden';
    
    setTimeout(() => { 
        if (fullscreenSwiper) fullscreenSwiper.destroy(); 
        fullscreenSwiper = new Swiper('#fullscreenSwiper', { 
            loop: productImages.length > 1, 
            pagination: { el: '.fullscreen-pagination .swiper-pagination', clickable: true },
            keyboard: { enabled: true },
        }); 
    }, 150);
}

window.closeFullscreen = function() { 
    document.getElementById('fullscreenModal').classList.remove('active'); 
    document.body.style.overflow = ''; 
    if (fullscreenSwiper) {
        fullscreenSwiper.destroy();
        fullscreenSwiper = null;
    }
};

// Swipe down to close fullscreen
document.addEventListener('DOMContentLoaded', () => {
    let touchStartY = 0;
    const modal = document.getElementById('fullscreenModal');
    
    modal.addEventListener('touchstart', (e) => {
        touchStartY = e.touches[0].clientY;
    }, { passive: true });
    
    modal.addEventListener('touchend', (e) => {
        const diff = e.changedTouches[0].clientY - touchStartY;
        if (diff > 100) closeFullscreen();
    });
});

// ==================== LOAD PRODUCT ====================
async function loadProduct() {
    if (!productId) { 
        document.getElementById('mainContent').innerHTML = `
            <div class="error-container">
                <i class="fas fa-box-open"></i>
                <h3>Product Not Found</h3>
                <p>No product ID provided</p>
                <button onclick="goBack()">Go Back</button>
            </div>
        `; 
        return; 
    }
    
    try {
        await loadActiveOffers();
        
        const { data: product, error } = await zatpatDB
            .from('products')
            .select('*, shops(*)')
            .eq('id', productId)
            .single();
        
        if (error) throw error; 
        if (!product) { 
            showToast('Product not found', true); 
            setTimeout(() => goBack(), 1500); 
            return; 
        }
        
        currentProduct = product; 
        currentShop = product.shops;
        
        // Images
        productImages = product.images?.length ? product.images : 
                       product.image_url ? [product.image_url] : [];
        
        if (!productImages.length) {
            productImages = ['data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400"><rect fill="#F0FDF4" width="400" height="400"/><text x="200" y="210" text-anchor="middle" font-size="60" fill="#16A34A">📦</text></svg>')];
        }
        
        maxStock = product.stock || 0;
        
        // Calculate offer
        const offerResult = calculateOfferPrice(product);
        offerPrice = offerResult.price;
        discountPercent = offerResult.discountPercent;
        if (offerResult.source === 'offer') currentOffer = offerResult.offer;
        else if (offerResult.source === 'product') currentOffer = null;
        else currentOffer = null;
        
        // Wishlist
        const wishlist = JSON.parse(localStorage.getItem('zatpat_wishlist') || '[]'); 
        isInWishlist = wishlist.includes(productId); 
        updateWishlistUI();
        
        // Update share meta
        document.title = `${product.name} - Zatpat`;
        document.querySelector('meta[property="og:title"]')?.setAttribute('content', product.name);
        document.querySelector('meta[property="og:description"]')?.setAttribute('content', `₹${offerPrice} - ${product.name}`);
        
        renderProduct(); 
        loadRelatedProducts();
        completeProgress();
        
    } catch (e) { 
        console.error('Load error:', e); 
        document.getElementById('mainContent').innerHTML = `
            <div class="error-container">
                <i class="fas fa-exclamation-circle"></i>
                <h3>Failed to load product</h3>
                <p>Please check your connection</p>
                <button onclick="loadProduct()">Try Again</button>
            </div>
        `;
    }
}

            <div class="slider-pagination"><div class="swiper-pagination"></div></div>

                ${discountPercent > 0 ? `<span class="discount-percent">${discountPercent}% OFF</span>` : ''}
            </div>
            ${savedAmount > 0 ? `<span class="saved-text">You save ₹${savedAmount}!</span>` : ''}

            </div>` : ''}
            
            ${!isOutOfStock ? `

                ${maxStock < 10 ? '<i class="fas fa-exclamation-triangle"></i>' : '<i class="fas fa-check-circle" style="color:#16A34A;"></i>'}
                ${maxStock < 10 ? `Only ${maxStock} left in stock!` : 'In Stock'}

            ` : `
            <div style="padding:16px 0;text-align:center;color:#EF4444;font-weight:700;font-size:15px;">

        ${currentShop ? `

                </div>

                    <div class="shop-meta">

        <div class="description-section">

            <div class="description-text">${escapeHtml(p.description || 'No description available for this product.')}</div>

        ${(p.brand || p.manufacturer || p.country_of_origin) ? `

            ${p.manufacturer ? `<div class="info-row"><span class="info-label">Manufacturer</span><span class="info-value">${escapeHtml(p.manufacturer)}</span></div>` : ''}
            ${p.country_of_origin ? `<div class="info-row"><span class="info-label">Country of Origin</span><span class="info-value">${escapeHtml(p.country_of_origin)}</span></div>` : ''}

        <div class="related-section">

                <h3><i class="fas fa-link"></i> You May Also Like</h3>
                <button class="view-all" onclick="fastNavigate('products.html')">View All →</button>
            </div>

        if(buyBtn) { buyBtn.classList.add('disabled'); buyBtn.innerHTML = '<i class="fas fa-ban"></i> Out of Stock'; }

function updateAddToCartButtonText() {
    if (!currentProduct) return;
    const cart = getCart();
    const cartItem = cart.find(i => i.id === currentProduct.id);
    const addBtn = document.getElementById('addToCartBtn');
    const addText = document.getElementById('addToCartText');
    
    if (cartItem && addBtn && addText) {
        addText.textContent = `Go to Cart (${cartItem.quantity || 1})`;
        addBtn.classList.add('go-to-cart');
        addBtn.setAttribute('onclick', "fastNavigate('cart.html')");
    }
}

function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

// ==================== RELATED PRODUCTS ====================
async function loadRelatedProducts() {
    const container = document.getElementById('relatedContainer'); 
    if(!container) return;
    
    try {
        const { data } = await zatpatDB
            .from('products')
            .select('*')
            .eq('is_active', true)
            .neq('id', productId)
            .limit(6);
        
        if (data?.length) {
            container.innerHTML = data.map(p => {
                const img = p.images?.[0] || p.image_url || '';
                const optimg = img && img.includes('supabase.co') ? `${img}?width=120&height=120&quality=65` : img;
                const relOffer = calculateOfferPrice(p);
                
                return `
                <div class="mini-product-card" onclick="fastNavigate('product-detail.html?id=${p.id}')">
                    <div class="mini-product-img">
                        ${optimg ? `<img src="${optimg}" loading="lazy" decoding="async" alt="${escapeHtml(p.name)}">` : '<i class="fas fa-box-open" style="font-size:40px;color:#D1D5DB;"></i>'}
                    </div>
                    <div class="mini-product-info">
                        <div class="mini-product-rating"><i class="fas fa-star"></i> ${p.rating || '4.0'}</div>
                        <div class="mini-product-name">${escapeHtml(p.name)}</div>
                        <div class="mini-product-price">₹${relOffer.price}</div>
                    </div>
                </div>`;
            }).join('');
        } else { 
            container.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:20px;color:var(--text-secondary);font-size:13px;">No related products</p>'; 
        }
    } catch(e) { 
        container.innerHTML = ''; 
    }
}

// ==================== QUANTITY ====================
window.changeQuantity = function(delta) {
    const newQty = quantity + delta; 
    if (newQty >= 1 && newQty <= maxStock) { 
        quantity = newQty; 
        const qtyDisplay = document.getElementById('quantityDisplay');
        if(qtyDisplay) qtyDisplay.innerText = quantity; 
        
        const buttons = document.querySelectorAll('.quantity-btn');
        if(buttons[0]) buttons[0].classList.toggle('disabled', quantity <= 1);
        if(buttons[1]) buttons[1].classList.toggle('disabled', quantity >= maxStock);
    }
};

// ==================== ADD TO CART ====================
window.addToCart = function() {
    if (!currentProduct) return;
    if (maxStock <= 0) { showToast('Product is out of stock', true); return; }
    if (quantity > maxStock) { showToast(`Only ${maxStock} items available`, true); return; }
    
    try {
        let cart = getCart();
        const existing = cart.find(i => i.id === currentProduct.id);
        const img = productImages[0] || '';
        const unit = currentProduct.unit || 'piece';
        
        if (existing) { 
            existing.quantity += quantity; 
        } else { 
            cart.push({ 
                id: currentProduct.id, 
                name: currentProduct.name, 
                price: offerPrice, 
                originalPrice: currentProduct.price, 
                image: img, 
                quantity: quantity,
                unit: unit
            }); 
        }
        
        saveCart(cart); 
        updateCartBadge();
        updateAddToCartButtonText();
        showToast(`🛒 ${quantity} × ${currentProduct.name} added!`); 
        if (navigator.vibrate) navigator.vibrate(15);
        quantity = 1;
        
        // Update display
        const qtyDisplay = document.getElementById('quantityDisplay');
        if(qtyDisplay) qtyDisplay.innerText = '1';
    } catch(e) { 
        showToast('Failed to add to cart', true); 
    }
};

// ==================== BUY NOW ====================
window.buyNow = function() { 
    if (maxStock <= 0) { showToast('Product is out of stock', true); return; }
    addToCart(); 
    fastNavigate('checkout.html'); 
};

// ==================== WISHLIST ====================
function toggleWishlist() {
    if (!currentProduct) return;
    let wishlist = JSON.parse(localStorage.getItem('zatpat_wishlist') || '[]');
    
    if (isInWishlist) {
        wishlist = wishlist.filter(id => id !== productId);
    } else {
        wishlist.push(productId);
    }
    
    localStorage.setItem('zatpat_wishlist', JSON.stringify(wishlist)); 
    isInWishlist = !isInWishlist; 
    updateWishlistUI();
    showToast(isInWishlist ? '❤️ Added to wishlist!' : 'Removed from wishlist'); 
    if (navigator.vibrate) navigator.vibrate(10);
}

function updateWishlistUI() { 
    const btn = document.getElementById('wishlistBtn');
    const icon = btn?.querySelector('i');
    if (icon) { 
        icon.className = isInWishlist ? 'fas fa-heart' : 'far fa-heart'; 
        if (isInWishlist) {
            btn.classList.add('liked');
        } else {
            btn.classList.remove('liked');
        }
    } 
}

        showToast('📋 Coupon code copied!');
    });
}

document.addEventListener('DOMContentLoaded', () => {

        document.getElementById('mainContent').innerHTML = `
            <div class="error-container">
                <i class="fas fa-box-open"></i>
                <h3>Product Not Found</h3>
                <p>Please select a product</p>
                <button onclick="goBack()">Go Back</button>
            </div>
        `;
    }
});

// ==================== EXPOSE GLOBAL FUNCTIONS ====================
window.goBack = goBack;
window.addToCart = addToCart;
window.buyNow = buyNow;
window.toggleWishlist = toggleWishlist;
window.openFullscreen = openFullscreen;
window.closeFullscreen = closeFullscreen;
window.changeQuantity = changeQuantity;
window.fastNavigate = fastNavigate;
window.shareProduct = shareProduct;
window.copyCode = copyCode;
</script>
