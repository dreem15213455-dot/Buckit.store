<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Shop Details - ZyMart+</title>
    <meta name="theme-color" content="#0B5A31">
    <meta name="description" content="ZyMart+ - View complete shop details">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link rel="preconnect" href="https://res.cloudinary.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root{
            --brand-green:#0B5A31;--brand-green-dark:#083D21;--brand-orange:#F59E0B;
            --neutral-white:#FFFFFF;--neutral-bg:#F9FAFB;--neutral-border:#E5E7EB;
            --neutral-gray:#6B7280;--neutral-dark:#1A1A1A;
            --shadow-xs:0 1px 2px rgba(0,0,0,0.04);--shadow-sm:0 1px 4px rgba(0,0,0,0.06);
            --shadow-md:0 4px 16px rgba(0,0,0,0.08);
            --radius-sm:10px;--radius-md:14px;--radius-lg:18px;--radius-xl:22px;--radius-full:9999px;
            --status-bar-height:env(safe-area-inset-top, 0px);
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',-apple-system,sans-serif;background:var(--neutral-bg);color:var(--neutral-dark);padding-bottom:calc(30px + env(safe-area-inset-bottom, 0px));-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;min-height:100vh;}
        @keyframes slideUp{from{transform:translateY(12px);opacity:0;}to{transform:translateY(0);opacity:1;}}
        @keyframes spin{to{transform:rotate(360deg);}}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
        
        /* FIX: Safe-area top */
        .top-bar{background:var(--brand-green);position:fixed;top:0;left:0;width:100%;z-index:100;padding:10px 14px;padding-top:calc(10px + var(--status-bar-height));display:flex;align-items:center;gap:10px;box-shadow:0 2px 16px rgba(11,90,49,0.3);}
        .back-btn{width:40px;height:40px;min-width:40px;background:rgba(255,255,255,0.10);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:white;font-size:15px;text-decoration:none;}
        .back-btn:active{background:rgba(255,255,255,0.22);transform:scale(0.93);}
        .top-title{font-family:'Poppins',sans-serif;flex:1;font-size:16px;font-weight:700;color:white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .brand-zy{color:#A3E635;}.brand-mart{color:#FDE047;}
        
        /* FIX: Safe-area top content */
        .main-content{padding-top:calc(62px + var(--status-bar-height));max-width:600px;margin:0 auto;}
        
        .location-bar{display:flex;align-items:center;gap:6px;padding:8px 14px;background:#EDF7F1;border-bottom:1px solid #C8E6C9;font-size:11px;color:#0B5A31;cursor:pointer;}
        .location-bar span{font-weight:600;}
        
        .shop-header{background:linear-gradient(135deg,var(--brand-green),var(--brand-green-dark));margin:12px 14px;padding:24px 20px;border-radius:var(--radius-xl);color:white;text-align:center;animation:fadeInUp 0.3s ease;box-shadow:0 4px 20px rgba(11,90,49,0.3);}
        .shop-header.nearby{border:3px solid var(--brand-orange);}
        .shop-img{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,0.15);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:3px solid rgba(255,255,255,0.25);}
        .shop-img img{width:100%;height:100%;object-fit:cover;}
        .shop-img i{font-size:36px;}
        .shop-name{font-family:'Poppins',sans-serif;font-size:22px;font-weight:700;margin-bottom:4px;}
        .shop-category{font-size:13px;opacity:0.85;background:rgba(255,255,255,0.15);display:inline-block;padding:4px 14px;border-radius:var(--radius-full);}
        .shop-meta-row{display:flex;justify-content:center;gap:20px;margin-top:12px;font-size:13px;flex-wrap:wrap;}
        .shop-meta-row span{display:flex;align-items:center;gap:5px;}
        .open-badge{color:#A7F3D0;}
        .nearby-tag{display:inline-block;background:var(--brand-orange);color:#1A1A1A;font-size:10px;padding:2px 10px;border-radius:9999px;font-weight:700;margin-left:6px;}
        .distance-tag{display:inline-block;background:rgba(255,255,255,0.2);font-size:12px;padding:4px 12px;border-radius:9999px;margin-top:8px;}
        
        .section{background:var(--neutral-white);margin:10px 14px;border-radius:var(--radius-lg);padding:16px;border:1px solid var(--neutral-border);box-shadow:var(--shadow-xs);animation:slideUp 0.3s ease;}
        .section-title{font-family:'Poppins',sans-serif;font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
        .section-title i{color:var(--brand-green);width:18px;text-align:center;}
        .info-row{display:flex;padding:8px 0;border-bottom:1px solid var(--neutral-border);font-size:13px;}
        .info-row:last-child{border-bottom:none;}
        .info-label{color:var(--neutral-gray);width:80px;flex-shrink:0;font-weight:500;}
        .info-value{font-weight:600;word-break:break-word;}
        .products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
        .product-card{background:var(--neutral-bg);border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--neutral-border);cursor:pointer;transition:transform 0.15s ease;}
        .product-card:active{transform:scale(0.96);}
        .product-img{width:100%;aspect-ratio:1/1;background:#E5E7EB;display:flex;align-items:center;justify-content:center;overflow:hidden;}
        .product-img img{width:100%;height:100%;object-fit:contain;padding:8px;}
        .product-img i{font-size:36px;color:#9CA3AF;}
        .product-info{padding:9px;}
        .product-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .product-price{font-size:14px;font-weight:700;color:var(--brand-green);}
        
        /* NEW: Explore section */
        .explore-section{margin:12px 14px 0;display:flex;flex-direction:column;gap:10px;}
        .explore-btn{
            display:flex;align-items:center;justify-content:center;gap:10px;
            padding:14px 18px;border-radius:var(--radius-md);
            background:linear-gradient(135deg,#FFF8EB,#FEF3C7);
            border:2px solid var(--brand-orange);
            color:#92400E;font-family:'Inter',sans-serif;
            font-size:13px;font-weight:700;cursor:pointer;
            text-decoration:none;width:100%;
            box-shadow:0 2px 8px rgba(245,158,11,0.15);
            transition:transform 0.15s ease;
        }
        .explore-btn:active{transform:scale(0.97);}
        .explore-btn i{font-size:16px;color:var(--brand-orange);}
        .explore-btn.green{
            background:linear-gradient(135deg,#EDF7F1,#D1FAE5);
            border-color:var(--brand-green);
            color:var(--brand-green-dark);
        }
        .explore-btn.green i{color:var(--brand-green);}
        
        /* FIX: Safe-area bottom on contact buttons */
        .contact-btn{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;background:var(--brand-green);color:white;padding:14px;border-radius:var(--radius-full);font-weight:600;font-size:14px;cursor:pointer;margin:12px 14px;text-decoration:none;border:none;width:calc(100% - 28px);font-family:'Inter',sans-serif;}
        .contact-btn:active{background:var(--brand-green-dark);transform:scale(0.97);}
        .whatsapp-btn{background:#25D366;}
        .whatsapp-btn:active{background:#1DA851;}
        
        .empty-state{text-align:center;padding:55px 20px;}
        .empty-state i{font-size:48px;color:#D1D5DB;display:block;margin-bottom:12px;}
        .empty-state h3{font-family:'Poppins',sans-serif;font-size:16px;font-weight:700;margin-bottom:4px;}
        .loading-state{text-align:center;padding:50px;}
        .spinner{width:32px;height:32px;border:2.5px solid var(--neutral-border);border-top-color:var(--brand-orange);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto;}
        
        /* FIX: Safe-area bottom on toast */
        .toast{position:fixed;bottom:calc(30px + env(safe-area-inset-bottom, 0px));left:50%;transform:translateX(-50%);background:var(--neutral-dark);color:white;padding:10px 20px;border-radius:var(--radius-full);font-size:12px;z-index:200;opacity:0;visibility:hidden;white-space:nowrap;box-shadow:var(--shadow-md);transition:all 0.3s ease;max-width:90%;overflow:hidden;text-overflow:ellipsis;}
        .toast.show{opacity:1;visibility:visible;}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="netBanner" style="display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);background:#DC2626;color:white;text-align:center;padding:6px 16px;border-radius:20px;font-size:11px;font-weight:700;z-index:99999;box-shadow:0 4px 12px rgba(220,38,38,0.4);white-space:nowrap;pointer-events:none;">📴 No Internet</div>

<div class="top-bar">
    <button onclick="goBack()" class="back-btn"><i class="fas fa-arrow-left"></i></button>
    <span class="top-title" id="shopTitle"><span class="brand-zy">Zy</span><span class="brand-mart">Mart</span> Shop</span>
</div>

<div class="main-content" id="mainContent">
    <div class="loading-state"><div class="spinner"></div></div>
</div>

<div class="toast" id="toastMsg"></div>

<script>
(function(){'use strict';
window.addEventListener('error',function(e){console.error('[Shop Detail]',e.message);});
window.addEventListener('offline',function(){var b=document.getElementById('netBanner');if(b)b.style.display='block';});
window.addEventListener('online',function(){var b=document.getElementById('netBanner');if(b)b.style.display='none';});

// ═══ IMAGE FALLBACK ═══
var IMG_FALLBACK = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="#F3F4F6" width="100" height="100"/><circle cx="50" cy="42" r="13" fill="#D1D5DB"/><rect x="34" y="60" width="32" height="7" rx="3.5" fill="#D1D5DB"/></svg>');
window.addEventListener('error', function(e) {
    var el = e.target;
    if (el && el.tagName === 'IMG' && !el.dataset.fb) {
        el.dataset.fb = '1';
        el.onerror = null;
        el.src = IMG_FALLBACK;
    }
}, true);

var CONFIG = {
    SUPABASE_URL: 'https://zwajyovemwdqtkecipeb.supabase.co',
    SUPABASE_KEY: 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1',
    CLOUDINARY_CLOUD_NAME: 'b0zm0rac',
    CLOUDINARY_ENABLED: true
};

function getEl(id){return document.getElementById(id);}
function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function jsStr(s){return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/\n/g,'');}

var sb=supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
var SUPABASE_URL = CONFIG.SUPABASE_URL;
var shopData=null, shopProducts=[], shopId=null, shopDistance=null, isNearbyShop=false;
var categoryInfo=null;
try{shopId=new URLSearchParams(window.location.search).get('id');}catch(e){shopId=null;}

// ═══ FIX: Back button with fallback ═══
window.goBack = function() {
    try {
        if (document.referrer && document.referrer.indexOf(location.host) !== -1) history.back();
        else window.location.href = 'all-shops.html';
    } catch(e) { window.location.href = 'all-shops.html'; }
};

function getFullUrl(u, width){
    if(!u || typeof u !== 'string') return '';
    var fullUrl;
    if(u.indexOf('http')===0 || u.indexOf('data:')===0) fullUrl = u;
    else fullUrl = SUPABASE_URL + '/storage/v1/object/public/' + u;
    if(fullUrl.indexOf('res.cloudinary.com')===0) return fullUrl;
    if(!CONFIG.CLOUDINARY_ENABLED) return fullUrl;
    var w = width || 200;
    return 'https://res.cloudinary.com/' + CONFIG.CLOUDINARY_CLOUD_NAME + '/image/fetch/w_' + w + ',q_auto,f_auto/' + fullUrl;
}

function showToast(m){var t=getEl('toastMsg');if(!t)return;t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2200);}

function calculateDistance(lat1,lng1,lat2,lng2){var R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180,a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}

function calculateShopDistance(){
    if(!shopData||!shopData.latitude||!shopData.longitude)return;
    var ul=parseFloat(localStorage.getItem('user_lat')||'0')||null,un=parseFloat(localStorage.getItem('user_lng')||'0')||null,ts=parseInt(localStorage.getItem('location_timestamp')||'0');
    if(!ul||!un||(Date.now()-ts)>86400000)return;
    shopDistance=Math.round(calculateDistance(ul,un,shopData.latitude,shopData.longitude)*10)/10;
    isNearbyShop=shopDistance<=(shopData.delivery_radius_km||10);
}

function getRatingDisplay(rating) {
    var r = parseFloat(rating) || 0;
    if (r <= 0) return '<span style="opacity:0.75;">🆕 New Shop</span>';
    return '<i class="fas fa-star" style="color:#FDE047;"></i> ' + r.toFixed(1);
}

// ═══ NEW: Find category by shop's category name ═══
async function findCategoryByName(catName) {
    if (!catName || !catName.trim()) return null;
    var name = catName.trim();
    try {
        // First try exact match
        var r = await sb.from('categories')
            .select('id, name, parent_id')
            .eq('name', name)
            .eq('is_active', true)
            .limit(1)
            .maybeSingle();
        if (r && r.data) return r.data;
        
        // Fallback: ilike
        var r2 = await sb.from('categories')
            .select('id, name, parent_id')
            .ilike('name', name)
            .eq('is_active', true)
            .limit(1)
            .maybeSingle();
        if (r2 && r2.data) return r2.data;
        
        return null;
    } catch(e) {
        console.warn('[Shop Detail] Category lookup error:', e.message);
        return null;
    }
}

async function loadShop(){
    var mc=getEl('mainContent');
    if(!mc)return;
    if(!shopId){
        mc.innerHTML='<div class="empty-state"><i class="fas fa-store-slash"></i><h3>Shop ID Missing</h3><p style="color:#6B7280;font-size:12px;margin-top:8px;">URL mein ?id= parameter nahi hai</p></div>';
        return;
    }
    
    try{
        // FIX: maybeSingle instead of single
        var r = await sb.from('shops').select('*').eq('id', shopId).maybeSingle();
        if(!r || !r.data){
            mc.innerHTML='<div class="empty-state"><i class="fas fa-store-slash"></i><h3>Shop Not Found</h3><p style="color:#6B7280;font-size:12px;margin-top:8px;">Ye shop exist nahi karta</p><button onclick="window.location.href=\'all-shops.html\'" style="margin-top:14px;background:var(--brand-green);color:white;border:none;padding:10px 20px;border-radius:20px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;">← All Shops</button></div>';
            return;
        }
        shopData=r.data;
        
        getEl('shopTitle').innerHTML='<span class="brand-zy">Zy</span><span class="brand-mart">Mart</span> '+esc(shopData.name||'Shop');
        calculateShopDistance();
        
        // Load products (parallel)
        var pr = await sb.from('products')
            .select('id, name, price, offer_price, image_url, images, variants, weight, unit, weight_unit, stock, shop_id')
            .eq('shop_id', shopId)
            .eq('is_active', true)
            .eq('is_on_hold', false)
            .eq('delete_requested', false)
            .is('parent_id', null)
            .order('created_at', {ascending: false})
            .limit(20);
        
        shopProducts = (pr && pr.data) ? pr.data : [];
        
        // Load category info (for explore links)
        if (shopData.category) {
            categoryInfo = await findCategoryByName(shopData.category);
        }
        
        renderShop();
    } catch(e){
        console.error('[Shop Detail] Fatal error:', e);
        mc.innerHTML='<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>Failed to Load</h3><p style="color:#6B7280;font-size:12px;margin-top:8px;">'+esc(e.message||'Unknown error')+'</p><button onclick="location.reload()" style="margin-top:14px;background:var(--brand-green);color:white;border:none;padding:10px 20px;border-radius:20px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;">🔄 Retry</button></div>';
    }
}

function renderShop(){
    if(!shopData)return;
    var mc=getEl('mainContent');
    var shopImgUrl=shopData.image_url?getFullUrl(shopData.image_url, 200):'';
    var locShort=localStorage.getItem('location_short')||'';
    var html='';
    
    if(locShort)html+='<div class="location-bar" onclick="window.location.href=\'set-location.html\'"><i class="fas fa-map-marker-alt"></i><span>📍 '+esc(locShort)+'</span></div>';
    
    // Shop header
    html+='<div class="shop-header'+(isNearbyShop?' nearby':'')+'">';
    html+='<div class="shop-img">';
    if(shopImgUrl){html+='<img src="'+shopImgUrl+'" loading="lazy" decoding="async" alt="'+esc(shopData.name)+'">';}else{html+='<i class="fas fa-store"></i>';}
    html+='</div>';
    html+='<div class="shop-name">'+esc(shopData.name);if(isNearbyShop)html+=' <span class="nearby-tag">📍 Nearby</span>';html+='</div>';
    html+='<div class="shop-category">'+esc(shopData.category||'General Store')+'</div>';
    if(shopDistance!==null)html+='<div class="distance-tag">📏 '+shopDistance+' km from you</div>';
    
    html+='<div class="shop-meta-row">';
    html+='<span>'+getRatingDisplay(shopData.rating)+'</span>';
    html+='<span><i class="fas fa-map-pin"></i> '+esc(shopData.city||'Location')+'</span>';
    if(shopData.is_open)html+='<span class="open-badge"><i class="fas fa-circle"></i> Open</span>';
    else html+='<span style="color:#FECACA;"><i class="fas fa-circle"></i> Closed</span>';
    html+='</div></div>';
    
    // ═══ NEW: Explore section (Category shops link) ═══
    if (categoryInfo && categoryInfo.id) {
        var catName = shopData.category || categoryInfo.name || '';
        html += '<div class="explore-section">';
        
        // If parent category - can browse products too
        if (!categoryInfo.parent_id) {
            html += '<button class="explore-btn green" onclick="window.location.href=\'shop-categories.html?category_id=' + encodeURIComponent(categoryInfo.id) + '&category_name=' + encodeURIComponent(catName) + '\'">';
            html += '<i class="fas fa-shopping-bag"></i> Browse ' + esc(catName) + ' Products';
            html += '</button>';
        } else {
            html += '<button class="explore-btn green" onclick="window.location.href=\'shop-categories.html?sub_id=' + encodeURIComponent(categoryInfo.id) + '&sub_name=' + encodeURIComponent(catName) + '\'">';
            html += '<i class="fas fa-shopping-bag"></i> Browse ' + esc(catName) + ' Products';
            html += '</button>';
        }
        
        // Always show "Other shops in this category"
        html += '<button class="explore-btn" onclick="window.location.href=\'category-shops.html?id=' + encodeURIComponent(categoryInfo.id) + '&name=' + encodeURIComponent(catName) + '\'">';
        html += '<i class="fas fa-store"></i> Explore Other ' + esc(catName) + ' Shops';
        html += '</button>';
        
        html += '</div>';
    }
    
    // Shop info
    html+='<div class="section"><div class="section-title"><i class="fas fa-info-circle"></i> Shop Info</div>';
    html+='<div class="info-row"><span class="info-label">Phone</span><span class="info-value">'+esc(shopData.phone||shopData.owner_phone||'N/A')+'</span></div>';
    html+='<div class="info-row"><span class="info-label">City</span><span class="info-value">'+esc(shopData.city||'N/A')+'</span></div>';
    html+='<div class="info-row"><span class="info-label">Address</span><span class="info-value">'+esc(shopData.address||'N/A')+'</span></div>';
    html+='<div class="info-row"><span class="info-label">Pincode</span><span class="info-value">'+esc(shopData.pincode||'N/A')+'</span></div>';
    if(shopData.delivery_radius_km)html+='<div class="info-row"><span class="info-label">Delivery</span><span class="info-value">Up to '+shopData.delivery_radius_km+' km</span></div>';
    if(shopData.upi_id)html+='<div class="info-row"><span class="info-label">UPI ID</span><span class="info-value">'+esc(shopData.upi_id)+'</span></div>';
    html+='</div>';
    
    // Products
    html+='<div class="section"><div class="section-title"><i class="fas fa-shopping-bag"></i> Products ('+shopProducts.length+')</div>';
    if(shopProducts.length===0){
        html+='<p style="text-align:center;color:#6B7280;font-size:13px;padding:16px;">No products available in this shop yet</p>';
    } else {
        html+='<div class="products-grid">';
        for(var i=0;i<shopProducts.length;i++){
            var p=shopProducts[i];
            var img=getFullUrl((p.images&&p.images[0])||p.image_url||'', 250);
            html+='<div class="product-card" onclick="window.location.href=\'product-detail.html?id='+p.id+'\'">';
            html+='<div class="product-img">';
            if(img) html+='<img src="'+img+'" loading="lazy" decoding="async">';
            else html+='<i class="fas fa-box"></i>';
            html+='</div>';
            html+='<div class="product-info">';
            html+='<div class="product-name">'+esc(p.name)+'</div>';
            html+='<div class="product-price">₹'+((p.offer_price||p.price)||0).toLocaleString('en-IN')+'</div>';
            html+='</div></div>';
        }
        html+='</div>';
    }
    html+='</div>';
    
    // Contact buttons
    var phone = shopData.phone || shopData.owner_phone;
    if(phone)html+='<a href="tel:'+phone+'" class="contact-btn"><i class="fas fa-phone"></i> Call Now</a>';
    var wa=shopData.whatsapp||shopData.owner_whatsapp||phone;
    if(wa)html+='<a href="https://wa.me/91'+wa.replace(/^\+?91/,'').replace(/\s/g,'')+'" target="_blank" class="contact-btn whatsapp-btn"><i class="fab fa-whatsapp"></i> Chat on WhatsApp</a>';
    
    mc.innerHTML=html;
}

document.addEventListener('DOMContentLoaded', function() {
    if(!navigator.onLine){var nb=document.getElementById('netBanner');if(nb)nb.style.display='block';}
    loadShop();
});
})();
</script>
