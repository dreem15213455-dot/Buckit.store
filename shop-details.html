<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>दुकान विवरण - Zymart</title>
    <meta name="theme-color" content="#0B5A31">
    <meta name="description" content="Zymart - दुकान का पूरा विवरण देखें">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --brand-green: #0B5A31; --brand-green-light: #0F6E3B; --brand-green-dark: #083D21;
            --brand-orange: #F59E0B; --brand-orange-dark: #E8890A; --brand-orange-light: #FFB020;
            --brand-white: #F5F5F5;
            --neutral-white: #FFFFFF; --neutral-bg: #F9FAFB; --neutral-border: #E5E7EB;
            --neutral-gray: #6B7280; --neutral-dark: #1A1A1A;
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --radius-sm: 10px; --radius-md: 14px; --radius-lg: 18px; --radius-xl: 22px; --radius-full: 9999px;
            --ease-fast: cubic-bezier(0.4,0,0.2,1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--neutral-bg); color: var(--neutral-dark);
            padding-bottom: 30px; -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased; min-height: 100vh;
        }
        
        @keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        
        .top-bar { background: var(--brand-green); position: fixed; top: 0; left: 0; width: 100%; z-index: 100; padding: 10px 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 16px rgba(11,90,49,0.3); }
        .back-btn { width: 40px; height: 40px; min-width: 40px; background: rgba(255,255,255,0.10); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 15px; transition: all 0.15s ease; }
        .back-btn:active { background: rgba(255,255,255,0.22); transform: scale(0.93); }
        .top-title { font-family: 'Poppins', sans-serif; flex: 1; font-size: 16px; font-weight: 700; color: var(--brand-white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .main-content { padding-top: 62px; max-width: 600px; margin: 0 auto; }
        
        .shop-header { background: linear-gradient(135deg, var(--brand-green), var(--brand-green-dark)); margin: 12px 14px; padding: 24px 20px; border-radius: var(--radius-xl); color: white; text-align: center; animation: fadeInUp 0.3s ease; box-shadow: 0 4px 20px rgba(11,90,49,0.3); }
        .shop-img { width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.15); margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 3px solid rgba(255,255,255,0.25); }
        .shop-img img { width: 100%; height: 100%; object-fit: cover; }
        .shop-img i { font-size: 36px; }
        .shop-name { font-family: 'Poppins', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .shop-category { font-size: 13px; opacity: 0.85; background: rgba(255,255,255,0.15); display: inline-block; padding: 4px 14px; border-radius: var(--radius-full); }
        .shop-meta-row { display: flex; justify-content: center; gap: 20px; margin-top: 12px; font-size: 13px; }
        .shop-meta-row span { display: flex; align-items: center; gap: 5px; }
        .shop-meta-row .open-badge { color: #A7F3D0; }
        
        .section { background: var(--neutral-white); margin: 10px 14px; border-radius: var(--radius-lg); padding: 16px; border: 1px solid var(--neutral-border); box-shadow: var(--shadow-xs); animation: slideUp 0.3s ease; }
        .section-title { font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .section-title i { color: var(--brand-green); width: 18px; text-align: center; }
        
        .info-row { display: flex; padding: 8px 0; border-bottom: 1px solid var(--neutral-border); font-size: 13px; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: var(--neutral-gray); width: 80px; flex-shrink: 0; font-weight: 500; }
        .info-value { font-weight: 600; }
        
        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .product-card { background: var(--neutral-bg); border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--neutral-border); cursor: pointer; transition: transform 0.15s ease; }
        .product-card:active { transform: scale(0.96); }
        .product-img { width: 100%; aspect-ratio: 1/1; background: #E5E7EB; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .product-img img { width: 100%; height: 100%; object-fit: cover; }
        .product-img i { font-size: 36px; color: #9CA3AF; }
        .product-info { padding: 9px; }
        .product-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .product-price { font-size: 14px; font-weight: 700; color: var(--brand-green); }
        
        .contact-btn { display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; background: var(--brand-green); color: white; padding: 14px; border-radius: var(--radius-full); font-weight: 600; font-size: 14px; cursor: pointer; margin: 12px 14px; text-decoration: none; border: none; width: calc(100% - 28px); font-family: 'Inter', sans-serif; transition: all 0.15s ease; }
        .contact-btn:active { background: var(--brand-green-dark); transform: scale(0.97); }
        .whatsapp-btn { background: #25D366; }
        .whatsapp-btn:active { background: #1DA851; }
        
        .empty-state { text-align: center; padding: 55px 20px; animation: fadeInUp 0.3s ease; }
        .empty-state i { font-size: 48px; color: #D1D5DB; display: block; margin-bottom: 12px; }
        .empty-state h3 { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .empty-state p { font-size: 13px; color: var(--neutral-gray); }
        
        .loading-state { text-align: center; padding: 50px; }
        .spinner { width: 32px; height: 32px; border: 2.5px solid var(--neutral-border); border-top-color: var(--brand-orange); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto; }
        
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--neutral-dark); color: white; padding: 10px 20px; border-radius: var(--radius-full); font-size: 12px; z-index: 200; opacity: 0; visibility: hidden; white-space: nowrap; box-shadow: var(--shadow-md); transition: all 0.3s ease; }
        .toast.show { opacity: 1; visibility: visible; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="top-bar">
    <button class="back-btn" onclick="goBack()" aria-label="वापस"><i class="fas fa-arrow-left"></i></button>
    <span class="top-title" id="shopTitle">दुकान विवरण</span>
</div>

<div class="main-content" id="mainContent">
    <div class="loading-state"><div class="spinner"></div></div>
</div>

<div class="toast" id="toastMsg"></div>

<script>
(function() {
    'use strict';
    
    window.addEventListener('error', function(e) { try { console.error('[Zymart Crash]', e.message); } catch(ex) {} });
    window.addEventListener('unhandledrejection', function(e) { try { console.error('[Zymart Promise Crash]', e.reason); } catch(ex) {} e.preventDefault(); });
    function safeGetElement(id) { try { return document.getElementById(id); } catch(e) { return null; } }
    function escapeHTML(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
    
    var sb = null;
    try { sb = supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co', 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1'); }
    catch(e) { sb = { from: function() { return { select: function() { return { eq: function() { return { single: function() { return Promise.resolve({ data: null }); } }; } }; } }; } }; }
    
    var SUPABASE_URL = 'https://zwajyovemwdqtkecipeb.supabase.co';
    var shopData = null, shopProducts = [], shopId = null;
    
    try { shopId = new URLSearchParams(window.location.search).get('id'); } catch(e) { shopId = null; }
    
    function getFullUrl(u) { if (!u || typeof u !== 'string') return ''; if (u.indexOf('http')===0 || u.indexOf('data:')===0) return u; return SUPABASE_URL + '/storage/v1/object/public/' + u; }
    function showToast(m) { try { var t = safeGetElement('toastMsg'); if (!t) return; t.textContent = m; t.classList.add('show'); clearTimeout(t._timer); t._timer = setTimeout(function() { t.classList.remove('show'); }, 2200); } catch(ex) {} }
    function goBack() { try { if (document.referrer && document.referrer.indexOf(window.location.host) > -1) { window.history.back(); return; } } catch(e) {} window.location.href = 'all-shops.html'; }
    window.fastNavigate = function(url) { window.location.href = url; };
    
    async function loadShop() {
        var mc = safeGetElement('mainContent');
        if (!mc) return;
        
        if (!shopId) { mc.innerHTML = '<div class="empty-state"><i class="fas fa-store-slash"></i><h3>दुकान नहीं मिली</h3><p>कोई दुकान ID प्रदान नहीं की गई</p></div>'; return; }
        
        try {
            var r = await sb.from('shops').select('*').eq('id', shopId).single();
            if (r.error || !r.data) { mc.innerHTML = '<div class="empty-state"><i class="fas fa-store-slash"></i><h3>दुकान नहीं मिली</h3><p>यह दुकान मौजूद नहीं है</p></div>'; return; }
            
            shopData = r.data;
            var titleEl = safeGetElement('shopTitle');
            if (titleEl) titleEl.textContent = shopData.name || 'दुकान';
            
            try {
                var pr = await sb.from('products').select('*').eq('shop_id', shopId).eq('is_active', true).order('created_at', { ascending: false }).limit(20);
                shopProducts = pr.data || [];
            } catch(e) { shopProducts = []; }
            
            renderShop();
        } catch(e) { mc.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>लोड विफल</h3><p>कनेक्शन जांचें</p></div>'; }
    }
    
    function renderShop() {
        if (!shopData) return;
        var mc = safeGetElement('mainContent');
        if (!mc) return;
        
        var imgUrl = getFullUrl(shopData.image_url);
        var html = '';
        
        // Header
        html += '<div class="shop-header">';
        html += '<div class="shop-img">' + (imgUrl ? '<img src="' + imgUrl + '" loading="lazy" onerror="this.style.display=\'none\';this.parentElement.innerHTML=\'<i class=\\\'fas fa-store\\\'></i>\';" alt="">' : '<i class="fas fa-store"></i>') + '</div>';
        html += '<div class="shop-name">' + escapeHTML(shopData.name) + '</div>';
        html += '<div class="shop-category">' + escapeHTML(shopData.category || 'जनरल स्टोर') + '</div>';
        html += '<div class="shop-meta-row">';
        html += '<span><i class="fas fa-star"></i> ' + (shopData.rating || '4.0') + '</span>';
        html += '<span><i class="fas fa-map-pin"></i> ' + escapeHTML(shopData.city || 'स्थान') + '</span>';
        if (shopData.is_open) html += '<span class="open-badge"><i class="fas fa-circle"></i> खुला है</span>';
        else html += '<span style="color:#FECACA;"><i class="fas fa-circle"></i> बंद है</span>';
        html += '</div></div>';
        
        // Info
        html += '<div class="section"><div class="section-title"><i class="fas fa-info-circle"></i> दुकान की जानकारी</div>';
        html += '<div class="info-row"><span class="info-label">फ़ोन</span><span class="info-value">' + escapeHTML(shopData.phone || 'N/A') + '</span></div>';
        html += '<div class="info-row"><span class="info-label">WhatsApp</span><span class="info-value">' + escapeHTML(shopData.whatsapp || shopData.phone || 'N/A') + '</span></div>';
        html += '<div class="info-row"><span class="info-label">शहर</span><span class="info-value">' + escapeHTML(shopData.city || 'N/A') + '</span></div>';
        html += '<div class="info-row"><span class="info-label">पता</span><span class="info-value">' + escapeHTML(shopData.address || 'N/A') + '</span></div>';
        html += '<div class="info-row"><span class="info-label">पिनकोड</span><span class="info-value">' + escapeHTML(shopData.pincode || 'N/A') + '</span></div>';
        if (shopData.upi_id) html += '<div class="info-row"><span class="info-label">UPI ID</span><span class="info-value">' + escapeHTML(shopData.upi_id) + '</span></div>';
        html += '</div>';
        
        // Products
        html += '<div class="section"><div class="section-title"><i class="fas fa-shopping-bag"></i> प्रोडक्ट्स (' + shopProducts.length + ')</div>';
        if (shopProducts.length === 0) {
            html += '<p style="text-align:center;color:#6B7280;font-size:13px;padding:16px;">इस दुकान में अभी कोई प्रोडक्ट नहीं है</p>';
        } else {
            html += '<div class="products-grid">';
            for (var i = 0; i < shopProducts.length; i++) {
                var p = shopProducts[i], img = getFullUrl(p.images?.[0] || p.image_url || '');
                html += '<div class="product-card" onclick="fastNavigate(\'product-detail.html?id=' + p.id + '\')">';
                html += '<div class="product-img">' + (img ? '<img src="' + img + '" loading="lazy" onerror="this.style.display=\'none\';">' : '') + '<i class="fas fa-box"' + (img ? ' style="display:none;"' : '') + '></i></div>';
                html += '<div class="product-info"><div class="product-name">' + escapeHTML(p.name) + '</div><div class="product-price">₹' + (p.offer_price || p.price) + '</div></div></div>';
            }
            html += '</div>';
        }
        html += '</div>';
        
        // Contact buttons
        if (shopData.phone) {
            html += '<a href="tel:' + shopData.phone + '" class="contact-btn"><i class="fas fa-phone"></i> अभी कॉल करें</a>';
        }
        var whatsappNo = shopData.whatsapp || shopData.phone;
        if (whatsappNo) {
            var waNumber = whatsappNo.replace(/^\+?91/, '').replace(/\s/g, '');
            html += '<a href="https://wa.me/91' + waNumber + '" target="_blank" class="contact-btn whatsapp-btn"><i class="fab fa-whatsapp"></i> WhatsApp पर चैट करें</a>';
        }
        
        mc.innerHTML = html;
    }
    
    document.addEventListener('DOMContentLoaded', loadShop);
    window.goBack = goBack;
})();
</script>
</body>
</html>
