<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>दुकान विवरण - Zymart</title>
    <meta name="theme-color" content="#0B5A31">
    <meta name="description" content="Zymart - दुकान का पूरा विवरण देखें">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --brand-green: #0B5A31; --brand-green-light: #0F6E3B; --brand-green-dark: #083D21;
            --brand-orange: #F59E0B; --brand-orange-dark: #E8890A;
            --neutral-white: #FFFFFF; --neutral-bg: #F9FAFB; --neutral-border: #E5E7EB;
            --neutral-gray: #6B7280; --neutral-dark: #1A1A1A;
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --radius-sm: 10px; --radius-md: 14px; --radius-lg: 18px; --radius-xl: 22px; --radius-full: 9999px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--neutral-bg); color: var(--neutral-dark); padding-bottom: 30px; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; min-height: 100vh; }
        
        @keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        
        .top-bar { background: var(--brand-green); position: fixed; top: 0; left: 0; width: 100%; z-index: 100; padding: 10px 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 16px rgba(11,90,49,0.3); }
        .back-btn { width: 40px; height: 40px; min-width: 40px; background: rgba(255,255,255,0.10); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 15px; }
        .back-btn:active { background: rgba(255,255,255,0.22); transform: scale(0.93); }
        .top-title { font-family: 'Poppins', sans-serif; flex: 1; font-size: 16px; font-weight: 700; color: white; }
        .main-content { padding-top: 62px; max-width: 600px; margin: 0 auto; }
        
        /* 🔥 LOCATION BAR */
        .location-bar { display: flex; align-items: center; gap: 6px; padding: 8px 14px; background: #EDF7F1; border-bottom: 1px solid #C8E6C9; font-size: 11px; color: #0B5A31; cursor: pointer; }
        .location-bar span { font-weight: 600; }
        
        .shop-header { background: linear-gradient(135deg, var(--brand-green), var(--brand-green-dark)); margin: 12px 14px; padding: 24px 20px; border-radius: var(--radius-xl); color: white; text-align: center; animation: fadeInUp 0.3s ease; box-shadow: 0 4px 20px rgba(11,90,49,0.3); }
        .shop-header.nearby { border: 3px solid var(--brand-orange); }
        .shop-img { width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.15); margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 3px solid rgba(255,255,255,0.25); }
        .shop-img img { width: 100%; height: 100%; object-fit: cover; }
        .shop-img i { font-size: 36px; }
        .shop-name { font-family: 'Poppins', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .shop-category { font-size: 13px; opacity: 0.85; background: rgba(255,255,255,0.15); display: inline-block; padding: 4px 14px; border-radius: var(--radius-full); }
        .shop-meta-row { display: flex; justify-content: center; gap: 20px; margin-top: 12px; font-size: 13px; flex-wrap: wrap; }
        .shop-meta-row span { display: flex; align-items: center; gap: 5px; }
        .open-badge { color: #A7F3D0; }
        .nearby-tag { display: inline-block; background: var(--brand-orange); color: #1A1A1A; font-size: 10px; padding: 2px 10px; border-radius: 9999px; font-weight: 700; margin-left: 6px; }
        .distance-tag { display: inline-block; background: rgba(255,255,255,0.2); font-size: 12px; padding: 4px 12px; border-radius: 9999px; margin-top: 8px; }
        
        .section { background: var(--neutral-white); margin: 10px 14px; border-radius: var(--radius-lg); padding: 16px; border: 1px solid var(--neutral-border); box-shadow: var(--shadow-xs); animation: slideUp 0.3s ease; }
        .section-title { font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .section-title i { color: var(--brand-green); width: 18px; text-align: center; }
        
        .info-row { display: flex; padding: 8px 0; border-bottom: 1px solid var(--neutral-border); font-size: 13px; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: var(--neutral-gray); width: 80px; flex-shrink: 0; font-weight: 500; }
        .info-value { font-weight: 600; }
        
        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .product-card { background: var(--neutral-bg); border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--neutral-border); cursor: pointer; transition: transform 0.15s ease; }
        .product-card:active { transform: scale(0.96); }
        .product-img { width: 100%; aspect-ratio: 1/1; background: #E5E7EB; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .product-img img { width: 100%; height: 100%; object-fit: contain; padding: 8px; }
        .product-img i { font-size: 36px; color: #9CA3AF; }
        .product-info { padding: 9px; }
        .product-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .product-price { font-size: 14px; font-weight: 700; color: var(--brand-green); }
        
        .contact-btn { display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; background: var(--brand-green); color: white; padding: 14px; border-radius: var(--radius-full); font-weight: 600; font-size: 14px; cursor: pointer; margin: 12px 14px; text-decoration: none; border: none; width: calc(100% - 28px); font-family: 'Inter', sans-serif; }
        .contact-btn:active { background: var(--brand-green-dark); transform: scale(0.97); }
        .whatsapp-btn { background: #25D366; }
        .whatsapp-btn:active { background: #1DA851; }
        
        .empty-state { text-align: center; padding: 55px 20px; }
        .empty-state i { font-size: 48px; color: #D1D5DB; display: block; margin-bottom: 12px; }
        .empty-state h3 { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .empty-state p { font-size: 13px; color: var(--neutral-gray); }
        
        .loading-state { text-align: center; padding: 50px; }
        .spinner { width: 32px; height: 32px; border: 2.5px solid var(--neutral-border); border-top-color: var(--brand-orange); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto; }
        
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--neutral-dark); color: white; padding: 10px 20px; border-radius: var(--radius-full); font-size: 12px; z-index: 200; opacity: 0; visibility: hidden; white-space: nowrap; box-shadow: var(--shadow-md); transition: all 0.3s ease; }
        .toast.show { opacity: 1; visibility: visible; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="top-bar">
    <button class="back-btn" onclick="window.location.href='all-shops.html'"><i class="fas fa-arrow-left"></i></button>
    <span class="top-title" id="shopTitle">दुकान विवरण</span>
</div>

<div class="main-content" id="mainContent">
    <div class="loading-state"><div class="spinner"></div></div>
</div>

<div class="toast" id="toastMsg"></div>

<script>
(function() {
    'use strict';
    
    window.addEventListener('error', function(e) { console.error('[Shop Detail]', e.message); });
    window.addEventListener('unhandledrejection', function(e) { console.error('[Shop Detail]', e.reason); e.preventDefault(); });
    
    function getEl(id) { return document.getElementById(id); }
    function esc(str) { if (!str) return ''; var d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
    
    var sb = supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co', 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1');
    var SUPABASE_URL = 'https://zwajyovemwdqtkecipeb.supabase.co';
    
    var shopData = null, shopProducts = [], shopId = null;
    var shopDistance = null, isNearbyShop = false;
    try { shopId = new URLSearchParams(window.location.search).get('id'); } catch(e) { shopId = null; }
    
    function getFullUrl(u) { 
        if (!u || typeof u !== 'string') return ''; 
        if (u.indexOf('http')===0 || u.indexOf('data:')===0) return u; 
        if (u.indexOf('storage/v1/object/public/') !== -1) return SUPABASE_URL + '/' + u;
        return SUPABASE_URL + '/storage/v1/object/public/' + u;
    }
    
    function showToast(m) { var t = getEl('toastMsg'); if (!t) return; t.textContent = m; t.classList.add('show'); clearTimeout(t._timer); t._timer = setTimeout(function(){t.classList.remove('show');},2200); }
    
    // 🔥 HAVERSINE DISTANCE
    function calculateDistance(lat1, lng1, lat2, lng2) {
        var R = 6371;
        var dLat = (lat2 - lat1) * Math.PI / 180;
        var dLng = (lng2 - lng1) * Math.PI / 180;
        var a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLng/2) * Math.sin(dLng/2);
        var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }
    
    // 🔥 Calculate distance from user
    function calculateShopDistance() {
        if (!shopData || !shopData.latitude || !shopData.longitude) return;
        
        var userLat = parseFloat(localStorage.getItem('user_lat') || '0') || null;
        var userLng = parseFloat(localStorage.getItem('user_lng') || '0') || null;
        var ts = parseInt(localStorage.getItem('location_timestamp') || '0');
        
        if (!userLat || !userLng || (Date.now() - ts) > 86400000) return;
        
        shopDistance = Math.round(calculateDistance(userLat, userLng, shopData.latitude, shopData.longitude) * 10) / 10;
        isNearbyShop = shopDistance <= (shopData.delivery_radius_km || 10);
    }
    
    async function loadShop() {
        var mc = getEl('mainContent');
        if (!mc || !shopId) { if (mc) mc.innerHTML = '<div class="empty-state"><i class="fas fa-store-slash"></i><h3>दुकान नहीं मिली</h3></div>'; return; }
        
        try {
            var r = await sb.from('shops').select('*').eq('id', shopId).single();
            if (r.error || !r.data) { mc.innerHTML = '<div class="empty-state"><i class="fas fa-store-slash"></i><h3>दुकान नहीं मिली</h3></div>'; return; }
            
            shopData = r.data;
            getEl('shopTitle').textContent = shopData.name || 'दुकान';
            
            // 🔥 Calculate distance
            calculateShopDistance();
            
            try {
                var pr = await sb.from('products').select('*').eq('shop_id', shopId).eq('is_active', true).order('created_at', { ascending: false }).limit(20);
                shopProducts = pr.data || [];
            } catch(e) { shopProducts = []; }
            
            renderShop();
        } catch(e) { mc.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>लोड विफल</h3></div>'; }
    }
    
    function renderShop() {
        if (!shopData) return;
        var mc = getEl('mainContent');
        
        var shopImgUrl = '';
        if (shopData.image_url) {
            shopImgUrl = getFullUrl(shopData.image_url);
        }
        
        // 🔥 Location bar
        var locShort = localStorage.getItem('location_short') || '';
        var html = '';
        if (locShort) {
            html += '<div class="location-bar" onclick="window.location.href=\'location.html\'"><i class="fas fa-map-marker-alt"></i><span>📍 ' + locShort + '</span></div>';
        }
        
        // 🔥 Shop header with distance
        html += '<div class="shop-header' + (isNearbyShop ? ' nearby' : '') + '">';
        html += '<div class="shop-img">';
        if (shopImgUrl) {
            html += '<img src="' + shopImgUrl + '" loading="lazy" onerror="this.style.display=\'none\';this.parentElement.innerHTML=\'<i class=\\\'fas fa-store\\\'></i>\';" alt="' + esc(shopData.name) + '">';
        } else {
            html += '<i class="fas fa-store"></i>';
        }
        html += '</div>';
        html += '<div class="shop-name">' + esc(shopData.name);
        if (isNearbyShop) html += ' <span class="nearby-tag">📍 Nearby</span>';
        html += '</div>';
        html += '<div class="shop-category">' + esc(shopData.category || 'जनरल स्टोर') + '</div>';
        
        // 🔥 Distance display
        if (shopDistance !== null) {
            html += '<div class="distance-tag">📏 ' + shopDistance + ' km from you</div>';
        }
        
        html += '<div class="shop-meta-row">';
        html += '<span><i class="fas fa-star"></i> ' + (shopData.rating || '4.0') + '</span>';
        html += '<span><i class="fas fa-map-pin"></i> ' + esc(shopData.city || 'स्थान') + '</span>';
        if (shopData.is_open) html += '<span class="open-badge"><i class="fas fa-circle"></i> खुला है</span>';
        else html += '<span style="color:#FECACA;"><i class="fas fa-circle"></i> बंद है</span>';
        html += '</div></div>';
        
        html += '<div class="section"><div class="section-title"><i class="fas fa-info-circle"></i> दुकान की जानकारी</div>';
        html += '<div class="info-row"><span class="info-label">फ़ोन</span><span class="info-value">' + esc(shopData.phone || 'N/A') + '</span></div>';
        html += '<div class="info-row"><span class="info-label">शहर</span><span class="info-value">' + esc(shopData.city || 'N/A') + '</span></div>';
        html += '<div class="info-row"><span class="info-label">पता</span><span class="info-value">' + esc(shopData.address || 'N/A') + '</span></div>';
        html += '<div class="info-row"><span class="info-label">पिनकोड</span><span class="info-value">' + esc(shopData.pincode || 'N/A') + '</span></div>';
        if (shopData.delivery_radius_km) html += '<div class="info-row"><span class="info-label">डिलीवरी</span><span class="info-value">' + shopData.delivery_radius_km + ' km तक</span></div>';
        if (shopData.upi_id) html += '<div class="info-row"><span class="info-label">UPI ID</span><span class="info-value">' + esc(shopData.upi_id) + '</span></div>';
        html += '</div>';
        
        html += '<div class="section"><div class="section-title"><i class="fas fa-shopping-bag"></i> प्रोडक्ट्स (' + shopProducts.length + ')</div>';
        if (shopProducts.length === 0) {
            html += '<p style="text-align:center;color:#6B7280;font-size:13px;padding:16px;">इस दुकान में अभी कोई प्रोडक्ट नहीं है</p>';
        } else {
            html += '<div class="products-grid">';
            for (var i = 0; i < shopProducts.length; i++) {
                var p = shopProducts[i], img = getFullUrl((p.images && p.images[0]) || p.image_url || '');
                html += '<div class="product-card" onclick="window.location.href=\'product-detail.html?id=' + p.id + '\'">';
                html += '<div class="product-img">' + (img ? '<img src="' + img + '" loading="lazy" onerror="this.parentElement.innerHTML=\'<i class=\\\'fas fa-box\\\'></i>\';">' : '<i class="fas fa-box"></i>') + '</div>';
                html += '<div class="product-info"><div class="product-name">' + esc(p.name) + '</div><div class="product-price">₹' + ((p.offer_price || p.price) || 0).toLocaleString('en-IN') + '</div></div></div>';
            }
            html += '</div>';
        }
        html += '</div>';
        
        if (shopData.phone) html += '<a href="tel:' + shopData.phone + '" class="contact-btn"><i class="fas fa-phone"></i> अभी कॉल करें</a>';
        var wa = shopData.whatsapp || shopData.phone;
        if (wa) html += '<a href="https://wa.me/91' + wa.replace(/^\+?91/, '').replace(/\s/g, '') + '" target="_blank" class="contact-btn whatsapp-btn"><i class="fab fa-whatsapp"></i> WhatsApp पर चैट करें</a>';
        
        mc.innerHTML = html;
    }
    
    document.addEventListener('DOMContentLoaded', loadShop);
})();
</script>
</body>
</html>
