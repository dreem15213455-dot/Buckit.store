<script>
(function(){'use strict';
window.addEventListener('error',function(e){console.error('[Shop Detail]',e.message);});
window.addEventListener('offline',function(){var b=document.getElementById('netBanner');if(b)b.style.display='block';});
window.addEventListener('online',function(){var b=document.getElementById('netBanner');if(b)b.style.display='none';});

var IMG_FALLBACK = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="#F3F4F6" width="100" height="100"/><circle cx="50" cy="42" r="13" fill="#D1D5DB"/><rect x="34" y="60" width="32" height="7" rx="3.5" fill="#D1D5DB"/></svg>');
window.addEventListener('error', function(e) {
    var el = e.target;
    if (el && el.tagName === 'IMG' && !el.dataset.fb) {
        el.dataset.fb = '1'; el.onerror = null; el.src = IMG_FALLBACK;
    }
}, true);

var CONFIG = {
    SUPABASE_URL: 'https://zwajyovemwdqtkecipeb.supabase.co',
    SUPABASE_KEY: 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1',
    CLOUDINARY_CLOUD_NAME: 'b0zm0rac',
    CLOUDINARY_ENABLED: true,
    PAGE_SIZE: 20
};

function getEl(id){return document.getElementById(id);}
function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function attrEsc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

var sb=supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
var SUPABASE_URL = CONFIG.SUPABASE_URL;
var shopData=null, shopProducts=[], shopId=null, shopDistance=null, isNearbyShop=false;
var categoryInfo=null;
var totalProductCount=0, currentPage=0, allProductsLoaded=false;
var shopReviews=[], avgRating=0, totalReviews=0;
var isShopOpenNow=false;
var deliverySettings=null;

// ✅ NEW: Service availability checks
var isServiceAvailable = false;
var unavailableReason = '';

try{shopId=new URLSearchParams(window.location.search).get('id');}catch(e){shopId=null;}

window.goBack = function() {
    try {
        if (document.referrer && document.referrer.indexOf(location.host) !== -1) history.back();
        else window.location.href = 'all-shops.html';
    } catch(e) { window.location.href = 'all-shops.html'; }
};

function getFullUrl(u, width){
    if(!u || typeof u !== 'string') return '';
    var fullUrl;
    if(u.indexOf('http')===0 || u.indexOf('data:')===0) fullUrl = u;
    else fullUrl = SUPABASE_URL + '/storage/v1/object/public/' + u;
    if(fullUrl.indexOf('res.cloudinary.com')===0) return fullUrl;
    if(!CONFIG.CLOUDINARY_ENABLED) return fullUrl;
    var w = width || 200;
    return 'https://res.cloudinary.com/' + CONFIG.CLOUDINARY_CLOUD_NAME + '/image/fetch/w_' + w + ',q_auto,f_auto/' + fullUrl;
}

function showToast(m, type){var t=getEl('toastMsg');if(!t)return;t.textContent=m;t.className='toast';if(type)t.classList.add(type);t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show','success','error');},2200);}

function calculateDistance(lat1,lng1,lat2,lng2){var R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180,a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}

function calculateShopDistance(){
    if(!shopData||!shopData.latitude||!shopData.longitude)return;
    var ul=parseFloat(localStorage.getItem('user_lat')||'0')||null,un=parseFloat(localStorage.getItem('user_lng')||'0')||null,ts=parseInt(localStorage.getItem('location_timestamp')||'0');
    if(!ul||!un||(Date.now()-ts)>86400000)return;
    shopDistance=Math.round(calculateDistance(ul,un,shopData.latitude,shopData.longitude)*10)/10;
    isNearbyShop=shopDistance<=(shopData.delivery_radius_km||10);
}

// ✅ NEW: Core Service Availability Logic (Taluka + Radius + GPS + Shop Open)
function checkServiceAvailability() {
    isServiceAvailable = false;
    unavailableReason = '';

    // 1. GPS Check
    var uLat = parseFloat(localStorage.getItem('user_lat') || '0');
    var uLng = parseFloat(localStorage.getItem('user_lng') || '0');
    if (!uLat || !uLng || uLat === 0 || uLng === 0) {
        unavailableReason = 'no_location';
        return;
    }

    // 2. Taluka Check
    var userTaluka = (localStorage.getItem('user_taluka') || 'Sillod').trim().toLowerCase();
    var shopTaluka = (shopData.taluka || shopData.city || '').trim().toLowerCase();
    if (shopTaluka && userTaluka !== shopTaluka) {
        unavailableReason = 'out_of_taluka';
        return;
    }

    // 3. Radius Check
    if (shopDistance !== null) {
        var maxRadius = parseFloat(shopData.delivery_radius_km) || 5;
        if (shopDistance > maxRadius) {
            unavailableReason = 'out_of_radius';
            return;
        }
    } else {
        unavailableReason = 'out_of_radius';
        return;
    }

    // 4. Shop Open Check
    if (!isShopOpenNow) {
        unavailableReason = 'shop_closed';
        return;
    }

    // Sab pass ho gaya toh:
    isServiceAvailable = true;
}

async function checkShopOpenNow() {
    try {
        var cached = null;
        try {
            var raw = localStorage.getItem('zymart_ds_shop_cache');
            if (raw) {
                var p = JSON.parse(raw);
                if (p.t && (Date.now() - p.t < 3600000)) cached = p.d;
            }
        } catch(e) {}
        
        if (!cached) {
            var r = await sb.from('delivery_settings')
                .select('opening_time, closing_time, is_open, is_holiday, holiday_date')
                .order('updated_at', {ascending: false})
                .limit(1)
                .maybeSingle();
            if (r && r.data) {
                cached = r.data;
                try { localStorage.setItem('zymart_ds_shop_cache', JSON.stringify({t: Date.now(), d: r.data})); } catch(e) {}
            }
        }
        
        deliverySettings = cached || { opening_time: '08:00:00', closing_time: '20:00:00', is_open: true, is_holiday: false };
        
        if (shopData.is_open === false) { isShopOpenNow = false; return; }
        
        if (deliverySettings.is_holiday === true) {
            var today = new Date().toISOString().split('T')[0];
            if (deliverySettings.holiday_date === today) { isShopOpenNow = false; return; }
        }
        
        if (deliverySettings.is_open === false) { isShopOpenNow = false; return; }
        
        var now = new Date();
        var cm = now.getHours() * 60 + now.getMinutes();
        var s = (deliverySettings.opening_time || '08:00:00').substring(0,5).split(':');
        var e = (deliverySettings.closing_time || '20:00:00').substring(0,5).split(':');
        var startMins = parseInt(s[0]) * 60 + parseInt(s[1]);
        var endMins = parseInt(e[0]) * 60 + parseInt(e[1]);
        isShopOpenNow = (cm >= startMins && cm <= endMins);
    } catch(e) {
        isShopOpenNow = shopData.is_open !== false;
    }
}

function getRatingDisplay(rating) {
    var r = parseFloat(rating) || 0;
    if (r <= 0) return '<span style="opacity:0.75;">🆕 New Partner</span>';
    return '<i class="fas fa-star" style="color:#FDE047;"></i> ' + r.toFixed(1);
}

async function findCategoryByName(catName) {
    if (!catName || !catName.trim()) return null;
    var name = catName.trim();
    try {
        var r = await sb.from('categories').select('id, name, parent_id').eq('name', name).eq('is_active', true).limit(1).maybeSingle();
        if (r && r.data) return r.data;
        var r2 = await sb.from('categories').select('id, name, parent_id').ilike('name', name).eq('is_active', true).limit(1).maybeSingle();
        if (r2 && r2.data) return r2.data;
        return null;
    } catch(e) { return null; }
}

async function fetchTotalProductCount() {
    try {
        var r = await sb.from('products')
            .select('id', { count: 'exact', head: true })
            .eq('shop_id', shopId)
            .eq('is_active', true)
            .eq('is_on_hold', false)
            .eq('delete_requested', false)
            .is('parent_id', null);
        totalProductCount = (r && r.count) ? r.count : 0;
    } catch(e) { totalProductCount = 0; }
}

async function fetchProductsPage(page) {
    var from = page * CONFIG.PAGE_SIZE;
    var to = from + CONFIG.PAGE_SIZE - 1;
    var r = await sb.from('products')
        .select('id, name, price, offer_price, image_url, images, variants, weight, unit, weight_unit, stock, shop_id, is_offer')
        .eq('shop_id', shopId)
        .eq('is_active', true)
        .eq('is_on_hold', false)
        .eq('delete_requested', false)
        .is('parent_id', null)
        .order('created_at', {ascending: false})
        .range(from, to);
    return (r && r.data) ? r.data : [];
}

async function fetchShopReviews() {
    try {
        var r = await sb.from('shop_reviews')
            .select('id, rating, review_text, user_id, created_at, review_images')
            .eq('shop_id', shopId)
            .order('created_at', {ascending: false})
            .limit(5);
        
        if (r && r.data && r.data.length > 0) {
            shopReviews = r.data;
        } else {
            shopReviews = [];
        }
        
        var cr = await sb.from('shop_reviews')
            .select('rating', { count: 'exact' })
            .eq('shop_id', shopId);
        
        if (cr && cr.data && cr.data.length > 0) {
            totalReviews = cr.count || cr.data.length;
            var sum = 0;
            cr.data.forEach(function(rv) { sum += parseFloat(rv.rating) || 0; });
            avgRating = totalReviews > 0 ? (sum / cr.data.length) : 0;
        } else {
            totalReviews = 0;
            avgRating = parseFloat(shopData.rating) || 0;
        }
        
        if (shopReviews.length > 0) {
            var userIds = [];
            shopReviews.forEach(function(rv) { if (rv.user_id && userIds.indexOf(rv.user_id) === -1) userIds.push(rv.user_id); });
            if (userIds.length > 0) {
                try {
                    var ur = await sb.from('users').select('id, name, phone').in('id', userIds);
                    if (ur && ur.data) {
                        var userMap = {};
                        ur.data.forEach(function(u) { userMap[u.id] = u; });
                        shopReviews.forEach(function(rv) {
                            var u = userMap[rv.user_id] || {};
                            rv._userName = u.name || '';
                            rv._userPhone = u.phone || '';
                        });
                    }
                } catch(e) {}
            }
        }
    } catch(e) {
        console.warn('[Shop Detail] Reviews fetch error:', e.message);
        shopReviews = [];
        totalReviews = 0;
        avgRating = parseFloat(shopData.rating) || 0;
    }
}

function getInitials(name, phone) {
    var src = (name || phone || 'C').trim();
    if (!src) return 'C';
    var parts = src.split(/\s+/);
    if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
    return src.substring(0, 2).toUpperCase();
}

function getReviewerDisplayName(rv) {
    if (rv._userName) {
        var parts = rv._userName.trim().split(/\s+/);
        if (parts.length >= 2) return parts[0] + ' ' + parts[parts.length - 1][0].toUpperCase() + '.';
        return rv._userName;
    }
    if (rv._userPhone) {
        var ph = String(rv._userPhone).replace(/\D/g, '');
        if (ph.length >= 10) return 'User ' + ph.slice(-4);
    }
    return 'Verified Buyer';
}

function formatReviewDate(iso) {
    if (!iso) return '';
    try {
        var d = new Date(iso);
        var diff = Date.now() - d.getTime();
        var days = Math.floor(diff / 86400000);
        if (days === 0) return 'Today';
        if (days === 1) return 'Yesterday';
        if (days < 7) return days + ' days ago';
        if (days < 30) return Math.floor(days / 7) + ' weeks ago';
        if (days < 365) return Math.floor(days / 30) + ' months ago';
        return Math.floor(days / 365) + ' years ago';
    } catch(e) { return ''; }
}

function getStarString(rating) {
    var r = Math.round(rating);
    var s = '';
    for (var i = 1; i <= 5; i++) s += i <= r ? '★' : '☆';
    return s;
}

async function loadShop(){
    var mc=getEl('mainContent');
    if(!mc)return;
    if(!shopId){
        mc.innerHTML='<div class="empty-state"><i class="fas fa-store-slash"></i><h3>Partner ID Missing</h3><p style="color:#6B7280;font-size:12px;margin-top:8px;">URL mein ?id= parameter nahi hai</p></div>';
        return;
    }
    
    try{
        var r = await sb.from('shops').select('*').eq('id', shopId).maybeSingle();
        if(!r || !r.data){
            mc.innerHTML='<div class="empty-state"><i class="fas fa-store-slash"></i><h3>Partner Not Found</h3><p style="color:#6B7280;font-size:12px;margin-top:8px;">Ye partner exist nahi karta</p><button onclick="window.location.href=\'all-shops.html\'" style="margin-top:14px;background:var(--brand-green);color:white;border:none;padding:10px 20px;border-radius:20px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;">← All Partners</button></div>';
            return;
        }
        shopData=r.data;
        
        getEl('shopTitle').innerHTML='<span class="brand-zy">Zy</span><span class="brand-mart">Mart</span> '+esc(shopData.name||'Partner');
        calculateShopDistance();
        
        var promises = [
            checkShopOpenNow(),
            fetchTotalProductCount(),
            fetchProductsPage(0),
            fetchShopReviews()
        ];
        if (shopData.category) promises.push(findCategoryByName(shopData.category));
        else promises.push(Promise.resolve(null));
        
        var results = await Promise.all(promises);
        shopProducts = results[2] || [];
        categoryInfo = results[4] || null;
        currentPage = 0;
        allProductsLoaded = shopProducts.length >= totalProductCount;
        
        // ✅ NEW: Service Availability check AFTER all data is loaded
        checkServiceAvailability();
        
        renderShop();
    } catch(e){
        console.error('[Shop Detail] Fatal error:', e);
        mc.innerHTML='<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>Failed to Load</h3><p style="color:#6B7280;font-size:12px;margin-top:8px;">'+esc(e.message||'Unknown error')+'</p><button onclick="location.reload()" style="margin-top:14px;background:var(--brand-green);color:white;border:none;padding:10px 20px;border-radius:20px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;">🔄 Retry</button></div>';
    }
}

function renderShop(){
    if(!shopData)return;
    var mc=getEl('mainContent');
    var shopImgUrl=shopData.image_url?getFullUrl(shopData.image_url, 200):'';
    var locShort=localStorage.getItem('location_short')||'';
    var html='';
    
    // ✅ NEW: View-Only Banner
    if (!isServiceAvailable) {
        var bannerText = '';
        var bannerColor = '';
        var bannerIcon = 'fa-info-circle';
        
        if (unavailableReason === 'no_location') {
            bannerText = 'Location missing. Please enable GPS to check availability and place order.';
            bannerColor = 'background:#FEF3C7;color:#92400E;border:1px solid #FDE68A;';
        } else if (unavailableReason === 'out_of_taluka') {
            bannerText = 'This partner is outside your service area. You can browse products but cannot order.';
            bannerColor = 'background:#FEF2F2;color:#991B1B;border:1px solid #FECACA;';
            bannerIcon = 'fa-map-marker-slash';
        } else if (unavailableReason === 'out_of_radius') {
            bannerText = 'This partner does not deliver to your location (out of delivery radius).';
            bannerColor = 'background:#FEF2F2;color:#991B1B;border:1px solid #FECACA;';
            bannerIcon = 'fa-map-marker-slash';
        } else if (unavailableReason === 'shop_closed') {
            bannerText = 'This partner is currently closed. You can browse but cannot order right now.';
            bannerColor = 'background:#FEF3C7;color:#92400E;border:1px solid #FDE68A;';
            bannerIcon = 'fa-clock';
        }
        
        html += '<div class="view-only-banner" style="' + bannerColor + '">';
        html += '<i class="fas ' + bannerIcon + '"></i>';
        html += '<div class="vb-text">' + bannerText + '</div>';
        html += '</div>';
    }
    
    if(locShort)html+='<div class="location-bar" onclick="window.location.href=\'set-location.html\'"><i class="fas fa-map-marker-alt"></i><span>📍 '+esc(locShort)+'</span></div>';
    
    html+='<div class="shop-header'+(isNearbyShop?' nearby':'')+'">';
    html+='<div class="shop-img">';
    if(shopImgUrl){html+='<img src="'+attrEsc(shopImgUrl)+'" loading="lazy" decoding="async" alt="'+attrEsc(shopData.name)+'">';}else{html+='<i class="fas fa-store"></i>';}
    html+='</div>';
    html+='<div class="shop-name">'+esc(shopData.name);if(isNearbyShop)html+=' <span class="nearby-tag">📍 Nearby</span>';html+='</div>';
    html+='<div class="shop-category">'+esc(shopData.category||'General Store')+'</div>';
    if(shopDistance!==null)html+='<div class="distance-tag">📏 '+shopDistance+' km from you</div>';
    
    html+='<div class="shop-meta-row">';
    html+='<span>'+getRatingDisplay(avgRating > 0 ? avgRating : shopData.rating)+'</span>';
    html+='<span><i class="fas fa-map-pin"></i> '+esc(shopData.city||'Location')+'</span>';
    if(isShopOpenNow)html+='<span class="open-badge"><i class="fas fa-circle"></i> Open Now</span>';
    else html+='<span class="closed-badge"><i class="fas fa-circle"></i> Closed</span>';
    html+='</div></div>';
    
    if (totalProductCount > 0) {
        // ✅ NEW: Disable CTA if not serviceable
        if (isServiceAvailable) {
            html += '<button class="shop-now-cta" onclick="scrollToProducts()"><i class="fas fa-shopping-bag"></i> Order Now (' + totalProductCount + ' Products)</button>';
        } else {
            html += '<button class="shop-now-cta" disabled><i class="fas fa-lock"></i> Ordering Not Available</button>';
        }
    }
    
    if (categoryInfo && categoryInfo.id) {
        var catName = shopData.category || categoryInfo.name || '';
        html += '<div class="explore-section">';
        if (!categoryInfo.parent_id) {
            html += '<button class="explore-btn green" onclick="window.location.href=\'shop-categories.html?category_id=' + encodeURIComponent(categoryInfo.id) + '&category_name=' + encodeURIComponent(catName) + '\'"><i class="fas fa-shopping-bag"></i> Browse ' + esc(catName) + ' Products</button>';
        } else {
            html += '<button class="explore-btn green" onclick="window.location.href=\'shop-categories.html?sub_id=' + encodeURIComponent(categoryInfo.id) + '&sub_name=' + encodeURIComponent(catName) + '\'"><i class="fas fa-shopping-bag"></i> Browse ' + esc(catName) + ' Products</button>';
        }
        html += '<button class="explore-btn" onclick="window.location.href=\'category-shops.html?id=' + encodeURIComponent(categoryInfo.id) + '&name=' + encodeURIComponent(catName) + '\'"><i class="fas fa-store"></i> Explore Other ' + esc(catName) + ' Partners</button>';
        html += '</div>';
    }
    
    // ✅ FIX: Phone row REMOVED from Partner Info
    html+='<div class="section"><div class="section-title"><span><i class="fas fa-info-circle"></i> Partner Info</span></div>';
    html+='<div class="info-row"><span class="info-label">City</span><span class="info-value">'+esc(shopData.city||'N/A')+'</span></div>';
    html+='<div class="info-row"><span class="info-label">Address</span><span class="info-value">'+esc(shopData.address||'N/A')+'</span></div>';
    html+='<div class="info-row"><span class="info-label">Pincode</span><span class="info-value">'+esc(shopData.pincode||'N/A')+'</span></div>';
    if(shopData.delivery_radius_km)html+='<div class="info-row"><span class="info-label">Delivery</span><span class="info-value">Up to '+shopData.delivery_radius_km+' km</span></div>';
    if(shopData.upi_id)html+='<div class="info-row"><span class="info-label">UPI ID</span><span class="info-value">'+esc(shopData.upi_id)+'</span></div>';
    html+='</div>';
    
    html+='<div class="section" id="productsSection"><div class="section-title"><span><i class="fas fa-shopping-bag"></i> Products</span><span class="count-badge">'+totalProductCount+' total</span></div>';
    if(shopProducts.length===0){
        html+='<p style="text-align:center;color:#6B7280;font-size:13px;padding:16px;">No products available in this partner yet</p>';
    } else {
        html+='<div class="products-grid" id="productsGrid">';
        for(var i=0;i<shopProducts.length;i++){
            html += renderProductCard(shopProducts[i]);
        }
        html+='</div>';
        html+='<div id="loadMoreContainer">';
        if (!allProductsLoaded) {
            html += '<button class="load-more-btn" id="loadMoreBtn" onclick="loadMoreProducts()">⬇️ Load More (' + shopProducts.length + ' of ' + totalProductCount + ')</button>';
        } else if (totalProductCount > CONFIG.PAGE_SIZE) {
            html += '<div class="products-end-note">✓ All ' + totalProductCount + ' products loaded</div>';
        }
        html+='</div>';
    }
    html+='</div>';
    
    html += '<div class="section"><div class="section-title"><span><i class="fas fa-star"></i> Customer Reviews</span>';
    if (totalReviews > 0) html += '<span class="count-badge">' + totalReviews + ' total</span>';
    html += '</div>';
    
    if (totalReviews === 0 && shopReviews.length === 0) {
        html += '<div class="no-reviews-msg"><i class="fas fa-star"></i><div><strong>No reviews yet</strong></div><div style="margin-top:4px;">Be the first to review this partner after ordering!</div></div>';
    } else {
        if (avgRating > 0) {
            html += '<div class="reviews-avg-block">';
            html += '<div class="reviews-avg-num">' + avgRating.toFixed(1) + '</div>';
            html += '<div class="reviews-avg-info">';
            html += '<div class="reviews-avg-stars">' + getStarString(avgRating) + '</div>';
            html += '<div class="reviews-avg-count">Based on ' + totalReviews + ' review' + (totalReviews !== 1 ? 's' : '') + '</div>';
            html += '</div></div>';
        }
        
        if (shopReviews.length > 0) {
            shopReviews.forEach(function(rv) {
                var rating = parseInt(rv.rating) || 0;
                html += '<div class="review-card">';
                html += '<div class="review-user-row">';
                html += '<div class="review-avatar">' + esc(getInitials(rv._userName, rv._userPhone)) + '</div>';
                html += '<div class="review-user-info">';
                html += '<div class="review-user-name">' + esc(getReviewerDisplayName(rv)) + ' <span class="review-verified">✓ Verified</span></div>';
                html += '<div class="review-date">' + formatReviewDate(rv.created_at) + '</div>';
                html += '</div></div>';
                html += '<div class="review-stars">' + getStarString(rating) + '</div>';
                if (rv.review_text) html += '<div class="review-text">' + esc(rv.review_text) + '</div>';
                html += '</div>';
            });
            
            if (totalReviews > 5) {
                html += '<div style="text-align:center;padding:10px;font-size:11px;color:#6B7280;">Showing 5 of ' + totalReviews + ' reviews</div>';
            }
        }
    }
    html += '</div>';
    
    // ✅ FIX: Call and WhatsApp buttons REMOVED completely
    mc.innerHTML=html;
}

// ✅ FIX: Product Card now considers isServiceAvailable
function renderProductCard(p) {
    var img = getFullUrl((p.images && p.images[0]) || p.image_url || '', 250);
    var price = parseFloat(p.offer_price || p.price) || 0;
    var isOffer = p.is_offer === true;
    var stock = parseInt(p.stock) || 0;
    var variants = [];
    try { variants = typeof p.variants === 'string' ? JSON.parse(p.variants) : (p.variants || []); } catch(e) {}
    
    var isSimple = (variants.length === 0);
    
    // ✅ FIX: Quick Add requires service availability AND shop open AND stock > 0
    var canQuickAdd = isSimple && stock > 0 && isShopOpenNow && isServiceAvailable;
    
    var h = '<div class="product-card" data-pid="' + attrEsc(p.id) + '">';
    if (isOffer) h += '<span class="product-offer-badge">🎁 OFFER</span>';
    h += '<div class="product-img" onclick="window.location.href=\'product-detail.html?id=' + encodeURIComponent(p.id) + '\'">';
    if (img) h += '<img src="' + attrEsc(img) + '" loading="lazy" decoding="async" alt="' + attrEsc(p.name) + '">';
    else h += '<i class="fas fa-box"></i>';
    h += '</div>';
    h += '<div class="product-info">';
    h += '<div class="product-name" onclick="window.location.href=\'product-detail.html?id=' + encodeURIComponent(p.id) + '\'">' + esc(p.name) + '</div>';
    h += '<div class="product-price-row">';
    h += '<span class="product-price">₹' + price.toLocaleString('en-IN') + '</span>';
    
    if (canQuickAdd) {
        h += '<button class="product-add-btn" onclick="event.stopPropagation();quickAdd(\'' + attrEsc(p.id) + '\',\'' + attrEsc(p.name) + '\',' + price + ',\'' + attrEsc(img) + '\',\'' + attrEsc(p.shop_id || '') + '\',\'' + attrEsc(shopData.name || '') + '\')">+</button>';
    } else if (!isSimple) {
        h += '<button class="product-add-btn" onclick="event.stopPropagation();window.location.href=\'product-detail.html?id=' + encodeURIComponent(p.id) + '\'" style="background:var(--brand-orange);color:#1a1a1a;font-size:10px;">Select</button>';
    } else if (stock <= 0) {
        h += '<button class="product-add-btn" disabled>✕</button>';
    } else if (!isShopOpenNow) {
        h += '<button class="product-add-btn" disabled>🔒</button>';
    } else if (!isServiceAvailable) {
        // ✅ NEW: Blocked due to location/taluka/radius
        h += '<button class="product-add-btn" disabled>📍</button>';
    }
    
    h += '</div></div></div>';
    return h;
}

window.scrollToProducts = function() {
    var el = getEl('productsSection');
    if (el) {
        var topBar = document.querySelector('.top-bar');
        var offset = topBar ? topBar.offsetHeight + 10 : 70;
        var y = el.getBoundingClientRect().top + window.pageYOffset - offset;
        window.scrollTo({top: y, behavior: 'smooth'});
    }
};

window.loadMoreProducts = async function() {
    var btn = getEl('loadMoreBtn');
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Loading...'; }
    try {
        currentPage++;
        var newProducts = await fetchProductsPage(currentPage);
        if (newProducts.length === 0) {
            allProductsLoaded = true;
        } else {
            shopProducts = shopProducts.concat(newProducts);
            if (shopProducts.length >= totalProductCount) allProductsLoaded = true;
        }
        
        var grid = getEl('productsGrid');
        if (grid) {
            for (var i = 0; i < newProducts.length; i++) {
                grid.insertAdjacentHTML('beforeend', renderProductCard(newProducts[i]));
            }
        }
        
        var cont = getEl('loadMoreContainer');
        if (cont) {
            if (!allProductsLoaded) {
                cont.innerHTML = '<button class="load-more-btn" id="loadMoreBtn" onclick="loadMoreProducts()">⬇️ Load More (' + shopProducts.length + ' of ' + totalProductCount + ')</button>';
            } else {
                cont.innerHTML = '<div class="products-end-note">✓ All ' + totalProductCount + ' products loaded</div>';
            }
        }
    } catch(e) {
        console.error('[Shop Detail] Load more error:', e);
        if (btn) { btn.disabled = false; btn.textContent = '⬇️ Load More (Retry)'; }
    }
};

window.quickAdd = function(pid, pname, price, pimg, shopId, shopName) {
    // ✅ NEW: Full Service Availability check
    if (!isServiceAvailable) {
        var msg = 'Ordering not available';
        if (unavailableReason === 'no_location') msg = '📍 Please enable location to order';
        else if (unavailableReason === 'out_of_taluka') msg = '📍 Different taluka — cannot order';
        else if (unavailableReason === 'out_of_radius') msg = '📍 Out of delivery radius';
        else if (unavailableReason === 'shop_closed') msg = '🔒 Partner is closed';
        showToast(msg, 'error');
        return;
    }
    
    try {
        var cart = JSON.parse(localStorage.getItem('zymart_cart') || '[]');
        var variantKey = pid + '__default__';
        var existing = cart.find(function(item) { return item.id === pid && item.variantKey === variantKey; });
        if (existing) {
            existing.quantity = (existing.quantity || 1) + 1;
        } else {
            cart.push({
                id: pid,
                variantKey: variantKey,
                cartKey: variantKey,
                name: pname,
                price: price,
                image: pimg,
                shop_id: shopId,
                shop_name: shopName,
                quantity: 1
            });
        }
        localStorage.setItem('zymart_cart', JSON.stringify(cart));
        showToast('🛒 Added to cart!', 'success');
    } catch(e) {
        console.error('[Quick Add]', e);
        showToast('❌ Failed to add', 'error');
    }
};

document.addEventListener('DOMContentLoaded', function() {
    if(!navigator.onLine){var nb=document.getElementById('netBanner');if(nb)nb.style.display='block';}
    loadShop();
});
})();
