<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Shop Details - Zatpat</title>
    <meta name="theme-color" content="#16A34A">
    
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #16A34A;
            --primary-light: #22C55E;
            --primary-bg-light: #F0FDF4;
            --accent-orange: #F97316;
            --bg-white: #FFFFFF;
            --bg-light: #F9FAFB;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --border-light: #E5E7EB;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-full: 9999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
            overflow-x: hidden;
            padding-bottom: 85px;
            -webkit-font-smoothing: antialiased;
        }

        #pageProgress {
            position: fixed; top: 0; left: 0; width: 0%; height: 3px;
            background: var(--primary); z-index: 10001; transition: width 0.3s ease;
        }
        #pageProgress.loading { width: 90%; }
        #pageProgress.complete { width: 100%; opacity: 0; transition: opacity 0.3s; }

        /* Top Bar */
        .top-bar {
            background: var(--bg-white); position: sticky; top: 0; left: 0; width: 100%;
            z-index: 1000; padding: 8px 12px; box-shadow: var(--shadow-sm);
            border-bottom: 1px solid var(--border-light); display: flex; align-items: center; gap: 12px;
        }
        .back-btn {
            width: 40px; height: 40px; background: var(--bg-light); border-radius: var(--radius-full);
            display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
        }
        .back-btn i { font-size: 18px; color: var(--text-primary); }
        .top-title {
            flex: 1; font-size: 17px; font-weight: 700; color: var(--text-primary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .top-actions { display: flex; align-items: center; gap: 8px; }
        .icon-btn {
            width: 40px; height: 40px; background: var(--bg-light); border-radius: var(--radius-full);
            display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative;
        }
        .icon-btn i { font-size: 18px; color: var(--text-secondary); }
        .cart-badge {
            position: absolute; top: -2px; right: -2px; background: var(--primary); color: white;
            border-radius: 50%; width: 18px; height: 18px; font-size: 9px; display: flex;
            align-items: center; justify-content: center; border: 2px solid white; font-weight: 700;
        }

        /* Shop Header */
        .shop-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            padding: 24px 20px 30px; color: white; position: relative;
        }
        .shop-header-content {
            display: flex; align-items: center; gap: 16px;
        }
        .shop-image {
            width: 80px; height: 80px; background: white; border-radius: var(--radius-lg);
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            border: 3px solid rgba(255,255,255,0.3);
        }
        .shop-image img { width: 100%; height: 100%; object-fit: cover; }
        .shop-image i { font-size: 40px; color: var(--primary); }
        .shop-info { flex: 1; }
        .shop-name { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
        .shop-category {
            font-size: 13px; opacity: 0.9; margin-bottom: 6px;
            display: flex; align-items: center; gap: 4px;
        }
        .shop-meta {
            display: flex; align-items: center; gap: 16px; font-size: 12px;
        }
        .shop-rating {
            display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.2);
            padding: 4px 10px; border-radius: var(--radius-full);
        }
        .shop-rating i { color: #FACC15; }
        .shop-status {
            display: flex; align-items: center; gap: 4px;
        }
        .status-open { color: white; }
        .status-closed { color: rgba(255,255,255,0.7); }

        /* Contact Bar */
        .contact-bar {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            background: var(--bg-white); border-bottom: 1px solid var(--border-light);
        }
        .contact-item {
            display: flex; align-items: center; gap: 6px; font-size: 13px;
            color: var(--text-secondary); cursor: pointer;
        }
        .contact-item i { color: var(--primary); }

        /* Tabs */
        .tabs {
            display: flex; background: var(--bg-white); border-bottom: 1px solid var(--border-light);
        }
        .tab {
            flex: 1; text-align: center; padding: 14px; font-size: 13px; font-weight: 600;
            color: var(--text-secondary); cursor: pointer; position: relative;
        }
        .tab.active { color: var(--primary); }
        .tab.active::after {
            content: ''; position: absolute; bottom: -1px; left: 0; right: 0;
            height: 3px; background: var(--primary);
        }

        /* Products Grid */
        .products-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
            padding: 12px;
        }
        .product-card {
            background: var(--bg-white); border-radius: var(--radius-md);
            overflow: hidden; box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light); cursor: pointer;
        }
        .product-img {
            width: 100%; aspect-ratio: 1/1; position: relative;
            overflow: hidden; background: var(--bg-light);
        }
        .product-img img { width: 100%; height: 100%; object-fit: cover; }
        .discount-tag {
            position: absolute; bottom: 6px; left: 6px; background: var(--accent-orange);
            color: white; font-size: 9px; font-weight: 700; padding: 2px 6px;
            border-radius: var(--radius-full); z-index: 1;
        }
        .product-info { padding: 8px; }
        .product-name {
            font-size: 12px; font-weight: 600; color: var(--text-primary);
            margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .product-price-row {
            display: flex; align-items: center; justify-content: space-between;
        }
        .product-price { font-size: 14px; font-weight: 700; color: var(--primary); }
        .original-price { font-size: 10px; color: var(--text-secondary); text-decoration: line-through; }
        .add-btn {
            background: var(--primary-bg-light); color: var(--primary);
            border: 1px solid var(--primary); border-radius: 50%;
            width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 12px;
        }
        .add-btn:active { background: var(--primary); color: white; }

        /* About Section */
        .about-section {
            background: var(--bg-white); padding: 20px 16px; margin: 12px 0;
        }
        .section-title {
            font-size: 15px; font-weight: 700; color: var(--primary);
            margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
        }
        .about-text { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
        .info-row {
            display: flex; padding: 10px 0; border-bottom: 1px solid var(--border-light);
        }
        .info-label { width: 100px; font-size: 13px; color: var(--text-secondary); }
        .info-value { flex: 1; font-size: 13px; font-weight: 500; }

        /* Empty State */
        .empty-state {
            text-align: center; padding: 60px 20px;
        }
        .empty-state i { font-size: 48px; color: var(--border-light); margin-bottom: 16px; }
        .empty-state h3 { font-size: 16px; margin-bottom: 8px; }
        .empty-state p { color: var(--text-secondary); font-size: 13px; }

        /* Toast */
        .toast-notification {
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
            background: var(--text-primary); color: white; padding: 10px 20px;
            border-radius: var(--radius-full); font-size: 12px; z-index: 10050;
            display: none; white-space: nowrap;
        }
        .toast-notification.show { display: flex; }

        /* Bottom Navigation */
        .bottom-nav {
            background: white; position: fixed; bottom: 0; left: 0; width: 100%;
            display: flex; justify-content: space-around; padding: 6px 16px 8px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.06); z-index: 1000;
            border-top: 1px solid var(--border-light);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            font-size: 10px; font-weight: 500; color: var(--text-secondary); cursor: pointer; position: relative;
        }
        .nav-item.active { color: var(--primary); font-weight: 600; }
        .nav-item i { font-size: 20px; margin-bottom: 2px; }
        .cart-count {
            position: absolute; top: -5px; right: -5px; background: var(--primary); color: white;
            border-radius: 50%; width: 16px; height: 16px; font-size: 9px; display: flex;
            align-items: center; justify-content: center; border: 2px solid white;
        }

        .loading-spinner { text-align: center; padding: 60px; }
        .spinner {
            width: 30px; height: 30px; border: 3px solid var(--border-light);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="pageProgress"></div>
<div id="toastMsg" class="toast-notification"><span id="toastText"></span></div>

<div id="mainApp">
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
        <div class="top-title" id="shopTitle">Loading...</div>
        <div class="top-actions">
            <div class="icon-btn" onclick="shareShop()">
                <i class="fas fa-share-alt"></i>
            </div>
            <div class="icon-btn" onclick="fastNavigate('cart.html')">
                <i class="fas fa-shopping-bag"></i>
                <span class="cart-badge" id="cartBadge">0</span>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div id="mainContent">
        <div class="loading-spinner"><div class="spinner"></div></div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a class="nav-item" onclick="fastNavigate('index.html')"><i class="fas fa-home"></i><span>Home</span></a>
        <a class="nav-item" onclick="fastNavigate('products.html')"><i class="fas fa-search"></i><span>Explore</span></a>
        <a class="nav-item" onclick="fastNavigate('cart.html')"><i class="fas fa-shopping-bag"></i><span>Cart</span><span class="cart-count" id="cartCount">0</span></a>
        <a class="nav-item" onclick="fastNavigate('profile.html')"><i class="fas fa-user"></i><span>Profile</span></a>
        <a class="nav-item" onclick="fastNavigate('orders.html')"><i class="fas fa-receipt"></i><span>Orders</span></a>
    </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const supabaseUrl = 'https://zwajyovemwdqtkecipeb.supabase.co';
    const supabaseKey = 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1';
    const zatpatDB = supabase.createClient(supabaseUrl, supabaseKey);

    const urlParams = new URLSearchParams(window.location.search);
    const shopId = urlParams.get('id');

    let currentShop = null;
    let shopProducts = [];
    let currentTab = 'products';

    function startProgress() { const b = document.getElementById('pageProgress'); b.style.width = '0%'; b.classList.add('loading'); setTimeout(() => b.style.width = '90%', 10); }
    function completeProgress() { const b = document.getElementById('pageProgress'); b.classList.remove('loading'); b.classList.add('complete'); setTimeout(() => { b.style.width = '0%'; b.classList.remove('complete'); }, 300); }
    window.fastNavigate = function(url) { startProgress(); setTimeout(() => window.location.href = url, 50); };
    function goBack() { window.history.back(); }

    function showToast(msg) {
        const t = document.getElementById('toastMsg');
        document.getElementById('toastText').innerHTML = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    function updateCartBadge() {
        const cart = JSON.parse(localStorage.getItem('zatpat_cart')) || [];
        const count = cart.reduce((s, i) => s + (i.quantity || 1), 0);
        document.getElementById('cartBadge').innerText = count;
        document.getElementById('cartCount').innerText = count;
    }

    async function loadShop() {
        if (!shopId) { showToast('Shop not found'); setTimeout(() => goBack(), 1500); return; }

        try {
            const { data: shop, error } = await zatpatDB
                .from('shops')
                .select('*')
                .eq('id', shopId)
                .eq('status', 'approved')
                .single();

            if (error) throw error;
            if (!shop) { showToast('Shop not found'); setTimeout(() => goBack(), 1500); return; }

            currentShop = shop;
            document.getElementById('shopTitle').innerText = shop.name;

            const { data: products } = await zatpatDB
                .from('products')
                .select('*')
                .eq('shop_id', shopId)
                .eq('is_active', true)
                .order('created_at', { ascending: false });

            shopProducts = products || [];
            
            renderShop();

        } catch (e) {
            console.error('Load error:', e);
            // Mock data
            currentShop = {
                id: shopId, name: 'Fresh Mart', category: 'Grocery', rating: 4.5,
                is_open: true, address: 'Main Road, Sillod', city: 'Sillod', pincode: '431112',
                phone: '+91 9876543210', whatsapp: '+91 9876543210',
                description: 'Your one-stop shop for fresh groceries and daily needs.',
                delivery_time: '30-45 min', min_order: 99
            };
            shopProducts = [
                { id: '1', name: 'Farm Fresh Milk', price: 54, offer_price: 54, images: null },
                { id: '2', name: 'Organic Apples', price: 99, offer_price: 89, images: null },
                { id: '3', name: 'Brown Bread', price: 35, offer_price: 35, images: null },
                { id: '4', name: 'Amul Butter', price: 260, offer_price: 240, images: null }
            ];
            renderShop();
        }
    }

    function renderShop() {
        const container = document.getElementById('mainContent');
        const shop = currentShop;
        
        container.innerHTML = `
            <!-- Shop Header -->
            <div class="shop-header">
                <div class="shop-header-content">
                    <div class="shop-image">
                        ${shop.image_url ? `<img src="${shop.image_url}" onerror="this.innerHTML='<i class=\'fas fa-store\'></i>'">` : '<i class="fas fa-store"></i>'}
                    </div>
                    <div class="shop-info">
                        <div class="shop-name">${shop.name}</div>
                        <div class="shop-category">
                            <i class="fas fa-tag"></i> ${shop.category || 'Store'}
                        </div>
                        <div class="shop-meta">
                            <span class="shop-rating">
                                <i class="fas fa-star"></i> ${shop.rating || 4.0}
                            </span>
                            <span class="shop-status ${shop.is_open ? 'status-open' : 'status-closed'}">
                                <i class="fas fa-circle"></i> ${shop.is_open ? 'Open Now' : 'Closed'}
                            </span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Contact Bar -->
            <div class="contact-bar">
                <div class="contact-item" onclick="callShop('${shop.phone}')">
                    <i class="fas fa-phone-alt"></i> Call
                </div>
                <div class="contact-item" onclick="whatsappShop('${shop.whatsapp || shop.phone}')">
                    <i class="fab fa-whatsapp"></i> WhatsApp
                </div>
                <div class="contact-item" onclick="getDirections()">
                    <i class="fas fa-directions"></i> Directions
                </div>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <div class="tab ${currentTab === 'products' ? 'active' : ''}" onclick="switchTab('products')">
                    <i class="fas fa-box"></i> Products (${shopProducts.length})
                </div>
                <div class="tab ${currentTab === 'about' ? 'active' : ''}" onclick="switchTab('about')">
                    <i class="fas fa-info-circle"></i> About
                </div>
            </div>

            <div id="tabContent"></div>
        `;
        
        renderTabContent();
    }

    window.switchTab = function(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.closest('.tab').classList.add('active');
        renderTabContent();
    };

    function renderTabContent() {
        const container = document.getElementById('tabContent');
        const shop = currentShop;
        
        if (currentTab === 'products') {
            if (shopProducts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-box-open"></i>
                        <h3>No products yet</h3>
                        <p>This shop hasn't added any products</p>
                    </div>
                `;
                return;
            }
            
            let html = '<div class="products-grid">';
            shopProducts.forEach(p => {
                const img = p.images?.[0] || p.image_url || 'https://placehold.co/200/F0FDF4/16A34A?text=📦';
                const discount = p.offer_price ? Math.round((1 - p.offer_price / p.price) * 100) : 0;
                
                html += `
                    <div class="product-card" onclick="fastNavigate('product-detail.html?id=${p.id}')">
                        <div class="product-img">
                            ${discount > 0 ? `<div class="discount-tag">${discount}% OFF</div>` : ''}
                            <img src="${img}" loading="lazy" onerror="this.src='https://placehold.co/200/F0FDF4/16A34A?text=📦'">
                        </div>
                        <div class="product-info">
                            <div class="product-name">${p.name}</div>
                            <div class="product-price-row">
                                <div>
                                    <span class="product-price">₹${p.offer_price || p.price}</span>
                                    ${p.offer_price ? `<span class="original-price">₹${p.price}</span>` : ''}
                                </div>
                                <div class="add-btn" onclick="event.stopPropagation(); addToCart('${p.id}', '${p.name}', ${p.offer_price || p.price}, '${img}')">
                                    <i class="fas fa-plus"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        } else {
            container.innerHTML = `
                <div class="about-section">
                    <div class="section-title"><i class="fas fa-store"></i> About ${shop.name}</div>
                    <div class="about-text">${shop.description || 'No description available.'}</div>
                </div>
                
                <div class="about-section">
                    <div class="section-title"><i class="fas fa-info-circle"></i> Shop Information</div>
                    <div class="info-row"><span class="info-label">Address</span><span class="info-value">${shop.address || 'Not provided'}, ${shop.city || ''} - ${shop.pincode || ''}</span></div>
                    <div class="info-row"><span class="info-label">Phone</span><span class="info-value">${shop.phone || 'Not provided'}</span></div>
                    <div class="info-row"><span class="info-label">WhatsApp</span><span class="info-value">${shop.whatsapp || shop.phone || 'Not provided'}</span></div>
                    <div class="info-row"><span class="info-label">Delivery Time</span><span class="info-value">${shop.delivery_time || '30-45 min'}</span></div>
                    <div class="info-row"><span class="info-label">Min Order</span><span class="info-value">₹${shop.min_order || 0}</span></div>
                    <div class="info-row"><span class="info-label">Status</span><span class="info-value" style="color: ${shop.is_open ? 'var(--primary)' : '#EF4444'};">${shop.is_open ? 'Open Now' : 'Closed'}</span></div>
                </div>
            `;
        }
    }

    window.addToCart = function(id, name, price, image) {
        let cart = JSON.parse(localStorage.getItem('zatpat_cart')) || [];
        const existing = cart.find(i => i.id === id);
        if (existing) existing.quantity += 1;
        else cart.push({ id, name, price, image, quantity: 1 });
        localStorage.setItem('zatpat_cart', JSON.stringify(cart));
        updateCartBadge();
        showToast('🛒 ' + name + ' added');
        if (navigator.vibrate) navigator.vibrate(10);
    };

    window.callShop = function(phone) {
        if (phone) window.location.href = `tel:${phone}`;
        else showToast('Phone number not available');
    };

    window.whatsappShop = function(whatsapp) {
        if (whatsapp) window.open(`https://wa.me/${whatsapp.replace(/\D/g, '')}`, '_blank');
        else showToast('WhatsApp number not available');
    };

    window.getDirections = function() {
        const shop = currentShop;
        if (shop.latitude && shop.longitude) {
            window.open(`https://maps.google.com/?q=${shop.latitude},${shop.longitude}`, '_blank');
        } else if (shop.address) {
            window.open(`https://maps.google.com/?q=${encodeURIComponent(shop.address + ' ' + shop.city)}`, '_blank');
        } else {
            showToast('Location not available');
        }
    };

    window.shareShop = function() {
        const shop = currentShop;
        const url = window.location.href;
        const text = `Check out ${shop.name} on Zatpat!`;
        
        if (navigator.share) {
            navigator.share({ title: shop.name, text: text, url: url });
        } else {
            navigator.clipboard?.writeText(url);
            showToast('📋 Link copied to clipboard');
        }
    };

    document.addEventListener('DOMContentLoaded', () => {
        updateCartBadge();
        loadShop();
    });

    window.goBack = goBack;
    window.switchTab = switchTab;
    window.addToCart = addToCart;
    window.callShop = callShop;
    window.whatsappShop = whatsappShop;
    window.getDirections = getDirections;
    window.shareShop = shareShop;
</script>
</body>
</html>
