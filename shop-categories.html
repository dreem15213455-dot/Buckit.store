<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Shop Categories - Zatpat</title>
    <meta name="theme-color" content="#FFD600">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #FFD600;
            --primary-dark: #E5C200;
            --accent-green: #16A34A;
            --bg-light: #F5F5F5;
            --card-white: #FFFFFF;
            --text-primary: #1A1A1A;
            --text-secondary: #666666;
            --border-light: #E5E7EB;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-2xl: 24px;
            --radius-full: 9999px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
        }
        h1, h2, h3, h4, h5, h6 { font-family: 'Poppins', sans-serif; }

        .top-bar {
            background: white;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 12px 16px;
            box-shadow: var(--shadow-sm);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .back-btn {
            width: 40px;
            height: 40px;
            background: var(--bg-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .brand-name { font-size: 22px; font-weight: 800; }
        .brand-name .normal { color: #000000; }
        .brand-name .pat { color: var(--accent-green); }
        .page-title { flex: 1; text-align: center; font-weight: 600; font-size: 16px; }

        .main-content {
            padding-top: 80px;
            padding-bottom: 100px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Hero Section */
        .hero-section {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            margin: 16px;
            padding: 32px 24px;
            border-radius: var(--radius-2xl);
            text-align: center;
            color: #000000;
        }
        .hero-icon { font-size: 48px; margin-bottom: 16px; }
        .hero-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
        .hero-subtitle { font-size: 13px; opacity: 0.8; }

        /* Categories Grid */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 16px;
        }
        .category-card {
            background: white;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .category-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }
        .category-icon {
            width: 60px;
            height: 60px;
            background: var(--bg-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 28px;
        }
        .category-name {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 4px;
        }
        .category-count {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .loading-spinner { text-align: center; padding: 60px; color: var(--primary); }
        .empty-state { text-align: center; padding: 60px; }

        /* Bottom Nav */
        .bottom-nav {
            background: white;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 8px 16px 16px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
            z-index: 1000;
            border-top: 1px solid var(--border-light);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            font-size: 10px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.2s;
        }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 20px; margin-bottom: 3px; }

        @media (max-width: 480px) {
            .categories-grid { gap: 12px; }
            .category-card { padding: 16px; }
            .category-icon { width: 50px; height: 50px; font-size: 24px; }
            .category-name { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
        <div class="brand-name"><span class="normal">Zat</span><span class="pat">pat</span></div>
        <div class="page-title">Shop Categories</div>
    </div>

    <div class="main-content">
        <div class="hero-section">
            <div class="hero-icon"><i class="fas fa-store"></i></div>
            <div class="hero-title">Shop by Category</div>
            <div class="hero-subtitle">Find the best shops in your neighborhood</div>
        </div>
        <div id="categoriesContainer" class="categories-grid">
            <div class="loading-spinner"><i class="fas fa-spinner fa-spin fa-2x"></i></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="products.html" class="nav-item"><i class="fas fa-compass"></i><span>Explore</span></a>
        <a href="cart.html" class="nav-item"><i class="fas fa-shopping-cart"></i><span>Cart</span></a>
        <a href="shop-categories.html" class="nav-item active"><i class="fas fa-tags"></i><span>Categories</span></a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user"></i><span>Profile</span></a>
    </nav>

    <script>
        const supabaseUrl = 'https://zwajyovemwdqtkecipeb.supabase.co';
        const supabaseKey = 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        async function loadCategories() {
            try {
                // Fetch all approved shops
                const { data: shops, error } = await supabaseClient
                    .from('shops')
                    .select('category')
                    .eq('status', 'approved');

                if (error) throw error;

                // Count shops per category
                const categoryCount = {};
                shops?.forEach(shop => {
                    if (shop.category) {
                        categoryCount[shop.category] = (categoryCount[shop.category] || 0) + 1;
                    }
                });

                // Convert to array and sort
                const categories = Object.entries(categoryCount).map(([name, count]) => ({ name, count }));
                categories.sort((a, b) => b.count - a.count);

                const container = document.getElementById('categoriesContainer');
                
                if (categories.length === 0) {
                    container.innerHTML = '<div class="empty-state">No categories found</div>';
                    return;
                }

                // Category icons mapping
                const getIcon = (category) => {
                    const icons = {
                        'Grocery': 'fa-apple-alt',
                        'Clothing': 'fa-tshirt',
                        'Fashion': 'fa-tshirt',
                        'Electronics': 'fa-mobile-alt',
                        'Hardware': 'fa-tools',
                        'Medical': 'fa-hospital',
                        'Dairy': 'fa-cheese',
                        'Furniture': 'fa-couch',
                        'Stationery': 'fa-pen',
                        'Mobile': 'fa-mobile-alt',
                        'Books': 'fa-book',
                        'Toys': 'fa-puzzle-piece',
                        'Beauty': 'fa-spa',
                        'Sports': 'fa-futbol'
                    };
                    return icons[category] || 'fa-store';
                };

                container.innerHTML = categories.map(cat => `
                    <div class="category-card" onclick="viewCategory('${encodeURIComponent(cat.name)}')">
                        <div class="category-icon"><i class="fas ${getIcon(cat.name)}"></i></div>
                        <div class="category-name">${escapeHtml(cat.name)}</div>
                        <div class="category-count">${cat.count} shops</div>
                    </div>
                `).join('');

            } catch (error) {
                console.error('Error loading categories:', error);
                document.getElementById('categoriesContainer').innerHTML = '<div class="empty-state">Error loading categories</div>';
            }
        }

        function viewCategory(category) {
            window.location.href = `category-shops.html?category=${category}`;
        }

        function goBack() {
            window.location.href = 'index.html';
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        loadCategories();
        window.viewCategory = viewCategory;
        window.goBack = goBack;
    </script>
</body>
</html>
