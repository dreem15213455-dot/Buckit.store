<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Categories - ZyMart+</title>
    <meta name="theme-color" content="#0B5A31">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link rel="preconnect" href="https://res.cloudinary.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root{--brand-green:#0B5A31;--brand-green-dark:#083D21;--brand-orange:#F59E0B;--brand-orange-dark:#E8890A;--neutral-white:#FFFFFF;--neutral-bg:#F8FAF9;--neutral-border:#E5E7EB;--neutral-gray:#6B7280;--neutral-dark:#1A1A1A;--danger:#EF4444;--success:#10B981;--shadow-xs:0 1px 2px rgba(0,0,0,0.04);--shadow-sm:0 2px 8px rgba(0,0,0,0.06);--shadow-md:0 4px 16px rgba(0,0,0,0.08);--shadow-lg:0 8px 30px rgba(0,0,0,0.10);--radius-sm:10px;--radius-md:14px;--radius-lg:18px;--radius-xl:22px;--radius-full:9999px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',-apple-system,sans-serif;background:var(--neutral-bg);color:var(--neutral-dark);padding-bottom:85px;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;min-height:100vh}
        @keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(11,90,49,0.4)}50%{box-shadow:0 0 0 8px rgba(11,90,49,0)}}
        @keyframes cartBounce{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
        
        .cart-badge.bounce{animation:cartBounce 0.3s ease}
        
        .top-bar{background:linear-gradient(135deg,var(--brand-green),var(--brand-green-dark));position:fixed;top:0;left:0;width:100%;z-index:1000;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 20px rgba(11,90,49,0.3)}
        .back-btn{width:40px;height:40px;min-width:40px;background:rgba(255,255,255,0.12);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:white;font-size:15px;text-decoration:none;transition:all 0.15s ease}
        .back-btn:active{background:rgba(255,255,255,0.25);transform:scale(0.93)}
        .top-title{font-family:'Poppins',sans-serif;flex:1;font-size:17px;font-weight:700;color:white;display:flex;align-items:center;gap:6px}
        .brand-zy{color:#A3E635}.brand-mart{color:#FDE047}
        .cart-icon-btn{width:36px;height:36px;background:rgba(255,255,255,0.10);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:white;font-size:14px;position:relative;text-decoration:none}
        .cart-badge{position:absolute;top:-5px;right:-5px;background:var(--brand-orange);color:white;border-radius:50%;width:17px;height:17px;font-size:8px;display:none;align-items:center;justify-content:center;border:2px solid var(--brand-green);font-weight:700}
        .cart-badge.show{display:flex}
        
        /* ═══ Split Layout ═══ */
        .split-layout{display:flex;padding-top:60px;min-height:calc(100vh - 60px)}
        
        /* ═══ Sidebar ═══ */
        .sidebar{
            width:95px;min-width:95px;background:white;
            border-right:1px solid var(--neutral-border);
            overflow-y:auto;overflow-x:hidden;
            position:fixed;top:60px;bottom:75px;left:0;
            z-index:50;
            -webkit-overflow-scrolling:touch;
            scrollbar-width:none;
        }
        .sidebar::-webkit-scrollbar{display:none}
        .sidebar-item{
            padding:10px 4px 8px;text-align:center;cursor:pointer;
            font-size:10px;font-weight:600;color:var(--neutral-gray);
            border-bottom:1px solid #F3F4F6;
            border-left:3px solid transparent;
            transition:all 0.15s ease;
            -webkit-tap-highlight-color:transparent;
        }
        .sidebar-item:active{background:#F9FAFB}
        .sidebar-item.active{
            background:#EDF7F1;color:var(--brand-green);
            border-left-color:var(--brand-green);font-weight:700;
        }
        .sidebar-cat-img{
            width:52px;height:52px;border-radius:50%;
            margin:0 auto 5px;overflow:hidden;
            background:linear-gradient(135deg,#EDF7F1,#D1FAE5);
            display:flex;align-items:center;justify-content:center;
            border:2px solid #E5E7EB;transition:all 0.15s ease;
        }
        .sidebar-item.active .sidebar-cat-img{
            border-color:var(--brand-green);
            background:linear-gradient(135deg,#D1FAE5,#A7F3D0);
        }
        .sidebar-cat-img img{width:100%;height:100%;object-fit:cover}
        .sidebar-cat-img i{font-size:20px;color:var(--brand-green)}
        .sidebar-cat-name{
            line-height:1.15;
            display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
            overflow:hidden;word-break:break-word;
        }
        
        /* ═══ Main Area ═══ */
        .main-area{
            flex:1;margin-left:95px;
            min-width:0;overflow-x:hidden;
        }
        
        .category-hero{background:linear-gradient(135deg,#EDF7F1,#D1FAE5);margin:12px 10px;padding:12px 14px;border-radius:var(--radius-lg);display:flex;align-items:center;gap:10px;animation:slideUp 0.3s ease;border:1px solid #A7F3D0}
        .category-hero-icon{width:40px;height:40px;min-width:40px;background:white;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:var(--shadow-sm)}
        .category-hero-info h2{font-family:'Poppins',sans-serif;font-size:14px;font-weight:700;color:var(--brand-green-dark);line-height:1.2}
        .category-hero-info p{font-size:10px;color:var(--neutral-gray);margin-top:2px}
        
        .products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 10px 20px}
        
        .product-card{background:white;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs);border:1px solid var(--neutral-border);cursor:pointer;animation:slideUp 0.3s ease;position:relative;display:flex;flex-direction:column;transition:transform 0.15s ease}
        .product-card:active{transform:scale(0.97)}
        .product-img{width:100%;aspect-ratio:1/1;position:relative;overflow:hidden;background:#F9FAFB;display:flex;align-items:center;justify-content:center}
        .product-img img{width:80%;height:80%;object-fit:contain}
        .discount-tag{position:absolute;top:6px;left:6px;background:var(--brand-orange);color:white;font-size:8px;font-weight:700;padding:2px 6px;border-radius:var(--radius-full);z-index:1}
        .weight-tag{position:absolute;bottom:6px;right:6px;background:rgba(11,90,49,0.85);color:white;font-size:8px;font-weight:600;padding:2px 6px;border-radius:var(--radius-full);z-index:1}
        .out-of-stock-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:2}
        .out-of-stock-overlay span{background:rgba(0,0,0,0.7);color:white;padding:4px 10px;border-radius:var(--radius-full);font-size:9px;font-weight:700}
        
        .product-info{padding:8px 9px;display:flex;flex-direction:column;gap:3px;flex:1}
        .product-brand{font-size:8px;color:var(--brand-green);font-weight:600;text-transform:uppercase}
        .product-name{font-size:11px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:28px}
        .product-price-row{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:auto;padding-top:4px}
        .price-group{display:flex;align-items:baseline;gap:3px;flex-wrap:wrap}
        .product-price{font-size:13px;font-weight:700;color:var(--brand-green-dark)}
        .original-price{font-size:9px;color:#9CA3AF;text-decoration:line-through}
        .add-btn{background:var(--brand-green);color:white;border:none;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;flex-shrink:0;transition:all 0.15s ease;font-weight:700}
        .add-btn:active{transform:scale(0.9);background:var(--brand-green-dark)}
        .add-btn.disabled{background:#D1D5DB;cursor:not-allowed}
        
        .qty-controls{display:flex;align-items:center;gap:3px;background:var(--brand-green);border-radius:var(--radius-full);padding:2px 4px}
        .qty-btn{width:20px;height:20px;border-radius:50%;border:none;background:transparent;cursor:pointer;font-size:11px;font-weight:700;color:white;display:flex;align-items:center;justify-content:center;padding:0}
        .qty-btn:active{background:rgba(255,255,255,0.2)}
        .qty-count{font-size:11px;font-weight:700;color:white;min-width:16px;text-align:center}
        
        .empty-state{text-align:center;padding:50px 20px;animation:fadeIn 0.4s ease}
        .empty-icon{width:70px;height:70px;background:#F3F5F4;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
        .empty-icon i{font-size:30px;color:#D1D5DB}
        .empty-state h3{font-family:'Poppins',sans-serif;font-size:16px;font-weight:700;margin-bottom:6px}
        .empty-state p{font-size:12px;color:var(--neutral-gray);margin-bottom:14px;line-height:1.5}
        .btn-primary{background:var(--brand-green);color:white;border:none;padding:10px 20px;border-radius:var(--radius-full);font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:all 0.15s ease}
        .btn-primary:active{background:var(--brand-green-dark);transform:scale(0.96)}
        
        .loading-state{text-align:center;padding:40px 20px}
        .loading-spinner{width:34px;height:34px;border:3px solid #E5E7EB;border-top-color:var(--brand-orange);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 12px}
        .loading-text{font-size:12px;color:var(--neutral-gray)}
        
        .bottom-nav{background:white;position:fixed;bottom:0;left:0;width:100%;display:flex;justify-content:space-around;padding:5px 10px 10px;box-shadow:0 -4px 20px rgba(0,0,0,0.05);z-index:1000;border-top:1px solid var(--neutral-border)}
        .nav-item{display:flex;flex-direction:column;align-items:center;font-size:9px;font-weight:500;color:var(--neutral-gray);cursor:pointer;padding:3px 10px;border-radius:var(--radius-full);border:none;background:transparent;font-family:'Inter',sans-serif;text-decoration:none;transition:all 0.15s ease;position:relative}
        .nav-item:active{background:#EDF7F1}
        .nav-item.active{color:var(--brand-green);font-weight:700}
        .nav-item i{font-size:18px;margin-bottom:1px}
        .nav-cart-count{position:absolute;top:-2px;right:2px;background:var(--brand-orange);color:white;border-radius:50%;width:16px;height:16px;font-size:8px;display:none;align-items:center;justify-content:center;border:2px solid white;font-weight:700}
        .nav-cart-count.show{display:flex}
        
        .toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:var(--neutral-dark);color:white;padding:10px 20px;border-radius:var(--radius-full);font-size:12px;z-index:10050;opacity:0;visibility:hidden;white-space:nowrap;box-shadow:var(--shadow-md);transition:all 0.3s ease;max-width:90%;overflow:hidden;text-overflow:ellipsis}
        .toast.show{opacity:1;visibility:visible}
        .toast.error{background:var(--danger)}.toast.success{background:var(--success)}
        
        @media(max-width:380px){
            .sidebar{width:80px;min-width:80px}
            .main-area{margin-left:80px}
            .sidebar-cat-img{width:44px;height:44px}
            .product-name{font-size:10px}
            .product-price{font-size:12px}
        }
    </style>
</head>
<body>

<div id="mainApp">
    <div class="top-bar">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>

                <div class="loading-spinner" style="width:24px;height:24px;border-width:2.5px;"></div>

        <span class="nav-cart-count" id="navCartCount">0</span>

    <a class="nav-item" href="profile.html"><i class="fas fa-user"></i><span>Profile</span></a>
</nav>

<div class="toast" id="toastMsg"><span id="toastText"></span></div>

<script>
(function(){'use strict';
window.addEventListener('error',function(e){console.error('[Categories]',e.message);try{showToast('Something went wrong','error');}catch(_){}});

var CONFIG = {
    SUPABASE_URL: 'https://zwajyovemwdqtkecipeb.supabase.co',
    SUPABASE_KEY: 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1',
    CLOUDINARY_CLOUD_NAME: 'b0zm0rac',
    CLOUDINARY_ENABLED: true
};

var sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
var SUPABASE_URL = CONFIG.SUPABASE_URL;

// ═══ Egress saver columns ═══
var CAT_COLS = 'id, name, image_url, display_order';
var PRODUCT_COLS = 'id, name, price, offer_price, image_url, images, variants, weight, unit, weight_unit, stock, shop_id, brand_name';

var CACHE_TTL = 5 * 60 * 1000;

var allCategories = [];
var categoryId = null;
var categoryName = '';
var currentProducts = [];
var currentLoadingCategory = null;

function $(id){return document.getElementById(id);}
function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

// ═══ CLOUDINARY FETCH ═══
function getFullUrl(u, width){
    if(!u||typeof u!=='string')return '';
    var fullUrl;
    if(u.indexOf('http')===0||u.indexOf('data:')===0){
        fullUrl=u;
    }else{
        fullUrl=SUPABASE_URL+'/storage/v1/object/public/'+u;
    }
    if(fullUrl.indexOf('res.cloudinary.com')===0)return fullUrl;
    if(!CONFIG.CLOUDINARY_ENABLED)return fullUrl;
    var w=width||250;
    return 'https://res.cloudinary.com/'+CONFIG.CLOUDINARY_CLOUD_NAME+'/image/fetch/w_'+w+',q_auto,f_auto/'+fullUrl;
}

// ═══ Session cache ═══
function getCache(key){
    try{var raw=sessionStorage.getItem('zymart_cat_'+key);if(!raw)return null;var parsed=JSON.parse(raw);if(Date.now()-parsed.t>CACHE_TTL){sessionStorage.removeItem('zymart_cat_'+key);return null;}return parsed.d;}catch(e){return null;}
}
function setCache(key,data){
    try{sessionStorage.setItem('zymart_cat_'+key,JSON.stringify({t:Date.now(),d:data}));}catch(e){}
}

function showToast(m,type){var t=$('toastMsg'),s=$('toastText');if(!t||!s)return;s.textContent=m;t.className='toast';if(type==='error')t.classList.add('error');else if(type==='success')t.classList.add('success');t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show','error','success');},2500);}
window.fastNavigate=function(url){window.location.href=url;};

// ═══ Cart Manager ═══
var CartManager = {
    getCart: function() { try { return JSON.parse(localStorage.getItem('zymart_cart') || '[]'); } catch(e) { return []; } },
    saveCart: function(cart) { try { localStorage.setItem('zymart_cart', JSON.stringify(cart)); } catch(e) {} this.updateBadges(); },
    addToCart: function(product) {
        var cart = this.getCart();
        var existing = cart.find(function(item) { return item.id === product.id && (item.variantKey === product.variantKey || item.cartKey === product.variantKey); });
        if (existing) { existing.quantity = (existing.quantity || 1) + 1; }
        else { cart.push({ id: product.id, variantKey: product.variantKey, cartKey: product.variantKey, name: product.name, price: product.price, image: product.image, shop_id: product.shop_id || '', shop_name: product.shop_name || '', variantWeight: product.variantWeight || null, variantUnit: product.variantUnit || null, quantity: 1 }); }
        this.saveCart(cart);
        return cart;
    },
    updateQuantity: function(id, delta, variantKey) {
        var cart = this.getCart();
        var item;
        if (variantKey) { item = cart.find(function(i) { return i.id === id && (i.variantKey === variantKey || i.cartKey === variantKey); }); }
        else { item = cart.find(function(i) { return i.id === id; }); }
        if (item) {
            item.quantity = (item.quantity || 1) + delta;
            if (item.quantity <= 0) {
                if (variantKey) { cart = cart.filter(function(i) { return !(i.id === id && (i.variantKey === variantKey || i.cartKey === variantKey)); }); }
                else { cart = cart.filter(function(i) { return i.id !== id; }); }
            }
        }
        this.saveCart(cart);
        return cart;
    },
    getTotalItems: function() { var c = this.getCart(); return c.reduce(function(s, i) { return s + (i.quantity || 1); }, 0); },
    updateBadges: function() {
        var totalItems = this.getTotalItems();
        var topBadge = $('cartBadge');
        if (topBadge) { topBadge.textContent = totalItems; if (totalItems > 0) { topBadge.classList.add('show'); topBadge.classList.add('bounce'); setTimeout(function(){topBadge.classList.remove('bounce');},300); } else { topBadge.classList.remove('show'); } }
        var navBadge = $('navCartCount');
        if (navBadge) { navBadge.textContent = totalItems > 99 ? '99+' : totalItems; if (totalItems > 0) navBadge.classList.add('show'); else navBadge.classList.remove('show'); }
    }
};

function fmtWeight(w, u) {
    if (!w || w === 'null' || w === 'undefined' || w === '') return '';
    var nw = parseFloat(w);
    if (isNaN(nw) || nw <= 0) return '';
    var unitLower = u ? u.toLowerCase() : '';
    if (unitLower === 'gm' || unitLower === 'gram' || unitLower === 'g' || unitLower === 'grams') {
        if (nw >= 1000) return (nw/1000).toFixed(1).replace(/\.0$/,'') + 'kg';
        return nw + 'g';
    }
    if (unitLower === 'kg' || unitLower === 'kilogram' || unitLower === 'kgs') return nw + 'kg';
    if (unitLower === 'ml' || unitLower === 'milliliter') return nw + 'ml';
    if (unitLower === 'l' || unitLower === 'liter' || unitLower === 'litre') return nw + 'L';
    if (unitLower === 'pcs' || unitLower === 'piece' || unitLower === 'pc') return nw + 'pcs';
    return nw + (u ? ' ' + u : '');
}

function parseVariants(p) {
    if (p.variants && Array.isArray(p.variants) && p.variants.length > 0) return p.variants;
    return [{ weight: p.weight || 1, unit: p.weight_unit || p.unit || 'kg', price: p.price || 0, offer_price: p.offer_price || null, stock: p.stock || 0 }];
}

function getBestVariant(variants) {
    if (!variants || !variants.length) return null;
    var inStock = variants.filter(function(v) { return (v.stock || 0) > 0; });
    if (inStock.length) { return inStock.reduce(function(a, b) { return (a.offer_price || a.price) < (b.offer_price || b.price) ? a : b; }); }
    return variants[0];
}

// ═══ Sidebar render ═══
async function loadSidebar() {
    var sidebar = $('sidebar');
    if (!sidebar) return;
    
    try {
        var cats = getCache('categories_list');
        if (!cats) {
            var r = await sb.from('categories')
                .select(CAT_COLS)
                .eq('is_active', true)
                .eq('is_on_hold', false)
                .is('parent_id', null)
                .order('display_order')
                .limit(40);
            cats = (r && r.data) ? r.data : [];
            setCache('categories_list', cats);
        }
        
        allCategories = cats;
        
        if (cats.length === 0) {
            sidebar.innerHTML = '<div style="padding:20px 8px;text-align:center;font-size:10px;color:#9CA3AF;">No categories</div>';
            $('mainContent').innerHTML = '<div class="empty-state"><div class="empty-icon"><i class="fas fa-tags"></i></div><h3>No Categories</h3><p>Categories coming soon!</p></div>';
            return;
        }
        
        // Pehli category default
        categoryId = cats[0].id;
        categoryName = cats[0].name;
        
        var html = '';
        for (var i = 0; i < cats.length; i++) {
            var cat = cats[i];
            var isActive = (i === 0);
            var img = cat.image_url ? getFullUrl(cat.image_url, 100) : '';
            
            html += '<div class="sidebar-item' + (isActive ? ' active' : '') + '" data-cat-id="' + cat.id + '" onclick="window.switchCategory(\'' + cat.id + '\',\'' + encodeURIComponent(cat.name).replace(/'/g, "\\'") + '\')">';
            html += '<div class="sidebar-cat-img">';
            html += img ? '<img src="' + img + '" loading="lazy" decoding="async" onerror="this.parentElement.innerHTML=\'<i class=&quot;fas fa-shopping-basket&quot;></i>\'">' : '<i class="fas fa-shopping-basket"></i>';
            html += '</div>';
            html += '<div class="sidebar-cat-name">' + esc(cat.name) + '</div>';
            html += '</div>';
        }
        sidebar.innerHTML = html;
        
        // Products load karo pehli category ke liye
        await loadProductsForCategory(categoryId, categoryName);
        
    } catch(e) {
        console.error('[Categories] Sidebar error:', e);
        sidebar.innerHTML = '<div style="padding:20px 8px;text-align:center;font-size:10px;color:#EF4444;">Error</div>';
    }
}

// ═══ Products load for category ═══
async function loadProductsForCategory(catId, catName) {
    if (!catId) return;
    currentLoadingCategory = catId;
    
    var c = $('mainContent');
    if (!c) return;
    c.innerHTML = '<div class="loading-state"><div class="loading-spinner"></div><p class="loading-text">Loading ' + esc(catName) + '...</p></div>';
    
    try {
        var cacheKey = 'products_' + catId;
        var products = getCache(cacheKey);
        
        if (!products) {
            var r = await sb.from('products')
                .select(PRODUCT_COLS)
                .eq('category_id', catId)
                .eq('is_active', true)
                .eq('is_on_hold', false)
                .is('parent_id', null)
                .limit(50);
            products = (r && r.data) ? r.data : [];
            setCache(cacheKey, products);
        }
        
        if (currentLoadingCategory !== catId) return;
        currentProducts = products;
        renderProducts(products, catName);
    } catch(e) {
        console.error('[Categories] Products error:', e);
        if (currentLoadingCategory !== catId) return;
        c.innerHTML = '<div class="empty-state"><div class="empty-icon"><i class="fas fa-exclamation-circle"></i></div><h3>Failed to Load</h3><p>Please check your connection</p><button class="btn-primary" onclick="window.switchCategory(\'' + catId + '\',\'' + encodeURIComponent(catName) + '\')"><i class="fas fa-redo"></i> Retry</button></div>';
    }
}

// ═══ Render products ═══
function renderProducts(products, catName) {
    var c = $('mainContent');
    if (!c) return;
    
    var h = '';
    h += '<div class="category-hero"><div class="category-hero-icon">🛒</div><div class="category-hero-info"><h2>' + esc(catName) + '</h2><p>' + products.length + ' product' + (products.length !== 1 ? 's' : '') + '</p></div></div>';
    
    if (products.length === 0) {
        h += '<div class="empty-state"><div class="empty-icon"><i class="fas fa-box-open"></i></div><h3>No Products</h3><p>No products available in this category yet</p></div>';
        c.innerHTML = h;
        return;
    }
    
    h += '<div class="products-grid">';
    
    var cart = CartManager.getCart();
    
    for (var i = 0; i < products.length; i++) {
        var p = products[i];
        var variants = parseVariants(p);
        var bestV = getBestVariant(variants);
        if (!bestV) continue;
        
        var img = getFullUrl((p.images && p.images[0]) || p.image_url || '', 250);
        var price = bestV.offer_price || bestV.price;
        var original = bestV.price;
        var dis = bestV.offer_price && bestV.price && bestV.offer_price < bestV.price ? Math.round((1 - bestV.offer_price / bestV.price) * 100) : 0;
        var wt = fmtWeight(bestV.weight, bestV.weight_unit || bestV.unit || p.weight_unit || p.unit);
        var isOut = (bestV.stock || 0) <= 0;
        var nm = (p.name || '').replace(/'/g, "\\'");
        var cardVarKey = p.id + '_' + (bestV.weight || '') + '_' + (bestV.weight_unit || bestV.unit || p.weight_unit || p.unit || '');
        var ci = cart.find(function(x) { return x.id === p.id && (x.variantKey === cardVarKey || x.cartKey === cardVarKey); });
        var cq = ci ? (ci.quantity || 1) : 0;
        
        h += '<div class="product-card" data-pid="' + p.id + '" data-vkey="' + cardVarKey + '" onclick="window.location.href=\'product-detail.html?id=' + p.id + '\'">';
        h += '<div class="product-img">';
        if (dis > 0) h += '<span class="discount-tag">' + dis + '% OFF</span>';
        if (wt) h += '<span class="weight-tag">' + wt + '</span>';
        if (isOut) h += '<div class="out-of-stock-overlay"><span>Out</span></div>';
        h += img ? '<img src="' + img + '" loading="lazy" decoding="async" alt="' + esc(p.name) + '">' : '<i class="fas fa-box" style="font-size:32px;color:#D1D5DB;"></i>';
        h += '</div>';
        h += '<div class="product-info">';
        if (p.brand_name) h += '<div class="product-brand">' + esc(p.brand_name) + '</div>';
        h += '<div class="product-name">' + esc(p.name) + '</div>';
        h += '<div class="product-price-row">';
        h += '<div class="price-group"><span class="product-price">₹' + Number(price).toLocaleString('en-IN') + '</span>';
        if (dis > 0) h += '<span class="original-price">₹' + Number(original).toLocaleString('en-IN') + '</span>';
        h += '</div>';
        
        if (!isOut) {
            if (cq > 0) {
                h += '<div class="qty-controls">';
                h += '<button class="qty-btn" onclick="event.stopPropagation();window.updateQty(\'' + p.id + '\',-1,\'' + cardVarKey + '\')">−</button>';
                h += '<span class="qty-count">' + cq + '</span>';
                h += '<button class="qty-btn" onclick="event.stopPropagation();window.updateQty(\'' + p.id + '\',1,\'' + cardVarKey + '\')">+</button>';
                h += '</div>';
            } else {
                h += '<button class="add-btn" onclick="event.stopPropagation();window.addToCart(\'' + p.id + '\',\'' + nm + '\',' + price + ',\'' + img + '\',\'' + (bestV.weight || '') + '\',\'' + (bestV.weight_unit || bestV.unit || p.weight_unit || p.unit || '') + '\')">+</button>';
            }
        }
        h += '</div></div></div>';
    }
    
    h += '</div>';
    c.innerHTML = h;
}

// ═══ Cart update handlers ═══
window.addToCart = function(id, name, price, image, weight, unit) {
    var variantKey = id + '_' + weight + '_' + unit;
    CartManager.addToCart({ id: id, variantKey: variantKey, name: name, price: price, image: image, variantWeight: weight || null, variantUnit: unit || null });
    updateCardQty(id, variantKey);
    showToast('🛒 Added!', 'success');
};

window.updateQty = function(id, delta, variantKey) {
    CartManager.updateQuantity(id, delta, variantKey);
    updateCardQty(id, variantKey);
};

function updateCardQty(id, variantKey) {
    var cart = CartManager.getCart();
    var ci = cart.find(function(x) { return x.id === id && (x.variantKey === variantKey || x.cartKey === variantKey); });
    var cq = ci ? (ci.quantity || 1) : 0;
    
    var card = document.querySelector('.product-card[data-pid="' + id + '"][data-vkey="' + variantKey + '"]');
    if (!card) return;
    var priceRow = card.querySelector('.product-price-row');
    if (!priceRow) return;
    
    var oldAdd = priceRow.querySelector('.add-btn');
    var oldQty = priceRow.querySelector('.qty-controls');
    if (oldAdd) oldAdd.remove();
    if (oldQty) oldQty.remove();
    
    var p = currentProducts.find(function(x) { return x.id === id; });
    if (!p) return;
    var bestV = getBestVariant(parseVariants(p));
    if (!bestV) return;
    
    var price = bestV.offer_price || bestV.price;
    var img = getFullUrl((p.images && p.images[0]) || p.image_url || '', 250);
    var nm = (p.name || '').replace(/'/g, "\\'");
    var unit = bestV.weight_unit || bestV.unit || p.weight_unit || p.unit || '';
    
    if (cq > 0) {
        var div = document.createElement('div');
        div.className = 'qty-controls';
        div.innerHTML = '<button class="qty-btn" onclick="event.stopPropagation();window.updateQty(\'' + id + '\',-1,\'' + variantKey + '\')">−</button>' +
                        '<span class="qty-count">' + cq + '</span>' +
                        '<button class="qty-btn" onclick="event.stopPropagation();window.updateQty(\'' + id + '\',1,\'' + variantKey + '\')">+</button>';
        priceRow.appendChild(div);
    } else {
        var btn = document.createElement('button');
        btn.className = 'add-btn';
        btn.innerHTML = '+';
        btn.onclick = function(e) { e.stopPropagation(); window.addToCart(id, nm, price, img, bestV.weight || '', unit); };
        priceRow.appendChild(btn);
    }
}

// ═══ Switch category ═══
window.switchCategory = function(catId, catNameEncoded) {
    if (!catId) return;
    var catName = decodeURIComponent(catNameEncoded);
    
    document.querySelectorAll('.sidebar-item').forEach(function(el) {
        if (el.getAttribute('data-cat-id') === catId) el.classList.add('active');
        else el.classList.remove('active');
    });
    
    categoryId = catId;
    categoryName = catName;
    
    loadProductsForCategory(catId, catName);
};

// ═══ Storage sync ═══
window.addEventListener('storage', function(e) {
    if (e.key === 'zymart_cart') CartManager.updateBadges();
});
document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') CartManager.updateBadges();
});

// ═══ Init ═══
document.addEventListener('DOMContentLoaded', function() {
    CartManager.updateBadges();
    loadSidebar();
});

})();
</script>
