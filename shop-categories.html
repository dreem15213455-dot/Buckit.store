<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Shop Categories - ZyMart+</title>
    <meta name="theme-color" content="#0B5A31">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root{--brand-green:#0B5A31;--brand-green-dark:#083D21;--brand-orange:#F59E0B;--brand-orange-dark:#E8890A;--neutral-white:#FFFFFF;--neutral-bg:#F8FAF9;--neutral-border:#E5E7EB;--neutral-gray:#6B7280;--neutral-dark:#1A1A1A;--danger:#EF4444;--success:#10B981;--shadow-xs:0 1px 2px rgba(0,0,0,0.04);--shadow-sm:0 2px 8px rgba(0,0,0,0.06);--shadow-md:0 4px 16px rgba(0,0,0,0.08);--shadow-lg:0 8px 30px rgba(0,0,0,0.10);--radius-sm:10px;--radius-md:14px;--radius-lg:18px;--radius-xl:22px;--radius-full:9999px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',-apple-system,sans-serif;background:var(--neutral-bg);color:var(--neutral-dark);padding-bottom:85px;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;min-height:100vh}
        @keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
        
        .top-bar{background:linear-gradient(135deg,var(--brand-green),var(--brand-green-dark));position:fixed;top:0;left:0;width:100%;z-index:1000;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 20px rgba(11,90,49,0.3)}
        .back-btn{width:40px;height:40px;min-width:40px;background:rgba(255,255,255,0.12);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:white;font-size:15px;text-decoration:none;transition:all 0.15s ease}
        .back-btn:active{background:rgba(255,255,255,0.25);transform:scale(0.93)}
        .top-title{font-family:'Poppins',sans-serif;flex:1;font-size:17px;font-weight:700;color:white;display:flex;align-items:center;gap:6px}
        .brand-zy{color:#A3E635}.brand-mart{color:#FDE047}
        .top-count{font-size:11px;color:rgba(255,255,255,0.8);background:rgba(255,255,255,0.15);padding:4px 12px;border-radius:var(--radius-full)}
        
        .main-content{padding-top:62px;max-width:650px;margin:0 auto;min-height:70vh}
        
        .hero-section{background:linear-gradient(135deg,#EDF7F1,#D1FAE5);margin:12px 14px;padding:18px 20px;border-radius:var(--radius-xl);display:flex;align-items:center;gap:14px;animation:slideUp 0.3s ease;border:1px solid #A7F3D0}
        .hero-icon{width:52px;height:52px;min-width:52px;background:white;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:var(--shadow-sm)}
        .hero-info h2{font-family:'Poppins',sans-serif;font-size:17px;font-weight:700;color:var(--brand-green-dark)}
        .hero-info p{font-size:12px;color:var(--neutral-gray);margin-top:2px}
        
        .location-bar{display:flex;align-items:center;gap:8px;margin:0 14px 10px;padding:10px 14px;background:white;border-radius:var(--radius-md);font-size:12px;color:var(--brand-green);cursor:pointer;border:1px solid var(--neutral-border);box-shadow:var(--shadow-xs);animation:slideUp 0.3s ease}
        .location-bar:active{background:#EDF7F1}
        .location-dot{width:10px;height:10px;background:var(--success);border-radius:50%;animation:float 2s infinite}
        
        .categories-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 14px 12px}
        .category-card{background:var(--neutral-white);border-radius:var(--radius-lg);padding:22px 16px 18px;text-align:center;border:1px solid var(--neutral-border);box-shadow:var(--shadow-xs);cursor:pointer;animation:slideUp 0.35s ease forwards;transition:all 0.2s ease;position:relative;overflow:hidden}
        .category-card:active{transform:scale(0.96);box-shadow:var(--shadow-md)}
        .category-card::after{content:'';position:absolute;top:0;left:0;width:100%;height:3px;background:var(--brand-green);transform:scaleX(0);transition:transform 0.3s ease}
        .category-card:active::after{transform:scaleX(1)}
        .category-icon{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#EDF7F1,#D1FAE5);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:26px;color:var(--brand-green);overflow:hidden;border:2px solid #C8E6C9;transition:all 0.3s ease}
        .category-card:active .category-icon{transform:scale(1.1);box-shadow:0 4px 16px rgba(11,90,49,0.2)}
        .category-icon img{width:100%;height:100%;object-fit:cover;border-radius:50%}
        .category-name{font-size:14px;font-weight:700;color:var(--neutral-dark);margin-bottom:2px}
        .category-count{font-size:10px;color:var(--neutral-gray)}
        
        .empty-state{text-align:center;padding:60px 20px;animation:fadeIn 0.4s ease}
        .empty-icon{width:80px;height:80px;background:#F3F5F4;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
        .empty-icon i{font-size:36px;color:#D1D5DB}
        .empty-state h3{font-family:'Poppins',sans-serif;font-size:18px;font-weight:700;margin-bottom:6px}
        .empty-state p{font-size:13px;color:var(--neutral-gray);margin-bottom:16px;line-height:1.5}
        .btn-primary{background:var(--brand-green);color:white;border:none;padding:12px 24px;border-radius:var(--radius-full);font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:all 0.15s ease}
        .btn-primary:active{background:var(--brand-green-dark);transform:scale(0.96)}
        
        .loading-state{text-align:center;padding:60px 20px}
        .loading-spinner{width:40px;height:40px;border:3px solid #E5E7EB;border-top-color:var(--brand-orange);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 16px}
        .loading-text{font-size:13px;color:var(--neutral-gray)}
        
        .bottom-nav{background:white;position:fixed;bottom:0;left:0;width:100%;display:flex;justify-content:space-around;padding:5px 10px 10px;box-shadow:0 -4px 20px rgba(0,0,0,0.05);z-index:1000;border-top:1px solid var(--neutral-border)}
        .nav-item{display:flex;flex-direction:column;align-items:center;font-size:9px;font-weight:500;color:var(--neutral-gray);cursor:pointer;padding:3px 10px;border-radius:var(--radius-full);border:none;background:transparent;font-family:'Inter',sans-serif;text-decoration:none;transition:all 0.15s ease}
        .nav-item:active{background:#EDF7F1}.nav-item.active{color:var(--brand-green);font-weight:700}.nav-item i{font-size:18px;margin-bottom:1px}
        
        .toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:var(--neutral-dark);color:white;padding:10px 20px;border-radius:var(--radius-full);font-size:12px;z-index:10050;opacity:0;visibility:hidden;white-space:nowrap;box-shadow:var(--shadow-md);transition:all 0.3s ease}
        .toast.show{opacity:1;visibility:visible}
        .toast.error{background:var(--danger)}.toast.success{background:var(--success)}
        
        @media(max-width:380px){.categories-grid{gap:8px}.category-card{padding:16px 10px}.category-icon{width:50px;height:50px;font-size:22px}}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="mainApp">
    <div class="top-bar">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <span class="top-title"><span class="brand-zy">Zy</span><span class="brand-mart">Mart</span></span>
        <span class="top-count" id="catCount">Categories</span>
    </div>
    
    <div class="main-content" id="mainContent">
        <div class="loading-state"><div class="loading-spinner"></div><p class="loading-text">Loading categories...</p></div>
    </div>
</div>

<nav class="bottom-nav">
    <a class="nav-item" href="index.html"><i class="fas fa-home"></i><span>Home</span></a>
    <a class="nav-item" href="products.html"><i class="fas fa-box"></i><span>Browse</span></a>
    <a class="nav-item" href="cart.html"><i class="fas fa-shopping-cart"></i><span>Cart</span></a>
    <a class="nav-item" href="orders.html"><i class="fas fa-receipt"></i><span>Orders</span></a>
    <a class="nav-item active"><i class="fas fa-tags"></i><span>Categories</span></a>
</nav>

<div class="toast" id="toastMsg"><span id="toastText"></span></div>

<script>
(function(){'use strict';
window.addEventListener('error',function(e){console.error('[Categories]',e.message);try{showToast('Something went wrong','error');}catch(_){}});

var sb=supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co','sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1');
var SUPABASE_URL='https://zwajyovemwdqtkecipeb.supabase.co';

function $(id){return document.getElementById(id);}
function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function getFullUrl(u){if(!u||typeof u!=='string')return'';if(u.indexOf('http')===0||u.indexOf('data:')===0)return u;return SUPABASE_URL+'/storage/v1/object/public/'+u;}
function showToast(m,type){var t=$('toastMsg'),s=$('toastText');if(!t||!s)return;s.textContent=m;t.className='toast';if(type==='error')t.classList.add('error');else if(type==='success')t.classList.add('success');t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show','error','success');},2500);}
window.fastNavigate=function(url){window.location.href=url;};

var categoryIcons={
'grocery':'fa-basket-shopping','groceries':'fa-basket-shopping','food':'fa-utensils','restaurant':'fa-utensils',
'fashion':'fa-tshirt','clothing':'fa-tshirt','clothes':'fa-tshirt','medical':'fa-prescription','pharmacy':'fa-prescription','medicine':'fa-prescription',
'electronics':'fa-mobile-screen','mobile':'fa-mobile-screen','hardware':'fa-tools','stationery':'fa-pen-ruler',
'dairy':'fa-cow','milk':'fa-cow','bakery':'fa-bread-slice','meat':'fa-drumstick-bite','fish':'fa-fish',
'vegetables':'fa-carrot','fruits':'fa-apple-whole','organic':'fa-leaf','beauty':'fa-spa','cosmetics':'fa-spa',
'jewelry':'fa-gem','jewellery':'fa-gem','books':'fa-book','sports':'fa-futbol','toys':'fa-puzzle-piece',
'flowers':'fa-seedling','gifts':'fa-gift','general':'fa-store','kirana':'fa-store'
};

function getCategoryIcon(name){
var key=(name||'').toLowerCase();
for(var k in categoryIcons){if(key.includes(k))return categoryIcons[k];}
return 'fa-store';
}

async function loadCategories(){
var c=$('mainContent');if(!c)return;
try{
var cr=await sb.from('categories').select('*').eq('is_active',true).eq('is_on_hold',false).order('priority');
var cats=(cr&&cr.data)?cr.data:[];
$('catCount').textContent=(cats.length||0)+' categories';

if(!cats.length){
c.innerHTML='<div class="empty-state"><div class="empty-icon"><i class="fas fa-tags"></i></div><h3>No Categories</h3><p>Shop categories coming soon!</p><a href="index.html" class="btn-primary"><i class="fas fa-home"></i> Go Home</a></div>';
return;
}

var locShort=localStorage.getItem('location_short')||'';
var h='';

// Hero section
h+='<div class="hero-section"><div class="hero-icon">🏪</div><div class="hero-info"><h2>Shop Categories</h2><p>Find shops by category near you</p></div></div>';

// Location bar
if(locShort){
h+='<div class="location-bar" onclick="window.location.href=\'set-location.html\'"><div class="location-dot"></div><span>📍 '+esc(locShort)+'</span></div>';
}

// Categories grid
h+='<div class="categories-grid">';
for(var i=0;i<cats.length;i++){
var cat=cats[i],imgUrl=getFullUrl(cat.image_url),icon=getCategoryIcon(cat.name);
h+='<div class="category-card" onclick="fastNavigate(\'category-shops.html?id='+cat.id+'&name='+encodeURIComponent(cat.name)+'\')" style="animation-delay:'+(i*0.04)+'s">';
h+='<div class="category-icon">'+(imgUrl?'<img src="'+imgUrl+'" loading="lazy" onerror="this.innerHTML=\'<i class=\\\'fas '+icon+'\\\'></i>\'">':'<i class="fas '+icon+'"></i>')+'</div>';
h+='<div class="category-name">'+esc(cat.name)+'</div>';
h+='</div>';
}
h+='</div>';

c.innerHTML=h;
}catch(e){
console.error('[Categories] Error:',e);
c.innerHTML='<div class="empty-state"><div class="empty-icon"><i class="fas fa-exclamation-circle"></i></div><h3>Failed to Load</h3><p>Please check your connection</p><button class="btn-primary" onclick="loadCategories()"><i class="fas fa-redo"></i> Retry</button></div>';
}
}

document.addEventListener('DOMContentLoaded',loadCategories);
})();
</script>
</body>
</html>
