<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>दुकान श्रेणियाँ - Zymart</title>
    <meta name="theme-color" content="#0B5A31">
    <meta name="description" content="Zymart पर सभी दुकान श्रेणियाँ ब्राउज़ करें">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --brand-green: #0B5A31; --brand-orange: #F59E0B;
            --neutral-white: #FFFFFF; --neutral-bg: #F9FAFB; --neutral-border: #E5E7EB;
            --neutral-gray: #6B7280; --neutral-dark: #1A1A1A;
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --radius-sm: 10px; --radius-md: 14px; --radius-lg: 18px; --radius-full: 9999px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--neutral-bg); color: var(--neutral-dark);
            padding-bottom: 85px; -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased; min-height: 100vh;
        }
        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes skel { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
        
        #simpleLoader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--neutral-white); z-index: 10002; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; transition: opacity 0.3s ease; }
        #simpleLoader.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
        .simple-spinner { width: 34px; height: 34px; border: 2.5px solid var(--neutral-border); border-top-color: var(--brand-orange); border-radius: 50%; animation: spin 0.7s linear infinite; }
        .loader-logo { font-family: 'Poppins', sans-serif; font-size: 22px; font-weight: 700; }
        .loader-zy { color: var(--brand-green); } .loader-mart { color: var(--brand-orange); }
        
        .top-bar { background: var(--brand-green); position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; padding: 10px 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 16px rgba(11,90,49,0.3); }
        .back-btn { width: 40px; height: 40px; min-width: 40px; background: rgba(255,255,255,0.10); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 15px; transition: all 0.15s ease; }
        .back-btn:active { background: rgba(255,255,255,0.22); transform: scale(0.93); }
        .top-title { font-family: 'Poppins', sans-serif; flex: 1; font-size: 16px; font-weight: 700; color: white; }
        .main-content { padding-top: 62px; max-width: 600px; margin: 0 auto; min-height: 70vh; }
        
        .categories-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 12px 14px; }
        .category-card { background: var(--neutral-white); border-radius: var(--radius-lg); padding: 20px 16px; text-align: center; border: 1px solid var(--neutral-border); box-shadow: var(--shadow-xs); cursor: pointer; animation: slideUp 0.3s ease forwards; transition: transform 0.15s ease; }
        .category-card:active { transform: scale(0.96); }
        .category-icon { width: 56px; height: 56px; border-radius: 50%; background: #EDF7F1; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; font-size: 24px; color: var(--brand-green); overflow: hidden; }
        .category-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .category-name { font-size: 14px; font-weight: 600; }
        
        .skeleton-card { background: var(--neutral-white); border-radius: var(--radius-lg); padding: 20px 16px; text-align: center; border: 1px solid var(--neutral-border); }
        .skeleton-circle { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(90deg,#f0f4f2 25%,#e4ebe7 50%,#f0f4f2 75%); background-size: 200% 100%; animation: skel 1.3s infinite; margin: 0 auto 10px; }
        .skeleton-text { height: 11px; border-radius: 4px; background: linear-gradient(90deg,#f0f4f2 25%,#e4ebe7 50%,#f0f4f2 75%); background-size: 200% 100%; animation: skel 1.3s infinite; width: 70%; margin: 0 auto; }
        
        .empty-state { text-align: center; padding: 55px 20px; animation: slideUp 0.4s ease; }
        .empty-state i { font-size: 48px; color: #D1D5DB; display: block; margin-bottom: 12px; }
        .empty-state h3 { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .empty-state p { font-size: 13px; color: var(--neutral-gray); margin-bottom: 14px; }
        .empty-state button { background: var(--brand-green); color: white; border: none; padding: 10px 22px; border-radius: var(--radius-full); font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
        
        .bottom-nav { background: white; position: fixed; bottom: 0; left: 0; width: 100%; display: flex; justify-content: space-around; padding: 5px 10px 10px; box-shadow: 0 -4px 16px rgba(0,0,0,0.03); z-index: 1000; border-top: 1px solid var(--neutral-border); }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 9px; font-weight: 500; color: var(--neutral-gray); cursor: pointer; padding: 3px 10px; border-radius: var(--radius-full); border: none; background: transparent; transition: all 0.15s ease; font-family: 'Inter', sans-serif; }
        .nav-item:active { background: #EDF7F1; } .nav-item.active { color: var(--brand-green); font-weight: 600; } .nav-item i { font-size: 18px; margin-bottom: 1px; }
        
        .toast { position: fixed; bottom: 95px; left: 50%; transform: translateX(-50%); background: var(--neutral-dark); color: white; padding: 9px 18px; border-radius: var(--radius-full); font-size: 11px; z-index: 10050; opacity: 0; visibility: hidden; white-space: nowrap; box-shadow: var(--shadow-md); transition: all 0.3s ease; }
        .toast.show { opacity: 1; visibility: visible; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="simpleLoader"><div class="simple-spinner"></div><div class="loader-logo"><span class="loader-zy">Zy</span><span class="loader-mart">mart</span></div></div>

<div id="mainApp" style="display:none;">
    <div class="top-bar">
        <button class="back-btn" onclick="goBack()" aria-label="वापस"><i class="fas fa-arrow-left"></i></button>
        <span class="top-title">दुकान श्रेणियाँ</span>
    </div>
    <div class="main-content" id="mainContent">
        <div class="categories-grid">
            <div class="skeleton-card"><div class="skeleton-circle"></div><div class="skeleton-text"></div></div>
            <div class="skeleton-card"><div class="skeleton-circle"></div><div class="skeleton-text"></div></div>
            <div class="skeleton-card"><div class="skeleton-circle"></div><div class="skeleton-text"></div></div>
            <div class="skeleton-card"><div class="skeleton-circle"></div><div class="skeleton-text"></div></div>
        </div>
    </div>
</div>

<nav class="bottom-nav">
    <button class="nav-item" onclick="fastNavigate('index.html')"><i class="fas fa-home"></i><span>होम</span></button>
    <button class="nav-item" onclick="fastNavigate('products.html')"><i class="fas fa-box"></i><span>खोजें</span></button>
    <button class="nav-item" onclick="fastNavigate('cart.html')"><i class="fas fa-shopping-cart"></i><span>कार्ट</span></button>
    <button class="nav-item" onclick="fastNavigate('profile.html')"><i class="fas fa-user"></i><span>प्रोफाइल</span></button>
    <button class="nav-item active"><i class="fas fa-tags"></i><span>श्रेणियाँ</span></button>
</nav>

<div class="toast" id="toastMsg"></div>

<script>
(function() {
    'use strict';
    
    window.addEventListener('error', function(e) { console.error('[Zymart Shop Categories]', e.message); });
    window.addEventListener('unhandledrejection', function(e) { console.error('[Zymart Shop Categories]', e.reason); e.preventDefault(); });
    
    function $(id) { return document.getElementById(id); }
    function esc(str) { if (!str) return ''; var d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
    
    var sb = null;
    try { sb = supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co', 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1'); }
    catch(e) { sb = { from: function() { return { select: function() { return { eq: function() { return { order: function() { return Promise.resolve({ data: [] }); } }; } }; } }; } }; }
    var SUPABASE_URL = 'https://zwajyovemwdqtkecipeb.supabase.co';
    var initComplete = false;
    
    function getFullUrl(u) { if (!u || typeof u !== 'string') return ''; if (u.indexOf('http')===0 || u.indexOf('data:')===0) return u; return SUPABASE_URL + '/storage/v1/object/public/' + u; }
    function showApp() { var l = $('simpleLoader'), a = $('mainApp'); if (a) a.style.display = ''; if (l) { l.classList.add('fade-out'); setTimeout(function() { if (l && l.parentNode) l.parentNode.removeChild(l); }, 300); } }
    function showToast(m, e) { var t = $('toastMsg'); if (!t) return; t.textContent = m; t.style.background = e ? '#EF4444' : '#1A1A1A'; t.classList.add('show'); clearTimeout(t._timer); t._timer = setTimeout(function() { t.classList.remove('show'); }, 2500); }
    function goBack() { try { if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) { window.history.back(); return; } } catch(e) {} window.location.href = 'index.html'; }
    window.fastNavigate = function(url) { window.location.href = url; };
    
    window.addEventListener('online', function() { showToast('✅ इंटरनेट बहाल!'); if(initComplete) loadCategories(); });
    window.addEventListener('offline', function() { showToast('⚠️ ऑफलाइन', true); });
    
    async function loadCategories() {
        var c = $('mainContent');
        if (!c) return;
        try {
            var cr = await sb.from('categories').select('*').eq('is_active', true).order('name');
            var cats = (cr && cr.data) ? cr.data : [];
            
            if (!cats.length) { c.innerHTML = '<div class="empty-state"><i class="fas fa-tags"></i><h3>कोई श्रेणी नहीं</h3><p>अभी तक कोई श्रेणी उपलब्ध नहीं है</p><button onclick="fastNavigate(\'index.html\')">होम पेज पर जाएं</button><button onclick="fastNavigate(\'shop-register.html\')" style="margin-top:8px;background:var(--brand-orange);">🏪 दुकान रजिस्टर करें</button></div>'; return; }
            
            var iconMap = {
                'Grocery & Kirana':'fa-shopping-basket','Fresh Vegetables':'fa-carrot','Fresh Fruits':'fa-apple-alt',
                'Dairy Products':'fa-cheese','Bakery Items':'fa-bread-slice','Personal Care':'fa-pump-soap',
                'Household Items':'fa-home','Beverages':'fa-mug-hot','Snacks & Biscuits':'fa-cookie',
                'Frozen Foods':'fa-snowflake','Spices & Masala':'fa-mortar-pestle','Rice & Grains':'fa-wheat-awn'
            };
            
            var h = '<div class="categories-grid">';
            for (var i = 0; i < cats.length; i++) {
                var cat = cats[i], icon = iconMap[cat.name] || 'fa-store', imgUrl = getFullUrl(cat.image_url);
                h += '<div class="category-card" onclick="fastNavigate(\'category-shops.html?id=' + cat.id + '&name=' + encodeURIComponent(cat.name) + '\')" style="animation-delay:' + (i*0.05) + 's;">';
                h += '<div class="category-icon">' + (imgUrl ? '<img src="' + imgUrl + '" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">' : '') + '<i class="fas ' + icon + '"' + (imgUrl ? ' style="display:none;"' : '') + '></i></div>';
                h += '<div class="category-name">' + esc(cat.name) + '</div></div>';
            }
            h += '</div>';
            c.innerHTML = h;
        } catch(e) { c.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>लोड विफल</h3><p>कनेक्शन जांचें</p><button onclick="loadCategories()">🔄 पुनः प्रयास</button></div>'; showToast('❌ लोड विफल', true); }
    }
    
    window.handleBackPress = function() { goBack(); return true; };
    document.addEventListener('DOMContentLoaded', function() { loadCategories(); showApp(); initComplete = true; });
    window.goBack = goBack;
})();
</script>
</body>
</html>
