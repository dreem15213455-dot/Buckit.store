<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Profile - Zatpat</title>
    <meta name="theme-color" content="#16A34A">
    
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #16A34A;
            --primary-light: #22C55E;
            --primary-bg-light: #F0FDF4;
            --accent-orange: #F97316;
            --bg-white: #FFFFFF;
            --bg-light: #F9FAFB;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --border-light: #E5E7EB;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-full: 9999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
            overflow-x: hidden;
            padding-bottom: 85px;
            -webkit-font-smoothing: antialiased;
        }

        #pageProgress {
            position: fixed; top: 0; left: 0; width: 0%; height: 3px;
            background: var(--primary); z-index: 10001; transition: width 0.3s ease;
        }
        #pageProgress.loading { width: 90%; }
        #pageProgress.complete { width: 100%; opacity: 0; transition: opacity 0.3s; }

        /* Top Bar */
        .top-bar {
            background: var(--bg-white); position: sticky; top: 0; left: 0; width: 100%;
            z-index: 1000; padding: 12px 16px; box-shadow: var(--shadow-sm);
            border-bottom: 1px solid var(--border-light); display: flex; align-items: center; gap: 12px;
        }
        .back-btn {
            width: 40px; height: 40px; background: var(--bg-light); border-radius: var(--radius-full);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .top-title {
            flex: 1; font-size: 18px; font-weight: 700;
        }

        /* Profile Header */
        .profile-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            padding: 30px 20px 40px; text-align: center; color: white;
        }
        .avatar {
            width: 90px; height: 90px; background: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; margin: 0 auto 12px;
            border: 4px solid rgba(255,255,255,0.3);
        }
        .avatar i { font-size: 50px; color: var(--primary); }
        .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .profile-name { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .profile-email { font-size: 13px; opacity: 0.9; margin-bottom: 4px; }
        .profile-phone { font-size: 13px; opacity: 0.9; }
        .edit-profile-btn {
            background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 20px; border-radius: var(--radius-full); font-size: 13px; font-weight: 600;
            margin-top: 16px; cursor: pointer; display: inline-block;
        }

        /* Stats Cards */
        .stats-container {
            display: flex; gap: 12px; padding: 20px 16px; margin-top: -20px;
        }
        .stat-card {
            flex: 1; background: var(--bg-white); border-radius: var(--radius-md);
            padding: 16px; text-align: center; box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
        }
        .stat-icon {
            width: 40px; height: 40px; background: var(--primary-bg-light);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 10px;
        }
        .stat-icon i { font-size: 18px; color: var(--primary); }
        .stat-value { font-size: 22px; font-weight: 800; color: var(--primary); }
        .stat-label { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }

        /* Menu Section */
        .menu-section {
            background: var(--bg-white); border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            padding: 20px 0; margin-top: 8px;
        }
        .menu-group { margin-bottom: 24px; }
        .menu-group-title {
            font-size: 12px; font-weight: 600; color: var(--text-secondary);
            text-transform: uppercase; letter-spacing: 0.5px;
            padding: 0 16px; margin-bottom: 12px;
        }
        .menu-item {
            display: flex; align-items: center; gap: 14px; padding: 14px 16px;
            cursor: pointer; transition: background 0.2s;
        }
        .menu-item:hover { background: var(--bg-light); }
        .menu-icon {
            width: 40px; height: 40px; background: var(--primary-bg-light);
            border-radius: var(--radius-md); display: flex; align-items: center;
            justify-content: center;
        }
        .menu-icon i { font-size: 18px; color: var(--primary); }
        .menu-content { flex: 1; }
        .menu-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
        .menu-subtitle { font-size: 11px; color: var(--text-secondary); }
        .menu-arrow { color: var(--text-secondary); }

        /* Login Prompt */
        .login-prompt {
            text-align: center; padding: 60px 20px;
        }
        .login-prompt i { font-size: 64px; color: var(--border-light); margin-bottom: 20px; }
        .login-prompt h3 { font-size: 20px; margin-bottom: 8px; }
        .login-prompt p { color: var(--text-secondary); margin-bottom: 24px; }
        .login-btn {
            background: var(--primary); color: white; border: none;
            padding: 14px 32px; border-radius: var(--radius-full);
            font-size: 16px; font-weight: 600; cursor: pointer;
        }

        /* Toast */
        .toast-notification {
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
            background: var(--text-primary); color: white; padding: 10px 20px;
            border-radius: var(--radius-full); font-size: 12px; z-index: 10050;
            display: none; white-space: nowrap;
        }
        .toast-notification.show { display: flex; }

        /* Bottom Navigation */
        .bottom-nav {
            background: white; position: fixed; bottom: 0; left: 0; width: 100%;
            display: flex; justify-content: space-around; padding: 6px 16px 8px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.06); z-index: 1000;
            border-top: 1px solid var(--border-light);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            font-size: 10px; font-weight: 500; color: var(--text-secondary); cursor: pointer; position: relative;
        }
        .nav-item.active { color: var(--primary); font-weight: 600; }
        .nav-item i { font-size: 20px; margin-bottom: 2px; }
        .cart-count {
            position: absolute; top: -5px; right: -5px; background: var(--primary); color: white;
            border-radius: 50%; width: 16px; height: 16px; font-size: 9px; display: flex;
            align-items: center; justify-content: center; border: 2px solid white;
        }

        /* Loading */
        .loading-spinner {
            text-align: center; padding: 60px;
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid var(--border-light);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="pageProgress"></div>
<div id="toastMsg" class="toast-notification"><span id="toastText"></span></div>

<div id="mainApp">
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
        <div class="top-title">My Profile</div>
    </div>

    <!-- Main Content -->
    <div id="profileContent">
        <div class="loading-spinner"><div class="spinner"></div></div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a class="nav-item" onclick="fastNavigate('index.html')"><i class="fas fa-home"></i><span>Home</span></a>
        <a class="nav-item" onclick="fastNavigate('products.html')"><i class="fas fa-search"></i><span>Explore</span></a>
        <a class="nav-item" onclick="fastNavigate('cart.html')"><i class="fas fa-shopping-bag"></i><span>Cart</span><span class="cart-count" id="cartCount">0</span></a>
        <a class="nav-item active" onclick="fastNavigate('profile.html')"><i class="fas fa-user"></i><span>Profile</span></a>
        <a class="nav-item" onclick="fastNavigate('orders.html')"><i class="fas fa-receipt"></i><span>Orders</span></a>
    </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const supabaseUrl = 'https://zwajyovemwdqtkecipeb.supabase.co';
    const supabaseKey = 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1';
    const zatpatDB = supabase.createClient(supabaseUrl, supabaseKey);

    let currentUser = null;
    let userStats = { orders: 0, wishlist: 0, saved: 0 };

    function startProgress() { const b = document.getElementById('pageProgress'); b.style.width = '0%'; b.classList.add('loading'); setTimeout(() => b.style.width = '90%', 10); }
    function completeProgress() { const b = document.getElementById('pageProgress'); b.classList.remove('loading'); b.classList.add('complete'); setTimeout(() => { b.style.width = '0%'; b.classList.remove('complete'); }, 300); }
    window.fastNavigate = function(url) { startProgress(); setTimeout(() => window.location.href = url, 50); };
    function goBack() { window.history.back(); }

    function showToast(msg) {
        const t = document.getElementById('toastMsg');
        document.getElementById('toastText').innerHTML = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    function updateCartBadge() {
        const cart = JSON.parse(localStorage.getItem('zatpat_cart')) || [];
        document.getElementById('cartCount').innerText = cart.reduce((s, i) => s + (i.quantity || 1), 0);
    }

    async function checkUser() {
        const { data: { session } } = await zatpatDB.auth.getSession();
        currentUser = session?.user || null;
        return currentUser;
    }

    async function loadUserStats() {
        if (!currentUser) return;
        
        try {
            // Get orders count
            const { count: orderCount } = await zatpatDB
                .from('orders')
                .select('*', { count: 'exact', head: true })
                .eq('user_id', currentUser.id);
            
            // Get wishlist count
            const wishlist = JSON.parse(localStorage.getItem('zatpat_wishlist')) || [];
            
            userStats = {
                orders: orderCount || 0,
                wishlist: wishlist.length,
                saved: 0
            };
        } catch (e) {}
    }

    async function loadProfile() {
        await checkUser();
        await loadUserStats();
        
        const container = document.getElementById('profileContent');
        
        if (!currentUser) {
            container.innerHTML = `
                <div class="login-prompt">
                    <i class="fas fa-user-circle"></i>
                    <h3>Welcome to Zatpat</h3>
                    <p>Login to view your profile and track orders</p>
                    <button class="login-btn" onclick="showAuthModal()">Login / Register</button>
                </div>
            `;
            return;
        }

        const metadata = currentUser.user_metadata || {};
        const name = metadata.name || currentUser.email?.split('@')[0] || 'User';
        const phone = metadata.phone || 'Not provided';
        const email = currentUser.email || '';

        container.innerHTML = `
            <div class="profile-header">
                <div class="avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="profile-name">${name}</div>
                <div class="profile-email"><i class="far fa-envelope"></i> ${email}</div>
                <div class="profile-phone"><i class="fas fa-phone-alt"></i> ${phone}</div>
                <button class="edit-profile-btn" onclick="showToast('📝 Edit profile coming soon')">
                    <i class="fas fa-pen"></i> Edit Profile
                </button>
            </div>

            <div class="stats-container">
                <div class="stat-card" onclick="fastNavigate('orders.html')">
                    <div class="stat-icon"><i class="fas fa-receipt"></i></div>
                    <div class="stat-value">${userStats.orders}</div>
                    <div class="stat-label">Orders</div>
                </div>
                <div class="stat-card" onclick="fastNavigate('wishlist.html')">
                    <div class="stat-icon"><i class="fas fa-heart"></i></div>
                    <div class="stat-value">${userStats.wishlist}</div>
                    <div class="stat-label">Wishlist</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-wallet"></i></div>
                    <div class="stat-value">₹0</div>
                    <div class="stat-label">Wallet</div>
                </div>
            </div>

            <div class="menu-section">
                <div class="menu-group">
                    <div class="menu-group-title">My Account</div>
                    <div class="menu-item" onclick="fastNavigate('orders.html')">
                        <div class="menu-icon"><i class="fas fa-shopping-bag"></i></div>
                        <div class="menu-content">
                            <div class="menu-title">My Orders</div>
                            <div class="menu-subtitle">Track and manage orders</div>
                        </div>
                        <div class="menu-arrow"><i class="fas fa-chevron-right"></i></div>
                    </div>
                    <div class="menu-item" onclick="fastNavigate('wishlist.html')">
                        <div class="menu-icon"><i class="fas fa-heart"></i></div>
                        <div class="menu-content">
                            <div class="menu-title">Wishlist</div>
                            <div class="menu-subtitle">${userStats.wishlist} saved items</div>
                        </div>
                        <div class="menu-arrow"><i class="fas fa-chevron-right"></i></div>
                    </div>
                    <div class="menu-item" onclick="fastNavigate('cart.html')">
                        <div class="menu-icon"><i class="fas fa-shopping-cart"></i></div>
                        <div class="menu-content">
                            <div class="menu-title">My Cart</div>
                            <div class="menu-subtitle">View your cart</div>
                        </div>
                        <div class="menu-arrow"><i class="fas fa-chevron-right"></i></div>
                    </div>
                </div>

                <div class="menu-group">
                    <div class="menu-group-title">Support</div>
                    <div class="menu-item" onclick="window.open('https://wa.me/918600252238', '_blank')">
                        <div class="menu-icon"><i class="fab fa-whatsapp"></i></div>
                        <div class="menu-content">
                            <div class="menu-title">WhatsApp Support</div>
                            <div class="menu-subtitle">Get help instantly</div>
                        </div>
                        <div class="menu-arrow"><i class="fas fa-chevron-right"></i></div>
                    </div>
                    <div class="menu-item" onclick="fastNavigate('privacy-policy.html')">
                        <div class="menu-icon"><i class="fas fa-shield-alt"></i></div>
                        <div class="menu-content">
                            <div class="menu-title">Privacy Policy</div>
                        </div>
                        <div class="menu-arrow"><i class="fas fa-chevron-right"></i></div>
                    </div>
                    <div class="menu-item" onclick="fastNavigate('terms.html')">
                        <div class="menu-icon"><i class="fas fa-file-contract"></i></div>
                        <div class="menu-content">
                            <div class="menu-title">Terms & Conditions</div>
                        </div>
                        <div class="menu-arrow"><i class="fas fa-chevron-right"></i></div>
                    </div>
                    <div class="menu-item" onclick="fastNavigate('refund-policy.html')">
                        <div class="menu-icon"><i class="fas fa-money-bill-wave"></i></div>
                        <div class="menu-content">
                            <div class="menu-title">Refund Policy</div>
                        </div>
                        <div class="menu-arrow"><i class="fas fa-chevron-right"></i></div>
                    </div>
                </div>

                <div class="menu-group">
                    <div class="menu-group-title">Other</div>
                    <div class="menu-item" onclick="showAboutUs()">
                        <div class="menu-icon"><i class="fas fa-info-circle"></i></div>
                        <div class="menu-content">
                            <div class="menu-title">About Zatpat</div>
                            <div class="menu-subtitle">Version 3.0.0</div>
                        </div>
                        <div class="menu-arrow"><i class="fas fa-chevron-right"></i></div>
                    </div>
                    <div class="menu-item" onclick="fastNavigate('delete-account.html')">
                        <div class="menu-icon"><i class="fas fa-trash-alt"></i></div>
                        <div class="menu-content">
                            <div class="menu-title">Delete Account</div>
                        </div>
                        <div class="menu-arrow"><i class="fas fa-chevron-right"></i></div>
                    </div>
                    <div class="menu-item" onclick="handleLogout()">
                        <div class="menu-icon"><i class="fas fa-sign-out-alt"></i></div>
                        <div class="menu-content">
                            <div class="menu-title" style="color: #EF4444;">Logout</div>
                        </div>
                        <div class="menu-arrow"><i class="fas fa-chevron-right"></i></div>
                    </div>
                </div>
            </div>
        `;
    }

    window.showAuthModal = function() {
        localStorage.setItem('redirect_after_login', 'profile.html');
        fastNavigate('index.html');
        setTimeout(() => {
            const event = new CustomEvent('openAuth');
            window.dispatchEvent(event);
        }, 500);
    };

    window.showAboutUs = function() {
        showToast('🚀 Zatpat v3.0.0 - Local Delivery App');
    };

    async function handleLogout() {
        if (confirm('Are you sure you want to logout?')) {
            await zatpatDB.auth.signOut();
            localStorage.removeItem('zatpat_cart');
            showToast('👋 Logged out successfully');
            setTimeout(() => fastNavigate('index.html'), 500);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        updateCartBadge();
        loadProfile();
    });

    window.goBack = goBack;
    window.showAuthModal = showAuthModal;
    window.handleLogout = handleLogout;
    window.showAboutUs = showAboutUs;
</script>
</body>
</html>
