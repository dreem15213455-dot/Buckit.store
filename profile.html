<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Profile - ZyMart+</title>
    <meta name="theme-color" content="#0B5A31">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link rel="preconnect" href="https://res.cloudinary.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --brand-green: #0B5A31; --brand-green-dark: #083D21; --brand-orange: #F59E0B; 
            --brand-orange-dark: #E8890A; --neutral-white: #FFFFFF; --neutral-bg: #F9FAFB; 
            --neutral-border: #E5E7EB; --neutral-gray: #6B7280; --neutral-dark: #1A1A1A; 
            --danger: #EF4444; --success: #10B981; 
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); --shadow-sm: 0 1px 4px rgba(0,0,0,0.06); 
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08); 
            --radius-sm: 10px; --radius-md: 14px; --radius-lg: 18px; --radius-xl: 22px; 
            --radius-full: 9999px; 
            --status-bar-height: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter',-apple-system,sans-serif; 
            background: var(--neutral-bg); 
            color: var(--neutral-dark); 
            padding-bottom: calc(85px + var(--safe-bottom)); 
            -webkit-tap-highlight-color: transparent; 
            -webkit-font-smoothing: antialiased; 
            min-height: 100vh; 
        }
        @keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 4px 12px rgba(245,158,11,0.25); } 50% { box-shadow: 0 4px 20px rgba(245,158,11,0.45); } }
        
        .top-bar { 
            background: var(--brand-green); 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; 
            z-index: 100; 
            padding: 10px 14px; 
            padding-top: calc(10px + var(--status-bar-height)); 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            box-shadow: 0 2px 16px rgba(11,90,49,0.3); 
        }
        .back-btn { 
            width: 40px; height: 40px; min-width: 40px; 
            background: rgba(255,255,255,0.10); 
            border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; border: none; color: white; font-size: 15px; 
            text-decoration: none; 
        }
        .back-btn:active { background: rgba(255,255,255,0.22); transform: scale(0.93); }
        .top-title { font-family: 'Poppins',sans-serif; flex: 1; font-size: 16px; font-weight: 700; color: white; }
        .brand-zy { color: #A3E635; } .brand-mart { color: #FDE047; }
        
        .main-content { 
            padding-top: calc(62px + var(--status-bar-height)); 
            max-width: 600px; 
            margin: 0 auto; 
        }
        
        .profile-header { 
            background: linear-gradient(135deg,var(--brand-green),#083D21); 
            margin: 12px 14px; 
            padding: 26px 20px; 
            border-radius: var(--radius-xl); 
            color: white; 
            text-align: center; 
            animation: slideUp 0.3s ease; 
            box-shadow: 0 4px 20px rgba(11,90,49,0.3); 
            position: relative; 
        }
        .avatar-container { position: relative; width: 80px; height: 80px; margin: 0 auto 14px; cursor: pointer; }
        .avatar { 
            width: 80px; height: 80px; 
            border-radius: 50%; 
            background: rgba(255,255,255,0.15); 
            display: flex; align-items: center; justify-content: center; 
            font-size: 36px; 
            border: 3px solid rgba(255,255,255,0.25); 
            overflow: hidden; 
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-edit-badge { 
            position: absolute; bottom: 0; right: 0; 
            width: 28px; height: 28px; 
            background: var(--brand-orange); 
            border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 12px; 
            border: 2px solid white; 
            color: #1a1a1a; 
        }
        .profile-name { font-family: 'Poppins',sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 2px; }
        .profile-email { font-size: 13px; opacity: 0.85; word-break: break-all; }
        .profile-phone { font-size: 12px; opacity: 0.7; margin-top: 3px; }
        .role-badge { 
            display: inline-block; 
            background: rgba(255,255,255,0.2); 
            padding: 3px 10px; 
            border-radius: 9999px; 
            font-size: 10px; 
            font-weight: 600; 
            margin-top: 6px; 
        }
        
        .shop-dash-cta {
            margin: 0 14px 10px;
            padding: 14px 16px;
            background: linear-gradient(135deg, #FFF8EB, #FEF3C7);
            border: 2px solid #F59E0B;
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(245,158,11,0.15);
            animation: slideUp 0.3s ease, pulseGlow 3s ease-in-out infinite;
        }
        .shop-dash-cta:active { transform: scale(0.98); }
        .shop-dash-cta-icon {
            width: 44px; height: 44px; min-width: 44px;
            background: linear-gradient(135deg, #F59E0B, #EF4444);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 18px;
            box-shadow: 0 3px 8px rgba(245,158,11,0.35);
        }
        .shop-dash-cta-text { flex: 1; }
        .shop-dash-cta-title {
            font-family: 'Poppins', sans-serif;
            font-size: 14px; font-weight: 700;
            color: #92400E; margin-bottom: 2px;
        }
        .shop-dash-cta-sub { font-size: 11px; color: #B45309; font-weight: 500; }
        .shop-dash-cta-arrow { color: #92400E; font-size: 14px; }
        
        .menu-section { 
            background: var(--neutral-white); 
            margin: 10px 14px; 
            border-radius: var(--radius-lg); 
            overflow: hidden; 
            border: 1px solid var(--neutral-border); 
            box-shadow: var(--shadow-xs); 
        }
        .menu-item { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            padding: 15px 16px; 
            cursor: pointer; 
            border-bottom: 1px solid var(--neutral-border); 
            font-size: 13px; 
            font-weight: 500; 
            text-decoration: none; 
            color: var(--neutral-dark); 
            transition: background 0.1s ease; 
        }
        .menu-item:last-child { border-bottom: none; }
        .menu-item:active { background: #EDF7F1; }
        .icon-circle { 
            width: 38px; height: 38px; min-width: 38px; 
            border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 15px; 
            flex-shrink: 0; 
        }
        .icon-green { background: #EDF7F1; color: var(--brand-green); }
        .icon-orange { background: #FFF8EB; color: var(--brand-orange); }
        .icon-red { background: #FEF2F2; color: var(--danger); }
        .icon-blue { background: #EFF6FF; color: #2563EB; }
        .icon-purple { background: #F5F3FF; color: #7C3AED; }
        .menu-text { flex: 1; }
        .menu-label { font-size: 14px; font-weight: 600; }
        .menu-sub { font-size: 11px; color: var(--neutral-gray); }
        .menu-arrow { color: #D1D5DB; font-size: 13px; }
        
        .edit-modal { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(8,61,33,0.7); 
            backdrop-filter: blur(6px); 
            display: none; 
            align-items: flex-end; 
            justify-content: center; 
            z-index: 1000; 
        }
        .edit-modal.show { display: flex; }
        .edit-card { 
            background: white; 
            border-radius: var(--radius-xl) var(--radius-xl) 0 0; 
            width: 100%; 
            max-width: 500px; 
            padding: 22px; 
            padding-bottom: calc(22px + var(--safe-bottom)); 
            animation: slideUp 0.3s ease; 
            max-height: 85vh; 
            overflow-y: auto; 
        }
        .edit-header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 16px; 
            padding-bottom: 12px; 
            border-bottom: 1px solid var(--neutral-border); 
            position: sticky; top: 0; 
            background: white; 
            z-index: 1; 
        }
        .edit-header h3 { font-family: 'Poppins',sans-serif; font-size: 17px; font-weight: 700; }
        .edit-close { 
            width: 36px; height: 36px; 
            background: var(--neutral-bg); 
            border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; border: none; font-size: 14px; color: var(--neutral-gray); 
        }
        .form-group { margin-bottom: 14px; }
        .form-label { font-size: 12px; font-weight: 600; color: var(--neutral-gray); margin-bottom: 5px; display: block; }
        .form-control { 
            width: 100%; 
            padding: 12px 14px; 
            border: 1.5px solid var(--neutral-border); 
            border-radius: var(--radius-sm); 
            font-size: 14px; 
            font-family: 'Inter',sans-serif; 
            outline: none; 
            transition: border-color 0.2s ease; 
        }
        .form-control:focus { border-color: var(--brand-orange); }
        .form-control:disabled { background: #F3F4F6; color: #9CA3AF; }
        .phone-warning {
            font-size: 10px;
            color: #D97706;
            margin-top: 5px;
            display: none;
            line-height: 1.4;
        }
        .phone-warning.show { display: block; }
        .save-btn { 
            width: 100%; padding: 13px; 
            background: var(--brand-green); 
            color: white; 
            border: none; 
            border-radius: var(--radius-full); 
            font-size: 14px; font-weight: 600; 
            cursor: pointer; 
            font-family: 'Inter',sans-serif; 
        }
        .save-btn:active { background: var(--brand-green-dark); transform: scale(0.97); }
        .save-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .cancel-btn { 
            width: 100%; 
            padding: 12px; 
            background: transparent; 
            border: 1px solid var(--neutral-border); 
            border-radius: var(--radius-full); 
            font-size: 13px; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 8px; 
            color: var(--neutral-gray); 
            font-family: 'Inter',sans-serif; 
        }
        
        .login-prompt { text-align: center; padding: 60px 20px; }
        .login-prompt i { font-size: 52px; color: #D1D5DB; margin-bottom: 14px; display: block; }
        .login-prompt h3 { font-family: 'Poppins',sans-serif; font-size: 18px; font-weight: 700; }
        .login-prompt p { color: var(--neutral-gray); font-size: 13px; margin-bottom: 14px; }
        .btn-orange { 
            background: var(--brand-orange); 
            color: #1a1a1a; 
            border: none; 
            padding: 12px 28px; 
            border-radius: var(--radius-full); 
            font-size: 14px; font-weight: 600; 
            cursor: pointer; 
            font-family: 'Inter',sans-serif; 
            display: inline-flex; align-items: center; gap: 6px; 
        }
        
        .loading-state { text-align: center; padding: 50px; }
        .spinner { 
            width: 34px; height: 34px; 
            border: 2.5px solid var(--neutral-border); 
            border-top-color: var(--brand-orange); 
            border-radius: 50%; 
            animation: spin 0.7s linear infinite; 
            margin: 0 auto; 
        }
        
        .app-version { text-align: center; padding: 14px; font-size: 10px; color: #9CA3AF; }
        
        .bottom-nav { 
            background: white; 
            position: fixed; 
            bottom: 0; left: 0; 
            width: 100%; 
            display: flex; 
            justify-content: space-around; 
            padding: 5px 10px; 
            padding-bottom: calc(10px + var(--safe-bottom)); 
            box-shadow: 0 -4px 16px rgba(0,0,0,0.03); 
            z-index: 100; 
            border-top: 1px solid var(--neutral-border); 
        }
        .nav-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            font-size: 9px; 
            font-weight: 500; 
            color: var(--neutral-gray); 
            cursor: pointer; 
            padding: 3px 10px; 
            border-radius: var(--radius-full); 
            border: none; 
            background: transparent; 
            font-family: 'Inter',sans-serif; 
            text-decoration: none; 
        }
        .nav-item:active { background: #EDF7F1; }
        .nav-item.active { color: var(--brand-green); font-weight: 600; }
        .nav-item i { font-size: 18px; margin-bottom: 1px; }
        
        .toast { 
            position: fixed; 
            bottom: calc(95px + var(--safe-bottom)); 
            left: 50%; 
            transform: translateX(-50%); 
            background: var(--neutral-dark); 
            color: white; 
            padding: 10px 20px; 
            border-radius: var(--radius-full); 
            font-size: 12px; 
            z-index: 200; 
            opacity: 0; 
            visibility: hidden; 
            white-space: nowrap; 
            box-shadow: var(--shadow-md); 
            transition: all 0.3s ease; 
            max-width: 90%; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
        .toast.show { opacity: 1; visibility: visible; }
        .toast.error { background: var(--danger); }
        .toast.success { background: var(--success); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="netBanner" style="display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);background:#DC2626;color:white;text-align:center;padding:6px 16px;border-radius:20px;font-size:11px;font-weight:700;z-index:99999;box-shadow:0 4px 12px rgba(220,38,38,0.4);white-space:nowrap;pointer-events:none;">📴 No Internet</div>

<div class="top-bar">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <span class="top-title"><span class="brand-zy">Zy</span><span class="brand-mart">Mart</span> Profile</span>
</div>

<div class="main-content" id="mainContent">

</div>

<input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="handleAvatarUpload(this)">

<div class="edit-modal" id="editModal" onclick="if(event.target===this)closeEditModal()">
    <div class="edit-card">
        <div class="edit-header">
            <h3>✏️ Edit Profile</h3>
            <button class="edit-close" onclick="closeEditModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="form-group">
            <label class="form-label">Full Name *</label>
            <input type="text" id="editName" class="form-control" placeholder="Enter your full name" maxlength="50">
        </div>
        <div class="form-group">
            <label class="form-label">Phone Number</label>
            <input type="tel" id="editPhone" class="form-control" placeholder="10-digit mobile number" maxlength="10" inputmode="numeric" oninput="checkPhoneChange()">
            <div class="phone-warning" id="phoneWarning">
                <i class="fas fa-info-circle"></i> Phone change karenge toh next login naye number se hoga.
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">Email (read only)</label>
            <input type="email" id="editEmail" class="form-control" disabled>
        </div>
        <button class="save-btn" id="saveBtn" onclick="saveProfile()">💾 Save Changes</button>
        <button class="cancel-btn" onclick="closeEditModal()">Cancel</button>
    </div>
</div>

<nav class="bottom-nav">
    <a class="nav-item" href="index.html"><i class="fas fa-home"></i><span>Home</span></a>
    <a class="nav-item" href="cart.html"><i class="fas fa-shopping-cart"></i><span>Cart</span></a>
    <a class="nav-item" href="orders.html"><i class="fas fa-receipt"></i><span>Orders</span></a>
    <a class="nav-item active" href="profile.html"><i class="fas fa-user"></i><span>Profile</span></a>
    <a class="nav-item" href="more.html"><i class="fas fa-ellipsis-h"></i><span>More</span></a>
</nav>

<div class="toast" id="toastMsg"><span id="toastText"></span></div>

<script>
(function() {
    'use strict';
    
    window.addEventListener('error', function(e) { console.error('[Profile]', e.message); });
    window.addEventListener('unhandledrejection', function(e) { console.error('[Profile]', e.reason); e.preventDefault(); });
    
    function getEl(id) { return document.getElementById(id); }
    function esc(str) { if (!str) return ''; var d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
    function safeJSON(s,f) { try { return s?JSON.parse(s):f; } catch(e) { return f; } }
    
    var sb = supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co', 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1');
    var SUPABASE_URL = 'https://zwajyovemwdqtkecipeb.supabase.co';
    var CLOUDINARY_CLOUD_NAME = 'b0zm0rac';
    var CLOUDINARY_ENABLED = true;
    
    var currentUser = null, userProfile = {}, avatarUrl = '', userId = null;
    var originalPhone = '';
    var hasShop = false;
    var shopData = null;
    
    var IMG_FALLBACK = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="#E5E7EB" width="100" height="100"/><circle cx="50" cy="40" r="15" fill="#9CA3AF"/><path d="M20 90 Q50 60 80 90 Z" fill="#9CA3AF"/></svg>');
    window.addEventListener('error', function(e) {
        var el = e.target;
        if (el && el.tagName === 'IMG' && !el.dataset.fb) {
            el.dataset.fb = '1'; el.onerror = null; el.src = IMG_FALLBACK;
        }
    }, true);
    
    window.addEventListener('offline', function() { var b = getEl('netBanner'); if (b) b.style.display = 'block'; });
    window.addEventListener('online', function() { var b = getEl('netBanner'); if (b) b.style.display = 'none'; });
    
    // ✅ OPTIMIZED: q_auto:eco + c_fill + dpr_auto + fl_progressive + re-wrap Cloudinary URLs
    function getImageUrl(u, width, height) {
        if(!u || typeof u !== 'string') return '';
        var w = width || 200;
        var h = height || w;
        
        // Re-wrap already-Cloudinary URLs
        if(u.indexOf('res.cloudinary.com') !== -1) {
            if(u.indexOf('/image/fetch/') > -1) {
                var parts = u.split('/image/fetch/');
                if(parts.length === 2) {
                    var rest = parts[1];
                    var slashIdx = rest.indexOf('/');
                    if(slashIdx > 0) {
                        var originalUrl = rest.substring(slashIdx + 1);
                        return parts[0] + '/image/fetch/w_' + w + ',h_' + h + ',c_fill,g_center,q_auto:eco,f_auto,fl_progressive,dpr_auto/' + originalUrl;
                    }
                }
            }
            return u;
        }
        
        var fullUrl;
        if(u.indexOf('http') === 0 || u.indexOf('data:') === 0) fullUrl = u;
        else fullUrl = SUPABASE_URL + '/storage/v1/object/public/' + u;
        
        if(!CLOUDINARY_ENABLED) return fullUrl;
        return 'https://res.cloudinary.com/' + CLOUDINARY_CLOUD_NAME + '/image/fetch/w_' + w + ',h_' + h + ',c_fill,g_center,q_auto:eco,f_auto,fl_progressive,dpr_auto/' + fullUrl.replace(/ /g, '%20');
    }
    
    function addCacheBust(url) {
        if (!url) return url;
        var sep = url.indexOf('?') > -1 ? '&' : '?';
        return url + sep + '_t=' + Date.now();
    }
    
    function showToast(m, type) { 
        var t = getEl('toastMsg'), s = getEl('toastText'); 
        if (!t || !s) return; 
        s.textContent = m; 
        t.className = 'toast';
        if (type === 'error') t.classList.add('error');
        else if (type === 'success') t.classList.add('success');
        t.classList.add('show'); 
        clearTimeout(t._timer); 
        t._timer = setTimeout(function(){ t.classList.remove('show','error','success'); }, 2500); 
    }
    
    function goToLogin() { 
        try { sessionStorage.setItem('zymart_redirect_after_login', 'profile.html'); } catch(e) {}
        window.location.href = 'login.html'; 
    }
    
    async function checkUser() {
        try {
            var res = await sb.auth.getSession();
            if (res && res.data && res.data.session) {
                currentUser = res.data.session.user;
                userId = currentUser.id;
                return true;
            }
        } catch(e) {}
        try {
            var session = JSON.parse(localStorage.getItem('zymart_session') || 'null');
            if (session && session.userId) {
                userId = session.userId;
                currentUser = { id: session.userId, phone: session.phone, email: session.email };
                return true;
            }
        } catch(e) {}
        return false;
    }
    
    async function loadUserProfile(uid) {
        try {
            var prof = await sb.from('users').select('id, name, phone, email, role, avatar_url, created_at, is_active').eq('id', uid).maybeSingle();
            if (prof && prof.data) {
                userProfile = prof.data;
                avatarUrl = userProfile.avatar_url || '';
                originalPhone = userProfile.phone || '';
                return;
            }
        } catch(e) { console.warn('[Profile] Load failed:', e.message); }
        
        var phone = localStorage.getItem('zymart_user_phone') || (currentUser ? currentUser.phone : '') || '';
        var email = localStorage.getItem('zymart_user_email') || (currentUser ? currentUser.email : '') || '';
        userProfile = {
            id: uid,
            name: 'User' + (phone ? phone.slice(-4) : ''),
            phone: phone,
            email: email,
            role: localStorage.getItem('zymart_user_role') || 'customer'
        };
        originalPhone = phone;
        
        try {
            await sb.from('users').upsert({
                id: uid,
                name: userProfile.name,
                phone: userProfile.phone || null,
                email: userProfile.email || null,
                role: userProfile.role || 'customer',
                is_active: true,
                updated_at: new Date().toISOString()
            });
        } catch(e) { console.warn('[Profile] Upsert failed:', e.message); }
    }
    
    // ✅ FIXED: owner_id primary (guaranteed) + email/phone fallback with try/catch
    async function checkHasShop() {
        // PRIMARY: owner_id (guaranteed column)
        if (userId) {
            try {
                var r = await sb.from('shops').select('id, status, name').eq('owner_id', userId).limit(1).maybeSingle();
                if (r && r.data && r.data.status === 'approved') {
                    hasShop = true;
                    return r.data;
                }
            } catch(e) { console.warn('[Profile] owner_id shop check:', e.message); }
        }
        
        // Fallback: email (may not exist)
        var email = userProfile.email || (currentUser ? currentUser.email : '') || '';
        if (email) {
            try {
                var er = await sb.from('shops').select('id, status, name').ilike('owner_email', email.trim()).limit(1).maybeSingle();
                if (er && er.data && er.data.status === 'approved') {
                    hasShop = true;
                    return er.data;
                }
            } catch(e) { /* column may not exist - ok */ }
        }
        
        // Fallback: phone (may not exist)
        var phone = userProfile.phone || (currentUser ? currentUser.phone : '') || '';
        if (phone) {
            try {
                var pr = await sb.from('shops').select('id, status, name').eq('owner_phone', phone.trim()).limit(1).maybeSingle();
                if (pr && pr.data && pr.data.status === 'approved') {
                    hasShop = true;
                    return pr.data;
                }
            } catch(e) { /* column may not exist - ok */ }
        }
        
        return null;
    }
    
    window.handleAvatarUpload = async function(input) {
        var file = input.files[0]; 
        if (!file || !userId) return;
        if (file.size > 5 * 1024 * 1024) { showToast('⚠️ Image must be under 5MB', 'error'); input.value = ''; return; }
        if (!file.type.match(/image\//)) { showToast('⚠️ Please select an image file', 'error'); input.value = ''; return; }
        
        showToast('📸 Uploading photo...');
        try {
            var blob = await resizeImage(file, 200);
            var timestamp = Date.now();
            
            // ✅ Try avatars bucket first, fallback to product-images
            var uploadedBucket = null;
            var uploadedPath = null;
            
            try {
                var path1 = 'avatar_' + userId + '_' + timestamp + '.jpg';
                var result1 = await sb.storage.from('avatars').upload(path1, blob, { upsert: true, contentType: 'image/jpeg' });
                if (!result1.error) {
                    uploadedBucket = 'avatars';
                    uploadedPath = path1;
                }
            } catch(e) { console.warn('[Profile] avatars bucket failed:', e.message); }
            
            if (!uploadedBucket) {
                // Fallback to product-images bucket
                var path2 = 'avatars/avatar_' + userId + '_' + timestamp + '.jpg';
                var result2 = await sb.storage.from('product-images').upload(path2, blob, { upsert: true, contentType: 'image/jpeg' });
                if (result2.error) throw new Error(result2.error.message);
                uploadedBucket = 'product-images';
                uploadedPath = path2;
            }
            
            var urlResult = sb.storage.from(uploadedBucket).getPublicUrl(uploadedPath);
            avatarUrl = urlResult.data.publicUrl;
            
            try { await sb.from('users').update({ avatar_url: avatarUrl }).eq('id', userId); } catch(e) { console.warn('[Profile] Save avatar_url:', e.message); }
            userProfile.avatar_url = avatarUrl;
            
            var avatarEl = document.querySelector('.avatar');
            if (avatarEl) {
                var cloudUrl = getImageUrl(avatarUrl, 200, 200);
                var bustUrl = addCacheBust(cloudUrl);
                avatarEl.innerHTML = '<img src="' + bustUrl + '" alt="Avatar" loading="lazy" decoding="async" width="80" height="80">';
            }
            showToast('✅ Profile photo updated!', 'success');
        } catch(e) { 
            console.error('[Profile] Avatar upload:', e);
            showToast('❌ Upload failed. Please try again.', 'error'); 
        }
        input.value = '';
    };
    
    function resizeImage(file, maxDim) {
        return new Promise(function(resolve, reject) {
            var reader = new FileReader();
            reader.onload = function(e) {
                var img = new Image();
                img.onload = function() {
                    var canvas = document.createElement('canvas'), w = img.width, h = img.height;
                    if (w > maxDim || h > maxDim) { var r = Math.min(maxDim/w, maxDim/h); w = Math.round(w*r); h = Math.round(h*r); }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    canvas.toBlob(function(b) { 
                        if (b) resolve(b); 
                        else reject(new Error('Canvas failed')); 
                    }, 'image/jpeg', 0.7);
                };
                img.onerror = function() { reject(new Error('Image load failed')); };
                img.src = e.target.result;
            };
            reader.onerror = function() { reject(new Error('File read failed')); };
            reader.readAsDataURL(file);
        });
    }

    // ✅ FIXED: role field not updated + defensive phone check + try/catch on RLS
    window.saveProfile = async function() {
        var name = (getEl('editName').value || '').trim();
        var phone = (getEl('editPhone').value || '').trim();
        var btn = getEl('saveBtn');
        
        if (!name || name.length < 2) { showToast('⚠️ Please enter your name (min 2 characters)', 'error'); return; }
        if (phone && !/^[6-9]\d{9}$/.test(phone)) { showToast('⚠️ Enter valid 10-digit mobile number', 'error'); return; }
        
        btn.disabled = true; 
        btn.textContent = 'Saving...';
        
        try {
            // Optional phone uniqueness check (RLS may restrict - only blocks if conflict found)
            if (phone && phone !== originalPhone) {
                try {
                    var existing = await sb.from('users').select('id').eq('phone', phone).neq('id', userId).limit(1).maybeSingle();
                    if (existing && existing.data) {
                        showToast('⚠️ This phone number is already used by another account.', 'error');
                        btn.disabled = false;
                        btn.textContent = '💾 Save Changes';
                        return;
                    }
                } catch(e) {
                    console.warn('[Profile] Phone uniqueness check skipped:', e.message);
                }
            }
            
            // ✅ Do NOT update role — security
            var updateData = { 
                id: userId,
                name: name, 
                phone: phone || null,
                is_active: true,
                updated_at: new Date().toISOString()
            };
            if (userProfile.email) updateData.email = userProfile.email;
            else if (currentUser && currentUser.email) updateData.email = currentUser.email;
            
            var res = await sb.from('users').upsert(updateData);
            if (res.error) throw new Error(res.error.message);
            
            userProfile.name = name; 
            userProfile.phone = phone;
            originalPhone = phone;
            try { localStorage.setItem('zymart_user_phone', phone); } catch(e) {}
            
            showToast('✅ Profile updated successfully!', 'success'); 
            closeEditModal(); 
            loadProfile();
        } catch(e) { 
            console.error('[Profile] Save error:', e);
            showToast('❌ Failed to save: ' + (e.message || 'Try again'), 'error'); 
        } finally {
            btn.disabled = false; 
            btn.textContent = '💾 Save Changes'; 
        }
    };
    
    // ✅ FIXED: Comprehensive logout - clears privacy-sensitive keys but keeps cart/wishlist
    window.handleLogout = async function() {
        if (!confirm('Are you sure you want to logout?')) return;
        
        try { await sb.auth.signOut(); } catch(e) {}
        
        // Clear user-specific & privacy-sensitive keys (KEEP cart, wishlist, delivery settings)
        try { 
            [
                'zymart_session','zymart_user_phone','zymart_user_email','zymart_user_role',
                'zymart_token','zymart_shop_cache','zymart_fcm_linked','zymart_last_visit',
                'zymart_session_ui','zymart_user_taluka','zymart_user_pincode','zymart_user_city',
                'zymart_user_full_address','zymart_rated_orders','zymart_all_reviews',
                'zymart_recent','zymart_recent_cats','zymart_saved_addresses'
            ].forEach(function(k) {
                try { localStorage.removeItem(k); } catch(e) {}
            });
            
            // Clear role cache per user
            if (userId) {
                try { localStorage.removeItem('zymart_role_' + userId); } catch(e) {}
            }
            
            // Clear ratings per order (privacy)
            try {
                var allKeys = Object.keys(localStorage);
                for (var i = 0; i < allKeys.length; i++) {
                    if (allKeys[i].indexOf('zymart_ratings_') === 0) {
                        try { localStorage.removeItem(allKeys[i]); } catch(e) {}
                    }
                }
            } catch(e) {}
            
            // Clear sb- prefixed keys (Supabase session)
            try {
                var keys = Object.keys(localStorage);
                for (var i = 0; i < keys.length; i++) {
                    if (keys[i].indexOf('sb-') === 0) {
                        localStorage.removeItem(keys[i]);
                    }
                }
            } catch(e) {}
            
            try { sessionStorage.clear(); } catch(e) {}
        } catch(e) { console.warn('[Profile] Logout cleanup:', e.message); }
        
        showToast('👋 Logged out successfully!', 'success'); 
        setTimeout(function(){ window.location.href = 'index.html'; }, 500);
    };
