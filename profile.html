<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Profile - ZyMart</title>
    <meta name="theme-color" content="#0B5A31">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --brand-green: #0B5A31; --brand-orange: #F59E0B; --neutral-white: #FFFFFF; --neutral-bg: #F9FAFB; --neutral-border: #E5E7EB; --neutral-gray: #6B7280; --neutral-dark: #1A1A1A; --danger: #EF4444; --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); --shadow-sm: 0 1px 4px rgba(0,0,0,0.06); --shadow-md: 0 4px 16px rgba(0,0,0,0.08); --radius-sm: 10px; --radius-md: 14px; --radius-lg: 18px; --radius-xl: 22px; --radius-full: 9999px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter',-apple-system,sans-serif; background: var(--neutral-bg); color: var(--neutral-dark); padding-bottom: 85px; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; min-height: 100vh; }
        @keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .top-bar { background: var(--brand-green); position: fixed; top: 0; left: 0; width: 100%; z-index: 100; padding: 10px 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 16px rgba(11,90,49,0.3); }
        .back-btn { width: 40px; height: 40px; min-width: 40px; background: rgba(255,255,255,0.10); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 15px; text-decoration: none; }
        .back-btn:active { background: rgba(255,255,255,0.22); transform: scale(0.93); }
        .top-title { font-family: 'Poppins',sans-serif; flex: 1; font-size: 16px; font-weight: 700; color: white; }
        .brand-zy { color: #A3E635; } .brand-mart { color: #FDE047; }
        .main-content { padding-top: 62px; max-width: 600px; margin: 0 auto; }
        
        .profile-header { background: linear-gradient(135deg,var(--brand-green),#083D21); margin: 12px 14px; padding: 26px 20px; border-radius: var(--radius-xl); color: white; text-align: center; animation: slideUp 0.3s ease; box-shadow: 0 4px 20px rgba(11,90,49,0.3); position: relative; }
        .avatar-container { position: relative; width: 80px; height: 80px; margin: 0 auto 14px; cursor: pointer; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; font-size: 36px; border: 3px solid rgba(255,255,255,0.25); overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-edit-badge { position: absolute; bottom: 0; right: 0; width: 28px; height: 28px; background: var(--brand-orange); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; border: 2px solid white; }
        .profile-name { font-family: 'Poppins',sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 2px; }
        .profile-email { font-size: 13px; opacity: 0.85; }
        .profile-phone { font-size: 12px; opacity: 0.7; margin-top: 3px; }
        
        .menu-section { background: var(--neutral-white); margin: 10px 14px; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--neutral-border); box-shadow: var(--shadow-xs); }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 15px 16px; cursor: pointer; border-bottom: 1px solid var(--neutral-border); font-size: 13px; font-weight: 500; text-decoration: none; color: var(--neutral-dark); }
        .menu-item:last-child { border-bottom: none; }
        .menu-item:active { background: #EDF7F1; }
        .icon-circle { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
        .icon-green { background: #EDF7F1; color: var(--brand-green); }
        .icon-orange { background: #FFF8EB; color: var(--brand-orange); }
        .icon-red { background: #FEF2F2; color: var(--danger); }
        .icon-blue { background: #EFF6FF; color: #2563EB; }
        .icon-purple { background: #F5F3FF; color: #7C3AED; }
        .menu-text { flex: 1; }
        .menu-label { font-size: 14px; font-weight: 600; }
        .menu-sub { font-size: 11px; color: var(--neutral-gray); }
        .menu-arrow { color: #D1D5DB; font-size: 13px; }
        
        .edit-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(8,61,33,0.7); backdrop-filter: blur(6px); display: none; align-items: flex-end; justify-content: center; z-index: 1000; }
        .edit-modal.show { display: flex; }
        .edit-card { background: white; border-radius: var(--radius-xl) var(--radius-xl) 0 0; width: 100%; max-width: 500px; padding: 22px; animation: slideUp 0.3s ease; max-height: 80vh; overflow-y: auto; }
        .edit-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--neutral-border); }
        .edit-header h3 { font-family: 'Poppins',sans-serif; font-size: 17px; font-weight: 700; }
        .edit-close { width: 36px; height: 36px; background: var(--neutral-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; font-size: 14px; color: var(--neutral-gray); }
        .form-group { margin-bottom: 14px; }
        .form-label { font-size: 12px; font-weight: 600; color: var(--neutral-gray); margin-bottom: 5px; display: block; }
        .form-control { width: 100%; padding: 12px 14px; border: 1.5px solid var(--neutral-border); border-radius: var(--radius-sm); font-size: 14px; font-family: 'Inter',sans-serif; outline: none; }
        .form-control:focus { border-color: var(--brand-orange); }
        .save-btn { width: 100%; padding: 13px; background: var(--brand-orange); color: white; border: none; border-radius: var(--radius-full); font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Inter',sans-serif; box-shadow: 0 4px 14px rgba(245,158,11,0.22); }
        .save-btn:active { background: #E8890A; }
        .save-btn:disabled { opacity: 0.6; }
        
        .login-prompt { text-align: center; padding: 60px 20px; }
        .login-prompt i { font-size: 52px; color: #D1D5DB; margin-bottom: 14px; display: block; }
        .login-prompt h3 { font-family: 'Poppins',sans-serif; font-size: 18px; font-weight: 700; }
        .login-prompt p { color: var(--neutral-gray); font-size: 13px; margin-bottom: 14px; }
        .btn-orange { background: var(--brand-orange); color: white; border: none; padding: 12px 28px; border-radius: var(--radius-full); font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Inter',sans-serif; box-shadow: 0 4px 14px rgba(245,158,11,0.25); display: inline-flex; align-items: center; gap: 6px; }
        
        .loading-state { text-align: center; padding: 50px; }
        .spinner { width: 34px; height: 34px; border: 2.5px solid var(--neutral-border); border-top-color: var(--brand-orange); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto; }
        
        .bottom-nav { background: white; position: fixed; bottom: 0; left: 0; width: 100%; display: flex; justify-content: space-around; padding: 5px 10px 10px; box-shadow: 0 -4px 16px rgba(0,0,0,0.03); z-index: 100; border-top: 1px solid var(--neutral-border); }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 9px; font-weight: 500; color: var(--neutral-gray); cursor: pointer; padding: 3px 10px; border-radius: var(--radius-full); border: none; background: transparent; font-family: 'Inter',sans-serif; text-decoration: none; }
        .nav-item:active { background: #EDF7F1; }
        .nav-item.active { color: var(--brand-green); font-weight: 600; }
        .nav-item i { font-size: 18px; margin-bottom: 1px; }
        
        .toast { position: fixed; bottom: 95px; left: 50%; transform: translateX(-50%); background: var(--neutral-dark); color: white; padding: 10px 20px; border-radius: var(--radius-full); font-size: 12px; z-index: 200; opacity: 0; visibility: hidden; white-space: nowrap; box-shadow: var(--shadow-md); transition: all 0.3s ease; }
        .toast.show { opacity: 1; visibility: visible; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="top-bar">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <span class="top-title"><span class="brand-zy">Zy</span><span class="brand-mart">Mart</span> Profile</span>
</div>

<div class="main-content" id="mainContent">
    <div class="loading-state"><div class="spinner"></div></div>
</div>

<input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="handleAvatarUpload(this)">

<div class="edit-modal" id="editModal">
    <div class="edit-card">
        <div class="edit-header"><h3>Edit Profile</h3><button class="edit-close" onclick="closeEditModal()"><i class="fas fa-times"></i></button></div>
        <div class="form-group"><label class="form-label">Full Name</label><input type="text" id="editName" class="form-control" placeholder="Enter your name"></div>
        <div class="form-group"><label class="form-label">Phone Number</label><input type="tel" id="editPhone" class="form-control" placeholder="10-digit" maxlength="10"></div>
        <div class="form-group"><label class="form-label">Email (cannot change)</label><input type="email" id="editEmail" class="form-control" readonly style="background:#F3F5F4;"></div>
        <button class="save-btn" id="saveBtn" onclick="saveProfile()">Save</button>
        <button style="width:100%;padding:12px;background:transparent;border:1px solid var(--neutral-border);border-radius:var(--radius-full);font-size:13px;font-weight:600;cursor:pointer;margin-top:8px;color:var(--neutral-gray);font-family:'Inter',sans-serif;" onclick="closeEditModal()">Cancel</button>
    </div>
</div>

<nav class="bottom-nav">
    <a class="nav-item" href="index.html"><i class="fas fa-home"></i><span>Home</span></a>
    <a class="nav-item" href="more.html"><i class="fas fa-ellipsis-h"></i><span>More</span></a>
    <a class="nav-item" href="cart.html"><i class="fas fa-shopping-cart"></i><span>Cart</span></a>
    <a class="nav-item active" href="profile.html"><i class="fas fa-user"></i><span>Profile</span></a>
    <a class="nav-item" href="orders.html"><i class="fas fa-receipt"></i><span>Orders</span></a>
</nav>

<div class="toast" id="toastMsg"></div>

<script>
(function() {
    'use strict';
    
    window.addEventListener('error', function(e) { console.error('[Profile]', e.message); });
    window.addEventListener('unhandledrejection', function(e) { console.error('[Profile]', e.reason); e.preventDefault(); });
    
    function getEl(id) { return document.getElementById(id); }
    function esc(str) { if (!str) return ''; var d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
    
    var sb = supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co', 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1');
    var SUPABASE_URL = 'https://zwajyovemwdqtkecipeb.supabase.co';
    var currentUser = null, userProfile = {}, avatarUrl = '';
    
    function showToast(m, e) { var t = getEl('toastMsg'); if (!t) return; t.textContent = m; t.style.background = e ? '#EF4444' : '#1A1A1A'; t.classList.add('show'); clearTimeout(t._timer); t._timer = setTimeout(function(){t.classList.remove('show');},2500); }
    
    function goToLogin() {
        try { sessionStorage.setItem('zymart_redirect_after_login', 'profile.html'); } catch(e) {}
        window.location.href = 'login.html';
    }
    
    async function checkUser() {
        try {
            var res = await sb.auth.getSession();
            if (res && res.data && res.data.session) {
                currentUser = res.data.session.user;
                try {
                    var prof = await sb.from('users').select('*').eq('id', currentUser.id).maybeSingle();
                    if (prof && prof.data) { userProfile = prof.data; avatarUrl = userProfile.avatar_url || ''; }
                    else {
                        var newUser = { id: currentUser.id, email: currentUser.email, name: (currentUser.user_metadata?.full_name) || (currentUser.user_metadata?.name) || (currentUser.email||'').split('@')[0], phone: '', role: '3', created_at: new Date().toISOString() };
                        await sb.from('users').upsert(newUser); userProfile = newUser;
                    }
                } catch(e) { userProfile = { name: (currentUser.user_metadata?.name) || (currentUser.email||'').split('@')[0], email: currentUser.email, phone: '' }; }
                return true;
            }
        } catch(e) {}
        return false;
    }
    
    window.handleAvatarUpload = async function(input) {
        var file = input.files[0]; if (!file || !currentUser) return;
        if (file.size > 5*1024*1024) { showToast('Image must be under 5MB', true); return; }
        showToast('📸 Uploading...');
        try {
            var blob = await resizeImage(file, 200);
            var path = 'avatar_' + currentUser.id + '.jpg';
            var uploadResult = await sb.storage.from('avatars').upload(path, blob, { upsert: true, contentType: 'image/jpeg' });
            if (uploadResult.error) throw new Error(uploadResult.error.message);
            var urlResult = sb.storage.from('avatars').getPublicUrl(path);
            avatarUrl = urlResult.data.publicUrl;
            await sb.from('users').update({ avatar_url: avatarUrl }).eq('id', currentUser.id);
            userProfile.avatar_url = avatarUrl;
            var avatarEl = document.querySelector('.avatar');
            if (avatarEl) avatarEl.innerHTML = '<img src="' + avatarUrl + '?' + Date.now() + '" alt="Avatar">';
            showToast('✅ Photo updated!');
        } catch(e) { showToast('❌ Upload failed', true); }
    };
    
    function resizeImage(file, maxDim) {
        return new Promise(function(resolve) {
            var reader = new FileReader();
            reader.onload = function(e) {
                var img = new Image();
                img.onload = function() {
                    var canvas = document.createElement('canvas'), w = img.width, h = img.height;
                    if (w > maxDim || h > maxDim) { var r = Math.min(maxDim/w, maxDim/h); w = Math.round(w*r); h = Math.round(h*r); }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    canvas.toBlob(function(b) { resolve(b); }, 'image/jpeg', 0.7);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }
    
    async function loadProfile() {
        var c = getEl('mainContent');
        if (!(await checkUser())) { c.innerHTML = '<div class="login-prompt"><i class="fas fa-user-circle"></i><h3>Login Required</h3><p>Please login to view your profile</p><button class="btn-orange" onclick="goToLogin()"><i class="fas fa-sign-in-alt"></i> Login / Register</button></div>'; return; }
        
        var name = userProfile.name || (currentUser.email||'').split('@')[0];
        var email = currentUser.email || '';
        var phone = userProfile.phone || 'Not added';
        var avHtml = avatarUrl ? '<img src="' + avatarUrl + '?' + Date.now() + '" alt="Avatar">' : '<i class="fas fa-user"></i>';
        
        c.innerHTML = 
        '<div class="profile-header"><div class="avatar-container" onclick="document.getElementById(\'avatarInput\').click()"><div class="avatar">' + avHtml + '</div><div class="avatar-edit-badge"><i class="fas fa-camera"></i></div></div><div class="profile-name">' + esc(name) + '</div><div class="profile-email">' + esc(email) + '</div><div class="profile-phone">📞 ' + esc(phone) + '</div></div>' +
        '<div class="menu-section">' +
        '<div class="menu-item" onclick="showEditModal()"><div class="icon-circle icon-green"><i class="fas fa-user-edit"></i></div><div class="menu-text"><div class="menu-label">Edit Profile</div><div class="menu-sub">Update name and phone</div></div><i class="fas fa-chevron-right menu-arrow"></i></div>' +
        '<a class="menu-item" href="orders.html"><div class="icon-circle icon-orange"><i class="fas fa-receipt"></i></div><div class="menu-text"><div class="menu-label">My Orders</div></div><i class="fas fa-chevron-right menu-arrow"></i></a>' +
        '<a class="menu-item" href="wishlist.html"><div class="icon-circle icon-red"><i class="fas fa-heart"></i></div><div class="menu-text"><div class="menu-label">My Wishlist</div></div><i class="fas fa-chevron-right menu-arrow"></i></a>' +
        '<a class="menu-item" href="cart.html"><div class="icon-circle icon-blue"><i class="fas fa-shopping-cart"></i></div><div class="menu-text"><div class="menu-label">My Cart</div></div><i class="fas fa-chevron-right menu-arrow"></i></a>' +
        '</div>' +
        '<div class="menu-section">' +
        '<div class="menu-item" onclick="window.open(\'https://wa.me/918600252238\',\'_blank\')"><div class="icon-circle icon-green"><i class="fab fa-whatsapp"></i></div><div class="menu-text"><div class="menu-label">Help & Support</div></div><i class="fas fa-chevron-right menu-arrow"></i></div>' +
        '<a class="menu-item" href="privacy-policy.html"><div class="icon-circle icon-purple"><i class="fas fa-shield-alt"></i></div><div class="menu-text"><div class="menu-label">Privacy Policy</div></div><i class="fas fa-chevron-right menu-arrow"></i></a>' +
        '<a class="menu-item" href="terms.html"><div class="icon-circle icon-blue"><i class="fas fa-file-contract"></i></div><div class="menu-text"><div class="menu-label">Terms & Conditions</div></div><i class="fas fa-chevron-right menu-arrow"></i></a>' +
        '</div>' +
        '<div class="menu-section"><div class="menu-item" onclick="handleLogout()"><div class="icon-circle icon-red"><i class="fas fa-sign-out-alt"></i></div><div class="menu-text"><div class="menu-label" style="color:#EF4444;">Logout</div></div><i class="fas fa-chevron-right menu-arrow"></i></div></div>';
    }
    
    window.showEditModal = function() {
        getEl('editName').value = userProfile.name || '';
        getEl('editPhone').value = userProfile.phone || '';
        getEl('editEmail').value = currentUser ? currentUser.email || '' : '';
        getEl('editModal').classList.add('show');
    };
    
    window.closeEditModal = function() { getEl('editModal').classList.remove('show'); };
    
    window.saveProfile = async function() {
        var name = getEl('editName').value.trim(), phone = getEl('editPhone').value.trim(), btn = getEl('saveBtn');
        if (!name) { showToast('Please enter your name', true); return; }
        if (phone && !/^\d{10}$/.test(phone)) { showToast('Enter valid 10-digit phone', true); return; }
        btn.disabled = true; btn.textContent = 'Saving...';
        try {
            await sb.from('users').upsert({ id: currentUser.id, name: name, phone: phone, email: currentUser.email, role: userProfile.role || '3' });
            userProfile.name = name; userProfile.phone = phone;
            showToast('✅ Updated!'); closeEditModal(); loadProfile();
        } catch(e) { showToast('❌ Failed', true); btn.disabled = false; btn.textContent = 'Save'; }
    };
    
    window.handleLogout = async function() {
        if (confirm('Are you sure you want to logout?')) {
            await sb.auth.signOut();
            // 🔥 FIXED: Clear zymart_* keys
            try { localStorage.removeItem('zymart_cart'); localStorage.removeItem('zymart_wishlist'); } catch(e) {}
            showToast('👋 Logged out!'); setTimeout(function(){ window.location.href = 'index.html'; }, 500);
        }
    };
    
    document.addEventListener('DOMContentLoaded', loadProfile);
    window.goToLogin = goToLogin;
})();
</script>
</body>
</html>
