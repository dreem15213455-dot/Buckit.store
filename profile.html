<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My Profile - Zatpat</title>
    <meta name="theme-color" content="#FFD600">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary: #FFD600;
            --primary-dark: #E5C200;
            --accent-green: #16A34A;
            --bg-light: #F5F5F5;
            --card-white: #FFFFFF;
            --text-primary: #1A1A1A;
            --text-secondary: #666666;
            --border-light: #E5E7EB;
            --danger: #EF4444;
            --success: #10B981;
            --warning: #F59E0B;
            --info: #3B82F6;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-2xl: 24px;
            --radius-full: 9999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
        }
        h1, h2, h3, h4, h5, h6 { font-family: 'Poppins', sans-serif; }

        .top-bar {
            background: var(--card-white);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 12px 16px;
            box-shadow: var(--shadow-sm);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .back-btn {
            width: 40px;
            height: 40px;
            background: var(--bg-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .brand-name { font-size: 22px; font-weight: 800; }
        .brand-name .normal { color: #000000; }
        .brand-name .pat { color: var(--accent-green); }
        .page-title { flex: 1; text-align: center; font-weight: 600; font-size: 16px; }
        .logout-header-btn {
            background: rgba(239,68,68,0.1);
            color: var(--danger);
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius-full);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .main-content {
            padding-top: 80px;
            padding-bottom: 100px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Profile Header */
        .profile-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            margin: 16px;
            border-radius: var(--radius-2xl);
            padding: 32px;
            text-align: center;
            color: #000000;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            background: rgba(0,0,0,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 36px;
            cursor: pointer;
            position: relative;
        }
        .avatar-upload-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--primary);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            border: 2px solid white;
            color: #000;
        }
        .profile-name {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .profile-email {
            font-size: 13px;
            opacity: 0.8;
        }
        .profile-member-since {
            font-size: 11px;
            margin-top: 8px;
            opacity: 0.7;
        }

        /* Stats Cards */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 16px;
        }
        .stat-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 16px;
            text-align: center;
            border: 1px solid var(--border-light);
        }
        .stat-value {
            font-size: 24px;
            font-weight: 800;
            color: var(--accent-green);
        }
        .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Menu Items */
        .menu-card {
            background: white;
            margin: 16px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            overflow: hidden;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            border-bottom: 1px solid var(--border-light);
            cursor: pointer;
            transition: all 0.2s;
        }
        .menu-item:last-child {
            border-bottom: none;
        }
        .menu-item:hover {
            background: var(--bg-light);
        }
        .menu-icon {
            width: 40px;
            height: 40px;
            background: var(--bg-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--primary);
        }
        .menu-content {
            flex: 1;
        }
        .menu-title {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 2px;
        }
        .menu-subtitle {
            font-size: 11px;
            color: var(--text-secondary);
        }
        .menu-arrow {
            color: var(--text-secondary);
        }

        /* Edit Profile Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        .modal-container {
            background: white;
            border-radius: var(--radius-2xl);
            width: 90%;
            max-width: 500px;
            padding: 28px;
        }
        .modal-container h3 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-label {
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 6px;
            display: block;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            font-size: 14px;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .save-btn {
            flex: 1;
            background: var(--primary);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
        }
        .cancel-btn {
            flex: 1;
            background: transparent;
            border: 1px solid var(--border-light);
            padding: 12px;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
        }

        .loading-spinner {
            text-align: center;
            padding: 60px;
            color: var(--primary);
        }

        /* Toast */
        .toast-notification {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #1F2937;
            color: white;
            padding: 10px 20px;
            border-radius: var(--radius-full);
            font-size: 13px;
            z-index: 10050;
            display: none;
            white-space: nowrap;
        }
        .toast-notification.show {
            display: flex;
            animation: fadeUp 0.3s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        @media (max-width: 480px) {
            .stats-row { gap: 8px; }
            .stat-value { font-size: 18px; }
            .menu-item { padding: 12px; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
        <div class="brand-name"><span class="normal">Zat</span><span class="pat">pat</span></div>
        <div class="page-title">My Profile</div>
        <button class="logout-header-btn" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>

    <div class="main-content" id="mainContent">
        <div class="loading-spinner"><i class="fas fa-spinner fa-spin fa-2x"></i><p>Loading profile...</p></div>
    </div>

    <div id="toastMsg" class="toast-notification">
        <i class="fas fa-check-circle"></i> <span id="toastText"></span>
    </div>

    <div class="modal-overlay" id="editProfileModal">
        <div class="modal-container">
            <h3><i class="fas fa-user-edit"></i> Edit Profile</h3>
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" id="editName" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input type="tel" id="editPhone" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">WhatsApp Number</label>
                <input type="tel" id="editWhatsapp" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="editEmail" class="form-control" readonly style="background: var(--bg-light);">
            </div>
            <div class="modal-buttons">
                <button class="save-btn" onclick="saveProfile()">Save Changes</button>
                <button class="cancel-btn" onclick="closeEditModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://zwajyovemwdqtkecipeb.supabase.co';
        const supabaseKey = 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let currentUser = null;
        let userProfile = null;
        let ordersCount = 0;
        let totalSpent = 0;

        // Check logged in user
        async function checkUser() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) {
                showLoginPrompt();
                return false;
            }
            currentUser = user;
            await loadUserProfile();
            await loadUserStats();
            renderProfile();
            return true;
        }

        // Load user profile from users table
        async function loadUserProfile() {
            try {
                const { data, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('id', currentUser.id)
                    .maybeSingle();

                if (error) throw error;
                
                userProfile = data || {
                    id: currentUser.id,
                    name: currentUser.user_metadata?.name || '',
                    email: currentUser.email,
                    phone: currentUser.user_metadata?.phone || '',
                    whatsapp: currentUser.user_metadata?.whatsapp || '',
                    created_at: currentUser.created_at
                };
            } catch (error) {
                console.error('Error loading profile:', error);
                userProfile = {
                    id: currentUser.id,
                    name: currentUser.user_metadata?.name || '',
                    email: currentUser.email,
                    phone: '',
                    whatsapp: '',
                    created_at: currentUser.created_at
                };
            }
        }

        // Load user stats (orders count, total spent)
        async function loadUserStats() {
            try {
                const { data, error } = await supabaseClient
                    .from('orders')
                    .select('total')
                    .eq('user_id', currentUser.id);

                if (!error && data) {
                    ordersCount = data.length;
                    totalSpent = data.reduce((sum, order) => sum + (order.total || 0), 0);
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Render profile page
        function renderProfile() {
            const memberDate = userProfile?.created_at 
                ? new Date(userProfile.created_at).toLocaleDateString('en-IN', { year: 'numeric', month: 'long' })
                : 'Recently';

            const container = document.getElementById('mainContent');
            container.innerHTML = `
                <div class="profile-header">
                    <div class="profile-avatar" onclick="document.getElementById('avatarInput').click()">
                        <i class="fas fa-user-circle"></i>
                        <div class="avatar-upload-btn"><i class="fas fa-camera"></i></div>
                        <input type="file" id="avatarInput" accept="image/*" style="display: none;">
                    </div>
                    <div class="profile-name">${escapeHtml(userProfile?.name || 'User')}</div>
                    <div class="profile-email">${escapeHtml(currentUser?.email || '')}</div>
                    <div class="profile-member-since"><i class="fas fa-calendar-alt"></i> Member since ${memberDate}</div>
                </div>

                <div class="stats-row">
                    <div class="stat-card">
                        <div class="stat-value">${ordersCount}</div>
                        <div class="stat-label">Orders</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${userProfile?.phone || 'Not Set'}</div>
                        <div class="stat-label">Phone</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">₹${totalSpent}</div>
                        <div class="stat-label">Total Spent</div>
                    </div>
                </div>

                <div class="menu-card">
                    <div class="menu-item" onclick="openEditProfile()">
                        <div class="menu-icon"><i class="fas fa-user-edit"></i></div>
                        <div class="menu-content">
                            <div class="menu-title">Edit Profile</div>
                            <div class="menu-subtitle">Update your personal information</div>
                        </div>
                        <div class="menu-arrow"><i class="fas fa-chevron-right"></i></div>
                    </div>
                    
                    <div class="menu-item" onclick="goToOrders()">
                        <div class="menu-icon"><i class="fas fa-shopping-bag"></i></div>
                        <div class="menu-content">
                            <div class="menu-title">My Orders</div>
                            <div class="menu-subtitle">View all your orders</div>
                        </div>
                        <div class="menu-arrow"><i class="fas fa-chevron-right"></i></div>
                    </div>
                    
                    <div class="menu-item" onclick="goToAddresses()">
                        <div class="menu-icon"><i class="fas fa-map-marker-alt"></i></div>
                        <div class="menu-content">
                            <div class="menu-title">Saved Addresses</div>
                            <div class="menu-subtitle">Manage your delivery addresses</div>
                        </div>
                        <div class="menu-arrow"><i class="fas fa-chevron-right"></i></div>
                    </div>
                    
                    <div class="menu-item" onclick="goToWallet()">
                        <div class="menu-icon"><i class="fas fa-wallet"></i></div>
                        <div class="menu-content">
                            <div class="menu-title">Wallet</div>
                            <div class="menu-subtitle">₹0.00 available</div>
                        </div>
                        <div class="menu-arrow"><i class="fas fa-chevron-right"></i></div>
                    </div>
                </div>

                <div class="menu-card">
                    <div class="menu-item" onclick="goToSupport()">
                        <div class="menu-icon"><i class="fas fa-headset"></i></div>
                        <div class="menu-content">
                            <div class="menu-title">Customer Support</div>
                            <div class="menu-subtitle">Get help with your orders</div>
                        </div>
                        <div class="menu-arrow"><i class="fas fa-chevron-right"></i></div>
                    </div>
                    
                    <div class="menu-item" onclick="goToFAQ()">
                        <div class="menu-icon"><i class="fas fa-question-circle"></i></div>
                        <div class="menu-content">
                            <div class="menu-title">FAQ & Help</div>
                            <div class="menu-subtitle">Frequently asked questions</div>
                        </div>
                        <div class="menu-arrow"><i class="fas fa-chevron-right"></i></div>
                    </div>
                    
                    <div class="menu-item" onclick="goToAbout()">
                        <div class="menu-icon"><i class="fas fa-info-circle"></i></div>
                        <div class="menu-content">
                            <div class="menu-title">About Zatpat</div>
                            <div class="menu-subtitle">Version 2.0.0</div>
                        </div>
                        <div class="menu-arrow"><i class="fas fa-chevron-right"></i></div>
                    </div>
                    
                    <div class="menu-item" onclick="handleLogout()">
                        <div class="menu-icon" style="color: var(--danger);"><i class="fas fa-sign-out-alt"></i></div>
                        <div class="menu-content">
                            <div class="menu-title" style="color: var(--danger);">Logout</div>
                            <div class="menu-subtitle">Sign out from your account</div>
                        </div>
                        <div class="menu-arrow"><i class="fas fa-chevron-right"></i></div>
                    </div>
                </div>
            `;

            // Avatar upload handler
            document.getElementById('avatarInput').onchange = (e) => {
                if (e.target.files && e.target.files[0]) {
                    uploadAvatar(e.target.files[0]);
                }
            };
        }

        // Upload avatar image
        async function uploadAvatar(file) {
            showToast('Uploading...');
            try {
                const fileExt = file.name.split('.').pop();
                const fileName = `avatars/${currentUser.id}_${Date.now()}.${fileExt}`;
                
                const { error: uploadError } = await supabaseClient.storage
                    .from('avatars')
                    .upload(fileName, file);
                
                if (uploadError) throw uploadError;
                
                const { data: publicUrl } = supabaseClient.storage
                    .from('avatars')
                    .getPublicUrl(fileName);
                
                await supabaseClient
                    .from('users')
                    .update({ avatar_url: publicUrl.publicUrl })
                    .eq('id', currentUser.id);
                
                showToast('Avatar updated!');
                renderProfile();
            } catch (error) {
                showToast('Upload failed', true);
            }
        }

        // Open edit profile modal
        function openEditProfile() {
            document.getElementById('editName').value = userProfile?.name || '';
            document.getElementById('editPhone').value = userProfile?.phone || '';
            document.getElementById('editWhatsapp').value = userProfile?.whatsapp || '';
            document.getElementById('editEmail').value = currentUser?.email || '';
            document.getElementById('editProfileModal').style.display = 'flex';
        }

        // Save profile changes
        async function saveProfile() {
            const name = document.getElementById('editName').value;
            const phone = document.getElementById('editPhone').value;
            const whatsapp = document.getElementById('editWhatsapp').value;
            
            if (!name) {
                showToast('Name is required', true);
                return;
            }
            
            try {
                const { error } = await supabaseClient
                    .from('users')
                    .update({ name, phone, whatsapp })
                    .eq('id', currentUser.id);
                
                if (error) throw error;
                
                userProfile.name = name;
                userProfile.phone = phone;
                userProfile.whatsapp = whatsapp;
                
                closeEditModal();
                renderProfile();
                showToast('Profile updated successfully!');
            } catch (error) {
                showToast('Update failed: ' + error.message, true);
            }
        }

        function closeEditModal() {
            document.getElementById('editProfileModal').style.display = 'none';
        }

        function showLoginPrompt() {
            document.getElementById('mainContent').innerHTML = `
                <div style="text-align: center; padding: 60px 20px;">
                    <i class="fas fa-lock" style="font-size: 64px; color: var(--warning);"></i>
                    <h3 style="margin: 16px 0;">Please Login</h3>
                    <p>Login to view your profile</p>
                    <button class="save-btn" onclick="goToLogin()" style="margin-top: 20px;">Login Now</button>
                </div>
            `;
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toastMsg');
            const toastText = document.getElementById('toastText');
            toastText.innerHTML = message;
            toast.style.background = isError ? '#EF4444' : '#1F2937';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // Navigation functions
        function goBack() {
            window.location.href = 'index.html';
        }

        function goToLogin() {
            window.location.href = 'index.html';
        }

        function goToOrders() {
            window.location.href = 'orders.html';
        }

        function goToAddresses() {
            showToast('Coming soon!');
        }

        function goToWallet() {
            showToast('Coming soon!');
        }

        function goToSupport() {
            window.open('https://wa.me/918600252238', '_blank');
        }

        function goToFAQ() {
            showToast('Coming soon!');
        }

        function goToAbout() {
            showToast('Zatpat - Your Local Shopping App\nVersion 2.0.0');
        }

        async function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                await supabaseClient.auth.signOut();
                localStorage.clear();
                window.location.href = 'index.html';
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkUser();
        });

        window.openEditProfile = openEditProfile;
        window.saveProfile = saveProfile;
        window.closeEditModal = closeEditModal;
        window.goBack = goBack;
        window.goToOrders = goToOrders;
        window.goToAddresses = goToAddresses;
        window.goToWallet = goToWallet;
        window.goToSupport = goToSupport;
        window.goToFAQ = goToFAQ;
        window.goToAbout = goToAbout;
        window.handleLogout = handleLogout;
        window.goToLogin = goToLogin;
    </script>
</body>
</html>
