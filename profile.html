<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>मेरी प्रोफाइल - Zymart</title>
    <meta name="theme-color" content="#0B5A31">
    <meta name="description" content="Zymart - अपनी प्रोफाइल देखें और प्रबंधित करें">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://zwajyovemwdqtkecipeb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --brand-green: #0B5A31; --brand-green-light: #0F6E3B; --brand-green-dark: #083D21;
            --brand-orange: #F59E0B; --brand-orange-dark: #E8890A; --brand-orange-light: #FFB020;
            --brand-white: #F5F5F5;
            --neutral-white: #FFFFFF; --neutral-bg: #F9FAFB; --neutral-border: #E5E7EB;
            --neutral-gray: #6B7280; --neutral-dark: #1A1A1A;
            --danger: #EF4444; --danger-bg: #FEF2F2;
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08); --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
            --radius-sm: 10px; --radius-md: 14px; --radius-lg: 18px; --radius-xl: 22px; --radius-full: 9999px;
            --ease-fast: cubic-bezier(0.4,0,0.2,1); --ease-smooth: cubic-bezier(0.45,0,0.15,1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--neutral-bg); color: var(--neutral-dark);
            padding-bottom: 85px; -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased; min-height: 100vh;
        }
        
        @keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .top-bar { background: var(--brand-green); position: fixed; top: 0; left: 0; width: 100%; z-index: 100; padding: 10px 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 16px rgba(11,90,49,0.3); }
        .back-btn { width: 40px; height: 40px; min-width: 40px; background: rgba(255,255,255,0.10); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 15px; outline: none; transition: all 0.15s ease; }
        .back-btn:active { background: rgba(255,255,255,0.22); transform: scale(0.93); }
        .top-title { font-family: 'Poppins', sans-serif; flex: 1; font-size: 16px; font-weight: 700; color: var(--brand-white); }
        
        .main-content { padding-top: 62px; max-width: 600px; margin: 0 auto; }
        
        .profile-header { background: linear-gradient(135deg, var(--brand-green), var(--brand-green-dark)); margin: 12px 14px; padding: 26px 20px; border-radius: var(--radius-xl); color: white; text-align: center; animation: slideUp 0.3s ease; box-shadow: 0 4px 20px rgba(11,90,49,0.3); }
        .avatar { width: 76px; height: 76px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 34px; border: 3px solid rgba(255,255,255,0.25); }
        .profile-name { font-family: 'Poppins', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 2px; }
        .profile-email { font-size: 13px; opacity: 0.85; }
        .profile-phone { font-size: 12px; opacity: 0.7; margin-top: 3px; }
        
        .menu-section { background: var(--neutral-white); margin: 10px 14px; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--neutral-border); box-shadow: var(--shadow-xs); animation: slideUp 0.3s ease; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 15px 16px; cursor: pointer; transition: background 0.12s ease; border-bottom: 1px solid var(--neutral-border); font-size: 13px; font-weight: 500; }
        .menu-item:last-child { border-bottom: none; }
        .menu-item:active { background: #EDF7F1; }
        .icon-circle { width: 38px; height: 38px; min-width: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
        .icon-green { background: #EDF7F1; color: var(--brand-green); }
        .icon-orange { background: #FFF8EB; color: var(--brand-orange); }
        .icon-red { background: var(--danger-bg); color: var(--danger); }
        .icon-blue { background: #EFF6FF; color: #2563EB; }
        .icon-purple { background: #F5F3FF; color: #7C3AED; }
        .menu-text { flex: 1; }
        .menu-label { font-size: 14px; font-weight: 600; }
        .menu-sub { font-size: 11px; color: var(--neutral-gray); }
        .menu-arrow { color: #D1D5DB; font-size: 13px; }
        
        .edit-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(8,61,33,0.7); backdrop-filter: blur(6px); display: none; align-items: flex-end; justify-content: center; z-index: 1000; }
        .edit-modal.show { display: flex; }
        .edit-card { background: white; border-radius: var(--radius-xl) var(--radius-xl) 0 0; width: 100%; max-width: 500px; padding: 22px; animation: slideUp 0.3s ease; max-height: 80vh; overflow-y: auto; }
        .edit-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--neutral-border); }
        .edit-header h3 { font-family: 'Poppins', sans-serif; font-size: 17px; font-weight: 700; }
        .edit-close { width: 36px; height: 36px; min-width: 36px; background: var(--neutral-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; font-size: 14px; color: var(--neutral-gray); transition: all 0.15s ease; }
        .edit-close:active { background: var(--neutral-border); }
        .form-group { margin-bottom: 14px; }
        .form-label { font-size: 12px; font-weight: 600; color: var(--neutral-gray); margin-bottom: 5px; display: block; }
        .form-control { width: 100%; padding: 12px 14px; border: 1.5px solid var(--neutral-border); border-radius: var(--radius-sm); font-size: 14px; font-family: 'Inter', sans-serif; outline: none; transition: all 0.15s ease; }
        .form-control:focus { border-color: var(--brand-orange); box-shadow: 0 0 0 3px rgba(245,158,11,0.08); }
        .save-btn { width: 100%; padding: 13px; background: var(--brand-orange); color: white; border: none; border-radius: var(--radius-full); font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; font-family: 'Inter', sans-serif; transition: all 0.15s ease; box-shadow: 0 4px 14px rgba(245,158,11,0.22); }
        .save-btn:active { background: var(--brand-orange-dark); transform: scale(0.97); }
        .save-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .login-prompt { text-align: center; padding: 60px 20px; animation: slideUp 0.4s ease; }
        .login-prompt i { font-size: 52px; color: #D1D5DB; margin-bottom: 14px; display: block; }
        .login-prompt h3 { font-family: 'Poppins', sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 6px; }
        .login-prompt p { color: var(--neutral-gray); font-size: 13px; margin-bottom: 14px; }
        .login-prompt .btn-orange { background: var(--brand-orange); color: white; border: none; padding: 12px 28px; border-radius: var(--radius-full); font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; box-shadow: 0 4px 14px rgba(245,158,11,0.25); }
        .login-prompt .btn-orange:active { background: var(--brand-orange-dark); transform: scale(0.96); }
        
        .loading-state { text-align: center; padding: 50px; }
        .spinner { width: 34px; height: 34px; border: 2.5px solid var(--neutral-border); border-top-color: var(--brand-orange); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto; }
        
        .bottom-nav { background: white; position: fixed; bottom: 0; left: 0; width: 100%; display: flex; justify-content: space-around; padding: 5px 10px 10px; box-shadow: 0 -4px 16px rgba(0,0,0,0.03); z-index: 100; border-top: 1px solid var(--neutral-border); }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 9px; font-weight: 500; color: var(--neutral-gray); cursor: pointer; padding: 3px 10px; border-radius: var(--radius-full); border: none; background: transparent; outline: none; transition: all 0.15s ease; font-family: 'Inter', sans-serif; }
        .nav-item:active { background: #EDF7F1; }
        .nav-item.active { color: var(--brand-green); font-weight: 600; }
        .nav-item i { font-size: 18px; margin-bottom: 1px; }
        
        .toast { position: fixed; bottom: 95px; left: 50%; transform: translateX(-50%); background: var(--neutral-dark); color: white; padding: 10px 20px; border-radius: var(--radius-full); font-size: 12px; z-index: 200; opacity: 0; visibility: hidden; white-space: nowrap; box-shadow: var(--shadow-lg); transition: all 0.3s ease; }
        .toast.show { opacity: 1; visibility: visible; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="top-bar">
    <button class="back-btn" onclick="goBack()" aria-label="वापस"><i class="fas fa-arrow-left"></i></button>
    <span class="top-title">मेरी प्रोफाइल</span>
</div>

<div class="main-content" id="mainContent">
    <div class="loading-state"><div class="spinner"></div></div>
</div>

<div class="edit-modal" id="editModal">
    <div class="edit-card">
        <div class="edit-header">
            <h3>प्रोफाइल एडिट करें</h3>
            <button class="edit-close" onclick="closeEditModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="form-group">
            <label class="form-label">पूरा नाम</label>
            <input type="text" id="editName" class="form-control" placeholder="अपना नाम लिखें">
        </div>
        <div class="form-group">
            <label class="form-label">फ़ोन नंबर</label>
            <input type="tel" id="editPhone" class="form-control" placeholder="10 अंकों का मोबाइल" maxlength="10">
        </div>
        <div class="form-group">
            <label class="form-label">ईमेल (बदला नहीं जा सकता)</label>
            <input type="email" id="editEmail" class="form-control" readonly style="background:#F3F5F4;">
        </div>
        <button class="save-btn" id="saveBtn" onclick="saveProfile()">सेव करें</button>
        <button style="width:100%;padding:12px;background:transparent;border:1px solid var(--neutral-border);border-radius:var(--radius-full);font-size:13px;font-weight:600;cursor:pointer;margin-top:8px;color:var(--neutral-gray);font-family:'Inter',sans-serif;" onclick="closeEditModal()">रद्द करें</button>
    </div>
</div>

<nav class="bottom-nav">
    <button class="nav-item" onclick="fastNavigate('index.html')"><i class="fas fa-home"></i><span>होम</span></button>
    <button class="nav-item" onclick="fastNavigate('products.html')"><i class="fas fa-box"></i><span>खोजें</span></button>
    <button class="nav-item" onclick="fastNavigate('cart.html')"><i class="fas fa-shopping-cart"></i><span>कार्ट</span></button>
    <button class="nav-item active"><i class="fas fa-user"></i><span>प्रोफाइल</span></button>
    <button class="nav-item" onclick="fastNavigate('orders.html')"><i class="fas fa-receipt"></i><span>ऑर्डर</span></button>
</nav>

<div class="toast" id="toastMsg"></div>

<script>
(function() {
    'use strict';
    
    window.addEventListener('error', function(e) { try { console.error('[Zymart Crash]', e.message); } catch(ex) {} });
    window.addEventListener('unhandledrejection', function(e) { try { console.error('[Zymart Promise Crash]', e.reason); } catch(ex) {} e.preventDefault(); });
    function safeJSONParse(s, f) { try { return s ? JSON.parse(s) : f; } catch(e) { return f; } }
    function safeGetElement(id) { try { return document.getElementById(id); } catch(e) { return null; } }
    function escapeHTML(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
    
    var sb = null;
    try { sb = supabase.createClient('https://zwajyovemwdqtkecipeb.supabase.co', 'sb_publishable_D7j1zU2VHCIl2Y56RFOmHg_HERx4Rz1'); }
    catch(e) { sb = { auth: { getSession: function() { return Promise.resolve({ data: { session: null } }); } } }; }
    
    var currentUser = null, userProfile = null;
    
    var Cache = { set:function(k,d,t){try{localStorage.setItem('zm_'+k,JSON.stringify({d:d,e:Date.now()+(t||3600000)}));}catch(e){}}, get:function(k){try{var c=localStorage.getItem('zm_'+k);if(!c)return null;var p=JSON.parse(c);return Date.now()>p.e?(localStorage.removeItem('zm_'+k),null):p.d;}catch(e){return null;}} };
    
    async function safeFetch(fn, r) { r=r||2; for(var i=0;i<r;i++){try{var res=await fn();if(res&&res.error)throw new Error(res.error.message);return res;}catch(e){if(i===r-1)throw e;await new Promise(function(x){setTimeout(x,500);});}} }
    
    window.addEventListener('online', function() { showToast('✅ इंटरनेट बहाल!'); });
    window.addEventListener('offline', function() { showToast('⚠️ ऑफलाइन', true); });
    
    function showToast(m, e) { try { var t = safeGetElement('toastMsg'); if (!t) return; t.textContent = m; t.style.background = e ? '#EF4444' : '#1A1A1A'; t.classList.add('show'); clearTimeout(t._timer); t._timer = setTimeout(function() { t.classList.remove('show'); }, 2500); } catch(ex) {} }
    function goBack() { try { if (document.referrer && document.referrer.indexOf(window.location.host) > -1) { window.history.back(); return; } } catch(e) {} window.location.href = 'index.html'; }
    window.fastNavigate = function(url) { window.location.href = url; };
    
    async function checkUser() {
        try { var res = await sb.auth.getSession(); if (res && res.data && res.data.session) { currentUser = res.data.session.user; var prof = await safeFetch(function() { return sb.from('users').select('*').eq('id', currentUser.id).single(); }); userProfile = prof.data || {}; return true; } } catch(e) {}
        return false;
    }
    
    async function loadProfile() {
        var container = safeGetElement('mainContent');
        if (!container) return;
        container.innerHTML = '<div class="loading-state"><div class="spinner"></div></div>';
        
        if (!(await checkUser())) {
            container.innerHTML = '<div class="login-prompt"><i class="fas fa-user-circle"></i><h3>लॉगिन आवश्यक</h3><p>प्रोफाइल देखने के लिए लॉगिन करें</p><button class="btn-orange" onclick="(function(){try{localStorage.setItem(\'zatpat_redirect_after_login\',\'profile.html\');}catch(e){}window.location.href=\'index.html#login\';})()">🔐 लॉगिन / रजिस्टर</button></div>';
            return;
        }
        
        var name = userProfile.name || (currentUser.email ? currentUser.email.split('@')[0] : 'यूजर');
        var email = currentUser.email || '';
        var phone = userProfile.phone || 'नहीं जोड़ा';
        
        container.innerHTML = 
        '<div class="profile-header"><div class="avatar"><i class="fas fa-user"></i></div><div class="profile-name">'+escapeHTML(name)+'</div><div class="profile-email">'+escapeHTML(email)+'</div><div class="profile-phone">📞 '+escapeHTML(phone)+'</div></div>' +
        
        '<div class="menu-section">' +
        '<div class="menu-item" onclick="showEditModal()"><div class="icon-circle icon-green"><i class="fas fa-user-edit"></i></div><div class="menu-text"><div class="menu-label">प्रोफाइल एडिट करें</div><div class="menu-sub">नाम और फ़ोन अपडेट करें</div></div><i class="fas fa-chevron-right menu-arrow"></i></div>' +
        '<div class="menu-item" onclick="fastNavigate(\'orders.html\')"><div class="icon-circle icon-orange"><i class="fas fa-receipt"></i></div><div class="menu-text"><div class="menu-label">मेरे ऑर्डर</div><div class="menu-sub">ऑर्डर इतिहास देखें</div></div><i class="fas fa-chevron-right menu-arrow"></i></div>' +
        '<div class="menu-item" onclick="fastNavigate(\'wishlist.html\')"><div class="icon-circle icon-red"><i class="fas fa-heart"></i></div><div class="menu-text"><div class="menu-label">मेरी विशलिस्ट</div><div class="menu-sub">सेव किए गए आइटम</div></div><i class="fas fa-chevron-right menu-arrow"></i></div>' +
        '<div class="menu-item" onclick="fastNavigate(\'cart.html\')"><div class="icon-circle icon-blue"><i class="fas fa-shopping-cart"></i></div><div class="menu-text"><div class="menu-label">मेरी कार्ट</div><div class="menu-sub">कार्ट आइटम देखें</div></div><i class="fas fa-chevron-right menu-arrow"></i></div>' +
        '</div>' +
        
        '<div class="menu-section">' +
        '<div class="menu-item" onclick="window.open(\'https://wa.me/918600252238\',\'_blank\')"><div class="icon-circle icon-green"><i class="fab fa-whatsapp"></i></div><div class="menu-text"><div class="menu-label">सहायता और समर्थन</div><div class="menu-sub">हमसे चैट करें</div></div><i class="fas fa-chevron-right menu-arrow"></i></div>' +
        '<div class="menu-item" onclick="fastNavigate(\'privacy-policy.html\')"><div class="icon-circle icon-purple"><i class="fas fa-shield-alt"></i></div><div class="menu-text"><div class="menu-label">गोपनीयता नीति</div></div><i class="fas fa-chevron-right menu-arrow"></i></div>' +
        '<div class="menu-item" onclick="fastNavigate(\'terms.html\')"><div class="icon-circle icon-blue"><i class="fas fa-file-contract"></i></div><div class="menu-text"><div class="menu-label">नियम और शर्तें</div></div><i class="fas fa-chevron-right menu-arrow"></i></div>' +
        '<div class="menu-item" onclick="fastNavigate(\'delete-account.html\')"><div class="icon-circle icon-red"><i class="fas fa-trash-alt"></i></div><div class="menu-text"><div class="menu-label">अकाउंट हटाएं</div><div class="menu-sub">अपना डेटा हटाएं</div></div><i class="fas fa-chevron-right menu-arrow"></i></div>' +
        '</div>' +
        
        '<div class="menu-section">' +
        '<div class="menu-item" onclick="handleLogout()"><div class="icon-circle icon-red"><i class="fas fa-sign-out-alt"></i></div><div class="menu-text"><div class="menu-label" style="color:#EF4444;">लॉगआउट</div></div><i class="fas fa-chevron-right menu-arrow"></i></div>' +
        '</div>';
    }
    
    window.showEditModal = function() {
        var mn = safeGetElement('editName'), mp = safeGetElement('editPhone'), me = safeGetElement('editEmail');
        if (mn) mn.value = userProfile.name || '';
        if (mp) mp.value = userProfile.phone || '';
        if (me) me.value = currentUser ? currentUser.email || '' : '';
        var em = safeGetElement('editModal'); if (em) em.classList.add('show');
    };
    
    window.closeEditModal = function() { var em = safeGetElement('editModal'); if (em) em.classList.remove('show'); };
    
    window.saveProfile = async function() {
        var mn = safeGetElement('editName'), mp = safeGetElement('editPhone'), btn = safeGetElement('saveBtn');
        var name = mn ? mn.value.trim() : '', phone = mp ? mp.value.trim() : '';
        
        if (!name) { showToast('कृपया नाम दर्ज करें', true); return; }
        if (phone && !/^\d{10}$/.test(phone)) { showToast('सही 10 अंक फ़ोन', true); return; }
        
        if (btn) { btn.disabled = true; btn.textContent = 'सेव हो रहा...'; }
        
        try {
            await safeFetch(function() { return sb.from('users').upsert({ id: currentUser.id, name: name, phone: phone, email: currentUser.email, role: userProfile.role || 3 }); });
            userProfile.name = name; userProfile.phone = phone;
            Cache.set('profile_' + currentUser.id, userProfile, 3600000);
            showToast('✅ प्रोफाइल अपडेट!'); closeEditModal(); loadProfile();
        } catch(e) { showToast('❌ अपडेट विफल', true); if (btn) { btn.disabled = false; btn.textContent = 'सेव करें'; } }
    };
    
    window.handleLogout = async function() {
        if (confirm('क्या आप लॉगआउट करना चाहते हैं?')) {
            await sb.auth.signOut();
            try { localStorage.removeItem('zatpat_cart'); localStorage.removeItem('zatpat_wishlist'); localStorage.removeItem('zatpat_redirect_after_login'); } catch(e) {}
            showToast('👋 लॉगआउट सफल!');
            setTimeout(function() { window.location.href = 'index.html'; }, 500);
        }
    };
    
    document.addEventListener('DOMContentLoaded', loadProfile);
    
    sb.auth.onAuthStateChange(function(event, session) {
        if (event === 'SIGNED_IN' && session) { currentUser = session.user; loadProfile(); }
        if (event === 'SIGNED_OUT') { currentUser = null; userProfile = null; loadProfile(); }
    });
    
    window.goBack = goBack;
})();
</script>
</body>
</html>
